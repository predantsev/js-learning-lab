# Capstone step of unit JS-17 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-17-13-capstone-quality from this file.
# The step is checked in the platform and continues from the JS-16 reference. Its checks measure
# work by counting reads, never by time.
unit: JS-17
mode: in-platform
entry: index.html
title:
  uk: "Якість: швидкість, рефакторинг, доступність"
  en: "Quality: speed, refactoring, accessibility"
intro:
  uk: |
    Останній крок етапу JavaScript — перевірка якості власного застосунку трьома способами з цього розділу.

    1. **Виміряй на великих даних.** Новий модуль `data/synthetic.js` будує з фікстур тисячі синтетичних записів, однакових щоразу — без випадкових чисел, тож [[performance-baseline|точку відліку]] можна виміряти знову.
    2. **Заміни квадратичну роботу індексом.** Одне перетворення проєкту в повільній версії для кожного запису ще раз проходить увесь список — робота росте як квадрат довжини ([[big-o|O(n²)]]). Ти переписуєш його на `Map` чи `Set` за один прохід. Це [[refactoring|рефакторинг]]: поведінка не змінюється, і це доводять [[characterization-test|характеризаційні тести]] — вони порівнюють нову версію зі старою на тих самих даних.
    3. **Проведи [[accessibility-audit|аудит доступності]]** головної дії: результат оголошується в області `role="status"` ([[live-region|живій області]]), а поле з помилкою позначено `aria-invalid` і пов’язано з повідомленням через `aria-describedby`.

    Перевірки міряють роботу **кількістю прочитань** полів (їх рахує getter чи `Proxy`), а не часом: кількість не залежить від швидкості комп’ютера. Час ти міряєш сам — профілем у DevTools до й після зміни, як у уроках розділу.

    > [!note]
    > Якщо ти вже експортував проєкт (контрольна точка CP-JS), твої локальні файли — головні, і платформа їх не змінює. Тоді спершу зроби commit у своїй теці, завантаж еталон цього кроку з екрана проєкту й перенеси зміни вручну, звіряючи файли, як у уроках розділу JS-10.
  en: |
    The last step of the JavaScript stage checks the quality of your own app in three ways from this unit.

    1. **Measure on large data.** The new module `data/synthetic.js` builds thousands of synthetic records from the fixtures, the same every time — no random numbers, so a [[performance-baseline]] can be measured again.
    2. **Replace quadratic work with an index.** In its slow version one transform of the project goes through the whole list again for every record — the work grows as the square of the length ([[big-o|O(n²)]]). You rewrite it with a `Map` or a `Set` in one pass. This is [[refactoring]]: the behaviour does not change, and [[characterization-test|characterization tests]] prove it — they compare the new version with the old one on the same data.
    3. **Run an [[accessibility-audit]]** of the main action: its result is announced in a `role="status"` region (a [[live-region]]), and a field with an error is marked `aria-invalid` and linked to its message through `aria-describedby`.

    The checks measure work by **the number of reads** of fields (a getter or a `Proxy` counts them), not by time: a count does not depend on the speed of the computer. You measure time yourself — with a DevTools profile before and after the change, as in this unit's lessons.

    > [!note]
    > If you have already exported the project (checkpoint CP-JS), your local files are the main ones, and the platform does not change them. Then first make a commit in your folder, download this step's reference from the project screen and carry the changes over by hand, comparing the files, as in the lessons of unit JS-10.
purpose:
  uk: "Це крок твого проєкту: виміряне покращення, рефакторинг під характеризаційними тестами й аудит доступності з цього розділу ти застосовуєш до власного застосунку. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's measured improvement, refactoring under characterization tests and accessibility audit to your own app. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Будувати детерміновані синтетичні дані з фікстур і міряти роботу перетворення кількістю прочитань."
    en: "Build deterministic synthetic data from the fixtures and measure the work of a transform by the number of reads."
  - uk: "Замінити квадратичне перетворення проєкту індексом на `Map` чи `Set`, довівши незмінну поведінку характеризаційними тестами."
    en: "Replace a quadratic transform of the project with an index on a `Map` or a `Set`, proving the unchanged behaviour with characterization tests."
  - uk: "Оголошувати результат головної дії в живій області й позначати поле з помилкою `aria-invalid` з пов’язаним повідомленням."
    en: "Announce the result of the main action in a live region and mark a field with an error `aria-invalid` with a linked message."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
