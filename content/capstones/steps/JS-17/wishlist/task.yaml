feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там помилка завантаження `data/synthetic.js` чи `tests/performance.test.js`, то файл лежить не в тій теці або має іншу назву."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. If it shows a loading error for `data/synthetic.js` or `tests/performance.test.js`, the file is in another folder or has another name."
  - when: { test: "the synthetic generator makes 20,000 valid records, the same every time" }
    message:
      uk: "Ця перевірка викликає генератор з `data/synthetic.js` для 20 000 записів і чекає 20 000 різних `id`, жодного запису, який відхиляє `isUsableItem`, і однакові записи від двох однакових викликів. `Math.random` і поточна дата дають щоразу інші дані."
      en: "This check calls the generator of `data/synthetic.js` for 20,000 records and expects 20,000 different `id`s, no record that `isUsableItem` refuses, and the same records from two identical calls. `Math.random` and the current date give different data every time."
  - when: { test: "duplicateNames reads each name only a few times" }
    message:
      uk: "Ця перевірка рахує прочитання поля `name` (через getter) під час `duplicateNames` на 2 000 синтетичних бажань і чекає не більше 6 000 — і ті самі ключі, що дає підрахунок перевірки. Повільна версія з `some` читає назви мільйони разів."
      en: "This check counts the reads of the field `name` (through a getter) during `duplicateNames` of 2,000 synthetic wishes and expects at most 6,000 — and the same keys as the check’s own count. The slow version with `some` reads the names millions of times."
  - when: { test: "duplicateNames finds names that repeat, whatever the case and the Unicode form" }
    message:
      uk: "Ця перевірка чекає від `duplicateNames` `Set` з ключами `\"чайник\"` (назви `\"Чайник\"` і `\" ЧАИ\\u0306НИК \"`) і назвою `w-02` малими літерами, а для шести початкових бажань — порожній `Set`."
      en: "This check expects `duplicateNames` to give a `Set` with the keys `\"чайник\"` (the names `\"Чайник\"` and `\" ЧАИ\\u0306НИК \"`) and the name of `w-02` in lower case, and an empty `Set` for the six starting wishes."
  - when: { test: "a card says when another wish has the same name" }
    message:
      uk: "Ця перевірка зберігає шість початкових бажань і `w-07` з назвою `w-02` великими літерами й пробілами довкола, перезапускає сторінку й чекає «%%duplicateMark%%» у картці `w-02`, але не в картці `w-01`."
      en: "This check saves the six starting wishes and `w-07` with the name of `w-02` in capitals with spaces around it, restarts the page and expects “%%duplicateMark%%” in the card `w-02`, but not in the card `w-01`."
  - when: { test: "the main action is announced in a status region" }
    message:
      uk: "Ця перевірка натискає «%%markAcquiredLabel%%» у картці `w-01` і чекає в області `role=\"status\"` (чи `aria-live`) рівно «%%announceAcquired%%» з назвою `w-01` замість `{name}`, а після другого кліку — «%%announceWanted%%»."
      en: "This check presses “%%markAcquiredLabel%%” in the card `w-01` and expects exactly “%%announceAcquired%%” with the name of `w-01` in place of `{name}` in a `role=\"status\"` (or `aria-live`) region, and “%%announceWanted%%” after a second click."
  - when: { test: "a field with an error is marked invalid and linked to its message" }
    message:
      uk: "Ця перевірка надсилає форму з порожньою назвою й чекає в поля «%%nameLabel%%» `aria-invalid=\"true\"` і «%%requiredMessage%%» у тексті елемента, на який указує його `aria-describedby`; після правильної чернетки `aria-invalid` має бути `\"false\"` або зникнути. Так само вона чекає `aria-invalid=\"true\"` у поля ціни з помилкою й не `\"true\"` після правильної чернетки."
      en: "This check submits the form with an empty name and expects `aria-invalid=\"true\"` on the field “%%nameLabel%%” and “%%requiredMessage%%” in the text of the element its `aria-describedby` names; after a valid draft `aria-invalid` must be `\"false\"` or gone. Likewise it expects `aria-invalid=\"true\"` on the price field with an error and not `\"true\"` after a valid draft."
  - when: { test: "your performance tests pass with a correct domain module" }
    message:
      uk: "Ця перевірка запускає `tests/performance.test.js` з `domain/wishes.ts` від курсу (з прибраними типами) і раннером курсу та чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку. Якщо там «there is no file tests/performance.test.js», то файл лежить не в теці `tests/` або має іншу назву."
      en: "This check runs `tests/performance.test.js` with the course's `domain/wishes.ts` (with the types removed) and the course runner, and expects at least one test and none that fails. The message below names the failed test or the error. If it says “there is no file tests/performance.test.js”, the file is not in the folder `tests/` or has another name."
  - when: { test: "your tests catch duplicates compared without the search key" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.ts`. Потім вона підставляє версію, де `duplicateNames` порівнює назви як є, а не їхні ключі пошуку, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у даних якого дві назви відрізняються лише регістром чи формою Unicode."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.ts`. Then it puts in a version where `duplicateNames` compares the names as they are, not their search keys, and expects at least one of your tests to fail. A test whose data has two names that differ only in case or Unicode form notices this defect."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
