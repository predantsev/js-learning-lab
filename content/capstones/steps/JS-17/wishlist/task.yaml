# Wishlist variant of step JS-17. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  duplicateMark: { uk: "Така сама назва є ще в іншого бажання", en: "Another wish has the same name" }
  announceAcquired: { uk: "Позначено отриманим: {name}", en: "Marked as acquired: {name}" }
  announceWanted: { uk: "Повернуто в бажані: {name}", en: "Back to wanted: {name}" }
instructions:
  uk: |
    **1. Синтетичні дані.** Новий модуль `data/synthetic.js` експортує `makeSyntheticWishes(count)` — `count` бажань з `id` `"s-1"`, `"s-2"`, …: назва — назва однієї із шести початкових і номер `index % 500` (тож у 1000 бажаннях кожна назва двічі), ціна — ціле число або `null`, правильні `acquired` і `category`. Жодних `Math.random`: той самий виклик завжди дає ті самі записи, і кожен проходить `isUsableItem`.

    **2. Повільна версія як еталон.** Ось повільна версія перетворення, яке ти пришвидшиш:

    ```js
    function slowDuplicateNames(list) {
      const repeated = new Set();
      for (const item of list) {
        const key = searchKey(item.name);
        if (list.some((other) => other !== item && searchKey(other.name) === key)) {
          repeated.add(key);
        }
      }
      return repeated;
    }
    ```

    Створи `tests/performance.test.js` (і імпортуй його в `run-tests.js`): скопіюй туди повільну версію й напиши [[characterization-test|характеризаційні тести]] — нова функція дає те саме, що повільна, на кількох сотнях синтетичних записів і на маленьких прикладах, написаних вручну. Ці тести мають пройти й до зміни, і після неї.

    **3. Індекс замість повторних проходів.** `duplicateNames(list)` у `domain/wishes.ts` повертає `Set` ключів пошуку (`searchKey(name)`) назв, які мають два чи більше бажань. Повільна версія для кожного бажання ще раз проходить увесь список. Напиши швидку за один прохід із двома `Set`: ключі, що вже траплялися, і ключі, що трапилися вдруге. Підпис — той самий, що в повільної версії з тестів: той самий параметр і той самий тип результату. Зручно спершу вставити в модуль повільну версію під цією назвою, переконатися, що характеризаційні тести проходять, а тоді переписати її. Виміряй час у DevTools (вкладка Performance) до й після зміни на тисячах синтетичних записів — як у уроках розділу.

    **4. Сторінка.** `render()` один раз рахує `duplicateNames(current)`, а картка, ключ назви якої є в цьому `Set`, показує «%%duplicateMark%%».

    **5. Аудит доступності.**

    - Оголошення: після кліку «%%markAcquiredLabel%%» / «%%markWantedLabel%%» напиши в `#status` (у нього вже є `role="status"`) «%%announceAcquired%%» чи «%%announceWanted%%», підставивши назву замість `{name}`. Додай у `ui/page.js` маленьку функцію `announce(text)`, що пише текст у `#status`.
    - Поля з помилкою: `showErrors` ставить полям `#item-name` і `#item-price` `aria-invalid="true"`, коли в них помилка, і `"false"`, коли немає. Повідомлення під полем уже пов’язане з ним через `aria-describedby`, тож скринрідер читає його, щойно поле отримує фокус.

    **Як перевірятиметься.** Роботу перевірки міряють **кількістю прочитань**, а не часом: прочитань поля `name` на 2 000 синтетичних бажань — не більше 6 000. Прочитання рахує getter чи `Proxy`, підставлений замість поля, а результат порівнюється з власним підрахунком перевірок. Ще перевірки викликають генератор, дивляться на сторінку, на області `role="status"` після головної дії й на `aria-invalid` і `aria-describedby` поля назви після порожньої чернетки. Твої тести запускаються з `domain/wishes.ts` від курсу (з прибраними типами) — усі мають пройти — і з версією, що порівнює назви як є, а не їхні ключі пошуку: з нею хоча б один тест має впасти.
  en: |
    **1. Synthetic data.** The new module `data/synthetic.js` exports `makeSyntheticWishes(count)` — `count` wishes with the `id`s `"s-1"`, `"s-2"`, …: the name is the name of one of the six starting wishes and the number `index % 500` (so in 1000 wishes every name is there twice), the price a whole number or `null`, valid `acquired` and `category`. No `Math.random`: the same call always gives the same records, and every one passes `isUsableItem`.

    **2. The slow version as the reference.** Here is the slow version of the transform you will speed up:

    ```js
    function slowDuplicateNames(list) {
      const repeated = new Set();
      for (const item of list) {
        const key = searchKey(item.name);
        if (list.some((other) => other !== item && searchKey(other.name) === key)) {
          repeated.add(key);
        }
      }
      return repeated;
    }
    ```

    Create `tests/performance.test.js` (and import it in `run-tests.js`): copy the slow version into it and write [[characterization-test|characterization tests]] — the new function gives the same as the slow one on a few hundred synthetic records and on small examples written by hand. These tests must pass both before the change and after it.

    **3. An index instead of repeated passes.** `duplicateNames(list)` in `domain/wishes.ts` returns a `Set` of the search keys (`searchKey(name)`) of names that two or more wishes have. The slow version goes through the whole list again for every wish. Write a fast one in one pass with two `Set`s: the keys seen so far and the keys seen a second time. The signature is the same as that of the slow version in the tests: the same parameter and the same type of result. It helps to put the slow version into the module under this name first, see the characterization tests pass, and then rewrite it. Measure the time in DevTools (the Performance tab) before and after the change on thousands of synthetic records — as in this unit's lessons.

    **4. The page.** `render()` computes `duplicateNames(current)` once, and a card whose name key is in this `Set` shows “%%duplicateMark%%”.

    **5. Accessibility audit.**

    - Announcement: after a click on “%%markAcquiredLabel%%” / “%%markWantedLabel%%” write “%%announceAcquired%%” or “%%announceWanted%%” into `#status` (it already has `role="status"`), with the name in place of `{name}`. Add a small function `announce(text)` to `ui/page.js` that writes the text into `#status`.
    - Fields with an error: `showErrors` gives the fields `#item-name` and `#item-price` `aria-invalid="true"` when they have an error and `"false"` when they do not. The message under a field is already linked to it through `aria-describedby`, so a screen reader reads it as soon as the field gets focus.

    **How it is checked.** The checks measure work by **the number of reads**, not by time: reads of the field `name` for 2,000 synthetic wishes — at most 6,000. A getter or a `Proxy` put in place of the field counts the reads, and the result is compared with the checks' own count. The checks also call the generator, look at the page, at the `role="status"` regions after the main action and at `aria-invalid` and `aria-describedby` of the name field after an empty draft. Your tests run with the course's `domain/wishes.ts` (with the types removed) — all must pass — and with a version that compares the names as they are, not their search keys: with it, at least one test must fail.
nudge:
  uk: "Повільна версія повторює прохід по списку для кожного запису чи дня. Швидка проходить один раз і щоразу питає `Map` чи `Set` — `get`, `has`, `set` не переглядають усіх записів. Характеризаційний тест пиши ще до зміни: тоді він доводить, що поведінка лишилася тією самою."
  en: "The slow version repeats the pass over the list for every record or day. The fast one goes through once and asks a `Map` or a `Set` each time — `get`, `has` and `set` do not look through all the records. Write the characterization test before the change: then it proves that the behaviour stayed the same."
