<!doctype html>
<html lang="%%htmlLang%%">
<head>
  <meta charset="utf-8">
  <title>%%projectTitle%%</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>%%projectTitle%%</h1>
    <p class="pitch">%%pitch%%</p>
    <img src="images/wish.svg" alt="%%imageAlt%%">

    <form id="item-form" novalidate>
      <h2>%%formTitle%%</h2>
      <div class="field">
        <label for="item-name">%%nameLabel%%</label>
        <input id="item-name" name="name" aria-describedby="item-name-error">
        <p id="item-name-error" class="error"></p>
      </div>
      <div class="field">
        <label for="item-price">%%valueLabel%%</label>
        <input id="item-price" name="price" type="number" min="0" aria-describedby="item-price-error">
        <p id="item-price-error" class="error"></p>
      </div>
      <div class="field">
        <label for="item-category">%%categoryFieldLabel%%</label>
        <input id="item-category" name="category" maxlength="30" list="category-options">
        <datalist id="category-options"></datalist>
      </div>
      <div class="field field-check">
        <input id="item-acquired" name="acquired" type="checkbox">
        <label for="item-acquired">%%acquiredFieldLabel%%</label>
      </div>
      <button id="item-save" type="submit">%%saveLabel%%</button>
    </form>

    <p id="status" role="status"></p>
    <p id="load-message" role="status"></p>
    <button id="retry-load" type="button" hidden>%%retryLoadLabel%%</button>
    <p id="summary"></p>
    <h2 id="list-title" tabindex="-1">%%listTitle%%</h2>
    <div class="field">
      <label for="search">%%searchLabel%%</label>
      <input id="search" type="search">
    </div>
    <div class="field">
      <label for="list-filter">%%filterLabel%%</label>
      <select id="list-filter">
        <option value="all">%%filterAll%%</option>
        <option value="wanted">%%filterWanted%%</option>
        <option value="acquired">%%filterAcquired%%</option>
      </select>
    </div>
    <ul id="items" class="cards"></ul>
    <button id="show-more" type="button" hidden>%%moreLabel%%</button>
    <p id="empty-message" hidden>%%emptyMessage%%</p>
  </main>
  <script type="module" src="app.js"></script>
  <!-- run-tests.js runs the tests in tests/ and prints one line per test in the console. -->
  <script type="module" src="run-tests.js"></script>
</body>
</html>
