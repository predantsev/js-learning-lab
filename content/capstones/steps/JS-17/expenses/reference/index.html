<!doctype html>
<html lang="%%htmlLang%%">
<head>
  <meta charset="utf-8">
  <title>%%projectTitle%%</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>%%projectTitle%%</h1>
    <p class="pitch">%%pitch%%</p>
    <img src="images/expense.svg" alt="%%imageAlt%%">

    <form id="expense-form" novalidate>
      <h2>%%formTitle%%</h2>
      <div class="field">
        <label for="expense-label">%%nameLabel%%</label>
        <input id="expense-label" name="label" aria-describedby="expense-label-error">
        <p id="expense-label-error" class="error"></p>
      </div>
      <div class="field">
        <label for="expense-amount">%%valueLabel%%</label>
        <input id="expense-amount" name="amount" inputmode="decimal" aria-describedby="expense-amount-error">
        <p id="expense-amount-error" class="error"></p>
      </div>
      <div class="field">
        <label for="expense-date">%%dateFieldLabel%%</label>
        <input id="expense-date" name="date" type="date" aria-describedby="expense-date-error">
        <p id="expense-date-error" class="error"></p>
      </div>
      <div class="field">
        <label for="expense-category">%%categoryFieldLabel%%</label>
        <select id="expense-category" name="category" aria-describedby="expense-category-error">
          <option value="">%%chooseCategory%%</option>
          <option value="food">%%categoryFood%%</option>
          <option value="transport">%%categoryTransport%%</option>
          <option value="home">%%categoryHome%%</option>
          <option value="fun">%%categoryFun%%</option>
        </select>
        <p id="expense-category-error" class="error"></p>
      </div>
      <button id="expense-save" type="submit">%%saveLabel%%</button>
    </form>

    <p id="status" role="status"></p>
    <p id="load-message" role="status"></p>
    <button id="retry-load" type="button" hidden>%%retryLoadLabel%%</button>
    <p id="summary"></p>
    <p id="by-day"></p>
    <h2 id="list-title" tabindex="-1">%%listTitle%%</h2>
    <div class="field">
      <label for="search">%%searchLabel%%</label>
      <input id="search" type="search">
    </div>
    <div class="field">
      <label for="list-filter">%%filterLabel%%</label>
      <select id="list-filter">
        <option value="all">%%filterAll%%</option>
        <option value="food">%%categoryFood%%</option>
        <option value="transport">%%categoryTransport%%</option>
        <option value="home">%%categoryHome%%</option>
        <option value="fun">%%categoryFun%%</option>
      </select>
    </div>
    <ul id="expenses" class="cards"></ul>
    <button id="show-more" type="button" hidden>%%moreLabel%%</button>
    <p id="empty-message" hidden>%%emptyMessage%%</p>
  </main>
  <script type="module" src="app.js"></script>
  <!-- run-tests.js runs the tests in tests/ and prints one line per test in the console. -->
  <script type="module" src="run-tests.js"></script>
</body>
</html>
