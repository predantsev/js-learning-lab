# Expenses variant of step JS-17. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  byDayLabel: { uk: "За днями", en: "By day" }
  announceDeleted: { uk: "Видалено: {name}", en: "Deleted: {name}" }
instructions:
  uk: |
    **1. Синтетичні дані.** Новий модуль `data/synthetic.js` експортує `makeSyntheticExpenses(count)` — `count` витрат з `id` `"s-1"`, `"s-2"`, …: назва однієї з шести початкових і номер, ціла сума більша за нуль, категорії по черзі й дата — один із 365 днів від `2025-01-01`, яку дає `dayAfterStart(offset)` — `new Date(Date.UTC(2025, 0, 1 + offset)).toISOString().slice(0, 10)` (у UTC кожна доба має 24 години, часових поясів тут немає). Жодних `Math.random`: той самий виклик завжди дає ті самі записи, і кожен проходить `isUsableExpense`.

    **2. Повільна версія як еталон.** Ось повільна версія перетворення, яке ти пришвидшиш:

    ```js
    function slowDailyTotals(list) {
      const days = [...new Set(list.map((expense) => expense.date))].sort();
      return new Map(days.map((day) => [day, list.filter((expense) => expense.date === day).reduce((sum, expense) => sum + expense.amountMinor, 0)]));
    }
    ```

    Створи `tests/performance.test.js` (і імпортуй його в `run-tests.js`): скопіюй туди повільну версію й напиши [[characterization-test|характеризаційні тести]] — нова функція дає те саме, що повільна, на кількох сотнях синтетичних записів і на маленьких прикладах, написаних вручну. Ці тести мають пройти й до зміни, і після неї.

    **3. Індекс замість повторних проходів.** `dailyTotals(list)` у `domain/expenses.ts` повертає `Map` від дати `"YYYY-MM-DD"` до суми `amountMinor` витрат цього дня, дати за зростанням. Повільна версія для кожної дати знову фільтрує весь список. Напиши швидку: один прохід, що додає суму витрати до суми її дня в `Map`, а потім сортування лише різних дат. Підпис функції не змінюється. Виміряй час у DevTools (вкладка Performance) до й після зміни на тисячах синтетичних записів — як у уроках розділу.

    **4. Сторінка.** Під підсумком додай `<p id="by-day"></p>`: `render()` пише туди «%%byDayLabel%%: » і для кожного дня з `dailyTotals(current)` `formatDay(день, LOCALE) + ": " + formatMoney(сума, LOCALE)`, через « · ». `formatDay` додай в `ui/format.js` — так само, як у кроці про дані: `Intl.DateTimeFormat` з `dateStyle: "long"` і `timeZone: "UTC"`.

    **5. Аудит доступності.**

    - Оголошення: після підтвердженого видалення напиши в `#status` (у нього вже є `role="status"`) «%%announceDeleted%%», підставивши назву видаленої витрати замість `{name}` (візьми її до виклику `remove`). Додай у `ui/page.js` маленьку функцію `announce(text)`, що пише текст у `#status`.
    - Поля з помилкою: `showErrors` ставить полям `#expense-label` і `#expense-amount` `aria-invalid="true"`, коли в них помилка, і `"false"`, коли немає. Повідомлення під полем уже пов’язане з ним через `aria-describedby`, тож скринрідер читає його, щойно поле отримує фокус.

    **Як перевірятиметься.** Роботу перевірки міряють **кількістю прочитань**, а не часом: прочитань поля `date` на 2 000 синтетичних витрат — не більше 8 000. Прочитання рахує getter чи `Proxy`, підставлений замість поля, а результат порівнюється з власним підрахунком перевірок. Ще перевірки викликають генератор, дивляться на сторінку, на області `role="status"` після головної дії й на `aria-invalid` і `aria-describedby` поля назви після порожньої чернетки. Твої тести запускаються з `domain/expenses.ts` від курсу (з прибраними типами) — усі мають пройти — і з версією, що записує суму дня замість того, щоб додавати до неї: з нею хоча б один тест має впасти.
  en: |
    **1. Synthetic data.** The new module `data/synthetic.js` exports `makeSyntheticExpenses(count)` — `count` expenses with the `id`s `"s-1"`, `"s-2"`, …: the label of one of the six starting expenses and a number, a whole amount above zero, the categories in turn and a date — one of 365 days from `2025-01-01`, given by `dayAfterStart(offset)` — `new Date(Date.UTC(2025, 0, 1 + offset)).toISOString().slice(0, 10)` (in UTC every day has 24 hours, there are no time zones here). No `Math.random`: the same call always gives the same records, and every one passes `isUsableExpense`.

    **2. The slow version as the reference.** Here is the slow version of the transform you will speed up:

    ```js
    function slowDailyTotals(list) {
      const days = [...new Set(list.map((expense) => expense.date))].sort();
      return new Map(days.map((day) => [day, list.filter((expense) => expense.date === day).reduce((sum, expense) => sum + expense.amountMinor, 0)]));
    }
    ```

    Create `tests/performance.test.js` (and import it in `run-tests.js`): copy the slow version into it and write [[characterization-test|characterization tests]] — the new function gives the same as the slow one on a few hundred synthetic records and on small examples written by hand. These tests must pass both before the change and after it.

    **3. An index instead of repeated passes.** `dailyTotals(list)` in `domain/expenses.ts` returns a `Map` from a date `"YYYY-MM-DD"` to the sum of `amountMinor` of that day’s expenses, the dates in ascending order. The slow version filters the whole list again for every date. Write a fast one: one pass that adds the amount of an expense to its day’s sum in a `Map`, then a sort of only the distinct dates. The function's signature does not change. Measure the time in DevTools (the Performance tab) before and after the change on thousands of synthetic records — as in this unit's lessons.

    **4. The page.** Under the summary add `<p id="by-day"></p>`: `render()` writes “%%byDayLabel%%: ” into it and for every day of `dailyTotals(current)` `formatDay(day, LOCALE) + ": " + formatMoney(sum, LOCALE)`, joined with “ · ”. Add `formatDay` to `ui/format.js` — as in the data step: `Intl.DateTimeFormat` with `dateStyle: "long"` and `timeZone: "UTC"`.

    **5. Accessibility audit.**

    - Announcement: after a confirmed delete write “%%announceDeleted%%” into `#status` (it already has `role="status"`), with the label of the deleted expense in place of `{name}` (take it before calling `remove`). Add a small function `announce(text)` to `ui/page.js` that writes the text into `#status`.
    - Fields with an error: `showErrors` gives the fields `#expense-label` and `#expense-amount` `aria-invalid="true"` when they have an error and `"false"` when they do not. The message under a field is already linked to it through `aria-describedby`, so a screen reader reads it as soon as the field gets focus.

    **How it is checked.** The checks measure work by **the number of reads**, not by time: reads of the field `date` for 2,000 synthetic expenses — at most 8,000. A getter or a `Proxy` put in place of the field counts the reads, and the result is compared with the checks' own count. The checks also call the generator, look at the page, at the `role="status"` regions after the main action and at `aria-invalid` and `aria-describedby` of the name field after an empty draft. Your tests run with the course's `domain/expenses.ts` (with the types removed) — all must pass — and with a version that overwrites the sum of a day instead of adding to it: with it, at least one test must fail.
nudge:
  uk: "Повільна версія повторює прохід по списку для кожного запису чи дня. Швидка проходить один раз і щоразу питає `Map` чи `Set` — `get`, `has`, `set` не переглядають усіх записів. Характеризаційний тест пиши ще до зміни: тоді він доводить, що поведінка лишилася тією самою."
  en: "The slow version repeats the pass over the list for every record or day. The fast one goes through once and asks a `Map` or a `Set` each time — `get`, `has` and `set` do not look through all the records. Write the characterization test before the change: then it proves that the behaviour stayed the same."
