feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там помилка завантаження `data/synthetic.js` чи `tests/performance.test.js`, то файл лежить не в тій теці або має іншу назву."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. If it shows a loading error for `data/synthetic.js` or `tests/performance.test.js`, the file is in another folder or has another name."
  - when: { test: "the synthetic generator makes 20,000 valid records, the same every time" }
    message:
      uk: "Ця перевірка викликає генератор з `data/synthetic.js` для 20 000 записів і чекає 20 000 різних `id`, жодного запису, який відхиляє `isUsableExpense`, і однакові записи від двох однакових викликів. `Math.random` і поточна дата дають щоразу інші дані."
      en: "This check calls the generator of `data/synthetic.js` for 20,000 records and expects 20,000 different `id`s, no record that `isUsableExpense` refuses, and the same records from two identical calls. `Math.random` and the current date give different data every time."
  - when: { test: "dailyTotals reads each date only a few times" }
    message:
      uk: "Ця перевірка рахує прочитання поля `date` (через getter) під час `dailyTotals` на 2 000 синтетичних витрат і чекає не більше 8 000 — і ті самі пари «день — сума», що дає підрахунок перевірки. Повільна версія фільтрує список для кожної з 365 дат."
      en: "This check counts the reads of the field `date` (through a getter) during `dailyTotals` of 2,000 synthetic expenses and expects at most 8,000 — and the same “day — sum” pairs as the check’s own count. The slow version filters the list for every one of 365 dates."
  - when: { test: "dailyTotals adds up every day, in order" }
    message:
      uk: "Ця перевірка чекає від `dailyTotals` `Map` з парами `[\"2026-02-27\", 39990]`, `[\"2026-02-28\", 18000]`, `[\"2026-03-01\", 136550]`, `[\"2026-03-02\", 21050]` для шести початкових витрат і порожній `Map` для `[]`."
      en: "This check expects `dailyTotals` to give a `Map` with the pairs `[\"2026-02-27\", 39990]`, `[\"2026-02-28\", 18000]`, `[\"2026-03-01\", 136550]`, `[\"2026-03-02\", 21050]` for the six starting expenses and an empty `Map` for `[]`."
  - when: { test: "the page shows the total of every day" }
    message:
      uk: "Ця перевірка перезапускає сторінку з порожнім сховищем і чекає на сторінці «%%byDayLabel%%:» і далі 27 і 28 лютого, 1 і 2 березня 2026 (через `formatDay`) із сумами 399,90, 180,00, 1365,50 і 210,50 грн через `formatMoney`."
      en: "This check restarts the page with an empty storage and expects “%%byDayLabel%%:” on the page followed by February 27 and 28, March 1 and 2, 2026 (through `formatDay`) with the sums 399.90, 180.00, 1365.50 and 210.50 UAH through `formatMoney`."
  - when: { test: "the main action is announced in a status region" }
    message:
      uk: "Ця перевірка видаляє `e-03` («%%deleteLabel%%», «%%confirmDeleteLabel%%») і чекає в області `role=\"status\"` (чи `aria-live`) рівно «%%announceDeleted%%» з назвою `e-03` замість `{name}`."
      en: "This check deletes `e-03` (“%%deleteLabel%%”, “%%confirmDeleteLabel%%”) and expects exactly “%%announceDeleted%%” with the label of `e-03` in place of `{name}` in a `role=\"status\"` (or `aria-live`) region."
  - when: { test: "a field with an error is marked invalid and linked to its message" }
    message:
      uk: "Ця перевірка надсилає форму з порожньою назвою й чекає в поля «%%nameLabel%%» `aria-invalid=\"true\"` і «%%labelRequiredMessage%%» у тексті елемента, на який указує його `aria-describedby`; після правильної чернетки `aria-invalid` має бути `\"false\"` або зникнути."
      en: "This check submits the form with an empty name and expects `aria-invalid=\"true\"` on the field “%%nameLabel%%” and “%%labelRequiredMessage%%” in the text of the element its `aria-describedby` names; after a valid draft `aria-invalid` must be `\"false\"` or gone."
  - when: { test: "your performance tests pass with a correct domain module" }
    message:
      uk: "Ця перевірка запускає `tests/performance.test.js` з `domain/expenses.ts` від курсу (з прибраними типами) і раннером курсу та чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку. Якщо там «there is no file tests/performance.test.js», то файл лежить не в теці `tests/` або має іншу назву."
      en: "This check runs `tests/performance.test.js` with the course's `domain/expenses.ts` (with the types removed) and the course runner, and expects at least one test and none that fails. The message below names the failed test or the error. If it says “there is no file tests/performance.test.js”, the file is not in the folder `tests/` or has another name."
  - when: { test: "your tests catch totals that keep only the last expense of a day" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/expenses.ts`. Потім вона підставляє версію, де `dailyTotals` записує суму дня замість того, щоб додавати до неї, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у даних якого дві витрати одного дня."
      en: "This check first expects all your tests to pass with the correct `domain/expenses.ts`. Then it puts in a version where `dailyTotals` overwrites the sum of a day instead of adding to it, and expects at least one of your tests to fail. A test whose data has two expenses on the same day notices this defect."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
