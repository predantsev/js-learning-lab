# Wishlist variant of step RN-02 (a local step: done in the learner's editor, terminal and on the declared
# native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1, Expo SDK
# 57) on the scratch project of this capstone; nothing was run on an emulator, a simulator or a phone.
strings:
  draftCheckedNote: { uk: "Чернетка відповідає правилам. Зберігати її навчимося в наступному кроці.", en: "The draft follows the rules. Saving it comes in the next step." }
instructions:
  uk: |
    Перенеси список бажань і форму на нативний екран: читабельно, з підписами, поза вирізом і над клавіатурою. Платформа цей крок не перевіряє.

    1. `npx expo install react-native-safe-area-context`.
    2. `src/draft.ts` без React Native: `Draft` (`name`, `price`, `category`), `draftOf`, `checkDraft` (порожня ціна — `null`, далі `validateItem`), `messageFor`; `tests/draft.test.js` і його імпорт у `run-tests.js`.
    3. `src/FormField.tsx`: видимий підпис, той самий `accessibilityLabel`, висота 48, фокус читача екрана на помилці.
    4. `src/ItemRow.tsx`: назва, ціна або «%%noPrice%%», «%%acquiredMark%%»; `accessibilityLabel={formatItemLabel(item)}`; висота 48.
    5. `src/ItemForm.tsx`: «%%formTitle%%», поля «%%nameLabel%%», «%%valueLabel%%», «%%categoryFieldLabel%%», кнопка «%%saveLabel%%»; правильна чернетка — «%%draftCheckedNote%%».
    6. `src/ItemsScreen.tsx`: шапка з `insets.top`, `KeyboardAvoidingView` + `ScrollView`; `App.tsx` — `SafeAreaProvider`.
    7. `EVIDENCE.md`, розділ «RN-02»; `git commit -m "Show the list and a labeled form on a native screen"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка.
    - `npm test` — 23 тести, «не пройшли: 0».
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: текст шапки нижче рядка стану й вирізу; шість бажань, «%%fixture5Name%%» — «%%noPrice%%».
    - На цілі: поле «%%valueLabel%%» видно над клавіатурою; «%%saveLabel%%» з порожньою назвою — «%%requiredMessage%%».
    - На цілі з TalkBack чи VoiceOver: рядок читається як «%%fixture1Name%% — 80», поле — своїм підписом, після «%%saveLabel%%» фокус на помилці.
    - На цілі з найбільшим системним шрифтом: назви переносяться, нічого не обрізано.

    **Доказ:** commit і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі (зі знімком екрана), або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися.
  en: |
    Move the wish list and the form to a native screen: readable, labeled, clear of the notch and above the keyboard. The platform does not check this step.

    1. `npx expo install react-native-safe-area-context`.
    2. `src/draft.ts` without React Native: `Draft` (`name`, `price`, `category`), `draftOf`, `checkDraft` (an empty price is `null`, then `validateItem`), `messageFor`; `tests/draft.test.js` and its import in `run-tests.js`.
    3. `src/FormField.tsx`: a visible label, the same `accessibilityLabel`, a height of 48, the screen reader's focus on an error.
    4. `src/ItemRow.tsx`: the name, the price or “%%noPrice%%”, “%%acquiredMark%%”; `accessibilityLabel={formatItemLabel(item)}`; a height of 48.
    5. `src/ItemForm.tsx`: “%%formTitle%%”, the fields “%%nameLabel%%”, “%%valueLabel%%”, “%%categoryFieldLabel%%”, the button “%%saveLabel%%”; a valid draft — “%%draftCheckedNote%%”.
    6. `src/ItemsScreen.tsx`: a header with `insets.top`, `KeyboardAvoidingView` + `ScrollView`; `App.tsx` — `SafeAreaProvider`.
    7. `EVIDENCE.md`, a section “RN-02”; `git commit -m "Show the list and a labeled form on a native screen"`.

    **Self-check — confirm every item yourself:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line.
    - `npm test` — 23 tests, “failed: 0”.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: the header text below the status bar and the notch; six wishes, “%%fixture5Name%%” — “%%noPrice%%”.
    - On the target: the “%%valueLabel%%” field stays visible above the keyboard; “%%saveLabel%%” with an empty name — “%%requiredMessage%%”.
    - On the target with TalkBack or VoiceOver: a row is read as “%%fixture1Name%% — 80”, a field by its label, and after “%%saveLabel%%” the focus is on the error.
    - On the target with the largest system font: the names wrap, nothing is cut.

    **Evidence:** the commit and `EVIDENCE.md` — the command lines and what you saw on the target (with a screenshot), or a “not performed” record: what, on which target, why, what it takes to come back.
