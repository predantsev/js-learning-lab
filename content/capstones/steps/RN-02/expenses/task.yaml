# Expense tracker variant of step RN-02 (a local step: done in the learner's editor, terminal and on the
# declared native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1,
# Expo SDK 57) on the scratch project of this capstone; nothing was run on an emulator, a simulator or a phone.
strings:
  draftCheckedNote: { uk: "Чернетка відповідає правилам. Зберігати її навчимося в наступному кроці.", en: "The draft follows the rules. Saving it comes in the next step." }
instructions:
  uk: |
    Перенеси список витрат і форму на нативний екран: читабельно, з підписами, поза вирізом і над клавіатурою. Платформа цей крок не перевіряє.

    1. `npx expo install react-native-safe-area-context`.
    2. `src/draft.ts` без React Native: `Draft` (`label`, `amount` — гривні текстом, `date`, `category`), `draftOf` (сума через `formatAmount`), `checkDraft` (`parseAmountMinor`, далі `validateExpense`), `messageFor`; `tests/draft.test.js` і його імпорт у `run-tests.js`.
    3. `src/FormField.tsx`: видимий підпис, той самий `accessibilityLabel`, висота 48, фокус читача екрана на помилці; `src/ChoiceField.tsx`: підписаний вибір із кнопок висотою 48, вибрана — з «✓» у видимому тексті.
    4. `src/ExpenseRow.tsx`: назва, сума `formatAmount(amountMinor)` і «%%currency%%», дата, категорія словом (`categoryText`); `accessibilityLabel` — `formatExpenseLabel(expense)`, дата й категорія; висота 48.
    5. `src/ExpenseForm.tsx`: «%%formTitle%%», поля «%%nameLabel%%», «%%valueLabel%%», «%%dateFieldLabel%%», вибір «%%categoryFieldLabel%%», кнопка «%%saveLabel%%»; правильна чернетка — «%%draftCheckedNote%%».
    6. `src/ExpensesScreen.tsx`: шапка з `insets.top`, `KeyboardAvoidingView` + `ScrollView`; `App.tsx` — `SafeAreaProvider`.
    7. `EVIDENCE.md`, розділ «RN-02»; `git commit -m "Show the list and a labeled form on a native screen"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка.
    - `npm test` — 22 тести, «не пройшли: 0».
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: текст шапки нижче рядка стану й вирізу; шість витрат, «%%fixture1Name%%» — «845%%decimalMark%%50 %%currency%%» і «2026-03-01 · %%categoryFood%%».
    - На цілі: поле «%%dateFieldLabel%%» видно над клавіатурою; «%%saveLabel%%» з порожньою формою — «%%labelRequiredMessage%%», «%%invalidMessage%%», «%%badDateMessage%%» і «%%requiredMessage%%».
    - На цілі з TalkBack чи VoiceOver: рядок читається одним реченням із сумою, датою й категорією, поле — своїм підписом, після «%%saveLabel%%» фокус на помилці.
    - На цілі з найбільшим системним шрифтом: назви переносяться, нічого не обрізано.

    **Доказ:** commit і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі (зі знімком екрана), або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися. Без цілі натисни на цій сторінці «У мене немає емулятора чи пристрою», а не «Цей крок виконано».
  en: |
    Move the expense list and the form to a native screen: readable, labeled, clear of the notch and above the keyboard. The platform does not check this step.

    1. `npx expo install react-native-safe-area-context`.
    2. `src/draft.ts` without React Native: `Draft` (`label`, `amount` — hryvnias as text, `date`, `category`), `draftOf` (the amount through `formatAmount`), `checkDraft` (`parseAmountMinor`, then `validateExpense`), `messageFor`; `tests/draft.test.js` and its import in `run-tests.js`.
    3. `src/FormField.tsx`: a visible label, the same `accessibilityLabel`, a height of 48, the screen reader's focus on an error; `src/ChoiceField.tsx`: a labeled choice of buttons 48 high, the chosen one with “✓” in its visible text.
    4. `src/ExpenseRow.tsx`: the label, the amount `formatAmount(amountMinor)` and “%%currency%%”, the date, the category in words (`categoryText`); `accessibilityLabel` — `formatExpenseLabel(expense)`, the date and the category; a height of 48.
    5. `src/ExpenseForm.tsx`: “%%formTitle%%”, the fields “%%nameLabel%%”, “%%valueLabel%%”, “%%dateFieldLabel%%”, the choice “%%categoryFieldLabel%%”, the button “%%saveLabel%%”; a valid draft — “%%draftCheckedNote%%”.
    6. `src/ExpensesScreen.tsx`: a header with `insets.top`, `KeyboardAvoidingView` + `ScrollView`; `App.tsx` — `SafeAreaProvider`.
    7. `EVIDENCE.md`, a section “RN-02”; `git commit -m "Show the list and a labeled form on a native screen"`.

    **Self-check — confirm every item yourself:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line.
    - `npm test` — 22 tests, “failed: 0”.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: the header text below the status bar and the notch; six expenses, “%%fixture1Name%%” — “845%%decimalMark%%50 %%currency%%” and “2026-03-01 · %%categoryFood%%”.
    - On the target: the “%%dateFieldLabel%%” field stays visible above the keyboard; “%%saveLabel%%” with an empty form — “%%labelRequiredMessage%%”, “%%invalidMessage%%”, “%%badDateMessage%%” and “%%requiredMessage%%”.
    - On the target with TalkBack or VoiceOver: a row is read as one sentence with the amount, the date and the category, a field by its label, and after “%%saveLabel%%” the focus is on the error.
    - On the target with the largest system font: the labels wrap, nothing is cut.

    **Evidence:** the commit and `EVIDENCE.md` — the command lines and what you saw on the target (with a screenshot), or a “not performed” record: what, on which target, why, what it takes to come back. Without a target, press “I have no emulator or device” on this page, not “I have done this step”.
