# Planner variant of step RN-02 (a local step: done in the learner's editor, terminal and on the declared
# native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1, Expo SDK
# 57) on the scratch project of this capstone; nothing was run on an emulator, a simulator or a phone.
strings:
  draftCheckedNote: { uk: "Чернетка відповідає правилам. Зберігати її навчимося в наступному кроці.", en: "The draft follows the rules. Saving it comes in the next step." }
instructions:
  uk: |
    Перенеси список справ і форму на нативний екран: читабельно, з підписами, поза вирізом і над клавіатурою. Платформа цей крок не перевіряє.

    1. `npx expo install react-native-safe-area-context`.
    2. `src/draft.ts` без React Native: `Draft` (`title`, `dueDate`, `priority`), `draftOf` (нова справа — пріоритет `normal`), `checkDraft` (порожній термін — `null`, далі `validateTask`), `messageFor`; `tests/draft.test.js` і його імпорт у `run-tests.js`.
    3. `src/FormField.tsx`: видимий підпис, той самий `accessibilityLabel`, висота 48, фокус читача екрана на помилці; `src/ChoiceField.tsx`: підписаний вибір із кнопок висотою 48, вибрана — з «✓» у видимому тексті.
    4. `src/TaskRow.tsx`: назва, термін або «%%noDueDate%%», пріоритет словом (`priorityText`), «%%doneMark%%» / «%%pendingMark%%»; `accessibilityLabel` — `formatTaskLabel(task)` і стан; висота 48.
    5. `src/TaskForm.tsx`: «%%formTitle%%», поля «%%nameLabel%%», «%%valueLabel%%», вибір «%%priorityFieldLabel%%», кнопка «%%saveLabel%%»; правильна чернетка — «%%draftCheckedNote%%».
    6. `src/TasksScreen.tsx`: шапка з `insets.top`, `KeyboardAvoidingView` + `ScrollView`; `App.tsx` — `SafeAreaProvider`.
    7. `EVIDENCE.md`, розділ «RN-02»; `git commit -m "Show the list and a labeled form on a native screen"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка.
    - `npm test` — 24 тести, «не пройшли: 0».
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: текст шапки нижче рядка стану й вирізу; шість справ, «%%fixture3Name%%» — «%%noDueDate%%», дві — «%%doneMark%%».
    - На цілі: поле «%%valueLabel%%» видно над клавіатурою; «%%saveLabel%%» з порожньою назвою й терміном `4.03.2026` — «%%requiredMessage%%» і «%%badDateMessage%%».
    - На цілі з TalkBack чи VoiceOver: рядок читається одним реченням із терміном, пріоритетом і станом, поле — своїм підписом, після «%%saveLabel%%» фокус на помилці.
    - На цілі з найбільшим системним шрифтом: назви переносяться, нічого не обрізано.

    **Доказ:** commit і `EVIDENCE.md` — рядки команд і те, що ти бачив на цілі (зі знімком екрана), або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися. Без цілі натисни на цій сторінці «У мене немає емулятора чи пристрою», а не «Цей крок виконано».
  en: |
    Move the task list and the form to a native screen: readable, labeled, clear of the notch and above the keyboard. The platform does not check this step.

    1. `npx expo install react-native-safe-area-context`.
    2. `src/draft.ts` without React Native: `Draft` (`title`, `dueDate`, `priority`), `draftOf` (a new task has the priority `normal`), `checkDraft` (an empty due date is `null`, then `validateTask`), `messageFor`; `tests/draft.test.js` and its import in `run-tests.js`.
    3. `src/FormField.tsx`: a visible label, the same `accessibilityLabel`, a height of 48, the screen reader's focus on an error; `src/ChoiceField.tsx`: a labeled choice of buttons 48 high, the chosen one with “✓” in its visible text.
    4. `src/TaskRow.tsx`: the title, the due date or “%%noDueDate%%”, the priority in words (`priorityText`), “%%doneMark%%” / “%%pendingMark%%”; `accessibilityLabel` — `formatTaskLabel(task)` and the state; a height of 48.
    5. `src/TaskForm.tsx`: “%%formTitle%%”, the fields “%%nameLabel%%”, “%%valueLabel%%”, the choice “%%priorityFieldLabel%%”, the button “%%saveLabel%%”; a valid draft — “%%draftCheckedNote%%”.
    6. `src/TasksScreen.tsx`: a header with `insets.top`, `KeyboardAvoidingView` + `ScrollView`; `App.tsx` — `SafeAreaProvider`.
    7. `EVIDENCE.md`, a section “RN-02”; `git commit -m "Show the list and a labeled form on a native screen"`.

    **Self-check — confirm every item yourself:**

    - `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line.
    - `npm test` — 24 tests, “failed: 0”.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: the header text below the status bar and the notch; six tasks, “%%fixture3Name%%” — “%%noDueDate%%”, two — “%%doneMark%%”.
    - On the target: the “%%valueLabel%%” field stays visible above the keyboard; “%%saveLabel%%” with an empty title and the due date `4.03.2026` — “%%requiredMessage%%” and “%%badDateMessage%%”.
    - On the target with TalkBack or VoiceOver: a row is read as one sentence with the due date, the priority and the state, a field by its label, and after “%%saveLabel%%” the focus is on the error.
    - On the target with the largest system font: the titles wrap, nothing is cut.

    **Evidence:** the commit and `EVIDENCE.md` — the command lines and what you saw on the target (with a screenshot), or a “not performed” record: what, on which target, why, what it takes to come back. Without a target, press “I have no emulator or device” on this page, not “I have done this step”.
