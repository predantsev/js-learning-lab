# Capstone step of unit RN-02 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of RN-02 from this file.
# A local step: done in the learner's editor, terminal and on the declared native target; no platform
# checks. The project page shows only the intro of a local step, so the intro carries the whole procedure.
# Every computer-side command was run on macOS (Node.js 25.2.1, npm 11.6.2, Expo SDK 57) in a scratch home
# on all four projects, continuing the RN-01 scratch projects: expo install, tsc, the course test runner
# (Ukrainian and English strings), expo export for android and ios, the commit. Nothing was run on an
# emulator, a simulator or a phone. Quoted output is from the wishlist run.
# reference/ is the native project after the step without the files the template generates and the
# platform cannot carry (assets/*.png, LICENSE, package-lock.json, node_modules/).
unit: RN-02
mode: local
entry: App.tsx
title:
  uk: "Список і форма на нативному екрані"
  en: "The list and the form on a native screen"
intro:
  uk: |
    Hello-екран стає справжнім екраном проєкту: список стартових записів і форма з підписаними полями. Вони мають бути читабельними, не ховатися під виріз і системні панелі й не зникати під клавіатурою. Форма вже перевіряє чернетку спільними правилами домену; зберігати її навчимося в наступному кроці.

    | Проєкт | Рядок списку | Поля форми |
    |---|---|---|
    | Список бажань | назва, ціна або «без ціни», позначка «отримано» | назва, ціна, категорія |
    | Планувальник | назва, термін або «без терміну», пріоритет, «виконано» / «ще не виконано» | справа, термін, пріоритет (вибір) |
    | Трекер звичок | назва, частота, «активна» / «на паузі» | звичка, частота (вибір) |
    | Трекер витрат | назва, сума в гривнях, дата, категорія | витрата, сума, дата, категорія (вибір) |

    Нижче — «Список бажань». Команди на комп’ютері виконано на macOS (Node.js 25.2.1, Expo SDK 57) на всіх чотирьох проєктах. Емулятора, симулятора й телефона не було: крок 8 описано за документацією React Native 0.86 і react-native-safe-area-context та за уроками розділу, його виводу тут немає.

    **1. Стан на початку.** `cd ~/js-course/wishlist-native`, `git status` — чисто, `git log --oneline -1` — commit hello-екрана.

    **2. Безпечні зони.** `npx expo install react-native-safe-area-context` — у нас `› Installing 1 SDK 57.0.0 compatible native module using npm`, а в `package.json` — `"react-native-safe-area-context": "~5.7.0"`. Версію підбирає `npx expo install`, не `npm install`.

    **3. Чернетка без React Native.** `src/draft.ts` тримає форму як текст і питає спільні правила — так само, як веб-форма React-проєкту: тип `Draft` (`name`, `price`, `category` — рядки), `draftOf(item)` (порожні поля або поля збереженого бажання), `checkDraft(draft)` (порожня ціна — `null`, інший текст — `Number(…)`, далі `validateItem`) і `messageFor(errorKey)` (текст повідомлення для кожного ключа помилки). У файлі немає імпорту з `react-native`, тож `tests/draft.test.js` запускає Node.js: порожня ціна — «без ціни», `"abc"`, `"-1"`, `"12.5"` — ключі `not-a-number`, `negative`, `not-whole`, і для кожного ключа є текст. Додай імпорт тесту в `run-tests.js`.

    **4. Підписане поле.** `src/FormField.tsx`: видимий підпис `<Text>`, під ним `TextInput` з тим самим текстом в `accessibilityLabel`, мінімальна висота 48. Коли з’являється помилка, вона — `Text` з `accessible={true}`, і `useEffect` переводить на неї фокус читача екрана: `AccessibilityInfo.sendAccessibilityEvent(errorRef.current, 'focus')`.

    **5. Рядок списку.** `src/ItemRow.tsx`: назва (`flexShrink: 1`, тож довга назва переноситься, а не обрізається), під нею позначка «отримано», праворуч ціна або «без ціни». Весь рядок — один елемент для читача екрана: `accessible={true}` і `accessibilityLabel={formatItemLabel(item)}`. Висота — щонайменше 48.

    **6. Форма й екран.** `src/ItemForm.tsx`: заголовок форми, три поля й кнопка `Pressable` з `role="button"` і висотою 48; правильна чернетка показує «Чернетка відповідає правилам…». `src/ItemsScreen.tsx`: шапка з фоном до самого верху, але текстом нижче вирізу (`paddingTop: insets.top + 12` з `useSafeAreaInsets()`); під нею `KeyboardAvoidingView` з `behavior={Platform.OS === 'ios' ? 'padding' : 'height'}` і `ScrollView` зі списком і формою; знизу й з боків — відступи з `insets`. `App.tsx` загортає екран у `SafeAreaProvider` і передає стартові записи з `parseItemList`; якщо файл пошкоджено, екран каже про це, а не падає.

    **7. Перевірка на комп’ютері.** `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка; `npm test` — `Пройшли: 23 · не пройшли: 0`; `npx expo export --platform android` — у нас `Android Bundled 1505ms index.ts (597 modules)`, `--platform ios` — `iOS Bundled 1490ms index.ts (599 modules)`.

    **8. На заявленій цілі.** `npm start`. Перевір: текст шапки не заходить під рядок стану й виріз; шість бажань із цінами, у «Квитки на концерт» — «без ціни», у двох отриманих — «отримано»; торкнись поля «Ціна» — клавіатура не закриває його; «Зберегти» з порожньою назвою — «Вкажи назву бажання»; з увімкненим TalkBack чи VoiceOver рядок читається одним реченням («Навушники — 80»), поле — своїм підписом, а після «Зберегти» фокус переходить на помилку; з найбільшим системним шрифтом назви переносяться, нічого не обрізано. Цих екранів ми не бачили.

    **9. Доказ і commit.** У `EVIDENCE.md` — розділ «RN-02»: рядки кроку 7 і те, що ти бачив на цілі, або запис «не виконано» (що, ціль, чому, що потрібно, щоб повернутися; тоді на сторінці кроку — «У мене немає емулятора чи пристрою», а не «Цей крок виконано»). `git status --short` — ` M App.tsx`, ` M EVIDENCE.md`, ` M package-lock.json`, ` M package.json`, ` M run-tests.js`, `?? src/`, `?? tests/draft.test.js`. `git add -A`, `git commit -m "Show the list and a labeled form on a native screen"` — у нас `11 files changed`.

    **Самоперевірка:** `src/draft.ts` не імпортує `react-native`; кожне поле має видимий підпис і той самий `accessibilityLabel`; висота кнопок і рядків — щонайменше 48; ніде немає `allowFontScaling={false}` чи фіксованої висоти тексту; `npm test` проходить.

    **Якщо щось пішло не так:** шапка під рядком стану — `SafeAreaProvider` має бути вище за екран, а `useSafeAreaInsets()` — у компоненті під ним. Клавіатура закриває поле — `KeyboardAvoidingView` має бути зовні `ScrollView` і мати `flex: 1`. `npm test` падає з `SyntaxError: Unexpected token 'typeof'` (тест дістався до `react-native`, якого Node.js не прочитає) або з `Unknown file extension ".tsx"` (тест імпортує компонент) — правило має жити в `src/draft.ts`, а не в компоненті.

    Еталон кроку — `Завантажити: RN-02 — Список і форма на нативному екрані` після експорту (без `assets/*.png`, `LICENSE`, `package-lock.json` і `node_modules/` — див. крок RN-01). Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    The hello screen becomes a real screen of the project: the list of starting records and a form with labeled fields. They must be readable, must not hide under the notch and the system bars, and must not disappear under the keyboard. The form already checks the draft with the shared domain rules; saving it comes in the next step.

    | Project | A list row | Form fields |
    |---|---|---|
    | Wishlist | name, price or “no price”, the “acquired” mark | name, price, category |
    | Planner | title, due date or “no due date”, priority, “done” / “not done yet” | task, due date, priority (a choice) |
    | Habit tracker | name, frequency, “active” / “paused” | habit, frequency (a choice) |
    | Expense tracker | label, the amount in hryvnias, date, category | expense, amount, date, category (a choice) |

    Below is the wishlist. The computer commands were run on macOS (Node.js 25.2.1, Expo SDK 57) on all four projects. There was no emulator, simulator or phone: step 8 follows the documentation of React Native 0.86 and react-native-safe-area-context and this unit's lessons, and no output of it is quoted here.

    **1. The starting state.** `cd ~/js-course/wishlist-native`, `git status` — clean, `git log --oneline -1` — the hello-screen commit.

    **2. Safe areas.** `npx expo install react-native-safe-area-context` — for us `› Installing 1 SDK 57.0.0 compatible native module using npm`, and `package.json` has `"react-native-safe-area-context": "~5.7.0"`. `npx expo install` picks the version, not `npm install`.

    **3. The draft without React Native.** `src/draft.ts` holds the form as text and asks the shared rules — just like the web form of the React project: the type `Draft` (`name`, `price`, `category` — strings), `draftOf(item)` (empty fields or the fields of a saved wish), `checkDraft(draft)` (an empty price is `null`, other text is `Number(…)`, then `validateItem`) and `messageFor(errorKey)` (the message text for every error key). The file imports nothing from `react-native`, so Node.js runs `tests/draft.test.js`: an empty price is “no price”, `"abc"`, `"-1"`, `"12.5"` are the keys `not-a-number`, `negative`, `not-whole`, and every key has a text. Add the test's import to `run-tests.js`.

    **4. A labeled field.** `src/FormField.tsx`: a visible label `<Text>`, under it a `TextInput` with the same text in `accessibilityLabel`, a minimum height of 48. When an error appears, it is a `Text` with `accessible={true}`, and a `useEffect` moves the screen reader's focus to it: `AccessibilityInfo.sendAccessibilityEvent(errorRef.current, 'focus')`.

    **5. A list row.** `src/ItemRow.tsx`: the name (`flexShrink: 1`, so a long name wraps instead of being cut), under it the “acquired” mark, on the right the price or “no price”. The whole row is one element for the screen reader: `accessible={true}` and `accessibilityLabel={formatItemLabel(item)}`. The height is at least 48.

    **6. The form and the screen.** `src/ItemForm.tsx`: the form's heading, three fields and a `Pressable` button with `role="button"` and a height of 48; a valid draft shows “The draft follows the rules…”. `src/ItemsScreen.tsx`: a header whose background reaches the very top while its text stays below the notch (`paddingTop: insets.top + 12` from `useSafeAreaInsets()`); under it a `KeyboardAvoidingView` with `behavior={Platform.OS === 'ios' ? 'padding' : 'height'}` and a `ScrollView` with the list and the form; at the bottom and the sides, paddings from `insets`. `App.tsx` wraps the screen in `SafeAreaProvider` and passes the starting records from `parseItemList`; when the file is damaged, the screen says so instead of crashing.

    **7. The check on the computer.** `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line; `npm test` — `Passed: 23 · failed: 0`; `npx expo export --platform android` — for us `Android Bundled 1505ms index.ts (597 modules)`, `--platform ios` — `iOS Bundled 1490ms index.ts (599 modules)`.

    **8. On the declared target.** `npm start`. Check: the header text does not go under the status bar and the notch; six wishes with prices, “Concert tickets” with “no price”, the two acquired ones with “acquired”; tap the “Price” field — the keyboard does not cover it; “Save” with an empty name — “Enter a name for the wish”; with TalkBack or VoiceOver on, a row is read as one sentence (“Headphones — 80”), a field by its label, and after “Save” the focus moves to the error; with the largest system font the names wrap and nothing is cut. We have not seen these screens.

    **9. Evidence and commit.** In `EVIDENCE.md`, a section “RN-02”: the lines of step 7 and what you saw on the target, or a “not performed” record (what, the target, why, what it takes to come back; then, on the step's page, “I have no emulator or device”, not “I have done this step”). `git status --short` — ` M App.tsx`, ` M EVIDENCE.md`, ` M package-lock.json`, ` M package.json`, ` M run-tests.js`, `?? src/`, `?? tests/draft.test.js`. `git add -A`, `git commit -m "Show the list and a labeled form on a native screen"` — for us `11 files changed`.

    **Self-check:** `src/draft.ts` does not import `react-native`; every field has a visible label and the same `accessibilityLabel`; buttons and rows are at least 48 high; nowhere is there `allowFontScaling={false}` or a fixed text height; `npm test` passes.

    **If something goes wrong:** the header is under the status bar — `SafeAreaProvider` must be above the screen, and `useSafeAreaInsets()` in a component below it. The keyboard covers the field — `KeyboardAvoidingView` must be outside the `ScrollView` and have `flex: 1`. `npm test` fails with `SyntaxError: Unexpected token 'typeof'` (the test reached `react-native`, which Node.js cannot read) or with `Unknown file extension ".tsx"` (the test imports a component) — the rule must live in `src/draft.ts`, not in a component.

    The step's reference is `Download: RN-02 — The list and the form on a native screen` after the export (without `assets/*.png`, `LICENSE`, `package-lock.json` and `node_modules/` — see step RN-01). The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це крок твого проєкту: View, Text, TextInput, безпечні зони, клавіатуру й підписи для читача екрана із цього розділу ти застосовуєш до власного застосунку. Платформа цей крок не перевіряє: доказ — вивід команд, `EVIDENCE.md` і commit."
  en: "This is a step of your project: you apply this unit's View, Text, TextInput, safe areas, keyboard and screen-reader labels to your own app. The platform does not check this step: the evidence is the command output, `EVIDENCE.md` and the commit."
objectives:
  - uk: "Перенести список і форму проєкту на нативний екран із підписаними полями, цілями дотику 48 і текстом, що переноситься замість обрізання."
    en: "Move the project's list and form to a native screen with labeled fields, 48-point touch targets and text that wraps instead of being cut."
  - uk: "Тримати шапку нижче вирізу й поля над клавіатурою за допомогою безпечних зон і `KeyboardAvoidingView`, а перевірку чернетки — у модулі без React Native з тестами в Node.js."
    en: "Keep the header below the notch and the fields above the keyboard with safe areas and `KeyboardAvoidingView`, and the draft check in a module without React Native, tested in Node.js."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й на заявленій нативній цілі: що зробити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and on the declared native target: what to do, the expected output and the self-check list are above and on the step's page in your project."
