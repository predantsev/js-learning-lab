# Expense tracker variant of step NO-13 (a local step: done in the learner's editor, terminal and browser; no
# platform checks). Checked on macOS on the scratch project of this capstone after NO-12, in a Ukrainian and an
# English workspace, on Node.js 25.2.1 and 22.13.1: npm test of the web project (36) and of server/ (77, of them 8
# in tests/ssr.test.ts), npm run check, npm run check:server, npm run lint, npm run build:client, the release
# build (react 19.3.0, react-dom 19.3.0, scheduler 0.28.0), curl of GET /, and in Chrome 154 (playwright-core,
# channel "chrome"): /client.js held back 2 s (choosing a category before hydration changed nothing, hydrated,
# the same select node, choosing it after: 6 → 2 cards), the injected mismatch (+ "UAH 1,056.00" /
# - "1 056,00 ₴"). Wrong variants run against tests/ssr.test.ts, each failed at least one test: the wishlist's list
# (see its task header) plus the component formatting the totals itself (ignoring the server's totalText), the
# server formatting the totals in the machine's default locale, the totals of only the first category's expenses.
# Not run on Linux or Windows.
instructions:
  uk: |
    Відрендери на сервері список витрат із сумами, відформатованими з `amountMinor` у фіксованій локалі проєкту, гідратуй фільтр категорії й знайди навмисну невідповідність через різні типові налаштування `Intl` на сервері й клієнті. Платформа цей крок не перевіряє.

    1. `ui/ExpenseListPage.ts`: `PublicExpense` (`id`, `label`, `amountText`, `date`, `category`), `PublicTotal` (`category`, `totalMinor`, `totalText`), `ListPageData` (`requestId`, `expenses`, `totals`, `totalMinor`, `totalText`), `visibleExpenses(expenses, filter)`, `ExpenseListPage`, `clientElement(data)`; фільтр — стан клієнта, без запиту: він змінює, які витрати видно, а суми лишаються текстами сервера.
    2. `server/src/page.ts`: `toInitialData` — суми й кожна сума категорії форматуються з `amountMinor` лише тут, у фіксованій локалі проєкту; `serializeForHtml`, `escapeHtml`, `renderPage`, `fallbackPage`.
    3. `server/src/server.ts`: `GET /`, `GET /client.js`, `GET /list-data`, `PUBLIC_DIR`; `routeLabel` знає ці маршрути.
    4. `ssr/client.ts`, `server/scripts/build-client.mjs`, скрипти `"build:client"` і `"start"`; реліз несе `react`, `react-dom`, `scheduler` і мініфікований клієнт; версія `1.2.0`; `server/public/` — у `.gitignore` і `ignores` ESLint; `"ssr/**/*.ts"` — у `tsconfig.json`.
    5. `server/tests/ssr.test.ts`; `docs/rsc.md`.
    6. Невідповідність: у `ssr/client.ts` після `const data = …` — `const ownFormat = (minor: number) => (minor / 100).toLocaleString(); data.totals = data.totals.map((total) => ({ ...total, totalText: ownFormat(total.totalMinor) })); data.totalText = ownFormat(data.totalMinor);`, `npm run build:client`, перезавантаж; знайди, прибери.
    7. `docs/server.md`, розділ «NO-13»; commit з інтро (`… a hydrated category filter, …`).

    Назви тестів для кроку 10 інтро — ті самі, що в інтро; тест невідповідності — `a client that formats the totals itself with Intl defaults renders other markup: that is the mismatch hydration reports`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` у `server/` — `ℹ tests 77`, `ℹ fail 0`; у теці проєкту — `не пройшли: 0`, `npm run lint` — без помилок.
    - `curl -sS http://127.0.0.1:4311/` — у `#root` уже є витрати й суми за категоріями.
    - До завантаження `client.js` вибір категорії `Їжа` нічого не змінює; після `hydrated` — той самий вузол `select`, і видно лише витрати цієї категорії, а суми ті самі.
    - Невідповідність у Console — `{"level":"warn","kind":"hydration","requestId":…}` з `+` (клієнт) і `-` (сервер) для суми; після виправлення — лише `hydrated`.
    - `grep -c "js-course/expenses/server/data" server/public/client.js` — `0`.

    **Доказ:** commit, `docs/server.md` і `docs/rsc.md` із командами й побаченим виводом.
  en: |
    Server-render the expense list with totals formatted from `amountMinor` in the project's fixed locale, hydrate the category filter and find a deliberate mismatch caused by server and client `Intl` defaults that differ. The platform does not check this step.

    1. `ui/ExpenseListPage.ts`: `PublicExpense` (`id`, `label`, `amountText`, `date`, `category`), `PublicTotal` (`category`, `totalMinor`, `totalText`), `ListPageData` (`requestId`, `expenses`, `totals`, `totalMinor`, `totalText`), `visibleExpenses(expenses, filter)`, `ExpenseListPage`, `clientElement(data)`; the filter is client state, no request: it changes which expenses are shown, and the totals stay the server's texts.
    2. `server/src/page.ts`: `toInitialData` — the overall and every category total are formatted from `amountMinor` only here, in the project's fixed locale; `serializeForHtml`, `escapeHtml`, `renderPage`, `fallbackPage`.
    3. `server/src/server.ts`: `GET /`, `GET /client.js`, `GET /list-data`, `PUBLIC_DIR`; `routeLabel` knows these routes.
    4. `ssr/client.ts`, `server/scripts/build-client.mjs`, the scripts `"build:client"` and `"start"`; the release carries `react`, `react-dom`, `scheduler` and the minified client; version `1.2.0`; `server/public/` in `.gitignore` and ESLint's `ignores`; `"ssr/**/*.ts"` in `tsconfig.json`.
    5. `server/tests/ssr.test.ts`; `docs/rsc.md`.
    6. The mismatch: in `ssr/client.ts` after `const data = …` — `const ownFormat = (minor: number) => (minor / 100).toLocaleString(); data.totals = data.totals.map((total) => ({ ...total, totalText: ownFormat(total.totalMinor) })); data.totalText = ownFormat(data.totalMinor);`, `npm run build:client`, reload; find it, remove it.
    7. `docs/server.md`, a section "NO-13"; the commit of the intro (`… a hydrated category filter, …`).

    The test names for step 10 of the intro are those of the intro; the mismatch test is `a client that formats the totals itself with Intl defaults renders other markup: that is the mismatch hydration reports`.

    **Self-check — confirm every item yourself:**

    - `npm test` in `server/` — `ℹ tests 77`, `ℹ fail 0`; in the project folder — `failed: 0`, `npm run lint` — no errors.
    - `curl -sS http://127.0.0.1:4311/` — `#root` already holds the expenses and the per-category totals.
    - Before `client.js` loads, choosing the food category changes nothing; after `hydrated` — the same `select` node, only that category's expenses are shown, and the totals stay the same.
    - The mismatch in the Console — `{"level":"warn","kind":"hydration","requestId":…}` with `+` (the client) and `-` (the server) for a total; after the fix — only `hydrated`.
    - `grep -c "js-course/expenses/server/data" server/public/client.js` — `0`.

    **Evidence:** the commit, `docs/server.md` and `docs/rsc.md` with the commands and the output you saw.
