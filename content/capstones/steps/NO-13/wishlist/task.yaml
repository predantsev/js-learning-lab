  en: |
    Server-render the wishlist — the name, the price or "%%noPrice%%", the "%%acquiredMark%%" mark — from serialized initial data, hydrate the `acquired` toggle and find a deliberate mismatch caused by a price formatted with the client's default locale. The platform does not check this step.

    1. `ui/WishListPage.ts`: `PublicWish` (`id`, `name`, `price`, `priceText`, `acquired`), `ListPageData` (`requestId`, `wishes`, `count`, `wantedTotalText`), `WishListPage`, `clientElement(data)`; the toggle — `PATCH /v1/records/:id {acquired}`, then `GET /list-data`.
    2. `server/src/page.ts`: `toInitialData`, `serializeForHtml`, `escapeHtml`, `renderPage`, `fallbackPage`; the prices and the wanted total — `formatPrice(…, LOCALE)` of `ui/format.js`, only here.
    3. `server/src/server.ts`: `GET /`, `GET /client.js`, `GET /list-data`, `PUBLIC_DIR`; `routeLabel` knows these routes.
    4. `ssr/client.ts`, `server/scripts/build-client.mjs`, the scripts `"build:client"` and `"start"`; `scripts/build.mjs` carries `react`, `react-dom`, `scheduler` and the minified client; version `1.2.0`; `server/public/` in `.gitignore` and ESLint's `ignores`; `"ssr/**/*.ts"` in `tsconfig.json`.
    5. `server/tests/ssr.test.ts`; `docs/rsc.md`.
    6. The mismatch: in `ssr/client.ts` after `const data = …` — `data.wishes = data.wishes.map((wish) => ({ ...wish, priceText: wish.price === null ? wish.priceText : wish.price.toLocaleString(undefined, { style: "currency", currency: "UAH" }) }));`, `npm run build:client`, reload; find it, remove it.
    7. `docs/server.md`, a section "NO-13"; the commit of the intro.

    The test names for step 10 of the intro are those of the intro (they come from this project).

    **Self-check — confirm every item yourself:**

    - `npm test` in `server/` — `ℹ tests 74`, `ℹ fail 0`; in the project folder — `failed: 0`, `npm run lint` — no errors.
    - `curl -sS http://127.0.0.1:4311/` — `#root` already holds the wish cards, followed by `<script id="initial-data" type="application/json">`.
