# checks). Checked on macOS on the scratch project of this capstone after NO-12, in a Ukrainian and an English
# workspace, on Node.js 25.2.1 and 22.13.1: npm test of the web project (37) and of server/ (74, of them 8 in
# tests/ssr.test.ts), npm run check, npm run check:server, npm run lint, npm run build:client, npm run ci (the
# artifact 1.2.0, 1554181 bytes), curl of GET /, and in Chrome 154 (playwright-core, channel "chrome"): the page
# with /client.js held back 2 s (a click before hydration sent nothing, hydrated, the same button node, a click
# after: PATCH and 285 ₴), the injected mismatch (the Console line in the intro), the same component formatting
