instructions:
  uk: |
    Відрендери на сервері список бажань — назва, ціна або «%%noPrice%%», позначка «%%acquiredMark%%» — із серіалізованих початкових даних, гідратуй перемикач `acquired` і знайди навмисну невідповідність через ціну, відформатовану типовою локаллю клієнта. Платформа цей крок не перевіряє.

    1. `ui/WishListPage.ts`: `PublicWish` (`id`, `name`, `price`, `priceText`, `acquired`), `ListPageData` (`requestId`, `wishes`, `count`, `wantedTotalText`), `WishListPage`, `clientElement(data)`; перемикач — `PATCH /v1/records/:id {acquired}`, потім `GET /list-data`.
    2. `server/src/page.ts`: `toInitialData`, `serializeForHtml`, `escapeHtml`, `renderPage`, `fallbackPage`; ціни й сума бажаних — `formatPrice(…, LOCALE)` з `ui/format.js`, лише тут.
    3. `server/src/server.ts`: `GET /`, `GET /client.js`, `GET /list-data`, `PUBLIC_DIR`; `routeLabel` знає ці маршрути.
    4. `ssr/client.ts`, `server/scripts/build-client.mjs`, скрипти `"build:client"` і `"start"`; `scripts/build.mjs` несе `react`, `react-dom`, `scheduler` і мініфікований клієнт; версія `1.2.0`; `server/public/` — у `.gitignore` і `ignores` ESLint; `"ssr/**/*.ts"` — у `tsconfig.json`.
    5. `server/tests/ssr.test.ts`; `docs/rsc.md`.
    6. Невідповідність: у `ssr/client.ts` після `const data = …` — `data.wishes = data.wishes.map((wish) => ({ ...wish, priceText: wish.price === null ? wish.priceText : wish.price.toLocaleString(undefined, { style: "currency", currency: "UAH" }) }));`, `npm run build:client`, перезавантаж; знайди, прибери.
    7. `docs/server.md`, розділ «NO-13»; commit з інтро.

    Назви тестів для кроку 10 інтро — ті самі, що в інтро (вони з цього проєкту).

