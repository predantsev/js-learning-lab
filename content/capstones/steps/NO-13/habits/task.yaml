# Habit tracker variant of step NO-13 (a local step: done in the learner's editor, terminal and browser; no
# platform checks). Checked on macOS on the scratch project of this capstone after NO-12, in a Ukrainian and an
# English workspace, on Node.js 25.2.1 and 22.13.1: npm test of the web project (38) and of server/ (87, of them 8
# in tests/ssr.test.ts), npm run check, npm run check:server, npm run lint, npm run build:client, the release
# build (react 19.3.0, react-dom 19.3.0, scheduler 0.28.0; started on Node.js 22.13.1 with no flag), curl of
# GET /, and in Chrome 154 (playwright-core, channel "chrome", the server with TODAY=2026-03-02): /client.js held
# back 2 s (a click before hydration sent nothing, hydrated, the same button node, a click after: POST
# …/completions and "Сьогодні виконано: 1"), the injected mismatch (+ "серія, днів: 0" / - "серія, днів: 3").
# Wrong variants run against tests/ssr.test.ts, each failed at least one test: the wishlist's list (see its task
# header) plus the streak counted on the server's clock, the configured day ignored, doneToday not set. Not run
# on Linux or Windows.
instructions:
  uk: |
    Відрендери на сервері звички із серіями, обчисленими з `completions` для дня, який передає сервер, гідратуй кнопку «виконано сьогодні» й знайди навмисну невідповідність через серію, яку клієнт перераховує з `Date.now()`. Платформа цей крок не перевіряє.

    1. `ui/HabitListPage.ts`: `PublicHabit` (`id`, `name`, `completions`, `streak`, `doneToday`), `ListPageData` (`requestId`, `today`, `todayText`, `habits`, `count`, `doneTodayCount`), `HabitListPage`, `clientElement(data)`; кнопка — `POST /v1/records/:id/completions {day: data.today}`, потім `GET /list-data`.
    2. `server/src/page.ts`: `toInitialData` — день сервер бере один раз на запит (`TODAY` з конфігурації, інакше власну локальну дату), серію рахує `streakOf` з `ui/streak.ts` на цей день, `todayText` форматує сам; `serializeForHtml`, `escapeHtml`, `renderPage`, `fallbackPage`.
    3. `server/src/server.ts`: `GET /`, `GET /client.js`, `GET /list-data`, `PUBLIC_DIR`; `routeLabel` знає ці маршрути.
    4. `ssr/client.ts`, `server/scripts/build-client.mjs`, скрипти `"build:client"` і `"start"`; реліз несе `react`, `react-dom`, `scheduler` і мініфікований клієнт; версія `1.2.0`; `server/public/` — у `.gitignore` і `ignores` ESLint; `"ssr/**/*.ts"` — у `tsconfig.json`.
    5. `server/tests/ssr.test.ts`; `docs/rsc.md`.
    6. Невідповідність: сервер запусти з `TODAY=2026-03-02`, а в `ssr/client.ts` (з `import { streakOf } from "../ui/streak.ts";`) після `const data = …` перерахуй кожну серію на день годинника: `const clientDay = new Date(Date.now()).toISOString().slice(0, 10); data.habits = data.habits.map((habit) => ({ ...habit, streak: streakOf(habit.completions, clientDay) }));`, `npm run build:client`, перезавантаж; знайди, прибери.
    7. `docs/server.md`, розділ «NO-13»; commit з інтро.

    Назви тестів для кроку 10 інтро — ті самі, що в інтро; тест невідповідності — `a client that recomputes the streaks for its own day renders other markup: that is the mismatch hydration reports`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` у `server/` — `ℹ tests 87`, `ℹ fail 0`; у теці проєкту — `не пройшли: 0`, `npm run lint` — без помилок.
    - `curl -sS http://127.0.0.1:4311/` з `TODAY=2026-03-02` — у `#root` уже є звички із серіями й `Сьогодні виконано: 1` (h-03 позначено ще в кроці NO-06).
    - До завантаження `client.js` клік по «Позначити сьогодні: %%fixture1Name%%» не надсилає нічого; після `hydrated` — той самий вузол кнопки, у лозі `POST /v1/records/h-01/completions`, а `Сьогодні виконано: 2`.
    - Невідповідність у Console — `{"level":"warn","kind":"hydration","requestId":…}` з `+` (клієнт) і `-` (сервер) для серії; після виправлення — лише `hydrated`.
    - `grep -c "js-course/habits/server/data" server/public/client.js` — `0`.

    **Доказ:** commit, `docs/server.md` і `docs/rsc.md` із командами й побаченим виводом.
  en: |
    Server-render the habits with streaks computed from `completions` for a day the server supplies, hydrate the "done today" button and find a deliberate mismatch caused by a streak the client recomputes from `Date.now()`. The platform does not check this step.

    1. `ui/HabitListPage.ts`: `PublicHabit` (`id`, `name`, `completions`, `streak`, `doneToday`), `ListPageData` (`requestId`, `today`, `todayText`, `habits`, `count`, `doneTodayCount`), `HabitListPage`, `clientElement(data)`; the button — `POST /v1/records/:id/completions {day: data.today}`, then `GET /list-data`.
    2. `server/src/page.ts`: `toInitialData` — the server takes the day once per request (`TODAY` of the configuration, otherwise its own local date), computes the streak with `streakOf` of `ui/streak.ts` for that day and formats `todayText` itself; `serializeForHtml`, `escapeHtml`, `renderPage`, `fallbackPage`.
    3. `server/src/server.ts`: `GET /`, `GET /client.js`, `GET /list-data`, `PUBLIC_DIR`; `routeLabel` knows these routes.
    4. `ssr/client.ts`, `server/scripts/build-client.mjs`, the scripts `"build:client"` and `"start"`; the release carries `react`, `react-dom`, `scheduler` and the minified client; version `1.2.0`; `server/public/` in `.gitignore` and ESLint's `ignores`; `"ssr/**/*.ts"` in `tsconfig.json`.
    5. `server/tests/ssr.test.ts`; `docs/rsc.md`.
    6. The mismatch: start the server with `TODAY=2026-03-02`, and in `ssr/client.ts` (with `import { streakOf } from "../ui/streak.ts";`) after `const data = …` recompute every streak for the clock's day: `const clientDay = new Date(Date.now()).toISOString().slice(0, 10); data.habits = data.habits.map((habit) => ({ ...habit, streak: streakOf(habit.completions, clientDay) }));`, `npm run build:client`, reload; find it, remove it.
    7. `docs/server.md`, a section "NO-13"; the commit of the intro.

    The test names for step 10 of the intro are those of the intro; the mismatch test is `a client that recomputes the streaks for its own day renders other markup: that is the mismatch hydration reports`.

    **Self-check — confirm every item yourself:**

    - `npm test` in `server/` — `ℹ tests 87`, `ℹ fail 0`; in the project folder — `failed: 0`, `npm run lint` — no errors.
    - `curl -sS http://127.0.0.1:4311/` with `TODAY=2026-03-02` — `#root` already holds the habits with their streaks and the done-today count `1` (h-03 has been marked since step NO-06).
    - Before `client.js` loads, a click on "Mark today: %%fixture1Name%%" sends nothing; after `hydrated` — the same button node, `POST /v1/records/h-01/completions` in the log, and the done-today count `2`.
    - The mismatch in the Console — `{"level":"warn","kind":"hydration","requestId":…}` with `+` (the client) and `-` (the server) for a streak; after the fix — only `hydrated`.
    - `grep -c "js-course/habits/server/data" server/public/client.js` — `0`.

    **Evidence:** the commit, `docs/server.md` and `docs/rsc.md` with the commands and the output you saw.
