entry: index.html
title:
  uk: "Список, відрендерений на сервері: react-dom/server, гідратація, безпечні дані й одна невідповідність"
  en: "The list rendered on the server: react-dom/server, hydration, safe data and one mismatch"
intro:
  uk: |
    Сторінка зі списком твого проєкту тепер приходить із сервера вже готовою: `GET /` на `127.0.0.1:4311` рендерить спільний компонент через справжній `react-dom/server`, браузер малює список ще до JavaScript, а клієнтський вхід **гідратує** його — React чіпляє обробники до тих самих вузлів DOM. Межа даних — список дозволених полів у безпечному для HTML JSON; налаштування сервера в браузер не потрапляють. І одна навмисна невідповідність твого домену, яку ти знайдеш за звітом гідратації.

    | Проєкт | Що сторінка показує | Що гідратується | Навмисна невідповідність |
    |---|---|---|---|
    | Список бажань | назва, ціна або «без ціни», позначка `acquired` | перемикач `acquired` | клієнт форматує ціну своєю типовою локаллю |
    | Планувальник | справи з підписами термінів від `today` сервера | перемикач `done` | клієнт сам обчислює `today` |
    | Трекер звичок | звички із серіями на день, який передає сервер | «виконано сьогодні» | клієнт перераховує серію з `Date.now()` |
    | Трекер витрат | витрати й суми з `amountMinor` у локалі проєкту | фільтр категорії | клієнт форматує суми типовим `Intl` |

    Перевірено на macOS на всіх чотирьох проєктах в українському й англійському проєктах — на Node.js 25.2.1 і 22.13.1, React і react-dom 19.3.0 (це вже залежності твого вебпроєкту: `npm ls react-dom` → `react-dom@19.3.0`; нічого встановлювати не треба), esbuild 0.28.2, у Google Chrome 154. Нижче — «Список бажань» в українському проєкті на 25.2.1. На Linux, Windows та в інших браузерах не перевірялося.

    **1. Стан на початку.** `cd ~/js-course/<проєкт>`, `git status` — чисто, останній commit — `Record the production-mode rehearsal: CI, start, SIGTERM under load, restore drill, profile, rollback`.

    **2. Спільний компонент — `ui/<Список>Page.ts`.** Без JSX: Node запускає цей файл як є (знімає лише типи), а JSX Node не читає, тож `createElement` (`h`). Пропси — початкові дані сторінки, і **кожен текст, що має збігтися до символу, сервер уже відформатував** (гроші, підписи дат) — браузер до гідратації нічого не форматує й не бере з годинника. Одна функція `clientElement(data)` будує елемент для обох боків, тож два рендери не можуть розійтися. Після гідратації дія сторінки питає сервер (`PATCH`/`POST` з NO-06) і показує його нові дані з `GET /list-data`: сервер вирішує й рахує. Тексти — наявні `%%`-ключі проєкту (у референсі).

    **3. Сторінка на сервері — `server/src/page.ts`.** `toInitialData(records, requestId)` — **список дозволених** полів (нові об’єкти, не «усе, крім секрету») плюс `requestId`. `serializeForHtml(value)` — `JSON.stringify` і заміна `<`, `>`, `&`, U+2028, U+2029 на `\u003c`, `\u003e`, `\u0026`, `\u2028`, `\u2029`: дані не можуть закрити свій `<script>`, а `JSON.parse` повертає те саме значення (HTML-сутності всередині `<script>` не працюють). `renderPage(data)` — `<!doctype html>`, `<meta charset="utf-8">`, `<div id="root">` з розміткою `renderToString(clientElement(data))` і **нічим іншим** (навіть без переносу рядка), `<script id="initial-data" type="application/json">` і `<script type="module" src="/client.js">`. `fallbackPage(requestId)` — сторінка помилки лише з екранованим `requestId`.

    **4. Маршрути — `server/src/server.ts`.** `GET /` — спершу записи зі сховища, потім рендер (дані ніколи не вантажаться в компоненті); помилка рендера — `500` з `fallbackPage`, рядок помилки в лог, і сервер обслуговує далі. `GET /client.js` — зібраний клієнтський вхід з `server/public/` (`404` з підказкою, якщо не зібраний, а не падіння). `GET /list-data` — ті самі дані сторінки JSON-ом. Шаблони маршрутів `/`, `/client.js`, `/list-data` — у `routeLabel` метрик.

    **5. Клієнтський вхід — `ssr/client.ts`, `server/scripts/build-client.mjs`.** `JSON.parse(document.getElementById("initial-data").textContent)` і **один** `hydrateRoot(document.getElementById("root"), clientElement(data), { onRecoverableError })`: обробник пише в Console рядок `{"level":"warn","kind":"hydration","requestId",…,"componentStack"}` — `requestId` той самий, що в лозі сервера для цього `GET /`. Жодного `fetch` до гідратації, жодних своїх даних. `npm run build:client` у `server/` (`esbuild` з кореневого `node_modules`) — `public/client.js`, розробницька збірка: повідомлення React читабельні. Клієнт не імпортує жодного модуля сервера: якщо `node:`-модуль чи файл сервера прокрадеться, esbuild зупиниться. У `server/package.json` — `"build:client"`, а `"start"` — `node scripts/build-client.mjs && node src/server.ts`; `server/public/` — у `.gitignore` і в `ignores` ESLint; `"ssr/**/*.ts"` — в `include` `tsconfig.json` вебпроєкту.

    **6. Артефакт — `scripts/build.mjs`.** Сторінка рендериться `react-dom/server`, тож реліз несе `react`, `react-dom` і `scheduler` у своєму `node_modules` як `bundleDependencies` (артефакт стартує без `npm install`) і мініфікований клієнтський вхід. Версія сервера — `1.2.0`: `1.1.0` уже зайнята дефектним hotfix-ом із NO-12, а артефакт ніколи не перезбирається. З `NODE_ENV=production` React бере свою production-збірку — це той випадок, коли `NODE_ENV` важливий не нашому коду, а бібліотеці.

    **7. Тести — `server/tests/ssr.test.ts`.** Повний документ (`<!doctype html>`, charset, у `#root` — лише розмітка React, клієнтський вхід); розмітка дорівнює `renderToString(clientElement(дані з #initial-data))` — те, на що спирається гідратація; дані — лише публічні поля й `requestId`, шляху даних у сторінці немає; ворожа назва `</script><script>alert(1)</script>` лишається текстом, а `JSON.parse` повертає її точно; помилка рендера — `500` рівно з `fallbackPage(requestId)`, і наступний запит — `200`; `/list-data` — дані сховища, і після зміни теж; клієнт, що сам форматує (рахує) текст, рендерить іншу розмітку; бандл без `node:`-модулів і файлів сервера.

    **8. У браузері.** `npm start` у `server/`, `http://127.0.0.1:4311/`. У нас (Chrome 154, клієнтський вхід затримано на 2 с): список на сторінці одразу (`Бажань: 6 · Ще хочу на суму: 285 ₴` — Навушники позначено отриманими ще в кроці NO-06); клік «Позначити отриманим: Настільна лампа» до гідратації не надсилає нічого (у лозі немає `PATCH`); потім Console — `hydrated`, кнопка — той самий вузол DOM, що прислав сервер, клік надсилає `PATCH /v1/records/w-02`, і сторінка показує `240 ₴` з `/list-data`. `grep -c "js-course/wishlist/server/data" server/public/client.js` — `0`; у сирцях сторінки шляху даних теж немає.

    **9. Невідповідність — зламай навмисно й знайди.** У `ssr/client.ts` після читання даних додай рядок, що форматує ціну сам: `data.wishes = data.wishes.map((wish) => ({ ...wish, priceText: wish.price === null ? wish.priceText : wish.price.toLocaleString(undefined, { style: "currency", currency: "UAH" }) }));` (рядок твого домену — у завданні), `npm run build:client`, перезавантаж сторінку. Console:

    ```text
    {"level":"warn","kind":"hydration","requestId":"fe1c96a2-…","message":"Hydration failed because the server rendered text didn't match the client. As a result this tree will be regenerated on the client. …
      <WishListPage initial={{...}}>
            <li className="card" data-id="w-01">
              <p>
    +           Ціна: UAH 80.00
    -           Ціна: 80 ₴
    ```

    `+` — клієнт, `-` — сервер. `UAH 80.00` — у Chrome з англійською мовою інтерфейсу (так було в нас); з українською рядок клієнта — `+ Ціна: 80,00 грн`: типова локаль — мова браузера, і саме тому текст і не збігається. Шукай у порядку: сторінка із сервера (`curl` — що в `#root`), початкові дані (`#initial-data` — що прийшло в браузер), маршрут. Причина — на шляху даних, не в компоненті: клієнт має взяти текст таким, яким його надіслав сервер. Прибери рядок, збери, перезавантаж — `hydrated` і жодного попередження. Ще ми бачили: якщо компонент форматує ціну **на обох боках** з тією самою явною локаллю (`formatPrice(price, "uk-UA")`), тест розмітки в Node проходить (у Node обидва боки форматують однаково), а Chrome усе одно каже `+ Ціна: 80 грн` / `- Ціна: 80 ₴` — у Node і Chrome різні дані `Intl`. Текст, що має збігтися до символу, форматується один раз — на сервері. А скрипт, що додає атрибут вузлу сервера до гідратації, дає `A tree hydrated but some attributes of the server rendered HTML didn't match the client properties.` — так може зробити розширення браузера.

    **10. Спробуй зламати тести.** `JSON.stringify` замість `serializeForHtml` — `✖ a hostile name stays text: the data cannot close its <script>, and JSON.parse gives it back exactly`; увесь запис замість списку дозволених — `✖ the initial data is an allowlist: public fields only, the request id, no server setting`; перенос рядка в `#root` — `✖ the markup is exactly what the same element renders from the page's own data`; без `try`/`catch` навколо рендера — `✖ a render error answers a 500 page with only the request id, and the server goes on serving`. Назви тестів твого проєкту — у завданні. Поверни код.

    **11. RSC — аргумент, не код.** `docs/rsc.md`, 5–8 речень: які частини сторінки могли б стати серверними компонентами (те, що лише показує), що мусить лишитися клієнтським (дія з обробником і станом), які пропси завадили б (функції, екземпляри класів; прості об’єкти, рядки, числа, `Date` — проходять), чого це вимагає (bundler і фреймворк, що ріжуть граф модулів на `"use client"`, середовище RSC, закріплена версія React) і що дало б (менший бандл, менше гідратації — але не менше невідповідностей). Проєкт лишається на SSR, зібраному вручну.

    **12. Доказ і commit.** Вебпроєкт: `npm run typecheck`, `npm run lint`, `npm test`; `server/`: `npm run typecheck`, `npm test` — `fail 0`, `npm run ci` — артефакт `1.2.0`. У `docs/server.md` — розділ «NO-13»: `curl` сторінки, що показав браузер до й після гідратації, рядок невідповідності, перевірки сирців і бандла. `git add -A`, `git commit -m "Server-render the list page: react-dom/server on GET /, HTML-safe initial data, a hydrated toggle, a render error page"` (у трекері витрат — `a hydrated category filter` замість `a hydrated toggle`).

    **Самоперевірка:** `GET /` віддає готовий список до JavaScript; після гідратації — ті самі вузли, і дія йде на сервер; у даних сторінки — лише дозволені поля й `requestId`, а ворожий текст не закриває `<script>`; у сирцях і бандлі — жодного налаштування сервера; помилка рендера — `500` без подробиць, і сервер живе; навмисна невідповідність видна в Console з `+`/`-` і `requestId`, причину знайдено й прибрано на шляху даних.

    **Якщо щось не так:** `public/client.js is not built: run npm run build:client in server/` — збери клієнтський вхід. Сторінка без змін після кліку й без `hydrated` у Console — `client.js` не завантажився (вкладка Network) або впав до `hydrateRoot`. `Invalid hook call` на сервері — дві копії React (не встановлюй `react` окремо в `server/`: сервер бере його з `node_modules` вебпроєкту, як і компонент). `Could not resolve "node:…"` під час `build:client` — клієнт імпортує модуль сервера.

    Референс кроку — `Завантажити: NO-13 — Список, відрендерений на сервері: react-dom/server, гідратація, безпечні дані й одна невідповідність` після експорту; відкрий його після власної спроби.
  en: |
    Your project's list page now arrives from the server ready-made: `GET /` on `127.0.0.1:4311` renders the shared component with the real `react-dom/server`, the browser paints the list before any JavaScript, and the client entry **hydrates** it — React attaches the handlers to the same DOM nodes. The data boundary is an allowlist of fields in HTML-safe JSON; the server's settings never reach the browser. And one deliberate mismatch of your domain, which you find by the hydration report.

    | Project | What the page shows | What is hydrated | The deliberate mismatch |
    |---|---|---|---|
    | Wishlist | the name, the price or "no price", the `acquired` mark | the `acquired` toggle | the client formats the price in its default locale |
    | Planner | tasks with due labels from the server's `today` | the `done` toggle | the client computes `today` itself |
    | Habit tracker | habits with streaks for the day the server passes | "done today" | the client recomputes the streak from `Date.now()` |
    | Expense tracker | expenses and totals from `amountMinor` in the project's locale | the category filter | the client formats the totals with default `Intl` |

    Checked on macOS on all four projects in a Ukrainian and an English project — on Node.js 25.2.1 and 22.13.1, React and react-dom 19.3.0 (already your web project's dependencies: `npm ls react-dom` → `react-dom@19.3.0`; nothing to install), esbuild 0.28.2, in Google Chrome 154. Below is the Wishlist in a Ukrainian project on 25.2.1. Not checked on Linux, Windows or in other browsers.

    **1. The starting state.** `cd ~/js-course/<project>`, `git status` — clean, the last commit is `Record the production-mode rehearsal: CI, start, SIGTERM under load, restore drill, profile, rollback`.

    **2. The shared component — `ui/<List>Page.ts`.** No JSX: Node runs this file as it is (it strips only the types), and Node does not read JSX, so `createElement` (`h`). The props are the page's initial data, and **every text that must match to the character has already been formatted by the server** (money, date labels) — before hydration the browser formats nothing and reads no clock. One function, `clientElement(data)`, builds the element for both sides, so the two renders cannot drift apart. After hydration the page's action asks the server (`PATCH`/`POST` of NO-06) and shows its new data from `GET /list-data`: the server decides and counts. The texts are the project's existing `%%` keys (in the reference).

    **3. The page on the server — `server/src/page.ts`.** `toInitialData(records, requestId)` — an **allowlist** of fields (new objects, never "everything except the secret") plus the `requestId`. `serializeForHtml(value)` — `JSON.stringify` and `<`, `>`, `&`, U+2028, U+2029 turned into `\u003c`, `\u003e`, `\u0026`, `\u2028`, `\u2029`: the data cannot close its `<script>`, and `JSON.parse` gives back the same value (HTML entities do not work inside `<script>`). `renderPage(data)` — `<!doctype html>`, `<meta charset="utf-8">`, a `<div id="root">` with the markup of `renderToString(clientElement(data))` and **nothing else** (not even a line break), a `<script id="initial-data" type="application/json">` and `<script type="module" src="/client.js">`. `fallbackPage(requestId)` — an error page with only the escaped `requestId`.

    **4. Routes — `server/src/server.ts`.** `GET /` — the records from the store first, then the render (data is never loaded inside a component); a render error is a `500` with `fallbackPage`, an error line in the log, and the server goes on serving. `GET /client.js` — the built client entry from `server/public/` (a `404` with a hint when it is not built, not a crash). `GET /list-data` — the same page data as JSON. The route patterns `/`, `/client.js`, `/list-data` go into the metrics' `routeLabel`.

    **5. The client entry — `ssr/client.ts`, `server/scripts/build-client.mjs`.** `JSON.parse(document.getElementById("initial-data").textContent)` and **one** `hydrateRoot(document.getElementById("root"), clientElement(data), { onRecoverableError })`: the handler writes a Console line `{"level":"warn","kind":"hydration","requestId",…,"componentStack"}` — the same `requestId` the server log has for this `GET /`. No `fetch` before hydration, no data of its own. `npm run build:client` in `server/` (`esbuild` from the root `node_modules`) — `public/client.js`, a development build: React's messages stay readable. The client imports no server module: if a `node:` module or a server file sneaks in, esbuild stops. `server/package.json` gets `"build:client"`, and `"start"` becomes `node scripts/build-client.mjs && node src/server.ts`; `server/public/` goes into `.gitignore` and ESLint's `ignores`; `"ssr/**/*.ts"` into the `include` of the web project's `tsconfig.json`.

    **6. The artifact — `scripts/build.mjs`.** The page renders with `react-dom/server`, so the release carries `react`, `react-dom` and `scheduler` in its own `node_modules` as `bundleDependencies` (the artifact starts with no `npm install`) and the minified client entry. The server's version is `1.2.0`: `1.1.0` is taken by NO-12's defective hotfix, and an artifact is never rebuilt. With `NODE_ENV=production` React takes its production build — the case where `NODE_ENV` matters, not to our code, but to a library.

    **7. Tests — `server/tests/ssr.test.ts`.** A complete document (`<!doctype html>`, charset, only React's markup in `#root`, the client entry); the markup equals `renderToString(clientElement(the data of #initial-data))` — what hydration relies on; the data — only public fields and the `requestId`, no data path in the page; a hostile name `</script><script>alert(1)</script>` stays text, and `JSON.parse` gives it back exactly; a render error — a `500` that is exactly `fallbackPage(requestId)`, and the next request — `200`; `/list-data` — the store's data, after a change too; a client that formats (computes) a text itself renders other markup; a bundle without `node:` modules and server files.

    **8. In the browser.** `npm start` in `server/`, `http://127.0.0.1:4311/`. For us (Chrome 154, the client entry held back 2 s): the list is on the page at once (`Бажань: 6 · Ще хочу на суму: 285 ₴` in the Ukrainian project — the headphones were marked acquired in step NO-06 already); a click on the mark button of the desk lamp before hydration sends nothing (no `PATCH` in the log); then the Console says `hydrated`, the button is the same DOM node the server sent, a click sends `PATCH /v1/records/w-02`, and the page shows `240 ₴` from `/list-data`. `grep -c "js-course/wishlist/server/data" server/public/client.js` — `0`; the page source has no data path either.

    **9. The mismatch — break it on purpose and find it.** In `ssr/client.ts`, after reading the data, add a line that formats the price itself: `data.wishes = data.wishes.map((wish) => ({ ...wish, priceText: wish.price === null ? wish.priceText : wish.price.toLocaleString(undefined, { style: "currency", currency: "UAH" }) }));` (your domain's line is in the task), `npm run build:client`, reload the page. The Console (the Ukrainian project):

    ```text
    {"level":"warn","kind":"hydration","requestId":"fe1c96a2-…","message":"Hydration failed because the server rendered text didn't match the client. As a result this tree will be regenerated on the client. …
      <WishListPage initial={{...}}>
            <li className="card" data-id="w-01">
              <p>
    +           Ціна: UAH 80.00
    -           Ціна: 80 ₴
    ```

    `+` is the client, `-` the server. `UAH 80.00` is Chrome with an English interface (as ours was); with a Ukrainian one the client line is `+ Ціна: 80,00 грн`: the default locale is the browser’s language, which is exactly why the text does not match. Look in order: the page from the server (`curl` — what is in `#root`), the initial data (`#initial-data` — what came to the browser), the route. The cause is on the data's path, not in the component: the client must take the text as the server sent it. Remove the line, build, reload — `hydrated` and no warning. We also saw: when the component formats the price **on both sides** with the same explicit locale (`formatPrice(price, "uk-UA")`), the markup test in Node passes (in Node both sides format alike), and Chrome still says `+ Ціна: 80 грн` / `- Ціна: 80 ₴` — Node and Chrome carry different `Intl` data. Text that must match to the character is formatted once — on the server. And a script that adds an attribute to a server node before hydration gives `A tree hydrated but some attributes of the server rendered HTML didn't match the client properties.` — a browser extension can do that.

    **10. Try to break the tests.** `JSON.stringify` instead of `serializeForHtml` — `✖ a hostile name stays text: the data cannot close its <script>, and JSON.parse gives it back exactly`; the whole record instead of the allowlist — `✖ the initial data is an allowlist: public fields only, the request id, no server setting`; a line break in `#root` — `✖ the markup is exactly what the same element renders from the page's own data`; no `try`/`catch` around the render — `✖ a render error answers a 500 page with only the request id, and the server goes on serving`. The test names of your project are in the task. Put the code back.

    **11. RSC — an argument, not code.** `docs/rsc.md`, 5–8 sentences: which parts of the page could become server components (what only shows), what must stay a client component (the action with a handler and state), which props would stand in the way (functions, class instances; plain objects, strings, numbers, `Date` cross), what it takes (a bundler and a framework that cut the module graph at `"use client"`, an RSC runtime, a pinned React version) and what it would gain (a smaller bundle, less to hydrate — but not fewer mismatches). The project stays on hand-built SSR.

    **12. Evidence and the commit.** The web project: `npm run typecheck`, `npm run lint`, `npm test`; `server/`: `npm run typecheck`, `npm test` — `fail 0`, `npm run ci` — the artifact `1.2.0`. In `docs/server.md` — a section "NO-13": the `curl` of the page, what the browser showed before and after hydration, the mismatch line, the checks of the source and the bundle. `git add -A`, `git commit -m "Server-render the list page: react-dom/server on GET /, HTML-safe initial data, a hydrated toggle, a render error page"` (in the expense tracker `a hydrated category filter` instead of `a hydrated toggle`).

    **Self-check:** `GET /` sends the ready list before JavaScript; after hydration — the same nodes, and the action goes to the server; the page data has only the allowed fields and the `requestId`, and a hostile text does not close the `<script>`; no server setting in the source or the bundle; a render error is a `500` without details, and the server lives on; the deliberate mismatch shows in the Console with `+`/`-` and the `requestId`, its cause found and removed on the data's path.

    **If something goes wrong:** `public/client.js is not built: run npm run build:client in server/` — build the client entry. The page does not change after a click and the Console has no `hydrated` — `client.js` did not load (the Network panel) or failed before `hydrateRoot`. `Invalid hook call` on the server — two copies of React (do not install `react` into `server/` separately: the server takes it from the web project's `node_modules`, as the component does). `Could not resolve "node:…"` during `build:client` — the client imports a server module.

    The step's reference is `Download: NO-13 — The list rendered on the server: react-dom/server, hydration, safe data and one mismatch` after the export; open it after your own attempt.
