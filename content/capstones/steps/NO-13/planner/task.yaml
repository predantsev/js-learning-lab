# Planner variant of step NO-13 (a local step: done in the learner's editor, terminal and browser; no platform
# checks). Checked on macOS on the scratch project of this capstone after NO-12, in a Ukrainian and an English
# workspace, on Node.js 25.2.1 and 22.13.1: npm test of the web project (38) and of server/ (80, of them 8 in
# tests/ssr.test.ts), npm run check, npm run check:server, npm run lint, npm run build:client, the release build
# (react 19.3.0, react-dom 19.3.0, scheduler 0.28.0), curl of GET / with TODAY=2026-03-02, and in Chrome 154
# (playwright-core, channel "chrome", the server with TODAY=2026-03-02): /client.js held back 2 s (a click before
# hydration sent nothing, hydrated, the same button node, a click after: PATCH and "…: 1"), the injected
# mismatch (+ "…: 3" / - "…: 2", the browser's clock on 2026-10-05). The release also started on Node.js 22.13.1
# with no flag and without TODAY: the server's own local day. Wrong variants run against tests/ssr.test.ts, each
# failed at least one test: the wishlist's list (see its task header) plus the component taking the day from the
# clock, the server ignoring TODAY, the due rule with < instead of <=. Not run on Linux or Windows.
instructions:
  uk: |
    Відрендери на сервері список справ із підписами термінів (`dueDate`), обчисленими від значення `today`, яке передає сервер, гідратуй перемикач `done` і знайди навмисну невідповідність через те, що клієнт сам обчислює `today`. Платформа цей крок не перевіряє.

    1. `ui/TaskListPage.ts`: `PublicTask` (`id`, `title`, `dueDate`, `dueText`, `done`), `ListPageData` (`requestId`, `today`, `todayText`, `tasks`), `countDue(tasks, day)`, `TaskListPage`, `clientElement(data)`; перемикач — `PATCH /v1/records/:id {done}`, потім `GET /list-data`.
    2. `server/src/page.ts`: `toInitialData` — `today` сервер бере один раз на запит (`TODAY` з конфігурації, інакше власну локальну дату) і сам форматує `todayText` і `dueText`; `priority` у дані не йде (сторінка його не показує); `serializeForHtml`, `escapeHtml`, `renderPage`, `fallbackPage`.
    3. `server/src/server.ts`: `GET /`, `GET /client.js`, `GET /list-data`, `PUBLIC_DIR`; `routeLabel` знає ці маршрути.
    4. `ssr/client.ts`, `server/scripts/build-client.mjs`, скрипти `"build:client"` і `"start"`; реліз несе `react`, `react-dom`, `scheduler` і мініфікований клієнт; версія `1.2.0`; `server/public/` — у `.gitignore` і `ignores` ESLint; `"ssr/**/*.ts"` — у `tsconfig.json`.
    5. `server/tests/ssr.test.ts`; `docs/rsc.md`.
    6. Невідповідність: сервер запусти з `TODAY=2026-03-02` (`TODAY=2026-03-02 npm start` у `server/`), а в `ssr/client.ts` після `const data = …` додай `data.today = new Date().toISOString().slice(0, 10);`, `npm run build:client`, перезавантаж; знайди, прибери. Вона видна лише тоді, коли день браузера не збігається з днем сервера.
    7. `docs/server.md`, розділ «NO-13»; commit з інтро.

    Назви тестів для кроку 10 інтро — ті самі, що в інтро; тест невідповідності — `a client that takes the day from its own clock renders other markup: that is the mismatch hydration reports`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` у `server/` — `ℹ tests 80`, `ℹ fail 0`; у теці проєкту — `не пройшли: 0`, `npm run lint` — без помилок.
    - `curl -sS http://127.0.0.1:4311/` з `TODAY=2026-03-02` — у `#root` уже є `Треба зробити станом на 2 березня 2026 р.: 2`.
    - До завантаження `client.js` клік по «Позначити виконаною: %%fixture1Name%%» не надсилає нічого; після `hydrated` — той самий вузол кнопки, у лозі `PATCH /v1/records/t-01`, а рядок стає `…: 1`.
    - Невідповідність у Console — `{"level":"warn","kind":"hydration","requestId":…}` з `+` (клієнт, більше справ за його днем) і `-` (сервер); після виправлення — лише `hydrated`.
    - `grep -c "js-course/planner/server/data" server/public/client.js` — `0`.

    **Доказ:** commit, `docs/server.md` і `docs/rsc.md` із командами й побаченим виводом.
  en: |
    Server-render the task list with due labels (`dueDate`) computed from a `today` value the server passes in, hydrate the `done` toggle and find a deliberate mismatch caused by the client computing `today` on its own. The platform does not check this step.

    1. `ui/TaskListPage.ts`: `PublicTask` (`id`, `title`, `dueDate`, `dueText`, `done`), `ListPageData` (`requestId`, `today`, `todayText`, `tasks`), `countDue(tasks, day)`, `TaskListPage`, `clientElement(data)`; the toggle — `PATCH /v1/records/:id {done}`, then `GET /list-data`.
    2. `server/src/page.ts`: `toInitialData` — the server takes `today` once per request (`TODAY` of the configuration, otherwise its own local date) and formats `todayText` and `dueText` itself; `priority` stays out of the data (the page does not show it); `serializeForHtml`, `escapeHtml`, `renderPage`, `fallbackPage`.
    3. `server/src/server.ts`: `GET /`, `GET /client.js`, `GET /list-data`, `PUBLIC_DIR`; `routeLabel` knows these routes.
    4. `ssr/client.ts`, `server/scripts/build-client.mjs`, the scripts `"build:client"` and `"start"`; the release carries `react`, `react-dom`, `scheduler` and the minified client; version `1.2.0`; `server/public/` in `.gitignore` and ESLint's `ignores`; `"ssr/**/*.ts"` in `tsconfig.json`.
    5. `server/tests/ssr.test.ts`; `docs/rsc.md`.
    6. The mismatch: start the server with `TODAY=2026-03-02` (`TODAY=2026-03-02 npm start` in `server/`), and in `ssr/client.ts` after `const data = …` add `data.today = new Date().toISOString().slice(0, 10);`, `npm run build:client`, reload; find it, remove it. It shows only when the browser's day differs from the server's.
    7. `docs/server.md`, a section "NO-13"; the commit of the intro.

    The test names for step 10 of the intro are those of the intro; the mismatch test is `a client that takes the day from its own clock renders other markup: that is the mismatch hydration reports`.

    **Self-check — confirm every item yourself:**

    - `npm test` in `server/` — `ℹ tests 80`, `ℹ fail 0`; in the project folder — `failed: 0`, `npm run lint` — no errors.
    - `curl -sS http://127.0.0.1:4311/` with `TODAY=2026-03-02` — `#root` already holds the due line of 2 March 2026 with `2`.
    - Before `client.js` loads, a click on "Mark as done: %%fixture1Name%%" sends nothing; after `hydrated` — the same button node, `PATCH /v1/records/t-01` in the log, and the due count becomes `1`.
    - The mismatch in the Console — `{"level":"warn","kind":"hydration","requestId":…}` with `+` (the client: more tasks due by its day) and `-` (the server); after the fix — only `hydrated`.
    - `grep -c "js-course/planner/server/data" server/public/client.js` — `0`.

    **Evidence:** the commit, `docs/server.md` and `docs/rsc.md` with the commands and the output you saw.
