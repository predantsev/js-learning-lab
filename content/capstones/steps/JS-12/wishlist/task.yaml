feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там помилка завантаження `ui/format.js`, то файл лежить не в теці `ui/` або в `import` бракує `./format.js`."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. If it shows a loading error for `ui/format.js`, the file is not in the folder `ui/` or the `import` lacks `./format.js`."
  - when: { test: "validateItem accepts only whole prices" }
    message:
      uk: "Ця перевірка чекає від `validateItem` для цін `12.5` і `0.1 + 0.2` результат `{ ok: false, errors: { price: \"not-whole\" } }`, а для `12`, `0` і `null` — `ok: true`. Перевіряй `Number.isInteger(price)` лише для ціни, що не `null`."
      en: "This check expects `validateItem` to give `{ ok: false, errors: { price: \"not-whole\" } }` for the prices `12.5` and `0.1 + 0.2`, and `ok: true` for `12`, `0` and `null`. Check `Number.isInteger(price)` only for a price that is not `null`."
  - when: { test: "searchKey normalizes, trims and lowercases" }
    message:
      uk: "Ця перевірка чекає іменований експорт `searchKey` у `domain/wishes.js` і однаковий ключ для тексту, набраного складеними й розкладеними літерами: `searchKey(\" ЧАИ\\u0306НИК \")` дає `\"чайник\"` з «й» одним символом, а `searchKey(\"Cafe\\u0301\")` — `\"café\"` з «é» одним символом. Для цього потрібні `normalize(\"NFC\")`, `trim()` і `toLowerCase()`."
      en: "This check expects a named export `searchKey` in `domain/wishes.js` and the same key for text typed with composed and decomposed letters: `searchKey(\" ЧАИ\\u0306НИК \")` gives `\"чайник\"` with “й” as one character, and `searchKey(\"Cafe\\u0301\")` gives `\"café\"` with “é” as one character. That needs `normalize(\"NFC\")`, `trim()` and `toLowerCase()`."
  - when: { test: "searchItems compares search keys of the name and the category" }
    message:
      uk: "Ця перевірка шукає в списку, де назву збережено розкладеними літерами (`\"Чаи\\u0306ник\"`), і чекає, що запит `\"чайник\"` і `\" ЧАИ\\u0306 \"` її знаходять, що запити `\"кухня\"` і `\" ДІМ\"` знаходять бажання за категорією, а порожній запит лишає всі бажання. Обидва боки порівняння — і запит, і поле — проходять через `searchKey`."
      en: "This check searches a list where a name is stored with decomposed letters (`\"Чаи\\u0306ник\"`), and expects the queries `\"чайник\"` and `\" ЧАИ\\u0306 \"` to find it, the queries `\"кухня\"` and `\" ДІМ\"` to find a wish by its category, and an empty query to keep every wish. Both sides of the comparison — the query and the field — go through `searchKey`."
  - when: { test: "indexById builds a Map from id to wish" }
    message:
      uk: "Ця перевірка чекає, що `indexById(list)` повертає `Map` (а не звичайний об’єкт) розміру 6 для шести бажань, що `get(\"w-03\")` дає той самий об’єкт, що в списку, а з двох бажань з однаковим `id` лишається перше. Для `[]` розмір — `0`."
      en: "This check expects `indexById(list)` to return a `Map` (not a plain object) of size 6 for six wishes, `get(\"w-03\")` to give the very object of the list, and of two wishes with the same `id` the first one to stay. For `[]` the size is `0`."
  - when: { test: "categoriesInUse builds a Set of the categories" }
    message:
      uk: "Ця перевірка чекає, що `categoriesInUse(list)` повертає `Set` із категоріями шести початкових бажань у порядку першої появи — «%%techCategory%%», «%%homeCategory%%», «%%sportCategory%%», «%%booksCategory%%» (без повторного «%%homeCategory%%» і без `null`), а для бажання без категорії — порожній `Set`."
      en: "This check expects `categoriesInUse(list)` to return a `Set` with the categories of the six starting wishes in the order they first appear — “%%techCategory%%”, “%%homeCategory%%”, “%%sportCategory%%”, “%%booksCategory%%” (no second “%%homeCategory%%” and no `null`), and an empty `Set` for a wish without a category."
  - when: { test: "formatPrice shows whole hryvnias through Intl" }
    message:
      uk: "Ця перевірка імпортує `ui/format.js`, викликає `formatPrice` для `1250`, `80` і `0` з `\"uk-UA\"` та `\"en-US\"` і чекає той самий текст, що дає `new Intl.NumberFormat(locale, { style: \"currency\", currency: \"UAH\", maximumFractionDigits: 0 })`, наприклад «1 250 ₴»."
      en: "This check imports `ui/format.js`, calls `formatPrice` for `1250`, `80` and `0` with `\"uk-UA\"` and `\"en-US\"`, and expects the same text that `new Intl.NumberFormat(locale, { style: \"currency\", currency: \"UAH\", maximumFractionDigits: 0 })` gives, for example “UAH 1,250”."
  - when: { test: "the cards and the summary show prices as money text" }
    message:
      uk: "Ця перевірка перезапускає сторінку з порожнім сховищем і чекає в картці `w-01` «%%valueLabel%%:» із ціною `80`, показаною через `formatPrice` з `\"%%formatLocale%%\"`, у картці `w-05` — «%%valueLabel%%: %%noPrice%%», а в підсумку — «%%summaryWantedTotal%%:» із сумою `365`, теж через `formatPrice`. Сховище при цьому не змінюється."
      en: "This check restarts the page with an empty storage and expects “%%valueLabel%%:” in the card `w-01` with the price `80` shown through `formatPrice` with `\"%%formatLocale%%\"`, “%%valueLabel%%: %%noPrice%%” in the card `w-05`, and “%%summaryWantedTotal%%:” in the summary with the sum `365`, also through `formatPrice`. The storage does not change meanwhile."
  - when: { test: "the form refuses a price with a fraction" }
    message:
      uk: "Ця перевірка вводить у форму «%%newName%%» з ціною `12.5` і чекає на сторінці «%%notWholeMessage%%», шість карток і нічого збереженого; потім із ціною `12` має з’явитися сьома картка. Для ключа `\"not-whole\"` `messageFor` має повертати «%%notWholeMessage%%»."
      en: "This check types “%%newName%%” with the price `12.5` into the form and expects “%%notWholeMessage%%” on the page, six cards and nothing saved; then with the price `12` a seventh card must appear. For the key `\"not-whole\"` `messageFor` must return “%%notWholeMessage%%”."
  - when: { test: "the category field suggests the categories in use" }
    message:
      uk: "Ця перевірка чекає, що поле «%%categoryFieldLabel%%» має атрибут `list` з `id` елемента `<datalist>`, у якому для шести початкових бажань є чотири `<option>` зі значеннями «%%techCategory%%», «%%homeCategory%%», «%%sportCategory%%», «%%booksCategory%%», а після нового бажання з категорією «Ігри» — п’ятий. Заповнюй `<datalist>` у `render()`."
      en: "This check expects the field “%%categoryFieldLabel%%” to have a `list` attribute with the `id` of a `<datalist>` element that holds four `<option>`s with the values “%%techCategory%%”, “%%homeCategory%%”, “%%sportCategory%%”, “%%booksCategory%%” for the six starting wishes, and a fifth one after a new wish with the category “Ігри”. Fill the `<datalist>` in `render()`."
  - when: { test: "your domain tests pass with a correct domain module" }
    message:
      uk: "Ця перевірка запускає `tests/domain.test.js` з версією `domain/wishes.js` від курсу й раннером курсу та чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку."
      en: "This check runs `tests/domain.test.js` with the course's version of `domain/wishes.js` and the course runner, and expects at least one test and none that fails. The message below names the failed test or the error."
  - when: { test: "your tests catch a search key without normalize" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `searchKey` не викликає `normalize(\"NFC\")`, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест, у якому з одного боку текст набрано розкладеними літерами (`\"%%unicodeWordDecomposed%%\"`), а з іншого — складеними."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `searchKey` does not call `normalize(\"NFC\")`, and expects at least one of your tests to fail. Only a test with text typed in decomposed letters (`\"%%unicodeWordDecomposed%%\"`) on one side and composed ones on the other notices this defect."
  - when: { test: "your tests catch a price check that accepts fractions" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/wishes.js`. Потім вона підставляє версію, де `validateItem` не перевіряє, що ціна ціла, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому ціна `12.5` дає помилку `\"not-whole\"`."
      en: "This check first expects all your tests to pass with the correct `domain/wishes.js`. Then it puts in a version where `validateItem` does not check that the price is whole, and expects at least one of your tests to fail. A test in which the price `12.5` gives the error `\"not-whole\"` notices this defect."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
