# Wishlist variant of step JS-12. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  formatLocale: { uk: "uk-UA", en: "en-US" }
  notWholeMessage: { uk: "Ціна — ціле число гривень, без копійок", en: "The price is a whole number of hryvnias, no kopiykas" }
  unicodeWord: { uk: "Чайник", en: "Café" }
  unicodeWordDecomposed: { uk: "Чаи\\u0306ник", en: "Cafe\\u0301" }
  unicodeKey: { uk: "чайник", en: "café" }
  unicodeQuery: { uk: "ЧАИ\\u0306НИК", en: "CAFE\\u0301" }
  unicodeCategory: { uk: "Кухня", en: "Kitchen" }
  unicodeCategoryQuery: { uk: "кухня", en: "kitchen" }
instructions:
  uk: |
    Ціни, пошук і показ бажань отримують суворі правила. Збережене значення лишається канонічним, а текст для людини робить лише сторінка.

    **1. Ціна — ціле число гривень або `null`.** У `validateItem` у `domain/wishes.js` додай після перевірки на від’ємну ціну ще одну: ціна, що не є цілим числом (`Number.isInteger`), дає помилку `"not-whole"`. Ціни `12.5` і `0.1 + 0.2` відхиляються, `12`, `0` і `null` — ні. На сторінці для цього ключа `messageFor` показує «%%notWholeMessage%%».

    **2. Пошук через ключ пошуку.** У `domain/wishes.js`:

    - `searchKey(text)` (іменований експорт) повертає `text.normalize("NFC")` без пробілів на краях і малими літерами. Так «й», набране одним символом і як «и» + комбінований знак (U+0306), дає той самий ключ.
    - `searchItems(list, query)` порівнює ключ запиту з ключем **назви або категорії** бажання (категорії може не бути — `null`). Порожній запит лишає всі бажання.

    **3. Індекси.** Іменовані експорти з `domain/wishes.js`:

    - `indexById(list)` повертає `Map` від `id` до бажання (того самого об’єкта зі списку); якщо два бажання мають той самий `id`, у `Map` лишається перше;
    - `categoriesInUse(list)` повертає `Set` категорій у порядку першої появи, без `null`.

    **4. Показ через `Intl`.** Новий модуль `ui/format.js` експортує `formatPrice(price, locale)`: `new Intl.NumberFormat(locale, { style: "currency", currency: "UAH", maximumFractionDigits: 0 }).format(price)`, наприклад «1 250 ₴» для `"uk-UA"`. У `ui/page.js` додай `const LOCALE = "%%formatLocale%%";` і показуй через `formatPrice` ціну в картці («%%valueLabel%%: …», бажання без ціни — як і раніше «%%noPrice%%») та суму «%%summaryWantedTotal%%» у підсумку. У сховищі ціни лишаються числами.

    **5. Сторінка використовує індекси.** `render()` будує `indexById(current)`, і кнопка «%%editLabel%%» бере бажання з цього `Map` через `get(id)`, а не шукає в масиві. Поле «%%categoryFieldLabel%%» дістає `list="category-options"`, а поруч — `<datalist id="category-options"></datalist>`: `render()` заповнює його елементами `<option>` з `value` для кожної категорії з `categoriesInUse(current)`, тож браузер підказує вже вжиті категорії.

    **6. Тести.** Допиши в `tests/domain.test.js` тести для `searchKey` і `searchItems` з текстом у двох формах Unicode та тест для ціни `12.5`. Щоб набрати в коді «розкладену» літеру, пиши її як `"%%unicodeWordDecomposed%%"`: `\u` і чотири цифри в тексті в лапках — це код символу, тут — комбінованого знака.

    **Як перевірятиметься.** Перевірки викликають твої функції з текстом у різних формах Unicode й регістрах, з дробовими й цілими цінами та перевіряють, що `indexById` і `categoriesInUse` повертають саме `Map` і `Set`. `formatPrice` порівнюють із тим самим `Intl.NumberFormat` для `"uk-UA"` і `"en-US"`. На сторінці перевірки дивляться на ціни в картках і підсумку, вводять ціну `12.5` і читають підказки поля категорії. Твої тести запускаються з версією `domain/wishes.js` від курсу (усі мають пройти), а потім із двома зламаними: без `normalize` у `searchKey` і з `validateItem`, що пропускає `12.5`, — з кожною хоча б один тест має впасти.
  en: |
    Prices, search and display of the wishes get strict rules. The stored value stays canonical, and only the page makes text for a person.

    **1. A price is a whole number of hryvnias or `null`.** In `validateItem` in `domain/wishes.js`, add one more check after the one for a negative price: a price that is not a whole number (`Number.isInteger`) gives the error `"not-whole"`. The prices `12.5` and `0.1 + 0.2` are rejected, `12`, `0` and `null` are not. On the page, `messageFor` shows “%%notWholeMessage%%” for this key.

    **2. Search through a search key.** In `domain/wishes.js`:

    - `searchKey(text)` (a named export) returns `text.normalize("NFC")` without spaces at the edges and in lower case. So “é” typed as one character and as “e” + a combining mark (U+0301) gives the same key.
    - `searchItems(list, query)` compares the key of the query with the key of the **name or the category** of a wish (the category may be missing — `null`). An empty query keeps every wish.

    **3. Indexes.** Named exports of `domain/wishes.js`:

    - `indexById(list)` returns a `Map` from `id` to the wish (the very object of the list); if two wishes have the same `id`, the first one stays in the `Map`;
    - `categoriesInUse(list)` returns a `Set` of the categories in the order they first appear, without `null`.

    **4. Display through `Intl`.** The new module `ui/format.js` exports `formatPrice(price, locale)`: `new Intl.NumberFormat(locale, { style: "currency", currency: "UAH", maximumFractionDigits: 0 }).format(price)`, for example “UAH 1,250” for `"en-US"`. In `ui/page.js` add `const LOCALE = "%%formatLocale%%";` and show through `formatPrice` the price in the card (“%%valueLabel%%: …”, a wish without a price shows “%%noPrice%%” as before) and the “%%summaryWantedTotal%%” sum in the summary. In the storage the prices stay numbers.

    **5. The page uses the indexes.** `render()` builds `indexById(current)`, and the “%%editLabel%%” button takes the wish from this `Map` with `get(id)` instead of searching the array. The field “%%categoryFieldLabel%%” gets `list="category-options"`, with a `<datalist id="category-options"></datalist>` next to it: `render()` fills it with `<option>` elements with a `value` for every category of `categoriesInUse(current)`, so the browser suggests the categories already in use.

    **6. Tests.** Add to `tests/domain.test.js` tests for `searchKey` and `searchItems` with text in two Unicode forms and a test for the price `12.5`. To type a “decomposed” letter in code, write it as `"%%unicodeWordDecomposed%%"`: `\u` and four digits inside quoted text are the code of a character, here of the combining mark.

    **How it is checked.** The checks call your functions with text in different Unicode forms and cases, with fractional and whole prices, and check that `indexById` and `categoriesInUse` return a real `Map` and `Set`. `formatPrice` is compared with the same `Intl.NumberFormat` for `"uk-UA"` and `"en-US"`. On the page the checks look at the prices in the cards and the summary, type the price `12.5` and read the suggestions of the category field. Your tests run with the course's version of `domain/wishes.js` (all must pass), then with two broken ones: without `normalize` in `searchKey`, and with a `validateItem` that lets `12.5` through — with each, at least one test must fail.
nudge:
  uk: "Два тексти, що однаково виглядають, можуть складатися з різних символів: порівняй `\"%%unicodeWord%%\".length` і `\"%%unicodeWordDecomposed%%\".length` у консолі. Тест, що ловить пошук без `normalize`, мусить мати «розкладений» текст з одного боку порівняння й «складений» — з іншого."
  en: "Two texts that look the same can consist of different characters: compare `\"%%unicodeWord%%\".length` and `\"%%unicodeWordDecomposed%%\".length` in the console. A test that catches a search without `normalize` needs the “decomposed” text on one side of the comparison and the “composed” one on the other."
