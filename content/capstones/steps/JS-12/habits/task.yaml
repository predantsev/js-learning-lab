feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там помилка завантаження `ui/format.js`, то файл лежить не в теці `ui/` або в `import` бракує `./format.js`."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. If it shows a loading error for `ui/format.js`, the file is not in the folder `ui/` or the `import` lacks `./format.js`."
  - when: { test: "uniqueSortedDays removes repeats and sorts" }
    message:
      uk: "Ця перевірка чекає іменований експорт `uniqueSortedDays` у `domain/habits.js`, що для `[\"2026-03-01\", \"2026-02-27\", \"2026-03-01\", \"2026-02-28\"]` дає новий масив `[\"2026-02-27\", \"2026-02-28\", \"2026-03-01\"]`, не змінюючи переданого, а для `[]` — `[]`."
      en: "This check expects a named export `uniqueSortedDays` in `domain/habits.js` that gives a new array `[\"2026-02-27\", \"2026-02-28\", \"2026-03-01\"]` for `[\"2026-03-01\", \"2026-02-27\", \"2026-03-01\", \"2026-02-28\"]` without changing the array passed in, and `[]` for `[]`."
  - when: { test: "completeHabit keeps the completions unique and sorted" }
    message:
      uk: "Ця перевірка позначає для `h-01` день `\"2026-02-25\"` (раніший за збережені) і чекає його першим у новому масиві дат; інші звички — ті самі об’єкти, а переданий список не змінюється. День, що вже є, лишає `h-01` тим самим об’єктом, а текст `\"2026-03-02T08:00\"` чи `\"1.03.2026\"` нічого не додає."
      en: "This check marks the day `\"2026-02-25\"` (earlier than the stored ones) for `h-01` and expects it first in the new array of dates; the other habits are the same objects, and the list passed in does not change. A day that is already there leaves `h-01` the same object, and the text `\"2026-03-02T08:00\"` or `\"1.03.2026\"` adds nothing."
  - when: { test: "isCalendarDate checks the whole text" }
    message:
      uk: "Ця перевірка чекає іменований експорт `isCalendarDate` у `domain/habits.js`: `true` для `\"2026-03-02\"` і `false` для `\"2026-03-02T10:00\"`, `\" 2026-03-02\"` та `null`. Шаблон без `^` на початку й `$` у кінці знаходить дату всередині довшого тексту."
      en: "This check expects a named export `isCalendarDate` in `domain/habits.js`: `true` for `\"2026-03-02\"` and `false` for `\"2026-03-02T10:00\"`, `\" 2026-03-02\"` and `null`. A pattern without `^` at the start and `$` at the end finds a date inside a longer text."
  - when: { test: "searchKey normalizes, trims and lowercases" }
    message:
      uk: "Ця перевірка чекає іменований експорт `searchKey` у `domain/habits.js` і однаковий ключ для тексту, набраного складеними й розкладеними літерами: `searchKey(\" ЧАИ\\u0306НИК \")` дає `\"чайник\"` з «й» одним символом, а `searchKey(\"Cafe\\u0301\")` — `\"café\"` з «é» одним символом. Для цього потрібні `normalize(\"NFC\")`, `trim()` і `toLowerCase()`."
      en: "This check expects a named export `searchKey` in `domain/habits.js` and the same key for text typed with composed and decomposed letters: `searchKey(\" ЧАИ\\u0306НИК \")` gives `\"чайник\"` with “й” as one character, and `searchKey(\"Cafe\\u0301\")` gives `\"café\"` with “é” as one character. That needs `normalize(\"NFC\")`, `trim()` and `toLowerCase()`."
  - when: { test: "searchHabits compares search keys of the name" }
    message:
      uk: "Ця перевірка шукає в списку, де назву збережено розкладеними літерами (`\"Чаи\\u0306ник помити\"`), і чекає, що запити `\"чайник\"` і `\" ЧАИ\\u0306 \"` її знаходять, запит `\"CAFE\\u0301\"` знаходить звичку «Café», а порожній запит лишає всі звички. Обидва боки порівняння — і запит, і назва — проходять через `searchKey`."
      en: "This check searches a list where a name is stored with decomposed letters (`\"Чаи\\u0306ник помити\"`), and expects the queries `\"чайник\"` and `\" ЧАИ\\u0306 \"` to find it, the query `\"CAFE\\u0301\"` to find the habit “Café”, and an empty query to keep every habit. Both sides of the comparison — the query and the name — go through `searchKey`."
  - when: { test: "indexById builds a Map from id to habit" }
    message:
      uk: "Ця перевірка чекає, що `indexById(list)` повертає `Map` (а не звичайний об’єкт) розміру 6 для шести звичок, що `get(\"h-03\")` дає той самий об’єкт, що в списку, а з двох звичок з однаковим `id` лишається перша. Для `[]` розмір — `0`."
      en: "This check expects `indexById(list)` to return a `Map` (not a plain object) of size 6 for six habits, `get(\"h-03\")` to give the very object of the list, and of two habits with the same `id` the first one to stay. For `[]` the size is `0`."
  - when: { test: "formatDay shows the long date through Intl" }
    message:
      uk: "Ця перевірка імпортує `ui/format.js`, викликає `formatDay` для `\"2026-03-01\"` і `\"2026-12-31\"` з `\"uk-UA\"` та `\"en-US\"` і чекає той самий текст, що дає `new Intl.DateTimeFormat(locale, { dateStyle: \"long\", timeZone: \"UTC\" })`, наприклад «1 березня 2026 р.»."
      en: "This check imports `ui/format.js`, calls `formatDay` for `\"2026-03-01\"` and `\"2026-12-31\"` with `\"uk-UA\"` and `\"en-US\"`, and expects the same text that `new Intl.DateTimeFormat(locale, { dateStyle: \"long\", timeZone: \"UTC\" })` gives, for example “March 1, 2026”."
  - when: { test: "formatDay shows the same day in every time zone" }
    message:
      uk: "Ця перевірка викликає `formatDay` так, ніби комп’ютер на 14 годин попереду UTC і на 11 годин позаду, і чекає той самий день, що за UTC. `new Date(\"2026-03-01\")` — північ за UTC; форматтер без `timeZone: \"UTC\"` показує її в часовому поясі комп’ютера, а на захід від UTC це ще 28 лютого."
      en: "This check calls `formatDay` as if the computer were 14 hours ahead of UTC and 11 hours behind it, and expects the same day as in UTC. `new Date(\"2026-03-01\")` is midnight in UTC; a formatter without `timeZone: \"UTC\"` shows it in the computer's time zone, and west of UTC that is still February 28."
  - when: { test: "the cards show the last completion as a long date" }
    message:
      uk: "Ця перевірка перезапускає сторінку з порожнім сховищем і чекає в картці `h-01` «%%lastDoneLabel%%:» з датою `\"2026-03-01\"`, показаною через `formatDay` з `\"%%formatLocale%%\"`, а в картці `h-06` без виконань — жодного «%%lastDoneLabel%%». Після «%%markTodayLabel%%» у картці `h-06` має з’явитися «%%lastDoneLabel%%:» з датою `\"2026-03-02\"`."
      en: "This check restarts the page with an empty storage and expects “%%lastDoneLabel%%:” in the card `h-01` with the date `\"2026-03-01\"` shown through `formatDay` with `\"%%formatLocale%%\"`, and no “%%lastDoneLabel%%” in the card `h-06`, which has no completions. After “%%markTodayLabel%%” the card `h-06` must show “%%lastDoneLabel%%:” with the date `\"2026-03-02\"`."
  - when: { test: "your domain tests pass with a correct domain module" }
    message:
      uk: "Ця перевірка запускає `tests/domain.test.js` з версією `domain/habits.js` від курсу й раннером курсу та чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку."
      en: "This check runs `tests/domain.test.js` with the course's version of `domain/habits.js` and the course runner, and expects at least one test and none that fails. The message below names the failed test or the error."
  - when: { test: "your tests catch a search key without normalize" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js`. Потім вона підставляє версію, де `searchKey` не викликає `normalize(\"NFC\")`, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест, у якому з одного боку текст набрано розкладеними літерами (`\"%%unicodeWordDecomposed%%\"`), а з іншого — складеними."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js`. Then it puts in a version where `searchKey` does not call `normalize(\"NFC\")`, and expects at least one of your tests to fail. Only a test with text typed in decomposed letters (`\"%%unicodeWordDecomposed%%\"`) on one side and composed ones on the other notices this defect."
  - when: { test: "your tests catch completions that are not sorted" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/habits.js`. Потім вона підставляє версію, де `uniqueSortedDays` прибирає повтори, але не сортує, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому `completeHabit` отримує день, раніший за збережені."
      en: "This check first expects all your tests to pass with the correct `domain/habits.js`. Then it puts in a version where `uniqueSortedDays` removes repeats but does not sort, and expects at least one of your tests to fail. A test in which `completeHabit` gets a day earlier than the stored ones notices this defect."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
