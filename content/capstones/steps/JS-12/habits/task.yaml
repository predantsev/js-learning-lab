# Habits variant of step JS-12. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  formatLocale: { uk: "uk-UA", en: "en-US" }
  lastDoneLabel: { uk: "Востаннє виконано", en: "Last completed" }
  unicodeWord: { uk: "Чайник", en: "Café" }
  unicodeWordDecomposed: { uk: "Чаи\\u0306ник", en: "Cafe\\u0301" }
  unicodeKey: { uk: "чайник", en: "café" }
  unicodeQuery: { uk: "ЧАИ\\u0306НИК", en: "CAFE\\u0301" }
instructions:
  uk: |
    Дати виконань, пошук і показ звичок отримують суворі правила. Збережене значення лишається канонічним, а текст для людини робить лише сторінка.

    **1. Дати виконань — унікальні відсортовані дати `"YYYY-MM-DD"`.** У `domain/habits.js` додай іменовані експорти:

    - `isCalendarDate(value)` — `true` лише для тексту рівно вигляду `"YYYY-MM-DD"`: шаблон `/^\d{4}-\d{2}-\d{2}$/`, де `^` і `$` не пускають нічого до й після дати;
    - `uniqueSortedDays(days)` — новий масив тих самих днів без повторів (через `Set`) і за зростанням (`toSorted()`: текст `"YYYY-MM-DD"` сортується так само, як дати); переданий масив не змінюється.

    Перепиши `completeHabit(list, id, day)`: текст, що не є календарною датою, нічого не змінює (функція повертає той самий список); день, що вже є, теж нічого не змінює; інакше звичка отримує новий масив `uniqueSortedDays([...completions, day])`. Тепер і раніший день стає на своє місце — припущення «день завжди сьогоднішній» більше не потрібне. Часових поясів тут немає: «сьогодні» сторінка передає параметром.

    **2. Пошук через ключ пошуку.** У `domain/habits.js`:

    - `searchKey(text)` (іменований експорт) повертає `text.normalize("NFC")` без пробілів на краях і малими літерами. Так «й», набране одним символом і як «и» + комбінований знак (U+0306), дає той самий ключ.
    - `searchHabits(list, query)` порівнює ключ запиту з ключем назви звички. Порожній запит лишає всі звички.

    **3. Індекс.** Іменований експорт `indexById(list)` повертає `Map` від `id` до звички (того самого об’єкта зі списку); якщо дві звички мають той самий `id`, у `Map` лишається перша.

    **4. Показ через `Intl`.** Новий модуль `ui/format.js` експортує `formatDay(day, locale)`: `new Intl.DateTimeFormat(locale, { dateStyle: "long", timeZone: "UTC" }).format(new Date(day))`, наприклад «1 березня 2026 р.» для `"uk-UA"`. `new Date("2026-03-01")` — це північ за UTC, тож і показувати треба за UTC: без `timeZone: "UTC"` комп’ютер на захід від UTC покаже 28 лютого. У `ui/page.js` додай `const LOCALE = "%%formatLocale%%";`, а картка звички з виконаннями показує ще й «%%lastDoneLabel%%: » та останню дату `completions` через `formatDay` (дати відсортовані, тож остання — найпізніша).

    **5. Сторінка використовує індекс.** `render()` будує `indexById(current)`, і кнопка «%%editLabel%%» бере звичку із цього `Map` через `get(id)`, а не шукає в масиві.

    **6. Тести.** Допиши в `tests/domain.test.js` тест для `completeHabit` з днем, раніший за збережені, і тести для `searchKey` і `searchHabits` з текстом у двох формах Unicode. Щоб набрати в коді «розкладену» літеру, пиши її як `"%%unicodeWordDecomposed%%"`: `\u` і чотири цифри в тексті в лапках — це код символу, тут — комбінованого знака.

    **Як перевірятиметься.** Перевірки викликають твої функції з повторними, ранішими й неправильними датами та з текстом у різних формах Unicode й регістрах і перевіряють, що `indexById` повертає саме `Map`. `formatDay` порівнюють із тим самим `Intl.DateTimeFormat` для `"uk-UA"` і `"en-US"` і викликають так, ніби комп’ютер на 14 годин попереду UTC і на 11 годин позаду. На сторінці перевірки дивляться на «%%lastDoneLabel%%» у картках і натискають «%%markTodayLabel%%». Твої тести запускаються з версією `domain/habits.js` від курсу (усі мають пройти), а потім із двома зламаними: без `normalize` у `searchKey` і з `uniqueSortedDays`, що не сортує, — з кожною хоча б один тест має впасти.
  en: |
    Completion dates, search and display of the habits get strict rules. The stored value stays canonical, and only the page makes text for a person.

    **1. Completions are unique, sorted `"YYYY-MM-DD"` dates.** In `domain/habits.js` add the named exports:

    - `isCalendarDate(value)` — `true` only for text of exactly the form `"YYYY-MM-DD"`: the pattern `/^\d{4}-\d{2}-\d{2}$/`, where `^` and `$` let nothing in before or after the date;
    - `uniqueSortedDays(days)` — a new array of the same days without repeats (through a `Set`) and in ascending order (`toSorted()`: `"YYYY-MM-DD"` text sorts the same way as the dates); the array passed in does not change.

    Rewrite `completeHabit(list, id, day)`: text that is not a calendar date changes nothing (the function returns the same list); a day that is already there changes nothing either; otherwise the habit gets the new array `uniqueSortedDays([...completions, day])`. Now an earlier day also lands in its place — the assumption “the day is always today” is no longer needed. There are no time zones here: the page passes “today” as a parameter.

    **2. Search through a search key.** In `domain/habits.js`:

    - `searchKey(text)` (a named export) returns `text.normalize("NFC")` without spaces at the edges and in lower case. So “é” typed as one character and as “e” + a combining mark (U+0301) gives the same key.
    - `searchHabits(list, query)` compares the key of the query with the key of the habit's name. An empty query keeps every habit.

    **3. An index.** The named export `indexById(list)` returns a `Map` from `id` to the habit (the very object of the list); if two habits have the same `id`, the first one stays in the `Map`.

    **4. Display through `Intl`.** The new module `ui/format.js` exports `formatDay(day, locale)`: `new Intl.DateTimeFormat(locale, { dateStyle: "long", timeZone: "UTC" }).format(new Date(day))`, for example “March 1, 2026” for `"en-US"`. `new Date("2026-03-01")` is midnight in UTC, so it must also be shown in UTC: without `timeZone: "UTC"` a computer west of UTC shows February 28. In `ui/page.js` add `const LOCALE = "%%formatLocale%%";`, and the card of a habit with completions also shows “%%lastDoneLabel%%: ” and the last date of `completions` through `formatDay` (the dates are sorted, so the last one is the latest).

    **5. The page uses the index.** `render()` builds `indexById(current)`, and the “%%editLabel%%” button takes the habit from this `Map` with `get(id)` instead of searching the array.

    **6. Tests.** Add to `tests/domain.test.js` a test for `completeHabit` with a day earlier than the stored ones and tests for `searchKey` and `searchHabits` with text in two Unicode forms. To type a “decomposed” letter in code, write it as `"%%unicodeWordDecomposed%%"`: `\u` and four digits inside quoted text are the code of a character, here of the combining mark.

    **How it is checked.** The checks call your functions with repeated, earlier and invalid dates and with text in different Unicode forms and cases, and check that `indexById` returns a real `Map`. `formatDay` is compared with the same `Intl.DateTimeFormat` for `"uk-UA"` and `"en-US"` and is called as if the computer were 14 hours ahead of UTC and 11 hours behind it. On the page the checks look at “%%lastDoneLabel%%” in the cards and press “%%markTodayLabel%%”. Your tests run with the course's version of `domain/habits.js` (all must pass), then with two broken ones: without `normalize` in `searchKey`, and with a `uniqueSortedDays` that does not sort — with each, at least one test must fail.
nudge:
  uk: "Дефект «не сортує» видно лише тоді, коли новий день раніший за збережені: день у кінці списку й так стоїть на своєму місці. А тест, що ловить пошук без `normalize`, мусить мати «розкладений» текст з одного боку порівняння й «складений» — з іншого: порівняй `\"%%unicodeWord%%\".length` і `\"%%unicodeWordDecomposed%%\".length` у консолі."
  en: "The “does not sort” defect shows only when the new day is earlier than the stored ones: a day at the end of the list is in its place anyway. And a test that catches a search without `normalize` needs the “decomposed” text on one side of the comparison and the “composed” one on the other: compare `\"%%unicodeWord%%\".length` and `\"%%unicodeWordDecomposed%%\".length` in the console."
