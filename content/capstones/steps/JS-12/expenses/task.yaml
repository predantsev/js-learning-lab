# Expenses variant of step JS-12. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  formatLocale: { uk: "uk-UA", en: "en-US" }
  badDateMessage: { uk: "Вкажи дату витрати", en: "Enter the date of the expense" }
  unicodeWord: { uk: "Чайник", en: "Café" }
  unicodeWordDecomposed: { uk: "Чаи\\u0306ник", en: "Cafe\\u0301" }
  unicodeKey: { uk: "чайник", en: "café" }
  unicodeQuery: { uk: "ЧАИ\\u0306НИК", en: "CAFE\\u0301" }
instructions:
  uk: |
    Суми, дати, пошук і показ витрат отримують суворі правила. Збережене значення лишається канонічним — цілі копійки й дата `"YYYY-MM-DD"`, — а текст для людини робить лише сторінка.

    **1. Сума з введення — без дробових чисел.** У `domain/expenses.js` додай іменований експорт `parseAmountMinor(text)`: текст суми в гривнях стає цілими копійками, а дробового числа на цьому шляху немає. Обріж пробіли на краях і зістав текст із шаблоном `/^(\d+)(?:[.,](\d{1,2}))?$/`: перша група — гривні, друга (якщо є) — одна чи дві цифри копійок. Одна цифра — це десятки копійок (`"12,5"` — 12 гривень 50 копійок), тож доповни її нулем праворуч (`padEnd(2, "0")`), а потім `гривні * 100 + копійки` — обидва як цілі числа. `"845,50"` і `"845.5"` дають `84550`, `"0,05"` — `5`. Текст іншого вигляду (`""`, `"12,345"`, `"-5"`, `"1e3"`, `"12,"`) дає `NaN`, а його вже відхиляє `validateExpense`.

    **2. Дата — проста календарна дата.** Іменований експорт `isCalendarDate(value)`: `true` лише для тексту рівно вигляду `"YYYY-MM-DD"` (шаблон `/^\d{4}-\d{2}-\d{2}$/`, де `^` і `$` не пускають нічого до й після дати). `validateExpense` для дати, що не є календарною датою (і для порожньої), дає помилку `"bad-date"`.

    **3. Пошук через ключ пошуку.** `searchKey(text)` (іменований експорт) повертає `text.normalize("NFC")` без пробілів на краях і малими літерами; `searchExpenses(list, query)` порівнює ключ запиту з ключем назви витрати. Порожній запит лишає всі витрати.

    **4. Індекси на `Map`.** Іменовані експорти:

    - `totalsByCategory(list)` — `Map` від категорії до суми `amountMinor` її витрат у копійках, лише для категорій, що трапляються, у порядку їхньої першої появи;
    - `indexById(list)` — `Map` від `id` до витрати (того самого об’єкта зі списку); з двох витрат з однаковим `id` лишається перша.

    **5. Показ через `Intl`.** Новий модуль `ui/format.js` експортує `formatMoney(amountMinor, locale)`: `new Intl.NumberFormat(locale, { style: "currency", currency: "UAH" }).format(amountMinor / 100)`, наприклад «845,50 ₴» для `"uk-UA"`. Ділення на 100 — лише тут, для показу: нічого не зберігається й не додається після нього.

    **6. Сторінка.** У `ui/page.js` додай `const LOCALE = "%%formatLocale%%";`.

    - Сума в картці — `formatMoney(amountMinor, LOCALE)`.
    - Підсумок будується з `totalsByCategory(current)`: для кожної категорії `categoryText(категорія) + ": " + formatMoney(сума, LOCALE)`, потім «%%totalLabel%%: » і `formatMoney` загальної суми, усе через « · ».
    - Поле «%%valueLabel%%» стає текстовим (`inputmode="decimal"` замість `type="number"`), щоб можна було ввести кому, а `readForm` бере суму через `parseAmountMinor(amountInput.value)`. Кнопка «%%editLabel%%» бере витрату з `indexById(current)` і пише в поле `formatAmount(amountMinor)`.
    - Під полем «%%dateFieldLabel%%» додай `<p id="expense-date-error" class="error"></p>` (і `aria-describedby="expense-date-error"` у поле): для ключа `"bad-date"` `messageFor` показує там «%%badDateMessage%%».

    **7. Тести.** Допиши в `tests/domain.test.js` тести для `parseAmountMinor` (і з однією цифрою копійок, як-от `"12,5"`) та для `searchKey` з текстом у двох формах Unicode. Щоб набрати в коді «розкладену» літеру, пиши її як `"%%unicodeWordDecomposed%%"`: `\u` і чотири цифри в тексті в лапках — це код символу, тут — комбінованого знака.

    **Як перевірятиметься.** Перевірки викликають твої функції з різними текстами сум і дат та з текстом у різних формах Unicode й регістрах і перевіряють, що `totalsByCategory` та `indexById` повертають саме `Map`. `formatMoney` порівнюють із тим самим `Intl.NumberFormat` для `"uk-UA"` і `"en-US"`. На сторінці перевірки дивляться на суми в картках і підсумку, вводять суму `"45,50"` і витрату без дати. Твої тести запускаються з версією `domain/expenses.js` від курсу (усі мають пройти), а потім із двома зламаними: без `normalize` у `searchKey` і з `parseAmountMinor`, що читає `"12,5"` як 12 гривень 5 копійок, — з кожною хоча б один тест має впасти.
  en: |
    Amounts, dates, search and display of the expenses get strict rules. The stored value stays canonical — whole kopiykas and a `"YYYY-MM-DD"` date — and only the page makes text for a person.

    **1. An amount from the input — without fractional numbers.** In `domain/expenses.js` add a named export `parseAmountMinor(text)`: the text of an amount in hryvnias becomes whole kopiykas, with no fractional number on the way. Trim the spaces at the edges and match the text against the pattern `/^(\d+)(?:[.,](\d{1,2}))?$/`: the first group is the hryvnias, the second (if there is one) is one or two digits of kopiykas. One digit means tens of kopiykas (`"12,5"` is 12 hryvnias 50 kopiykas), so pad it with a zero on the right (`padEnd(2, "0")`), then `hryvnias * 100 + kopiykas` — both as whole numbers. `"845,50"` and `"845.5"` give `84550`, `"0,05"` gives `5`. Text of any other form (`""`, `"12,345"`, `"-5"`, `"1e3"`, `"12,"`) gives `NaN`, which `validateExpense` already rejects.

    **2. A date is a plain calendar date.** A named export `isCalendarDate(value)`: `true` only for text of exactly the form `"YYYY-MM-DD"` (the pattern `/^\d{4}-\d{2}-\d{2}$/`, where `^` and `$` let nothing in before or after the date). For a date that is not a calendar date (an empty one too), `validateExpense` gives the error `"bad-date"`.

    **3. Search through a search key.** `searchKey(text)` (a named export) returns `text.normalize("NFC")` without spaces at the edges and in lower case; `searchExpenses(list, query)` compares the key of the query with the key of the expense's label. An empty query keeps every expense.

    **4. Indexes on `Map`.** Named exports:

    - `totalsByCategory(list)` — a `Map` from category to the sum of `amountMinor` of its expenses in kopiykas, only for the categories that occur, in the order they first appear;
    - `indexById(list)` — a `Map` from `id` to the expense (the very object of the list); of two expenses with the same `id` the first one stays.

    **5. Display through `Intl`.** The new module `ui/format.js` exports `formatMoney(amountMinor, locale)`: `new Intl.NumberFormat(locale, { style: "currency", currency: "UAH" }).format(amountMinor / 100)`, for example “UAH 845.50” for `"en-US"`. The division by 100 happens only here, for the display: nothing is stored or summed after it.

    **6. The page.** In `ui/page.js` add `const LOCALE = "%%formatLocale%%";`.

    - The amount in the card is `formatMoney(amountMinor, LOCALE)`.
    - The summary is built from `totalsByCategory(current)`: for every category `categoryText(category) + ": " + formatMoney(sum, LOCALE)`, then “%%totalLabel%%: ” and `formatMoney` of the overall sum, all joined with “ · ”.
    - The field “%%valueLabel%%” becomes a text field (`inputmode="decimal"` instead of `type="number"`), so a comma can be typed, and `readForm` takes the amount through `parseAmountMinor(amountInput.value)`. The “%%editLabel%%” button takes the expense from `indexById(current)` and writes `formatAmount(amountMinor)` into the field.
    - Under the field “%%dateFieldLabel%%” add `<p id="expense-date-error" class="error"></p>` (and `aria-describedby="expense-date-error"` on the field): for the key `"bad-date"` `messageFor` shows “%%badDateMessage%%” there.

    **7. Tests.** Add to `tests/domain.test.js` tests for `parseAmountMinor` (also with one digit of kopiykas, such as `"12,5"`) and for `searchKey` with text in two Unicode forms. To type a “decomposed” letter in code, write it as `"%%unicodeWordDecomposed%%"`: `\u` and four digits inside quoted text are the code of a character, here of the combining mark.

    **How it is checked.** The checks call your functions with different texts of amounts and dates and with text in different Unicode forms and cases, and check that `totalsByCategory` and `indexById` return a real `Map`. `formatMoney` is compared with the same `Intl.NumberFormat` for `"uk-UA"` and `"en-US"`. On the page the checks look at the amounts in the cards and the summary, type the amount `"45,50"` and an expense without a date. Your tests run with the course's version of `domain/expenses.js` (all must pass), then with two broken ones: without `normalize` in `searchKey`, and with a `parseAmountMinor` that reads `"12,5"` as 12 hryvnias 5 kopiykas — with each, at least one test must fail.
nudge:
  uk: "Дефект «одна цифра копійок» видно лише на тексті з однією цифрою після коми: `\"12,50\"` він читає правильно, а `\"12,5\"` — ні. А тест, що ловить пошук без `normalize`, мусить мати «розкладений» текст з одного боку порівняння й «складений» — з іншого: порівняй `\"%%unicodeWord%%\".length` і `\"%%unicodeWordDecomposed%%\".length` у консолі."
  en: "The “one digit of kopiykas” defect shows only on text with one digit after the mark: it reads `\"12,50\"` correctly, but not `\"12,5\"`. And a test that catches a search without `normalize` needs the “decomposed” text on one side of the comparison and the “composed” one on the other: compare `\"%%unicodeWord%%\".length` and `\"%%unicodeWordDecomposed%%\".length` in the console."
