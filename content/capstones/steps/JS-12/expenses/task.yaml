feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там помилка завантаження `ui/format.js`, то файл лежить не в теці `ui/` або в `import` бракує `./format.js`."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. If it shows a loading error for `ui/format.js`, the file is not in the folder `ui/` or the `import` lacks `./format.js`."
  - when: { test: "parseAmountMinor reads typed hryvnias as whole kopiykas" }
    message:
      uk: "Ця перевірка чекає іменований експорт `parseAmountMinor` у `domain/expenses.js`: `\"845,50\"` і `\"845.5\"` → `84550`, `\"0,1\"` → `10`, `\"0,05\"` → `5`, `\" 520 \"` → `52000`, `\"1,1\"` → `110`, `\"4.35\"` → `435`, а `\"\"`, `\"12,345\"`, `\"abc\"`, `\"-5\"`, `\"1e3\"`, `\"12,\"`, `\",5\"` і `\"1 000\"` → `NaN`. Через `parseFloat` і множення на 100 частина цих текстів дає число замість `NaN`."
      en: "This check expects a named export `parseAmountMinor` in `domain/expenses.js`: `\"845,50\"` and `\"845.5\"` → `84550`, `\"0,1\"` → `10`, `\"0,05\"` → `5`, `\" 520 \"` → `52000`, `\"1,1\"` → `110`, `\"4.35\"` → `435`, and `\"\"`, `\"12,345\"`, `\"abc\"`, `\"-5\"`, `\"1e3\"`, `\"12,\"`, `\",5\"` and `\"1 000\"` → `NaN`. Through `parseFloat` and a multiplication by 100 some of these texts give a number instead of `NaN`."
  - when: { test: "validateExpense accepts only a calendar date" }
    message:
      uk: "Ця перевірка чекає від `validateExpense` для дат `\"2026-03-02T10:00\"`, `\"02.03.2026\"`, `\"2026-3-2\"`, `\"\"` і без дати результат `{ ok: false, errors: { date: \"bad-date\" } }`, а для `\"2026-03-02\"` — `ok: true` з тими самими полями."
      en: "This check expects `validateExpense` to give `{ ok: false, errors: { date: \"bad-date\" } }` for the dates `\"2026-03-02T10:00\"`, `\"02.03.2026\"`, `\"2026-3-2\"`, `\"\"` and no date, and `ok: true` with the same fields for `\"2026-03-02\"`."
  - when: { test: "searchKey normalizes, trims and lowercases" }
    message:
      uk: "Ця перевірка чекає іменований експорт `searchKey` у `domain/expenses.js` і однаковий ключ для тексту, набраного складеними й розкладеними літерами: `searchKey(\" ЧАИ\\u0306НИК \")` дає `\"чайник\"` з «й» одним символом, а `searchKey(\"Cafe\\u0301\")` — `\"café\"` з «é» одним символом. Для цього потрібні `normalize(\"NFC\")`, `trim()` і `toLowerCase()`."
      en: "This check expects a named export `searchKey` in `domain/expenses.js` and the same key for text typed with composed and decomposed letters: `searchKey(\" ЧАИ\\u0306НИК \")` gives `\"чайник\"` with “й” as one character, and `searchKey(\"Cafe\\u0301\")` gives `\"café\"` with “é” as one character. That needs `normalize(\"NFC\")`, `trim()` and `toLowerCase()`."
  - when: { test: "searchExpenses compares search keys of the label" }
    message:
      uk: "Ця перевірка шукає в списку, де назву збережено розкладеними літерами (`\"Новий Чаи\\u0306ник\"`), і чекає, що запити `\"чайник\"` і `\" ЧАИ\\u0306 \"` її знаходять, запит `\"CAFE\\u0301\"` знаходить витрату «Café», а порожній запит лишає всі витрати. Обидва боки порівняння — і запит, і назва — проходять через `searchKey`."
      en: "This check searches a list where a label is stored with decomposed letters (`\"Новий Чаи\\u0306ник\"`), and expects the queries `\"чайник\"` and `\" ЧАИ\\u0306 \"` to find it, the query `\"CAFE\\u0301\"` to find the expense “Café”, and an empty query to keep every expense. Both sides of the comparison — the query and the label — go through `searchKey`."
  - when: { test: "totalsByCategory sums every category in a Map" }
    message:
      uk: "Ця перевірка чекає, що `totalsByCategory(list)` повертає `Map` (а не звичайний об’єкт), який для шести початкових витрат дає пари `[\"food\", 105600]`, `[\"transport\", 52000]`, `[\"fun\", 48000]`, `[\"home\", 9990]` саме в цьому порядку (порядку першої появи), а для `[]` — порожній `Map`."
      en: "This check expects `totalsByCategory(list)` to return a `Map` (not a plain object) that gives the pairs `[\"food\", 105600]`, `[\"transport\", 52000]`, `[\"fun\", 48000]`, `[\"home\", 9990]` for the six starting expenses in exactly this order (the order they first appear), and an empty `Map` for `[]`."
  - when: { test: "indexById builds a Map from id to expense" }
    message:
      uk: "Ця перевірка чекає, що `indexById(list)` повертає `Map` (а не звичайний об’єкт) розміру 6 для шести витрат, що `get(\"e-03\")` дає той самий об’єкт, що в списку, а з двох витрат з однаковим `id` лишається перша."
      en: "This check expects `indexById(list)` to return a `Map` (not a plain object) of size 6 for six expenses, `get(\"e-03\")` to give the very object of the list, and of two expenses with the same `id` the first one to stay."
  - when: { test: "formatMoney shows hryvnias through Intl" }
    message:
      uk: "Ця перевірка імпортує `ui/format.js`, викликає `formatMoney` для `84550`, `125000` і `5` з `\"uk-UA\"` та `\"en-US\"` і чекає той самий текст, що дає `new Intl.NumberFormat(locale, { style: \"currency\", currency: \"UAH\" }).format(amountMinor / 100)`, наприклад «845,50 ₴»."
      en: "This check imports `ui/format.js`, calls `formatMoney` for `84550`, `125000` and `5` with `\"uk-UA\"` and `\"en-US\"`, and expects the same text that `new Intl.NumberFormat(locale, { style: \"currency\", currency: \"UAH\" }).format(amountMinor / 100)` gives, for example “UAH 845.50”."
  - when: { test: "the cards and the summary show amounts as money text" }
    message:
      uk: "Ця перевірка перезапускає сторінку з порожнім сховищем і чекає в картці `e-01` суму `84550` копійок, показану через `formatMoney` з `\"%%formatLocale%%\"`, а в підсумку — по черзі «%%categoryFood%%», «%%categoryTransport%%», «%%categoryFun%%», «%%categoryHome%%» (порядок першої появи) з їхніми сумами через `formatMoney` і «%%totalLabel%%» із загальною сумою `215590` копійок. Сховище при цьому не змінюється."
      en: "This check restarts the page with an empty storage and expects the amount of `84550` kopiykas in the card `e-01`, shown through `formatMoney` with `\"%%formatLocale%%\"`, and in the summary, in turn, “%%categoryFood%%”, “%%categoryTransport%%”, “%%categoryFun%%”, “%%categoryHome%%” (the order they first appear) with their sums through `formatMoney`, and “%%totalLabel%%” with the overall sum of `215590` kopiykas. The storage does not change meanwhile."
  - when: { test: "the form reads a typed amount with a comma" }
    message:
      uk: "Ця перевірка вводить у форму «%%newName%%», суму `45,50`, дату `2026-03-02` і категорію «%%categoryTransport%%» та чекає сьому картку, `amountMinor: 4550` в останній збереженій витраті й цю суму через `formatMoney` у новій картці. Поле суми має приймати кому (не `type=\"number\"`), а `readForm` — читати його через `parseAmountMinor`."
      en: "This check types “%%newName%%”, the amount `45,50`, the date `2026-03-02` and the category “%%categoryTransport%%” into the form and expects a seventh card, `amountMinor: 4550` in the last saved expense and this amount through `formatMoney` in the new card. The amount field must accept a comma (not `type=\"number\"`), and `readForm` must read it through `parseAmountMinor`."
  - when: { test: "the form refuses an expense without a date" }
    message:
      uk: "Ця перевірка вводить у форму витрату з порожнім полем «%%dateFieldLabel%%» і чекає на сторінці «%%badDateMessage%%», шість карток і нічого збереженого. Для ключа `\"bad-date\"` `messageFor` має повертати «%%badDateMessage%%», а `showErrors` — писати його в `#expense-date-error`."
      en: "This check submits an expense with an empty “%%dateFieldLabel%%” field and expects “%%badDateMessage%%” on the page, six cards and nothing saved. For the key `\"bad-date\"` `messageFor` must return “%%badDateMessage%%”, and `showErrors` must write it into `#expense-date-error`."
  - when: { test: "your domain tests pass with a correct domain module" }
    message:
      uk: "Ця перевірка запускає `tests/domain.test.js` з версією `domain/expenses.js` від курсу й раннером курсу та чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку. Тест, у якому `validateExpense` отримує чернетку без дати й чекає `ok: true`, тепер падає: додай у таку чернетку `date`."
      en: "This check runs `tests/domain.test.js` with the course's version of `domain/expenses.js` and the course runner, and expects at least one test and none that fails. The message below names the failed test or the error. A test in which `validateExpense` gets a draft without a date and expects `ok: true` now fails: add a `date` to such a draft."
  - when: { test: "your tests catch a search key without normalize" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/expenses.js`. Потім вона підставляє версію, де `searchKey` не викликає `normalize(\"NFC\")`, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест, у якому з одного боку текст набрано розкладеними літерами (`\"%%unicodeWordDecomposed%%\"`), а з іншого — складеними."
      en: "This check first expects all your tests to pass with the correct `domain/expenses.js`. Then it puts in a version where `searchKey` does not call `normalize(\"NFC\")`, and expects at least one of your tests to fail. Only a test with text typed in decomposed letters (`\"%%unicodeWordDecomposed%%\"`) on one side and composed ones on the other notices this defect."
  - when: { test: "your tests catch an amount parser that reads \"12,5\" as 12 hryvnias 5 kopiykas" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/expenses.js`. Потім вона підставляє версію, де `parseAmountMinor` не доповнює одну цифру копійок нулем (`\"12,5\"` дає `1205`), і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест із однією цифрою після коми чи крапки."
      en: "This check first expects all your tests to pass with the correct `domain/expenses.js`. Then it puts in a version where `parseAmountMinor` does not pad one digit of kopiykas with a zero (`\"12,5\"` gives `1205`), and expects at least one of your tests to fail. A test with one digit after the comma or the dot notices this defect."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
