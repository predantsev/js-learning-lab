# Capstone step of unit JS-12 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-12-16-capstone-data-rules from this file.
# The step is checked in the platform and continues from the JS-11 reference.
unit: JS-12
mode: in-platform
entry: index.html
title:
  uk: "Суворі правила даних"
  en: "Strict data rules"
intro:
  uk: |
    Дані проєкту мають один канонічний вигляд, у якому їх зберігають і порівнюють, а текст для людини з’являється лише тоді, коли сторінка їх показує. На цьому кроці ти застосовуєш правила цього розділу до власних даних:

    - **сховане значення лишається канонічним**: цілі числа (ціни в гривнях або суми в копійках) чи прості календарні дати `"YYYY-MM-DD"` — без дробових чисел, без часових поясів і без тексту для показу;
    - **пошук не залежить від того, як набрано текст**: запит і поле зводяться до одного [[search-key|ключа пошуку]] — `normalize("NFC")`, без пробілів на краях, малими літерами;
    - **текст для показу робить `Intl`** у новому модулі `ui/format.js` — числа й дати в мові проєкту, а для дат ще й `timeZone: "UTC"`, щоб той самий день показувався на будь-якому комп’ютері;
    - **індекси на `Map` і `Set`**: пошук запису за `id` без проходу всім списком і набір значень без повторів.

    Нові функції чисті — без сторінки й сховища, — тож їх перевіряють і твої тести в `tests/domain.test.js`.

    > [!note]
    > Якщо ти вже експортував проєкт (контрольна точка CP-JS), твої локальні файли — головні, і платформа їх не змінює. Тоді спершу зроби commit у своїй теці, завантаж еталон цього кроку з екрана проєкту й перенеси зміни вручну, звіряючи файли, як у уроках розділу JS-10.
  en: |
    The project's data has one canonical form in which it is stored and compared, and text for a person appears only when the page shows it. In this step you apply this unit's rules to your own data:

    - **the stored value stays canonical**: integers (prices in hryvnias or amounts in kopiykas) or plain calendar dates `"YYYY-MM-DD"` — no fractions, no time zones and no display text;
    - **search does not depend on how the text was typed**: the query and the field are turned into one [[search-key]] — `normalize("NFC")`, no spaces at the edges, lower case;
    - **`Intl` makes the display text** in the new module `ui/format.js` — numbers and dates in the project's language, and for dates also `timeZone: "UTC"`, so the same day shows on any computer;
    - **indexes built on `Map` and `Set`**: finding a record by `id` without a pass over the whole list, and a set of values without repeats.

    The new functions are pure — no page and no storage — so your tests in `tests/domain.test.js` check them too.

    > [!note]
    > If you have already exported the project (checkpoint CP-JS), your local files are the main ones, and the platform does not change them. Then first make a commit in your folder, download this step's reference from the project screen and carry the changes over by hand, comparing the files, as in the lessons of unit JS-10.
purpose:
  uk: "Це крок твого проєкту: цілі мінорні одиниці, календарні дати, нормалізований пошук, `Intl` і колекції `Map`/`Set` з цього розділу ти застосовуєш до даних власного застосунку. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: you apply this unit's integer minor units, calendar dates, normalized search, `Intl` and the `Map`/`Set` collections to the data of your own app. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Тримати збережені значення проєкту канонічними — цілі числа або дати `\"YYYY-MM-DD\"` — і відхиляти решту ще під час перевірки чернетки."
    en: "Keep the project's stored values canonical — integers or `\"YYYY-MM-DD\"` dates — and reject anything else while the draft is checked."
  - uk: "Шукати записи через ключ пошуку, що не залежить від регістру, пробілів на краях і форми запису Unicode."
    en: "Search records through a search key that does not depend on case, spaces at the edges or the Unicode form."
  - uk: "Показувати числа й дати через `Intl` лише під час виведення та будувати індекси на `Map` і `Set`."
    en: "Show numbers and dates through `Intl` only when rendering, and build indexes on `Map` and `Set`."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередні кроки не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If earlier steps are not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
