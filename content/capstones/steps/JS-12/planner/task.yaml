    uk: "`validateTask` приймає як термін лише дату `\"YYYY-MM-DD\"` або `null`"
    en: "`validateTask` accepts only a `\"YYYY-MM-DD\"` date or `null` as the due date"
  "isCalendarDate checks the whole text":
    uk: "`isCalendarDate` перевіряє весь текст, від початку до кінця"
    en: "`isCalendarDate` checks the whole text, from start to end"
  "a saved task with another date format is not shown":
    uk: "Збережена справа з терміном `\"02.03.2026\"` вважається пошкодженою"
