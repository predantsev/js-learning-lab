# Planner variant of step JS-12. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  formatLocale: { uk: "uk-UA", en: "en-US" }
  prioritiesInUseLabel: { uk: "Пріоритети в списку", en: "Priorities in the list" }
  unicodeWord: { uk: "Чайник", en: "Café" }
  unicodeWordDecomposed: { uk: "Чаи\\u0306ник", en: "Cafe\\u0301" }
  unicodeKey: { uk: "чайник", en: "café" }
  unicodeQuery: { uk: "ЧАИ\\u0306НИК", en: "CAFE\\u0301" }
instructions:
  uk: |
    Терміни, пошук і показ справ отримують суворі правила. Збережене значення лишається канонічним, а текст для людини робить лише сторінка.

    **1. Термін — проста календарна дата або `null`.** У `domain/tasks.js` додай іменований експорт `isCalendarDate(value)`: `true` лише для тексту рівно вигляду `"YYYY-MM-DD"` — шаблон `/^\d{4}-\d{2}-\d{2}$/`, де `^` і `$` не пускають нічого до й після дати. `validateTask` для терміну, що не `null` і не календарна дата, дає помилку `"bad-date"`: `"2026-03-02T10:00"`, `"02.03.2026"`, `"2026-3-2"` і `""` відхиляються. Порівняння термінів у `countDueTasks` лишається порівнянням тексту — без `Date` і часових поясів. Збережені справи з іншим форматом дати сторінка тепер вважає пошкодженими: `isUsableTask` уже викликає `validateTask`.

    **2. Пошук через ключ пошуку.** У `domain/tasks.js`:

    - `searchKey(text)` (іменований експорт) повертає `text.normalize("NFC")` без пробілів на краях і малими літерами. Так «й», набране одним символом і як «и» + комбінований знак (U+0306), дає той самий ключ.
    - `searchTasks(list, query)` порівнює ключ запиту з ключем назви справи. Порожній запит лишає всі справи.

    **3. Індекси.** Іменовані експорти з `domain/tasks.js`:

    - `indexById(list)` повертає `Map` від `id` до справи (того самого об’єкта зі списку); якщо дві справи мають той самий `id`, у `Map` лишається перша;
    - `prioritiesInUse(list)` повертає `Set` пріоритетів у порядку першої появи.

    **4. Показ через `Intl`.** Новий модуль `ui/format.js` експортує `formatDay(day, locale)`: `new Intl.DateTimeFormat(locale, { dateStyle: "long", timeZone: "UTC" }).format(new Date(day))`, наприклад «2 березня 2026 р.» для `"uk-UA"`. `new Date("2026-03-02")` — це північ за UTC, тож і показувати треба за UTC: без `timeZone: "UTC"` комп’ютер на захід від UTC покаже 1 березня. У `ui/page.js` додай `const LOCALE = "%%formatLocale%%";` і показуй через `formatDay` термін у картці («%%valueLabel%%: …», справа без терміну — як і раніше «%%noDueDate%%») та день у підсумку «%%dueSummary%% …: N».

    **5. Сторінка використовує індекси.** `render()` будує `indexById(current)`, і кнопка «%%editLabel%%» бере справу з цього `Map` через `get(id)`. Під підсумком додай `<p id="priorities"></p>`: `render()` пише туди «%%prioritiesInUseLabel%%: » і пріоритети з `prioritiesInUse(current)` словами (`priorityText`) через кому, наприклад «%%prioritiesInUseLabel%%: %%priorityNormal%%, %%priorityHigh%%, %%priorityLow%%».

    **6. Тести.** Допиши в `tests/domain.test.js` тести для `searchKey` і `searchTasks` з текстом у двох формах Unicode та тест для терміну з часом (`"2026-03-02T10:00"`). Щоб набрати в коді «розкладену» літеру, пиши її як `"%%unicodeWordDecomposed%%"`: `\u` і чотири цифри в тексті в лапках — це код символу, тут — комбінованого знака.

    **Як перевірятиметься.** Перевірки викликають твої функції з різними текстами дат, з текстом у різних формах Unicode й регістрах та перевіряють, що `indexById` і `prioritiesInUse` повертають саме `Map` і `Set`. `formatDay` порівнюють із тим самим `Intl.DateTimeFormat` для `"uk-UA"` і `"en-US"` і викликають так, ніби комп’ютер на 14 годин попереду UTC і на 11 годин позаду. На сторінці перевірки дивляться на дати в картках і підсумку, на рядок пріоритетів після видалення справ і запускають сторінку зі збереженою справою з терміном `"02.03.2026"`. Твої тести запускаються з версією `domain/tasks.js` від курсу (усі мають пройти), а потім із двома зламаними: без `normalize` у `searchKey` і з шаблоном дати без `^` і `$`, — з кожною хоча б один тест має впасти.
  en: |
    Due dates, search and display of the tasks get strict rules. The stored value stays canonical, and only the page makes text for a person.

    **1. A due date is a plain calendar date or `null`.** In `domain/tasks.js` add a named export `isCalendarDate(value)`: `true` only for text of exactly the form `"YYYY-MM-DD"` — the pattern `/^\d{4}-\d{2}-\d{2}$/`, where `^` and `$` let nothing in before or after the date. For a due date that is not `null` and not a calendar date, `validateTask` gives the error `"bad-date"`: `"2026-03-02T10:00"`, `"02.03.2026"`, `"2026-3-2"` and `""` are rejected. Comparing due dates in `countDueTasks` stays a comparison of text — no `Date` and no time zones. The page now treats saved tasks with another date format as damaged: `isUsableTask` already calls `validateTask`.

    **2. Search through a search key.** In `domain/tasks.js`:

    - `searchKey(text)` (a named export) returns `text.normalize("NFC")` without spaces at the edges and in lower case. So “é” typed as one character and as “e” + a combining mark (U+0301) gives the same key.
    - `searchTasks(list, query)` compares the key of the query with the key of the task's title. An empty query keeps every task.

    **3. Indexes.** Named exports of `domain/tasks.js`:

    - `indexById(list)` returns a `Map` from `id` to the task (the very object of the list); if two tasks have the same `id`, the first one stays in the `Map`;
    - `prioritiesInUse(list)` returns a `Set` of the priorities in the order they first appear.

    **4. Display through `Intl`.** The new module `ui/format.js` exports `formatDay(day, locale)`: `new Intl.DateTimeFormat(locale, { dateStyle: "long", timeZone: "UTC" }).format(new Date(day))`, for example “March 2, 2026” for `"en-US"`. `new Date("2026-03-02")` is midnight in UTC, so it must also be shown in UTC: without `timeZone: "UTC"` a computer west of UTC shows March 1. In `ui/page.js` add `const LOCALE = "%%formatLocale%%";` and show through `formatDay` the due date in the card (“%%valueLabel%%: …”, a task without a due date shows “%%noDueDate%%” as before) and the day in the summary “%%dueSummary%% …: N”.

    **5. The page uses the indexes.** `render()` builds `indexById(current)`, and the “%%editLabel%%” button takes the task from this `Map` with `get(id)`. Under the summary add `<p id="priorities"></p>`: `render()` writes “%%prioritiesInUseLabel%%: ” into it and the priorities of `prioritiesInUse(current)` as words (`priorityText`) separated by commas, for example “%%prioritiesInUseLabel%%: %%priorityNormal%%, %%priorityHigh%%, %%priorityLow%%”.

    **6. Tests.** Add to `tests/domain.test.js` tests for `searchKey` and `searchTasks` with text in two Unicode forms and a test for a due date with a time (`"2026-03-02T10:00"`). To type a “decomposed” letter in code, write it as `"%%unicodeWordDecomposed%%"`: `\u` and four digits inside quoted text are the code of a character, here of the combining mark.

    **How it is checked.** The checks call your functions with different date texts and with text in different Unicode forms and cases, and check that `indexById` and `prioritiesInUse` return a real `Map` and `Set`. `formatDay` is compared with the same `Intl.DateTimeFormat` for `"uk-UA"` and `"en-US"` and is called as if the computer were 14 hours ahead of UTC and 11 hours behind it. On the page the checks look at the dates in the cards and the summary and at the priorities line after tasks are deleted, and start the page with a saved task due `"02.03.2026"`. Your tests run with the course's version of `domain/tasks.js` (all must pass), then with two broken ones: without `normalize` in `searchKey`, and with a date pattern without `^` and `$` — with each, at least one test must fail.
nudge:
  uk: "Шаблон без `^` і `$` шукає дату будь-де в тексті, тож `\"2026-03-02T10:00\"` йому підходить. А тест, що ловить пошук без `normalize`, мусить мати «розкладений» текст з одного боку порівняння й «складений» — з іншого: порівняй `\"%%unicodeWord%%\".length` і `\"%%unicodeWordDecomposed%%\".length` у консолі."
  en: "A pattern without `^` and `$` looks for a date anywhere in the text, so `\"2026-03-02T10:00\"` fits it. And a test that catches a search without `normalize` needs the “decomposed” text on one side of the comparison and the “composed” one on the other: compare `\"%%unicodeWord%%\".length` and `\"%%unicodeWordDecomposed%%\".length` in the console."
testTitles:
  "the script runs without errors":
    uk: "Проєкт запускається без помилок"
    en: "The project starts without errors"
