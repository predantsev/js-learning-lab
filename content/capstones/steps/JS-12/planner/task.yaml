    en: "`run-tests.js` prints “%%rSummary%%” in the “Console” with no failed test"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: "Ця перевірка чекає, що `app.js`, `run-tests.js` і всі імпортовані модулі виконаються без помилки. Назву помилки й рядок коду показує вкладка «Консоль». Якщо там помилка завантаження `ui/format.js`, то файл лежить не в теці `ui/` або в `import` бракує `./format.js`."
      en: "This check expects `app.js`, `run-tests.js` and every imported module to run without an error. The “Console” tab shows the error name and the line of code. If it shows a loading error for `ui/format.js`, the file is not in the folder `ui/` or the `import` lacks `./format.js`."
  - when: { test: "validateTask accepts only a calendar date as the due date" }
    message:
      uk: "Ця перевірка чекає від `validateTask` для термінів `\"2026-03-02T10:00\"`, `\"02.03.2026\"`, `\"2026-3-2\"`, `\"x2026-03-02\"` і `\"\"` результат `{ ok: false, errors: { dueDate: \"bad-date\" } }`, а для `\"2026-03-02\"`, `null` і чернетки без терміну — `ok: true`."
      en: "This check expects `validateTask` to give `{ ok: false, errors: { dueDate: \"bad-date\" } }` for the due dates `\"2026-03-02T10:00\"`, `\"02.03.2026\"`, `\"2026-3-2\"`, `\"x2026-03-02\"` and `\"\"`, and `ok: true` for `\"2026-03-02\"`, `null` and a draft without a due date."
  - when: { test: "isCalendarDate checks the whole text" }
    message:
      uk: "Ця перевірка чекає іменований експорт `isCalendarDate` у `domain/tasks.js`: `true` для `\"2026-03-02\"` і `false` для `\"2026-03-02T10:00\"`, `\" 2026-03-02\"` та `null`. Шаблон без `^` на початку й `$` у кінці знаходить дату всередині довшого тексту."
      en: "This check expects a named export `isCalendarDate` in `domain/tasks.js`: `true` for `\"2026-03-02\"` and `false` for `\"2026-03-02T10:00\"`, `\" 2026-03-02\"` and `null`. A pattern without `^` at the start and `$` at the end finds a date inside a longer text."
  - when: { test: "a saved task with another date format is not shown" }
    message:
      uk: "Ця перевірка зберігає під ключем `jsll.planner.v1` одну справу з терміном `\"02.03.2026\"`, викликає `start(storage)` і чекає шість початкових справ та «%%loadErrorMessage%%» на сторінці. Так і буде, коли `validateTask` відхиляє такий термін: `isUsableTask` перевіряє збережені справи через `validateTask`."
      en: "This check saves one task due `\"02.03.2026\"` under the key `jsll.planner.v1`, calls `start(storage)` and expects the six starting tasks and “%%loadErrorMessage%%” on the page. That is what happens when `validateTask` rejects such a due date: `isUsableTask` checks saved tasks with `validateTask`."
  - when: { test: "searchKey normalizes, trims and lowercases" }
    message:
      uk: "Ця перевірка чекає іменований експорт `searchKey` у `domain/tasks.js` і однаковий ключ для тексту, набраного складеними й розкладеними літерами: `searchKey(\" ЧАИ\\u0306НИК \")` дає `\"чайник\"` з «й» одним символом, а `searchKey(\"Cafe\\u0301\")` — `\"café\"` з «é» одним символом. Для цього потрібні `normalize(\"NFC\")`, `trim()` і `toLowerCase()`."
      en: "This check expects a named export `searchKey` in `domain/tasks.js` and the same key for text typed with composed and decomposed letters: `searchKey(\" ЧАИ\\u0306НИК \")` gives `\"чайник\"` with “й” as one character, and `searchKey(\"Cafe\\u0301\")` gives `\"café\"` with “é” as one character. That needs `normalize(\"NFC\")`, `trim()` and `toLowerCase()`."
  - when: { test: "searchTasks compares search keys of the title" }
    message:
      uk: "Ця перевірка шукає в списку, де назву збережено розкладеними літерами (`\"Чаи\\u0306ник помити\"`), і чекає, що запити `\"чайник\"` і `\" ЧАИ\\u0306 \"` її знаходять, запит `\"CAFE\\u0301\"` знаходить справу «Café», а порожній запит лишає всі справи. Обидва боки порівняння — і запит, і назва — проходять через `searchKey`."
      en: "This check searches a list where a title is stored with decomposed letters (`\"Чаи\\u0306ник помити\"`), and expects the queries `\"чайник\"` and `\" ЧАИ\\u0306 \"` to find it, the query `\"CAFE\\u0301\"` to find the task “Café”, and an empty query to keep every task. Both sides of the comparison — the query and the title — go through `searchKey`."
  - when: { test: "indexById builds a Map from id to task" }
    message:
      uk: "Ця перевірка чекає, що `indexById(list)` повертає `Map` (а не звичайний об’єкт) розміру 6 для шести справ, що `get(\"t-03\")` дає той самий об’єкт, що в списку, а з двох справ з однаковим `id` лишається перша. Для `[]` розмір — `0`."
      en: "This check expects `indexById(list)` to return a `Map` (not a plain object) of size 6 for six tasks, `get(\"t-03\")` to give the very object of the list, and of two tasks with the same `id` the first one to stay. For `[]` the size is `0`."
  - when: { test: "prioritiesInUse builds a Set of the priorities" }
    message:
      uk: "Ця перевірка чекає, що `prioritiesInUse(list)` повертає `Set` пріоритетів шести початкових справ у порядку першої появи — `\"normal\"`, `\"high\"`, `\"low\"` — і лише `\"low\"` для двох справ із пріоритетом `\"low\"`."
      en: "This check expects `prioritiesInUse(list)` to return a `Set` with the priorities of the six starting tasks in the order they first appear — `\"normal\"`, `\"high\"`, `\"low\"` — and only `\"low\"` for two tasks with the priority `\"low\"`."
  - when: { test: "formatDay shows the long date through Intl" }
    message:
      uk: "Ця перевірка імпортує `ui/format.js`, викликає `formatDay` для `\"2026-03-02\"` і `\"2026-12-31\"` з `\"uk-UA\"` та `\"en-US\"` і чекає той самий текст, що дає `new Intl.DateTimeFormat(locale, { dateStyle: \"long\", timeZone: \"UTC\" })`, наприклад «2 березня 2026 р.»."
      en: "This check imports `ui/format.js`, calls `formatDay` for `\"2026-03-02\"` and `\"2026-12-31\"` with `\"uk-UA\"` and `\"en-US\"`, and expects the same text that `new Intl.DateTimeFormat(locale, { dateStyle: \"long\", timeZone: \"UTC\" })` gives, for example “March 2, 2026”."
  - when: { test: "formatDay shows the same day in every time zone" }
    message:
      uk: "Ця перевірка викликає `formatDay` так, ніби комп’ютер на 14 годин попереду UTC і на 11 годин позаду, і чекає той самий день, що за UTC. `new Date(\"2026-03-02\")` — північ за UTC; форматтер без `timeZone: \"UTC\"` показує її в часовому поясі комп’ютера, а на захід від UTC це ще 1 березня."
      en: "This check calls `formatDay` as if the computer were 14 hours ahead of UTC and 11 hours behind it, and expects the same day as in UTC. `new Date(\"2026-03-02\")` is midnight in UTC; a formatter without `timeZone: \"UTC\"` shows it in the computer's time zone, and west of UTC that is still March 1."
  - when: { test: "the cards and the summary show dates as long dates" }
    message:
      uk: "Ця перевірка перезапускає сторінку з порожнім сховищем і чекає в картці `t-01` «%%valueLabel%%:» з датою `\"2026-03-02\"`, показаною через `formatDay` з `\"%%formatLocale%%\"`, у картці `t-03` — «%%valueLabel%%: %%noDueDate%%», а в підсумку — «%%dueSummary%%» з тим самим днем і числом `2`. Сховище при цьому не змінюється."
      en: "This check restarts the page with an empty storage and expects “%%valueLabel%%:” in the card `t-01` with the date `\"2026-03-02\"` shown through `formatDay` with `\"%%formatLocale%%\"`, “%%valueLabel%%: %%noDueDate%%” in the card `t-03`, and “%%dueSummary%%” in the summary with the same day and the number `2`. The storage does not change meanwhile."
  - when: { test: "the page lists the priorities in use" }
    message:
      uk: "Ця перевірка чекає на сторінці «%%prioritiesInUseLabel%%:» і далі «%%priorityNormal%%», «%%priorityHigh%%», «%%priorityLow%%» у порядку першої появи, а після видалення двох справ із низьким пріоритетом (`t-03` і `t-06`) у цьому рядку вже немає «%%priorityLow%%». `render()` оновлює рядок щоразу."
      en: "This check expects “%%prioritiesInUseLabel%%:” on the page followed by “%%priorityNormal%%”, “%%priorityHigh%%”, “%%priorityLow%%” in the order they first appear, and after the two low tasks (`t-03` and `t-06`) are deleted that line no longer has “%%priorityLow%%”. `render()` updates the line every time."
  - when: { test: "your domain tests pass with a correct domain module" }
    message:
      uk: "Ця перевірка запускає `tests/domain.test.js` з версією `domain/tasks.js` від курсу й раннером курсу та чекає хоча б один тест і жодного, що впав. Повідомлення внизу називає тест, що впав, або помилку."
      en: "This check runs `tests/domain.test.js` with the course's version of `domain/tasks.js` and the course runner, and expects at least one test and none that fails. The message below names the failed test or the error."
  - when: { test: "your tests catch a search key without normalize" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.js`. Потім вона підставляє версію, де `searchKey` не викликає `normalize(\"NFC\")`, і чекає, що хоча б один твій тест упаде. Такий дефект помітить лише тест, у якому з одного боку текст набрано розкладеними літерами (`\"%%unicodeWordDecomposed%%\"`), а з іншого — складеними."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.js`. Then it puts in a version where `searchKey` does not call `normalize(\"NFC\")`, and expects at least one of your tests to fail. Only a test with text typed in decomposed letters (`\"%%unicodeWordDecomposed%%\"`) on one side and composed ones on the other notices this defect."
  - when: { test: "your tests catch a date check without anchors" }
    message:
      uk: "Ця перевірка спершу чекає, що всі твої тести проходять із правильним `domain/tasks.js`. Потім вона підставляє версію, де шаблон `isCalendarDate` не має `^` і `$`, і чекає, що хоча б один твій тест упаде. Такий дефект помітить тест, у якому термін із часом, як-от `\"2026-03-02T10:00\"`, відхиляється."
      en: "This check first expects all your tests to pass with the correct `domain/tasks.js`. Then it puts in a version where the pattern of `isCalendarDate` has no `^` and `$`, and expects at least one of your tests to fail. A test in which a due date with a time, such as `\"2026-03-02T10:00\"`, is rejected notices this defect."
  - when: { test: "run-tests.js prints the results on the page" }
    message:
      uk: "Ця перевірка шукає серед рядків «Консолі» після запуску сторінки підсумок «%%rSummary%%» із числами й чекає хоча б один тест, що пройшов, і нуль невдалих. Рядок `✗` у «Консолі» називає тест, що не проходить із файлами твого проєкту."
      en: "This check looks among the “Console” lines after the page started for the summary “%%rSummary%%” with numbers, and expects at least one passed test and zero failed ones. A `✗` line in the “Console” names a test that does not pass with the files of your project."
