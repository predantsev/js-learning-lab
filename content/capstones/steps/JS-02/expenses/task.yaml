# Expense tracker variant of step JS-02. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  secondName: { uk: "Лампочки", en: "Light bulbs" }
  decimalMark: { uk: ",", en: "." }
  currency: { uk: "грн", en: "UAH" }
  draftLabel: { uk: "Таксі", en: "Taxi" }
  requiredMessage: { uk: "Обери категорію", en: "Choose a category" }
  invalidMessage: { uk: "Сума має бути цілим числом копійок більшим за нуль", en: "The amount must be whole kopiykas above zero" }
  # Read only by the shared checks (tests.js): the amount each label must show after the label.
  firstCheck: { uk: "520,00", en: "520.00" }
  secondCheck: { uk: "99,90", en: "99.90" }
instructions:
  uk: |
    Досі `app.js` лише друкував рядки в консоль. Тепер він обчислить текст для сторінки. Нове пиши в `app.js` під наявними рядками.

    1. **Дві витрати.** Опиши два записи — об’єкти з полями `id`, `label`, `amountMinor`, `date` і `category`. Суму проєкт зберігає **цілим числом копійок**: `52000` — це 520 гривень 00 копійок.
       - `"e-02"`: назва «%%nameValue%%», сума `52000`, дата `"2026-03-01"`, категорія `"transport"`;
       - `"e-04"`: назва «%%secondName%%», сума `9990`, дата `"2026-02-27"`, категорія `"home"`.
    2. **Підписи.** Для кожної витрати склади підпис: назва, роздільник на твій смак (наприклад, ` — `) і сума в гривнях **з двома цифрами копійок** та словом «%%currency%%». Між гривнями й копійками стоїть «%%decimalMark%%». Має вийти «%%nameValue%% — %%firstCheck%% %%currency%%» і «%%secondName%% — %%secondCheck%% %%currency%%». Обчисли це з `amountMinor` звичайною арифметикою (`%`, `-`, `/`) і порівнянням — функції округлення не потрібні.
    3. **Чернетка.** Додай чернетку нової витрати саме з такими даними: `const draft = { label: "%%draftLabel%%", amountMinor: 150.5, date: "2026-03-02", category: "" };`. Так виглядатимуть дані з форми, яку ти зробиш у розділі JS-06. Для полів суми й категорії обчисли окремі повідомлення:
       - сума — не ціле число копійок, більше за нуль → «%%invalidMessage%%»;
       - категорія — порожній рядок → «%%requiredMessage%%»;
       - з полем усе гаразд → порожній рядок `""`.
    4. **На сторінку.** У `index.html` усередині `<main>` додай чотири порожні абзаци з атрибутом `id`: `first-label`, `second-label`, `amount-message` і `category-message`. У кінці `app.js` заповни кожен готовим рядком такого вигляду, підставивши свою змінну:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       Рядок знаходить на сторінці елемент з `id="first-label"` і записує в нього текст. Як це працює, детально розбереш у розділі JS-06.

    Значення, яке після оголошення не змінюється, називай через `const`; `let` — лише для того, що переприсвоюєш.

    **Перевірка дивиться на сторінку:** скрипт працює без помилок; у `<main>` є рядок із «%%nameValue%%» і `%%firstCheck%%`, рядок із «%%secondName%%» і `%%secondCheck%%` та обидва повідомлення чернетки; цей текст записує скрипт, а не `index.html`. Назви змінних і роздільник можуть бути твоїми.

    Коли все пройде, спробуй поставити першій витраті суму `52005` і запусти: підпис має показати `520%%decimalMark%%05`. Потім поверни `52000`.
  en: |
    So far `app.js` only printed lines to the console. Now it computes the page text. Write the new code in `app.js` below the existing lines.

    1. **Two expenses.** Describe two records — objects with the fields `id`, `label`, `amountMinor`, `date` and `category`. The project stores an amount as a **whole number of kopiykas** (the minor unit of the hryvnia): `52000` means 520 hryvnias 00 kopiykas.
       - `"e-02"`: label “%%nameValue%%”, amount `52000`, date `"2026-03-01"`, category `"transport"`;
       - `"e-04"`: label “%%secondName%%”, amount `9990`, date `"2026-02-27"`, category `"home"`.
    2. **Labels.** Build a label for each expense: the label, a separator of your choice (for example ` — `) and the amount in hryvnias **with two digits of kopiykas** and the word “%%currency%%”. A “%%decimalMark%%” stands between the hryvnias and the kopiykas. You should get “%%nameValue%% — %%firstCheck%% %%currency%%” and “%%secondName%% — %%secondCheck%% %%currency%%”. Compute this from `amountMinor` with plain arithmetic (`%`, `-`, `/`) and a comparison — no rounding functions are needed.
    3. **Draft.** Add a draft of a new expense with exactly this data: `const draft = { label: "%%draftLabel%%", amountMinor: 150.5, date: "2026-03-02", category: "" };`. This is what data from the form you build in unit JS-06 will look like. Compute separate messages for the amount and the category of the draft:
       - the amount is not a whole number of kopiykas above zero → “%%invalidMessage%%”;
       - the category is an empty string → “%%requiredMessage%%”;
       - the field is fine → an empty string `""`.
    4. **Onto the page.** In `index.html`, inside `<main>`, add four empty paragraphs with an `id` attribute: `first-label`, `second-label`, `amount-message` and `category-message`. At the end of `app.js`, fill each one with a ready-made line like this, using your own variable:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       The line finds the element with `id="first-label"` on the page and writes the text into it. Unit JS-06 explains in detail how this works.

    Name a value that does not change after its declaration with `const`; use `let` only for what you reassign.

    **The checks look at the page:** the script runs without errors; `<main>` has a line with “%%nameValue%%” and `%%firstCheck%%`, a line with “%%secondName%%” and `%%secondCheck%%`, and both draft messages; this text is written by the script, not typed into `index.html`. Variable names and the separator can be your own.

    When everything passes, try giving the first expense the amount `52005` and run: its label should show `520%%decimalMark%%05`. Then put `52000` back.
nudge:
  uk: "Копійки — це остача від ділення `amountMinor` на `100`. Відніми їх від суми й поділи результат на `100` — вийдуть цілі гривні. Якщо копійок менше за `10`, перед ними потрібен `\"0\"`: тут допоможе тернарний оператор. Для суми чернетки згадай, що `150.5 % 1` не дорівнює `0`."
  en: "The kopiykas are the remainder of `amountMinor` divided by `100`. Subtract them from the amount and divide the result by `100` — you get whole hryvnias. When there are fewer than `10` kopiykas, they need a `\"0\"` in front: the ternary operator helps here. For the draft's amount, recall that `150.5 % 1` is not `0`."
testTitles:
  "the script runs without errors":
    uk: "Скрипт працює без помилок"
    en: "The script runs without errors"
  "the first record label is shown":
    uk: "На сторінці є підпис «%%nameValue%%» із сумою `%%firstCheck%%`"
    en: "The page shows the label “%%nameValue%%” with the amount `%%firstCheck%%`"
  "the second record label is shown":
    uk: "На сторінці є підпис «%%secondName%%» із сумою `%%secondCheck%%`"
    en: "The page shows the label “%%secondName%%” with the amount `%%secondCheck%%`"
  "the draft gets the required-field message":
    uk: "Порожня категорія чернетки дає повідомлення «%%requiredMessage%%»"
    en: "The draft's empty category gives the message “%%requiredMessage%%”"
  "the draft gets the invalid-value message":
    uk: "Сума чернетки `150.5` дає повідомлення «%%invalidMessage%%»"
    en: "The draft's amount `150.5` gives the message “%%invalidMessage%%”"
  "the script writes the new lines":
    uk: "Новий текст записує `app.js`, а не `index.html`"
    en: "The new text is written by `app.js`, not typed into `index.html`"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: |
        Скрипт зупинився з помилкою, тому решта коду не виконалася. Назву помилки й рядок показує консоль у перегляді.

        - `TypeError: Cannot set properties of null (setting 'textContent')` — `document.querySelector` не знайшов елемент і повернув `null`. Перевір, що в `index.html` усередині `<main>` є абзац саме з таким `id` і що в селекторі перед назвою стоїть `#`: `"#first-label"`. Великі й малі літери мають збігатися.
        - `ReferenceError` — скрипт звертається до імені, якого не знає. Перевір написання; якщо ім’я оголошено нижче, ніж використано, перенеси оголошення вище: до `const` і `let` не можна звертатися раніше за їхній рядок.
      en: |
        The script stopped with an error, so the rest of the code did not run. The console in the preview shows the error name and the line.

        - `TypeError: Cannot set properties of null (setting 'textContent')` — `document.querySelector` found no element and returned `null`. Check that `index.html` has a paragraph with exactly this `id` inside `<main>` and that the selector has a `#` before the name: `"#first-label"`. Upper and lower case must match.
        - `ReferenceError` — the script uses a name it does not know. Check the spelling; if the name is declared below the place where you use it, move the declaration up: a `const` or `let` cannot be used before its line.
  - when: { test: "the first record label is shown" }
    message:
      uk: "У `<main>` має бути рядок, у якому після «%%nameValue%%» стоїть `%%firstCheck%%`. Бачиш `520%%decimalMark%%0`? Копійок `0` — менше за десять, тож перед ними потрібен ще один нуль. Бачиш `520` без копійок або `52000`? Перевір, що ділиш саме на `100` і додаєш копійки після «%%decimalMark%%»."
      en: "`<main>` needs a line in which `%%firstCheck%%` follows “%%nameValue%%”. Seeing `520%%decimalMark%%0`? `0` kopiykas is less than ten, so it needs one more zero in front. Seeing `520` without kopiykas, or `52000`? Check that you divide by exactly `100` and add the kopiykas after “%%decimalMark%%”."
  - when: { test: "the second record label is shown" }
    message:
      uk: "Для суми `9990` підпис має показати `%%secondCheck%%`. Бачиш `99.9`? Ділення `9990 / 100` дає число `99.9` з крапкою й однією цифрою після неї. Склади текст самостійно: цілі гривні, «%%decimalMark%%», дві цифри копійок."
      en: "For the amount `9990` the label must show `%%secondCheck%%`. Seeing `99.9`? Dividing `9990 / 100` gives the number `99.9`, with one digit after the point. Build the text yourself: whole hryvnias, “%%decimalMark%%”, two digits of kopiykas."
  - when: { test: "the draft gets the required-field message" }
    message:
      uk: "Категорія чернетки — порожній рядок `\"\"`, тож на сторінці має бути «%%requiredMessage%%». Перевір умову й те, що повідомлення потрапляє в абзац усередині `<main>`."
      en: "The draft's category is an empty string `\"\"`, so the page must show “%%requiredMessage%%”. Check the condition and that the message lands in a paragraph inside `<main>`."
  - when: { test: "the draft gets the invalid-value message" }
    message:
      uk: "Сума `150.5` більша за нуль, але не ціла, тож на сторінці має бути «%%invalidMessage%%». Перевірки `amountMinor <= 0` тут замало: ціле число дає остачу `0` від ділення на `1`."
      en: "The amount `150.5` is above zero but not whole, so the page must show “%%invalidMessage%%”. Checking `amountMinor <= 0` is not enough here: a whole number leaves a remainder of `0` when divided by `1`."
  - when: { test: "the script writes the new lines" }
    message:
      uk: "Цей текст уже вписано в `index.html` руками. Залиш абзаци порожніми — `<p id=\"…\"></p>` — і заповни їх зі `app.js`: тоді сторінка показуватиме те, що обчислив скрипт, навіть коли дані зміняться."
      en: "This text is already typed into `index.html`. Leave the paragraphs empty — `<p id=\"…\"></p>` — and fill them from `app.js`: then the page shows what the script computed, even when the data changes."
