# Expense tracker variant of step JS-02. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  secondName: { uk: "Лампочки", en: "Light bulbs" }
  decimalMark: { uk: ",", en: "." }
  currency: { uk: "грн", en: "UAH" }
  draftLabel: { uk: "Таксі", en: "Taxi" }
  requiredMessage: { uk: "Обери категорію", en: "Choose a category" }
  invalidMessage: { uk: "Сума має бути цілим числом копійок більшим за нуль", en: "The amount must be whole kopiykas above zero" }
  # Read only by the shared checks (tests.js): the amount each label must show after the label.
  firstCheck: { uk: "520,00", en: "520.00" }
  secondCheck: { uk: "99,90", en: "99.90" }
instructions:
  uk: |
    Досі `app.js` лише друкував рядки в консоль. Тепер він обчислить текст для сторінки. Новий код пиши в `app.js` під наявними рядками коду.

    1. **Дві витрати.** Опиши два записи з полями `id`, `label`, `amountMinor`, `date` і `category`. Суму проєкт зберігає **цілим числом копійок**: `52000` — це 520 гривень 00 копійок.
       - `"e-02"`: назва «%%nameValue%%», сума `52000`, дата `"2026-03-01"`, категорія `"transport"`;
       - `"e-04"`: назва «%%secondName%%», сума `9990`, дата `"2026-02-27"`, категорія `"home"`.
    2. **Підписи.** Для кожної витрати склади підпис: назва, роздільник на твій смак (наприклад, ` — `) і сума в гривнях **з двома цифрами копійок** та словом «%%currency%%». Між гривнями й копійками стоїть «%%decimalMark%%». Має вийти «%%nameValue%% — %%firstCheck%% %%currency%%» і «%%secondName%% — %%secondCheck%% %%currency%%». Обчисли це з `amountMinor` звичайною арифметикою (`%`, `-`, `/`) і порівнянням — функції округлення не потрібні.
    3. **Чернетка.** Додай чернетку нової витрати саме з такими даними: `const draft = { label: "%%draftLabel%%", amountMinor: 150.5, date: "2026-03-02", category: "" };`. Так виглядатимуть дані з форми, яку ти зробиш у розділі JS-06. Для полів суми й категорії обчисли окремі повідомлення:
       - сума — не ціле число копійок, більше за нуль → «%%invalidMessage%%»;
       - категорія — порожній текст `""` → «%%requiredMessage%%»;
       - з полем усе гаразд → порожній текст `""`.
    4. **На сторінку.** У `index.html` усередині `<main>` додай чотири порожні абзаци з атрибутом `id`: `first-label`, `second-label`, `amount-message` і `category-message`. У кінці `app.js` заповни кожен абзац готовим рядком коду такого вигляду, підставивши свою змінну:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       Цей рядок коду знаходить на сторінці елемент з `id="first-label"` і записує в нього текст. Як це працює, детально розбереш у розділі JS-06.

    Значення, яке після оголошення не змінюється, називай через `const`; `let` — лише для того, що переприсвоюєш.

    **Перевірка дивиться на сторінку:** скрипт працює без помилок; у `<main>` є текст, де після «%%nameValue%%» стоїть `%%firstCheck%%`, текст, де після «%%secondName%%» стоїть `%%secondCheck%%`, і обидва повідомлення чернетки; цей текст записує скрипт, а не `index.html`. Назви змінних і роздільник можуть бути твоїми.

    Коли все пройде, постав першій витраті суму `52005`, натисни «Запустити» й подивись на вкладку «Сторінка»: підпис має показати `520%%decimalMark%%05`. Потім поверни `52000`.
  en: |
    So far `app.js` only printed lines to the console. Now it computes the page text. Write the new code in `app.js` below the existing lines of code.

    1. **Two expenses.** Describe two records with the fields `id`, `label`, `amountMinor`, `date` and `category`. The project stores an amount as a **whole number of kopiykas** (the minor unit of the hryvnia): `52000` means 520 hryvnias 00 kopiykas.
       - `"e-02"`: label “%%nameValue%%”, amount `52000`, date `"2026-03-01"`, category `"transport"`;
       - `"e-04"`: label “%%secondName%%”, amount `9990`, date `"2026-02-27"`, category `"home"`.
    2. **Labels.** Build a label for each expense: the label, a separator of your choice (for example ` — `) and the amount in hryvnias **with two digits of kopiykas** and the word “%%currency%%”. A “%%decimalMark%%” stands between the hryvnias and the kopiykas. You should get “%%nameValue%% — %%firstCheck%% %%currency%%” and “%%secondName%% — %%secondCheck%% %%currency%%”. Compute this from `amountMinor` with plain arithmetic (`%`, `-`, `/`) and a comparison — no rounding functions are needed.
    3. **Draft.** Add a draft of a new expense with exactly this data: `const draft = { label: "%%draftLabel%%", amountMinor: 150.5, date: "2026-03-02", category: "" };`. This is what data from the form you build in unit JS-06 will look like. Compute separate messages for the amount and the category of the draft:
       - the amount is not a whole number of kopiykas above zero → “%%invalidMessage%%”;
       - the category is the empty text `""` → “%%requiredMessage%%”;
       - the field is fine → the empty text `""`.
    4. **Onto the page.** In `index.html`, inside `<main>`, add four empty paragraphs with an `id` attribute: `first-label`, `second-label`, `amount-message` and `category-message`. At the end of `app.js`, fill each paragraph with a ready-made line of code like this, using your own variable:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       This line of code finds the element with `id="first-label"` on the page and writes the text into it. Unit JS-06 explains in detail how this works.

    Name a value that does not change after its declaration with `const`; use `let` only for what you reassign.

    **The checks look at the page:** the script runs without errors; `<main>` has text in which `%%firstCheck%%` follows “%%nameValue%%”, text in which `%%secondCheck%%` follows “%%secondName%%”, and both draft messages; this text is written by the script, not typed into `index.html`. Variable names and the separator can be your own.

    When everything passes, give the first expense the amount `52005`, press “Run” and look at the “Page” tab: its label should show `520%%decimalMark%%05`. Then put `52000` back.
nudge:
  uk: "Подумай, як табло показує 125 секунд: це 2 хвилини й 5 секунд, і на табло видно `2:05`. Секунди — це остача від ділення на `60`; цілі хвилини — те, що лишається без цієї остачі, поділене на `60`; а одна цифра секунд отримує нуль попереду. З гривнями й копійками все так само, лише в гривні не `60`, а `100` копійок. Для суми чернетки згадай, як в уроці про валідацію відрізняли ціле число від дробового."
  en: "Think of how a display shows 125 seconds: it is 2 minutes and 5 seconds, and the display reads `2:05`. The seconds are the remainder of dividing by `60`; the whole minutes are what is left without that remainder, divided by `60`; and a single digit of seconds gets a zero in front. Hryvnias and kopiykas work the same way, only a hryvnia holds `100` kopiykas, not `60`. For the draft's amount, recall how the validation lesson told a whole number from a fractional one."
testTitles:
  "the script runs without errors":
    uk: "Скрипт працює без помилок"
    en: "The script runs without errors"
  "the first record label is shown":
    uk: "На сторінці є підпис «%%nameValue%%» із сумою `%%firstCheck%%`"
    en: "The page shows the label “%%nameValue%%” with the amount `%%firstCheck%%`"
  "the second record label is shown":
    uk: "На сторінці є підпис «%%secondName%%» із сумою `%%secondCheck%%`"
    en: "The page shows the label “%%secondName%%” with the amount `%%secondCheck%%`"
  "the draft gets the required-field message":
    uk: "Порожня категорія чернетки дає повідомлення «%%requiredMessage%%»"
    en: "The draft's empty category gives the message “%%requiredMessage%%”"
  "the draft gets the invalid-value message":
    uk: "Сума чернетки `150.5` дає повідомлення «%%invalidMessage%%»"
    en: "The draft's amount `150.5` gives the message “%%invalidMessage%%”"
  "the script writes the new lines":
    uk: "Новий текст записує `app.js`, а не `index.html`"
    en: "The new text is written by `app.js`, not typed into `index.html`"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: |
        Ця перевірка чекає, що скрипт виконається до кінця без помилки. Помилка зупиняє решту коду, тому разом із цією перевіркою не проходять і ті, що дивляться на сторінку. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль».

        - Якщо там `TypeError: Cannot set properties of null (setting 'textContent')`, то `document.querySelector` не знайшов елемент і повернув `null`. Селектор має збігатися з `id` абзацу в `index.html` до літери й мати `#` попереду, як у `"#first-label"`.
        - Якщо там `ReferenceError`, то скрипт звертається до назви, якої не знає: звір написання з оголошенням і те, що оголошення стоїть вище за рядок коду, де назву використано.
      en: |
        This check expects the script to run to the end without an error. An error stops the rest of the code, so the checks that look at the page fail together with this one. The “Console” tab shows the error name and the line of code where it happened.

        - If it shows `TypeError: Cannot set properties of null (setting 'textContent')`, `document.querySelector` found no element and returned `null`. The selector must match the paragraph's `id` in `index.html` letter for letter and start with `#`, as in `"#first-label"`.
        - If it shows `ReferenceError`, the script uses a name it does not know: compare the spelling with the declaration, and check that the declaration stands above the line of code that uses the name.
  - when: { test: "the first record label is shown" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент із текстом, у якому після «%%nameValue%%» стоїть `%%firstCheck%%`: гривні, «%%decimalMark%%» і дві цифри копійок. Якщо бачиш `520%%decimalMark%%0`, копійки показано однією цифрою; якщо `52000` — суму показано в копійках."
      en: "This check looks inside `<main>` for an element whose text has `%%firstCheck%%` after “%%nameValue%%”: hryvnias, “%%decimalMark%%” and two digits of kopiykas. If you see `520%%decimalMark%%0`, the kopiykas are shown with one digit; if you see `52000`, the amount is shown in kopiykas."
  - when: { test: "the second record label is shown" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент із текстом, у якому після «%%secondName%%» стоїть `%%secondCheck%%`. Якщо бачиш `99.9`, це результат звичайного ділення на `100`: у ньому крапка й лише одна цифра після неї."
      en: "This check looks inside `<main>` for an element whose text has `%%secondCheck%%` after “%%secondName%%”. If you see `99.9`, that is the result of a plain division by `100`: it has a point and only one digit after it."
  - when: { test: "the draft gets the required-field message" }
    message:
      uk: "Ця перевірка шукає в `<main>` текст «%%requiredMessage%%»: категорія чернетки — порожній текст `\"\"`. Повідомлення має потрапити в абзац усередині `<main>`."
      en: "This check looks inside `<main>` for the text “%%requiredMessage%%”: the draft's category is the empty text `\"\"`. The message must land in a paragraph inside `<main>`."
  - when: { test: "the draft gets the invalid-value message" }
    message:
      uk: "Ця перевірка шукає в `<main>` текст «%%invalidMessage%%» для суми `150.5`: вона більша за нуль, але не ціла, тож умова для суми має відкидати й дробові числа."
      en: "This check looks inside `<main>` for the text “%%invalidMessage%%” for the amount `150.5`: it is above zero but not whole, so the condition for the amount must reject fractional numbers too."
  - when: { test: "the script writes the new lines" }
    message:
      uk: "Ця перевірка чекає, що в `index.html` немає ні другого підпису, ні повідомлень чернетки: абзаци для них там порожні, а текст у них записує `app.js`. Тоді сторінка показує те, що обчислив скрипт, навіть коли дані зміняться."
      en: "This check expects `index.html` to hold neither the second label nor the draft messages: their paragraphs are empty there, and `app.js` writes the text into them. Then the page shows what the script computed, even when the data changes."
