# Wishlist variant of step JS-02. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  firstCategory: { uk: "Техніка", en: "Tech" }
  secondName: { uk: "Квитки на концерт", en: "Concert tickets" }
  noPrice: { uk: "без ціни", en: "no price" }
  requiredMessage: { uk: "Вкажи назву бажання", en: "Enter a name for the wish" }
  invalidMessage: { uk: "Ціна не може бути меншою за нуль", en: "The price cannot be below zero" }
  # Read only by the shared checks (tests.js): the value each label must show after the name.
  firstCheck: { uk: "80", en: "80" }
  secondCheck: { uk: "без ціни", en: "no price" }
instructions:
  uk: |
    Досі `app.js` лише друкував рядки в консоль. Тепер він обчислить текст для сторінки. Нове пиши в `app.js` під наявними рядками.

    1. **Два бажання.** Опиши два записи — об’єкти з полями `id`, `name`, `price`, `acquired` і `category`:
       - `"w-01"`: назва «%%nameValue%%», ціна `80`, ще не отримане (`false`), категорія «%%firstCategory%%»;
       - `"w-05"`: назва «%%secondName%%», ціни немає (`null`), ще не отримане, категорії немає (`null`).
    2. **Підписи.** Для кожного бажання склади підпис: назва, роздільник на твій смак (наприклад, ` — `) і ціна. Якщо ціни немає, замість неї стоїть «%%noPrice%%» — підстав цей текст через `??`. Має вийти «%%nameValue%% — 80» і «%%secondName%% — %%noPrice%%».
    3. **Чернетка.** Додай чернетку нового бажання саме з такими даними: `const draft = { name: "", price: -5 };`. Так виглядатимуть дані з форми, яку ти зробиш у розділі JS-06. Для кожного поля чернетки обчисли окреме повідомлення:
       - назва — порожній рядок → «%%requiredMessage%%»;
       - ціна менша за нуль → «%%invalidMessage%%»;
       - з полем усе гаразд → порожній рядок `""`.
    4. **На сторінку.** У `index.html` усередині `<main>` додай чотири порожні абзаци з атрибутом `id`: `first-label`, `second-label`, `name-message` і `price-message`. У кінці `app.js` заповни кожен готовим рядком такого вигляду, підставивши свою змінну:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       Рядок знаходить на сторінці елемент з `id="first-label"` і записує в нього текст. Як це працює, детально розбереш у розділі JS-06.

    Значення, яке після оголошення не змінюється, називай через `const`; `let` — лише для того, що переприсвоюєш.

    **Перевірка дивиться на сторінку:** скрипт працює без помилок; у `<main>` є рядок із «%%nameValue%%» і `80`, рядок із «%%secondName%%» і «%%noPrice%%» та обидва повідомлення чернетки; цей текст записує скрипт, а не `index.html`. Назви змінних і роздільник можуть бути твоїми.

    Коли все пройде, спробуй поставити першому бажанню ціну `null` і запусти: підпис має показати «%%noPrice%%». Потім поверни `80`.
  en: |
    So far `app.js` only printed lines to the console. Now it computes the page text. Write the new code in `app.js` below the existing lines.

    1. **Two wishes.** Describe two records — objects with the fields `id`, `name`, `price`, `acquired` and `category`:
       - `"w-01"`: name “%%nameValue%%”, price `80`, not acquired yet (`false`), category “%%firstCategory%%”;
       - `"w-05"`: name “%%secondName%%”, no price (`null`), not acquired yet, no category (`null`).
    2. **Labels.** Build a label for each wish: the name, a separator of your choice (for example ` — `) and the price. When there is no price, “%%noPrice%%” stands in its place — put this text in with `??`. You should get “%%nameValue%% — 80” and “%%secondName%% — %%noPrice%%”.
    3. **Draft.** Add a draft of a new wish with exactly this data: `const draft = { name: "", price: -5 };`. This is what data from the form you build in unit JS-06 will look like. Compute a separate message for each field of the draft:
       - the name is an empty string → “%%requiredMessage%%”;
       - the price is below zero → “%%invalidMessage%%”;
       - the field is fine → an empty string `""`.
    4. **Onto the page.** In `index.html`, inside `<main>`, add four empty paragraphs with an `id` attribute: `first-label`, `second-label`, `name-message` and `price-message`. At the end of `app.js`, fill each one with a ready-made line like this, using your own variable:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       The line finds the element with `id="first-label"` on the page and writes the text into it. Unit JS-06 explains in detail how this works.

    Name a value that does not change after its declaration with `const`; use `let` only for what you reassign.

    **The checks look at the page:** the script runs without errors; `<main>` has a line with “%%nameValue%%” and `80`, a line with “%%secondName%%” and “%%noPrice%%”, and both draft messages; this text is written by the script, not typed into `index.html`. Variable names and the separator can be your own.

    When everything passes, try giving the first wish the price `null` and run: its label should show “%%noPrice%%”. Then put `80` back.
nudge:
  uk: "Почни з одного рядка: склади підпис першого бажання в `const` і виведи його через `console.log`. Коли в консолі буде «%%nameValue%% — 80», зроби так само для другого. Для повідомлення підійде `let` із порожнім рядком і `if`, що його переприсвоює. Бачиш `null` замість «%%noPrice%%»? Згадай, що виконується раніше: `+` чи `??`."
  en: "Start with one line: build the first wish's label in a `const` and print it with `console.log`. When the console shows “%%nameValue%% — 80”, do the same for the second one. For a message, a `let` holding an empty string and an `if` that reassigns it works well. Seeing `null` instead of “%%noPrice%%”? Recall which runs first: `+` or `??`."
testTitles:
  "the script runs without errors":
    uk: "Скрипт працює без помилок"
    en: "The script runs without errors"
  "the first record label is shown":
    uk: "На сторінці є підпис «%%nameValue%%» з ціною `80`"
    en: "The page shows the label “%%nameValue%%” with the price `80`"
  "the second record label is shown":
    uk: "На сторінці є підпис «%%secondName%%» з текстом «%%noPrice%%»"
    en: "The page shows the label “%%secondName%%” with the text “%%noPrice%%”"
  "the draft gets the required-field message":
    uk: "Порожня назва чернетки дає повідомлення «%%requiredMessage%%»"
    en: "The draft's empty name gives the message “%%requiredMessage%%”"
  "the draft gets the invalid-value message":
    uk: "Ціна чернетки `-5` дає повідомлення «%%invalidMessage%%»"
    en: "The draft's price `-5` gives the message “%%invalidMessage%%”"
  "the script writes the new lines":
    uk: "Новий текст записує `app.js`, а не `index.html`"
    en: "The new text is written by `app.js`, not typed into `index.html`"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: |
        Скрипт зупинився з помилкою, тому решта коду не виконалася. Назву помилки й рядок показує консоль у перегляді.

        - `TypeError: Cannot set properties of null (setting 'textContent')` — `document.querySelector` не знайшов елемент і повернув `null`. Перевір, що в `index.html` усередині `<main>` є абзац саме з таким `id` і що в селекторі перед назвою стоїть `#`: `"#first-label"`. Великі й малі літери мають збігатися.
        - `ReferenceError` — скрипт звертається до імені, якого не знає. Перевір написання; якщо ім’я оголошено нижче, ніж використано, перенеси оголошення вище: до `const` і `let` не можна звертатися раніше за їхній рядок.
      en: |
        The script stopped with an error, so the rest of the code did not run. The console in the preview shows the error name and the line.

        - `TypeError: Cannot set properties of null (setting 'textContent')` — `document.querySelector` found no element and returned `null`. Check that `index.html` has a paragraph with exactly this `id` inside `<main>` and that the selector has a `#` before the name: `"#first-label"`. Upper and lower case must match.
        - `ReferenceError` — the script uses a name it does not know. Check the spelling; if the name is declared below the place where you use it, move the declaration up: a `const` or `let` cannot be used before its line.
  - when: { test: "the first record label is shown" }
    message:
      uk: "У `<main>` має бути рядок, у якому після «%%nameValue%%» стоїть `80`. Переконайся, що абзац для підпису стоїть усередині `<main>` і що в нього записується підпис саме першого бажання."
      en: "`<main>` needs a line in which `80` follows “%%nameValue%%”. Make sure the paragraph for the label is inside `<main>` and that the first wish's label is written into it."
  - when: { test: "the second record label is shown" }
    message:
      uk: "Для бажання без ціни підпис має містити «%%noPrice%%». Бачиш замість цього `null`? Тоді `??` застосувався не до ціни, а до всього тексту: `+` виконується раніше за `??`, а складений текст ніколи не буває `null`. Візьми `price ?? …` у дужки або обчисли текст ціни окремою константою."
      en: "For a wish without a price the label must contain “%%noPrice%%”. Seeing `null` instead? Then `??` was applied to the whole text, not to the price: `+` runs before `??`, and the joined text is never `null`. Put `price ?? …` in parentheses or compute the price text in its own constant."
  - when: { test: "the draft gets the required-field message" }
    message:
      uk: "Назва чернетки — порожній рядок `\"\"`, тож на сторінці має бути «%%requiredMessage%%». Перевір умову й те, що повідомлення потрапляє в абзац усередині `<main>`."
      en: "The draft's name is an empty string `\"\"`, so the page must show “%%requiredMessage%%”. Check the condition and that the message lands in a paragraph inside `<main>`."
  - when: { test: "the draft gets the invalid-value message" }
    message:
      uk: "Ціна чернетки `-5` менша за нуль, тож на сторінці має бути «%%invalidMessage%%». Перевір знак порівняння: `<` означає «менше»."
      en: "The draft's price `-5` is below zero, so the page must show “%%invalidMessage%%”. Check the comparison sign: `<` means “less than”."
  - when: { test: "the script writes the new lines" }
    message:
      uk: "Цей текст уже вписано в `index.html` руками. Залиш абзаци порожніми — `<p id=\"…\"></p>` — і заповни їх зі `app.js`: тоді сторінка показуватиме те, що обчислив скрипт, навіть коли дані зміняться."
      en: "This text is already typed into `index.html`. Leave the paragraphs empty — `<p id=\"…\"></p>` — and fill them from `app.js`: then the page shows what the script computed, even when the data changes."
