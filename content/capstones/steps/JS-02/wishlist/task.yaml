# Wishlist variant of step JS-02. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  firstCategory: { uk: "Техніка", en: "Tech" }
  secondName: { uk: "Квитки на концерт", en: "Concert tickets" }
  noPrice: { uk: "без ціни", en: "no price" }
  requiredMessage: { uk: "Вкажи назву бажання", en: "Enter a name for the wish" }
  invalidMessage: { uk: "Ціна не може бути меншою за нуль", en: "The price cannot be below zero" }
  # Read only by the shared checks (tests.js): the value each label must show after the name.
  firstCheck: { uk: "80", en: "80" }
  secondCheck: { uk: "без ціни", en: "no price" }
instructions:
  uk: |
    Досі `app.js` лише друкував рядки в консоль. Тепер він обчислить текст для сторінки. Новий код пиши в `app.js` під наявними рядками коду.

    1. **Два бажання.** Опиши два записи з полями `id`, `name`, `price`, `acquired` і `category`:
       - `"w-01"`: назва «%%nameValue%%», ціна `80`, ще не отримане (`false`), категорія «%%firstCategory%%»;
       - `"w-05"`: назва «%%secondName%%», ціни немає (`null`), ще не отримане, категорії немає (`null`).
    2. **Підписи.** Для кожного бажання склади підпис: назва, роздільник на твій смак (наприклад, ` — `) і ціна. Якщо ціни немає, замість неї стоїть «%%noPrice%%» — підстав цей текст через `??`. Має вийти «%%nameValue%% — 80» і «%%secondName%% — %%noPrice%%».
    3. **Чернетка.** Додай чернетку нового бажання саме з такими даними: `const draft = { name: "", price: -5 };`. Так виглядатимуть дані з форми, яку ти зробиш у розділі JS-06. Для кожного поля чернетки обчисли окреме повідомлення:
       - назва — порожній текст `""` → «%%requiredMessage%%»;
       - ціна менша за нуль → «%%invalidMessage%%»;
       - з полем усе гаразд → порожній текст `""`.
    4. **На сторінку.** У `index.html` усередині `<main>` додай чотири порожні абзаци з атрибутом `id`: `first-label`, `second-label`, `name-message` і `price-message`. У кінці `app.js` заповни кожен абзац готовим рядком коду такого вигляду, підставивши свою змінну:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       Цей рядок коду знаходить на сторінці елемент з `id="first-label"` і записує в нього текст. Як це працює, детально розбереш у розділі JS-06.

    Значення, яке після оголошення не змінюється, називай через `const`; `let` — лише для того, що переприсвоюєш.

    **Перевірка дивиться на сторінку:** код у `app.js` працює без помилок; у `<main>` є текст, де після «%%nameValue%%» стоїть `80`, текст, де після «%%secondName%%» стоїть «%%noPrice%%», і обидва повідомлення чернетки; цей текст записує `app.js`, а не `index.html`. Назви змінних і роздільник можуть бути твоїми.

    Коли все пройде, постав першому бажанню ціну `null`, натисни «Запустити» й подивись на вкладку «Сторінка»: підпис має показати «%%noPrice%%». Потім поверни `80`.
  en: |
    So far `app.js` only printed lines to the console. Now it computes the page text. Write the new code in `app.js` below the existing lines of code.

    1. **Two wishes.** Describe two records with the fields `id`, `name`, `price`, `acquired` and `category`:
       - `"w-01"`: name “%%nameValue%%”, price `80`, not acquired yet (`false`), category “%%firstCategory%%”;
       - `"w-05"`: name “%%secondName%%”, no price (`null`), not acquired yet, no category (`null`).
    2. **Labels.** Build a label for each wish: the name, a separator of your choice (for example ` — `) and the price. When there is no price, “%%noPrice%%” stands in its place — put this text in with `??`. You should get “%%nameValue%% — 80” and “%%secondName%% — %%noPrice%%”.
    3. **Draft.** Add a draft of a new wish with exactly this data: `const draft = { name: "", price: -5 };`. This is what data from the form you build in unit JS-06 will look like. Compute a separate message for each field of the draft:
       - the name is the empty text `""` → “%%requiredMessage%%”;
       - the price is below zero → “%%invalidMessage%%”;
       - the field is fine → the empty text `""`.
    4. **Onto the page.** In `index.html`, inside `<main>`, add four empty paragraphs with an `id` attribute: `first-label`, `second-label`, `name-message` and `price-message`. At the end of `app.js`, fill each paragraph with a ready-made line of code like this, using your own variable:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       This line of code finds the element with `id="first-label"` on the page and writes the text into it. Unit JS-06 explains in detail how this works.

    Name a value that does not change after its declaration with `const`; use `let` only for what you reassign.

    **The checks look at the page:** the script runs without errors; `<main>` has text in which `80` follows “%%nameValue%%”, text in which “%%noPrice%%” follows “%%secondName%%”, and both draft messages; this text is written by the script, not typed into `index.html`. Variable names and the separator can be your own.

    When everything passes, give the first wish the price `null`, press “Run” and look at the “Page” tab: its label should show “%%noPrice%%”. Then put `80` back.
nudge:
  uk: "Почни з першого бажання: склади його підпис у `const`, виведи через `console.log` і подивись на вкладку «Консоль». Коли там буде «%%nameValue%% — 80», зроби так само для другого. Для повідомлення підійде `let` із порожнім текстом `\"\"` і `if`, який його переприсвоює. Бачиш `null` замість «%%noPrice%%»? Згадай, що виконується раніше: `+` чи `??`."
  en: "Start with the first wish: build its label in a `const`, print it with `console.log` and look at the “Console” tab. When it shows “%%nameValue%% — 80”, do the same for the second one. For a message, a `let` holding the empty text `\"\"` and an `if` that reassigns it works well. Seeing `null` instead of “%%noPrice%%”? Recall which runs first: `+` or `??`."
testTitles:
  "the script runs without errors":
    uk: "Код у `app.js` працює без помилок"
    en: "The script runs without errors"
  "the first record label is shown":
    uk: "На сторінці є підпис «%%nameValue%%» із ціною `80`"
    en: "The page shows the label “%%nameValue%%” with the price `80`"
  "the second record label is shown":
    uk: "На сторінці є підпис «%%secondName%%» з текстом «%%noPrice%%»"
    en: "The page shows the label “%%secondName%%” with the text “%%noPrice%%”"
  "the draft gets the required-field message":
    uk: "Порожня назва чернетки дає повідомлення «%%requiredMessage%%»"
    en: "The draft's empty name gives the message “%%requiredMessage%%”"
  "the draft gets the invalid-value message":
    uk: "Ціна чернетки `-5` дає повідомлення «%%invalidMessage%%»"
    en: "The draft's price `-5` gives the message “%%invalidMessage%%”"
  "the script writes the new lines":
    uk: "Новий текст записує `app.js`, а не `index.html`"
    en: "The new text is written by `app.js`, not typed into `index.html`"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: |
        Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки. Помилка зупиняє решту коду, тому разом із цією перевіркою не проходять і ті, що дивляться на сторінку. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль».

        - Якщо там `TypeError: Cannot set properties of null (setting 'textContent')`, то `document.querySelector` не знайшов елемент і повернув `null`. Селектор має збігатися з `id` абзацу в `index.html` до літери й мати `#` попереду, як у `"#first-label"`.
        - Якщо там `ReferenceError`, то код звертається до назви, якої не знає: звір написання з оголошенням і те, що оголошення стоїть вище за рядок коду, де назву використано.
      en: |
        This check expects the script to run to the end without an error. An error stops the rest of the code, so the checks that look at the page fail together with this one. The “Console” tab shows the error name and the line of code where it happened.

        - If it shows `TypeError: Cannot set properties of null (setting 'textContent')`, `document.querySelector` found no element and returned `null`. The selector must match the paragraph's `id` in `index.html` letter for letter and start with `#`, as in `"#first-label"`.
        - If it shows `ReferenceError`, the script uses a name it does not know: compare the spelling with the declaration, and check that the declaration stands above the line of code that uses the name.
  - when: { test: "the first record label is shown" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент із текстом, у якому після «%%nameValue%%» стоїть `80`. Підпис першого бажання має потрапити в абзац усередині `<main>`."
      en: "This check looks inside `<main>` for an element whose text has `80` after “%%nameValue%%”. The first wish's label must land in a paragraph inside `<main>`."
  - when: { test: "the second record label is shown" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент із текстом, у якому після «%%secondName%%» стоїть «%%noPrice%%». Якщо там `null`, то `??` отримав увесь складений текст, а не ціну: `+` виконується раніше за `??`, а складений текст ніколи не дорівнює `null`."
      en: "This check looks inside `<main>` for an element whose text has “%%noPrice%%” after “%%secondName%%”. If it shows `null`, `??` received the whole joined text instead of the price: `+` runs before `??`, and joined text is never `null`."
  - when: { test: "the draft gets the required-field message" }
    message:
      uk: "Ця перевірка шукає в `<main>` текст «%%requiredMessage%%»: назва чернетки — порожній текст `\"\"`. Повідомлення має потрапити в абзац усередині `<main>`."
      en: "This check looks inside `<main>` for the text “%%requiredMessage%%”: the draft's name is the empty text `\"\"`. The message must land in a paragraph inside `<main>`."
  - when: { test: "the draft gets the invalid-value message" }
    message:
      uk: "Ця перевірка шукає в `<main>` текст «%%invalidMessage%%»: ціна чернетки `-5` менша за нуль. Якщо його немає, простеж, яке значення дає твоя умова для `-5`."
      en: "This check looks inside `<main>` for the text “%%invalidMessage%%”: the draft's price `-5` is below zero. If it is missing, trace the value your condition gives for `-5`."
  - when: { test: "the script writes the new lines" }
    message:
      uk: "Ця перевірка чекає, що в `index.html` немає ні підписів обох записів, ні повідомлень чернетки: абзаци для них там порожні, а текст у них записує `app.js`. Тоді сторінка показує те, що обчислив код, навіть коли дані зміняться."
      en: "This check expects `index.html` to hold neither the labels of the two records nor the draft messages: their paragraphs are empty there, and `app.js` writes the text into them. Then the page shows what the script computed, even when the data changes."
