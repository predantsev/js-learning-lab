# Habit tracker variant of step JS-02. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  secondName: { uk: "Прибирання", en: "Tidy up" }
  daily: { uk: "щодня", en: "daily" }
  weekly: { uk: "щотижня", en: "weekly" }
  requiredMessage: { uk: "Вкажи назву звички", en: "Enter a name for the habit" }
  invalidMessage: { uk: "Невідома частота", en: "Unknown frequency" }
  # Read only by the shared checks (tests.js): the value each label must show after the name.
  firstCheck: { uk: "щодня", en: "daily" }
  secondCheck: { uk: "щотижня", en: "weekly" }
instructions:
  uk: |
    Досі `app.js` лише друкував рядки в консоль. Тепер він обчислить текст для сторінки. Новий код пиши в `app.js` під наявними рядками коду.

    1. **Дві звички.** Опиши два записи з полями `id`, `name`, `frequency` і `active`:
       - `"h-01"`: назва «%%nameValue%%», частота `"daily"`, активна (`true`);
       - `"h-04"`: назва «%%secondName%%», частота `"weekly"`, активна.

       Дати виконань звички — це список; його ти додаси в розділі JS-04, коли навчишся працювати зі списками.
    2. **Підписи.** Для кожної звички склади підпис: назва, роздільник на твій смак (наприклад, ` · `) і частота словами: `"daily"` → «%%daily%%», `"weekly"` → «%%weekly%%». Слово обирай через `switch`. Має вийти «%%nameValue%% · %%daily%%» і «%%secondName%% · %%weekly%%».
    3. **Чернетка.** Додай чернетку нової звички саме з такими даними: `const draft = { name: "", frequency: "monthly" };`. Так виглядатимуть дані з форми, яку ти зробиш у розділі JS-06. Для кожного поля чернетки обчисли окреме повідомлення:
       - назва — порожній текст `""` → «%%requiredMessage%%»;
       - частота — не `"daily"` і не `"weekly"` → «%%invalidMessage%%»;
       - з полем усе гаразд → порожній текст `""`.
    4. **На сторінку.** У `index.html` усередині `<main>` додай чотири порожні абзаци з атрибутом `id`: `first-label`, `second-label`, `name-message` і `frequency-message`. У кінці `app.js` заповни кожен абзац готовим рядком коду такого вигляду, підставивши свою змінну:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       Цей рядок коду знаходить на сторінці елемент з `id="first-label"` і записує в нього текст. Як це працює, детально розбереш у розділі JS-06.

    Значення, яке після оголошення не змінюється, називай через `const`; `let` — лише для того, що переприсвоюєш.

    **Перевірка дивиться на сторінку:** код у `app.js` працює без помилок; у `<main>` є текст, де після «%%nameValue%%» стоїть «%%daily%%», текст, де після «%%secondName%%» стоїть «%%weekly%%», і обидва повідомлення чернетки; цей текст записує `app.js`, а не `index.html`. Назви змінних і роздільник можуть бути твоїми.

    Коли все пройде, прибери один `break` у своєму `switch`, натисни «Запустити» й подивись на вкладку «Сторінка»: яке слово тепер отримала перша звичка? Потім поверни `break`.
  en: |
    So far `app.js` only printed lines to the console. Now it computes the page text. Write the new code in `app.js` below the existing lines of code.

    1. **Two habits.** Describe two records with the fields `id`, `name`, `frequency` and `active`:
       - `"h-01"`: name “%%nameValue%%”, frequency `"daily"`, active (`true`);
       - `"h-04"`: name “%%secondName%%”, frequency `"weekly"`, active.

       The dates a habit was completed form a list; you add it in unit JS-04, when you learn to work with lists.
    2. **Labels.** Build a label for each habit: the name, a separator of your choice (for example ` · `) and the frequency in words: `"daily"` → “%%daily%%”, `"weekly"` → “%%weekly%%”. Choose the word with `switch`. You should get “%%nameValue%% · %%daily%%” and “%%secondName%% · %%weekly%%”.
    3. **Draft.** Add a draft of a new habit with exactly this data: `const draft = { name: "", frequency: "monthly" };`. This is what data from the form you build in unit JS-06 will look like. Compute a separate message for each field of the draft:
       - the name is the empty text `""` → “%%requiredMessage%%”;
       - the frequency is not `"daily"` or `"weekly"` → “%%invalidMessage%%”;
       - the field is fine → the empty text `""`.
    4. **Onto the page.** In `index.html`, inside `<main>`, add four empty paragraphs with an `id` attribute: `first-label`, `second-label`, `name-message` and `frequency-message`. At the end of `app.js`, fill each paragraph with a ready-made line of code like this, using your own variable:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       This line of code finds the element with `id="first-label"` on the page and writes the text into it. Unit JS-06 explains in detail how this works.

    Name a value that does not change after its declaration with `const`; use `let` only for what you reassign.

    **The checks look at the page:** the script runs without errors; `<main>` has text in which “%%daily%%” follows “%%nameValue%%”, text in which “%%weekly%%” follows “%%secondName%%”, and both draft messages; this text is written by the script, not typed into `index.html`. Variable names and the separator can be your own.

    When everything passes, remove one `break` from your `switch`, press “Run” and look at the “Page” tab: which word does the first habit get now? Then put the `break` back.
nudge:
  uk: "Почни з першої звички: обери слово для частоти через `switch`, склади підпис у `const`, виведи через `console.log` і подивись на вкладку «Консоль». Коли там буде «%%nameValue%% · %%daily%%», зроби так само для другої. У `switch` кілька гілок `case` можуть стояти одна під одною й ділити спільний код, а все, що не збіглося з жодною, потрапляє в `default`."
  en: "Start with the first habit: choose the frequency word with a `switch`, build the label in a `const`, print it with `console.log` and look at the “Console” tab. When it shows “%%nameValue%% · %%daily%%”, do the same for the second one. In a `switch`, several `case` branches can stand one under another and share code, and everything that matches none of them lands in `default`."
testTitles:
  "the script runs without errors":
    uk: "Код у `app.js` працює без помилок"
    en: "The script runs without errors"
  "the first record label is shown":
    uk: "На сторінці є підпис «%%nameValue%%» із частотою «%%daily%%»"
    en: "The page shows the label “%%nameValue%%” with the frequency “%%daily%%”"
  "the second record label is shown":
    uk: "На сторінці є підпис «%%secondName%%» із частотою «%%weekly%%»"
    en: "The page shows the label “%%secondName%%” with the frequency “%%weekly%%”"
  "the draft gets the required-field message":
    uk: "Порожня назва чернетки дає повідомлення «%%requiredMessage%%»"
    en: "The draft's empty name gives the message “%%requiredMessage%%”"
  "the draft gets the invalid-value message":
    uk: "Частота чернетки `\"monthly\"` дає повідомлення «%%invalidMessage%%»"
    en: "The draft's frequency `\"monthly\"` gives the message “%%invalidMessage%%”"
  "the script writes the new lines":
    uk: "Новий текст записує `app.js`, а не `index.html`"
    en: "The new text is written by `app.js`, not typed into `index.html`"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: |
        Ця перевірка чекає, що код у `app.js` виконається до кінця без помилки. Помилка зупиняє решту коду, тому разом із цією перевіркою не проходять і ті, що дивляться на сторінку. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль».

        - Якщо там `TypeError: Cannot set properties of null (setting 'textContent')`, то `document.querySelector` не знайшов елемент і повернув `null`. Селектор має збігатися з `id` абзацу в `index.html` до літери й мати `#` попереду, як у `"#first-label"`.
        - Якщо там `ReferenceError`, то код звертається до назви, якої не знає: звір написання з оголошенням і те, що оголошення стоїть вище за рядок коду, де назву використано.
      en: |
        This check expects the script to run to the end without an error. An error stops the rest of the code, so the checks that look at the page fail together with this one. The “Console” tab shows the error name and the line of code where it happened.

        - If it shows `TypeError: Cannot set properties of null (setting 'textContent')`, `document.querySelector` found no element and returned `null`. The selector must match the paragraph's `id` in `index.html` letter for letter and start with `#`, as in `"#first-label"`.
        - If it shows `ReferenceError`, the script uses a name it does not know: compare the spelling with the declaration, and check that the declaration stands above the line of code that uses the name.
  - when: { test: "the first record label is shown" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент із текстом, у якому після «%%nameValue%%» стоїть «%%daily%%». Якщо перша звичка показує «%%weekly%%», виконання провалилося з гілки `\"daily\"` у наступну гілку `switch`."
      en: "This check looks inside `<main>` for an element whose text has “%%daily%%” after “%%nameValue%%”. If the first habit shows “%%weekly%%”, execution fell through from the `\"daily\"` branch into the next branch of the `switch`."
  - when: { test: "the second record label is shown" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент із текстом, у якому після «%%secondName%%» стоїть «%%weekly%%». Слово має залежати від частоти саме другої звички, а підпис — потрапити в абзац усередині `<main>`."
      en: "This check looks inside `<main>` for an element whose text has “%%weekly%%” after “%%secondName%%”. The word must depend on the second habit's own frequency, and the label must land in a paragraph inside `<main>`."
  - when: { test: "the draft gets the required-field message" }
    message:
      uk: "Ця перевірка шукає в `<main>` текст «%%requiredMessage%%»: назва чернетки — порожній текст `\"\"`. Повідомлення має потрапити в абзац усередині `<main>`."
      en: "This check looks inside `<main>` for the text “%%requiredMessage%%”: the draft's name is the empty text `\"\"`. The message must land in a paragraph inside `<main>`."
  - when: { test: "the draft gets the invalid-value message" }
    message:
      uk: "Ця перевірка шукає в `<main>` текст «%%invalidMessage%%»: частота `\"monthly\"` не входить до відомих. Якщо його немає, простеж, яка гілка `switch` виконується для `\"monthly\"`."
      en: "This check looks inside `<main>` for the text “%%invalidMessage%%”: the frequency `\"monthly\"` is not one of the known ones. If it is missing, trace which branch of the `switch` runs for `\"monthly\"`."
  - when: { test: "the script writes the new lines" }
    message:
      uk: "Ця перевірка чекає, що в `index.html` немає ні підписів обох записів, ні повідомлень чернетки: абзаци для них там порожні, а текст у них записує `app.js`. Тоді сторінка показує те, що обчислив код, навіть коли дані зміняться."
      en: "This check expects `index.html` to hold neither the labels of the two records nor the draft messages: their paragraphs are empty there, and `app.js` writes the text into them. Then the page shows what the script computed, even when the data changes."
