# Habit tracker variant of step JS-02. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  secondName: { uk: "Прибирання", en: "Tidy up" }
  daily: { uk: "щодня", en: "daily" }
  weekly: { uk: "щотижня", en: "weekly" }
  requiredMessage: { uk: "Вкажи назву звички", en: "Enter a name for the habit" }
  invalidMessage: { uk: "Невідома частота", en: "Unknown frequency" }
  # Read only by the shared checks (tests.js): the value each label must show after the name.
  firstCheck: { uk: "щодня", en: "daily" }
  secondCheck: { uk: "щотижня", en: "weekly" }
instructions:
  uk: |
    Досі `app.js` лише друкував рядки в консоль. Тепер він обчислить текст для сторінки. Нове пиши в `app.js` під наявними рядками.

    1. **Дві звички.** Опиши два записи — об’єкти з полями `id`, `name`, `frequency` і `active`:
       - `"h-01"`: назва «%%nameValue%%», частота `"daily"`, активна (`true`);
       - `"h-04"`: назва «%%secondName%%», частота `"weekly"`, активна.

       Дати виконань звички — це список; його ти додаси в розділі JS-04, коли навчишся працювати зі списками.
    2. **Підписи.** Для кожної звички склади підпис: назва, роздільник на твій смак (наприклад, ` · `) і частота словами: `"daily"` → «%%daily%%», `"weekly"` → «%%weekly%%». Слово обирай через `switch`. Має вийти «%%nameValue%% · %%daily%%» і «%%secondName%% · %%weekly%%».
    3. **Чернетка.** Додай чернетку нової звички саме з такими даними: `const draft = { name: "", frequency: "monthly" };`. Так виглядатимуть дані з форми, яку ти зробиш у розділі JS-06. Для кожного поля чернетки обчисли окреме повідомлення:
       - назва — порожній рядок → «%%requiredMessage%%»;
       - частота — не `"daily"` і не `"weekly"` → «%%invalidMessage%%»;
       - з полем усе гаразд → порожній рядок `""`.
    4. **На сторінку.** У `index.html` усередині `<main>` додай чотири порожні абзаци з атрибутом `id`: `first-label`, `second-label`, `name-message` і `frequency-message`. У кінці `app.js` заповни кожен готовим рядком такого вигляду, підставивши свою змінну:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       Рядок знаходить на сторінці елемент з `id="first-label"` і записує в нього текст. Як це працює, детально розбереш у розділі JS-06.

    Значення, яке після оголошення не змінюється, називай через `const`; `let` — лише для того, що переприсвоюєш.

    **Перевірка дивиться на сторінку:** скрипт працює без помилок; у `<main>` є рядок із «%%nameValue%%» і «%%daily%%», рядок із «%%secondName%%» і «%%weekly%%» та обидва повідомлення чернетки; цей текст записує скрипт, а не `index.html`. Назви змінних і роздільник можуть бути твоїми.

    Коли все пройде, спробуй прибрати один `break` у своєму `switch` і запусти: подивись, яке слово тепер отримає перша звичка. Потім поверни `break`.
  en: |
    So far `app.js` only printed lines to the console. Now it computes the page text. Write the new code in `app.js` below the existing lines.

    1. **Two habits.** Describe two records — objects with the fields `id`, `name`, `frequency` and `active`:
       - `"h-01"`: name “%%nameValue%%”, frequency `"daily"`, active (`true`);
       - `"h-04"`: name “%%secondName%%”, frequency `"weekly"`, active.

       The dates a habit was completed form a list; you add it in unit JS-04, when you learn to work with lists.
    2. **Labels.** Build a label for each habit: the name, a separator of your choice (for example ` · `) and the frequency in words: `"daily"` → “%%daily%%”, `"weekly"` → “%%weekly%%”. Choose the word with `switch`. You should get “%%nameValue%% · %%daily%%” and “%%secondName%% · %%weekly%%”.
    3. **Draft.** Add a draft of a new habit with exactly this data: `const draft = { name: "", frequency: "monthly" };`. This is what data from the form you build in unit JS-06 will look like. Compute a separate message for each field of the draft:
       - the name is an empty string → “%%requiredMessage%%”;
       - the frequency is not `"daily"` or `"weekly"` → “%%invalidMessage%%”;
       - the field is fine → an empty string `""`.
    4. **Onto the page.** In `index.html`, inside `<main>`, add four empty paragraphs with an `id` attribute: `first-label`, `second-label`, `name-message` and `frequency-message`. At the end of `app.js`, fill each one with a ready-made line like this, using your own variable:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       The line finds the element with `id="first-label"` on the page and writes the text into it. Unit JS-06 explains in detail how this works.

    Name a value that does not change after its declaration with `const`; use `let` only for what you reassign.

    **The checks look at the page:** the script runs without errors; `<main>` has a line with “%%nameValue%%” and “%%daily%%”, a line with “%%secondName%%” and “%%weekly%%”, and both draft messages; this text is written by the script, not typed into `index.html`. Variable names and the separator can be your own.

    When everything passes, try removing one `break` from your `switch` and run: see which word the first habit gets now. Then put the `break` back.
nudge:
  uk: "Почни з однієї звички: обери слово для частоти через `switch` у `let`, склади підпис у `const` і виведи його через `console.log`. Коли в консолі буде «%%nameValue%% · %%daily%%», зроби так само для другої. Для частоти чернетки підійде `switch`, у якому відомі значення закінчуються `break`, а повідомлення записує `default`."
  en: "Start with one habit: choose the frequency word with a `switch` into a `let`, build the label in a `const` and print it with `console.log`. When the console shows “%%nameValue%% · %%daily%%”, do the same for the second one. For the draft's frequency, a `switch` works well in which the known values end with `break` and `default` writes the message."
testTitles:
  "the script runs without errors":
    uk: "Скрипт працює без помилок"
    en: "The script runs without errors"
  "the first record label is shown":
    uk: "На сторінці є підпис «%%nameValue%%» з частотою «%%daily%%»"
    en: "The page shows the label “%%nameValue%%” with the frequency “%%daily%%”"
  "the second record label is shown":
    uk: "На сторінці є підпис «%%secondName%%» з частотою «%%weekly%%»"
    en: "The page shows the label “%%secondName%%” with the frequency “%%weekly%%”"
  "the draft gets the required-field message":
    uk: "Порожня назва чернетки дає повідомлення «%%requiredMessage%%»"
    en: "The draft's empty name gives the message “%%requiredMessage%%”"
  "the draft gets the invalid-value message":
    uk: "Частота чернетки `\"monthly\"` дає повідомлення «%%invalidMessage%%»"
    en: "The draft's frequency `\"monthly\"` gives the message “%%invalidMessage%%”"
  "the script writes the new lines":
    uk: "Новий текст записує `app.js`, а не `index.html`"
    en: "The new text is written by `app.js`, not typed into `index.html`"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: |
        Скрипт зупинився з помилкою, тому решта коду не виконалася. Назву помилки й рядок показує консоль у перегляді.

        - `TypeError: Cannot set properties of null (setting 'textContent')` — `document.querySelector` не знайшов елемент і повернув `null`. Перевір, що в `index.html` усередині `<main>` є абзац саме з таким `id` і що в селекторі перед назвою стоїть `#`: `"#first-label"`. Великі й малі літери мають збігатися.
        - `ReferenceError` — скрипт звертається до імені, якого не знає. Перевір написання; якщо ім’я оголошено нижче, ніж використано, перенеси оголошення вище: до `const` і `let` не можна звертатися раніше за їхній рядок.
      en: |
        The script stopped with an error, so the rest of the code did not run. The console in the preview shows the error name and the line.

        - `TypeError: Cannot set properties of null (setting 'textContent')` — `document.querySelector` found no element and returned `null`. Check that `index.html` has a paragraph with exactly this `id` inside `<main>` and that the selector has a `#` before the name: `"#first-label"`. Upper and lower case must match.
        - `ReferenceError` — the script uses a name it does not know. Check the spelling; if the name is declared below the place where you use it, move the declaration up: a `const` or `let` cannot be used before its line.
  - when: { test: "the first record label is shown" }
    message:
      uk: "У `<main>` має бути рядок, у якому після «%%nameValue%%» стоїть «%%daily%%». Перша звичка отримала «%%weekly%%»? Тоді після гілки `case \"daily\":` бракує `break`, і виконання провалюється в наступну гілку."
      en: "`<main>` needs a line in which “%%daily%%” follows “%%nameValue%%”. Did the first habit get “%%weekly%%”? Then a `break` is missing after the `case \"daily\":` branch, and execution falls through into the next branch."
  - when: { test: "the second record label is shown" }
    message:
      uk: "Для звички з частотою `\"weekly\"` підпис має містити «%%weekly%%». Перевір, що другий `switch` перевіряє частоту саме другої звички і що слово записується в абзац усередині `<main>`."
      en: "For a habit with the frequency `\"weekly\"` the label must contain “%%weekly%%”. Check that the second `switch` looks at the second habit's frequency and that the word lands in a paragraph inside `<main>`."
  - when: { test: "the draft gets the required-field message" }
    message:
      uk: "Назва чернетки — порожній рядок `\"\"`, тож на сторінці має бути «%%requiredMessage%%». Перевір умову й те, що повідомлення потрапляє в абзац усередині `<main>`."
      en: "The draft's name is an empty string `\"\"`, so the page must show “%%requiredMessage%%”. Check the condition and that the message lands in a paragraph inside `<main>`."
  - when: { test: "the draft gets the invalid-value message" }
    message:
      uk: "Частота `\"monthly\"` не входить до відомих, тож на сторінці має бути «%%invalidMessage%%». Перевір `switch`: відомі значення закінчуються `break`, а повідомлення записує гілка `default`."
      en: "The frequency `\"monthly\"` is not one of the known ones, so the page must show “%%invalidMessage%%”. Check the `switch`: the known values end with `break`, and the `default` branch writes the message."
  - when: { test: "the script writes the new lines" }
    message:
      uk: "Цей текст уже вписано в `index.html` руками. Залиш абзаци порожніми — `<p id=\"…\"></p>` — і заповни їх зі `app.js`: тоді сторінка показуватиме те, що обчислив скрипт, навіть коли дані зміняться."
      en: "This text is already typed into `index.html`. Leave the paragraphs empty — `<p id=\"…\"></p>` — and fill them from `app.js`: then the page shows what the script computed, even when the data changes."
