# Planner variant of step JS-02. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  secondName: { uk: "Написати бабусі", en: "Write to grandma" }
  noDueDate: { uk: "без терміну", en: "no due date" }
  requiredMessage: { uk: "Вкажи назву справи", en: "Enter a title for the task" }
  invalidMessage: { uk: "Невідомий пріоритет", en: "Unknown priority" }
  # Read only by the shared checks (tests.js): the value each label must show after the title.
  firstCheck: { uk: "2026-03-02", en: "2026-03-02" }
  secondCheck: { uk: "без терміну", en: "no due date" }
instructions:
  uk: |
    Досі `app.js` лише друкував рядки в консоль. Тепер він обчислить текст для сторінки. Новий код пиши в `app.js` під наявними рядками коду.

    1. **Дві справи.** Опиши два записи з полями `id`, `title`, `dueDate`, `done` і `priority`:
       - `"t-01"`: назва «%%nameValue%%», термін `"2026-03-02"`, ще не виконана (`false`), пріоритет `"normal"`;
       - `"t-03"`: назва «%%secondName%%», терміну немає (`null`), ще не виконана, пріоритет `"low"`.
    2. **Підписи.** Для кожної справи склади підпис: назва й термін у дужках. Якщо терміну немає, у дужках стоїть «%%noDueDate%%» — підстав цей текст через `??`. Має вийти «%%nameValue%% (2026-03-02)» і «%%secondName%% (%%noDueDate%%)».
    3. **Чернетка.** Додай чернетку нової справи саме з такими даними: `const draft = { title: "", dueDate: null, priority: "urgent" };`. Так виглядатимуть дані з форми, яку ти зробиш у розділі JS-06. Для кожного поля чернетки обчисли окреме повідомлення:
       - назва — порожній текст `""` → «%%requiredMessage%%»;
       - пріоритет — не `"low"`, не `"normal"` і не `"high"` → «%%invalidMessage%%»; перевір його через `switch`;
       - з полем усе гаразд → порожній текст `""`.
    4. **На сторінку.** У `index.html` усередині `<main>` додай чотири порожні абзаци з атрибутом `id`: `first-label`, `second-label`, `title-message` і `priority-message`. У кінці `app.js` заповни кожен абзац готовим рядком коду такого вигляду, підставивши свою змінну:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       Цей рядок коду знаходить на сторінці елемент з `id="first-label"` і записує в нього текст. Як це працює, детально розбереш у розділі JS-06.

    Значення, яке після оголошення не змінюється, називай через `const`; `let` — лише для того, що переприсвоюєш.

    **Перевірка дивиться на сторінку:** скрипт працює без помилок; у `<main>` є текст, де після «%%nameValue%%» стоїть `2026-03-02`, текст, де після «%%secondName%%» стоїть «%%noDueDate%%», і обидва повідомлення чернетки; цей текст записує скрипт, а не `index.html`. Назви змінних і дужки можуть бути твоїми.

    Коли все пройде, постав першій справі термін `null`, натисни «Запустити» й подивись на вкладку «Сторінка»: підпис має показати «%%noDueDate%%». Потім поверни `"2026-03-02"`.
  en: |
    So far `app.js` only printed lines to the console. Now it computes the page text. Write the new code in `app.js` below the existing lines of code.

    1. **Two tasks.** Describe two records with the fields `id`, `title`, `dueDate`, `done` and `priority`:
       - `"t-01"`: title “%%nameValue%%”, due date `"2026-03-02"`, not done yet (`false`), priority `"normal"`;
       - `"t-03"`: title “%%secondName%%”, no due date (`null`), not done yet, priority `"low"`.
    2. **Labels.** Build a label for each task: the title and the due date in brackets. When there is no due date, the brackets hold “%%noDueDate%%” — put this text in with `??`. You should get “%%nameValue%% (2026-03-02)” and “%%secondName%% (%%noDueDate%%)”.
    3. **Draft.** Add a draft of a new task with exactly this data: `const draft = { title: "", dueDate: null, priority: "urgent" };`. This is what data from the form you build in unit JS-06 will look like. Compute a separate message for each field of the draft:
       - the title is the empty text `""` → “%%requiredMessage%%”;
       - the priority is not `"low"`, `"normal"` or `"high"` → “%%invalidMessage%%”; check it with `switch`;
       - the field is fine → the empty text `""`.
    4. **Onto the page.** In `index.html`, inside `<main>`, add four empty paragraphs with an `id` attribute: `first-label`, `second-label`, `title-message` and `priority-message`. At the end of `app.js`, fill each paragraph with a ready-made line of code like this, using your own variable:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       This line of code finds the element with `id="first-label"` on the page and writes the text into it. Unit JS-06 explains in detail how this works.

    Name a value that does not change after its declaration with `const`; use `let` only for what you reassign.

    **The checks look at the page:** the script runs without errors; `<main>` has text in which `2026-03-02` follows “%%nameValue%%”, text in which “%%noDueDate%%” follows “%%secondName%%”, and both draft messages; this text is written by the script, not typed into `index.html`. Variable names and the brackets can be your own.

    When everything passes, give the first task the due date `null`, press “Run” and look at the “Page” tab: its label should show “%%noDueDate%%”. Then put `"2026-03-02"` back.
nudge:
  uk: "Почни з першої справи: склади її підпис у `const`, виведи через `console.log` і подивись на вкладку «Консоль». Коли там буде «%%nameValue%% (2026-03-02)», зроби так само для другої. У `switch` кілька гілок `case` можуть стояти одна під одною й ділити спільний код, а все, що не збіглося з жодною, потрапляє в `default`. Бачиш `null` замість «%%noDueDate%%»? Згадай, що виконується раніше: `+` чи `??`."
  en: "Start with the first task: build its label in a `const`, print it with `console.log` and look at the “Console” tab. When it shows “%%nameValue%% (2026-03-02)”, do the same for the second one. In a `switch`, several `case` branches can stand one under another and share code, and everything that matches none of them lands in `default`. Seeing `null` instead of “%%noDueDate%%”? Recall which runs first: `+` or `??`."
testTitles:
  "the script runs without errors":
    uk: "Скрипт працює без помилок"
    en: "The script runs without errors"
  "the first record label is shown":
    uk: "На сторінці є підпис «%%nameValue%%» з терміном `2026-03-02`"
    en: "The page shows the label “%%nameValue%%” with the due date `2026-03-02`"
  "the second record label is shown":
    uk: "На сторінці є підпис «%%secondName%%» з текстом «%%noDueDate%%»"
    en: "The page shows the label “%%secondName%%” with the text “%%noDueDate%%”"
  "the draft gets the required-field message":
    uk: "Порожня назва чернетки дає повідомлення «%%requiredMessage%%»"
    en: "The draft's empty title gives the message “%%requiredMessage%%”"
  "the draft gets the invalid-value message":
    uk: "Пріоритет чернетки `\"urgent\"` дає повідомлення «%%invalidMessage%%»"
    en: "The draft's priority `\"urgent\"` gives the message “%%invalidMessage%%”"
  "the script writes the new lines":
    uk: "Новий текст записує `app.js`, а не `index.html`"
    en: "The new text is written by `app.js`, not typed into `index.html`"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: |
        Ця перевірка чекає, що скрипт виконається до кінця без помилки. Помилка зупиняє решту коду, тому разом із цією перевіркою не проходять і ті, що дивляться на сторінку. Назву помилки й рядок коду, де вона сталася, показує вкладка «Консоль».

        - Якщо там `TypeError: Cannot set properties of null (setting 'textContent')`, то `document.querySelector` не знайшов елемент і повернув `null`. Селектор має збігатися з `id` абзацу в `index.html` до літери й мати `#` попереду, як у `"#first-label"`.
        - Якщо там `ReferenceError`, то скрипт звертається до назви, якої не знає: звір написання з оголошенням і те, що оголошення стоїть вище за рядок коду, де назву використано.
      en: |
        This check expects the script to run to the end without an error. An error stops the rest of the code, so the checks that look at the page fail together with this one. The “Console” tab shows the error name and the line of code where it happened.

        - If it shows `TypeError: Cannot set properties of null (setting 'textContent')`, `document.querySelector` found no element and returned `null`. The selector must match the paragraph's `id` in `index.html` letter for letter and start with `#`, as in `"#first-label"`.
        - If it shows `ReferenceError`, the script uses a name it does not know: compare the spelling with the declaration, and check that the declaration stands above the line of code that uses the name.
  - when: { test: "the first record label is shown" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент із текстом, у якому після «%%nameValue%%» стоїть `2026-03-02`. Підпис першої справи має потрапити в абзац усередині `<main>`."
      en: "This check looks inside `<main>` for an element whose text has `2026-03-02` after “%%nameValue%%”. The first task's label must land in a paragraph inside `<main>`."
  - when: { test: "the second record label is shown" }
    message:
      uk: "Ця перевірка шукає в `<main>` елемент із текстом, у якому після «%%secondName%%» стоїть «%%noDueDate%%». Якщо там `null`, то `??` отримав увесь складений текст, а не термін: `+` виконується раніше за `??`, а складений текст ніколи не дорівнює `null`."
      en: "This check looks inside `<main>` for an element whose text has “%%noDueDate%%” after “%%secondName%%”. If it shows `null`, `??` received the whole joined text instead of the due date: `+` runs before `??`, and joined text is never `null`."
  - when: { test: "the draft gets the required-field message" }
    message:
      uk: "Ця перевірка шукає в `<main>` текст «%%requiredMessage%%»: назва чернетки — порожній текст `\"\"`. Повідомлення має потрапити в абзац усередині `<main>`."
      en: "This check looks inside `<main>` for the text “%%requiredMessage%%”: the draft's title is the empty text `\"\"`. The message must land in a paragraph inside `<main>`."
  - when: { test: "the draft gets the invalid-value message" }
    message:
      uk: "Ця перевірка шукає в `<main>` текст «%%invalidMessage%%»: пріоритет `\"urgent\"` не входить до відомих. Якщо його немає, простеж, яка гілка `switch` виконується для `\"urgent\"`."
      en: "This check looks inside `<main>` for the text “%%invalidMessage%%”: the priority `\"urgent\"` is not one of the known ones. If it is missing, trace which branch of the `switch` runs for `\"urgent\"`."
  - when: { test: "the script writes the new lines" }
    message:
      uk: "Ця перевірка чекає, що в `index.html` немає ні другого підпису, ні повідомлень чернетки: абзаци для них там порожні, а текст у них записує `app.js`. Тоді сторінка показує те, що обчислив скрипт, навіть коли дані зміняться."
      en: "This check expects `index.html` to hold neither the second label nor the draft messages: their paragraphs are empty there, and `app.js` writes the text into them. Then the page shows what the script computed, even when the data changes."
