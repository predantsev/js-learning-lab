# Planner variant of step JS-02. %%key%% is replaced with the step strings in the language the
# learner's project was created in (the same text the checks expect).
strings:
  secondName: { uk: "Написати бабусі", en: "Write to grandma" }
  noDueDate: { uk: "без терміну", en: "no due date" }
  requiredMessage: { uk: "Вкажи назву справи", en: "Enter a title for the task" }
  invalidMessage: { uk: "Невідомий пріоритет", en: "Unknown priority" }
  # Read only by the shared checks (tests.js): the value each label must show after the title.
  firstCheck: { uk: "2026-03-02", en: "2026-03-02" }
  secondCheck: { uk: "без терміну", en: "no due date" }
instructions:
  uk: |
    Досі `app.js` лише друкував рядки в консоль. Тепер він обчислить текст для сторінки. Нове пиши в `app.js` під наявними рядками.

    1. **Дві справи.** Опиши два записи — об’єкти з полями `id`, `title`, `dueDate`, `done` і `priority`:
       - `"t-01"`: назва «%%nameValue%%», термін `"2026-03-02"`, ще не виконана (`false`), пріоритет `"normal"`;
       - `"t-03"`: назва «%%secondName%%», терміну немає (`null`), ще не виконана, пріоритет `"low"`.
    2. **Підписи.** Для кожної справи склади підпис: назва й термін у дужках. Якщо терміну немає, у дужках стоїть «%%noDueDate%%» — підстав цей текст через `??`. Має вийти «%%nameValue%% (2026-03-02)» і «%%secondName%% (%%noDueDate%%)».
    3. **Чернетка.** Додай чернетку нової справи саме з такими даними: `const draft = { title: "", dueDate: null, priority: "urgent" };`. Так виглядатимуть дані з форми, яку ти зробиш у розділі JS-06. Для кожного поля чернетки обчисли окреме повідомлення:
       - назва — порожній рядок → «%%requiredMessage%%»;
       - пріоритет — не `"low"`, не `"normal"` і не `"high"` → «%%invalidMessage%%»; перевір його через `switch`;
       - з полем усе гаразд → порожній рядок `""`.
    4. **На сторінку.** У `index.html` усередині `<main>` додай чотири порожні абзаци з атрибутом `id`: `first-label`, `second-label`, `title-message` і `priority-message`. У кінці `app.js` заповни кожен готовим рядком такого вигляду, підставивши свою змінну:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       Рядок знаходить на сторінці елемент з `id="first-label"` і записує в нього текст. Як це працює, детально розбереш у розділі JS-06.

    Значення, яке після оголошення не змінюється, називай через `const`; `let` — лише для того, що переприсвоюєш.

    **Перевірка дивиться на сторінку:** скрипт працює без помилок; у `<main>` є рядок із «%%nameValue%%» і `2026-03-02`, рядок із «%%secondName%%» і «%%noDueDate%%» та обидва повідомлення чернетки; цей текст записує скрипт, а не `index.html`. Назви змінних і дужки можуть бути твоїми.

    Коли все пройде, спробуй поставити першій справі термін `null` і запусти: її підпис має показати «%%noDueDate%%». Потім поверни `"2026-03-02"`.
  en: |
    So far `app.js` only printed lines to the console. Now it computes the page text. Write the new code in `app.js` below the existing lines.

    1. **Two tasks.** Describe two records — objects with the fields `id`, `title`, `dueDate`, `done` and `priority`:
       - `"t-01"`: title “%%nameValue%%”, due date `"2026-03-02"`, not done yet (`false`), priority `"normal"`;
       - `"t-03"`: title “%%secondName%%”, no due date (`null`), not done yet, priority `"low"`.
    2. **Labels.** Build a label for each task: the title and the due date in brackets. When there is no due date, the brackets hold “%%noDueDate%%” — put this text in with `??`. You should get “%%nameValue%% (2026-03-02)” and “%%secondName%% (%%noDueDate%%)”.
    3. **Draft.** Add a draft of a new task with exactly this data: `const draft = { title: "", dueDate: null, priority: "urgent" };`. This is what data from the form you build in unit JS-06 will look like. Compute a separate message for each field of the draft:
       - the title is an empty string → “%%requiredMessage%%”;
       - the priority is not `"low"`, `"normal"` or `"high"` → “%%invalidMessage%%”; check it with `switch`;
       - the field is fine → an empty string `""`.
    4. **Onto the page.** In `index.html`, inside `<main>`, add four empty paragraphs with an `id` attribute: `first-label`, `second-label`, `title-message` and `priority-message`. At the end of `app.js`, fill each one with a ready-made line like this, using your own variable:

       ```js
       document.querySelector("#first-label").textContent = firstLabel;
       ```

       The line finds the element with `id="first-label"` on the page and writes the text into it. Unit JS-06 explains in detail how this works.

    Name a value that does not change after its declaration with `const`; use `let` only for what you reassign.

    **The checks look at the page:** the script runs without errors; `<main>` has a line with “%%nameValue%%” and `2026-03-02`, a line with “%%secondName%%” and “%%noDueDate%%”, and both draft messages; this text is written by the script, not typed into `index.html`. Variable names and the brackets can be your own.

    When everything passes, try giving the first task the due date `null` and run: its label should show “%%noDueDate%%”. Then put `"2026-03-02"` back.
nudge:
  uk: "Почни з одного рядка: склади підпис першої справи в `const` і виведи його через `console.log`. Коли в консолі буде «%%nameValue%% (2026-03-02)», зроби так само для другої. У `switch` для пріоритету три відомі значення можуть ділити один `break`, а все інше потрапить у `default`. Бачиш `null` замість «%%noDueDate%%»? Згадай, що виконується раніше: `+` чи `??`."
  en: "Start with one line: build the first task's label in a `const` and print it with `console.log`. When the console shows “%%nameValue%% (2026-03-02)”, do the same for the second one. In the `switch` for the priority, the three known values can share one `break`, and everything else lands in `default`. Seeing `null` instead of “%%noDueDate%%”? Recall which runs first: `+` or `??`."
testTitles:
  "the script runs without errors":
    uk: "Скрипт працює без помилок"
    en: "The script runs without errors"
  "the first record label is shown":
    uk: "На сторінці є підпис «%%nameValue%%» з терміном `2026-03-02`"
    en: "The page shows the label “%%nameValue%%” with the due date `2026-03-02`"
  "the second record label is shown":
    uk: "На сторінці є підпис «%%secondName%%» з текстом «%%noDueDate%%»"
    en: "The page shows the label “%%secondName%%” with the text “%%noDueDate%%”"
  "the draft gets the required-field message":
    uk: "Порожня назва чернетки дає повідомлення «%%requiredMessage%%»"
    en: "The draft's empty title gives the message “%%requiredMessage%%”"
  "the draft gets the invalid-value message":
    uk: "Пріоритет чернетки `\"urgent\"` дає повідомлення «%%invalidMessage%%»"
    en: "The draft's priority `\"urgent\"` gives the message “%%invalidMessage%%”"
  "the script writes the new lines":
    uk: "Новий текст записує `app.js`, а не `index.html`"
    en: "The new text is written by `app.js`, not typed into `index.html`"
feedback:
  - when: { test: "the script runs without errors" }
    message:
      uk: |
        Скрипт зупинився з помилкою, тому решта коду не виконалася. Назву помилки й рядок показує консоль у перегляді.

        - `TypeError: Cannot set properties of null (setting 'textContent')` — `document.querySelector` не знайшов елемент і повернув `null`. Перевір, що в `index.html` усередині `<main>` є абзац саме з таким `id` і що в селекторі перед назвою стоїть `#`: `"#first-label"`. Великі й малі літери мають збігатися.
        - `ReferenceError` — скрипт звертається до імені, якого не знає. Перевір написання; якщо ім’я оголошено нижче, ніж використано, перенеси оголошення вище: до `const` і `let` не можна звертатися раніше за їхній рядок.
      en: |
        The script stopped with an error, so the rest of the code did not run. The console in the preview shows the error name and the line.

        - `TypeError: Cannot set properties of null (setting 'textContent')` — `document.querySelector` found no element and returned `null`. Check that `index.html` has a paragraph with exactly this `id` inside `<main>` and that the selector has a `#` before the name: `"#first-label"`. Upper and lower case must match.
        - `ReferenceError` — the script uses a name it does not know. Check the spelling; if the name is declared below the place where you use it, move the declaration up: a `const` or `let` cannot be used before its line.
  - when: { test: "the first record label is shown" }
    message:
      uk: "У `<main>` має бути рядок, у якому після «%%nameValue%%» стоїть `2026-03-02`. Переконайся, що абзац для підпису стоїть усередині `<main>` і що в нього записується підпис саме першої справи."
      en: "`<main>` needs a line in which `2026-03-02` follows “%%nameValue%%”. Make sure the paragraph for the label is inside `<main>` and that the first task's label is written into it."
  - when: { test: "the second record label is shown" }
    message:
      uk: "Для справи без терміну підпис має містити «%%noDueDate%%». Бачиш замість цього `null`? Тоді `??` застосувався не до терміну, а до всього тексту: `+` виконується раніше за `??`, а складений текст ніколи не буває `null`. Візьми `dueDate ?? …` у дужки або обчисли текст терміну окремою константою."
      en: "For a task without a due date the label must contain “%%noDueDate%%”. Seeing `null` instead? Then `??` was applied to the whole text, not to the due date: `+` runs before `??`, and the joined text is never `null`. Put `dueDate ?? …` in parentheses or compute the date text in its own constant."
  - when: { test: "the draft gets the required-field message" }
    message:
      uk: "Назва чернетки — порожній рядок `\"\"`, тож на сторінці має бути «%%requiredMessage%%». Перевір умову й те, що повідомлення потрапляє в абзац усередині `<main>`."
      en: "The draft's title is an empty string `\"\"`, so the page must show “%%requiredMessage%%”. Check the condition and that the message lands in a paragraph inside `<main>`."
  - when: { test: "the draft gets the invalid-value message" }
    message:
      uk: "Пріоритет `\"urgent\"` не входить до відомих, тож на сторінці має бути «%%invalidMessage%%». Перевір `switch`: відомі значення закінчуються `break`, а повідомлення записує гілка `default`. Без `break` виконання провалюється в наступну гілку."
      en: "The priority `\"urgent\"` is not one of the known ones, so the page must show “%%invalidMessage%%”. Check the `switch`: the known values end with `break`, and the `default` branch writes the message. Without a `break`, execution falls through into the next branch."
  - when: { test: "the script writes the new lines" }
    message:
      uk: "Цей текст уже вписано в `index.html` руками. Залиш абзаци порожніми — `<p id=\"…\"></p>` — і заповни їх зі `app.js`: тоді сторінка показуватиме те, що обчислив скрипт, навіть коли дані зміняться."
      en: "This text is already typed into `index.html`. Leave the paragraphs empty — `<p id=\"…\"></p>` — and fill them from `app.js`: then the page shows what the script computed, even when the data changes."
