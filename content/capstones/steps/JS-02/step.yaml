# Capstone step of unit JS-02 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-02-12-capstone-labels-messages from this file.
unit: JS-02
mode: in-platform
entry: index.html
title:
  uk: "Підписи й повідомлення валідації"
  en: "Labels and validation messages"
intro:
  uk: |
    Досі текст сторінки ти вписував у `index.html` руками, а `app.js` лише друкував кілька рядків у консоль. На цьому кроці текст для сторінки вперше **обчислює скрипт**.

    Ти опишеш два [[record|записи]] свого проєкту з їхніми полями, складеш для кожного підпис для показу й перевіриш чернетку нового запису — так, як [[validation|валідація]] перевірятиме дані з форми. Знадобиться все з розділу: `const` і `let`, строгі порівняння, `??` для відсутнього значення, `if`/`else` або `switch`.

    Функцій ти ще не писав, тож деякий код доведеться повторити для другого запису. Це нормально: у наступному розділі ти винесеш його у функції й повтор зникне.
  en: |
    So far you typed the page text into `index.html` by hand, and `app.js` only printed a few lines to the console. In this step the **script computes** the page text for the first time.

    You describe two [[record|records]] of your project with their fields, build a display label for each and check a draft of a new record — the way [[validation]] will check data from a form. You need everything from the unit: `const` and `let`, strict comparisons, `??` for a missing value, `if`/`else` or `switch`.

    You have not written functions yet, so some code has to be repeated for the second record. That is fine: in the next unit you move it into functions and the repetition disappears.
purpose:
  uk: "Це крок твого проєкту: те, що розділ навчив робити з окремими значеннями, ти застосовуєш до власних записів. Урок зараховується після перевірки кроку в активному проєкті."
  en: "This is a step of your project: what the unit taught you to do with single values, you now apply to your own records. The lesson counts once the step is checked in your active project."
objectives:
  - uk: "Описати запис проєкту з полями домену й назвати кожне значення через `const` або `let` — `let` лише там, де значення переприсвоюється."
    en: "Describe a project record with the domain's fields and name every value with `const` or `let` — `let` only where the value is reassigned."
  - uk: "Скласти підпис запису з його полів, обираючи текст для відсутнього чи особливого значення через `??`, `switch` або тернарний оператор."
    en: "Build a record's label from its fields, choosing the text for a missing or special value with `??`, `switch` or the ternary operator."
  - uk: "Перевірити чернетку запису строгими порівняннями й розгалуженням і отримати окреме повідомлення для кожного поля з помилкою."
    en: "Check a draft record with strict comparisons and branching and get a separate message for every field with a problem."
  - uk: "Показати обчислені підписи й повідомлення на сторінці готовим рядком коду з `textContent`."
    en: "Show the computed labels and messages on the page with a ready-made line of code using `textContent`."
transfer:
  uk: "Відкрий цей крок у своєму проєкті: там завдання для твого варіанта, файли, перегляд і перевірки. Якщо попередній крок не виконано, платформа запропонує [[starter|стартовий стан]] — після перегляду змін і створення знімка."
  en: "Open this step in your project: the task for your variant, the files, the preview and the checks are there. If the previous step is not done, the platform offers a [[starter]] state — after a preview of the changes and a snapshot."
