# Expense tracker variant of step RN-06 (a local step: done in the learner's editor, terminal and on the
# declared native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1,
# Expo SDK 57) on the scratch project of this capstone, the tests against the real mock service; nothing
# was run on an emulator, a simulator or a phone.
strings:
  serviceLinkLabel: { uk: "Записи із сервісу", en: "Records from the service" }
  serviceTitle: { uk: "Записи із сервісу", en: "Records from the service" }
  serviceLoadingMessage: { uk: "Запит до сервісу…", en: "Asking the service…" }
  serviceLoadedMessage: { uk: "Це витрати із сервісу. Вони лише для перегляду: твій список на пристрої не змінився.", en: "These are the expenses of the service. They are read only: your list on the device did not change." }
  offlineBundledMessage: { uk: "Немає з’єднання із сервісом, тож показано вбудовані стартові витрати.", en: "There is no connection to the service, so the bundled starting expenses are shown." }
  invalidBundledMessage: { uk: "Сервіс надіслав дані неправильної форми, тож показано вбудовані стартові витрати.", en: "The service sent data of the wrong shape, so the bundled starting expenses are shown." }
  timeoutMessage: { uk: "Сервіс не відповів вчасно на жодну з трьох спроб.", en: "The service did not answer in time to any of three attempts." }
  serverErrorMessage: { uk: "Сервіс відповів помилкою після трьох спроб", en: "The service answered with an error after three attempts" }
instructions:
  uk: |
    Завантаж витрати з навчального сервісу (`/records/expenses`) на окремому екрані: адреса із цілі, тайм-аут, щонайбільше три спроби, скасування при втраті фокуса, вбудовані записи без з’єднання й похідне значення лише з даних, що завантажилися. Платформа цей крок не перевіряє.

    1. `tools/mock-service.mjs` — копія `~/js-course/rn06-mock/mock-service.mjs`; `node tools/mock-service.mjs` і `curl -sS http://127.0.0.1:7310/health` — `{"ok":true}`.
    2. `src/devConfig.ts`: `TARGET`, `MOCK_PORT = 7310`, `LAN_ADDRESS`, `REHEARSAL`, `mockBaseUrl(target)` (`10.0.2.2` / `127.0.0.1` / адреса в мережі).
    3. `src/fetchWithRetry.ts`: `AbortController` і таймер на кожну спробу, зовнішній `signal`, відповідь нижче 500 остаточна, щонайбільше 3 спроби з подвоєнням паузи.
    4. `src/recordsSource.ts`: `loadFromService` — `service` (через `parseExpenseList`), `bundled` (`offline` / `invalid`) або `none` (`timeout` / `server`).
    5. `src/ServiceScreen.tsx` «%%serviceTitle%%»: новий `AbortController` на кожному фокусі, `abort()` у прибиранні; рядок стану з `accessibilityRole="alert"`; `CategoryTotals` (`summarizeExpenses`, у копійках) із завантажених записів — лише коли є записи; «%%retryLoadLabel%%» для «жодних даних». Кнопка «%%serviceLinkLabel%%» на списку.
    6. `tests/service.test.js` проти справжнього сервісу на вільному порту; `EVIDENCE.md`, розділ «RN-06»; `REHEARSAL = ""`; `git commit -m "Load records from the mock service with a timeout, bounded retry, cancellation and offline fallback"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx tsc --noEmit` — жодного рядка; `npm test` — 49 тестів, «не пройшли: 0».
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі із запущеним сервісом: шість витрат і «%%totalLabel%%» 2155%%decimalMark%%90; у журналі сервісу — `[mock] GET /records/expenses?lang=… → 200 from …` з адресою пристрою.
    - На цілі зі зупиненим сервісом: «%%offlineBundledMessage%%».
    - На цілі з `REHEARSAL = "fail=5&key=r1"`: три рядки `503` у журналі, «%%serverErrorMessage%%», жодного підсумку, «%%retryLoadLabel%%».
    - На цілі з `REHEARSAL = "hang=1"`: повернення на список до кінця тайм-ауту — у журналі лише один рядок `no answer (hang)`.

    **Доказ:** commit і `EVIDENCE.md` — рядки команд, побачене на цілі й рядки журналу сервісу, або запис «не виконано»: що, на якій цілі, чому, що потрібно, щоб повернутися. Без цілі натисни на цій сторінці «У мене немає емулятора чи пристрою», а не «Цей крок виконано».
  en: |
    Load the expenses of the mock service (`/records/expenses`) on a separate screen: the address from the target, a timeout, at most three attempts, a cancel when the focus is lost, the bundled records without a connection, and the derived value only from data that loaded. The platform does not check this step.

    1. `tools/mock-service.mjs` — a copy of `~/js-course/rn06-mock/mock-service.mjs`; `node tools/mock-service.mjs` and `curl -sS http://127.0.0.1:7310/health` — `{"ok":true}`.
    2. `src/devConfig.ts`: `TARGET`, `MOCK_PORT = 7310`, `LAN_ADDRESS`, `REHEARSAL`, `mockBaseUrl(target)` (`10.0.2.2` / `127.0.0.1` / the network address).
    3. `src/fetchWithRetry.ts`: an `AbortController` and a timer per attempt, the outer `signal`, an answer below 500 is final, at most 3 attempts with a doubling pause.
    4. `src/recordsSource.ts`: `loadFromService` — `service` (through `parseExpenseList`), `bundled` (`offline` / `invalid`) or `none` (`timeout` / `server`).
    5. `src/ServiceScreen.tsx` “%%serviceTitle%%”: a new `AbortController` on every focus, `abort()` in the cleanup; a status line with `accessibilityRole="alert"`; `CategoryTotals` (`summarizeExpenses`, in kopiykas) of the loaded records — only when there are records; “%%retryLoadLabel%%” for “no data”. A “%%serviceLinkLabel%%” button on the list.
    6. `tests/service.test.js` against the real service on a free port; `EVIDENCE.md`, a section “RN-06”; `REHEARSAL = ""`; `git commit -m "Load records from the mock service with a timeout, bounded retry, cancellation and offline fallback"`.

    **Self-check — confirm every item yourself:**

    - `npx tsc --noEmit` — not a single line; `npm test` — 49 tests, “failed: 0”.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target with the service running: six expenses and “%%totalLabel%%” 2155%%decimalMark%%90; in the service's log `[mock] GET /records/expenses?lang=… → 200 from …` with the device's address.
    - On the target with the service stopped: “%%offlineBundledMessage%%”.
    - On the target with `REHEARSAL = "fail=5&key=r1"`: three `503` lines in the log, “%%serverErrorMessage%%”, no total, “%%retryLoadLabel%%”.
    - On the target with `REHEARSAL = "hang=1"`: back to the list before the timeout ends — only one `no answer (hang)` line in the log.

    **Evidence:** the commit and `EVIDENCE.md` — the command lines, what you saw on the target and the service's log lines, or a “not performed” record: what, on which target, why, what it takes to come back. Without a target, press “I have no emulator or device” on this page, not “I have done this step”.
