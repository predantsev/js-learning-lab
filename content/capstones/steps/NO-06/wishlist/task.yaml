# Wishlist variant of step NO-06 (a local step: done in the learner's editor, terminal and browser; no platform
# checks). Checked on macOS on the scratch project of this capstone after NO-11, in a Ukrainian and an English
# workspace, on Node.js 25.2.1 and 22.13.1: npm test of the web project (37) and of server/ (57, of them 11 in
# tests/client.test.ts), npm run build with and without API_BASE_URL, curl -i of the preflight, and in Chrome
# 154 (playwright-core, channel "chrome"): load, mark w-01, the server stopped and restarted, reloads,
# /tests.html (13 passed); PATCH taken out of the allowed methods and another allowed origin (Console lines in
# the intro). Wrong variants run against tests/client.test.ts, each failed at least one test: Allow-Origin "*",
# any origin echoed, no Vary: Origin, credentials on, PATCH not allowed, idempotency-key not allowed, the
# preflight handed to the routes, CORS dropped, only the first page, a page not checked by the contract, a new
# key on every attempt, a create without a key, a create not retried, a 4xx retried, retries unbounded, reads
# not retried, a write answer not checked, no request timeout (the test hangs until the runner's timeout), the
# PATCH sending other fields, setAcquired sending the opposite, the filter not sent to the server.
# Native: shared/contract.ts copied, apiBaseUrl in src/devConfig.ts; npx tsc --noEmit, npm test (runner 57,
# Jest 5) on the computer; nothing run on a device. Not run on Linux or Windows.
instructions:
  uk: |
    Під’єднай список бажань до справжнього сервера: бажання — з `GET /v1/records`, позначка «отримано» — `PATCH /v1/records/:id` з `{acquired}`, а сума цін бажаних речей — зі списку сервера. Платформа цей крок не перевіряє.

    1. `shared/contract.ts`: `RECORDS_PATH_V1`, `PAGE_LIMIT_V1`, `WishV1`, `ListPageV1`, `ErrorBodyV1`, `parseWishV1`, `parseListPageV1`, `parseErrorBodyV1`; `"shared/**/*.ts"` у `include` файлу `tsconfig.json`.
    2. `git mv data/api.ts data/fixtureApi.ts`; `data/apiError.ts`; у фікстурному API — `setAcquired(id, acquired)`.
    3. `data/httpApi.ts`: `createHttpApi({ baseUrl, fetch, timeoutMs })` з `listItems`, `createItem`, `saveItem` (`PUT`), `setAcquired` (`PATCH {acquired}`), `deleteItem`; фільтр `бажані` — `&acquired=false`, `отримані` — `&acquired=true`; `InvalidResponseError`.
    4. `data/config.js` (`loadClientConfig`), новий `data/api.ts`, `scripts/build.mjs`, `CLIENT_ENV` у `define` файлу `scripts/release.mjs`, скрипти `"build"` і `"release"` з `--env-file-if-exists=.env`; `.env`: `DATA_SOURCE=http`, `API_BASE_URL=http://127.0.0.1:4311`.
    5. `ui/itemsCache.tsx`: `toggleAcquired` викликає `setAcquired`; `TimeoutError` — «немає з’єднання».
    6. `server/src/cors.ts`, `allowedOrigins` у `server/src/config.ts` (`ALLOWED_ORIGINS`), preflight і `applyCors` у `server/src/server.ts`.
    7. `server/tests/client.test.ts`.
    8. Прогін з інтро в Chrome і дві хибні спроби; `docs/server.md`, розділ «NO-06»; commit. Нативний проєкт — крок 10 інтро.

    Порядок сервера: `GET /v1/records` без `sort` — за назвою (`sort=name`), тож картки стоять за абеткою, а не в порядку збереження.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` у теці проєкту — `не пройшли: 0`; у `server/` — `ℹ tests 57`, `ℹ fail 0`.
    - «Позначити отриманим: Навушники» — у лозі сервера `OPTIONS /v1/records/w-01` `204`, потім `PATCH` `200`; сума `365 грн` стає `285 грн`.
    - Після перезапуску сервера й перезавантаження сторінки — позначка є і `285 грн`; `curl -sS http://127.0.0.1:4311/v1/records/w-01` — `"acquired":true`.
    - Без сервера — `Список не завантажився (немає з’єднання)`, а не порожній список.
    - У збірці є `http://127.0.0.1:4311` і немає `4310`.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Connect the wishlist to the real server: the wishes from `GET /v1/records`, the "acquired" mark with `PATCH /v1/records/:id` and `{acquired}`, and the total price of wanted things from the server's list. The platform does not check this step.

    1. `shared/contract.ts`: `RECORDS_PATH_V1`, `PAGE_LIMIT_V1`, `WishV1`, `ListPageV1`, `ErrorBodyV1`, `parseWishV1`, `parseListPageV1`, `parseErrorBodyV1`; `"shared/**/*.ts"` in the `include` of `tsconfig.json`.
    2. `git mv data/api.ts data/fixtureApi.ts`; `data/apiError.ts`; `setAcquired(id, acquired)` in the fixture API.
    3. `data/httpApi.ts`: `createHttpApi({ baseUrl, fetch, timeoutMs })` with `listItems`, `createItem`, `saveItem` (`PUT`), `setAcquired` (`PATCH {acquired}`), `deleteItem`; the filter `wanted` is `&acquired=false`, `acquired` is `&acquired=true`; `InvalidResponseError`.
    4. `data/config.js` (`loadClientConfig`), the new `data/api.ts`, `scripts/build.mjs`, `CLIENT_ENV` in the `define` of `scripts/release.mjs`, the scripts `"build"` and `"release"` with `--env-file-if-exists=.env`; `.env`: `DATA_SOURCE=http`, `API_BASE_URL=http://127.0.0.1:4311`.
    5. `ui/itemsCache.tsx`: `toggleAcquired` calls `setAcquired`; `TimeoutError` is "no connection".
    6. `server/src/cors.ts`, `allowedOrigins` in `server/src/config.ts` (`ALLOWED_ORIGINS`), the preflight and `applyCors` in `server/src/server.ts`.
    7. `server/tests/client.test.ts`.
    8. The run of the intro in Chrome and both wrong tries; `docs/server.md`, a section "NO-06"; the commit. The native project — step 10 of the intro.

    The server's order: `GET /v1/records` without `sort` sorts by name (`sort=name`), so the cards stand alphabetically, not in the order they were saved.

    **Self-check — confirm every item yourself:**

    - `npm test` in the project folder — `failed: 0`; in `server/` — `ℹ tests 57`, `ℹ fail 0`.
    - "Mark as acquired: Headphones" — the server log has `OPTIONS /v1/records/w-01` `204`, then `PATCH` `200`; the total `UAH 365` becomes `UAH 285`.
    - After a server restart and a page reload — the mark is there and `UAH 285`; `curl -sS http://127.0.0.1:4311/v1/records/w-01` — `"acquired":true`.
    - Without the server — `The list did not load (no connection)`, not an empty list.
    - The build has `http://127.0.0.1:4311` and no `4310`.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
