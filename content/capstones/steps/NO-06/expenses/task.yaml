# Expense tracker variant of step NO-06 (a local step: done in the learner's editor, terminal and browser; no
# platform checks). Checked on macOS on the scratch project of this capstone after NO-11, in a Ukrainian and an
# English workspace, on Node.js 25.2.1 and 22.13.1: npm test of the web project (36) and of server/ (60, of them
# 12 in tests/client.test.ts), npm run build with and without API_BASE_URL, curl -i of the preflights, and in
# Chrome 154 (playwright-core, channel "chrome"): load, a new expense (65 in food), the server stopped and
# restarted, reloads, /tests.html (13 passed). Wrong variants run against tests/client.test.ts, each failed at
# least one test (the missing timeout hung the run until the runner's timeout): the wishlist's list (see its
# task header) with DELETE in place of PATCH, a POST sending a changed amount and a delete that deletes nothing
# in place of the two setAcquired mistakes. Native: shared/contract.ts copied, apiBaseUrl in src/devConfig.ts;
# npx tsc --noEmit, npm test (runner 56, Jest 5) on the computer; nothing run on a device. Not run on Linux or
# Windows.
instructions:
  uk: |
    Під’єднай трекер витрат до справжнього сервера: витрати — з `GET /v1/records`, нова витрата — `POST /v1/records` з ключем `Idempotency-Key`, а суми за категоріями в `amountMinor` — зі списку сервера, ніколи з оптимістичної копії. Платформа цей крок не перевіряє.

    1. `shared/contract.ts`: `RECORDS_PATH_V1`, `PAGE_LIMIT_V1`, `ExpenseV1`, `ListPageV1`, `ErrorBodyV1`, `parseExpenseV1`, `parseListPageV1`, `parseErrorBodyV1`; `"shared/**/*.ts"` у `include` файлу `tsconfig.json`.
    2. `git mv data/api.ts data/fixtureApi.ts`; `data/apiError.ts`.
    3. `data/httpApi.ts`: `createHttpApi({ baseUrl, fetch, timeoutMs })` з `listExpenses`, `createExpense` (ключ — один на виклик), `saveExpense` (`PUT`), `deleteExpense`; фільтр категорії — `&category=food` (`transport`, `home`, `fun`); `InvalidResponseError`. Окремої вузької зміни немає: оптимістичне видалення — `DELETE`.
    4. `data/config.js` (`loadClientConfig`), новий `data/api.ts`, `scripts/build.mjs`, `CLIENT_ENV` у `define` файлу `scripts/release.mjs`, скрипти `"build"` і `"release"` з `--env-file-if-exists=.env`; `.env`: `DATA_SOURCE=http`, `API_BASE_URL=http://127.0.0.1:4311`.
    5. `ui/expensesCache.tsx`: `TimeoutError` — «немає з’єднання».
    6. `server/src/cors.ts`, `allowedOrigins` у `server/src/config.ts` (`ALLOWED_ORIGINS`), preflight і `applyCors` у `server/src/server.ts`.
    7. `server/tests/client.test.ts`: створена витрата переживає перезапуск, а сума її категорії росте рівно на її `amountMinor`; видалена — лишається видаленою.
    8. Прогін з інтро в Chrome на свіжій `server/data/` (`mv server/data ~/js-course/expenses-data-no11`: 10 006 записів кроку NO-11 більші за 200 сторінок, які читає сторінка — крок 1 інтро) і дві хибні спроби; `docs/server.md`, розділ «NO-06»; commit. Нативний проєкт — крок 10 інтро.

    Порядок сервера: `GET /v1/records` без `sort` — за `date` (рівні — за `id`).

    Назви тестів твого проєкту для кроку 9 інтро: `*` замість origin — `✖ only the web app's origin is named; another origin gets no CORS answer, a request without Origin still works`; лише перша сторінка — `✖ the HTTP source lists every expense across pages, filters on the server and the totals come from its list`; новий ключ на кожну спробу — `✖ a create whose answer was lost is sent again with the same Idempotency-Key and stored once`; повтор `4xx` — `✖ a read is tried three times when nothing answers, a 4xx once, and every failure rejects`. Замість хибної спроби з `PATCH` у кроці 9 прибери з `ALLOWED_HEADERS` `idempotency-key`: Console тричі (три спроби з тим самим ключем) скаже `Access to fetch at 'http://127.0.0.1:4311/v1/records' from origin 'http://127.0.0.1:4310' has been blocked by CORS policy: Request header field idempotency-key is not allowed by Access-Control-Allow-Headers in preflight response.`, у лозі сервера — три `OPTIONS` і жодного `POST`, а сторінка — `Витрату не збережено (немає з’єднання)`. А от прибрати з `ALLOWED_METHODS` сам `POST` у нас (Chrome 154) нічого не зламало: `POST` — «простий» метод, і в preflight браузер перевірив лише заголовки (`content-type`, `idempotency-key`).

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` у теці проєкту — `не пройшли: 0`; у `server/` — `ℹ tests 60`, `ℹ fail 0`.
    - Нова витрата `Кава`, `65`, `2026-03-02`, `Їжа` — у лозі сервера `OPTIONS /v1/records` `204`, потім `POST` `201`; `Їжа: 1 056,00 грн` стає `Їжа: 1 121,00 грн`, `Разом: 2 155,90 грн` — `Разом: 2 220,90 грн`.
    - Після перезапуску сервера й перезавантаження сторінки — ті самі суми; `curl -sS http://127.0.0.1:4311/v1/records/e-07` — `"amountMinor":6500`.
    - Без сервера — `Список не завантажився (немає з’єднання)`, а не порожній список.
    - У збірці є `http://127.0.0.1:4311` і немає `4310`.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Connect the expense tracker to the real server: the expenses from `GET /v1/records`, a new expense with `POST /v1/records` and an `Idempotency-Key`, and the per-category totals in `amountMinor` from the server's list, never from an optimistic copy. The platform does not check this step.

    1. `shared/contract.ts`: `RECORDS_PATH_V1`, `PAGE_LIMIT_V1`, `ExpenseV1`, `ListPageV1`, `ErrorBodyV1`, `parseExpenseV1`, `parseListPageV1`, `parseErrorBodyV1`; `"shared/**/*.ts"` in the `include` of `tsconfig.json`.
    2. `git mv data/api.ts data/fixtureApi.ts`; `data/apiError.ts`.
    3. `data/httpApi.ts`: `createHttpApi({ baseUrl, fetch, timeoutMs })` with `listExpenses`, `createExpense` (one key per call), `saveExpense` (`PUT`), `deleteExpense`; the category filter is `&category=food` (`transport`, `home`, `fun`); `InvalidResponseError`. There is no separate narrow change: the optimistic delete is a `DELETE`.
    4. `data/config.js` (`loadClientConfig`), the new `data/api.ts`, `scripts/build.mjs`, `CLIENT_ENV` in the `define` of `scripts/release.mjs`, the scripts `"build"` and `"release"` with `--env-file-if-exists=.env`; `.env`: `DATA_SOURCE=http`, `API_BASE_URL=http://127.0.0.1:4311`.
    5. `ui/expensesCache.tsx`: `TimeoutError` is "no connection".
    6. `server/src/cors.ts`, `allowedOrigins` in `server/src/config.ts` (`ALLOWED_ORIGINS`), the preflight and `applyCors` in `server/src/server.ts`.
    7. `server/tests/client.test.ts`: a created expense survives a restart and its category total grows by exactly its `amountMinor`; a deleted one stays deleted.
    8. The run of the intro in Chrome on a fresh `server/data/` (`mv server/data ~/js-course/expenses-data-no11`: the 10,006 records of step NO-11 exceed the 200 pages the page reads — step 1 of the intro) and both wrong tries; `docs/server.md`, a section "NO-06"; the commit. The native project — step 10 of the intro.

    The server's order: `GET /v1/records` without `sort` sorts by `date` (ties by `id`).

    Your project's test names for step 9 of the intro: `*` instead of the origin — `✖ only the web app's origin is named; another origin gets no CORS answer, a request without Origin still works`; only the first page — `✖ the HTTP source lists every expense across pages, filters on the server and the totals come from its list`; a new key on every attempt — `✖ a create whose answer was lost is sent again with the same Idempotency-Key and stored once`; a retried `4xx` — `✖ a read is tried three times when nothing answers, a 4xx once, and every failure rejects`. Instead of the wrong try with `PATCH` in step 9, take `idempotency-key` out of `ALLOWED_HEADERS`: the Console says three times (three attempts with the same key) `Access to fetch at 'http://127.0.0.1:4311/v1/records' from origin 'http://127.0.0.1:4310' has been blocked by CORS policy: Request header field idempotency-key is not allowed by Access-Control-Allow-Headers in preflight response.`, the server log has three `OPTIONS` and no `POST`, and the page says the expense was not saved (no connection). Taking `POST` itself out of `ALLOWED_METHODS` broke nothing for us (Chrome 154): `POST` is a "simple" method, and in the preflight the browser checked only the headers (`content-type`, `idempotency-key`).

    **Self-check — confirm every item yourself:**

    - `npm test` in the project folder — `failed: 0`; in `server/` — `ℹ tests 60`, `ℹ fail 0`.
    - A new expense of `65` on `2026-03-02` in `Food` — the server log has `OPTIONS /v1/records` `204`, then `POST` `201`; `Food: UAH 1,056.00` becomes `Food: UAH 1,121.00`, `Total: UAH 2,155.90` — `Total: UAH 2,220.90`.
    - After a server restart and a page reload — the same totals; `curl -sS http://127.0.0.1:4311/v1/records/e-07` — `"amountMinor":6500`.
    - Without the server — `The list did not load (no connection)`, not an empty list.
    - The build has `http://127.0.0.1:4311` and no `4310`.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
