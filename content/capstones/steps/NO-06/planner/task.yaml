# Planner variant of step NO-06 (a local step: done in the learner's editor, terminal and browser; no platform
# checks). Checked on macOS on the scratch project of this capstone after NO-11, in a Ukrainian and an English
# workspace, on Node.js 25.2.1 and 22.13.1: npm test of the web project (38) and of server/ (63, of them 11 in
# tests/client.test.ts), npm run build with and without API_BASE_URL, curl -i of the preflight, and in Chrome
# 154 (playwright-core, channel "chrome"): load, mark t-01 done, the server stopped and restarted, reloads,
# /tests.html (13 passed). Wrong variants run against tests/client.test.ts, each failed at least one test (the
# missing timeout hung the run until the runner's timeout): the wishlist's list (see its task header) with
# setDone in place of setAcquired. Native: shared/contract.ts copied, apiBaseUrl in src/devConfig.ts; npx tsc
# --noEmit, npm test (runner 60, Jest 5) on the computer; nothing run on a device. Not run on Linux or Windows.
instructions:
  uk: |
    Під’єднай планувальник до справжнього сервера: справи — з `GET /v1/records`, позначка «виконано» — `PATCH /v1/records/:id` з `{done}`, а кількість невиконаних справ із терміном до дня — зі списку сервера. Платформа цей крок не перевіряє.

    1. `shared/contract.ts`: `RECORDS_PATH_V1`, `PAGE_LIMIT_V1`, `TaskV1`, `ListPageV1`, `ErrorBodyV1`, `parseTaskV1`, `parseListPageV1`, `parseErrorBodyV1`; `"shared/**/*.ts"` у `include` файлу `tsconfig.json`.
    2. `git mv data/api.ts data/fixtureApi.ts`; `data/apiError.ts`; у фікстурному API — `setDone(id, done)`.
    3. `data/httpApi.ts`: `createHttpApi({ baseUrl, fetch, timeoutMs })` з `listTasks`, `createTask`, `saveTask` (`PUT`), `setDone` (`PATCH {done}`), `deleteTask`; фільтр `невиконані` — `&done=false`, `виконані` — `&done=true`; `InvalidResponseError`.
    4. `data/config.js` (`loadClientConfig`), новий `data/api.ts`, `scripts/build.mjs`, `CLIENT_ENV` у `define` файлу `scripts/release.mjs`, скрипти `"build"` і `"release"` з `--env-file-if-exists=.env`; `.env`: `DATA_SOURCE=http`, `API_BASE_URL=http://127.0.0.1:4311`.
    5. `ui/tasksCache.tsx`: `toggleDone` викликає `setDone`; `TimeoutError` — «немає з’єднання».
    6. `server/src/cors.ts`, `allowedOrigins` у `server/src/config.ts` (`ALLOWED_ORIGINS`), preflight і `applyCors` у `server/src/server.ts`.
    7. `server/tests/client.test.ts`; кількість невиконаних справ із терміном рахується доменною функцією вебзастосунку на **фіксований** день, ніколи не з годинника.
    8. Прогін з інтро в Chrome і дві хибні спроби; `docs/server.md`, розділ «NO-06»; commit. Нативний проєкт — крок 10 інтро.

    Порядок сервера: `GET /v1/records` без `sort` — за `dueDate` (рівні — за `id`).

    Назви тестів твого проєкту для кроку 9 інтро: `*` замість origin — `✖ only the web app's origin is named; another origin gets no CORS answer, a request without Origin still works`; лише перша сторінка — `✖ the HTTP source lists every task across pages, filters on the server and the counts come from its list`; новий ключ на кожну спробу — `✖ a create whose answer was lost is sent again with the same Idempotency-Key and stored once`; повтор `4xx` — `✖ a read is tried three times when nothing answers, a 4xx once, and every failure rejects`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` у теці проєкту — `не пройшли: 0`; у `server/` — `ℹ tests 63`, `ℹ fail 0`.
    - «Позначити виконаною: %%fixture1Name%%» — у лозі сервера `OPTIONS /v1/records/t-01` `204`, потім `PATCH` `200`; `Треба зробити станом на 2 березня 2026 р.: 2` стає `…: 1`.
    - Після перезапуску сервера й перезавантаження сторінки — те саме; `curl -sS http://127.0.0.1:4311/v1/records/t-01` — `"done":true`.
    - Без сервера — `Список не завантажився (немає з’єднання)`, а не порожній список.
    - У збірці є `http://127.0.0.1:4311` і немає `4310`.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Connect the planner to the real server: the tasks from `GET /v1/records`, the "done" mark with `PATCH /v1/records/:id` and `{done}`, and the count of pending tasks due by a day from the server's list. The platform does not check this step.

    1. `shared/contract.ts`: `RECORDS_PATH_V1`, `PAGE_LIMIT_V1`, `TaskV1`, `ListPageV1`, `ErrorBodyV1`, `parseTaskV1`, `parseListPageV1`, `parseErrorBodyV1`; `"shared/**/*.ts"` in the `include` of `tsconfig.json`.
    2. `git mv data/api.ts data/fixtureApi.ts`; `data/apiError.ts`; `setDone(id, done)` in the fixture API.
    3. `data/httpApi.ts`: `createHttpApi({ baseUrl, fetch, timeoutMs })` with `listTasks`, `createTask`, `saveTask` (`PUT`), `setDone` (`PATCH {done}`), `deleteTask`; the filter `pending` is `&done=false`, `done` is `&done=true`; `InvalidResponseError`.
    4. `data/config.js` (`loadClientConfig`), the new `data/api.ts`, `scripts/build.mjs`, `CLIENT_ENV` in the `define` of `scripts/release.mjs`, the scripts `"build"` and `"release"` with `--env-file-if-exists=.env`; `.env`: `DATA_SOURCE=http`, `API_BASE_URL=http://127.0.0.1:4311`.
    5. `ui/tasksCache.tsx`: `toggleDone` calls `setDone`; `TimeoutError` is "no connection".
    6. `server/src/cors.ts`, `allowedOrigins` in `server/src/config.ts` (`ALLOWED_ORIGINS`), the preflight and `applyCors` in `server/src/server.ts`.
    7. `server/tests/client.test.ts`; the count of pending tasks with a due date is computed by the web app's domain function for a **fixed** day, never from the clock.
    8. The run of the intro in Chrome and both wrong tries; `docs/server.md`, a section "NO-06"; the commit. The native project — step 10 of the intro.

    The server's order: `GET /v1/records` without `sort` sorts by `dueDate` (ties by `id`).

    Your project's test names for step 9 of the intro: `*` instead of the origin — `✖ only the web app's origin is named; another origin gets no CORS answer, a request without Origin still works`; only the first page — `✖ the HTTP source lists every task across pages, filters on the server and the counts come from its list`; a new key on every attempt — `✖ a create whose answer was lost is sent again with the same Idempotency-Key and stored once`; a retried `4xx` — `✖ a read is tried three times when nothing answers, a 4xx once, and every failure rejects`.

    **Self-check — confirm every item yourself:**

    - `npm test` in the project folder — `failed: 0`; in `server/` — `ℹ tests 63`, `ℹ fail 0`.
    - "Mark as done: %%fixture1Name%%" — the server log has `OPTIONS /v1/records/t-01` `204`, then `PATCH` `200`; `Due as of March 2, 2026: 2` becomes `…: 1`.
    - After a server restart and a page reload — the same; `curl -sS http://127.0.0.1:4311/v1/records/t-01` — `"done":true`.
    - Without the server — `The list did not load (no connection)`, not an empty list.
    - The build has `http://127.0.0.1:4311` and no `4310`.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
