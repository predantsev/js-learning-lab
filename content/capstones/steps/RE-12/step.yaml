# Capstone step of unit RE-12 — the React gate (wording shared by the four capstones; the walk-through of
# each capstone is in <capstone>/task.yaml). An assessment: the intro and the task say what must be true
# and how it is checked, never how to build it; the reference/ is the complete model solution.
# The compiler also writes the syllabus lesson of kind capstone-step of RE-12 from this file.
# A local step: done in the learner's editor, terminal and browser; no platform checks.
# Every command was run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome 154) in a scratch home on
# all four projects, continuing the RE-08 scratch projects: local CI, the releases 0.9.0 and 1.0.0, the
# bundle checks, a walk-through on the served 1.0.0 in headless Chrome with one profile for every run
# (create, edit, filter, the capstone's total, reload, delete), the rollback to 0.9.0 and back, and a
# seeded type error for CI. Quoted output is from the wishlist run.
unit: RE-12
mode: local
entry: index.html
title:
  uk: "Підсумковий іспит React: випуск 1.0.0"
  en: "The React gate: release 1.0.0"
intro:
  uk: |
    Підсумковий іспит React-етапу. Без підказок випусти свій проєкт як версію 1.0.0: production-збірка, яку віддає локальний сервер, CI-конвеєр, що запускається однією командою, правила кешу й відкат, який ти справді відрепетирував. Що має бути правдою — у завданні проєкту й нижче; **як** — вирішуєш ти.

    | Рядок | Доказ | Що маєш побачити |
    |---|---|---|
    | Збірка | тека релізу 1.0.0 | мінімізований застосунок із production-збіркою React, імена JavaScript-файлів із хешем; повторна збірка в ту саму теку відмовляє |
    | Секрети | пошук у файлах збірки | жодного значення з `.env` (у нас `grep -c "4310"` — `0` у кожному файлі) |
    | CI | `npm run ci` | lint → typecheck → тести → production-збірка; зупиняється на першій помилці |
    | Тести дій користувача | `npm start`, `http://127.0.0.1:4310/tests.html` | `не пройшли: 0` (у браузері, не в CI-команді) |
    | Попередній перегляд | сервер збірки на `http://127.0.0.1:4310` | `index.html` — `no-cache`, файли з хешем — `public, max-age=31536000, immutable`; на сторінці версія |
    | Перевірка на збірці | дії з завдання проєкту | CRUD, фільтр і підсумок працюють, дані переживають перезавантаження |
    | Версія | сторінка й `git describe --tags` | `1.0.0` і `v1.0.0` |
    | Відкат | `docs/release.md` | попередня збірка 0.9.0 працює з тими самими даними, потім знову 1.0.0 |

    Перевірено на macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2, Chrome 154) на всіх чотирьох проєктах; нижче — вивід «Списку бажань».

    **1. Стан на початку.** `cd ~/js-course/wishlist`, `git status` — чисто, `git log --oneline -1` — commit контрольної точки CP-RE.

    **2. Production-збірка.** Збери застосунок для production у теку, названу версією з `package.json`, як повний статичний сайт. У нас: `releases/1.0.0: index.html, styles.css, images/, data/, dist/app-5LBHBD3P.js, dist/ItemTotals-MJUW3JEP.js, dist/chunk-CVS3B7ZX.js`; `app-…js` — 233 315 байтів проти 1,1 МБ розробницької збірки; рядка `react-dom-client.development` у ній немає. Повторна збірка тієї самої версії в нас відмовляє: `releases/1.0.0 exists already: a release is never rebuilt.` Тека збірки не потрапляє в Git і не перевіряється lint.

    **3. Попередня збірка для відкату.** Щоб було куди відкочуватися, спершу збери ту саму програму як 0.9.0 (кандидат у реліз), потім — 1.0.0. У нас між ними змінився лише `app-…js` (`app-GQQLQOQI.js` → `app-5LBHBD3P.js`, у ньому версія), а `chunk-…` і файл лінивого маршруту зберегли імена — браузер, що їх має, візьме їх із кешу.

    **4. CI однією командою.** `npm run ci` — lint, typecheck, `npm test` і production-збірка, по черзі, до першої помилки. У нас із навмисною помилкою типу конвеєр зупинився після `ui/probe.ts(1,14): error TS2322: Type 'string' is not assignable to type 'number'.`, і збірки не було. Тести дій користувача CI-команда не запускає: їх доводить `tests.html` у браузері.

    **5. Перегляд і перевірка на збірці.** Зупини `npm start` і віддай збірку на тій самій адресі `http://127.0.0.1:4310` — тоді застосунок бачить ті самі збережені дані (інший порт — інше сховище). Відкрий її й у приватному вікні: початкові записи мають з’явитися й без збережених даних. У нас: «Версія 1.0.0»; 6 карток і «Ще хочу на суму: 365 грн»; нове бажання з ціною 99 — 7 карток і «464 грн»; зміна назви переживає перезавантаження; фільтр «бажані» — 5 карток; видалення з підтвердженням — знову 6 і «365 грн»; помилок у Console — 0.

    **6. Відкат.** Збережи запис на 1.0.0, віддай 0.9.0 — сторінка каже «Версія 0.9.0», запис на місці, — потім знову 1.0.0. У нас запис «Перевірка відкату» був на обох (7 карток, без помилок). Запиши в `docs/release.md` назву артефакту й файли, правила кешу, кроки відкату й результат репетиції — і що не репетирувалося.

    **7. Commit і тег.** `git add -A`, `git commit -m "Release 1.0.0: production build, preview, local CI and the release plan"` — у нас `[main b4a5db3] …`; `git tag -a v1.0.0 -m "Release 1.0.0"`; `git describe --tags` — `v1.0.0`; `git status --short` — нічого (тека релізів ігнорується).

    **Самоперевірка — рубрика іспиту:** кожен рядок таблиці вгорі має свій доказ із твого комп’ютера; `docs/release.md` містить справжні імена файлів твоєї збірки й результат відкату; у збірці немає значень із `.env`; `tests.html` — `не пройшли: 0`.

    **Якщо щось пішло не так:** на збірці порожній список у приватному вікні, а з `npm start` усе гаразд — збірка не містить того, що застосунок завантажує під час роботи (подивись у DevTools → Network, яка адреса дає 404). Після нової збірки браузер показує стару версію — `index.html` закешовано: перевір його `cache-control` у Network.

    Еталон кроку — `Завантажити: RE-12 — Підсумковий іспит React: випуск 1.0.0` після експорту; відкривай його після власної спроби. Команди виконано лише на macOS і в Chrome; у Linux і Windows (Git Bash) їх не запускали, справжнього хостингу й CI-сервісу не використовували.
  en: |
    The gate of the React stage. Without hints, release your project as version 1.0.0: a production build served by a local server, a CI pipeline that runs with one command, cache rules and a rollback you really rehearsed. What must be true is in your project's task and below; **how** is up to you.

    | Row | Evidence | What you must see |
    |---|---|---|
    | Build | the release folder 1.0.0 | a minified app with React's production build, JavaScript file names with a hash; a second build into the same folder refuses |
    | Secrets | a search in the build files | no value from `.env` (for us `grep -c "4310"` — `0` in every file) |
    | CI | `npm run ci` | lint → typecheck → tests → the production build; stops at the first failure |
    | User-action tests | `npm start`, `http://127.0.0.1:4310/tests.html` | `failed: 0` (in the browser, not in the CI command) |
    | Preview | the build's server at `http://127.0.0.1:4310` | `index.html` — `no-cache`, hashed files — `public, max-age=31536000, immutable`; the version on the page |
    | Check on the build | the actions of your project's task | CRUD, the filter and the total work, the data survives a reload |
    | Version | the page and `git describe --tags` | `1.0.0` and `v1.0.0` |
    | Rollback | `docs/release.md` | the previous build 0.9.0 works with the same data, then 1.0.0 again |

    Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2, Chrome 154) on all four projects; below is the output of the wishlist.

    **1. The starting state.** `cd ~/js-course/wishlist`, `git status` — clean, `git log --oneline -1` — the commit of the CP-RE checkpoint.

    **2. The production build.** Build the app for production into a folder named after the version in `package.json`, as a complete static site. For us (the English build, through `npm run ci`, version 1.0.0): `releases/ci: index.html, styles.css, images/, data/, dist/app-3Y3K4ICW.js, dist/ItemTotals-W6GC66H3.js, dist/chunk-6CPTLNRY.js`; `app-…js` — 227,752 bytes against 1,158,960 of the development `dist/app.js`; it has no `react-dom-client.development`. A second build of the same version refuses for us: `releases/1.0.0 exists already: a release is never rebuilt.` The build folder is not in Git and is not linted.

    **3. A previous build for the rollback.** To have something to roll back to, first build the same program as 0.9.0 (the release candidate), then 1.0.0. For us only `app-…js` changed between them (it carries the version), while `chunk-…` and the lazy route's file kept their names — a browser that has them takes them from its cache.

    **4. CI with one command.** `npm run ci` — lint, typecheck, `npm test` and the production build, in turn, up to the first failure. For us, with a deliberate type error, the pipeline stopped after `ui/probe.ts(1,14): error TS2322: Type 'string' is not assignable to type 'number'.`, and there was no build. The CI command does not run the user-action tests: `tests.html` in the browser proves them.

    **5. Preview and the check on the build.** Stop `npm start` and serve the build at the same address `http://127.0.0.1:4310` — then the app sees the same saved data (another port is another storage). Open it in a private window too: the starting records must appear without any saved data. For us (the Ukrainian build): “Версія 1.0.0”; 6 cards and “Ще хочу на суму: 365 грн”; a new wish priced 99 — 7 cards and “464 грн”; a changed name survives a reload; the filter “бажані” — 5 cards; a delete with the confirmation — 6 again and “365 грн”; Console errors — 0.

    **6. Rollback.** Save a record on 1.0.0, serve 0.9.0 — the page says version 0.9.0 and the record is there — then 1.0.0 again. For us the record “Перевірка відкату” was on both (7 cards, no errors). Write into `docs/release.md` the artifact's name and files, the cache rules, the rollback steps and the result of the rehearsal — and what was not rehearsed.

    **7. Commit and tag.** `git add -A`, `git commit -m "Release 1.0.0: production build, preview, local CI and the release plan"` — for us `[main e6c4638] …`; `git tag -a v1.0.0 -m "Release 1.0.0"`; `git describe --tags` — `v1.0.0`; `git status --short` — nothing (the releases folder is ignored).

    **Self-check — the gate rubric:** every row of the table above has its own evidence from your computer; `docs/release.md` holds the real file names of your build and the result of the rollback; the build has no values from `.env`; `tests.html` — `failed: 0`.

    **If something goes wrong:** the build shows an empty list in a private window while `npm start` is fine — the build lacks something the app loads while it runs (see in DevTools → Network which address gives 404). After a new build the browser shows the old version — `index.html` was cached: check its `cache-control` in Network.

    The step's reference is `Download: RE-12 — The React gate: release 1.0.0` after the export; open it after your own attempt. The commands were run on macOS and in Chrome only; they were not run on Linux or Windows (Git Bash), and no real hosting or CI service was used.
purpose:
  uk: "Це підсумковий іспит твого проєкту на React-етапі: production-збірку, CI, версії, правила кешу й відкат цього розділу ти застосовуєш без підказок до власного застосунку. Платформа цей крок не перевіряє: доказ — збірка, вивід команд, `docs/release.md`, тег і commit."
  en: "This is the gate of your project at the React stage: without hints you apply this unit's production build, CI, versions, cache rules and rollback to your own app. The platform does not check this step: the evidence is the build, the command output, `docs/release.md`, the tag and the commit."
objectives:
  - uk: "Без підказок створити production-збірку з хешованими іменами, віддати її локально й перевірити CRUD, фільтр і підсумок проєкту на зібраному застосунку."
    en: "Without hints produce a production build with hashed names, serve it locally and verify the project's CRUD, filter and total on the built app."
  - uk: "Запустити CI-конвеєр однією командою, позначити версію 1.0.0 і відрепетирувати відкат до попередньої збірки, записавши правила кешу й результат у `docs/release.md`."
    en: "Run the CI pipeline with one command, tag version 1.0.0 and rehearse a rollback to the previous build, recording the cache rules and the result in `docs/release.md`."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й браузері на твоєму комп’ютері: що має бути правдою, як це перевірити й рубрика самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and a browser on your computer: what must be true, how to check it and the self-check rubric are above and on the step's page in your project."
