# Planner variant of step RE-12 (a local step: done in the learner's editor, terminal and browser, no
# platform checks). Checked on macOS (Node.js 25.2.1, React 19.3.0, TypeScript 7.0.2, esbuild 0.28.2,
# Chrome) on the scratch project of this capstone after RE-08. An assessment: the instructions say what must be true, not how;
# reference/ is the model solution.
strings:
  versionLabel: { uk: "Версія", en: "Version" }
instructions:
  uk: |
    Підсумковий іспит React-етапу — без підказок: що має бути правдою і як це перевіряється; як — вирішуєш ти. Платформа цей крок не перевіряє.

    1. Production-збірка: мінімізована, з production-збіркою React, у теці, названій версією з `package.json`; імена JavaScript-файлів містять хеш вмісту; секретів і значень із `.env` у ній немає; наявна тека релізу не перезаписується.
    2. Попередній перегляд: збірку віддає локальний сервер на `127.0.0.1` на тій самій адресі й порті, що й `npm start` (ті самі збережені дані); `index.html` — `cache-control: no-cache`, файли з хешем — кешуються надовго; сторінка показує версію збірки.
    3. Перевірка на зібраному застосунку: додати, змінити, видалити справу; фільтр «%%filterPending%%» / «%%filterDone%%»; лічильник «%%dueSummary%%» для фіксованого дня; дані переживають перезавантаження.
    4. CI локально: одна команда `npm run ci` проходить lint → typecheck → тести → production-збірку й зупиняється на першій помилці; тести дій користувача в `tests.html` — окремо в браузері, `не пройшли: 0`.
    5. Версія 1.0.0: сторінка показує 1.0.0, commit позначено тегом `v1.0.0`.
    6. `docs/release.md`: назва артефакту й файли в ньому, правила кешу для `index.html` і файлів із хешем, кроки відкату — і результат відрепетируваного відкату: попередня збірка (0.9.0) працює з тими самими даними, потім знову 1.0.0.
    7. Commit і тег; `git status` — чисто, тека релізів не в Git.
  en: |
    The React gate — without hints: what must be true and how it is checked; how is up to you. The platform does not check this step.

    1. A production build: minified, with React's production build, in a folder named after the version in `package.json`; the JavaScript file names carry a content hash; no secrets and no values from `.env` in it; an existing release folder is never overwritten.
    2. A preview: a local server on `127.0.0.1` serves the build at the same address and port as `npm start` (the same saved data); `index.html` — `cache-control: no-cache`, the hashed files — cached for a long time; the page shows the build's version.
    3. The check on the built app: add, edit, delete a task; the “%%filterPending%%” / “%%filterDone%%” filter; the “%%dueSummary%%” count for the fixed day; the data survives a reload.
    4. CI locally: one command `npm run ci` runs lint → typecheck → tests → the production build and stops at the first failure; the user-action tests of `tests.html` separately in the browser, `failed: 0`.
    5. Version 1.0.0: the page shows 1.0.0, the commit is tagged `v1.0.0`.
    6. `docs/release.md`: the artifact's name and its files, the cache rules for `index.html` and for the hashed files, the rollback steps — and the result of a rehearsed rollback: the previous build (0.9.0) works with the same data, then 1.0.0 again.
    7. A commit and the tag; `git status` — clean, the releases folder is not in Git.
