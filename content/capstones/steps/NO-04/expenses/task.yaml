# Expense tracker variant of step NO-04 (a local step: done in the learner's editor and terminal; no platform checks).
# Checked on macOS (Node.js 25.2.1, curl 8.7.1) on the scratch project of this capstone after NO-03, in a
# Ukrainian and an English workspace: npm test (13 tests), the curl script against the running server; not
# run on Node.js 22, Linux or Windows.
instructions:
  uk: |
    Відкрий записи як CRUD API `/v1/records` з валідацією на межі, моделлю помилок, сторінками й ідемпотентними повторами. Платформа цей крок не перевіряє.

    1. `src/api-errors.ts` (`ApiError`, `toErrorResponse`), `src/body.ts` (`readBodyText` з межею 4096 байтів, `parseJson`), `src/idempotency.ts` (`createIdempotencyStore`).
    2. `src/validate.ts`: `validateExpenseInput(body)` — доменна `validateExpense` плюс типи й `unknown-field`; усі помилки разом.
    3. `src/list.ts`: `listExpenses` — `?category=` (одна із чотирьох), `?from=` і `?to=` (обидва дні включно), `?sort=date` або `amountMinor`; `limit` 1–50, курсор — `id`, `id` для нічиїх.
    4. `src/api.ts`: `handleV1` — шість операцій, `PATCH` перевіряє злитий запис, `POST` з `Idempotency-Key`; `src/server.ts` передає туди `/v1`, `GET /records` лишається.
    5. `tests/api.test.ts` (`node:test`, `listen(0)`, `t.after`), `"test": "node --test tests/*.test.ts"`; скрипт `server/try-api.mjs`.
    6. `docs/server.md`, розділ «NO-04»; `git commit -m "Expose the records as a /v1 CRUD API with validation, errors, pages and idempotent creates"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npm test` — `ℹ pass 13`, `ℹ fail 0`.
    - `node try-api.mjs` при запущеному сервері: два однакові `→ 201` з тим самим `id`, `VALIDATION_FAILED` `→ 400` для невалідного оновлення, дві сторінки, з’єднані `nextCursor`.
    - У файлі даних після скрипту — сім записів, не вісім.
    - `curl -sS http://127.0.0.1:4311/records` — як і раніше, масив записів.
    - `npm run typecheck` — жодного рядка; `npm run check:server` і `npm run check` — усі `✔`; `git status` після commit — чисто.

    **Доказ:** commit і `docs/server.md` із командами й побаченим виводом.
  en: |
    Expose the records as a `/v1/records` CRUD API with validation at the edge, an error model, pages and idempotent retries. The platform does not check this step.

    1. `src/api-errors.ts` (`ApiError`, `toErrorResponse`), `src/body.ts` (`readBodyText` with a limit of 4096 bytes, `parseJson`), `src/idempotency.ts` (`createIdempotencyStore`).
    2. `src/validate.ts`: `validateExpenseInput(body)` — the domain's `validateExpense` plus types and `unknown-field`; all errors together.
    3. `src/list.ts`: `listExpenses` — `?category=` (one of the four), `?from=` and `?to=` (both days included), `?sort=date` or `amountMinor`; `limit` 1–50, the cursor is an `id`, the `id` for ties.
    4. `src/api.ts`: `handleV1` — six operations, `PATCH` validates the merged record, `POST` with `Idempotency-Key`; `src/server.ts` hands `/v1` to it, `GET /records` stays.
    5. `tests/api.test.ts` (`node:test`, `listen(0)`, `t.after`), `"test": "node --test tests/*.test.ts"`; the script `server/try-api.mjs`.
    6. `docs/server.md`, a section “NO-04”; `git commit -m "Expose the records as a /v1 CRUD API with validation, errors, pages and idempotent creates"`.

    **Self-check — confirm every item yourself:**

    - `npm test` — `ℹ pass 13`, `ℹ fail 0`.
    - `node try-api.mjs` with the server running: two identical `→ 201` with the same `id`, `VALIDATION_FAILED` `→ 400` for the invalid update, two pages joined by `nextCursor`.
    - The data file after the script holds seven records, not eight.
    - `curl -sS http://127.0.0.1:4311/records` — an array of records, as before.
    - `npm run typecheck` — not a single line; `npm run check:server` and `npm run check` — every check `✔`; `git status` after the commit — clean.

    **Evidence:** the commit and `docs/server.md` with the commands and the output you saw.
