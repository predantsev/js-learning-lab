# Wishlist variant of step JS-10 (a local step: done in the learner's terminal and browser, no platform checks).
# Commands were run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0, Chrome) from a real export of this project.
instructions:
  uk: |
    Контрольна точка CP-JS для теки `~/js-course/wishlist`. Платформа цей крок не перевіряє; доказ — вивід команд і твій commit. Відтепер локальні файли — це проєкт: платформа їх не перезаписує й не синхронізує, а еталони пізніших кроків ти переноситимеш вручну після commit.

    1. `cd ~/js-course/wishlist`, `git status` — `nothing to commit, working tree clean`; `git log --oneline` — чотири commit з уроків розділу (README, імпорт експорту, інструменти, порт із `.env`).
    2. `npm pkg set scripts.test="node run-tests.js"`, потім `npm test` і `echo $?`: рядок `✓` на кожен тест, підсумок без невдалих тестів і `0`.
    3. Тимчасово зміни очікуване значення в одному тесті `tests/domain.test.js`: `npm test` показує рядок `✗`, а `echo $?` — `1`. Поверни файл (`git restore tests/domain.test.js`) і переконайся, що `npm test` знову без невдалих тестів.
    4. `npm start` (порт 4310 з `.env`). На `http://127.0.0.1:4310/tools/restore-data.html` віднови дані з експорту, потім відкрий `http://127.0.0.1:4310/`.
    5. Додай, відредагуй і видали запис, перезавантаж сторінку — зміни на місці. У DevTools → Console виконай:

       ```js
       const { filterItems } = await import("/domain/wishes.js"); filterItems(JSON.parse(localStorage.getItem("jsll.wishlist.v1")).records, "acquired").length
       ```

       Число дорівнює кількості карток «отримані бажання (з позначкою)». Порівняй кількість бажань, сума бажаного й кількість бажань без ціни під формою з тим, що показує платформа для тих самих записів.
    6. Зупини сервер, `npm run lint` — без зауважень. Потім `git add -A`, `git commit -m "CP-JS: npm test passes; add, edit, delete, filter and reload checked locally"`; `git log --oneline` — п’ять рядків, `git status` — чисто.
  en: |
    The checkpoint CP-JS for the folder `~/js-course/wishlist`. The platform does not check this step; the evidence is the command output and your commit. From now on the local files are the project: the platform does not overwrite or sync them, and you will move the references of later steps in by hand after a commit.

    1. `cd ~/js-course/wishlist`, `git status` — `nothing to commit, working tree clean`; `git log --oneline` — four commits from this unit's lessons (README, import of the export, tools, the port from `.env`).
    2. `npm pkg set scripts.test="node run-tests.js"`, then `npm test` and `echo $?`: a `✓` line for every test, a summary with no failed test, and `0`.
    3. Temporarily change the expected value in one test of `tests/domain.test.js`: `npm test` shows a `✗` line, and `echo $?` shows `1`. Put the file back (`git restore tests/domain.test.js`) and make sure `npm test` has no failed test again.
    4. `npm start` (port 4310 from `.env`). At `http://127.0.0.1:4310/tools/restore-data.html` restore the exported data, then open `http://127.0.0.1:4310/`.
    5. Add, edit and delete a record, reload the page — the changes are still there. In DevTools → Console run:

       ```js
       const { filterItems } = await import("/domain/wishes.js"); filterItems(JSON.parse(localStorage.getItem("jsll.wishlist.v1")).records, "acquired").length
       ```

       The number equals the number of cards of acquired wishes (with the mark). Compare the number of wishes, the wanted total and the number of wishes without a price under the form with what the platform shows for the same records.
    6. Stop the server, `npm run lint` — no findings. Then `git add -A`, `git commit -m "CP-JS: npm test passes; add, edit, delete, filter and reload checked locally"`; `git log --oneline` — five lines, `git status` — clean.
