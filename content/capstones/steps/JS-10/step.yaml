# Capstone step of unit JS-10 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson js-10-05-capstone-cp-js from this file.
# A local step: it is done in the learner's terminal and browser and has no platform checks. The
# project page shows only the intro of a local step, so the intro carries the whole procedure.
# Every command was run on macOS (Node.js 25.2.1, npm 11.6.2, Git 2.51.0) in a scratch home on all four
# projects, from a real export of the JS-09 reference, after the commands of lessons js-10-02…04; the
# browser part ran in Chrome against the local server. Quoted output is from the wishlist run.
unit: JS-10
mode: local
entry: index.html
title:
  uk: "Контрольна точка CP-JS"
  en: "Checkpoint CP-JS"
intro:
  uk: |
    Це остання перевірка етапу JavaScript — [[checkpoint|контрольна точка]] CP-JS. Після уроків цього розділу твій проєкт живе в теці `~/js-course/<проєкт>`, і відтепер **саме локальні файли — це проєкт**: платформа їх ніколи не перезаписує й не синхронізує. Коли пізніші кроки запропонують еталон, ти завантажиш його окремо й перенесеш зміни вручну — після commit, щоб завжди можна було повернутися.

    Без підказок перевір, що локальна версія робить те саме, що й на платформі, і зафіксуй цю перевірку в commit. Команди написано для «Списку бажань»; для свого проєкту підстав його теку, а що саме порівнювати — у таблиці нижче.

    **1. Стан на початку.** У теці проєкту:

    ```sh
    cd ~/js-course/wishlist
    git status
    git log --oneline
    ```

    `git status` пише `nothing to commit, working tree clean`, а `git log --oneline` показує чотири commit (номери в тебе інші):

    ```text
    693e684 Read the port from an uncommitted .env file
    009ee36 Add ESLint, Prettier and an esbuild build with a source map
    e8b3333 Import the project exported from the platform
    4ce3866 Describe the project in a README
    ```

    **2. Тести через `npm test`.** В експорті є твої тести з кроку про тести (`tests/testing.js`, `tests/domain.test.js`, `run-tests.js`), але в `package.json` з експорту є лише скрипт `start`. Додай скрипт `test` і запусти:

    ```sh
    npm pkg set scripts.test="node run-tests.js"
    npm test
    echo $?
    ```

    Після рядків `> … test` і `> node run-tests.js` — рядок `✓` на кожен твій тест, підсумок на кшталт `Пройшли: 8 · не пройшли: 0`, а `echo $?` друкує `0` — код завершення останньої команди.

    **3. Тест, що падає, має зупиняти.** Тимчасово зміни очікуване значення в одному тесті `tests/domain.test.js` (наприклад, `.toBe(true)` на `.toBe(false)`) і знову виконай `npm test` та `echo $?`. Тепер є рядок `✗` з описом, наприклад `✗ validateItem accepts a name of 80 characters — 80 characters: очікувалося false, отримано true`, підсумок `Пройшли: 7 · не пройшли: 1`, а `echo $?` друкує `1`: так `run-tests.js` під Node.js повідомляє про невдачу. Поверни файл таким, як у останньому commit, і переконайся, що все знову проходить:

    ```sh
    git restore tests/domain.test.js
    npm test
    ```

    **4. Запуск і ті самі дані.** `npm start` друкує `Проєкт працює: http://127.0.0.1:4310/` (порт — з твого `.env`). Сховище браузера окреме для кожної адреси й порту, тож на `127.0.0.1:4310` воно спершу порожнє, і сторінка показує початкові записи з `data/`. Відкрий `http://127.0.0.1:4310/tools/restore-data.html` і натисни кнопку відновлення: сторінка пише `Готово: записано 1.` — у сховище цієї адреси потрапили дані з `data/exported-storage.json`, а файли проєкту не змінилися. Відкрий `http://127.0.0.1:4310/`: картки й підсумок — ті самі, що на платформі в момент експорту.

    **5. Перевірка за списком.** У браузері на `127.0.0.1:4310`:

    - додай запис через форму, відредагуй інший і видали ще один (з підтвердженням);
    - перезавантаж сторінку — усі три зміни на місці;
    - у DevTools (вкладка **Console**) виконай команду фільтра для свого проєкту з таблиці — число має дорівнювати кількості таких карток на сторінці;
    - порівняй підсумок під формою з тим, що показує платформа для тих самих записів.

    | Проєкт | Тека | Підсумок | Команда фільтра в Console |
    |---|---|---|---|
    | Список бажань | `wishlist` | кількість, сума бажаного, бажання без ціни | `const { filterItems } = await import("/domain/wishes.js"); filterItems(JSON.parse(localStorage.getItem("jsll.wishlist.v1")).records, "acquired").length` |
    | Планувальник | `planner` | справи до терміну на дату сторінки | `const { filterTasks } = await import("/domain/tasks.js"); filterTasks(JSON.parse(localStorage.getItem("jsll.planner.v1")).records, "done").length` |
    | Трекер звичок | `habits` | частка виконань кожної активної звички | `const { filterHabits } = await import("/domain/habits.js"); filterHabits(JSON.parse(localStorage.getItem("jsll.habits.v1")).records, "active").length` |
    | Трекер витрат | `expenses` | суми за кожною категорією й разом | `const { filterExpenses } = await import("/domain/expenses.js"); filterExpenses(JSON.parse(localStorage.getItem("jsll.expenses.v1")).records, "food").length` |

    Зупини сервер (Ctrl+C) і переконайся, що lint чистий: `npm run lint` друкує лише `> … lint` і `> eslint .`.

    **6. Commit контрольної точки.** Повідомлення каже, що саме перевірено:

    ```sh
    git status --short
    git add -A
    git commit -m "CP-JS: npm test passes; add, edit, delete, filter and reload checked locally"
    git log --oneline
    git status
    ```

    `git status --short` показує лише ` M package.json` — новий скрипт `test` (дані браузера у файли не потрапляють). Після commit: `[main 00f95b2] CP-JS: …` і `1 file changed, 2 insertions(+), 1 deletion(-)`; `git log --oneline` — п’ять рядків, новий угорі; `git status` — `nothing to commit, working tree clean`.

    Доказ контрольної точки — вивід `npm test`, відмічений список із кроку 5 і `git log --oneline`.

    Якщо щось пішло не так:

    - `npm error Missing script: "test"` — скрипта `test` ще немає: виконай `npm pkg set` з кроку 2 у теці проєкту.
    - Тест упав, а `echo $?` друкує `0` — у `run-tests.js` бракує частини, що ставить `exitCode = 1` під Node.js: звір файл із кроком про тести.
    - Після відновлення сторінка показує початкові записи — відновлення робилося на іншій адресі чи порту. Відкрий сторінку відновлення саме на `127.0.0.1:4310`, де працює проєкт.
    - `git status` показує `.env` чи `node_modules/` — їх немає в `.gitignore`: поверни рядки з уроків про інструменти й порт.

    Команди виконано на macOS. У Linux вони ті самі; у Windows виконуй їх у Git Bash, де працює `echo $?` (у PowerShell код завершення показує `$LASTEXITCODE`). Вивід для Linux і Windows ми не записували.
  en: |
    This is the last check of the JavaScript stage — the [[checkpoint]] CP-JS. After this unit's lessons your project lives in the folder `~/js-course/<project>`, and from now on **the local files are the project**: the platform never overwrites or syncs them. When later steps offer a reference, you download it separately and move the changes in by hand — after a commit, so that you can always go back.

    Without hints, check that the local version does the same as on the platform, and record that check in a commit. The commands are written for the wishlist; for your project use its folder, and what to compare is in the table below.

    **1. The starting state.** In the project folder:

    ```sh
    cd ~/js-course/wishlist
    git status
    git log --oneline
    ```

    `git status` says `nothing to commit, working tree clean`, and `git log --oneline` shows four commits (your numbers differ):

    ```text
    ccb2881 Read the port from an uncommitted .env file
    a9327f1 Add ESLint, Prettier and an esbuild build with a source map
    a788ae0 Import the project exported from the platform
    651653b Describe the project in a README
    ```

    **2. Tests through `npm test`.** The export holds your tests from the testing step (`tests/testing.js`, `tests/domain.test.js`, `run-tests.js`), but the exported `package.json` has only the `start` script. Add a `test` script and run it:

    ```sh
    npm pkg set scripts.test="node run-tests.js"
    npm test
    echo $?
    ```

    After the lines `> … test` and `> node run-tests.js` comes a `✓` line for every test of yours, a summary like `Passed: 8 · failed: 0`, and `echo $?` prints `0` — the exit code of the last command.

    **3. A failing test must stop you.** Temporarily change the expected value in one test of `tests/domain.test.js` (for example `.toBe(true)` to `.toBe(false)`) and run `npm test` and `echo $?` again. Now there is a `✗` line with a description, for example `✗ validateItem accepts a name of 80 characters — 80 characters: expected false, got true`, the summary `Passed: 7 · failed: 1`, and `echo $?` prints `1`: this is how `run-tests.js` reports a failure under Node.js. Put the file back as it is in the last commit and make sure everything passes again:

    ```sh
    git restore tests/domain.test.js
    npm test
    ```

    **4. Run it with the same data.** `npm start` prints `The project is running: http://127.0.0.1:4310/` (the port comes from your `.env`). The browser storage is separate for every address and port, so at `127.0.0.1:4310` it starts empty, and the page shows the starting records from `data/`. Open `http://127.0.0.1:4310/tools/restore-data.html` and press the restore button: the page says `Done: 1 written.` — the data of `data/exported-storage.json` went into the storage of this address, and the project files did not change. Open `http://127.0.0.1:4310/`: the cards and the summary are the same as on the platform at the moment of the export.

    **5. Check against the list.** In the browser at `127.0.0.1:4310`:

    - add a record with the form, edit another one and delete a third (with the confirmation);
    - reload the page — all three changes are still there;
    - in DevTools (the **Console** tab) run the filter command of your project from the table — the number must equal the number of such cards on the page;
    - compare the summary under the form with what the platform shows for the same records.

    | Project | Folder | Summary | Filter command in the Console |
    |---|---|---|---|
    | Wishlist | `wishlist` | count, wanted total, wishes without a price | `const { filterItems } = await import("/domain/wishes.js"); filterItems(JSON.parse(localStorage.getItem("jsll.wishlist.v1")).records, "acquired").length` |
    | Planner | `planner` | tasks due as of the page's date | `const { filterTasks } = await import("/domain/tasks.js"); filterTasks(JSON.parse(localStorage.getItem("jsll.planner.v1")).records, "done").length` |
    | Habit tracker | `habits` | the completion rate of every active habit | `const { filterHabits } = await import("/domain/habits.js"); filterHabits(JSON.parse(localStorage.getItem("jsll.habits.v1")).records, "active").length` |
    | Expense tracker | `expenses` | the totals of every category and overall | `const { filterExpenses } = await import("/domain/expenses.js"); filterExpenses(JSON.parse(localStorage.getItem("jsll.expenses.v1")).records, "food").length` |

    Stop the server (Ctrl+C) and make sure lint is clean: `npm run lint` prints only `> … lint` and `> eslint .`.

    **6. The checkpoint commit.** The message says what was checked:

    ```sh
    git status --short
    git add -A
    git commit -m "CP-JS: npm test passes; add, edit, delete, filter and reload checked locally"
    git log --oneline
    git status
    ```

    `git status --short` shows only ` M package.json` — the new `test` script (browser data does not go into files). After the commit: `[main e75a43a] CP-JS: …` and `1 file changed, 2 insertions(+), 1 deletion(-)`; `git log --oneline` — five lines, the new one on top; `git status` — `nothing to commit, working tree clean`.

    The evidence of the checkpoint is the output of `npm test`, the ticked list of step 5 and `git log --oneline`.

    If something goes wrong:

    - `npm error Missing script: "test"` — there is no `test` script yet: run the `npm pkg set` of step 2 in the project folder.
    - A test failed but `echo $?` prints `0` — `run-tests.js` lacks the part that sets `exitCode = 1` under Node.js: compare the file with the testing step.
    - After the restore the page shows the starting records — the restore happened on another address or port. Open the restore page exactly at `127.0.0.1:4310`, where the project runs.
    - `git status` shows `.env` or `node_modules/` — they are missing from `.gitignore`: put back the lines from the lessons on tools and the port.

    The commands were run on macOS. On Linux they are the same; on Windows run them in Git Bash, where `echo $?` works (in PowerShell `$LASTEXITCODE` shows the exit code). We did not record the output on Linux and Windows.
purpose:
  uk: "Це крок твого проєкту і контрольна точка етапу: без підказок ти перевіряєш експортований застосунок локально — тести, зміни записів, фільтр, збереження після перезавантаження — і фіксуєш результат у commit. Платформа цей крок не перевіряє: доказом є вивід команд і твій commit."
  en: "This is a step of your project and the checkpoint of the stage: without hints you check the exported app locally — tests, record changes, the filter, persistence after a reload — and record the result in a commit. The platform does not check this step: the evidence is the command output and your commit."
objectives:
  - uk: "Додати скрипт `test`, запустити тести проєкту через `npm test` і показати, що тест, який падає, дає код завершення `1`."
    en: "Add a `test` script, run the project's tests with `npm test` and show that a failing test gives the exit code `1`."
  - uk: "Відновити дані з експорту на локальній адресі й перевірити додавання, редагування, видалення, фільтр і збереження після перезавантаження."
    en: "Restore the exported data at the local address and check adding, editing, deleting, the filter and persistence after a reload."
  - uk: "Зафіксувати контрольну точку CP-JS commit, повідомлення якого каже, що перевірено, і переконатися, що робоча тека чиста."
    en: "Record the checkpoint CP-JS in a commit whose message says what was checked, and make sure the working tree is clean."
transfer:
  uk: "Цей крок виконується в терміналі й браузері на твоєму комп’ютері: команди й очікуваний вивід — вище і на сторінці кроку в проєкті. Після нього локальна тека — головна версія проєкту."
  en: "This step is done in a terminal and a browser on your computer: the commands and the expected output are above and on the step's page in your project. After it, the local folder is the main version of the project."
