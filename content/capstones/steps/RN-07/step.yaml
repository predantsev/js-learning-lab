# Capstone step of unit RN-07 (wording shared by the four capstones; domain wording is in <capstone>/task.yaml).
# The compiler also writes the syllabus lesson of kind capstone-step of RN-07 from this file.
# Teaching order: RN-09, RN-10, RN-07, … — this step continues the RN-10 reference.
# A local step: done in the learner's editor, terminal and on the declared native target; no platform
# checks. The project page shows only the intro of a local step, so the intro carries the whole procedure.
# Every computer-side command was run on macOS (Node.js 25.2.1, npm 11.6.2, Expo SDK 57) in a scratch home
# on all four projects, continuing the RN-10 scratch projects: expo install of jest-expo, jest, @types/jest
# and @testing-library/react-native, npm pkg set, tsc with the type tests, `npm test` (the course runner
# and Jest, Ukrainian and English strings), the seeded version mismatch with expo install --check and
# --fix, expo export for android and ios, the commit. Deliberately wrong variants failed: the toggle
# wired to another handler, a form that hides its messages, a type test whose error is gone (TS2578), a
# streak that does not wait for today. Nothing was run on an emulator, a simulator or a phone. Quoted
# output is from the wishlist run.
# reference/ is the native project after the step without the files the template generates and the
# platform cannot carry (assets/*.png, LICENSE, package-lock.json, node_modules/).
unit: RN-07
mode: local
entry: App.tsx
title:
  uk: "Тести трьох рівнів, перевірки на пристрої й одна налагоджена поломка"
  en: "Tests at three levels, device checks and one debugged failure"
intro:
  uk: |
    Проєкт отримує справжній Jest: юніт-тест спільного правила з фіксованим днем, тест типізованої валідації збережених даних і компонентний тест головної дії рядка, знайденої за доступною назвою. Те, чого Jest не бачить, стає списком перевірок на пристрої в `GAPS.md`, а одна справжня локальна поломка — записом у `DEBUG-NOTES.md`.

    | Проєкт | Юніт-тест | Типізована валідація | Компонентний тест | Перевірки на пристрої |
    |---|---|---|---|---|
    | Список бажань | `summarizeItems`: сума бажаних із ціною, без ціни — окремо | ціна текстом відхиляється | перемикач «отримано» за назвою | перезапуск; свайп і дія доступності |
    | Планувальник | `countDueTasks` на фіксований день | пріоритет `"urgent"` відхиляється | перемикач «виконано» за назвою | посилання на справу; лічильник після повернення |
    | Трекер звичок | `streakOf` на фіксований день; `completeHabit` — без повторів, за порядком | частота `"monthly"` відхиляється | кнопка «Позначити сьогодні» | зменшення руху; перезапуск |
    | Трекер витрат | `summarizeExpenses` у цілих копійках | `amountMinor` 845.5 відхиляється | повідомлення форми | формат гривні на пристрої; перезапуск |

    Нижче — «Список бажань». Команди на комп’ютері виконано на macOS (Node.js 25.2.1, Expo SDK 57, jest-expo 57.0.5, Jest 29.7, React Native Testing Library 14.0.1) на всіх чотирьох проєктах. Емулятора, симулятора й телефона не було: перевірки на пристрої лишаються «не виконано».

    **1. Стан на початку.** `cd ~/js-course/wishlist-native`, `git status` — чисто, `git log --oneline -1` — commit свайпу.

    **2. Jest.** `npx expo install jest-expo jest @types/jest @testing-library/react-native --dev` — у нас `› Installing 3 SDK 57.0.0 compatible native modules and 1 other package using npm` і `npm warn ERESOLVE overriding peer dependency` (нешкідливе). Потім `npm pkg set scripts.test="node run-tests.js && jest" jest.preset=jest-expo "jest.roots[0]=<rootDir>/src"`: `npm test` запускає і курсовий runner (`tests/`), і Jest; Jest шукає тести лише в `src/`, бо файли `tests/*.test.js` пишуть у runner курсу й для Jest порожні. У `tsconfig.json` — `"types": ["jest"]`, інакше `Cannot find name 'test'`.

    **3. Юніт і типізована валідація.** `src/capstone.test.tsx`: `summarizeItems` для чотирьох бажань — `{ count: 4, wantedTotal: 80, wantedWithoutPrice: 1 }`; збережений JSON з ціною `"80"` — `parseItemList(…).ok === false` з помилкою `1.price`. Друга половина типізованого домену — `src/__typetests__/wish.ts`: `// @ts-expect-error` над бажанням із ціною-текстом і без `acquired`; `npx tsc --noEmit` перевіряє ці рядки, а коли тип перестає їх відхиляти, каже `TS2578: Unused '@ts-expect-error' directive` (ми перевірили).

    **4. Компонентний тест.** У тому самому файлі `ItemRow` зі станом довкола (справжній `itemsReducer`): `await render(…)`, `userEvent.setup()`, `await user.press(screen.getByRole('button', { name: 'Позначити отриманим' }))`, далі `screen.getByText('отримано')` і кнопка «Повернути в бажані» — `toBeOnTheScreen()`. Тест шукає кнопку так, як її знаходить людина з читачем екрана: за назвою й роллю.

    **5. Що лишається пристрою.** `GAPS.md`: таблиця «поведінка × Jest / заявлена ціль / інша платформа» з «verified», «not performed» чи «—» і перевірки на пристрої у чотири частини — твердження, дія на цілі, ціль, очікуване спостереження. Jest працює з підмінами jest-expo, тож справжньої клавіатури, жестів, читача екрана, сховища пристрою й даних `Intl` пристрою він не бачить.

    **6. Одна локальна поломка.** Відтвори її, запиши першу вирішальну стрічку, полагодь документованим способом. Наша: `npm install react-native-gesture-handler@2.30.0`, `npx expo install --check` — `react-native-gesture-handler@2.30.0 - expected version: ~2.32.0`; `npx tsc --noEmit` і `npm test` при цьому проходять — зламалися залежності, не код. Ремонт — `npx expo install --fix`, потім `Dependencies are up to date`. Запиши в `DEBUG-NOTES.md`; на цілі — перший рядок журналу пристрою з назвою модуля до ремонту й запуск після.

    **7. Перевірка на комп’ютері.** `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — жодного рядка; `npm test` — `Пройшли: 53 · не пройшли: 0`, потім `PASS src/capstone.test.tsx` і `Tests: 3 passed, 3 total`; `npx expo export --platform android` — у нас `Android Bundled 2240ms index.ts (944 modules)`.

    **8. На заявленій цілі.** Виконай хоча б одну перевірку з `GAPS.md` (у нас: перезапуск — познач бажання отриманим, повністю закрий застосунок, відкрий знову) і запиши, що бачив. Цього ми не бачили.

    **9. Доказ і commit.** У `EVIDENCE.md` — розділ «RN-07». `git status --short` — серед іншого `?? DEBUG-NOTES.md`, `?? GAPS.md`, `?? src/__typetests__/`, `?? src/capstone.test.tsx`. `git add -A`, `git commit -m "Add Jest tests, device checks and notes on a debugged local failure"` — у нас `8 files changed`.

    **Самоперевірка:** кожен тест падає, якщо зламати те, що він перевіряє (спробуй: під’єднай кнопку до іншого обробника); компонентний тест знаходить кнопку за назвою, не за `testID`; у `GAPS.md` кожна перевірка має ціль і очікуване спостереження, а невиконана — позначку «not performed»; у `DEBUG-NOTES.md` — перша вирішальна стрічка до ремонту.

    **Якщо щось пішло не так:** `render function has not been called` — у React Native Testing Library 14 `render` треба чекати: `await render(…)`. Jest падає на файлах `tests/*.test.js` з «Your test suite must contain at least one test» — немає `jest.roots` з `src`. `Unable to find an element with role: button, name: …` — назва кнопки в тесті не збігається з текстом кнопки в мові проєкту.

    Еталон кроку — `Завантажити: RN-07 — Тести трьох рівнів, перевірки на пристрої й одна налагоджена поломка` після експорту (без `assets/*.png`, `LICENSE`, `package-lock.json` і `node_modules/` — див. крок RN-01). Команди виконано лише на macOS; у Linux і Windows (Git Bash) їх не запускали.
  en: |
    The project gets real Jest: a unit test of a shared rule with a fixed day, a typed-validation test of stored data and a component test of the row's main action, found by its accessible name. What Jest cannot see becomes a list of device checks in `GAPS.md`, and one real local failure becomes a record in `DEBUG-NOTES.md`.

    | Project | Unit test | Typed validation | Component test | Device checks |
    |---|---|---|---|---|
    | Wishlist | `summarizeItems`: total of wanted wishes with a price, the ones without a price counted apart | a text price is refused | the “acquired” toggle by its name | restart; the swipe and its accessibility action |
    | Planner | `countDueTasks` on a fixed day | the priority `"urgent"` is refused | the “done” toggle by its name | the link to a task; the count after a return |
    | Habit tracker | `streakOf` on a fixed day; `completeHabit` — no repeats, in order | the frequency `"monthly"` is refused | the “Mark today” button | reduce motion; restart |
    | Expense tracker | `summarizeExpenses` in whole kopiykas | `amountMinor` 845.5 is refused | the form's messages | the hryvnia format on the device; restart |

    Below is the wishlist. The computer commands were run on macOS (Node.js 25.2.1, Expo SDK 57, jest-expo 57.0.5, Jest 29.7, React Native Testing Library 14.0.1) on all four projects. There was no emulator, simulator or phone: the device checks stay “not performed”.

    **1. The starting state.** `cd ~/js-course/wishlist-native`, `git status` — clean, `git log --oneline -1` — the swipe commit.

    **2. Jest.** `npx expo install jest-expo jest @types/jest @testing-library/react-native --dev` — for us `› Installing 3 SDK 57.0.0 compatible native modules and 1 other package using npm` and `npm warn ERESOLVE overriding peer dependency` (harmless). Then `npm pkg set scripts.test="node run-tests.js && jest" jest.preset=jest-expo "jest.roots[0]=<rootDir>/src"`: `npm test` runs both the course runner (`tests/`) and Jest; Jest looks for tests only in `src/`, because the `tests/*.test.js` files register with the course runner and are empty for Jest. `tsconfig.json` gets `"types": ["jest"]`, otherwise `Cannot find name 'test'`.

    **3. Unit and typed validation.** `src/capstone.test.tsx`: `summarizeItems` of four wishes — `{ count: 4, wantedTotal: 80, wantedWithoutPrice: 1 }`; stored JSON with the price `"80"` — `parseItemList(…).ok === false` with the error `1.price`. The other half of the typed domain — `src/__typetests__/wish.ts`: `// @ts-expect-error` above a wish with a text price and one without `acquired`; `npx tsc --noEmit` checks these lines, and when the type stops refusing them it says `TS2578: Unused '@ts-expect-error' directive` (we checked).

    **4. The component test.** In the same file, `ItemRow` with state around it (the real `itemsReducer`): `await render(…)`, `userEvent.setup()`, `await user.press(screen.getByRole('button', { name: 'Mark as acquired' }))`, then `screen.getByText('acquired')` and the “Back to wanted” button — `toBeOnTheScreen()`. The test finds the button the way a person with a screen reader finds it: by its name and role.

    **5. What stays with the device.** `GAPS.md`: a table “behaviour × Jest / declared target / other platform” with “verified”, “not performed” or “—”, and the device checks in four parts — claim, action on the target, target, expected observation. Jest works with jest-expo's stand-ins, so it does not see the real keyboard, gestures, screen reader, device storage or the device's `Intl` data.

    **6. One local failure.** Reproduce it, write down the first decisive line, repair it the documented way. Ours: `npm install react-native-gesture-handler@2.30.0`, `npx expo install --check` — `react-native-gesture-handler@2.30.0 - expected version: ~2.32.0`; `npx tsc --noEmit` and `npm test` still pass meanwhile — the dependencies broke, not the code. The repair — `npx expo install --fix`, then `Dependencies are up to date`. Write it into `DEBUG-NOTES.md`; on the target — the first line of the device log that names the module before the repair, and the start after it.

    **7. The check on the computer.** `npx expo install --check` — `Dependencies are up to date`; `npx tsc --noEmit` — not a single line; `npm test` — `Passed: 53 · failed: 0`, then `PASS src/capstone.test.tsx` and `Tests: 3 passed, 3 total`; `npx expo export --platform android` — for us `Android Bundled 2240ms index.ts (944 modules)`.

    **8. On the declared target.** Perform at least one check of `GAPS.md` (ours: restart — mark a wish acquired, close the app completely, open it again) and write down what you saw. We have not seen this.

    **9. Evidence and commit.** In `EVIDENCE.md`, a section “RN-07”. `git status --short` — among others `?? DEBUG-NOTES.md`, `?? GAPS.md`, `?? src/__typetests__/`, `?? src/capstone.test.tsx`. `git add -A`, `git commit -m "Add Jest tests, device checks and notes on a debugged local failure"` — for us `8 files changed`.

    **Self-check:** every test fails when what it checks is broken (try it: wire the button to another handler); the component test finds the button by its name, not by a `testID`; in `GAPS.md` every check has a target and an expected observation, and one not done says “not performed”; `DEBUG-NOTES.md` holds the first decisive line from before the repair.

    **If something goes wrong:** `render function has not been called` — in React Native Testing Library 14 `render` must be awaited: `await render(…)`. Jest fails on the `tests/*.test.js` files with “Your test suite must contain at least one test” — `jest.roots` with `src` is missing. `Unable to find an element with role: button, name: …` — the button's name in the test does not match the button's text in the project's language.

    The step's reference is `Download: RN-07 — Tests at three levels, device checks and one debugged failure` after the export (without `assets/*.png`, `LICENSE`, `package-lock.json` and `node_modules/` — see step RN-01). The commands were run on macOS only; they were not run on Linux or Windows (Git Bash).
purpose:
  uk: "Це крок твого проєкту: юніт-, типізовані й компонентні тести, межу між підмінами Jest і пристроєм та налагодження локальної поломки з цього розділу ти застосовуєш до власного застосунку. Платформа цей крок не перевіряє: доказ — вивід тестів, `GAPS.md`, `DEBUG-NOTES.md`, `EVIDENCE.md` і commit."
  en: "This is a step of your project: you apply this unit's unit, typed and component tests, the line between Jest's stand-ins and the device, and the debugging of a local failure to your own app. The platform does not check this step: the evidence is the test output, `GAPS.md`, `DEBUG-NOTES.md`, `EVIDENCE.md` and the commit."
objectives:
  - uk: "Додати юніт-тест спільного правила з фіксованим днем, тест типізованої валідації збережених даних і компонентний тест головної дії, знайденої за доступною назвою, і запустити їх у Jest."
    en: "Add a unit test of a shared rule with a fixed day, a typed-validation test of stored data and a component test of the main action found by its accessible name, and run them in Jest."
  - uk: "Записати, які перевірки лишаються пристрою, і налагодити одну справжню локальну поломку від першої вирішальної стрічки до документованого ремонту."
    en: "Record which checks stay with the device, and debug one real local failure from its first decisive line to the documented repair."
transfer:
  uk: "Цей крок виконується в редакторі, терміналі й на заявленій нативній цілі: що зробити, очікуваний вивід і список самоперевірки — вище і на сторінці кроку в проєкті."
  en: "This step is done in an editor, a terminal and on the declared native target: what to do, the expected output and the self-check list are above and on the step's page in your project."
