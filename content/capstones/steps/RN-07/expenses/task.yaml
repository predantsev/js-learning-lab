# Expense tracker variant of step RN-07 (a local step: done in the learner's editor, terminal and on the
# declared native target; no platform checks). Computer-side commands checked on macOS (Node.js 25.2.1,
# Expo SDK 57, jest-expo 57.0.5) on the scratch project of this capstone, Jest run for real; nothing was
# run on an emulator, a simulator or a phone.
instructions:
  uk: |
    Тести трьох рівнів у Jest, список перевірок, що лишаються пристрою, і одна налагоджена локальна поломка. Платформа цей крок не перевіряє.

    1. `npx expo install jest-expo jest @types/jest @testing-library/react-native --dev`; `npm pkg set scripts.test="node run-tests.js && jest" jest.preset=jest-expo "jest.roots[0]=<rootDir>/src"`; `"types": ["jest"]` у `tsconfig.json`.
    2. Юніт-тест у `src/capstone.test.tsx`: `summarizeExpenses`: підсумки кожної категорії й загальний — цілі копійки.
    3. Типізована валідація: збережена витрата з `amountMinor` 845.5 — `parseExpenseList(…).ok === false` (tsc дробу не бачить); `@ts-expect-error` для суми-тексту й невідомої категорії (`src/__typetests__/expense.ts`).
    4. Компонентний тест: «%%saveLabel%%» порожньої форми показує «%%labelRequiredMessage%%», «%%invalidMessage%%», «%%badDateMessage%%», «%%requiredMessage%%» і нічого не зберігає.
    5. `GAPS.md`: покриття Jest / заявлена ціль / інша платформа і перевірки на пристрої (твердження, дія, ціль, очікуване спостереження), серед них — формат гривні на пристрої.
    6. `DEBUG-NOTES.md`: одна справжня локальна поломка — відтворення, перша вирішальна стрічка, документований ремонт, підтвердження.
    7. `EVIDENCE.md`, розділ «RN-07»; `git commit -m "Add Jest tests, device checks and notes on a debugged local failure"`.

    **Самоперевірка — підтверди кожен пункт сам:**

    - `npx tsc --noEmit` — жодного рядка; прибери помилку під одним `@ts-expect-error` — `TS2578`, і поверни.
    - `npm test` — курсовий runner 52 тестів і «не пройшли: 0», потім Jest `Tests: 3 passed, 3 total`.
    - Зламай те, що перевіряє компонентний тест (наприклад, під’єднай кнопку до іншого обробника) — Jest показує `✕`; поверни.
    - `npx expo export --platform android` — рядок `Android Bundled …`.
    - На цілі: одна перевірка з `GAPS.md` виконана й записана, решта — «not performed» із причиною.

    **Доказ:** commit, вивід `npm test`, `GAPS.md`, `DEBUG-NOTES.md` і `EVIDENCE.md` — або запис «не виконано» для цілі: що, на якій цілі, чому, що потрібно, щоб повернутися.
  en: |
    Tests at three levels in Jest, the list of checks that stay with the device, and one debugged local failure. The platform does not check this step.

    1. `npx expo install jest-expo jest @types/jest @testing-library/react-native --dev`; `npm pkg set scripts.test="node run-tests.js && jest" jest.preset=jest-expo "jest.roots[0]=<rootDir>/src"`; `"types": ["jest"]` in `tsconfig.json`.
    2. A unit test in `src/capstone.test.tsx`: `summarizeExpenses`: every category total and the overall total — whole kopiykas.
    3. Typed validation: a stored expense with `amountMinor` 845.5 — `parseExpenseList(…).ok === false` (tsc cannot see a fraction); `@ts-expect-error` for a text amount and an unknown category (`src/__typetests__/expense.ts`).
    4. A component test: “%%saveLabel%%” on an empty form shows “%%labelRequiredMessage%%”, “%%invalidMessage%%”, “%%badDateMessage%%”, “%%requiredMessage%%” and saves nothing.
    5. `GAPS.md`: coverage Jest / declared target / other platform and the device checks (claim, action, target, expected observation), among them the hryvnia format on the device.
    6. `DEBUG-NOTES.md`: one real local failure — the reproduction, the first decisive line, the documented repair, the confirmation.
    7. `EVIDENCE.md`, a section “RN-07”; `git commit -m "Add Jest tests, device checks and notes on a debugged local failure"`.

    **Self-check — confirm every item yourself:**

    - `npx tsc --noEmit` — not a single line; remove the error under one `@ts-expect-error` — `TS2578`, and put it back.
    - `npm test` — the course runner 52 tests and “failed: 0”, then Jest `Tests: 3 passed, 3 total`.
    - Break what the component test checks (for example, wire the button to another handler) — Jest shows `✕`; put it back.
    - `npx expo export --platform android` — a line `Android Bundled …`.
    - On the target: one check of `GAPS.md` performed and recorded, the rest “not performed” with a reason.

    **Evidence:** the commit, the `npm test` output, `GAPS.md`, `DEBUG-NOTES.md` and `EVIDENCE.md` — or a “not performed” record for the target: what, on which target, why, what it takes to come back.
