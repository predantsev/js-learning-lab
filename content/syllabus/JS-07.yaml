# Syllabus spine for JS-07. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-07
stage: JS
title: { uk: "Помилки, модулі та збереження даних", en: "Errors, modules and saved data" }
summary:
  uk: "Учень читає stack trace, кидає й перехоплює помилки з доречним типом і cause, серіалізує та перевіряє JSON, зберігає записи в ізольованому сховищі й відновлюється після зіпсованих даних, а також розбиває програму на ES-модулі, читає CommonJS і діагностує збої завантаження модулів."
  en: "The learner reads stack traces, throws and catches errors with a fitting type and cause, serializes and validates JSON, persists records in isolated storage and recovers from corrupted data, and splits a program into ES modules while reading CommonJS and diagnosing module load failures."
competencies: [J-10]
capstoneStep:
  mode: in-platform
  objective:
    uk: "Розбити проєкт на ES-модулі (domain/, ui/), зберігати записи як JSON в ізольованому сховищі та відновлюватися після недійсних збережених даних."
    en: "Split the capstone into ES modules (domain/, ui/), persist records as JSON in isolated storage and recover from invalid stored input."
  variants:
    wishlist:
      uk: "domain/wishes.js експортує validateWish і підсумок бажаного; бажання зберігаються під ключем jsll.wishlist.v1, а збережене бажання з price-рядком «80» чи без name під час завантаження відхиляється з повідомленням, а не показується."
      en: "domain/wishes.js exports validateWish and the wanted-total; wishes are saved under jsll.wishlist.v1, and on load a stored wish whose price is the string '80' or that lacks a name is rejected with a message instead of being shown."
    planner:
      uk: "domain/tasks.js експортує validateTask і лічильник справ до терміну; справи зберігаються під ключем jsll.planner.v1, а збережена справа з dueDate «01.03.2026» замість «YYYY-MM-DD» чи з невідомим priority під час завантаження відхиляється з повідомленням."
      en: "domain/tasks.js exports validateTask and the due-count; tasks are saved under jsll.planner.v1, and on load a stored task with dueDate '01.03.2026' instead of 'YYYY-MM-DD' or an unknown priority is rejected with a message."
    habits:
      uk: "domain/habits.js експортує validateHabit і розрахунок серії; звички зберігаються під ключем jsll.habits.v1, а збережена звичка з невідомою frequency чи з completions-рядком замість масиву дат під час завантаження відхиляється з повідомленням."
      en: "domain/habits.js exports validateHabit and the streak calculation; habits are saved under jsll.habits.v1, and on load a stored habit with an unknown frequency or with completions stored as a string instead of a date array is rejected with a message."
    expenses:
      uk: "domain/expenses.js експортує validateExpense і підсумки за категоріями; витрати зберігаються під ключем jsll.expenses.v1, а збережена витрата з amountMinor 845.5 (не ціле число) чи з category поза списком під час завантаження відхиляється з повідомленням."
      en: "domain/expenses.js exports validateExpense and the category totals; expenses are saved under jsll.expenses.v1, and on load a stored expense with amountMinor 845.5 (not an integer) or a category outside the list is rejected with a message."
# Retrieval plan: js-03-08-recursion-base-case (call stack) ; js-06-10-events-default-behavior (listeners) ; js-02-02-equality-coercion (coercion in parse) ; js-04-08-copying-shallow-deep (JSON copy)
lessons:
  - id: js-07-01-call-stack-and-errors
    title: { uk: "Синхронний стек викликів і що таке помилка", en: "The synchronous call stack and what an error is" }
    kind: instructional
    minutes: 10
    objectives:
      - "Read a stack trace top-down and name the function where the error was thrown and the chain of callers that led there."
      - "Predict which console lines still run after an uncaught error stops the current script, and which later handlers still work."
    subskills:
      - { family: J-10, skill: "Error types/cause and throw", depth: intro }
    misconceptions:
      - "The line where the error appears is always the line that contains the bug."
      - "One uncaught error kills the whole page, so no code can ever run again."
    prerequisites: [js-03-08-recursion-base-case, js-01-05-reading-an-error, js-06-16-capstone-ui]
    glossary: [stack-trace, error-object, uncaught-exception]
    visual: { kind: code-trace, concept: "Three nested calls (render → formatLabel → readPrice) push frames on the call stack; when readPrice reads a property of undefined, the frames unwind one by one and the console prints the same frames as the stack trace, innermost first." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the frame order of the stack trace and which of five console.log lines print when the innermost of three nested functions fails on a record with a missing field." }
      - { kind: run-change, runtime: browser-js, summary: "Run it, follow each stack-trace line to its frame, then pass a valid record from the outer caller and confirm that fixing the caller, not the top frame, removes the error." }
      - { kind: write, runtime: browser-js, summary: "Write a three-step chain (load → parse → format) for one synthetic record and call console.trace() in the innermost step to print the live call stack without any error." }
    retrieval:
      - { concept: "frames pushed and popped during recursion", from: js-03-08-recursion-base-case }
  - id: js-07-02-throw-error-types-cause
    title: { uk: "throw, типи помилок і cause", en: "throw, Error types and cause" }
    kind: instructional
    minutes: 10
    objectives:
      - "Throw an Error, TypeError or RangeError whose type matches the problem and whose message names the bad value."
      - "Wrap a low-level error with new Error(message, { cause }) and read both the outer message and err.cause in the console."
      - "Explain why throwing a plain string loses the stack trace."
    subskills:
      - { family: J-10, skill: "Error types/cause and throw", depth: practice }
    misconceptions:
      - "Throwing a string is just as good as throwing an Error."
      - "Returning null on bad input and throwing are equivalent; the caller will notice either way."
    prerequisites: [js-07-01-call-stack-and-errors, js-02-11-independent-validation]
    glossary: [throw-statement, type-error, range-error, error-cause]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict what the console shows for throw 'bad price' versus throw new RangeError('price must be at least 0, got -5'): name, message and whether a stack trace appears." }
      - { kind: run-change, runtime: browser-js, summary: "Run both, then catch a TypeError from reading a field of undefined and rethrow it as new Error('record unreadable', { cause }) and inspect err.cause." }
      - { kind: write, runtime: browser-js, summary: "Write assertValidPrice(value) that throws TypeError for non-numbers and RangeError for negatives, with messages that include the received value." }
    retrieval:
      - { concept: "returning { ok, errors } instead of stopping the program", from: js-02-11-independent-validation }
  - id: js-07-03-try-catch-finally
    title: { uk: "try/catch/finally і поширення помилок", en: "try/catch/finally and propagation" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace an error propagating up through callers to the nearest enclosing try/catch and predict which lines are skipped."
      - "Use finally for cleanup that must run on success and on failure, and rethrow errors the current function cannot handle."
    subskills:
      - { family: J-10, skill: "try/catch/finally", depth: intro }
      - { family: J-10, skill: "cleanup and propagation", depth: intro }
    misconceptions:
      - "A try/catch around code that registers a listener or a timer also catches errors the callback throws later."
      - "finally runs only when no error happened."
    prerequisites: [js-07-02-throw-error-types-cause, js-06-10-events-default-behavior]
    glossary: [try-catch, finally-block, error-propagation, rethrow]
    visual: { kind: code-trace, concept: "An error thrown three frames deep unwinds frame by frame, skipping the highlighted lines, stops at the nearest catch and then runs finally; a second run shows a click handler's error escaping a try block that had already finished." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the console order for try/catch/finally around a call chain whose middle function throws, and for a try block around addEventListener whose handler throws on click." }
      - { kind: run-change, runtime: browser-js, summary: "Run both, click the button to watch the handler's error escape, then move the try/catch inside the handler and click again." }
      - { kind: write, runtime: browser-js, summary: "Write saveRecord(record) that handles a known RangeError with a message, rethrows anything else, and always clears a 'saving…' flag in finally." }
    retrieval:
      - { concept: "listeners run later, after the code that registered them has finished", from: js-06-10-events-default-behavior }
  - id: js-07-04-json
    title: { uk: "JSON: серіалізація, розбір і їхні межі", en: "JSON: serialize and parse, with limits" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict what JSON.stringify produces for undefined, functions, NaN, a Date and nested objects, and what JSON.parse gives back."
      - "Explain why a cyclic object throws on stringify and why a parsed Date comes back as a string."
      - "Catch the SyntaxError from JSON.parse on malformed text and return a failure result instead of crashing."
    subskills:
      - { family: J-10, skill: "JSON parse/serialize limitations", depth: intro }
    misconceptions:
      - "JSON.parse(JSON.stringify(x)) always gives back the same value, just copied."
      - "JSON is simply a JavaScript object saved in a file, so anything an object can hold survives."
    prerequisites: [js-07-03-try-catch-finally, js-04-08-copying-shallow-deep]
    glossary: [json, serialization, deserialization, cyclic-reference]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the JSON text for a synthetic record with an undefined field, a NaN amount, a Date and a nested tags array, and the type of each field after JSON.parse." }
      - { kind: run-change, runtime: browser-js, summary: "Run the round trip, add record.self = record and read the TypeError, then truncate the JSON text by one character and read the SyntaxError." }
      - { kind: write, runtime: browser-js, summary: "Write toStoredText(records) and fromStoredText(text) that keep dates as 'YYYY-MM-DD' strings and return { ok: false, reason } when JSON.parse throws." }
    retrieval:
      - { concept: "the JSON round-trip copy seen in older code and what it cannot copy", from: js-04-08-copying-shallow-deep }
  - id: js-07-05-persist-reload
    title: { uk: "Зберігаємо й відновлюємо дані в ізольованому сховищі", en: "Persist and reload with isolated storage" }
    kind: instructional
    minutes: 12
    objectives:
      - "Save records as { schemaVersion, records } JSON under a versioned key in the sandbox's isolated storage and reload them after a restart."
      - "Validate stored data on load and keep working with a visible message when it is missing, unparsable, the wrong version or holds invalid records, without overwriting the original."
      - "Explain that the stored data belongs to this page's address in this browser, so the same app opened at another address starts empty (origins in depth in JS-16)."
    subskills:
      - { family: J-10, skill: "JSON parse/serialize limitations", depth: practice }
    misconceptions:
      - "Whatever I saved will come back exactly as I saved it, so there is nothing to check on load."
      - "Storage keeps my objects as they are, not as text."
    prerequisites: [js-07-04-json, js-02-11-independent-validation]
    glossary: [persistence, storage-key, schema-version]
    visual: { kind: sequence, concept: "Page, storage and validator over time: save writes a JSON string under jsll.<capstoneId>.v1; reload reads it, parses, checks schemaVersion and each record, then branches to render, to warn-and-start-from-fixtures while keeping the bad text under a backup key, or to start empty." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict what a reload shows after saving three records, after clearing storage, after the stored text becomes 'not json', and after one stored amount becomes the string '80'." }
      - { kind: run-change, runtime: browser-js, summary: "Run save and reload in the isolated storage, restart the page, then corrupt the stored text and watch the recovery message appear while the original text is kept." }
      - { kind: write, runtime: browser-js, summary: "Write loadRecords(storage) returning { ok: true, records } or { ok: false, reason } for missing, unparsable, wrong-version and invalid-record cases, copying the raw text to a backup key before any reset." }
    retrieval:
      - { concept: "the string '80' versus the number 80 and why == hides the difference", from: js-02-02-equality-coercion }
  - id: js-07-06-esm-import-export
    title: { uk: "ES-модулі: import і export", en: "ES modules: import and export" }
    kind: instructional
    minutes: 12
    objectives:
      - "Split one script into domain and ui modules with named exports and import them with relative specifiers."
      - "Draw the module graph of a small project and predict the order in which its modules evaluate."
    subskills:
      - { family: J-10, skill: "ESM imports/exports/live bindings", depth: intro }
    misconceptions:
      - "Every file can see every other file's variables, as if they were one big script."
      - "A module imported from two files runs its top-level code twice."
    prerequisites: [js-07-05-persist-reload, js-03-07-pure-vs-side-effects]
    glossary: [es-module, named-export, default-export, module-specifier, module-graph]
    visual: { kind: diagram, concept: "The module graph of main.js → ui/render.js → domain/records.js: arrows follow imports, and step highlights show each module evaluating exactly once, dependencies before the modules that import them." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the console order when main.js imports ui.js and domain.js, each logs at top level, and ui.js also imports domain.js." }
      - { kind: run-change, runtime: browser-js, summary: "Run the three-file project, add a fourth file that imports domain.js too, and confirm domain.js still logs once; then remove an export and read the import error." }
      - { kind: write, runtime: browser-js, summary: "Move validateRecord and summarize into domain/records.js as named exports and import them in ui/render.js without changing the page's output." }
    retrieval:
      - { concept: "pure functions that touch neither the DOM nor storage", from: js-03-07-pure-vs-side-effects }
  - id: js-07-07-live-bindings-dynamic-import
    title: { uk: "Живі прив’язки та динамічний import", en: "Live bindings and dynamic import" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict what an importer sees after the exporting module reassigns an exported let, and why the importer itself cannot assign to it."
      - "Load a rarely used module on demand with import(), use it once it arrives with .then (promises in detail in JS-08) and show a fallback when loading fails."
    subskills:
      - { family: J-10, skill: "ESM imports/exports/live bindings", depth: practice }
      - { family: J-10, skill: "dynamic import", depth: intro }
    misconceptions:
      - "An imported name is a copy of the value taken at import time."
      - "import() works like a static import written as a function, so the module is ready on the very next line."
    prerequisites: [js-07-06-esm-import-export, js-02-01-const-let]
    glossary: [live-binding, dynamic-import]
    visual: { kind: diagram, concept: "Exporter and importer share one binding slot: when counter.js reassigns its exported let, main.js's arrow still points at the same slot and reads the new value; import() adds a dashed edge that loads stats.js only when its button is clicked." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict what main.js logs for an imported count before and after calling the exporter's increment(), and what happens when main.js assigns count = 5." }
      - { kind: run-change, runtime: browser-js, summary: "Run it, read the TypeError on assignment, then change the stats import into import('./stats.js') behind a button and watch the module load only on click." }
      - { kind: write, runtime: browser-js, summary: "Load a help module with import() when its button is clicked, render its text, and show a fallback message if the module path is wrong." }
    retrieval:
      - { concept: "a binding as a name that points at a value", from: js-02-01-const-let }
  - id: js-07-08-cjs-and-load-failures
    title: { uk: "Читаємо CommonJS і розбираємо збої завантаження модулів", en: "CommonJS reading and module load failures" }
    kind: instructional
    minutes: 10
    objectives:
      - "Read require/module.exports code and rewrite it as equivalent import/export."
      - "Diagnose a failed module load from its error text: a wrong relative path, a missing extension, a bare specifier or a named export that does not exist."
      - "Describe what a circular import can leave uninitialized when one module reads another's binding too early (diagnosed in depth in JS-13)."
    subskills:
      - { family: J-10, skill: "CommonJS interoperability context", depth: intro }
      - { family: J-10, skill: "module load/circular dependency diagnosis", depth: intro }
    misconceptions:
      - "require and import are interchangeable, so either works in any file."
      - "If one import is broken, only that function fails and the rest of the module graph still runs."
    prerequisites: [js-07-07-live-bindings-dynamic-import]
    glossary: [commonjs, module-resolution, circular-dependency]
    visual: { kind: diagram, concept: "A CommonJS file using require/module.exports beside its ESM translation; then a graph where a.js and b.js import each other and the highlight shows b.js reading a.js's binding before a.js has finished evaluating." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict whether each of four imports resolves in the sandbox: './records.js', './records' with no extension, the bare 'records.js', and a name the module does not export." }
      - { kind: run-change, runtime: browser-js, summary: "Run the project once per broken import, read the exact error, and fix the specifier or the export name until the whole graph loads." }
      - { kind: write, runtime: browser-js, summary: "Rewrite a supplied CommonJS module (require plus module.exports = { validate, summarize }) as an ES module and run it in the sandbox; CommonJS itself is read here, not executed." }
    retrieval:
      - { concept: "reading an error's name, message and line", from: js-01-05-reading-an-error }
  - id: js-07-09-debug-swallowed-errors
    title: { uk: "Налагодження: проковтнуті помилки, return у finally, зіпсований JSON", en: "Debug: swallowed errors, finally-return, bad JSON" }
    kind: instructional
    minutes: 12
    objectives:
      - "Find and repair an empty catch that hides a failure and a return inside finally that replaces a thrown error with a success value."
      - "Repair a loader that crashes on malformed stored JSON so it reports the problem with a cause and keeps the raw text."
    subskills:
      - { family: J-10, skill: "Error types/cause and throw", depth: assess }
      - { family: J-10, skill: "try/catch/finally", depth: assess }
      - { family: J-10, skill: "JSON parse/serialize limitations", depth: assess }
    misconceptions:
      - "An empty catch is harmless because the program keeps running."
      - "A return in finally is just a tidy way to end the function."
    prerequisites: [js-07-08-cjs-and-load-failures, js-07-05-persist-reload]
    glossary: [swallowed-error]
    visual: { kind: code-trace, concept: "The failing run replayed: an error object travels into an empty catch and disappears, while a second trace shows finally's return discarding the in-flight error so the caller receives a success value." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Before running, mark which of three seeded functions hides an error, which returns a value despite a throw, and which crashes on a truncated stored JSON string." }
      - { kind: run-change, runtime: browser-js, summary: "Run the seeded program and match each console line and each missing message to your prediction." }
      - { kind: debug, runtime: browser-js, summary: "Repair all three defects (empty catch, return in finally, unguarded JSON.parse) so failures surface with a cause and valid stored data still loads." }
    retrieval:
      - { concept: "no error thrown does not mean the result is correct", from: js-02-10-debug-tdz-and-defaults }
  - id: js-07-10-independent-modules-recovery
    title: { uk: "Самостійно: розбити на модулі й відновити недійсні збережені дані", en: "Independent: split modules and recover invalid stored data" }
    kind: assessment
    minutes: 25
    objectives:
      - "Split a supplied single-file app into domain, storage and ui ES modules without hints, load one module on demand, and recover from four kinds of invalid stored data."
      - "Explain in two sentences the boundary between ES modules and CommonJS: where each runs and how an imported value is bound."
    subskills:
      - { family: J-10, skill: "ESM imports/exports/live bindings", depth: assess }
      - { family: J-10, skill: "dynamic import", depth: assess }
      - { family: J-10, skill: "CommonJS interoperability context", depth: assess }
    misconceptions: []
    prerequisites: [js-07-09-debug-swallowed-errors]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: split a one-file synthetic library-loans app into domain/, storage/ and ui/ modules, import() its statistics module on demand, and make loading survive missing, unparsable, wrong-version and invalid-record fixtures; hidden tests check behavior and imports." }
      - { kind: write, runtime: browser-js, summary: "Explain-level items: rewrite a five-line CommonJS module as ESM and state one way a value taken from require differs from a live ESM binding." }
    retrieval:
      - { concept: "rendering a list from data in one render function", from: js-06-13-render-list-from-data }
  - id: js-07-11-capstone-modules-persistence
    title: { uk: "Проєкт: модулі та збереження", en: "Capstone: modules + persistence" }
    kind: capstone-step
    minutes: 25
    objectives:
      - "Split the capstone into domain/ and ui/ ES modules, persist records under jsll.<capstoneId>.v1 and recover visibly from invalid stored input without losing it."
    subskills:
      - { family: J-10, skill: "ESM imports/exports/live bindings", depth: practice }
      - { family: J-10, skill: "JSON parse/serialize limitations", depth: practice }
    misconceptions: []
    prerequisites: [js-07-10-independent-modules-recovery, js-06-16-capstone-ui]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: browser-js, summary: "In the capstone workspace, move the pure functions into domain/, rendering and events into ui/, save { schemaVersion: 1, records } on every change and validate on load with a visible recovery message." }
      - { kind: run-change, runtime: browser-js, summary: "Replace the stored value with invalid JSON and then with one invalid record, reload, and confirm the app warns, keeps the bad text under a backup key and starts from the fixtures." }
    retrieval:
      - { concept: "the capstone's render and event wiring", from: js-06-16-capstone-ui }
