# Syllabus spine for JS-04. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-04
stage: JS
title: { uk: "Масиви, об’єкти, цикли й посилання", en: "Arrays, objects, loops and references" }
summary:
  uk: "Учень зберігає записи в масивах і об’єктах, обходить їх циклами for, while, for-of і for-in без помилок «на одиницю» та нескінченних циклів, передбачає, коли два імені вказують на один об’єкт, і додає, змінює та видаляє записи через копії, деструктуризацію та spread замість спільних мутацій."
  en: "The learner stores records in arrays and objects, loops over them with for, while, for-of and for-in without off-by-one errors or runaway loops, predicts when two names share one object, and adds, updates and removes records with copies, destructuring and spread instead of shared mutation."
competencies: [J-03, J-05]
capstoneStep:
  mode: in-platform
  objective:
    uk: "Додавати, змінювати й видаляти записи проєкту у списку, не змінюючи спільних об’єктів і не втрачаючи інших полів."
    en: "Add, update and remove capstone records in a list without mutating shared objects or losing unrelated fields."
  variants:
    wishlist:
      uk: "`addItem`, `updateItem(items, id, changes)` і `removeItem` повертають нові списки: позначка acquired чи нова price зберігають name і category, а початковий список фікстур лишається незмінним."
      en: "`addItem`, `updateItem(items, id, changes)` and `removeItem` return new lists: marking an item acquired or changing its price keeps its name and category, and the original fixture list stays unchanged."
    planner:
      uk: "`addTask`, `updateTask(tasks, id, changes)` і `removeTask` повертають нові списки: перемикання done чи зміна priority зберігають title і dueDate, а початковий список фікстур лишається незмінним."
      en: "`addTask`, `updateTask(tasks, id, changes)` and `removeTask` return new lists: toggling done or changing priority keeps the title and dueDate, and the original fixture list stays unchanged."
    habits:
      uk: "`addHabit`, `updateHabit(habits, id, changes)` і `removeHabit` повертають нові списки; позначка виконання на сьогодні створює новий масив completions без дубля дати замість push у спільний масив."
      en: "`addHabit`, `updateHabit(habits, id, changes)` and `removeHabit` return new lists; marking today as completed creates a new completions array without a duplicate date instead of pushing into the shared one."
    expenses:
      uk: "`addExpense`, `updateExpense(expenses, id, changes)` і `removeExpense` повертають нові списки: зміна amountMinor чи category зберігає label і date, а початковий список фікстур лишається незмінним."
      en: "`addExpense`, `updateExpense(expenses, id, changes)` and `removeExpense` return new lists: changing amountMinor or category keeps the label and date, and the original fixture list stays unchanged."
# Retrieval plan: js-03-05-closures (closure) ; js-03-09-debug-captured-bindings (let per iteration) ; js-02-01-const-let (const vs mutation) ; js-01-04-booleans-null-undefined (undefined)
lessons:
  - id: js-04-01-arrays-basics
    title: { uk: "Масиви: впорядковані списки значень", en: "Arrays: ordered lists of values" }
    kind: instructional
    minutes: 10
    objectives:
      - "Read and write array elements by index and predict length after push and pop."
      - "Predict what reading past the end of an array returns, and what assigning far past the end does to length (a sparse array)."
      - "Handle an empty array explicitly when asking for its first or last element."
    subskills:
      - { family: J-05, skill: "sparse/empty cases", depth: intro }
    misconceptions:
      - "The first element is at index 1 and the last one is at index length."
      - "Reading an index that does not exist throws an error."
    prerequisites: [js-02-01-const-let, js-03-01-functions-and-return]
    glossary: [array, array-index, sparse-array, array-method]
    visual: { kind: memory-graph, concept: "A prices binding points at one array object with numbered slots; push and pop grow and shrink the slots and update length, and writing prices[5] on a three-element array leaves visible empty holes between the slots." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict prices[0], prices[prices.length - 1], prices[10] and length after push and pop on a synthetic price list, and the same reads on an empty list." }
      - { kind: run-change, runtime: browser-js, summary: "Run the snippets, then assign prices[5] = 10 on a three-element array and inspect the holes and the new length." }
      - { kind: write, runtime: browser-js, summary: "Write firstOrNull(list) and lastOrNull(list) that return null for an empty array and the element otherwise." }
    retrieval:
      - { concept: "undefined for a value that was never set", from: js-01-04-booleans-null-undefined }
  - id: js-04-02-for-while
    title: { uk: "Повторюємо: for, while, do-while", en: "Repeating: for, while, do-while" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace a for loop as initialize → check → body → update and fill its iteration table for zero, one and many elements."
      - "Choose between for, while and do-while and explain why do-while runs its body at least once."
      - "Explain how a recursive countdown becomes a loop (base case → exit condition, recursive call → step) and compare the two traces."
    subskills:
      - { family: J-03, skill: "for/while/do-while", depth: practice }
    misconceptions:
      - "A loop body always runs at least once."
      - "A while loop checks its condition only once, at the start."
    prerequisites: [js-04-01-arrays-basics, js-02-05-if-else-switch]
    glossary: [loop, iteration, for-loop, while-loop, do-while]
    visual: { kind: code-trace, concept: "An iteration table fills row by row as a for loop sums a synthetic price list: counter, condition result, body output and running total, shown for lists of length 0, 1 and 3 so the zero-iteration run is visible; a second trace compares a recursive countdown with its while-loop rewrite, showing three stacked call frames against one." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the iteration table (counter, condition, output) of a for loop summing prices for lists of length 0, 1 and 3." }
      - { kind: run-change, runtime: browser-js, summary: "Run the same total written with for, while and do-while, then switch to an empty list and compare the three results (do-while gives NaN)." }
      - { kind: write, runtime: browser-js, summary: "Write countPending(records) with a for loop that counts synthetic records whose done field is false." }
    retrieval:
      - { concept: "a fresh let binding per iteration", from: js-03-09-debug-captured-bindings }
      - { concept: "repeating work with recursion and a base case", from: js-03-08-recursion-base-case }
  - id: js-04-03-termination-off-by-one
    title: { uk: "Вчасно зупинитися: завершення циклу й помилка «на одиницю»", en: "Stopping correctly: termination and off-by-one" }
    kind: instructional
    minutes: 10
    objectives:
      - "Find and fix an off-by-one bound (i <= length, or starting at 1) by checking the first and last iteration."
      - "Explain why a loop whose update never moves toward its exit condition never stops, and stop such a run with the platform's stop control."
    subskills:
      - { family: J-03, skill: "termination and off-by-one", depth: intro }
    misconceptions:
      - "If a loop runs without an error, it visited exactly every element."
      - "An infinite loop is always obvious because the page shows an error."
    prerequisites: [js-04-02-for-while, js-02-02-equality-coercion]
    glossary: [termination, infinite-loop, off-by-one]
    visual: { kind: code-trace, concept: "The loop counter and condition are drawn against the array's index range each step: an i <= length bound visibly reads one slot past the end (undefined), and a loop with no update climbs a step counter until the runner's stop control interrupts it." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the last index visited and the extra undefined read of for (let i = 0; i <= items.length; i++) over three synthetic items." }
      - { kind: run-change, runtime: browser-js, summary: "Run a while loop whose counter is never incremented, interrupt it with the stop control, fix the update and run again." }
      - { kind: write, runtime: browser-js, summary: "Write firstN(list, n) with a loop that returns the first n records and stops at the end of the list when n is larger than its length." }
    retrieval:
      - { concept: "strict comparison between a number and a string", from: js-02-02-equality-coercion }
  - id: js-04-04-break-continue-nested
    title: { uk: "break, continue і вкладені цикли", en: "break, continue and nested loops" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict which loop break and continue affect inside a nested loop and inside a switch within a loop."
      - "Write a nested loop that stops at the first match, exits both loops when needed and handles an empty inner list."
    subskills:
      - { family: J-03, skill: "break/continue", depth: intro }
      - { family: J-03, skill: "nested/empty loops", depth: intro }
    misconceptions:
      - "break inside an inner loop exits all the loops around it."
      - "break inside a switch that sits in a loop exits the loop."
    prerequisites: [js-04-03-termination-off-by-one, js-02-05-if-else-switch]
    glossary: [break, continue, nested-loop, labeled-statement]
    visual: { kind: code-trace, concept: "Two counters in the iteration table for nested loops over categories and records: continue jumps to the next inner step, break leaves only the inner loop and a labeled break leaves both, each jump drawn as an arrow to the line where execution resumes." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the output of nested loops over categories and their records with continue on an empty name and break on the first match, including a category with no records." }
      - { kind: run-change, runtime: browser-js, summary: "Run the loops, move the break to the outer loop, then add a label so one break exits both loops." }
      - { kind: write, runtime: browser-js, summary: "Write findFirstSharedCategory(list) with nested loops that returns the first two records sharing a category, stops at once, and returns null for an empty list." }
    retrieval:
      - { concept: "break inside a switch", from: js-02-05-if-else-switch }
  - id: js-04-05-objects-properties
    title: { uk: "Об’єкти: властивості з назвами", en: "Objects: named properties" }
    kind: instructional
    minutes: 12
    objectives:
      - "Read, add, change and delete properties with dot and bracket notation, including a key held in a variable."
      - "Tell a missing property from a property whose value is undefined with in and Object.hasOwn, and explain which one checks only the object's own properties."
    subskills:
      - { family: J-05, skill: "property access and ownership", depth: intro }
    misconceptions:
      - "record.field and record[field] mean the same thing."
      - "If record.category is undefined, the record has no category property."
    prerequisites: [js-04-01-arrays-basics, js-02-04-nullish-optional-chaining, js-02-09-rare-operators-special-values]
    glossary: [object, property, dot-notation, bracket-notation, own-property]
    visual: { kind: memory-graph, concept: "A record binding points to an object box listing its own properties; dot and bracket reads highlight the matching slot, a missing key reads undefined, and Object.hasOwn checks only the box's own slots while in also follows the link to the shared prototype drawn above it." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict record.price, record['price'], record[field] with field = 'price', record.field, 'toString' in record and Object.hasOwn(record, 'toString')." }
      - { kind: run-change, runtime: browser-js, summary: "Run the reads, add and delete a property, then set one property to undefined and compare in and Object.hasOwn before and after." }
      - { kind: write, runtime: browser-js, summary: "Write getField(record, field, fallback) that returns the fallback only when the record has no own property of that name." }
    retrieval:
      - { concept: "?. on a possibly missing object", from: js-02-04-nullish-optional-chaining }
  - id: js-04-06-for-of-vs-for-in
    title: { uk: "for-of дає значення, for-in — ключі", en: "for-of values vs for-in keys" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict that for-of yields an array's values while for-in yields string keys, including inherited enumerable keys."
      - "Iterate an object's own fields safely with Object.keys or Object.entries instead of for-in."
    subskills:
      - { family: J-03, skill: "for-of values vs for-in enumerable keys/ownership pitfalls", depth: intro }
    misconceptions:
      - "for-in over an array gives its elements."
      - "for-in visits only the properties I wrote on the object myself."
    prerequisites: [js-04-05-objects-properties, js-04-02-for-while]
    glossary: [for-of, for-in, enumerable-property, inherited-property]
    visual: { kind: code-trace, concept: "Side-by-side traces of for-of and for-in over the same array and over a record created from a defaults object: the loop-variable column shows values versus string keys, and an inherited key appears marked with an arrow to the object it came from." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the logs of for-of and for-in over ['a', 'b'] and of for-in over a record that inherits a status key from a prepared defaults object." }
      - { kind: run-change, runtime: browser-js, summary: "Run the loops, then switch to Object.keys and Object.entries and confirm that the inherited key disappears." }
      - { kind: write, runtime: browser-js, summary: "Write printFields(record) that logs each own field name and value with for-of over Object.entries." }
    retrieval:
      - { concept: "what the in operator answers", from: js-02-09-rare-operators-special-values }
  - id: js-04-07-reference-identity
    title: { uk: "Дві змінні, один об’єкт: тотожність посилань", en: "Two names, one object: reference identity" }
    kind: instructional
    minutes: 15
    objectives:
      - "Predict whether a change made through one name is visible through another, for objects and for primitives."
      - "Explain why { id: 'w-01' } === { id: 'w-01' } is false while a === b is true after const b = a."
      - "Trace an object passed into a function that mutates it and name every binding that sees the change."
    subskills:
      - { family: J-05, skill: "reference identity/mutation", depth: intro }
    misconceptions:
      - "const b = a makes a copy of the object."
      - "Two objects with the same properties are equal with ===."
      - "A function receives its own copy of an object passed to it."
    prerequisites: [js-04-05-objects-properties, js-02-01-const-let, js-03-05-closures]
    glossary: [primitive, reference, reference-identity, mutation, aliasing]
    visual: { kind: memory-graph, concept: "Bindings a and b both point at one heap object: a mutation through b changes the shared object and both arrows still point at it, reassigning b moves only b's arrow, a number binding holds its own copy, and === lights up only when two arrows end at the same box." }
    difficultConcept: reference-identity
    analogy: "An object is a house; a binding holding it is a sticky note with the house's address, so const b = a writes the same address on a second note, painting the house through either note changes the one house both notes lead to, and === asks “same address?”, not “similar-looking house?” (limit: primitives such as numbers and strings are not houses — the value itself is written on the note and copied with it, so changing one note never affects another; and real houses do not disappear when the last note is thrown away, while unreachable objects do)."
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the logs after const b = a; b.price = 0 when a is a record and when a is a number, and whether a === b and two separately written { id: 'w-01' } objects compare equal with ===." }
      - { kind: run-change, runtime: browser-js, summary: "Run the aliasing example, replace alias.price = 0 with alias = { id: 'w-01', price: 0 } and observe that only alias now leads elsewhere (the memory graph shows the moved arrow)." }
      - { kind: write, runtime: browser-js, summary: "Write isSameRecord(a, b) by identity and hasSameId(a, b) by id, and test both on a record, its alias and a lookalike object with the same fields." }
    retrieval:
      - { concept: "const fixes the name, not the value", from: js-02-01-const-let }
      - { concept: "a closure keeps a link to the binding, not a copy", from: js-03-05-closures }
  - id: js-04-08-copying-shallow-deep
    title: { uk: "Копіювання: поверхневе й глибоке", en: "Copying: shallow vs deep" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict which changes a spread copy shares with the original when the record holds a nested array or object."
      - "Choose between a spread copy, structuredClone and the JSON round-trip seen in older code, and name what each one cannot copy."
    subskills:
      - { family: J-05, skill: "shallow vs deep copying", depth: intro }
      - { family: J-05, skill: "destructuring/spread", depth: intro }
    misconceptions:
      - "{ ...record } copies everything, including nested arrays."
      - "A deep copy is always the safe default."
    prerequisites: [js-04-07-reference-identity]
    glossary: [shallow-copy, deep-copy, spread-syntax, structured-clone]
    visual: { kind: memory-graph, concept: "Spreading a habit-like record creates a new outer box whose completions slot still points at the same array, so a push through the copy shows up in the original; structuredClone draws a second, separate array, and the JSON round-trip drops a function-valued field." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict, after copy = { ...record } and copy.tags.push('new'), whether record.tags changed, and the same after structuredClone(record)." }
      - { kind: run-change, runtime: browser-js, summary: "Run the shallow and deep copies of a task with tags, then also copy the nested array ({ ...record, tags: [...record.tags] }) and compare the original and the === results (the memory graph shows the shared and separate arrays)." }
      - { kind: write, runtime: browser-js, summary: "Write withTag(record, tag) that returns a copy whose tags array has one more tag and leaves the original record and its array untouched." }
    retrieval:
      - { concept: "returning a new value instead of changing the input", from: js-03-07-pure-vs-side-effects }
  - id: js-04-09-destructuring-spread
    title: { uk: "Деструктуризація і spread", en: "Destructuring and spread" }
    kind: instructional
    minutes: 10
    objectives:
      - "Destructure fields from a record and items from an array, with defaults and renaming."
      - "Use rest patterns and spread to build a record without one field and to merge changes into a copy, predicting which value wins on overlapping keys."
    subskills:
      - { family: J-05, skill: "destructuring/spread", depth: practice }
    misconceptions:
      - "Destructuring removes the properties from the original object."
      - "A destructuring default is used when the value is null."
    prerequisites: [js-04-08-copying-shallow-deep, js-03-02-parameters-default-rest]
    glossary: [destructuring, rest-pattern, property-shorthand]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the bindings created by const { name, price = 0, ...rest } = record for records whose price is 0, null and missing." }
      - { kind: run-change, runtime: browser-js, summary: "Run, rename a destructured field, then build { ...record, ...changes } and swap the order to see which value wins on a shared key." }
      - { kind: write, runtime: browser-js, summary: "Write toLabel({ title, priority = 'normal' }) that destructures its task parameter, and withoutId(record) that returns the record without its id using a rest pattern." }
    retrieval:
      - { concept: "rest parameters and parameter defaults", from: js-03-02-parameters-default-rest }
  - id: js-04-10-immutable-updates
    title: { uk: "Оновлюємо без мутацій", en: "Updating without mutating" }
    kind: instructional
    minutes: 12
    objectives:
      - "Implement add, update-by-id and remove-by-id that return new arrays and objects and leave the input list and its records unchanged."
      - "Verify with === which records are new and which are reused after an update, and explain why reusing untouched records is correct."
    subskills:
      - { family: J-05, skill: "reference identity/mutation", depth: practice }
      - { family: J-05, skill: "shallow vs deep copying", depth: practice }
    misconceptions:
      - "Updating one record requires deep-copying the whole list."
      - "If a function returns the list, it cannot have mutated it."
    prerequisites: [js-04-09-destructuring-spread, js-03-07-pure-vs-side-effects]
    glossary: [immutable-update, immutability, crud]
    visual: { kind: memory-graph, concept: "Before and after setPrice(list, 'w-02', 50): the new array box reuses arrows to the untouched records and points to one new record box, while the original array and the old record stay exactly as they were; a mutating variant then returns a new array too, yet its in-place change shows up in every list holding the record." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which === checks between the old and new lists and records are true after an immutable price update (setPrice), so that the generic updateRecord of the exercise is a transfer rather than a copy." }
      - { kind: run-change, runtime: browser-js, summary: "Run setPrice, then replace the spread update with a direct assignment to the found record and watch the original list change too." }
      - { kind: write, runtime: browser-js, summary: "Write addRecord(list, record), updateRecord(list, id, changes) and removeRecord(list, id) with loops and spread so that each returns a new array." }
    retrieval:
      - { concept: "an arrow that returns an object literal", from: js-03-03-arrow-functions }
  - id: js-04-11-debug-loops-mutation
    title: { uk: "Налагодження: вихід із циклу, успадковані ключі й спільна мутація", en: "Debug: loop exits, inherited keys and shared mutation" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose and repair seeded defects: an off-by-one bound, a break that leaves the wrong loop, a nested loop that misbehaves on an empty inner list, a for-in that picks up an inherited key, and an update that mutates a shared record."
      - "Justify each repair with an iteration table or a reference diagram."
    subskills:
      - { family: J-03, skill: "for-of values vs for-in enumerable keys/ownership pitfalls", depth: assess }
      - { family: J-03, skill: "break/continue", depth: assess }
      - { family: J-03, skill: "nested/empty loops", depth: assess }
      - { family: J-03, skill: "termination and off-by-one", depth: assess }
      - { family: J-05, skill: "reference identity/mutation", depth: assess }
    misconceptions:
      - "If the output looks right for my test list, the loop is correct for every list."
    prerequisites: [js-04-10-immutable-updates, js-04-06-for-of-vs-for-in, js-04-04-break-continue-nested]
    glossary: []
    visual: { kind: memory-graph, concept: "The failing run replayed: the reference graph shows the one habit that the old and new lists both point at when the edit leaks, then the repaired picture for the same call; the iteration table of the off-by-one loop on an empty list sits in the explanation right after it." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Before running, mark which calls of the five seeded habit-report functions return a wrong result or crash on the empty, one-element and nested fixture lists." }
      - { kind: run-change, runtime: browser-js, summary: "Run the seeded program on the three fixture lists and match each output line to your prediction." }
      - { kind: debug, runtime: browser-js, summary: "Repair all five defects (<= bound in findHabit, inner break in firstDoneOn meant to exit both loops, lastDays reusing a stale value on an empty inner list, for-in in fieldNames picking up an inherited key, updateHabit mutating the shared record) without changing the intended output." }
    retrieval:
      - { concept: "callbacks created in a loop and the binding they capture", from: js-03-09-debug-captured-bindings }
  - id: js-04-12-independent-records
    title: { uk: "Самостійно: CRUD записів без втрати інших полів", en: "Independent: record CRUD that preserves unrelated fields" }
    kind: assessment
    minutes: 25
    objectives:
      - "Implement, without hints, record CRUD functions that preserve unrelated fields, apply only own known fields of a change and never mutate their inputs, including on empty and sparse lists."
      - "Explain in one sentence why a spread copy is enough for a flat record and what must change for a nested field."
    subskills:
      - { family: J-03, skill: "for/while/do-while", depth: assess }
      - { family: J-05, skill: "property access and ownership", depth: assess }
      - { family: J-05, skill: "destructuring/spread", depth: assess }
      - { family: J-05, skill: "shallow vs deep copying", depth: assess }
      - { family: J-05, skill: "sparse/empty cases", depth: assess }
    misconceptions: []
    prerequisites: [js-04-11-debug-loops-mutation]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: createRecord, findIndexById, updateRecord(list, id, changes) and removeRecord with loops, destructuring and spread; hidden fixtures include an empty list, a sparse array, an unknown id, a change carrying an inherited or unknown key, a record with a nested tags array, and checks that every input is unchanged." }
      - { kind: write, runtime: browser-js, summary: "Explain-level item (choice): pick the one-sentence explanation of why { ...record, price } is enough for a flat record and what updateRecord must do differently for the nested tags array." }
