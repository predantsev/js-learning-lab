# Syllabus spine for NO-05. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: NO-05
stage: NO
title: { uk: "Надійне серверне сховище", en: "Durable server storage" }
summary:
  uk: "Учень пише контракт схеми для збережених даних проєкту, ініціалізує сховище й заповнює його seed під час запуску, випускає протестовану міграцію з версіонуванням, робить backup і перевіряє його відновленням, виявляє пошкоджене сховище й відновлюється, а також серіалізує конкурентні записи — обравши JSON-файл або SQLite."
  en: "The learner writes a schema contract for the capstone’s stored data, initializes and seeds storage on start, ships a tested, versioned migration, takes backups and verifies them by restoring, detects corrupted storage and recovers from it, and serializes concurrent writes — on a JSON file or SQLite, by choice."
competencies: [B-05]
capstoneStep:
  mode: local
  objective:
    uk: "Дати серверу проєкту надійне сховище (файл або SQLite) з контрактом схеми, ініціалізацією із seed, протестованою міграцією, перевіреним backup/restore і відновленням після пошкодження."
    en: "Give the capstone server durable storage (file or SQLite) with a schema contract, seeded initialization, a tested migration, backup/restore verification and corruption recovery."
  variants:
    wishlist:
      uk: "Міграція переводить сховище бажань зі schemaVersion 1 на 2, де acquired обов’язкове (відсутнє значення стає false), а порожня category — null; seed додає шість бажань-фікстур лише в порожнє сховище, а відновлений backup дає ту саму кількість бажань і загальну ціну ще не отриманих."
      en: "A migration moves the wish store from schemaVersion 1 to 2, where acquired is required (a missing value becomes false) and an empty category becomes null; seeding adds the six fixture wishes only to an empty store, and a restored backup gives the same item count and wanted total."
    planner:
      uk: "Міграція переводить сховище справ на версію 2, де priority обов’язкове (відсутнє стає normal), а dueDate — коректна YYYY-MM-DD або null; seed додає справи лише в порожнє сховище, а відновлений backup дає ту саму кількість невиконаних справ із терміном на фіксований день."
      en: "A migration moves the task store to version 2, where priority is required (a missing value becomes normal) and dueDate is a valid YYYY-MM-DD or null; seeding adds tasks only to an empty store, and a restored backup gives the same pending-due count for a fixed day."
    habits:
      uk: "Міграція переводить сховище звичок на версію 2, де completions зберігаються без повторів і за зростанням (у SQLite — окремою таблицею), а frequency за замовчуванням daily; seed додає звички лише в порожнє сховище, а відновлений backup дає ті самі кількості виконань і серії на фіксований день."
      en: "A migration moves the habit store to version 2, where completions are stored unique and ascending (in SQLite as a separate table) and frequency defaults to daily; seeding adds habits only to an empty store, and a restored backup gives the same completion counts and streaks for a fixed day."
    expenses:
      uk: "Міграція переводить сховище витрат на версію 2, де кожен amountMinor — додатне ціле, а кожна category — зі списку проєкту (некоректні записи відкладаються в карантин, а не видаляються); seed додає витрати лише в порожнє сховище, а відновлений backup дає ті самі суми за категоріями."
      en: "A migration moves the expense store to version 2, where every amountMinor is a positive integer and every category comes from the project’s list (invalid rows are quarantined, not dropped); seeding adds expenses only to an empty store, and a restored backup gives the same per-category totals."
# Retrieval plan: no-09-07-migrations-seed (migrations) ; no-02-05-atomic-recoverable-updates (atomic) ; rn-05-03-schema-migration (native migration) ; js-07-04-json (JSON limits)
lessons:
  - id: no-05-01-schema-contract
    title: { uk: "Контракт схеми", en: "The schema contract" }
    kind: instructional
    minutes: 10
    objectives:
      - "Write a schema contract for stored records — fields, types, constraints, defaults and schemaVersion — that the repository, the API validator and the tests all import."
      - "Validate every record on load against the contract and predict which stored values it rejects."
    subskills:
      - { family: B-05, skill: "schema contract", depth: intro }
    misconceptions:
      - "The TypeScript interface is the schema contract."
      - "Data already on disk was valid when it was written, so it never needs checking on load."
    prerequisites: [no-09-10-independent-schema-design, no-04-02-schema-validation]
    glossary: [schema-contract]
    visual: { kind: diagram, concept: "One contract module in the center with arrows to the repository’s load and save, the API validator and the tests; a stored record with a string amount is checked against each rule in turn and stopped at load." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict which of five stored records the contract accepts on load: a missing optional field, an extra field, a number stored as a string, schemaVersion 0 and a valid record." }
      - { kind: run-change, runtime: isolated-node, summary: "Load the synthetic store through the contract in the Node child, then add a default for the optional field and a rule for the extra one and rerun." }
      - { kind: write, runtime: isolated-node, summary: "Write storeContract with the version, field rules and defaults for a synthetic notes store, and parseStore(json) that applies it on load." }
    retrieval:
      - { concept: "what JSON cannot represent", from: js-07-04-json }
  - id: no-05-02-initialization-seed
    title: { uk: "Ініціалізація та seed під час запуску", en: "Initialization and seed on start" }
    kind: instructional
    minutes: 10
    objectives:
      - "Implement startup initialization that creates missing storage, brings it to the current schema and seeds fixtures only when the store is empty."
      - "Predict the store after starting the server on an empty, a seeded and an edited store, and show that running initialization twice changes nothing."
    subskills:
      - { family: B-05, skill: "initialization", depth: practice }
    misconceptions:
      - "Seeding on every start is fine, because the fixtures are always the same."
      - "The server can accept requests while initialization is still running."
    prerequisites: [no-05-01-schema-contract, no-09-07-migrations-seed]
    glossary: [startup-initialization]
    visual: { kind: sequence, concept: "Server start, storage and the first request over time: init checks for the store, creates it, migrates it to the current version and seeds only an empty store, and only then does the server listen; a request sent earlier finds nobody listening." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the record count after three starts on an empty store, after deleting a seeded record and restarting, and with initialization run twice." }
      - { kind: run-change, runtime: isolated-node, summary: "Start the server three times in the Node child against a scratch store, delete a seeded record and restart, then move listen() before init and send an early request." }
      - { kind: write, runtime: isolated-node, summary: "Write initStore(path, fixtures) that is safe to run repeatedly and startServer() that awaits it before calling listen()." }
    retrieval:
      - { concept: "development rechecks run setup twice", from: re-03-05-strict-mode-rechecks }
  - id: no-05-03-migration-versioning
    title: { uk: "Міграції й версіонування на практиці", en: "Migration and versioning in practice" }
    kind: instructional
    minutes: 12
    objectives:
      - "Write a migration from schemaVersion 1 to 2 that transforms existing records, runs exactly once and records the new version only after it has succeeded."
      - "Test the migration on a copy of realistically shaped synthetic data — counts, invariants and a rerun — before it touches the live store."
    subskills:
      - { family: B-05, skill: "migration/versioning", depth: practice }
    misconceptions:
      - "If the migration works on the fixtures, it will work on the stored data."
      - "A failed migration can simply be run again."
    prerequisites: [no-05-02-initialization-seed]
    glossary: [migration-dry-run]
    visual: { kind: diagram, concept: "The live v1 store is copied, the copy is migrated and checked (count, invariants, rerun); only when the checks pass does one rename make v2 the live store, data and version together; a failing check discards the copy and leaves the live store on v1. (A git-graph was planned, but its player shows git commands for every step, which would mislead here.)" }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the records and version after migrating a v1 store, a v2 store and a store where one record cannot be transformed." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the migration in the Node child on a scratch copy, compare counts and invariants, then rerun it and confirm nothing changes." }
      - { kind: write, runtime: isolated-node, summary: "Write migrate1to2(store) and a test that runs it on a copy of the synthetic notes store and asserts the count, the invariants and an idempotent rerun." }
    retrieval:
      - { concept: "numbered migrations recorded by a version", from: no-09-07-migrations-seed }
  - id: no-05-04-backup-restore-verification
    title: { uk: "Backup і restore, з перевіркою", en: "Backup and restore, verified" }
    kind: instructional
    minutes: 12
    objectives:
      - "Take a consistent backup while the server runs: a copy of the last complete file, or a SQLite snapshot with VACUUM INTO (or the backup API where the Node version provides it)."
      - "Verify a backup by restoring it into a scratch location and comparing counts, a checksum and domain invariants with the source."
    subskills:
      - { family: B-05, skill: "backup/restore verification", depth: intro }
    misconceptions:
      - "A backup that exists is a backup that works."
      - "Copying the database file while the server is writing gives a valid backup."
    prerequisites: [no-05-03-migration-versioning]
    glossary: [backup-verification, consistent-snapshot]
    visual: { kind: sequence, concept: "Server, store, backup file and a scratch restore over time: in the naive copy a write lands mid-copy and the restore yields broken data, while the consistent snapshot restores into a store whose counts and checksum match the source." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict whether a plain file copy taken during a write and a VACUUM INTO snapshot each restore into a valid store." }
      - { kind: run-change, runtime: isolated-node, summary: "Take both backups in the Node child while a writer loop runs, restore each into scratch and compare counts and checksums." }
      - { kind: write, runtime: isolated-node, summary: "Write backupStore() and verifyBackup(backupPath) that restores into a scratch path and returns a report of counts, checksum and invariant checks." }
    retrieval:
      - { concept: "all-or-nothing replacement of a file", from: no-02-05-atomic-recoverable-updates }
  - id: no-05-05-corruption-recovery
    title: { uk: "Пошкодження і відновлення", en: "Corruption and recovery" }
    kind: instructional
    minutes: 12
    objectives:
      - "Detect corrupted storage on start (unparsable JSON, contract violations, a failing PRAGMA integrity_check) instead of crashing or silently starting empty."
      - "Recover by quarantining the damaged store, restoring the latest verified backup and reporting what was lost, without destroying the evidence."
    subskills:
      - { family: B-05, skill: "corruption/recovery", depth: intro }
    misconceptions:
      - "If the store cannot be parsed, starting with an empty one is a safe recovery."
      - "Recovering means deleting the bad file."
    prerequisites: [no-05-04-backup-restore-verification]
    glossary: [data-quarantine, integrity-check]
    visual: { kind: diagram, concept: "A startup decision tree: load, parse, contract check, integrity check; every failure branch leads to quarantine (a timestamped rename), restore of the latest verified backup and a recovery report — never to an empty store." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict what the server does on start for a truncated JSON file, a record that breaks the contract and a missing store, with the naive loader and with the recovering one." }
      - { kind: run-change, runtime: isolated-node, summary: "Corrupt the scratch store three ways in the Node child, start the server each time and read the recovery report, then remove the backup and observe the refusal to start." }
      - { kind: write, runtime: isolated-node, summary: "Write recoverStore() that quarantines a damaged store, restores the newest verified backup and returns a report of the changes lost since that backup." }
    retrieval:
      - { concept: "recovering from invalid stored data in the browser", from: js-07-10-independent-modules-recovery }
  - id: no-05-06-concurrency-repository
    title: { uk: "Конкурентний доступ у репозиторії", en: "Concurrency in the repository" }
    kind: instructional
    minutes: 10
    objectives:
      - "Reproduce a lost update when two requests read, modify and write the store concurrently, and predict the final state."
      - "Prevent it with a single-writer queue for the file repository or a transaction for SQLite, and show that concurrent requests now all land."
    subskills:
      - { family: B-05, skill: "concurrency/transactions", depth: practice }
    misconceptions:
      - "Node is single-threaded, so two requests can never interfere with each other’s data."
      - "Atomic writes also prevent lost updates."
    prerequisites: [no-05-05-corruption-recovery, no-02-02-async-io]
    glossary: [read-modify-write]
    visual: { kind: sequence, concept: "Two PATCH requests and the store over time: both read version A at their await, each writes its own change and the second write erases the first; with the write queue the second read waits until the first write completes." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the stored record after two concurrent PATCH requests change different fields of the same record, with and without the write queue." }
      - { kind: run-change, runtime: isolated-node, summary: "Send 50 concurrent PATCH requests from the Node child to the scratch server, count the lost changes, then enable the queue or the transaction and rerun." }
      - { kind: write, runtime: isolated-node, summary: "Write withWriteLock(fn) that serializes repository writes, and a test that fires concurrent updates and asserts none is lost." }
    retrieval:
      - { concept: "overlapping saves lose an update", from: no-09-08-file-vs-relational }
  - id: no-05-07-debug-failed-migration
    title: { uk: "Налагодження: невдала міграція", en: "Debug: a failed migration" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose a migration that crashed half-way, left records in mixed shapes and bumped the version anyway."
      - "Repair it to run in a transaction (or on a copy with an atomic swap) and set the version last, then recover the half-migrated store from its verified backup."
    subskills:
      - { family: B-05, skill: "migration/versioning", depth: assess }
      - { family: B-05, skill: "corruption/recovery", depth: assess }
    misconceptions:
      - "The version number says the data is migrated, so it must be."
    prerequisites: [no-05-06-concurrency-repository]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Before running, predict the store’s version and record shapes after the seeded migration throws on the fourth record." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the seeded migration in the Node child, inspect the half-migrated store and its version, and match them to your prediction." }
      - { kind: debug, runtime: isolated-node, summary: "Repair the migration (transaction or copy-and-swap, version written last) and recover the damaged store from its verified backup, proving both with the migration test." }
    retrieval:
      - { concept: "a native schema migration that runs on load", from: rn-05-03-schema-migration }
  - id: no-05-08-independent-restart-no-loss
    title: { uk: "Самостійно: перезапуск без втрат, перевірений restore", en: "Independent: restart without loss, restore verified" }
    kind: assessment
    minutes: 35
    objectives:
      - "Implement, without hints, durable storage for a synthetic dataset with a schema contract, idempotent initialization, serialized concurrent writes and a verified backup."
      - "Prove with a real restart, concurrent requests and a restore drill that every confirmed write survives and the restored data satisfies the invariants."
    subskills:
      - { family: B-05, skill: "initialization", depth: assess }
      - { family: B-05, skill: "concurrency/transactions", depth: assess }
      - { family: B-05, skill: "backup/restore verification", depth: assess }
      - { family: B-05, skill: "schema contract", depth: assess }
    misconceptions: []
    prerequisites: [no-05-07-debug-failed-migration]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-node, summary: "No-hint task in your own terminal: a synthetic bookings store (file or SQLite, with a one-line reason); the supplied check script fires concurrent writes, kills and restarts the server, restores your backup into scratch and compares counts and invariants, and you record its report." }
    retrieval:
      - { concept: "invariants checked before and after a change", from: js-17-05-invariants-boundaries }
  - id: no-05-09-capstone-server-persistence
    title: { uk: "Проєкт: надійне серверне сховище", en: "Capstone: durable server storage" }
    kind: capstone-step
    minutes: 40
    objectives:
      - "Give the chosen capstone’s server durable storage (file or SQLite) with a schema contract, seeded initialization, a tested v1-to-v2 migration, a verified backup and corruption recovery, while the /v1 API keeps working unchanged."
    subskills:
      - { family: B-05, skill: "schema contract", depth: practice }
    misconceptions: []
    prerequisites: [no-05-08-independent-restart-no-loss, no-04-09-capstone-crud-api]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-node, summary: "In server/, add the storage contract, initStore, migrate1to2 with its test, backupStore with verifyBackup and recoverStore behind the existing repository interface, and record why you chose a file or SQLite." }
      - { kind: run-change, runtime: local-node, summary: "In your terminal, migrate the NO-02 store, restart the server, run the CRUD curl script, corrupt the store, restart and confirm recovery from the verified backup; record the outputs." }
    retrieval:
      - { concept: "the /v1 CRUD routes and their error model", from: no-04-09-capstone-crud-api }
