# Syllabus spine for RE-07. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RE-07
stage: RE
title: { uk: "Клавіатура й виміряна продуктивність", en: "Keyboard access and measured performance" }
summary:
  uk: "Учень робить CRUD повністю керованим із клавіатури, з’ясовує через React Profiler, чому компоненти рендеряться, зберігає стабільну ідентичність props, застосовує memo/useMemo/useCallback лише там, де це виправдовує вимірювання, оцінює, коли windowing довгого списку окупається, і після кожної оптимізації повторно перевіряє доступність."
  en: "The learner makes CRUD fully keyboard-operable, finds why components render with the React Profiler, keeps prop identity stable, applies memo/useMemo/useCallback only where a measurement justifies it, judges when windowing a long list pays off, and re-checks accessibility after every optimisation."
competencies: [R-07]
capstoneStep:
  mode: local
  objective:
    uk: "Зробити проєкт повністю керованим із клавіатури та усунути одне вузьке місце рендерингу, виміряне через Profiler, без суцільної мемоізації."
    en: "Make the capstone fully keyboard-operable and fix one measured render bottleneck with the Profiler, without blanket memoization."
  variants:
    wishlist:
      uk: "Лише з клавіатури: додати, змінити, позначити `acquired` і видалити бажання з підтвердженням; виміряти фільтрацію 2 000 синтетичних бажань разом із сумою цін і усунути одну виміряну причину."
      en: "Keyboard only: add, edit, mark `acquired` and delete items with confirmation; profile filtering 2,000 synthetic items with the price total and fix the one measured cause."
    planner:
      uk: "Лише з клавіатури: додати, змінити, перемкнути `done`, змінити `priority` і видалити справу; виміряти підрахунок справ на сьогодні серед 2 000 синтетичних справ і усунути одну виміряну причину."
      en: "Keyboard only: add, edit, toggle `done`, change `priority` and delete tasks; profile the due-today count over 2,000 synthetic tasks and fix the one measured cause."
    habits:
      uk: "Лише з клавіатури: додати, поставити на паузу чи відновити (`active`), відмітити сьогоднішнє виконання й видалити звичку; виміряти обчислення серій для 500 звичок із довгими `completions` і усунути одну виміряну причину."
      en: "Keyboard only: add, pause or resume (`active`), mark today's completion and delete habits; profile streak computation for 500 habits with long `completions` lists and fix the one measured cause."
    expenses:
      uk: "Лише з клавіатури: додати, змінити, перенести в іншу категорію й видалити витрату; виміряти підсумки за категоріями для 5 000 синтетичних витрат (`amountMinor`) і усунути одну виміряну причину."
      en: "Keyboard only: add, edit, re-categorise and delete expenses; profile category totals over 5,000 synthetic expenses (`amountMinor`) and fix the one measured cause."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-01-05-keys-identity (identity) ; js-17-06-devtools-performance-memory (profiling) ; js-06-02-keyboard-focus-landmarks (keyboard) ; js-04-08-copying-shallow-deep (new object identity)
lessons:
  - id: re-07-01-keyboard-crud
    title: { uk: "CRUD, яким можна керувати з клавіатури", en: "Keyboard-operable CRUD" }
    kind: instructional
    minutes: 12
    objectives:
      - "Operate create, edit, toggle and delete with the keyboard alone and state where focus must land after each action."
      - "Repair a click-only control (a div with onClick) into a native button with a visible focus style."
    subskills:
      - { family: R-07, skill: "accessibility during optimization", depth: intro }
    misconceptions:
      - "If it works with a mouse and has an onClick, it is accessible."
      - "After a delete, focus can stay wherever the browser happens to put it."
    prerequisites: [js-06-02-keyboard-focus-landmarks, re-04-05-refs-focus]
    glossary: [keyboard-operable]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict where focus goes after deleting the second card with the keyboard and after cancelling an inline edit with Escape." }
      - { kind: run-change, runtime: browser-react, summary: "Drive the CRUD list with Tab, Enter, Space and Escape only, then change the delete flow so focus moves to the next card or the list heading." }
      - { kind: write, runtime: browser-react, summary: "Write keyboard handling for the inline editor: Enter saves, Escape cancels, and focus returns to the card's Edit button through a ref." }
    retrieval:
      - { concept: "tab order and visible focus", from: js-06-02-keyboard-focus-landmarks }
      - { concept: "refs to move DOM focus", from: re-04-05-refs-focus }
  - id: re-07-02-profiling-render-causes
    title: { uk: "Профілювання: чому цей компонент рендерився?", en: "Profiling: why did this render?" }
    kind: instructional
    minutes: 12
    objectives:
      - "Record an interaction in the React Profiler and name, for each re-rendered component, why it rendered (own state, parent render, context change)."
      - "Tell a slow render from a slow commit or a slow effect using the recording, not intuition."
    subskills:
      - { family: R-07, skill: "profiling/render causes", depth: intro }
    misconceptions:
      - "A component re-renders only when its props change."
      - "Every re-render is a performance problem."
    prerequisites: [re-07-01-keyboard-crud, re-01-06-render-vs-commit, js-17-06-devtools-performance-memory]
    glossary: [react-profiler, render-cause, commit-duration]
    visual: { kind: render-timeline, concept: "Typing one character in the search field above a 2,000-record synthetic list: which components render, the cause and duration of each, then the commit and any effects, as the Profiler would record them." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which components re-render when the user types in the search field: the field, the list, every card, the summary." }
      - { kind: run-change, runtime: browser-react, summary: "Record the interaction in the Profiler on the slow synthetic fixture, move the search draft into the field component and record again." }
      - { kind: write, runtime: browser-react, summary: "Write a short evidence note from one recording: the slowest component, its render cause and its measured duration." }
    retrieval:
      - { concept: "recording and reading a performance profile", from: js-17-06-devtools-performance-memory }
  - id: re-07-03-stable-identity
    title: { uk: "Стабільна ідентичність", en: "Stable identity" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict whether a prop is the same between renders by reference: inline objects, arrays and functions are new on every render."
      - "Keep identity stable by moving constants out of the component or deriving values once, before reaching for memo hooks."
    subskills:
      - { family: R-07, skill: "stable identity", depth: intro }
    misconceptions:
      - "An object with the same contents is the same prop for React."
      - "A stable key means the props passed with it are stable too."
    prerequisites: [re-07-02-profiling-render-causes, js-04-07-reference-identity]
    glossary: [referential-stability]
    visual: { kind: memory-graph, concept: "Two consecutive renders side by side: the bindings sortOptions, onSelect and visibleRecords point to heap objects; inline literals and .filter() results get new objects each render, while a module-level constant keeps one arrow." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict Object.is(previous, next) across two renders for an inline style object, a .filter() result and a module-level constant." }
      - { kind: run-change, runtime: browser-react, summary: "Log identity checks during render, move the sort options out of the component and watch which comparison turns true." }
      - { kind: write, runtime: browser-react, summary: "Rewrite a card list so its sort options are a module constant and its visible list is derived once per render and passed down." }
    retrieval:
      - { concept: "spread and filter create new objects", from: js-04-08-copying-shallow-deep }
      - { concept: "keys identify list items between renders", from: re-01-05-keys-identity }
  - id: re-07-04-memoization-when-measured
    title: { uk: "memo/useMemo/useCallback — лише після вимірювання", en: "memo/useMemo/useCallback, only when measured" }
    kind: instructional
    minutes: 12
    objectives:
      - "Apply memo, useMemo or useCallback only to a component or calculation the Profiler shows is slow, and measure before and after."
      - "Explain why memo on a child does nothing when the parent passes a new inline function on every render."
      - "Remove a memoization that adds cost without a measured gain."
    subskills:
      - { family: R-07, skill: "memo/useMemo/useCallback when measured", depth: intro }
    misconceptions:
      - "Memoize everything: it is free and always makes React faster."
      - "useMemo guarantees the value is never recalculated."
    prerequisites: [re-07-03-stable-identity, js-17-07-measured-improvement]
    glossary: [react-memo, use-memo, use-callback]
    visual: { kind: render-timeline, concept: "The same toggle interaction recorded three times: no memo; memo on the card with an inline handler, so it still renders; memo plus a stable handler, so unchanged cards are skipped — with the measured duration of each render." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict whether a memo-wrapped card re-renders when its parent passes onToggle={() => toggle(id)}." }
      - { kind: run-change, runtime: browser-react, summary: "Profile the slow summary, wrap only the expensive total in useMemo, re-measure, then remove a useCallback that showed no gain." }
      - { kind: write, runtime: browser-react, summary: "Write a before/after note with two Profiler numbers that justifies the single memoization you keep." }
    retrieval:
      - { concept: "improve only a measured bottleneck", from: js-17-07-measured-improvement }
  - id: re-07-05-long-lists-windowing
    title: { uk: "Довгі списки й windowing", en: "Long lists and windowing awareness" }
    kind: instructional
    minutes: 10
    objectives:
      - "Estimate the DOM node count of a long list and recognise when windowing (rendering only the visible rows) is worth its cost."
      - "Name what windowing costs: in-page find, scroll restoration, keyboard focus and screen-reader context."
    subskills:
      - { family: R-07, skill: "list/windowing awareness", depth: intro }
    misconceptions:
      - "Windowing is free speed with no effect on accessibility or search."
      - "Any list longer than a hundred items must be windowed."
    prerequisites: [re-07-04-memoization-when-measured, re-01-04-conditional-list-rendering]
    glossary: [list-windowing, overscan]
    visual: { kind: diagram, concept: "A 5,000-row list beside its viewport: only the visible rows plus an overscan band exist as DOM nodes, and scrolling slides the window while row keys stay stable." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict how many row elements are rendered for 5,000 records at 40 px per row in an 800 px viewport with an overscan of 5." }
      - { kind: run-change, runtime: browser-react, summary: "Toggle the course's minimal windowing demo on and off, compare Profiler timings, then Tab through rows and note where focus is lost." }
      - { kind: write, runtime: browser-react, summary: "Write a decision note for the capstone's realistic record count: paging, a plain list or windowing, justified with one measurement." }
    retrieval:
      - { concept: "lazy paging over records with a generator", from: js-13-13-capstone-lazy-paging-cleanup }
  - id: re-07-06-debug-unnecessary-renders
    title: { uk: "Налагодження: виміряне вузьке місце", en: "Debug: an observed bottleneck" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose from a Profiler recording why every card re-renders on each keystroke (a context value object created inline, unstable props)."
      - "Fix the cause, confirm it with a second recording and re-run the keyboard and behaviour tests."
    subskills:
      - { family: R-07, skill: "profiling/render causes", depth: assess }
      - { family: R-07, skill: "stable identity", depth: assess }
    misconceptions:
      - "If the profile got faster, nothing else needs to be re-checked."
    prerequisites: [re-07-05-long-lists-windowing, re-04-04-context-boundaries]
    glossary: []
    visual: { kind: render-timeline, concept: "The seeded recording replayed: the provider builds a new value object each render, so every consumer card lights up; after the fix only the edited card renders, and the keyboard test run is shown alongside." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "From a supplied Profiler recording, predict which line causes all 2,000 cards to re-render on each keystroke." }
      - { kind: run-change, runtime: browser-react, summary: "Reproduce the slow interaction, record it, and confirm the render cause the Profiler reports." }
      - { kind: debug, runtime: browser-react, summary: "Repair a seeded inline context value and an index key that breaks after sorting; prove it with a before/after recording and passing keyboard and behaviour tests." }
    retrieval:
      - { concept: "context consumers re-render when the provided value changes", from: re-04-04-context-boundaries }
  - id: re-07-07-independent-measured-optimization
    title: { uk: "Самостійно: виміряна оптимізація, що зберігає доступність", en: "Independent: measured optimisation that keeps accessibility" }
    kind: assessment
    minutes: 30
    objectives:
      - "Locate, without hints, a measured bottleneck in an unseen list app, fix it with the smallest justified change and show that behaviour and keyboard checks still pass."
    subskills:
      - { family: R-07, skill: "memo/useMemo/useCallback when measured", depth: assess }
      - { family: R-07, skill: "list/windowing awareness", depth: assess }
      - { family: R-07, skill: "accessibility during optimization", depth: assess }
    misconceptions: []
    prerequisites: [re-07-06-debug-unnecessary-renders]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-react, summary: "No-hint task: a synthetic 3,000-row inventory table filters slowly; submit before/after recordings, at most one justified memoization or windowing decision, and passing keyboard CRUD and behaviour tests." }
    retrieval:
      - { concept: "operation counts versus timings", from: js-17-02-big-o-measured }
  - id: re-07-08-capstone-perf-a11y
    title: { uk: "Проєкт: клавіатура й продуктивність", en: "Capstone: keyboard and performance" }
    kind: capstone-step
    minutes: 25
    objectives:
      - "Make every capstone action keyboard-operable and fix one bottleneck measured on a large synthetic fixture, recording before/after evidence."
    subskills:
      - { family: R-07, skill: "accessibility during optimization", depth: practice }
    misconceptions: []
    prerequisites: [re-07-07-independent-measured-optimization]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "In VS Code, complete keyboard handling and focus return for every capstone action, generate a large synthetic fixture, record a Profiler session, fix the top measured cause and commit the before/after numbers." }
      - { kind: run-change, runtime: local-web, summary: "Re-run the keyboard walk-through and the user-action tests on the optimised build and note any focus regression." }
    retrieval:
      - { concept: "keeping focus when the UI re-renders", from: js-06-12-focus-management }
