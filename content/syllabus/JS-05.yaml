# Syllabus spine for JS-05. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-05
stage: JS
title: { uk: "Перетворення списків: map, filter, reduce, сортування й пошук", en: "Transforming lists: map, filter, reduce, sorting and search" }
summary:
  uk: "Учень перетворює списки записів за допомогою map, filter, find, some, every і reduce, сортує копії правильними стабільними компараторами, рахує, скільки роботи коштує пошук, і обирає зрозумілі ланцюжки замість хитромудрих."
  en: "The learner transforms record lists with map, filter, find, some, every and reduce, sorts copies with correct, stable comparators, counts how much work a search costs, and chooses readable chains over clever ones."
competencies: [J-05]
capstoneStep:
  mode: in-platform
  objective:
    uk: "Реалізувати пошук, фільтр за статусом, сортування та підсумок (кількість/сума/частка) свого проєкту як чисті перетворення списку записів."
    en: "Implement the capstone's search, status filter, sort and summary (count/total/rate) as pure transformations over the record list."
  variants:
    wishlist:
      uk: "Пошук бажань за name, фільтр «хочу/отримано» за acquired, сортування за price (бажання без ціни — в кінці) і підсумок: кількість бажань та сума price ще не отриманих бажань із ціною (бажання без ціни рахуються окремо)."
      en: "Search items by name, filter wanted/acquired by acquired, sort by price with priceless items last, and summarize the item count and the total price of wanted items that have a price (priceless ones counted separately)."
    planner:
      uk: "Пошук справ за title, фільтр «у роботі/виконано» за done, сортування за dueDate (без терміну — в кінці), а потім за priority, і підсумок: кількість невиконаних справ із терміном на заданий день або раніше."
      en: "Search tasks by title, filter pending/done by done, sort by dueDate (no due date last) and then priority, and summarize the count of pending tasks due on or before a given day."
    habits:
      uk: "Пошук звичок за name, фільтр «активні/на паузі» за active, сортування за name і підсумок: кількість виконань та частка виконаних днів у заданому списку днів."
      en: "Search habits by name, filter active/paused by active, sort by name, and summarize the completion count and the completion rate over a given list of days."
    expenses:
      uk: "Пошук витрат за label, фільтр за category, сортування за date або amountMinor і підсумок: суми за кожною категорією та загальна сума в мінорних одиницях."
      en: "Search expenses by label, filter by category, sort by date or amountMinor, and summarize totals per category and the overall total in minor units."
# Retrieval plan: js-04-07-reference-identity (identity in find) ; js-03-06-higher-order-callbacks (callbacks) ; js-04-10-immutable-updates (new arrays)
lessons:
  - id: js-05-01-map
    title: { uk: "map: зі списку — новий список", en: "map: one list to another" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict the new array that map returns for a given callback and confirm that the original array is unchanged."
      - "Write a map callback that returns a value for every element, and explain why a callback without return fills the result with undefined."
    subskills:
      - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: intro }
    misconceptions:
      - "map changes the original array."
      - "map can skip an element if the callback returns nothing."
    prerequisites: [js-03-06-higher-order-callbacks, js-04-10-immutable-updates]
    glossary: [array-map, transformation]
    visual: { kind: pipeline, concept: "Three synthetic records flow through map(toLabel): each record enters the callback, the returned label drops into the slot with the same index of a new array, and the original array stays unchanged beside the result." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the result and the original after prices.map(p => p * 2) and after a map whose callback has a block body but no return." }
      - { kind: run-change, runtime: browser-js, summary: "Run both, then change the callback to return an object { id, label } and add the parentheses an implicit object return needs." }
      - { kind: write, runtime: browser-js, summary: "Write toLabels(records) with map that returns 'name — price' strings for synthetic records, using 'no price' for a null price." }
    retrieval:
      - { concept: "passing a function as an argument", from: js-03-06-higher-order-callbacks }
  - id: js-05-02-filter-find
    title: { uk: "filter і find", en: "filter and find" }
    kind: instructional
    minutes: 12
    objectives:
      - "Choose filter for “all that match” and find for “the first that matches”, and predict each one's result when nothing matches (an empty array vs undefined)."
      - "Show with === that filter and find return the same record objects, not copies."
      - "Search records by text with filter, includes and toLowerCase (js-05-09 and the capstone search need it, and no earlier lesson places string search)."
    subskills:
      - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: practice }
    misconceptions:
      - "filter returns copies of the matching records."
      - "find returns null when nothing matches."
    prerequisites: [js-05-01-map, js-04-07-reference-identity]
    glossary: [array-filter, array-find, predicate]
    visual: { kind: pipeline, concept: "Four wishes pass a predicate gate in one chain: filter(!acquired) checks every record and collects the passing ones (the same objects, not copies) into a new array, then find(price <= 50) checks that array from the start, stops at the first match and returns the object itself without checking the rest; the captions name undefined as the no-match result. Item labels are language-neutral { id, price, acquired } objects." }
    analogy: "filter is a sieve: the condition decides what passes into the bowl (limit: a sieve splits the pile itself, while filter leaves the original array whole and the new array holds the same objects, not copies; and a sieve sorts only by size, while a predicate can ask about any field)."
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict filter and find results for predicates matching none, one and two synthetic records, and whether found === records[1]." }
      - { kind: run-change, runtime: browser-js, summary: "Run, then change a field on the found record and observe the same change in the original list." }
      - { kind: write, runtime: browser-js, summary: "Write byStatus(records, done) with filter, findById(records, id) with find that returns null instead of undefined when the id is missing, and searchByTitle(records, query) that ignores upper and lower case." }
    retrieval:
      - { concept: "two names, one object", from: js-04-07-reference-identity }
  - id: js-05-03-some-every
    title: { uk: "some і every", en: "some and every" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict some and every results, including on an empty array, and explain why every on an empty array is true."
      - "Use some and every to answer yes/no questions about a list and say where each one stops early."
    subskills:
      - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: practice }
    misconceptions:
      - "every on an empty list is false because nothing passed."
      - "some and every always call the callback for every element."
    prerequisites: [js-05-02-filter-find]
    glossary: [array-some, array-every, vacuous-truth]
    visual: { kind: code-trace, concept: "A real trace of habits.some(isPaused) and habits.every(isActive) over three habits: every callback call and its returned true/false is a step, some stops at the first true and every at the first false (the third habit is never checked), and on an empty array both answer (false / true) with zero callback calls. Kind changed from pipeline because the pipeline visual has no some/every stage." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict some and every for an empty list, a list with one invalid record and a list of three valid ones, and how many times the callback runs each time." }
      - { kind: run-change, runtime: browser-js, summary: "Run with a logging callback to count calls, then reorder the list so some stops one record earlier." }
      - { kind: write, runtime: browser-js, summary: "Write allNamed(records) with every and anyOverLimit(records, limit) with some, and decide what an empty list should mean for each." }
    retrieval:
      - { concept: "the empty array edge case", from: js-04-01-arrays-basics }
  - id: js-05-04-reduce
    title: { uk: "reduce: згортаємо список в одне значення", en: "reduce: fold a list into one value" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace reduce step by step from its initial value to the final result."
      - "Write a reduce that sums amounts or counts records per key, and explain why leaving out the initial value breaks on an empty list."
    subskills:
      - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: practice }
    misconceptions:
      - "The initial value of reduce is optional, just a matter of style."
      - "reduce can only produce a number."
    prerequisites: [js-05-03-some-every, js-04-02-for-while]
    glossary: [array-reduce, accumulator, initial-value]
    visual: { kind: pipeline, concept: "Each price enters the reducer together with the current accumulator; the accumulator box changes step by step from the initial value 0 to the final total 365. The empty-list run with and without the initial value (0 versus a TypeError) is a verified prediction and a runnable example, because a pipeline visual cannot show a thrown error." }
    analogy: "reduce is a cashier who scans a basket item by item and updates the total on the display (limit: a cashier always starts from zero, while reduce starts from the initial value you pass and, without one, takes the first item as its start and breaks on an empty basket; and the display always shows a number, while an accumulator can be a string, an array or an object)."
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the accumulator after each step of summing [80, 45, 240] from 0, and the result on [] with and without the initial value." }
      - { kind: run-change, runtime: browser-js, summary: "Run a reducer that builds a { category: total } object and watch the accumulator object grow, then drop the initial {} and see the first record become the accumulator (the exercise then counts per category, so the example does not hand out its solution)." }
      - { kind: write, runtime: browser-js, summary: "Write totalPrice(records) with reduce that skips null prices, and countByCategory(records) that returns counts per category." }
    retrieval:
      - { concept: "a running total in a loop", from: js-04-02-for-while }
  - id: js-05-05-sorting-comparator
    title: { uk: "Сортування з компаратором", en: "Sorting with a comparator" }
    kind: instructional
    minutes: 12
    objectives:
      - "Write comparators that return a negative number, zero or a positive number for numeric, text (localeCompare) and null-last fields."
      - "Explain that sort reorders the array in place, and sort a copy ([...list].sort or toSorted) instead."
      - "Predict that records with equal keys keep their original order because sort is stable."
    subskills:
      - { family: J-05, skill: "sorting comparator and stable ordering", depth: intro }
    misconceptions:
      - "sort() without a comparator sorts numbers numerically."
      - "sort returns a new array and leaves the original alone."
    prerequisites: [js-05-04-reduce, js-04-10-immutable-updates]
    glossary: [comparator, stable-sort, in-place-sort]
    visual: { kind: pipeline, concept: "Six expenses go through two sorts in a row, toSorted(byAmount) and then toSorted(byDate); records with equal dates get 0 from the comparator and keep the order left by the first sort, so the result is by date and by amount within a day. The meaning of each comparator result (negative, 0, positive) is a table and a prediction, because a pipeline sort stage is one step; in place versus copy is shown by the runnable examples." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict [10, 9, 100].sort(), the same with (a, b) => a - b, and whether the original array changed in each case." }
      - { kind: run-change, runtime: browser-js, summary: "Run, then sort a copy instead, and sort records with equal prices to observe the stable order." }
      - { kind: write, runtime: browser-js, summary: "Write byPriceAsc(a, b) that puts null prices last and byNameAsc(a, b) with localeCompare, and sort a copied fixture list with each." }
    retrieval:
      - { concept: "returning a new array instead of changing the old one", from: js-04-10-immutable-updates }
  - id: js-05-06-search-complexity
    title: { uk: "Пошук і вартість роботи", en: "Searching and the cost of work" }
    kind: instructional
    minutes: 12
    objectives:
      - "Count the comparisons a linear search makes in the best and the worst case, and describe how that count grows with the list size."
      - "Replace a repeated linear search with a lookup object built once, and state the extra memory it costs."
    subskills:
      - { family: J-05, skill: "search and complexity", depth: intro }
    misconceptions:
      - "Shorter code is always faster code."
      - "find is instant because it is a built-in method."
    prerequisites: [js-05-02-filter-find, js-04-04-break-continue-nested, js-04-05-objects-properties]
    glossary: [linear-search, time-complexity, space-complexity, lookup-table]
    visual: { kind: code-trace, concept: "A comparisons counter ticks on every check as find looks for the first, the last and a missing id in a list of four habits (1, 4 and 4 comparisons); then a lookup object keyed by id is built in one pass and answers in one step with no comparisons. The 10/100/1000-record counts run in the example (a trace of 1000 records would exceed the step cap), and the n × n duplicate check is the exercise." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the comparison counts of findById for the first, the last and a missing id in lists of 10 and 1000 records." }
      - { kind: run-change, runtime: browser-js, summary: "Run with the counter on, then build an id → record lookup object once and compare the counts for 100 lookups." }
      - { kind: write, runtime: browser-js, summary: "Write hasDuplicateIds(records) first with nested loops and then with a lookup object (Object.hasOwn), logging the comparison count of each on the same list; a hidden check counts id reads to confirm that the lookup version is linear." }
    retrieval:
      - { concept: "nested loops repeat the inner work for every outer step", from: js-04-04-break-continue-nested }
  - id: js-05-07-readable-chains
    title: { uk: "Обираємо зрозумілі перетворення", en: "Choosing readable transformations" }
    kind: instructional
    minutes: 10
    objectives:
      - "Rewrite a loop that filters, sorts and formats as a chain of named steps, and judge which version is easier to read and change."
      - "Recognize when a reduce that builds arrays or objects hides intent, and replace it with named filter/map steps or a plain loop."
    subskills:
      - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: practice }
      - { family: J-05, skill: "sorting comparator and stable ordering", depth: practice }
    misconceptions:
      - "One reduce is always better than a chain because it walks the list only once."
      - "Chaining methods is slow enough to matter for everyday lists."
    prerequisites: [js-05-06-search-complexity, js-05-05-sorting-comparator]
    glossary: [method-chain, intermediate-array]
    visual: { kind: pipeline, concept: "The same records flow through filter(isWanted) → toSorted(byPriceAsc) → map(toLabel) with each intermediate array shown. The comparison with an equivalent loop and a dense reduce is made in the explanation and the exercise, because a pipeline cannot show a loop." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict each intermediate array of records.filter(isWanted).toSorted(byPriceAsc).map(toLabel) for the fixture list." }
      - { kind: run-change, runtime: browser-js, summary: "Run the chain, move map before filter and explain from the intermediate arrays why the predicate now fails." }
      - { kind: write, runtime: browser-js, summary: "Rewrite a provided 15-line loop that filters, sorts and formats records into a chain of small named callbacks, keeping the output identical." }
    retrieval:
      - { concept: "implicit returns in short arrow callbacks", from: js-03-03-arrow-functions }
  - id: js-05-08-debug-comparator-missing
    title: { uk: "Налагодження: булевий компаратор і відсутні записи", en: "Debug: boolean comparator and missing records" }
    kind: instructional
    minutes: 12
    objectives:
      - "Diagnose and repair a comparator that returns true/false, a reduce without an initial value, a find result used without a missing check and a duplicate record counted twice."
      - "Point to the pipeline stage where each wrong value first appears."
    subskills:
      - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: assess }
      - { family: J-05, skill: "sorting comparator and stable ordering", depth: assess }
    misconceptions:
      - "A comparator that returns a.price > b.price works, because sorting only needs to know which value is bigger."
    prerequisites: [js-05-07-readable-chains]
    glossary: []
    visual: { kind: pipeline, concept: "The failing pipeline replayed: a boolean comparator's true/false results collapse into 1 and 0 so the list comes out unsorted (the order for such a comparator is engine-defined; Chrome and Node keep the input order), and a duplicated record is counted twice in the reduce total, the wrong value already being in the input. The missing-id crash is shown by the runnable example, because a pipeline visual cannot show a thrown error." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Before running, mark which of four seeded functions gives a wrong order, a crash or a wrong total for fixtures with a missing id, a duplicate record and equal prices." }
      - { kind: run-change, runtime: browser-js, summary: "Run the seeded functions on the fixtures and match each output to your prediction." }
      - { kind: debug, runtime: browser-js, summary: "Repair (a, b) => a.price > b.price, a reduce with no initial value on an empty list, findById(...).name on a missing id and a total that counts a duplicate record twice, without changing the intended output." }
    retrieval:
      - { concept: "comparisons produce booleans", from: js-01-04-booleans-null-undefined }
      - { concept: "?. on a value that may be missing", from: js-02-04-nullish-optional-chaining }
  - id: js-05-09-independent-summary
    title: { uk: "Самостійно: фільтр, пошук і підсумок з оцінкою вартості", en: "Independent: filter, search and summary with cost notes" }
    kind: assessment
    minutes: 30
    objectives:
      - "Implement, without hints, search, filter, sort and summary functions over synthetic records that leave the input unchanged and handle missing and duplicate records."
      - "Explain in two sentences per function how its work and extra memory grow with the number of records."
    subskills:
      - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: assess }
      - { family: J-05, skill: "sorting comparator and stable ordering", depth: assess }
      - { family: J-05, skill: "search and complexity", depth: assess }
    misconceptions: []
    prerequisites: [js-05-08-debug-comparator-missing]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: generic searchByText(records, field, query), filterByStatus(records, field, value), sortBy(records, field) with a stable null-last comparator (numbers and localeCompare text) and summarize(records, field) returning { count, total, missing } with every id counted once; hidden fixtures from three domains include an empty list, null values, duplicate records, equal keys and a check that the input array is unchanged." }
      - { kind: independent, runtime: browser-js, summary: "No-hint task: indexById(records) keeping the first record of a repeated id and pickByIds(records, ids) returning null for missing ids; a hidden check counts id reads to confirm that the lookup is built once (linear work), and an id such as toString must not match an inherited key." }
      - { kind: independent, runtime: browser-js, summary: "Cost note as a committed multi-select (free text cannot be checked automatically): which statements about each function's work growth, extra memory and the point where a lookup object pays off are true." }
    retrieval:
      - { concept: "?? for a record with a missing price", from: js-02-04-nullish-optional-chaining }
  - id: js-05-10-capstone-search-filter-summary
    title: { uk: "Проєкт: пошук, фільтр, сортування, підсумок", en: "Capstone: search, filter, sort, summary" }
    kind: capstone-step
    minutes: 20
    objectives:
      - "Implement the chosen domain's search, status filter, sort and summary as pure functions over the record list and show their results on the page."
    subskills:
      - { family: J-05, skill: "map/filter/find/some/every/reduce", depth: practice }
    misconceptions: []
    prerequisites: [js-05-09-independent-summary, js-04-13-capstone-records-crud]
    glossary: [derived-value]
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: browser-js, summary: "In the capstone workspace, write the domain's search, filter, sort and summarize functions over the fixture list and display the derived summary; none of them may mutate the list." }
      - { kind: run-change, runtime: browser-js, summary: "Swap the fixtures for an empty list and for a list with a missing optional field, and confirm the summary and the order stay correct." }
    retrieval:
      - { concept: "record CRUD that returns new lists", from: js-04-13-capstone-records-crud }
