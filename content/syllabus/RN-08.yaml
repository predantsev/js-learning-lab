# Syllabus spine for RN-08. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RN-08
stage: RN
title: { uk: "Контрольна точка CP-RN: самостійне нативне вдосконалення", en: "Checkpoint CP-RN: an independent native enhancement" }
summary:
  uk: "Учень після паузи відновлює навички роботи зі state, ефектами й перетвореннями даних, самостійно будує вдосконалення нативного проєкту на заявленій цілі, яке проходить перевірки перезапуску, офлайну, життєвого циклу, безпеки, доступності й продуктивності, виправляє закладену регресію та фіксує походження доказів, зокрема пропуски для непідтримуваних цілей."
  en: "The learner retrieves state, effect and data-transformation skills after a delay, builds an independent enhancement of the native capstone on the declared target that passes restart, offline, lifecycle, security, accessibility and performance checks, repairs a seeded regression, and records evidence provenance including skips for unsupported targets."
competencies: [N-12]
capstoneStep:
  mode: local
  objective:
    uk: "CP-RN: самостійно побудувати нативне вдосконалення на заявленій цілі, пройти перевірки перезапуску, офлайну, життєвого циклу й доступності та зафіксувати походження доказів, зокрема пропуски для непідтримуваних цілей."
    en: "CP-RN: build an independent native enhancement on the declared target, pass restart/offline/lifecycle/a11y checks, and record provenance including any unsupported-target skips."
  variants:
    wishlist:
      uk: "Додати фільтр за категорією з кількістю й сумою бажаних речей для кожної категорії (бажання без ціни рахуються окремо), що зберігається після перезапуску й офлайн-змін, з підписаними елементами керування, які оголошує screen reader; зафіксувати докази й пропущені цілі."
      en: "Add a category filter with per-category counts and wanted totals (wishes without a price counted separately), kept across restart and offline edits, with labelled controls a screen reader announces; record evidence and any skipped target."
    planner:
      uk: "Додати розділ прострочених справ — невиконаних, із терміном до заданого дня, упорядкованих за priority, — що зберігається після перезапуску й офлайн-змін і правильно оголошується screen reader; зафіксувати докази й пропущені цілі."
      en: "Add an overdue section for pending tasks due before the given day, ordered by priority, kept across restart and offline edits and announced correctly by a screen reader; record evidence and any skipped target."
    habits:
      uk: "Додати для кожної звички сітку виконання за сім днів, побудовану з completions, із тижневим відсотком виконання, що зберігається після перезапуску й офлайн-перемикань і працює зі screen reader; зафіксувати докази й пропущені цілі."
      en: "Add a seven-day completion grid per habit built from completions, with a weekly completion rate, kept across restart and offline toggles and operable with a screen reader; record evidence and any skipped target."
    expenses:
      uk: "Додати місячний підсумок за категоріями в amountMinor із фільтром за категорією, що зберігається після перезапуску й офлайн-змін, а суми screen reader оголошує повністю; зафіксувати докази й пропущені цілі."
      en: "Add a monthly per-category summary in amountMinor with a category filter, kept across restart and offline edits, with amounts announced in full by a screen reader; record evidence and any skipped target."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-02-02-state-snapshots (snapshot) ; re-03-03-dependencies-cleanup (effects) ; js-05-04-reduce (transformations) ; rn-05-05-restart-recovery-shared-models (restart) ; js-03-05-closures (closure)
lessons:
  - id: rn-08-01-checkpoint-review
    title: { uk: "Огляд контрольної точки: відкладене повторення React/JS", en: "Checkpoint review: delayed React/JS retrieval" }
    kind: review
    minutes: 20
    objectives:
      - "Retrieve, without notes, how state snapshots, effect cleanup, reduce and closures behave, and predict their effect in native capstone code."
      - "List the checkpoint's evidence categories (restart, offline, lifecycle, security, accessibility, performance) and say what counts as a skip rather than a pass."
    subskills:
      - { family: N-12, skill: "restart/offline/lifecycle/security/a11y/performance", depth: intro }
      - { family: N-12, skill: "unsupported target and skip evidence", depth: intro }
    misconceptions: []
    prerequisites: [rn-11-09-capstone-release-build]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: review, runtime: concept-preview, summary: "Mixed delayed-retrieval set shown in native capstone code: a stale state snapshot in a handler, a missing effect cleanup on screen blur, a reduce over records and a closure that captures an old record." }
      - { kind: predict, runtime: concept-preview, summary: "Predict the output of four short native capstone snippets before running them in the labelled preview: a snapshot read after setState, cleanup order on blur, a reduce total and a stale closure value." }
    retrieval:
      - { concept: "state is a snapshot per render", from: re-02-02-state-snapshots }
      - { concept: "effect dependencies and cleanup", from: re-03-03-dependencies-cleanup }
      - { concept: "folding records into one value with reduce", from: js-05-04-reduce }
      - { concept: "closures capture bindings, not copies", from: js-03-05-closures }
  - id: rn-08-02-provenance-unsupported-targets
    title: { uk: "Походження доказів і непідтримувані цілі", en: "Provenance and unsupported targets" }
    kind: instructional
    minutes: 10
    objectives:
      - "Classify evidence as learner-authored, supplied, assisted or skipped, and explain why a skipped native check never counts as a pass."
      - "Write an evidence record for one check: subskill, build id and version, procedure, observed output, target and provenance."
      - "Scope an independent enhancement that fits a 60-minute session and name the checks it must pass."
    subskills:
      - { family: N-12, skill: "signed/build provenance", depth: intro }
      - { family: N-12, skill: "independent native enhancement", depth: intro }
    misconceptions:
      - "If my workstation cannot run the other platform, that check can be marked passed because the code is shared."
      - "Evidence is just a screenshot; how and on which build it was produced does not matter."
    prerequisites: [rn-08-01-checkpoint-review, rn-07-05-e2e-platform-deployment-concepts]
    glossary: [build-provenance, skip-record]
    visual: { kind: diagram, concept: "An evidence record assembled from boxes (subskill, build id and version, signature fingerprint, procedure, observed output, target, provenance): a run on the declared target fills every box, while an unsupported target produces a skip record that stays visibly unperformed and revisitable." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which of five supplied evidence records the checkpoint accepts as passed, which as skipped and which it rejects (screenshot only, wrong build, browser preview used as native proof)." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labelled record preview, change one record's target from the declared emulator to the browser preview and watch its status change from passed to not native evidence." }
      - { kind: write, runtime: concept-preview, summary: "Write an evidence record and a skip record for the capstone: one check performed on the declared target and one platform you cannot run." }
    retrieval:
      - { concept: "a coverage matrix keeps unperformed cells visible", from: rn-07-05-e2e-platform-deployment-concepts }
  - id: rn-08-03-capstone-cp-rn-enhancement
    title: { uk: "Контрольна точка проєкту CP-RN: самостійне вдосконалення", en: "Capstone checkpoint CP-RN: independent enhancement" }
    kind: capstone-step
    minutes: 60
    objectives:
      - "Build, without hints and in about 60 minutes, one native enhancement of the capstone on the declared target that passes the restart, offline, lifecycle, security, accessibility and performance checks."
    subskills:
      - { family: N-12, skill: "independent native enhancement", depth: assess }
      - { family: N-12, skill: "restart/offline/lifecycle/security/a11y/performance", depth: assess }
    misconceptions: []
    prerequisites: [rn-08-02-provenance-unsupported-targets]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-native, summary: "Plan the enhancement in native/: the screens, domain functions and adapters it touches, the checks it must pass and the evidence to collect on the declared target." }
      - { kind: independent, runtime: local-native, summary: "No-hint, 60-minute task on the declared target: implement the domain's enhancement, then kill and restart the app, edit in airplane mode, background and foreground it, use it with a screen reader, confirm no secret was added and take one release-mode measurement, each recorded as learner-confirmed evidence." }
    retrieval:
      - { concept: "offline edits and which copy is authoritative", from: rn-05-04-offline-cache-authority }
  - id: rn-08-04-debug-seeded-native-regression
    title: { uk: "Налагодження: закладена нативна регресія", en: "Debug: a seeded native regression" }
    kind: local-task
    minutes: 25
    objectives:
      - "Find and repair, on the declared target, a seeded regression in a copy of the native capstone where records vanish after restart and a screen keeps reacting after it is left."
      - "Prove the fix with a restart check and a background/foreground check, recorded as evidence."
    subskills:
      - { family: N-12, skill: "restart/offline/lifecycle/security/a11y/performance", depth: assess }
    misconceptions: []
    prerequisites: [rn-08-03-capstone-cp-rn-enhancement]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Run the seeded checkpoint build on the declared target, reproduce the data loss on restart and the duplicate update after returning to a screen, and log both observations." }
      - { kind: debug, runtime: local-native, summary: "Repair the seeded regression (a schema version bumped without a migration path, and a focus listener with no cleanup) and confirm with restart and focus checks on the target." }
    retrieval:
      - { concept: "restart recovery with the shared TypeScript model", from: rn-05-05-restart-recovery-shared-models }
  - id: rn-08-05-record-evidence
    title: { uk: "Фіксуємо докази й пропуски", en: "Record evidence and skips" }
    kind: local-task
    minutes: 15
    objectives:
      - "Record the checkpoint's evidence with build provenance (id, version, signature fingerprint, target) and an explicit, revisitable skip record for every unsupported target or unperformed check."
    subskills:
      - { family: N-12, skill: "signed/build provenance", depth: assess }
      - { family: N-12, skill: "unsupported target and skip evidence", depth: assess }
    misconceptions: []
    prerequisites: [rn-08-04-debug-seeded-native-regression]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Read the release build's id, version and signature fingerprint on the declared target and attach them to each check performed in CP-RN." }
      - { kind: independent, runtime: local-native, summary: "Without a template, write the CP-RN evidence set: one record per check with provenance, plus skip records for the other platform and any check you could not run, kept visibly unperformed and revisitable." }
    retrieval:
      - { concept: "learner-authored versus supplied work at a checkpoint", from: re-08-02-what-the-checkpoint-checks }
