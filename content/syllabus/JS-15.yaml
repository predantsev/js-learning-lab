# Syllabus spine for JS-15. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-15
stage: JS
title: { uk: "Локальний робочий процес: термінал, пакети та Git", en: "Local professional workflow: terminal, packages and Git" }
summary:
  uk: "Учень безпечно працює з файлами в терміналі, запускає Node-скрипти й scripts із package.json, встановлює залежності з lockfile і діапазонами semver, запускає lint, форматування та збірку з env-конфігурацією й source maps, а також локально користується Git: commit, гілки, читання merge і rebase, розв’язання конфліктів, безпечне скасування та review змін — без жодного облікового запису."
  en: "The learner works with files in a terminal safely, runs Node scripts and package.json scripts, installs dependencies with a lockfile and semver ranges, lints, formats and builds with env config and source maps, and uses Git locally to commit, branch, read merges and rebases, resolve conflicts, undo safely and review changes, with no account required."
competencies: [P-01, P-02]
capstoneStep:
  mode: local
  objective:
    uk: "Підготувати майбутній локальний дім проєкту: перевірити версії Node.js і Git, створити теку ~/js-course/<проєкт>, ініціалізувати в ній Git-репозиторій на гілці main і зробити перший commit із README (файли залишаються на платформі до JS-10)."
    en: "Prepare the capstone's future local home: check the Node.js and Git versions, create the folder ~/js-course/<capstone>, initialize a Git repository on the branch main in it and make a first commit with a README (files still live in the platform until JS-10)."
  variants:
    wishlist:
      uk: "Папка wishlist/ із README, що називає проєкт «Список бажань» і перелічує поля бажання (name, price, acquired, category), та перший commit із цим README, видимий у git log."
      en: "A wishlist/ folder with a README that names the project “Wishlist” and lists the wish fields (name, price, acquired, category), plus a first commit of that README visible in git log."
    planner:
      uk: "Папка planner/ із README, що називає проєкт «Планувальник» і перелічує поля справи (title, dueDate, done, priority), та перший commit із цим README, видимий у git log."
      en: "A planner/ folder with a README that names the project “Planner” and lists the task fields (title, dueDate, done, priority), plus a first commit of that README visible in git log."
    habits:
      uk: "Папка habits/ із README, що називає проєкт «Трекер звичок» і перелічує поля звички (name, frequency, active, completions), та перший commit із цим README, видимий у git log."
      en: "A habits/ folder with a README that names the project “Habit tracker” and lists the habit fields (name, frequency, active, completions), plus a first commit of that README visible in git log."
    expenses:
      uk: "Папка expenses/ із README, що називає проєкт «Трекер витрат», перелічує поля витрати (label, amountMinor, date, category) і зазначає, що суми зберігаються в цілих копійках, та перший commit із цим README, видимий у git log."
      en: "An expenses/ folder with a README that names the project “Expense tracker”, lists the expense fields (label, amountMinor, date, category) and notes that amounts are stored as integer minor units, plus a first commit of that README visible in git log."
# Retrieval plan: js-07-06-esm-import-export (modules in files) ; js-09-04-deterministic-fixtures (tests as scripts) ; js-01-01-code-runs (run)
lessons:
  - id: js-15-01-terminal-files-paths
    title: { uk: "Термінал: файли, папки та шляхи", en: "Terminal: files, folders and paths" }
    kind: local-task
    minutes: 15
    objectives:
      - "Open a terminal, print the working directory and move between folders with cd using absolute and relative paths."
      - "Create, list, copy and rename files in a course scratch folder, predicting where each command acts before running it."
    subskills:
      - { family: P-01, skill: "files/paths and shell navigation", depth: intro }
    misconceptions: []
    prerequisites: [js-09-09-capstone-tests, js-07-06-esm-import-export]
    glossary: [terminal, shell, working-directory, absolute-path, relative-path]
    visual: { kind: diagram, concept: "A folder tree with the shell's current directory highlighted: each cd, ls and path in a sample session moves the highlight or resolves to a file, showing how ./ and ../ are read from where you are, while an absolute path ignores it." }
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "In a new course scratch folder, predict and then run a five-step session of pwd, ls, mkdir, cd, cp and mv, and record the final pwd and ls output as evidence." }
    retrieval:
      - { concept: "relative module specifiers such as ./domain/records.js", from: js-07-06-esm-import-export }
  - id: js-15-02-safe-commands
    title: { uk: "Безпечні команди і що ніколи не вставляти в термінал", en: "Safe commands and what never to paste" }
    kind: instructional
    minutes: 12
    objectives:
      - "Classify a command line as read-only, file-changing or never-run-from-a-paste before executing it, and check which folder it will act in."
      - "Explain why commands that print secrets, pipe a download into a shell or ask for sudo are stop signs, and what to do instead."
    subskills:
      - { family: P-01, skill: "safe commands", depth: intro }
    misconceptions:
      - "A command from a tutorial or a chat is safe because someone else already ran it."
      - "When a command fails with 'permission denied', adding sudo is the fix."
    prerequisites: [js-15-01-terminal-files-paths, js-01-05-reading-an-error]
    glossary: [destructive-command, secret]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: local-web, summary: "Before running anything, label eight sample lines (pwd, ls, mv, rm -i, rm -rf ~, curl … | sh, sudo npm i -g, cat .env) as read-only, file-changing or never-run, and name the folder each would act in." }
      - { kind: run-change, runtime: local-web, summary: "In the scratch folder, delete a file with rm -i answering 'n' first and then 'y', and rename a file onto an existing name with mv -i to read the overwrite prompt." }
      - { kind: write, runtime: browser-js, summary: "Guided: write whereItActs(cwd, target), which resolves the absolute path a command will act on from the working directory and a relative or absolute target (., .., the root boundary)." }
      - { kind: write, runtime: local-web, summary: "Write SAFETY.md in the scratch folder with a four-question pre-flight check (where am I, what will change, can I undo it, does it expose a secret) and apply it to two of the sample lines." }
    retrieval:
      - { concept: "an error message names what went wrong and where", from: js-01-05-reading-an-error }
  - id: js-15-03-node-and-package-manifest
    title: { uk: "Node і скрипти в package.json", en: "Node and package.json scripts" }
    kind: local-task
    minutes: 15
    objectives:
      - "Check the installed Node version against the course's declared version and run a .mjs file with node."
      - "Create package.json, add start and test scripts, run them with npm and say which command each script executes."
    subskills:
      - { family: P-01, skill: "package scripts/manifest", depth: intro }
    misconceptions: []
    prerequisites: [js-15-02-safe-commands, js-09-04-deterministic-fixtures]
    glossary: [node-runtime, package-json, npm-script]
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "Run a supplied summarize.mjs with node, create package.json with npm init -y, add a start script and a test script that runs supplied deterministic assertion tests with node --test, and record the npm test output." }
    retrieval:
      - { concept: "tests that give the same result on every run", from: js-09-04-deterministic-fixtures }
      - { concept: "running a program and finding where its output appears", from: js-01-01-code-runs }
  - id: js-15-04-install-lockfile-semver
    title: { uk: "Встановлення пакетів, lockfile і semver", en: "Installing packages, lockfiles and semver" }
    kind: local-task
    minutes: 15
    objectives:
      - "Install a dev dependency and read what changed in package.json, package-lock.json and node_modules."
      - "Predict which versions a semver range (^1.4.2, ~1.4.2, 1.4.2) allows, reinstall exactly from the lockfile with npm ci, and read one audit advisory without blindly applying a fix."
    subskills:
      - { family: P-01, skill: "package manager/lockfile", depth: intro }
      - { family: P-01, skill: "dependency/semver/security basics", depth: intro }
    misconceptions: []
    prerequisites: [js-15-03-node-and-package-manifest]
    glossary: [package-manager, dependency, dev-dependency, lockfile, semver, security-advisory]
    visual: { kind: diagram, concept: "package.json declares a range, the lockfile pins the exact resolved version and its transitive dependencies, and node_modules holds the files; an install step highlights how the same range can resolve to a different version when no lockfile is present." }
    analogy: null
    practice:
      - { kind: predict, runtime: local-web, summary: "Predict which of 1.4.1, 1.4.2, 1.4.9, 1.5.0 and 2.0.0 the ranges ^1.4.2 and ~1.4.2 accept." }
      - { kind: local-task, runtime: local-web, summary: "Install the account-free public package semver as a dev dependency, read the package.json range and the exact lockfile entry, check the range predictions with npx semver --range, reinstall with npm ci, and (optional) install semver@7.5.1 to read a real npm audit advisory and its transitive dependencies before upgrading deliberately." }
    retrieval: []
  - id: js-15-05-lint-format
    title: { uk: "Lint і форматування", en: "Lint and format" }
    kind: local-task
    minutes: 12
    objectives:
      - "Run a linter and a formatter from package.json scripts and tell a lint finding (a likely bug) from a formatting change (style only)."
      - "Fix one real lint finding, such as an unused variable or a shadowed name, and explain what it could have caused."
    subskills:
      - { family: P-01, skill: "lint/format", depth: intro }
    misconceptions: []
    prerequisites: [js-15-04-install-lockfile-semver, js-02-08-shadowing-strict-mode]
    glossary: [linter, formatter, lint-rule]
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "Add lint and format scripts to the scratch project, run them on a seeded file with an unused variable, a shadowed accumulator and messy spacing, fix the findings and record the clean lint output." }
    retrieval:
      - { concept: "a shadowed binding hiding the outer one", from: js-02-08-shadowing-strict-mode }
  - id: js-15-06-build-env-sourcemaps
    title: { uk: "Збірка, env/config і source maps", en: "Build, env/config and source maps" }
    kind: local-task
    minutes: 15
    objectives:
      - "Run a build script that bundles the scratch project's modules into an output folder and open the result from a local server."
      - "Supply a configuration value through an environment variable without committing it, and debug the built file at the original source line through a source map."
    subskills:
      - { family: P-01, skill: "build/env/config", depth: intro }
      - { family: P-01, skill: "source maps", depth: intro }
    misconceptions: []
    prerequisites: [js-15-05-lint-format, js-09-06-debugger-breakpoints]
    glossary: [build-step, bundle, environment-variable, config-file, source-map]
    visual: { kind: diagram, concept: "Source modules flow through the build step into one bundle plus a .map file; an env value is inlined at build time, and a breakpoint set in the original module is mapped through the source map to the bundle line that actually runs." }
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "Run the build script on the scratch project, serve the output locally, set a breakpoint in the original module through the source map, then change an env value, rebuild and record what changed in the output folder." }
    retrieval:
      - { concept: "pausing at a breakpoint and stepping", from: js-09-06-debugger-breakpoints }
  - id: js-15-07-git-first-commit
    title: { uk: "Git: status, diff, індекс і commit", en: "Git: status, diff, stage, commit" }
    kind: local-task
    minutes: 15
    objectives:
      - "Initialize a repository and read git status, git diff and git diff --staged before and after editing and staging a file."
      - "Make a commit whose message says why the change was made, and find it in git log."
    subskills:
      - { family: P-02, skill: "status/diff/stage/commit", depth: intro }
    misconceptions: []
    prerequisites: [js-15-06-build-env-sourcemaps]
    glossary: [git-repository, working-tree, staging-area, git-commit, diff]
    visual: { kind: git-graph, concept: "Working tree, staging area and history side by side: a file's change moves from modified to staged to committed as git add and git commit run, and the commit graph grows by one node carrying its message." }
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "Predict git status after editing, staging and committing a file in a fresh synthetic repository, run each step, and record git status, git diff --staged and git log --oneline as evidence." }
    retrieval: []
  - id: js-15-08-branches-history
    title: { uk: "Гілки та історія", en: "Branches and history" }
    kind: local-task
    minutes: 12
    objectives:
      - "Create and switch branches, commit on each, and read git log --oneline --graph --all to say which commits each branch contains."
      - "Explain that a branch is a movable name for a commit and that HEAD marks the one you are on."
    subskills:
      - { family: P-02, skill: "branch/history", depth: intro }
    misconceptions: []
    prerequisites: [js-15-07-git-first-commit]
    glossary: [git-branch, head, commit-history]
    visual: { kind: git-graph, concept: "A commit graph where main and feature are labels on commits: each new commit moves only the checked-out branch's label forward, and HEAD follows whichever branch is checked out." }
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "In the synthetic repository, create a feature branch, commit twice, switch back to main and commit once, then predict and confirm the git log --oneline --graph --all picture." }
    retrieval:
      - { concept: "a name that points at a value instead of containing it", from: js-02-01-const-let }
  - id: js-15-09-merge-rebase-reading
    title: { uk: "Читаємо merge і rebase", en: "Reading merge and rebase" }
    kind: instructional
    minutes: 15
    objectives:
      - "Predict the history that a merge and a rebase of the same diverged branches produce, including which commits get new ids."
      - "Explain when a merge is a fast-forward and why rebasing commits that others already have is risky."
    subskills:
      - { family: P-02, skill: "local merge/rebase reading", depth: intro }
    misconceptions:
      - "Merge and rebase produce the same history, just with different commands."
      - "A rebased commit is the same commit, only moved to a new place."
    prerequisites: [js-15-08-branches-history]
    glossary: [fast-forward, merge-commit, rebase]
    visual: { kind: git-graph, concept: "The same diverged history (main gains C, feature has D and E) after git merge, with a new merge commit that has two parents, and after git rebase main, with D′ and E′ replayed on top of C under new ids; the step-through highlights which commits are new." }
    analogy: null
    practice:
      - { kind: predict, runtime: local-web, summary: "From the git log --graph output of two diverged branches in the synthetic repository, predict the graph after git merge feature and after git rebase main, including which commit ids change." }
      - { kind: debug, runtime: browser-js, summary: "Repair a seeded rebase(commits, ontoId) model that only re-parents the first commit and keeps the old ids, so every replayed commit gets a new id from its new parent and the input stays unchanged." }
      - { kind: run-change, runtime: local-web, summary: "In two disposable copies of the repository, run the merge in one and the rebase in the other and compare git log --oneline --graph with your prediction." }
      - { kind: write, runtime: local-web, summary: "Write a NOTES.md entry in the synthetic repository explaining in three sentences when you would merge, when you would rebase a local branch, and why shared commits are never rebased; commit it." }
    retrieval: []
  - id: js-15-10-resolve-conflicts
    title: { uk: "Розв’язуємо конфлікт", en: "Resolving a conflict" }
    kind: local-task
    minutes: 15
    objectives:
      - "Produce a merge conflict on purpose, read the conflict markers, write the correct combined content and complete the merge."
      - "Run the project's tests after resolving to prove the merged code still works."
    subskills:
      - { family: P-02, skill: "resolve conflicts", depth: intro }
    misconceptions: []
    prerequisites: [js-15-09-merge-rebase-reading, js-09-02-assertions]
    glossary: [merge-conflict, conflict-markers]
    visual: { kind: git-graph, concept: "Two branches change the same line of format.js; the merge stops with the file shown between <<<<<<<, ======= and >>>>>>> markers, and resolving and committing creates the merge commit with both parents." }
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "In the synthetic repository, merge two branches that both edit the same label function, resolve the markers by keeping both intents, run npm test and commit the merge; record git log --graph and the test output." }
    retrieval:
      - { concept: "assertions that prove behavior after a change", from: js-09-02-assertions }
  - id: js-15-11-undo-safely
    title: { uk: "Безпечно скасовуємо зміни", en: "Undo safely" }
    kind: local-task
    minutes: 12
    objectives:
      - "Choose the safe undo for each situation: git restore for unstaged edits, git restore --staged to unstage, git revert for a committed change, and git reflog to find a lost commit."
      - "Explain why git revert is safe on shared history while git reset --hard can destroy uncommitted work."
    subskills:
      - { family: P-02, skill: "undo safely", depth: intro }
    misconceptions: []
    prerequisites: [js-15-10-resolve-conflicts]
    glossary: [git-restore, git-revert, reflog]
    visual: { kind: git-graph, concept: "The same history before and after each undo: restore changes only the working tree, revert adds a new commit that cancels an old one, and reflog lists where HEAD has been so a commit lost by a reset can be found again." }
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "In a disposable copy of the synthetic repository, discard an edit with git restore, unstage a file, revert a committed bug, then reset a branch on purpose and recover the lost commit through git reflog; record each command's output." }
    retrieval: []
  - id: js-15-12-remotes-pr-review
    title: { uk: "Remotes, pull requests і навіщо потрібен review", en: "Remotes, pull requests and review rationale" }
    kind: instructional
    minutes: 15
    objectives:
      - "Push to and fetch from a remote, using a local bare repository as the remote so no account is needed, and predict what each clone sees."
      - "Review a seeded diff as a pull request: write comments that name a defect with its failing case, ask a question, and justify approve or request changes."
    subskills:
      - { family: P-02, skill: "remotes/PR review concepts", depth: intro }
      - { family: P-02, skill: "review rationale", depth: intro }
    misconceptions:
      - "git commit sends my work to the remote."
      - "Code review is about style and taste, not about correctness and intent."
    prerequisites: [js-15-11-undo-safely, js-09-01-why-tests]
    glossary: [remote-repository, git-push, git-fetch, pull-request, code-review]
    visual: { kind: diagram, concept: "Two local clones and a bare repository acting as the remote: a commit stays in clone A until push, fetch brings it into clone B's remote-tracking branch, and a pull-request box shows the diff, comments and the approve or request-changes decision between two branches." }
    analogy: null
    practice:
      - { kind: predict, runtime: local-web, summary: "Predict which commits a second clone sees before and after you push to a local bare repository used as the remote." }
      - { kind: run-change, runtime: local-web, summary: "Create the bare repository, add it as origin, push a branch, clone it into a second folder, commit and push there, then fetch the change back into the first clone." }
      - { kind: write, runtime: browser-js, summary: "Review a seeded diff of formatPrice: run the supplied tests against both versions in the sandbox, then write a defect comment with the failing case, one question and an approve or request-changes decision with its reason." }
    retrieval:
      - { concept: "which kind of test catches which defect", from: js-09-01-why-tests }
  - id: js-15-13-debug-broken-setup
    title: { uk: "Налагодження: зламаний скрипт, lockfile і конфігурація", en: "Debug: broken script, lockfile and config" }
    kind: local-task
    minutes: 15
    objectives:
      - "Diagnose why a supplied project fails to install or start: a misspelled script, a lockfile out of sync with package.json, an incompatible version range and a missing env value."
      - "Repair each problem from clean files and prove it with npm ci and npm test, without exposing a secret in output or commits."
    subskills:
      - { family: P-01, skill: "package scripts/manifest", depth: assess }
      - { family: P-01, skill: "package manager/lockfile", depth: assess }
      - { family: P-01, skill: "dependency/semver/security basics", depth: assess }
      - { family: P-01, skill: "build/env/config", depth: assess }
    misconceptions: []
    prerequisites: [js-15-12-remotes-pr-review]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "Create the seeded broken project (a strat script, a semver range ^8.0.0 that no version satisfies, a lockfile still pinned to the vulnerable 7.5.1, a required CURRENCY env value), commit it, then run npm ci, npm start and npm test and record each failure message before changing anything." }
      - { kind: debug, runtime: local-web, summary: "Correct the range to ^7.5.2 as the README requires, resync the lockfile with npm install after npm ci reports it out of sync, rename the start script, supply the env value from an uncommitted .env, then clone into a fresh folder and prove npm ci and npm test there." }
    retrieval: []
  - id: js-15-14-independent-git-lab
    title: { uk: "Самостійно: commit, конфлікт, review, відновлення", en: "Independent: commit, resolve, review, recover" }
    kind: assessment
    minutes: 35
    objectives:
      - "Without hints, make coherent commits on a branch, resolve a conflicting merge and prove it with tests, read a supplied rebase graph, recover a lost commit and push through a local remote."
      - "Review a seeded diff and justify the approve or request-changes decision in writing."
    subskills:
      - { family: P-02, skill: "status/diff/stage/commit", depth: assess }
      - { family: P-02, skill: "branch/history", depth: assess }
      - { family: P-02, skill: "local merge/rebase reading", depth: assess }
      - { family: P-02, skill: "resolve conflicts", depth: assess }
      - { family: P-02, skill: "undo safely", depth: assess }
      - { family: P-02, skill: "remotes/PR review concepts", depth: assess }
      - { family: P-02, skill: "review rationale", depth: assess }
    misconceptions: []
    prerequisites: [js-15-13-debug-broken-setup]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "Assessment exercise without hints: review a seeded dueCount pull request that switches <= to <, supply the failing case, the correct count, a defect comment, a question and a request-changes decision with its reason." }
      - { kind: independent, runtime: local-web, summary: "No-hint lab on a supplied synthetic repository: two focused commits on a branch, a merge with a conflicting main resolved with passing tests, an explanation of a supplied rebase graph, a reset commit recovered through reflog, a push to a local bare remote, and a written review of a seeded diff; record the outputs as evidence." }
    retrieval: []
  - id: js-15-15-capstone-local-home
    title: { uk: "Проєкт: локальні інструменти й порожній репозиторій", en: "Capstone: local toolchain and empty repository" }
    kind: capstone-step
    minutes: 20
    objectives:
      - "Install the declared toolchain, create the capstone's local project folder with a README, initialize Git and make a first commit, while the capstone files stay in the platform until the JS-10 export."
    subskills:
      - { family: P-01, skill: "files/paths and shell navigation", depth: practice }
      - { family: P-02, skill: "status/diff/stage/commit", depth: practice }
    misconceptions: []
    prerequisites: [js-15-14-independent-git-lab]
    glossary: [readme]
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "Check node and git versions against the declared ones, create the project folder, write a README naming the capstone and its record fields, run git init, commit it, and record git log --oneline as evidence." }
    retrieval:
      - { concept: "the capstone's record fields and operations", from: js-04-13-capstone-records-crud }
