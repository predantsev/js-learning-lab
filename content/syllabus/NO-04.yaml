# Syllabus spine for NO-04. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: NO-04
stage: NO
title: { uk: "CRUD API: контракти, валідація й помилки", en: "A CRUD API: contracts, validation and errors" }
summary:
  uk: "Учень проєктує URL ресурсів і методи, перевіряє JSON-ввід на межі за схемою, відповідає стабільною моделлю помилок, сторінкує, фільтрує й сортує колекції, робить повтори ідемпотентними, версіонує контракт і доводить роботу типізованого CRUD API тестами через справжній HTTP."
  en: "The learner designs resource URLs and methods, validates JSON input at the edge against a schema, answers with a stable error model, pages, filters and sorts collections, makes retries idempotent, versions the contract and proves a typed CRUD API with tests over real HTTP."
competencies: [B-03]
capstoneStep:
  mode: local
  objective:
    uk: "Відкрити репозиторій проєкту як CRUD API зі схемною валідацією, стабільною моделлю помилок, пагінацією, фільтрацією й сортуванням, ідемпотентними повторами та версійованим контрактом."
    en: "Expose the capstone repository as a CRUD API with schema validation, a stable error model, pagination/filter/sort, idempotent retries and a versioned contract."
  variants:
    wishlist:
      uk: "/v1/records перевіряє name (1–80 символів), price (null або невід’ємне ціле) і category (null або до 30 символів), фільтрує за ?acquired=, сортує за name чи price зі сторінками за курсором, а повторений POST з тим самим Idempotency-Key створює лише одне бажання."
      en: "/v1/records validates name (1–80 characters), price (null or a non-negative whole number) and category (null or up to 30 characters), filters by ?acquired=, sorts by name or price with cursor pages, and a retried POST with the same Idempotency-Key creates one wish."
    planner:
      uk: "/v1/records перевіряє title, dueDate (null або YYYY-MM-DD) і priority (low, normal, high), фільтрує за ?done= і ?dueBefore=, сортує за dueDate так, що справи без терміну йдуть останніми, а повторений POST з тим самим Idempotency-Key створює лише одну справу."
      en: "/v1/records validates title, dueDate (null or YYYY-MM-DD) and priority (low, normal or high), filters by ?done= and ?dueBefore=, sorts by dueDate with undated tasks last, and a retried POST with the same Idempotency-Key creates one task."
    habits:
      uk: "/v1/records перевіряє name, frequency (daily або weekly) і completions (унікальні дати за зростанням), фільтрує за ?active=, сортує за name, а повторене додавання того самого дня до completions лишає один запис."
      en: "/v1/records validates name, frequency (daily or weekly) and completions (unique ascending dates), filters by ?active=, sorts by name, and retrying the request that adds the same day to completions leaves a single entry."
    expenses:
      uk: "/v1/records перевіряє label, amountMinor (додатне ціле), date і category (зі списку категорій), фільтрує за ?category= і діапазоном дат, сортує за date чи amountMinor, а повторений POST з тим самим Idempotency-Key записує лише одну витрату."
      en: "/v1/records validates label, amountMinor (a positive integer), date and category (from the category list), filters by ?category= and a date range, sorts by date or amountMinor, and a retried POST with the same Idempotency-Key records one expense."
# Retrieval plan: no-03-02-methods-status-headers-server (status) ; js-14-08-compile-time-vs-runtime (validation) ; js-05-05-sorting-comparator (sort) ; re-09-03-api-models-runtime-schemas (schemas)
lessons:
  - id: no-04-01-rest-boundaries
    title: { uk: "Межі REST і ресурси", en: "REST boundaries and resources" }
    kind: instructional
    minutes: 10
    objectives:
      - "Map list, read, create, replace, partial update and delete of records to resource URLs and methods, and predict the success status of each."
      - "Decide what belongs in the path, the query string and the body for a given operation, and justify the choice."
    subskills:
      - { family: B-03, skill: "REST boundaries", depth: intro }
    misconceptions:
      - "REST means every action gets its own verb-style URL such as /createRecord."
      - "PUT and PATCH are the same thing; both just update."
    prerequisites: [no-03-08-capstone-first-endpoint, no-03-02-methods-status-headers-server]
    glossary: [rest-resource, partial-update]
    visual: { kind: diagram, concept: "A resource map: the records collection and one record drawn as nodes, each method arrow labeled with its effect, whether it is safe and its expected status, highlighting as a sample request is sent." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the method, URL and success status for list, read one, create, replace, change one field and delete, and which of them are safe." }
      - { kind: run-change, runtime: isolated-node, summary: "Call the supplied in-memory records API in the Node child for each operation, then turn a /deleteRecord?id= route into DELETE /records/:id and compare." }
      - { kind: write, runtime: isolated-node, summary: "Write the route table for a synthetic notes resource with all six operations and their success and not-found statuses." }
    retrieval:
      - { concept: "queries versus mutations from the client’s side", from: re-06-04-queries-vs-mutations }
  - id: no-04-02-schema-validation
    title: { uk: "Валідація JSON за схемою на межі", en: "JSON schema validation at the edge" }
    kind: instructional
    minutes: 12
    objectives:
      - "Validate a request body against a schema at the edge, before it reaches the repository, collecting every field error rather than stopping at the first."
      - "Reject unknown fields, wrong types and out-of-range values, and explain why the validator hands on a parsed value instead of the raw input."
    subskills:
      - { family: B-03, skill: "JSON/schema validation", depth: intro }
    misconceptions:
      - "The client already validates the form, so the server can trust what arrives."
      - "Validation only means checking that the required fields are present."
    prerequisites: [no-04-01-rest-boundaries, no-03-03-routing-json-bodies]
    glossary: [edge-validation, parse-dont-validate]
    visual: { kind: diagram, concept: "A request body passes the edge validator’s checks (type, required, range, unknown key); each failed check adds an entry to the error list, and only a fully parsed value crosses the boundary into the repository." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the error list for five bodies: a valid record, a missing name, price as the string '45', an extra isAdmin field and a 300-character name." }
      - { kind: run-change, runtime: isolated-node, summary: "Post the five bodies to the server in the Node child, read the 400 responses, then tighten one rule and resend." }
      - { kind: write, runtime: isolated-node, summary: "Write validateNoteInput(body) returning { ok: true, value } or { ok: false, errors } for a synthetic notes schema, and call it before every create and update." }
    retrieval:
      - { concept: "the client checks responses with a runtime schema", from: re-09-03-api-models-runtime-schemas }
  - id: no-04-03-error-model
    title: { uk: "Стабільна модель помилок", en: "A stable error model" }
    kind: instructional
    minutes: 10
    objectives:
      - "Return every failure in one JSON shape (code, message key, field details, request id) with the matching HTTP status."
      - "Map validation, not-found, conflict and unexpected failures to stable codes in one central handler, without leaking stack traces."
    subskills:
      - { family: B-03, skill: "error model", depth: intro }
    misconceptions:
      - "The error message text is the contract, so clients should parse it."
      - "Sending error.stack to the client helps it debug."
    prerequisites: [no-04-02-schema-validation]
    glossary: [problem-details, api-error-code]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the status and error body for a TypeError thrown inside a handler behind a central catch, and what breaks when a client compares message text." }
      - { kind: run-change, runtime: isolated-node, summary: "Trigger the four failures against the server in the Node child, then route the TypeError through the central error handler and compare the bodies." }
      - { kind: write, runtime: isolated-node, summary: "Write toErrorResponse(error) that maps ValidationError, NotFoundError, ConflictError and anything else to a status plus { error: { code, messageKey, details } }." }
    retrieval:
      - { concept: "choosing the status for not-found and wrong-method", from: no-03-02-methods-status-headers-server }
  - id: no-04-04-pagination-filter-sort
    title: { uk: "Пагінація, фільтрація і сортування", en: "Pagination, filtering and sorting" }
    kind: instructional
    minutes: 12
    objectives:
      - "Apply filter, then a stable sort with a tie-breaker, then a page, in that order, and predict a page’s contents for given query parameters."
      - "Compare offset and cursor pagination when records are inserted between page requests, and validate limit against a maximum."
    subskills:
      - { family: B-03, skill: "pagination/filter/sort", depth: intro }
    misconceptions:
      - "Paging first and sorting afterwards gives the same result."
      - "Offset pagination never skips or repeats an item."
    prerequisites: [no-04-03-error-model, js-05-07-readable-chains]
    glossary: [pagination, cursor-pagination, offset-pagination]
    visual: { kind: pipeline, concept: "Twelve synthetic records flow through filter (status), sort (by name with id as tie-breaker) and page (limit 5 after a cursor); inserting a record between two requests shows the offset page repeating an item while the cursor page does not." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the ids on page 2 for ?status=open&sort=name&limit=5 with an offset and with a cursor, before and after a new record is inserted." }
      - { kind: run-change, runtime: isolated-node, summary: "Request the pages from the server in the Node child, insert a record between requests, then add an id tie-breaker to the sort and repeat." }
      - { kind: write, runtime: isolated-node, summary: "Write listRecords(query) that validates limit (1–50), filters, sorts with a tie-breaker and returns { items, nextCursor }." }
    retrieval:
      - { concept: "a comparator that returns a number, with a tie-breaker", from: js-05-05-sorting-comparator }
  - id: no-04-05-idempotency
    title: { uk: "Ідемпотентність", en: "Idempotency" }
    kind: instructional
    minutes: 10
    objectives:
      - "Classify GET, PUT, DELETE and POST as idempotent or not, and predict the stored state after each is sent twice."
      - "Implement an Idempotency-Key for POST so a retried create returns the original result instead of creating a duplicate."
    subskills:
      - { family: B-03, skill: "idempotency", depth: intro }
    misconceptions:
      - "A retry is safe as long as the client waits a little before sending it."
      - "Idempotent means the response is identical every time."
    prerequisites: [no-04-04-pagination-filter-sort, no-04-01-rest-boundaries]
    glossary: [idempotency-key]
    visual: { kind: sequence, concept: "Client, network and server over time: the first POST succeeds but its response is lost, the client retries with the same Idempotency-Key and the server returns the stored result instead of inserting a second record; the keyless run ends with two records." }
    analogy: "Like an order slip with a printed number: handing the same slip in twice gets you the first order’s receipt, not a second order (limit: it works only while the server remembers the number, and the same number on a different order must be refused, not silently accepted)."
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the record count after a POST whose response is lost is retried with and without the same Idempotency-Key, and after DELETE /records/:id is sent twice." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the retrying client against the server in the Node child with a fault injector that drops the first response, then add the key and compare." }
      - { kind: write, runtime: isolated-node, summary: "Write an idempotency store keyed by Idempotency-Key that saves the request hash, status and response, replays them on a retry and answers 422 when a key is reused with a different body." }
    retrieval:
      - { concept: "retrying a request that may already have succeeded", from: js-08-10-stale-responses-retry }
  - id: no-04-06-versioned-contracts
    title: { uk: "Версійовані контракти", en: "Versioned contracts" }
    kind: instructional
    minutes: 10
    objectives:
      - "Classify contract changes (an optional response field, a renamed field, stricter validation, a changed status) as compatible or breaking for existing clients."
      - "Serve a breaking change under /v2 while /v1 keeps its shape, and describe both in a typed contract module that the tests import."
    subskills:
      - { family: B-03, skill: "versioned contracts", depth: intro }
    misconceptions:
      - "Any change that compiles on the server is safe for clients."
      - "Versioning an API means bumping a number on every release."
    prerequisites: [no-04-05-idempotency]
    glossary: [api-versioning, compatible-change]
    visual: { kind: diagram, concept: "An old v1 client, a new v2 client and the server’s contract table: each proposed change is placed in a compatible or breaking lane, breaking ones appear only under /v2, and the old client’s request keeps matching /v1 at every step." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict which of five changes break an existing v1 client: an optional response field, a renamed field, a lower limit maximum, a new required input field and 404 changed to 410." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the v1 client test against the server in the Node child, apply the rename and watch it fail, then move the rename under /v2 and rerun both clients." }
      - { kind: write, runtime: isolated-node, summary: "Write a contract module exporting the v1 and v2 note shapes and a test that checks each route still returns its own version’s shape." }
    retrieval:
      - { concept: "semver majors signal breaking changes", from: js-15-04-install-lockfile-semver }
  - id: no-04-07-debug-contract-corruption
    title: { uk: "Налагодження: некоректний ввід псує дані; дубль при повторі", en: "Debug: invalid input corrupts data; duplicate retry" }
    kind: instructional
    minutes: 15
    objectives:
      - "Trace how an unvalidated PATCH stores a string price and a null name that break later reads, and move validation to the edge."
      - "Repair an error path that answers 500 with a stack and a retry path that creates duplicates, so both follow the error model and the idempotency rules."
    subskills:
      - { family: B-03, skill: "JSON/schema validation", depth: assess }
      - { family: B-03, skill: "error model", depth: assess }
      - { family: B-03, skill: "idempotency", depth: assess }
    misconceptions:
      - "If the repository saved it, the input must have been valid."
    prerequisites: [no-04-06-versioned-contracts]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Before running, predict the stored record after PATCH { price: '45', name: null } and the record count after a retried POST in the seeded API." }
      - { kind: run-change, runtime: isolated-node, summary: "Replay the seeded requests against the server in the Node child and match the corrupted record, the leaked stack and the duplicate to your prediction." }
      - { kind: debug, runtime: isolated-node, summary: "Repair the three defects — validate PATCH bodies at the edge, route the thrown error through toErrorResponse and honor the Idempotency-Key — without changing any valid response." }
    retrieval:
      - { concept: "compile-time types do not reject bad JSON", from: js-14-08-compile-time-vs-runtime }
  - id: no-04-08-independent-crud-api-tests
    title: { uk: "Самостійно: типізований CRUD API з тестами", en: "Independent: typed CRUD API with tests" }
    kind: assessment
    minutes: 35
    objectives:
      - "Implement, without hints, a typed CRUD API over a synthetic dataset with resource routes, pagination, filtering and sorting, request deadlines and a versioned contract."
      - "Write tests that start the server on a random loopback port and send real requests, including malformed JSON, oversized bodies, a page boundary, an aborted request and duplicate retries."
    subskills:
      - { family: B-03, skill: "REST boundaries", depth: assess }
      - { family: B-03, skill: "pagination/filter/sort", depth: assess }
      - { family: B-03, skill: "cancellation", depth: assess }
      - { family: B-03, skill: "versioned contracts", depth: assess }
    misconceptions: []
    prerequisites: [no-04-07-debug-contract-corruption]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: isolated-node, summary: "No-hint task: a typed synthetic notes API (/v1 plus one /v2 change) whose hidden checks send real loopback HTTP requests: malformed and oversized bodies, a page boundary, a deadline, a client abort and a retried POST." }
      - { kind: local-task, runtime: local-node, summary: "Write node:test tests that start the same API on port 0 and call it over real HTTP (413, page boundary, keyed retry, client abort), run node --test, record the report and show a test catching a removed body limit." }
    retrieval:
      - { concept: "boundary cases: empty, one, many", from: js-09-03-boundary-cases }
  - id: no-04-09-capstone-crud-api
    title: { uk: "Проєкт: CRUD API", en: "Capstone: CRUD API" }
    kind: capstone-step
    minutes: 40
    objectives:
      - "Expose the chosen capstone’s records as a /v1 CRUD API that reuses the shared domain validation at the edge, answers with the error model, pages, filters and sorts on the domain’s fields and makes creates idempotent."
    subskills:
      - { family: B-03, skill: "pagination/filter/sort", depth: practice }
    misconceptions: []
    prerequisites: [no-04-08-independent-crud-api-tests, no-03-08-capstone-first-endpoint]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-node, summary: "In server/, add /v1/records routes that reuse the shared validate* functions, map their errors to the error model and support the domain filter, sort, limit and cursor plus an Idempotency-Key on create." }
      - { kind: run-change, runtime: local-node, summary: "Start the server in your terminal, run the supplied curl script (create, retried create, invalid update, page 2) and record the responses and the stored file." }
    retrieval:
      - { concept: "the client’s typed record contract", from: re-09-09-capstone-typed-contracts }
