# Syllabus spine for NO-03. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: NO-03
stage: NO
title: { uk: "Справжній HTTP-сервер", en: "A real HTTP server" }
summary:
  uk: "Учень запускає сервер node:http на loopback, веде запит від надходження до res.end() з правильними методами, статусами й заголовками, маршрутизує запити й розбирає обмежені JSON-тіла, застосовує тайм-аути й реагує на скасування клієнтом, а також запускає, опитує, зупиняє й перезапускає справжній локальний сервер."
  en: "The learner starts a node:http server bound to loopback, carries a request from arrival to res.end() with correct methods, status codes and headers, routes requests and parses bounded JSON bodies, applies timeouts and reacts to client aborts, and starts, queries, stops and restarts a real local server."
competencies: [B-03]
capstoneStep:
  mode: local
  objective:
    uk: "Запустити справжній HTTP-сервер проєкту на loopback, який відповідає на GET /records даними з репозиторію; надіслати реальні запити, зупинити й перезапустити його."
    en: "Start a real loopback HTTP server for the capstone that answers GET /records from the repository; send real requests, stop and restart it."
  variants:
    wishlist:
      uk: "GET /records повертає збережені бажання з файлового репозиторію як JSON з name, price, acquired і category; невідомий шлях повертає JSON-помилку 404, а після перезапуску повертаються ті самі бажання."
      en: "GET /records returns the stored wishes from the file repository as JSON with name, price, acquired and category; an unknown path returns a 404 JSON error, and after a restart the same wishes come back."
    planner:
      uk: "GET /records повертає збережені справи як JSON з title, dueDate, done і priority; невідомий шлях повертає JSON-помилку 404, а після перезапуску повертаються ті самі справи."
      en: "GET /records returns the stored tasks as JSON with title, dueDate, done and priority; an unknown path returns a 404 JSON error, and after a restart the same tasks come back."
    habits:
      uk: "GET /records повертає збережені звички як JSON з name, frequency, active і completions; невідомий шлях повертає JSON-помилку 404, а після перезапуску повертаються ті самі звички."
      en: "GET /records returns the stored habits as JSON with name, frequency, active and completions; an unknown path returns a 404 JSON error, and after a restart the same habits come back."
    expenses:
      uk: "GET /records повертає збережені витрати як JSON з label, цілим amountMinor, date і category; невідомий шлях повертає JSON-помилку 404, а після перезапуску повертаються ті самі витрати."
      en: "GET /records returns the stored expenses as JSON with label, integer amountMinor, date and category; an unknown path returns a 404 JSON error, and after a restart the same expenses come back."
# Retrieval plan: js-16-02-http-methods-status-headers (HTTP) ; no-02-06-errors-handle-cleanup (cleanup) ; js-08-09-cancellation-abort (abort) ; js-16-04-same-origin-cors (origins)
lessons:
  - id: no-03-01-http-server-lifecycle
    title: { uk: "Справжній HTTP-сервер: життєвий цикл запиту й відповіді", en: "A real HTTP server: request/response lifecycle" }
    kind: instructional
    minutes: 12
    objectives:
      - "Start a node:http server on 127.0.0.1 with an explicit port, send it a request and trace the req and res objects from arrival to res.end()."
      - "Predict what the client sees when a handler never calls res.end(), and why returning from the handler sends nothing."
      - "Stop the server with server.close() and explain why the process stays alive while the server listens."
    subskills:
      - { family: B-03, skill: "request/response lifecycle", depth: intro }
    misconceptions:
      - "A handler is a function that returns the response, so returning a value sends it."
      - "The script is finished once its last line has run, even with a server listening."
    prerequisites: [no-01-04-event-loop-phases, js-16-02-http-methods-status-headers]
    glossary: [http-server, request-handler, bind-address]
    visual: { kind: sequence, concept: "Client, connection, server and handler over time: listen on 127.0.0.1:port, a connection opens, the handler receives req and res, writes the status line, headers and body, res.end() completes the response, and server.close() refuses new connections while the open one drains." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict what a fetch from the Node child receives from a handler that writes 'ok' but never calls res.end(), and whether the process exits after listen() returns." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the server in the Node child on loopback, request it with fetch, add res.end(), then call server.close() and observe when the process exits." }
      - { kind: write, runtime: isolated-node, summary: "Write a server that answers every request with plain text naming its method and URL, listening on the port from loadConfig." }
    retrieval:
      - { concept: "closing a handle on every path", from: no-02-06-errors-handle-cleanup }
  - id: no-03-02-methods-status-headers-server
    title: { uk: "Методи, статуси й заголовки на боці сервера", en: "Methods, status and headers on the server" }
    kind: instructional
    minutes: 12
    objectives:
      - "Set the status code and Content-Type explicitly for success, not-found, wrong-method and server-error cases, and predict the status each request receives."
      - "Answer a wrong method with 405 and an Allow header, and read request headers without depending on their letter case."
    subskills:
      - { family: B-03, skill: "methods/status/headers", depth: intro }
    misconceptions:
      - "A 200 with an error message in the body is fine, because clients read the text anyway."
      - "Headers can be set at any moment, even after the body has started."
    prerequisites: [no-03-01-http-server-lifecycle]
    glossary: [method-not-allowed, headers-sent-error]
    visual: { kind: sequence, concept: "Requests with different methods and paths reach the server; for each, the response’s status line and headers are drawn before any body bytes, and calling setHeader after the first write shows ERR_HTTP_HEADERS_SENT at that exact step." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the status and headers for GET /records, DELETE /records, GET /nope and a handler that throws, before sending them." }
      - { kind: run-change, runtime: isolated-node, summary: "Send the four requests from the Node child with fetch and print status and headers, then move a setHeader call after res.write and read the error." }
      - { kind: write, runtime: isolated-node, summary: "Write sendJson(res, status, value) that sets status, Content-Type and Content-Length and use it for every success and error response." }
    retrieval:
      - { concept: "status classes and what a client does with each", from: js-16-02-http-methods-status-headers }
  - id: no-03-03-routing-json-bodies
    title: { uk: "Маршрутизація і JSON-тіла запитів", en: "Routing and JSON bodies" }
    kind: instructional
    minutes: 12
    objectives:
      - "Route requests by method and pathname with new URL(req.url, base), extracting an id from the path and query parameters safely."
      - "Read a JSON request body chunk by chunk with a byte limit, answering an oversized body with 413 and malformed JSON with 400."
    subskills:
      - { family: B-03, skill: "request/response lifecycle", depth: practice }
    misconceptions:
      - "req.body already holds the parsed JSON, as in a framework."
      - "Comparing req.url with === is enough for routing, query string included."
    prerequisites: [no-03-02-methods-status-headers-server, js-16-01-url-query-encoding]
    glossary: [route-table, path-parameter, body-size-limit]
    visual: { kind: diagram, concept: "A routing table of method plus path patterns: each incoming request is parsed into method, pathname and searchParams, matched against the rows, and its body chunks are counted against the limit before JSON.parse ever runs." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict which route handles GET /records?status=active, GET /records/h-02, POST /records with a 64 KB body against a 16 KB limit (a body dozens of times over the limit can meet a reset connection instead of 413, measured) and POST /records with a truncated JSON body." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the router in the Node child, send the four requests with fetch, then lower the body limit, add a route and resend." }
      - { kind: write, runtime: isolated-node, summary: "Write readJsonBody(req, maxBytes) that collects chunks, stops at the limit with a 413 error and returns a parsed value or a 400 error." }
    retrieval:
      - { concept: "why a JSON POST from another origin is preflighted", from: js-16-04-same-origin-cors }
  - id: no-03-04-cancellation-timeouts-server
    title: { uk: "Скасування й тайм-аути на сервері", en: "Cancellation and timeouts on the server" }
    kind: instructional
    minutes: 10
    objectives:
      - "Detect a client that disconnected before the response finished and stop the pending work through an AbortController."
      - "Configure server.requestTimeout and headersTimeout plus a per-handler deadline, and predict what a slow client and a slow handler each experience."
    subskills:
      - { family: B-03, skill: "cancellation", depth: intro }
    misconceptions:
      - "When the browser cancels a fetch, the server stops working on that request automatically."
      - "A request with no timeout will eventually fail on its own."
    prerequisites: [no-03-03-routing-json-bodies, js-08-08-combinators-sequential-concurrent]
    glossary: [client-abort, handler-deadline]
    visual: { kind: sequence, concept: "Client, handler and a slow repository call over time: the client aborts, the server sees the response’s 'close' before 'finish', aborts its controller and the repository call rejects with AbortError, while the unguarded version keeps working and writes to a closed connection." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict whether an 800 ms handler still logs 'work finished' after the client aborts at 200 ms (timings scaled down for the 10 s runner budget), and whether a server with requestTimeout ends a request whose handler never answers." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the server and an aborting fetch client in the Node child, then pass the signal into the slow call, set requestTimeout to 1 s and observe both effects." }
      - { kind: write, runtime: isolated-node, summary: "Write withDeadline(ms, signal, work) for a handler that answers 503 on its own deadline and stops silently when the client aborts." }
    retrieval:
      - { concept: "AbortController signals cancellation; the callee must honor it", from: js-08-09-cancellation-abort }
  - id: no-03-05-start-stop-restart-local
    title: { uk: "Локально: запусти, надішли запити, зупини, перезапусти", en: "Start, request, stop, restart locally" }
    kind: local-task
    minutes: 20
    objectives:
      - "Start the tiny server in your own terminal on 127.0.0.1 with a configured port, send real requests with curl and a browser, and read status, headers and body."
      - "Stop it with Ctrl+C through a SIGINT handler that calls server.close(), meet EADDRINUSE on a busy port, restart it and confirm it answers again."
    subskills:
      - { family: B-03, skill: "request/response lifecycle", depth: practice }
    misconceptions: []
    prerequisites: [no-03-04-cancellation-timeouts-server]
    glossary: [sigint, address-in-use]
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-node, summary: "In your terminal: start the server, run curl -i for three routes, open one in the browser, stop it with Ctrl+C, start two copies to see EADDRINUSE, restart on a free port, and paste the curl output and the shutdown log as evidence." }
    retrieval:
      - { concept: "reading why a local process does not start", from: js-10-04-debug-local-run-failure }
  - id: no-03-06-debug-hanging-request
    title: { uk: "Налагодження: запит, що зависає, і неправильний статус", en: "Debug: a hanging request and a wrong status" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose a request that never completes because one branch forgets res.end() or awaits a promise that never settles."
      - "Repair handlers that answer validation and missing-record failures with 200 and an error message in the body."
    subskills:
      - { family: B-03, skill: "request/response lifecycle", depth: assess }
      - { family: B-03, skill: "methods/status/headers", depth: assess }
    misconceptions:
      - "If curl eventually times out, the server must be overloaded."
    prerequisites: [no-03-05-start-stop-restart-local]
    glossary: []
    visual: { kind: sequence, concept: "The seeded request replayed: the handler takes the not-found branch, never ends the response and the client waits until its own timeout; a second trace shows a 200 carrying an error body that the client treats as success." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Before running, mark which of four seeded routes hangs, which returns a misleading 200 and what status each should return." }
      - { kind: run-change, runtime: isolated-node, summary: "Send the four requests from the Node child with a 1-second client timeout (scaled down for the 10 s runner budget) and match each symptom to your prediction." }
      - { kind: debug, runtime: isolated-node, summary: "Repair the branch that never calls res.end(), the await that never settles and the 200-with-error responses, so every route ends with the correct status and a JSON body." }
    retrieval:
      - { concept: "a missing await and a promise that never settles", from: js-08-11-debug-async }
  - id: no-03-07-independent-tiny-server
    title: { uk: "Самостійно: маленький сервер і справжні запити", en: "Independent: a tiny server with real requests" }
    kind: assessment
    minutes: 30
    objectives:
      - "Build, without hints, a node:http server on loopback with three routes, correct methods, status codes and headers, a bounded JSON body and a clean shutdown."
      - "Prove its behavior with real HTTP requests from your machine, not by calling the handler function directly."
    subskills:
      - { family: B-03, skill: "request/response lifecycle", depth: assess }
      - { family: B-03, skill: "methods/status/headers", depth: assess }
    misconceptions: []
    prerequisites: [no-03-06-debug-hanging-request]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-node, summary: "No-hint task: a synthetic notes server with GET /notes, GET /notes/:id and POST /notes (bounded JSON body; 400, 404, 405 and 413 cases), bound to 127.0.0.1 with a SIGINT shutdown; the supplied check script sends real requests and you record its report." }
    retrieval:
      - { concept: "an HTTP error status versus a rejected fetch", from: js-16-09-debug-http-fetch-cors }
  - id: no-03-08-capstone-first-endpoint
    title: { uk: "Проєкт: перший endpoint", en: "Capstone: first endpoint" }
    kind: capstone-step
    minutes: 30
    objectives:
      - "Serve the chosen capstone’s records at GET /records from the file repository with correct status and headers, and show they come back unchanged after a restart."
    subskills:
      - { family: B-03, skill: "methods/status/headers", depth: practice }
    misconceptions: []
    prerequisites: [no-03-07-independent-tiny-server, no-02-09-capstone-file-persistence]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-node, summary: "In server/, add src/server.ts with GET /records reading from fileRepository, sendJson for every response and JSON 404/405 errors, bound to 127.0.0.1 on the port from loadConfig." }
      - { kind: run-change, runtime: local-node, summary: "Start it in your terminal, run curl -i for /records and an unknown path, stop and restart it, confirm the same records come back and record the output." }
    retrieval:
      - { concept: "the file repository with atomic writes", from: no-02-09-capstone-file-persistence }
