# Syllabus spine for RE-02. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RE-02
stage: RE
title: { uk: "Стан і події", en: "State and events" }
summary:
  uk: "Учень додає компонентам стан і обробники подій, передбачає стан як знімок окремого рендеру, ставить оновлення в чергу функціями-оновлювачами, незмінно оновлює масиви й об’єкти, обчислює похідні значення замість того, щоб дублювати їх, будує типізовані керовані поля та скидає або зберігає стан через ключі й позицію в дереві."
  en: "The learner adds state and event handlers to components, predicts state as a per-render snapshot, queues updates with updater functions, updates arrays and objects immutably, derives values instead of duplicating them, builds typed controlled inputs, and resets or preserves state with keys and tree position."
competencies: [P-05, R-02]
capstoneStep:
  mode: local
  objective:
    uk: "Зробити проєкт інтерактивним: керована форма створення й редагування, фільтр за статусом і незмінні оновлення списку зі стабільними ключами."
    en: "Make the capstone interactive: controlled create/edit form, status filter and immutable list updates with stable keys."
  variants:
    wishlist:
      uk: "Керована ItemForm створює й редагує бажання (назва, ціна, категорія), фільтр «бажане/отримане» читає поле acquired, а перемикання acquired незмінно замінює бажання в списку з ключами за id."
      en: "A controlled ItemForm creates and edits a wish (name, price, category), a wanted/acquired filter reads acquired, and toggling acquired replaces the wish immutably in a list keyed by id."
    planner:
      uk: "Керована TaskForm створює й редагує справу (назва, термін, пріоритет), фільтр «очікує/виконано» читає поле done, а перемикання done незмінно замінює справу в списку з ключами за id."
      en: "A controlled TaskForm creates and edits a task (title, dueDate, priority), a pending/done filter reads done, and toggling done replaces the task immutably in a list keyed by id."
    habits:
      uk: "Керована HabitForm створює й редагує звичку (назва, частота), фільтр «активні/на паузі» читає поле active, а позначка «виконано сьогодні» незмінно додає передану дату в completions у списку з ключами за id."
      en: "A controlled HabitForm creates and edits a habit (name, frequency), an active/paused filter reads active, and marking a habit done today immutably adds the passed-in date to completions in a list keyed by id."
    expenses:
      uk: "Керована ExpenseForm створює й редагує витрату (назва, сума в гривнях, що зберігається як ціле amountMinor, дата, категорія), фільтр за категорією звужує список, а редагування незмінно замінює витрату в списку з ключами за id."
      en: "A controlled ExpenseForm creates and edits an expense (label, an amount typed in UAH and stored as integer amountMinor, date, category), a category filter narrows the list, and edits replace the expense immutably in a list keyed by id."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-01-06-render-vs-commit (render/commit) ; js-04-10-immutable-updates (immutable updates) ; js-06-10-events-default-behavior (submit default) ; js-03-05-closures (closure over state)
lessons:
  - id: re-02-01-state-and-events
    title: { uk: "Стан і обробники подій", en: "State and event handlers" }
    kind: instructional
    minutes: 10
    objectives:
      - "Add a state variable with useState and change it from an onClick handler."
      - "Tell code that runs during render from code that runs in an event handler, and pass a handler instead of calling it."
    subskills:
      - { family: R-02, skill: "event vs render behavior", depth: intro }
    misconceptions:
      - "onClick={toggle()} and onClick={toggle} do the same thing."
      - "A plain let variable inside the component keeps its value between renders."
    prerequisites: [re-01-07-purity-in-render, js-06-10-events-default-behavior]
    glossary: [state-variable, use-state, state-setter, event-handler-prop]
    visual: { kind: render-timeline, concept: "A click on a status toggle traced through the event handler, the setter call that requests a re-render, the next render reading the new state value and the commit of the changed label; a plain let variable is shown resetting at the start of every render." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what a toggle button shows after two clicks when the flag is a plain let variable versus useState, and what happens with onClick={toggle()}." }
      - { kind: run-change, runtime: browser-react, summary: "Run both versions with render logs, then fix the handler so it is passed rather than called during render." }
      - { kind: write, runtime: browser-react, summary: "Write a status toggle for one fixture record that flips a boolean state and shows the matching label." }
    retrieval:
      - { concept: "what triggers a re-render and what the commit changes", from: re-01-06-render-vs-commit }
  - id: re-02-02-state-snapshots
    title: { uk: "Стан — це знімок кожного рендеру", en: "State is a snapshot per render" }
    kind: instructional
    minutes: 15
    objectives:
      - "Predict the value a handler reads right after calling the setter, including setCount(count + 1) called three times in one handler."
      - "Explain why an alert or a timeout scheduled in a handler shows the state of the render it was created in."
      - "Trace two consecutive renders and name the snapshot each handler closed over."
    subskills:
      - { family: R-02, skill: "state snapshots", depth: intro }
    misconceptions:
      - "setState changes the variable immediately, so the next line already reads the new value."
      - "A setTimeout started in a handler will see the latest state when it finally fires."
    prerequisites: [re-02-01-state-and-events, js-03-05-closures]
    glossary: [state-snapshot]
    visual: { kind: render-timeline, concept: "Each render drawn as a frozen frame holding its own count; clicking +3 shows three setCount(count + 1) calls all reading 0 from the same frame, the queued result 1, and the next frame rendered with count = 1 while a pending timeout still holds frame 0." }
    difficultConcept: render-state-snapshot
    analogy: "Each render is a printed photo of the state: everything made during that render — the JSX, the handlers, a scheduled timeout — holds that photo, and calling the setter orders a new photo instead of redrawing the one in your hand (limit: a new photo is taken only when React re-renders the component, not on a timer and not when you read the variable again, and several orders placed in one event are developed together as a single photo)."
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict the count after one click on a handler that calls setCount(count + 1) three times, and what an alert(count) placed after those calls shows." }
      - { kind: run-change, runtime: browser-react, summary: "Run it with the snapshot timeline, then add a setTimeout that logs count three seconds later, click again in between and compare the logged value with the screen." }
      - { kind: write, runtime: browser-react, summary: "Write a delayed Send handler for a draft note that logs the text it captured, then type more before it fires and confirm the logged text is the snapshot." }
    retrieval:
      - { concept: "a function keeps the bindings of the place it was created", from: js-03-05-closures }
    # design note: analogy: a printed photo per render (limit: the next photo is taken only when React re-renders, not on a timer); misconception "setState changes the variable immediately"
  - id: re-02-03-updater-queue-batching
    title: { uk: "Функції-оновлювачі, черга й батчинг", en: "Updater functions, queues and batching" }
    kind: instructional
    minutes: 12
    objectives:
      - "Use the updater form setCount(c => c + 1) when the next state depends on the previous one, and predict the queued result."
      - "Predict the result of mixing a replacement value and updater functions in one handler."
      - "Explain that React batches the setter calls of one event into a single re-render."
    subskills:
      - { family: R-02, skill: "updater queues/batching", depth: intro }
    misconceptions:
      - "Every setter call triggers its own re-render immediately."
      - "setCount(count + 1) and setCount(c => c + 1) are always interchangeable."
    prerequisites: [re-02-02-state-snapshots]
    glossary: [updater-function, state-update-queue, batching]
    visual: { kind: render-timeline, concept: "The update queue for one click: each setter call appends a value or an updater function, the next render processes the queue in order starting from the snapshot value, and a single commit follows." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict the final count after one click for three setCount(c => c + 1) calls, and for setCount(5) followed by setCount(c => c + 1)." }
      - { kind: run-change, runtime: browser-react, summary: "Run both handlers with the queue view, then add a render log and confirm that one click produces exactly one re-render." }
      - { kind: write, runtime: browser-react, summary: "Write +1 and +5 quantity buttons for a record whose handlers use updater functions so that rapid clicks are never lost." }
    retrieval:
      - { concept: "passing a function that someone else calls later", from: js-03-06-higher-order-callbacks }
  - id: re-02-04-immutable-updates-in-state
    title: { uk: "Незмінні оновлення стану", en: "Immutable updates in state" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain why mutating a state array or object and calling the setter with the same reference skips the re-render."
      - "Add, update and remove a record in state by returning new arrays and objects with spread, map and filter."
    subskills:
      - { family: R-02, skill: "immutable updates", depth: intro }
    misconceptions:
      - "Pushing into the state array and then calling setRecords(records) is enough for React to notice."
      - "Spreading the outer state object also copies the objects nested inside it."
    prerequisites: [re-02-03-updater-queue-batching, js-04-10-immutable-updates]
    glossary: [state-mutation]
    visual: { kind: memory-graph, concept: "State bindings pointing at heap objects: a mutating push keeps the same array reference, so React's Object.is comparison sees no change, while a spread update creates a new array that still shares the untouched record objects with the old one." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict whether the list updates when a handler pushes a new record and calls setRecords(records), and when it calls setRecords([...records, record])." }
      - { kind: run-change, runtime: browser-react, summary: "Run both handlers with the memory graph, then turn a toggle that sets record.done in place into one that maps to a new record object." }
      - { kind: write, runtime: browser-react, summary: "Write add, toggle-status and remove handlers for a fixture list that each produce a new array and keep unrelated records and fields unchanged." }
    retrieval:
      - { concept: "add, update and remove that return new arrays and objects", from: js-04-10-immutable-updates }
      - { concept: "a spread copy is shallow", from: js-04-08-copying-shallow-deep }
  - id: re-02-05-derived-values-not-state
    title: { uk: "Обчислюй, а не дублюй", en: "Derive, don't duplicate" }
    kind: instructional
    minutes: 10
    objectives:
      - "Identify state that can be computed from other state or props, and remove it."
      - "Compute a filtered list and its summary during render from the records and the selected filter instead of storing them."
    subskills:
      - { family: R-02, skill: "derived state", depth: intro }
    misconceptions:
      - "Every value shown on screen needs its own useState."
      - "Keeping a filteredRecords copy in state is faster than recomputing it on each render."
    prerequisites: [re-02-04-immutable-updates-in-state, js-05-04-reduce]
    glossary: [redundant-state, single-source-of-truth]
    visual: { kind: diagram, concept: "A data-flow diagram where records and the filter are the only state boxes and the visible list, count and total are computed arrows; adding a duplicated filteredRecords state box shows it drifting out of sync after an edit." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what the count shows after adding a record when the count lives in its own state and only the delete handler updates it." }
      - { kind: run-change, runtime: browser-react, summary: "Run the duplicated-state version, add and delete records to watch the drift, then delete the count state and compute it during render." }
      - { kind: write, runtime: browser-react, summary: "Write a filter control that stores only the selected status and derives the visible records and their summary on every render." }
    retrieval:
      - { concept: "filter returns the matching subset", from: js-05-02-filter-find }
  - id: re-02-06-controlled-inputs-typed-events
    title: { uk: "Керовані поля й типізовані події", en: "Controlled inputs and typed events" }
    kind: instructional
    minutes: 12
    objectives:
      - "Build a controlled input whose value comes from state and changes only through onChange."
      - "Type change and submit handlers (React.ChangeEvent<HTMLInputElement>, React.FormEvent<HTMLFormElement>) and prevent the default form submission."
      - "Keep the form draft as one typed object and validate it with the existing domain validator on submit."
    subskills:
      - { family: R-02, skill: "controlled inputs", depth: intro }
      - { family: P-05, skill: "typed props/state/events/hooks", depth: practice }
    misconceptions:
      - "An input with value but no onChange still lets the user type; React just watches it."
      - "React's onSubmit stops the browser's page reload by itself."
    prerequisites: [re-02-05-derived-values-not-state, js-06-01-forms-inputs-labels]
    glossary: [controlled-input, synthetic-event]
    visual: { kind: render-timeline, concept: "One keystroke traced: the browser input event, the typed onChange handler, the setter, the re-render with the new draft and the commit that writes the value back into the input; an input with value but no onChange shows the keystroke discarded." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what happens when typing into an input with value={draft.name} but no onChange, and when the form is submitted without preventDefault." }
      - { kind: run-change, runtime: browser-react, summary: "Run the form, add the typed onChange and onSubmit handlers, then give one handler a wrong event type and read the checker's error." }
      - { kind: write, runtime: browser-react, summary: "Write a typed create form for one record with a draft state object, labeled controlled inputs and a submit handler that calls the domain validator and shows its messages." }
    retrieval:
      - { concept: "the form's default submission and preventDefault", from: js-06-10-events-default-behavior }
      - { concept: "a validator that returns ok or errors", from: js-02-10-independent-validation }
  - id: re-02-07-reset-preserve-identity
    title: { uk: "Скидаємо й зберігаємо стан", en: "Reset and preserve state identity" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict whether a component's state survives a re-render from its position in the tree and its key."
      - "Reset an edit form when the selected record changes by giving it key={record.id}, while a filter elsewhere keeps its state."
    subskills:
      - { family: R-02, skill: "reset/preserve identity", depth: intro }
    misconceptions:
      - "State belongs to the component's code, so passing a different record as a prop starts it fresh."
      - "Rendering the same component again always resets its state."
    prerequisites: [re-02-06-controlled-inputs-typed-events, re-01-05-keys-identity]
    glossary: [state-reset, tree-position]
    visual: { kind: diagram, concept: "The tree before and after selecting another record: an EditForm at the same position without a key keeps its old draft (same box, same state), while key={record.id} replaces the box and starts with fresh state." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict the draft shown in an EditForm after switching the selection from the first to the second fixture, with and without a key." }
      - { kind: run-change, runtime: browser-react, summary: "Run it, type a change, switch records to see the stale draft, then add key={selected.id} and repeat." }
      - { kind: write, runtime: browser-react, summary: "Write a record switcher that keeps the list filter's state across switches but resets the edit form for each record." }
    retrieval:
      - { concept: "an element replaced during an update loses its focus", from: js-06-12-focus-management }
    # design note: key resets
  - id: re-02-08-debug-stale-setter-derived
    title: { uk: "Налагодження: застарілий сетер і продубльований похідний стан", en: "Debug: stale setter and duplicated derived state" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose increments lost by setX(x + 1) in rapid or delayed updates and repair them with updater functions."
      - "Remove duplicated derived state that drifts out of sync and compute it during render instead."
    subskills:
      - { family: R-02, skill: "state snapshots", depth: assess }
      - { family: R-02, skill: "updater queues/batching", depth: assess }
      - { family: R-02, skill: "derived state", depth: assess }
    misconceptions:
      - "If the value is right after one slow click, the update logic is right."
    prerequisites: [re-02-07-reset-preserve-identity]
    glossary: []
    visual: { kind: render-timeline, concept: "The seeded run replayed render by render: snapshots show a delayed setCount(count + 1) reading an old value, and a duplicated total state diverging from the records it should mirror." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Before running, predict the count after three rapid clicks on a seeded +1 button that updates inside a setTimeout, and the total shown after deleting a record." }
      - { kind: run-change, runtime: browser-react, summary: "Run the seeded record list with the timeline and match each wrong number to the snapshot that produced it." }
      - { kind: debug, runtime: browser-react, summary: "Repair the stale setter with an updater function and replace the duplicated total and filtered-list state with values derived during render." }
    retrieval:
      - { concept: "a captured value that is no longer current", from: js-03-09-debug-captured-bindings }
  - id: re-02-09-independent-controlled-crud
    title: { uk: "Самостійно: керований CRUD зі стабільними ключами", en: "Independent: controlled CRUD with stable keys" }
    kind: assessment
    minutes: 30
    objectives:
      - "Build, without hints, a controlled create/edit/delete list with a status filter, immutable updates, stable keys and an edit form that resets for each selected record."
    subskills:
      - { family: R-02, skill: "immutable updates", depth: assess }
      - { family: R-02, skill: "controlled inputs", depth: assess }
      - { family: R-02, skill: "event vs render behavior", depth: assess }
      - { family: R-02, skill: "reset/preserve identity", depth: assess }
    misconceptions: []
    prerequisites: [re-02-08-debug-stale-setter-derived]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-react, summary: "No-hint task: a typed RecordManager with a controlled form, edit selection, delete and status filter; hidden checks fire rapid clicks, submit empty and invalid input, switch records mid-edit and reorder the list." }
    retrieval:
      - { concept: "an update that keeps unrelated fields", from: js-04-12-independent-records }
    # design note: no-hint; rapid updates and reset
  - id: re-02-10-capstone-state
    title: { uk: "Проєкт: інтерактивний стан", en: "Capstone: interactive state" }
    kind: capstone-step
    minutes: 30
    objectives:
      - "In the local capstone project, add a controlled create/edit form, the domain's status filter and immutable list updates keyed by record id, and confirm the behavior locally."
    subskills:
      - { family: R-02, skill: "immutable updates", depth: practice }
    misconceptions: []
    prerequisites: [re-02-09-independent-controlled-crud, re-01-10-capstone-components]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "In the local project, turn the RE-01 form shell into a controlled typed form, add the domain's status filter and implement create, edit, toggle-status and remove as immutable state updates keyed by id." }
      - { kind: run-change, runtime: local-web, summary: "Run the local dev script, try rapid toggles, an invalid submit and an edit followed by a record switch, and commit once you have confirmed that the list and the summary stay correct." }
    retrieval:
      - { concept: "the capstone's create, update and remove functions", from: js-04-13-capstone-records-crud }
