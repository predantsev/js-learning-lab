# Syllabus spine for JS-03. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-03
stage: JS
title: { uk: "Функції, області видимості та closures", en: "Functions, scope and closures" }
summary:
  uk: "Учень оголошує й викликає функції з параметрами за замовчуванням і rest-параметрами, пише стрілкові функції, відстежує області видимості й кадри викликів, пояснює та застосовує closures, передає callback-и у функції вищого порядку, відокремлює чисту логіку від побічних ефектів і пише обмежену рекурсію."
  en: "The learner defines and calls functions with default and rest parameters, writes arrow functions, traces scope and call frames, explains and uses closures, passes callbacks to higher-order functions, keeps logic pure and side effects separate, and writes bounded recursion."
competencies: [J-02, J-04]
capstoneStep:
  mode: in-platform
  objective:
    uk: "Винести логіку підписів, валідації та форматування свого проєкту в іменовані чисті функції та викликати їх зі сторінки."
    en: "Extract the capstone's label/validation/formatting logic into named pure functions and call them from the page."
  variants:
    wishlist:
      uk: "Чисті `formatItemLabel(item)` (назва, ціна або «без ціни», позначка «отримано» за acquired) і `validateItem(input)` (name — 1–80 символів після обрізання пробілів, price — null або невід’ємне число); сторінка лише викликає їх і показує результат."
      en: "Pure `formatItemLabel(item)` (name, price or “no price”, an “acquired” mark) and `validateItem(input)` (name 1–80 characters after trimming, price null or non-negative); the page only calls them and shows the results."
    planner:
      uk: "Чисті `formatTaskLabel(task)` (title, dueDate або «без терміну», priority) і `validateTask(input)` (title — 1–80 символів, priority — low, normal або high); сторінка лише викликає їх і показує результат."
      en: "Pure `formatTaskLabel(task)` (title, dueDate or “no due date”, priority) and `validateTask(input)` (title 1–80 characters, priority one of low/normal/high); the page only calls them and shows the results."
    habits:
      uk: "Чисті `formatHabitLabel(habit)` (name · щодня/щотижня, позначка «на паузі», коли active дорівнює false) і `validateHabit(input)` (name — 1–80 символів, frequency — daily або weekly); сторінка лише викликає їх і показує результат."
      en: "Pure `formatHabitLabel(habit)` (name · daily/weekly, a “paused” mark when active is false) and `validateHabit(input)` (name 1–80 characters, frequency daily or weekly); the page only calls them and shows the results."
    expenses:
      uk: "Чисті `formatAmount(amountMinor)` (цілі копійки → сума з двома знаками після коми для показу), `formatExpenseLabel(expense)` і `validateExpense(input)` (label — 1–80 символів, amountMinor — додатне ціле, category — зі списку); сторінка лише викликає їх."
      en: "Pure `formatAmount(amountMinor)` (integer minor units → a two-decimal display amount), `formatExpenseLabel(expense)` and `validateExpense(input)` (label 1–80 characters, amountMinor a positive integer, category from the list); the page only calls them."
# Retrieval plan: js-02-06-var-hoisting-tdz (block scope) ; js-02-05-if-else-switch (branching) ; js-01-03-arithmetic-precedence (expressions)
lessons:
  - id: js-03-01-functions-and-return
    title: { uk: "Функції: оголошуємо, викликаємо, повертаємо", en: "Functions: define, call, return" }
    kind: instructional
    minutes: 12
    objectives:
      - "Define a function with one parameter and call it with different arguments."
      - "Predict what a call evaluates to when the function returns a value, only logs it, or has no return (undefined)."
      - "Explain why the lines after a return statement do not run."
    subskills:
      - { family: J-04, skill: "return and arrow syntax", depth: intro }
    misconceptions:
      - "return prints the value to the console."
      - "A function runs at the moment it is defined."
    prerequisites: [js-02-01-const-let, js-02-05-if-else-switch]
    glossary: [function, parameter, argument, return-value, call-frame]
    visual: { kind: code-trace, concept: "Calling formatPrice(80) pushes a call frame holding the parameter binding, the highlighted line moves into the body, return hands the value back to the call site and the frame disappears; console output appears only where console.log is actually called." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the console output of a script that defines double(n), calls it twice and logs only one result, plus a variant whose body logs instead of returning." }
      - { kind: run-change, runtime: browser-js, summary: "Run the trace, delete the return keyword, run again and observe that the call now evaluates to undefined." }
      - { kind: write, runtime: browser-js, summary: "Write formatPrice(price) that returns a label such as 'Price: 80' or 'No price' via if/else, and use the returned value in two different places." }
    retrieval:
      - { concept: "a call is an expression whose value can join a bigger expression", from: js-01-03-arithmetic-precedence }
  - id: js-03-02-parameters-default-rest
    title: { uk: "Параметри: значення за замовчуванням, rest і arguments", en: "Parameters: defaults, rest, arguments" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict a parameter's value when its argument is missing, undefined, null or '', with and without a default."
      - "Collect any number of extra arguments with a rest parameter and read its length."
      - "Recognise the legacy arguments object in old code and say why a rest parameter replaces it."
    subskills:
      - { family: J-04, skill: "parameters/default/rest/arguments", depth: intro }
    misconceptions:
      - "A default parameter is used whenever the argument is falsy or null."
      - "Calling a function with fewer or more arguments than parameters is an error."
    prerequisites: [js-03-01-functions-and-return, js-02-04-nullish-optional-chaining]
    glossary: [default-parameter, rest-parameter, arguments-object]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the result of greet(name = 'guest') called with no argument, undefined, null and '', and of a two-parameter function called with one and with three arguments." }
      - { kind: run-change, runtime: browser-js, summary: "Run the calls, then replace the default with ?? inside the body and compare which inputs now give a different result." }
      - { kind: write, runtime: browser-js, summary: "Write makeLabel(name, unit = 'pcs') and countExtras(first, ...rest) that returns rest.length; call each with zero, one and three arguments." }
    retrieval:
      - { concept: "?? versus || for a missing value", from: js-02-04-nullish-optional-chaining }
  - id: js-03-03-arrow-functions
    title: { uk: "Стрілкові функції", en: "Arrow functions" }
    kind: instructional
    minutes: 8
    objectives:
      - "Rewrite a function declaration as an arrow function with a block body and with an implicit return."
      - "Repair an arrow that is meant to return an object literal but returns undefined because the braces are read as a block."
      - "Predict why an arrow stored in a const cannot be called before its line, while a function declaration can."
    subskills:
      - { family: J-04, skill: "return and arrow syntax", depth: practice }
    misconceptions:
      - "An arrow function with curly braces returns its last expression automatically."
      - "An arrow function stored in a const can be called above its definition, just like a function declaration."
    prerequisites: [js-03-02-parameters-default-rest, js-02-06-var-hoisting-tdz]
    glossary: [arrow-function, implicit-return, function-expression]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict what x => x * 2, () => { price: 1 } and () => ({ price: 1 }) return when called, and what happens when an arrow is called before its const line." }
      - { kind: run-change, runtime: browser-js, summary: "Run the four snippets, wrap the object literal in parentheses, then move the call below the const and read the TDZ error disappear." }
      - { kind: write, runtime: browser-js, summary: "Rewrite formatPrice and makeLabel from the previous lessons as arrows, using an implicit return only where the body is a single expression such as a ternary." }
    retrieval:
      - { concept: "a ternary is a single expression", from: js-02-03-truthiness-logic-ternary }
      - { concept: "TDZ for a const read before its line", from: js-02-06-var-hoisting-tdz }
  - id: js-03-04-scope-and-call-frames
    title: { uk: "Область видимості: хто що бачить", en: "Scope: who can see what" }
    kind: instructional
    minutes: 10
    objectives:
      - "Trace which binding each name resolves to by walking the scope chain outward from the current block or function."
      - "Explain why a function sees the variables of the place where it was written, not of the place it is called from (lexical scope)."
      - "Choose const or let for every binding of a function and keep each binding in the smallest scope that needs it."
    subskills:
      - { family: J-02, skill: "lexical/function/block scope", depth: practice }
      - { family: J-02, skill: "const/let and mutation distinction", depth: practice }
    misconceptions:
      - "A function can see the local variables of whoever calls it."
      - "The local variables of a function are shared between all of its calls."
    prerequisites: [js-03-03-arrow-functions, js-02-06-var-hoisting-tdz, js-02-07-shadowing-strict-mode]
    glossary: [scope, lexical-scope, scope-chain, global-scope]
    visual: { kind: code-trace, concept: "Nested scope boxes (global → function → block) with their bindings; each highlighted name lookup walks outward box by box until it finds a binding or throws a ReferenceError at the global box, and every new call creates a fresh function box." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the output of a function defined at the top level and called from inside another function that has a local variable with the same name." }
      - { kind: run-change, runtime: browser-js, summary: "Run the trace, move the inner function's definition inside the caller and observe that the lookup now resolves to a different binding." }
      - { kind: write, runtime: browser-js, summary: "Rewrite a provided label script that keeps everything in global let bindings so that each value lives as a const in the smallest function or block that uses it." }
    retrieval:
      - { concept: "block scope of let and const", from: js-02-06-var-hoisting-tdz }
  - id: js-03-05-closures
    title: { uk: "Closures: функції пам’ятають, де народилися", en: "Closures: functions remember their birthplace" }
    kind: instructional
    minutes: 15
    objectives:
      - "Predict the output of an inner function that reads an outer variable after the outer function has already returned."
      - "Explain with a memory diagram why two counters made by the same factory keep separate counts."
      - "Implement a small function factory whose returned function uses a captured value."
    subskills:
      - { family: J-04, skill: "closures and higher-order functions", depth: intro }
    misconceptions:
      - "When the outer function returns, its variables are gone, so the inner function can no longer use them."
      - "A closure copies the variable's value at the moment the inner function is created."
      - "Two functions made by the same factory share one set of captured variables."
    prerequisites: [js-03-04-scope-and-call-frames]
    glossary: [closure, lexical-environment, function-factory]
    visual: { kind: memory-graph, concept: "makeCounter() is called twice: each call creates its own environment box holding count, the returned function keeps an arrow to that box after the outer frame has left the stack, and each increment updates only the box its own arrow points to." }
    difficultConcept: scope-closure
    analogy: "A function leaves its birthplace carrying a backpack with links to the variables it was written next to, and wherever it is later called it can reach into that backpack; each call of the outer function packs a brand-new backpack (limit: the backpack holds live links to the bindings, not snapshots of their values — if an outer variable is reassigned later, the function sees the new value, and whatever the backpack links to stays in memory for as long as the function itself is reachable)."
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the logs of calling makeCounter() twice and incrementing the two counters a different number of times." }
      - { kind: run-change, runtime: browser-js, summary: "Run the memory graph, then reassign the captured outer variable after the inner function is created and observe that the closure reads the new value." }
      - { kind: write, runtime: browser-js, summary: "Write makeLabeler(prefix) that returns a function adding the captured prefix to a record name, and create two labelers with different prefixes." }
    retrieval:
      - { concept: "a name resolves to the nearest frame", from: js-02-07-shadowing-strict-mode }
  - id: js-03-06-higher-order-callbacks
    title: { uk: "Функції як значення: callback-и та функції вищого порядку", en: "Functions as values: callbacks and higher-order functions" }
    kind: instructional
    minutes: 12
    objectives:
      - "Pass a function as an argument and predict when and how many times the receiving function calls it."
      - "Tell passing a function (formatter) from passing the result of calling it (formatter())."
      - "Write a higher-order function that returns a new function built from the one it receives."
    subskills:
      - { family: J-04, skill: "closures and higher-order functions", depth: practice }
      - { family: J-04, skill: "callbacks", depth: intro }
    misconceptions:
      - "Passing fn and passing fn() as an argument mean the same thing."
      - "A callback runs at the place where it is written, not when the receiving function decides to call it."
    prerequisites: [js-03-05-closures, js-03-03-arrow-functions]
    glossary: [first-class-function, higher-order-function, callback]
    visual: { kind: code-trace, concept: "applyTwice(addFee, 100) is called: the trace shows the addFee function value travelling in as a parameter, a new frame appearing each time it is invoked inside, and each returned value flowing back out to the caller." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the results of applyTwice(double, 3), of applyTwice(double(3), 3) and of a formatter that is passed in but never called." }
      - { kind: run-change, runtime: browser-js, summary: "Run the trace, then pass a different formatter to formatWith(record, formatter) without editing formatWith itself." }
      - { kind: write, runtime: browser-js, summary: "Write formatWith(record, formatter), a short and a long label formatter for a synthetic record, and withSuffix(formatter, suffix) that returns a new formatter." }
    retrieval:
      - { concept: "choosing a branch from a value", from: js-02-05-if-else-switch }
  - id: js-03-07-pure-vs-side-effects
    title: { uk: "Чисті функції та побічні ефекти", en: "Pure functions and side effects" }
    kind: instructional
    minutes: 10
    objectives:
      - "Classify a function as pure or impure by checking whether it depends only on its inputs and changes nothing outside itself (logs, page writes, outer variables)."
      - "Refactor a function that reads and writes an outer variable into one that takes input and returns output."
      - "Explain why pure functions are easier to test and reuse, and where side effects still belong."
    subskills:
      - { family: J-04, skill: "pure/side effects", depth: intro }
    misconceptions:
      - "A function that does not call console.log is automatically pure."
      - "Side effects are bugs and a good program has none."
    prerequisites: [js-03-06-higher-order-callbacks, js-02-10-independent-validation]
    glossary: [pure-function, side-effect, deterministic]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of four functions return the same result when called twice with the same input: one reads an outer counter, one reads the current time, one logs, one is pure." }
      - { kind: run-change, runtime: browser-js, summary: "Run each function twice, then turn the outer counter into a parameter plus a return value and run again." }
      - { kind: write, runtime: browser-js, summary: "Split a provided showLabel(record) that builds a label and writes it to the page into a pure formatLabel(record) and a one-line page update." }
    retrieval:
      - { concept: "validate returns a result instead of printing", from: js-02-10-independent-validation }
  - id: js-03-08-recursion-base-case
    title: { uk: "Рекурсія і базовий випадок", en: "Recursion and the base case" }
    kind: instructional
    minutes: 12
    objectives:
      - "Identify the base case and the recursive case of a recursive function and predict the call-stack depth for a given input."
      - "Write a recursive function over a nested structure that stops at a base case and at a maximum depth."
      - "Explain the RangeError that appears when the base case is missing or never reached."
    subskills:
      - { family: J-04, skill: "recursion/base case", depth: intro }
    misconceptions:
      - "All recursive calls share one copy of the parameter."
      - "The base case is optional; it only makes recursion faster."
    prerequisites: [js-03-07-pure-vs-side-effects, js-03-04-scope-and-call-frames, js-02-05-if-else-switch]
    glossary: [recursion, base-case, recursive-case, call-stack, stack-overflow]
    visual: { kind: code-trace, concept: "countdown(3) and depthOf(box): each recursive call pushes a new frame with its own parameter onto the call stack until the base case returns, then the frames pop one by one carrying return values back, while a depth counter shows the bound." }
    analogy: "Nested matryoshka dolls: you open one doll after another until you reach the smallest one with nothing inside, then close them back in reverse order (limit: real dolls hand nothing back, whereas each recursive call returns a value to the call that opened it, and the call stack has a size limit that the dolls do not)."
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the console output and the maximum stack depth of countdown(3) and of sumTo(4)." }
      - { kind: run-change, runtime: browser-js, summary: "Run the trace, delete the base case, read the RangeError 'Maximum call stack size exceeded' and restore the base case." }
      - { kind: write, runtime: browser-js, summary: "Write depthOf(box) for nested { label, inner } boxes whose innermost inner is null, with a maxDepth guard that stops early." }
    retrieval:
      - { concept: "a base case is an if branch that returns", from: js-02-05-if-else-switch }
      - { concept: "reading an error name and message", from: js-01-05-reading-an-error }
  - id: js-03-09-debug-captured-bindings
    title: { uk: "Налагодження: захоплена змінна циклу й застарілі значення", en: "Debug: captured loop binding and stale values" }
    kind: instructional
    minutes: 12
    objectives:
      - "Diagnose why callbacks created in a prepared var loop all report the final value, and repair it with let."
      - "Repair a stale value caused by copying a field into a local binding when the closure was created, without changing the intended output."
      - "Explain for each repair which binding every closure points to."
    subskills:
      - { family: J-02, skill: "const/let and mutation distinction", depth: assess }
      - { family: J-02, skill: "lexical/function/block scope", depth: assess }
      - { family: J-04, skill: "closures and higher-order functions", depth: assess }
    misconceptions:
      - "Each callback remembers the value the loop counter had when the callback was created."
      - "Switching var to let fixes every closure bug."
    prerequisites: [js-03-08-recursion-base-case, js-03-05-closures]
    glossary: [per-iteration-binding, stale-closure]
    visual: { kind: memory-graph, concept: "Three callbacks made in a var loop all point at one shared i binding that ends at 3, while the let version shows three per-iteration bindings 0, 1 and 2, each captured by its own callback; a second panel shows a closure pointing at a copied name binding that no longer matches the updated record." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the three logs of callbacks created in a prepared three-step var loop and in the same loop with let (the loop is given, not written; loops proper come in JS-04)." }
      - { kind: run-change, runtime: browser-js, summary: "Run both versions in the memory graph and change var to let, counting how many i bindings exist." }
      - { kind: debug, runtime: browser-js, summary: "Repair two seeded defects without changing intended output: label callbacks from a var loop that all print the last record's name, and makeLabel(record) that copied record.name into a const at creation and shows a stale name after the record changes." }
    retrieval:
      - { concept: "var is function-scoped, let is block-scoped", from: js-02-09-debug-tdz-and-defaults }
  - id: js-03-10-independent-transforms
    title: { uk: "Самостійно: перевикористовувані перетворення й обмежений обхід дерева", en: "Independent: reusable transforms and a bounded tree walk" }
    kind: assessment
    minutes: 25
    objectives:
      - "Implement, without hints, small pure transforms with defaults and a rest parameter, and combine them through callback-taking helpers."
      - "Implement a recursive walk of a nested synthetic tree with a base case and a depth bound, and state its maximum stack depth."
    subskills:
      - { family: J-04, skill: "parameters/default/rest/arguments", depth: assess }
      - { family: J-04, skill: "return and arrow syntax", depth: assess }
      - { family: J-04, skill: "pure/side effects", depth: assess }
      - { family: J-04, skill: "recursion/base case", depth: assess }
      - { family: J-04, skill: "callbacks", depth: assess }
    misconceptions: []
    prerequisites: [js-03-09-debug-captured-bindings]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: write pure arrows trimName(name = ''), describe(name, ...tags) using tags.length, withFallback(fn, fallback) and compose(f, g); hidden checks call them with missing arguments and verify inputs are unchanged and nothing is logged." }
      - { kind: independent, runtime: browser-js, summary: "No-hint task: countNodes(node, maxDepth) over a nested { label, left, right } tree of synthetic categories; hidden fixtures include a null tree, a single node and a tree deeper than the bound." }
    retrieval:
      - { concept: "a missing value versus zero or an empty string", from: js-02-10-independent-validation }
  - id: js-03-11-capstone-extract-functions
    title: { uk: "Проєкт: виносимо чисті функції домену", en: "Capstone: extract pure domain functions" }
    kind: capstone-step
    minutes: 15
    objectives:
      - "Move the label and validation code of the previous capstone step into named pure format and validate functions and call them from the page script."
    subskills:
      - { family: J-04, skill: "pure/side effects", depth: practice }
    misconceptions: []
    prerequisites: [js-03-10-independent-transforms, js-02-11-capstone-labels-messages]
    glossary: [extract-function]
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: browser-js, summary: "In the capstone workspace, extract the inline label and message code into the domain's format and validate functions that return values, leaving the page script to call them and show the results." }
      - { kind: run-change, runtime: browser-js, summary: "Call each function on two fixture records and one invalid input in the console, then confirm the page output is unchanged from the previous step." }
    retrieval:
      - { concept: "the label and message script from the previous capstone step", from: js-02-11-capstone-labels-messages }
