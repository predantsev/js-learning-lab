# Syllabus spine for RE-12. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
# Runtime note: in-course entries keep browser-react (React components and tests that really run in the course);
# build, CI, dependency, preview-server and release work is local-web in the learner's own VS Code project.
unit: RE-12
stage: RE
title: { uk: "Production-збірка, CI та підсумковий іспит React", en: "Production build, CI and the React gate" }
summary:
  uk: "Учень створює й перевіряє локальну production-збірку, не допускає секретів у бандл, запускає lint, typecheck, тести й збірку як CI-конвеєр локально, версіонує артефакти й оновлення залежностей, планує статичну доставку з правилами кешу та відкатом, документує зміни й проводить їх рев’ю та проходить підсумковий іспит React: налагодження незнайомого коду й самостійне покращення."
  en: "The learner produces and verifies a local production build, keeps secrets out of the bundle, runs lint, typecheck, tests and build as a CI pipeline locally, versions artifacts and dependency updates, plans static delivery with cache rules and rollback, documents and reviews changes, and passes the cumulative React gate of unseen debugging and an independent enhancement."
competencies: [P-06, R-10]
capstoneStep:
  mode: local
  objective:
    uk: "Створити й перевірити локальну production-збірку React-проєкту, локально виконати кроки, еквівалентні CI, і написати план випуску з можливістю відкату."
    en: "Produce and verify a local production build of the React capstone, run the equivalent CI steps locally and write a reversible release/rollback plan."
  variants:
    wishlist:
      uk: "Зібрати й локально запустити список бажань; у зібраному застосунку перевірити CRUD, фільтр «хочу/отримано» й суму цін бажаного; позначити версію 1.0.0 і написати план відкату до попередньої збірки."
      en: "Build and serve the wishlist locally; on the built app verify CRUD, the wanted/acquired filter and the wanted-price total; tag version 1.0.0 and write a rollback plan that restores the previous build."
    planner:
      uk: "Зібрати й локально запустити планувальник; у зібраному застосунку перевірити CRUD, фільтр «у роботі/виконано» й лічильник справ на сьогодні для фіксованого дня; позначити версію 1.0.0 і написати план відкату до попередньої збірки."
      en: "Build and serve the planner locally; on the built app verify CRUD, the pending/done filter and the due-today count for a fixed day; tag version 1.0.0 and write a rollback plan that restores the previous build."
    habits:
      uk: "Зібрати й локально запустити трекер звичок; у зібраному застосунку перевірити CRUD, фільтр «активні/на паузі» та серії для фіксованого дня; позначити версію 1.0.0 і написати план відкату до попередньої збірки."
      en: "Build and serve the habit tracker locally; on the built app verify CRUD, the active/paused filter and streaks for a fixed day; tag version 1.0.0 and write a rollback plan that restores the previous build."
    expenses:
      uk: "Зібрати й локально запустити трекер витрат; у зібраному застосунку перевірити CRUD, фільтр за категорією й підсумки за категоріями, відформатовані з `amountMinor`; позначити версію 1.0.0 і написати план відкату до попередньої збірки."
      en: "Build and serve the expense tracker locally; on the built app verify CRUD, the category filter and per-category totals formatted from `amountMinor`; tag version 1.0.0 and write a rollback plan that restores the previous build."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-08-03-capstone-cp-re-enhancement (enhancement) ; js-15-06-build-env-sourcemaps (build/env) ; js-15-12-remotes-pr-review (review) ; re-09-07-debug-race-rollback-typed (typed) ; js-10-03-compare-and-inspect (source maps)
lessons:
  - id: re-12-01-production-build-env
    title: { uk: "Production-бандл, ресурси й межі env", en: "Production bundle, assets and env boundaries" }
    kind: local-task
    minutes: 15
    objectives:
      - "Produce a production build of the capstone locally and identify the HTML entry, the content-hashed JS and CSS assets and what differs from the dev server."
      - "Show which env values are inlined at build time and confirm that no private value reaches the bundle."
    subskills:
      - { family: P-06, skill: "production bundle/assets/env boundaries", depth: intro }
    misconceptions: []
    prerequisites: [re-08-03-capstone-cp-re-enhancement, js-15-06-build-env-sourcemaps]
    glossary: [production-build, content-hash, build-time-variable]
    visual: { kind: diagram, concept: "Source modules and env files flow into the bundler and out as index.html plus content-hashed assets; public-prefixed values are inlined into the JS chunk, other values are left out, and a private value read in client code is flagged as leaked." }
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "Run the production build in VS Code, list the output folder, search the bundle for one public and one placeholder private value, and record both results with the asset names." }
    retrieval:
      - { concept: "build, env/config and source maps", from: js-15-06-build-env-sourcemaps }
  - id: re-12-02-quality-checks-ci
    title: { uk: "Перевірки lint/type/unit/user і CI-конвеєри", en: "Lint/type/unit/user checks and CI pipelines" }
    kind: instructional
    minutes: 12
    objectives:
      - "Order lint, typecheck, unit and component tests, user-flow tests and the build into a pipeline and explain why each stage fails fast before the next."
      - "Read a sample CI workflow and reproduce each of its jobs locally with the same commands."
    subskills:
      - { family: P-06, skill: "lint/type/unit/user checks", depth: intro }
      - { family: P-06, skill: "CI pipeline reading/design", depth: intro }
    misconceptions:
      - "CI is a separate tool that tests things my local checks cannot."
      - "If the tests pass, lint and typecheck failures do not matter."
    prerequisites: [re-12-01-production-build-env, js-15-05-lint-format]
    glossary: [ci-pipeline, quality-gate]
    visual: { kind: diagram, concept: "A pipeline lint → typecheck → tests → build → artifact check; a seeded type error stops the run at its stage and the diagram greys out the later jobs that never ran." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict at which stage a supplied CI workflow stops for a seeded unused variable, a type error and a failing user-flow test, and which later jobs never run." }
      - { kind: run-change, runtime: browser-react, summary: "Run the sample project's lint, typecheck and test checks in the course runtime, break one type and one test, and watch which checks fail." }
      - { kind: write, runtime: browser-react, summary: "Write a user-flow test for the sample app's create flow that the pipeline's test stage will run, asserting only visible results." }
      - { kind: local-task, runtime: local-web, summary: "Write a CI workflow for the capstone whose jobs call your package.json scripts in order, then run each job's commands locally and record which stage stops on a seeded type error." }
    retrieval:
      - { concept: "lint and format", from: js-15-05-lint-format }
  - id: re-12-03-versions-artifacts-updates
    title: { uk: "Версії, артефакти й оновлення залежностей", en: "Versions, artifacts and dependency updates" }
    kind: instructional
    minutes: 10
    objectives:
      - "Stamp a build artifact with its release version and commit so any served copy can be traced back to its source."
      - "Plan a dependency update: read the changelog and the semver range, update on a branch, run every check and know how to revert."
    subskills:
      - { family: P-06, skill: "artifact/release version", depth: intro }
      - { family: P-06, skill: "dependency updates", depth: intro }
    misconceptions:
      - "The version in package.json tells me exactly which code is being served."
      - "Updating every dependency to the latest version at once is the safest way to stay secure."
    prerequisites: [re-12-02-quality-checks-ci, js-15-04-install-lockfile-semver]
    glossary: [build-artifact, release-version, dependency-update]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict, from a supplied package.json range and lockfile excerpt, which React version a clean install gets and which versions ^19.3.0 and ~19.3.0 allow." }
      - { kind: run-change, runtime: browser-react, summary: "Render a BuildInfo footer from injected build metadata, change the injected version and commit, and watch the footer and its test update." }
      - { kind: write, runtime: browser-react, summary: "Write BuildInfo with a test that it shows exactly the injected version and short commit and falls back to 'dev' when nothing is injected." }
      - { kind: local-task, runtime: local-web, summary: "On a branch, update one dev dependency, rerun lint, typecheck, tests and build, and compare the lockfile diff and output file names before merging or reverting." }
    retrieval:
      - { concept: "lockfiles and semver ranges", from: js-15-04-install-lockfile-semver }
  - id: re-12-04-static-delivery-rollback
    title: { uk: "Статична доставка, кеш і відкат", en: "Static delivery, cache and rollback" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain how content-hashed asset names plus an uncached index.html let browsers cache aggressively yet still pick up a new release."
      - "Plan a rollback that re-serves the previous artifact, and predict what a user with an open tab experiences during and after it."
    subskills:
      - { family: P-06, skill: "static delivery/cache/rollback", depth: intro }
    misconceptions:
      - "Rolling back means rebuilding the old commit and hoping it produces the same files."
      - "If assets are cached for a year, users can never get a new version."
    prerequisites: [re-12-03-versions-artifacts-updates, js-16-02-http-methods-status-headers, re-10-01-lazy-suspense]
    glossary: [static-hosting, cache-busting, release-rollback]
    visual: { kind: sequence, concept: "Browser, static server and release folders over time: v1's index.html references app.abc123.js; v2 is published with app.def456.js; a rollback re-points the current release to v1 while an open v2 tab requests a lazy module that no longer exists." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what an open tab on release v2 shows when it navigates to a lazy route after the server has been rolled back to v1." }
      - { kind: run-change, runtime: browser-react, summary: "Run the simulated release switcher in the course runtime, roll back while a tab is open and watch the failed module load reach the error boundary." }
      - { kind: write, runtime: browser-react, summary: "Write a ModuleLoadFallback for the lazy route that says a new version is available and offers a reload, with a behavior test." }
    retrieval:
      - { concept: "lazy modules are fetched on demand", from: re-10-01-lazy-suspense }
  - id: re-12-05-docs-review
    title: { uk: "Документація й рев’ю", en: "Docs and review" }
    kind: instructional
    minutes: 10
    objectives:
      - "Write a README section that lets a reviewer install, run, test and build the capstone from a clean clone."
      - "Review a pull request against a checklist (behavior, tests, types, accessibility, bundle and env, rollback note) and write comments that cite evidence."
    subskills:
      - { family: P-06, skill: "docs and review", depth: intro }
    misconceptions:
      - "Docs can wait until the end; the code explains itself."
      - "A code review is about style nits, not behavior or release risk."
    prerequisites: [re-12-04-static-delivery-rollback, js-15-12-remotes-pr-review, js-17-09-documentation-code-review]
    glossary: [release-notes]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which defects a reviewer should flag in a supplied React diff (missing cleanup, unlabeled icon button, private env value read in client code) before running it." }
      - { kind: run-change, runtime: browser-react, summary: "Run the diff's app and tests in the course runtime, confirm each flagged defect and rewrite your review comments to cite that evidence." }
      - { kind: write, runtime: browser-react, summary: "Write the fix for one flagged defect with a test, plus a release-notes entry describing the user-visible change." }
      - { kind: write, runtime: local-web, summary: "Write the capstone README's install, run, test and build section, follow it from a clean clone to check it, and review your own last pull request with the checklist." }
    retrieval:
      - { concept: "pull requests and review rationale", from: js-15-12-remotes-pr-review }
  - id: re-12-06-artifact-verification
    title: { uk: "Перевірка production-артефакту", en: "Verifying the production artifact" }
    kind: local-task
    minutes: 15
    objectives:
      - "Serve the production build locally, run the user-flow checks against it and compare behavior and data with the dev version."
      - "Map a production stack trace back to the original source line with the source map."
    subskills:
      - { family: R-10, skill: "production artifact verification", depth: intro }
    misconceptions: []
    prerequisites: [re-12-05-docs-review, js-10-03-compare-and-inspect]
    glossary: [preview-server]
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "Serve the built capstone on loopback with the preview command and run the CRUD/filter/persistence walk-through and user-flow tests against it — a different port is a different storage origin, so import or re-seed the data first — then trigger a seeded error and map its stack trace through the source map." }
    retrieval:
      - { concept: "compare behavior with DevTools; storage is per origin", from: js-10-03-compare-and-inspect }
  - id: re-12-07-cumulative-review
    title: { uk: "Підсумкове повторення React", en: "Cumulative React review" }
    kind: review
    minutes: 20
    objectives:
      - "Retrieve without notes the core React mechanisms of RE-01 to RE-11 and predict behavior in mixed snippets covering state, effects, data, performance, concurrency and the server boundary."
    subskills: []
    misconceptions: []
    prerequisites: [re-12-06-artifact-verification, re-08-01-checkpoint-review]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: review, runtime: browser-react, summary: "Mixed delayed-retrieval set from RE-01 to RE-11 answered before any hint: keys, snapshots, cleanup, reducers, routes, races, rollback, measured memoization, transitions, hydration causes and server-only code." }
      - { kind: predict, runtime: browser-react, summary: "Predict renders, commits and on-screen output for three short programs combining a transition, an effect with cleanup and an optimistic update." }
    retrieval:
      - { concept: "invalid transition, unchecked response and failed rollback", from: re-09-07-debug-race-rollback-typed }
      - { concept: "interruptible renders on one thread", from: re-10-03-concurrent-model }
  - id: re-12-08-gate-unseen-debug
    title: { uk: "Іспит: налагодження незнайомого React-коду", en: "Gate: unseen React debugging" }
    kind: assessment
    minutes: 30
    objectives:
      - "Diagnose and repair, without hints, defects in an unseen React app: a subscription without cleanup, a lint and a type failure that block the pipeline, and a production build broken by env and asset-path misuse."
      - "Identify the defect that fixture-backed tests hide and explain which real-browser run would reveal it."
    subskills:
      - { family: R-10, skill: "behavioral component/integration/user tests", depth: assess }
      - { family: R-10, skill: "effect cleanup", depth: assess }
      - { family: R-10, skill: "fixture vs browser E2E limits", depth: assess }
      - { family: P-06, skill: "production bundle/assets/env boundaries", depth: assess }
      - { family: P-06, skill: "lint/type/unit/user checks", depth: assess }
    misconceptions: []
    prerequisites: [re-12-07-cumulative-review]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-react, summary: "No-hint gate on an unseen synthetic React app: a subscription without cleanup, a component test that passes only because its fixture hides real-browser behavior, a lint failure and a type error; fix each and prove it with a check." }
      - { kind: debug, runtime: local-web, summary: "No-hint: the same app's production build is broken by a private env value read in client code and an asset path that only works on the dev server; fix both and show the served build works." }
    retrieval:
      - { concept: "what fixture tests cannot prove", from: re-08-02-what-the-checkpoint-checks }
  - id: re-12-09-gate-independent-e2e
    title: { uk: "Іспит: покращення, E2E та перевірка артефакту", en: "Gate: enhancement, E2E and artifact checks" }
    kind: assessment
    minutes: 45
    objectives:
      - "Build, without hints, a typed and keyboard-accessible enhancement to an unseen React project, add a real-browser end-to-end check, and produce and verify the production artifact."
      - "Write the CI workflow, release version, dependency-update note, cache-and-rollback plan and a review write-up that explains the state and data behavior of the code you wrote."
    subskills:
      - { family: R-10, skill: "typed UI", depth: assess }
      - { family: R-10, skill: "accessible routes", depth: assess }
      - { family: R-10, skill: "production artifact verification", depth: assess }
      - { family: R-10, skill: "cumulative explanation", depth: assess }
      - { family: P-06, skill: "CI pipeline reading/design", depth: assess }
      - { family: P-06, skill: "artifact/release version", depth: assess }
      - { family: P-06, skill: "dependency updates", depth: assess }
      - { family: P-06, skill: "static delivery/cache/rollback", depth: assess }
      - { family: P-06, skill: "docs and review", depth: assess }
    misconceptions: []
    prerequisites: [re-12-08-gate-unseen-debug]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-react, summary: "No-hint gate: add a typed, keyboard-accessible route with behavioral tests to an unseen synthetic project, and explain its state and data behavior in the review write-up." }
      - { kind: independent, runtime: local-web, summary: "No-hint: build the project, run a real-browser end-to-end check against the served artifact, stamp the release version, and write the CI workflow, a dependency-update note, a cache-and-rollback plan and the README changes." }
    retrieval:
      - { concept: "an independent enhancement under the CP-RE rubric", from: re-08-03-capstone-cp-re-enhancement }
  - id: re-12-10-capstone-production-build
    title: { uk: "Проєкт: production-збірка й план відкату", en: "Capstone: production build and rollback plan" }
    kind: capstone-step
    minutes: 30
    objectives:
      - "Produce, serve and verify the capstone's production build locally, run the CI-equivalent steps, and commit a reversible release and rollback plan that has been rehearsed once."
    subskills:
      - { family: P-06, skill: "production bundle/assets/env boundaries", depth: practice }
    misconceptions: []
    prerequisites: [re-12-09-gate-independent-e2e]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "In VS Code, run lint → typecheck → tests → build → preview walk-through, stamp the release version, and commit docs/release.md with the artifact name, cache rules for index.html versus hashed assets and the rollback steps." }
      - { kind: run-change, runtime: local-web, summary: "Rehearse the rollback: serve the previous build, confirm the app and data still work, switch back to the new build and record the result in docs/release.md." }
    retrieval:
      - { concept: "the capstone's typed contracts and rollback tests", from: re-09-09-capstone-typed-contracts }
