# Syllabus spine for RE-01. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RE-01
stage: RE
title: { uk: "Компоненти й рендеринг", en: "Components and rendering" }
summary:
  uk: "Учень пише типізовані функціональні компоненти на JSX, складає їх через props і children, рендерить умовний вміст і списки зі стабільними ключами, відрізняє render від commit і тримає рендер чистим, а також переносить наявний UI в компоненти, не чіпаючи доменних функцій."
  en: "The learner writes typed function components in JSX, composes them through props and children, renders conditional content and keyed lists, tells render from commit and keeps render pure — and migrates an existing UI into components without touching its domain functions."
competencies: [P-05, R-01]
capstoneStep:
  mode: local
  objective:
    uk: "Перенести UI проєкту в типізовані React-компоненти (список, картка, оболонка форми), не змінюючи чистих доменних функцій."
    en: "Migrate the capstone UI into typed React components (list, card, form shell) while keeping the pure domain functions untouched."
  variants:
    wishlist:
      uk: "ItemList рендерить ItemCard для кожного бажання з назвою, ціною (або «без ціни»), позначкою «отримано» й категорією через типізовані props, а поруч — оболонку форми ItemForm; доменні функції імпортуються без змін."
      en: "ItemList renders an ItemCard per wish showing name, price (or “no price”), acquired and category from typed props, next to an ItemForm shell; the domain functions are imported unchanged."
    planner:
      uk: "TaskList рендерить TaskCard для кожної справи з назвою, терміном (або «без терміну»), позначкою «виконано» й пріоритетом через типізовані props, а поруч — оболонку форми TaskForm; доменні функції імпортуються без змін."
      en: "TaskList renders a TaskCard per task showing title, dueDate (or “no due date”), done and priority from typed props, next to a TaskForm shell; the domain functions are imported unchanged."
    habits:
      uk: "HabitList рендерить HabitCard для кожної звички з назвою, частотою, позначкою «активна» й кількістю виконань через типізовані props, а поруч — оболонку форми HabitForm; доменні функції імпортуються без змін."
      en: "HabitList renders a HabitCard per habit showing name, frequency, active and the number of completions from typed props, next to a HabitForm shell; the domain functions are imported unchanged."
    expenses:
      uk: "ExpenseList рендерить ExpenseCard для кожної витрати з назвою, сумою (amountMinor, відформатованою лише для показу), датою й категорією через типізовані props, а поруч — оболонку форми ExpenseForm; доменні функції імпортуються без змін."
      en: "ExpenseList renders an ExpenseCard per expense showing label, amountMinor formatted only for display, date and category from typed props, next to an ExpenseForm shell; the domain functions are imported unchanged."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   js-06-13-render-list-from-data (render from data) ; js-14-02-modeling-domain-types (typed models) ; js-03-07-pure-vs-side-effects (purity) ; js-04-07-reference-identity (identity)
lessons:
  - id: re-01-01-why-components
    title: { uk: "UI як функція від даних: компоненти", en: "UI as a function of data: components" }
    kind: instructional
    minutes: 10
    objectives:
      - "Draw the component tree of a rendered page from its JSX and name the function behind each box."
      - "Write a function component that returns markup computed from a constant fixture list."
      - "Explain how a component differs from the hand-written render(records) function of JS-06: it returns a description of the UI and React updates the DOM."
    subskills:
      - { family: R-01, skill: "function components/purity", depth: intro }
    misconceptions:
      - "A component is an HTML snippet that React pastes into the page once, so later data changes still need manual DOM updates."
    prerequisites: [js-06-13-render-list-from-data, js-03-01-functions-and-return]
    glossary: [component, component-tree]
    visual: { kind: diagram, concept: "The component tree of a small record page (App → Header, RecordList → three RecordCard boxes) drawn beside its JSX; selecting a box highlights the function that returns it and the DOM nodes it produces." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Before running, sketch the component tree for a prepared App that renders a Header and three RecordCard calls, and predict how many card elements appear." }
      - { kind: run-change, runtime: browser-react, summary: "Run the App, change the fixture array the cards are built from and watch the page follow the data with no DOM code." }
      - { kind: write, runtime: browser-react, summary: "Write a Summary component that returns a heading and the record count computed from a constant fixture list." }
    retrieval:
      - { concept: "rendering a list by hand from a records array", from: js-06-13-render-list-from-data }
    # design note: component tree
  - id: re-01-02-jsx-rules
    title: { uk: "Правила JSX", en: "JSX rules" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict which JSX snippets compile and repair the rest: one root or a fragment, closed tags, className and htmlFor, camelCase attributes."
      - "Embed JavaScript expressions in JSX with {} and explain why statements such as if or for cannot go there."
    subskills:
      - { family: R-01, skill: "JSX rules", depth: intro }
    misconceptions:
      - "JSX is HTML written inside JavaScript, so any valid HTML is valid JSX."
      - "Curly braces in JSX can hold any JavaScript, including if statements and for loops."
    prerequisites: [re-01-01-why-components, js-01-06-html-elements-attributes]
    glossary: [jsx, jsx-fragment]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which of six snippets fail to compile: two sibling roots, an unclosed img, class instead of className, for instead of htmlFor, an if inside braces and a ternary inside braces." }
      - { kind: run-change, runtime: browser-react, summary: "Run the snippets, read each compiler error, then wrap the siblings in a fragment and replace the HTML attribute names with their JSX forms." }
      - { kind: write, runtime: browser-react, summary: "Convert a prepared HTML card (heading, image with alt, labeled value) into JSX that computes the label with a template literal inside {}." }
    retrieval:
      - { concept: "the ternary as an expression that produces a value", from: js-02-03-truthiness-logic-ternary }
    # design note: misconception "JSX is HTML"
  - id: re-01-03-props-children-typed
    title: { uk: "Props, children і типізовані props", en: "Props, children and typed props" }
    kind: instructional
    minutes: 12
    objectives:
      - "Pass data into a component through props and read them by destructuring the parameter."
      - "Type a component's props in a .tsx file (required, optional and children: ReactNode) and fix a call site that the checker rejects."
      - "Compose a Card wrapper that renders whatever children it is given."
    subskills:
      - { family: R-01, skill: "props/composition/children", depth: intro }
      - { family: P-05, skill: "typed props/state/events/hooks", depth: intro }
    misconceptions:
      - "A component can change its own props to update what it shows."
      - "A props type checks the data at runtime, so a malformed record from storage will be caught by it."
    prerequisites: [re-01-02-jsx-rules, js-14-05-functions-generics]
    glossary: [props, children-prop, tsx]
    visual: { kind: diagram, concept: "Props flowing down the tree: each arrow carries a typed props object from parent to child, and a children slot shows nested JSX passed through a Card wrapper unchanged." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what RecordCard shows when its optional category prop is omitted, and which of three call sites the TypeScript checker rejects." }
      - { kind: run-change, runtime: browser-react, summary: "Run the typed RecordCard, pass a number where the props type expects a string, read the checker error, then fix the call site instead of loosening the type." }
      - { kind: write, runtime: browser-react, summary: "Write a typed Card component that takes a title prop and children, and use it to wrap two RecordCard components." }
    retrieval:
      - { concept: "a domain record described by a type", from: js-14-02-modeling-domain-types }
      - { concept: "destructuring a parameter object", from: js-04-09-destructuring-spread }
  - id: re-01-04-conditional-list-rendering
    title: { uk: "Умовний рендеринг і рендеринг списків", en: "Conditional and list rendering" }
    kind: instructional
    minutes: 12
    objectives:
      - "Choose between an early return, a ternary and && for conditional output, and predict the stray 0 that count && … renders."
      - "Render an array of records as a list of components with map, and show an empty-state message when nothing matches."
    subskills:
      - { family: R-01, skill: "conditional/list rendering", depth: intro }
    misconceptions:
      - "{records.length && <RecordList />} renders nothing when there are no records."
      - "After map produces the elements, they still have to be appended to the page by hand."
    prerequisites: [re-01-03-props-children-typed, js-05-01-map]
    glossary: [conditional-rendering, list-rendering]
    visual: { kind: pipeline, concept: "The fixture records flow through filter, then map into RecordCard elements, then into the rendered list; switching the condition shows the output branch change to an empty-state paragraph." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict the output of {records.length && <RecordList />} for zero records and of a ternary that switches between an empty message and the list." }
      - { kind: run-change, runtime: browser-react, summary: "Run with the six fixtures, empty the array, see the stray 0 appear, then fix the condition with an explicit comparison." }
      - { kind: write, runtime: browser-react, summary: "Render only the records that match a status flag with filter and map, and show an empty-state message when none match." }
    retrieval:
      - { concept: "&& returns one of its operands", from: js-02-03-truthiness-logic-ternary }
  - id: re-01-05-keys-identity
    title: { uk: "Ключі та ідентичність", en: "Keys and identity" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain how React uses a key to match list items between renders."
      - "Predict which row keeps its typed text after a deletion or reorder when keys are indices versus record ids, and fix the key."
    subskills:
      - { family: R-01, skill: "stable keys and identity", depth: intro }
    misconceptions:
      - "The array index is a fine key because every index is unique."
      - "Keys only exist to silence a console warning."
    prerequisites: [re-01-04-conditional-list-rendering, js-04-07-reference-identity]
    glossary: [list-key, reconciliation]
    visual: { kind: diagram, concept: "Two renders side by side with arrows matching old and new list items by key: with index keys the arrows shift after a deletion and a row's typed text lands on the wrong record; with id keys each row stays with its record." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which row's note input keeps the typed text after deleting the first record, once with index keys and once with id keys." }
      - { kind: run-change, runtime: browser-react, summary: "Run the keyed list, type into a row, delete and reorder records, then switch the key from the index to record.id and repeat." }
      - { kind: write, runtime: browser-react, summary: "Key a list of RecordCard components by the opaque record id, using a fixture set with two equal names to show why names are bad keys." }
    retrieval:
      - { concept: "same identity versus equal contents", from: js-04-07-reference-identity }
    # design note: misconception "index is a fine key"
  - id: re-01-06-render-vs-commit
    title: { uk: "Render проти commit", en: "Render vs commit" }
    kind: instructional
    minutes: 12
    objectives:
      - "Describe the trigger → render → commit sequence and say which step touches the DOM."
      - "Predict which DOM nodes change on a re-render by comparing the previous and the next output."
    subskills:
      - { family: R-01, skill: "render/commit distinction", depth: intro }
    misconceptions:
      - "Every re-render rebuilds the page's DOM from scratch."
      - "If a component function ran, something on the screen must have changed."
    prerequisites: [re-01-05-keys-identity, js-06-08-dom-query-create-update]
    glossary: [render-phase, commit-phase, re-render]
    visual: { kind: render-timeline, concept: "The initial render and two re-renders on a timeline: each step shows which component functions were called, the JSX they returned and which DOM nodes the commit actually changed (highlighted) versus left untouched." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict how many times each component logs and which text nodes change when a prepared Next-fixture button swaps one record's price (its state code is explained in RE-02)." }
      - { kind: run-change, runtime: browser-react, summary: "Run with render logs and the DOM-change highlighter on, then make the button change a value that is not displayed and see functions run while nothing is committed." }
      - { kind: write, runtime: browser-react, summary: "Write a RecordRow component and use the render log and the highlighter to confirm that only the changed cell is committed when one field changes." }
    retrieval:
      - { concept: "updating one DOM node by hand", from: js-06-08-dom-query-create-update }
    # design note: misconception "re-render rewrites the DOM"
  - id: re-01-07-purity-in-render
    title: { uk: "Рендер має бути чистим", en: "Keep render pure" }
    kind: instructional
    minutes: 10
    objectives:
      - "Spot side effects in a component body (mutating a prop or an outer variable, writing to storage, random or clock values in the output) and explain why they break repeated renders."
      - "Move such work out of render: compute it from props, or defer it to an event handler (RE-02) or an effect (RE-03)."
    subskills:
      - { family: R-01, skill: "function components/purity", depth: practice }
    misconceptions:
      - "Render runs exactly once per visible change, so a side effect inside it also runs once."
      - "Sorting or mutating a prop array inside a component is harmless if the screen looks right."
    prerequisites: [re-01-06-render-vs-commit, js-03-07-pure-vs-side-effects]
    glossary: [render-purity]
    visual: { kind: render-timeline, concept: "Two renders of one component with identical props: the pure version returns identical output both times, while the impure version that pushes into a module-level array shows the array and the output growing with each render." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict the list shown after two renders of a component that pushes a “new” badge record into a module-level array during render." }
      - { kind: run-change, runtime: browser-react, summary: "Run the impure component with render logs, then derive the badge list from props and confirm that repeated renders produce the same output." }
      - { kind: write, runtime: browser-react, summary: "Rewrite a RecordList that sorts its records prop in place so it sorts a copy and leaves the parent's array untouched." }
    retrieval:
      - { concept: "pure function versus side effect", from: js-03-07-pure-vs-side-effects }
      - { concept: "sort changes the array it is called on", from: js-05-05-sorting-comparator }
  - id: re-01-08-debug-keys-side-effects
    title: { uk: "Налагодження: погані ключі й побічні ефекти в рендері", en: "Debug: bad keys and side effects in render" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose a list whose typed text jumps to another row after a deletion as a key defect and repair it with stable ids."
      - "Find and remove a render-time mutation and a render-time storage write without changing the visible output."
      - "Explain from the render/commit log why a component that rendered did or did not change the DOM."
    subskills:
      - { family: R-01, skill: "function components/purity", depth: assess }
      - { family: R-01, skill: "stable keys and identity", depth: assess }
      - { family: R-01, skill: "render/commit distinction", depth: assess }
    misconceptions:
      - "If the first render looks right, the component is correct."
    prerequisites: [re-01-07-purity-in-render]
    glossary: []
    visual: { kind: diagram, concept: "The seeded component tree annotated live: rows whose keys changed between renders flash, and components that touched outer data during render are tagged with the variable or storage key they changed." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Before running, mark which seeded defects (index key, Math.random key, in-place sort of a prop, storage write in render) show symptoms, and after which user action." }
      - { kind: run-change, runtime: browser-react, summary: "Run the seeded record list, delete and reorder rows, and match each symptom in the render/commit log to your prediction." }
      - { kind: debug, runtime: browser-react, summary: "Repair all four defects so typed text stays with its record, repeated renders give the same output and render writes nothing outside the component." }
    retrieval:
      - { concept: "lost focus and duplicated work after a DOM update", from: js-06-14-debug-dom-defects }
  - id: re-01-09-independent-migrate-ui
    title: { uk: "Самостійно: переносимо UI в компоненти", en: "Independent: migrate a UI into components" }
    kind: assessment
    minutes: 30
    objectives:
      - "Migrate, without hints, a prepared DOM-based record page into typed function components with props, children, conditional output and keyed lists, importing the existing pure domain functions unchanged."
    subskills:
      - { family: R-01, skill: "JSX rules", depth: assess }
      - { family: R-01, skill: "props/composition/children", depth: assess }
      - { family: R-01, skill: "conditional/list rendering", depth: assess }
      - { family: P-05, skill: "typed props/state/events/hooks", depth: practice }
    misconceptions: []
    prerequisites: [re-01-08-debug-keys-side-effects]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-react, summary: "No-hint task: turn a prepared render(records) + innerHTML page into App, RecordList, RecordCard and a Card wrapper with typed props; hidden checks confirm the domain module is unchanged and test an empty list, a missing optional field and a reorder." }
    retrieval:
      - { concept: "types are erased before the code runs", from: js-14-08-compile-time-vs-runtime }
    # design note: no-hint; preserve domain functions
  - id: re-01-10-capstone-components
    title: { uk: "Проєкт: компоненти", en: "Capstone: components" }
    kind: capstone-step
    minutes: 30
    objectives:
      - "In the local capstone project, replace the DOM rendering with typed list, card and form-shell components that call the existing domain functions unchanged, and confirm locally that the app shows the same records as before."
    subskills:
      - { family: R-01, skill: "props/composition/children", depth: practice }
    misconceptions: []
    prerequisites: [re-01-09-independent-migrate-ui, js-10-05-capstone-cp-js]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "In the local VS Code project, add React with a JSX/TSX build step, create the list, card and form-shell components with typed props and render the stored records through them; leave the domain module untouched." }
      - { kind: run-change, runtime: local-web, summary: "Run the project's local dev script, compare the page with the pre-migration version for every fixture, and commit once you have confirmed that both match." }
    retrieval:
      - { concept: "the strict TypeScript domain module of the capstone", from: js-14-11-capstone-typed-domain }
