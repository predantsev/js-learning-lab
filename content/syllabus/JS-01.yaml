# Syllabus spine for JS-01. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-01
stage: JS
title: { uk: "Перший код і перша сторінка", en: "First code and a first page" }
summary:
  uk: "Учень запускає й змінює маленькі вирази в браузері, читає перше повідомлення про помилку, розрізняє числа, текст, булеві значення, null і undefined, а також читає та редагує просту HTML-сторінку з заголовками, посиланнями, кнопками, зображеннями й таблицею."
  en: "The learner runs and changes tiny expressions in the browser, reads a first error message, tells numbers, text, booleans, null and undefined apart, and reads and edits a simple HTML page with headings, links, buttons, images and a table."
competencies: [J-01, W-01]
capstoneStep:
  mode: in-platform
  objective:
    uk: "Відкрити стартову сторінку свого проєкту: змінити її заголовок, додати одне підписане синтетичне значення та одне зображення з alt-текстом; запустити й перевірити результат."
    en: "Open the capstone starter page: change its title, add one labeled synthetic value and one image with alt text; run and inspect it."
  variants:
    wishlist:
      uk: "Сторінка «Список бажань» з заголовком, одним бажанням (назва й ціна як підписані значення) та зображенням-заглушкою з alt."
      en: "A “Wishlist” page with a heading, one wish (name and price as labeled values) and a placeholder image with alt text."
    planner:
      uk: "Сторінка «Планувальник» з заголовком, однією справою (назва й дата як підписані значення) та зображенням-заглушкою з alt."
      en: "A “Planner” page with a heading, one task (title and due date as labeled values) and a placeholder image with alt text."
    habits:
      uk: "Сторінка «Трекер звичок» з заголовком, однією звичкою (назва й частота як підписані значення) та зображенням-заглушкою з alt."
      en: "A “Habit tracker” page with a heading, one habit (name and frequency as labeled values) and a placeholder image with alt text."
    expenses:
      uk: "Сторінка «Трекер витрат» з заголовком, однією витратою (назва й сума як підписані значення) та зображенням-заглушкою з alt."
      en: "An “Expense tracker” page with a heading, one expense (label and amount as labeled values) and a placeholder image with alt text."
# Retrieval plan: first unit of the course — no retrieval from earlier units is required.
lessons:
  - id: js-01-01-code-runs
    title: { uk: "Що робить програма: запусти, зміни, подивись", en: "What a program does: run, change, see" }
    kind: instructional
    minutes: 8
    objectives:
      - "Run a prepared one-line program and point to where its output appears (preview and console)."
      - "Change one number in the program and predict how the output changes before running."
    subskills: []
    misconceptions:
      - "A program runs all at once and the computer 'understands' what I meant, not what I wrote."
    prerequisites: []
    glossary: [program, console, run]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Before running, commit to what the console will print for a prepared line such as a greeting plus a number." }
      - { kind: run-change, runtime: browser-js, summary: "Run the line, change the number, run again and compare the two outputs." }
      - { kind: write, runtime: browser-js, summary: "Write one line that prints your own short text to the console." }
    retrieval: []
  - id: js-01-02-numbers-and-text
    title: { uk: "Значення: числа й текст", en: "Values: numbers and text" }
    kind: instructional
    minutes: 10
    objectives:
      - "Distinguish a number from a string of digits by its quotes and by its behaviour under +."
      - "Write string literals with single and double quotes and explain when each is handy."
    subskills:
      - { family: J-01, skill: "primitive/reference values", depth: intro }
    misconceptions:
      - "'5' and 5 are the same value because they look the same on screen."
    prerequisites: [js-01-01-code-runs]
    glossary: [value, number, string, literal]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the console output of 5 + 5 versus '5' + '5' and of a string with an apostrophe inside." }
      - { kind: run-change, runtime: browser-js, summary: "Run the examples, swap quotes, add a number to a string and observe the result." }
      - { kind: write, runtime: browser-js, summary: "Print three values: a whole number, a decimal and a sentence containing quotes." }
    retrieval: []
  - id: js-01-03-arithmetic-precedence
    title: { uk: "Арифметика й порядок дій", en: "Arithmetic and precedence" }
    kind: instructional
    minutes: 10
    objectives:
      - "Evaluate expressions with + - * / % and parentheses in the same order JavaScript does."
      - "Explain why '1' + 2 gives '12' while 1 + 2 gives 3 (a first look at coercion, closed in JS-02)."
    subskills:
      - { family: J-01, skill: "arithmetic/logical/assignment/ternary precedence", depth: intro }
    misconceptions:
      - "Operators are applied strictly left to right, as written."
    prerequisites: [js-01-02-numbers-and-text]
    glossary: [expression, operator, precedence]
    visual: { kind: code-trace, concept: "Step-by-step evaluation of one expression: each step collapses the highest-precedence sub-expression and shows the intermediate value." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Commit to the value of 2 + 3 * 4, (2 + 3) * 4, 7 % 3 and '1' + 2 before running." }
      - { kind: run-change, runtime: browser-js, summary: "Run the expressions, then add parentheses to change one result on purpose." }
      - { kind: write, runtime: browser-js, summary: "Compute a total from three synthetic prices and a quantity using one expression." }
    retrieval: []
  - id: js-01-04-booleans-null-undefined
    title: { uk: "Так/ні, нічого і ще-не-задано", en: "Yes/no values, nothing and not-yet" }
    kind: instructional
    minutes: 10
    objectives:
      - "Produce true and false from comparisons and read the result of typeof for each primitive type."
      - "Tell null (deliberately empty) from undefined (not assigned yet) in a trace."
    subskills:
      - { family: J-01, skill: "typeof and null/undefined", depth: intro }
      - { family: J-01, skill: "primitive/reference values", depth: practice }
    misconceptions:
      - "null and undefined are the same 'empty' value and behave identically everywhere."
      - "typeof null returning 'object' means null is an object."
    prerequisites: [js-01-03-arithmetic-precedence]
    glossary: [boolean, null, undefined, typeof, comparison]
    visual: { kind: diagram, concept: "A type table filled in live: each tried value lands in a row showing its typeof result and whether it is null, undefined or a real value." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict typeof for 3, 'three', true, null, undefined and the result of 3 > 2 and 'a' === 'b'." }
      - { kind: run-change, runtime: browser-js, summary: "Run the type table, then declare a value without assigning it and inspect it." }
      - { kind: write, runtime: browser-js, summary: "Write expressions that answer two yes/no questions about a synthetic record (is the price above 50, is the category missing)." }
    retrieval: []
  - id: js-01-05-reading-an-error
    title: { uk: "Читаємо повідомлення про помилку", en: "Reading an error message" }
    kind: instructional
    minutes: 8
    objectives:
      - "Locate the error name, message and line number in the console and jump to that line."
      - "Repair a typo and an unclosed string using only the error message as a guide."
    subskills: []
    misconceptions:
      - "An error means the whole program is wrong, not one specific place."
    prerequisites: [js-01-04-booleans-null-undefined]
    glossary: [error-message, syntax-error, reference-error]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Read a prepared error message and predict which line and which character caused it." }
      - { kind: run-change, runtime: browser-js, summary: "Run a program with an unclosed string, read the error, fix it and run again." }
      - { kind: debug, runtime: browser-js, summary: "Repair a seeded misspelled name (ReferenceError) and a missing quote (SyntaxError) in a three-line program." }
    retrieval: []
  - id: js-01-06-html-elements-attributes
    title: { uk: "Сторінка складається з елементів", en: "A page is made of elements" }
    kind: instructional
    minutes: 10
    objectives:
      - "Read an element as tag + attributes + content and name headings, paragraphs and the main landmark."
      - "Change the text and an attribute of an element and see the preview update."
    subskills:
      - { family: W-01, skill: "document structure/headings/landmarks", depth: intro }
    misconceptions:
      - "Heading tags are just bigger text; which one you pick does not matter."
    prerequisites: [js-01-05-reading-an-error]
    glossary: [element, tag, attribute, heading, landmark]
    visual: { kind: diagram, concept: "The page outline: nesting of main, headings and paragraphs shown as boxes that highlight when the matching markup is selected." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict how the preview changes when an h2 becomes an h1 and when a paragraph moves inside main." }
      - { kind: run-change, runtime: browser-js, summary: "Edit the text and the lang attribute of a minimal page and watch the preview." }
      - { kind: write, runtime: browser-js, summary: "Add a main landmark with one heading and two paragraphs to a blank page." }
    retrieval: []
  - id: js-01-07-links-buttons-images-tables
    title: { uk: "Посилання, кнопки, зображення, таблиці", en: "Links, buttons, images, tables" }
    kind: instructional
    minutes: 10
    objectives:
      - "Choose a link for navigation and a button for an action, and explain the difference to a keyboard user."
      - "Add an image with meaningful alt text and a small table with a header row."
    subskills:
      - { family: W-01, skill: "links/buttons", depth: intro }
      - { family: W-01, skill: "tables/images/alt", depth: intro }
    misconceptions:
      - "A link and a button are interchangeable as long as they look the same."
    prerequisites: [js-01-06-html-elements-attributes]
    glossary: [link, button, alt-text, table]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict what a screen reader announces for an image without alt and for a button labelled only by an icon." }
      - { kind: run-change, runtime: browser-js, summary: "Swap a button for a link and back; add alt text and observe the accessibility tree." }
      - { kind: write, runtime: browser-js, summary: "Build a two-row table of synthetic records with a header row and one image with alt text." }
    retrieval: []
  - id: js-01-08-css-selectors-text
    title: { uk: "Оформлюємо текст селекторами", en: "Styling text with selectors" }
    kind: instructional
    minutes: 10
    objectives:
      - "Write a CSS rule as selector + declarations and target elements by tag, class and id."
      - "Change colour, font size and alignment of text and explain which rule won."
    subskills: []
    misconceptions:
      - "Styles belong to the element where they are written; a selector cannot affect many elements at once."
    prerequisites: [js-01-07-links-buttons-images-tables]
    glossary: [selector, css-rule, class, declaration]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which paragraphs turn green when a class selector and a tag selector are added." }
      - { kind: run-change, runtime: browser-js, summary: "Edit a stylesheet live: change a colour, then change the selector so only one element is affected." }
      - { kind: write, runtime: browser-js, summary: "Style a heading and a highlighted value with two rules using a tag and a class selector." }
    retrieval: []
  - id: js-01-09-first-labeled-page
    title: { uk: "Самостійно: перша підписана сторінка", en: "Independent: your first labeled page" }
    kind: assessment
    minutes: 15
    objectives:
      - "Build, without hints, a small page with a heading, two labeled values computed from expressions and one image with alt text."
    subskills: []
    misconceptions: []
    prerequisites: [js-01-08-css-selectors-text]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: a page with a main heading, two values computed in a script and shown with labels, one styled class and one image with alt." }
    retrieval: []
  - id: js-01-10-capstone-starter-page
    title: { uk: "Проєкт: знайомство зі стартовою сторінкою", en: "Capstone: meet your starter page" }
    kind: capstone-step
    minutes: 15
    objectives:
      - "Inspect the chosen capstone's starter page, change its title and add a labeled synthetic value and an image with alt."
    subskills:
      - { family: W-01, skill: "document structure/headings/landmarks", depth: practice }
    misconceptions: []
    prerequisites: [js-01-09-first-labeled-page]
    glossary: [capstone, starter]
    visual: null
    analogy: null
    practice:
      - { kind: run-change, runtime: browser-js, summary: "Open the starter page (CP-START), change the heading to your project's name and run." }
      - { kind: write, runtime: browser-js, summary: "Add one labeled synthetic value from the domain fixtures and one image with alt text; keep the main landmark." }
    retrieval: []
