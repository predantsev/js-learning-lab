# Syllabus spine for RE-08. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
# Teaching order: RE-08 (CP-RE) comes after RE-09, RE-10 and RE-11.
unit: RE-08
stage: RE
title: { uk: "Контрольна точка CP-RE", en: "Checkpoint CP-RE" }
summary:
  uk: "Учень відтворює ключові механізми JS і React після перерви, без підказок додає до проєкту одне покращення, перевіряє React-проєкт локально у VS Code зі збереженими даними CP-JS, пояснює поведінку state-знімків і closures у власному коді та виправляє закладену регресію разом із тестом."
  en: "The learner retrieves core JS and React mechanisms after a delay, builds one capstone enhancement without hints, verifies the React capstone locally in VS Code with CP-JS data retained, explains state-snapshot and closure behaviour in their own code, and repairs a seeded regression with a test."
competencies: [R-10]
capstoneStep:
  mode: local
  objective:
    uk: "CP-RE: без підказок додати одне покращення, перевірити React-проєкт у VS Code зі збереженими даними й пояснити поведінку state і closures у власному коді."
    en: "CP-RE: build one enhancement without hints, verify the React capstone in VS Code with retained data, and explain state/closure behavior in your own code."
  variants:
    wishlist:
      uk: "Покращення: маршрут категорій, що групує бажання за `category` і показує суму цін бажаного в кожній категорії, доступний із клавіатури й перевірений тестами як дії користувача; бажання, збережені в CP-JS, завантажуються без змін."
      en: "Enhancement: a category route grouping items by `category` with each category's wanted-price total, keyboard-reachable and tested as user actions; items saved in CP-JS load unchanged."
    planner:
      uk: "Покращення: маршрут прострочених справ — невиконані справи з `dueDate` раніше за переданий день, відсортовані за `priority`, доступний із клавіатури й перевірений тестами як дії користувача; справи, збережені в CP-JS, завантажуються без змін."
      en: "Enhancement: an overdue route listing pending tasks whose `dueDate` is before the given day, sorted by `priority`, keyboard-reachable and tested as user actions; tasks saved in CP-JS load unchanged."
    habits:
      uk: "Покращення: маршрут деталей звички зі списком дат із `completions` і поточною серією для переданого дня, доступний із клавіатури й перевірений тестами як дії користувача; звички, збережені в CP-JS, завантажуються без змін."
      en: "Enhancement: a habit detail route showing `completions` as a dated list with the current streak for a passed-in day, keyboard-reachable and tested as user actions; habits saved in CP-JS load unchanged."
    expenses:
      uk: "Покращення: маршрут місяця з підсумками за категоріями в `amountMinor` для обраного місяця за полем `date`, доступний із клавіатури й перевірений тестами як дії користувача; витрати, збережені в CP-JS, завантажуються без змін."
      en: "Enhancement: a month route with per-category totals in `amountMinor` for the month chosen from `date`, keyboard-reachable and tested as user actions; expenses saved in CP-JS load unchanged."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-02-02-state-snapshots (snapshot) ; re-03-03-dependencies-cleanup (cleanup) ; js-03-05-closures (closure) ; js-09-03-boundary-cases (boundaries) ; js-04-07-reference-identity (identity)
lessons:
  - id: re-08-01-checkpoint-review
    title: { uk: "Повторення перед контрольною точкою: відкладене пригадування JS і React", en: "Checkpoint review: delayed JS/React retrieval" }
    kind: review
    minutes: 20
    objectives:
      - "Recall without notes how state snapshots, closures, reference identity, effect cleanup and stale responses behave, and predict the output of short mixed JS/React snippets."
    subskills:
      - { family: R-10, skill: "cumulative explanation", depth: intro }
    misconceptions: []
    prerequisites: [re-02-02-state-snapshots, re-03-04-stale-closures-in-effects, js-04-07-reference-identity]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: review, runtime: browser-react, summary: "Delayed retrieval set answered before any hint: closures, reference identity, promise ordering, state snapshots, effect cleanup, races and optimistic rollback, drawn from JS-03/04/08 and RE-02/03/06." }
      - { kind: predict, runtime: browser-react, summary: "Predict the rendered count after three setCount(count + 1) calls in one handler, and what an interval created in an effect logs after two re-renders when its dependency list is empty." }
    retrieval:
      - { concept: "state is a snapshot per render", from: re-02-02-state-snapshots }
      - { concept: "two names, one object", from: js-04-07-reference-identity }
  - id: re-08-02-what-the-checkpoint-checks
    title: { uk: "Що перевіряє CP-RE", en: "What CP-RE checks" }
    kind: instructional
    minutes: 12
    objectives:
      - "Map each CP-RE criterion (behavioural tests, strict types, effect cleanup, accessible routes, retained CP-JS data) to the evidence that proves it."
      - "Explain what fixture-backed component tests can prove and what only an end-to-end run in a real browser can show."
    subskills:
      - { family: R-10, skill: "behavioral component/integration/user tests", depth: intro }
      - { family: R-10, skill: "typed UI", depth: intro }
      - { family: R-10, skill: "effect cleanup", depth: intro }
      - { family: R-10, skill: "accessible routes", depth: intro }
      - { family: R-10, skill: "fixture vs browser E2E limits", depth: intro }
    misconceptions:
      - "If CRUD works when I click through it, the checkpoint is passed."
      - "A passing component test with fixtures proves the app works in a real browser."
    prerequisites: [re-08-01-checkpoint-review, re-06-08-testing-user-actions]
    glossary: [checkpoint-rubric]
    visual: { kind: diagram, concept: "The CP-RE rubric as boxes, each linked to its evidence (test file, strict typecheck output, cleanup test under Strict Mode, keyboard route walk-through, CP-JS data loaded); a dashed line marks what fixture tests cannot prove without a real browser run." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which of five supplied pieces of evidence satisfy which rubric rows, and which row a fixture-only test cannot cover." }
      - { kind: run-change, runtime: browser-react, summary: "Run a sample project's checks in the course runtime, remove one effect cleanup and watch which rubric row turns red." }
      - { kind: write, runtime: browser-react, summary: "Write the evidence checklist for your own capstone: for each rubric row, the command, test or walk-through that proves it." }
    retrieval:
      - { concept: "boundary cases: empty, one, many, null", from: js-09-03-boundary-cases }
  - id: re-08-03-capstone-cp-re-enhancement
    title: { uk: "Контрольна точка CP-RE: самостійне покращення", en: "Capstone checkpoint CP-RE: independent enhancement" }
    kind: capstone-step
    minutes: 60
    objectives:
      - "Design and build, without hints, one capstone enhancement with strict types, cleaned-up effects, an accessible route and behavioural tests, keeping CP-JS data and the pure domain functions intact."
    subskills:
      - { family: R-10, skill: "behavioral component/integration/user tests", depth: assess }
      - { family: R-10, skill: "typed UI", depth: assess }
      - { family: R-10, skill: "effect cleanup", depth: assess }
      - { family: R-10, skill: "accessible routes", depth: assess }
    misconceptions: []
    prerequisites: [re-08-02-what-the-checkpoint-checks]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "Before coding, write a short enhancement plan in the repository: user story, affected routes, data and type changes, and the tests that will prove it." }
      - { kind: independent, runtime: local-web, summary: "No-hint build in VS Code: implement the enhancement with strict types, accessible route and focus behaviour, effect cleanup and behavioural tests; data saved by CP-JS must load unchanged and domain functions keep their signatures." }
    retrieval:
      - { concept: "the CP-JS export and its retained domain functions", from: js-10-05-capstone-cp-js }
  - id: re-08-04-verify-locally-explain
    title: { uk: "Перевірити CP-RE локально й пояснити state і closures", en: "Verify CP-RE locally and explain state/closure" }
    kind: local-task
    minutes: 25
    objectives:
      - "Run the React capstone from a clean install, confirm behaviour and retained data against the rubric, and record the evidence."
      - "Explain in your own words, pointing to lines in your code, one state-snapshot behaviour and one closure captured by an effect or handler."
    subskills:
      - { family: R-10, skill: "cumulative explanation", depth: assess }
    misconceptions: []
    prerequisites: [re-08-03-capstone-cp-re-enhancement]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "Clean install and run in VS Code (install from the lockfile, typecheck, tests, dev server); load data saved by CP-JS and record each rubric row's command and observed result in the repository." }
      - { kind: independent, runtime: local-web, summary: "Without hints, write the explanation: one handler that reads a state snapshot and one effect closure with its dependencies, each with file and line, and what would break if it changed." }
    retrieval:
      - { concept: "closures remember the bindings of their birthplace", from: js-03-05-closures }
  - id: re-08-05-debug-seeded-regression
    title: { uk: "Налагодження: закладена регресія", en: "Debug: a seeded regression" }
    kind: instructional
    minutes: 15
    objectives:
      - "Find, with a failing behavioural test, a seeded regression where an effect without cleanup duplicates a subscription and the list shows doubled rows."
      - "Repair it and add a test that would have caught it, with Strict Mode left on."
    subskills:
      - { family: R-10, skill: "behavioral component/integration/user tests", depth: assess }
      - { family: R-10, skill: "effect cleanup", depth: assess }
    misconceptions:
      - "Strict Mode's double effect run causes the bug, so turning Strict Mode off fixes it."
    prerequisites: [re-08-04-verify-locally-explain, re-03-05-strict-mode-rechecks]
    glossary: []
    visual: { kind: render-timeline, concept: "The seeded app under Strict Mode: mount, effect subscribes, simulated unmount with no cleanup, effect subscribes again; two subscriptions push each fixture update twice, shown as duplicated rows in the next commit." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict how many rows appear after one fixture update when the subscription effect has no cleanup under Strict Mode." }
      - { kind: run-change, runtime: browser-react, summary: "Run the seeded app and its failing test, read the timeline and confirm the duplicated subscription." }
      - { kind: debug, runtime: browser-react, summary: "Add the missing cleanup with Strict Mode on, and add a behavioural test asserting exactly one row per record after an update." }
    retrieval:
      - { concept: "cleanup runs before every re-run, not only at unmount", from: re-03-03-dependencies-cleanup }
