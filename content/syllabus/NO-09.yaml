# Syllabus spine for NO-09. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: NO-09
stage: NO
title: { uk: "Лабораторна з SQL: пов’язані таблиці", en: "SQL lab: related tables" }
summary:
  uk: "Учень моделює синтетичні пов’язані дані як таблиці з ключами й обмеженнями, запитує їх через join і агрегати, пише параметризовані запити, захищені від ін’єкцій, загортає багатокрокові зміни в транзакції з rollback, читає плани запитів до й після індексу, версіонує схему протестованими міграціями та seed і зважує файловий репозиторій проти реляційного."
  en: "The learner models synthetic related data as tables with keys and constraints, queries it with joins and aggregates, writes injection-safe parameterized statements, wraps multi-step changes in transactions that roll back, reads query plans before and after an index, versions the schema with tested migrations and seed data, and weighs a file repository against a relational one."
competencies: [B-04, B-05]
capstoneStep: null
capstoneStepReason:
  uk: "Обов’язкова окрема синтетична лабораторна з SQL на пов’язаних таблицях; вибір сховища для проєкту лишається відкритим і робиться в NO-05, де пишеться контракт схеми."
  en: "Required focused synthetic SQL lab on related tables; the capstone's storage choice stays open and is made in NO-05, where the schema contract is written."
# Retrieval plan: no-02-05-atomic-recoverable-updates (atomic) ; js-12-12-dedup-indexing (indexing) ; js-05-06-search-complexity (complexity) ; no-04-02-schema-validation (validation)
# Lab dataset (synthetic, node:sqlite): a small library with members, books and loans; unseen datasets are used in the independent lesson.
lessons:
  - id: no-09-01-tables-keys-relationships
    title: { uk: "Таблиці, ключі та зв’язки", en: "Tables, keys and relationships" }
    kind: instructional
    minutes: 12
    objectives:
      - "Model members, books and loans as tables with primary and foreign keys, and identify the one-to-many and many-to-many relationships between them."
      - "Explain why a loan stores memberId and bookId instead of copying member and book fields, and predict what copying would break on update."
    subskills:
      - { family: B-04, skill: "tables/keys/relationships", depth: intro }
    misconceptions:
      - "A table is just a JSON array, so nesting the books inside each member is the natural design."
      - "A foreign key is simply a column that happens to hold another table’s id."
    prerequisites: [no-04-09-capstone-crud-api, no-02-08-independent-file-repository]
    glossary: [primary-key, foreign-key, junction-table, relational-schema]
    visual: { kind: diagram, concept: "An entity diagram of members, books and loans: selecting one loan row highlights the member and book rows its foreign keys point to, and a denormalised variant shows the same member name copied into three rows that drift apart after one update." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict how many rows each table holds for the synthetic library fixture and which member and book rows a single loan refers to." }
      - { kind: run-change, runtime: isolated-node, summary: "Create the three tables with node:sqlite in the Node child, insert the fixture, then rename one member in the normalized schema and in a denormalised copy and compare." }
      - { kind: write, runtime: isolated-node, summary: "Write CREATE TABLE statements with primary and foreign keys for a synthetic students, clubs and memberships dataset." }
    retrieval:
      - { concept: "referring to one object instead of copying it", from: js-04-07-reference-identity }
  - id: no-09-02-select-join-group
    title: { uk: "SELECT, join, групування й агрегати", en: "SELECT, join, group and aggregate" }
    kind: instructional
    minutes: 12
    objectives:
      - "Write SELECT queries with WHERE, ORDER BY and LIMIT, and predict their rows for the library fixture."
      - "Join loans to members and books with INNER JOIN and LEFT JOIN, and predict which rows a LEFT JOIN keeps with NULLs."
      - "Count and sum per group with GROUP BY and HAVING, and explain why WHERE filters rows before grouping and HAVING filters groups after."
    subskills:
      - { family: B-04, skill: "SELECT/join/group/aggregate", depth: intro }
    misconceptions:
      - "A join attaches the other table once, so a member with three loans still appears in one row."
      - "WHERE and HAVING are interchangeable filters."
    prerequisites: [no-09-01-tables-keys-relationships]
    glossary: [inner-join, left-join, group-by, aggregate-function]
    visual: { kind: pipeline, concept: "Loan rows flow through FROM/JOIN (rows multiply per match), WHERE (rows removed), GROUP BY (rows bucketed per member) and SELECT with COUNT and SUM (one row per bucket), showing the intermediate table after each clause." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the rows of a LEFT JOIN from members to open loans, including members with no loans, and the counts from GROUP BY memberId." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the queries with node:sqlite in the Node child, swap LEFT JOIN for INNER JOIN, move a condition from WHERE to HAVING and compare the results." }
      - { kind: write, runtime: isolated-node, summary: "Write one query listing each member’s name with their number of open loans, zero included, ordered by count and then by name." }
    retrieval:
      - { concept: "folding a list into one value", from: js-05-04-reduce }
  - id: no-09-03-crud-constraints-nulls
    title: { uk: "CRUD, обмеження і NULL", en: "CRUD, constraints and NULL" }
    kind: instructional
    minutes: 12
    objectives:
      - "Write INSERT, UPDATE and DELETE statements and predict the rows affected, including an UPDATE without WHERE."
      - "Enforce NOT NULL, UNIQUE, CHECK and FOREIGN KEY constraints (foreign keys switched on per connection with PRAGMA foreign_keys = ON) and read the error each violation raises."
      - "Predict three-valued logic: why returnedOn = NULL matches nothing and IS NULL is required."
    subskills:
      - { family: B-04, skill: "CRUD/constraints/nulls", depth: intro }
    misconceptions:
      - "NULL equals NULL, so WHERE returnedOn = NULL finds the open loans."
      - "Constraints duplicate my JavaScript validation, so they are optional."
    prerequisites: [no-09-02-select-join-group]
    glossary: [sql-null, check-constraint, unique-constraint, three-valued-logic]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict WHERE returnedOn = NULL versus IS NULL, and which of four inserts fail: a duplicate isbn, negative copies, a missing title and an unknown memberId." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the statements with node:sqlite in the Node child, read each constraint error, then switch foreign keys off and watch the orphan insert succeed." }
      - { kind: write, runtime: isolated-node, summary: "Write a return-book UPDATE that sets returnedOn only on the open loan and reports affected rows, plus a CHECK that returnedOn is never before loanedOn." }
    retrieval:
      - { concept: "validation at the edge before the repository", from: no-04-02-schema-validation }
  - id: no-09-04-parameterized-queries
    title: { uk: "Параметризовані запити", en: "Parameterized queries" }
    kind: instructional
    minutes: 10
    objectives:
      - "Show on a synthetic table how concatenating a search term into SQL lets the input change the query’s structure."
      - "Rewrite queries with placeholders and bound parameters (prepare, then all or run) so input is always data, including LIKE patterns, and allowlist identifiers that cannot be parameters."
    subskills:
      - { family: B-04, skill: "parameterized queries", depth: intro }
    misconceptions:
      - "Escaping quotes in the input by hand is as safe as parameters."
      - "Parameters can also fill in table names, column names and the ORDER BY direction."
    prerequisites: [no-09-03-crud-constraints-nulls, js-16-06-untrusted-input-safe-output]
    glossary: [sql-injection, parameterized-query, prepared-statement]
    visual: { kind: diagram, concept: "The same search input sent two ways: concatenated, it is parsed as part of the SQL text and becomes an always-true condition; bound, it travels in a separate parameter slot and is only ever compared as a value." }
    analogy: "Like a printed form with fixed boxes: whatever is written in the name box stays a name and can never add a new line to the form (limit: only values go in boxes; table names, column names and sort direction cannot be parameters and need an allowlist)."
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the rows returned for the title input x' OR 1=1 -- by a concatenated search and by the parameterized version." }
      - { kind: run-change, runtime: isolated-node, summary: "Run both queries with node:sqlite in the Node child, then try binding a column name for ORDER BY, read the result and replace it with an allowlist." }
      - { kind: write, runtime: isolated-node, summary: "Write searchBooks({ title, sort }) with a prepared statement, a LIKE parameter and an allowlisted sort column." }
    retrieval:
      - { concept: "a safe sink keeps untrusted input as data", from: js-16-07-xss-safe-sinks }
  - id: no-09-05-transactions-isolation
    title: { uk: "Транзакції та ізоляція (оглядово)", en: "Transactions and isolation (awareness)" }
    kind: instructional
    minutes: 12
    objectives:
      - "Wrap a multi-statement change (create a loan and decrement available copies) in BEGIN and COMMIT, and roll it back when any step fails."
      - "Predict what a second connection sees during an open write transaction, and name the anomalies isolation levels prevent, at awareness level."
    subskills:
      - { family: B-04, skill: "transactions/isolation awareness", depth: intro }
    misconceptions:
      - "Each statement is saved as it runs, so a failure half-way leaves only the finished part, and that is fine."
      - "Transactions are only needed when many users write at the same moment."
    prerequisites: [no-09-04-parameterized-queries]
    glossary: [database-transaction, transaction-rollback, isolation-level]
    visual: { kind: sequence, concept: "Two connections and the database over time: connection A begins, inserts a loan, fails on the copies update and rolls back, while connection B’s reads before and after show it never saw the half-done change; the run without a transaction leaves an orphan loan." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the loans and available copies after borrowBook fails on its second statement, with and without a transaction." }
      - { kind: run-change, runtime: isolated-node, summary: "Run borrowBook with node:sqlite in the Node child with the failure injected, wrap it in BEGIN, COMMIT and ROLLBACK, and read from a second connection during the transaction." }
      - { kind: write, runtime: isolated-node, summary: "Write transferLoan(fromMember, toMember, bookId) as one transaction that rolls back when any step changes zero rows." }
    retrieval:
      - { concept: "all-or-nothing replacement of a file", from: no-02-05-atomic-recoverable-updates }
  - id: no-09-06-indexes-query-plans
    title: { uk: "Індекси та плани запитів", en: "Indexes and query plans" }
    kind: instructional
    minutes: 12
    objectives:
      - "Read EXPLAIN QUERY PLAN output and tell a full table scan from an index search for a given query."
      - "Add an index that turns a frequent lookup into a search, measure the effect on a generated 100 000-row table, and name the write and storage cost it adds."
    subskills:
      - { family: B-04, skill: "indexes/query plans", depth: intro }
    misconceptions:
      - "An index on every column makes every query faster at no cost."
      - "If a column has an index, every query that mentions that column uses it."
    prerequisites: [no-09-05-transactions-isolation]
    glossary: [database-index, query-plan, full-table-scan, composite-index]
    visual: { kind: diagram, concept: "The same query drawn two ways: a full scan arrow visiting every loans row versus a B-tree index on memberId jumping straight to the matching rows, with the EXPLAIN QUERY PLAN line and the measured time under each." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the plan line (SCAN or SEARCH) for loans by memberId, loans by bookId and books by lower(title), before and after CREATE INDEX on loans(memberId)." }
      - { kind: run-change, runtime: isolated-node, summary: "Generate 100 000 synthetic loans with node:sqlite in the Node child, time the lookup, add the index, time it again and also time 10 000 inserts before and after." }
      - { kind: write, runtime: isolated-node, summary: "Write the composite index that serves 'open loans for one member, newest first' and show that its plan uses it." }
    retrieval:
      - { concept: "an index keyed by id instead of a linear search", from: js-12-12-dedup-indexing }
  - id: no-09-07-migrations-seed
    title: { uk: "Міграції та seed", en: "Migrations and seed" }
    kind: instructional
    minutes: 12
    objectives:
      - "Apply ordered, numbered migrations that move the schema forward one version at a time, recording the version with PRAGMA user_version and adding a new migration instead of editing an applied one."
      - "Test a migration on a seeded copy: row counts and invariants hold, and rerunning the migrator changes nothing."
      - "Seed a database so that initializing an empty or an existing database ends in the same state."
    subskills:
      - { family: B-04, skill: "migrations/seed", depth: intro }
      - { family: B-05, skill: "migration/versioning", depth: intro }
      - { family: B-05, skill: "initialization", depth: intro }
    misconceptions:
      - "A migration is just editing the CREATE TABLE statement and recreating the database."
      - "Seed data and migrations are the same thing."
    prerequisites: [no-09-06-indexes-query-plans, no-09-05-transactions-isolation]
    glossary: [migration-history, seed-data, forward-only-migration]
    visual: { kind: git-graph, concept: "The schema’s history as a chain of numbered migrations (001 create tables, 002 add dueOn, 003 add an index), with the database’s user_version pointer moving along the chain as each migration runs, and an edited or reordered migration shown as a diverging branch that existing databases never received." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict user_version and the loans columns after migrations 001–003 run on an empty database, and what rerunning the migrator does." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the migrator with node:sqlite in the Node child on an empty and on a seeded database, then add migration 004 (a NOT NULL column with a default) and run it on both." }
      - { kind: write, runtime: isolated-node, summary: "Write migrate(db, migrations) that applies only pending migrations in order, each inside a transaction, and a seed step that inserts fixtures only into empty tables." }
    retrieval:
      - { concept: "a linear history of commits", from: js-15-08-branches-history }
  - id: no-09-08-file-vs-relational
    title: { uk: "Файловий чи реляційний репозиторій", en: "File vs relational repository" }
    kind: instructional
    minutes: 10
    objectives:
      - "Compare the JSON file repository from NO-02 with a SQLite repository on querying, concurrent writes, migrations, backup and setup cost, and choose one for a stated workload."
      - "Predict what each does when two read-modify-write updates overlap, and explain how a transaction or a single-writer queue keeps the data consistent."
    subskills:
      - { family: B-05, skill: "file vs relational repository tradeoffs", depth: intro }
      - { family: B-05, skill: "concurrency/transactions", depth: intro }
    misconceptions:
      - "A database is always the better choice, even for a few hundred records written by one user."
      - "Two overlapping saves to a JSON file are safe because each write is atomic."
    prerequisites: [no-09-07-migrations-seed, no-02-09-capstone-file-persistence]
    glossary: [lost-update, single-writer-queue]
    visual: { kind: diagram, concept: "A side-by-side decision board: the same two overlapping updates run against the file repository (read-modify-write loses one) and the SQLite repository (a transaction serializes them), while rows for querying, migration, backup and setup cost fill in as each scenario runs." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the final records when two overlapping read-modify-write saves hit the JSON file repository, and when the same updates run as SQLite transactions." }
      - { kind: run-change, runtime: isolated-node, summary: "Run both repositories in the Node child with the overlap injector, then add a single-writer queue to the file repository and rerun." }
      - { kind: write, runtime: isolated-node, summary: "Implement 'filter by status and sort by date' for both repositories behind one interface and add a short note choosing one for a 500-record single-user workload and naming what would change the choice." }
    retrieval:
      - { concept: "the cost of scanning every record", from: js-05-06-search-complexity }
  - id: no-09-09-debug-injection-rollback
    title: { uk: "Налагодження: вразливий запит, зламане обмеження, відсутній rollback", en: "Debug: injectable query, broken constraint, missing rollback" }
    kind: instructional
    minutes: 15
    objectives:
      - "Find and repair an injectable search, a foreign-key constraint that silently does nothing because foreign keys are off on the connection, and a multi-step update that leaves partial data when it fails."
      - "Prove each repair with a check that fails before the fix and passes after it against the synthetic library database."
    subskills:
      - { family: B-04, skill: "CRUD/constraints/nulls", depth: assess }
      - { family: B-04, skill: "transactions/isolation awareness", depth: assess }
      - { family: B-04, skill: "parameterized queries", depth: assess }
    misconceptions:
      - "If no error is raised, the constraint must be working."
    prerequisites: [no-09-08-file-vs-relational]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Before running, predict the result of the seeded search for an injection payload, an orphan loan insert and a failing borrowBook, and which of them should have been rejected." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the seeded lab with node:sqlite in the Node child and match the leaked rows, the orphan loan and the half-applied borrow to your prediction." }
      - { kind: debug, runtime: isolated-node, summary: "Repair all three — bind the search parameter, enable foreign keys on every connection and wrap borrowBook in a transaction that rolls back — without changing any correct result." }
    retrieval:
      - { concept: "a swallowed error that hides a failed step", from: js-07-09-debug-swallowed-errors }
  - id: no-09-10-independent-schema-design
    title: { uk: "Самостійно: спроєктуй, запитай, мігруй", en: "Independent: design, query, migrate" }
    kind: assessment
    minutes: 40
    objectives:
      - "Design, without hints, a schema with keys and constraints for an unseen synthetic dataset, write the join and aggregate queries it asks for, and justify one index with its query plan."
      - "Write and test a migration plus seed that upgrade an existing database without losing rows, and explain when a file repository would have been enough."
    subskills:
      - { family: B-04, skill: "tables/keys/relationships", depth: assess }
      - { family: B-04, skill: "SELECT/join/group/aggregate", depth: assess }
      - { family: B-04, skill: "indexes/query plans", depth: assess }
      - { family: B-04, skill: "migrations/seed", depth: assess }
      - { family: B-05, skill: "file vs relational repository tradeoffs", depth: assess }
    misconceptions: []
    prerequisites: [no-09-09-debug-injection-rollback]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: isolated-node, summary: "No-hint assessed exercise in the platform’s Node child: a synthetic workshop dataset (rooms, sessions, bookings); checks run your schema’s constraints, three join and aggregate queries, a query-plan check for your index, your migration on a seeded version-1 copy and your seed, and require a report naming the index reason and the file-versus-relational choice." }
      - { kind: local-task, runtime: local-node, summary: "On your own Node (22.13+, node:sqlite, no npm): a supplied script creates a real version-1 workshop.db, runs your migrate, reruns it, then shows a broken migration rolling back and the repaired one applying to the same file." }
    retrieval:
      - { concept: "modeling a domain with types before writing code", from: js-14-02-modeling-domain-types }
