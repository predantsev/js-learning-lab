# Syllabus spine for JS-12. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-12
stage: JS
title: { uk: "Текст, числа, дати й колекції", en: "Text, numbers, dates and collections" }
summary:
  uk: "Учень безпечно працює з Unicode-текстом (довжина, перебір, нормалізація, пошук), рахує гроші цілими мінорними одиницями замість дробових чисел, суворо розбирає числа й пише обмежені регулярні вирази, зберігає дати як timestamp або простий календарний рядок і форматує їх через Intl лише для показу, а також обирає Map, Set чи слабку колекцію для пошуку, усунення дублікатів і метаданих за ключем-об’єктом."
  en: "The learner handles Unicode text safely (length, iteration, normalization, search), counts money in integer minor units instead of floats, parses numbers strictly and writes bounded regular expressions, keeps dates as timestamps or plain calendar strings and formats them with Intl only for display, and chooses Map, Set or a weak collection for lookups, deduplication and object-keyed metadata."
competencies: [J-07, J-08, J-09]
capstoneStep:
  mode: local
  objective:
    uk: "Застосувати до проєкту суворі правила даних: цілі мінорні одиниці або прості календарні дати, Unicode-безпечні підписи й пошук, форматування лише для показу та індекс на основі Map/Set."
    en: "Apply strict data rules to the capstone: integer minor units or plain calendar dates, Unicode-safe labels/search, locale-only display and a Map/Set-based index."
  variants:
    wishlist:
      uk: "`price` лишається цілим числом або null (цілі гривні, ніколи не результат parseFloat), пошук за `name` і `category` нормалізує текст і не залежить від регістру («лампа» знаходить «Лампа»), ціни форматуються через Intl.NumberFormat лише під час показу, а бажання проіндексовані за `id` у Map із набором категорій у Set."
      en: "Keep `price` an integer or null (whole units, never a parseFloat result), make `name`/`category` search normalized and case-insensitive (“lamp” finds “Lamp”), format prices with Intl.NumberFormat only on display, and index items by `id` in a Map with the categories in use collected in a Set."
    planner:
      uk: "`dueDate` лишається простим рядком 'YYYY-MM-DD', який порівнюють як текст із переданим «сьогодні» (без арифметики Date і часових поясів), показується через Intl.DateTimeFormat лише для читача, пошук за `title` Unicode-безпечний, а справи проіндексовані за `id` у Map із набором використаних `priority` у Set."
      en: "Keep `dueDate` a plain 'YYYY-MM-DD' string compared as text with the passed-in day (no Date or timezone arithmetic), show it with Intl.DateTimeFormat only on display, search `title` Unicode-safely and index tasks by `id` in a Map with the `priority` values in use in a Set."
    habits:
      uk: "`completions` лишаються унікальними відсортованими рядками 'YYYY-MM-DD', унікальність яких забезпечує Set (без часових поясів; «сьогодні» передається параметром), дати форматуються лише для показу, пошук за `name` Unicode-безпечний, а звички проіндексовані за `id` у Map."
      en: "Keep `completions` unique, sorted 'YYYY-MM-DD' strings with uniqueness enforced through a Set (no timezone math; the day is passed in), format dates only for display, search `name` Unicode-safely and index habits by `id` in a Map."
    expenses:
      uk: "`amountMinor` лишається додатним цілим, отриманим із введення без дробових чисел, суми за `category` рахуються в Map у копійках, гривні форматуються через Intl.NumberFormat лише під час показу, `date` лишається простим рядком 'YYYY-MM-DD', а пошук за `label` Unicode-безпечний."
      en: "Keep `amountMinor` a positive integer parsed from input without floats, compute per-`category` totals in a Map in minor units, format UAH with Intl.NumberFormat only on display, keep `date` a plain 'YYYY-MM-DD' string and search `label` Unicode-safely."
# Retrieval plan: js-02-02-equality-coercion (coercion) ; js-05-06-search-complexity (lookup cost) ; js-04-07-reference-identity (identity keys) ; js-09-04-deterministic-fixtures (fixed clock)
lessons:
  - id: js-12-01-strings-unicode
    title: { uk: "Рядки: незмінність, code units і code points", en: "Strings: immutable, code units and code points" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict length, indexing and for-of output for strings with Cyrillic letters, an emoji and a combining accent."
      - "Explain that string methods return new strings and never change the original."
    subskills:
      - { family: J-07, skill: "string immutability and Unicode code units/code points", depth: intro }
    misconceptions:
      - "length counts the characters a person sees on screen."
      - "Calling name.toUpperCase() changes the string stored in name."
    prerequisites: [js-01-02-numbers-and-text, js-04-06-for-of-vs-for-in]
    glossary: [code-unit, code-point, surrogate-pair, grapheme-cluster]
    visual: { kind: diagram, concept: "One string such as 'Кіт 🐈' laid out in three rows — UTF-16 code units with their indexes, code points as for-of yields them, and the visible characters — with each row's length highlighted against the others." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict length, s[0], [...s].length and s.at(-1) for 'Київ', '🐈' and an 'é' written as e plus a combining accent." }
      - { kind: run-change, runtime: browser-js, summary: "Run the table, slice an emoji string in the middle and see the broken surrogate, then use Array.from and compare." }
      - { kind: write, runtime: browser-js, summary: "Write truncateLabel(text, max) that never cuts a code point in half and appends '…' only when the text was shortened." }
    retrieval:
      - { concept: "string literals and quotes", from: js-01-02-numbers-and-text }
  - id: js-12-02-normalization-search
    title: { uk: "Нормалізація та пошук у тексті", en: "Normalization and text search" }
    kind: instructional
    minutes: 10
    objectives:
      - "Show that two strings that look identical can be unequal, and make them comparable with normalize('NFC')."
      - "Implement a search that normalizes, trims and lowercases both the query and the field before comparing."
    subskills:
      - { family: J-07, skill: "normalization awareness", depth: intro }
    misconceptions:
      - "If two strings look identical on screen, === will say they are equal."
      - "toLowerCase alone makes any search match regardless of how the text was typed."
    prerequisites: [js-12-01-strings-unicode, js-05-02-filter-find]
    glossary: [unicode-normalization, search-key]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict === and length for a precomposed and a decomposed 'é', before and after normalize('NFC')." }
      - { kind: run-change, runtime: browser-js, summary: "Run a filter over synthetic names that misses a decomposed 'Café', then normalize both sides and rerun it." }
      - { kind: write, runtime: browser-js, summary: "Write matchesQuery(text, query) that normalizes to NFC, trims and lowercases both sides, and test it on Cyrillic and accented names." }
    retrieval:
      - { concept: "filtering a list with a predicate", from: js-05-02-filter-find }
  - id: js-12-03-numbers-precision
    title: { uk: "Числа: точність, NaN та Infinity", en: "Numbers: precision, NaN, Infinity" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain why 0.1 + 0.2 !== 0.3 and compare decimals with a tolerance only where an approximation is acceptable."
      - "Detect NaN with Number.isNaN, recognize Infinity from division by zero and state the safe-integer limit."
    subskills:
      - { family: J-07, skill: "numeric precision/NaN/Infinity", depth: intro }
    misconceptions:
      - "0.1 + 0.2 gives the wrong answer because of a JavaScript bug."
      - "I can check for NaN with x === NaN."
    prerequisites: [js-12-02-normalization-search, js-01-03-arithmetic-precedence]
    glossary: [floating-point, nan, infinity, safe-integer]
    visual: { kind: diagram, concept: "A number line zoomed in near 0.3 showing the nearest representable doubles: 0.1 and 0.2 are stored slightly off, and their sum lands one step past the double closest to 0.3." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict 0.1 + 0.2, 0.1 + 0.2 === 0.3, 1 / 0, 0 / 0, NaN === NaN and Number.MAX_SAFE_INTEGER + 2." }
      - { kind: run-change, runtime: browser-js, summary: "Run the table, then compare with Math.abs(a - b) < Number.EPSILON and see where a tolerance helps and where it hides a real error." }
      - { kind: write, runtime: browser-js, summary: "Write isUsableNumber(x) that rejects NaN, Infinity and non-numbers, and test it on the values from the table." }
    retrieval:
      - { concept: "how earlier validation treated NaN", from: js-02-11-independent-validation }
  - id: js-12-04-math-parsing
    title: { uk: "Math і розбір введених чисел", en: "Math and parsing input" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict Number(), parseInt and parseFloat for inputs like '', ' 12 ', '12px', '1,5' and '0x10'."
      - "Round, floor and clamp values with Math and pick the rounding a rule requires, including negative halves."
    subskills:
      - { family: J-07, skill: "Math and parsing", depth: intro }
    misconceptions:
      - "parseInt and Number() do the same thing under different names."
      - "Math.round always rounds .5 away from zero, negative numbers included."
    prerequisites: [js-12-03-numbers-precision]
    glossary: [number-parsing, radix, rounding-mode]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict Number(''), Number(' 12 '), parseInt('12px', 10), parseFloat('1,5'), Number('1,5') and Math.round(-2.5)." }
      - { kind: run-change, runtime: browser-js, summary: "Run the inputs, then replace parseFloat in a form handler with a strict parser and see which values now become errors instead of silent numbers." }
      - { kind: write, runtime: browser-js, summary: "Write parseQuantity(text) that accepts only trimmed whole numbers 1–99 and returns { ok: true, value } or { ok: false, error }." }
    retrieval:
      - { concept: "what == does with a string and a number", from: js-02-02-equality-coercion }
  - id: js-12-05-integer-minor-units
    title: { uk: "Гроші як цілі мінорні одиниці", en: "Money as integer minor units" }
    kind: instructional
    minutes: 10
    objectives:
      - "Convert a typed amount such as '12,50' into integer minor units without passing through a float, and back to text for display."
      - "Sum, split and apply a percentage to minor-unit amounts with an explicit rounding rule so no kopiyka is lost."
    subskills:
      - { family: J-07, skill: "integer minor units", depth: intro }
    misconceptions:
      - "Storing money as 12.5 is fine as long as I round it when I show it."
      - "Splitting 100 kopiykas three ways gives three equal whole shares."
    prerequisites: [js-12-04-math-parsing]
    glossary: [minor-unit, remainder-allocation]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the float sum of 0.1 added ten times against the integer sum of 10 minor units added ten times, and 100 split three ways with Math.floor." }
      - { kind: run-change, runtime: browser-js, summary: "Run both totals, then give the leftover kopiyka to the first share and check that the parts add back to the whole." }
      - { kind: write, runtime: browser-js, summary: "Write parseAmountMinor(text) so '12,50' gives 1250 by splitting the string (no parseFloat), rejecting more than two decimal digits and zero or negative amounts." }
    retrieval:
      - { concept: "folding a list into a total with reduce", from: js-05-04-reduce }
  - id: js-12-06-regex-basics
    title: { uk: "Регулярні вирази: класи символів, якорі, квантифікатори", en: "Regex: classes, anchors, quantifiers" }
    kind: instructional
    minutes: 12
    objectives:
      - "Read and write patterns with character classes, the ^ and $ anchors and quantifiers, and predict test() for given inputs."
      - "Explain why a pattern without anchors accepts input that merely contains a match."
      - "Point out a nested quantifier such as (a+)+ as a backtracking risk."
    subskills:
      - { family: J-07, skill: "regex character classes/anchors/quantifiers and backtracking risk", depth: intro }
    misconceptions:
      - "/\\d{4}-\\d{2}-\\d{2}/ only matches strings that are exactly a date."
      - "\\w matches any letter, Ukrainian ones included."
    prerequisites: [js-12-05-integer-minor-units, js-12-02-normalization-search]
    glossary: [regular-expression, character-class, anchor, quantifier]
    visual: { kind: code-trace, concept: "A hand-written matcher equivalent to /^\\d{4}-\\d{2}-\\d{2}$/ advances its position in the input and in the pattern step by step against '2026-03-01' and '2026-3-1x', showing exactly where each match succeeds or fails (the tracer runs JavaScript, not regex internals)." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict test() for an unanchored and an anchored date pattern on '2026-03-01', 'x2026-03-01y' and '2026-3-1', and whether /^\\w+$/ accepts 'Київ'." }
      - { kind: run-change, runtime: browser-js, summary: "Run the cases, add the anchors, then replace \\w with [\\p{L}\\p{N}] under the u flag and rerun the Cyrillic input." }
      - { kind: write, runtime: browser-js, summary: "Write a pattern for a synthetic id like 'w-01' (one lowercase letter, a hyphen, two digits) and test it on five valid and invalid ids." }
    retrieval:
      - { concept: "which boundary inputs are worth testing", from: js-09-03-boundary-cases }
  - id: js-12-07-regex-groups-flags-limits
    title: { uk: "Регулярні вирази: групи, прапорці, екранування й обмеження введення", en: "Regex: groups, flags, escaping and input limits" }
    kind: instructional
    minutes: 12
    objectives:
      - "Extract parts of a match with capture and named groups, and use the g, i and u flags on purpose."
      - "Escape user text before building a pattern from it and cap the input length before matching."
      - "Rewrite a pattern with nested quantifiers so its matching steps no longer explode on an almost-matching input."
    subskills:
      - { family: J-07, skill: "regex groups/flags/escaping and input limits", depth: intro }
      - { family: J-07, skill: "regex character classes/anchors/quantifiers and backtracking risk", depth: practice }
    misconceptions:
      - "A regex either matches or fails almost instantly, whatever the input."
      - "I can pass the user's search text straight into new RegExp()."
    prerequisites: [js-12-06-regex-basics]
    glossary: [capture-group, regex-flag, regex-escaping, catastrophic-backtracking]
    visual: { kind: code-trace, concept: "A hand-written backtracking function modelling /^(a+)+$/ counts its tries in a step counter: two more letters of an almost-matching input multiply the tries by four, while a one-pass function modelling the rewritten /^a+$/ fails the same input in a handful of steps. (The tracer runs JavaScript, not regex internals, so the matcher is modelled in code; the example times the real /^(\\w+\\s?)+$/.)" }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the groups of /(?<year>\\d{4})-(?<month>\\d{2})/.exec('2026-03-01'), repeated test() calls on a g-flag regex (lastIndex) and what new RegExp('1+1') matches." }
      - { kind: run-change, runtime: browser-js, summary: "Time a nested-quantifier pattern on inputs of length 10, 15 and 20 within the sandbox limit, rewrite it and compare; then escape a query containing '+' and '.' before matching." }
      - { kind: write, runtime: browser-js, summary: "Write findAll(text, query) that escapes the query, caps the input length, uses the gi flags and returns match positions." }
    retrieval:
      - { concept: "a long synchronous task blocks the page", from: js-08-01-timers-and-the-event-loop }
  - id: js-12-08-dates-storage-presentation
    title: { uk: "Дати: збережене значення проти показу", en: "Dates: stored value vs presentation" }
    kind: instructional
    minutes: 12
    objectives:
      - "Tell a timestamp (an instant) from a calendar date ('YYYY-MM-DD') and choose which one a field needs."
      - "Predict how new Date('2026-03-01'), new Date('2026-03-01T00:00') and new Date(2026, 2, 1) differ (UTC vs local time, zero-based month)."
      - "Keep the stored value canonical and produce display text only at the edge."
    subskills:
      - { family: J-08, skill: "Date parsing/storage vs presentation", depth: intro }
      - { family: J-08, skill: "timestamps/calendar dates", depth: intro }
    misconceptions:
      - "A Date object stores a day, and it is the same thing as the text I see when I print it."
      - "In new Date(2026, 3, 1) the months start at 1, so this is March."
    prerequisites: [js-12-07-regex-groups-flags-limits, js-09-04-deterministic-fixtures]
    glossary: [timestamp, calendar-date, iso-8601, unix-epoch]
    visual: { kind: diagram, concept: "A timeline with one instant marked as a millisecond timestamp, its ISO string in UTC and its local display in two places, and beside it a plain '2026-03-01' calendar date that names a day but no instant." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which calendar day Intl shows in UTC, Kyiv and New York for new Date('2026-03-01'), and — with machine-independent outputs only (getMonth/getDate on local constructions, local-vs-local and UTC-vs-UTC getTime comparisons) — how new Date('2026-03-01'), new Date('2026-03-01T00:00') and new Date(2026, 2, 1) differ." }
      - { kind: run-change, runtime: browser-js, summary: "Run them, then store a due date as a 'YYYY-MM-DD' string and compare two dates as strings instead of Date objects." }
      - { kind: write, runtime: browser-js, summary: "Write isDueOnOrBefore(dueDate, today) for plain 'YYYY-MM-DD' strings with today passed in, and test it with a fixed day." }
    retrieval:
      - { concept: "passing a fixed today into the function under test", from: js-09-04-deterministic-fixtures }
  - id: js-12-09-timezones-dst
    title: { uk: "Часові пояси та пастки переходу на літній час", en: "Timezones and DST pitfalls" }
    kind: instructional
    minutes: 10
    objectives:
      - "Show with a fixed instant how one timestamp displays as different calendar days in Kyiv and in New York."
      - "Explain why adding 24 hours is not always “the same time tomorrow” across a DST change, and why the capstone avoids timezone arithmetic."
    subskills:
      - { family: J-08, skill: "timezone/DST pitfalls", depth: intro }
    misconceptions:
      - "A day always has 24 hours, so adding 86 400 000 ms always gives the same time tomorrow."
      - "The date I see on my machine is the date every user sees for the same instant."
    prerequisites: [js-12-08-dates-storage-presentation]
    glossary: [utc, timezone, utc-offset, daylight-saving-time]
    visual: { kind: diagram, concept: "Parallel clock lanes for Europe/Kyiv and America/New_York with one instant drawn across both, so it falls on 1 March in one lane and 28 February in the other; at the 8 March 2026 DST change the New York lane skips an hour, so a +24 h arrow from noon on 7 March lands at 13:00." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the Kyiv and New York calendar day Intl shows for the instant '2026-03-01T03:30:00Z', and the New York wall-clock time 24 hours after noon on 7 March 2026 (zone rules come from the runtime's timezone data)." }
      - { kind: run-change, runtime: browser-js, summary: "Run it with an explicit timeZone option so the result does not depend on the machine, then move the instant by one hour and watch the New York day flip." }
      - { kind: write, runtime: browser-js, summary: "Write addCalendarDays(date, n) on plain 'YYYY-MM-DD' strings using only UTC arithmetic, and test it across a month end and the DST weekend." }
    retrieval:
      - { concept: "how JSON.stringify writes a Date", from: js-07-04-json }
  - id: js-12-10-intl-locale
    title: { uk: "Intl: локаль для показу, канонічні значення для зберігання", en: "Intl and locale vs canonical" }
    kind: instructional
    minutes: 10
    objectives:
      - "Format a minor-unit amount and a calendar date with Intl.NumberFormat and Intl.DateTimeFormat for uk and en."
      - "Sort Ukrainian names with Intl.Collator and explain why the default sort misplaces letters such as 'ґ', 'є' and 'ї'."
      - "Keep stored values locale-free and turn them into display text only when rendering."
    subskills:
      - { family: J-08, skill: "Intl date/number/collation", depth: intro }
      - { family: J-08, skill: "locale vs stored canonical values", depth: intro }
    misconceptions:
      - "I should store the price as the formatted text '1 250,00 ₴' so it looks right everywhere."
      - "The default sort() puts Ukrainian words in alphabetical order."
    prerequisites: [js-12-09-timezones-dst, js-12-05-integer-minor-units]
    glossary: [intl, locale, collation, canonical-value]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the uk-UA currency output for 125000 minor units in UAH, and the order of ['їжак', 'яблуко', 'груша', 'ґанок'] under the default sort and under Intl.Collator('uk')." }
      - { kind: run-change, runtime: browser-js, summary: "Run it with 'uk-UA' and 'en-US', switch the locale and confirm that only display text changes while the stored array and amounts stay identical." }
      - { kind: write, runtime: browser-js, summary: "Write formatForDisplay(record, locale) that returns display strings for an amount in minor units and a 'YYYY-MM-DD' date without mutating the record." }
    retrieval:
      - { concept: "sorting with a comparator function", from: js-05-05-sorting-comparator }
  - id: js-12-11-map-set
    title: { uk: "Map і Set", en: "Map and Set" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict Map and Set behavior for the keys 1 and '1', NaN, and two different objects with equal contents."
      - "Choose a Map over a plain object for dynamic or non-string keys and ordered iteration, and say when a plain object is still the better fit."
    subskills:
      - { family: J-09, skill: "Map/Set key/equality/iteration semantics", depth: intro }
      - { family: J-09, skill: "object vs Map", depth: intro }
    misconceptions:
      - "A Set removes duplicate objects that have the same contents."
      - "A plain object and a Map are interchangeable dictionaries."
    prerequisites: [js-12-10-intl-locale, js-04-07-reference-identity]
    glossary: [map-collection, set-collection, same-value-zero]
    visual: { kind: memory-graph, concept: "Map entries drawn as arrows from keys to values: two separately created { id: 'w-01' } objects become two keys, reusing one reference finds the existing entry, and 1 and '1' land in different slots." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict set.size after adding 1, '1', NaN, NaN, { id: 'a' }, { id: 'a' } and one object twice, and map.get({ id: 'a' }) for a freshly created object." }
      - { kind: run-change, runtime: browser-js, summary: "Run it, then key the Map by record.id instead of by the record object and rerun the lookups." }
      - { kind: write, runtime: browser-js, summary: "Write countByCategory(records) that returns a Map from category to count in first-seen order, and convert it with Object.fromEntries for JSON." }
    retrieval:
      - { concept: "two names, one object", from: js-04-07-reference-identity }
  - id: js-12-12-dedup-indexing
    title: { uk: "Усунення дублікатів та індексування", en: "Dedup and indexing" }
    kind: instructional
    minutes: 10
    objectives:
      - "Remove duplicates by a chosen key (id or normalized name) with a Set, keeping the first occurrence."
      - "Build an id → record index once to replace repeated find() calls, and state when the index must be rebuilt."
    subskills:
      - { family: J-09, skill: "dedup/indexing", depth: intro }
    misconceptions:
      - "new Set(records) removes duplicate records."
      - "An index stays correct by itself after I add or remove records."
    prerequisites: [js-12-11-map-set, js-05-06-search-complexity]
    glossary: [deduplication, lookup-index]
    visual: { kind: pipeline, concept: "Records flow through a normalize-key stage, a seen-Set gate that drops repeats and into an id → record Map, while a side panel counts comparisons for repeated find() calls against map.get()." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the result length of [...new Set(records)], of dedup by id and of dedup by normalized name for a fixture with two equal-content copies and a case-variant name." }
      - { kind: run-change, runtime: browser-js, summary: "Run it, then replace a loop of find() calls with a prebuilt Map and compare the comparison counts for 1 000 synthetic records." }
      - { kind: write, runtime: browser-js, summary: "Write indexById(records) and dedupBy(records, keyFn), with a test proving the index is rebuilt after an update." }
    retrieval:
