  - id: js-12-13-weak-collections
    title: { uk: "WeakMap/WeakSet і чого вони не вміють", en: "WeakMap/WeakSet and what they cannot do" }
    kind: instructional
    minutes: 10
    objectives:
      - "Attach metadata to DOM elements or objects with a WeakMap that does not keep them alive."
      - "Explain why a WeakMap cannot be iterated, sized or used to count progress, and why code must never depend on when garbage collection runs."
    subskills:
      - { family: J-09, skill: "WeakMap/WeakSet lifecycle limits", depth: intro }
      - { family: J-09, skill: "no deterministic weak enumeration/GC assumptions", depth: intro }
    misconceptions:
      - "As soon as I drop the last reference, the WeakMap entry disappears and I can check that it is gone."
      - "A WeakMap is a Map that cleans itself up, so I can use it as a cache and list it later."
    prerequisites: [js-12-12-dedup-indexing, js-06-08-dom-query-create-update]
    glossary: [garbage-collection, reachability, weak-collection]
    visual: { kind: diagram, concept: "A binding and a Map hold solid arrows to a card element while a WeakMap holds a dashed one; once the binding and the Map entry go, the element is reachable only through the dashed arrow and is marked “collectable, at no fixed time”." }
    analogy: "A WeakMap is like sticky notes on objects: when an object is thrown away its note goes with it (limit: you can never list the notes, count them or know when the bin is emptied)."
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of map.size, weakMap.size, [...weakMap] and weakMap.has(node) work, and whether a removed card element is still a key right after removal." }
      - { kind: run-change, runtime: browser-js, summary: "Run it, keep per-card UI state in a WeakMap keyed by the element, remove a card and confirm the code can no longer reach the entry, while collection itself stays unobservable." }
      - { kind: write, runtime: browser-js, summary: "Write trackSeen(obj) with a WeakSet, then explain in a comment why a “completed lessons” count must live in a Map or an array instead." }
    retrieval:
      - { concept: "removing an element from the DOM", from: js-06-08-dom-query-create-update }
  - id: js-12-14-debug-boundary-fixtures
    title: { uk: "Налагодження: хибні числа, некерований regex і перехід дати", en: "Debug: malformed numbers, runaway regex, date rollover" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose and repair a total corrupted by parseFloat('1,5'), an empty field read as 0 and a NaN slipping past validation."
      - "Repair a validation regex that runs away on a crafted input, an unescaped user query in new RegExp and date code that rolls over at month end or shows another day in another timezone."
      - "State in one sentence the plain-calendar-date assumption the capstone relies on."
    subskills:
      - { family: J-07, skill: "numeric precision/NaN/Infinity", depth: assess }
      - { family: J-07, skill: "Math and parsing", depth: assess }
      - { family: J-07, skill: "regex groups/flags/escaping and input limits", depth: assess }
      - { family: J-07, skill: "regex character classes/anchors/quantifiers and backtracking risk", depth: assess }
      - { family: J-08, skill: "Date parsing/storage vs presentation", depth: assess }
      - { family: J-08, skill: "timestamps/calendar dates", depth: assess }
      - { family: J-08, skill: "timezone/DST pitfalls", depth: assess }
    misconceptions:
      - "If all my test inputs pass, the parser and the regex are safe for any input."
    prerequisites: [js-12-13-weak-collections]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Before running, mark which of seven seeded defects gives a wrong total, a silent zero, a NaN that passes validation, a runaway match, a search that matches the wrong text, a wrong day or a wrong month: parseFloat('1,5'), Number('') accepted as 0, Number('12,50') passing a typeof check, /^(\\d+)+$/ on a long input, a user query '1.5' passed unescaped to new RegExp (and 'c++', which throws), new Date('2026-03-01') shown in New York and new Date(2026, 3, 31). The runaway match is timed in the run-change example at a safe length rather than predicted." }
      - { kind: run-change, runtime: browser-js, summary: "Run the seeded fixtures with a fixed clock and an explicit timeZone, and match each output to your prediction." }
      - { kind: debug, runtime: browser-js, summary: "Repair all seven with strict parsing, Number.isNaN and empty-input checks, a rewritten pattern with a length cap, an escaped query and plain calendar-date handling, keeping the provided tests green." }
    retrieval:
      - { concept: "letting a failing test point at the defect", from: js-09-07-debug-with-tests }
