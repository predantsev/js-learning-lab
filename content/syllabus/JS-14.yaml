# Syllabus spine for JS-14. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-14
stage: JS
title: { uk: "Основи TypeScript для доменної моделі", en: "TypeScript foundations for the domain model" }
summary:
  uk: "Учень анотує типи там, де виведення не допомагає, моделює записи домену через interface, type alias і дискриміновані union-типи, звужує nullable- та union-значення з увімкненими строгими перевірками, пише generic-хелпери й type-only імпорти та перевіряє недовірений JSON під час виконання, а не довіряє приведенню типу (as)."
  en: "The learner annotates types where inference cannot help, models domain records with interfaces, type aliases and discriminated unions, narrows nullable and union values under strict checks, writes generic helpers and type-only imports, and validates untrusted JSON at runtime instead of trusting a type assertion (as)."
competencies: [P-03]
capstoneStep:
  mode: local
  objective:
    uk: "Перевести доменний модуль проєкту на строгий TypeScript: моделі, union-типи для результату валідації, generic-хелпери та перевірка збереженого JSON під час виконання."
    en: "Convert the capstone domain module to strict TypeScript: models, validation result unions, generic helpers and runtime validation of stored JSON."
  variants:
    wishlist:
      uk: "Описати тип Wish як { id, name, price: number | null, acquired, category: string | null }, зробити так, щоб validateWish повертала union { ok: true, value } | { ok: false, errors }, а вміст jsll.wishlist.v1 читати як unknown і перевіряти кожне поле."
      en: "Type a Wish as { id, name, price: number | null, acquired, category: string | null }, make validateWish return { ok: true, value } | { ok: false, errors }, and read the jsll.wishlist.v1 value as unknown before checking each field."
    planner:
      uk: "Описати тип Task, де priority — union 'low' | 'normal' | 'high', а dueDate: string | null; звужувати done, priority і dueDate у хелпері підрахунку справ на певний день і перевіряти відновлені справи, що приходять як unknown."
      en: "Type a Task with priority as the union 'low' | 'normal' | 'high' and dueDate: string | null, narrow done, priority and dueDate in the due-on-day count helper, and validate restored tasks that arrive as unknown."
    habits:
      uk: "Описати тип Habit з frequency: 'daily' | 'weekly' і completions: string[], написати generic-хелпер sortBy для звичок і дат виконання та відхиляти збережені звички, у яких completions — не відсортовані унікальні рядки-дати."
      en: "Type a Habit with frequency: 'daily' | 'weekly' and completions: string[], write a generic sortBy helper used for habits and completion dates, and reject stored habits whose completions are not sorted unique date strings."
    expenses:
      uk: "Описати тип Expense, де amountMinor — ціле число, а category — union ідентифікаторів food | transport | home | fun; типізувати хелпер підсумків як Record<CategoryId, number> і перевіряти, що відновлені amountMinor — додатні цілі числа."
      en: "Type an Expense with amountMinor as an integer and category as the union food | transport | home | fun, type the totals helper as Record<CategoryId, number>, and check that restored amountMinor values are positive integers."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   js-02-04-nullish-optional-chaining (nullability) ; js-07-04-json (parse yields unknown) ; js-11-07-inheritance-vs-composition (models) ; js-04-09-destructuring-spread (shapes)
lessons:
  - id: js-14-01-annotations-inference
    title: { uk: "Типи: анотації та виведення", en: "Types: annotations and inference" }
    kind: instructional
    minutes: 10
    objectives:
      - "Annotate a parameter and a return type, and predict the type tsc infers for locals written without annotations."
      - "Read a tsc diagnostic (code, message, line) and name which value breaks which declared type."
    subskills:
      - { family: P-03, skill: "type annotations/inference", depth: intro }
    misconceptions:
      - "Without an explicit annotation every variable is any, so I must annotate everything."
      - "A type annotation converts the value to that type, the way Number() does."
    prerequisites: [js-03-01-functions-and-return, js-01-04-booleans-null-undefined]
    glossary: [typescript, type-annotation, type-inference, tsc]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the types tsc infers for const total = 0, let label = 'wish', [80, 45] and a function that returns price > 0, before hovering to check." }
      - { kind: run-change, runtime: browser-js, summary: "Run the type check on a small priced-item file, pass a string where a number parameter is expected and read the diagnostic's code, message and line; then confirm the emitted JavaScript has no types left." }
      - { kind: write, runtime: browser-js, summary: "Annotate only the parameters and return types of a three-function labels file (formatPrice, formatTitle, isEmpty) and leave inferred locals unannotated until the file checks cleanly." }
    retrieval:
      - { concept: "explicit conversion versus implicit coercion", from: js-02-02-equality-coercion }
  - id: js-14-02-modeling-domain-types
    title: { uk: "Моделюємо домен: interface і type alias", en: "Modeling the domain: interfaces and aliases" }
    kind: instructional
    minutes: 12
    objectives:
      - "Model a domain record as an interface or a type alias with required, optional and readonly fields."
      - "Explain why tsc accepts any object with a matching shape (structural typing) and predict when an excess-property error appears."
    subskills:
      - { family: P-03, skill: "models/interfaces/type aliases", depth: intro }
    misconceptions:
      - "An interface creates a runtime object I can check with instanceof."
      - "Two types with different names are incompatible even when their shapes match."
    prerequisites: [js-14-01-annotations-inference, js-04-05-objects-properties]
    glossary: [interface-declaration, type-alias, structural-typing, optional-property, readonly-property]
    visual: { kind: diagram, concept: "A Wish interface drawn as a field-by-field template beside three object literals: matching fields light up, a missing required field or an extra property literal is flagged, and the compiled JavaScript panel shows the template leaving nothing behind." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of four objects tsc accepts as a Wish: one without category, one with price as a string, an object literal with an extra note field, and the same extra field passed through an intermediate variable." }
      - { kind: run-change, runtime: browser-js, summary: "Run the type check, make category optional with ?, mark id readonly and see which existing assignments start or stop failing." }
      - { kind: write, runtime: browser-js, summary: "Write a type alias for the repository adapter's record and an interface for its list/get/save methods, then annotate the existing adapter object so tsc checks it against the interface." }
    retrieval:
      - { concept: "class versus composition for the record model", from: js-11-07-inheritance-vs-composition }
      - { concept: "object shapes assembled with spread", from: js-04-09-destructuring-spread }
  - id: js-14-03-unions-narrowing
    title: { uk: "Union-типи, звуження та дискримінанти", en: "Unions, narrowing and discriminants" }
    kind: instructional
    minutes: 12
    objectives:
      - "Narrow a union with typeof, in, equality and a discriminant property, and state the type of the value inside each branch."
      - "Model a validation result as { ok: true, value } | { ok: false, errors } and handle both members, with a never check that makes a missing case a compile error."
    subskills:
      - { family: P-03, skill: "unions/narrowing/discriminants", depth: intro }
    misconceptions:
      - "A union type means the value has the properties of all its members at once."
      - "If I forget a case in a switch, tsc always warns me, even without a never check."
    prerequisites: [js-14-02-modeling-domain-types, js-02-05-if-else-switch]
    glossary: [union-type, type-narrowing, discriminated-union, literal-type, exhaustiveness-check]
    visual: { kind: code-trace, concept: "Stepping through describeResult(result), each highlighted check (typeof, in, result.ok, switch on priority) updates a panel with the static type of result at that line next to its actual runtime value, including a counterexample run where a removed check lets the wrong branch execute." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the type of value inside each branch of a typeof check on string | number and the type of result inside if (result.ok) for the validation-result union." }
      - { kind: run-change, runtime: browser-js, summary: "Run the type check, remove the 'high' case from a switch over priority, add a never-typed default and watch the missing case become a diagnostic." }
      - { kind: write, runtime: browser-js, summary: "Write describeResult(result) for the { ok: true, value } | { ok: false, errors } union that handles both members without any cast." }
    retrieval:
      - { concept: "the ok/errors shape of a validation result", from: js-02-11-independent-validation }
  - id: js-14-04-nullability-strict
    title: { uk: "null, undefined і строгі перевірки", en: "Nullability and strict checks" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict which reads tsc rejects under strictNullChecks for a field typed string | null, and repair them with narrowing, ?? or ?."
      - "Explain what the non-null assertion ! claims and why it removes the diagnostic without adding any check."
    subskills:
      - { family: P-03, skill: "nullability/strict checks", depth: intro }
    misconceptions:
      - "The ! operator checks at runtime that the value is not null."
      - "Turning strict off makes the errors go away, so the code is fixed."
    prerequisites: [js-14-03-unions-narrowing, js-02-04-nullish-optional-chaining]
    glossary: [strict-null-checks, non-null-assertion]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of five lines tsc flags when category is string | null: category.length, category?.length, category ?? 'none', category!.length and a read inside if (category)." }
      - { kind: run-change, runtime: browser-js, summary: "Run the check with strictNullChecks on and off, compare which reads are reported, run the ! version on a record whose category is null, and keep strict on." }
      - { kind: write, runtime: browser-js, summary: "Repair three flagged reads of optional fields (price, dueDate, category) with narrowing or ?? so the file checks under strict without a single !." }
    retrieval:
      - { concept: "?? versus || for defaults when 0 or '' are valid", from: js-02-04-nullish-optional-chaining }
  - id: js-14-05-functions-generics
    title: { uk: "Типізовані функції та generics", en: "Typed functions and generics" }
    kind: instructional
    minutes: 12
    objectives:
      - "Type a function's parameters, optional parameters, return value and a callback parameter."
      - "Write a generic helper such as byId<T extends { id: string }>(items: readonly T[], id: string): T | undefined and predict what T becomes at each call."
    subskills:
      - { family: P-03, skill: "functions/generics", depth: intro }
    misconceptions:
      - "A generic type parameter is the same as any: it accepts everything and checks nothing."
      - "I must always write the type argument explicitly, as in byId<Wish>(items, id)."
    prerequisites: [js-14-04-nullability-strict, js-03-06-higher-order-callbacks]
    glossary: [generic-function, type-parameter, generic-constraint]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the inferred T and the return type of first(items) called with an array of wishes, an empty array literal and an array of numbers." }
      - { kind: run-change, runtime: browser-js, summary: "Run the check, replace generic first<T> with a version that returns any and list which wrong uses stop being reported." }
      - { kind: write, runtime: browser-js, summary: "Write sortBy<T>(items: readonly T[], key: (item: T) => number): T[] that returns a sorted copy, and type-check it against wishes sorted by price and tasks sorted by priority rank." }
    retrieval:
      - { concept: "sort mutates the array it is called on", from: js-05-05-sorting-comparator }
  - id: js-14-06-unknown-vs-any
    title: { uk: "unknown проти any", en: "unknown vs any" }
    kind: instructional
    minutes: 8
    objectives:
      - "Explain why any switches checking off for every later use while unknown forces a check before use."
      - "Narrow an unknown value from JSON.parse step by step with a type predicate before reading its fields."
    subskills:
      - { family: P-03, skill: "unknown vs any", depth: intro }
    misconceptions:
      - "unknown and any are the same; unknown is just the stricter-sounding name."
      - "JSON.parse returns the type I expect because I know what I saved."
    prerequisites: [js-14-05-functions-generics, js-07-04-json]
    glossary: [any-type, unknown-type, type-predicate]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which lines tsc flags when the same parsed value is typed any versus unknown and the code reads value.name.toUpperCase()." }
      - { kind: run-change, runtime: browser-js, summary: "Run both versions on stored text that is valid JSON but not an object: the any version compiles and crashes, the unknown version does not compile until a check is added." }
      - { kind: write, runtime: browser-js, summary: "Write isRecordLike(value: unknown): value is Record<string, unknown> and use it before reading any field of a parsed value." }
    retrieval:
      - { concept: "what JSON.parse gives back and when it throws", from: js-07-04-json }
  - id: js-14-07-modules-type-imports
    title: { uk: "Модулі та type-only імпорти", en: "Modules and type-only imports" }
    kind: instructional
    minutes: 8
    objectives:
      - "Export a type from a domain module and import it with import type in a UI module."
      - "Predict which imports remain in the emitted JavaScript and explain why a type-only import adds no runtime module dependency."
    subskills:
      - { family: P-03, skill: "modules/type-only imports", depth: intro }
    misconceptions:
      - "Importing a type loads and runs the module it comes from."
      - "import type and a normal import are interchangeable everywhere."
    prerequisites: [js-14-06-unknown-vs-any, js-07-06-esm-import-export]
    glossary: [type-only-import]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the emitted JavaScript of ui/render.ts when it imports the Wish type and the validateWish function from domain/wish.ts." }
      - { kind: run-change, runtime: browser-js, summary: "View the emitted code, switch the type import to import type, then try to use the imported type as a value and read the diagnostic." }
      - { kind: write, runtime: browser-js, summary: "Split a prepared single file into domain/types.ts, domain/validate.ts and ui/render.ts, using import type wherever only types are needed." }
    retrieval:
      - { concept: "a circular import between two modules", from: js-13-08-module-cycles }
  - id: js-14-08-compile-time-vs-runtime
    title: { uk: "Типи під час компіляції проти перевірки під час виконання", en: "Compile-time types vs runtime validation" }
    kind: instructional
    minutes: 12
    objectives:
      - "Show with a counterexample that a type assertion (as Wish) lets malformed stored data through unchecked."
      - "Implement a runtime validator that turns unknown input into a typed value or field errors, and say which guarantees come from tsc and which from the validator."
    subskills:
      - { family: P-03, skill: "runtime validation distinction", depth: intro }
    misconceptions:
      - "A cast like data as Wish checks the data."
      - "If the code type-checks, data from storage or the network must match the types."
    prerequisites: [js-14-07-modules-type-imports, js-14-06-unknown-vs-any]
    glossary: [type-assertion, type-erasure, runtime-validation]
    visual: { kind: diagram, concept: "Two lanes for the same stored JSON: in the compile-time lane tsc checks the code against Wish and then erases every type; in the runtime lane only the validator's checks remain, so a record with price '80' passes the as Wish arrow but is stopped at the validateWish box." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict what happens at runtime when stored text with price: '80' is read as JSON.parse(text) as Wish[] and the prices are summed." }
      - { kind: run-change, runtime: browser-js, summary: "Run the cast version on malformed fixtures, then route the same text through validateWish(value: unknown) and compare the outcomes record by record." }
      - { kind: write, runtime: browser-js, summary: "Write parseStoredWishes(text: string) that returns { ok: true, value: Wish[] } or { ok: false, errors } without a single as." }
    retrieval:
      - { concept: "validating stored data on load", from: js-07-05-persist-reload }
  - id: js-14-09-debug-type-errors
    title: { uk: "Налагодження: помилки з null і union та неперевірений cast", en: "Debug: null/union errors and an unchecked cast" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose four seeded defects (a nullable read, an unhandled union member, an any hiding a misspelled field, a cast on parsed JSON) from tsc diagnostics and a failing runtime fixture."
      - "Repair each defect with narrowing or validation, keeping correct behavior and never silencing tsc with ! or as."
    subskills:
      - { family: P-03, skill: "unions/narrowing/discriminants", depth: assess }
      - { family: P-03, skill: "nullability/strict checks", depth: assess }
      - { family: P-03, skill: "unknown vs any", depth: assess }
    misconceptions:
      - "Silencing a diagnostic with ! or as any fixes the bug."
    prerequisites: [js-14-08-compile-time-vs-runtime]
    glossary: []
    visual: { kind: code-trace, concept: "The failing fixture replayed line by line with the declared type beside the actual runtime value, showing where a value typed Wish really held a string price and where null reached a .length read." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Before running, mark which of the four seeded lines tsc reports and which only fail at runtime with the malformed fixture." }
      - { kind: run-change, runtime: browser-js, summary: "Run tsc and the fixture suite, match each diagnostic and each runtime failure to your prediction." }
      - { kind: debug, runtime: browser-js, summary: "Repair all four defects (unchecked null, missing union case, as any hiding a misspelled field, cast on parsed JSON) with narrowing and validation, never with ! or as." }
    retrieval:
      - { concept: "reading a stack trace down to the failing line", from: js-07-01-call-stack-and-errors }
  - id: js-14-10-independent-typed-model
    title: { uk: "Самостійно: типізований домен, generic-хелпер і перевірка JSON", en: "Independent: typed domain, generic helper, JSON validation" }
    kind: assessment
    minutes: 30
    objectives:
      - "Implement, without hints, a typed model for an unseen synthetic record, a generic helper and a runtime JSON validator that pass strict tsc and hidden fixtures."
      - "Justify in two sentences which guarantees in the solution come from the types and which from runtime checks."
    subskills:
      - { family: P-03, skill: "type annotations/inference", depth: assess }
      - { family: P-03, skill: "models/interfaces/type aliases", depth: assess }
      - { family: P-03, skill: "functions/generics", depth: assess }
      - { family: P-03, skill: "modules/type-only imports", depth: assess }
      - { family: P-03, skill: "runtime validation distinction", depth: assess }
    misconceptions: []
    prerequisites: [js-14-09-debug-type-errors]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: model a synthetic Recipe (id, title, servings as a positive integer, tags: string[], rating: 1–5 | null, course: 'main' | 'dessert') in its own module, export a generic indexById<T extends { id: string }> helper, and write parseRecipes(text) from unknown; it must pass strict tsc and hidden fixtures with malformed JSON, wrong field types and duplicate ids." }
      - { kind: write, runtime: browser-js, summary: "Explain-level items: two sentences on what tsc proves about parseRecipes and what only its runtime checks prove, and one sentence on why the UI module imports Recipe with import type." }
    retrieval:
      - { concept: "deterministic fixtures for hidden checks", from: js-09-04-deterministic-fixtures }
  - id: js-14-11-capstone-typed-domain
    title: { uk: "Проєкт: строгий TypeScript для домену", en: "Capstone: strict TypeScript domain" }
    kind: capstone-step
    minutes: 30
    objectives:
      - "Convert the capstone's domain module to strict TypeScript (record model, validation-result union, one generic helper, runtime validation of the stored JSON) while keeping the UI behavior unchanged."
    subskills:
      - { family: P-03, skill: "models/interfaces/type aliases", depth: practice }
      - { family: P-03, skill: "runtime validation distinction", depth: practice }
    misconceptions: []
    prerequisites: [js-14-10-independent-typed-model]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: browser-js, summary: "Rehearse in the sandbox: type the chosen domain's record and its validate*(input: unknown) against the domain fixtures plus two malformed stored values until strict tsc and the checks pass." }
      - { kind: local-task, runtime: local-web, summary: "In the exported project (local files are authoritative), rename the domain module to .ts, enable strict in tsconfig, run tsc --noEmit to zero diagnostics and the existing tests, confirm the app still loads saved data, and commit." }
    retrieval:
      - { concept: "the repository adapter's interface", from: js-11-10-capstone-model-adapter }
      - { concept: "strict data rules for amounts and dates", from: js-12-16-capstone-data-rules }
