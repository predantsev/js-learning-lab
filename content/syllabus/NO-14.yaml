# Syllabus spine for NO-14. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: NO-14
stage: NO
title: { uk: "Фінальний професійний гейт: усі чотири етапи", en: "Final professional gate across all four stages" }
summary:
  uk: "Учень підсумовує фокусні лабораторні з SQL, автентифікації та SSR, відтворює накопичені знання з JavaScript, React, React Native і Node та проходить незнайомий професійний гейт: дефект, знайдений і закритий тестами, дизайн-рев’ю з компромісами, PR і runbook, а також самостійне наскрізне завдання з перевіреними доказами."
  en: "The learner closes the focused SQL, auth and SSR labs, retrieves retained competence across JavaScript, React, React Native and Node, and passes an unseen professional gate: a defect found and caught by tests, a design review with trade-offs, a PR and a runbook, and an independent end-to-end task with verified evidence."
competencies: [B-13]
capstoneStep: null
capstoneStepReason:
  uk: "Фінальний накопичувальний професійний гейт для всіх чотирьох етапів: він перевіряє збережені компетенції на незнайомому матеріалі та в обов’язкових фокусних лабораторних, а не додає проєкту нову функцію."
  en: "Final cumulative professional gate across all four stages; it assesses retained competence with unseen material and the required focused labs, not a new capstone feature."
# Retrieval plan: js-18-03-unseen-transfer (JS gate) ; re-12-09-gate-independent-e2e (RE gate) ; rn-12-06-gate-independent-native-quality (RN gate) ; no-10-10-independent-auth-lab (auth) ; no-09-10-independent-schema-design (SQL) ; no-13-07-independent-ssr-lab (SSR) ; js-03-05-closures (closure) ; re-02-02-state-snapshots (snapshot)
lessons:
  - id: no-14-01-focused-labs-closure
    title: { uk: "Підсумок фокусних лабораторних: SQL, автентифікація, SSR", en: "Closing the focused labs: SQL, auth, SSR" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain for each focused lab (SQL, auth, SSR) which skills transferred to the capstone, which stayed in the synthetic lab by design, and why."
      - "Rerun one check from each lab on fresh synthetic data and predict its result before running it."
    subskills:
      - { family: B-13, skill: "SQL/auth/SSR focused labs", depth: intro }
    misconceptions:
      - "The focused labs were optional extras because the capstone did not need them."
      - "Passing a lab once means the skill is still there months later."
    prerequisites: [no-08-05-troubleshoot-explain, no-13-07-independent-ssr-lab]
    glossary: []
    visual: { kind: diagram, concept: "Three lab boxes (SQL schema and queries, auth sessions and ownership, SSR and hydration) linked to the capstone box: transferred skills as solid arrows, boundary-only skills such as multi-user ownership or relational joins as dashed arrows labeled with the reason they stay in the lab." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict three fresh check results before running them: a parameterized join over the synthetic library tables, an expired session reaching an owned route, and a server/client render comparison with a passed-in date." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the three checks (node:sqlite, the auth lab server on loopback, the SSR render test), then change one input per check so it fails and explain the failure." }
      - { kind: write, runtime: isolated-node, summary: "Write a one-paragraph transfer note per lab: what you applied in the capstone, what stayed synthetic and the evidence that the skill is retained." }
    retrieval:
      - { concept: "schema design, queries and migration", from: no-09-10-independent-schema-design }
      - { concept: "sessions, ownership and least privilege", from: no-10-10-independent-auth-lab }
      - { concept: "SSR with real requests and hydration", from: no-13-07-independent-ssr-lab }
  - id: no-14-02-cumulative-review
    title: { uk: "Накопичувальне повторення всіх чотирьох етапів", en: "Cumulative review across four stages" }
    kind: review
    minutes: 30
    objectives:
      - "Retrieve without notes the core mechanism of each stage (closures and the event loop, state snapshots and effects, the native/web boundary, streams and client/server ownership) and predict its effect in short unseen snippets."
      - "Self-assess against the gate criteria and name the one area to revisit before the gate tasks."
    subskills: []
    misconceptions: []
    prerequisites: [no-14-01-focused-labs-closure]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: review, runtime: isolated-node, summary: "Interleaved retrieval set drawn from the JS, RE and RN gates and the Node units: predict-and-run items on closures, microtask order, state snapshots and stream backpressure, plus explain items on the native/web boundary checked against a reference answer." }
      - { kind: predict, runtime: isolated-node, summary: "Predict the output of five unseen mixed-stage snippets (a stale closure in a server timer, an awaited loop, a snapshot read right after setState, a missing drain wait, a stale cached list) before running them." }
    retrieval:
      - { concept: "transfer to an unseen synthetic domain", from: js-18-03-unseen-transfer }
      - { concept: "enhancement, E2E and artifact checks", from: re-12-09-gate-independent-e2e }
      - { concept: "native quality and architecture explanation", from: rn-12-06-gate-independent-native-quality }
  - id: no-14-03-gate-unseen-debug-test
    title: { uk: "Гейт: незнайомий дефект і тести, що його ловлять", en: "Gate: unseen defect, tests that catch it" }
    kind: assessment
    minutes: 45
    objectives:
      - "Reproduce and repair an unseen defect in an unfamiliar synthetic full-stack app without hints."
      - "Write tests at the right level (unit, real-HTTP or integration) that fail before the fix and pass after it."
    subskills:
      - { family: B-13, skill: "no-hint defect", depth: assess }
    misconceptions: []
    prerequisites: [no-14-02-cumulative-review]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-node, summary: "No-hint gate on your machine: an unfamiliar synthetic book-club app (React client, Node API, SQLite storage) shows wrong totals after a reload; reproduce it, find the root cause and submit the fix with failing-then-passing tests and a short root-cause note." }
      - { kind: debug, runtime: local-node, summary: "Repair two further seeded defects the reproduction exposes: a client handler that sends a stale state snapshot right after setState, and a server timer whose closure keeps an outdated config object; prove each fix with a test." }
    retrieval:
      - { concept: "closures capture bindings, not copies", from: js-03-05-closures }
      - { concept: "state is a snapshot per render", from: re-02-02-state-snapshots }
  - id: no-14-04-gate-design-review
    title: { uk: "Гейт: дизайн-рев’ю, компроміси, PR і runbook", en: "Gate: design review, tradeoffs, PR and runbook" }
    kind: assessment
    minutes: 40
    objectives:
      - "Review an unseen design proposal and its PR, identify the requirement it misses and its riskiest trade-off, and propose an alternative with consequences."
      - "Write PR review comments and a runbook section for the change that a teammate could follow."
    subskills:
      - { family: B-13, skill: "requirements/tradeoffs", depth: assess }
      - { family: B-13, skill: "PR/review/docs/runbook", depth: assess }
    misconceptions: []
    prerequisites: [no-14-03-gate-unseen-debug-test]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-node, summary: "No-hint gate on your machine: review a supplied PR that adds offline sync to a synthetic app, run its tests locally, write review comments on correctness, security and operability, a decision record for the sync strategy and the runbook section for rolling it back." }
    retrieval:
      - { concept: "runbook, monitoring and rollback", from: no-12-08-runbook-monitoring-rollback }
  - id: no-14-05-gate-independent-professional
    title: { uk: "Гейт: самостійне професійне завдання", en: "Gate: independent professional task" }
    kind: assessment
    minutes: 60
    objectives:
      - "Design, build, test, secure and deliver a small unseen feature end to end without hints, with verified runtime evidence."
      - "Apply the focused-lab skill (SQL, auth or SSR) the task needs and explain the boundary where a lab skill does not apply."
      - "Keep earlier workspaces and evidence intact, and record each native check as performed on the declared target or as unperformed."
    subskills:
      - { family: B-13, skill: "design/build/debug/test/secure/deliver/maintain", depth: assess }
      - { family: B-13, skill: "SQL/auth/SSR focused labs", depth: assess }
      - { family: B-13, skill: "retained domain/workspaces", depth: assess }
    misconceptions: []
    prerequisites: [no-14-04-gate-design-review]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-node, summary: "No-hint gate on your machine: add a monthly summary feature (a server-rendered summary page, a typed and validated API route with limits, tests, the CI script and a runbook entry) to your capstone or a fresh synthetic workspace, and submit the evidence bundle with real request logs and restart proof." }
    retrieval:
      - { concept: "the CP-NO end-to-end integration", from: no-08-03-capstone-cp-no-integration }
