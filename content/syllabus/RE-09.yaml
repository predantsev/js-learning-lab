# Syllabus spine for RE-09. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RE-09
stage: RE
title: { uk: "Типізовані контракти й відновлення після збоїв", en: "Typed contracts and recovery" }
summary:
  uk: "Учень строго типізує props, state, події, hooks, reducers і context, перевіряє кожну відповідь API runtime-схемою, відокремлює придатний до повторного використання доменний код від платформних views, проєктує доступну модель помилок, тестує переходи станів і виправляє відкат, що повертав застарілі дані."
  en: "The learner types props, state, events, hooks, reducers and context strictly, validates every API response with a runtime schema, keeps reusable domain code apart from platform views, designs an accessible error model, tests state transitions and repairs a rollback that restored stale data."
competencies: [P-05, R-03, R-05, R-06]
capstoneStep:
  mode: local
  objective:
    uk: "Зміцнити проєкт строгими типізованими контрактами: API-моделі з перевіркою під час виконання, типізовані reducer і context, доступна модель помилок, тести переходів станів і відкат, який справді відновлює стан."
    en: "Harden the capstone with strict typed contracts: runtime-validated API models, typed reducer/context, accessible error model, state-transition tests and a rollback that recovers."
  variants:
    wishlist:
      uk: "Схема для бажань (`name` 1–80 символів, `price` — невід’ємне ціле число або null, `acquired` — boolean, `category` до 30 символів або null), типізований reducer для списку й збереження, доступні помилки для некоректної ціни та тест, що невдале перемикання `acquired` відкочується."
      en: "Schema for items (`name` 1–80 chars, `price` a non-negative whole number or null, `acquired` boolean, `category` up to 30 chars or null), a typed list/save reducer, accessible errors for an invalid price, and a test that a failed `acquired` toggle rolls back."
    planner:
      uk: "Схема для справ (`title`, `dueDate` у форматі 'YYYY-MM-DD' або null, `done`, `priority` low|normal|high), типізований reducer, тест, що невідомий `priority` з API стає станом помилки, і тест відкату невдалого перемикання `done`."
      en: "Schema for tasks (`title`, `dueDate` as 'YYYY-MM-DD' or null, `done`, `priority` low|normal|high), a typed reducer, a test that an unknown `priority` from the API becomes an error state, and a test that a failed `done` toggle rolls back."
    habits:
      uk: "Схема для звичок (`frequency` daily|weekly, `active`, `completions` — унікальні відсортовані дати), типізований reducer, доступна помилка для дубльованої дати виконання й тест, що невдале виконання відкочується без втрати інших дат."
      en: "Schema for habits (`frequency` daily|weekly, `active`, `completions` as unique sorted dates), a typed reducer, an accessible error for a duplicate completion date, and a test that a failed completion rolls back without losing other dates."
    expenses:
      uk: "Схема для витрат (`amountMinor` — додатне ціле, `date` у форматі 'YYYY-MM-DD', `category` зі списку проєкту), типізований reducer, тест, що дробова сума з API відхиляється, і тест, що невдале видалення повертає витрату та підсумки."
      en: "Schema for expenses (`amountMinor` a positive integer, `date` as 'YYYY-MM-DD', `category` from the project list), a typed reducer, a test that a fractional amount from the API is rejected, and a test that a failed removal restores the expense and the totals."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-04-03-reducers-typed (reducers) ; js-14-08-compile-time-vs-runtime (runtime validation) ; re-06-06-optimistic-rollback (rollback) ; re-05-07-error-boundaries-limits (boundaries)
lessons:
  - id: re-09-01-typed-ui-review
    title: { uk: "Типізовані props, state, події та hooks — глибше", en: "Typed props, state, events and hooks, in depth" }
    kind: instructional
    minutes: 10
    objectives:
      - "Type a form component's props, state, change and submit events and a custom hook's return value under strict mode without any."
      - "Repair a component whose optional prop and event type are wrong, using the compiler errors as the guide."
    subskills:
      - { family: P-05, skill: "typed props/state/events/hooks", depth: practice }
    misconceptions:
      - "Event types can be any; only props need real types."
      - "A custom hook's return type does not matter as long as the component compiles."
    prerequisites: [re-02-06-controlled-inputs-typed-events, re-04-06-custom-hooks]
    glossary: [generic-component]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which of four lines the strict typecheck rejects: a missing required prop, onChange typed as a mouse event, a hook tuple read in the wrong order and an optional prop used without narrowing." }
      - { kind: run-change, runtime: browser-react, summary: "Run the typed wish filters in the sandbox, swap the event type for any and the hook's tuple for an object, and see that the sandbox strips types (only the runtime TypeError shows)." }
      - { kind: local-task, runtime: local-web, summary: "Run the strict typecheck with tsc in ~/js-course/ts-lab (the sandbox checks no types), fix the event type and narrow an optional prop, then change the hook's returned tuple into a named object and follow the call sites." }
      - { kind: write, runtime: browser-react, summary: "Write a generic SelectList<T> with typed items, getKey and onSelect props, and use it for the status filter." }
    retrieval:
      - { concept: "typed change and submit events", from: re-02-06-controlled-inputs-typed-events }
  - id: re-09-02-typed-reducers-context
    title: { uk: "Типізовані reducers і context", en: "Typed reducers and context" }
    kind: instructional
    minutes: 12
    objectives:
      - "Model reducer state as a discriminated union so impossible combinations (loading with both data and an error) cannot be written."
      - "Type actions as a union handled exhaustively with a never check, and provide a typed context whose hook fails loudly outside its provider."
    subskills:
      - { family: P-05, skill: "typed reducers/context", depth: practice }
      - { family: R-03, skill: "reducer state transitions", depth: practice }
    misconceptions:
      - "Three flags — isLoading, hasError and data — are enough to model a request."
      - "A context default of {} as Value is a harmless shortcut."
    prerequisites: [re-09-01-typed-ui-review, re-04-03-reducers-typed, js-14-03-unions-narrowing]
    glossary: [impossible-state]
    visual: { kind: diagram, concept: "A state machine idle → loading → success | failure with actions on the arrows; an action that has no arrow from the current state is highlighted as rejected by both the reducer and the type." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which dispatches the typecheck rejects and which the reducer ignores when the state is 'loading' and a 'saved' action arrives." }
      - { kind: run-change, runtime: browser-react, summary: "Run the reducer with its transition log, send actions in an invalid order, then remove one guard and watch an impossible transition get through." }
      - { kind: local-task, runtime: local-web, summary: "With tsc in ~/js-course/ts-lab, see two impossible-state literals rejected, add a 'retried' action to the union and follow the compiler to the unhandled case." }
      - { kind: write, runtime: browser-react, summary: "Write a typed RecordsContext with a useRecordsContext() hook that throws a clear error when used outside the provider." }
    retrieval:
      - { concept: "reducers with typed actions", from: re-04-03-reducers-typed }
  - id: re-09-03-api-models-runtime-schemas
    title: { uk: "API-моделі та runtime-схеми", en: "API models and runtime schemas" }
    kind: instructional
    minutes: 12
    objectives:
      - "Separate the API model (what the server sends) from the domain model and convert between them at one boundary."
      - "Validate an unknown response with a runtime schema and route invalid data to an error state instead of casting it."
    subskills:
      - { family: P-05, skill: "API models and runtime schemas", depth: intro }
    misconceptions:
      - "If the response is typed as Record[], the data is Record[]."
      - "Runtime validation duplicates TypeScript and can be skipped in a typed project."
    prerequisites: [re-09-02-typed-reducers-context, js-14-08-compile-time-vs-runtime]
    glossary: [api-model, runtime-schema]
    visual: { kind: diagram, concept: "Data flowing fetch → unknown → schema parse → domain model or typed error, with the static type shown on each arrow; a malformed fixture field stops at the parse box instead of reaching render." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what the list renders when the fixture returns a numeric field as the string '80', once under an as-cast and once under a schema parse." }
      - { kind: run-change, runtime: browser-react, summary: "Run the client against a fixture with one malformed record, switch from the cast to the schema parser and watch the error state appear." }
      - { kind: write, runtime: browser-react, summary: "Write parseRecord(input: unknown) returning { ok: true, value } or { ok: false, errors } and apply it to every fixture API response." }
    retrieval:
      - { concept: "a cast does not check the data", from: js-14-08-compile-time-vs-runtime }
  - id: re-09-04-reuse-boundaries
    title: { uk: "Межі повторного використання: домен проти платформних views", en: "Reuse boundaries: domain vs platform views" }
    kind: instructional
    minutes: 10
    objectives:
      - "Sort capstone modules into shareable pure domain code (types, validators, transforms) and platform views and adapters (React DOM components, storage, routing)."
      - "Explain why a web component should not be shared with a future native or server app while its domain types and validators should be."
    subskills:
      - { family: P-05, skill: "native/server reuse boundaries", depth: intro }
    misconceptions:
      - "Reuse means sharing the same components between web, native and server."
      - "A domain function that reads localStorage is still pure domain code."
    prerequisites: [re-09-03-api-models-runtime-schemas, js-14-07-modules-type-imports, js-03-07-pure-vs-side-effects]
    glossary: [reuse-boundary, platform-view]
    visual: { kind: diagram, concept: "The capstone module graph: domain/ (types, validate, summarize) imported by today's web UI and by future native and server layers; any arrow from domain/ into react-dom, storage or routing is flagged as a boundary violation." }
    analogy: "A recipe (domain code) works in any kitchen, while an instruction for one particular burner (platform code) does not (limit: a program never skips a line that does not fit — a domain function that touches localStorage crashes where there is none)."
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which of six capstone imports break the boundary, such as domain/summarize importing a formatting component." }
      - { kind: run-change, runtime: browser-react, summary: "Move a storage call out of a domain function into the data hook and confirm the domain tests still pass unchanged." }
      - { kind: write, runtime: browser-react, summary: "Write an index.ts for domain/ that exports only types, validators and pure transforms, using type-only imports where possible." }
    retrieval:
      - { concept: "type-only imports between modules", from: js-14-07-modules-type-imports }
      - { concept: "pure functions versus side effects", from: js-03-07-pure-vs-side-effects }
  - id: re-09-05-accessible-error-models
    title: { uk: "Доступні моделі помилок", en: "Accessible error models" }
    kind: instructional
    minutes: 12
    objectives:
      - "Design one typed error model (field errors, form-level error, request failure, render crash) and map each kind to where it is shown and how it is announced."
      - "Choose between an error boundary and handled error state for a given failure, and explain why boundaries miss event-handler and async errors."
    subskills:
      - { family: P-05, skill: "accessible error models", depth: intro }
      - { family: R-05, skill: "validation/errors", depth: practice }
      - { family: R-05, skill: "error boundaries and their limits", depth: practice }
    misconceptions:
      - "The route's error boundary will catch a save that fails inside onSubmit."
      - "Red text is enough; screen-reader users will notice it too."
    prerequisites: [re-09-04-reuse-boundaries, re-05-04-validation-accessible-errors, re-05-07-error-boundaries-limits]
    glossary: [error-model]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which of four injected failures (invalid field, rejected save, malformed response, throw during render) the route's error boundary catches." }
      - { kind: run-change, runtime: browser-react, summary: "Inject each failure in turn, then wire field errors through aria-describedby and the request failure to a live region and compare the printed accessibility report (a model of what the attributes give a screen reader)." }
      - { kind: write, runtime: browser-react, summary: "Render a typed AppError list so each kind is in its accessible place: field errors on the field and in the focused summary, form errors in the summary only, request failures in role=alert with focus kept and the draft intact." }
    retrieval:
      - { concept: "what error boundaries do not catch", from: re-05-07-error-boundaries-limits }
  - id: re-09-06-state-transition-tests
    title: { uk: "Тести переходів станів", en: "State-transition tests" }
    kind: instructional
    minutes: 12
    objectives:
      - "Write table-driven tests that assert the reducer's next state for every (state, action) pair that matters, including rejected transitions."
      - "Test a context-provided flow through the UI with a test provider, asserting only visible output."
    subskills:
      - { family: R-03, skill: "reducer state transitions", depth: practice }
      - { family: R-03, skill: "context boundaries", depth: practice }
    misconceptions:
      - "Testing the happy path is enough; invalid transitions cannot happen in practice."
      - "To test a component that uses context I must mock the whole context module."
    prerequisites: [re-09-05-accessible-error-models, re-06-08-testing-user-actions]
    glossary: [state-transition-test, transition-table]
    visual: { kind: diagram, concept: "A transition table with states as rows and actions as columns, each cell holding the expected next state; running the tests colors cells pass or fail and exposes one unhandled pair." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which cells of the transition table fail when the reducer accepts 'saved' while it is still 'idle'." }
      - { kind: run-change, runtime: browser-react, summary: "Run the table-driven tests, add the missing 'retry' from 'failure' cell and watch the suite change." }
      - { kind: write, runtime: browser-react, summary: "Write a create → fail → retry → succeed test through a test provider that asserts only visible text and roles." }
    retrieval:
      - { concept: "boundary cases: empty, one, many, null", from: js-09-03-boundary-cases }
  - id: re-09-07-debug-race-rollback-typed
    title: { uk: "Налагодження: недопустимий перехід, неперевірена відповідь, невдалий відкат", en: "Debug: invalid transition, unchecked response, failed rollback" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose from a supplied trace an invalid reducer transition, an unchecked response that crashes render, and a rollback that reinstates old data after a newer success."
      - "Repair all three with types, a schema parse and a version-aware rollback, adding one test per defect."
    subskills:
      - { family: P-05, skill: "typed props/state/events/hooks", depth: assess }
      - { family: P-05, skill: "typed reducers/context", depth: assess }
      - { family: P-05, skill: "API models and runtime schemas", depth: assess }
      - { family: R-06, skill: "optimistic update and rollback", depth: assess }
      - { family: R-06, skill: "stale data and consistency", depth: assess }
    misconceptions:
      - "If the typecheck passes, the response handling is safe."
    prerequisites: [re-09-06-state-transition-tests, re-06-09-debug-race-optimistic]
    glossary: []
    visual: { kind: sequence, concept: "UI, reducer, data layer and fixture API over time: two overlapping mutations on one record, the first fails after the second succeeds and the naive rollback reinstates the older value, while an unparsed malformed response flows straight into render." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Before running, mark which seeded defect shows a wrong value, which crashes render and which silently accepts an impossible state." }
      - { kind: run-change, runtime: browser-react, summary: "Run the seeded scenario with the fixture timeline controls and capture the reducer's transition log." }
      - { kind: debug, runtime: browser-react, summary: "Repair the reducer transition, add the schema parse at the API boundary and make rollback skip when a newer confirmed version exists; add one failing-then-passing test per defect." }
    retrieval:
      - { concept: "snapshot and rollback of an optimistic change", from: re-06-06-optimistic-rollback }
  - id: re-09-08-independent-typed-feature
    title: { uk: "Самостійно: строго типізована функція з відновленням", en: "Independent: strict typed feature with recovery" }
    kind: assessment
    minutes: 35
    objectives:
      - "Build, without hints, a strictly typed feature with parsed API data, a reducer with tested transitions, context limited to where it is needed, targeted cache invalidation and accessible recovery from every failure kind."
      - "Justify in two sentences which state is shared through context and which stays local, and which modules could be reused by a native or server app."
    subskills:
      - { family: P-05, skill: "native/server reuse boundaries", depth: assess }
      - { family: P-05, skill: "accessible error models", depth: assess }
      - { family: R-03, skill: "reducer state transitions", depth: assess }
      - { family: R-03, skill: "context boundaries", depth: assess }
      - { family: R-03, skill: "avoid needless global state", depth: assess }
      - { family: R-05, skill: "validation/errors", depth: assess }
      - { family: R-05, skill: "error boundaries and their limits", depth: assess }
      - { family: R-06, skill: "cache/invalidation principles", depth: assess }
    misconceptions: []
    prerequisites: [re-09-07-debug-race-rollback-typed]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-react, summary: "No-hint task: a synthetic reading-list feature with a typed API model and schema, a reducer and context scoped to the feature (no global store), invalidation after writes, accessible field and request errors, a boundary for render crashes and transition tests; hidden fixtures include malformed and failing responses." }
    retrieval:
      - { concept: "local versus shared state placement", from: re-04-02-where-state-lives }
  - id: re-09-09-capstone-typed-contracts
    title: { uk: "Проєкт: типізовані контракти", en: "Capstone: typed contracts" }
    kind: capstone-step
    minutes: 30
    objectives:
      - "Parse every capstone API response with a runtime schema, type the reducer and context strictly, and cover the main transitions and the rollback with tests."
    subskills:
      - { family: P-05, skill: "API models and runtime schemas", depth: practice }
    misconceptions: []
    prerequisites: [re-09-08-independent-typed-feature]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "In VS Code, add parse functions for the capstone records at the fixture API boundary, run the strict typecheck script, and add transition and rollback tests that run with the local test command." }
    retrieval:
      - { concept: "the capstone async data layer with optimistic rollback", from: re-06-11-capstone-async-data }
