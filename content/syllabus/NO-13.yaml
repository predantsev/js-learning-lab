# Syllabus spine for NO-13. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: NO-13
stage: NO
title: { uk: "React на сервері: справжні SSR і гідратація", en: "React on the server: a real SSR and hydration lab" }
summary:
  uk: "Учень без фреймворку рендерить список проєкту в HTML на Node-сервері, гідратує його у справжньому браузері, безпечно серіалізує початкові дані, тримаючи секрети на сервері, діагностує й обробляє невідповідності гідратації та помилки рендерингу і пояснює, що додали б React Server Components і чого вони вимагають."
  en: "The learner renders the capstone list to HTML on the Node server without a framework, hydrates it in a real browser, serializes initial data safely while keeping secrets server-side, diagnoses and handles hydration mismatches and render errors, and explains what React Server Components would add and require."
competencies: [B-11]
capstoneStep:
  mode: local
  objective:
    uk: "Відрендерити сторінку зі списком проєкту на Node-сервері, гідратувати її в браузері, залишити секрети на сервері та діагностувати одну навмисно внесену невідповідність."
    en: "Server-render the capstone list page from the Node server, hydrate it in the browser, keep secrets server-side and diagnose one injected mismatch."
  variants:
    wishlist:
      uk: "Відрендерити на сервері список бажань (name, price або «без ціни», стан acquired) із серіалізованих початкових даних, гідратувати перемикач acquired і знайти навмисну невідповідність через ціну, відформатовану типовою локаллю клієнта."
      en: "Server-render the item list (name, price or 'no price', acquired state) from serialized initial items, hydrate the acquired toggle, and diagnose an injected mismatch from a price formatted with the client's default locale."
    planner:
      uk: "Відрендерити на сервері список справ із підписами термінів (dueDate), обчисленими від значення today, яке передає сервер, гідратувати перемикач done і знайти навмисну невідповідність через те, що клієнт сам обчислює today."
      en: "Server-render the task list with dueDate labels computed from a today value the server passes in, hydrate the done toggle, and diagnose an injected mismatch caused by the client computing today on its own."
    habits:
      uk: "Відрендерити на сервері звички із серіями, обчисленими з completions для дня, який передає сервер, гідратувати кнопку «виконано сьогодні» й знайти навмисну невідповідність через серію, яку клієнт перераховує з Date.now()."
      en: "Server-render habits with streaks computed from completions for a server-supplied day, hydrate the 'done today' button, and diagnose an injected mismatch from a streak the client recomputes with Date.now()."
    expenses:
      uk: "Відрендерити на сервері список витрат із сумами, відформатованими з amountMinor у фіксованій локалі проєкту, гідратувати фільтр category і знайти навмисну невідповідність через різні типові налаштування Intl на сервері й клієнті."
      en: "Server-render the expense list with totals formatted from amountMinor in the project's fixed locale, hydrate the category filter, and diagnose an injected mismatch from server and client Intl defaults that differ."
# Retrieval plan: re-11-02-hydration-mismatch (hydration) ; no-03-01-http-server-lifecycle (server) ; re-11-04-secrets-server-only (secrets) ; js-07-04-json (serialization)
lessons:
  - id: no-13-01-render-to-string
    title: { uk: "Рендеримо React на Node", en: "Rendering React on Node" }
    kind: instructional
    minutes: 12
    objectives:
      - "Render a React component to an HTML string with react-dom/server and send it as a complete document from a node:http route."
      - "Predict which code runs during server rendering (component bodies) and which never runs there (effects, event handlers)."
    subskills:
      - { family: B-11, skill: "server rendering/static output", depth: intro }
    misconceptions:
      - "useEffect also runs on the server, so I can load the page's data inside it."
      - "A server-rendered page is interactive as soon as it appears."
    prerequisites: [re-11-01-csr-ssr-static, no-03-03-routing-json-bodies]
    glossary: [render-to-string, server-entry]
    visual: { kind: sequence, concept: "Browser, the node:http server and React over time: GET / arrives, the server loads records from the repository, calls renderToString on the list component, wraps the markup in a document and responds; the browser paints the list before any JavaScript arrives, and no effect or handler has run." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the HTML that renderToString produces for a list component with two synthetic records, and which console.log lines (component body, useEffect) appear in the server output." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the render script (the course runner has no npm packages, so isolated-node blocks use mini-react.js, a teaching stand-in whose renderToString output matches react-dom/server 19.3.0 for this unit's components), then serve the same markup from a node:http route on loopback, fetch it and compare the response body with the string." }
      - { kind: write, runtime: isolated-node, summary: "Write renderPage(records) that returns a complete HTML document with the rendered list inside the root element and a script tag for the client entry." }
    retrieval:
      - { concept: "request/response lifecycle of a node:http server", from: no-03-01-http-server-lifecycle }
  - id: no-13-02-hydration-browser
    title: { uk: "Гідратація в браузері", en: "Hydration in the browser" }
    kind: instructional
    minutes: 12
    objectives:
      - "Hydrate server-rendered markup with hydrateRoot using exactly the same component and initial data as the server."
      - "Show that before hydration the buttons do nothing, and after it React attaches handlers to the existing DOM nodes instead of recreating them."
    subskills:
      - { family: B-11, skill: "hydration", depth: intro }
    misconceptions:
      - "Hydration renders the page again from scratch and replaces the server HTML."
      - "The client can render with fresher data of its own; React will reconcile any difference."
    prerequisites: [no-13-01-render-to-string, re-11-02-hydration-mismatch]
    glossary: [hydrate-root, client-entry]
    visual: { kind: sequence, concept: "Server HTML arrives and is painted, the client entry loads, hydrateRoot walks the existing DOM against the client render and attaches the toggle handler to the same button node; a click before hydration does nothing, a click after it updates state." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict whether the HTML of two renderToString calls matches when both get the server's initial data, and when the second, client-like render reads Date.now() instead." }
      - { kind: run-change, runtime: isolated-node, summary: "Run both renders, diff the two HTML strings, then pass the same initial data to both and confirm the diff is empty." }
      - { kind: write, runtime: isolated-node, summary: "Write the client entry as startClient(doc, hydrateRoot), which reads the initial data from the page and hydrates #root with the same <WishList> props, and matchesServer(doc), the server/client markup comparison a test would run." }
      - { kind: run-change, runtime: browser-react, summary: "In the browser preview, insert the server HTML string into the root, call hydrateRoot with the same data and confirm the existing button node receives its click handler without being recreated." }
      - { kind: local-task, runtime: local-node, summary: "On your machine, serve the page and the client entry from your local server, open it in the browser, click the toggle before and after the script loads and confirm in DevTools that the list nodes were reused." }
    retrieval:
      - { concept: "hydration and the causes of mismatch", from: re-11-02-hydration-mismatch }
  - id: no-13-03-data-secret-boundary
    title: { uk: "Межа даних і секретів", en: "Data and secret boundary" }
    kind: instructional
    minutes: 12
    objectives:
      - "Serialize only the public initial data into the page with an HTML-safe JSON encoding that cannot close the script element."
      - "Keep secrets, data paths and server-only modules out of both the serialized payload and the client bundle, and check both."
    subskills:
      - { family: B-11, skill: "server/client data/secret boundary", depth: intro }
    misconceptions:
      - "Putting JSON.stringify(data) inside a script tag is always safe."
      - "A value that is never shown on screen cannot leak to the browser."
    prerequisites: [no-13-02-hydration-browser, re-11-04-secrets-server-only]
    glossary: [initial-data-payload, html-safe-json]
    visual: { kind: diagram, concept: "Server-side boxes (repository, config holding a token, data directory) and client-side boxes (HTML, the initial-data script, the client bundle) split by a boundary line; only allowlisted record fields cross it, a record name containing </script> crosses escaped, and the token is stopped at the line." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict what the browser does with a page whose initial data is JSON.stringify of a record named '</script><script>alert(1)</script>', and which config fields appear in the page source." }
      - { kind: run-change, runtime: isolated-node, summary: "Render the page with the hostile synthetic record and inspect the raw HTML, then switch to an HTML-safe serializer with a public-fields allowlist and inspect it again." }
      - { kind: write, runtime: isolated-node, summary: "Write toInitialData(records) that keeps only public fields and serializeForHtml(value) that escapes <, >, & and U+2028/U+2029, with a test on the hostile record." }
      - { kind: local-task, runtime: local-node, summary: "In the local SSR lab, find a token that a client import put into the esbuild bundle and remove it with a public settings module, then watch a </script> record run an alert through JSON.stringify and stop it with serializeForHtml." }
    retrieval:
      - { concept: "secrets stay in server-only code", from: re-11-04-secrets-server-only }
      - { concept: "what JSON can and cannot represent", from: js-07-04-json }
  - id: no-13-04-mismatch-error-handling
    title: { uk: "Невідповідності й обробка помилок", en: "Mismatch and error handling" }
    kind: instructional
    minutes: 12
    objectives:
      - "Classify hydration-mismatch causes (time, locale, random ids, browser-only APIs, different data) and remove each one at its source."
      - "Handle a server render error with a safe 500 fallback page and a client-side mismatch through onRecoverableError and an error boundary, logging both with the request id."
    subskills:
      - { family: B-11, skill: "mismatch/error handling", depth: intro }
    misconceptions:
      - "A hydration warning in the console is cosmetic; the page works the same."
      - "Adding suppressHydrationWarning everywhere is the fix for mismatches."
    prerequisites: [no-13-03-data-secret-boundary, re-05-07-error-boundaries-limits]
    glossary: [recoverable-error]
    visual: { kind: sequence, concept: "Server, HTML, client and the error log over time: a component throws during server rendering and the route answers with a 500 fallback page and a logged request id; a second request hydrates a locale-dependent label, React reports a recoverable error and re-renders that subtree on the client, and the report is logged." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict what the user sees and what is logged when the list component throws during renderToString, and when a toLocaleString label differs between server and client." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the server route with the throwing component, then add a try/catch that returns a fallback page with status 500 and a logged request id, and rerun." }
      - { kind: write, runtime: isolated-node, summary: "Write renderRoute(req, res) that sends the rendered page or a safe 500 fallback, and an onRecoverableError handler that reports the mismatch with its component stack." }
      - { kind: run-change, runtime: browser-react, summary: "In the browser preview, hydrate markup whose label was formatted in another locale and read the error that reaches onRecoverableError." }
    retrieval:
      - { concept: "what error boundaries catch and what they miss", from: re-05-07-error-boundaries-limits }
  - id: no-13-05-rsc-constraints
    title: { uk: "Обмеження інтеграції RSC (грамотність)", en: "RSC integration constraints (literacy)" }
    kind: instructional
    minutes: 10
    objectives:
      - "Explain what React Server Components add beyond the SSR built in this unit (server-only components, a serialized component payload) and why they need bundler and framework integration."
      - "Sort the props of a given tree into serializable and non-serializable across a server-to-client component boundary."
    subskills:
      - { family: B-11, skill: "RSC integration constraints literacy", depth: intro }
    misconceptions:
      - "RSC is just another name for server-side rendering."
      - "I can switch on server components in my hand-built node:http SSR with one flag."
    prerequisites: [no-13-04-mismatch-error-handling, re-11-05-rsc-frameworks-stability]
    glossary: [rsc-payload, bundler-integration]
    visual: { kind: diagram, concept: "Two pipelines side by side: this unit's SSR (component → HTML string → hydrate the whole tree) and an RSC setup (server components → serialized payload → client components hydrated where marked), with the bundler box and the serialization boundary that the hand-built server lacks highlighted." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict which props in a supplied component tree could cross a server-to-client component boundary: a Date, an event handler, a plain record object, a Map." }
      - { kind: run-change, runtime: isolated-node, summary: "Run a serializability checker over the supplied props, then change the tree so only plain data crosses the boundary and rerun." }
      - { kind: write, runtime: isolated-node, summary: "Write a short note on what moving the capstone list to RSC would require (bundler, framework or experimental APIs, version labels) and what it would gain, citing the checker output." }
    retrieval:
      - { concept: "RSC, frameworks and API stability", from: re-11-05-rsc-frameworks-stability }
  - id: no-13-06-debug-hydration-mismatch
    title: { uk: "Налагодження: справжня невідповідність гідратації та витік секрету", en: "Debug: a real hydration mismatch and a leaked secret" }
    kind: instructional
    minutes: 15
    objectives:
      - "Reproduce a real hydration mismatch from a server request and trace it to the line that renders differently on the client."
      - "Find a secret leaking into the serialized initial data and remove it without breaking hydration."
      - "Repair a route that crashes the server on a render error instead of returning a fallback."
    subskills:
      - { family: B-11, skill: "hydration", depth: assess }
      - { family: B-11, skill: "server/client data/secret boundary", depth: assess }
      - { family: B-11, skill: "mismatch/error handling", depth: assess }
    misconceptions:
      - "If the page looks right, there cannot be a hydration problem."
    prerequisites: [no-13-05-rsc-constraints]
    glossary: []
    visual: { kind: sequence, concept: "The seeded failure replayed: the server renders 'Due today' from its own date, the client renders 'Overdue' from the browser clock and React reports the mismatch at that node; the page source shows the config token inside the initial-data script." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Before running, mark which seeded defect causes the mismatch (a client-side Date.now(), a random id, a locale default), which leaks the API token and which crashes the route." }
      - { kind: run-change, runtime: isolated-node, summary: "Fetch the seeded page from the loopback server, compare its HTML with a client-data render, search the initial-data payload, and match each finding to your prediction." }
      - { kind: debug, runtime: isolated-node, summary: "Repair all three defects (pass today from the server, allowlist the payload fields, catch render errors with a fallback); the checks compare server and client renders and assert no secret in the HTML (the learner writes such tests in the no-13-07 local task)." }
      - { kind: run-change, runtime: local-node, summary: "On your machine, load the seeded page in the browser and read the hydration error in the console, then reload after your fix and confirm it is gone." }
    retrieval:
      - { concept: "finding a mismatch in a supplied trace", from: re-11-06-debug-hydration-trace }
  - id: no-13-07-independent-ssr-lab
    title: { uk: "Самостійно: SSR-лабораторна зі справжніми запитами", en: "Independent: SSR lab with real requests" }
    kind: assessment
    minutes: 35
    objectives:
      - "Build, without hints and without a framework, an SSR route on the local Node server that renders a synthetic page, hydrates it in the browser and passes server/client render-comparison tests."
      - "Explain in a short note which parts of the result an RSC setup would change and what it would require."
    subskills:
      - { family: B-11, skill: "server rendering/static output", depth: assess }
      - { family: B-11, skill: "RSC integration constraints literacy", depth: assess }
    misconceptions: []
    prerequisites: [no-13-06-debug-hydration-mismatch]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: isolated-node, summary: "No-hint, assessed: createApp and clientElement for a synthetic reading-list page — complete document, allowlisted HTML-safe initial data, no settings, matching client render, module script, safe 500 with an escaped request id, 404 — checked over real HTTP." }
      - { kind: independent, runtime: local-node, summary: "No-hint task on your machine: the same route with real react-dom/server, an esbuild client entry that hydrates the interactive filter, node:test tests that compare server and client markup and search for secrets, and RSC.md on the RSC constraints." }
    retrieval:
      - { concept: "safe sinks for untrusted text", from: js-16-07-xss-safe-sinks }
    # design note: no-hint
  - id: no-13-08-capstone-ssr-list
    title: { uk: "Проєкт: список, відрендерений на сервері", en: "Capstone: server-rendered list" }
    kind: capstone-step
    minutes: 35
    objectives:
      - "Server-render the capstone list page from the Node server with safe initial data, hydrate it in the browser and diagnose one injected mismatch."
    subskills:
      - { family: B-11, skill: "server rendering/static output", depth: practice }
    misconceptions: []
    prerequisites: [no-13-07-independent-ssr-lab, no-12-12-capstone-operate]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-node, summary: "In server/, add GET / that loads records from the repository, renders the shared list component with renderToString, embeds HTML-safe public initial data and serves the client entry that hydrates it." }
      - { kind: local-task, runtime: local-node, summary: "On your machine, inject your domain's mismatch (client-side date, clock or locale), find it from the browser console and the HTML diff, fix it at the source and confirm a clean hydration." }
    retrieval:
      - { concept: "integrated clients reading from the server", from: no-06-09-capstone-integrate-clients }
