# Syllabus spine for JS-10. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-10
stage: JS
title: { uk: "З платформи у VS Code: експорт і локальний запуск", en: "From the platform to VS Code: export and local run" }
summary:
  uk: "Учень експортує свій проєкт, відкриває ті самі файли у VS Code, встановлює залежності й запускає його локально, порівнює поведінку та збережені дані з версією на платформі, перевіряє код через DevTools, source maps і lint, лагодить проєкт, що не запускається, і фіксує контрольну точку CP-JS у commit."
  en: "The learner exports the project, opens the same files in VS Code, installs and runs it locally, compares behavior and saved data with the platform version, inspects it with DevTools, source maps and lint, repairs a project that will not start, and records the CP-JS checkpoint in a commit."
competencies: [P-01]
capstoneStep:
  mode: local
  objective:
    uk: "CP-JS: експортувати проєкт у VS Code, встановити й запустити його локально, порівняти збережені дані й поведінку з версією на платформі та зробити commit."
    en: "CP-JS: export the capstone to VS Code, install and run it locally, compare saved data and behavior with the in-platform version, commit."
  variants:
    wishlist:
      uk: "Після відновлення збережених бажань через serialize/restore JSON локальний «Список бажань» показує той самий підсумок бажаного, фільтр acquired і окремий лічильник бажань без price, що й на платформі; результат зафіксовано в commit."
      en: "After the saved wishes are restored through the app's serialize/restore JSON, the local wishlist shows the same wanted-total, acquired filter and separate count of wishes without a price as the platform version; the result is committed."
    planner:
      uk: "Після відновлення справ через serialize/restore JSON локальний «Планувальник» дає той самий лічильник справ до терміну для однакового «сьогодні», фільтр done і порядок за priority, що й на платформі; результат зафіксовано в commit."
      en: "After the tasks are restored through serialize/restore JSON, the local planner gives the same due-count for the same today, done filter and priority order as the platform version; the result is committed."
    habits:
      uk: "Після відновлення звичок через serialize/restore JSON локальний «Трекер звичок» показує ті самі серії й частку виконань для однакового «сьогодні» та фільтр active, що й на платформі; результат зафіксовано в commit."
      en: "After the habits are restored through serialize/restore JSON, the local habit tracker shows the same streaks and completion rate for the same today and the same active filter as the platform version; the result is committed."
    expenses:
      uk: "Після відновлення витрат через serialize/restore JSON локальний «Трекер витрат» дає ті самі підсумки amountMinor за кожною category і загальний підсумок, що й на платформі; результат зафіксовано в commit."
      en: "After the expenses are restored through serialize/restore JSON, the local expense tracker gives the same amountMinor totals per category and overall as the platform version; the result is committed."
# Retrieval plan: js-15-03-node-and-package-manifest (scripts) ; js-07-05-persist-reload (storage origin) ; js-09-08-independent-delayed-retrieval (CRUD checks)
lessons:
  - id: js-10-01-what-the-export-contains
    title: { uk: "Що містить експорт", en: "What the export contains" }
    kind: instructional
    minutes: 10
    objectives:
      - "List what the export contains (every current file including unsaved edits, package.json scripts, a manifest with file hashes, instructions, the selected capstone) and what it leaves out (records in the platform's storage, lesson progress)."
      - "Read the export's package.json scripts and say which command starts the project and which runs its tests."
      - "Explain that after export the local files are authoritative: later checkpoints arrive as separate reference downloads and diffs, never as an automatic replacement or sync."
    subskills:
      - { family: P-01, skill: "package scripts/manifest", depth: practice }
    misconceptions:
      - "Exporting also copies my saved records, because they are part of my project."
      - "After export, the platform and VS Code keep each other's files in sync."
    prerequisites: [js-15-15-capstone-local-home, js-15-03-node-and-package-manifest]
    glossary: [project-export, export-manifest, checksum]
    visual: { kind: diagram, concept: "The export as a box: workspace files (one unsaved edit marked), package.json with its scripts, the manifest listing each file with its hash, and the README instructions go in; records in the platform's storage and lesson progress stay outside, with an arrow showing they travel only through the capstone's serialize/restore JSON." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of seven items appear in the export preview: source files, an unsaved edit, package.json scripts, the manifest with hashes, README instructions, records saved in storage, and lesson progress." }
      - { kind: run-change, runtime: browser-js, summary: "Run the in-course manifest check over the export preview, edit one file and run the check again to see that file's hash mismatch flagged." }
      - { kind: write, runtime: browser-js, summary: "Write the start and test entries of the capstone's package.json scripts so the in-course checker, which parses the file with JSON.parse, maps npm start and npm test to the right files." }
    retrieval:
      - { concept: "what a package.json script runs and how npm finds it", from: js-15-03-node-and-package-manifest }
  - id: js-10-02-export-open-install-run
    title: { uk: "Експорт, відкриття у VS Code, встановлення, запуск", en: "Export, open in VS Code, install, run" }
    kind: local-task
    minutes: 20
    objectives:
      - "Export the capstone, unpack it into the local project folder from JS-15, open that folder in VS Code and work from its integrated terminal at the project root."
      - "Install dependencies from the lockfile and start the project with the documented script, checking each command before running it."
    subskills:
      - { family: P-01, skill: "files/paths and shell navigation", depth: assess }
      - { family: P-01, skill: "safe commands", depth: assess }
      - { family: P-01, skill: "package manager/lockfile", depth: practice }
    misconceptions: []
    prerequisites: [js-10-01-what-the-export-contains, js-15-04-install-lockfile-semver]
    glossary: [integrated-terminal]
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "Export the capstone, place the files in the JS-15 project folder beside the README commit, open it in VS Code, run npm ci and npm start in the integrated terminal, and record the local URL and the start output." }
      - { kind: independent, runtime: local-web, summary: "Without hints, reproduce the setup in a second clean folder from the export's README alone, refusing any step that would need sudo or print a secret, and record every command with its result." }
    retrieval:
      - { concept: "absolute and relative paths from the working directory", from: js-15-01-terminal-files-paths }
  - id: js-10-03-compare-and-inspect
    title: { uk: "Порівнюємо поведінку й перевіряємо через DevTools", en: "Compare behavior and inspect with DevTools" }
    kind: local-task
    minutes: 15
    objectives:
      - "Confirm that the local address starts with empty storage, then move the saved records from the platform into the local run through the capstone's serialize/restore JSON."
      - "Compare CRUD, the filter and the derived value with the platform version, inspect the local run in DevTools through source maps, and run lint locally until it is clean."
    subskills:
      - { family: P-01, skill: "source maps", depth: assess }
      - { family: P-01, skill: "lint/format", depth: assess }
    misconceptions: []
    prerequisites: [js-10-02-export-open-install-run, js-07-05-persist-reload]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "Open the local run, confirm its storage starts empty at the new address, restore the records exported from the platform through serialize/restore JSON, and fill in the side-by-side checklist for CRUD, filter and the derived value." }
      - { kind: independent, runtime: local-web, summary: "Without hints, set a breakpoint in the original domain module through the source map in DevTools, confirm or explain any difference from the platform run, and run the lint script until it reports no findings." }
    retrieval:
      - { concept: "stored data belongs to the page's address in this browser", from: js-07-05-persist-reload }
  - id: js-10-04-debug-local-run-failure
    title: { uk: "Налагодження: експортований проєкт не запускається", en: "Debug: the exported project does not start" }
    kind: local-task
    minutes: 15
    objectives:
      - "Diagnose a seeded exported project that will not start: a start script pointing at a moved file, an import missing its .js extension and a missing env value."
      - "Repair it without deleting the lockfile or overwriting your own files, and confirm with npm start and npm test."
    subskills:
      - { family: P-01, skill: "package scripts/manifest", depth: assess }
      - { family: P-01, skill: "build/env/config", depth: practice }
    misconceptions: []
    prerequisites: [js-10-03-compare-and-inspect, js-15-13-debug-broken-setup]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "Unpack the seeded broken export into a separate folder, run npm start and npm test, and record each error message together with the file and line it names." }
      - { kind: debug, runtime: local-web, summary: "Repair the start script's moved entry file, the import missing its .js extension and the env value supplied from an uncommitted .env file, then confirm npm start and npm test pass." }
    retrieval:
      - { concept: "module load errors caused by a wrong specifier", from: js-07-08-cjs-and-load-failures }
  - id: js-10-05-capstone-cp-js
    title: { uk: "Контрольна точка проєкту CP-JS", en: "Capstone checkpoint CP-JS" }
    kind: capstone-step
    minutes: 30
    objectives:
      - "Verify the exported capstone locally without hints (CRUD, filter, persistence across a reload and the domain tests) and commit the checkpoint with a message that records what was verified."
    subskills:
      - { family: P-01, skill: "files/paths and shell navigation", depth: practice }
    misconceptions: []
    prerequisites: [js-10-04-debug-local-run-failure, js-09-09-capstone-tests]
    glossary: [checkpoint]
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "Commit the exported capstone in the JS-15 repository with a message listing what was verified, then confirm git status is clean and git log --oneline shows the checkpoint." }
      - { kind: independent, runtime: local-web, summary: "Without hints, verify CRUD, the status filter, persistence across a reload of the local run and npm test against the CP-JS rubric, and record the evidence (test output, completed checklist, git log --oneline)." }
    retrieval:
      - { concept: "CRUD, filter and persistence checked by tests", from: js-09-08-independent-delayed-retrieval }
