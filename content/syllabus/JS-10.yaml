# Syllabus spine for JS-10. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
# Revised while authoring (2026-10-02) against the real export (shared/project-export.js): the zip
# carries a copy of the project storage (data/exported-storage.json) and a restore page, has no
# dependencies, no lockfile and only a start script. Lint, build/source maps and env are added by the
# learner to the exported project, so the lessons describe exactly what the platform produces.
unit: JS-10
stage: JS
title: { uk: "З платформи у VS Code: експорт і локальний запуск", en: "From the platform to VS Code: export and local run" }
summary:
  uk: "Учень експортує свій проєкт, відкриває ті самі файли у VS Code, встановлює залежності й запускає його локально, порівнює поведінку та збережені дані з версією на платформі, перевіряє код через DevTools, source maps і lint, лагодить проєкт, що не запускається, і фіксує контрольну точку CP-JS у commit."
  en: "The learner exports the project, opens the same files in VS Code, installs and runs it locally, compares behavior and saved data with the platform version, inspects it with DevTools, source maps and lint, repairs a project that will not start, and records the CP-JS checkpoint in a commit."
competencies: [P-01]
capstoneStep:
  mode: local
  objective:
    uk: "CP-JS: у теці ~/js-course/<проєкт> додати скрипт test (node run-tests.js) і показати, що npm test проходить, а тест, що падає, дає код завершення 1; запустити проєкт локально, відновити дані з експорту, перевірити додавання, редагування, видалення, фільтр і збереження після перезавантаження та зробити commit контрольної точки."
    en: "CP-JS: in the folder ~/js-course/<capstone> add a test script (node run-tests.js) and show that npm test passes while a failing test gives exit code 1; run the project locally, restore the exported data, check adding, editing, deleting, the filter and persistence after a reload, and commit the checkpoint."
  variants:
    wishlist:
      uk: "Після відновлення бажань через сторінку відновлення з експорту (tools/restore-data.html) локальний «Список бажань» показує той самий підсумок бажаного й окремий лічильник бажань без price, що й на платформі, а filterItems(…, \"acquired\") у Console дає стільки ж, скільки карток з позначкою; результат зафіксовано в commit."
      en: "After the wishes are restored through the export's restore page (tools/restore-data.html), the local wishlist shows the same wanted-total and separate count of wishes without a price as the platform version, and filterItems(…, \"acquired\") in the Console gives as many as there are marked cards; the result is committed."
    planner:
      uk: "Після відновлення справ через сторінку відновлення з експорту (tools/restore-data.html) локальний «Планувальник» дає той самий лічильник справ до терміну на дату сторінки, що й на платформі, а filterTasks(…, \"done\") у Console — стільки ж, скільки карток виконаних справ; результат зафіксовано в commit."
      en: "After the tasks are restored through the export's restore page (tools/restore-data.html), the local planner gives the same due-count for the page's date as the platform version, and filterTasks(…, \"done\") in the Console gives as many as there are done cards; the result is committed."
    habits:
      uk: "Після відновлення звичок через сторінку відновлення з експорту (tools/restore-data.html) локальний «Трекер звичок» показує ту саму частку виконань кожної активної звички, що й на платформі, а filterHabits(…, \"active\") у Console — стільки ж, скільки активних карток; результат зафіксовано в commit."
      en: "After the habits are restored through the export's restore page (tools/restore-data.html), the local habit tracker shows the same completion rate of every active habit as the platform version, and filterHabits(…, \"active\") in the Console gives as many as there are active cards; the result is committed."
    expenses:
      uk: "Після відновлення витрат через сторінку відновлення з експорту (tools/restore-data.html) локальний «Трекер витрат» дає ті самі підсумки amountMinor за кожною category і загальний підсумок, що й на платформі, а filterExpenses(…, \"food\") у Console — стільки ж, скільки карток «Їжа»; результат зафіксовано в commit."
      en: "After the expenses are restored through the export's restore page (tools/restore-data.html), the local expense tracker gives the same amountMinor totals per category and overall as the platform version, and filterExpenses(…, \"food\") in the Console gives as many as there are “Food” cards; the result is committed."
# Retrieval plan: js-15-03-node-and-package-manifest (scripts) ; js-15-01-terminal-files-paths (paths) ; js-07-05-persist-reload (storage origin) ; js-07-08-cjs-and-load-failures (load errors) ; js-09-08-independent-delayed-retrieval (CRUD checks)
lessons:
  - id: js-10-01-what-the-export-contains
    title: { uk: "Що містить експорт", en: "What the export contains" }
    kind: instructional
    minutes: 15
    objectives:
      - "List what the export zip contains (every current file including unsaved edits, README, package.json with one start script, serve.mjs, jsll-manifest.json with a SHA-256 per file, a copy of the project storage in data/exported-storage.json and the restore page tools/restore-data.html) and what it leaves out (lesson progress, snapshots)."
      - "Read the export's package.json scripts, say what npm start runs, notice that there is no test script and add one."
      - "Explain that after export the local files are authoritative: later checkpoints arrive as separate reference downloads and diffs that you merge by hand after a commit, never as an automatic replacement or sync."
    subskills:
      - { family: P-01, skill: "package scripts/manifest", depth: practice }
    misconceptions:
      - "The saved records are in the export, so the local page will show them by itself."
      - "After export, the platform and VS Code keep each other's files in sync."
    prerequisites: [js-15-15-capstone-local-home, js-15-03-node-and-package-manifest]
    glossary: [project-export, export-manifest, checksum]
    visual: { kind: diagram, concept: "The export as a box: the learner's files (one unsaved edit included), the generated README, package.json, serve.mjs and the manifest with a hash per file, and a copy of the project storage as a file; lesson progress and snapshots stay in the platform; the restore page writes the stored copy into the browser storage of the local address only on a click." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of seven items are inside the exported zip: the learner's files, an unsaved edit, package.json with its start script, the manifest with hashes, a copy of the saved records as a file, lesson progress and the platform's snapshots." }
      - { kind: run-change, runtime: browser-js, summary: "Run an in-course manifest check over a small exported folder (fetch each listed file, hash it with SHA-256, compare with the manifest), edit one file and run the check again to see that file flagged." }
      - { kind: write, runtime: browser-js, summary: "Edit an exported package.json so that npm start still runs serve.mjs and a new test script runs node run-tests.js (the driver that calls run() of the course runner testing.js; node --test would report the registering test file as passed without running a check); the in-course checker parses the file with JSON.parse, so a trailing comma or a script without node fails." }
    retrieval:
      - { concept: "what a package.json script runs and how npm finds it", from: js-15-03-node-and-package-manifest }
  - id: js-10-02-export-open-install-run
    title: { uk: "Експорт, відкриття у VS Code, встановлення, запуск", en: "Export, open in VS Code, install, run" }
    kind: local-task
    minutes: 25
    objectives:
      - "Create (or reuse) the capstone folder ~/js-course/<capstone> with a Git repository and a committed README, export the capstone, unpack it next to that folder, move the files in without overwriting the committed README, open the folder in VS Code and work from its integrated terminal at the project root."
      - "Check where a command will act before running it (pwd, ls package.json), run npm install to see that there is nothing to install and that it writes package-lock.json, and start the project with npm start."
    subskills:
      - { family: P-01, skill: "files/paths and shell navigation", depth: assess }
      - { family: P-01, skill: "safe commands", depth: assess }
      - { family: P-01, skill: "package manager/lockfile", depth: practice }
    misconceptions: []
    prerequisites: [js-10-01-what-the-export-contains, js-15-04-install-lockfile-semver]
    glossary: [integrated-terminal]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: local-web, summary: "Predict what npm start does when it is run one folder above the project: in a folder with no package.json above it, and inside another npm project." }
      - { kind: local-task, runtime: local-web, summary: "Create ~/js-course/<capstone> with git init -b main and a README commit (or reuse it), export the capstone as a zip, unpack it next to that folder, move the files in with mv -n after renaming the export's README, open the folder in VS Code, run npm install and npm start in the integrated terminal, and record the local URL and the start output." }
      - { kind: independent, runtime: local-web, summary: "Without hints, reproduce the setup in a second clean folder from the export's README alone while the first copy still runs, handle the busy port with the documented --port option, refuse any step that would need sudo or print a secret, and record every command with its result." }
    retrieval:
      - { concept: "absolute and relative paths from the working directory", from: js-15-01-terminal-files-paths }
  - id: js-10-03-compare-and-inspect
    title: { uk: "Порівнюємо поведінку й перевіряємо через DevTools", en: "Compare behavior and inspect with DevTools" }
    kind: local-task
    minutes: 35
    objectives:
      - "Confirm that the local address starts with empty storage, then move the saved records from the platform into the local run through the export's restore page, and compare CRUD, the filter and the derived value with the platform version."
      - "Add ESLint and Prettier as dev dependencies, run lint until it is clean and tell a lint finding from a formatting change; add esbuild, build a bundle with a source map, and pause at a breakpoint in the original domain module through that source map in DevTools."
    subskills:
      - { family: P-01, skill: "source maps", depth: assess }
      - { family: P-01, skill: "lint/format", depth: assess }
    misconceptions: []
    prerequisites: [js-10-02-export-open-install-run, js-07-05-persist-reload]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: local-web, summary: "Predict what the local page shows on its first open, after the restore page, and at localhost instead of 127.0.0.1." }
      - { kind: local-task, runtime: local-web, summary: "Open the local run, confirm its storage starts empty at the new address, restore the records through tools/restore-data.html, fill in the side-by-side checklist for CRUD, filter and the derived value, and pause in a domain function in DevTools." }
      - { kind: local-task, runtime: local-web, summary: "Install ESLint and Prettier as dev dependencies, configure browser globals for .js and Node globals for serve.mjs, run lint, fix the unused catch binding it reports in the storage module, format with Prettier and read the diff to see that formatting changed only layout." }
      - { kind: independent, runtime: local-web, summary: "Without hints, add a build script with esbuild and a source map, open a check page that loads the bundle, pause at a breakpoint set in the original domain module through the source map, confirm lint stays clean after the build and commit; record the outputs." }
    retrieval:
      - { concept: "stored data belongs to the page's address in this browser", from: js-07-05-persist-reload }
  - id: js-10-04-debug-local-run-failure
    title: { uk: "Налагодження: експортований проєкт не запускається", en: "Debug: the exported project does not start" }
    kind: local-task
    minutes: 20
    objectives:
      - "Diagnose an exported project that will not start: a start script that names a file that is not there and an import missing its .js extension, reading each error for the file it names."
      - "Move the port into an uncommitted .env file read by node --env-file, reproduce the project from a fresh clone, repair the missing .env and the missing node_modules without deleting the lockfile or overwriting your own files, and confirm with npm start and npm run lint."
    subskills:
      - { family: P-01, skill: "package scripts/manifest", depth: assess }
      - { family: P-01, skill: "build/env/config", depth: practice }
    misconceptions: []
    prerequisites: [js-10-03-compare-and-inspect, js-15-13-debug-broken-setup]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: debug, runtime: browser-js, summary: "In a seeded exported expense tracker the page does not start because an import lost its .js extension, and package.json's start script names server.mjs while the file is serve.mjs; read each error, repair both and confirm that the page shows the expenses and their total." }
      - { kind: local-task, runtime: local-web, summary: "Move the port into .env with a committed .env.example, change the start script to node --env-file=.env serve.mjs, commit, clone the repository into a clean folder, run npm start and npm run lint there, and record each error message before changing anything." }
      - { kind: debug, runtime: local-web, summary: "In the clean clone, repair the missing .env from .env.example and the missing node_modules with npm ci, never deleting package-lock.json, then confirm that npm start and npm run lint pass and that no tracked file changed." }
    retrieval:
      - { concept: "module load errors caused by a wrong specifier", from: js-07-08-cjs-and-load-failures }
  - id: js-10-05-capstone-cp-js
    title: { uk: "Контрольна точка проєкту CP-JS", en: "Capstone checkpoint CP-JS" }
    kind: capstone-step
    minutes: 30
    objectives:
      - "Verify the exported capstone locally without hints (CRUD, filter, persistence across a reload and the domain tests) and commit the checkpoint with a message that records what was verified."
    subskills:
      - { family: P-01, skill: "files/paths and shell navigation", depth: practice }
    misconceptions: []
    prerequisites: [js-10-04-debug-local-run-failure, js-09-09-capstone-tests]
    glossary: [checkpoint]
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "Commit the exported capstone in the ~/js-course/<capstone> repository with a message listing what was verified, then confirm git status is clean and git log --oneline shows the checkpoint." }
      - { kind: independent, runtime: local-web, summary: "Without hints, verify CRUD, the status filter, persistence across a reload of the local run and npm test against the CP-JS rubric, and record the evidence (test output, completed checklist, git log --oneline)." }
    retrieval:
      - { concept: "CRUD, filter and persistence checked by tests", from: js-09-08-independent-delayed-retrieval }
