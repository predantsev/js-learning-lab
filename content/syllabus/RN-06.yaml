# Syllabus spine for RN-06. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RN-06
stage: RN
title: { uk: "Мережа, фікстури й дозволи в нативному застосунку", en: "Native networking, fixtures and permissions" }
summary:
  uk: "Учень завантажує дані з вбудованих фікстур і наданого mock-сервісу без власного бекенду, правильно адресує хост з емулятора, симулятора чи пристрою, застосовує тайм-аути, скасування й обмежені повтори, показує чесні стани офлайну й помилок, пояснює захист транспорту й мережеві налаштування платформи та запитує дозвіл лише після перевірки можливостей — на заявленій цілі."
  en: "The learner loads data from bundled fixtures and the supplied mock service without writing a backend, addresses the host correctly from an emulator, simulator or device, applies timeouts, cancellation and bounded retry, shows honest offline and error states, explains transport security and platform network configuration, and requests a permission only after checking the capability — on the declared target."
competencies: [N-06, N-07]
capstoneStep:
  mode: local
  objective:
    uk: "Завантажувати дані проєкту в нативному застосунку з вбудованих фікстур і наданого mock-сервісу з правильною адресою хоста, обмеженими повторами, скасуванням і станом офлайну."
    en: "Load capstone data in the native app from bundled fixtures and the supplied mock service with correct host addressing, bounded retry, cancellation and offline state."
  variants:
    wishlist:
      uk: "Завантажувати бажання з endpoint записів наданого mock-сервісу з тайм-аутом і щонайбільше трьома спробами, в офлайні переходити на вбудовані фікстури, скасовувати запит, коли екран записів із сервісу втрачає фокус, і рахувати суму бажаного лише з даних, які справді завантажилися."
      en: "Fetch wishes from the supplied mock service's records endpoint with a timeout and at most three attempts, fall back to the bundled fixtures when offline, cancel the request when the service records screen loses focus, and compute the wanted-items total only from data that actually loaded."
    planner:
      uk: "Завантажувати справи з endpoint записів наданого mock-сервісу з тайм-аутом і щонайбільше трьома спробами, в офлайні переходити на вбудовані фікстури, скасовувати запит, коли екран записів із сервісу втрачає фокус, і рахувати справи на сьогодні із завантажених даних, передаючи сьогоднішню дату параметром."
      en: "Fetch tasks from the supplied mock service's records endpoint with a timeout and at most three attempts, fall back to the bundled fixtures when offline, cancel the request when the service records screen loses focus, and count tasks due today from the loaded data with today passed in."
    habits:
      uk: "Завантажувати звички з endpoint записів наданого mock-сервісу з тайм-аутом і щонайбільше трьома спробами, в офлайні переходити на вбудовані фікстури, скасовувати запит, коли екран записів із сервісу втрачає фокус, і показувати кількість виконань лише з даних, які справді завантажилися."
      en: "Fetch habits from the supplied mock service's records endpoint with a timeout and at most three attempts, fall back to the bundled fixtures when offline, cancel the request when the service records screen loses focus, and show completion counts only from data that actually loaded."
    expenses:
      uk: "Завантажувати витрати з endpoint записів наданого mock-сервісу з тайм-аутом і щонайбільше трьома спробами, в офлайні переходити на вбудовані фікстури, скасовувати запит, коли екран записів із сервісу втрачає фокус, і показувати підсумки за категоріями в amountMinor лише з даних, які справді завантажилися."
      en: "Fetch expenses from the supplied mock service's records endpoint with a timeout and at most three attempts, fall back to the bundled fixtures when offline, cancel the request when the service records screen loses focus, and show category totals in amountMinor only from data that actually loaded."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   js-08-10-stale-responses-retry (retry) ; rn-05-04-offline-cache-authority (offline) ; js-16-04-same-origin-cors (origins) ; re-06-02-races-cancellation (cancel)
lessons:
  - id: rn-06-01-fixtures-mock-service
    title: { uk: "Фікстури й наданий mock-сервіс", en: "Fixtures and the supplied mock service" }
    kind: instructional
    minutes: 15
    objectives:
      - "Load capstone records from bundled fixtures through the same data-source interface that will later talk to the supplied mock service."
      - "Start and stop the supplied mock service with its documented commands, and explain why no learner-built backend is needed before the Node stage."
    subskills:
      - { family: N-06, skill: "fixture/mock-service before Node", depth: intro }
    misconceptions:
      - "To test networking in the app I must first write my own server."
      - "Data from the mock service proves the app works with a real backend."
    prerequisites: [rn-05-08-capstone-native-persistence, re-06-01-fetch-lifecycle]
    glossary: [bundled-fixture, mock-service]
    visual: { kind: diagram, concept: "Three interchangeable data sources behind one RecordsSource interface: bundled fixtures (no network), the supplied mock service on the computer (real HTTP, fixed contract) and the real API that arrives in NO-06; stepping switches the source while the screen and the domain code stay unchanged." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which data source — bundled fixtures, the supplied mock service or a not-yet-existing real API — can produce each of four screen states: instant data, loading, a 503 and a timeout." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, switch the data source from bundled fixtures to a simulated mock-service response with a delay and compare the list and loading state; real requests to the mock service happen on your declared target." }
      - { kind: write, runtime: browser-js, summary: "Write a typed RecordsSource interface and a fixtures implementation that resolves the bundled records asynchronously, so screen code never knows which source it is using." }
      - { kind: local-task, runtime: local-web, summary: "The supplied mock service (mock-service.mjs, shown and run as a real isolated-node example in this lesson) is copied to ~/js-course/rn06-mock, started with node mock-service.mjs, probed with curl (health, records, a rehearsed 503) and stopped with Ctrl+C; computer-side only, no native tooling." }
    retrieval:
      - { concept: "the fetch lifecycle in a React component", from: re-06-01-fetch-lifecycle }
  - id: rn-06-02-emulator-device-addressing
    title: { uk: "Адреса хоста з емулятора й пристрою", en: "Emulator/device addressing" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict where 'localhost' points from an Android emulator, an iOS simulator and a physical device, and choose the right host address for each."
      - "Keep the mock-service base URL in one per-target config value instead of hard-coding it in requests."
      - "Explain why native fetch is not subject to browser CORS rules and what that does and does not change."
    subskills:
      - { family: N-06, skill: "emulator/device addressing", depth: intro }
    misconceptions:
      - "localhost inside the app is my computer, wherever the app runs."
      - "If the URL opens in my computer's browser, the phone can reach it too."
    prerequisites: [rn-06-01-fixtures-mock-service, rn-01-02-toolchain-setup]
    glossary: [emulator-host-alias, port-reverse, lan-address]
    visual: { kind: sequence, concept: "A GET from the app to the mock service traced hop by hop per target: on an Android emulator localhost stays inside the emulator and the host alias reaches the computer; on an iOS simulator loopback is shared with the computer; on a physical device the request needs a port reverse or the computer's LAN address and a service listening on it." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict whether http://localhost:PORT/records succeeds from an Android emulator, an iOS simulator and a USB-connected phone when the mock service listens only on the computer's loopback." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, switch the simulated target and the single hard-coded base URL and watch the request log succeed or fail per target, which shows one constant cannot serve every target; actual reachability is confirmed later on your declared target." }
      - { kind: write, runtime: concept-preview, summary: "Write a per-target config module that supplies the mock-service base URL to the data source, so no request hard-codes a host." }
    retrieval:
      - { concept: "same-origin and CORS are browser rules", from: js-16-04-same-origin-cors }
  - id: rn-06-03-fetch-cancel-timeout-retry
    title: { uk: "fetch, скасування, тайм-аути й повтори", en: "fetch, cancellation, timeouts, retry" }
    kind: instructional
    minutes: 12
    objectives:
      - "Wrap the records request in an AbortController-based timeout and cancel it when the screen loses focus or unmounts."
      - "Retry only safe failures (network error, timeout, a 5xx on a GET) with a bounded attempt count and backoff, and never retry a 4xx or an aborted request."
    subskills:
      - { family: N-06, skill: "fetch/cancellation/timeouts/retry", depth: intro }
    misconceptions:
      - "fetch gives up by itself if the server never answers."
      - "Retrying until it works is the most robust strategy."
    prerequisites: [rn-06-02-emulator-device-addressing, js-08-09-cancellation-abort, js-08-10-stale-responses-retry]
    glossary: [exponential-backoff]
    visual: { kind: sequence, concept: "One records request over time: attempt 1 times out and is aborted, attempt 2 gets a 503, attempt 3 succeeds after a backoff delay; a second lane shows the screen losing focus during a later request and the abort canceling both the fetch and the pending retry timer." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "With a budget of three attempts, predict the number of attempts and the final screen state for a timeout, a 503, a 404 and an abort on blur." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview with a simulated slow server, lower the timeout, trigger a blur mid-request and confirm that no retry fires after the abort." }
      - { kind: write, runtime: browser-js, summary: "Write fetchWithRetry(request, { timeoutMs, maxAttempts, signal }) as a pure policy over an injected fetch, with tests for timeout, 5xx, 4xx and abort." }
    retrieval:
      - { concept: "stale responses and bounded retry", from: js-08-10-stale-responses-retry }
      - { concept: "cancellation with AbortController", from: js-08-09-cancellation-abort }
  - id: rn-06-04-offline-error-state
    title: { uk: "Стан офлайну й помилок", en: "Offline and error state" }
    kind: instructional
    minutes: 10
    objectives:
      - "Distinguish offline, timeout, server error and invalid response, and give each an honest, localized message with the right next action."
      - "Keep showing the last loaded or bundled data with its age when the network fails, instead of an empty list."
    subskills:
      - { family: N-06, skill: "offline/error state", depth: intro }
    misconceptions:
      - "A connectivity check that says 'online' guarantees the request will succeed."
      - "On any network error the safest thing is to clear the list."
    prerequisites: [rn-06-03-fetch-cancel-timeout-retry, rn-05-04-offline-cache-authority]
    glossary: [network-reachability]
    visual: { kind: diagram, concept: "A state diagram for the list screen — loading, fresh, last-data-with-age, offline, server-error and invalid-response — with each failure kind from the request routed to its state and to its retry or fallback action." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict the screen state for four failures — airplane mode, a timeout, a 500 and a response that fails runtime validation — when last-loaded data exists." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, toggle simulated connectivity and server failures, and replace the list-clearing error handler with one that keeps the last data and shows its age." }
      - { kind: write, runtime: concept-preview, summary: "Write the screen's status banner that maps each failure kind to a localized message and a retry or use-bundled-data action." }
    retrieval:
      - { concept: "the device store is the authority while offline", from: rn-05-04-offline-cache-authority }
      - { concept: "network failure versus HTTP error states", from: js-08-07-failures-loading-error }
  - id: rn-06-05-transport-tls-config
    title: { uk: "Транспорт, TLS і мережеві налаштування платформи", en: "Transport, TLS context and platform network config" }
    kind: instructional
    minutes: 10
    objectives:
      - "Explain why production traffic must use HTTPS with normal certificate validation, and why the plain-HTTP mock service is acceptable only for the local development host."
      - "Locate the platform settings that allow or block cleartext HTTP (the Android network security configuration, iOS App Transport Security) and scope any exception to the development host and debug builds."
    subskills:
      - { family: N-06, skill: "transport/TLS context", depth: intro }
      - { family: N-06, skill: "platform network configuration", depth: intro }
    misconceptions:
      - "If plain HTTP works in my debug build, it will work in the release build too."
      - "Turning off certificate checks is a harmless way to make a request work during development."
    prerequisites: [rn-06-04-offline-error-state, rn-01-03-env-versions-debug-release]
    glossary: [cleartext-traffic, app-transport-security, network-security-config]
    visual: { kind: diagram, concept: "A request path from app to server through two gates: the platform policy gate (cleartext allowed only for the declared development host in debug) and the TLS gate (certificate chain checked against trusted roots); stepping shows the mock-service request passing in debug and the same plain-HTTP request blocked in release." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Given the supplied network configuration files, predict whether a plain-HTTP request to the mock service succeeds in a debug and in a release build on Android and on iOS." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview's request inspector, switch the base URL between http and https and read which platform policy would apply; the actual policy is enforced only by your declared target's build." }
      - { kind: write, runtime: browser-js, summary: "Write assertReleaseTransport(config), which fails when a release configuration uses http or disables certificate validation, with tests over the supplied configs." }
    retrieval:
      - { concept: "debug versus release build differences", from: rn-01-03-env-versions-debug-release }
  - id: rn-06-06-permissions-capability-checks
    title: { uk: "Дозволи й перевірка можливостей", en: "Permissions and capability checks" }
    kind: instructional
    minutes: 12
    objectives:
      - "Check that a capability exists on the declared target and OS version before offering a feature, and hide or explain the feature when it does not."
      - "Request a permission only at the moment of use with a clear rationale, and handle granted, denied, permanently denied and later revoked outcomes."
    subskills:
      - { family: N-07, skill: "permission request/deny/revoke", depth: intro }
      - { family: N-07, skill: "capability/platform checks", depth: intro }
    misconceptions:
      - "Asking for every permission at launch is fine; the user can always say no."
      - "Once granted, a permission stays granted for the life of the app."
    prerequisites: [rn-06-05-transport-tls-config, rn-04-04-app-foreground-background]
    glossary: [runtime-permission, capability-check, permission-rationale]
    visual: { kind: sequence, concept: "Actors user, screen, capability check, the operating system's permission dialog and system settings: stepping shows check → rationale → request → granted or denied, a permanently denied path that offers settings, and a revoke in settings detected when the app returns to the foreground." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "For a synthetic photo-attachment lab feature (not part of the capstone), predict the screen's behavior when the camera is missing, permission is denied, denied permanently, or revoked while the app is in the background." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview's simulated permission service, step through granted, denied, blocked and revoked responses and fix a screen that keeps showing the camera button after a denial; real dialogs appear only on your declared target." }
      - { kind: write, runtime: concept-preview, summary: "Write a usePermissionGate hook over an injected permission adapter that returns unavailable, ask, granted, denied or blocked and rechecks when the app returns to the foreground." }
    retrieval:
      - { concept: "returning to the foreground triggers a recheck", from: rn-04-04-app-foreground-background }
  - id: rn-06-07-debug-host-address
    title: { uk: "Налагодження: адреса хоста й мережевий збій", en: "Debug: host address and network failure" }
    kind: local-task
    minutes: 20
    objectives:
      - "Reproduce on the declared target a seeded data screen that cannot reach the running mock service, and tell from the logs whether the cause is the host address, the cleartext policy or a missing timeout."
      - "Repair the causes, then confirm the list loads, a stopped service leads to the offline state and retries stop at the budget."
    subskills:
      - { family: N-06, skill: "emulator/device addressing", depth: assess }
      - { family: N-06, skill: "fetch/cancellation/timeouts/retry", depth: assess }
      - { family: N-06, skill: "platform network configuration", depth: assess }
    misconceptions: []
    prerequisites: [rn-06-06-permissions-capability-checks]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Start the supplied mock service with its documented command, run the seeded app on your declared target and record the failure and the request's log lines — or mark the task unperformed if native tooling is unavailable." }
      - { kind: debug, runtime: browser-js, summary: "In-course debug exercise: a seeded expenses data source with a hard-coded localhost base URL, a debug network security configuration that permits cleartext only to localhost (not to 10.0.2.2) and a request without a timeout; repair all three, checked by behavior." }
      - { kind: debug, runtime: local-native, summary: "Fix the hard-coded localhost base URL and the request that hangs without a timeout (mock service ?hang=1) on your declared target; then stop the mock service and confirm bounded retries end in the offline state. Expo Go ignores the project's cleartext settings, so the cleartext gate is repaired in the in-course exercise and only observed optionally in a release build by learners who already have native build tools." }
    retrieval:
      - { concept: "an HTTP error versus a rejected fetch", from: js-16-09-debug-http-fetch-cors }
  - id: rn-06-08-independent-bounded-retry
    title: { uk: "Самостійно: обмежені повтори й стан офлайну", en: "Independent: bounded retry and offline state" }
    kind: assessment
    minutes: 30
    objectives:
      - "Build, without hints, a data screen that loads from bundled fixtures or the mock service, retries within a budget, shows honest offline and error states and justifies its transport choices, verified on the declared target."
    subskills:
      - { family: N-06, skill: "fixture/mock-service before Node", depth: assess }
      - { family: N-06, skill: "offline/error state", depth: assess }
      - { family: N-06, skill: "transport/TLS context", depth: assess }
    misconceptions: []
    prerequisites: [rn-06-07-debug-host-address]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "In-course part: your retry policy and response validator for a synthetic bus-timetable feed pass the hidden timeout, 5xx, 4xx, abort and invalid-body cases." }
      - { kind: independent, runtime: local-native, summary: "No-hint task: load the bus-timetable feed from the supplied mock service with a timeout and bounded retry, fall back to bundled fixtures offline, show distinct offline, server and invalid-data states and write two sentences on why plain HTTP is acceptable here but not in production; check it on your declared target." }
    retrieval:
      - { concept: "fixture fetch with cancel, retry and ordering", from: js-08-12-independent-fixture-fetch }
  - id: rn-06-09-capstone-native-networking
    title: { uk: "Проєкт: завантаження даних у нативному застосунку", en: "Capstone: native data loading" }
    kind: capstone-step
    minutes: 35
    objectives:
      - "Load the native capstone's records from bundled fixtures and the supplied mock service with a per-target base URL, a timeout, bounded retry, cancellation on blur and an honest offline state, verified on the declared target."
    subskills:
      - { family: N-06, skill: "fetch/cancellation/timeouts/retry", depth: practice }
    misconceptions: []
    prerequisites: [rn-06-08-independent-bounded-retry, rn-05-08-capstone-native-persistence]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-native, summary: "In the native project ~/js-course/<project>-native, add the records data source with fixtures and mock-service implementations, the per-target base URL, fetchWithRetry and focus-based cancellation; verify loading, offline fallback and bounded retry on your declared target and commit." }
    retrieval:
      - { concept: "races and cancellation when the screen changes", from: re-06-02-races-cancellation }
