# Syllabus spine for JS-02. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-02
stage: JS
title: { uk: "Імена, порівняння та розгалуження", en: "Names, comparisons and branching" }
summary:
  uk: "Учень називає значення через const і let, читає застарілий var, пояснює TDZ і затінення, порівнює значення без пасток приведення типів, застосовує ??, ?. та тернарний оператор і розгалужує програму через if/else і switch."
  en: "The learner names values with const and let, reads legacy var, explains the TDZ and shadowing, compares values without coercion traps, applies ??, ?. and the ternary, and branches a program with if/else and switch."
competencies: [J-01, J-02, J-03]
capstoneStep:
  mode: in-platform
  objective:
    uk: "Обчислити підписи для показу та повідомлення валідації для одного запису домену, використовуючи const/let, порівняння, ?? та if/else."
    en: "Compute display labels and validation messages for one domain record using const/let, comparisons, ?? and if/else."
  variants:
    wishlist:
      uk: "Для одного бажання: підпис «назва — ціна або „без ціни“» через ??, та повідомлення, якщо назва порожня або ціна від’ємна."
      en: "For one wish: a label “name — price or ‘no price’” via ??, and a message when the name is empty or the price is negative."
    planner:
      uk: "Для однієї справи: підпис «назва (термін або „без терміну“)» через ??, та повідомлення, якщо назва порожня або пріоритет невідомий (switch)."
      en: "For one task: a label “title (due date or ‘no due date’)” via ??, and a message when the title is empty or the priority is unknown (switch)."
    habits:
      uk: "Для однієї звички: підпис «назва · щодня/щотижня» через switch, та повідомлення, якщо назва порожня або частота невідома."
      en: "For one habit: a label “name · daily/weekly” via switch, and a message when the name is empty or the frequency is unknown."
    expenses:
      uk: "Для однієї витрати: підпис «назва — сума в гривнях» із цілих копійок, та повідомлення, якщо сума не є додатним цілим або категорія порожня."
      en: "For one expense: a label “label — amount in UAH” from integer minor units, and a message when the amount is not a positive integer or the category is empty."
# Retrieval plan: js-01-03-arithmetic-precedence (precedence) ; js-01-04-booleans-null-undefined (typeof / null vs undefined) ; js-01-06-html-elements-attributes (elements)
lessons:
  - id: js-02-01-const-let
    title: { uk: "Даємо значенням імена: const і let", en: "Naming values: const and let" }
    kind: instructional
    minutes: 10
    objectives:
      - "Declare a binding with const or let and explain which one allows reassignment."
      - "Describe a const binding as a fixed name, not a frozen value (object case previewed, closed in JS-04)."
    subskills:
      - { family: J-02, skill: "const/let and mutation distinction", depth: intro }
    misconceptions:
      - "const makes the value immutable."
      - "A variable is a box that physically contains the value, so copying the name copies the box."
    prerequisites: [js-01-04-booleans-null-undefined]
    glossary: [binding, const, let, reassignment]
    visual: { kind: memory-graph, concept: "Bindings as labels pointing at values: reassigning a let moves the label; a const label is pinned, while the thing it points at may still change." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of three snippets throws: reassigning a const, reassigning a let, and declaring the same name twice." }
      - { kind: run-change, runtime: browser-js, summary: "Run the snippets, read the TypeError, then switch const to let and observe." }
      - { kind: write, runtime: browser-js, summary: "Name the parts of a synthetic record (name, price, category) with the right declaration for each." }
    retrieval:
      - { concept: "typeof result of an unassigned binding", from: js-01-04-booleans-null-undefined }
  - id: js-02-02-equality-coercion
    title: { uk: "Рівність і приведення типів", en: "Equality and coercion" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict the result of === and == for mixed-type pairs and explain the coercion path == takes."
      - "Default to === and name the one case where == is tolerated by convention (== null)."
    subskills:
      - { family: J-01, skill: "equality/coercion/truthiness", depth: intro }
    misconceptions:
      - "== is just a lenient === that compares values 'as a human would'."
    prerequisites: [js-02-01-const-let]
    glossary: [strict-equality, loose-equality, coercion]
    visual: { kind: diagram, concept: "Coercion path for ==: the two operands flow through type-conversion boxes until they share a type, then compare; === skips the boxes." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Fill in a truth table for === and == over 0, '', '0', false, null and undefined before running it." }
      - { kind: run-change, runtime: browser-js, summary: "Run the table, then change one operand to make a surprising == result become false." }
      - { kind: write, runtime: browser-js, summary: "Write a comparison that tells a missing price from a price of zero without coercion." }
    retrieval:
      - { concept: "'1' + 2 versus 1 + 2", from: js-01-03-arithmetic-precedence }
  - id: js-02-03-truthiness-logic-ternary
    title: { uk: "Правдивість, і/або та тернарний оператор", en: "Truthiness, and-or logic and the ternary" }
    kind: instructional
    minutes: 10
    objectives:
      - "List the falsy values and predict what && and || return (the operand, not a boolean)."
      - "Read a ternary and a mixed &&/|| expression in precedence order."
    subskills:
      - { family: J-01, skill: "equality/coercion/truthiness", depth: practice }
      - { family: J-01, skill: "arithmetic/logical/assignment/ternary precedence", depth: practice }
    misconceptions:
      - "&& and || always return true or false."
    prerequisites: [js-02-02-equality-coercion]
    glossary: [truthy, falsy, short-circuit, ternary]
    visual: { kind: code-trace, concept: "Short-circuit evaluation: which operand is evaluated and which value is returned, step by step, for && and || chains." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the returned operand of 0 || 'x', 'a' && 0, null || undefined and a && b || c with given values." }
      - { kind: run-change, runtime: browser-js, summary: "Run the chain, then add parentheses to flip the result and confirm AND binds tighter than OR." }
      - { kind: write, runtime: browser-js, summary: "Produce a status word with one ternary from a boolean field of a synthetic record." }
    retrieval:
      - { concept: "operator precedence and parentheses", from: js-01-03-arithmetic-precedence }
  - id: js-02-04-nullish-optional-chaining
    title: { uk: "?? і ?. : коректно працюємо з відсутніми значеннями", en: "?? and ?. : missing values done right" }
    kind: instructional
    minutes: 10
    objectives:
      - "Choose ?? over || for defaults when 0 or '' are valid values."
      - "Use ?. to read a property of a possibly missing object without throwing."
    subskills:
      - { family: J-01, skill: "nullish coalescing/optional chaining", depth: intro }
    misconceptions:
      - "|| is the right way to give a default to any missing value."
    prerequisites: [js-02-03-truthiness-logic-ternary]
    glossary: [nullish, optional-chaining, default-value]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict price || 'no price' and price ?? 'no price' for price = 0, null and undefined; predict record?.category?.length for a null category." }
      - { kind: run-change, runtime: browser-js, summary: "Run the examples, then replace || with ?? in a label and see which record changes." }
      - { kind: debug, runtime: browser-js, summary: "Repair a seeded label that shows 'no price' for a free item (price 0) because of a || default." }
    retrieval:
      - { concept: "null versus undefined", from: js-01-04-booleans-null-undefined }
  - id: js-02-05-if-else-switch
    title: { uk: "Розгалуження: if/else і switch", en: "Branching: if/else and switch" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace which branch of an if/else chain runs for a given input."
      - "Read a switch statement and explain what happens when a break is missing (fallthrough)."
    subskills:
      - { family: J-03, skill: "if/else and switch fallthrough", depth: intro }
    misconceptions:
      - "In a switch only the matching case body runs, whether or not there is a break."
    prerequisites: [js-02-04-nullish-optional-chaining]
    glossary: [branch, if-else, switch, fallthrough]
    visual: { kind: code-trace, concept: "The executed path through an if/else chain and a switch is highlighted step by step; removing a break shows execution falling into the next case." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the output of a priority switch for 'high', 'normal' and an unknown value, with and without breaks." }
      - { kind: run-change, runtime: browser-js, summary: "Run the switch, remove one break, run again; then rewrite it as an if/else chain." }
      - { kind: write, runtime: browser-js, summary: "Write a function-free script that prints one of three status messages for a synthetic record." }
    retrieval:
      - { concept: "comparisons produce booleans", from: js-01-04-booleans-null-undefined }
  - id: js-02-06-counting-loops
    title: { uk: "Повторення: лічильний цикл for і цикл while", en: "Repeating: a counting for loop and while" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace a counting for loop (start, condition, step) and a while loop one iteration at a time, filling an iteration table."
      - "Predict how many times a loop body runs for zero, one and many iterations before running it."
    subskills:
      - { family: J-03, skill: "for/while/do-while", depth: intro }
    misconceptions:
      - "The loop condition is checked only once, at the start."
      - "After the loop ends the loop variable equals the number of iterations, whatever the start value was."
    prerequisites: [js-02-05-if-else-switch, js-02-01-const-let]
    glossary: [counting-loop, loop-condition, iteration-table]
    visual: { kind: code-trace, concept: "An iteration table built live: each pass highlights the condition check, the body and the step, and shows the loop variable and the running total after every iteration, including a zero-iteration run." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the printed lines of a for loop from 1 to 5 and of a while loop that halves a number until it drops below 1, including how many times each body runs." }
      - { kind: run-change, runtime: browser-js, summary: "Run both loops, change the start value and the condition so the body runs zero times, then exactly once, and compare the console with your prediction." }
      - { kind: write, runtime: browser-js, summary: "Write a for loop that sums the numbers from 1 to n and a while loop that counts how many times a synthetic price can be halved before it is below 10." }
    retrieval:
      - { concept: "which values make a condition true or false", from: js-01-04-booleans-null-undefined }
  - id: js-02-07-var-hoisting-tdz
    title: { uk: "Читаємо застарілий var, підняття і TDZ", en: "Reading legacy var, hoisting and the TDZ" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain why a var read before its line gives undefined while a let read before its line throws (TDZ)."
      - "Tell block scope from function scope in a trace and say which declaration leaks out of a block."
    subskills:
      - { family: J-02, skill: "legacy var reading", depth: intro }
      - { family: J-02, skill: "hoisting and TDZ", depth: intro }
      - { family: J-02, skill: "lexical/function/block scope", depth: intro }
    misconceptions:
      - "Hoisting moves the whole declaration with its value to the top."
      - "A let inside an if block is visible after the block, like var."
    prerequisites: [js-02-05-if-else-switch]
    glossary: [var, hoisting, temporal-dead-zone, block-scope, function-scope]
    visual: { kind: code-trace, concept: "Scope frames with their bindings over time: var bindings appear as undefined at frame start, let/const bindings appear as uninitialized (TDZ) until their line runs." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the output or error of reading a var and a let before their declaration lines, inside and outside a block." }
      - { kind: run-change, runtime: browser-js, summary: "Run the trace, change var to let and watch the TDZ error appear; move a declaration out of the block." }
      - { kind: write, runtime: browser-js, summary: "Rewrite a short var-based snippet with const/let so every binding lives in the smallest block that needs it." }
    retrieval:
      - { concept: "undefined as not-yet-assigned", from: js-01-04-booleans-null-undefined }
  - id: js-02-08-shadowing-strict-mode
    title: { uk: "Затінення й строгий режим", en: "Shadowing and strict mode" }
    kind: instructional
    minutes: 8
    objectives:
      - "Spot a shadowed binding in a trace and say which one a given line reads."
      - "Explain that modules run in strict mode and what an assignment to an undeclared name does there."
    subskills:
      - { family: J-02, skill: "shadowing and strict mode", depth: intro }
    misconceptions:
      - "An inner variable with the same name updates the outer one."
    prerequisites: [js-02-07-var-hoisting-tdz]
    glossary: [shadowing, strict-mode]
    visual: { kind: code-trace, concept: "Two frames holding bindings with the same name; the highlighted read resolves to the nearest frame." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the two printed values when an inner block declares a name that also exists outside." }
      - { kind: run-change, runtime: browser-js, summary: "Run, rename the inner binding, run again; then assign to an undeclared name in a module and read the ReferenceError." }
      - { kind: debug, runtime: browser-js, summary: "Repair a seeded total that stays zero because an inner let shadows the outer accumulator." }
    retrieval:
      - { concept: "block scope", from: js-02-07-var-hoisting-tdz }
  - id: js-02-09-rare-operators-special-values
    title: { uk: "Оператори й значення, які ви читатимете, а не писатимете", en: "Operators and values you will read, not write" }
    kind: instructional
    minutes: 10
    objectives:
      - "Read unary +, !, typeof, delete, in and instanceof in existing code and state what each produces."
      - "Recognize bitwise operators, Symbol and BigInt in a trace and name the boundary where each needs a separate look-up."
    subskills:
      - { family: J-01, skill: "unary operators/in/instanceof and bitwise reading boundaries", depth: intro }
      - { family: J-01, skill: "Symbol and BigInt read/use boundaries", depth: intro }
    misconceptions:
      - "+'3' and '3' are the same thing because the plus does nothing."
      - "A BigInt is just a big number and mixes freely with ordinary numbers."
    prerequisites: [js-02-08-shadowing-strict-mode]
    glossary: [unary-operator, in-operator, instanceof, bitwise, symbol, bigint]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict +'3', !!'', 'price' in record, typeof 10n and whether 10n + 1 runs." }
      - { kind: run-change, runtime: browser-js, summary: "Run the table, then convert a string count with Number() instead of unary + and compare readability." }
      - { kind: write, runtime: browser-js, summary: "Write a check that a record has a given field (in) and convert a numeric string safely." }
    retrieval:
      - { concept: "typeof per primitive", from: js-01-04-booleans-null-undefined }
  - id: js-02-10-debug-tdz-and-defaults
    title: { uk: "Налагодження: TDZ, затінення і хибне значення за замовчуванням", en: "Debug: TDZ, shadowing and a wrong default" }
    kind: instructional
    minutes: 12
    objectives:
      - "Diagnose a ReferenceError caused by the TDZ and a silent undefined caused by var, and explain the difference."
      - "Repair a == comparison and a || default that mishandle 0 and ''."
    subskills:
      - { family: J-02, skill: "legacy var reading", depth: assess }
      - { family: J-02, skill: "hoisting and TDZ", depth: assess }
      - { family: J-02, skill: "shadowing and strict mode", depth: assess }
      - { family: J-01, skill: "equality/coercion/truthiness", depth: assess }
      - { family: J-01, skill: "nullish coalescing/optional chaining", depth: assess }
    misconceptions:
      - "If no error is thrown, the comparison must be correct."
    prerequisites: [js-02-09-rare-operators-special-values]
    glossary: []
    visual: { kind: code-trace, concept: "The failing run replayed: the frame state at the moment of the TDZ error versus the moment the var read yields undefined." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Before running, mark which of four seeded lines throws, which prints undefined and which prints a wrong label." }
      - { kind: run-change, runtime: browser-js, summary: "Run the seeded program and match each console line to your prediction." }
      - { kind: debug, runtime: browser-js, summary: "Repair all four defects (TDZ read, var leak, shadowed accumulator, == with || default) without changing the intended output." }
    retrieval:
      - { concept: "reading an error message", from: js-01-05-reading-an-error }
  - id: js-02-11-independent-validation
    title: { uk: "Самостійно: валідація з null, порожнім рядком, нулем і NaN", en: "Independent: validation with null/empty/zero/NaN" }
    kind: assessment
    minutes: 20
    objectives:
      - "Implement, without hints, a validation script that returns ok/errors for a synthetic record covering null, empty string, zero and NaN inputs."
      - "Explain in one sentence each why BigInt does not mix with Number and what in and instanceof answer."
    subskills:
      - { family: J-01, skill: "primitive/reference values", depth: assess }
      - { family: J-01, skill: "typeof and null/undefined", depth: assess }
      - { family: J-01, skill: "arithmetic/logical/assignment/ternary precedence", depth: assess }
      - { family: J-01, skill: "unary operators/in/instanceof and bitwise reading boundaries", depth: assess }
      - { family: J-01, skill: "Symbol and BigInt read/use boundaries", depth: assess }
      - { family: J-03, skill: "if/else and switch fallthrough", depth: assess }
    misconceptions: []
    prerequisites: [js-02-10-debug-tdz-and-defaults]
    glossary: [validation]
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: validate(input) returns { ok: true, value } or { ok: false, errors } for name/amount/status fields; hidden fixtures include null, '', 0, NaN and an unknown status handled by switch." }
      - { kind: write, runtime: browser-js, summary: "Explain-level items: one sentence each on 10n + 1, 'id' in record and record instanceof Object." }
    retrieval:
      - { concept: "string versus number literals", from: js-01-02-numbers-and-text }
  - id: js-02-12-capstone-labels-messages
    title: { uk: "Проєкт: підписи й повідомлення валідації", en: "Capstone: labels and validation messages" }
    kind: capstone-step
    minutes: 15
    objectives:
      - "Compute a display label and a validation message for one record of the chosen domain using const/let, ??, comparisons and if/else or switch."
    subskills:
      - { family: J-02, skill: "const/let and mutation distinction", depth: practice }
      - { family: J-03, skill: "if/else and switch fallthrough", depth: practice }
    misconceptions: []
    prerequisites: [js-02-11-independent-validation]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: browser-js, summary: "In the capstone workspace, add a script that builds the label and the message for the first fixture record and shows both on the page." }
      - { kind: run-change, runtime: browser-js, summary: "Change the fixture to a record with a missing optional field and confirm the ?? default appears." }
    retrieval:
      - { concept: "labeled values on the starter page", from: js-01-10-capstone-starter-page }
