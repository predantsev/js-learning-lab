# Syllabus spine for RE-11. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
# Runtime note: R-09 is required-awareness at explain-read depth. Supplied traces and listings in predictions are read as
# concept-preview. Examples and exercises run as browser-react: hydration is real React 19 (hydrateRoot) applied to
# SUPPLIED server HTML written into index.html — React's server renderer never runs in the sandbox — and bundle listings
# come from a pretend bundler (bundle.js) that follows static imports of project files. No browser SSR verification is
# claimed here — the real Node-backed SSR/hydration lab is NO-13.
unit: RE-11
stage: RE
title: { uk: "Межа сервера й клієнта: SSR, гідратація, RSC", en: "The server–client boundary: SSR, hydration and RSC" }
summary:
  uk: "Учень пояснює CSR, SSR і статичний вивід, передбачає розбіжності гідратації за наданими трасами, вирішує, які компоненти можуть бути серверними чи клієнтськими і що може переходити між ними, тримає секрети в server-only коді та читає позначки стабільності RSC — на рівні пояснення й читання; справжня серверна лабораторія буде в NO-13."
  en: "The learner explains CSR, SSR and static output, predicts hydration mismatches from supplied traces, decides which components can be server or client and what may cross between them, keeps secrets in server-only code and reads RSC stability labels — at explain-and-read depth, with the real server lab in NO-13."
competencies: [R-09]
capstoneStep:
  mode: local
  objective:
    uk: "Дизайн-рев’ю на папері: позначити в дереві компонентів проєкту межу клієнт/сервер, перелічити, що ніколи не повинно її перетинати, і передбачити один ризик гідратації (його по-справжньому перевірять у NO-13)."
    en: "Design review on paper: annotate the capstone component tree with a client/server boundary, list what must never cross it and predict one hydration risk (executed for real in NO-13)."
  variants:
    wishlist:
      uk: "Позначити список бажань і підсумки як придатні до серверного рендерингу, а форму додавання/редагування й перемикач `acquired` — як клієнтські компоненти; перелічити, що ніколи не перетинає межу (доступ до сховища, будь-який майбутній API-ключ); передбачити розбіжність через форматування `price` (дані локалей сервера й браузера різняться навіть за однакової локалі)."
      en: "Mark the item list and totals as server-renderable and the add/edit form and the `acquired` toggle as client components; list what never crosses (storage access, any future API key); predict a mismatch from formatting `price` (the server's and the browser's locale data differ even for the same locale)."
    planner:
      uk: "Позначити список справ як придатний до серверного рендерингу, а перемикач `done` і вибір `priority` — як клієнтські компоненти; перелічити, що ніколи не перетинає межу; передбачити розбіжність через обчислення «на сьогодні» за годинником браузера замість переданого дня."
      en: "Mark the task list as server-renderable and the `done` toggle and `priority` select as client components; list what never crosses; predict a mismatch from computing 'due today' from the browser's clock instead of a passed-in day."
    habits:
      uk: "Позначити список звичок і перегляд серій як придатні до серверного рендерингу, а кнопку виконання й перемикач `active` — як клієнтські компоненти; перелічити, що ніколи не перетинає межу; передбачити розбіжність через обчислення серії за поточним днем клієнта замість переданого дня."
      en: "Mark the habit list and streak view as server-renderable and the completion button and `active` toggle as client components; list what never crosses; predict a mismatch from computing the streak with the client's current day instead of a passed-in day."
    expenses:
      uk: "Позначити список витрат і підсумки за категоріями як придатні до серверного рендерингу, а форму додавання й фільтр категорій — як клієнтські компоненти; перелічити, що ніколи не перетинає межу; передбачити розбіжність через форматування `amountMinor` валютним форматом, що залежить від локалі, на сервері й клієнті."
      en: "Mark the expense list and category totals as server-renderable and the add form and category filter as client components; list what never crosses; predict a mismatch from formatting `amountMinor` with a locale-dependent currency format on server and client."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-01-06-render-vs-commit (render/commit) ; js-16-04-same-origin-cors (origins) ; re-03-02-effects-synchronize-external (effects on server?) ; js-16-08-secrets-storage-privacy (secrets)
lessons:
  - id: re-11-01-csr-ssr-static
    title: { uk: "CSR, SSR і статичний рендеринг", en: "CSR vs SSR vs static" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace what the browser receives first and when the page becomes interactive under client-side rendering, per-request server rendering and build-time static generation."
      - "Choose a rendering strategy for a page from its data freshness, personalisation and first-view needs, and state what each choice costs."
    subskills:
      - { family: R-09, skill: "CSR vs SSR/static rendering", depth: intro }
    misconceptions:
      - "Server rendering makes the page interactive sooner."
      - "A static page cannot show any changing data."
    prerequisites: [re-01-06-render-vs-commit, js-16-02-http-methods-status-headers, re-10-01-lazy-suspense]
    glossary: [client-side-rendering, server-side-rendering, static-generation]
    visual: { kind: sequence, concept: "Three sequences of browser, server and build step: CSR returns an empty shell, then downloads JavaScript and fetches data; SSR returns filled HTML per request, then hydrates; static serves HTML built ahead of time; first content and first interaction are marked on each." }
    analogy: "Newspaper: a static page is the overnight print run, SSR is a clerk printing your statement on request, CSR is a blank sheet and a printing kit (limit: one site mixes all three; hydration does not reprint the HTML)."
    practice:
      - { kind: predict, runtime: concept-preview, summary: "From three supplied network and HTML traces, predict which strategy produced each and when the Add button first responds." }
      - { kind: run-change, runtime: browser-react, summary: "Run the client-rendered capstone list in the course runtime, raise the bundle and data delays, and note when content and interactivity appear — the only strategy actually executed here." }
      - { kind: write, runtime: browser-react, summary: "Write a HelpPage component that renders only from props (no effects, no browser APIs), so the same output could be produced at build time, and check two renders give identical markup." }
    retrieval:
      - { concept: "render describes the UI, commit touches the DOM", from: re-01-06-render-vs-commit }
  - id: re-11-02-hydration-mismatch
    title: { uk: "Гідратація та причини розбіжностей", en: "Hydration and mismatch causes" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain hydration as React rendering the same tree on the client and attaching state and handlers to existing server HTML, not re-creating the DOM."
      - "Predict the symptom of each common mismatch cause (current time or random values, locale formatting, window or localStorage read during render, invalid nesting) in a supplied trace."
    subskills:
      - { family: R-09, skill: "hydration and mismatch causes", depth: intro }
    misconceptions:
      - "Hydration downloads the HTML again and replaces it."
      - "Reading localStorage during render is fine because the component runs in a browser."
    prerequisites: [re-11-01-csr-ssr-static, re-03-02-effects-synchronize-external]
    glossary: [hydration, hydration-mismatch]
    visual: { kind: sequence, concept: "Server renders HTML containing one date label, the browser shows it, the client bundle renders the same tree with a different label, React reports the mismatch at that text node, and effects run only after hydration finishes." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "From a supplied server HTML and client render output, predict which node mismatches and what React reports about it." }
      - { kind: run-change, runtime: browser-react, summary: "Hydrate supplied server HTML with a component that reads localStorage in render, read React's mismatch error, then move the read into an effect and observe the two-pass output (stable placeholder, then stored value) with the server nodes kept." }
      - { kind: write, runtime: browser-react, summary: "Write a ClientOnlyDate component that renders a stable placeholder first and the locale-formatted date after mount; checks hydrate supplied server HTML and require no mismatch and kept server nodes." }
    retrieval:
      - { concept: "effects run after commit, never during render", from: re-03-02-effects-synchronize-external }
  - id: re-11-03-server-client-components
    title: { uk: "Серверні й клієнтські компоненти та серіалізація", en: "Server/client components and serialization" }
    kind: instructional
    minutes: 12
    objectives:
      - "Mark which components in a tree must be client components (state, effects, event handlers, browser APIs) and which can stay server components."
      - "Predict which props can cross from a server to a client component (plain data, arrays, Date, Map, Set) and which cannot (ordinary functions, class instances)."
    subskills:
      - { family: R-09, skill: "server/client components and serialization", depth: intro }
    misconceptions:
      - "A 'use client' component runs only in the browser and is never rendered on the server."
      - "Any prop can be passed from a server component to a client component."
    prerequisites: [re-11-02-hydration-mismatch, js-07-04-json]
    glossary: [server-component, client-component, serialization-boundary]
    visual: { kind: diagram, concept: "The capstone component tree with server and client regions shaded; arrows crossing the boundary carry props as serialized data, and an arrow carrying a function prop is highlighted as rejected." }
    analogy: "A parcel from the server to the browser: things (data, dates, sets) fit in the box, a phone call (a function) does not, so the receiver owns its phone (limit: React packs more than JSON, and Server Functions cross as references)."
    practice:
      - { kind: predict, runtime: concept-preview, summary: "In a supplied component tree, predict which components need 'use client' and which three props fail to cross the boundary." }
      - { kind: run-change, runtime: browser-react, summary: "Run a record card that receives an onToggle function from its parent, then refactor so the card receives only plain data and owns its handler in a client child." }
      - { kind: write, runtime: browser-react, summary: "Write assertCrossable(props) that rejects functions and class instances but accepts plain objects, arrays, Date, Map and Set, and run it on the card's props." }
    retrieval:
      - { concept: "JSON limits: functions and undefined do not survive", from: js-07-04-json }
      - { concept: "CORS is enforced by browsers, not by server-to-server calls", from: js-16-04-same-origin-cors }
  - id: re-11-04-secrets-server-only
    title: { uk: "Секрети й код лише для сервера", en: "Secrets and server-only code" }
    kind: instructional
    minutes: 10
    objectives:
      - "Identify code and values that must stay on the server (API keys, database access, privileged checks) and trace how one import from a client component would ship them to the browser."
      - "Apply an explicit server-only module boundary and a public-value naming rule to keep secrets out of client code."
    subskills:
      - { family: R-09, skill: "secrets/server-only code", depth: intro }
    misconceptions:
      - "An environment variable is secret just because it is not written in the source code."
      - "Code in a component file that 'runs on the server' can never reach the browser."
    prerequisites: [re-11-03-server-client-components, js-16-08-secrets-storage-privacy]
    glossary: [server-only-code]
    visual: { kind: diagram, concept: "Import graph from a client component through a shared utils module into a db module holding a placeholder key; the client bundle box lights up with the leaked string, and a server-only marker breaks the chain at build time." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which of three supplied bundle listings contains the placeholder key, given three different import paths from a client component." }
      - { kind: run-change, runtime: browser-react, summary: "Run a client component whose import chain reaches a module holding a placeholder secret, find the string in the pretend bundler's listing, then switch the client to a request to its own server and see a .server module stop the build." }
      - { kind: write, runtime: browser-react, summary: "Split a config into public-config.ts and a reminders.server.ts module for a 'send reminder' feature; checks build the client bundle with the pretend bundler and fail if the placeholder secret or a .server module appears in it." }
    retrieval:
      - { concept: "no secrets in the client bundle", from: js-16-08-secrets-storage-privacy }
  - id: re-11-05-rsc-frameworks-stability
    title: { uk: "RSC, фреймворки й стабільність: огляд", en: "RSC, frameworks and stability awareness" }
    kind: instructional
    minutes: 10
    objectives:
      - "Explain that React Server Components need a framework or bundler integration, and that this course does not mandate one."
      - "Read stability labels (stable, canary, experimental) for RSC-related features and decide whether a tutorial's API applies to a given project setup."
    subskills:
      - { family: R-09, skill: "RSC framework/stability awareness", depth: intro }
    misconceptions:
      - "Server components are a switch I can turn on in any Vite single-page app."
      - "Learning modern React means committing to one specific framework."
    prerequisites: [re-11-04-secrets-server-only, re-10-04-modern-form-actions-awareness]
    glossary: [react-server-components, meta-framework]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which of four supplied project setups can run server components as-is: a plain Vite SPA, a framework with RSC support, a static export, a Node SSR server without RSC." }
      - { kind: run-change, runtime: browser-react, summary: "Run the capstone card as a client component in the course runtime and note which server-component features (async component, direct server data access) are unavailable here and why." }
      - { kind: write, runtime: browser-react, summary: "Split the card into a props-only HabitSummary (would move to a server component) and a stateful CompleteButton (client) so it works as a plain client component today, and record the stability label of each RSC API it relies on." }
    retrieval:
      - { concept: "version labels for modern React APIs", from: re-10-04-modern-form-actions-awareness }
  - id: re-11-06-debug-hydration-trace
    title: { uk: "Налагодження за наданою трасою: знайти розбіжність і витік", en: "Debug (supplied trace): find the mismatch and the leak" }
    kind: instructional
    minutes: 15
    objectives:
      - "Locate, from a supplied server HTML, client render log and bundle listing, the hydration mismatch and the leaked server-only value."
      - "Propose the minimal fix for each and predict the corrected trace, without claiming a browser SSR run."
    subskills:
      - { family: R-09, skill: "hydration and mismatch causes", depth: assess }
      - { family: R-09, skill: "secrets/server-only code", depth: assess }
    misconceptions:
      - "A hydration warning is cosmetic; the page fixes itself."
    prerequisites: [re-11-05-rsc-frameworks-stability]
    glossary: []
    visual: { kind: sequence, concept: "The supplied trace replayed step by step: server HTML, the client's first render, the first diverging node (a locale-formatted amount), and a bundle line containing the placeholder key traced back to its import; then the corrected trace." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Before opening the diff view, predict from the log which node mismatches and which import leaked the key." }
      - { kind: run-change, runtime: browser-react, summary: "Hydrate supplied server HTML (a sync status read from navigator.onLine in render), read the first diverging node in React's diff and the import chain of the token in the pretend bundle listing, then fix both and see the corrected trace." }
      - { kind: debug, runtime: browser-react, summary: "Fix both defects of a day-total page — the client computes 'today' from its own clock instead of the passed-in day, and a shared money module imports the rates key — using values the server already sent; checks require clean hydration, kept nodes and a key-free client bundle. (Executed defects are clock- and import-based so they are deterministic in any browser locale; the locale case stays in the supplied trace.)" }
    retrieval:
      - { concept: "stored value versus locale presentation", from: js-12-10-intl-locale }
  - id: re-11-07-independent-boundary-review
    title: { uk: "Самостійно: обрати межу на дизайн-рев’ю", en: "Independent: choose the boundary in a design review" }
    kind: assessment
    minutes: 25
    objectives:
      - "Choose, without hints, a rendering strategy per page and the client/server boundary for an unseen app in a design review, listing what must never cross it and why."
    subskills:
      - { family: R-09, skill: "CSR vs SSR/static rendering", depth: assess }
      - { family: R-09, skill: "server/client components and serialization", depth: assess }
      - { family: R-09, skill: "RSC framework/stability awareness", depth: assess }
    misconceptions: []
    prerequisites: [re-11-06-debug-hydration-trace]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-react, summary: "No-hint design review (answers recorded as data in review.js and checked): for a synthetic event-listing app with a public catalog, a personal dashboard and an admin form, choose CSR, SSR or static per page, mark server and client components, list non-serialisable props and secrets that must not cross, and label each framework-specific RSC API with its stability." }
    retrieval:
      - { concept: "cookies, storage and origins", from: js-16-03-cookies-storage-origins }
  - id: re-11-08-capstone-boundary-review
    title: { uk: "Проєкт: анотація межі (на папері)", en: "Capstone: boundary annotation (paper)" }
    kind: capstone-step
    minutes: 20
    objectives:
      - "Annotate the capstone component tree with a client/server boundary, list what must never cross it, and record one predicted hydration risk for NO-13 to test."
    subskills:
      - { family: R-09, skill: "server/client components and serialization", depth: practice }
    misconceptions: []
    prerequisites: [re-11-07-independent-boundary-review]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "In the VS Code repository, add docs/boundary-review.md: the capstone component tree with server/client marks, a 'never crosses' list, one predicted hydration risk and how NO-13 will check it; commit it without changing app code." }
    retrieval:
      - { concept: "the capstone component tree", from: re-01-10-capstone-components }
