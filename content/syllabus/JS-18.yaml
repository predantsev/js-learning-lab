# Syllabus spine for JS-18. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-18
stage: JS
title: { uk: "Рубіж JavaScript-етапу: стійкі навички на незнайомому матеріалі", en: "JavaScript stage gate: retained skills on unseen material" }
summary:
  uk: "Учень демонструє стійку самостійну компетентність на всьому JavaScript-етапі: прогнозує поведінку коду з матеріалу попередніх розділів, без підказок діагностує нові дефекти, переносить навички на незнайомий синтетичний домен, пише тести, що ловлять дефект, рецензує й документує зміну та пояснює ключові межі середовища виконання й вебу."
  en: "The learner shows retained, independent competence across the whole JavaScript stage: predicts behavior drawn from earlier units, diagnoses unseen defects without hints, transfers the skills to an unseen synthetic domain, writes tests that catch a defect, reviews and documents a change, and explains the key runtime and web boundaries."
competencies: [P-04]
capstoneStep: null
capstoneStepReason:
  uk: "Підсумковий рубіж етапу: він перевіряє стійку компетентність з усіх JavaScript-родин на незнайомому матеріалі; проєкт уже пройшов CP-JS у JS-10 і нової функції тут не отримує."
  en: "Cumulative stage gate: it assesses retained competence across every JavaScript family with unseen material; the capstone already passed CP-JS at JS-10 and gains no new feature here."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   js-03-05-closures (closure) ; js-04-07-reference-identity (identity) ; js-08-01-timers-and-the-event-loop (event loop) ; js-07-06-esm-import-export (modules) ; js-02-07-var-hoisting-tdz (TDZ) ; js-16-04-same-origin-cors (CORS) ; js-14-03-unions-narrowing (narrowing) ; js-17-02-big-o-measured (complexity) ; js-12-05-integer-minor-units (minor units) ; js-15-10-resolve-conflicts (conflicts)
lessons:
  - id: js-18-01-gate-review
    title: { uk: "Огляд перед рубежем: чого очікує JavaScript-етап", en: "Gate review: what the JavaScript stage expects" }
    kind: review
    minutes: 25
    objectives:
      - "Retrieve from memory how closures, the event loop and other core mechanisms behave by predicting the output of short unseen snippets."
      - "Rate your readiness for each JavaScript-stage family against the gate's criteria and pick the two families to revisit before the gate."
    subskills: []
    misconceptions: []
    prerequisites: [js-17-13-capstone-quality, js-10-05-capstone-cp-js]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: review, runtime: browser-js, summary: "Spaced-retrieval round: one short unseen question per JavaScript-stage family (J, W and P), answered from memory, then checked against the linked lesson and self-rated." }
      - { kind: predict, runtime: browser-js, summary: "Predict the console output of two unseen snippets: a memoize(fn) helper whose cache is shared by two wrapped functions, and a mix of setTimeout, queueMicrotask, a resolved promise and await inside one async function." }
    retrieval:
      - { concept: "what a closure keeps alive", from: js-03-05-closures }
      - { concept: "order of synchronous code, microtasks and timers", from: js-08-01-timers-and-the-event-loop }
  - id: js-18-02-unseen-debug
    title: { uk: "Рубіж: налагодження незнайомого коду", en: "Gate: unseen debugging" }
    kind: assessment
    minutes: 40
    objectives:
      - "Diagnose, without hints, unseen defects in a synthetic tool-lending module using breakpoints in the source-mapped build, the stack trace and failing assertions."
      - "Repair each defect without breaking passing behavior and add a boundary assertion that would have caught it."
    subskills:
      - { family: P-04, skill: "assertions/boundaries", depth: assess }
      - { family: P-04, skill: "breakpoints/source maps", depth: assess }
    misconceptions: []
    prerequisites: [js-18-01-gate-review]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-web, summary: "Build the unseen tool-lending module with esbuild and a source map, serve it locally and locate both deposit and overdue defects with breakpoints in the original source files, recording the paused values as evidence." }
      - { kind: independent, runtime: browser-js, summary: "No-hint task: in an unseen synthetic tool-lending module the deposit total drifts by one kopiyka after many loans and returned tools still show as overdue; locate both with breakpoints in the source-mapped build, fix them and add a boundary assertion for each." }
      - { kind: debug, runtime: browser-js, summary: "Second no-hint set in the same module: a Map cache keyed by freshly created objects that never hits, and a ReferenceError that appears only when the entry module imports its modules in a different order; diagnose each from the stack trace and the debugger, then repair it." }
    retrieval:
      - { concept: "money as integer minor units", from: js-12-05-integer-minor-units }
      - { concept: "two names for one object, two objects that look alike", from: js-04-07-reference-identity }
      - { concept: "a let binding read before its line runs", from: js-02-07-var-hoisting-tdz }
  - id: js-18-03-unseen-transfer
    title: { uk: "Рубіж: перенесення на незнайомий синтетичний домен", en: "Gate: transfer to an unseen synthetic domain" }
    kind: assessment
    minutes: 60
    objectives:
      - "Build, without hints, a small feature end to end for an unseen synthetic domain: typed model and validation, pure transforms with a justified index, persistence that recovers from invalid storage, and an accessible UI."
      - "Choose the test level (unit, integration, user-level) for each behavior, use deterministic fixtures with a fixed today-date, and leave the code behind a clean module interface."
    subskills:
      - { family: P-04, skill: "unit/integration/user/E2E purposes", depth: assess }
      - { family: P-04, skill: "deterministic fixtures", depth: assess }
      - { family: P-04, skill: "refactor/clean interfaces", depth: assess }
    misconceptions: []
    prerequisites: [js-18-02-unseen-debug]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint transfer task: a synthetic plant-care log (plants with name, location, watering interval in days, lastWatered date, status 'ok' | 'thirsty' | 'resting'), with a typed model and parsePlants from unknown, a due-today list with a measured index choice, persisted state that recovers from invalid storage, and a keyboard-operable list with announced updates, all checked on deterministic fixtures with a fixed today-date." }
      - { kind: write, runtime: browser-js, summary: "Write the module interface and a short README section for the feature: public functions, data shape, the index choice with its measured reason, the chosen test levels and how to run them." }
    retrieval:
      - { concept: "narrowing a status union", from: js-14-03-unions-narrowing }
      - { concept: "measured cost as the data grows", from: js-17-02-big-o-measured }
      - { concept: "splitting code into ES modules", from: js-07-06-esm-import-export }
      - { concept: "updating records without mutation", from: js-04-10-immutable-updates }
  - id: js-18-04-tests-review-writeup
    title: { uk: "Рубіж: тести, що ловлять дефект, рев’ю та звіт", en: "Gate: tests that catch it, review and write-up" }
    kind: assessment
    minutes: 40
    objectives:
      - "Write, without hints, tests that fail on a provided defective change and pass on its fix, and explain what a mocked version of the same test could not prove."
      - "Review the change, resolve the merge conflict it arrives with without losing either side's intent, and write a short decision write-up."
    subskills:
      - { family: P-04, skill: "mocks vs actual evidence", depth: assess }
      - { family: P-04, skill: "documentation and code review", depth: assess }
    misconceptions: []
    prerequisites: [js-18-03-unseen-transfer]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: an unseen change to a synthetic room-booking module (bookings as plain date ranges) silently breaks the no-overlap rule; write the unit and integration tests that catch it, show a mocked test that still passes and explain why, then write review comments and a decision write-up." }
      - { kind: local-task, runtime: local-web, summary: "In an unseen synthetic local repository, merge the reviewed branch into main, resolve the conflict in the booking rules so both intended changes survive, rerun the tests and commit with a message that references the review." }
    retrieval:
      - { concept: "resolving a conflict without losing either change", from: js-15-10-resolve-conflicts }
      - { concept: "what a mock can and cannot prove", from: js-09-05-mocks-vs-real }
  - id: js-18-05-explain-boundaries
    title: { uk: "Рубіж: поясни межі", en: "Gate: explain the boundaries" }
    kind: assessment
    minutes: 25
    objectives:
      - "Explain each boundary with an unseen counterexample: mock versus real evidence, TDZ versus undefined, ESM versus CommonJS loading, cookie versus storage scope, CORS versus server-side protection, and why code must not rely on a finalizer running."
    subskills:
      - { family: P-04, skill: "mocks vs actual evidence", depth: assess }
    misconceptions: []
    prerequisites: [js-18-04-tests-review-writeup]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint explain items: for six boundaries (mock vs real evidence, TDZ vs undefined, ESM vs CommonJS, cookie vs localStorage scope, CORS vs server protection, FinalizationRegistry timing) read an unseen snippet or scenario, state the outcome and justify it in two sentences, running the browser-runnable ones to confirm." }
    retrieval:
      - { concept: "who the browser's cross-origin rules protect", from: js-16-04-same-origin-cors }
      - { concept: "a TDZ error versus a silent undefined", from: js-02-10-debug-tdz-and-defaults }
      - { concept: "how CommonJS and ES modules load", from: js-07-08-cjs-and-load-failures }
      - { concept: "cookie scope versus storage scope", from: js-16-03-cookies-storage-origins }
      - { concept: "what a finalizer does not guarantee", from: js-13-10-weakref-resources-legacy }
