# Syllabus spine for RN-05. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RN-05
stage: RN
title: { uk: "Нативне зберігання, міграції й офлайн-дані", en: "Native persistence, migration and offline data" }
summary:
  uk: "Учень зберігає записи через асинхронний нативний адаптер сховища з урахуванням його обмежень, моделює завантаження й збої, версіонує та мігрує збережену схему, вважає пристрій джерелом істини для офлайн-даних без вигаданої синхронізації із сервером і після перезапуску чи пошкодження даних відновлює перевірений стан за спільними TypeScript-моделями."
  en: "The learner persists records through an async native storage adapter within its limits, models loading and failure, versions and migrates the stored schema, treats the device as the authority for offline data without inventing server sync, and restores a validated state after restart or corruption using shared TypeScript models."
competencies: [N-05]
capstoneStep:
  mode: local
  objective:
    uk: "Зберігати записи проєкту нативно через адаптер сховища з версіонованою схемою, переживати перезапуск, мігрувати одну зміну схеми й відновлюватися після пошкоджених даних."
    en: "Persist capstone records natively through a storage adapter with a versioned schema, survive restart, migrate one schema change and recover from corrupt data."
  variants:
    wishlist:
      uk: "Зберігати бажання у версіонованому знімку, мігрувати наданий застарілий знімок v0, де ціна зберігалася текстом, до поточної ціни-числа або null, а пошкоджений знімок відкладати під резервний ключ із повідомленням про відновлення замість аварійного завершення."
      en: "Persist wishes in a versioned snapshot, migrate a supplied legacy v0 snapshot that stored price as text to the current number-or-null price, and set a corrupt snapshot aside under a backup key with a recovery notice instead of crashing."
    planner:
      uk: "Зберігати справи у версіонованому знімку, мігрувати наданий застарілий знімок v0 без пріоритету, підставивши типовий 'normal', а пошкоджений знімок відкладати під резервний ключ із повідомленням про відновлення замість аварійного завершення."
      en: "Persist tasks in a versioned snapshot, migrate a supplied legacy v0 snapshot without priority by defaulting it to 'normal', and set a corrupt snapshot aside under a backup key with a recovery notice instead of crashing."
    habits:
      uk: "Зберігати звички у версіонованому знімку, мігрувати наданий застарілий знімок v0 з невпорядкованими й повторюваними completions до унікальних дат за зростанням, а пошкоджений знімок відкладати під резервний ключ із повідомленням про відновлення замість аварійного завершення."
      en: "Persist habits in a versioned snapshot, migrate a supplied legacy v0 snapshot with unsorted, duplicated completions to unique ascending dates, and set a corrupt snapshot aside under a backup key with a recovery notice instead of crashing."
    expenses:
      uk: "Зберігати витрати у версіонованому знімку, мігрувати наданий застарілий знімок v0 з десятковими сумами до цілого amountMinor, а пошкоджений знімок відкладати під резервний ключ із повідомленням про відновлення замість аварійного завершення."
      en: "Persist expenses in a versioned snapshot, migrate a supplied legacy v0 snapshot with decimal amounts to integer amountMinor, and set a corrupt snapshot aside under a backup key with a recovery notice instead of crashing."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   js-07-05-persist-reload (persist) ; re-03-08-independent-persistence-sync (sync) ; js-14-08-compile-time-vs-runtime (runtime validation) ; rn-03-02-platform-adapters (adapters)
lessons:
  - id: rn-05-01-storage-adapters
    title: { uk: "Нативні адаптери сховища та їхні обмеження", en: "Native storage adapters and their limits" }
    kind: instructional
    minutes: 12
    objectives:
      - "Compare browser localStorage with a native async key-value store: asynchronous calls, string-only values, size and speed limits, per-install lifetime and no encryption by default."
      - "Implement load and save of the versioned snapshot behind the storage adapter contract from RN-03."
    subskills:
      - { family: N-05, skill: "storage adapter limits", depth: intro }
    misconceptions:
      - "Native storage works like localStorage, so I can read it synchronously during render."
      - "Data in app storage is private and encrypted, so it is a safe place for anything."
    prerequisites: [rn-04-09-capstone-native-navigation, js-07-05-persist-reload, rn-03-02-platform-adapters]
    glossary: [async-key-value-store, app-sandbox]
    visual: { kind: diagram, concept: "Where the snapshot lives: the data hook calls the storage adapter, which serializes to a string and writes to the app's sandboxed key-value store; stepping compares the web adapter (synchronous localStorage per origin) with the native one (asynchronous, per app install, gone after uninstall)." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict what a list screen renders on its first frame when records come from an async native store rather than from synchronous localStorage." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview backed by a simulated async store, add an artificial read delay and watch the first frame show the loading state instead of the list." }
      - { kind: write, runtime: browser-js, summary: "Implement loadSnapshot and saveSnapshot for the { schemaVersion, records } snapshot against the async StorageAdapter contract, with JSON serialization and a size guard, passing the contract tests." }
    retrieval:
      - { concept: "persist and reload a versioned snapshot", from: js-07-05-persist-reload }
      - { concept: "the storage adapter seam", from: rn-03-02-platform-adapters }
  - id: rn-05-02-async-loading-failure
    title: { uk: "Асинхронне завантаження і збої", en: "Async loading and failure" }
    kind: instructional
    minutes: 10
    objectives:
      - "Model the startup load as loading → ready | empty | failed and render each state, never treating 'not loaded yet' as 'no records'."
      - "Prevent a save from overwriting stored data before the initial load has settled."
    subskills:
      - { family: N-05, skill: "async loading/failure", depth: intro }
    misconceptions:
      - "An empty list while loading means the same as having no records."
      - "A save right after launch is safe, because the load has surely finished by then."
    prerequisites: [rn-05-01-storage-adapters, re-03-08-independent-persistence-sync]
    glossary: []
    visual: { kind: sequence, concept: "Actors screen, data hook, storage adapter and device store at launch: the read is in flight while the screen shows loading, an early save waits until the load settles, and a rejected read ends in a failed state with a retry action." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict what the stored snapshot contains after a launch in which an effect saves the initial empty list before the async load resolves." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, add a loaded flag that blocks saving until the load settles, relaunch the simulated app and confirm the records survive." }
      - { kind: write, runtime: concept-preview, summary: "Write the startup state machine in the data hook with loading, ready, empty and failed states and a retry for a rejected read." }
    retrieval:
      - { concept: "persistence sync without premature or duplicate writes", from: re-03-08-independent-persistence-sync }
  - id: rn-05-03-schema-migration
    title: { uk: "Міграція схеми", en: "Schema migration" }
    kind: instructional
    minutes: 12
    objectives:
      - "Write a pure migrate(snapshot) that upgrades older snapshots step by step to the current schemaVersion and returns current data unchanged."
      - "Decide what happens to a snapshot newer than the app understands (keep it and do not overwrite) and to one with an unknown shape (reject it and keep it aside)."
    subskills:
      - { family: N-05, skill: "schema migration", depth: intro }
    misconceptions:
      - "When the shape changes I just add the new field in code, and old stored data adapts by itself."
      - "If a migration fails, resetting storage to empty is a safe fallback."
    prerequisites: [rn-05-02-async-loading-failure, js-14-08-compile-time-vs-runtime]
    glossary: [schema-migration, migration-chain]
    visual: { kind: diagram, concept: "A stored snapshot passing a migration chain: v0 → v1 → v2 boxes each transform the records, a version check routes current data straight through, a newer-than-known version to keep-read-only and an invalid shape to reject-and-set-aside." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the result of migrate() for a v0 snapshot, a current snapshot, a snapshot from a newer app version and a snapshot missing its records field." }
      - { kind: run-change, runtime: browser-js, summary: "Run the migration chain over the four supplied snapshots, add one more step and confirm a v0 snapshot passes through every step in order." }
      - { kind: write, runtime: browser-js, summary: "Write migrate(snapshot) for your capstone's v0 → v1 change with tests showing it is idempotent on current data and never silently drops a record." }
    retrieval:
      - { concept: "compile-time types do not check stored data", from: js-14-08-compile-time-vs-runtime }
      - { concept: "what JSON can and cannot carry", from: js-07-04-json }
  - id: rn-05-04-offline-cache-authority
    title: { uk: "Офлайн, кеш і джерело істини", en: "Offline, cache and authority" }
    kind: instructional
    minutes: 12
    objectives:
      - "Map who owns each piece of capstone data today (the device store is the authority; nothing is a cache yet) and mark which values become a cache of a server later, in NO-06."
      - "Explain why an offline edit must never be shown as 'synced' when no server exists, and label saved-on-device and pending states honestly."
    subskills:
      - { family: N-05, skill: "offline/cache vs authority", depth: intro }
    misconceptions:
      - "Offline mode means the app pretends the network is there and syncs later automatically."
      - "Anything stored on the device is just a cache, so losing it is harmless."
    prerequisites: [rn-05-03-schema-migration, re-06-05-cache-invalidation]
    glossary: [offline-first, data-authority]
    visual: { kind: diagram, concept: "A data-ownership diagram: records, drafts and derived totals each point at their authority (the device store now, a server from NO-06 on), and stepping shows an offline edit marked saved on this device and never labeled synced." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict what a record's status label should say after an edit made in airplane mode in an app with no server: synced, saved on this device or pending upload." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, toggle simulated connectivity, edit a record and replace a fabricated 'synced' badge with an honest 'saved on this device' state." }
      - { kind: write, runtime: concept-preview, summary: "Write a pure deriveSaveLabel(record, context) that never returns 'synced' while no server is configured, and use it in the preview's record row." }
    retrieval:
      - { concept: "cache keys and invalidation", from: re-06-05-cache-invalidation }
  - id: rn-05-05-restart-recovery-shared-models
    title: { uk: "Перезапуск, відновлення та спільні TS-моделі", en: "Restart, recovery and shared TS models" }
    kind: instructional
    minutes: 10
    objectives:
      - "Restore the app after a cold restart or process death from the stored snapshot, validated at runtime against the shared TypeScript model."
      - "Use one shared model type and validator for web, native and fixtures, so that a field rename breaks the typecheck everywhere at once."
    subskills:
      - { family: N-05, skill: "restart/recovery", depth: intro }
      - { family: N-05, skill: "shared TS models", depth: intro }
    misconceptions:
      - "When the app restarts, React state comes back by itself."
      - "A TypeScript type on the parsed snapshot proves the data is valid."
    prerequisites: [rn-05-04-offline-cache-authority, rn-01-04-shared-domain-code]
    glossary: [process-death, restore-on-launch]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which state survives a simulated process death: the open screen, the half-typed draft, the saved records, the scroll position." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, kill and relaunch the simulated app with and without a saved draft and watch what the restore step brings back; real process death is checked on your declared target." }
      - { kind: write, runtime: browser-js, summary: "Write restoreSnapshot(raw) that parses, migrates and validates with the shared model's validator and returns ok or errors without ever casting unknown data." }
    retrieval:
      - { concept: "parsed data is unknown until validated", from: js-14-06-unknown-vs-any }
  - id: rn-05-06-debug-corrupt-schema
    title: { uk: "Налагодження: пошкоджена схема під час завантаження", en: "Debug: corrupt schema on load" }
    kind: local-task
    minutes: 20
    objectives:
      - "Reproduce on the declared target a seeded launch crash caused by a corrupt snapshot and wrong data caused by an outdated one."
      - "Repair the load path so the corrupt data is set aside with a visible notice, the outdated snapshot migrates and nothing is silently overwritten."
    subskills:
      - { family: N-05, skill: "async loading/failure", depth: assess }
      - { family: N-05, skill: "schema migration", depth: assess }
    misconceptions: []
    prerequisites: [rn-05-05-restart-recovery-shared-models]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Load the seeded snapshots into the app's storage on your declared target with the supplied script, relaunch and record the crash or wrong state you observe — or mark the task unperformed." }
      - { kind: debug, runtime: local-native, summary: "Repair the load path — validate before use, migrate the outdated snapshot, keep the corrupt text under a backup key with a recovery notice, block saves until the load settles — and relaunch on your declared target to confirm." }
    retrieval:
      - { concept: "swallowed errors and bad JSON", from: js-07-09-debug-swallowed-errors }
  - id: rn-05-07-independent-offline-edits
    title: { uk: "Самостійно: офлайн-зміни та відновлення", en: "Independent: offline edits and recovery" }
    kind: assessment
    minutes: 35
    objectives:
      - "Build, without hints, offline create/edit/delete that persists through the storage adapter, survives restart and process death, validates with a shared model and never claims server sync, verified on the declared target."
    subskills:
      - { family: N-05, skill: "storage adapter limits", depth: assess }
      - { family: N-05, skill: "offline/cache vs authority", depth: assess }
      - { family: N-05, skill: "restart/recovery", depth: assess }
      - { family: N-05, skill: "shared TS models", depth: assess }
    misconceptions: []
    prerequisites: [rn-05-06-debug-corrupt-schema]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "In-course part: your restoreSnapshot and migrate functions for a synthetic plant-watering domain pass hidden snapshots — oversized, corrupt, outdated and from a newer version — without losing or fabricating records." }
      - { kind: independent, runtime: local-native, summary: "No-hint task: persist plant-watering edits through the native storage adapter, restart and force-stop the app on your declared target, and keep honest saved-on-device labels with no claimed sync." }
    retrieval:
      - { concept: "recovering invalid stored data", from: js-07-10-independent-modules-recovery }
  - id: rn-05-08-capstone-native-persistence
    title: { uk: "Проєкт: нативне зберігання", en: "Capstone: native persistence" }
    kind: capstone-step
    minutes: 40
    objectives:
      - "Persist the native capstone through the storage adapter with a versioned snapshot, migrate one schema change, survive restart and set corrupt data aside, verified on the declared target."
    subskills:
      - { family: N-05, skill: "schema migration", depth: practice }
    misconceptions: []
    prerequisites: [rn-05-07-independent-offline-edits, rn-04-09-capstone-native-navigation]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-native, summary: "Inside native/ in the exported workspace, connect the data hook to the native storage adapter, add your domain's v0 → v1 migration with tests, and verify restart and corrupt-snapshot recovery on your declared target; commit." }
    retrieval:
      - { concept: "the capstone's persistence effect on the web", from: re-03-09-capstone-persist-effect }
