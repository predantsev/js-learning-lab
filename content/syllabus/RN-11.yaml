# Syllabus spine for RN-11. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RN-11
stage: RN
title: { uk: "Нативна збірка, підпис і release-артефакт", en: "Native build, signing and a release artifact" }
summary:
  uk: "Учень налаштовує ідентифікатори й версії застосунку, розрізняє debug- і release-збірки, підписує release ключами, що лежать поза репозиторієм, збирає та встановлює release-артефакт на заявленій цілі, розбирає процес іншої платформи за наданими артефактами й документує обмеження оновлень, приватності та відкату без облікового запису в магазині."
  en: "The learner sets app ids and versions, tells debug from release builds, signs a release with keys kept outside the repository, builds and installs a release artifact on the declared target, inspects the other platform's flow with supplied artifacts, and documents update, privacy and rollback limits without a store account."
competencies: [N-11]
capstoneStep:
  mode: local
  objective:
    uk: "Зібрати, встановити й перевірити release-артефакт нативного проєкту на заявленій цілі з правильними ідентифікаторами й версіями та гігієною ключів; задокументувати обмеження іншої платформи й відкат."
    en: "Build, install and test a release artifact of the native capstone on the declared target with correct ids/versions and key hygiene; document other-platform limits and rollback."
  variants:
    wishlist:
      uk: "Зібрати release списку бажань із власним application id і версією 1.0.0 (build 1), встановити на заявлену ціль, перевірити бажання з фікстур і суму бажаних речей, потім встановити build 2 як оновлення й записати, чому повернення до build 1 — не просте перевстановлення."
      en: "Release-build the wishlist with its own application id and version 1.0.0 (build 1), install it on the declared target, check the fixture wishes and the wanted total, then install build 2 as an update and note why going back to build 1 is not a simple reinstall."
    planner:
      uk: "Зібрати release планувальника з власними ідентифікатором і версією, встановити, переконатися, що справи з терміном до сьогодні включно рахуються так само, як у debug, і задокументувати, що збережуть користувачі, якщо невдалий наступний release доведеться виправляти новою збіркою замість відкату."
      en: "Release-build the planner with its own id and version, install it, confirm that tasks due on or before today are counted the same as in debug, and document what users keep if a later release has to be replaced by a forward fix."
    habits:
      uk: "Зібрати release трекера звичок, встановити build 1, оновити до build 2 і переконатися, що completions і серія збереглися, а тоді задокументувати межу відкату для зміни схеми, що вийшла в build 2."
      en: "Release-build the habit tracker, install build 1, update to build 2 and confirm completions and the streak survive, then document the rollback limit for a schema change shipped in build 2."
    expenses:
      uk: "Зібрати release трекера витрат, встановити, переконатися, що підсумки amountMinor і показ категорій збігаються з debug-збіркою, і задокументувати, що артефакт не містить ключів і debug-прапорців, а також чим відрізнялася б збірка для іншої платформи."
      en: "Release-build the expense tracker, install it, confirm amountMinor totals and category display match the debug build, and document that the artifact contains no keys or debug flags and how the other platform's build would differ."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-12-01-production-build-env (production build) ; js-15-06-build-env-sourcemaps (env) ; rn-09-02-no-embedded-secrets (secrets) ; re-12-04-static-delivery-rollback (rollback)
lessons:
  - id: rn-11-01-app-config-ids-versions
    title: { uk: "Конфігурація застосунку, ідентифікатори й версії", en: "App config, ids and versions" }
    kind: instructional
    minutes: 12
    objectives:
      - "Identify where the Android applicationId, versionCode and versionName and the iOS bundle identifier, build number and marketing version are set, and which of them must increase with every release."
      - "Explain why the package id must never change once users have installed the app."
    subskills:
      - { family: N-11, skill: "Android/iOS config/package ids/versions", depth: intro }
    misconceptions:
      - "The version shown to users is what the OS uses to decide whether an update is newer."
      - "Changing the package id is a harmless rename."
    prerequisites: [re-12-03-versions-artifacts-updates, rn-01-03-env-versions-debug-release]
    glossary: [application-id, bundle-identifier, version-code, build-number]
    visual: { kind: diagram, concept: "One app identity mapped across platforms: the app config feeds the Android applicationId/versionCode/versionName and the iOS bundle identifier/build number/marketing version; stepping through two releases highlights which numbers must increase and which identity must never change." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which of four supplied config changes lets the OS install the new build as an update: bump versionName only, bump versionCode, change applicationId, lower the build number." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled config preview, bump the version fields for a second release and see which install outcome the simulated device reports for each change." }
      - { kind: write, runtime: concept-preview, summary: "Write the id and version entries for the capstone's first and second releases on both platforms, with a one-line rule for each field." }
    retrieval:
      - { concept: "what a version number promises (semver)", from: js-15-04-install-lockfile-semver }
  - id: rn-11-02-debug-vs-release-builds
    title: { uk: "Debug- і release-збірки", en: "Debug vs release builds" }
    kind: instructional
    minutes: 10
    objectives:
      - "List what a release build changes: the JS bundle embedded in the app, the dev server and dev menu gone, optimization on, __DEV__ false and release signing."
      - "Diagnose a feature that works in debug but fails in release because it depended on the dev server or on dev-only code."
    subskills:
      - { family: N-11, skill: "debug/release", depth: intro }
    misconceptions:
      - "A release build still loads the latest JavaScript from my computer."
      - "console.log calls vanish in a release build, so leaving them in costs nothing."
    prerequisites: [rn-11-01-app-config-ids-versions, re-12-01-production-build-env]
    glossary: [build-variant, embedded-bundle]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict what each of five supplied snippets (a __DEV__ guard, a console.log, a fixture URL on the dev machine's host, a dev-menu call, a dev-only import) does in a release build." }
      - { kind: run-change, runtime: concept-preview, summary: "Flip the labeled preview between debug and release flags and watch which snippets change behavior." }
      - { kind: debug, runtime: concept-preview, summary: "Repair a supplied lab app whose release build shows an empty list because its fixture URL points at the dev machine's bundler host." }
    retrieval:
      - { concept: "what a production bundle contains and which env values are baked in", from: re-12-01-production-build-env }
  - id: rn-11-03-signing-key-hygiene
    title: { uk: "Підпис і гігієна ключів", en: "Signing and key hygiene" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace how a release is signed on Android (keystore, upload key, store app signing) and on iOS (certificate, provisioning profile), and what the device does with an update signed by a different key."
      - "Keep signing keys and their passwords out of the repository and logs, with a backup and a written recovery path."
    subskills:
      - { family: N-11, skill: "signing/key hygiene", depth: intro }
    misconceptions:
      - "The signing key is just another config file and can be committed with the project."
      - "If I lose the signing key, I can make a new one and keep updating the same installed app."
    prerequisites: [rn-11-02-debug-vs-release-builds, rn-09-02-no-embedded-secrets]
    glossary: [code-signing, signing-key, upload-key, provisioning-profile]
    visual: { kind: sequence, concept: "Developer, local keystore, build tool, device and a described (not performed) store over time: the build signs the artifact, the device verifies the signature on install, and a later update signed with a different key is rejected; one step shows the store re-signing path as supplied documentation, not a performed upload." }
    analogy: "A wax seal on a letter: the recipient compares the seal with the sender's ring and refuses a letter sealed with a different one (limit: the seal proves who sealed the package, not that its contents are safe or correct, and a lost ring cannot be recreated — recovery depends on the platform's re-signing rules)."
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict what the simulated device does when update build 2 is signed with a new key because the original was lost." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled repository preview, move the keystore and its passwords out of the tracked tree into ignored local config and see what the secret-scan check reports." }
      - { kind: write, runtime: concept-preview, summary: "Write the project's key-hygiene note: where the key lives, how it is backed up, which file is git-ignored and what to do if it leaks." }
    retrieval:
      - { concept: "secrets never ship in the app or live in the repository", from: rn-09-02-no-embedded-secrets }
      - { concept: "build-time env and config kept out of version control", from: js-15-06-build-env-sourcemaps }
  - id: rn-11-04-build-artifacts
    title: { uk: "Артефакти збірки", en: "Build artifacts" }
    kind: local-task
    minutes: 20
    objectives:
      - "Build a signed release artifact for the declared target (an APK/AAB, or an iOS archive/IPA) and install it on the emulator or device."
      - "Inspect the artifact's id, version, signature and size, and confirm it runs with the dev server stopped and contains no debug flags or secrets."
    subskills:
      - { family: N-11, skill: "build artifacts", depth: intro }
    misconceptions: []
    prerequisites: [rn-11-03-signing-key-hygiene]
    glossary: [apk, android-app-bundle, ipa]
    visual: { kind: diagram, concept: "Source and config flow through JS bundling, native compilation, packaging and signing into one artifact; stepping highlights what each stage adds (JS bundle, compiled code, resources, signature) and which inspection command reads it back." }
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "On the declared target, produce a signed release artifact of a supplied lab app, install it, launch it with the dev server stopped, and record its id, version, signature fingerprint, size and the install outcome." }
    retrieval:
      - { concept: "verify the artifact you ship, not the source you built it from", from: re-12-06-artifact-verification }
  - id: rn-11-05-distribution-update-privacy
    title: { uk: "Розповсюдження, оновлення й основи приватності", en: "Distribution, updates and privacy basics" }
    kind: instructional
    minutes: 12
    objectives:
      - "Describe the distribution paths (store review, test tracks, staged rollout, sideloading, over-the-air JS updates) and what each can and cannot change."
      - "Fill a privacy declaration (data collected, purpose, sharing) for a synthetic app from its data-flow diagram, using supplied artifacts for the platform your workstation cannot build."
    subskills:
      - { family: N-11, skill: "distribution/store/update/privacy basics", depth: intro }
    misconceptions:
      - "An over-the-air update can change anything in the app, including native code and permissions."
      - "A privacy declaration is store paperwork unrelated to what the code actually collects."
    prerequisites: [rn-11-04-build-artifacts, rn-09-03-privacy-minimum-data]
    glossary: [staged-rollout, ota-update, privacy-label, sideloading]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which of five supplied changes (a copy fix, a new JS screen, a new native module, a new permission, a new icon) an over-the-air update can deliver and which need a new binary." }
      - { kind: run-change, runtime: concept-preview, summary: "Open the supplied other-platform artifact and its manifest or profile in the labeled viewer and compare its ids, version and requested permissions with your own build." }
      - { kind: write, runtime: concept-preview, summary: "Write the privacy declaration for the synthetic RN-09 lab app from its data-flow diagram, one line per field: collected, purpose, kept on the device or sent." }
    retrieval:
      - { concept: "data-flow diagram and minimum data", from: rn-09-03-privacy-minimum-data }
  - id: rn-11-06-compatibility-rollback
    title: { uk: "Сумісність і межі відкату", en: "Compatibility and rollback limits" }
    kind: instructional
    minutes: 10
    objectives:
      - "Explain why a native release cannot be rolled back like a static site: installed builds stay on devices, version codes cannot go down and stored data may already be migrated."
      - "Plan a forward fix and a compatibility window (minimum OS version, schema version, API contract) for a synthetic update."
    subskills:
      - { family: N-11, skill: "compatibility and rollback limitations", depth: intro }
    misconceptions:
      - "Rolling back a mobile release means users automatically get the previous build back."
      - "If a release breaks, reinstalling the old build fixes it without losing data."
    prerequisites: [rn-11-05-distribution-update-privacy, re-12-04-static-delivery-rollback]
    glossary: [minimum-os-version, forward-fix, version-downgrade]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict what happens to a user on build 3 with migrated schema v2 when you 'roll back' by shipping build 2's code as build 4." }
      - { kind: run-change, runtime: concept-preview, summary: "Make the supplied migration backward-readable in the labeled release-timeline preview and replay the rollback scenario." }
      - { kind: write, runtime: concept-preview, summary: "Write a release and rollback note for a synthetic update: compatibility window, forward-fix or kill-switch plan, and what cannot be undone." }
    retrieval:
      - { concept: "static rollback by repointing to a previous artifact", from: re-12-04-static-delivery-rollback }
  - id: rn-11-07-debug-release-build-failure
    title: { uk: "Налагодження: збій release-збірки", en: "Debug: a release build failure" }
    kind: local-task
    minutes: 25
    objectives:
      - "Diagnose a seeded release-only failure on the declared target: a version code that did not increase, a signing config that points at a missing key and a dev-only dependency."
      - "Repair it without committing a key or password, and confirm the installed update on the target."
    subskills:
      - { family: N-11, skill: "Android/iOS config/package ids/versions", depth: assess }
      - { family: N-11, skill: "debug/release", depth: assess }
      - { family: N-11, skill: "signing/key hygiene", depth: assess }
    misconceptions: []
    prerequisites: [rn-11-06-compatibility-rollback]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Build the seeded lab release for the declared target and record each failure message (install rejected as a downgrade, signing config error, release crash from a dev-only import) and where it appeared." }
      - { kind: debug, runtime: local-native, summary: "Repair the three defects with keys loaded from ignored local config, reinstall as an update over the previous build and record learner-confirmed evidence." }
    retrieval:
      - { concept: "find the first real error in a native build log", from: rn-07-01-native-logs-build-errors }
  - id: rn-11-08-independent-release-artifact
    title: { uk: "Самостійно: release-артефакт і нотатки з відновлення", en: "Independent: release artifact and recovery notes" }
    kind: assessment
    minutes: 40
    objectives:
      - "Produce, without hints, a signed release artifact of a supplied synthetic app for the declared target, install and test it, and write its update and rollback notes."
      - "Explain the other platform's signing and distribution constraints from supplied artifacts, without a paid account or a store upload."
    subskills:
      - { family: N-11, skill: "build artifacts", depth: assess }
      - { family: N-11, skill: "distribution/store/update/privacy basics", depth: assess }
      - { family: N-11, skill: "compatibility and rollback limitations", depth: assess }
    misconceptions: []
    prerequisites: [rn-11-07-debug-release-build-failure]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-native, summary: "No-hint task: release-build the supplied synthetic app for the declared target with correct ids/versions and keys outside the repository, install it as an update over its previous build, run a smoke checklist, and submit evidence plus a release note covering privacy declaration, update path, rollback limits and the other platform from supplied artifacts (no store upload)." }
    retrieval:
      - { concept: "device-only behavior must be checked on the target", from: rn-07-03-mocks-vs-device-checks }
  - id: rn-11-09-capstone-release-build
    title: { uk: "Проєкт: release-збірка", en: "Capstone: release build" }
    kind: capstone-step
    minutes: 45
    objectives:
      - "Build, install and test a signed release of the native capstone on the declared target and document other-platform limits and rollback."
    subskills:
      - { family: N-11, skill: "build artifacts", depth: practice }
    misconceptions: []
    prerequisites: [rn-11-08-independent-release-artifact]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-native, summary: "In native/, set the capstone's ids and versions, sign a release with keys kept outside the repository, install it on the declared target, check the domain's key behavior in the release build and commit the release and rollback note (no keys, no store upload)." }
    retrieval:
      - { concept: "the web capstone's production build and rollback plan", from: re-12-10-capstone-production-build }
