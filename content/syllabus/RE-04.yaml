# Syllabus spine for RE-04. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RE-04
stage: RE
title: { uk: "Спільний стан, reducers, context і власні хуки", en: "Shared state, reducers, context and custom hooks" }
summary:
  uk: "Учень піднімає лише той стан, який справді спільний, вирішує, де живе кожна частина стану, моделює переходи типізованим reducer, передає дані через context або композицію замість prop drilling, керує фокусом через refs і виносить логіку у власні хуки з чіткими контрактами."
  en: "The learner lifts only the state that is truly shared, decides where each piece of state lives, models transitions with a typed reducer, passes data through context or composition instead of prop drilling, manages DOM focus with refs and extracts custom hooks with clear contracts."
competencies: [P-05, R-03, R-04]
capstoneStep:
  mode: local
  objective:
    uk: "Підняти вгору лише спільний стан проєкту, змоделювати його типізованим reducer і винести багаторазовий хук збереження й доступу до даних із керуванням фокусом."
    en: "Move only the capstone's shared state up, model it with a typed reducer, and extract a reusable persistence/data-access hook with focus management."
  variants:
    wishlist:
      uk: "itemsReducer із типізованими actions (added, updated, removed, acquiredToggled) володіє бажаннями в найближчому спільному батьківському компоненті, хук useItems інкапсулює читання й збереження під ключем jsll.wishlist.v1, а після видалення фокус переходить на наступне бажання або на заголовок списку."
      en: "An itemsReducer with typed actions (added, updated, removed, acquiredToggled) owns the wishes in their lowest common parent, a useItems hook wraps reading and persisting under jsll.wishlist.v1, and after a delete focus moves to the next wish or the list heading."
    planner:
      uk: "tasksReducer із типізованими actions (added, updated, removed, doneToggled) володіє справами в найближчому спільному батьківському компоненті, хук useTasks інкапсулює читання й збереження під ключем jsll.planner.v1, а після видалення фокус переходить на наступну справу або на заголовок списку."
      en: "A tasksReducer with typed actions (added, updated, removed, doneToggled) owns the tasks in their lowest common parent, a useTasks hook wraps reading and persisting under jsll.planner.v1, and after a delete focus moves to the next task or the list heading."
    habits:
      uk: "habitsReducer із типізованими actions (added, updated, removed, activeToggled, completionAdded із переданою датою, без повторів у completions) володіє звичками в найближчому спільному батьківському компоненті, хук useHabits інкапсулює читання й збереження під ключем jsll.habits.v1, а після видалення фокус переходить на наступну звичку або на заголовок списку."
      en: "A habitsReducer with typed actions (added, updated, removed, activeToggled, and completionAdded with a passed-in date that never repeats in completions) owns the habits in their lowest common parent, a useHabits hook wraps reading and persisting under jsll.habits.v1, and after a delete focus moves to the next habit or the list heading."
    expenses:
      uk: "expensesReducer із типізованими actions (added, updated, removed), що приймає лише ціле amountMinor, володіє витратами в найближчому спільному батьківському компоненті, хук useExpenses інкапсулює читання й збереження під ключем jsll.expenses.v1, а після видалення фокус переходить на наступну витрату або на заголовок списку."
      en: "An expensesReducer with typed actions (added, updated, removed) that accepts only an integer amountMinor owns the expenses in their lowest common parent, a useExpenses hook wraps reading and persisting under jsll.expenses.v1, and after a delete focus moves to the next expense or the list heading."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-03-03-dependencies-cleanup (cleanup) ; re-01-03-props-children-typed (composition) ; js-14-03-unions-narrowing (discriminated actions) ; js-06-12-focus-management (focus)
lessons:
  - id: re-04-01-lifting-state
    title: { uk: "Піднімаємо стан", en: "Lifting state" }
    kind: instructional
    minutes: 12
    objectives:
      - "Find the closest common parent of two components that need the same state, and move the state there."
      - "Pass the value and a change callback down as props so that the siblings stay in sync."
    subskills:
      - { family: R-03, skill: "lifting state", depth: intro }
    misconceptions:
      - "Two components that show the same data should each keep their own copy in state and sync them."
      - "Lifting state means moving it all the way up to App."
    prerequisites: [re-02-09-independent-controlled-crud, re-01-03-props-children-typed]
    glossary: [lifting-state, state-ownership]
    visual: { kind: diagram, concept: "An ownership graph for a record list and a summary panel: arrows show which component owns the records state, which receive it as props and which receive an onToggle callback; moving the owner up one level redraws the arrows and the two views agree again." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what the summary panel shows after toggling a record in the list when each component keeps its own copy of the records state." }
      - { kind: run-change, runtime: browser-react, summary: "Run the out-of-sync version, move the state to the common parent and pass records and onToggle down as props." }
      - { kind: write, runtime: browser-react, summary: "Lift a selected-record id shared by a list and a detail panel into their parent, and keep the edit draft local to the detail panel." }
    retrieval:
      - { concept: "typed props and children for composing components", from: re-01-03-props-children-typed }
    # design note: ownership graph
  - id: re-04-02-where-state-lives
    title: { uk: "Локальний чи спільний: де живе стан", en: "Local or shared: where state lives" }
    kind: instructional
    minutes: 10
    objectives:
      - "Place each piece of state in the lowest component that needs it, and justify each placement in one sentence."
      - "Explain the costs of making state global without need: wider re-renders, hidden coupling and harder tests."
    subskills:
      - { family: R-03, skill: "local/shared placement", depth: intro }
      - { family: R-03, skill: "avoid needless global state", depth: intro }
    misconceptions:
      - "Putting all state in one global store is simpler and always faster."
      - "State used by a single input still belongs at the top so that it is easy to find."
    prerequisites: [re-04-01-lifting-state]
    glossary: [state-colocation, global-state]
    visual: { kind: diagram, concept: "A component tree with state badges: moving a badge (draft text, filter, records, sort order) up or down highlights every component that would re-render or need new props at that placement." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which components re-render on each keystroke in the create form when the draft lives in App versus in the form." }
      - { kind: run-change, runtime: browser-react, summary: "Run the app with render highlights, move the draft into the form and the filter into the list, and compare the highlighted renders." }
      - { kind: write, runtime: browser-react, summary: "Write a one-sentence placement justification for each of five pieces of state in a prepared record app, then move the two that are placed too high." }
    retrieval:
      - { concept: "a module-level binding shared by every importer", from: js-07-06-esm-import-export }
  - id: re-04-03-reducers-typed
    title: { uk: "Reducers і типізовані actions", en: "Reducers and typed actions" }
    kind: instructional
    minutes: 15
    objectives:
      - "Move scattered setter calls into a reducer (state, action) => nextState and dispatch actions from the handlers."
      - "Type the actions as a discriminated union with an exhaustive switch so that a misspelled type or a wrong payload fails at compile time."
      - "Draw the reducer as a state machine and reject an invalid transition, such as saving while nothing is being edited."
    subskills:
      - { family: R-03, skill: "reducer state transitions", depth: intro }
      - { family: P-05, skill: "typed reducers/context", depth: intro }
    misconceptions:
      - "A reducer may mutate the state it receives as long as it returns it."
      - "Typing an action as { type: string; payload?: any } is enough for the checker to catch a wrong payload."
    prerequisites: [re-04-02-where-state-lives, js-14-03-unions-narrowing]
    glossary: [use-reducer, dispatch, reducer-action]
    visual: { kind: diagram, concept: "A state machine for the records screen (browsing, editing, save-failed) with action arrows; dispatching an action highlights the arrow taken and the next state, and an action with no arrow from the current state is shown being rejected." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict the next state of a prepared reducer for added, statusToggled and an action with a misspelled type, and which dispatch the checker rejects." }
      - { kind: run-change, runtime: browser-react, summary: "Run the reducer with the state-machine view, then add a never-typed default branch and watch the checker point at the action variant that is not handled yet." }
      - { kind: write, runtime: browser-react, summary: "Write a typed recordsReducer with added, updated, removed and statusToggled actions that returns new state immutably, and use it through useReducer." }
    retrieval:
      - { concept: "narrowing a union by its discriminant field", from: js-14-03-unions-narrowing }
      - { concept: "reduce folds a list with a function of (accumulator, item)", from: js-05-04-reduce }
    # design note: state machine
  - id: re-04-04-context-boundaries
    title: { uk: "Межі context проти prop drilling", en: "Context boundaries vs prop drilling" }
    kind: instructional
    minutes: 12
    objectives:
      - "Recognise prop drilling and choose between passing children (composition) and a context."
      - "Create a typed context with a provider and a hook that throws a clear error when used outside the provider."
      - "Explain that every consumer re-renders when the provider value changes, and keep the context's boundary small."
    subskills:
      - { family: R-03, skill: "context boundaries", depth: intro }
      - { family: R-03, skill: "composition vs prop drilling", depth: intro }
    misconceptions:
      - "Context is a global store that should hold all app state."
      - "Passing a prop through two intermediate components is always a problem that needs context."
    prerequisites: [re-04-03-reducers-typed]
    glossary: [react-context, context-provider, prop-drilling]
    visual: { kind: diagram, concept: "One tree drawn three ways: props drilled through four levels, the middle levels removed by passing children, and a context provider whose value reaches only the consumers inside its boundary, with the consumers that re-render on change highlighted." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which components re-render when a context value changes, and what a consumer rendered outside the provider receives." }
      - { kind: run-change, runtime: browser-react, summary: "Run the drilled version, replace two pass-through levels with children composition, then move the remaining dispatch into a typed context." }
      - { kind: write, runtime: browser-react, summary: "Write a typed RecordsDispatchContext with a provider and a useRecordsDispatch hook that throws a clear error outside the provider." }
    retrieval:
      - { concept: "composition instead of inheritance", from: js-11-07-inheritance-vs-composition }
  - id: re-04-05-refs-focus
    title: { uk: "Refs і фокус у DOM", en: "Refs and DOM focus" }
    kind: instructional
    minutes: 10
    objectives:
      - "Hold a DOM node with useRef and move focus to it after a user action, once the commit has happened."
      - "Explain why changing ref.current does not re-render, and why that makes a ref the wrong place for displayed data."
      - "Restore focus sensibly after deleting a record or closing an inline editor."
    subskills:
      - { family: R-04, skill: "refs/DOM focus", depth: intro }
    misconceptions:
      - "A ref is just state that updates faster."
      - "Calling focus() during render is fine because the element is already in the JSX."
    prerequisites: [re-04-04-context-boundaries, js-06-12-focus-management]
    glossary: [use-ref, dom-ref]
    visual: { kind: sequence, concept: "A keyboard delete over time between the user, the click handler, React's commit and the DOM: the record is removed, the commit detaches the focused button so focus falls to the document body, and with the fix a ref moves focus to the next card's heading after the commit." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict where keyboard focus lands after deleting the focused record's row, with and without a ref-based focus step." }
      - { kind: run-change, runtime: browser-react, summary: "Run the list with the focus outline visible, delete a row by keyboard, then add a ref to the list heading and move focus there after the delete." }
      - { kind: write, runtime: browser-react, summary: "Write an inline Rename control that focuses its input when it opens and returns focus to the Rename button when cancelled." }
    retrieval:
      - { concept: "keeping focus when the UI updates", from: js-06-12-focus-management }
  - id: re-04-06-custom-hooks
    title: { uk: "Власні хуки та їхні контракти", en: "Custom hooks and their contracts" }
    kind: instructional
    minutes: 12
    objectives:
      - "Extract repeated stateful logic into a custom hook whose name starts with use and whose arguments and return value are typed."
      - "Write the hook's contract: what it returns, which arguments re-run its effects, what it cleans up, and that each call has its own state."
    subskills:
      - { family: R-04, skill: "custom hook contracts", depth: intro }
    misconceptions:
      - "Two components that call the same custom hook share the same state."
      - "A custom hook is just a helper function, so it can be called inside a condition."
    prerequisites: [re-04-05-refs-focus, re-03-03-dependencies-cleanup]
    glossary: [custom-hook, hook-contract]
    visual: { kind: diagram, concept: "Two components calling useStoredRecords drawn with separate state slots and separate effects, next to the hook's contract card (arguments, returned values, effect dependencies, cleanup) whose clauses link to the lines that implement them." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict whether two panels using the same useToggle hook flip together, and what the hook's cleanup does when its storage-key argument changes." }
      - { kind: run-change, runtime: browser-react, summary: "Run two panels that use one hook, change one of them, then lift the state up to see the difference between sharing logic and sharing state." }
      - { kind: write, runtime: browser-react, summary: "Extract a typed useStoredRecords(key) hook from a component's persistence effect, with a written contract and a cleanup that stops listening to storage events." }
    retrieval:
      - { concept: "cleanup before a re-run and on unmount", from: re-03-03-dependencies-cleanup }
  - id: re-04-07-debug-ownership-hooks
    title: { uk: "Налагодження: стан надто високо, умовний хук, порушений контракт", en: "Debug: state too high, conditional hook, broken contract" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose a form whose draft lives in App and re-renders the whole tree on every keystroke, and replace a context that only skips two levels with children composition."
      - "Repair a custom hook called conditionally and a hook whose returned setter breaks its written contract."
    subskills:
      - { family: R-03, skill: "composition vs prop drilling", depth: assess }
      - { family: R-04, skill: "rules of hooks", depth: assess }
    misconceptions:
      - "If the app works, it does not matter where the state lives."
    prerequisites: [re-04-06-custom-hooks]
    glossary: []
    visual: { kind: diagram, concept: "The seeded tree with overlays: the draft badge sitting at App with every component lighting up per keystroke, the hook slots shifting when a conditional hook is skipped, and the hook's contract card with the violated clause marked." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Before running, predict which seeded defects produce a visible error, which only cost re-renders and which return wrong data." }
      - { kind: run-change, runtime: browser-react, summary: "Run the seeded app with render highlights and the hook-slot view, type in the form and flip the condition, and match each symptom to its defect." }
      - { kind: debug, runtime: browser-react, summary: "Repair all three defects: move the draft down and replace the needless context with children, call the hook unconditionally, and make the hook honor its contract." }
    retrieval:
      - { concept: "hooks are matched by call order", from: re-03-01-rules-of-hooks }
  - id: re-04-08-independent-shared-state-hook
    title: { uk: "Самостійно: мінімальний спільний стан і хук даних", en: "Independent: minimal shared state and a data hook" }
    kind: assessment
    minutes: 30
    objectives:
      - "Build, without hints, a small record app where only the shared state is lifted, transitions go through a typed reducer, a typed data hook owns persistence and keyboard focus is managed after create and delete."
    subskills:
      - { family: R-03, skill: "lifting state", depth: assess }
      - { family: R-03, skill: "local/shared placement", depth: assess }
      - { family: R-04, skill: "refs/DOM focus", depth: assess }
      - { family: R-04, skill: "custom hook contracts", depth: assess }
      - { family: P-05, skill: "typed props/state/events/hooks", depth: practice }
      - { family: P-05, skill: "typed reducers/context", depth: practice }
    misconceptions: []
    prerequisites: [re-04-07-debug-ownership-hooks]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-react, summary: "No-hint task: list, detail and summary panels over a typed reducer and a useRecords hook; hidden checks verify state placement (no draft at the root), reducer transitions including an invalid one, two independent hook calls and focus after keyboard create and delete." }
    retrieval:
      - { concept: "a strict typed model with a generic helper", from: js-14-10-independent-typed-model }
    # design note: no-hint
  - id: re-04-09-capstone-data-hook
    title: { uk: "Проєкт: типізований reducer і хук даних", en: "Capstone: typed reducer and data hook" }
    kind: capstone-step
    minutes: 30
    objectives:
      - "In the local capstone project, move the record list into a typed reducer owned by the lowest common parent, extract a data hook for reading and persistence, manage focus after a delete and confirm the behavior locally."
    subskills:
      - { family: R-03, skill: "reducer state transitions", depth: practice }
    misconceptions: []
    prerequisites: [re-04-08-independent-shared-state-hook, re-03-09-capstone-persist-effect]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "In the local project, replace the record-list useState with a typed reducer whose actions cover the domain operations, wrap reading and the persistence effect in a domain data hook, and move focus through a ref after a delete." }
      - { kind: run-change, runtime: local-web, summary: "Run the local typecheck and dev script, exercise every action by keyboard, reload to confirm persistence, and commit once you have confirmed that focus lands where intended." }
    retrieval:
      - { concept: "the capstone repository adapter's interface", from: js-11-10-capstone-model-adapter }
