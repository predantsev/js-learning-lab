# Syllabus spine for RN-10. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RN-10
stage: RN
title: { uk: "Жести, анімація, ресурси й виміряна продуктивність", en: "Gestures, animation, assets and measured performance" }
summary:
  uk: "Учень узгоджує жест свайпу з прокручуванням, будує обмежені анімації, які можна перервати, з варіантом для зменшеного руху, підбирає розміри зображень і шрифтів під екран та профілює довгий список у release-збірці, щоб виправити одну виміряну проблему з пропущеними кадрами чи ідентичністю рядків на заявленій цілі."
  en: "The learner coordinates a swipe gesture with scrolling, builds bounded, interruptible animations with a reduced-motion path, sizes images and fonts for the screen, and profiles a long list in a release build to fix one measured dropped-frame or list-identity issue on the declared target."
competencies: [N-04, N-08]
capstoneStep:
  mode: local
  objective:
    uk: "Додати до нативного проєкту жест свайпу із закриттям і обмежену анімацію з варіантом для зменшеного руху, а потім профілювати довгий список у release-режимі й виправити одну виміряну проблему."
    en: "Add a dismissible swipe interaction and a bounded animation to the native capstone with a reduced-motion path, then profile a long list in release mode and fix one measured issue."
  variants:
    wishlist:
      uk: "Свайп картки бажання позначає його отриманим (acquired) з можливістю скасувати; картка від’їжджає анімацією, а при зменшеному русі лише згасає; далі — профілювання синтетичного списку із сотень бажань у release-режимі й виправлення однієї виміряної проблеми."
      en: "Swipe a wish card to mark it acquired with undo; the card slides out, or only fades under reduced motion; then profile a synthetic list of hundreds of wishes in release mode and fix one measured issue."
    planner:
      uk: "Свайп рядка справи перемикає done з анімованою позначкою, яка при зменшеному русі стає миттєвою зміною стану; далі — профілювання довгого синтетичного списку справ, відсортованого за dueDate, у release-режимі й виправлення однієї виміряної проблеми."
      en: "Swipe a task row to toggle done with an animated check that becomes an instant state change under reduced motion; then profile a long synthetic task list sorted by dueDate in release mode and fix one measured issue."
    habits:
      uk: "Свайп рядка звички додає сьогоднішню дату до completions (без дублікатів і за зростанням), а анімація лічильника серії при зменшеному русі пропускається; далі — профілювання довгого синтетичного списку звичок у release-режимі й виправлення однієї виміряної проблеми."
      en: "Swipe a habit row to add today's date to completions (kept unique and sorted), with a streak-counter animation that is skipped under reduced motion; then profile a long synthetic habit list in release mode and fix one measured issue."
    expenses:
      uk: "Свайп рядка витрати видаляє її з можливістю скасувати, рядок згортається анімацією (миттєво при зменшеному русі), а підсумки за категоріями в amountMinor лишаються правильними; далі — профілювання довгого синтетичного списку витрат у release-режимі й виправлення однієї виміряної проблеми."
      en: "Swipe an expense row to remove it with undo, collapsing the row with an animation (instant under reduced motion) while category totals in amountMinor stay correct; then profile a long synthetic expense list in release mode and fix one measured issue."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   rn-03-05-touch-js-vs-ui (JS vs UI) ; js-06-07-responsive-overflow-zoom-motion (reduced motion) ; re-07-02-profiling-render-causes (profiling) ; rn-04-05-subscription-cleanup (cleanup)
lessons:
  - id: rn-10-01-gestures-touch
    title: { uk: "Жести й узгодження дотиків", en: "Gesture and touch coordination" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace which component owns a touch as it moves from a tap to a horizontal pan inside a vertically scrolling list, and predict when the row or the list wins."
      - "Configure a pan gesture's activation threshold and direction so a horizontal swipe does not steal vertical scrolling, and provide a non-gesture alternative for the same action."
    subskills:
      - { family: N-08, skill: "gesture/touch coordination", depth: intro }
    misconceptions:
      - "A swipe is just a fast tap, so an onPress handler can detect it."
      - "A gesture is an extra, so screen-reader and keyboard users do not need another way to do the same action."
    prerequisites: [rn-03-05-touch-js-vs-ui]
    glossary: [pan-gesture, gesture-arbitration, activation-threshold]
    visual: { kind: sequence, concept: "Finger, row pan gesture, list scroll view and the gesture system exchange events over time: touch down, a small vertical move that the list claims, versus a horizontal move past the threshold that the row claims while the list's scroll is canceled; each step highlights the current owner of the touch." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict whether the row's pan or the list's scroll wins for three supplied finger paths (mostly vertical, diagonal, mostly horizontal) in the labeled gesture preview." }
      - { kind: run-change, runtime: concept-preview, summary: "Change the row's horizontal activation offset and vertical fail offset in the preview and replay the three paths." }
      - { kind: write, runtime: concept-preview, summary: "Write the row's swipe handler so it reports a dismiss intent only past a distance or velocity threshold, plus an accessibility action that triggers the same dismiss without a gesture." }
    retrieval:
      - { concept: "which thread handles touches and which runs your JS handlers", from: rn-03-05-touch-js-vs-ui }
  - id: rn-10-02-animation-fundamentals
    title: { uk: "Основи анімації", en: "Animation fundamentals" }
    kind: instructional
    minutes: 12
    objectives:
      - "Describe an animation as a value changing over time (timing or spring) that is interpolated into a style, and predict its end state."
      - "Bound an animation with a fixed duration or a settle condition, a defined end value and a completion that updates state exactly once."
    subskills:
      - { family: N-08, skill: "animation fundamentals", depth: intro }
    misconceptions:
      - "To animate in React Native I call setState on every frame."
      - "Animating a row off screen also removes it from the list state."
    prerequisites: [rn-10-01-gestures-touch, re-01-06-render-vs-commit]
    glossary: [animated-value, spring-animation, animated-interpolation]
    visual: { kind: render-timeline, concept: "Render, commit and animation frames for one dismiss: the row commits once, an animated translateX value then advances frame by frame with no new renders, and on completion a single state update removes the record and triggers one render with the new list snapshot." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict how many React renders happen while a 300 ms translateX animation runs and after its completion callback removes the record." }
      - { kind: run-change, runtime: concept-preview, summary: "Switch the preview animation from timing to spring, change the damping, and compare the render count and the frames in the timeline." }
      - { kind: write, runtime: concept-preview, summary: "Write a dismiss animation that interpolates translateX into opacity and calls onDismissed(id) once on completion." }
    retrieval:
      - { concept: "render versus commit", from: re-01-06-render-vs-commit }
  - id: rn-10-03-ui-js-work-frame-budget
    title: { uk: "Робота UI і JS та бюджет кадру", en: "UI vs JS work and the frame budget" }
    kind: instructional
    minutes: 12
    objectives:
      - "Compute the per-frame budget at 60 Hz and 120 Hz and explain what happens to a JS-driven animation while a handler blocks the JS thread for 200 ms."
      - "Move a gesture-driven animation off the JS thread (native driver or a UI-thread worklet) and name what that code can no longer access."
    subskills:
      - { family: N-08, skill: "UI/JS work limits", depth: intro }
      - { family: N-04, skill: "frame budget", depth: intro }
    misconceptions:
      - "If the JS code is fast on my laptop, the animation will be smooth on the phone."
      - "An animation on the UI thread cannot stutter, whatever else the app does."
    prerequisites: [rn-10-02-animation-fundamentals, rn-03-05-touch-js-vs-ui]
    glossary: [frame-budget, dropped-frame, native-driver]
    visual: { kind: diagram, concept: "Two simulated lanes, JS thread and UI thread, against 16.7 ms frame slots: a JS-driven fade misses slots while a seeded synchronous sort blocks the JS lane, whereas the native-driven fade keeps filling UI slots; stepping highlights the first dropped frame." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict how many frames the preview's JS-driven fade drops while a seeded 200 ms synchronous sort runs, and how many the native-driven fade drops." }
      - { kind: run-change, runtime: concept-preview, summary: "Toggle the native driver in the labeled lane simulation and defer the sort until the animation ends; compare the frame lanes." }
      - { kind: write, runtime: concept-preview, summary: "Write the frame-budget arithmetic for 60 Hz and 120 Hz and a note naming which of three supplied handlers must keep the JS thread free during a swipe." }
    retrieval:
      - { concept: "one task runs to completion before the next starts", from: js-08-01-timers-and-the-event-loop }
  - id: rn-10-04-cancellation-reduced-motion
    title: { uk: "Скасування, життєвий цикл і зменшений рух", en: "Cancellation, lifecycle and reduced motion" }
    kind: instructional
    minutes: 10
    objectives:
      - "Stop a running animation or gesture when the row unmounts, the screen loses focus or the app goes to the background, so no completion acts on a component that is gone."
      - "Read the OS reduce-motion setting, subscribe to its changes, and replace movement with an instant or fade-only transition that reaches the same end state."
    subskills:
      - { family: N-08, skill: "cancellation/lifecycle", depth: intro }
      - { family: N-08, skill: "reduced motion", depth: intro }
    misconceptions:
      - "Reduced motion means removing every animation, even the feedback that something changed."
      - "When an animation is interrupted, its completion callback simply never runs."
    prerequisites: [rn-10-03-ui-js-work-frame-budget, rn-04-05-subscription-cleanup]
    glossary: [interruptible-animation, reduce-motion-setting]
    visual: { kind: sequence, concept: "Row, animation driver, screen focus and the accessibility settings source over time: a dismiss starts, the user navigates away mid-animation, cleanup stops it, the completion arrives with finished: false and is ignored; then reduce motion turns on and the next dismiss uses a fade with the same final state." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict what the labeled preview logs when navigation interrupts a dismiss: does the completion run, with which finished flag, and is the record removed twice?" }
      - { kind: run-change, runtime: concept-preview, summary: "Toggle the simulated reduce-motion setting mid-session, change the dismiss to read the subscribed value and replay both paths." }
      - { kind: write, runtime: concept-preview, summary: "Write a useReducedMotion hook that reads the initial setting, subscribes to changes and removes the subscription in its cleanup." }
    retrieval:
      - { concept: "removing subscriptions when a screen goes away", from: rn-04-05-subscription-cleanup }
      - { concept: "prefers-reduced-motion on the web", from: js-06-07-responsive-overflow-zoom-motion }
  - id: rn-10-05-assets-images-fonts
    title: { uk: "Ресурси, зображення й шрифти", en: "Assets, images and fonts" }
    kind: instructional
    minutes: 10
    objectives:
      - "Choose an image size and density variant (@2x/@3x) for a 64-point thumbnail and estimate the decoded memory cost of shipping a 4000-pixel original instead."
      - "Load a custom font before the first text render with a fallback, and explain what the user sees while it loads."
    subskills:
      - { family: N-08, skill: "asset/image sizing and font/loading", depth: intro }
      - { family: N-04, skill: "images/assets", depth: intro }
    misconceptions:
      - "A small image on screen costs little memory, whatever the size of the source file."
      - "A custom font is ready as soon as I name it in a style."
    prerequisites: [rn-10-04-cancellation-reduced-motion, rn-02-01-view-text-image-input]
    glossary: [density-variant, decoded-image-size, bundled-font]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict the decoded memory of a 4000×3000 photo shown as a 64-point thumbnail at 3× density versus a resized 192×192 asset." }
      - { kind: run-change, runtime: concept-preview, summary: "Swap the preview's oversized source for density variants and compare the reported decoded size; then delay the custom font and observe the fallback." }
      - { kind: write, runtime: concept-preview, summary: "Write a thumbnail component that requests the right size, sets explicit dimensions and an accessible label, and shows a placeholder until the image and font are ready." }
    retrieval:
      - { concept: "Image needs an explicit size and an accessible label", from: rn-02-01-view-text-image-input }
  - id: rn-10-06-profiling-release-vs-debug
    title: { uk: "Профілювання: release проти debug", en: "Profiling release vs debug" }
    kind: local-task
    minutes: 20
    objectives:
      - "Profile the same long synthetic list in a debug build and a release build on the declared target and explain why only the release numbers count."
      - "Record a baseline (dropped frames, JS and UI frame rates, memory) with the target, build mode and dataset size stated."
    subskills:
      - { family: N-04, skill: "profiling release vs debug", depth: intro }
      - { family: N-04, skill: "measured render/memory improvements", depth: intro }
    misconceptions: []
    prerequisites: [rn-10-05-assets-images-fonts, rn-01-03-env-versions-debug-release]
    glossary: [release-profiling, perf-monitor]
    visual: { kind: diagram, concept: "Debug build versus release build of the same list: dev-only checks, the dev-server connection and unoptimized JS appear as extra boxes on the debug path; stepping shows where each box adds work to a frame, which is why a baseline must come from the release path." }
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Build the lab's 1,000-row synthetic list in debug and in release mode on the declared target, scroll a fixed 10-second script in each and record dropped frames, JS/UI frame rates and memory with target and build mode." }
      - { kind: debug, runtime: local-native, summary: "Diagnose a seeded slowdown that persists in release mode (renderItem formats every amount and date on each render) and confirm it from the release profile rather than the debug one." }
      - { kind: debug, runtime: concept-preview, summary: "Repair the same seeded slowdown in a 200-row preview list so that the whole list builds at most two formatters, checked by counting formatter constructions across reorders." }
    retrieval:
      - { concept: "measure why something rendered before changing it", from: re-07-02-profiling-render-causes }
  - id: rn-10-07-debug-dropped-frames
    title: { uk: "Налагодження: пропущені кадри й ідентичність у списку", en: "Debug: dropped frames and list identity" }
    kind: local-task
    minutes: 25
    objectives:
      - "Locate, from a release-mode profile on the declared target, the causes of dropped frames in a seeded swipeable list."
      - "Repair them and show before/after release measurements while each row's swiped state and accessibility label survive scrolling."
    subskills:
      - { family: N-04, skill: "frame budget", depth: assess }
      - { family: N-04, skill: "JS vs UI work", depth: assess }
      - { family: N-04, skill: "profiling release vs debug", depth: assess }
      - { family: N-08, skill: "UI/JS work limits", depth: assess }
    misconceptions: []
    prerequisites: [rn-10-06-profiling-release-vs-debug]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Run the seeded release build on the declared target, reproduce the stutter when swiping during a scroll and capture a profile plus a performance-monitor recording." }
      - { kind: debug, runtime: local-native, summary: "Repair the seeded defects (index keys that move swiped state to the wrong row, and a synchronous totals recomputation on every gesture event), re-measure in release mode and attach both measurements." }
      - { kind: debug, runtime: concept-preview, summary: "Repair the same two defects in a preview list with simulated swipes, checked by the opened row surviving a delete above it, at most one totals computation per swipe, correct totals and per-row labels." }
    retrieval:
      - { concept: "keys decide which state a list row keeps", from: rn-03-04-flatlist-keys }
  - id: rn-10-08-independent-dismissible
    title: { uk: "Самостійно: закриття свайпом, підтверджене вимірюванням", en: "Independent: dismissible interaction, measured" }
    kind: assessment
    minutes: 35
    objectives:
      - "Implement, without hints and on the declared target, a dismissible row with a bounded, interruptible animation, a reduced-motion path, an accessible non-gesture alternative and correctly sized images and fonts."
      - "Show one measured release-mode improvement with before/after numbers and state what was not measured."
    subskills:
      - { family: N-08, skill: "gesture/touch coordination", depth: assess }
      - { family: N-08, skill: "animation fundamentals", depth: assess }
      - { family: N-08, skill: "cancellation/lifecycle", depth: assess }
      - { family: N-08, skill: "reduced motion", depth: assess }
      - { family: N-08, skill: "asset/image sizing and font/loading", depth: assess }
      - { family: N-04, skill: "images/assets", depth: assess }
      - { family: N-04, skill: "measured render/memory improvements", depth: assess }
    misconceptions: []
    prerequisites: [rn-10-07-debug-dropped-frames]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-native, summary: "No-hint task on the declared target: a synthetic message list whose rows dismiss by swipe or by accessibility action, cancel cleanly on navigation, fade instead of sliding under reduce motion, and use sized thumbnails and a loaded font; attach before/after release-mode measurements and learner-confirmed evidence." }
      - { kind: debug, runtime: local-native, summary: "Repair a supplied stuck gesture (a row left half-swiped after an interrupted pan) without breaking the accessibility action or keyboard operation, and confirm it on the target." }
      - { kind: independent, runtime: concept-preview, summary: "No-hint preview task with checks: a synthetic inbox whose rows dismiss by simulated swipe past a threshold or by an accessibility action, with a bounded animation that calls back once, no dismissal after leaving the screen mid-way, a fade-only path under the simulated reduce-motion setting and 40-point avatars using the right density variant." }
    retrieval:
      - { concept: "an optimization must keep keyboard and screen-reader operability", from: re-07-07-independent-measured-optimization }
  - id: rn-10-09-capstone-native-polish
    title: { uk: "Проєкт: взаємодія, рух, продуктивність", en: "Capstone: interaction, motion, performance" }
    kind: capstone-step
    minutes: 40
    objectives:
      - "Add the domain's swipe action with an accessible alternative and a reduced-motion path to the native capstone list, then fix one release-mode measured issue and record before/after numbers."
    subskills:
      - { family: N-04, skill: "measured render/memory improvements", depth: practice }
    misconceptions: []
    prerequisites: [rn-10-08-independent-dismissible]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-native, summary: "In the native project, add the domain's swipe action with undo and an accessibility action, a bounded animation canceled on unmount, a reduce-motion path and one profile-driven fix with before/after release numbers on the declared target." }
      - { kind: run-change, runtime: local-native, summary: "Turn on the OS reduce-motion setting on the declared target, confirm the swipe still reaches the same end state, and record the observation." }
    retrieval:
      - { concept: "the native list screen and its keys", from: rn-03-08-capstone-native-crud }
