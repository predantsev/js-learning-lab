    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: header/nav/main landmarks, a labeled form submitted by Enter with preventDefault and inline validation, a list rendered with textContent and one delegated edit/delete listener, a Flexbox/Grid card layout built on custom properties with a breakpoint and reduced motion; hidden checks run keyboard-only, at 200% zoom and with a fixture name containing <img> markup." }
