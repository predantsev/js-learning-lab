# Syllabus spine for JS-06. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-06
stage: JS
title: { uk: "Форми, верстка, DOM і події", en: "Forms, layout, the DOM and events" }
summary:
  uk: "Учень будує доступну адаптивну сторінку з підписаними формами, видимим фокусом клавіатури та підтримуваною CSS-версткою, а потім керує нею з JavaScript: знаходить і рендерить вузли DOM з даних, безпечно виводить текст, обробляє submit і делеговані події, прибирає слухачі подій і зберігає фокус під час перерендерингу."
  en: "The learner builds an accessible, responsive page with labeled forms, visible keyboard focus and maintainable CSS layout, then drives it from JavaScript: querying and rendering DOM nodes from data, rendering text safely, handling submit and delegated events, cleaning up listeners and keeping focus through re-renders."
competencies: [W-01, W-02, W-03]
capstoneStep:
  mode: in-platform
  objective:
    uk: "Показати записи проєкту як доступні картки чи список із підписаною формою: створення, редагування, видалення з підтвердженням і повідомлення валідації біля полів."
    en: "Render capstone records as accessible cards/list with a labeled form: create/edit/delete (confirm before delete) and inline validation."
  variants:
    wishlist:
      uk: "Картки показують name, price або «без ціни», category і позначку acquired; підписана форма редагує name, price, category і прапорець acquired; видалення просить підтвердження, а помилки `validateItem` з’являються біля своїх полів."
      en: "Cards show name, price or “no price”, category and an acquired badge; a labeled form edits name, price, category and an acquired checkbox; delete asks for confirmation and `validateItem` errors appear next to their fields."
    planner:
      uk: "Картки показують title, dueDate, priority і done; підписана форма має поле title, поле дати для dueDate, список priority і прапорець done; видалення просить підтвердження, а помилки `validateTask` з’являються біля своїх полів."
      en: "Cards show title, dueDate, priority and done; a labeled form has a title field, a date input for dueDate, a priority select and a done checkbox; delete asks for confirmation and `validateTask` errors appear next to their fields."
    habits:
      uk: "Картки показують name, frequency, стан active і кількість completions; підписана форма має name, список frequency (daily/weekly) і прапорець active; видалення просить підтвердження, а помилки `validateHabit` з’являються біля своїх полів."
      en: "Cards show name, frequency, the active state and the completions count; a labeled form has name, a daily/weekly frequency select and an active checkbox; delete asks for confirmation and `validateHabit` errors appear next to their fields."
    expenses:
      uk: "Рядки показують label, відформатовану суму, date і category; підписана форма має поле label, поле суми (перетворюється на ціле amountMinor), поле дати й список category; видалення просить підтвердження, а помилки `validateExpense` з’являються біля своїх полів."
      en: "Rows show label, the formatted amount, date and category; a labeled form has a label field, an amount field converted to integer amountMinor, a date input and a category select; delete asks for confirmation and `validateExpense` errors appear next to their fields."
# Retrieval plan: js-01-07-links-buttons-images-tables (link vs button) ; js-05-01-map (map to render) ; js-04-07-reference-identity (node identity) ; js-02-04-nullish-optional-chaining (?.)
lessons:
  - id: js-06-01-forms-inputs-labels
    title: { uk: "Форми: поля, підписи та вбудована валідація", en: "Forms: inputs, labels, built-in validation" }
    kind: instructional
    minutes: 12
    objectives:
      - "Connect every input to a visible label (for/id or wrapping) and predict the accessible name a screen reader announces."
      - "Add built-in constraints (required, type, min, maxlength) and tie an inline hint or error message to its field with aria-describedby."
      - "Explain why built-in validation helps the user but does not replace a validate function in code."
    subskills:
      - { family: W-01, skill: "inputs/labels/validation", depth: intro }
    misconceptions:
      - "A placeholder is a good enough label."
      - "Built-in form validation means I no longer need to validate in code."
    prerequisites: [js-01-07-links-buttons-images-tables, js-02-10-independent-validation]
    glossary: [form, label, accessible-name, constraint-validation, inline-validation]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the accessible name of four inputs: labelled with for/id, wrapped in a label, with a placeholder only, and with no label at all." }
      - { kind: run-change, runtime: browser-js, summary: "Run the form, inspect the accessibility tree, then add required and maxlength and submit an empty and a too-long value." }
      - { kind: write, runtime: browser-js, summary: "Build a labeled synthetic record form with a text field, a number field, a select and a checkbox, each with a label and one inline hint linked by aria-describedby." }
    retrieval:
      - { concept: "a validation result with per-field errors", from: js-02-10-independent-validation }
  - id: js-06-02-keyboard-focus-landmarks
    title: { uk: "Фокус клавіатури та орієнтири (landmarks)", en: "Keyboard focus and landmarks" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict the Tab order of a page from its DOM order and identify which elements are focusable."
      - "Keep the focus indicator visible and give a page header, nav and main landmarks that a keyboard and screen-reader user can move between."
    subskills:
      - { family: W-01, skill: "keyboard focus", depth: intro }
      - { family: W-01, skill: "document structure/headings/landmarks", depth: practice }
    misconceptions:
      - "Anything I can click can also be reached with the keyboard."
      - "Removing the focus outline is fine if the page looks cleaner."
      - "A tabindex greater than 0 is the right way to fix the tab order."
    prerequisites: [js-06-01-forms-inputs-labels, js-01-06-html-elements-attributes]
    glossary: [keyboard-focus, tab-order, focus-indicator, accessibility-tree]
    visual: { kind: diagram, concept: "The accessibility tree beside the rendered page: each Tab press moves a highlight through the focusable elements in DOM order, landmarks are drawn as labelled regions, and a div with a click handler is visibly skipped." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the Tab order through a page with a link, a button, a div with a click handler and an input placed visually before the button but later in the DOM." }
      - { kind: run-change, runtime: browser-js, summary: "Run, Tab through the page, replace the clickable div with a button and restore a removed :focus-visible outline." }
      - { kind: write, runtime: browser-js, summary: "Add header, nav and main landmarks, one h1 and a visible focus style to a synthetic page, then check it with the keyboard only." }
    retrieval:
      - { concept: "link for navigation, button for an action", from: js-01-07-links-buttons-images-tables }
  - id: js-06-03-cascade-specificity
    title: { uk: "Каскад і специфічність", en: "The cascade and specificity" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict which declaration wins for an element by comparing specificity first and source order second."
      - "Tell inherited properties (color, font) from non-inherited ones (border, padding), and fix a conflict by lowering a selector's specificity instead of adding !important."
    subskills:
      - { family: W-02, skill: "cascade/inheritance/specificity", depth: intro }
    misconceptions:
      - "The rule written last always wins."
      - "!important is the normal way to fix a style that does not apply."
    prerequisites: [js-06-02-keyboard-focus-landmarks, js-01-08-css-selectors-text]
    glossary: [cascade, specificity, css-inheritance, computed-style]
    visual: { kind: diagram, concept: "A specificity ladder: the competing rules for one button are lined up by specificity (id, class, type columns) and then by source order, the winning declaration lights up, and inherited properties are shown flowing down from the parent only where no rule sets them." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the final colour of a button targeted by a type selector, a class, an id and a later class rule." }
      - { kind: run-change, runtime: browser-js, summary: "Run, inspect the computed styles, then rewrite the rules so the class rule wins without !important." }
      - { kind: write, runtime: browser-js, summary: "Style a card and its highlighted price with class-only selectors so that one modifier class overrides the base by source order." }
    retrieval:
      - { concept: "a rule is a selector plus declarations", from: js-01-08-css-selectors-text }
  - id: js-06-04-box-model-sizing
    title: { uk: "Блокова модель і розміри", en: "Box model and sizing" }
    kind: instructional
    minutes: 10
    objectives:
      - "Compute an element's rendered width from width, padding and border under content-box and border-box."
      - "Use padding, margin and max-width so a card's content never overflows its container."
    subskills:
      - { family: W-02, skill: "box model/sizing", depth: intro }
    misconceptions:
      - "width always sets the full visible width of a box, including padding and border."
      - "The vertical margins of two stacked blocks always add up."
    prerequisites: [js-06-03-cascade-specificity]
    glossary: [box-model, padding, margin, box-sizing, margin-collapse]
    visual: { kind: diagram, concept: "One card drawn as nested content, padding, border and margin boxes with live pixel sizes; switching box-sizing from content-box to border-box recomputes the total width while the declared width stays the same." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the rendered width of a 300px card with 20px padding and a 2px border under content-box and under border-box." }
      - { kind: run-change, runtime: browser-js, summary: "Run, toggle box-sizing in the inspector and change the padding to watch the total width move." }
      - { kind: write, runtime: browser-js, summary: "Build a card with a max-width, comfortable padding and border-box sizing that fits a narrow container without overflowing." }
    retrieval:
      - { concept: "adding up sizes in the right order", from: js-01-03-arithmetic-precedence }
  - id: js-06-05-flexbox-grid
    title: { uk: "Flexbox і Grid", en: "Flexbox and Grid" }
    kind: instructional
    minutes: 15
    objectives:
      - "Choose Flexbox for a one-dimensional row or column and Grid for a two-dimensional card layout."
      - "Lay out a form row and a card grid that wrap without overflowing, using gap, flex-wrap and repeat(auto-fill, minmax())."
    subskills:
      - { family: W-02, skill: "Flexbox/Grid", depth: intro }
    misconceptions:
      - "justify-content always moves items horizontally."
      - "Grid replaces Flexbox, so a page should use only one of them."
    prerequisites: [js-06-04-box-model-sizing]
    glossary: [flexbox, css-grid, main-axis, cross-axis, grid-track]
    visual: { kind: diagram, concept: "The main and cross axes drawn over a flex container's items: changing flex-direction, justify-content, align-items and gap moves the items live, and a grid overlay shows the tracks and how cards flow into them as the container narrows." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict where three items land for flex-direction row and column with justify-content: space-between." }
      - { kind: run-change, runtime: browser-js, summary: "Run, switch the axis, add flex-wrap and gap, then turn the card list into a grid with auto-fill columns." }
      - { kind: write, runtime: browser-js, summary: "Lay out a labeled form row with Flexbox and a card grid of synthetic records with Grid, both wrapping in a narrow container." }
    retrieval:
      - { concept: "nesting of elements in the page outline", from: js-01-06-html-elements-attributes }
  - id: js-06-06-spacing-typography-maintainable
    title: { uk: "Відступи, типографіка й підтримувані стилі", en: "Spacing, typography and maintainable styles" }
    kind: instructional
    minutes: 10
    objectives:
      - "Define a small spacing scale and type scale as custom properties in rem and apply them consistently."
      - "Restructure a stylesheet so that changing one token updates every place that uses it."
    subskills:
      - { family: W-02, skill: "spacing/typography", depth: intro }
      - { family: W-02, skill: "maintainable styles", depth: intro }
    misconceptions:
      - "Hard-coded pixel values everywhere are fine as long as the page looks right today."
      - "Custom properties are only for colours."
    prerequisites: [js-06-05-flexbox-grid, js-06-03-cascade-specificity]
    glossary: [custom-property, design-token, rem-unit, type-scale]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which elements change when --space-2 is redefined on :root and when it is redefined on one card only." }
      - { kind: run-change, runtime: browser-js, summary: "Run, change the root font size and the base line-height, and watch every heading and paragraph follow." }
      - { kind: write, runtime: browser-js, summary: "Replace the scattered magic numbers of a synthetic stylesheet with named custom properties for spacing, font sizes and colours." }
    retrieval:
      - { concept: "naming a value once and reusing the name", from: js-02-01-const-let }
  - id: js-06-07-responsive-overflow-zoom-motion
    title: { uk: "Адаптивність, переповнення, масштаб і зменшений рух", en: "Responsive, overflow, zoom and reduced motion" }
    kind: instructional
    minutes: 12
    objectives:
      - "Add a media query so that the learner's own site reflows its cards and form at a narrow viewport and stays usable at 200% zoom."
      - "Fix horizontal overflow caused by long unbroken text and wide content, and wrap animations in a prefers-reduced-motion query."
    subskills:
      - { family: W-02, skill: "responsive media queries", depth: intro }
      - { family: W-02, skill: "overflow and zoom", depth: intro }
      - { family: W-02, skill: "reduced motion", depth: intro }
    misconceptions:
      - "Responsive design means building a separate mobile page."
      - "If it looks fine at 100% zoom on my screen, it works for everyone."
    prerequisites: [js-06-06-spacing-typography-maintainable, js-06-05-flexbox-grid]
    glossary: [media-query, viewport, overflow, responsive-breakpoint, reduced-motion]
    visual: { kind: diagram, concept: "The learner's site preview (not the platform) at a desktop width, a narrow width and 200% zoom: a breakpoint switches the layout, an overflowing long word or wide table is outlined, and an animated card changes instantly when reduced motion is requested." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which parts of a synthetic site overflow at a 320px-wide preview and at 200% zoom: a long unbroken link, a fixed-width table and a fixed-height card." }
      - { kind: run-change, runtime: browser-js, summary: "Run, resize the site preview, add a breakpoint and overflow-wrap, then turn on reduced-motion emulation in the browser DevTools and compare." }
      - { kind: write, runtime: browser-js, summary: "Make a card list switch from one column to several with a media query, and disable its hover animation under prefers-reduced-motion." }
    retrieval: []
  - id: js-06-08-dom-query-create-update
    title: { uk: "DOM: знаходимо, створюємо, змінюємо, видаляємо", en: "The DOM: query, create, update, remove" }
    kind: instructional
    minutes: 12
    objectives:
      - "Select nodes with querySelector and querySelectorAll, and create, update and remove nodes from JavaScript."
      - "Explain why changing the DOM does not change the HTML source text, and why querySelector returns null for a missing element."
    subskills:
      - { family: W-03, skill: "query/create/update/remove nodes", depth: intro }
    misconceptions:
      - "JavaScript edits the HTML file."
      - "The list returned by querySelectorAll updates itself when the page changes."
    prerequisites: [js-04-05-objects-properties, js-01-06-html-elements-attributes]
    glossary: [dom, dom-tree, dom-node, query-selector]
    visual: { kind: diagram, concept: "The HTML source on the left and the live DOM tree on the right: querySelector highlights the matching node, createElement plus append adds a node to the tree and the preview, a textContent edit changes one node and remove() detaches it, while the source text never changes." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict what querySelector returns for an existing class and a missing id, and the length of a saved querySelectorAll('.card') result after one more card is appended." }
      - { kind: run-change, runtime: browser-js, summary: "Run, create and append a list item, change its textContent, remove it, and compare the DOM inspector with the unchanged HTML source." }
      - { kind: write, runtime: browser-js, summary: "Write addMessage(text) that creates a p element with the text in a status area and clearMessages() that removes all of them." }
    retrieval:
      - { concept: "an object with properties you read and set", from: js-04-05-objects-properties }
  - id: js-06-09-text-vs-html
    title: { uk: "textContent проти innerHTML", en: "textContent vs innerHTML" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict how textContent and innerHTML render the same string that contains markup."
      - "Render untrusted record text with textContent or createElement, and explain why innerHTML with entered data is an unsafe sink (the full attack picture comes in JS-16)."
    subskills:
      - { family: W-03, skill: "safe text vs HTML", depth: intro }
    misconceptions:
      - "innerHTML is just a faster textContent."
      - "Text that I typed myself can never be dangerous on my page."
    prerequisites: [js-06-08-dom-query-create-update, js-01-02-numbers-and-text]
    glossary: [text-content, inner-html, unsafe-sink]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict how a synthetic record name containing <b> tags and an <img> tag with an onerror attribute renders through textContent and through innerHTML." }
      - { kind: run-change, runtime: browser-js, summary: "Run both in the isolated preview, observe which one creates elements and fires the onerror handler, then switch the renderer to textContent." }
      - { kind: write, runtime: browser-js, summary: "Write renderName(container, name) that shows any string safely, plus a bold variant built with createElement instead of an HTML string." }
    retrieval:
      - { concept: "a string is just text until something parses it", from: js-01-02-numbers-and-text }
  - id: js-06-10-events-default-behavior
    title: { uk: "Події, типова поведінка браузера і форми", en: "Events, default behavior and forms" }
    kind: instructional
    minutes: 12
    objectives:
      - "Attach a submit listener to a form, read the form's values and prevent the default page reload."
      - "Explain why a submit listener, not a click listener on the button, handles both Enter and button clicks."
      - "Remove a listener with the same function reference when its part of the UI goes away, and predict why a fresh arrow cannot be removed."
    subskills:
      - { family: W-03, skill: "default behavior", depth: intro }
      - { family: W-03, skill: "forms and event cleanup", depth: intro }
    misconceptions:
      - "A click listener on the submit button is the best way to handle a form."
      - "removeEventListener works with any function that has the same code."
    prerequisites: [js-06-09-text-vs-html, js-06-01-forms-inputs-labels, js-03-06-higher-order-callbacks]
    glossary: [event, event-listener, default-action, prevent-default, listener-cleanup]
    visual: { kind: sequence, concept: "Actors user, form, listener and browser over time: Enter or a button click fires one submit event to the form's listener, preventDefault cancels the page reload, the listener validates and updates the DOM; a second lane shows removeEventListener with the same function reference detaching it, and with a new arrow leaving it attached." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict what happens on Enter and on a button click for a form with no listener, with a click listener on the button and with a submit listener that calls preventDefault." }
      - { kind: run-change, runtime: browser-js, summary: "Run, remove preventDefault to see the reload, then attach the same listener setup twice and count the duplicate log lines." }
      - { kind: write, runtime: browser-js, summary: "Write a submit handler for a synthetic record form that prevents the default, reads the fields, runs the validate function and shows its messages inline." }
    retrieval:
      - { concept: "a callback is called later by someone else", from: js-03-06-higher-order-callbacks }
      - { concept: "the same function reference versus an equal-looking one", from: js-04-07-reference-identity }
  - id: js-06-11-bubbling-capture-delegation
    title: { uk: "Шлях події: спливання, перехоплення, делегування", en: "Event path: bubbling, capture, delegation" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict the order in which capture and bubble listeners on nested elements run for one click."
      - "Replace per-item listeners with one delegated listener that finds the clicked record through closest() and a data attribute, ignoring clicks outside any item."
    subskills:
      - { family: W-03, skill: "bubbling/capture/delegation", depth: intro }
    misconceptions:
      - "An event only reaches the element that was clicked."
      - "event.target is always the element the listener is attached to."
    prerequisites: [js-06-10-events-default-behavior]
    glossary: [event-bubbling, capture-phase, event-delegation, event-target, data-attribute]
    visual: { kind: diagram, concept: "The real DOM path of a click on a delete button inside a card inside a list: the event travels down through the capture phase and back up through the bubble phase, each listener on the path lights up in order, and one delegated listener on the list finds the card with event.target.closest('[data-id]')." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the log order of capture and bubble listeners on list, card and button for one button click, and again after stopPropagation on the card." }
      - { kind: run-change, runtime: browser-js, summary: "Run, then replace the per-button listeners with one list listener and click an item that was added after setup." }
      - { kind: write, runtime: browser-js, summary: "Write one delegated click listener on a record list that handles edit and delete buttons by data-action and data-id and ignores clicks on empty space." }
    retrieval:
      - { concept: "?. when closest() finds nothing", from: js-02-04-nullish-optional-chaining }
  - id: js-06-12-focus-management
    title: { uk: "Зберігаємо фокус, коли інтерфейс перемальовується", en: "Keeping focus when the UI re-renders" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict where focus goes when the focused element is removed or replaced by a re-render."
      - "Move focus to a sensible element after the DOM changes: the edited card, the next item after a delete, or the first invalid field."
    subskills:
      - { family: W-03, skill: "focus management", depth: intro }
    misconceptions:
      - "The browser keeps focus on the same item after I rebuild the list."
      - "Where focus goes is only cosmetic."
    prerequisites: [js-06-11-bubbling-capture-delegation, js-06-02-keyboard-focus-landmarks, js-04-07-reference-identity]
    glossary: [focus-management, active-element]
    visual: { kind: sequence, concept: "Actors user, list, render function and document.activeElement over time: the user edits a record, the list is rebuilt with new nodes, the focused node is detached and focus falls back to body; the fixed run remembers the record id before rendering and focuses the new matching button afterwards." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict document.activeElement after deleting the focused card and after re-rendering the whole list from the same records." }
      - { kind: run-change, runtime: browser-js, summary: "Run with the keyboard only, delete an item, then add code that focuses the next item's button and run again." }
      - { kind: write, runtime: browser-js, summary: "Write a render-then-restore step that remembers the focused record id, focuses the matching new button and falls back to the list heading." }
    retrieval:
      - { concept: "a rebuilt node is a different object", from: js-04-07-reference-identity }
  - id: js-06-13-render-list-from-data
    title: { uk: "Рендеримо список із даних", en: "Rendering a list from data" }
    kind: instructional
    minutes: 12
    objectives:
      - "Write render(records) that rebuilds a list or a table from data with createElement and textContent, including an empty-state message."
      - "Give repeated controls distinct accessible names and explicit button types, and decide when records belong in a table rather than a list."
    subskills:
      - { family: W-03, skill: "query/create/update/remove nodes", depth: practice }
      - { family: W-01, skill: "tables/images/alt", depth: practice }
      - { family: W-01, skill: "safe accessible form semantics", depth: intro }
    misconceptions:
      - "A button inside a form only does what my listener tells it to."
      - "Several buttons all labelled “Delete” are fine because sighted users can see which card each belongs to."
    prerequisites: [js-06-12-focus-management, js-05-01-map, js-06-09-text-vs-html]
    glossary: [render-function, empty-state]
    visual: { kind: pipeline, concept: "Records flow through render(records): map turns each record into one list-item node (an empty list into an empty-state message), each node gets textContent fields, an image with alt text and type=button controls with names like “Delete Desk lamp”, and the list is replaced in one step." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the DOM produced by render([]) and render(twoRecords), and what a button without a type attribute does when clicked inside a form." }
      - { kind: run-change, runtime: browser-js, summary: "Run, change the records array and call render again, then switch the list to a table with a caption and a header row." }
      - { kind: write, runtime: browser-js, summary: "Write render(records) for synthetic records producing cards with name, price or “no price”, an image with alt text and Edit/Delete buttons named after the record." }
    retrieval:
      - { concept: "map one list to another", from: js-05-01-map }
  - id: js-06-14-debug-dom-defects
    title: { uk: "Налагодження: дубльовані слухачі, втрачений фокус, поля без підписів", en: "Debug: duplicate listeners, lost focus, missing labels" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose and repair seeded UI defects: a delete handled twice by a button listener and a bubbling list listener, a submit listener added again on every render, focus lost after a re-render, an unlabeled input, a link used as an action, an id rule overriding a class, and a card that overflows at 200% zoom."
      - "Verify each repair with the keyboard, the accessibility tree or the computed styles."
    subskills:
      - { family: W-03, skill: "bubbling/capture/delegation", depth: assess }
      - { family: W-03, skill: "focus management", depth: assess }
      - { family: W-03, skill: "forms and event cleanup", depth: assess }
      - { family: W-01, skill: "links/buttons", depth: assess }
      - { family: W-01, skill: "inputs/labels/validation", depth: assess }
      - { family: W-02, skill: "cascade/inheritance/specificity", depth: assess }
      - { family: W-02, skill: "overflow and zoom", depth: assess }
    misconceptions:
      - "If the UI works with a mouse, it works."
    prerequisites: [js-06-13-render-list-from-data]
    glossary: []
    visual: { kind: diagram, concept: "The failing UI replayed: the event-path diagram shows one click reaching two delete handlers, the accessibility tree shows an input with no name and a link acting as a button, and the cascade panel shows the overriding id rule next to the card overflowing at 200% zoom." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Before running, mark which of the seven seeded defects shows up with the mouse, which only with the keyboard and which only at 200% zoom." }
      - { kind: run-change, runtime: browser-js, summary: "Run the seeded UI, reproduce each defect and match its symptom to your prediction." }
      - { kind: debug, runtime: browser-js, summary: "Repair all seven defects (double delete, repeated submit listener, lost focus, unlabeled input, link-as-button, specificity conflict, overflow at zoom) without changing the intended behaviour." }
    retrieval:
      - { concept: "button for an action, link for navigation", from: js-01-07-links-buttons-images-tables }
  - id: js-06-15-independent-crud-ui
