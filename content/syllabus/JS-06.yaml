      - { family: W-02, skill: "box model/sizing", depth: assess }
      - { family: W-02, skill: "Flexbox/Grid", depth: assess }
      - { family: W-02, skill: "spacing/typography", depth: assess }
      - { family: W-02, skill: "responsive media queries", depth: assess }
