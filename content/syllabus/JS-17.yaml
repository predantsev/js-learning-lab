# Syllabus spine for JS-17. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-17
stage: JS
title: { uk: "Якість застосунку: алгоритми, вимірювання, рефакторинг і доступність", en: "Application quality: algorithms, measurement, refactoring and accessibility" }
summary:
  uk: "Учень добирає список, Map, стек, чергу чи обхід дерева під задачу, порівнює кількість операцій із виміряним часом, обмежує рекурсію й явно тримає інваріанти, профілює та покращує одне виміряне вузьке місце, рефакторить до чистих інтерфейсів під захистом тестів, рецензує й документує код і перевіряє сторінку на роботу з клавіатурою та скринрідером."
  en: "The learner picks a list, map, stack, queue or tree traversal for a task, compares operation counts with measured timings, bounds recursion and keeps invariants explicit, profiles and improves one measured bottleneck, refactors toward clean interfaces under tests, reviews and documents code, and audits a page for keyboard and screen-reader use."
competencies: [J-13, W-05, P-04]
capstoneStep:
  mode: local
  objective:
    uk: "Спрофілювати проєкт на великому синтетичному наборі даних, замінити одне квадратичне перетворення індексованим, відрефакторити код зі збереженням поведінки під тестами та провести аудит клавіатури й скринрідера."
    en: "Profile the capstone with a large synthetic dataset, replace one quadratic transform with an indexed one, refactor behavior-preservingly under tests and run a keyboard/screen-reader audit."
  variants:
    wishlist:
      uk: "Згенерувати 20 000 синтетичних бажань на основі фікстур, виміряти попередження про дублікати назв, яке для кожного бажання запускає some() по всьому списку, замінити його на Set нормалізованих name і перевірити, що перемикач acquired і фільтр працюють із клавіатури та оголошують свій стан."
      en: "Generate 20,000 synthetic wishes from the fixtures, measure the duplicate-name warning that runs some() over the whole list for every wish, replace it with a Set of normalized names, and audit that the acquired toggle and the filter work by keyboard and announce their state."
    planner:
      uk: "Згенерувати 20 000 синтетичних справ, виміряти крок повторного рендеру, що викликає oldTasks.find() за id усередині map, замінити його на Map від id до справи й перевірити, що після позначення done фокус лишається на справі, а зміна оголошується."
      en: "Generate 20,000 synthetic tasks, measure the re-render step that calls oldTasks.find() by id inside map, replace it with a Map from id to task, and audit that marking a task done keeps focus on it and is announced."
    habits:
      uk: "Згенерувати звички з completions за кілька років, виміряти розрахунок частки виконання, що викликає completions.includes(day) для кожного дня діапазону, перейти на Set дат для кожної звички й перевірити, що перемикач виконання на сьогодні доступний із клавіатури та має зрозумілу назву для скринрідера."
      en: "Generate habits with several years of completions, measure the completion rate that calls completions.includes(day) for every day in the range, switch to a Set of dates per habit, and audit that today's completion toggle is reachable by keyboard and has a clear screen-reader name."
    expenses:
      uk: "Згенерувати 50 000 синтетичних витрат за багато дат, виміряти денні підсумки, що для кожної окремої дати фільтрують увесь список, замінити їх одним проходом у Map від date до суми amountMinor і перевірити підписи форми додавання витрати та оголошення помилок."
      en: "Generate 50,000 synthetic expenses over many dates, measure daily totals that filter the whole list for each distinct date, replace them with one pass into a Map from date to the amountMinor total, and audit the add-expense form's labels and error announcements."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   js-05-06-search-complexity (complexity) ; js-13-05-allocation-retained-references (memory) ; js-09-02-assertions (tests) ; js-06-02-keyboard-focus-landmarks (keyboard)
lessons:
  - id: js-17-01-stacks-queues-trees
    title: { uk: "Списки, стеки, черги та обхід дерева", en: "Lists, stacks, queues and tree traversal" }
    kind: instructional
    minutes: 12
    objectives:
      - "Implement a stack and a queue for record operations and predict the order in which items leave each."
      - "Walk a nested category tree depth-first with an explicit stack and breadth-first with a queue, and predict each visit order."
    subskills:
      - { family: J-13, skill: "lists/maps/sets/stacks/queues/tree traversal", depth: intro }
    misconceptions:
      - "A stack and a queue are both just arrays, so it does not matter which end I remove from."
      - "Depth-first and breadth-first visit the nodes in the same order; only the code differs."
    prerequisites: [js-04-01-arrays-basics, js-03-08-recursion-base-case]
    glossary: [lifo-stack, fifo-queue, depth-first-traversal, breadth-first-traversal]
    visual: { kind: code-trace, concept: "The same seven-node category tree, written as each name's list of children, walked by a stack loop and then a queue loop; each captioned step shows which name pop or shift just took and what is left in the stack or queue, so the depth-first and breadth-first visit orders build up one after the other. (A diagram cannot show changing stack and queue contents within the 450 px column, so the real trace is used.)" }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the visit order of a seven-node category tree for the stack-based walk and for the queue-based walk." }
      - { kind: run-change, runtime: browser-js, summary: "Run both walks, swap the stack for a queue in the same loop and watch the order change; then measure shift() against a head-index queue at 1,000, 10,000 and 30,000 items and record what you observe instead of assuming (100,000 shift() calls can exceed the sandbox's 2 s loop budget in Chrome, measured 2026-10-02)." }
      - { kind: write, runtime: browser-js, summary: "Write an undo stack for record edits (push on change, pop on undo) and a bounded queue of pending saves that drops the oldest entry when full." }
    retrieval:
      - { concept: "a bounded walk over a nested structure", from: js-03-10-independent-transforms }
  - id: js-17-02-big-o-measured
    title: { uk: "Big-O, виміряно", en: "Big-O, measured" }
    kind: instructional
    minutes: 12
    objectives:
      - "Count the operations of a linear and a nested-loop transform for n = 10, 100 and 1,000 and predict how each count grows."
      - "Measure the same transforms with performance.now() over growing synthetic sizes with repeated runs, and explain when timings disagree with the counts (small n, warm-up, constant factors)."
      - "State how much extra memory each version allocates as n grows."
    subskills:
      - { family: J-13, skill: "Big-O time/space", depth: intro }
      - { family: J-13, skill: "data size measurement", depth: intro }
    misconceptions:
      - "Big-O tells me how many milliseconds the code takes."
      - "One timing run on my machine proves which version is faster."
    prerequisites: [js-17-01-stacks-queues-trees, js-05-06-search-complexity]
    glossary: [big-o, micro-benchmark]
    visual: { kind: code-trace, concept: "Stepping through a nested-loop duplicate check and a Set-based one on the same eight records, each comparison increments a visible operation counter beside the highlighted line, and the console logs counts and median times for n = 1,000, 10,000 and 100,000." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the comparison count of a nested-loop duplicate check and a Set-based one for n = 10, 100 and 1,000 before running." }
      - { kind: run-change, runtime: browser-js, summary: "Run both with an operation counter and performance.now() over growing synthetic datasets, repeat each size five times and raise n until the two curves clearly separate." }
      - { kind: write, runtime: browser-js, summary: "Write measure(fn, sizes, repeats) that reports the operation count and the median time per size for a transform of your choice." }
    retrieval:
      - { concept: "linear search versus keyed lookup", from: js-05-06-search-complexity }
  - id: js-17-03-bounded-recursion
    title: { uk: "Обмежена рекурсія", en: "Bounded recursion" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict the maximum call depth of a recursive walk for a given input and where a RangeError for an exceeded call stack appears."
      - "Bound a recursion with a depth limit and cycle detection, or convert it to an explicit stack, and explain when each choice fits."
    subskills:
      - { family: J-13, skill: "bounded recursion", depth: intro }
    misconceptions:
      - "If the recursion works on my test data, it works on any data."
      - "A base case alone guarantees that the recursion terminates."
    prerequisites: [js-17-02-big-o-measured, js-03-08-recursion-base-case]
    glossary: [depth-limit, cycle-detection, explicit-stack]
    visual: { kind: code-trace, concept: "The call stack grows one frame per tree level while a depth counter rises; on a 100,000-level synthetic chain the trace stops at the engine's limit, and the explicit-stack version walks the same chain with a flat call stack." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the call depth and outcome of a recursive countNodes on a 10-level tree, a 100,000-level chain and a tree in which a child points back to its parent." }
      - { kind: run-change, runtime: browser-js, summary: "Run the three inputs, add a maxDepth parameter that throws a descriptive error, then rewrite the walk with an explicit stack and rerun all three." }
      - { kind: write, runtime: browser-js, summary: "Write flattenCategories(tree, maxDepth) that detects cycles with a Set of visited ids and stops with a descriptive error past maxDepth." }
    retrieval:
      - { concept: "a Set for remembering what was already seen", from: js-12-11-map-set }
  - id: js-17-04-sorting-search-decisions
    title: { uk: "Рішення щодо сортування та пошуку", en: "Sorting and search decisions" }
    kind: instructional
    minutes: 10
    objectives:
      - "Choose between a linear scan, a Map index, sort-then-binary-search and a kept-sorted array for a given read/write workload, and justify the choice with operation counts."
      - "Implement binary search over a sorted copy and state its precondition."
    subskills:
      - { family: J-13, skill: "sorting/search decisions", depth: intro }
    misconceptions:
      - "Sorting first always makes searching faster."
      - "Binary search works on any array."
    prerequisites: [js-17-03-bounded-recursion, js-05-05-sorting-comparator]
    glossary: [binary-search, precondition]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the comparisons needed to find a record by date with a linear scan, a Map lookup and binary search over a sorted copy, for one lookup and for 10,000 lookups." }
      - { kind: run-change, runtime: browser-js, summary: "Run the three strategies with counters on a 100,000-record synthetic set, then change the ratio of lookups to inserts and see which strategy wins." }
      - { kind: write, runtime: browser-js, summary: "Write binarySearchByDate(sortedRecords, date) with its precondition documented, plus tests for the first, the last and a missing element." }
    retrieval:
      - { concept: "deduplication and indexing with a Map", from: js-12-12-dedup-indexing }
  - id: js-17-05-invariants-boundaries
    title: { uk: "Інваріанти та граничні випадки", en: "Invariants and boundary cases" }
    kind: instructional
    minutes: 12
    objectives:
      - "State the invariant a structure must keep (sorted unique completions, unique ids, totals equal to the sum of their parts) and check it after every operation."
      - "Derive boundary cases (empty, one, duplicates, maximum size) from the invariant and turn them into assertions."
    subskills:
      - { family: J-13, skill: "invariants and boundary cases", depth: intro }
    misconceptions:
      - "If the happy-path test passes, the invariant holds."
      - "An invariant is just a comment describing what the code does."
    prerequisites: [js-17-04-sorting-search-decisions, js-09-03-boundary-cases]
    glossary: [invariant, postcondition]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of five operations on a habit's completions (add a duplicate, add an older date, remove a missing date, add to an empty list, add 1,000 dates) breaks the sorted-unique invariant in a seeded implementation." }
      - { kind: run-change, runtime: browser-js, summary: "Run the operations with assertInvariant after each, then change one operation and see which assertion fails first." }
      - { kind: write, runtime: browser-js, summary: "Write assertInvariant for a category-totals index and boundary tests for empty, single, duplicate-id and maximum-size inputs." }
    retrieval:
      - { concept: "assertions as executable expectations", from: js-09-02-assertions }
  - id: js-17-06-devtools-performance-memory
    title: { uk: "DevTools: продуктивність, мережа та пам’ять", en: "DevTools performance, network and memory" }
    kind: instructional
    minutes: 12
    objectives:
      - "Record a performance profile of a slow interaction and point to the long task and the function that dominates it."
      - "Read the network waterfall of a fixture load and compare two heap snapshots, and say which panel answers which question."
    subskills:
      - { family: W-05, skill: "DevTools performance/network/memory", depth: intro }
    misconceptions:
      - "I can tell which function is slow by reading the code, so profiling is optional."
      - "Memory that grows during a profile is always a leak."
    prerequisites: [js-17-05-invariants-boundaries, js-13-07-memory-leak-diagnosis]
    glossary: [performance-profile, long-task, flame-chart]
    visual: { kind: diagram, concept: "One slow “filter 50,000 records” click shown across three DevTools panels (the performance flame chart with its long task, the network waterfall of the fixture load and two heap snapshots), with a highlight tracing each panel back to the responsible line of code." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which part dominates the profile of a slow filter interaction in a prepared page: rendering, the filter itself or the date formatting inside the loop." }
      - { kind: run-change, runtime: browser-js, summary: "Record a profile of the sandbox page, find the long task, double the dataset size and re-record to see what grows." }
      - { kind: write, runtime: browser-js, summary: "Write an evidence note: the interaction, the dataset size, the top three functions by self time and the heap size before and after." }
    retrieval:
      - { concept: "allocation and retained references", from: js-13-05-allocation-retained-references }
  - id: js-17-07-measured-improvement
    title: { uk: "Покращуємо одне виміряне вузьке місце", en: "Improving one measured bottleneck" }
    kind: instructional
    minutes: 12
    objectives:
      - "Follow the loop measure → hypothesize → change one thing → re-measure → keep or revert for one bottleneck in a prepared page."
      - "Show with tests and a keyboard check that the improvement preserved behavior and accessibility, and report before/after numbers with the dataset size."
    subskills:
      - { family: W-05, skill: "measured improvements", depth: intro }
    misconceptions:
      - "Optimizing everything a little is better than fixing the one measured hot spot."
      - "A faster version is fine even if its results change slightly."
    prerequisites: [js-17-06-devtools-performance-memory, js-17-02-big-o-measured]
    glossary: [bottleneck, performance-baseline]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of three candidate changes (caching formatted dates, replacing find inside a loop with a Map, batching DOM updates into one fragment) cuts the measured time of the prepared slow list the most." }
      - { kind: run-change, runtime: browser-js, summary: "Apply one change at a time, re-record the profile and the timing at the same dataset size, and revert any change that does not help." }
      - { kind: write, runtime: browser-js, summary: "Write the improvement report: baseline, hypothesis, change, after-measurement, tests still passing and a keyboard check that focus survived." }
    retrieval:
      - { concept: "rendering a list from data in one pass", from: js-06-13-render-list-from-data }
  - id: js-17-08-refactor-clean-interfaces
    title: { uk: "Рефакторинг до чистих інтерфейсів", en: "Refactoring toward clean interfaces" }
    kind: instructional
    minutes: 12
    objectives:
      - "Refactor a tangled filter-summarize-render function into small modules with clear inputs and outputs, in small steps, with tests green after each step."
      - "Name the code smell (long function, duplicated condition, hidden global state) behind each step and the refactoring that removes it."
    subskills:
      - { family: P-04, skill: "refactor/clean interfaces", depth: intro }
    misconceptions:
      - "Refactoring means rewriting the code to be better, including fixing its behavior."
      - "A refactor is safe if the code still runs without errors."
    prerequisites: [js-17-07-measured-improvement, js-03-07-pure-vs-side-effects]
    glossary: [refactoring, code-smell, characterization-test]
    visual: { kind: diagram, concept: "A dependency diagram of the tangled module before and after: arrows between UI, storage and global state collapse into three boxes (domain, storage adapter, render) with one-way arrows, and each step lights up only when its test run stays green." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of four proposed refactoring steps on a prepared renderSummary function would change its output for the boundary fixtures." }
      - { kind: run-change, runtime: browser-js, summary: "Pin the current output with a characterization test, extract one pure function, rerun the tests, and repeat in small steps." }
      - { kind: write, runtime: browser-js, summary: "Extract filtering, summarizing and rendering from the tangled function into three modules with typed signatures, keeping every existing test green." }
    retrieval:
      - { concept: "type-only imports between modules", from: js-14-07-modules-type-imports }
  - id: js-17-09-documentation-code-review
    title: { uk: "Документація та рев’ю коду", en: "Documentation and code review" }
    kind: instructional
    minutes: 12
    objectives:
      - "Write a README section and a decision record that explain how to run the project, its module boundaries and one tradeoff with its rejected alternative."
      - "Review a prepared diff against a checklist (behavior, tests, naming, accessibility, security) and write comments that state the problem, the evidence and a suggestion."
    subskills:
      - { family: P-04, skill: "documentation and code review", depth: intro }
    misconceptions:
      - "Code review is about style preferences; if the tests pass there is nothing to review."
      - "Good code documents itself, so READMEs and decision notes are unnecessary."
    prerequisites: [js-17-08-refactor-clean-interfaces, js-15-12-remotes-pr-review]
    glossary: [decision-record, review-checklist]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of six issues in a prepared diff (a missing test, a renamed export, an innerHTML sink, an unlabeled icon button, a magic number, a formatting-only change) should block the merge." }
      - { kind: run-change, runtime: browser-js, summary: "Run the diff's tests and the page, confirm two of the issues with evidence, and edit your review comments to cite that evidence." }
      - { kind: write, runtime: browser-js, summary: "Write a decision record for the index-versus-scan choice and three review comments on the prepared diff." }
    retrieval:
      - { concept: "safe sinks for record text", from: js-16-07-xss-safe-sinks }
  - id: js-17-10-accessible-website-audit
    title: { uk: "Семантика, клавіатура та скринрідер: основи", en: "Semantic, keyboard and screen-reader basics" }
    kind: instructional
    minutes: 12
    objectives:
      - "Audit a page by keyboard only: reach every control in a logical order with visible focus, operate it, and never get trapped."
      - "Check the names, roles and states of controls with a screen reader or the accessibility tree, and confirm that dynamic messages are announced."
      - "Record each finding with the failed expectation, reproduction steps and a fix."
    subskills:
      - { family: W-05, skill: "semantic/keyboard/screen reader basics", depth: intro }
    misconceptions:
      - "If an automated checker reports no issues, the page is accessible."
      - "Adding ARIA roles to divs is the same as using the native element."
    prerequisites: [js-17-09-documentation-code-review, js-06-02-keyboard-focus-landmarks]
    glossary: [screen-reader, live-region, accessibility-audit, keyboard-trap]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict what a screen reader announces for an icon-only delete button, a div with role=button, a required input with an error and a status message updated after save." }
      - { kind: run-change, runtime: browser-js, summary: "Audit a prepared page with Tab, Shift+Tab, Enter, Space and Escape plus the accessibility tree; fix one finding and re-test it the same way." }
      - { kind: write, runtime: browser-js, summary: "Write an audit report of five findings for the prepared page, each with the failed expectation, reproduction steps, severity and fix." }
    retrieval:
      - { concept: "tab order and landmarks", from: js-06-02-keyboard-focus-landmarks }
  - id: js-17-11-debug-quadratic-work
    title: { uk: "Налагодження: випадкова квадратична робота та втрачений інваріант", en: "Debug: accidental quadratic work and a lost invariant" }
    kind: instructional
    minutes: 15
    objectives:
      - "Find, without hints, an accidental quadratic step and an unbounded recursion in a slow, sometimes-crashing transform, using operation counts, a profile and breakpoints."
      - "Repair a lost invariant, add the test at the level that would have caught it, and explain why the existing mocked test kept passing."
    subskills:
      - { family: J-13, skill: "Big-O time/space", depth: assess }
      - { family: J-13, skill: "bounded recursion", depth: assess }
      - { family: J-13, skill: "invariants and boundary cases", depth: assess }
      - { family: P-04, skill: "unit/integration/user/E2E purposes", depth: assess }
      - { family: P-04, skill: "mocks vs actual evidence", depth: assess }
      - { family: P-04, skill: "breakpoints/source maps", depth: assess }
    misconceptions:
      - "A test that passes with a mock proves the real code works."
    prerequisites: [js-17-10-accessible-website-audit, js-09-06-debugger-breakpoints]
    glossary: []
    visual: { kind: code-trace, concept: "The seeded transform replayed with breakpoints: the operation counter jumps by n inside a map callback that calls includes, the call stack deepens on a self-referencing category, and the invariant check fails on the line that inserts an unsorted date." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Before profiling, predict which of the seeded transform's three steps grows fastest when the synthetic dataset doubles." }
      - { kind: run-change, runtime: browser-js, summary: "Run the transform at three sizes with counters and a profile, then set a breakpoint in the hot callback and step through one iteration." }
      - { kind: debug, runtime: browser-js, summary: "No-hint repair: remove the includes-inside-map quadratic step, bound the recursion with cycle detection, restore the sorted-unique invariant, and add an unmocked integration test that fails before the fix." }
    retrieval:
      - { concept: "what a mock can and cannot show", from: js-09-05-mocks-vs-real }
  - id: js-17-12-independent-index-refactor-audit
    title: { uk: "Самостійно: індекс чи черга, рефакторинг, аудит інтерфейсу", en: "Independent: index or queue, refactor, UI audit" }
    kind: assessment
    minutes: 35
    objectives:
      - "Select and implement, without hints, an index or a queue for an unseen synthetic workload, with tests and measured evidence at three data sizes."
      - "Refactor the surrounding module behind a clean interface, document the decision and review a provided diff of it."
      - "Audit the resulting UI by keyboard and screen reader, and improve one measured bottleneck without losing accessibility."
    subskills:
      - { family: J-13, skill: "lists/maps/sets/stacks/queues/tree traversal", depth: assess }
      - { family: J-13, skill: "sorting/search decisions", depth: assess }
      - { family: J-13, skill: "data size measurement", depth: assess }
      - { family: W-05, skill: "semantic/keyboard/screen reader basics", depth: assess }
      - { family: W-05, skill: "DevTools performance/network/memory", depth: assess }
      - { family: W-05, skill: "measured improvements", depth: assess }
      - { family: P-04, skill: "refactor/clean interfaces", depth: assess }
      - { family: P-04, skill: "documentation and code review", depth: assess }
    misconceptions: []
    prerequisites: [js-17-11-debug-quadratic-work]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: for an unseen synthetic parcel-pickup workload (arrivals, lookups by pickup code, pickups in arrival order), choose an index or a queue, prove it with operation counts and timings at 1k/10k/100k, refactor the module behind a typed interface with tests green, and fix the slowest measured interaction while keeping keyboard and screen-reader behavior." }
      - { kind: write, runtime: browser-js, summary: "Write the decision record (choice, rejected alternative, evidence) and review comments on a provided diff of the same module." }
    retrieval:
      - { concept: "keeping focus when the list re-renders", from: js-06-12-focus-management }
  - id: js-17-13-capstone-quality
