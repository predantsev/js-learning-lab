# Syllabus spine for RN-12. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RN-12
stage: RN
title: { uk: "Нова архітектура, interop і підсумковий нативний рубіж", en: "New architecture, interop and the cumulative native gate" }
summary:
  uk: "Учень пояснює нову архітектуру React Native (Fabric, TurboModules, JSI) та interop через codegen на рівні читання й пояснення, оцінює, коли можливість потребує нативного коду й перевірки сумісності, і проходить на заявленій цілі рубіж із незнайомим нативним налагодженням та самостійну перевірку якості з чесним походженням доказів."
  en: "The learner explains React Native's new architecture (Fabric, TurboModules, JSI) and codegen-based interop at read-and-explain depth, judges when a capability needs native code and a compatibility spike, and passes an unseen native debugging gate and an independent quality gate on the declared target with honest evidence provenance."
competencies: [N-09, N-10, N-12]
capstoneStep: null
capstoneStepReason:
  uk: "Підсумковий нативний рубіж: він оцінює збережену нативну компетентність через незнайомий дефект і перевірки release та життєвого циклу; release-артефакт нативного проєкту вже створено в RN-11."
  en: "Cumulative native gate: it assesses retained native competence with an unseen defect and release/lifecycle checks; the capstone's native release artifact was already produced in RN-11."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   rn-01-01-native-vs-web (boundary) ; rn-05-03-schema-migration (migration) ; rn-09-05-deny-revoke-unavailable (permissions) ; rn-11-03-signing-key-hygiene (signing) ; rn-04-03-screen-focus-vs-mount (focus) ; re-03-03-dependencies-cleanup (cleanup) ; js-13-06-cleanup-listeners-timers (handles)
lessons:
  - id: rn-12-01-new-architecture-concepts
    title: { uk: "Нова архітектура: Fabric і TurboModules", en: "New architecture: Fabric and TurboModules" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain, on a version-labeled diagram, how the new architecture replaces the asynchronous serialized bridge with JSI, renders through Fabric and loads TurboModules lazily."
      - "Distinguish old-architecture from new-architecture instructions in a supplied library README by their version labels and terms."
    subskills:
      - { family: N-09, skill: "new architecture/Fabric/TurboModules concepts", depth: intro }
    misconceptions:
      - "React Native draws its UI in a web view, so the architecture is just a faster browser."
      - "Every call from JS to native code is still a JSON message queued on a bridge."
    prerequisites: [rn-01-01-native-vs-web, rn-10-03-ui-js-work-frame-budget]
    glossary: [new-architecture, fabric, turbomodule, jsi, legacy-bridge]
    visual: { kind: diagram, concept: "Two version-labeled pipelines side by side, legacy (serialized messages queued across an asynchronous bridge) and new architecture (JSI calls into C++, the Fabric renderer, lazily loaded TurboModules); stepping one render and one module call through each highlights the hops, and the labels name the versions statically (before 0.82 / React Native 0.86), and the transfer tells the learner where to read the version pinned in their own project." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict, for one button press that reads a native value and updates a view, how many bridge messages the legacy path queues versus how many direct JSI calls the new path makes." }
      - { kind: run-change, runtime: concept-preview, summary: "Switch the labeled diagram between its legacy and new-architecture versions and step the same press through both." }
      - { kind: write, runtime: concept-preview, summary: "Write a three-sentence explanation of Fabric, TurboModules and JSI for a teammate, each tied to one box in the diagram and labeled with the React Native version it applies to." }
    retrieval:
      - { concept: "native views versus web DOM rendering", from: rn-01-01-native-vs-web }
  - id: rn-12-02-native-modules-interop
    title: { uk: "Нативні модулі, codegen і ціна перетину межі", en: "Native modules, codegen and boundary costs" }
    kind: instructional
    minutes: 12
    objectives:
      - "Read a typed TurboModule spec and the codegen output it produces, and trace one call from JS through JSI to platform code."
      - "Compare the boundary cost of per-item calls with one batched call in a supplied interop trace, and choose the cheaper design."
    subskills:
      - { family: N-09, skill: "native module/codegen interop", depth: intro }
      - { family: N-09, skill: "JS/native boundary costs", depth: intro }
    misconceptions:
      - "Native code is always faster, so moving logic into a native module always helps."
      - "Codegen writes the native implementation for me."
    prerequisites: [rn-12-01-new-architecture-concepts, js-14-02-modeling-domain-types]
    glossary: [native-module, codegen, module-spec]
    visual: { kind: sequence, concept: "A supplied (synthetic) interop trace: one representative per-item call crossing JS → JSI → native and back, a note standing for the 1,000 repetitions with the trace's totals, then one bulk call with an array and its totals." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict from the supplied interop trace which variant (1,000 per-item calls or one bulk call) spends more time at the boundary, and roughly by how much." }
      - { kind: run-change, runtime: concept-preview, summary: "Change an argument type in the spec shown by the labeled codegen preview (number to string) and see which generated signatures and call sites break." }
      - { kind: write, runtime: concept-preview, summary: "Write a typed module spec for a synthetic 'battery level' capability and mark which parts codegen generates and which a native developer must still write." }
    retrieval:
      - { concept: "a platform adapter hides platform code behind a shared contract", from: rn-03-02-platform-adapters }
  - id: rn-12-03-platform-deps-compat-legacy
    title: { uk: "Платформні залежності, сумісність і міграція legacy-коду", en: "Platform dependencies, compatibility and legacy migration" }
    kind: instructional
    minutes: 12
    objectives:
      - "Decide, for a supplied capability request, whether an existing library, a platform API through a vetted library or a custom native module is needed, and when a compatibility spike must come first."
      - "Read a legacy-architecture migration note and identify what the interop layer covers and what must still change."
    subskills:
      - { family: N-09, skill: "platform dependencies/compatibility", depth: intro }
      - { family: N-09, skill: "legacy migration reading", depth: intro }
    misconceptions:
      - "If a library installs without errors, it works on both platforms and both architectures."
      - "A legacy native module either works unchanged or must be rewritten from scratch."
    prerequisites: [rn-12-02-native-modules-interop, js-15-04-install-lockfile-semver]
    glossary: [autolinking, compatibility-spike, interop-layer]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict, from their manifests and READMEs, which of three supplied native libraries (new-architecture ready, legacy-only behind the interop layer, iOS-only) will work on your declared target." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled compatibility table, change the declared React Native version and see which libraries' support rows change." }
      - { kind: write, runtime: concept-preview, summary: "Write a compatibility-spike plan for adding one native library: target versions, a minimal test screen, a rollback path and the result that would reject it." }
    retrieval:
      - { concept: "a versioned, tested migration step", from: rn-05-03-schema-migration }
  - id: rn-12-04-cumulative-review
    title: { uk: "Підсумкове нативне повторення", en: "Cumulative native review" }
    kind: review
    minutes: 20
    objectives:
      - "Retrieve, without notes, the native/web boundary, focus versus mount, capability states, schema migration, signing and cleanup rules, and apply each to a short native scenario."
    subskills: []
    misconceptions: []
    prerequisites: [rn-12-03-platform-deps-compat-legacy]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: review, runtime: concept-preview, summary: "Mixed retrieval set across RN-01 to RN-11: focus versus mount, denied and revoked permissions, an old schema on load, key hygiene, cleanup of listeners and timers, and the native/web boundary." }
      - { kind: predict, runtime: concept-preview, summary: "Predict the outcome of five short native scenarios (a screen refocus, a permission revoked while backgrounded, an old schema on load, an update signed with a new key, a leaked subscription) before checking each." }
    retrieval:
      - { concept: "screen focus versus mount", from: rn-04-03-screen-focus-vs-mount }
      - { concept: "denied, revoked and unavailable capability states", from: rn-09-05-deny-revoke-unavailable }
      - { concept: "an update signed with a different key", from: rn-11-03-signing-key-hygiene }
      - { concept: "effect cleanup", from: re-03-03-dependencies-cleanup }
      - { concept: "cleaning up listeners, timers and handles", from: js-13-06-cleanup-listeners-timers }
  - id: rn-12-05-gate-unseen-native-debug
    title: { uk: "Рубіж: незнайоме нативне налагодження", en: "Gate: unseen native debugging" }
    kind: assessment
    minutes: 40
    objectives:
      - "Diagnose and repair, without hints, an unseen native defect on the declared target using build logs, device logs and crash reports."
      - "Prove the fix with restart, offline, lifecycle, accessibility and security checks, and state which platform coverage you could and could not provide."
    subskills:
      - { family: N-10, skill: "native logs/build errors", depth: assess }
      - { family: N-10, skill: "crash diagnosis", depth: assess }
      - { family: N-10, skill: "E2E and platform difference coverage", depth: assess }
      - { family: N-12, skill: "restart/offline/lifecycle/security/a11y/performance", depth: assess }
    misconceptions: []
    prerequisites: [rn-12-04-cumulative-review]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-native, summary: "No-hint gate on the declared target: an unseen synthetic app fails to build after a dependency update and, once built, crashes on resume; diagnose from logs and the crash report, fix it, re-run restart, offline, background and screen-reader checks with learner-confirmed evidence, and submit a platform coverage matrix." }
      - { kind: debug, runtime: local-native, summary: "Repair the second unseen defect exposed once the crash is fixed (a capability revoked while backgrounded leaves the screen stuck) and confirm the fallback path on the target." }
    retrieval:
      - { concept: "find the first decisive line in a native log", from: rn-07-01-native-logs-build-errors }
  - id: rn-12-06-gate-independent-native-quality
    title: { uk: "Рубіж: самостійна нативна якість і пояснення архітектури", en: "Gate: independent native quality and architecture explanation" }
    kind: assessment
    minutes: 45
    objectives:
      - "Deliver, without hints, an independent native enhancement of a synthetic app with unit, typed-domain and component tests, documented mock gaps confirmed by device checks, and signed-build provenance including skip records."
      - "Explain in writing when a requested capability needs native interop and a compatibility spike, and distinguish old- from new-architecture instructions in a supplied library guide."
    subskills:
      - { family: N-09, skill: "new architecture/Fabric/TurboModules concepts", depth: assess }
      - { family: N-09, skill: "native module/codegen interop", depth: assess }
      - { family: N-09, skill: "JS/native boundary costs", depth: assess }
      - { family: N-09, skill: "platform dependencies/compatibility", depth: assess }
      - { family: N-09, skill: "legacy migration reading", depth: assess }
      - { family: N-10, skill: "unit/typed-domain/component/integration tests", depth: assess }
      - { family: N-10, skill: "mocks vs target/device checks", depth: assess }
      - { family: N-12, skill: "independent native enhancement", depth: assess }
      - { family: N-12, skill: "signed/build provenance", depth: assess }
      - { family: N-12, skill: "unsupported target and skip evidence", depth: assess }
    misconceptions: []
    prerequisites: [rn-12-05-gate-unseen-native-debug]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-native, summary: "No-hint gate: add an unseen feature to a synthetic native app on the declared target with tests at the right levels, a mock-gap list with at least one gap confirmed on the device, a signed release build with provenance and skip records, and a written architecture and interop explanation (including a supplied interop trace and an old-versus-new README) graded against a rubric." }
    retrieval:
      - { concept: "evidence records and skip records", from: rn-08-05-record-evidence }
