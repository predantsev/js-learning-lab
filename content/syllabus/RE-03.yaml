# Syllabus spine for RE-03. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RE-03
stage: RE
title: { uk: "Ефекти й синхронізація", en: "Effects and synchronization" }
summary:
  uk: "Учень дотримується правил хуків, використовує ефекти лише для синхронізації із системами поза React, пише правильні залежності й cleanup, виправляє застарілі замикання, читає подвійні запуски Strict Mode як перевірку та прибирає ефекти, які мають бути обробником події або похідним значенням."
  en: "The learner follows the rules of hooks, uses effects only to synchronise with systems outside React, writes correct dependencies and cleanup, repairs stale closures, reads Strict Mode's development rechecks as a test, and removes effects that should be event handlers or derived values."
competencies: [R-04]
capstoneStep:
  mode: local
  objective:
    uk: "Синхронізувати список проєкту з ізольованим сховищем через один ефект із правильними залежностями й cleanup; жодних повторних записів у Strict Mode."
    en: "Synchronise the capstone list with isolated persistence through one effect with correct dependencies and cleanup; no duplicate writes under Strict Mode."
  variants:
    wishlist:
      uk: "Один ефект, залежний від items, після кожної зміни записує { schemaVersion: 1, records } під ключем jsll.wishlist.v1; збережені бажання один раз читає ледачий ініціалізатор із валідацією, а подвійне монтування в Strict Mode не дублює бажань і не губить acquired чи category."
      en: "One effect that depends on items writes { schemaVersion: 1, records } under jsll.wishlist.v1 after every change; a validating lazy initializer reads the stored wishes once, and Strict Mode's double mount neither duplicates a wish nor loses acquired or category."
    planner:
      uk: "Один ефект, залежний від tasks, після кожної зміни записує { schemaVersion: 1, records } під ключем jsll.planner.v1; збережені справи один раз читає ледачий ініціалізатор із валідацією, а подвійне монтування в Strict Mode не дублює справ і не скидає done чи priority."
      en: "One effect that depends on tasks writes { schemaVersion: 1, records } under jsll.planner.v1 after every change; a validating lazy initializer reads the stored tasks once, and Strict Mode's double mount neither duplicates a task nor resets done or priority."
    habits:
      uk: "Один ефект, залежний від habits, після кожної зміни записує { schemaVersion: 1, records } під ключем jsll.habits.v1; збережені звички один раз читає ледачий ініціалізатор із валідацією, а подвійне монтування в Strict Mode не додає в completions повторної дати."
      en: "One effect that depends on habits writes { schemaVersion: 1, records } under jsll.habits.v1 after every change; a validating lazy initializer reads the stored habits once, and Strict Mode's double mount never adds a repeated date to completions."
    expenses:
      uk: "Один ефект, залежний від expenses, після кожної зміни записує { schemaVersion: 1, records } під ключем jsll.expenses.v1; збережені витрати один раз читає ледачий ініціалізатор із валідацією, а подвійне монтування в Strict Mode не дублює витрат і не змінює amountMinor."
      en: "One effect that depends on expenses writes { schemaVersion: 1, records } under jsll.expenses.v1 after every change; a validating lazy initializer reads the stored expenses once, and Strict Mode's double mount neither duplicates an expense nor changes an amountMinor."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-02-02-state-snapshots (snapshot) ; js-13-06-cleanup-listeners-timers (cleanup) ; js-08-09-cancellation-abort (abort) ; js-03-05-closures (closure)
lessons:
  - id: re-03-01-rules-of-hooks
    title: { uk: "Правила хуків", en: "Rules of hooks" }
    kind: instructional
    minutes: 10
    objectives:
      - "State the two rules of hooks (call them at the top level only; call them only from components or custom hooks) and spot violations in code."
      - "Explain how React matches hook calls to their stored state by call order on every render."
    subskills:
      - { family: R-04, skill: "rules of hooks", depth: intro }
    misconceptions:
      - "React finds each hook by its variable name, so calling one inside an if is fine as long as the name is unique."
      - "The rules of hooks are a lint style preference, not a correctness requirement."
    prerequisites: [re-02-01-state-and-events, re-02-07-reset-preserve-identity]
    glossary: [react-hook, rules-of-hooks]
    visual: { kind: diagram, concept: "A component's hooks drawn as numbered slots: each render fills slots 1, 2, 3 in call order, and a hook inside an if shows a skipped call shifting the later hooks into the wrong slots." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what the second useState returns on the next render when the first one sits inside if (records.length > 0) and the list becomes empty." }
      - { kind: run-change, runtime: browser-react, summary: "Run the conditional-hook component, read React's hook-order error, then move the hook to the top level and the condition into the JSX." }
      - { kind: write, runtime: browser-react, summary: "Rewrite a component that calls useState inside a loop and after an early return so that every hook runs unconditionally at the top." }
    retrieval:
      - { concept: "reading a value by its position in an array", from: js-04-01-arrays-basics }
  - id: re-03-02-effects-synchronize-external
    title: { uk: "Ефекти синхронізують зі світом поза React", en: "Effects synchronise with the outside" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain an effect as code that keeps an external system (storage, the document title, a timer, a subscription) in sync with the current render."
      - "Predict when an effect runs relative to render and commit, on the first render and on a re-render."
    subskills:
      - { family: R-04, skill: "synchronization vs events/derived values", depth: intro }
    misconceptions:
      - "useEffect is React's lifecycle method for “when the component appears”, so it runs once."
      - "An effect runs during render, before the screen updates."
    prerequisites: [re-03-01-rules-of-hooks, re-01-07-purity-in-render]
    glossary: [use-effect, external-system]
    visual: { kind: render-timeline, concept: "Render → commit → effect for three renders: an effect that sets document.title from the pending-record count runs after each commit, never during render, and the timeline marks which external value it brought in sync." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict the order of the “render”, “commit visible” and “effect” logs on the first render and on a re-render after adding a record." }
      - { kind: run-change, runtime: browser-react, summary: "Run a document-title effect with logs, add and remove records, then move the title assignment into render and compare what breaks." }
      - { kind: write, runtime: browser-react, summary: "Write an effect that keeps the document title in sync with the number of records that match the current filter." }
    retrieval:
      - { concept: "side effects belong outside pure computations", from: js-03-07-pure-vs-side-effects }
    # design note: misconception "useEffect is a lifecycle method"
  - id: re-03-03-dependencies-cleanup
    title: { uk: "Залежності та cleanup", en: "Dependencies and cleanup" }
    kind: instructional
    minutes: 15
    objectives:
      - "Predict when an effect re-runs from its dependency array (none, empty, [selectedId]) and list every reactive value it reads."
      - "Write a cleanup that undoes the effect's setup, and predict that it runs before each re-run and on unmount."
      - "Repair a subscription that leaks because its effect has no cleanup."
    subskills:
      - { family: R-04, skill: "dependencies/cleanup", depth: intro }
    misconceptions:
      - "Cleanup runs only when the component unmounts."
      - "An empty dependency array is a safe way to run an effect once, whatever it reads."
    prerequisites: [re-03-02-effects-synchronize-external, js-13-06-cleanup-listeners-timers]
    glossary: [dependency-array, effect-cleanup]
    visual: { kind: render-timeline, concept: "Three renders while the selected id changes from w-01 to w-02: each step shows the effect subscribing for the current id, the cleanup for the previous id running before the next setup, and a final cleanup at unmount, with the count of live subscriptions beside the timeline." }
    difficultConcept: effect-cleanup
    analogy: "An effect is a newsletter subscription for the address you live at now, and its cleanup is the cancellation you send before moving, so mail never arrives at two addresses at once (limit: a component “moves” far more often than a person — cleanup runs before every re-run whose dependencies changed and once more on mount in development Strict Mode, not only when the component unmounts)."
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict the log sequence “subscribe w-01”, “unsubscribe w-01”, “subscribe w-02” when the selected id changes and the component then unmounts." }
      - { kind: run-change, runtime: browser-react, summary: "Run a fake record-feed subscription effect, remove its cleanup, switch ids a few times and count the live subscriptions; then restore the cleanup and count again." }
      - { kind: write, runtime: browser-react, summary: "Write an interval effect that refreshes a “last saved” label for the selected record, with complete dependencies and a cleanup that clears the interval." }
    retrieval:
      - { concept: "removing the listeners and timers you created", from: js-13-06-cleanup-listeners-timers }
    # design note: analogy: subscribing to a newsletter and unsubscribing before moving (limit: cleanup also runs before every re-run, not only at unmount)
  - id: re-03-04-stale-closures-in-effects
    title: { uk: "Застарілі замикання в ефектах", en: "Stale closures in effects" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain why an interval effect with [] dependencies keeps reading the first render's count."
      - "Repair a stale effect with the right tool: the missing dependency, an updater function, or an Effect Event (useEffectEvent) for logic that must read the latest value without re-running the effect."
    subskills:
      - { family: R-04, skill: "stale closure", depth: intro }
    misconceptions:
      - "An effect always sees the latest state because it runs after render."
      - "Silencing the dependency lint warning is safe when the code seems to work."
    prerequisites: [re-03-03-dependencies-cleanup, re-02-02-state-snapshots]
    glossary: [effect-event, exhaustive-deps]
    visual: { kind: render-timeline, concept: "Renders 1–4 with count advancing on screen while the interval callback created in render 1 keeps pointing at render 1's snapshot (count = 0); after the fix each tick reads the queued value and the timeline shows whether the interval restarted." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what an interval effect with [] dependencies that calls setCount(count + 1) shows after four ticks." }
      - { kind: run-change, runtime: browser-react, summary: "Run it with the timeline, read the exhaustive-deps lint warning, fix it once with an updater function and once with the dependency, and compare how often the interval restarts." }
      - { kind: write, runtime: browser-react, summary: "Write an autosave-notice effect whose timer reads the latest draft title through an Effect Event without restarting on every keystroke." }
    retrieval:
      - { concept: "each render's functions see that render's state", from: re-02-02-state-snapshots }
      - { concept: "a closure keeps the binding it was created with", from: js-03-05-closures }
  - id: re-03-05-strict-mode-rechecks
    title: { uk: "Перевірки під час розробки (Strict Mode)", en: "Development rechecks (Strict Mode)" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict the extra render and the extra setup → cleanup → setup cycle that Strict Mode adds in development only."
      - "Use the double run to find an effect whose cleanup does not fully undo its setup, and explain why the fix is the cleanup, not removing StrictMode."
    subskills:
      - { family: R-04, skill: "development rechecks", depth: intro }
    misconceptions:
      - "Strict Mode running effects twice is a React bug, so the fix is to remove StrictMode or guard the effect with a ran-once flag."
      - "The double invocation also happens in the production build."
    prerequisites: [re-03-04-stale-closures-in-effects]
    glossary: [react-strict-mode, development-recheck]
    visual: { kind: render-timeline, concept: "A mount under StrictMode in development: render, render again, commit, effect setup, cleanup, setup again; a non-idempotent “append fixture” effect shows the record list growing by two while an idempotent write leaves it unchanged." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict how many “connect” and “disconnect” logs and how many appended fixture records appear on mount under StrictMode." }
      - { kind: run-change, runtime: browser-react, summary: "Run with and without StrictMode, then make the effect idempotent by replacing the append with a write of the current records." }
      - { kind: write, runtime: browser-react, summary: "Write a connection effect for a fake sync channel whose cleanup disconnects, and show that the StrictMode double run leaves exactly one live connection." }
    retrieval:
      - { concept: "saving the whole record list as JSON on each change", from: js-07-05-persist-reload }
  - id: re-03-06-not-an-effect
    title: { uk: "Можливо, ефект не потрібен", en: "You might not need an effect" }
    kind: instructional
    minutes: 10
    objectives:
      - "Classify a piece of logic as render computation, event-handler work or synchronization, and move it there."
      - "Replace an effect that copies props into state and an effect chain that reacts to a submitted flag with a derived value and an event handler."
    subskills:
      - { family: R-04, skill: "synchronization vs events/derived values", depth: practice }
    misconceptions:
      - "Whenever something must happen after a value changes, an effect is the right tool."
      - "Saving in an effect that watches a submitted flag is cleaner than saving in the submit handler."
    prerequisites: [re-03-05-strict-mode-rechecks, re-02-05-derived-values-not-state]
    glossary: [effect-chain]
    visual: { kind: diagram, concept: "A decision diagram applied to four snippets: “computed from props or state” routes to render, “caused by a specific user action” routes to the event handler, “keeps an outside system in sync” routes to an effect; each snippet's arrow lights up as it is classified." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict how many renders happen when a filtered list is stored by an effect that watches records and filter, versus computed during render." }
      - { kind: run-change, runtime: browser-react, summary: "Run the effect-based version with render counts, then delete the effect and the extra state and derive the list." }
      - { kind: write, runtime: browser-react, summary: "Move a “show saved notice” effect that watches a submitted flag into the submit handler and delete the flag state." }
    retrieval:
      - { concept: "derive a value instead of storing a copy", from: re-02-05-derived-values-not-state }
  - id: re-03-07-debug-stale-duplicate-effects
    title: { uk: "Налагодження: застарілі дані й продубльовані ефекти", en: "Debug: stale data and duplicated effects" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose a detail view that shows the previous record's data as a missing dependency or an uncancelled request, and repair it."
      - "Repair effects that leak or duplicate work under Strict Mode by making each cleanup undo exactly what its setup did."
    subskills:
      - { family: R-04, skill: "dependencies/cleanup", depth: assess }
      - { family: R-04, skill: "stale closure", depth: assess }
      - { family: R-04, skill: "development rechecks", depth: assess }
    misconceptions:
      - "A bug that only shows up in development is not a real bug."
    prerequisites: [re-03-06-not-an-effect]
    glossary: []
    visual: { kind: render-timeline, concept: "The seeded session replayed: switching from w-01 to w-02 shows the slower w-01 fixture response arriving last and overwriting the view, and the StrictMode remount shows two subscriptions left alive where one was expected." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Before running, predict which record the detail panel shows after a quick w-01 → w-02 switch when w-01's delayed fixture answers last, and how many listeners remain after mount." }
      - { kind: run-change, runtime: browser-react, summary: "Run the seeded detail view against the delayed fixture with the timeline on, and match each wrong screen to the effect run that caused it." }
      - { kind: debug, runtime: browser-react, summary: "Repair the missing dependency, add an AbortController cleanup so the stale response is ignored, and fix the subscription cleanup so it removes exactly what setup added." }
    retrieval:
      - { concept: "cancelling a request that is no longer needed", from: js-08-09-cancellation-abort }
      - { concept: "out-of-order responses and latest-wins", from: js-08-10-stale-responses-retry }
  - id: re-03-08-independent-persistence-sync
    title: { uk: "Самостійно: синхронізація зі сховищем без дублів", en: "Independent: persistence sync without duplicates" }
    kind: assessment
    minutes: 30
    objectives:
      - "Implement, without hints, persistence of a typed record list to isolated storage through one effect with a validating initial read and complete dependencies, with no duplicate writes under StrictMode and no effect where an event handler or a derived value fits."
    subskills:
      - { family: R-04, skill: "synchronization vs events/derived values", depth: assess }
    misconceptions: []
    prerequisites: [re-03-07-debug-stale-duplicate-effects]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-react, summary: "No-hint task: persist a typed record list under a versioned storage key; hidden checks run under StrictMode, reload with corrupted stored JSON, make rapid edits and flag any effect that only copies or derives state." }
    retrieval:
      - { concept: "recovering from invalid stored data", from: js-07-10-independent-modules-recovery }
    # design note: no-hint
  - id: re-03-09-capstone-persist-effect
    title: { uk: "Проєкт: ефект збереження", en: "Capstone: persistence effect" }
    kind: capstone-step
    minutes: 25
    objectives:
      - "In the local capstone project, move persistence into one effect keyed on the record list with a validating initial read, and confirm locally that StrictMode produces no duplicate or lost records."
    subskills:
      - { family: R-04, skill: "dependencies/cleanup", depth: practice }
    misconceptions: []
    prerequisites: [re-03-08-independent-persistence-sync, re-02-10-capstone-state]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "In the local project, read the stored records once through a validating lazy state initializer and add one effect that writes { schemaVersion, records } under the project's storage key whenever the list changes." }
      - { kind: run-change, runtime: local-web, summary: "Run the local dev build under StrictMode, create, edit and delete records, reload, inspect the stored value in DevTools and commit once you have confirmed there are no duplicates and no lost fields." }
    retrieval:
      - { concept: "the capstone's JSON persistence and recovery", from: js-07-11-capstone-modules-persistence }
