# Syllabus spine for NO-08. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: NO-08
stage: NO
title: { uk: "Контрольна точка CP-NO: наскрізна інтеграція", en: "Checkpoint CP-NO: end-to-end integration" }
summary:
  uk: "Учень без підказок завершує наскрізну інтеграцію проєкту, доводить справжні запити, збереження даних після перезапуску сервера й правильну поведінку клієнта власноруч підтвердженими доказами, виправляє незнайомий дефект інтеграції та своїми словами пояснює компроміси в дизайні."
  en: "The learner completes the capstone's end-to-end integration without hints, proves real requests, persistence across a server restart and correct client behavior with learner-confirmed evidence, repairs an unseen integration defect, and explains the design trade-offs in their own words."
competencies: [B-13]
capstoneStep:
  mode: local
  objective:
    uk: "CP-NO: без підказок завершити наскрізну інтеграцію, довести справжні запити, збереження даних після перезапуску й поведінку клієнта та пояснити компроміси."
    en: "CP-NO: complete the end-to-end integration without hints, prove real requests, persistence across restart and client behavior, and explain the tradeoffs."
  variants:
    wishlist:
      uk: "Без підказок: додати бажання з веб-клієнта, перемкнути acquired, перезапустити сервер і справжнім GET /items та логом сервера довести, що бажання, його acquired і сума цін (price) бажаних речей збереглися; пояснити, чому acquired вирішує сервер, а не кеш клієнта."
      en: "Without hints: add an item from the web client, toggle acquired, restart the server and prove with a real GET /items and the server log that the item, its acquired flag and the wanted-items price total survived; explain why the server, not the client cache, decides acquired."
    planner:
      uk: "Без підказок: створити справу з dueDate і priority, позначити іншу done, перезапустити сервер і справжніми запитами довести, що кількість невиконаних справ із терміном до фіксованого дня не змінилася; пояснити, чому today передається параметром, а не береться з годинника."
      en: "Without hints: create a task with a dueDate and priority, mark another done, restart the server and prove with real requests that the count of pending tasks due by a fixed day is unchanged; explain why today is passed in rather than read from the clock."
    habits:
      uk: "Без підказок: записати сьогоднішнє виконання щоденної звички, призупинити іншу (active: false), перезапустити сервер і справжніми запитами довести, що completions і серія на фіксований день збереглися; пояснити припущення щодо дат у підрахунку серії."
      en: "Without hints: record today's completion for a daily habit, pause another (active: false), restart the server and prove with real requests that the completions and the streak for a fixed day survived; explain the streak's date assumptions."
    expenses:
      uk: "Без підказок: додати витрату в наявну category, перезапустити сервер і справжніми запитами довести, що суми за категоріями й загальна сума в amountMinor точні; пояснити, чому суми лишаються цілими числами на всьому шляху."
      en: "Without hints: add an expense in an existing category, restart the server and prove with real requests that the per-category and overall totals in amountMinor are exact; explain why amounts stay integers end to end."
# Retrieval plan: re-08-03-capstone-cp-re-enhancement (CP-RE) ; rn-08-03-capstone-cp-rn-enhancement (CP-RN) ; no-05-08-independent-restart-no-loss (restart) ; js-09-08-independent-delayed-retrieval (CRUD) ; re-03-03-dependencies-cleanup (cleanup)
lessons:
  - id: no-08-01-checkpoint-review
    title: { uk: "Огляд перед контрольною точкою: накопичене повторення", en: "Checkpoint review: cumulative retrieval" }
    kind: review
    minutes: 20
    objectives:
      - "Retrieve without notes the capstone decisions from every stage (CRUD functions, state snapshots, the CP-RE enhancement, persistence, the API contract) and predict where each appears in the end-to-end flow."
      - "List which CP-NO evidence will come from real requests, which from restart checks, and which native checks stay unperformed when the target is unavailable."
    subskills:
      - { family: B-13, skill: "design/build/debug/test/secure/deliver/maintain", depth: intro }
      - { family: B-13, skill: "requirements/tradeoffs", depth: intro }
      - { family: B-13, skill: "no-hint defect", depth: intro }
      - { family: B-13, skill: "retained domain/workspaces", depth: intro }
    misconceptions: []
    prerequisites: [no-13-08-capstone-ssr-list, no-06-09-capstone-integrate-clients]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: review, runtime: isolated-node, summary: "Spaced retrieval set: short questions on the CRUD functions, the CP-RE enhancement, the repository's restart guarantees and the integrated data flow, each answer checked by running its snippet against the loopback lab server." }
      - { kind: predict, runtime: isolated-node, summary: "Predict the server log lines and the client state for one create → restart → reload sequence before running it." }
    retrieval:
      - { concept: "the CP-RE independent enhancement", from: re-08-03-capstone-cp-re-enhancement }
      - { concept: "CRUD, filter and persistence verified by tests", from: js-09-08-independent-delayed-retrieval }
  - id: no-08-02-integration-plan-tradeoffs
    title: { uk: "План інтеграції та компроміси", en: "Integration plan and tradeoffs" }
    kind: instructional
    minutes: 12
    objectives:
      - "Draft a one-page integration plan that maps each CP-NO requirement to a component, a check and its evidence."
      - "Compare two options for one decision by their failure modes and record the choice with its consequences."
      - "Write a PR description and a runbook note that a reviewer can verify step by step."
    subskills:
      - { family: B-13, skill: "requirements/tradeoffs", depth: practice }
      - { family: B-13, skill: "PR/review/docs/runbook", depth: intro }
    misconceptions:
      - "A plan is just a list of features; trade-offs only matter in big systems."
      - "If the code works, the PR description and the runbook are optional extras."
    prerequisites: [no-08-01-checkpoint-review]
    glossary: [failure-mode]
    visual: { kind: diagram, concept: "CP-NO requirements on the left (real requests, restart persistence, client behavior, recovery), components in the middle (client adapter, API, repository, storage) and checks on the right; the step-through traces one requirement to its check and opens a decision box comparing two storage designs by failure mode." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict which design loses an acknowledged write when the server is killed mid-save: a write-through file repository with atomic rename, or an in-memory cache flushed every 10 seconds." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the supplied kill-during-save harness against both designs on the loopback lab server, then change the flush interval and rerun." }
      - { kind: write, runtime: isolated-node, summary: "Write the integration plan with one decision record (context, options, choice, consequences) and a PR description draft that lists how a reviewer verifies it." }
    retrieval:
      - { concept: "REST resources and their boundaries", from: no-04-01-rest-boundaries }
  - id: no-08-03-capstone-cp-no-integration
    title: { uk: "Контрольна точка CP-NO: наскрізна інтеграція", en: "Capstone checkpoint CP-NO: end-to-end integration" }
    kind: capstone-step
    minutes: 90
    objectives:
      - "Complete the capstone's end-to-end integration without hints: web client, local API, durable storage, hardening and a production-mode start."
      - "Prove real requests, persistence across a server restart and client behavior with learner-confirmed evidence, recording any skipped native check as unperformed."
    subskills:
      - { family: B-13, skill: "design/build/debug/test/secure/deliver/maintain", depth: assess }
      - { family: B-13, skill: "retained domain/workspaces", depth: assess }
    misconceptions: []
    prerequisites: [no-08-02-integration-plan-tradeoffs]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-node, summary: "In your exported workspace, close the remaining gaps from your plan (client adapter, API, repository, validation, health) so the full create/update/remove/filter/summary flow runs against the local server." }
      - { kind: independent, runtime: local-node, summary: "No-hint checkpoint on your machine: run the CP-NO checks (create, update, restart, reload, invalid input, offline client) and submit the request log, the before/after-restart summary and client evidence; native checks run on the declared target or are recorded as unperformed." }
    retrieval:
      - { concept: "restart without data loss", from: no-05-08-independent-restart-no-loss }
      - { concept: "the CP-RN enhancement and its recorded skips", from: rn-08-03-capstone-cp-rn-enhancement }
    # design note: no hints
  - id: no-08-04-debug-no-hint-defect
    title: { uk: "Налагодження: дефект інтеграції без підказок", en: "Debug: no-hint integration defect" }
    kind: assessment
    minutes: 30
    objectives:
      - "Reproduce, locate and repair an unseen defect that spans client, API and storage without hints, and add the test that would have caught it."
    subskills:
      - { family: B-13, skill: "no-hint defect", depth: assess }
    misconceptions: []
    prerequisites: [no-08-03-capstone-cp-no-integration]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-node, summary: "No-hint task on your machine: a seeded copy of your capstone loses an update after restart only when two edits arrive quickly; reproduce it with real requests, find the layer at fault and submit the fix, a regression test and a three-sentence root cause." }
      - { kind: debug, runtime: local-node, summary: "Repair a second seeded defect met while reproducing: a web-client effect that keeps polling the API after unmount, proven fixed by the request count in the server log." }
    retrieval:
      - { concept: "effect dependencies and cleanup", from: re-03-03-dependencies-cleanup }
  - id: no-08-05-troubleshoot-explain
    title: { uk: "Діагностика й пояснення компромісів", en: "Troubleshoot and explain tradeoffs" }
    kind: local-task
    minutes: 25
    objectives:
      - "Troubleshoot two reported symptoms on your running capstone from logs, metrics and the runbook, recording every step."
      - "Explain in your own words three trade-offs in your integration (storage choice, cache policy, error and retry policy) and when you would choose differently."
    subskills:
      - { family: B-13, skill: "requirements/tradeoffs", depth: assess }
    misconceptions: []
    prerequisites: [no-08-04-debug-no-hint-defect]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-node, summary: "On your machine, work through two support tickets against your running capstone (a slow list and a rejected save) using logs by request id, /metrics and your runbook, and record each step." }
      - { kind: independent, runtime: local-node, summary: "Write a short explanation of three trade-offs in your design, the evidence behind each and one condition under which you would choose differently." }
    retrieval:
      - { concept: "runbook-driven diagnosis and rollback", from: no-12-08-runbook-monitoring-rollback }
