# Syllabus spine for RN-01. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RN-01
stage: RN
title: { uk: "Нативне проти вебу та перший запуск на пристрої", en: "Native vs web and a first native run" }
summary:
  uk: "Учень пояснює, чому React Native малює платформні view, а не DOM-вузли, налаштовує задокументований toolchain для заявленого емулятора, симулятора чи пристрою, відрізняє debug-збірку від release, перевикористовує типізований спільний доменний пакет і запускає hello-екран із власноруч підтвердженим результатом на заявленій цілі."
  en: "The learner explains why React Native draws platform views instead of DOM nodes, sets up the documented toolchain for a declared emulator, simulator or device, tells a debug build from a release build, reuses the typed shared domain package and runs a hello screen with learner-confirmed evidence on the declared target."
competencies: [N-01]
capstoneStep:
  mode: local
  objective:
    uk: "Створити нативний підпроєкт native/ всередині експортованого робочого простору, перевикористати спільний доменний пакет і запустити hello-екран з одним справжнім записом проєкту на заявленій цілі."
    en: "Create the native subproject inside the exported workspace (native/), reuse the shared domain package and run a hello screen showing one real capstone record on the declared target."
  variants:
    wishlist:
      uk: "Hello-екран показує фікстуру w-01 через спільний форматер: назву, ціну або підпис «без ціни» і позначку, чи бажання вже отримане."
      en: "A hello screen shows fixture w-01 through the shared formatter: its name, its price or the no-price label, and whether it is acquired."
    planner:
      uk: "Hello-екран показує фікстуру t-01 через спільний форматер: назву, термін або підпис «без терміну», пріоритет і позначку виконання."
      en: "A hello screen shows fixture t-01 through the shared formatter: its title, its due date or the no-due-date label, its priority and whether it is done."
    habits:
      uk: "Hello-екран показує фікстуру h-01 через спільний форматер: назву, частоту, позначку активності й кількість виконань, обчислену з completions."
      en: "A hello screen shows fixture h-01 through the shared formatter: its name, frequency, active state and the completion count derived from completions."
    expenses:
      uk: "Hello-екран показує фікстуру e-01 через спільний форматер: назву, суму з amountMinor, відформатовану в гривнях, дату й категорію."
      en: "A hello screen shows fixture e-01 through the shared formatter: its label, amountMinor formatted as UAH, its date and its category."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-01-06-render-vs-commit (render) ; js-14-07-modules-type-imports (shared types) ; js-15-06-build-env-sourcemaps (build/env) ; re-09-04-reuse-boundaries (reuse boundary)
lessons:
  - id: rn-01-01-native-vs-web
    title: { uk: "Нативний рендеринг проти вебу", en: "Native vs web rendering" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain why a React Native component tree is committed to platform views rather than DOM nodes, and name what stays the same (components, props, state, domain code)."
      - "Classify lines of a screen as shared domain logic, React logic or platform-bound UI, and state which of them a browser concept preview can and cannot verify."
    subskills:
      - { family: N-01, skill: "native vs DOM", depth: intro }
    misconceptions:
      - "React Native wraps my web page in an app, so a <div> and my CSS work the same on a phone."
      - "If the concept preview in the browser looks right, the screen will look and behave the same on a device."
    prerequisites: [re-01-06-render-vs-commit, re-09-04-reuse-boundaries]
    glossary: [native-renderer, native-view, react-native-web]
    visual: { kind: diagram, concept: "One component tree with two commit targets: stepping through a render shows the same View/Text elements committed as DOM nodes by react-native-web in the preview and as platform views (an Android View, an iOS UIView) on a device, while the shared domain formatter feeds both unchanged." }
    difficultConcept: native-web-boundary
    analogy: "One script performed on stage and filmed for the screen: the lines are shared, but the staging, lighting and what the audience can do are rebuilt for each medium (limit: only the script transfers — the domain and component logic; the staging, i.e. layout, gestures and native behavior, is rebuilt per platform, so watching the stage rehearsal, the browser preview, proves nothing about the filmed version on a device)."
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Before opening the labeled concept preview, predict which of four snippets React Native rejects — a <div>, text outside <Text>, onClick on a View, a CSS class name — and what replaces each." }
      - { kind: run-change, runtime: concept-preview, summary: "In the preview marked 'concept preview — not native verification', change a View/Text card's props and style, inspect the DOM react-native-web produces, then list two things this preview cannot show (native view classes, device fonts, real touch handling)." }
      - { kind: write, runtime: concept-preview, summary: "Rewrite a three-element React DOM card (div, h2, button) with View, Text and Pressable, keeping the shared formatLabel call untouched." }
    retrieval:
      - { concept: "what commit writes to and who decides the target", from: re-01-06-render-vs-commit }
  - id: rn-01-02-toolchain-setup
    title: { uk: "Налаштовуємо toolchain, емулятор і пристрій", en: "Toolchain, emulator and device setup" }
    kind: local-task
    minutes: 45
    objectives:
      - "Install the course's documented native toolchain and declare one target (Android emulator, iOS simulator or physical device) with its OS version."
      - "Record every target your machine cannot support (for example an iOS simulator on a non-macOS computer) as unsupported, without blocking later lessons."
    subskills:
      - { family: N-01, skill: "toolchain/emulator/device", depth: intro }
    misconceptions: []
    prerequisites: [rn-01-01-native-vs-web, js-15-03-node-and-package-manifest]
    glossary: [emulator, simulator, physical-device, declared-target]
    visual: { kind: diagram, concept: "The toolchain path from the workspace to a target: editor → package manager → bundler dev server → platform build tools (Android SDK or Xcode) → emulator, simulator or device, with each box marked present, missing or unsupported on the learner's machine." }
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Follow the documented setup checklist, run the toolchain's environment check, boot an emulator or simulator or connect a device, and record the declared target, its OS version and any unsupported targets — or mark the task unperformed if native tooling is unavailable." }
    retrieval:
      - { concept: "which commands are safe to paste and run", from: js-15-02-safe-commands }
  - id: rn-01-03-env-versions-debug-release
    title: { uk: "Середовище, версії, debug проти release", en: "Environment, versions, debug vs release" }
    kind: instructional
    minutes: 10
    objectives:
      - "Predict which behaviors differ between a debug build (dev server, warning overlay, fast reload) and a release build (bundled JavaScript, no dev server, no dev warnings)."
      - "Read a version-labeled support table and decide whether a declared target's OS and toolchain versions are supported."
      - "Explain why config values reach the app at build time rather than being read from an env file on the device."
    subskills:
      - { family: N-01, skill: "environment/version support and debug vs release", depth: intro }
    misconceptions:
      - "A debug build that works on my emulator proves the release build works too."
      - "The app reads my .env file on the phone at runtime, like a Node script does."
    prerequisites: [rn-01-02-toolchain-setup, js-15-06-build-env-sourcemaps]
    glossary: [debug-build, release-build, version-support-matrix]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "For five behaviors — the warning overlay, console logs, fast reload, reading a config value, loading JavaScript from the dev server — predict whether each appears in a debug build, a release build or both." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, toggle a simulated __DEV__ flag and watch which guarded log and warning lines run; note that real release behavior is checked later on your declared target." }
      - { kind: debug, runtime: concept-preview, summary: "Repair a seeded config module that reads process.env on the device at runtime (yielding undefined) and an unguarded debug log in shared code, using the build-time config pattern the course documents." }
    retrieval:
      - { concept: "build-time env inlining versus reading env at run time", from: js-15-06-build-env-sourcemaps }
      - { concept: "which prefixed env values a production bundle inlines", from: re-12-01-production-build-env }
  - id: rn-01-04-shared-domain-code
    title: { uk: "Спільний доменний код для різних платформ", en: "Shared domain code across platforms" }
    kind: instructional
    minutes: 12
    objectives:
      - "Identify which modules of the exported workspace (domain/ versus web/) native/ can import unchanged, and why: no DOM, no browser storage, no platform globals."
      - "Run a pure domain transform in-course and confirm it yields the same output it gave in the web client."
      - "Move a browser-only call out of a domain helper behind a parameter so the helper stays platform-neutral."
    subskills:
      - { family: N-01, skill: "TS/domain reuse", depth: intro }
    misconceptions:
      - "To reuse code in the native app I must copy the web components and swap the tags."
      - "Anything written in TypeScript is automatically safe to share between web and native."
    prerequisites: [rn-01-03-env-versions-debug-release, re-09-04-reuse-boundaries]
    glossary: [shared-domain-package, platform-neutral-module]
    visual: { kind: diagram, concept: "The workspace dependency graph: domain/ (pure functions, types, fixtures) imported by both web/ and native/; stepping adds a localStorage or document import to a domain helper and highlights the arrow that now breaks the native import." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of four domain-module exports native/ can import unchanged: summarize, validateRecord, a helper that calls localStorage and a helper that sets document.title." }
      - { kind: run-change, runtime: browser-js, summary: "Run the shared summarize and validate functions over the capstone fixtures in-course, change one fixture and confirm the output matches what the web client produced." }
      - { kind: write, runtime: browser-js, summary: "Move a localStorage call out of a seeded domain helper into a parameter so the helper becomes platform-neutral and its existing tests still pass." }
    retrieval:
      - { concept: "domain versus platform view boundary", from: re-09-04-reuse-boundaries }
      - { concept: "pure functions without side effects", from: js-03-07-pure-vs-side-effects }
  - id: rn-01-05-hello-screen
    title: { uk: "Hello-екран на вашій заявленій цілі", en: "Hello screen on your declared target" }
    kind: local-task
    minutes: 30
    objectives:
      - "Create, build and launch a hello screen on the declared target and record learner-confirmed evidence: target, OS version, build mode and a screenshot or log line."
      - "Change the screen text, confirm the update arrives through the dev server, and name which kinds of edits need a native rebuild instead."
    subskills:
      - { family: N-01, skill: "toolchain/emulator/device", depth: assess }
      - { family: N-01, skill: "environment/version support and debug vs release", depth: practice }
    misconceptions: []
    prerequisites: [rn-01-04-shared-domain-code, rn-01-02-toolchain-setup]
    glossary: [native-rebuild]
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Generate the starter app with the documented command, launch it in debug mode on your declared target and record the target, OS version and a screenshot or log line as evidence — or mark it unperformed." }
      - { kind: independent, runtime: local-native, summary: "Without hints, make the hello screen show a localized greeting and the platform name from Platform.OS, confirm the change on your declared target, and list which edits (JavaScript, assets, native config) would require a native rebuild." }
    retrieval:
      - { concept: "export, install and run a project locally", from: js-10-02-export-open-install-run }
  - id: rn-01-06-debug-setup-failure
    title: { uk: "Налагодження: навмисно зламане середовище", en: "Debug: a seeded environment failure" }
    kind: local-task
    minutes: 20
    objectives:
      - "Diagnose a seeded environment failure — an unsupported version pin and an unreachable dev server — from the actual error output rather than by guessing."
      - "Repair it, re-run the hello screen on the declared target and record what changed."
    subskills:
      - { family: N-01, skill: "environment/version support and debug vs release", depth: assess }
    misconceptions: []
    prerequisites: [rn-01-05-hello-screen]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Apply the supplied seeded change to the hello project, run it on your declared target and capture the exact error output of the build and of the app." }
      - { kind: debug, runtime: local-native, summary: "Use the error output and the version-support table to fix the unsupported version pin and the wrong dev-server port, clear the stale build cache the documented way and confirm the hello screen runs again." }
    retrieval:
      - { concept: "repairing a broken script, lockfile and config", from: js-15-13-debug-broken-setup }
  - id: rn-01-07-independent-explain-boundary
    title: { uk: "Самостійно: перевірка типів спільної моделі та пояснення межі", en: "Independent: typecheck the shared model and explain the boundary" }
    kind: assessment
    minutes: 20
    objectives:
      - "Typecheck the shared domain model with strict tsc from native/ and remove any import that drags in a DOM type."
      - "Explain in your own words why a browser layout preview cannot verify native APIs, with two concrete examples from your own hello screen."
    subskills:
      - { family: N-01, skill: "native vs DOM", depth: assess }
    misconceptions: []
    prerequisites: [rn-01-06-debug-setup-failure, rn-01-04-shared-domain-code]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-native, summary: "No-hint task: run strict tsc in native/ against the shared domain package, remove a seeded DOM-typed import, and cite two behaviors you observed only on your declared target that the preview could not show." }
      - { kind: independent, runtime: concept-preview, summary: "Explain-level items: for three labeled preview screens, state what each preview shows and which native behavior it cannot verify (view classes, safe-area insets, touch and keyboard behavior)." }
    retrieval:
      - { concept: "type-only imports across modules", from: js-14-07-modules-type-imports }
  - id: rn-01-08-capstone-native-subproject
    title: { uk: "Проєкт: нативний підпроєкт", en: "Capstone: native subproject" }
    kind: capstone-step
    minutes: 40
    objectives:
      - "Create native/ inside the exported workspace, import the shared domain package without copying it, and show one real fixture record through the shared formatter on the declared target."
    subskills:
      - { family: N-01, skill: "TS/domain reuse", depth: practice }
    misconceptions: []
    prerequisites: [rn-01-07-independent-explain-boundary, re-12-10-capstone-production-build]
    glossary: [native-subproject]
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-native, summary: "Inside the exported workspace, create native/ with the documented template, import the shared domain package by its workspace path, render the first fixture record through the shared formatter on your declared target and commit." }
      - { kind: run-change, runtime: local-native, summary: "Switch the hello screen to another fixture id, confirm it on your declared target, and run the web client's domain tests to show they still pass unchanged." }
    retrieval:
      - { concept: "what the export contains and where domain code lives", from: js-10-01-what-the-export-contains }
