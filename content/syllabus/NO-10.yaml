# Syllabus spine for NO-10. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: NO-10
stage: NO
title: { uk: "Лабораторна з автентифікації та авторизації", en: "Lab: authentication and authorization" }
summary:
  uk: "На синтетичних локальних користувачах учень розділяє автентифікацію та авторизацію, зберігає паролі перевіреним хешем (scrypt з node:crypto), видає й перевіряє сесійні cookies і токени з терміном дії та відкликанням, забезпечує власність і найменші привілеї, тримає секрети поза кодом і логами, обмежує зловживання входом з урахуванням CSRF і будує модель загроз, у якій CORS не плутають з контролем доступу."
  en: "With synthetic local users, the learner separates authentication from authorization, stores passwords with a vetted hash (scrypt from node:crypto), issues and checks session cookies and tokens with expiry and revocation, enforces ownership and least privilege, keeps secrets out of code and logs, throttles login abuse in its CSRF context, and builds a threat model that never mistakes CORS for access control."
competencies: [B-06, B-07]
capstoneStep: null
capstoneStepReason:
  uk: "Обов’язкова окрема локальна лабораторна з автентифікації та авторизації на синтетичних користувачах; проєкт за задумом лишається однокористувацьким, а вебклієнт інтегрується без входу в NO-06."
  en: "Required focused local auth/authorization lab with synthetic users; the capstone stays single-user by design and the web client integrates without login in NO-06."
# Retrieval plan: js-16-03-cookies-storage-origins (cookies) ; no-04-03-error-model (errors) ; js-16-08-secrets-storage-privacy (secrets) ; no-09-04-parameterized-queries (parameterized)
# Lab service (synthetic, loopback only): a notes service with users u-01 and u-02 and one admin; no real accounts, no cloud identity provider, no platform login.
lessons:
  - id: no-10-01-authn-vs-authz
    title: { uk: "Автентифікація проти авторизації", en: "Authentication vs authorization" }
    kind: instructional
    minutes: 10
    objectives:
      - "Classify each check in a request flow as authentication (who is calling) or authorization (may they do this), and predict 401 versus 403 for given requests."
      - "Place both checks in a server pipeline so that no route reaches data before they have run."
    subskills:
      - { family: B-06, skill: "authn vs authz", depth: intro }
    misconceptions:
      - "Once a user is logged in, they may do anything the UI shows them."
      - "401 and 403 mean the same thing: access denied."
    prerequisites: [no-04-01-rest-boundaries, no-03-03-routing-json-bodies]
    glossary: [authentication, authorization]
    visual: { kind: diagram, concept: "A request pipeline drawn as gates: the identity gate turns a credential into a user or a 401, the permission gate checks that user against the action and resource or returns 403, and only then does the handler touch data; sample requests light up the gate where they stop." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the status for four requests to the synthetic notes service: no credential, a bad credential, u-02 reading u-01’s note and u-01 reading their own." }
      - { kind: run-change, runtime: isolated-node, summary: "Send the four requests to the lab server in the Node child, then remove the permission gate and watch u-02 read u-01’s note." }
      - { kind: write, runtime: isolated-node, summary: "Write requireUser(req) and requirePermission(user, action, note) and wire them into the route pipeline in the right order." }
    retrieval:
      - { concept: "one error shape with the matching status", from: no-04-03-error-model }
  - id: no-10-02-identity-hashing
    title: { uk: "Синтетична ідентичність і перевірене хешування паролів", en: "Synthetic identity and vetted password hashing" }
    kind: instructional
    minutes: 12
    objectives:
      - "Create synthetic local users and store only a salted, deliberately slow password hash from a vetted function (scrypt in node:crypto) together with its parameters."
      - "Verify a login by re-deriving the hash with the stored salt and comparing with timingSafeEqual, and explain why plain SHA-256, reversible encryption or a home-made scheme is unacceptable."
    subskills:
      - { family: B-06, skill: "local synthetic identity", depth: intro }
      - { family: B-06, skill: "vetted password hashing", depth: intro }
    misconceptions:
      - "Hashing a password once with SHA-256 is secure because hashes cannot be reversed."
      - "I can make hashing safer by inventing my own mix of salts and rounds."
    prerequisites: [no-10-01-authn-vs-authz]
    glossary: [password-hash, salt, key-derivation-function, timing-safe-comparison]
    visual: { kind: sequence, concept: "Registration and login over time: the password plus a random salt go into scrypt and only the salt, parameters and hash are stored; at login the same salt re-derives a hash that timingSafeEqual compares, and the plaintext is never written anywhere." }
    analogy: "Like keeping a plaster cast of a key instead of the key: you can test whether a key fits the cast, but you cannot easily cut a key from it (limit: a fast hash is a cast that an attacker can test billions of keys against per second, so the function must be deliberately slow and salted, and only a vetted one will do)."
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict whether two synthetic users with the same password get the same stored value under plain SHA-256 and under salted scrypt, and what a leaked SHA-256 table reveals." }
      - { kind: run-change, runtime: isolated-node, summary: "Hash the synthetic users’ passwords with scrypt in the Node child, time one hash, raise the cost parameter and compare, then verify a right and a wrong password." }
      - { kind: write, runtime: isolated-node, summary: "Write hashPassword(password) and verifyPassword(password, stored) on node:crypto scrypt with a random salt, stored parameters and timingSafeEqual." }
    retrieval:
      - { concept: "looking up a user by name with a bound parameter", from: no-09-04-parameterized-queries }
  - id: no-10-03-sessions-cookies-tokens
    title: { uk: "Сесії та cookies проти токенів", en: "Sessions and cookies vs tokens" }
    kind: instructional
    minutes: 12
    objectives:
      - "Issue an opaque random session id after login, keep the session state on the server and send the id in a cookie with HttpOnly, SameSite and Path (and Secure for HTTPS deployments)."
      - "Compare a server-side session with a signed bearer token on revocation, size, storage location and exposure to XSS, and choose one for a stated client."
    subskills:
      - { family: B-06, skill: "sessions/cookies vs tokens", depth: intro }
    misconceptions:
      - "A token is more secure than a session cookie because it is signed."
      - "A signed token is encrypted, so nobody can read what is inside it."
    prerequisites: [no-10-02-identity-hashing, js-16-07-xss-safe-sinks]
    glossary: [server-session, session-id, bearer-token, signed-token]
    visual: { kind: sequence, concept: "Browser, server and session store over time: login sets an HttpOnly cookie holding an opaque id, each request carries it and the server looks the id up; the token lane shows a signed token sent in a header and verified without a lookup, so revoking it needs extra server state." }
    analogy: "Like a cloakroom ticket versus a signed pass: the ticket is only a number that means something at the counter holding the coats, while the pass carries its own claims and a signature (limit: either one can be stolen and replayed, so both need expiry, safe storage and HTTPS in real deployments)."
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict which requests still succeed after logout when the lab uses a server session and when it uses a signed token with no revocation list." }
      - { kind: run-change, runtime: isolated-node, summary: "Log in to the lab server from the Node child, read the Set-Cookie header and its attributes, call a protected route with and without the cookie, then switch to token mode and repeat." }
      - { kind: write, runtime: isolated-node, summary: "Write createSession(userId) and readSession(req) with crypto.randomBytes ids, a server-side session store and a cookie with HttpOnly, SameSite=Lax and Path=/." }
    retrieval:
      - { concept: "cookie attributes and which requests carry them", from: js-16-03-cookies-storage-origins }
  - id: no-10-04-expiry-revocation
    title: { uk: "Термін дії та відкликання", en: "Expiry and revocation" }
    kind: instructional
    minutes: 10
    objectives:
      - "Enforce idle and absolute expiry on sessions with an injected clock, and predict which requests are rejected at given times."
      - "Revoke a session on logout and all of a user’s sessions on password change, and explain what a stateless token needs before it can be revoked."
    subskills:
      - { family: B-06, skill: "expiry/revocation", depth: intro }
    misconceptions:
      - "Deleting the cookie in the browser logs the user out everywhere."
      - "A token with a long lifetime is fine as long as it is signed."
    prerequisites: [no-10-03-sessions-cookies-tokens]
    glossary: [idle-timeout, absolute-expiry, credential-revocation]
    visual: { kind: sequence, concept: "A session’s timeline under an injected clock: requests inside the idle window extend it, a gap beyond the idle timeout rejects the next request, logout deletes it on the server, and a password change revokes the user’s other sessions at the same instant." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the status of requests at minutes 5, 40 and 130 for a session with a 30-minute idle timeout and a 2-hour absolute limit, and of a request after logout." }
      - { kind: run-change, runtime: isolated-node, summary: "Drive the lab server’s fake clock from the Node child and replay the requests, then change a password and check that the user’s second session stops working." }
      - { kind: write, runtime: isolated-node, summary: "Write isSessionValid(session, now) and revokeUserSessions(userId) with a test that uses a fixed clock for every boundary." }
    retrieval:
      - { concept: "a fixed clock makes time-dependent code testable", from: js-09-04-deterministic-fixtures }
  - id: no-10-05-ownership-least-privilege
    title: { uk: "Власність і найменші привілеї", en: "Ownership and least privilege" }
    kind: instructional
    minutes: 12
    objectives:
      - "Enforce ownership on every read, update and delete by scoping queries to the authenticated user, and predict which cross-user requests leak data."
      - "Give each role and component only the permissions it needs, and answer 404 rather than 403 where the existence of a record is itself sensitive."
    subskills:
      - { family: B-06, skill: "least privilege/ownership", depth: intro }
    misconceptions:
      - "Hiding other users’ ids in the UI is enough to protect their records."
      - "An admin role should simply skip all checks."
    prerequisites: [no-10-04-expiry-revocation, no-10-01-authn-vs-authz]
    glossary: [least-privilege, ownership-check, insecure-direct-object-reference]
    visual: { kind: diagram, concept: "Users, roles and notes as a permission grid: each request (user, action, note id) is checked cell by cell, a query scoped by ownerId returns only the caller’s rows, and the unscoped query highlights the foreign row it would leak." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict which of u-02’s requests (list, read, update and delete u-01’s note by id) the unscoped lab handlers allow." }
      - { kind: run-change, runtime: isolated-node, summary: "Send the requests to the lab server in the Node child, then scope the queries by ownerId and resend, comparing 403 and 404 for a foreign note." }
      - { kind: write, runtime: isolated-node, summary: "Write a can(user, action, note) policy table for owner, reader and admin roles and use it in every note route." }
    retrieval:
      - { concept: "which resource a URL names", from: no-04-01-rest-boundaries }
  - id: no-10-06-secrets-secure-config
    title: { uk: "Секрети та безпечна конфігурація", en: "Secrets and secure config" }
    kind: instructional
    minutes: 10
    objectives:
      - "Load secrets such as the token signing key from env or a git-ignored local file, never from source, and fail fast when one is missing, a placeholder or too short."
      - "Keep secrets out of logs and error responses, and rotate a signing key by accepting the previous key during a bounded window."
    subskills:
      - { family: B-06, skill: "secrets and secure config", depth: intro }
    misconceptions:
      - "A secret committed once to a private repository is safe enough."
      - "A default value for a secret makes local setup easier and does no harm."
    prerequisites: [no-10-05-ownership-least-privilege, no-01-02-scripts-process-env]
    glossary: [secret-rotation]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict what the lab server does on start with SESSION_SECRET unset, set to 'changeme' and set to 32 random bytes, and what a thrown config error would print." }
      - { kind: run-change, runtime: isolated-node, summary: "Start the lab server in the Node child with each value, then add a second key and confirm tokens signed with the old key still verify only inside the rotation window." }
      - { kind: write, runtime: isolated-node, summary: "Write loadSecrets(env) that requires a strong signing key, never logs its value and supports a current and a previous key for rotation." }
    retrieval:
      - { concept: "no secrets in the client bundle", from: js-16-08-secrets-storage-privacy }
  - id: no-10-07-login-abuse-csrf-limits
    title: { uk: "Захист входу від зловживань, CSRF і ліміти", en: "Login abuse controls, CSRF context and rate limits" }
    kind: instructional
    minutes: 12
    objectives:
      - "Throttle failed logins per account and per address with a bounded counter and backoff, answer unknown users and wrong passwords with the same message, and predict the lockout effects."
      - "Explain when a cookie-authenticated state-changing request is exposed to CSRF — including from another port on the same host, which SameSite treats as same-site — and protect it with SameSite plus an Origin check or a CSRF token."
      - "Apply size and time limits (body bytes, request duration, hashing work) so that login cannot be used to exhaust the server."
    subskills:
      - { family: B-06, skill: "login abuse controls/CSRF context", depth: intro }
      - { family: B-07, skill: "rate/size/time limits", depth: intro }
    misconceptions:
      - "CORS prevents CSRF, because other sites cannot read my responses."
      - "Telling the user 'unknown username' is harmless and more helpful."
    prerequisites: [no-10-06-secrets-secure-config, no-03-04-cancellation-timeouts-server]
    glossary: [rate-limiting, credential-stuffing, csrf, user-enumeration]
    visual: { kind: sequence, concept: "An attack script, a victim browser and the lab server over time: repeated failed logins hit the rate limiter and get 429 with Retry-After, while a forged form post from another site arrives with a foreign Origin and is refused by SameSite and the Origin check." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the responses to 20 rapid wrong-password attempts on one synthetic account with a limit of 5 per minute, and whether a cross-site form POST carries a SameSite=Lax session cookie." }
      - { kind: run-change, runtime: isolated-node, summary: "Fire the attempts at the lab server from the Node child and read the 429 responses, then send a state-changing POST with a foreign Origin header before and after enabling the Origin check." }
      - { kind: write, runtime: isolated-node, summary: "Write a bounded loginLimiter (per account and per address, with old entries expiring) and a requireSameOrigin check for state-changing routes." }
    retrieval:
      - { concept: "a body size limit as a resource limit", from: no-03-03-routing-json-bodies }
  - id: no-10-08-threat-model-cors-not-auth
    title: { uk: "Модель загроз; CORS — це не автентифікація", en: "Threat model; CORS is not auth" }
    kind: instructional
    minutes: 12
    objectives:
      - "Draw a threat model for the lab service: assets, actors, entry points, trust boundaries and the control that answers each threat."
      - "Show with real requests that CORS headers only decide which browser pages may read a response, while curl or another server reaches the API regardless."
    subskills:
      - { family: B-07, skill: "threat model", depth: intro }
      - { family: B-07, skill: "CORS not auth", depth: intro }
    misconceptions:
      - "Allowing only my site in Access-Control-Allow-Origin means nobody else can call my API."
      - "Threat modeling is only for large companies with security teams."
    prerequisites: [no-10-07-login-abuse-csrf-limits, no-10-05-ownership-least-privilege]
    glossary: [threat-model, attack-surface]
    visual: { kind: diagram, concept: "The lab service’s data-flow diagram with trust boundaries: each threat card (stolen cookie, foreign note id, forged post, brute force, leaked key) attaches to the boundary it crosses and lights up the control that answers it, while a curl arrow bypasses the browser’s CORS check entirely." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict which of three callers can read GET /notes under a strict CORS policy with no session check: a page on the allowed origin, a page on another origin and curl." }
      - { kind: run-change, runtime: isolated-node, summary: "Call the lab server from the Node child with and without an Origin header and read the CORS headers, then remove the session check and see the data returned to the non-browser caller." }
      - { kind: write, runtime: isolated-node, summary: "Write a threat-model table for the lab service (asset, threat, entry point, control, test that proves it) covering at least five threats." }
    retrieval:
      - { concept: "what the same-origin policy and CORS control in the browser", from: js-16-04-same-origin-cors }
  - id: no-10-09-debug-cross-user-access
    title: { uk: "Налагодження: доступ до чужих даних і прийнята прострочена сесія", en: "Debug: cross-user access and an accepted expired session" }
    kind: instructional
    minutes: 15
    objectives:
      - "Reproduce and repair a cross-user read through an unscoped query, a session accepted after its expiry and after logout, and a route that trusts CORS instead of checking the session."
      - "Prove each repair with a test that fails before the fix and passes after it, using synthetic users and a fixed clock."
    subskills:
      - { family: B-06, skill: "sessions/cookies vs tokens", depth: assess }
      - { family: B-06, skill: "expiry/revocation", depth: assess }
      - { family: B-06, skill: "least privilege/ownership", depth: assess }
      - { family: B-07, skill: "CORS not auth", depth: assess }
    misconceptions:
      - "If the frontend never sends that request, the server does not need to reject it."
    prerequisites: [no-10-08-threat-model-cors-not-auth]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Before running, predict which of four seeded requests the server accepts: u-02 reading u-01’s note, an expired session, a logged-out session and a curl call without a session but with an allowed Origin." }
      - { kind: run-change, runtime: isolated-node, summary: "Replay the four requests against the seeded lab server in the Node child and match each accepted request to your prediction." }
      - { kind: debug, runtime: isolated-node, summary: "Repair the unscoped query, the expiry and revocation checks and the CORS-only guard so all four requests are rejected with the right status, without breaking the owner’s own access." }
    retrieval:
      - { concept: "a check that must run at the server edge", from: no-04-07-debug-contract-corruption }
  - id: no-10-10-independent-auth-lab
    title: { uk: "Самостійно: лабораторна з автентифікації, сесій і власності", en: "Independent: auth/session/ownership lab" }
    kind: assessment
    minutes: 40
    objectives:
      - "Build, without hints, a local service for synthetic users with vetted password hashing, sessions, ownership checks, secrets from config, login throttling with CSRF protection and size and time limits."
      - "Write its threat model and tests that reject cross-user access, expired or revoked sessions and forged or oversized requests, and explain the session-versus-token choice and why no cryptography is home-made."
    subskills:
      - { family: B-06, skill: "authn vs authz", depth: assess }
      - { family: B-06, skill: "local synthetic identity", depth: assess }
      - { family: B-06, skill: "vetted password hashing", depth: assess }
      - { family: B-06, skill: "secrets and secure config", depth: assess }
      - { family: B-06, skill: "login abuse controls/CSRF context", depth: assess }
      - { family: B-07, skill: "rate/size/time limits", depth: assess }
      - { family: B-07, skill: "threat model", depth: assess }
    misconceptions: []
    prerequisites: [no-10-09-debug-cross-user-access]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: isolated-node, summary: "No-hint assessment exercise in the Node child: the synthetic bookmarks service (scrypt passwords, sessions with idle and absolute expiry and logout, owner-scoped routes, a strong secret from env, per-account and per-address login throttling, an Origin check, body and request-time limits), checked over real HTTP with a fixed clock." }
      - { kind: independent, runtime: local-node, summary: "No-hint task in your own terminal: a synthetic bookmarks service with three users on loopback; the supplied attack script sends cross-user, expired, revoked, forged-origin, brute-force and oversized requests over real HTTP, and you record its report together with your threat model." }
    retrieval:
      - { concept: "secrets stay in server-only code", from: re-11-04-secrets-server-only }
