# Syllabus spine for RE-05. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RE-05
stage: RE
title: { uk: "Маршрути, форми й доступні сценарії", en: "Routes, forms and accessible flows" }
summary:
  uk: "Учень додає маршрути списку, деталей і редагування з параметрами та правильною поведінкою «Назад» через мінімальну абстракцію маршрутизатора, обирає керовані чи некеровані поля, показує доступні помилки валідації, переміщує фокус під час навігації й захищає незбережені зміни, рендерить явні стани завантаження, порожнечі й помилки та розставляє error boundaries, знаючи, чого вони не перехоплюють."
  en: "The learner adds list, detail and edit routes with params and correct Back behavior through a minimal router abstraction, chooses controlled or uncontrolled fields, shows accessible validation errors, moves focus on navigation and guards unsaved edits, renders explicit loading, empty and error states, and places error boundaries knowing what they do not catch."
competencies: [R-05]
capstoneStep:
  mode: local
  objective:
    uk: "Додати до проєкту маршрути списку, деталей і редагування з правильною поведінкою «Назад», доступною валідацією та станами завантаження, порожнечі й помилки; попереджати перед виходом із незбереженими змінами."
    en: "Add list/detail/edit routes to the capstone with correct back behavior, accessible validation and loading/empty/error states; warn before leaving unsaved edits."
  variants:
    wishlist:
      uk: "Маршрути /items, /items/:id і /items/:id/edit (в адресі після #) показують список бажань, назву, ціну, позначку «отримано» й категорію одного бажання та форму редагування, чиї помилки назви й ціни озвучуються; вихід із незбереженими змінами спершу просить підтвердження, а невідомий id показує стан «не знайдено»."
      en: "Routes /items, /items/:id and /items/:id/edit (in the address after #) show the wish list, one wish's name, price, acquired and category, and an edit form whose name and price errors are announced; leaving with unsaved edits asks first, and an unknown id shows a not-found state."
    planner:
      uk: "Маршрути /tasks, /tasks/:id і /tasks/:id/edit (в адресі після #) показують список справ, назву, термін, позначку «виконано» й пріоритет однієї справи та форму редагування, чия помилка назви озвучується; вихід із незбереженими змінами спершу просить підтвердження, а невідомий id показує стан «не знайдено»."
      en: "Routes /tasks, /tasks/:id and /tasks/:id/edit (in the address after #) show the task list, one task's title, dueDate, done and priority, and an edit form whose title error is announced; leaving with unsaved edits asks first, and an unknown id shows a not-found state."
    habits:
      uk: "Маршрути /habits, /habits/:id і /habits/:id/edit (в адресі після #) показують список звичок, назву, частоту, позначку «активна» й дати виконання однієї звички та форму редагування, чия помилка назви озвучується; вихід із незбереженими змінами спершу просить підтвердження, невідомий id показує стан «не знайдено», а звичка без completions — порожній стан."
      en: "Routes /habits, /habits/:id and /habits/:id/edit (in the address after #) show the habit list, one habit's name, frequency, active and completions, and an edit form whose name error is announced; leaving with unsaved edits asks first, an unknown id shows a not-found state and a habit without completions shows an empty state."
    expenses:
      uk: "Маршрути /expenses, /expenses/:id і /expenses/:id/edit (в адресі після #) показують список витрат, назву, відформатовану суму amountMinor, дату й категорію однієї витрати та форму редагування, чиї помилки суми й категорії озвучуються; вихід із незбереженими змінами спершу просить підтвердження, а невідомий id показує стан «не знайдено»."
      en: "Routes /expenses, /expenses/:id and /expenses/:id/edit (in the address after #) show the expense list, one expense's label, formatted amountMinor, date and category, and an edit form whose amount and category errors are announced; leaving with unsaved edits asks first, and an unknown id shows a not-found state."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-04-05-refs-focus (focus) ; js-06-01-forms-inputs-labels (labels) ; js-16-01-url-query-encoding (URL params) ; js-07-03-try-catch-finally (where errors go)
lessons:
  - id: re-05-01-routing-basics
    title: { uk: "Маршрути, посилання та історія", en: "Routes, links and history" }
    kind: instructional
    minutes: 12
    objectives:
      - "Map URL paths to screens with a route table and navigate with links that add history entries without a full page reload."
      - "Predict what Back and Forward show after a sequence of link clicks and after a replace-style navigation."
    subskills:
      - { family: R-05, skill: "nested routes/params/history", depth: intro }
    misconceptions:
      - "A client-side route change reloads the page, just like an ordinary link."
      - "Navigating with replace leaves the same history behind as navigating with push."
    prerequisites: [re-04-04-context-boundaries, js-16-01-url-query-encoding]
    glossary: [route, client-side-routing, history-entry]
    visual: { kind: diagram, concept: "A route table beside a history stack: clicking a link pushes an entry and highlights the matched route and its screen, Back pops to the previous entry, and a replace navigation overwrites the top entry instead of adding one." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict the screen and the history stack after list → detail → edit → Back → Back, and after the same flow when Save navigates with replace." }
      - { kind: run-change, runtime: browser-react, summary: "Run the flow on the course's minimal router abstraction (a route table, a Link component, navigate and back over a history stack; no router library is prescribed because that choice is still open), then switch Save from push to replace and compare Back." }
      - { kind: write, runtime: browser-react, summary: "Write a route table for list, about and not-found screens with the same minimal router abstraction, using links that render as real anchors." }
    retrieval:
      - { concept: "the parts of a URL and how they are encoded", from: js-16-01-url-query-encoding }
      - { concept: "a link navigates, a button acts", from: js-01-07-links-buttons-images-tables }
    # design note: router library undecided → minimal abstraction
  - id: re-05-02-params-nested-routes
    title: { uk: "Параметри й вкладені маршрути", en: "Params and nested routes" }
    kind: instructional
    minutes: 12
    objectives:
      - "Read a route parameter such as :id, look up the record and handle an id that does not exist."
      - "Nest detail and edit screens inside a list layout so that the shared header and list stay mounted between them."
    subskills:
      - { family: R-05, skill: "nested routes/params/history", depth: practice }
    misconceptions:
      - "A route param is already the record, not a string that still has to be looked up and checked."
      - "Every navigation re-mounts the whole page, layout included."
    prerequisites: [re-05-01-routing-basics]
    glossary: [route-param, nested-route]
    visual: { kind: diagram, concept: "A URL such as /records/w-02/edit split into segments matched against nested routes: the layout box stays highlighted as mounted while only the innermost screen swaps, and the :id segment flows as the string 'w-02' into the record lookup." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what the detail screen shows for /records/w-02, /records/w-99 and an encoded space as the id, and which components stay mounted between detail and edit." }
      - { kind: run-change, runtime: browser-react, summary: "Run nested routes on the minimal router abstraction with a counter in the layout, move between detail and edit, then un-nest the layout and watch the counter reset." }
      - { kind: write, runtime: browser-react, summary: "Write a RecordDetail route that reads the id param, finds the record and renders a not-found state for unknown ids." }
    retrieval:
      - { concept: "state kept or reset by tree position", from: re-02-07-reset-preserve-identity }
  - id: re-05-03-forms-controlled-uncontrolled
    title: { uk: "Керовані й некеровані форми", en: "Controlled vs uncontrolled forms" }
    kind: instructional
    minutes: 10
    objectives:
      - "Choose controlled fields when the UI reacts to each keystroke and uncontrolled fields (defaultValue plus FormData on submit) when only the final values matter."
      - "Predict what happens when a field switches from uncontrolled to controlled because its value starts as undefined."
    subskills:
      - { family: R-05, skill: "controlled/uncontrolled boundaries", depth: intro }
    misconceptions:
      - "Uncontrolled inputs are a legacy pattern and always wrong in React."
      - "defaultValue updates the field when the prop changes later."
    prerequisites: [re-05-02-params-nested-routes, re-02-06-controlled-inputs-typed-events]
    glossary: [uncontrolled-input]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict the field's content after the selected record changes when the edit field uses defaultValue without a key, and the console warning when value starts as undefined." }
      - { kind: run-change, runtime: browser-react, summary: "Run the edit form both ways, read the controlled/uncontrolled warning, then fix it once with an empty-string initial value and once with a key." }
      - { kind: write, runtime: browser-react, summary: "Write an uncontrolled quick-add form that reads its fields with FormData on submit and passes them to the domain validator." }
    retrieval:
      - { concept: "undefined versus an empty string", from: js-02-04-nullish-optional-chaining }
  - id: re-05-04-validation-accessible-errors
    title: { uk: "Валідація та доступні помилки", en: "Validation and accessible errors" }
    kind: instructional
    minutes: 12
    objectives:
      - "Show the domain validator's field errors next to their inputs, linked with aria-describedby and marked with aria-invalid."
      - "On a failed submit, move focus to an error summary or the first invalid field, and decide when errors appear (on submit or blur, not on the first keystroke)."
    subskills:
      - { family: R-05, skill: "validation/errors", depth: intro }
    misconceptions:
      - "Red text under the field is enough; screen-reader users will notice it."
      - "Disabling the submit button until the form is valid is the most accessible approach."
    prerequisites: [re-05-03-forms-controlled-uncontrolled, js-06-01-forms-inputs-labels]
    glossary: [field-error, error-summary]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what a screen reader announces when focusing an invalid name field with and without aria-describedby pointing at its error." }
      - { kind: run-change, runtime: browser-react, summary: "Run the edit form with the accessibility tree open, submit invalid data, then link each error to its input and move focus to the first invalid field." }
      - { kind: write, runtime: browser-react, summary: "Write the validation display for a record form: localized per-field messages from the domain's error keys, an error summary that links to the fields, and focus moved on a failed submit." }
    retrieval:
      - { concept: "every input needs a programmatic label", from: js-06-01-forms-inputs-labels }
  - id: re-05-05-focus-navigation-unsaved
    title: { uk: "Фокус під час навігації й незбережені зміни", en: "Focus on navigation and unsaved edits" }
    kind: instructional
    minutes: 12
    objectives:
      - "Move focus to the new screen's heading after a route change and update the document title so the change is announced."
      - "Detect unsaved edits by comparing the draft with the saved record, confirm before in-app navigation (including the app's Back), and register beforeunload for a reload or tab close."
    subskills:
      - { family: R-05, skill: "focus/navigation/unsaved edits", depth: intro }
    misconceptions:
      - "After a client-side route change, a screen reader knows a new page loaded, just as after a full reload."
      - "Warning on every exit from the edit form is fine, even when nothing changed."
    prerequisites: [re-05-04-validation-accessible-errors, re-04-05-refs-focus]
    glossary: [unsaved-changes-guard, route-focus]
    visual: { kind: sequence, concept: "Messages over time between the user, the router abstraction, the edit screen and the DOM: Back is requested, the guard compares draft and saved record, a confirmation appears, and on leaving the next screen mounts and focus moves to its heading." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict where focus is after navigating from list to detail with the bare abstraction, and whether the app's Back from an edited form asks for confirmation." }
      - { kind: run-change, runtime: browser-react, summary: "Run the flow, add a heading ref that receives focus after each route change, then add an isDirty check with a confirmation on in-app navigation and a beforeunload listener." }
      - { kind: write, runtime: browser-react, summary: "Write a useUnsavedChangesGuard(isDirty) hook for the minimal router abstraction that confirms in-app navigation and adds and cleans up a beforeunload listener." }
    retrieval:
      - { concept: "moving focus through a ref after the commit", from: re-04-05-refs-focus }
      - { concept: "an effect's cleanup removes the listener it added", from: re-03-03-dependencies-cleanup }
  - id: re-05-06-loading-empty-error-states
    title: { uk: "Стани завантаження, порожнечі й помилки", en: "Loading, empty and error states" }
    kind: instructional
    minutes: 10
    objectives:
      - "Model a screen's data status as a typed union (loading, empty, error, ready) and render exactly one state at a time."
      - "Write empty and error states that say what happened and offer the next action (create, retry), announced politely to assistive technology."
    subskills:
      - { family: R-05, skill: "loading/empty/error states", depth: intro }
    misconceptions:
      - "An empty list and a failed load can share one “No records” message."
      - "Separate isLoading and error booleans are enough to describe the screen."
    prerequisites: [re-05-05-focus-navigation-unsaved, js-14-03-unions-narrowing]
    glossary: [screen-status]
    visual: { kind: diagram, concept: "A status diagram (loading → ready, empty or error; error → loading on retry) beside the screen; driving a delayed fixture through each transition highlights the active status and the single UI branch it renders." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what a screen with separate isLoading, error and records state shows when a retry fails after an earlier success." }
      - { kind: run-change, runtime: browser-react, summary: "Run the list screen against a delayed fixture with a failure switch, then replace the three pieces of state with a status union and an exhaustive switch." }
      - { kind: write, runtime: browser-react, summary: "Write a RecordsScreen that renders loading, empty (with a create action), error (with a retry) and ready states from a typed status union." }
    retrieval:
      - { concept: "loading and error states around a request", from: js-08-07-failures-loading-error }
  - id: re-05-07-error-boundaries-limits
    title: { uk: "Error boundaries та їхні обмеження", en: "Error boundaries and their limits" }
    kind: instructional
    minutes: 12
    objectives:
      - "Wrap a route's screen in an error boundary that shows a fallback with a recovery action when rendering throws."
      - "Predict which errors a boundary catches (render and effects of its children) and which it does not (event handlers, timers, promise callbacks, the boundary itself), and handle the latter with try/catch and error state."
    subskills:
      - { family: R-05, skill: "error boundaries and their limits", depth: intro }
    misconceptions:
      - "An error boundary catches every error in its subtree, including ones thrown in click handlers and failed fetches."
      - "One boundary around the whole app is the best placement."
    prerequisites: [re-05-06-loading-empty-error-states, js-11-05-classes-private-static]
    glossary: [error-boundary, fallback-ui]
    visual: { kind: diagram, concept: "A tree with a boundary around the detail route: a render-time throw travels up to the boundary and swaps in its fallback while the layout stays, whereas a throw inside onClick and a rejected promise travel past it to the console on separate paths." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which of four seeded throws (in render, in an effect, in onClick, in a promise callback) show the boundary's fallback and which leave the screen unchanged." }
      - { kind: run-change, runtime: browser-react, summary: "Run the four throws, then catch the handler and promise errors with try/catch that sets an error state the screen renders." }
      - { kind: write, runtime: browser-react, summary: "Write a class ErrorBoundary with getDerivedStateFromError and a reset action, and place it around the detail route so the list layout survives a broken record." }
    retrieval:
      - { concept: "where a thrown error goes and who can catch it", from: js-07-03-try-catch-finally }
      - { concept: "class fields and methods", from: js-11-05-classes-private-static }
    # design note: misconception "boundaries catch handler errors"
  - id: re-05-08-debug-route-form-flow
    title: { uk: "Налагодження: «Назад» губить зміни, фокус не переміщено", en: "Debug: back loses edits, focus not moved" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose an edit form that loses typed edits on the app's Back or on a record switch, and repair the controlled/uncontrolled defect and the missing guard."
      - "Repair a route change that leaves focus on a removed element and announces nothing."
    subskills:
      - { family: R-05, skill: "controlled/uncontrolled boundaries", depth: assess }
      - { family: R-05, skill: "focus/navigation/unsaved edits", depth: assess }
    misconceptions:
      - "If the visible content changed, keyboard and screen-reader users have moved with it."
    prerequisites: [re-05-07-error-boundaries-limits]
    glossary: []
    visual: { kind: sequence, concept: "The seeded flow replayed between the user, the router abstraction, the edit form and the DOM: Back fires with a dirty draft and no guard, the form unmounts and the draft is lost, and focus falls to the document body when the Save button is removed." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Before running, predict what happens to the draft and to focus after editing a record, pressing the app's Back and reopening the edit route." }
      - { kind: run-change, runtime: browser-react, summary: "Run the seeded list/detail/edit flow by keyboard with the focus tracker on, and match each symptom to the step that causes it." }
      - { kind: debug, runtime: browser-react, summary: "Repair the field that switches from uncontrolled to controlled, add the unsaved-changes guard and move focus to the new screen's heading after each route change." }
    retrieval:
      - { concept: "keyboard and screen-reader checks of a page", from: js-17-10-accessible-website-audit }
  - id: re-05-09-independent-list-detail-edit
    title: { uk: "Самостійно: сценарій список/деталі/редагування", en: "Independent: list/detail/edit flow" }
    kind: assessment
    minutes: 30
    objectives:
      - "Build, without hints, a list/detail/edit flow on the minimal router abstraction with params, nested routes, correct Back behavior, accessible validation and explicit loading, empty and error states."
    subskills:
      - { family: R-05, skill: "nested routes/params/history", depth: assess }
      - { family: R-05, skill: "loading/empty/error states", depth: assess }
    misconceptions: []
    prerequisites: [re-05-08-debug-route-form-flow]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-react, summary: "No-hint task on the minimal router abstraction: list, detail and edit routes over a delayed fixture; hidden checks open unknown ids, press Back from a dirty and a clean form, submit invalid data by keyboard, empty the list and force a load failure." }
    retrieval:
      - { concept: "a typed reducer for edit transitions", from: re-04-03-reducers-typed }
    # design note: no-hint
  - id: re-05-10-capstone-routes
    title: { uk: "Проєкт: маршрути та стани", en: "Capstone: routes and states" }
    kind: capstone-step
    minutes: 30
    objectives:
      - "In the local capstone project, add list, detail and edit routes with params, Back behavior, accessible validation, loading/empty/error states and an unsaved-changes warning, and confirm each flow locally."
    subskills:
      - { family: R-05, skill: "nested routes/params/history", depth: practice }
    misconceptions: []
    prerequisites: [re-05-09-independent-list-detail-edit, re-04-09-capstone-data-hook]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "In the local project, add list, detail and edit routes with the minimal router abstraction from the lessons (no router library is prescribed), reading data through the RE-04 data hook and validating the edit form with the domain validator." }
      - { kind: run-change, runtime: local-web, summary: "Run the local dev script, walk every route by keyboard with the accessibility tree or a screen reader, try Back with unsaved edits, an unknown id and an empty list, and commit once you have confirmed each state." }
    retrieval:
      - { concept: "the capstone's accessible form and confirm-before-delete", from: js-06-16-capstone-ui }
