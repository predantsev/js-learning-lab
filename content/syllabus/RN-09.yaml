# Syllabus spine for RN-09. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RN-09
stage: RN
title: { uk: "Дозволи, захищені дані та приватність", en: "Permissions, secure data and privacy" }
summary:
  uk: "Учень відокремлює токени від звичайного сховища, не вшиває секрети в застосунок, збирає лише ті дані, що потрібні функції, тримає auth-перенаправлення й deep links у безпечних межах і обробляє відмову, відкликання та недоступність можливостей пристрою в синтетичній лабораторії на заявленій цілі."
  en: "The learner keeps tokens out of ordinary storage, ships no embedded secrets, collects only the data a feature needs, keeps auth redirects and deep links inside safe boundaries, and handles denied, revoked and unavailable device capabilities in a synthetic lab on the declared target."
competencies: [N-07]
capstoneStep: null
capstoneStepReason:
  uk: "Окрема синтетична лабораторія можливостей: жоден із чотирьох доменів проєкту не потребує дозволів пристрою, захищених облікових даних чи auth через deep link; лабораторія самодостатня, а її навички повторюються в RN-12."
  en: "Focused synthetic capability lab: none of the four capstone domains needs device permissions, secure credentials or deep-link auth; the lab stands alone and its skills are retrieved in RN-12."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   rn-06-06-permissions-capability-checks (permissions) ; js-16-08-secrets-storage-privacy (secrets) ; rn-04-06-deep-links (deep links) ; rn-05-01-storage-adapters (storage)
lessons:
  - id: rn-09-01-secure-vs-ordinary-storage
    title: { uk: "Захищене сховище проти звичайного", en: "Secure storage vs ordinary storage" }
    kind: instructional
    minutes: 12
    objectives:
      - "Classify synthetic values (a session token, a theme preference, a list of records) as secure-storage or ordinary-storage data and justify each choice."
      - "Explain what the platform keychain/keystore protects (values at rest, scoped to the app) and what it does not (a value already logged, sent or held in memory)."
    subskills:
      - { family: N-07, skill: "secure credential storage vs ordinary storage", depth: intro }
    misconceptions:
      - "A token read from secure storage stays protected wherever my code passes it next."
      - "Secure storage is better, so all app data should go into it."
    prerequisites: [rn-05-01-storage-adapters, js-16-08-secrets-storage-privacy]
    glossary: [secure-storage, keychain, android-keystore]
    visual: { kind: diagram, concept: "A synthetic token and a records list flow through two adapters: the secure adapter writes to the OS keychain/keystore (encrypted at rest, app-scoped), the ordinary adapter writes plain JSON to app storage; each step highlights who can read the stored value and which threats each path does and does not cover." }
    analogy: "A hotel-room safe versus the open shelf in the same room: both are inside your room, but only the safe adds a lock tied to this room (limit: the safe protects the item at rest; once you take it out — read the token into memory, log it or send it — the safe no longer protects it)."
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which adapter the labeled preview routes a synthetic token, a theme flag and a records array to, and what the simulated raw-storage inspector shows for each." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled storage preview (not native verification), move the token from the ordinary adapter to the secure-adapter stand-in and compare what the raw-storage inspector shows." }
      - { kind: write, runtime: browser-js, summary: "Write a typed SecretStore contract (getSecret/setSecret/deleteSecret returning ok/error results) and an in-memory test double, kept separate from the records storage adapter." }
    retrieval:
      - { concept: "what the native storage adapter actually persists, and where", from: rn-05-01-storage-adapters }
  - id: rn-09-02-no-embedded-secrets
    title: { uk: "Жодних вшитих секретів", en: "No embedded secrets" }
    kind: instructional
    minutes: 10
    objectives:
      - "Explain why any key or secret shipped inside an app binary or JS bundle must be treated as public."
      - "Replace an embedded synthetic API secret with a design where the app holds only a public identifier and a short-lived token obtained at runtime."
    subskills:
      - { family: N-07, skill: "no embedded secrets", depth: intro }
    misconceptions:
      - "A compiled native app is a binary, so nobody can read the keys inside it."
      - "Copying the API key into secure storage on first launch makes it safe to ship."
    prerequisites: [rn-09-01-secure-vs-ordinary-storage, js-16-08-secrets-storage-privacy]
    glossary: [embedded-secret, public-client]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict whether a synthetic SECRET_KEY compiled into the release bundle can be found by unpacking the app package in the labeled preview, and whether moving it into native config (Gradle properties or Info.plist) changes the answer." }
      - { kind: run-change, runtime: browser-js, summary: "Search the supplied unpacked synthetic bundle for the fake key, move the value behind the supplied mock service's token endpoint and search again." }
      - { kind: write, runtime: browser-js, summary: "Write a review note that labels each value in a supplied app config as public identifier, runtime token or server-only secret, and says where each must live." }
    retrieval:
      - { concept: "anything in a client bundle is readable by its user", from: js-16-08-secrets-storage-privacy }
  - id: rn-09-03-privacy-minimum-data
    title: { uk: "Приватність і мінімум даних", en: "Privacy and minimum data" }
    kind: instructional
    minutes: 10
    objectives:
      - "Draw a data-flow diagram for a synthetic feature showing what is collected, where each copy is stored, where it is sent and how long it is kept."
      - "Remove fields from a synthetic payload that the feature does not need and justify each removal."
    subskills:
      - { family: N-07, skill: "privacy/minimum data", depth: intro }
    misconceptions:
      - "Collecting extra data now is harmless because we might need it later."
      - "Data that never leaves the device has no privacy implications."
    prerequisites: [rn-09-02-no-embedded-secrets, rn-05-04-offline-cache-authority]
    glossary: [data-flow-diagram, data-retention]
    visual: { kind: diagram, concept: "A data-flow diagram for a synthetic 'note with photo' feature: each field (text, photo, embedded location metadata) travels from capture to cache, debug log and mock-service request; stepping highlights every place a copy exists, and removing a field erases its copies along the path." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict how many copies of the synthetic photo's location metadata exist after one 'save note' flow in the labeled preview (cache, log line, request body)." }
      - { kind: run-change, runtime: concept-preview, summary: "Strip the location metadata and the debug log line in the preview and watch the diagram's copy count drop." }
      - { kind: write, runtime: concept-preview, summary: "Write a minimal payload type for the synthetic feature with a one-line purpose and a retention period for every field it keeps." }
    retrieval:
      - { concept: "which copy is authoritative and which is only a cache", from: rn-05-04-offline-cache-authority }
  - id: rn-09-04-auth-deep-link-boundaries
    title: { uk: "Безпечні межі auth і deep links", en: "Safe auth and deep-link boundaries" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace an OAuth-style login in the system browser with PKCE and a redirect back into the app, and mark where an attacker-controlled link could enter."
      - "Explain why a deep link may select a screen but must never carry or grant credentials, and validate its parameters before acting on them."
    subskills:
      - { family: N-07, skill: "safe auth/deep-link boundaries", depth: intro }
    misconceptions:
      - "Showing the login page in an embedded web view inside my app is as safe as using the system browser."
      - "Putting the access token in a deep link is fine because only my app sees the URL."
    prerequisites: [rn-09-03-privacy-minimum-data, rn-04-06-deep-links]
    glossary: [pkce, auth-redirect, verified-app-link]
    visual: { kind: sequence, concept: "App, system browser, synthetic auth server and an attacker app exchange messages over time: the app sends a code challenge, the browser returns a one-time code through the redirect, the app redeems it with its verifier; one step shows the attacker app intercepting a look-alike redirect and failing to redeem the code because it lacks the verifier." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which of four synthetic incoming links the router should accept: a valid record route, a route carrying a token parameter, an unknown host and a malformed id." }
      - { kind: run-change, runtime: concept-preview, summary: "Turn PKCE off in the labeled sequence preview, replay the interception step, then turn it back on and compare the outcomes." }
      - { kind: write, runtime: concept-preview, summary: "Write parseIncomingLink(url) that returns a typed route or a rejection, refuses credential-like parameters and validates record ids." }
    retrieval:
      - { concept: "deep-link parameters are untrusted input", from: rn-04-06-deep-links }
  - id: rn-09-05-deny-revoke-unavailable
    title: { uk: "Відмова, відкликання й недоступність", en: "Deny, revoke and unavailable" }
    kind: instructional
    minutes: 12
    objectives:
      - "Model capability states (not asked, granted, denied, blocked, revoked, unavailable hardware) and name the UI each state needs."
      - "Re-check permission and capability state when the app returns to the foreground instead of trusting a cached grant."
    subskills:
      - { family: N-07, skill: "permission request/deny/revoke", depth: practice }
      - { family: N-07, skill: "capability/platform checks", depth: practice }
    misconceptions:
      - "A denied permission and a missing camera are the same case, so one error message covers both."
      - "If the request is denied, asking again in a loop will eventually succeed."
    prerequisites: [rn-09-04-auth-deep-link-boundaries, rn-06-06-permissions-capability-checks]
    glossary: [permission-revocation, blocked-permission]
    visual: { kind: sequence, concept: "User, app, OS permission dialog and system Settings across two runs: on a target with a camera, deny, rationale, a second deny (blocked) and a later revoke detected on return to the foreground; on a target without a camera, the capability check short-circuits before any request; each step highlights the UI mode the state reducer picks." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which screen the labeled preview shows after a deny, after a second deny (blocked) and after revoke-in-Settings followed by returning to the app." }
      - { kind: run-change, runtime: concept-preview, summary: "Drive the preview's simulated OS states (grant, deny, revoke, no camera) and replace its cached-grant check with a foreground re-check." }
      - { kind: write, runtime: concept-preview, summary: "Write a reducer over capability states that maps each to a UI mode (request, rationale, open settings, fallback) with no request loop." }
    retrieval:
      - { concept: "request a permission at the moment of use, with a fallback", from: rn-06-06-permissions-capability-checks }
      - { concept: "what changes when the app goes to the background and returns", from: rn-04-04-app-foreground-background }
  - id: rn-09-06-debug-denied-permission
    title: { uk: "Налагодження: відхилений дозвіл і відсутнє обладнання", en: "Debug: denied permission and missing device" }
    kind: local-task
    minutes: 20
    objectives:
      - "Reproduce on the declared target a seeded crash when camera permission is denied and a hang when no camera is available, using real system settings or emulator configuration."
      - "Repair both defects so the lab app shows its fallback path, and record the observed behavior as learner-confirmed evidence with the target named."
    subskills:
      - { family: N-07, skill: "permission request/deny/revoke", depth: assess }
      - { family: N-07, skill: "capability/platform checks", depth: assess }
    misconceptions: []
    prerequisites: [rn-09-05-deny-revoke-unavailable]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "On the declared emulator/device, deny the lab app's camera permission in system settings, then run it on a target without a camera (a simulator, or an emulator with the camera set to none) and record what each run shows." }
      - { kind: debug, runtime: local-native, summary: "Repair the seeded lab app, which assumes a granted result and crashes on deny and waits forever for a camera that does not exist; confirm both fixes on the target and note the target in the evidence record." }
    retrieval: []
  - id: rn-09-07-independent-capability-lab
    title: { uk: "Самостійно: синтетична лабораторія можливостей", en: "Independent: synthetic capability lab" }
    kind: assessment
    minutes: 35
    objectives:
      - "Build, without hints and on the declared target, a synthetic capability lab that keeps a fake token in secure storage, embeds no secret, sends only the minimum fields and accepts only validated incoming links."
      - "Explain in one paragraph which guarantees come from the platform, which from the library and which are your own code's responsibility."
    subskills:
      - { family: N-07, skill: "secure credential storage vs ordinary storage", depth: assess }
      - { family: N-07, skill: "no embedded secrets", depth: assess }
      - { family: N-07, skill: "privacy/minimum data", depth: assess }
      - { family: N-07, skill: "safe auth/deep-link boundaries", depth: assess }
    misconceptions: []
    prerequisites: [rn-09-06-debug-denied-permission]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-native, summary: "No-hint task on the declared target: a synthetic 'notes with photo' lab whose token lives behind a secure-storage adapter (with a failed-read path tested), whose bundle contains no secret, whose upload payload is minimal and whose link handler rejects credential-carrying and malformed links; submit learner-confirmed evidence and the platform/library limits paragraph." }
    retrieval:
      - { concept: "encoding and decoding untrusted URL parameters", from: js-16-01-url-query-encoding }
