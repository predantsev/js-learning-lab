# Syllabus spine for RN-02. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RN-02
stage: RN
title: { uk: "Нативні view, верстка й доступність", en: "Native views, layout and accessibility" }
summary:
  uk: "Учень будує нативні екрани з View, Text, Image і TextInput, верстає їх через Flexbox у незалежних від щільності одиницях, враховує безпечні зони, задає достатні зони дотику, не дає клавіатурі перекривати поля, підписує елементи для скрінрідерів і свідомо обробляє відмінності платформ — з перевіркою на заявленій цілі."
  en: "The learner builds native screens from View, Text, Image and TextInput, lays them out with Flexbox in density-independent units, respects safe areas, sizes touch targets, keeps inputs clear of the keyboard, labels controls for screen readers and handles platform differences deliberately — checked on the declared target."
competencies: [N-02]
capstoneStep:
  mode: local
  objective:
    uk: "Перенести список і форму проєкту на нативні екрани з читабельною, підписаною версткою, що враховує безпечні зони, на заявленій цілі."
    en: "Translate the capstone's list and form into native screens with readable, labeled, safe-area-aware layout on the declared target."
  variants:
    wishlist:
      uk: "Нативний список бажань із назвою, ціною або підписом «без ціни» та позначкою «отримано», а також підписана форма для назви, ціни й категорії, яку не перекривають ні виріз екрана, ні клавіатура."
      en: "A native wish list showing name, price or the no-price label and an acquired marker, plus a labeled form for name, price and category that stays clear of the notch and the keyboard."
    planner:
      uk: "Нативний список справ із назвою, терміном, позначкою пріоритету й виконання, а також підписана форма для назви, терміну й пріоритету, яку не перекривають ні виріз екрана, ні клавіатура."
      en: "A native task list showing title, due date, a priority marker and the done state, plus a labeled form for title, dueDate and priority that stays clear of the notch and the keyboard."
    habits:
      uk: "Нативний список звичок із назвою, частотою та позначкою «активна/на паузі», а також підписана форма для назви й частоти, яку не перекривають ні виріз екрана, ні клавіатура."
      en: "A native habit list showing name, frequency and an active/paused marker, plus a labeled form for name and frequency that stays clear of the notch and the keyboard."
    expenses:
      uk: "Нативний список витрат із назвою, сумою з amountMinor у гривнях, датою й категорією, а також підписана форма для назви, суми, дати й категорії, яку не перекривають ні виріз екрана, ні клавіатура."
      en: "A native expense list showing label, amountMinor formatted as UAH, date and category, plus a labeled form for label, amount, date and category that stays clear of the notch and the keyboard."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   rn-01-01-native-vs-web (boundary) ; js-06-05-flexbox-grid (Flexbox) ; js-06-01-forms-inputs-labels (labels) ; re-07-01-keyboard-crud (operability)
lessons:
  - id: rn-02-01-view-text-image-input
    title: { uk: "View, Text, Image і поля введення", en: "View, Text, Image and inputs" }
    kind: instructional
    minutes: 12
    objectives:
      - "Map web elements to native primitives (div → View, p/span → Text, img → Image with a source and a size, input → TextInput) and explain why every string must sit inside Text."
      - "Build a record card with a TextInput whose value and onChangeText are controlled by state."
    subskills:
      - { family: N-02, skill: "View/Text/Image/input", depth: intro }
    misconceptions:
      - "I can put a string straight inside a View, the way I put text inside a div."
      - "A remote Image sizes itself from the file like an <img> does, so I never need a width and height."
    prerequisites: [rn-01-08-capstone-native-subproject, rn-01-01-native-vs-web]
    glossary: [view-component, text-component, image-source, native-text-input]
    visual: { kind: diagram, concept: "A web card and its native rewrite side by side: each element box (div, h2, img, input) links to its native primitive, and stepping highlights the rules that break on native — bare text outside Text, a remote Image without dimensions, a TextInput with no value." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Before opening the labeled preview, predict which of three card variants React Native rejects or renders empty: bare text in a View, a remote Image without a size, a TextInput without a value prop." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, wrap the bare text in Text, give the Image a width and height, and bind the TextInput to state with value and onChangeText; observe each change." }
      - { kind: write, runtime: concept-preview, summary: "Write a record card component from View, Text and Image plus a controlled TextInput for the record name, using the shared formatter for the visible label." }
    retrieval:
      - { concept: "what a browser preview of native components cannot show", from: rn-01-01-native-vs-web }
  - id: rn-02-02-styling-flexbox-density
    title: { uk: "Стилі, Flexbox і щільність екрана", en: "Styling, Flexbox and density" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict a native Flexbox layout, given that the default direction is column and that styles do not cascade from parent Views (only text styles inherit inside nested Text)."
      - "Size elements in density-independent units and explain how pixel ratio and the user's font scale change what appears on screen."
    subskills:
      - { family: N-02, skill: "styling/Flexbox/density", depth: intro }
    misconceptions:
      - "Styles cascade from parent Views to their children, as they do in CSS."
      - "A width of 100 means 100 physical pixels on every phone."
    prerequisites: [rn-02-01-view-text-image-input, js-06-05-flexbox-grid]
    glossary: [density-independent-pixel, pixel-ratio, font-scale]
    visual: { kind: diagram, concept: "A record row laid out step by step: flexDirection, justifyContent and alignItems move children along the main and cross axes of a column-default container, and a density overlay converts style units to physical pixels at 1x, 2x and 3x." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict how a header, a list and a button bar arrange in a container with no flexDirection set, and how many physical pixels tall a 48-unit button is at pixel ratio 3." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, switch flexDirection, give the list flex: 1 and raise the simulated font scale to 200%; note which text clips." }
      - { kind: write, runtime: concept-preview, summary: "Style a record row with StyleSheet.create — name and value on one line, secondary text below, spacing in density-independent units — so it still reads at 200% font scale." }
    retrieval:
      - { concept: "main axis versus cross axis in Flexbox", from: js-06-05-flexbox-grid }
  - id: rn-02-03-safe-areas
    title: { uk: "Безпечні зони", en: "Safe areas" }
    kind: instructional
    minutes: 8
    objectives:
      - "Identify the regions a status bar, notch, rounded corners and home indicator can cover, and apply safe-area insets only where content would be obscured."
      - "Explain why a full-bleed background may extend under the insets while text and controls must not."
    subskills:
      - { family: N-02, skill: "safe areas", depth: intro }
    misconceptions:
      - "The screen's top-left corner is always visible and usable."
      - "Wrapping the whole app in one safe-area container fixes every screen in every orientation."
    prerequisites: [rn-02-02-styling-flexbox-density]
    glossary: [safe-area, safe-area-insets, display-cutout]
    visual: { kind: diagram, concept: "A device outline with status bar, notch and home indicator: stepping through portrait and landscape shows the inset value on each edge and which content boxes fall inside or outside the safe area." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Using the given inset values, predict which parts of a header and a bottom button bar a notch and a home indicator cover in portrait and in landscape." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview with simulated insets, apply the top and bottom insets as padding and switch orientation; note that real inset values come only from your declared target." }
      - { kind: write, runtime: concept-preview, summary: "Write a screen layout that pads only the header and the button bar by their insets while the list background runs edge to edge." }
    retrieval:
      - { concept: "overflow, zoom and content that must stay reachable", from: js-06-07-responsive-overflow-zoom-motion }
  - id: rn-02-04-touch-targets-keyboard
    title: { uk: "Зони дотику й клавіатура над полями", en: "Touch targets and keyboard avoidance" }
    kind: instructional
    minutes: 10
    objectives:
      - "Size touch targets to the platform minimum (about 44–48 units) with padding or hitSlop, without enlarging the visual."
      - "Predict when the soft keyboard covers a focused input, and keep it visible with KeyboardAvoidingView or a scrolling form."
    subskills:
      - { family: N-02, skill: "touch targets", depth: intro }
      - { family: N-02, skill: "keyboard avoidance", depth: intro }
    misconceptions:
      - "If the icon is visible, it is big enough to tap."
      - "The operating system always scrolls the focused input above the keyboard for me."
    prerequisites: [rn-02-03-safe-areas, rn-02-01-view-text-image-input]
    glossary: [touch-target, hit-slop, soft-keyboard, keyboard-avoidance]
    visual: { kind: diagram, concept: "A form screen with a bottom input: stepping through focus shows the keyboard frame rising, the covered region and how keyboard avoidance shifts or scrolls the content; an overlay draws each control's hit area against its visual size." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict whether a 24-unit delete icon meets the touch-target minimum, and whether the last field of a long form stays visible once the keyboard opens." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview with a simulated keyboard, add hitSlop to the icon and wrap the form in a keyboard-avoiding container; note that real keyboard height and behavior differ per platform and are checked on your declared target." }
      - { kind: write, runtime: concept-preview, summary: "Write a compact row whose 24-unit delete icon has a 48-unit touch target, and a form whose submit button stays reachable with the keyboard open." }
    retrieval: []
  - id: rn-02-05-accessibility-labels-focus
    title: { uk: "Мітки доступності й фокус", en: "Accessibility labels and focus" }
    kind: instructional
    minutes: 12
    objectives:
      - "Give icon-only controls an accessibilityLabel and accessibilityRole, and group a card so a screen reader announces it as one meaningful sentence."
      - "Predict the VoiceOver and TalkBack reading order of a screen, and move accessibility focus to the error after a failed save."
    subskills:
      - { family: N-02, skill: "accessibility labels/focus", depth: intro }
    misconceptions:
      - "A visible Text next to an input is announced as its label automatically, like an HTML <label for>."
      - "Screen-reader focus moves to new content on its own, so I never have to move it."
    prerequisites: [rn-02-04-touch-targets-keyboard, js-06-01-forms-inputs-labels]
    glossary: [accessibility-label, accessibility-role, voiceover, talkback]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict what a screen reader announces for an icon-only delete Pressable, a card made of three separate Text nodes and an input whose label is only a sibling Text." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, add accessibilityLabel, accessibilityRole and card grouping, then inspect the generated ARIA output; note that real VoiceOver and TalkBack announcements are checked on your declared target." }
      - { kind: write, runtime: concept-preview, summary: "Write a form-field component that gives its TextInput the visible label as its accessibility label and moves accessibility focus to the localized error when save fails." }
    retrieval:
      - { concept: "every input needs a programmatic label", from: js-06-01-forms-inputs-labels }
      - { concept: "every CRUD action operable without a pointer", from: re-07-01-keyboard-crud }
  - id: rn-02-06-platform-differences
    title: { uk: "Відмінності платформ", en: "Platform differences" }
    kind: instructional
    minutes: 10
    objectives:
      - "Branch with Platform.OS or Platform.select only for genuine platform differences (shadow versus elevation, back affordance, keyboard types, fonts) and keep the shared layout shared."
      - "Choose between an inline platform check and a platform-specific file (.ios.tsx / .android.tsx) for a component, and justify the choice."
    subskills:
      - { family: N-02, skill: "platform differences", depth: intro }
    misconceptions:
      - "Android and iOS render the same component identically, so testing on one of them is enough."
      - "Every platform difference needs its own Platform.OS check scattered through the component."
    prerequisites: [rn-02-05-accessibility-labels-focus, rn-02-02-styling-flexbox-density]
    glossary: [platform-select, platform-specific-file]
    visual: { kind: diagram, concept: "One card component resolved for two platforms: stepping through module resolution shows card.ios.tsx or card.android.tsx being picked, and a Platform.select style object resolving to shadow props on iOS and elevation on Android." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which values Platform.select picks in the preview (web), on Android and on iOS, and which file the bundler resolves for card.tsx with .ios and .android siblings." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, switch the simulated Platform.OS value and watch the selected styles change; note that the preview's web branch is a third platform, not a stand-in for either device." }
      - { kind: write, runtime: concept-preview, summary: "Write a card shadow with Platform.select — shadow props on iOS, elevation on Android — without duplicating the card's layout code." }
    retrieval: []
  - id: rn-02-07-debug-clipped-layout
    title: { uk: "Налагодження: обрізане поле, заголовок під вирізом екрана, відсутня мітка", en: "Debug: clipped input, unsafe area, missing label" }
    kind: local-task
    minutes: 20
    objectives:
      - "Reproduce three seeded defects on the declared target: an input clipped at large font scale, a header under the status bar or notch, and an unlabeled icon button."
      - "Repair each defect and confirm the fix on the declared target with a screen reader on and an enlarged font size."
    subskills:
      - { family: N-02, skill: "styling/Flexbox/density", depth: assess }
      - { family: N-02, skill: "safe areas", depth: assess }
      - { family: N-02, skill: "accessibility labels/focus", depth: assess }
    misconceptions: []
    prerequisites: [rn-02-06-platform-differences]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Run the seeded screen on your declared target with the system font size enlarged and a screen reader on, and record each of the three defects you observe — or mark the task unperformed." }
      - { kind: debug, runtime: local-native, summary: "Repair the fixed-height input that clips at large font scale, apply the missing top inset and label the icon-only button; confirm each repair on your declared target." }
    retrieval:
      - { concept: "debugging lost focus and missing labels", from: js-06-14-debug-dom-defects }
  - id: rn-02-08-independent-native-screens
    title: { uk: "Самостійно: читабельні підписані нативні екрани", en: "Independent: readable labeled native screens" }
    kind: assessment
    minutes: 35
    objectives:
      - "Build, without hints, a readable labeled list screen and form screen on the declared target that pass the large-font, screen-reader and both-orientation checks, with one justified platform difference."
    subskills:
      - { family: N-02, skill: "View/Text/Image/input", depth: assess }
      - { family: N-02, skill: "platform differences", depth: assess }
    misconceptions: []
    prerequisites: [rn-02-07-debug-clipped-layout]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-native, summary: "No-hint task: build a synthetic library-catalog list and its create form from View, Text, Image and TextInput on your declared target, pass the checklist (labels announced, no clipping at large font, safe areas respected, keyboard clear) and justify one Platform.select use." }
    retrieval:
      - { concept: "an accessible CRUD UI built without hints", from: js-06-15-independent-crud-ui }
  - id: rn-02-09-capstone-native-screens
    title: { uk: "Проєкт: нативні екрани списку й форми", en: "Capstone: native list and form screens" }
    kind: capstone-step
    minutes: 40
    objectives:
      - "Translate the capstone list and form into native screens inside native/ with labeled controls, safe-area-aware layout and keyboard-clear inputs, verified on the declared target."
    subskills:
      - { family: N-02, skill: "accessibility labels/focus", depth: practice }
    misconceptions: []
    prerequisites: [rn-02-08-independent-native-screens, rn-01-08-capstone-native-subproject]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-native, summary: "Inside native/ in the exported workspace, build the record list and the create form on the shared formatter and validation, with labeled inputs, an inset-aware header and a keyboard-clear submit button; check them on your declared target and commit." }
    retrieval:
      - { concept: "the capstone's accessible cards and form on the web", from: js-06-16-capstone-ui }
