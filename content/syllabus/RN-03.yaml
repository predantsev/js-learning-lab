# Syllabus spine for RN-03. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RN-03
stage: RN
title: { uk: "Нативний CRUD, списки й платформні адаптери", en: "Native CRUD, lists and platform adapters" }
summary:
  uk: "Учень без змін перевикористовує стан React, hooks і спільний доменний код у нативних екранах, ізолює зберігання, форматування й годинник за платформними адаптерами, налаштовує введення тексту й поведінку клавіатури, показує довгі списки через FlatList зі стабільними ключами та зберігає миттєвий відгук на дотик, розрізняючи роботу потоку JS і потоку UI."
  en: "The learner reuses React state, hooks and the shared domain code unchanged in native screens, isolates storage, formatting and the clock behind platform adapters, configures text input and keyboard behavior, renders long lists with FlatList and stable keys, and keeps touch feedback immediate by telling JS-thread work from UI-thread work."
competencies: [N-01, N-02, N-04]
capstoneStep:
  mode: local
  objective:
    uk: "Побудувати нативний CRUD проєкту з віртуалізованим списком і платформним адаптером зберігання та форматування, перевикористовуючи чистий доменний код без змін."
    en: "Build native CRUD for the capstone with a virtualized list and a platform storage/formatting adapter, reusing the pure domain code unchanged."
  variants:
    wishlist:
      uk: "Створення, редагування, позначка «отримано» й видалення бажань у FlatList з ключем id; ціни форматуються через платформний адаптер форматування, а записи зберігаються через адаптер сховища."
      en: "Create, edit, toggle acquired and remove wishes in a FlatList keyed by id, with prices formatted through a platform formatting adapter and records saved through a storage adapter."
    planner:
      uk: "Створення, редагування, позначка «виконано» й видалення справ у FlatList з ключем id; термін показується через платформний адаптер форматування дат, а записи зберігаються через адаптер сховища."
      en: "Create, edit, toggle done and remove tasks in a FlatList keyed by id, with dueDate shown through a platform date-formatting adapter and records saved through a storage adapter."
    habits:
      uk: "Створення, редагування, призупинення й відновлення, а також видалення звичок у FlatList з ключем id; сьогоднішнє виконання додається до completions спільною доменною функцією з датою від адаптера годинника, а записи зберігаються через адаптер сховища."
      en: "Create, edit, pause/resume (active) and remove habits in a FlatList keyed by id, adding today's date to completions through the shared domain function with today supplied by a clock adapter and records saved through a storage adapter."
    expenses:
      uk: "Створення, редагування й видалення витрат у FlatList з ключем id; amountMinor форматується в гривнях через платформний адаптер форматування, а підсумки за категоріями рахує незмінний доменний код."
      en: "Create, edit and remove expenses in a FlatList keyed by id, with amountMinor formatted as UAH through a platform formatting adapter and category totals computed by the unchanged domain code."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-02-06-controlled-inputs-typed-events (controlled inputs) ; rn-02-04-touch-targets-keyboard (keyboard) ; re-01-05-keys-identity (keys) ; js-11-07-inheritance-vs-composition (adapter composition)
lessons:
  - id: rn-03-01-state-hooks-reuse
    title: { uk: "Стан і hooks у нативному застосунку", en: "Reusing state and hooks natively" }
    kind: instructional
    minutes: 10
    objectives:
      - "Reuse the capstone's typed reducer and data hook in a native screen without editing them, and point to the only lines that differ: the rendered primitives."
      - "Trace a dispatch through render, commit and effects on native and predict that the state-snapshot rules are the same as in React DOM."
    subskills:
      - { family: N-01, skill: "TS/domain reuse", depth: practice }
    misconceptions:
      - "React Native has its own state system, so useState and useReducer behave differently on a phone."
      - "A custom hook that touches localStorage can be imported into native unchanged, because hooks are just React."
    prerequisites: [rn-02-09-capstone-native-screens, re-04-06-custom-hooks]
    glossary: []
    visual: { kind: render-timeline, concept: "An add action dispatched in a native screen: the shared reducer returns a new list, render produces new View/Text elements, commit updates the platform views and the persistence effect runs — the same timeline as in the web client, with only the commit target changed." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict how many renders occur and which state snapshot a native list screen sees after two quick toggle dispatches through the shared reducer." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, plug the shared reducer into a native list screen, dispatch actions and compare the render timeline with the one from the web client." }
      - { kind: write, runtime: concept-preview, summary: "Write a native list screen that uses the unchanged shared reducer and a data hook that receives its storage as a parameter, replacing only the web elements with View, Text and Pressable." }
    retrieval:
      - { concept: "state is a snapshot per render", from: re-02-02-state-snapshots }
  - id: rn-03-02-platform-adapters
    title: { uk: "Платформні адаптери", en: "Platform adapters" }
    kind: instructional
    minutes: 12
    objectives:
      - "Define small typed adapter interfaces (storage, formatting, clock) that the domain and hooks depend on, with one web and one native implementation of each."
      - "Explain why passing an adapter in (composition) keeps domain code testable, while subclassing or Platform.OS checks inside domain functions do not."
    subskills:
      - { family: N-01, skill: "platform adapters", depth: intro }
    misconceptions:
      - "Platform differences are best handled with if (Platform.OS === …) checks inside the domain functions."
      - "An adapter is pointless indirection; calling the native storage module directly from the hook is just as easy to test."
    prerequisites: [rn-03-01-state-hooks-reuse, js-11-07-inheritance-vs-composition]
    glossary: [platform-adapter, adapter-contract]
    visual: { kind: diagram, concept: "The adapter seam: domain functions and the data hook depend on typed StorageAdapter, FormatAdapter and ClockAdapter interfaces; stepping swaps the web implementation for the native one and then for an in-memory test double while the domain boxes stay unchanged." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict what changes on a preview screen when its storage adapter is swapped from the web implementation to an in-memory double: the rendered list, the domain calls, or neither." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, swap the web adapter for the in-memory one and back, and confirm the screen output and the domain functions are untouched." }
      - { kind: write, runtime: browser-js, summary: "Implement a typed in-memory StorageAdapter and a FormatAdapter for the capstone's displayed value that pass the supplied contract tests, with no platform import." }
    retrieval:
      - { concept: "composition over inheritance for adapters", from: js-11-07-inheritance-vs-composition }
  - id: rn-03-03-text-input-keyboard
    title: { uk: "Введення тексту й поведінка клавіатури", en: "Text input and keyboard behavior" }
    kind: instructional
    minutes: 12
    objectives:
      - "Configure a TextInput for its data (keyboardType, autoCapitalize, returnKeyType) and move focus to the next field on submit."
      - "Keep the focused field and the save button visible above the keyboard in a scrolling form, and dismiss the keyboard on save or on a tap outside."
    subskills:
      - { family: N-02, skill: "keyboard avoidance", depth: practice }
    misconceptions:
      - "keyboardType='numeric' guarantees the value is a valid number."
      - "onChangeText hands me the same event object as a web onChange handler."
    prerequisites: [rn-03-02-platform-adapters, rn-02-04-touch-targets-keyboard]
    glossary: [keyboard-type, return-key-type, keyboard-dismiss]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict the stored value after typing '12,50' into a numeric-keyboard amount field that is not parsed, and which field receives focus after the return key." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, set keyboardType, returnKeyType and onSubmitEditing to chain focus through three fields; note that the on-screen keyboard itself appears only on your declared target." }
      - { kind: write, runtime: concept-preview, summary: "Write a controlled amount field that keeps the raw text the learner typed, parses it through the shared validation function and shows the localized error." }
    retrieval:
      - { concept: "controlled inputs and typed change events", from: re-02-06-controlled-inputs-typed-events }
      - { concept: "keeping the focused field above the keyboard", from: rn-02-04-touch-targets-keyboard }
  - id: rn-03-04-flatlist-keys
    title: { uk: "Віртуалізовані списки й ключі", en: "Virtualized lists and keys" }
    kind: instructional
    minutes: 12
    objectives:
      - "Render a long record list with FlatList (data, renderItem, keyExtractor) and explain why only a window of rows is mounted at any moment."
      - "Predict what happens to row state, such as half-typed text, when keys are indexes and a record is inserted at the top."
    subskills:
      - { family: N-04, skill: "virtualized lists/keys", depth: intro }
    misconceptions:
      - "Mapping a long list inside a ScrollView is fine, because only the visible rows are drawn."
      - "The index is a fine key for a FlatList, because the list handles identity itself."
    prerequisites: [rn-03-03-text-input-keyboard, re-01-05-keys-identity, re-07-05-long-lists-windowing]
    glossary: [flatlist, key-extractor]
    visual: { kind: diagram, concept: "A 1,000-record list behind a viewport: scrolling steps show rows mounting inside the render window and unmounting outside it while each row's key ties its state to a record id; switching keys to indexes shows a half-typed edit jumping to the wrong record after an insert." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict how many rows a FlatList mounts for 1,000 synthetic records versus a ScrollView with map, and which row keeps a half-typed edit after an insert when keys are indexes." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, switch keyExtractor from the index to the record id, insert a record at the top and watch the half-typed edit stay with its record." }
      - { kind: write, runtime: concept-preview, summary: "Write a FlatList of capstone records with keyExtractor by id, an empty-state component and an item separator, reusing the record card from RN-02." }
    retrieval:
      - { concept: "keys tie component state to identity", from: re-01-05-keys-identity }
      - { concept: "list windowing", from: re-07-05-long-lists-windowing }
  - id: rn-03-05-touch-js-vs-ui
    title: { uk: "Дотики та робота JS проти UI", en: "Touch interaction and JS vs UI work" }
    kind: instructional
    minutes: 10
    objectives:
      - "Explain that event handlers and React rendering run on the JS thread while native scrolling and drawing run on the UI thread, and predict what a long synchronous onPress handler does to pressed feedback."
      - "Move heavy work out of a press handler (defer, split or precompute) so the pressed state appears at once and the touch target still meets the minimum."
    subskills:
      - { family: N-04, skill: "JS vs UI work", depth: intro }
      - { family: N-02, skill: "touch targets", depth: practice }
    misconceptions:
      - "If my onPress handler is slow, only that button is affected."
      - "Native apps are always smooth, so JavaScript performance does not matter on a phone."
    prerequisites: [rn-03-04-flatlist-keys, js-08-01-timers-and-the-event-loop]
    glossary: [pressable, js-thread, ui-thread]
    visual: { kind: diagram, concept: "Two lanes, JS thread and UI thread, over one tap: stepping shows the touch event crossing to JS, a synchronous onPress handler occupying the JS lane and the pressed-style update waiting behind it, while a native ScrollView keeps scrolling on the UI lane." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict whether a Pressable's pressed style appears before or after a handler that synchronously sorts 50,000 synthetic records." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, move the sort into a deferred step and compare when the pressed style appears; note that preview timing comes from the browser's main thread, not the device's JS and UI threads." }
      - { kind: write, runtime: concept-preview, summary: "Write a list row with a Pressable whose touch target meets the minimum, shows pressed feedback immediately and defers the expensive summary recalculation." }
    retrieval:
      - { concept: "a long synchronous task blocks the event loop", from: js-08-01-timers-and-the-event-loop }
  - id: rn-03-06-debug-list-identity-keyboard
    title: { uk: "Налагодження: ідентичність рядків і клавіатура над полем", en: "Debug: list identity and keyboard overlap" }
    kind: local-task
    minutes: 20
    objectives:
      - "Reproduce on the declared target a seeded list where an edit jumps to another row after a delete, and a form whose last field hides under the keyboard."
      - "Repair both and confirm on the declared target that row state follows its record and every field stays visible while typing."
    subskills:
      - { family: N-04, skill: "virtualized lists/keys", depth: assess }
      - { family: N-02, skill: "keyboard avoidance", depth: assess }
    misconceptions: []
    prerequisites: [rn-03-05-touch-js-vs-ui]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Run the seeded CRUD screen on your declared target, delete one record while editing another and focus the last form field, and record what you observe — or mark the task unperformed." }
      - { kind: debug, runtime: local-native, summary: "Repair the index-based keyExtractor and the missing keyboard avoidance in the scrolling form; confirm both fixes on your declared target." }
    retrieval:
      - { concept: "debugging bad keys", from: re-01-08-debug-keys-side-effects }
  - id: rn-03-07-independent-native-crud
    title: { uk: "Самостійно: нативний CRUD на спільному домені", en: "Independent: native CRUD reusing the domain" }
    kind: assessment
    minutes: 40
    objectives:
      - "Build, without hints, native CRUD for a synthetic domain that imports its pure domain module unchanged, injects storage and formatting through adapters and meets touch-target minimums on the declared target."
    subskills:
      - { family: N-01, skill: "TS/domain reuse", depth: assess }
      - { family: N-01, skill: "platform adapters", depth: assess }
      - { family: N-02, skill: "touch targets", depth: assess }
    misconceptions: []
    prerequisites: [rn-03-06-debug-list-identity-keyboard]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "In-course part: make the supplied adapter contract tests pass for your in-memory and formatting adapters for a synthetic reading-list domain, without touching its domain module." }
      - { kind: independent, runtime: local-native, summary: "No-hint task: native create/edit/delete for the synthetic reading-list domain with its domain module unchanged, native adapters behind the same contract, a keyed FlatList and touch targets at the platform minimum, checked on your declared target." }
    retrieval:
      - { concept: "class and compositional adapters", from: js-11-09-independent-adapters }
  - id: rn-03-08-capstone-native-crud
    title: { uk: "Проєкт: нативний CRUD", en: "Capstone: native CRUD" }
    kind: capstone-step
    minutes: 45
    objectives:
      - "Implement create, edit, status toggle and remove for the capstone in native/ with a keyed FlatList and platform adapters, keeping the shared domain code unchanged."
    subskills:
      - { family: N-04, skill: "virtualized lists/keys", depth: practice }
    misconceptions: []
    prerequisites: [rn-03-07-independent-native-crud, rn-02-09-capstone-native-screens]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-native, summary: "Inside native/ in the exported workspace, wire the shared reducer and validation to a keyed FlatList and the create/edit form, inject native storage, formatting and clock adapters, run the domain tests unchanged and check CRUD on your declared target; commit." }
    retrieval:
      - { concept: "the capstone's typed reducer and data hook", from: re-04-09-capstone-data-hook }
