# Syllabus spine for RE-10. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RE-10
stage: RE
title: { uk: "Suspense, transitions і сучасний React", en: "Suspense, transitions and modern React" }
summary:
  uk: "Учень ліниво завантажує маршрут із власною локальною межею Suspense, зберігає чуйність введення завдяки transitions, пояснює конкурентний рендеринг як роботу в одному потоці, яку React може перервати й почати знову, читає позначені версією form actions та оптимістичні API React 19, розрізняє компілятор і застарілі API та обґрунтовує кожен сучасний API встановленою версією."
  en: "The learner lazy-loads a route behind a scoped Suspense boundary, keeps typing responsive with transitions, explains concurrent rendering as interruptible work on one thread, reads version-labeled React 19 form actions and optimistic APIs, tells the compiler and legacy APIs apart, and justifies each modern API against the installed version."
competencies: [R-08]
capstoneStep:
  mode: local
  objective:
    uk: "Ліниво завантажити один маршрут проєкту через Suspense і позначити фільтр як transition; перевірити, що стани очікування й помилки лишаються чуйними на підтримуваному toolchain."
    en: "Lazy-load one capstone route with Suspense and mark the filter as a transition; verify pending/error responsiveness on the supported toolchain."
  variants:
    wishlist:
      uk: "Ліниво завантажити маршрут підсумків (сума цін бажаного й кількість бажань без ціни) з власним fallback Suspense та залишити введення в пошуку за `name` терміновим, поки відфільтрований список бажань оновлюється в transition."
      en: "Lazy-load the totals route (wanted price total and unpriced count) behind its own Suspense fallback, and keep typing in the `name` search urgent while the filtered item list updates in a transition."
    planner:
      uk: "Ліниво завантажити маршрут огляду справ на сьогодні з власним fallback Suspense та залишити введення в пошуку за `title` терміновим, поки відфільтрований список справ оновлюється в transition."
      en: "Lazy-load the due-today overview route behind its own Suspense fallback, and keep typing in the `title` search urgent while the filtered task list updates in a transition."
    habits:
      uk: "Ліниво завантажити маршрут серій (частка виконань і серія для кожної звички, сьогоднішній день передається параметром) з власним fallback Suspense та залишити введення в пошуку за `name` терміновим, поки відфільтрований список звичок оновлюється в transition."
      en: "Lazy-load the streaks route (completion rate and streak per habit, today passed in) behind its own Suspense fallback, and keep typing in the `name` search urgent while the filtered habit list updates in a transition."
    expenses:
      uk: "Ліниво завантажити маршрут підсумків за категоріями (суми в `amountMinor`) з власним fallback Suspense та залишити введення в пошуку за `label` терміновим, поки відфільтрований список витрат оновлюється в transition."
      en: "Lazy-load the category totals route (totals in `amountMinor`) behind its own Suspense fallback, and keep typing in the `label` search urgent while the filtered expense list updates in a transition."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-06-03-loading-retry (loading) ; re-02-03-updater-queue-batching (batching) ; js-08-04-microtasks-vs-tasks (scheduling) ; js-07-07-live-bindings-dynamic-import (dynamic import)
lessons:
  - id: re-10-01-lazy-suspense
    title: { uk: "lazy і Suspense", en: "lazy and Suspense" }
    kind: instructional
    minutes: 12
    objectives:
      - "Split a route component with lazy(() => import(...)) and place a Suspense boundary so only that region shows a fallback while its code loads."
      - "Name the supported sources of suspension (lazy code, Suspense-enabled data sources, use() with a cached promise in React 19) and explain why a fetch inside an effect never suspends."
    subskills:
      - { family: R-08, skill: "Suspense supported data/code patterns", depth: intro }
    misconceptions:
      - "Wrapping a component in Suspense makes the fetch in its useEffect show the fallback."
      - "One Suspense boundary at the app root is the best default."
    prerequisites: [js-07-07-live-bindings-dynamic-import, re-05-01-routing-basics, re-06-03-loading-retry]
    glossary: [lazy-component, suspense-boundary, suspense-fallback]
    visual: { kind: render-timeline, concept: "Navigating to a lazy stats route: the render suspends on the unloaded module, the nearest boundary commits its fallback, the import resolves, React retries the render and commits the stats view while the list layout stays on screen." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what stays on screen while the lazy stats route loads, with the boundary around the route outlet versus around the whole app." }
      - { kind: run-change, runtime: browser-react, summary: "Slow the module load with the course's import-delay control, move the Suspense boundary inward and observe which region shows the fallback." }
      - { kind: write, runtime: browser-react, summary: "Write a lazily loaded StatsPanel with a Suspense fallback that carries an accessible loading label." }
    retrieval:
      - { concept: "dynamic import returns a promise for a module", from: js-07-07-live-bindings-dynamic-import }
  - id: re-10-02-transitions
    title: { uk: "Transitions: термінові й нетермінові оновлення", en: "Transitions: urgent vs non-urgent" }
    kind: instructional
    minutes: 12
    objectives:
      - "Mark a non-urgent state update with useTransition so typing stays responsive while a slow list re-renders."
      - "Predict what isPending reports and which value the input shows during a pending transition."
    subskills:
      - { family: R-08, skill: "transitions/urgent vs nonurgent state", depth: intro }
    misconceptions:
      - "startTransition makes the update faster or debounces it."
      - "The input's own value can go inside the transition too."
    prerequisites: [re-10-01-lazy-suspense, re-02-03-updater-queue-batching, re-07-02-profiling-render-causes]
    glossary: [urgent-update, non-urgent-update, use-transition]
    visual: { kind: render-timeline, concept: "Typing four characters over a slow 5,000-record list: each keystroke commits the input at once, while the list render in the transition is interrupted and restarted, with isPending true until the last list render commits." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict the input's value and the list's contents after three fast keystrokes when the list update is and is not wrapped in startTransition." }
      - { kind: run-change, runtime: browser-react, summary: "Profile typing with the list update urgent, wrap it in startTransition, profile again and add a pending indicator from isPending." }
      - { kind: write, runtime: browser-react, summary: "Write the filter so the query text stays urgent and the list's query runs in a transition, dimming the stale results while pending." }
    retrieval:
      - { concept: "batching and the update queue", from: re-02-03-updater-queue-batching }
  - id: re-10-03-concurrent-model
    title: { uk: "Ментальна модель конкурентного рендерингу", en: "The concurrent rendering mental model" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain concurrent rendering as React preparing, pausing, abandoning and restarting renders on the single main thread, and committing only finished results."
      - "Predict why render must stay pure under concurrency: side effects done during an abandoned render still happened."
    subskills:
      - { family: R-08, skill: "concurrent rendering mental model", depth: intro }
    misconceptions:
      - "Concurrent React runs components in parallel on several threads."
      - "Every render that starts ends up on the screen."
    prerequisites: [re-10-02-transitions, js-08-04-microtasks-vs-tasks, re-01-07-purity-in-render]
    glossary: [concurrent-rendering, interruptible-render]
    visual: { kind: render-timeline, concept: "One main-thread track: a transition render of the list is in progress, an urgent keystroke interrupts it, the partial render is abandoned, the urgent update commits, then the transition restarts and commits; a counter mutated during render shows how many abandoned renders still ran." }
    analogy: "One cook working on a large catering tray drops it the moment a single urgent order arrives, serves that order, then starts the tray again; diners only ever see finished plates (limit: a real cook keeps the half-made tray, while React may throw an unfinished render away entirely, so anything that render did to the outside world is not undone)."
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict how many times a render-time console.log runs versus how many commits happen for three fast keystrokes under a transition." }
      - { kind: run-change, runtime: browser-react, summary: "Run the instrumented example, compare the render log with the committed renders, then move a side effect out of render into an effect." }
      - { kind: write, runtime: browser-react, summary: "Rewrite a component that pushes into a module-level array during render so that abandoned renders leave no trace." }
    retrieval:
      - { concept: "one task at a time on the main thread", from: js-08-04-microtasks-vs-tasks }
      - { concept: "render must be pure", from: re-01-07-purity-in-render }
  - id: re-10-04-modern-form-actions-awareness
    title: { uk: "Огляд: form actions і оптимістичні API", en: "Awareness: form actions and optimistic APIs" }
    kind: instructional
    minutes: 10
    objectives:
      - "Read a React 19 form that uses an action function, useActionState and useOptimistic, and map each part to the manual pattern built in RE-06."
      - "Label each API with the React version that ships it and check that label against the project's installed version before using it."
    subskills:
      - { family: R-08, skill: "modern form/action/optimistic APIs awareness", depth: intro }
    misconceptions:
      - "useOptimistic removes the need for error handling and a failure message."
      - "Any API from a tutorial works in my project as long as it says React."
    prerequisites: [re-10-03-concurrent-model, re-06-06-optimistic-rollback, re-05-03-forms-controlled-uncontrolled]
    glossary: [form-action, use-action-state, use-optimistic, version-label]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict what the list shows while a form action is pending and after it rejects, given useOptimistic and a fixture that fails." }
      - { kind: run-change, runtime: browser-react, summary: "Run the version-labeled React 19 example, make the fixture fail and watch the optimistic value revert when the action settles." }
      - { kind: write, runtime: browser-react, summary: "Rewrite one manual optimistic toggle from RE-06 with useOptimistic, keep an explicit announced failure message, and add a comment stating the minimum React version." }
    retrieval:
      - { concept: "manual optimistic update and rollback", from: re-06-06-optimistic-rollback }
  - id: re-10-05-compiler-legacy
    title: { uk: "Компілятор і застарілі API: як їх розрізняти", en: "Compiler and legacy API distinctions" }
    kind: instructional
    minutes: 10
    objectives:
      - "Explain what the React Compiler can memoize automatically and why it does not excuse impure render or rules-of-hooks violations."
      - "Recognize legacy APIs in existing code (class components with lifecycle methods, ReactDOM.render, forwardRef, defaultProps on function components) and name the current replacement and the version where each changed."
    subskills:
      - { family: R-08, skill: "compiler and legacy API distinctions", depth: intro }
    misconceptions:
      - "With the compiler on, I no longer need to think about purity or identity."
      - "Class components are an old React that no longer runs."
    prerequisites: [re-10-04-modern-form-actions-awareness, re-07-04-memoization-when-measured, js-11-05-classes-private-static]
    glossary: [react-compiler, legacy-api, class-component]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Predict which of four snippets the compiler cannot safely optimize: a mutation during render, a conditional hook, a pure list, a hand-written useMemo." }
      - { kind: run-change, runtime: browser-react, summary: "Run a legacy class component next to its function rewrite and turn one lifecycle pair into an effect with cleanup." }
      - { kind: write, runtime: browser-react, summary: "Write a function-component replacement for a legacy class using componentDidMount and componentWillUnmount, keeping a provided behavior test green." }
    retrieval:
      - { concept: "class fields and methods", from: js-11-05-classes-private-static }
  - id: re-10-06-debug-misplaced-suspense
    title: { uk: "Налагодження: невдало розміщений Suspense і хибні припущення про transitions", en: "Debug: misplaced Suspense and transition assumptions" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose a Suspense boundary placed so high that the whole layout blanks on navigation, and a transition wrapped around an input's own value."
      - "Repair both and confirm in the timeline that the input stays responsive and the surrounding layout stays visible."
    subskills:
      - { family: R-08, skill: "Suspense supported data/code patterns", depth: assess }
      - { family: R-08, skill: "transitions/urgent vs nonurgent state", depth: assess }
    misconceptions:
      - "If a fallback appears, the Suspense boundary must be in the right place."
    prerequisites: [re-10-05-compiler-legacy]
    glossary: []
    visual: { kind: render-timeline, concept: "The seeded app replayed: navigation swaps the whole layout for the root fallback and typing lags because the input value itself is in a transition; after the fix only the route region shows a fallback and each keystroke commits urgently." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-react, summary: "Before running, predict which region blanks on navigation and why the input lags in the seeded app." }
      - { kind: run-change, runtime: browser-react, summary: "Run the seeded app with the import-delay and slow-list controls and record what the timeline shows." }
      - { kind: debug, runtime: browser-react, summary: "Move the boundary to the route outlet, keep the input urgent and the list in a transition, and remove a Suspense wrapper around an effect-based fetch that never suspends." }
    retrieval:
      - { concept: "showing old data while refetching versus a blank loading state", from: re-06-03-loading-retry }
  - id: re-10-07-independent-pending-error-flow
    title: { uk: "Самостійно: чуйний потік очікування й помилок", en: "Independent: responsive pending/error flow" }
    kind: assessment
    minutes: 30
    objectives:
      - "Build, without hints, a lazy route with a scoped fallback, a transition filter with a pending indicator and an error path with retry, and justify every modern API against the installed React version."
    subskills:
      - { family: R-08, skill: "concurrent rendering mental model", depth: assess }
      - { family: R-08, skill: "modern form/action/optimistic APIs awareness", depth: assess }
      - { family: R-08, skill: "compiler and legacy API distinctions", depth: assess }
    misconceptions: []
    prerequisites: [re-10-06-debug-misplaced-suspense]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-react, summary: "No-hint task: in a synthetic catalog app, add a lazy details route, a responsive transition filter over 5,000 items and a failing-module/failing-request path with retry; submit a recording showing typing stays responsive and a version note justifying each API from the installed React version." }
    retrieval:
      - { concept: "error boundaries catch render-time failures", from: re-05-07-error-boundaries-limits }
  - id: re-10-08-capstone-transition
    title: { uk: "Проєкт: лінивий маршрут і transition", en: "Capstone: lazy route and transition" }
    kind: capstone-step
    minutes: 25
    objectives:
      - "Lazy-load one capstone route behind a scoped Suspense boundary and run the filter's list update as a transition, verified locally with a recording and a failing-load check."
    subskills:
      - { family: R-08, skill: "transitions/urgent vs nonurgent state", depth: practice }
    misconceptions: []
    prerequisites: [re-10-07-independent-pending-error-flow]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "In VS Code, lazy-load the summary route behind a scoped boundary, move the filter's list update into a transition with a pending indicator, and verify on the local dev server with a Profiler recording." }
      - { kind: run-change, runtime: local-web, summary: "Break the lazy import path locally to simulate a failed load, confirm the error boundary and retry appear, restore it and commit with a version note." }
    retrieval:
      - { concept: "capstone routes with loading and error states", from: re-05-10-capstone-routes }
