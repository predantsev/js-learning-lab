# Syllabus spine for NO-01. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: NO-01
stage: NO
title: { uk: "Середовище Node: скрипти, модулі й події", en: "The Node runtime: scripts, modules and events" }
summary:
  uk: "Учень запускає типізовані Node-скрипти, що читають перевірену конфігурацію з env і аргументів, пояснює, які API є в Node, але не в браузері (і навпаки), розв’язує імпорти ESM/CJS, передбачає порядок nextTick, промісів, таймерів і setImmediate, обробляє помилки EventEmitter і прибирає зайві listeners."
  en: "The learner runs typed Node scripts that read validated config from env and arguments, explains which APIs exist in Node but not in the browser (and the reverse), resolves ESM/CJS imports, predicts the order of nextTick, promise, timer and setImmediate callbacks, handles EventEmitter errors and removes listeners it no longer needs."
competencies: [B-01]
capstoneStep:
  mode: local
  objective:
    uk: "Створити в робочому просторі теку server/ з типізованим Node-скриптом, який завантажує спільні фікстури домену, читає конфігурацію з env і друкує підсумок; запустити його локально."
    en: "Create server/ in the workspace with a typed Node script that loads the shared domain fixtures, reads config from env and prints a summary; run it locally."
  variants:
    wishlist:
      uk: "Скрипт завантажує фікстури бажань, читає з env LOCALE (uk або en, за замовчуванням uk) і друкує кількість бажань, загальну ціну ще не отриманих бажань, що мають ціну, і скільки таких бажань без ціни."
      en: "A script that loads the wish fixtures, reads LOCALE (uk or en, default uk) from env and prints the item count, the total price of wanted items that have a price and how many wanted items have no price."
    planner:
      uk: "Скрипт завантажує фікстури справ, читає з env TODAY (перевірену дату YYYY-MM-DD) і LOCALE та друкує, скільки невиконаних справ мають термін цього дня або раніше, разом з їхніми назвами."
      en: "A script that loads the task fixtures, reads TODAY (a validated YYYY-MM-DD) and LOCALE from env and prints how many pending tasks are due on or before that day, with their titles."
    habits:
      uk: "Скрипт завантажує фікстури звичок, читає з env TODAY і LOCALE та друкує для кожної активної звички кількість виконань до цього дня і серію з функції streakOf вебзастосунку (ще не виконаний сьогоднішній день серію не обриває)."
      en: "A script that loads the habit fixtures, reads TODAY and LOCALE from env and prints each active habit’s completion count up to that day and its streak from the web app’s streakOf (a day not completed yet does not break the streak)."
    expenses:
      uk: "Скрипт завантажує фікстури витрат, читає з env LOCALE і друкує суму за кожною категорією та загальну суму, обчислені в цілих копійках і відформатовані лише для показу."
      en: "A script that loads the expense fixtures, reads LOCALE from env and prints the total per category and the overall total, computed in integer minor units and formatted only for display."
# Retrieval plan: js-08-01-timers-and-the-event-loop (event loop) ; js-07-08-cjs-and-load-failures (CJS) ; js-14-07-modules-type-imports (TS modules) ; js-13-06-cleanup-listeners-timers (listeners)
lessons:
  - id: no-01-01-node-vs-browser
    title: { uk: "Node і браузер: два середовища для одного JavaScript", en: "Node vs browser" }
    kind: instructional
    minutes: 12
    objectives:
      - "Sort document, localStorage, fetch, process, fs, setTimeout and URL into browser-only, Node-only and both, and predict what referencing each in the other runtime does."
      - "Explain why a Node script has no page, no DOM and no same-origin sandbox, yet can read files and open network connections with the user’s permissions."
    subskills:
      - { family: B-01, skill: "Node vs browser APIs", depth: intro }
    misconceptions:
      - "Node is a browser without a window, so DOM code just runs headless."
      - "Code running in Node is sandboxed like a page, so it cannot touch my files."
    prerequisites: [js-15-03-node-and-package-manifest, js-06-08-dom-query-create-update]
    glossary: [host-api]
    visual: { kind: diagram, concept: "One JavaScript engine with two hosts around it: the language core (objects, promises, JSON) sits in the shared center, browser host APIs (DOM, localStorage, same-origin fetch) on one side and Node host APIs (process, fs, net) on the other; each probed identifier lights up the box that provides it." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Before running, commit to what typeof document, typeof process, typeof fetch and typeof localStorage print in the isolated Node child." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the probe script in the real Node child, then add a line that reads document.title and read the ReferenceError it throws." }
      - { kind: write, runtime: isolated-node, summary: "Write a tiny host check that prints 'node' or 'browser' by feature detection (typeof process, typeof window) instead of parsing a user-agent string." }
    retrieval:
      - { concept: "browser-only isolated storage", from: js-07-05-persist-reload }
  - id: no-01-02-scripts-process-env
    title: { uk: "Запуск скриптів: process, env і конфігурація", en: "Running scripts: process, env and config" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict process.argv, process.env values and the exit code of a script for a given command line and environment."
      - "Implement loadConfig(env) that parses env strings into typed values with defaults and fails fast with a readable message on an invalid value."
    subskills:
      - { family: B-01, skill: "process/env/config", depth: intro }
    misconceptions:
      - "process.env keeps types, so PORT=3000 arrives as the number 3000."
      - "Calling process.exit() immediately is the normal way to finish a script."
    prerequisites: [no-01-01-node-vs-browser, js-15-06-build-env-sourcemaps]
    glossary: [process-argv, process-env, process-exit-code, fail-fast]
    visual: { kind: diagram, concept: "The process boundary: a command line (argv), an environment (string-only env) and a working directory flow into one Node process, loadConfig turns the strings into a typed config object or a fail-fast error, and stdout, stderr and the exit code flow back to the terminal." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict process.argv.slice(2), typeof process.env.PORT and the exit code for summary.mjs run with --limit 3, PORT=3000 and LOCALE unset." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the script in the Node child with three env and argument sets, then replace process.exit(1) with process.exitCode = 1 and confirm the last log line still appears." }
      - { kind: write, runtime: isolated-node, summary: "Write loadConfig(env) that turns PORT, LOCALE and TODAY strings into a typed config with defaults and returns a readable error for PORT=abc or TODAY=2026-13-01." }
    retrieval:
      - { concept: "an ok/errors result instead of a crash for invalid input", from: js-02-11-independent-validation }
  - id: no-01-03-modules-resolution
    title: { uk: "Модулі: ESM, CJS і пошук пакетів", en: "Modules: ESM, CJS and package resolution" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict whether a file loads as ESM or CommonJS from its extension and the nearest package.json 'type' field."
      - "Trace how a bare specifier resolves through node_modules and a package’s exports map, and why a relative ESM import needs its file extension."
      - "Import a CommonJS module from ESM and explain why the default import always works while named imports may not."
    subskills:
      - { family: B-01, skill: "ESM/CJS/package resolution", depth: intro }
    misconceptions:
      - "import and require are two spellings of the same thing, so any file can use either."
      - "Node finds './helpers' the way a bundler does, so the .js extension is optional in ESM."
    prerequisites: [no-01-02-scripts-process-env, js-07-06-esm-import-export]
    glossary: [bare-specifier, exports-map, package-type-field]
    visual: { kind: diagram, concept: "The resolution walk for one import: the specifier is classified (relative, bare or node:), the walker climbs folders to node_modules, reads package.json exports and type, and lands on the exact file plus the loader (ESM or CJS) that will evaluate it." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict which loader handles a.js, b.cjs and c.mjs in a package with type module, and whether import './helpers' without an extension succeeds." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the three-file package in the Node child, read ERR_MODULE_NOT_FOUND for the extensionless import, then add the extension and turn one file into .cjs." }
      - { kind: write, runtime: isolated-node, summary: "Write an ESM entry that imports a node: built-in, a relative domain module and a CommonJS fixture loader using only forms that work." }
    retrieval:
      - { concept: "reading require and module.exports in legacy code", from: js-07-08-cjs-and-load-failures }
  - id: no-01-04-event-loop-phases
    title: { uk: "Фази event loop у Node (оглядово)", en: "Event loop phases (awareness)" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict the order of process.nextTick, a promise callback, setTimeout(0) and setImmediate scheduled inside an I/O callback."
      - "Explain why timeout-versus-immediate order is not guaranteed in the main module but is guaranteed inside an I/O callback."
      - "Name the phase (timers, poll, check, close) in which a given callback runs, at awareness level."
    subskills:
      - { family: B-01, skill: "async event loop phases awareness", depth: intro }
    misconceptions:
      - "setImmediate runs immediately, before anything else that is queued."
      - "Node’s event loop is the browser’s single task queue, so the same ordering rules apply unchanged."
    prerequisites: [no-01-03-modules-resolution, js-08-04-microtasks-vs-tasks]
    glossary: [event-loop-phase, set-immediate, next-tick-queue]
    visual: { kind: diagram, concept: "One turn of Node’s loop drawn as phases (timers, poll, check, close) with the nextTick queue and the promise microtask queue drained after each callback; stepping through a readFile callback shows why setImmediate fires before a zero-delay timer there. (A diagram, not the event-loop kind: the build-time event-loop runner has no setImmediate or process.nextTick.)" }
    analogy: "A guard walking four rooms in a fixed order (clocks, mail, immediate notes, exit) who rereads his urgent notebook (nextTick) and then the ordinary notes (promises) after every job (limit: the real loop may wait in poll, and at program start the first round’s timing depends on the clock)."
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Commit to the printed order of four callbacks (nextTick, promise then, setTimeout 0, setImmediate) scheduled from inside an fs.readFile callback." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the snippet in the Node child several times, then move the scheduling to top level and observe that the timeout and the immediate may swap." }
      - { kind: write, runtime: isolated-node, summary: "Write a short script whose output order is deterministic and annotate the phase or queue each callback runs from." }
    retrieval:
      - { concept: "the call stack must empty before a timer callback runs", from: js-08-01-timers-and-the-event-loop }
  - id: no-01-05-eventemitter-errors
    title: { uk: "EventEmitter і життєвий цикл помилок", en: "EventEmitter and the error lifecycle" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict what happens when an EventEmitter emits 'error' with and without an error listener."
      - "Register, count and remove listeners with on, once and off, and explain what MaxListenersExceededWarning signals."
      - "Tell a synchronous throw inside a listener from a rejected promise that surfaces later as an unhandled rejection."
    subskills:
      - { family: B-01, skill: "events/EventEmitter error lifecycle", depth: intro }
    misconceptions:
      - "An 'error' event that nobody listens to is silently ignored."
      - "emit() schedules listeners for later, like setTimeout."
    prerequisites: [no-01-04-event-loop-phases, js-07-03-try-catch-finally]
    glossary: [event-emitter, error-event, max-listeners-warning]
    visual: { kind: sequence, concept: "An emitter and its listeners over time: emit('record') calls each listener synchronously in registration order, a once listener removes itself after one call, and emit('error') with no listener jumps straight to an uncaught exception that ends the process." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict the console lines and whether the process survives when a RecordLoader emitter emits 'record' twice and then 'error' with no error listener." }
      - { kind: run-change, runtime: isolated-node, summary: "Run it in the Node child, read the crash, add an error listener and a once listener, and run again." }
      - { kind: write, runtime: isolated-node, summary: "Write loadRecords(emitter) that attaches 'record' and 'error' listeners and removes both when 'end' or 'error' arrives." }
    retrieval:
      - { concept: "removing every listener a feature adds", from: js-13-06-cleanup-listeners-timers }
  - id: no-01-06-typescript-in-node
    title: { uk: "TypeScript у Node: збірка проти виконання", en: "TypeScript in Node: build vs runtime" }
    kind: instructional
    minutes: 15
    objectives:
      - "Explain that Node executes JavaScript: types are erased by tsc or by type stripping before code runs, so nothing checks them at run time."
      - "Set up a script so tsc --noEmit typechecks it and Node runs it, and predict which faults each step catches."
    subskills:
      - { family: B-01, skill: "TS build/runtime distinction", depth: intro }
    misconceptions:
      - "If my .ts file runs in Node, its types have been checked."
      - "A typed Config interface guarantees that process.env contains valid values."
    prerequisites: [no-01-05-eventemitter-errors, js-14-08-compile-time-vs-runtime]
    glossary: [type-stripping]
    visual: { kind: diagram, concept: "Two lanes from the same summary.ts: the typecheck lane (tsc --noEmit) reports a type error but changes nothing at run time, while the run lane strips the types away and executes plain JavaScript that happily accepts a wrong env value." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Predict whether a .ts script that assigns a string to a number-typed field runs, and what tsc --noEmit reports for the same file." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the script in the Node child and see a wrong literal and a wrong env value both run unchecked; remove the type keyword from import type and read the SyntaxError." }
      - { kind: local-task, runtime: local-node, summary: "In ~/js-course/no01-ts install typescript@7 and @types/node@22, run node summary.ts (runs despite the type error) and npx tsc --noEmit (TS2322), fix it, then typecheck a call of the exercise’s readPort and run it with PORT=abc to see the runtime check fire (the platform cannot typecheck Node code: no @types/node, no typecheck in the Node workspace)." }
      - { kind: write, runtime: isolated-node, summary: "Write a typed loadConfig signature plus a runtime check, so a wrong literal is caught by tsc and a wrong PORT string from env is caught at run time." }
    retrieval:
      - { concept: "type-only imports disappear from emitted code", from: js-14-07-modules-type-imports }
  - id: no-01-07-debug-module-listener
    title: { uk: "Налагодження: зламаний імпорт і витік слухачів", en: "Debug: a broken import and a leaking listener" }
    kind: instructional
    minutes: 15
    objectives:
      - "Repair broken imports by reading the error code and specifier and applying the resolution rules (file extension, exports map, CommonJS named export)."
      - "Locate a listener leak by measuring listenerCount across repeated reloads and fix it so the count stays constant."
    subskills:
      - { family: B-01, skill: "ESM/CJS/package resolution", depth: assess }
      - { family: B-01, skill: "events/EventEmitter error lifecycle", depth: assess }
    misconceptions:
      - "MaxListenersExceededWarning is harmless noise, and raising the limit fixes it."
    prerequisites: [no-01-06-typescript-in-node]
    glossary: []
    visual: { kind: diagram, concept: "(A stepped diagram, not code-trace: code-trace forbids imports and has no EventEmitter.) The failing run replayed: the resolution step that throws for the extensionless specifier, then repeated reload() calls with listenerCount('record') climbing 1, 2, 3 until the warning appears." }
    analogy: null
    practice:
      - { kind: predict, runtime: isolated-node, summary: "Before running, mark which of three imports in the seeded script fails and what listenerCount('record') reads after five reloads." }
      - { kind: run-change, runtime: isolated-node, summary: "Run the seeded script in the Node child and match each error and warning to your prediction." }
      - { kind: debug, runtime: isolated-node, summary: "Repair the extensionless import, the named import from a CommonJS fixture module and the reload() that adds a listener on every call, without raising the max-listeners limit." }
    retrieval:
      - { concept: "a leaked listener found by counting registrations", from: js-13-11-debug-leaks-cycles }
  - id: no-01-08-independent-typed-script
    title: { uk: "Самостійно: типізований локальний скрипт із перевіреною конфігурацією", en: "Independent: typed local script with validated config" }
    kind: assessment
    minutes: 30
    objectives:
      - "Build, without hints, a typed Node script that validates config from env and arguments, reads a synthetic data file, reports progress through an emitter that cleans up its listeners and exits with a meaningful code."
      - "Explain which APIs it uses that a browser lacks, predict the order of its deferred callbacks, and state which faults tsc caught versus which the runtime check caught."
      - "State which supplied earlier-stage prerequisites the Node stage relies on, and confirm that a skipped native practical stays recorded as unperformed rather than passed or blocking."
    subskills:
      - { family: B-01, skill: "process/env/config", depth: assess }
      - { family: B-01, skill: "Node vs browser APIs", depth: assess }
      - { family: B-01, skill: "async event loop phases awareness", depth: assess }
      - { family: B-01, skill: "TS build/runtime distinction", depth: assess }
    misconceptions: []
    prerequisites: [no-01-07-debug-module-listener]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-node, summary: "No-hint task in your own terminal: summarize.ts with loadConfig (LIMIT, LOCALE, DATA_FILE), a progress emitter that removes its listeners and exit code 1 on invalid config; the supplied checks run it with bad env, unset LOCALE and a missing file, and you record the terminal output as evidence." }
      - { kind: independent, runtime: isolated-node, summary: "Assessment exercise on the platform: summarize(argv, env, out) with a validated config (--limit, LOCALE, DATA_FILE) checked before the file is opened, totals read through an EventEmitter source whose listeners are removed after end and error, and exit code 0/1." }
      - { kind: predict, runtime: isolated-node, summary: "Explain-level items: the order of a synchronous line, nextTick, promise and setImmediate inside the script’s readFile callback; which of four seeded faults tsc --noEmit catches; which of the script’s tools a browser lacks." }
    retrieval:
      - { concept: "types do not validate runtime input", from: js-14-08-compile-time-vs-runtime }
  - id: no-01-09-capstone-server-folder
    title: { uk: "Проєкт: тека server/ із типізованим скриптом", en: "Capstone: server/ with a typed script" }
    kind: capstone-step
    minutes: 30
    objectives:
      - "Add server/ to the exported workspace with a typed script that imports the shared domain module and fixtures, reads validated config from env and prints the domain summary."
    subskills:
      - { family: B-01, skill: "process/env/config", depth: practice }
    misconceptions: []
    prerequisites: [no-01-08-independent-typed-script]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-node, summary: "In your local workspace, create server/package.json (type module) and server/src/summary.ts that imports the shared domain functions and fixtures and uses loadConfig for LOCALE (and TODAY where the domain needs it); run it in your terminal and record the printed summary." }
      - { kind: run-change, runtime: local-node, summary: "Run it with an invalid env value, confirm a readable error and a non-zero exit code, then commit server/ as its own change." }
    retrieval:
      - { concept: "the exported workspace layout and the shared domain code", from: js-10-01-what-the-export-contains }
