# Syllabus spine for RN-04. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RN-04
stage: RN
title: { uk: "Нативна навігація й життєвий цикл застосунку", en: "Native navigation and app lifecycle" }
summary:
  uk: "Учень переходить між екранами списку, деталей і редагування в стеку навігації з перевіреними параметрами, захищає незбережені зміни від кожного способу повернутися «назад», відрізняє фокус екрана від монтування, реагує на перехід застосунку у фон і назад, прибирає кожну додану підписку й відкриває екран за перевіреним синтетичним deep link."
  en: "The learner moves between list, detail and edit screens on a navigation stack with validated params, protects unsaved edits from every back route, tells screen focus from mount, reacts to the app going to the background and returning, removes every subscription it adds and opens a screen from a validated synthetic deep link."
competencies: [N-03]
capstoneStep:
  mode: local
  objective:
    uk: "Додати до нативного проєкту екрани списку, деталей і редагування з правильною поведінкою «назад», захистом незбережених змін, синтетичним deep link і чистими підписками під час переходу застосунку у фон і назад."
    en: "Add list/detail/edit screens to the native capstone with correct back behavior, unsaved-edit protection, a synthetic deep link and clean subscriptions through app background/foreground."
  variants:
    wishlist:
      uk: "Відкрити деталі бажання w-03 за синтетичним deep link з id, попередити, перш ніж «назад» відкине змінені назву чи ціну, і перечитувати список при фокусі екрана без дубльованих слухачів."
      en: "Open wish w-03's detail from a synthetic deep link by id, warn before back discards an edited name or price, and re-read the list on screen focus without duplicate listeners."
    planner:
      uk: "Відкрити деталі справи t-02 за синтетичним deep link з id, попередити, перш ніж «назад» відкине змінені назву чи термін, і перерахувати кількість справ на сьогодні, коли застосунок повертається з фону."
      en: "Open task t-02's detail from a synthetic deep link by id, warn before back discards an edited title or dueDate, and recompute the due-today count when the app returns to the foreground."
    habits:
      uk: "Відкрити деталі звички h-01 за синтетичним deep link з id, попередити, перш ніж «назад» відкине змінені назву чи частоту, і оновити сьогоднішнє виконання, коли застосунок повертається з фону."
      en: "Open habit h-01's detail from a synthetic deep link by id, warn before back discards an edited name or frequency, and refresh today's completion state when the app returns to the foreground."
    expenses:
      uk: "Відкрити деталі витрати e-02 за синтетичним deep link з id, попередити, перш ніж «назад» відкине змінені назву чи суму, і перечитувати підсумки за категоріями при фокусі екрана без дубльованих слухачів."
      en: "Open expense e-02's detail from a synthetic deep link by id, warn before back discards an edited label or amountMinor, and re-read the category totals on screen focus without duplicate listeners."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   re-05-05-focus-navigation-unsaved (unsaved edits) ; re-03-03-dependencies-cleanup (cleanup) ; rn-03-02-platform-adapters (adapters) ; js-16-01-url-query-encoding (link params)
lessons:
  - id: rn-04-01-navigation-stacks-params
    title: { uk: "Стеки навігації, маршрути й параметри", en: "Navigation stacks, routes and params" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace push, pop and replace on a navigation stack and predict which screens stay mounted underneath the focused one."
      - "Pass only a record id as a screen param and look the record up from shared state, instead of passing the whole object."
    subskills:
      - { family: N-03, skill: "navigation/routes/params", depth: intro }
    misconceptions:
      - "Navigating to a new screen unmounts the previous one, as changing a web route does."
      - "Passing the whole record object as a param is fine, because params are just props."
    prerequisites: [rn-03-08-capstone-native-crud, re-05-02-params-nested-routes]
    glossary: [navigation-stack, screen-params]
    visual: { kind: diagram, concept: "A stack of screen cards: stepping through push(detail, { id }), push(edit, { id }), pop and replace shows which screens are mounted, which one is focused and the param each received." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict the stack contents and which screens are still mounted after list → detail → edit → back, and what the detail shows if it received a stale record object instead of an id." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview's simulated stack, change the detail param from a whole record to its id, edit the record, go back and confirm the detail shows the updated values." }
      - { kind: write, runtime: concept-preview, summary: "Write typed screen-param definitions for list, detail and edit with id-only params and a not-found state for an unknown id." }
    retrieval:
      - { concept: "route params and nested routes on the web", from: re-05-02-params-nested-routes }
  - id: rn-04-02-back-unsaved-edits
    title: { uk: "«Назад» і незбережені зміни", en: "Back behavior and unsaved edits" }
    kind: instructional
    minutes: 10
    objectives:
      - "List every way a learner can leave an edit screen on each platform — header back, the Android hardware back button, the iOS swipe-back gesture, a tab switch — and intercept each one that takes the screen off the stack (a tab switch keeps the screen mounted, so its draft survives in memory)."
      - "Ask for confirmation only when the form is dirty, and keep the draft when the user chooses to stay."
    subskills:
      - { family: N-03, skill: "back/unsaved edits", depth: intro }
    misconceptions:
      - "Hiding the header back button protects unsaved edits."
      - "A confirmation dialog on every back press is the safe default."
    prerequisites: [rn-04-01-navigation-stacks-params, re-05-05-focus-navigation-unsaved]
    glossary: [hardware-back-button, swipe-back-gesture]
    visual: { kind: sequence, concept: "Actors person, edit screen and navigation stack over time: an Android back press reaches the stack, beforeRemove reaches the edit screen, the dirty check compares the draft with the saved record, the Alert offers keep editing or discard, and only discard dispatches the same action so the pop goes ahead." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which exits a header-only guard misses on Android and on iOS, and what happens to the draft when the user chooses 'keep editing'." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, fire the simulated hardware-back and swipe-back events with a clean and a dirty form and watch the guard; real gestures are checked on your declared target." }
      - { kind: write, runtime: concept-preview, summary: "Write a leave guard for the edit screen that intercepts every back route, compares the draft with the saved record and asks for confirmation only when they differ." }
    retrieval:
      - { concept: "warning before leaving unsaved edits on the web", from: re-05-05-focus-navigation-unsaved }
  - id: rn-04-03-screen-focus-vs-mount
    title: { uk: "Фокус екрана проти монтування", en: "Screen focus vs mount" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict that a screen kept on the stack stays mounted and does not re-run its mount effect when the user comes back to it."
      - "Use a focus effect to refresh data through the storage adapter on return and clean it up on blur."
    subskills:
      - { family: N-03, skill: "screen focus vs mount", depth: intro }
    misconceptions:
      - "useEffect with an empty dependency list runs again every time I come back to a screen."
      - "A screen I cannot see has been unmounted, so its timers and listeners have stopped."
    prerequisites: [rn-04-02-back-unsaved-edits, re-03-02-effects-synchronize-external]
    glossary: [screen-focus, screen-blur]
    visual: { kind: render-timeline, concept: "list → detail → back: the list's mount effect runs once, its focus effect runs on first show and again on return, its blur cleanup runs when detail is pushed, and the list's state snapshot is preserved throughout." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict how many times a list screen's mount effect and focus effect log after list → detail → back → detail → back." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, move a reload from the mount effect to a focus effect, repeat the navigation and compare the logs." }
      - { kind: write, runtime: concept-preview, summary: "Write a focus effect that re-reads records through the storage adapter when the list regains focus and ignores a pending read after blur." }
    retrieval:
      - { concept: "effects synchronize with something outside React", from: re-03-02-effects-synchronize-external }
      - { concept: "the storage adapter seam", from: rn-03-02-platform-adapters }
  - id: rn-04-04-app-foreground-background
    title: { uk: "Застосунок на передньому плані й у фоні", en: "App foreground and background" }
    kind: instructional
    minutes: 10
    objectives:
      - "Trace AppState transitions (active → background → active, plus inactive on iOS) and predict which of them fire when the user switches to another app and comes back."
      - "Save the edit draft when the app leaves the foreground and refresh date-dependent values when it returns."
    subskills:
      - { family: N-03, skill: "app foreground/background", depth: intro }
    misconceptions:
      - "A backgrounded app keeps running like a hidden browser tab, so its timers and requests carry on as before."
      - "The operating system always warns my app before killing it, so I can save at the last moment."
    prerequisites: [rn-04-03-screen-focus-vs-mount]
    glossary: [native-app-state, app-foreground, app-background]
    visual: { kind: sequence, concept: "Actors operating system (iOS), AppState listener and draft store: leaving the app sends inactive then background, the listener saves the draft, the app is suspended, and coming back sends active, which triggers a refresh of today's derived values (Android: the same without inactive)." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict the AppState change events logged when the user switches to another app and comes back, on Android and on iOS." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, fire simulated background and active events and watch the draft save and the refresh; note that real suspension and process termination happen only on your declared target." }
      - { kind: write, runtime: concept-preview, summary: "Write an AppState listener that saves the edit draft on background and recomputes the today-dependent summary on active, returning its removal function." }
    retrieval:
      - { concept: "today passed in as a parameter", from: js-09-04-deterministic-fixtures }
  - id: rn-04-05-subscription-cleanup
    title: { uk: "Прибираємо підписки", en: "Subscription cleanup" }
    kind: instructional
    minutes: 10
    objectives:
      - "Pair every native subscription (AppState, Keyboard, Linking, the back handler, timers) with its removal in the cleanup of the same effect."
      - "Predict the duplicate events produced when a focus effect adds a listener on every focus and never removes it."
    subskills:
      - { family: N-03, skill: "subscription cleanup", depth: intro }
    misconceptions:
      - "Subscriptions are removed automatically when I navigate away from the screen."
      - "Cleanup only matters at unmount, so a listener added on focus is harmless."
    prerequisites: [rn-04-04-app-foreground-background, re-03-03-dependencies-cleanup]
    glossary: [event-subscription]
    visual: { kind: render-timeline, concept: "Three visits to one screen: without cleanup each focus adds another AppState subscription and a single background event is handled three times; once the cleanup returns subscription.remove(), the count stays at one." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict how many times a background event is handled after three visits to a screen whose focus effect adds an AppState listener and never removes it." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, return subscription.remove() from the focus effect's cleanup, repeat the visits and confirm a single handler call." }
      - { kind: write, runtime: concept-preview, summary: "Write a useAppStateRefresh(onActive) hook that subscribes on focus, removes the subscription on blur and unmount, and never calls a stale onActive." }
    retrieval:
      - { concept: "cleanup runs before every re-run, not only at unmount", from: re-03-03-dependencies-cleanup }
      - { concept: "cleaning up listeners, timers and handles", from: js-13-06-cleanup-listeners-timers }
  - id: rn-04-06-deep-links
    title: { uk: "Deep links і перевірка параметрів", en: "Deep links and parameter validation" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace a synthetic deep link on a custom scheme from the operating system to a screen, both on a cold start and while the app is already running."
      - "Parse and validate link params as untrusted input before navigating, falling back to a safe screen for an unknown or malformed id."
    subskills:
      - { family: N-03, skill: "deep links", depth: intro }
    misconceptions:
      - "A deep link points into my own app, so its parameters can be trusted."
      - "Listening for the link event is enough; a link that launches a closed app arrives the same way."
    prerequisites: [rn-04-05-subscription-cleanup, js-16-01-url-query-encoding]
    glossary: [deep-link, custom-url-scheme, cold-start]
    visual: { kind: sequence, concept: "Actors system, app code and navigation stack: a cold start reads the initial URL, a running app receives a url event, and both pass through one parser (decode → validate id) before navigating to the detail or the not-found screen." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which screen opens and what the stack looks like for a synthetic link received on a cold start versus while the app is already on the edit screen with unsaved changes." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled preview, send simulated link events with a valid, an unknown and a malformed id and watch the navigation; real link delivery from the operating system is checked on your declared target." }
      - { kind: write, runtime: browser-js, summary: "Write a pure parseRecordLink(url) that decodes the id, validates it against the domain's id rules and returns a typed route or a not-found result, with tests for encoded, missing and unexpected params." }
    retrieval:
      - { concept: "URLs, query strings and encoding", from: js-16-01-url-query-encoding }
      - { concept: "untrusted input before use", from: js-16-06-untrusted-input-safe-output }
  - id: rn-04-07-debug-duplicate-subscriptions
    title: { uk: "Налагодження: дубльовані підписки й хибні параметри маршруту", en: "Debug: duplicate subscriptions and wrong route input" }
    kind: local-task
    minutes: 20
    objectives:
      - "Reproduce on the declared target a seeded app in which a background event is handled several times after navigation and the detail screen, built for a whole-object param, crashes when a link opens it with only an id."
      - "Repair both and confirm on the declared target with a handler count and repeated navigation."
    subskills:
      - { family: N-03, skill: "navigation/routes/params", depth: assess }
      - { family: N-03, skill: "subscription cleanup", depth: assess }
    misconceptions: []
    prerequisites: [rn-04-06-deep-links]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Run the seeded app on your declared target, go list → detail several times, send the app to the background and back, and record the handler counts and the crash — or mark the task unperformed." }
      - { kind: debug, runtime: concept-preview, summary: "In the labeled preview, repair the seeded habit tracker: remove the leaked AppState subscription in the focus effect's cleanup and replace the whole-object screen param with an id lookup so a link with only an id opens the habit." }
      - { kind: debug, runtime: local-native, summary: "Remove the leaked AppState subscription with a proper cleanup and replace the whole-object screen param with an id lookup; confirm a single handler call and a working detail screen on your declared target." }
    retrieval:
      - { concept: "debugging stale data and duplicated effects", from: re-03-07-debug-stale-duplicate-effects }
  - id: rn-04-08-independent-native-flow
    title: { uk: "Самостійно: список, деталі, редагування з безпечним життєвим циклом", en: "Independent: list/detail/edit with lifecycle safety" }
    kind: assessment
    minutes: 35
    objectives:
      - "Build, without hints, a list/detail/edit flow that survives every back route, background and foreground, and a malformed deep link without losing unsaved work, verified on the declared target."
    subskills:
      - { family: N-03, skill: "back/unsaved edits", depth: assess }
      - { family: N-03, skill: "deep links", depth: assess }
      - { family: N-03, skill: "app foreground/background", depth: assess }
      - { family: N-03, skill: "screen focus vs mount", depth: assess }
    misconceptions: []
    prerequisites: [rn-04-07-debug-duplicate-subscriptions]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: local-native, summary: "No-hint task: for a synthetic recipe-notes domain, build list/detail/edit on a stack with id params, a dirty-form guard on every back route, a draft save on background, a focus-based refresh and a validated deep link; pass the lifecycle checklist on your declared target." }
      - { kind: independent, runtime: browser-js, summary: "In-course part: your link parser and dirty-form comparison pass hidden fixtures with malformed, encoded and unknown ids and with unchanged and changed drafts." }
    retrieval:
      - { concept: "an independent list/detail/edit flow on the web", from: re-05-09-independent-list-detail-edit }
  - id: rn-04-09-capstone-native-navigation
    title: { uk: "Проєкт: нативна навігація", en: "Capstone: native navigation" }
    kind: capstone-step
    minutes: 40
    objectives:
      - "Add list, detail and edit screens to the native capstone with id params, a leave guard for unsaved edits, a synthetic deep link to one fixture and subscriptions that clean up through background and foreground."
    subskills:
      - { family: N-03, skill: "back/unsaved edits", depth: practice }
    misconceptions: []
    prerequisites: [rn-04-08-independent-native-flow, rn-03-08-capstone-native-crud]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-native, summary: "Inside native/ in the exported workspace, add the stack with list/detail/edit screens, the dirty-form guard, the validated deep link and an AppState refresh with cleanup; verify each on your declared target and commit." }
    retrieval:
      - { concept: "the capstone's routes and loading/empty/error states on the web", from: re-05-10-capstone-routes }
