# Syllabus spine for JS-09. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-09
stage: JS
title: { uk: "Тести й налагодження", en: "Tests and debugging" }
summary:
  uk: "Учень пише assertion-тести з граничними випадками й детермінованими фікстурами, відрізняє mocks від справжніх доказів, крокує кодом через breakpoints, дає тесту, що падає, знайти дефект, і без підказок перевіряє тестами CRUD, фільтрацію та збереження."
  en: "The learner writes assertion tests with boundary cases and deterministic fixtures, tells mocks from real evidence, steps through code with breakpoints, lets a failing test locate a defect, and verifies CRUD, filtering and persistence with tests without hints."
competencies: [P-04]
capstoneStep:
  mode: in-platform
  objective:
    uk: "Написати assertion-тести для доменних функцій проєкту (граничні випадки, зафіксована дата «сьогодні») і виправити один закладений дефект, який вони виявлять."
    en: "Write assertion tests for the capstone's domain functions (boundaries, fixed today-date) and repair one seeded defect they reveal."
  variants:
    wishlist:
      uk: "Тести для validateWish і підсумку бажаного: порожній список, бажання з price null рахується окремо, а не як 0, price 0 зберігається, отримані (acquired) не входять у суму, name з 80 і 81 символу; закладений дефект рахує ціну null як 0."
      en: "Tests for validateWish and the wanted-total: an empty list, a wish with price null counted separately rather than as 0, price 0 kept, acquired wishes excluded, and names of 80 and 81 characters; the seeded defect counts a null price as 0."
    planner:
      uk: "Тести для лічильника справ до терміну з «сьогодні» = «2026-03-01»: справа з dueDate цього дня рахується, завтрашня — ні, а виконана (done) чи без dueDate — ніколи; закладений дефект порівнює через < замість <=."
      en: "Tests for the due-count with today fixed at '2026-03-01': a task whose dueDate is that day counts, tomorrow's does not, and a done task or one without dueDate never counts; the seeded defect compares with < instead of <=."
    habits:
      uk: "Тести для серії з «сьогодні» = «2026-03-01»: h-01 дає 3, h-02 — 2 через пропущений день, h-06 з порожніми completions — 0; закладений дефект дозволяє серії «перестрибнути» пропущений день."
      en: "Tests for the streak with today fixed at '2026-03-01': h-01 gives 3, h-02 gives 2 because of a gap day, and h-06 with empty completions gives 0; the seeded defect lets the streak jump over a gap day."
    expenses:
      uk: "Тести для підсумків за категоріями в amountMinor: food = 84550 + 21050 = 105600, порожній список дає нулі, а validateExpense відхиляє amountMinor 0 і 99.5; закладений дефект пропускає останню витрату списку."
      en: "Tests for the category totals in amountMinor: food = 84550 + 21050 = 105600, an empty list gives zero totals, and validateExpense rejects amountMinor 0 and 99.5; the seeded defect skips the last expense in the list."
# Retrieval plan: js-05-05-sorting-comparator (comparator) ; js-07-04-json (JSON) ; js-02-11-independent-validation (validation) ; js-08-05-async-await (await in tests)
lessons:
  - id: js-09-01-why-tests
    title: { uk: "Навіщо тести і якими вони бувають", en: "Why tests, and which kinds exist" }
    kind: instructional
    minutes: 10
    objectives:
      - "State what a unit, an integration, a user-level and an end-to-end test each check, and pick the cheapest one that would catch a described defect."
      - "Run a small test suite and read which test failed and its expected and actual values."
    subskills:
      - { family: P-04, skill: "unit/integration/user/E2E purposes", depth: intro }
    misconceptions:
      - "I clicked through the app once and it worked, so tests are unnecessary."
      - "Passing tests prove the code has no bugs."
    prerequisites: [js-08-13-capstone-async-load, js-03-07-pure-vs-side-effects]
    glossary: [automated-test, unit-test, integration-test, end-to-end-test, test-suite]
    visual: { kind: diagram, concept: "One feature (filter, render, save) drawn as layers — pure domain function, module wiring, UI, whole app after reload — with each test kind's box lighting up the layers it exercises and the seeded defects it can and cannot see." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of four tests (unit for filterByStatus, integration for load plus render, user-level click on the filter, end-to-end reload) fails for a seeded defect in the filter's comparison." }
      - { kind: run-change, runtime: browser-js, summary: "Run the suite, read the failing test's expected versus actual values, fix the comparison and rerun until everything passes." }
      - { kind: write, runtime: browser-js, summary: "Write your first unit test for a supplied pure formatLabel(record) with one fixture record and one expected string." }
    retrieval:
      - { concept: "pure functions versus side effects", from: js-03-07-pure-vs-side-effects }
  - id: js-09-02-assertions
    title: { uk: "Assertions: перевіряємо очікуване", en: "Assertions" }
    kind: instructional
    minutes: 12
    objectives:
      - "Write assertions for strict equality, deep equality of objects and arrays, and an expected throw, each with a message that states the intent."
      - "Explain why a strict-equality assertion on two separately built records fails even when every field matches."
    subskills:
      - { family: P-04, skill: "assertions/boundaries", depth: intro }
    misconceptions:
      - "Two objects with the same fields should pass a strict-equality assertion."
      - "A test that runs without errors has passed, even if it contains no assertion."
    prerequisites: [js-09-01-why-tests, js-04-07-reference-identity]
    glossary: [assertion, test-case, expected-value, actual-value]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of six assertions pass: strict and deep equality of two equal records, an array in a different order, and an expected throw from assertValidPrice(-1)." }
      - { kind: run-change, runtime: browser-js, summary: "Run them, switch the failing record check to a deep-equality assertion, then change one expected value on purpose and read the failure message." }
      - { kind: write, runtime: browser-js, summary: "Write assertions for sortRecords(records, compareByName): the resulting order, that the input array is unchanged, and that an unknown sort key throws." }
    retrieval:
      - { concept: "two names pointing at one object versus two equal objects", from: js-04-07-reference-identity }
      - { concept: "what a comparator's return value means for sort order", from: js-05-05-sorting-comparator }
  - id: js-09-03-boundary-cases
    title: { uk: "Граничні випадки: порожньо, один, багато, null", en: "Boundary cases: empty, one, many, null" }
    kind: instructional
    minutes: 12
    objectives:
      - "List the boundary inputs of a function (empty, one, many, null or missing, exact limits such as 80 versus 81 characters) and write one test per boundary."
      - "Classify a bug report by the boundary it belongs to and name the test that would have caught it."
    subskills:
      - { family: P-04, skill: "assertions/boundaries", depth: practice }
    misconceptions:
      - "Testing one typical input is enough; edge cases rarely happen in real use."
      - "Boundary cases only means very large inputs."
    prerequisites: [js-09-02-assertions, js-02-11-independent-validation]
    glossary: [boundary-case]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which inputs break a seeded summarize(records): an empty list, one record, a record with a null amount, and a list of 1,000 synthetic records." }
      - { kind: run-change, runtime: browser-js, summary: "Run a table of boundary tests, then change the name rule from 80 to 79 characters and see exactly which boundary tests catch the change." }
      - { kind: write, runtime: browser-js, summary: "Write boundary tests for validateRecord covering '', a whitespace-only name, exactly 80 and 81 characters, and a missing optional field." }
    retrieval:
      - { concept: "validation of null, empty string, zero and NaN inputs", from: js-02-11-independent-validation }
  - id: js-09-04-deterministic-fixtures
    title: { uk: "Детерміновані фікстури та зафіксований «сьогодні»", en: "Deterministic fixtures and a fixed clock" }
    kind: instructional
    minutes: 10
    objectives:
      - "Make a date-dependent function testable by passing today in as a parameter instead of reading the clock inside it."
      - "Build each test from fresh synthetic fixtures so test order and earlier tests cannot change the result."
    subskills:
      - { family: P-04, skill: "deterministic fixtures", depth: intro }
    misconceptions:
      - "A test that passes on my machine today will pass tomorrow too."
      - "Sharing one fixture array across all tests is harmless and saves time."
    prerequisites: [js-09-03-boundary-cases, js-04-10-immutable-updates]
    glossary: [test-fixture, deterministic-test, fixed-clock, flaky-test]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict whether a test of isOverdue(task) that calls new Date() inside passes for a task due '2026-03-02' when run on 2026-03-01 and on 2026-03-03." }
      - { kind: run-change, runtime: browser-js, summary: "Run the clock-dependent test, refactor to isOverdue(task, today) and run it with today set to '2026-03-01' and '2026-03-03'." }
      - { kind: write, runtime: browser-js, summary: "Write makeFixtures() that rebuilds fresh records from a JSON fixture string, and use it in two tests that mutate their data without affecting each other." }
    retrieval:
      - { concept: "rebuilding plain data from a JSON string", from: js-07-04-json }
  - id: js-09-05-mocks-vs-real
    title: { uk: "Mocks проти справжніх доказів", en: "Mocks versus real evidence" }
    kind: instructional
    minutes: 10
    objectives:
      - "Replace the fetch dependency of loadRecords with a fake that returns a fixture, and state what that test does and does not prove."
      - "Decide for three claims (parsing works, the fixture server sends that shape, the app recovers when offline) whether a mock or a real run is the evidence."
    subskills:
      - { family: P-04, skill: "mocks vs actual evidence", depth: intro }
    misconceptions:
      - "If the test with a mocked fetch passes, the real network code works too."
      - "Mocking everything makes tests better because they run faster."
    prerequisites: [js-09-04-deterministic-fixtures, js-08-06-fetch-basics]
    glossary: [test-double, mock, stub]
    visual: { kind: diagram, concept: "A test of loadRecords drawn twice: once with fetch replaced by a fake that returns a fixture (the fake box greyed out inside the test boundary), once against the real bundled fixture endpoint; highlights mark which claims each run is evidence for." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict whether a test of loadRecords with a fake fetch catches a wrong URL, a missing ok check and a misspelled field name in the fixture." }
      - { kind: run-change, runtime: browser-js, summary: "Run the mocked test, introduce each defect in turn to see which ones slip through, then run the same check against the real bundled fixture." }
      - { kind: write, runtime: browser-js, summary: "Write an async test that injects a fake fetch answering 500, awaits loadRecords and asserts the error state, with a comment saying what it does not prove." }
    retrieval:
      - { concept: "awaiting a promise inside an async function", from: js-08-05-async-await }
  - id: js-09-06-debugger-breakpoints
    title: { uk: "Breakpoints і покрокове виконання", en: "Breakpoints and stepping" }
    kind: instructional
    minutes: 12
    objectives:
      - "Pause sandboxed code with a breakpoint or a debugger statement in the browser DevTools, step over, into and out of calls, and read local variables and the call stack at the pause."
      - "Explain why the debugger can show the code you wrote even when the code that runs was transformed (source maps are practiced in JS-15)."
    subskills:
      - { family: P-04, skill: "breakpoints/source maps", depth: intro }
    misconceptions:
      - "Adding console.log lines is the only way to see a variable's value in the middle of a run."
      - "Step over skips running the function call on that line."
    prerequisites: [js-09-05-mocks-vs-real, js-07-01-call-stack-and-errors]
    glossary: [browser-devtools, breakpoint, debugger-statement, step-over, step-into]
    visual: { kind: code-trace, concept: "A paused run of summarize(records): the highlighted line, local and closure scopes with their current values, the call stack panel, and where step over, step into and step out each move next." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the values of total and i at the third pause of a breakpoint inside summarize's loop over the synthetic fixture records." }
      - { kind: run-change, runtime: browser-js, summary: "Set the breakpoint, run, step over, into and out, add a watch on total, then turn it into a conditional breakpoint that pauses only on the record with a null amount." }
      - { kind: debug, runtime: browser-js, summary: "Using breakpoints only (no console.log), find why a seeded summarize returns NaN for one fixture and fix it." }
    retrieval:
      - { concept: "frames on the call stack and reading a stack trace", from: js-07-01-call-stack-and-errors }
  - id: js-09-07-debug-with-tests
    title: { uk: "Налагодження: хай тест, що падає, знайде дефект", en: "Debug: let a failing test find the defect" }
    kind: instructional
    minutes: 15
    objectives:
      - "Turn a bug report into a failing test that reproduces it with a deterministic fixture, then fix the code until it passes without breaking other tests."
      - "Narrow a failure down to one function by adding smaller tests around it."
    subskills:
      - { family: P-04, skill: "assertions/boundaries", depth: assess }
      - { family: P-04, skill: "deterministic fixtures", depth: assess }
    misconceptions:
      - "Changing the expected value until the test passes fixes a failing test."
      - "If the existing tests pass, the reported bug must be in the user's data."
    prerequisites: [js-09-06-debugger-breakpoints]
    glossary: [regression-test]
    visual: { kind: code-trace, concept: "The failing test traced through dueCount: the fixture input, the assertion's expected versus actual, and the comparison line where '<' instead of '<=' drops the task due today." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Before running, predict which of five existing tests fail for the bug report 'a task due today is not counted' and which new test would reproduce it." }
      - { kind: run-change, runtime: browser-js, summary: "Run the suite, add the reproducing test with today fixed at '2026-03-01', and confirm it fails for the reported reason." }
      - { kind: debug, runtime: browser-js, summary: "Repair the seeded date comparison and a fixture shared between tests so the whole suite passes in any order." }
    retrieval:
      - { concept: "repairing a comparator that returns a boolean", from: js-05-08-debug-comparator-missing }
  - id: js-09-08-independent-delayed-retrieval
    title: { uk: "Самостійно: CRUD, фільтр і збереження, перевірені тестами", en: "Independent: CRUD, filter and persistence, verified by tests" }
    kind: assessment
    minutes: 30
    objectives:
      - "Implement, without hints, add/update/remove, a status filter and save/reload for an unseen synthetic domain, and prove them with your own tests for boundaries and a reload."
      - "Wire one event-driven interaction (add through form submit) and verify it with a user-level test."
    subskills:
      - { family: P-04, skill: "assertions/boundaries", depth: assess }
    misconceptions: []
    prerequisites: [js-09-07-debug-with-tests]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: a synthetic reading-list module with add/update/remove, a status filter, validated save/reload through isolated storage and a delegated submit handler, plus your own tests for empty, one, many, invalid stored JSON and a submit-driven add; hidden tests check the same behavior." }
    retrieval:
      - { concept: "add, update and remove without mutating shared objects", from: js-04-10-immutable-updates }
      - { concept: "filter versus find over records", from: js-05-02-filter-find }
      - { concept: "one delegated listener for many list items", from: js-06-11-bubbling-capture-delegation }
      - { concept: "persist and validate on reload", from: js-07-05-persist-reload }
  - id: js-09-09-capstone-tests
    title: { uk: "Проєкт: тести для доменних функцій", en: "Capstone: tests for domain functions" }
    kind: capstone-step
    minutes: 25
    objectives:
      - "Write deterministic assertion tests for the capstone's domain functions, including boundaries and a fixed today where dates matter, and repair the seeded defect they reveal."
    subskills:
      - { family: P-04, skill: "deterministic fixtures", depth: practice }
    misconceptions: []
    prerequisites: [js-09-08-independent-delayed-retrieval, js-08-13-capstone-async-load]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: browser-js, summary: "In the capstone workspace, add tests/domain.test.js covering validation, filter, sort and the domain's derived value with fresh fixtures and a fixed today, then fix the seeded defect the tests expose." }
      - { kind: run-change, runtime: browser-js, summary: "Run the suite, break one domain function on purpose and confirm that exactly the focused test for it fails." }
    retrieval:
      - { concept: "the capstone's search, filter, sort and summary functions", from: js-05-10-capstone-search-filter-summary }
