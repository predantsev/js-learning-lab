# Syllabus spine for JS-16. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-16
stage: JS
title: { uk: "Межа вебу: HTTP, origin і безпечний вивід", en: "The web boundary: HTTP, origins and safe output" }
summary:
  uk: "Учень безпечно будує й кодує URL, читає HTTP-методи, коди статусу та заголовки, визначає межі cookie та сховища за origin, пояснює same-origin, CORS і preflight, діагностує збої на панелі Network і виводить недовірений текст лише через безпечні sinks, не вшиваючи секрети в клієнтський код."
  en: "The learner builds and encodes URLs safely, reads HTTP methods, status codes and headers, tells cookie and storage scope by origin, explains same-origin, CORS and preflight, diagnoses failures in the network panel, and renders untrusted text only through safe sinks without shipping secrets to the client."
competencies: [W-04, W-05]
capstoneStep:
  mode: local
  objective:
    uk: "Віддавати фікстури проєкту з локального файлового сервера, запитувати їх із безпечним кодуванням параметрів, правильно скасовувати й повторювати запити та безпечно показувати недовірений текст."
    en: "Serve capstone fixtures from a local file server, request them with safe query encoding, cancel/retry correctly and render untrusted text safely."
  variants:
    wishlist:
      uk: "Віддавати фікстури бажань як JSON-файл, тримати фільтр category в URL сторінки через URLSearchParams, щоб значення на кшталт «Дім & сад» не губилося після перезавантаження, і показувати кожну назву та категорію через textContent."
      en: "Serve the wish fixtures as a JSON file, keep the category filter in the page URL with URLSearchParams so a value like “Дім & сад” survives a reload, and render every name and category with textContent."
    planner:
      uk: "Віддавати фікстури справ, тримати вибраний день у рядку запиту сторінки (?day=2026-03-02), скасовувати запит, що ще виконується, коли день змінюється, і показувати назви справ як текст."
      en: "Serve the task fixtures, keep the selected day in the page query (?day=2026-03-02), abort the in-flight request when the day changes, and render task titles as text."
    habits:
      uk: "Віддавати фікстури звичок, один раз повторювати завантаження після мережевого збою, спричиненого зупинкою локального сервера, і показувати назви звичок як текст, навіть якщо назва у фікстурі містить розмітку."
      en: "Serve the habit fixtures, retry the load once after a network failure caused by stopping the local server, and render habit names as text even when a fixture name contains markup."
    expenses:
      uk: "Віддавати окремий JSON-файл для кожного id категорії, запитувати /fixtures/expenses/<закодована категорія>.json, показувати порожній стан на 404 для невідомої категорії й виводити назви витрат як текст."
      en: "Serve one JSON file per category id, request /fixtures/expenses/<encoded category>.json, show an empty state for a 404 on an unknown category, and render expense labels as text."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   js-08-06-fetch-basics (status checks) ; js-06-09-text-vs-html (sinks) ; js-07-05-persist-reload (storage origin) ; js-08-09-cancellation-abort (abort)
lessons:
  - id: js-16-01-url-query-encoding
    title: { uk: "URL, рядок запиту та кодування", en: "URLs, query strings and encoding" }
    kind: instructional
    minutes: 10
    objectives:
      - "Split a URL into scheme, host, port, path, query and fragment with the URL API and say which parts reach the server."
      - "Build a query with URLSearchParams and encode a path segment with encodeURIComponent so &, #, spaces and Cyrillic text survive the round trip."
    subskills:
      - { family: W-04, skill: "URL/query/encoding", depth: intro }
    misconceptions:
      - "I can build a query string by concatenating text; the browser fixes any special characters for me."
      - "The #fragment is sent to the server together with the rest of the URL."
    prerequisites: [js-08-06-fetch-basics, js-12-01-strings-unicode]
    glossary: [query-string, percent-encoding, url-fragment]
    visual: { kind: diagram, concept: "A real fixture URL split into labeled boxes (scheme, host, port, path, query, fragment); stepping through percent-encodes each search parameter byte by byte, shows an unencoded & splitting one value into two parameters, and keeps the fragment box in the browser while the rest travels to the server." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict url.pathname, url.search and url.hash for a prepared fixture URL, how URLSearchParams and encodeURIComponent encode a space, and what the server receives when the category “Дім & сад” is concatenated into the query unencoded." }
      - { kind: run-change, runtime: browser-js, summary: "Run the URL inspector on the concatenated URL, rebuild it with URLSearchParams and compare the encoded bytes and the parsed parameters." }
      - { kind: write, runtime: browser-js, summary: "Write buildFixtureUrl(base, { category, search }) that encodes every parameter, omits empty ones and returns a Cyrillic search term unchanged after parsing." }
    retrieval:
      - { concept: "the bytes behind a Cyrillic string", from: js-13-04-encoding-boundaries }
  - id: js-16-02-http-methods-status-headers
    title: { uk: "HTTP-методи, коди статусу та заголовки глибше", en: "HTTP methods, status codes and headers in depth" }
    kind: instructional
    minutes: 12
    objectives:
      - "Choose GET, POST, PUT, PATCH or DELETE for each capstone operation and say which methods are safe and which are idempotent."
      - "Read the status class and the Content-Type, Accept and Cache-Control headers of a fixture exchange, and predict what response.ok and response.json() do for each."
    subskills:
      - { family: W-04, skill: "HTTP methods/status/headers", depth: practice }
      - { family: W-04, skill: "JSON content types", depth: practice }
    misconceptions:
      - "A 200 response always contains the JSON I asked for."
      - "GET and POST differ only in where the data goes."
    prerequisites: [js-16-01-url-query-encoding, js-08-06-fetch-basics]
    glossary: [idempotency, safe-method, cache-control]
    visual: { kind: sequence, concept: "Client and fixture server exchanging four requests (GET list, POST new record, PUT replace, DELETE) with request lines, headers and status replies shown message by message, including an unknown path answered by a 200 HTML fallback page instead of JSON." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the status, response.ok and Content-Type for four exchanges with the platform fixture endpoint: an existing fixture, a missing one, a POST to a read-only route and an unknown path answered by a 200 HTML fallback page." }
      - { kind: run-change, runtime: browser-js, summary: "Send the four requests, print the status and selected headers of each Response, then change the method and the Accept header and compare." }
      - { kind: write, runtime: browser-js, summary: "Write requestJson(url, options) that sends Accept: application/json, checks response.ok and the Content-Type before parsing, and returns { ok: true, value } | { ok: false, error } instead of throwing." }
    retrieval:
      - { concept: "checking the status before reading the body", from: js-08-06-fetch-basics }
  - id: js-16-03-cookies-storage-origins
    title: { uk: "Cookie, сховище та origin", en: "Cookies, storage and origins" }
    kind: instructional
    minutes: 12
    objectives:
      - "Decide whether two URLs share an origin (scheme, host, port) and therefore share localStorage and sessionStorage."
      - "Compare a cookie's scope (Domain, Path, SameSite, HttpOnly, Secure, lifetime) with web storage, and say which of them travel with requests and which scripts can read."
    subskills:
      - { family: W-04, skill: "cookies/storage/origins", depth: intro }
    misconceptions:
      - "localStorage is shared by every page on localhost."
      - "Cookies and localStorage are the same thing; cookies are just the older version."
    prerequisites: [js-16-02-http-methods-status-headers, js-07-05-persist-reload]
    glossary: [origin, cookie, cookie-attributes]
    visual: { kind: diagram, concept: "Three origins (two localhost ports and one other host) drawn as separate storage boxes; stepping through shows which localStorage keys each page can read and which cookies the browser attaches to each request according to Domain, Path and SameSite, including a host-only cookie that ignores the port." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of four URLs (another port, another path, https, a subdomain) share localStorage with http://localhost:5173 and which receive a host-only cookie set there." }
      - { kind: run-change, runtime: browser-js, summary: "Compare the four pairs with new URL(a).origin, then parse a recorded Set-Cookie header into its attributes and change one attribute at a time to see how the scope changes." }
      - { kind: local-task, runtime: local-web, summary: "Serve the same page on two local ports, write a localStorage key and a cookie on one, and confirm in the DevTools Application panel that the other port sees the cookie but not the key." }
      - { kind: write, runtime: browser-js, summary: "Write sameOrigin(a, b) with the URL API and a table that states, for localStorage, sessionStorage and cookies, the scope, whether it travels with requests and whether scripts can read it." }
    retrieval:
      - { concept: "storage that belongs to the page's origin", from: js-07-05-persist-reload }
      - { concept: "saved data after the exported app moved to a new origin", from: js-10-03-compare-and-inspect }
  - id: js-16-04-same-origin-cors
    title: { uk: "Same-origin, CORS і preflight", en: "Same-origin, CORS and preflight" }
    kind: instructional
    minutes: 15
    objectives:
      - "Explain the same-origin policy as a browser rule about reading responses, and predict from the Access-Control-Allow-* headers whether a script can read a cross-origin response."
      - "Predict when the browser sends an OPTIONS preflight (method, custom header, JSON content type) and what credentials: 'include' additionally requires."
      - "Explain why a CORS error appears in the console even though the server may have received and processed the request."
    subskills:
      - { family: W-04, skill: "same-origin/CORS/preflight/credentials", depth: intro }
    misconceptions:
      - "CORS protects my server from other websites."
      - "A CORS error means the server is down or rejected the request."
      - "Adding mode: 'no-cors' fixes a CORS error."
    prerequisites: [js-16-03-cookies-storage-origins, js-16-02-http-methods-status-headers]
    glossary: [same-origin-policy, cors, preflight-request, credentialed-request]
    visual: { kind: sequence, concept: "Page, browser and a fixture server on another origin as three actors: a simple GET, a JSON POST preceded by an OPTIONS preflight, and a GET whose response lacks Access-Control-Allow-Origin; the server answers every time, but in the last case the browser withholds the body and the script sees only a rejected fetch." }
    difficultConcept: client-server-boundary
    analogy: "A reception desk between buildings: your script may send a note to an office in another building, but the receptionist (the browser) hands the reply back only if it carries that office's stamp naming your building, and for unusual notes the receptionist phones ahead first (preflight) (limit: the desk protects the reader in the browser, not the server; a simple request still arrives and may be processed, and non-browser clients such as curl skip the desk entirely)."
    practice:
      - { kind: predict, runtime: browser-js, summary: "Given the page origin http://localhost:5173 and recorded response headers, predict for four requests to http://localhost:8080 (simple GET, GET with a custom header, JSON POST, GET with credentials: 'include') whether a preflight is sent and whether the script can read the response." }
      - { kind: run-change, runtime: browser-js, summary: "Run corsDecision(request, responseHeaders), a provided model of the browser's rules, on the same four cases, then change Access-Control-Allow-Origin, Allow-Headers and Allow-Credentials and confirm each prediction." }
      - { kind: local-task, runtime: local-web, summary: "With two local servers (the page on one port, a JSON fixture on another), observe the real CORS failure in DevTools and the request in the fixture server's log, then allow only the page's origin and confirm the response becomes readable." }
      - { kind: write, runtime: browser-js, summary: "Write a diagnosis note for a seeded failing request: the two origins, whether a preflight was needed, which response header is missing and why the server log still shows the request." }
    retrieval:
      - { concept: "what a rejected fetch looks like to the code", from: js-08-07-failures-loading-error }
  - id: js-16-05-devtools-network-failures
    title: { uk: "Діагностика збоїв на панелі Network", en: "Diagnosing failures in the network panel" }
    kind: instructional
    minutes: 12
    objectives:
      - "Read a request in the network panel (status, timing, initiator, request and response headers, preview) and match it to the code that sent it."
      - "Reproduce offline, slow-network and aborted requests with DevTools and classify each outcome as an HTTP error response, a rejected fetch, a timeout or an abort."
    subskills:
      - { family: W-04, skill: "network/offline failures", depth: practice }
      - { family: W-04, skill: "fetch response checks", depth: practice }
    misconceptions:
      - "If the console shows no error, the request succeeded."
      - "A request marked (failed) or (canceled) in the network panel came back from the server with an error status."
    prerequisites: [js-16-04-same-origin-cors, js-08-07-failures-loading-error]
    glossary: [network-throttling]
    visual: { kind: sequence, concept: "A timeline of five fixture requests as the network panel records them (200, 404, 500, an offline rejection and a request canceled by AbortController), each linked to the branch of the response-check code it reaches." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the network-panel status and the code's outcome for the fixture load online, offline, under slow-network throttling with a 2-second timeout, and aborted after 100 ms." }
      - { kind: run-change, runtime: browser-js, summary: "Toggle offline and throttling in DevTools while the fixture list loads and match each network-panel row (status, timing, initiator) to the loading or error state the page shows." }
      - { kind: write, runtime: browser-js, summary: "Write classifyFailure(outcome) that labels a load as http-error, network-error, timeout, aborted or invalid-json, and show a distinct message for each." }
    retrieval:
      - { concept: "canceling a stale request with AbortController", from: js-08-09-cancellation-abort }
  - id: js-16-06-untrusted-input-safe-output
    title: { uk: "Недовірене введення та безпечний вивід", en: "Untrusted input and safe output" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace a piece of untrusted text (form field, URL parameter, stored record, fetched fixture) from its source to every place it is displayed, and mark each trust boundary."
      - "Name the output context (text, attribute, URL, HTML) of each display and choose the safe API for it."
    subskills:
      - { family: W-05, skill: "untrusted input and safe output", depth: intro }
    misconceptions:
      - "Data my own app stored is safe to display as HTML."
      - "Validating input once on the form makes every later output safe."
    prerequisites: [js-16-05-devtools-network-failures, js-06-09-text-vs-html]
    glossary: [untrusted-input, trust-boundary, output-context]
    visual: { kind: diagram, concept: "A data-flow map from four sources (form field, URL query, localStorage, fetched JSON) to three sinks (textContent, an attribute, innerHTML); stepping through follows one synthetic name containing an img tag with an onerror attribute and highlights where it stays text and where it would become markup." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict what the page shows when a synthetic record named <b>Lamp</b> is displayed via textContent, as a title attribute set with setAttribute, and via innerHTML." }
      - { kind: run-change, runtime: browser-js, summary: "Run the sample page with a markup-containing fixture name, switch each display from innerHTML to textContent or a created element, and compare the resulting DOM trees." }
      - { kind: write, runtime: browser-js, summary: "Write a source-to-sink table for the sample page (each untrusted value, its source, its output context, the API that displays it) and rewrite renderRecordCard(record) with createElement and textContent only." }
    retrieval:
      - { concept: "textContent versus innerHTML", from: js-06-09-text-vs-html }
  - id: js-16-07-xss-safe-sinks
    title: { uk: "XSS і безпечні sinks", en: "XSS and safe sinks" }
    kind: instructional
    minutes: 12
    objectives:
      - "Explain how stored and reflected XSS turn untrusted text into executed script through an unsafe sink."
      - "Classify DOM APIs as safe or unsafe sinks (innerHTML, insertAdjacentHTML, outerHTML, document.write, javascript: URLs in href, inline event attributes) and replace each unsafe use."
      - "Explain what a Content-Security-Policy adds as a second layer and why it does not replace safe sinks."
    subskills:
      - { family: W-05, skill: "XSS threat/safe sinks", depth: intro }
    misconceptions:
      - "Replacing < and > by hand makes innerHTML safe in every context."
      - "XSS only matters for sites with logins; a local app has nothing to steal."
    prerequisites: [js-16-06-untrusted-input-safe-output]
    glossary: [xss, stored-xss, reflected-xss, safe-sink, content-security-policy]
    visual: { kind: diagram, concept: "A synthetic payload travels from a stored fixture through an innerHTML sink into the DOM, where the parsed img element's onerror handler runs; the same payload through textContent stays one text node, and a CSP box blocks an inline script as a second layer." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict which of five renderings of a synthetic payload runs code: innerHTML, textContent, insertAdjacentHTML, an href built from a javascript: URL, and a title attribute in an innerHTML template after replacing only < and >." }
      - { kind: run-change, runtime: browser-js, summary: "Run the lab page with the payload fixtures (each payload only writes a harmless marker to the console), switch every unsafe sink to a safe one and confirm the marker no longer appears." }
      - { kind: write, runtime: browser-js, summary: "Write safeLink(url) that accepts only http: and https: URLs parsed with the URL API, and use it for every link built from record data." }
    retrieval:
      - { concept: "addEventListener versus inline handler attributes", from: js-06-10-events-default-behavior }
  - id: js-16-08-secrets-storage-privacy
    title: { uk: "Жодних секретів у бандлі; сховище та приватність", en: "No secrets in the bundle; storage and privacy" }
    kind: instructional
    minutes: 10
    objectives:
      - "Show that a key, token or env value read by client code is readable in the shipped bundle, and say where a real secret must live instead."
      - "Decide for each value the capstone keeps whether it belongs in localStorage, sessionStorage, a cookie or nowhere, and give the user a way to clear it."
    subskills:
      - { family: W-05, skill: "no secret in client bundle", depth: intro }
      - { family: W-05, skill: "storage/privacy", depth: intro }
    misconceptions:
      - "A value in a .env file stays secret even when front-end code reads it."
      - "Minifying or obfuscating the bundle hides an API key."
    prerequisites: [js-16-07-xss-safe-sinks, js-15-06-build-env-sourcemaps]
    glossary: [client-side-secret, data-minimization, personal-data]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict whether a reader can recover a synthetic API key that the sample page's script reads from a build-time constant, after minification and with source maps turned off." }
      - { kind: run-change, runtime: browser-js, summary: "Find the synthetic key in the sample page's script through the Sources panel and a text search, then remove it and replace the call with a note naming the server-side component that would hold it." }
      - { kind: local-task, runtime: local-web, summary: "Build your local project with a synthetic env value exposed to client code, search the build output folder for it, then remove the reference, rebuild and confirm the search comes back empty." }
      - { kind: write, runtime: browser-js, summary: "Write a storage inventory for the capstone (every key, what it holds, why it is needed, how long it lives) and a clearAll() that removes exactly those keys." }
    retrieval:
      - { concept: "env and config values baked into a build", from: js-15-06-build-env-sourcemaps }
  - id: js-16-09-debug-http-fetch-cors
    title: { uk: "Налагодження: HTTP-помилка, відхилений fetch чи CORS", en: "Debug: HTTP error vs rejected fetch vs CORS" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose from the network panel and the console alone whether a seeded failure is an HTTP error response, a rejected fetch or a CORS block."
      - "Repair the client so each failure class gets the right state and message, a non-JSON body is never parsed and retries apply only to retryable failures."
    subskills:
      - { family: W-04, skill: "HTTP methods/status/headers", depth: assess }
      - { family: W-04, skill: "JSON content types", depth: assess }
      - { family: W-04, skill: "fetch response checks", depth: assess }
      - { family: W-04, skill: "same-origin/CORS/preflight/credentials", depth: assess }
      - { family: W-04, skill: "network/offline failures", depth: assess }
    misconceptions:
      - "Every failed request should be retried the same way."
      - "A CORS block can be fixed in the client code."
    prerequisites: [js-16-08-secrets-storage-privacy, js-16-05-devtools-network-failures]
    glossary: []
    visual: { kind: sequence, concept: "The three seeded failures replayed side by side (a 500 with an HTML body, an offline rejection and a CORS-blocked response), showing what the server sent, what the browser exposed to the script and which branch of the buggy handler ran." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Before opening DevTools, predict from the console text alone which of three seeded failures is a 500 with an HTML body, an offline rejection and a CORS block." }
      - { kind: run-change, runtime: browser-js, summary: "Reproduce the 500 and the offline failure against the fixture endpoint, read the recorded transcript of the CORS block, and note status, headers and console text for each." }
      - { kind: local-task, runtime: local-web, summary: "Reproduce the CORS block for real with the two local servers from the CORS lesson and confirm that the fixture server's log shows the request arrived." }
      - { kind: debug, runtime: browser-js, summary: "Repair a seeded loadRecords that treats every resolved fetch as success, parses an HTML body as JSON, retries a 404 and shows “server is down” for a CORS block." }
    retrieval:
      - { concept: "an unhandled rejection from a missing await", from: js-08-11-debug-async }
  - id: js-16-10-independent-safe-client
    title: { uk: "Самостійно: безпечні запити та безпечний вивід", en: "Independent: safe requests and safe output" }
    kind: assessment
    minutes: 30
    objectives:
      - "Implement, without hints, a client for an unseen fixture set that builds encoded URLs, keeps storage within its origin and renders untrusted text through safe sinks only."
      - "Write a short threat note naming the untrusted inputs, the sinks used, what is stored where and why no secret ships to the client."
    subskills:
      - { family: W-04, skill: "URL/query/encoding", depth: assess }
      - { family: W-04, skill: "cookies/storage/origins", depth: assess }
      - { family: W-05, skill: "untrusted input and safe output", depth: assess }
      - { family: W-05, skill: "XSS threat/safe sinks", depth: assess }
      - { family: W-05, skill: "no secret in client bundle", depth: assess }
      - { family: W-05, skill: "storage/privacy", depth: assess }
    misconceptions: []
    prerequisites: [js-16-09-debug-http-fetch-cors]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: for an unseen synthetic event-listings fixture, build search URLs with encoded parameters, render titles and organizer links (http/https only) without innerHTML, store only a filter preference, and pass hidden fixtures with markup, javascript: URLs, Cyrillic text with & and spaces, and a 200 HTML fallback." }
      - { kind: write, runtime: browser-js, summary: "Threat note: the untrusted sources, the chosen sinks, each stored key with its origin scope and lifetime, and why no secret appears in the bundle." }
    retrieval:
      - { concept: "boundary inputs: empty, one, many, null", from: js-09-03-boundary-cases }
  - id: js-16-11-capstone-web-boundary
    title: { uk: "Проєкт: фікстури через HTTP, безпечно", en: "Capstone: fixtures over HTTP, safely" }
    kind: capstone-step
    minutes: 25
    objectives:
      - "Serve the capstone fixtures from a local file server, request them with encoded URLs, handle cancel, one retry and failure states, and render every record text through safe sinks."
    subskills:
      - { family: W-04, skill: "URL/query/encoding", depth: practice }
      - { family: W-05, skill: "untrusted input and safe output", depth: practice }
    misconceptions: []
    prerequisites: [js-16-10-independent-safe-client]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: browser-js, summary: "Rehearse in the sandbox against the platform fixture endpoint: loadRecords(url, signal) with an encoded URL, abort of the previous request, one retry for network failures only, and render helpers that use textContent." }
      - { kind: local-task, runtime: local-web, summary: "In the exported project, serve the fixture JSON with your local static server, switch the app to load it through the new client code, check the requests and the rendered markup-containing names in DevTools, and commit." }
    retrieval:
      - { concept: "async load with loading, error and retry states", from: js-08-13-capstone-async-load }
      - { concept: "validating loaded records that arrive as unknown", from: js-14-11-capstone-typed-domain }
