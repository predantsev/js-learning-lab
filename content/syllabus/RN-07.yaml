# Syllabus spine for RN-07. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: RN-07
stage: RN
title: { uk: "Налагодження й тестування нативного застосунку", en: "Native debugging and testing" }
summary:
  uk: "Учень читає нативні логи збірки й виконання, діагностує збій за його звітом, пише unit-, типізовані доменні та компонентні тести для нативного застосунку, відділяє те, що доводять mocks, від того, що потребує заявленого пристрою, і планує E2E та покриття платформ без публікації в магазині."
  en: "The learner reads native build and runtime logs, diagnoses a crash from its report, writes unit, typed-domain and component tests for the native app, separates what mocks prove from what needs the declared device, and plans E2E and platform coverage without store publication."
competencies: [N-10]
capstoneStep:
  mode: local
  objective:
    uk: "Додати до нативного проєкту unit-, типізовані доменні та компонентні тести, налагодити один реальний локальний нативний збій і задокументувати, які перевірки потребують пристрою."
    en: "Add unit, typed-domain and component tests to the native capstone, debug one real local native failure and document which checks need the device."
  variants:
    wishlist:
      uk: "Unit-тест суми цін бажаних речей, що мають ціну (бажання без ціни рахуються окремо), тест типізованої валідації збереженого бажання, компонентний тест перемикача acquired, знайденого за підписом, а збереження після перезапуску — у списку перевірок на пристрої."
      en: "Unit-test the total price of wanted wishes that have a price (wishes without a price counted separately), add a typed-validation test for a stored wish and a component test for the acquired toggle found by its label, and list persistence across restart as a device check."
    planner:
      uk: "Unit-тест кількості невиконаних справ із терміном до заданого фіксованого дня включно, тест типізованої валідації значень priority, компонентний тест перемикача done, а deep link до справи — у списку перевірок на пристрої."
      en: "Unit-test the count of pending tasks due on or before a fixed given day, add a typed-validation test for priority values and a component test for the done toggle, and list the deep link to a task as a device check."
    habits:
      uk: "Unit-тест простої серії, що закінчується в заданий фіксований день, і того, що completions лишаються унікальними й відсортованими, тест типізованої валідації frequency, компонентний тест кнопки виконання, а зменшений рух і перезапуск — у списку перевірок на пристрої."
      en: "Unit-test the simple streak ending on a fixed given day and that completions stay unique and sorted, add a typed-validation test for frequency and a component test for the completion button, and list reduced motion and restart as device checks."
    expenses:
      uk: "Unit-тест підсумків за категоріями й загальної суми в цілих amountMinor, тест типізованої валідації, що відхиляє нецілу суму, компонентний тест повідомлень валідації форми, а форматування валюти на пристрої — у списку перевірок на пристрої."
      en: "Unit-test per-category and overall totals in integer amountMinor, add a typed-validation test that rejects a non-integer amount and a component test for the form's validation messages, and list on-device currency formatting as a device check."
# Retrieval plan for this unit (attach to lessons as retrieval entries; at least two, from two different earlier units):
#   js-09-05-mocks-vs-real (mocks) ; rn-01-03-env-versions-debug-release (build modes) ; re-06-08-testing-user-actions (user tests) ; rn-05-06-debug-corrupt-schema (recovery)
lessons:
  - id: rn-07-01-native-logs-build-errors
    title: { uk: "Нативні логи й помилки збірки", en: "Native logs and build errors" }
    kind: instructional
    minutes: 12
    objectives:
      - "Locate the first real error in a long native build log (Gradle or Xcode) and tell a configuration error from a code error."
      - "Choose the right log source for a symptom: the Metro/JS console, the device log (logcat or the Xcode/Console app) or the build log."
    subskills:
      - { family: N-10, skill: "native logs/build errors", depth: intro }
    misconceptions:
      - "The last red line in a build log is the cause of the failure."
      - "If the JS console shows nothing, the app produced no error."
    prerequisites: [rn-01-06-debug-setup-failure, rn-01-03-env-versions-debug-release]
    glossary: [native-log, build-log, logcat]
    visual: { kind: diagram, concept: "Where each error surfaces: a JS exception reaches the Metro console and the dev error overlay, a native exception the device log, a Gradle/Xcode failure the build log; stepping through three seeded failures highlights the box where each one first appears." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "For three supplied symptoms (an error overlay with a JS stack, the app closing instantly, a build stopping at a task) predict which log holds the cause." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled log viewer, filter a supplied synthetic Gradle log of several hundred lines down to the first error block, then change the filter to hide the noise lines around it." }
      - { kind: write, runtime: concept-preview, summary: "Write a triage note for a supplied Xcode build log: the first error line, the file or setting it names and the next command to run." }
    retrieval:
      - { concept: "debug versus release builds and where native config lives", from: rn-01-03-env-versions-debug-release }
  - id: rn-07-02-tests-unit-domain-component
    title: { uk: "Тести: unit, типізований домен, компоненти, інтеграція", en: "Unit, typed-domain, component and integration tests" }
    kind: instructional
    minutes: 12
    objectives:
      - "Place a given check at the right level: unit (pure domain function), typed-domain (types and runtime validation agree), component (a rendered screen responds to user actions) or integration (screen, adapter and mock service together)."
      - "Write a component test that finds a native element by its accessible label or role and asserts on what the user sees, not on internal state."
    subskills:
      - { family: N-10, skill: "unit/typed-domain/component/integration tests", depth: intro }
    misconceptions:
      - "Component tests run on the phone, so they prove native rendering."
      - "A passing type check proves the stored JSON is valid at runtime."
    prerequisites: [rn-07-01-native-logs-build-errors, re-06-08-testing-user-actions]
    glossary: [type-level-test, native-component-test]
    visual: { kind: diagram, concept: "Four test levels as nested boxes around the native app (domain function, typed model plus validator, rendered screen in the host test runner, screen plus adapter plus mock service); each seeded defect highlights the smallest box that catches it, and a separate device box shows what none of them reach." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which of four supplied tests (domain total, type-only check, rendered-row toggle, screen-plus-mock-adapter save) fails for each of three seeded defects." }
      - { kind: run-change, runtime: concept-preview, summary: "Run the supplied suite in the labeled test preview, break the domain total and then the row's accessible label, and see which tests turn red." }
      - { kind: write, runtime: concept-preview, summary: "Write a component test that presses a row's toggle found by its accessible label and asserts that the visible status text changes." }
    retrieval:
      - { concept: "test async UI through user actions, not internals", from: re-06-08-testing-user-actions }
  - id: rn-07-03-mocks-vs-device-checks
    title: { uk: "Mocks проти перевірок на пристрої", en: "Mocks vs device checks" }
    kind: instructional
    minutes: 10
    objectives:
      - "List, for a native storage adapter, what a mocked native module proves (call contract, error handling) and what only a device check proves (persistence across restart, permissions, OS behavior)."
      - "Record each mock-only gap as an explicit device check with its target and expected observation."
    subskills:
      - { family: N-10, skill: "mocks vs target/device checks", depth: intro }
    misconceptions:
      - "The default native mocks in the test setup behave like the real modules on both platforms."
      - "Behavior that cannot be mocked cannot be checked, so it can be left out of the test plan."
    prerequisites: [rn-07-02-tests-unit-domain-component, js-09-05-mocks-vs-real]
    glossary: [mock-gap, device-check]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict whether the supplied secure-storage test with a mocked module still passes when the scenario's real read fails after a device restart." }
      - { kind: run-change, runtime: concept-preview, summary: "Change the supplied storage mock to return what a recorded device log actually returned, and watch the hidden assumption fail in the labeled test preview." }
      - { kind: write, runtime: concept-preview, summary: "Write a mock-gap list for the supplied adapter tests: each gap, the device check that covers it, the declared target and the expected observation." }
    retrieval:
      - { concept: "what a mock can and cannot prove", from: js-09-05-mocks-vs-real }
      - { concept: "secure storage behind an adapter contract", from: rn-09-01-secure-vs-ordinary-storage }
  - id: rn-07-04-crash-diagnosis
    title: { uk: "Діагностика збоїв", en: "Crash diagnosis" }
    kind: instructional
    minutes: 12
    objectives:
      - "Tell a JS exception, a native crash and an out-of-memory kill apart from their first log lines and the app's visible behavior."
      - "Follow a crash report from the symptom to a reproducible step, then read a symbolicated stack down to the responsible module."
    subskills:
      - { family: N-10, skill: "crash diagnosis", depth: intro }
    misconceptions:
      - "An app that closes without an error overlay has no error to find."
      - "A release-build stack trace is useless because the code is minified."
    prerequisites: [rn-07-03-mocks-vs-device-checks, js-07-01-call-stack-and-errors]
    glossary: [native-crash, symbolication, crash-report]
    visual: { kind: sequence, concept: "Over time: the user taps save, JS calls a native module with a null argument, the native side throws, the process dies, the OS writes a crash report and the developer symbolicates it; each message highlights which log or report captures that moment." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict from three supplied crash excerpts which is a JS exception, which a native crash and which an out-of-memory kill." }
      - { kind: run-change, runtime: concept-preview, summary: "Map a minified release stack with the supplied source map in the labeled viewer and compare the frame names before and after." }
      - { kind: write, runtime: concept-preview, summary: "Write reproduction steps and a hypothesis for a supplied crash report, naming the first frame that belongs to your own code." }
    retrieval:
      - { concept: "reading a stack trace from the top frame", from: js-07-01-call-stack-and-errors }
      - { concept: "recover from corrupt stored data instead of crashing on load", from: rn-05-06-debug-corrupt-schema }
  - id: rn-07-05-e2e-platform-deployment-concepts
    title: { uk: "E2E, покриття платформ і поняття розгортання", en: "E2E, platform coverage and deployment concepts" }
    kind: instructional
    minutes: 10
    objectives:
      - "Fill a platform coverage matrix for one feature: which checks run on the declared target, which rely on supplied evidence for the other platform, and which stay unperformed."
      - "Describe what an E2E test on an emulator adds over component tests, and name the deployment steps (build, sign, distribute) without requiring a store publication."
    subskills:
      - { family: N-10, skill: "E2E and platform difference coverage", depth: intro }
    misconceptions:
      - "Testing on one platform is enough because the React Native code is shared."
      - "Deployment means publishing to a store, so without a store account there is nothing to practice."
    prerequisites: [rn-07-04-crash-diagnosis, rn-02-06-platform-differences]
    glossary: [platform-coverage-matrix]
    visual: { kind: diagram, concept: "A coverage matrix with features as rows and the declared target, the other platform and the host test runner as columns; stepping fills each cell as verified, supplied evidence or unperformed, and shows that a component-test pass never fills a device column." }
    analogy: null
    practice:
      - { kind: predict, runtime: concept-preview, summary: "Predict which cells of a supplied coverage matrix a component-test pass can fill and which must stay empty." }
      - { kind: run-change, runtime: concept-preview, summary: "In the labeled matrix preview, mark the other platform unsupported for this workstation and see which feature rows must carry a skip record." }
      - { kind: write, runtime: concept-preview, summary: "Write a three-step E2E flow (open the list, add a record, restart and confirm it persists) and state on which target it must run." }
    retrieval:
      - { concept: "UI and behavior differences between platforms", from: rn-02-06-platform-differences }
  - id: rn-07-06-debug-real-native-failure
    title: { uk: "Налагодження: реальний локальний нативний збій", en: "Debug: a real local native failure" }
    kind: local-task
    minutes: 25
    objectives:
      - "Reproduce a seeded native failure on the declared target, find its cause from the build or device log and repair it."
      - "Prove the fix on the target with learner-confirmed evidence and name the log line that led to it."
    subskills:
      - { family: N-10, skill: "native logs/build errors", depth: assess }
      - { family: N-10, skill: "crash diagnosis", depth: assess }
    misconceptions: []
    prerequisites: [rn-07-05-e2e-platform-deployment-concepts]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: local-task, runtime: local-native, summary: "Build the seeded lab project (a development build, not Expo Go) for the declared target: expo-camera from the next SDK is expected to stop the build (not verified on the authoring workstation; npx expo install --check names the pair), and, once that is fixed, the capture screen fails because the camera declaration is missing — on iOS a fatal error raised by expo-camera 57 for a missing NSCameraUsageDescription, on Android a refused request without a dialog (blockedPermissions); capture the decisive log excerpts." }
      - { kind: debug, runtime: concept-preview, summary: "In-course debug exercise: in a labeled simulation of the toolchain (version check, prebuild output and the expo-camera iOS fatal message, all checked against a real SDK 57 project), repair deps.js and appJson.js and quote the first decisive line of each failure; works without native tooling." }
      - { kind: debug, runtime: local-native, summary: "Repair both failures, regenerate the native folders, rebuild, confirm the capture screen works on the declared target and record the first decisive log line for each failure." }
    retrieval:
      - { concept: "a missing permission declaration versus a denied permission", from: rn-09-05-deny-revoke-unavailable }
  - id: rn-07-07-independent-test-suite
    title: { uk: "Самостійно: тести й задокументовані прогалини mocks", en: "Independent: tests and documented mock gaps" }
    kind: assessment
    minutes: 35
    objectives:
      - "Write, without hints, unit, typed-domain and component tests for a supplied synthetic native feature that fail for the hidden seeded defects."
      - "Document every check the mocks cannot prove and perform at least one of those checks on the declared target."
    subskills:
      - { family: N-10, skill: "unit/typed-domain/component/integration tests", depth: assess }
      - { family: N-10, skill: "mocks vs target/device checks", depth: assess }
    misconceptions: []
    prerequisites: [rn-07-06-debug-real-native-failure]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: concept-preview, summary: "No-hint task, in-course part: for a supplied synthetic 'reading log' feature, write domain unit tests, a typed-validation test and a component test by accessible label that catch the hidden defects (checked in the labeled test preview)." }
      - { kind: local-task, runtime: local-native, summary: "No-hint local part: run the same tests with real Jest and a type-level test with tsc in a local Expo SDK 57 project, list each mock-only gap with its device check, and confirm one gap on the declared target with recorded evidence." }
    retrieval:
      - { concept: "boundary cases: empty, one, many, null", from: js-09-03-boundary-cases }
  - id: rn-07-08-capstone-native-tests
    title: { uk: "Проєкт: нативні тести", en: "Capstone: native tests" }
    kind: capstone-step
    minutes: 35
    objectives:
      - "Add unit, typed-domain and component tests to the native capstone and record which of its behaviors remain device-only checks."
    subskills:
      - { family: N-10, skill: "unit/typed-domain/component/integration tests", depth: practice }
    misconceptions: []
    prerequisites: [rn-07-07-independent-test-suite]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-native, summary: "In the native project, add tests for the domain's derived value with a fixed today date, a typed-validation test for stored JSON and a component test for the main row action; run them, then perform one listed device check on the declared target and record it." }
    retrieval:
      - { concept: "deterministic fixtures and a fixed today date", from: js-09-04-deterministic-fixtures }
