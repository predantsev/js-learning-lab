# Syllabus spine for JS-11. Schema and rules: content/syllabus/README.md. Validate: node scripts/content/validate-syllabus.mjs
unit: JS-11
stage: JS
title: { uk: "this, прототипи та класи проти композиції", en: "this, prototypes and classes vs composition" }
summary:
  uk: "Учень передбачає, на що вказує this у методах, стрілкових функціях, від’єднаних callback-ах та обробниках подій, виправляє загублений this через bind або стрілку, простежує пошук властивості ланцюжком прототипів, пише конструктори й класи з приватними та статичними членами, читає getters/setters і дескриптори, а також обирає й обґрунтовує успадкування чи композицію для невеликої моделі."
  en: "The learner predicts what this refers to in methods, arrow functions, detached callbacks and event handlers, repairs a lost this with bind or an arrow, follows a property lookup along the prototype chain, writes constructors and classes with private and static members, reads getters/setters and descriptors, and chooses and justifies inheritance or composition for a small model."
competencies: [J-04, J-06]
capstoneStep:
  mode: local
  objective:
    uk: "Обгорнути репозиторій свого проєкту в клас і в еквівалентний композиційний модуль; дослідити прив’язку this в обробниках подій і замикання, що утримують дані."
    en: "Wrap the capstone repository as a class and as an equivalent compositional module; inspect this-binding in handlers and retained closures."
  variants:
    wishlist:
      uk: "Клас `WishlistRepository` із приватним `#items` і методами `add`, `toggleAcquired` та `totalWantedPrice`, а поруч еквівалентна фабрика `createWishlistRepository(storage)`; обидва проходять ті самі тести, а обробник кнопки «Отримано» не губить this."
      en: "A `WishlistRepository` class with a private `#items` field and `add`, `toggleAcquired` and `totalWantedPrice` methods, plus an equivalent `createWishlistRepository(storage)` factory; both pass the same tests and the “Acquired” button handler keeps the right this."
    planner:
      uk: "Клас `PlannerRepository` із приватним `#tasks` і методами `add`, `toggleDone` та `countDueBy(today)`, а поруч еквівалентна фабрика `createPlannerRepository(storage)`; обидва проходять ті самі тести, а обробник позначки «Виконано» не губить this."
      en: "A `PlannerRepository` class with a private `#tasks` field and `add`, `toggleDone` and `countDueBy(today)` methods, plus an equivalent `createPlannerRepository(storage)` factory; both pass the same tests and the “Done” toggle handler keeps the right this."
    habits:
      uk: "Клас `HabitRepository` із приватним `#habits` і методами `add`, `markCompleted(id, date)` та `setActive`, а поруч еквівалентна фабрика `createHabitRepository(storage)`; обидва проходять ті самі тести, а обробник кнопки виконання не губить this."
      en: "A `HabitRepository` class with a private `#habits` field and `add`, `markCompleted(id, date)` and `setActive` methods, plus an equivalent `createHabitRepository(storage)` factory; both pass the same tests and the completion button handler keeps the right this."
    expenses:
      uk: "Клас `ExpenseRepository` із приватним `#expenses` і методами `add`, `remove` та `totalByCategory` (у `amountMinor`), а поруч еквівалентна фабрика `createExpenseRepository(storage)`; обидва проходять ті самі тести, а обробник кнопки видалення не губить this."
      en: "An `ExpenseRepository` class with a private `#expenses` field and `add`, `remove` and `totalByCategory` (in `amountMinor`) methods, plus an equivalent `createExpenseRepository(storage)` factory; both pass the same tests and the delete button handler keeps the right this."
# Retrieval plan: js-03-05-closures (closure) ; js-04-05-objects-properties (ownership) ; js-06-10-events-default-behavior (handlers) ; js-09-05-mocks-vs-real (tests)
lessons:
  - id: js-11-01-this-lexical-dynamic
    title: { uk: "this: лексичний у стрілкових функціях і динамічний у викликах", en: "this: lexical arrows vs dynamic calls" }
    kind: instructional
    minutes: 12
    objectives:
      - "Predict what this refers to when the same method is called as obj.method(), as a detached function and as a callback, in a module (strict mode)."
      - "Explain why an arrow function takes this from the surrounding scope while a regular function gets it from the call site."
    subskills:
      - { family: J-04, skill: "lexical vs dynamic this", depth: intro }
    misconceptions:
      - "this always means the object the function was written inside."
      - "An arrow function is just shorter syntax, so it gets this the same way a regular function does."
    prerequisites: [js-03-03-arrow-functions, js-04-05-objects-properties]
    glossary: [this-binding, lexical-this, detached-method]
    visual: { kind: code-trace, concept: "One record method called three ways — record.label(), a detached const f = record.label; f(), and an inner arrow inside label — with the call site highlighted and the value this receives shown in each call frame." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict what this.name gives for a synthetic record's label() called as record.label(), as a detached f() and from an inner arrow inside label." }
      - { kind: run-change, runtime: browser-js, summary: "Run the three calls, turn the inner arrow into a regular function and watch this become undefined, then switch it back." }
      - { kind: write, runtime: browser-js, summary: "Write a tally object whose addAll(ids) method uses forEach with an arrow callback to increase this.count, and show the count for three ids." }
    retrieval:
      - { concept: "what a closure captures from where it was created", from: js-03-05-closures }
  - id: js-11-02-call-apply-bind
    title: { uk: "Методи call, apply і bind", en: "call, apply, bind" }
    kind: instructional
    minutes: 10
    objectives:
      - "Call a function with an explicit this using call and apply, and state how their argument lists differ."
      - "Create a bound function with bind for an event handler and predict that binding it again does not change its this."
    subskills:
      - { family: J-04, skill: "call/apply/bind", depth: intro }
    misconceptions:
      - "bind changes the original function, so every later call of it uses the new this."
      - "Calling bind again on a bound function rebinds this to the new object."
    prerequisites: [js-11-01-this-lexical-dynamic, js-03-02-parameters-default-rest]
    glossary: [bound-function, partial-application]
    visual: { kind: code-trace, concept: "call and apply run the function at once with the chosen this and arguments, while bind returns a new function object whose this is already pinned when a click handler calls it later." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the output of describe.call(item, '→'), describe.apply(item, ['→']) and a bare describe.bind(item) with no call after it." }
      - { kind: run-change, runtime: browser-js, summary: "Run them, bind a detached method to one object, bind the result to a second object and confirm the first binding still wins." }
      - { kind: write, runtime: browser-js, summary: "Attach a counter object's increment method as a button click handler once with bind and once with an arrow wrapper; both must update the same counter." }
    retrieval:
      - { concept: "what a listener receives when an event fires", from: js-06-10-events-default-behavior }
  - id: js-11-03-prototype-chain
    title: { uk: "Ланцюжок прототипів", en: "The prototype chain" }
    kind: instructional
    minutes: 12
    objectives:
      - "Trace a property read along the prototype chain and name the object where the lookup stops, or reach null."
      - "Tell an own property from an inherited one with Object.hasOwn and the in operator."
      - "Explain why assigning to an inherited name creates an own property instead of changing the prototype."
    subskills:
      - { family: J-06, skill: "prototype chain and own properties", depth: intro }
    misconceptions:
      - "Every object physically carries its own copy of all the methods it can call."
      - "Writing obj.x = 1 changes x on the prototype when that is where x came from."
    prerequisites: [js-11-02-call-apply-bind, js-04-05-objects-properties]
    glossary: [prototype, prototype-chain, property-shadowing]
    visual: { kind: diagram, concept: "Boxes for an object made with Object.create(proto), proto and Object.prototype linked by [[Prototype]] arrows; each lookup step lights up the box being searched until the property is found or null is reached." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict item.describe(), Object.hasOwn(item, 'describe'), 'describe' in item and item.toString for an object created with Object.create(proto)." }
      - { kind: run-change, runtime: browser-js, summary: "Run the lookups, assign item.describe directly and watch the own property shadow the prototype's method; delete it and see the prototype method return." }
      - { kind: write, runtime: browser-js, summary: "Write ownEntries(obj) that returns only own enumerable entries of an object with an inherited property, and compare its result with a for-in loop." }
    retrieval:
      - { concept: "who owns a property of an object", from: js-04-05-objects-properties }
  - id: js-11-04-constructor-new
    title: { uk: "Функції-конструктори й оператор new", en: "Constructors and new" }
    kind: instructional
    minutes: 10
    objectives:
      - "List what new does — creates an object, links its prototype, runs the constructor with this set to it, returns it — and predict what happens when new is forgotten."
      - "Show that methods on Constructor.prototype are shared by every instance rather than copied."
    subskills:
      - { family: J-06, skill: "constructor/new", depth: intro }
    misconceptions:
      - "new copies the constructor's methods into every new object."
      - "Calling a constructor without new just returns the same object anyway."
    prerequisites: [js-11-03-prototype-chain]
    glossary: [constructor-function, new-operator, instance]
    visual: { kind: memory-graph, concept: "new Item('Lamp', 45) step by step: a fresh heap object appears, its [[Prototype]] arrow attaches to Item.prototype, this points at it while the constructor runs, and a second instance shares the same describe method object." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict a.describe === b.describe, Object.getPrototypeOf(a) === Item.prototype, and what Item('x', 1) without new does in a module." }
      - { kind: run-change, runtime: browser-js, summary: "Run it, move describe from Item.prototype into the constructor body and compare the identity of the two instances' methods." }
      - { kind: write, runtime: browser-js, summary: "Write a Counter constructor with a prototype increment method and show that two instances count independently." }
    retrieval:
      - { concept: "two names pointing at one object", from: js-04-07-reference-identity }
  - id: js-11-05-classes-private-static
    title: { uk: "Класи: поля, приватні та статичні члени", en: "Classes: fields, private and static" }
    kind: instructional
    minutes: 12
    objectives:
      - "Rewrite a constructor with prototype methods as a class and show that its methods still live on the prototype."
      - "Protect an invariant with a #private field and create instances through a static factory, predicting what access from outside does."
    subskills:
      - { family: J-06, skill: "classes/private/static fields", depth: intro }
    misconceptions:
      - "A class creates a brand-new object system that has nothing to do with prototypes."
      - "A field whose name starts with an underscore is private, just like a # field."
    prerequisites: [js-11-04-constructor-new]
    glossary: [class-syntax, class-field, private-field, static-member]
    visual: { kind: diagram, concept: "A class declaration beside the objects it creates: public fields and #private slots on each instance, methods on the prototype and static members on the class itself; selecting a line of the class highlights where it lands." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict whether counter.#count, counter._count, Counter.fromJSON(data) and counter.fromJSON work for a class with a private field, an underscore field and a static factory." }
      - { kind: run-change, runtime: browser-js, summary: "Run the class, read the SyntaxError for outside #count access, then add a value() method that returns the count and call it." }
      - { kind: write, runtime: browser-js, summary: "Write a BoundedCounter class whose private #count stays between 0 and a max, with a static fromJSON(data) that rejects invalid input." }
    retrieval:
      - { concept: "keeping a binding private by not exporting it", from: js-07-06-esm-import-export }
  - id: js-11-06-getters-setters-descriptors
    title: { uk: "Getters, setters і дескриптори властивостей (читання)", en: "Getters, setters and descriptors (reading)" }
    kind: instructional
    minutes: 10
    objectives:
      - "Read a getter and a setter in existing code and predict when each one runs."
      - "Read a descriptor with Object.getOwnPropertyDescriptor and explain what writable, enumerable and configurable change."
    subskills:
      - { family: J-06, skill: "methods/getters/setters/property descriptors reading", depth: intro }
    misconceptions:
      - "A getter is just a stored field, so reading it can never run code or give a different value."
      - "A property that does not show up in Object.keys does not exist."
    prerequisites: [js-11-05-classes-private-static]
    glossary: [getter, setter, property-descriptor]
    visual: null
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the log order when a class with a logging get total() is read twice and its set price(v), which rejects negatives, receives -5." }
      - { kind: run-change, runtime: browser-js, summary: "Run it, inspect the descriptor of a data field and of the getter on the prototype, then make one property non-enumerable and compare Object.keys with JSON.stringify." }
      - { kind: write, runtime: browser-js, summary: "Add a read-only computed label getter to a small class and show with its descriptor that it has no setter." }
    retrieval:
      - { concept: "what JSON.stringify keeps from an object", from: js-07-04-json }
  - id: js-11-07-inheritance-vs-composition
    title: { uk: "Успадкування чи композиція", en: "Inheritance vs composition" }
    kind: instructional
    minutes: 12
    objectives:
      - "Implement the same behaviour once as a subclass with extends/super and once as a composed object that delegates to a collaborator."
      - "Explain for a given change request which design breaks fewer callers, naming the fragile base class problem."
      - "Compare a class, a factory with closures and plain data plus functions by privacy, testability and serialization."
    subskills:
      - { family: J-06, skill: "inheritance vs composition", depth: intro }
      - { family: J-06, skill: "object model tradeoffs", depth: intro }
    misconceptions:
      - "Inheritance is the normal way to reuse code; composition is only for special cases."
      - "A subclass can safely override any method without knowing how the base class uses it."
    prerequisites: [js-11-06-getters-setters-descriptors, js-03-06-higher-order-callbacks]
    glossary: [inheritance, subclass, composition, delegation, adapter]
    visual: { kind: diagram, concept: "Two designs of the same counting list: an extends chain where a change inside the base class doubles the subclass's count, and a composed object holding a list collaborator; a step highlights which boxes the change request touches." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Predict the count when the base List.addAll() is changed to call this.add() internally while a CountingList subclass overrides both add and addAll to count items." }
      - { kind: run-change, runtime: browser-js, summary: "Run the double-count defect, replace the subclass with a composed countingList(list) that delegates, and compare the counts." }
      - { kind: write, runtime: browser-js, summary: "Write withLogging(store), which adds logging to any object with get/set by wrapping it, without inheriting from it." }
    retrieval:
      - { concept: "passing behaviour into a function as an argument", from: js-03-06-higher-order-callbacks }
  - id: js-11-08-debug-lost-this-inherited
    title: { uk: "Налагодження: загублений this і помилки успадкованих властивостей", en: "Debug: lost this and inherited-property bugs" }
    kind: instructional
    minutes: 15
    objectives:
      - "Diagnose a TypeError from a detached method used as a handler or timer callback and repair it with bind or an arrow without changing the method's behaviour."
      - "Find data shared by accident through the prototype and a constructor called without new, and move the state onto each instance."
    subskills:
      - { family: J-04, skill: "lexical vs dynamic this", depth: assess }
      - { family: J-04, skill: "call/apply/bind", depth: assess }
      - { family: J-06, skill: "prototype chain and own properties", depth: assess }
      - { family: J-06, skill: "constructor/new", depth: assess }
    misconceptions:
      - "If the method works when I call it directly, it will also work when I pass it as a callback."
    prerequisites: [js-11-07-inheritance-vs-composition]
    glossary: []
    visual: { kind: code-trace, concept: "The failing click replayed: the handler frame shows this as the button element instead of the store, and a second trace shows two instances pushing into one tags array that lives on their shared prototype." }
    analogy: null
    practice:
      - { kind: predict, runtime: browser-js, summary: "Before running, mark which of four seeded defects throws, which logs the wrong object and which silently shares data: a detached store.save handler, setTimeout(this.tick), a tags array on the prototype and a constructor called without new." }
      - { kind: run-change, runtime: browser-js, summary: "Run the seeded page, click the button, wait for the timer and match each console line and error to your prediction." }
      - { kind: debug, runtime: browser-js, summary: "Repair all four defects with the smallest change each (bind or arrow, an own field set in the constructor, new or a class) while the provided tests stay green." }
    retrieval:
      - { concept: "which keys a for-in loop visits", from: js-04-06-for-of-vs-for-in }
  - id: js-11-09-independent-adapters
    title: { uk: "Самостійно: адаптер-клас і композиційний адаптер", en: "Independent: class and compositional adapters" }
    kind: assessment
    minutes: 30
    objectives:
      - "Implement, without hints, one storage adapter twice — as a class with a private field, a read-only getter and a static factory, and as a factory function composing a storage collaborator — so one shared test suite passes for both."
      - "Justify in three sentences which design to keep for a stated change request, and name one object-model tradeoff for each design."
    subskills:
      - { family: J-06, skill: "methods/getters/setters/property descriptors reading", depth: assess }
      - { family: J-06, skill: "classes/private/static fields", depth: assess }
      - { family: J-06, skill: "inheritance vs composition", depth: assess }
      - { family: J-06, skill: "object model tradeoffs", depth: assess }
    misconceptions: []
    prerequisites: [js-11-08-debug-lost-this-inherited]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: independent, runtime: browser-js, summary: "No-hint task: a KeyValueStore class (private #data, static fromEntries, read-only size getter) and a createKeyValueStore(storage) factory; hidden tests run the same get/set/delete/size cases against both and read the size descriptor." }
      - { kind: write, runtime: browser-js, summary: "Explain-level items: choose composition or inheritance for the change request “entries expire after a set time” and name one privacy, serialization or testing tradeoff per design." }
    retrieval:
      - { concept: "a fake storage versus real evidence in a test", from: js-09-05-mocks-vs-real }
  - id: js-11-10-capstone-model-adapter
    title: { uk: "Проєкт: адаптер репозиторію", en: "Capstone: repository adapter" }
    kind: capstone-step
    minutes: 25
    objectives:
      - "Wrap the exported capstone's repository as a class and as an equivalent compositional factory, run the same domain tests against both and keep this correct in the UI handlers."
    subskills:
      - { family: J-06, skill: "inheritance vs composition", depth: practice }
    misconceptions: []
    prerequisites: [js-11-09-independent-adapters, js-10-05-capstone-cp-js]
    glossary: []
    visual: null
    analogy: null
    practice:
      - { kind: write, runtime: local-web, summary: "In VS Code, add the domain's repository class and create…Repository(storage) factory to the exported project's domain module, point the existing domain tests at both and wire one UI handler without losing this." }
      - { kind: local-task, runtime: local-web, summary: "Back up your project, read the JS-11 reference checkpoint diff, merge only the changes you choose, then run the tests and the page locally and record the results as learner-confirmed evidence." }
    retrieval:
      - { concept: "the capstone's storage module and its key", from: js-07-11-capstone-modules-persistence }
