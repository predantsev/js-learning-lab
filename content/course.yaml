# Stage titles and summaries shown on the course map. Order is fixed: JS → RE → RN → NO (REQ-001).
stages:
  JS:
    title: { uk: "JavaScript", en: "JavaScript" }
    summary:
      uk: "Від першого рядка коду до власного вебзастосунку: мова, сторінки, дані, асинхронність, інструменти і TypeScript."
      en: "From the first line of code to your own web application: the language, pages, data, async work, tooling and TypeScript."
  RE:
    title: { uk: "React", en: "React" }
    summary:
      uk: "Той самий проєкт на компонентах: state, effects, маршрути, робота з даними, тести і production-збірка."
      en: "The same project built from components: state, effects, routes, data, tests and a production build."
  RN:
    title: { uk: "React Native", en: "React Native" }
    summary:
      uk: "Мобільний застосунок із тим самим доменом: native-компоненти, навігація, сховище, мережа і збірка."
      en: "A mobile app for the same domain: native components, navigation, storage, networking and builds."
  NO:
    title: { uk: "Node.js", en: "Node.js" }
    summary:
      uk: "Власний сервер і API: HTTP, файли, SQL, автентифікація, безпека, тести й експлуатація."
      en: "Your own server and API: HTTP, files, SQL, authentication, security, tests and operations."
