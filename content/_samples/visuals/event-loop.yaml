# Sample visual block: event-loop. The claimed console order is verified against a real run at build time.
id: promise-vs-timeout
kind: visual
visual: event-loop
title:
  uk: "Чому promise друкується раніше за timeout"
  en: "Why promise prints before timeout"
textEquivalent:
  uk: >-
    Скрипт виконується синхронно: друкує "start", реєструє таймер на 0 мс (callback потрапляє
    в чергу задач лише після того, як таймер спрацює) і додає .then-callback у чергу мікрозадач,
    потім друкує "end". Коли стек порожній, event loop спершу повністю спорожнює чергу мікрозадач —
    друкується "promise" — і лише тоді бере задачу з черги задач — друкується "timeout".
    Порядок: start, end, promise, timeout.
  en: >-
    The script runs synchronously: prints "start", registers a 0 ms timer (its callback reaches the
    task queue only once the timer fires), puts the .then callback on the microtask queue, then prints
    "end". When the stack is empty the event loop first drains the microtask queue completely — "promise"
    is printed — and only then takes a task from the task queue — "timeout" is printed.
    Order: start, end, promise, timeout.
spec:
  file: promise-timeout-order.js
  steps:
    - line: 1
      caption:
        uk: "Скрипт починає виконуватися: у call stack один кадр — сам скрипт. Черги порожні."
        en: "The script starts running: the call stack holds one frame, the script itself. Both queues are empty."
      stack: ["script"]
    - line: 1
      log: "start"
      caption:
        uk: "`console.log(\"start\")` виконується одразу — це синхронний код. У консолі з'являється `start`."
        en: "`console.log(\"start\")` runs right away — it is synchronous code. `start` appears in the console."
      stack: ["script"]
    - line: 3
      caption:
        uk: "`setTimeout(…, 0)` передає callback **Web API** (таймеру). 0 мс не означає «зараз»: callback повернеться в чергу **задач** лише після того, як таймер відлічить, і лише коли стек буде порожній."
        en: "`setTimeout(…, 0)` hands the callback to a **Web API** (the timer). 0 ms does not mean “now”: the callback comes back to the **task** queue only after the timer counts down, and only when the stack is empty."
      stack: ["script"]
      webApis: ["timer 0 ms → timeout callback"]
    - line: 7
      caption:
        uk: "`Promise.resolve()` вже виконаний, тому `.then` одразу ставить свій callback у чергу **мікрозадач**. Він ще не виконується — стек зайнятий скриптом."
        en: "`Promise.resolve()` is already fulfilled, so `.then` immediately queues its callback as a **microtask**. It does not run yet — the stack is busy with the script."
      stack: ["script"]
      webApis: ["timer 0 ms → timeout callback"]
      microtasks: ["then callback"]
    - line: 11
      log: "end"
      caption:
        uk: "`console.log(\"end\")` — ще синхронний рядок. У консолі `end` з'являється **до** будь-яких callback-ів."
        en: "`console.log(\"end\")` is still synchronous. `end` shows up in the console **before** any callback."
      stack: ["script"]
      webApis: ["timer 0 ms → timeout callback"]
      microtasks: ["then callback"]
    - caption:
        uk: "Скрипт закінчився, стек порожній. Таймер за цей час спрацював: його callback тепер у черзі **задач**. Event loop спершу дивиться на мікрозадачі."
        en: "The script is done, the stack is empty. The timer has fired meanwhile: its callback now sits in the **task** queue. The event loop looks at microtasks first."
      stack: []
      microtasks: ["then callback"]
      tasks: ["timeout callback"]
    - line: 8
      caption:
        uk: "Мікрозадача береться в стек: виконується `.then`-callback. Правило: **уся** черга мікрозадач спорожнюється перед наступною задачею."
        en: "The microtask is moved onto the stack: the `.then` callback runs. The rule: the **whole** microtask queue is drained before the next task."
      stack: ["then callback"]
      tasks: ["timeout callback"]
    - line: 8
      log: "promise"
      caption:
        uk: "У консолі — `promise`. Callback завершився, стек знову порожній, мікрозадач більше немає."
        en: "The console shows `promise`. The callback finishes, the stack is empty again, no microtasks are left."
      stack: []
      tasks: ["timeout callback"]
    - line: 4
      caption:
        uk: "Лише тепер event loop бере задачу з черги задач: callback таймера потрапляє в стек."
        en: "Only now does the event loop take a task from the task queue: the timer callback enters the stack."
      stack: ["timeout callback"]
    - line: 4
      log: "timeout"
      caption:
        uk: "У консолі — `timeout`. Підсумок: синхронний код → усі мікрозадачі → одна задача. Тому `promise` завжди випереджає `setTimeout(…, 0)`."
        en: "The console shows `timeout`. Summary: synchronous code → all microtasks → one task. That is why `promise` always beats `setTimeout(…, 0)`."
      stack: []
