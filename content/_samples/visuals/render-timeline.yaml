# Sample visual block: render-timeline (state is a snapshot; two setCount calls in one handler).
id: counter-double-click
kind: visual
visual: render-timeline
title:
  uk: "Чому два setCount(count + 1) дають +1, а не +2"
  en: "Why two setCount(count + 1) give +1, not +2"
textEquivalent:
  uk: >-
    Перший рендер Counter бачить count = 0 і виводить кнопку "Clicked 0". Обробник кліку, створений
    у цьому рендері, теж бачить count = 0. Клік викликає setCount(0 + 1) двічі: обидва виклики
    ставлять у чергу значення 1, бо count у замиканні обробника — знімок, він не змінюється під час
    виконання обробника. React робить один повторний рендер із count = 1 і показує "Clicked 1".
    Щоб додати двічі, потрібна форма setCount(c => c + 1), яка працює з попереднім значенням.
  en: >-
    The first render of Counter sees count = 0 and shows the button "Clicked 0". The click handler
    created in that render also sees count = 0. A click calls setCount(0 + 1) twice: both calls queue
    the value 1, because count inside the handler closure is a snapshot that does not change while the
    handler runs. React performs one re-render with count = 1 and shows "Clicked 1". To add twice you
    need the updater form setCount(c => c + 1), which works from the previous value.
spec:
  component: Counter
  code: |
    function Counter() {
      const [count, setCount] = useState(0);
      function handleClick() {
        setCount(count + 1);
        setCount(count + 1);
      }
      useEffect(() => {
        document.title = `Clicked ${count}`;
      }, [count]);
      return <button onClick={handleClick}>Clicked {count}</button>;
    }
  steps:
    - phase: render
      render: 1
      line: 2
      reason: { uk: "перший показ компонента", en: "the component is shown for the first time" }
      snapshot: { state: { count: 0 } }
      caption:
        uk: "Рендер 1: React викликає `Counter()`. `useState(0)` повертає `count = 0`. Усе, що створено в цьому виклику — JSX, `handleClick`, функція ефекту — бачить **саме це** значення."
        en: "Render 1: React calls `Counter()`. `useState(0)` returns `count = 0`. Everything created in this call — the JSX, `handleClick`, the effect function — sees **exactly this** value."
    - phase: commit
      render: 1
      line: 10
      dom: "<button>Clicked 0</button>"
      caption:
        uk: "Commit: React записує результат рендеру в DOM. На екрані кнопка `Clicked 0`."
        en: "Commit: React writes the render output into the DOM. The screen shows the button `Clicked 0`."
    - phase: effect
      render: 1
      line: 8
      run: ["document.title = `Clicked 0`"]
      caption:
        uk: "Після commit запускаються ефекти цього рендеру: `document.title` стає `Clicked 0`. Ефект теж бачить знімок `count = 0`."
        en: "After the commit this render's effects run: `document.title` becomes `Clicked 0`. The effect sees the snapshot `count = 0` as well."
    - phase: event
      line: 4
      name: click
      sees: { count: 0 }
      actions: ["setCount(0 + 1)", "setCount(0 + 1)"]
      queued: { count: 1 }
      caption:
        uk: "Клік викликає `handleClick` **із рендеру 1**: усередині `count` дорівнює 0 — це знімок. `setCount(count + 1)` двічі ставить у чергу значення `1`, а не збільшує змінну. React не перемальовує посеред обробника."
        en: "The click runs `handleClick` **from render 1**: inside it `count` is 0 — a snapshot. `setCount(count + 1)` queues the value `1` twice instead of incrementing a variable. React does not re-render in the middle of the handler."
    - phase: render
      render: 2
      line: 2
      reason: { uk: "у черзі є оновлення стану (count → 1)", en: "a state update is queued (count → 1)" }
      snapshot: { state: { count: 1 } }
      caption:
        uk: "Рендер 2: React застосовує чергу — два рази «постав 1» дають `1`. `Counter()` викликається знову, і **новий** `handleClick` бачить `count = 1`."
        en: "Render 2: React applies the queue — “set to 1” twice yields `1`. `Counter()` is called again, and a **new** `handleClick` sees `count = 1`."
    - phase: commit
      render: 2
      line: 10
      dom: "<button>Clicked 1</button>"
      caption:
        uk: "Commit 2: кнопка показує `Clicked 1`. Один клік, два `setCount`, +1."
        en: "Commit 2: the button shows `Clicked 1`. One click, two `setCount` calls, +1."
    - phase: effect
      render: 2
      line: 8
      cleanup: []
      run: ["document.title = `Clicked 1`"]
      caption:
        uk: "Залежність `[count]` змінилася (0 → 1), тому ефект запускається знову з новим знімком. Щоб клік додавав двічі, потрібна форма `setCount(c => c + 1)` — вона отримує **попереднє** значення з черги, а не знімок."
        en: "The dependency `[count]` changed (0 → 1), so the effect runs again with the new snapshot. To make one click add twice, use `setCount(c => c + 1)` — it receives the **previous** value from the queue instead of the snapshot."
