# Sample visual block: sequence (one revealed message per step).
id: cors-preflight
kind: visual
visual: sequence
title:
  uk: "CORS preflight: чому браузер робить два запити"
  en: "CORS preflight: why the browser sends two requests"
textEquivalent:
  uk: >-
    Сторінка з origin https://app.example хоче надіслати PUT із JSON на https://api.example.
    Браузер спершу сам надсилає запит OPTIONS із заголовками Origin, Access-Control-Request-Method
    і Access-Control-Request-Headers. Сервер відповідає 204 з Access-Control-Allow-Origin,
    Access-Control-Allow-Methods і Access-Control-Allow-Headers. Лише якщо ці заголовки дозволяють
    запит, браузер надсилає справжній PUT, отримує 200 і віддає відповідь коду сторінки. Якщо
    дозволу немає, браузер блокує відповідь, а fetch завершується помилкою TypeError.
  en: >-
    A page with origin https://app.example wants to send a PUT with JSON to https://api.example.
    The browser first sends an OPTIONS request on its own, with the headers Origin,
    Access-Control-Request-Method and Access-Control-Request-Headers. The server answers 204 with
    Access-Control-Allow-Origin, Access-Control-Allow-Methods and Access-Control-Allow-Headers. Only
    if those headers allow the request does the browser send the real PUT, receive 200 and hand the
    response to the page code. Without permission the browser blocks the response and fetch rejects
    with a TypeError.
spec:
  actors:
    - { id: page, label: { uk: "Код сторінки (app.example)", en: "Page code (app.example)" } }
    - { id: browser, label: { uk: "Браузер", en: "Browser" } }
    - { id: api, label: { uk: "Сервер api.example", en: "api.example server" } }
  intro:
    uk: "Три учасники: код сторінки, сам браузер (він виконує правила CORS) і сервер на **іншому origin**. Origin = схема + хост + порт."
    en: "Three participants: the page code, the browser itself (it enforces CORS) and a server on a **different origin**. Origin = scheme + host + port."
  messages:
    - from: page
      to: browser
      label: "fetch(\"https://api.example/wishes/7\", { method: \"PUT\", … })"
      caption:
        uk: "Код викликає `fetch` із методом `PUT` і JSON-заголовком. Такий запит — **не простий** (simple request), тому браузер не надсилає його одразу."
        en: "The code calls `fetch` with method `PUT` and a JSON header. That is **not a simple request**, so the browser does not send it right away."
    - from: browser
      to: api
      label: "OPTIONS /wishes/7 (preflight)"
      note:
        uk: "Заголовки: Origin: https://app.example · Access-Control-Request-Method: PUT · Access-Control-Request-Headers: content-type"
        en: "Headers: Origin: https://app.example · Access-Control-Request-Method: PUT · Access-Control-Request-Headers: content-type"
      kind: async
      caption:
        uk: "Браузер **сам** надсилає preflight — запит `OPTIONS` із питанням: «Чи можна з origin app.example робити PUT із цим заголовком?». Код сторінки цього запиту не бачить."
        en: "The browser sends the preflight **itself** — an `OPTIONS` request asking: “May origin app.example send a PUT with this header?”. The page code never sees this request."
    - from: api
      to: browser
      label: "204 No Content + Access-Control-Allow-*"
      kind: return
      caption:
        uk: "Сервер відповідає заголовками `Access-Control-Allow-*`. Це **дозвіл**, який перевіряє браузер: origin, метод і заголовки мають збігатися."
        en: "The server answers with `Access-Control-Allow-*` headers. This is the **permission** the browser checks: origin, method and headers must all match."
      note:
        uk: "Access-Control-Allow-Origin: https://app.example · Allow-Methods: GET, PUT · Allow-Headers: content-type. Без них браузер зупиняється тут: PUT не надсилається, fetch відхиляється з TypeError."
        en: "Access-Control-Allow-Origin: https://app.example · Allow-Methods: GET, PUT · Allow-Headers: content-type. Without them the browser stops here: the PUT is never sent and fetch rejects with a TypeError."
    - from: browser
      to: api
      label: "PUT /wishes/7 · { \"done\": true }"
      kind: async
      caption:
        uk: "Дозвіл є — браузер надсилає **справжній** запит із тілом. Сервер обробляє його як звичайний PUT."
        en: "Permission granted — the browser sends the **real** request with its body. The server handles it as an ordinary PUT."
    - from: api
      to: browser
      label: "200 OK · { \"id\": 7, \"done\": true }"
      note:
        uk: "Відповідь теж містить Access-Control-Allow-Origin: https://app.example"
        en: "The response also carries Access-Control-Allow-Origin: https://app.example"
      kind: return
      caption:
        uk: "Відповідь теж має містити `Access-Control-Allow-Origin`, інакше браузер отримає дані, але **не віддасть** їх коду сторінки."
        en: "The response must carry `Access-Control-Allow-Origin` too, otherwise the browser receives the data but **does not hand it** to the page code."
    - from: browser
      to: page
      label: "Response { status: 200 } → await res.json()"
      kind: return
      caption:
        uk: "Лише тепер промис `fetch` виконується і код читає JSON. Два мережеві запити, один `fetch` — і сервер мусить відповідати на `OPTIONS`."
        en: "Only now does the `fetch` promise resolve and the code reads the JSON. Two network requests for one `fetch` — and the server must answer `OPTIONS`."
