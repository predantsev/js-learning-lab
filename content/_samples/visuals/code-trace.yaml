# Sample visual block: code-trace. One block = what goes under `blocks:` in a lesson.yaml.
id: closure-counter
kind: visual
visual: code-trace
title:
  uk: "Замикання: кожен лічильник пам'ятає свій count"
  en: "Closures: every counter remembers its own count"
textEquivalent:
  uk: >-
    Функція makeCounter створює змінну count і повертає внутрішню функцію increment.
    Кожен виклик makeCounter створює окремий scope з власним count: clicks починає з 0,
    views — зі 100. Виклик clicks() збільшує лише count із scope, в якому була створена
    ця функція. Після двох clicks() та одного views() консоль показує "clicks: 3" і "views: 102".
  en: >-
    makeCounter creates a count variable and returns the inner function increment. Every call
    of makeCounter creates a separate scope with its own count: clicks starts at 0, views at 100.
    Calling clicks() increments only the count of the scope the function was created in. After
    two clicks() and one views() the console prints "clicks: 3" and "views: 102".
spec:
  file: closure-counter.js
  steps: captioned
  captions:
    - at: { line: 10 }
      text:
        uk: "Програма починається з рядка 10: `makeCounter` вже існує (оголошення функцій піднімаються), а `clicks` і `views` ще **uninitialized** — до їхніх рядків дійти не встигли."
        en: "The program starts at line 10: `makeCounter` already exists (function declarations are hoisted), while `clicks` and `views` are still **uninitialized** — their lines have not run yet."
    - at: { line: 1, hit: 1 }
      text:
        uk: "Виклик `makeCounter(0)` створює **новий scope** функції: у ньому `start = 0`, а `count` поки uninitialized. Scope модуля видно нижче — це ланцюжок областей видимості."
        en: "Calling `makeCounter(0)` creates a **new function scope**: `start = 0` inside it, `count` still uninitialized. The module scope sits below it — this is the scope chain."
    - at: { line: 7, hit: 1 }
      text:
        uk: "`count` став 0. Повертається не число, а **функція** `increment` (об'єкт #2 у heap). Зверніть увагу: у heap функція має стрілку на scope, де її створили."
        en: "`count` is now 0. What gets returned is not a number but the **function** `increment` (object #2 in the heap). Notice the heap entry points at the scope the function was created in."
    - at: { line: 11 }
      text:
        uk: "`clicks` тепер посилається на функцію #2. Scope першого виклику `makeCounter` **не зник** — на нього тримає посилання `increment`. Це і є замикання."
        en: "`clicks` now refers to function #2. The scope of the first `makeCounter` call **did not disappear** — `increment` keeps a reference to it. That is a closure."
    - at: { line: 1, hit: 2 }
      text:
        uk: "Другий виклик `makeCounter(100)` створює **інший** scope з власним `count`. Два лічильники ніяк не пов'язані."
        en: "The second call `makeCounter(100)` creates a **different** scope with its own `count`. The two counters are unrelated."
    - at: { line: 3, hit: 1 }
      text:
        uk: "Виклик `clicks()` входить в `increment`. У call stack — два кадри. Серед змінних видно **захоплений scope** (`makeCounter`) з `count = 0`: функція бачить його, хоч `makeCounter` давно завершилася."
        en: "`clicks()` enters `increment`. The call stack has two frames. Among the variables you see the **captured scope** (`makeCounter`) with `count = 0`: the function sees it although `makeCounter` finished long ago."
    - at: { line: 5, hit: 1 }
      text:
        uk: "`count = count + 1` змінив **саме той** `count` із захопленого scope: тепер 1. Повертається 1."
        en: "`count = count + 1` changed **that very** `count` in the captured scope: it is 1 now. 1 is returned."
    - at: { line: 3, hit: 3 }
      text:
        uk: "Виклик `views()` — та сама функція `increment`, але створена в **іншому** scope: тут `count = 100`. Один код, різна пам'ять."
        en: "`views()` runs the same `increment` code, but the one created in the **other** scope: here `count = 100`. Same code, different memory."
    - at: { line: 17 }
      text:
        uk: "Після двох `clicks()` перший лічильник має `count = 2`, другий — `101`. Ще по одному виклику — і в консоль потрапляє `clicks: 3`, `views: 102`."
        en: "After two `clicks()` the first counter holds `count = 2`, the second `101`. One more call each, and the console shows `clicks: 3`, `views: 102`."
    - at: { line: 18, kind: end }
      text:
        uk: "Програма завершилася. Обидва scope-и живуть, поки на їхні функції є посилання `clicks` і `views` — так лічильники зберігають стан без глобальних змінних."
        en: "The program finished. Both scopes stay alive as long as `clicks` and `views` reference their functions — that is how counters keep state without globals."
