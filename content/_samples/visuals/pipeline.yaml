# Sample visual block: pipeline (filter → map, results computed by running the functions).
id: wishlist-filter-map
kind: visual
visual: pipeline
title:
  uk: "Від списку бажань до списку назв: filter, потім map"
  en: "From a wishlist to a list of names: filter, then map"
textEquivalent:
  uk: >-
    Масив із чотирьох бажань проходить два етапи. filter із умовою item.price <= 100 перевіряє
    кожен елемент: лампа (45), книга (80) і навушники (100) проходять, монітор (240) відкидається.
    map із функцією item => item.name перетворює три об'єкти, що залишилися, на три рядки:
    "Лампа", "Книга", "Навушники". Вихідний масив wishes не змінюється.
  en: >-
    An array of four wishes goes through two stages. filter with the condition item.price <= 100
    tests every item: the lamp (45), the book (80) and the headphones (100) pass, the monitor (240)
    is dropped. map with item => item.name turns the three remaining objects into three strings:
    "Lamp", "Book", "Headphones". The original wishes array is left unchanged.
spec:
  code: |
    const names = wishes
      .filter((item) => item.price <= 100)
      .map((item) => item.name);
  input:
    label: { uk: "Твій wishlist", en: "Your wishlist" }
    items:
      - { name: "Lamp", price: 45 }
      - { name: "Monitor", price: 240 }
      - { name: "Book", price: 80 }
      - { name: "Headphones", price: 100 }
    show: "item => `${item.name} €${item.price}`"
    caption:
      uk: "Вхід — масив із чотирьох об'єктів. Кожен має `name` і `price`. Жоден етап не змінює цей масив: кожен метод повертає **новий**."
      en: "The input is an array of four objects, each with a `name` and a `price`. No stage mutates this array: every method returns a **new** one."
  stages:
    - op: filter
      fn: "(item) => item.price <= 100"
      label: "item.price <= 100"
      perItem: true
      caption:
        uk: "`filter` викликає умову для елемента {index} з {count}: `{item}` → **{result}**. `true` — елемент проходить далі, `false` — відкидається."
        en: "`filter` calls the condition for item {index} of {count}: `{item}` → **{result}**. `true` keeps the item, `false` drops it."
      summary:
        uk: "Результат `filter` — **новий масив** із трьох елементів, для яких умова повернула `true`. Монітор відкинуто; порядок решти збережено."
        en: "The result of `filter` is a **new array** of the three items whose condition returned `true`. The monitor is gone; the order of the rest is kept."
    - op: map
      fn: "(item) => item.name"
      label: "item => item.name"
      caption:
        uk: "`map` викликає функцію для **кожного** елемента і складає результати в новий масив тієї самої довжини: три об'єкти → три рядки."
        en: "`map` calls the function on **every** item and collects the results into a new array of the same length: three objects → three strings."
  result:
    label: { uk: "Залишилося {count} назви", en: "{count} names remain" }
