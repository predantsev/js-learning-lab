# Sample visual block: pipeline with a short-circuiting stage (some) and bilingual item labels.
id: habits-some
kind: visual
visual: pipeline
title:
  uk: "some зупиняється на першому true"
  en: "some stops at the first true"
textEquivalent:
  uk: >-
    Масив habits містить чотири звички з кількістю пропущених днів: h-1 (0), h-2 (3), h-3 (5) і h-4 (1).
    some з умовою habit.missed > 2 перевіряє їх по черзі: для h-1 умова дає false, для h-2 — true.
    На першому true some одразу повертає true, тож h-3 і h-4 він не перевіряє взагалі.
  en: >-
    The habits array holds four habits with their number of missed days: h-1 (0), h-2 (3), h-3 (5) and
    h-4 (1). some with the condition habit.missed > 2 checks them in order: for h-1 the condition gives
    false, for h-2 true. At the first true some returns true at once, so it never checks h-3 and h-4.
spec:
  code: |
    const anyMissedOften = habits.some((habit) => habit.missed > 2);
  input:
    label: { uk: "habits — чотири звички", en: "habits — four habits" }
    items:
      - { id: "h-1", missed: 0 }
      - { id: "h-2", missed: 3 }
      - { id: "h-3", missed: 5 }
      - { id: "h-4", missed: 1 }
    show:
      uk: "habit => `${habit.id} · пропущено ${habit.missed}`"
      en: "habit => `${habit.id} · missed ${habit.missed}`"
    caption:
      uk: "Чотири звички й кількість пропущених днів. Питання: чи пропущено **хоч одну** звичку частіше, ніж двічі?"
      en: "Four habits and the number of missed days. The question: was **any** habit missed more than twice?"
  stages:
    - op: some
      fn: "(habit) => habit.missed > 2"
      perItem: true
      caption:
        uk: "`some` перевіряє звичку {index} з {count}: `{item}` → **{result}**."
        en: "`some` checks habit {index} of {count}: `{item}` → **{result}**."
      summary:
        uk: "Перше `true` — і `some` одразу повертає `true`. Перевірено {tested} з {count}; ще {skipped} звички `some` навіть не відкривав."
        en: "The first `true`, and `some` returns `true` at once. {tested} of {count} checked; the other {skipped} habits were never even looked at."
