# Sample visual block: pipeline with toSorted shown comparison by comparison (perComparison).
id: prices-tosorted
kind: visual
visual: pipeline
title:
  uk: "toSorted: кожне порівняння компаратора"
  en: "toSorted: every comparator call"
textEquivalent:
  uk: >-
    Масив prices містить ціни 45, 240 і 80. toSorted із компаратором (a, b) => a - b сортує копію масиву.
    Рушій сам вирішує, які пари порівняти, і щоразу викликає компаратор з двома цінами: від’ємний результат
    ставить a перед b, додатний — b перед a, нуль лишає їх у тому ж порядку. Після всіх порівнянь
    toSorted повертає новий масив 45, 80, 240, а prices лишається 45, 240, 80.
  en: >-
    The prices array holds 45, 240 and 80. toSorted with the comparator (a, b) => a - b sorts a copy of the
    array. The engine decides which pairs to compare and calls the comparator with two prices each time:
    a negative result puts a before b, a positive one puts b before a, zero keeps their order. After all
    comparisons toSorted returns the new array 45, 80, 240, while prices stays 45, 240, 80.
spec:
  code: |
    const cheapestFirst = prices.toSorted((a, b) => a - b);
  input:
    label: { uk: "prices — три ціни", en: "prices — three prices" }
    items: [45, 240, 80]
    caption:
      uk: "Три ціни в тому порядку, в якому їх записали. `toSorted` не чіпає `prices`: він сортує копію."
      en: "Three prices in the order they were recorded. `toSorted` leaves `prices` alone: it sorts a copy."
  stages:
    - op: toSorted
      fn: "(a, b) => a - b"
      perComparison: true
      caption:
        uk: "Порівняння {index} з {count}: компаратор отримав `a = {a}` і `b = {b}` та повернув **{result}**."
        en: "Comparison {index} of {count}: the comparator got `a = {a}` and `b = {b}` and returned **{result}**."
      summary:
        uk: "Усього порівнянь: {comparisons}. `toSorted` повертає **новий** масив від меншої ціни до більшої; `prices` лишився як був."
        en: "Comparisons in total: {comparisons}. `toSorted` returns a **new** array from the lowest price to the highest; `prices` stays as it was."
