# Sample visual block: pipeline whose second stage throws (throws: true shows the real error).
id: notes-map-throws
kind: visual
visual: pipeline
title:
  uk: "Етап, що кидає помилку, зупиняє ланцюжок"
  en: "A stage that throws stops the chain"
textEquivalent:
  uk: >-
    Три бажання: Lamp (45, з приміткою), Monitor (240, з приміткою) і Mug (12, без примітки). filter з умовою
    wish.price < 100 залишає Lamp і Mug. Потім map викликає wish.note.trim(): для Lamp це працює, а в Mug
    поля note немає, тож wish.note — undefined, і виклик trim кидає TypeError: Cannot read properties of
    undefined (reading 'trim'). На цьому весь ланцюжок зупиняється, titles так і не отримує значення.
  en: >-
    Three wishes: Lamp (45, with a note), Monitor (240, with a note) and Mug (12, without a note). filter
    with the condition wish.price < 100 keeps Lamp and Mug. Then map calls wish.note.trim(): for Lamp it
    works, but Mug has no note field, so wish.note is undefined and calling trim throws TypeError: Cannot
    read properties of undefined (reading 'trim'). The whole chain stops there; titles never gets a value.
spec:
  code: |
    const notes = wishes
      .filter((wish) => wish.price < 100)
      .map((wish) => wish.note.trim());
  input:
    label: { uk: "wishes — три бажання", en: "wishes — three wishes" }
    items:
      - { name: "Lamp", price: 45, note: " for the desk " }
      - { name: "Monitor", price: 240, note: "27 inch" }
      - { name: "Mug", price: 12 }
    show: "wish => `${wish.name} €${wish.price}`"
    caption:
      uk: "Три бажання. У двох є поле `note`, у `Mug` — немає."
      en: "Three wishes. Two of them have a `note` field, `Mug` does not."
  stages:
    - op: filter
      fn: "(wish) => wish.price < 100"
      caption:
        uk: "`filter` залишає два дешевші бажання: `Lamp` і `Mug`."
        en: "`filter` keeps the two cheaper wishes: `Lamp` and `Mug`."
    - op: map
      fn: "(wish) => wish.note.trim()"
      throws: true
      perItem: true
      caption:
        uk: "`map` викликає функцію для `{item}` → **{result}**."
        en: "`map` calls the function for `{item}` → **{result}**."
      summary:
        uk: "Ланцюжок зупинився: **{error}**. У `Mug` немає поля `note`, тож `wish.note` — `undefined`, а в `undefined` немає методу `trim`."
        en: "The chain stopped: **{error}**. `Mug` has no `note` field, so `wish.note` is `undefined`, and `undefined` has no `trim` method."
