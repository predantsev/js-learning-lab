# Sample visual block: diagram (boxes, groups and labeled edges with per-step highlight).
id: browser-server-database
kind: visual
visual: diagram
title:
  uk: "Три межі: браузер, сервер, база даних"
  en: "Three boundaries: browser, server, database"
textEquivalent:
  uk: >-
    Застосунок складається з трьох частин на різних машинах. У браузері React-застосунок зберігає
    стан і робить HTTP-запит fetch("/api/wishes"). Запит проходить мережею до сервера Node.js, де
    маршрут читає параметри й викликає базу даних SQL-запитом. База повертає рядки, сервер
    перетворює їх у JSON і відповідає, браузер оновлює стан. Код браузера не може звернутися до
    бази напряму: між ними завжди сервер.
  en: >-
    The application has three parts on different machines. In the browser the React app keeps state
    and sends an HTTP request fetch("/api/wishes"). The request crosses the network to a Node.js
    server where a route reads the parameters and queries the database with SQL. The database returns
    rows, the server turns them into JSON and responds, the browser updates its state. Browser code
    can never reach the database directly: the server always sits in between.
spec:
  # A grid keeps the three boundaries stacked top to bottom, so the picture stays about 430 px wide
  # (the lesson column guidance, content/VISUALS.md); side by side (layout: lr) it would be ~700 px.
  layout: grid
  groups:
    - { id: client, label: { uk: "Браузер (комп'ютер користувача)", en: "Browser (the user's computer)" } }
    - { id: server, label: { uk: "Сервер Node.js", en: "Node.js server" } }
    - { id: data, label: { uk: "База даних", en: "Database" } }
  nodes:
    - { id: fetch, group: client, label: "fetch(\"/api/wishes\")", shape: round, w: 160, col: 0, row: 0 }
    - { id: ui, group: client, label: { uk: "React-компонент", en: "React component" }, w: 136, col: 1, row: 0 }
    - { id: route, group: server, label: "GET /api/wishes", shape: round, w: 136, col: 0, row: 1 }
    - { id: query, group: server, label: { uk: "SQL-запит", en: "SQL query" }, col: 1, row: 1 }
    - { id: db, group: data, label: "wishes", shape: cylinder, col: 1, row: 2 }
  edges:
    - { id: ui-fetch, from: ui, to: fetch, label: { uk: "запит", en: "request" } }
    - { id: http, from: fetch, to: route, label: "HTTP", kind: both }
    - { id: route-query, from: route, to: query, label: { uk: "параметри", en: "params" } }
    - { id: sql, from: query, to: db, label: "SELECT …", kind: both }
  steps:
    - caption:
        uk: "Три межі — три різні програми, часто на різних машинах. Код у браузері **не може** торкнутися бази: єдиний шлях — через сервер."
        en: "Three boundaries — three different programs, often on different machines. Browser code **cannot** touch the database: the only way is through the server."
    - highlight: [ui, fetch, ui-fetch]
      dim: [route, query, db, http, route-query, sql]
      caption:
        uk: "Користувач натискає кнопку. React-компонент викликає `fetch(\"/api/wishes\")`: це **запит**, а не дані — відповідь прийде пізніше, асинхронно."
        en: "The user presses a button. The React component calls `fetch(\"/api/wishes\")`: that is a **request**, not data — the response arrives later, asynchronously."
    - highlight: [http, route]
      dim: [ui, query, db, route-query, sql]
      annotate:
        - { id: http, text: { uk: "інша машина, інший процес", en: "another machine, another process" } }
      caption:
        uk: "Запит перетинає мережу. На сервері його ловить **маршрут** `GET /api/wishes`. Тут уже працює Node.js, не браузер: немає `document`, є файли й база."
        en: "The request crosses the network. On the server a **route**, `GET /api/wishes`, catches it. This is Node.js now, not the browser: no `document`, but files and a database."
    - highlight: [route-query, query, sql, db]
      dim: [ui, fetch, http]
      caption:
        uk: "Маршрут перетворює параметри на **SQL-запит** і звертається до бази. База — ще одна програма зі своєю мовою; вона повертає рядки таблиці `wishes`."
        en: "The route turns the parameters into a **SQL query** and talks to the database — yet another program with its own language. It returns rows of the `wishes` table."
    - highlight: [sql, route-query, http, ui-fetch]
      annotate:
        - { id: http, text: { uk: "JSON у відповідь", en: "JSON response" } }
      caption:
        uk: "Шлях назад: рядки → JSON на сервері → HTTP-відповідь → `fetch` повертає дані → компонент оновлює стан і перемальовується."
        en: "The way back: rows → JSON on the server → HTTP response → `fetch` resolves with data → the component updates its state and re-renders."
