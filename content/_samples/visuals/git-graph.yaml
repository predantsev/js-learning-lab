# Sample visual block: git-graph (operations simulated into states).
id: feature-branch-conflict
kind: visual
visual: git-graph
title:
  uk: "Гілка з функцією, конфлікт при злитті та його розв'язання"
  en: "A feature branch, a merge conflict and its resolution"
textEquivalent:
  uk: >-
    Репозиторій починається з двох комітів на main. Створюється гілка feature/filter, у ній
    з'являється коміт зі зміною файлу wishes.js. Тим часом на main теж змінюють wishes.js і роблять
    коміт. Під час git merge feature/filter git не може об'єднати зміни в одному рядку: wishes.js
    позначається conflicted. Розробник редагує файл, прибирає маркери конфлікту, виконує git add і
    git commit — з'являється merge-коміт із двома батьками, а main вказує на нього.
  en: >-
    The repository starts with two commits on main. A branch feature/filter is created and gets a
    commit that changes wishes.js. Meanwhile main also changes wishes.js and commits. During
    git merge feature/filter git cannot combine the changes to the same line: wishes.js is marked
    conflicted. The developer edits the file, removes the conflict markers, runs git add and
    git commit — a merge commit with two parents appears and main points at it.
spec:
  steps:
    - op: init
      caption:
        uk: "`git init` створює порожній репозиторій з гілкою `main`, яка ще не має жодного коміту."
        en: "`git init` creates an empty repository with a `main` branch that has no commits yet."
    - op: commit
      message: "add wishlist page"
      files: [index.html, wishes.js]
      caption:
        uk: "Перший коміт `c1`. Коміт — це **знімок** усіх файлів плюс посилання на батьківський коміт (тут його немає). `main` вказує на `c1`, а `HEAD` — на `main`."
        en: "The first commit, `c1`. A commit is a **snapshot** of all files plus a link to its parent (none here). `main` points at `c1`, and `HEAD` at `main`."
    - op: commit
      message: "style the list"
      files: [styles.css]
      caption:
        uk: "Другий коміт `c2` має батька `c1`. Гілка `main` просто **посунулась** на новий коміт — гілка в git це лише вказівник."
        en: "The second commit `c2` has `c1` as its parent. The `main` branch simply **moved** to the new commit — a branch in git is just a pointer."
    - op: branch
      name: feature/filter
      caption:
        uk: "`git switch -c feature/filter` створює нову гілку **на тому самому** коміті `c2` і перемикає `HEAD` на неї. Нових комітів ще немає."
        en: "`git switch -c feature/filter` creates a new branch **at the same** commit `c2` and switches `HEAD` to it. No new commits yet."
    - op: modify
      files: [wishes.js]
      caption:
        uk: "Редагуємо `wishes.js` у робочій директорії: додаємо фільтр за ціною. Git бачить файл як **modified**, але коміту ще немає."
        en: "We edit `wishes.js` in the working tree to add a price filter. Git sees the file as **modified**, but there is no commit yet."
    - op: stage
      files: [wishes.js]
      caption:
        uk: "`git add wishes.js` переносить зміну в **staging area** — список того, що увійде в наступний коміт."
        en: "`git add wishes.js` moves the change into the **staging area** — the list of what the next commit will contain."
    - op: commit
      message: "filter wishes by price"
      caption:
        uk: "Коміт `c3` на гілці `feature/filter`. `main` залишається на `c2`: гілки розійшлися."
        en: "Commit `c3` on `feature/filter`. `main` stays at `c2`: the branches have diverged."
    - op: checkout
      name: main
      caption:
        uk: "`git switch main` повертає `HEAD` на `main`. Робоча директорія стає такою, як у `c2` — фільтра там немає."
        en: "`git switch main` moves `HEAD` back to `main`. The working tree now matches `c2` — no filter there."
    - op: commit
      message: "rename price to cost"
      files: [wishes.js]
      caption:
        uk: "Тим часом на `main` теж змінили `wishes.js` (той самий рядок!) і закомітили `c4`. Тепер дві гілки мають різні версії одного файлу."
        en: "Meanwhile `wishes.js` is changed on `main` too (the same line!) and committed as `c4`. Two branches now hold different versions of one file."
    - op: merge
      from: feature/filter
      conflict: [wishes.js]
      caption:
        uk: "`git merge feature/filter`: git намагається об'єднати `c3` і `c4`. Зміни в одному рядку він **не може** вирішити сам — `wishes.js` позначено як conflicted, merge зупинено."
        en: "`git merge feature/filter`: git tries to combine `c3` and `c4`. Changes to the same line it **cannot** resolve on its own — `wishes.js` is marked conflicted and the merge pauses."
    - op: resolve
      files: [wishes.js]
      caption:
        uk: "Відкриваємо файл, бачимо маркери `<<<<<<<`, `=======`, `>>>>>>>`, залишаємо правильну версію (фільтр **і** нову назву `cost`), прибираємо маркери, `git add` — конфлікт розв'язано."
        en: "We open the file, see the `<<<<<<<`, `=======`, `>>>>>>>` markers, keep the right version (the filter **and** the new `cost` name), remove the markers, `git add` — conflict resolved."
    - op: commit
      message: "Merge branch 'feature/filter'"
      caption:
        uk: "`git commit` завершує злиття: **merge-коміт** `c5` має двох батьків — `c4` і `c3`. `main` вказує на нього, історія обох гілок збережена."
        en: "`git commit` completes the merge: the **merge commit** `c5` has two parents — `c4` and `c3`. `main` points at it; the history of both branches is preserved."
