# Sample visual block: code-trace with localized example text (%%key%% placeholders from `strings`).
# The block is compiled once per language; panels that stay empty (no functions, no objects) are not drawn.
id: greeting-strings
kind: visual
visual: code-trace
strings:
  greeting: { uk: "Привіт", en: "Hello" }
  guest: { uk: "Олено", en: "Olena" }
title:
  uk: "Рядки склеюються крок за кроком"
  en: "Strings are joined step by step"
textEquivalent:
  uk: >-
    Змінна greeting отримує рядок «%%greeting%%». Вираз greeting + ", %%guest%%" створює новий рядок
    «%%greeting%%, %%guest%%», і його отримує змінна message. Потім message + "!" створює ще один рядок,
    «%%greeting%%, %%guest%%!», і message отримує вже його: рядок не змінюється, змінна просто
    отримує новий. Наприкінці console.log виводить «%%greeting%%, %%guest%%!».
  en: >-
    The variable greeting gets the string "%%greeting%%". The expression greeting + ", %%guest%%" creates
    a new string, "%%greeting%%, %%guest%%", and message gets it. Then message + "!" creates one more
    string, "%%greeting%%, %%guest%%!", and message gets that one: a string never changes, the variable
    just gets a new one. At the end console.log prints "%%greeting%%, %%guest%%!".
spec:
  code: |
    const greeting = "%%greeting%%";
    let message = greeting + ", %%guest%%";
    message = message + "!";
    console.log(message);
  captions:
    - at: { line: 1 }
      text:
        uk: "Програма починається: `greeting` і `message` уже оголошені, але ще **uninitialized**. Текст у лапках — приклад інтерфейсу, тож він іде мовою уроку."
        en: "The program starts: `greeting` and `message` are declared but still **uninitialized**. The quoted text is example UI text, so it follows the lesson language."
    - at: { line: 2 }
      text:
        uk: "`greeting` тепер `\"%%greeting%%\"`. Оператор `+` склеїть два рядки: `greeting` і `\", %%guest%%\"`."
        en: "`greeting` is now `\"%%greeting%%\"`. The `+` operator will join two strings: `greeting` and `\", %%guest%%\"`."
    - at: { line: 3 }
      text:
        uk: "`message` — новий рядок `\"%%greeting%%, %%guest%%\"`. `message + \"!\"` не змінює його, а створює ще один рядок."
        en: "`message` is a new string, `\"%%greeting%%, %%guest%%\"`. `message + \"!\"` does not change it; it creates one more string."
    - at: { line: 4 }
      text:
        uk: "Змінна `message` отримала новий рядок `\"%%greeting%%, %%guest%%!\"` — його і виведе `console.log`."
        en: "The variable `message` got the new string `\"%%greeting%%, %%guest%%!\"` — that is what `console.log` prints."
    - at: { line: 4, kind: end }
      text:
        uk: "У консолі — `%%greeting%%, %%guest%%!`. Функцій і об’єктів тут немає, тому панелей call stack і heap немає теж."
        en: "The console shows `%%greeting%%, %%guest%%!`. There are no functions and no objects here, so there is no call stack or heap panel either."
