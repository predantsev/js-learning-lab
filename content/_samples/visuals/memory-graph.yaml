# Sample visual block: memory-graph (authored states).
id: shared-reference-vs-copy
kind: visual
visual: memory-graph
title:
  uk: "Спільне посилання чи копія?"
  en: "Shared reference or a copy?"
textEquivalent:
  uk: >-
    Змінна wish вказує на об'єкт { name: "Лампа", price: 45 }. Присвоєння const same = wish
    не створює другий об'єкт: обидві змінні вказують на той самий об'єкт, тому same.price = 60
    змінює і wish.price. Спред const copy = { ...wish } створює новий об'єкт із такими самими
    властивостями, тому copy.price = 99 не чіпає wish. Вкладений об'єкт tags залишається спільним
    після спреду (поверхнева копія): copy.tags.push("sale") видно і через wish.
  en: >-
    The variable wish points at the object { name: "Lamp", price: 45 }. const same = wish does not
    create a second object: both variables point at the same object, so same.price = 60 also changes
    wish.price. The spread const copy = { ...wish } creates a new object with the same properties, so
    copy.price = 99 leaves wish alone. The nested tags object stays shared after the spread (shallow
    copy): copy.tags.push("sale") is visible through wish too.
spec:
  code: |
    const wish = { name: "Lamp", price: 45, tags: ["home"] };
    const same = wish;
    same.price = 60;
    const copy = { ...wish };
    copy.price = 99;
    copy.tags.push("sale");
  states:
    - caption:
        uk: "`wish` — це не сам об'єкт, а **посилання** на нього. Об'єкт живе в heap (#obj1), масив `tags` — окремий об'єкт (#tags)."
        en: "`wish` is not the object itself but a **reference** to it. The object lives in the heap (#obj1); the `tags` array is a separate object (#tags)."
      line: 1
      bindings:
        - { name: wish, kind: const, value: { ref: obj1 } }
      heap:
        obj1: { kind: object, props: { name: "Lamp", price: 45, tags: { ref: tags } } }
        tags: { kind: array, items: ["home"] }
    - caption:
        uk: "`const same = wish` копіює **посилання**, не об'єкт. Дві змінні — одна стрілка на той самий #obj1."
        en: "`const same = wish` copies the **reference**, not the object. Two variables, one and the same #obj1."
      line: 2
      bindings:
        - { name: wish, kind: const, value: { ref: obj1 } }
        - { name: same, kind: const, value: { ref: obj1 } }
      heap:
        obj1: { kind: object, props: { name: "Lamp", price: 45, tags: { ref: tags } } }
        tags: { kind: array, items: ["home"] }
    - caption:
        uk: "`same.price = 60` змінює об'єкт, на який вказують **обидві** змінні. `wish.price` теж 60 — ніхто не «оновлював wish», просто об'єкт один."
        en: "`same.price = 60` mutates the object **both** variables point at. `wish.price` is 60 too — nobody “updated wish”, there is simply one object."
      line: 3
      bindings:
        - { name: wish, kind: const, value: { ref: obj1 } }
        - { name: same, kind: const, value: { ref: obj1 } }
      heap:
        obj1: { kind: object, props: { name: "Lamp", price: 60, tags: { ref: tags } } }
        tags: { kind: array, items: ["home"] }
      changed: [obj1]
    - caption:
        uk: "Спред `{ ...wish }` створює **новий** об'єкт #obj2 і копіює властивості. Але `tags` — теж посилання, тому #obj2.tags вказує на той самий масив #tags."
        en: "The spread `{ ...wish }` creates a **new** object #obj2 and copies the properties. But `tags` is a reference as well, so #obj2.tags points at the same array #tags."
      line: 4
      bindings:
        - { name: wish, kind: const, value: { ref: obj1 } }
        - { name: same, kind: const, value: { ref: obj1 } }
        - { name: copy, kind: const, value: { ref: obj2 } }
      heap:
        obj1: { kind: object, props: { name: "Lamp", price: 60, tags: { ref: tags } } }
        obj2: { kind: object, props: { name: "Lamp", price: 60, tags: { ref: tags } } }
        tags: { kind: array, items: ["home"] }
    - caption:
        uk: "`copy.price = 99` змінює лише #obj2. `wish.price` залишається 60 — це вже різні об'єкти."
        en: "`copy.price = 99` changes only #obj2. `wish.price` stays 60 — these are different objects now."
      line: 5
      bindings:
        - { name: wish, kind: const, value: { ref: obj1 } }
        - { name: same, kind: const, value: { ref: obj1 } }
        - { name: copy, kind: const, value: { ref: obj2 } }
      heap:
        obj1: { kind: object, props: { name: "Lamp", price: 60, tags: { ref: tags } } }
        obj2: { kind: object, props: { name: "Lamp", price: 99, tags: { ref: tags } } }
        tags: { kind: array, items: ["home"] }
    - caption:
        uk: "`copy.tags.push(\"sale\")` змінює масив #tags, спільний для обох об'єктів: `wish.tags` теж містить `\"sale\"`. Спред — **поверхнева** копія; для вкладених структур потрібна глибока (`structuredClone`)."
        en: "`copy.tags.push(\"sale\")` mutates the array #tags shared by both objects: `wish.tags` contains `\"sale\"` as well. Spread is a **shallow** copy; nested structures need a deep one (`structuredClone`)."
      line: 6
      bindings:
        - { name: wish, kind: const, value: { ref: obj1 } }
        - { name: same, kind: const, value: { ref: obj1 } }
        - { name: copy, kind: const, value: { ref: obj2 } }
      heap:
        obj1: { kind: object, props: { name: "Lamp", price: 60, tags: { ref: tags } } }
        obj2: { kind: object, props: { name: "Lamp", price: 99, tags: { ref: tags } } }
        tags: { kind: array, items: ["home", "sale"] }
