# Sample visual block: authored memory-graph with a hole in an array ({ empty: true }) and long
# identifiers (binding boxes and the code panel follow their content).
id: sparse-reminders
kind: visual
visual: memory-graph
title:
  uk: "Дірка в масиві — це не undefined"
  en: "A hole in an array is not undefined"
textEquivalent:
  uk: >-
    Масив scheduledReminders має довжину 3, але індекс 1 у ньому порожній: туди ніколи нічого не записували,
    це «дірка», а не значення undefined. filter викликає функцію лише для індексів, які справді існують, тож
    дірку пропускає, і новий масив remindersWithoutHoles містить два елементи: "water" і "stretch".
    Початковий масив не змінюється.
  en: >-
    The array scheduledReminders has length 3, but index 1 is empty: nothing was ever written there, it is a
    "hole", not the value undefined. filter calls its function only for the indexes that really exist, so it
    skips the hole, and the new array remindersWithoutHoles holds two items: "water" and "stretch". The
    original array does not change.
spec:
  code: |
    const scheduledReminders = ["water", , "stretch"];
    const remindersWithoutHoles = scheduledReminders.filter(() => true);
  states:
    - caption:
        uk: "Між `\"water\"` і `\"stretch\"` дві коми поспіль: індекс 1 **порожній**. Довжина масиву — 3, але значення за індексом 1 немає зовсім, це не `undefined`."
        en: "There are two commas in a row between `\"water\"` and `\"stretch\"`: index 1 is **empty**. The array length is 3, but index 1 holds no value at all — not even `undefined`."
      line: 1
      bindings:
        - { name: scheduledReminders, kind: const, value: { ref: r1 } }
        - { name: remindersWithoutHoles, kind: const, value: "uninitialized" }
      heap:
        r1: { kind: array, items: ["water", { empty: true }, "stretch"] }
    - caption:
        uk: "`filter` викликає функцію лише для індексів, що існують: для дірки — ні разу. Новий масив `#r2` має два елементи, а `#r1` лишився як був."
        en: "`filter` calls its function only for indexes that exist — never for the hole. The new array `#r2` has two items, and `#r1` stays as it was."
      line: 2
      bindings:
        - { name: scheduledReminders, kind: const, value: { ref: r1 } }
        - { name: remindersWithoutHoles, kind: const, value: { ref: r2 } }
      heap:
        r1: { kind: array, items: ["water", { empty: true }, "stretch"] }
        r2: { kind: array, items: ["water", "stretch"] }
