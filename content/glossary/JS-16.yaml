# Terms introduced in JS-16 (URLs and encoding, HTTP in depth, origins and cookies, CORS, network failures, safe output, XSS, client-side secrets and privacy).
- id: query-string
  term: query string
  name: { uk: "рядок запиту (query string)", en: "query string" }
  aliases: [query, search params]
  definition:
    uk: "Частина адреси після `?` і до `#`: пари `назва=значення`, розділені `&`, наприклад `?category=books&sort=price`. Сервер отримує її разом зі шляхом. У JavaScript її читають і збирають через `url.searchParams` або `URLSearchParams`, які самі кодують і розкодовують значення."
    en: "The part of an address after `?` and before `#`: `name=value` pairs separated by `&`, for example `?category=books&sort=price`. The server receives it together with the path. In JavaScript it is read and built with `url.searchParams` or `URLSearchParams`, which encode and decode the values themselves."
  example:
    code: "const url = new URL(\"http://127.0.0.1:4300/tasks?day=2026-03-02\");\nurl.searchParams.get(\"day\"); // \"2026-03-02\""
  see: [percent-encoding, url-fragment]
- id: percent-encoding
  term: percent-encoding
  name: { uk: "percent-encoding (відсоткове кодування)", en: "percent-encoding" }
  aliases: [URL encoding]
  definition:
    uk: "Спосіб записати в адресі будь-який текст: кожен байт, що має в адресі особливе значення або не є простим латинським символом, пишуть як `%` і два шістнадцяткові знаки. `&` стає `%26`, пробіл — `%20` (у рядку запиту ще й `+`), кириличне «Д» — двома байтами `%D0%94`. Кодують кожне значення окремо, а не всю адресу."
    en: "A way to write any text in an address: every byte that has a special meaning in an address or is not a plain Latin character is written as `%` followed by two hexadecimal digits. `&` becomes `%26`, a space `%20` (or `+` in a query string), the Cyrillic “Д” the two bytes `%D0%94`. Each value is encoded on its own, not the whole address."
  example:
    code: "encodeURIComponent(\"a&b c\"); // \"a%26b%20c\""
  see: [query-string]
- id: url-fragment
  term: URL fragment
  name: { uk: "фрагмент адреси", en: "URL fragment" }
  aliases: [hash, fragment identifier]
  definition:
    uk: "Частина адреси після `#`, наприклад `#w-02`. Браузер не надсилає її на сервер: вона потрібна лише сторінці — щоб прокрутити до елемента чи запам’ятати стан. У JavaScript її видно як `url.hash` або `location.hash`."
    en: "The part of an address after `#`, for example `#w-02`. The browser does not send it to the server: only the page needs it — to scroll to an element or remember some state. In JavaScript it shows up as `url.hash` or `location.hash`."
  see: [query-string]
- id: safe-method
  term: safe method
  name: { uk: "безпечний метод", en: "safe method" }
  definition:
    uk: "HTTP-метод, що лише читає й нічого не змінює на сервері: `GET`, `HEAD`, `OPTIONS`. Браузер, кеш чи сам код можуть повторити такий запит без шкоди. `POST`, `PUT`, `PATCH` і `DELETE` — не безпечні: вони змінюють дані."
    en: "An HTTP method that only reads and changes nothing on the server: `GET`, `HEAD`, `OPTIONS`. A browser, a cache or the code itself may repeat such a request without harm. `POST`, `PUT`, `PATCH` and `DELETE` are not safe: they change data."
  see: [idempotency, http-method]
- id: idempotency
  term: idempotency
  name: { uk: "ідемпотентність", en: "idempotency" }
  aliases: [idempotent]
  definition:
    uk: "Властивість запиту, після якого один чи кілька однакових повторів лишають сервер у тому самому стані. `GET`, `PUT` і `DELETE` ідемпотентні: двічі видалений запис усе одно видалений. `POST` — ні: два однакові запити створять два записи. Тому автоматично повторювати після збою безпечно лише ідемпотентні запити."
    en: "The property of a request after which one or several identical repeats leave the server in the same state. `GET`, `PUT` and `DELETE` are idempotent: a record deleted twice is still deleted. `POST` is not: two identical requests create two records. That is why only idempotent requests are safe to retry automatically after a failure."
  see: [safe-method, http-method]
- id: cache-control
  term: Cache-Control
  name: { uk: "Cache-Control", en: "Cache-Control" }
  definition:
    uk: "Заголовок відповіді, що каже браузерові й проміжним кешам, чи можна зберегти копію і як довго нею користуватися без нового запиту: `no-store` — не зберігати взагалі, `no-cache` — зберегти, але щоразу перепитувати сервер, `max-age=60` — 60 секунд брати копію."
    en: "A response header that tells the browser and intermediate caches whether a copy may be kept and for how long it may be used without a new request: `no-store` — keep nothing, `no-cache` — keep it but ask the server every time, `max-age=60` — use the copy for 60 seconds."
  see: [http-header]
- id: origin
  term: origin
  name: { uk: "origin (джерело сторінки)", en: "origin" }
  definition:
    uk: "Схема, хост і порт адреси разом: для `http://localhost:5173/wishes?sort=price` це `http://localhost:5173`. Браузер ділить за origin сховище (`localStorage`, `sessionStorage`) і вирішує, чи може скрипт прочитати відповідь іншого сайту. Інший порт чи схема — інший origin."
    en: "The scheme, host and port of an address together: for `http://localhost:5173/wishes?sort=price` it is `http://localhost:5173`. The browser splits storage (`localStorage`, `sessionStorage`) by origin and uses it to decide whether a script may read another site’s response. Another port or scheme is another origin."
  example:
    code: "new URL(\"http://localhost:5173/wishes?sort=price\").origin; // \"http://localhost:5173\""
  see: [same-origin-policy, cookie]
- id: cookie
  term: cookie
  name: { uk: "cookie", en: "cookie" }
  definition:
    uk: "Невеликий запис `назва=значення`, який сервер встановлює заголовком `Set-Cookie`, а браузер потім сам додає до кожного відповідного запиту в заголовку `Cookie`. Межі cookie задають атрибути (хост, `Domain`, `Path`), а не origin: порт для нього не важить. На відміну від `localStorage`, cookie їде із запитами, а з `HttpOnly` скрипти сторінки його не бачать."
    en: "A small `name=value` record that a server sets with the `Set-Cookie` header and that the browser then adds by itself to every matching request in the `Cookie` header. A cookie’s scope is set by its attributes (host, `Domain`, `Path`), not by the origin: the port does not matter to it. Unlike `localStorage`, a cookie travels with requests, and with `HttpOnly` the page’s scripts cannot see it."
  example:
    code: "Set-Cookie: theme=dark; Path=/; Max-Age=2592000; SameSite=Lax"
  see: [cookie-attributes, origin]
- id: cookie-attributes
  term: cookie attributes
  name: { uk: "атрибути cookie", en: "cookie attributes" }
  aliases: [Domain, Path, Secure, HttpOnly, SameSite, Max-Age]
  definition:
    uk: "Частини заголовка `Set-Cookie` після першої `;`, що задають межі й життя cookie: `Domain` (без нього — лише той самий хост), `Path` (адреси з цим початком), `Max-Age`/`Expires` (час життя; без них — до закриття браузера), `Secure` (лише через `https`), `HttpOnly` (недоступний для `document.cookie`), `SameSite` (`Lax`, `Strict` чи `None` — чи їде cookie із запитами, які почала сторінка іншого сайту)."
    en: "The parts of a `Set-Cookie` header after the first `;` that set a cookie’s scope and life: `Domain` (without it, the same host only), `Path` (addresses starting with it), `Max-Age`/`Expires` (the lifetime; without them, until the browser closes), `Secure` (over `https` only), `HttpOnly` (hidden from `document.cookie`), `SameSite` (`Lax`, `Strict` or `None` — whether the cookie travels with requests started by a page of another site)."
  see: [cookie]
- id: same-origin-policy
  term: same-origin policy
  name: { uk: "same-origin policy (політика одного джерела)", en: "same-origin policy" }
  definition:
    uk: "Правило браузера: скрипт сторінки може надсилати запити й до інших origins (перед «непростим» браузер спершу питає дозволу через preflight), але прочитати відповідь з іншого origin — лише якщо сервер це дозволив заголовками CORS. Правило захищає людину в браузері: чужа сторінка не прочитає відповідей її пошти чи банку, навіть якщо запит пішов із її cookie. Сервер воно не захищає — клієнти поза браузером його не виконують."
    en: "A browser rule: a page’s script may send requests to other origins too (before a “non-simple” one the browser first asks for permission with a preflight), but may read a response from another origin only if the server allowed it with CORS headers. The rule protects the person in the browser: a foreign page cannot read the responses of their mail or bank, even when the request went out with their cookies. It does not protect the server — clients outside the browser do not follow it."
  see: [origin, cors]
- id: cors
  term: CORS
  name: { uk: "CORS (Cross-Origin Resource Sharing)", en: "CORS (Cross-Origin Resource Sharing)" }
  definition:
    uk: "Спосіб, яким сервер дозволяє сторінкам інших origins читати свої відповіді: заголовки `Access-Control-Allow-Origin` (кому), `-Allow-Methods` і `-Allow-Headers` (які запити), `-Allow-Credentials` (із cookie). Без дозволу браузер не віддає скрипту тіла, і `fetch` відхиляється з `TypeError`, хоча сервер міг запит отримати й обробити. Налаштовують CORS на сервері, не в коді сторінки."
    en: "The way a server lets pages of other origins read its responses: the headers `Access-Control-Allow-Origin` (to whom), `-Allow-Methods` and `-Allow-Headers` (which requests) and `-Allow-Credentials` (with cookies). Without permission the browser withholds the body from the script, and `fetch` rejects with a `TypeError`, although the server may have received and processed the request. CORS is set up on the server, not in the page’s code."
  example:
    code: "Access-Control-Allow-Origin: http://127.0.0.1:5173"
  see: [same-origin-policy, preflight-request]
- id: preflight-request
  term: preflight request
  name: { uk: "preflight (попередній запит)", en: "preflight request" }
  aliases: [preflight, OPTIONS request]
  definition:
    uk: "Запит `OPTIONS`, який браузер сам надсилає перед «непростим» запитом до іншого origin (метод не `GET`/`HEAD`/`POST`, власний заголовок, `Content-Type: application/json`), щоб спитати, чи такий запит дозволено. Якщо відповідь не дозволяє метод чи заголовок, сам запит не надсилається зовсім, і в журналі сервера видно лише `OPTIONS`."
    en: "An `OPTIONS` request the browser sends by itself before a “non-simple” request to another origin (a method other than `GET`/`HEAD`/`POST`, a custom header, `Content-Type: application/json`) to ask whether such a request is allowed. If the answer does not allow the method or header, the request itself is never sent, and the server log shows only `OPTIONS`."
  see: [cors]
- id: credentialed-request
  term: credentialed request
  name: { uk: "запит з обліковими даними (credentials)", en: "credentialed request" }
  definition:
    uk: "Запит до іншого origin, з яким браузер надсилає cookie: `fetch(url, { credentials: \"include\" })`. Щоб скрипт прочитав відповідь, сервер мусить назвати точний origin в `Access-Control-Allow-Origin` (зірочка `*` не підходить) і додати `Access-Control-Allow-Credentials: true`."
    en: "A request to another origin with which the browser sends cookies: `fetch(url, { credentials: \"include\" })`. For the script to read the response, the server must name the exact origin in `Access-Control-Allow-Origin` (the `*` wildcard does not do) and add `Access-Control-Allow-Credentials: true`."
  see: [cors, cookie]
- id: network-throttling
  term: network throttling
  name: { uk: "умови мережі (throttling)", en: "network throttling" }
  aliases: [throttling, offline mode]
  definition:
    uk: "Перемикач на панелі Network у DevTools, що навмисно сповільнює мережу сторінки (повільні профілі на кшталт 3G) або вимикає її зовсім (Offline). Так перевіряють, як сторінка поводиться на поганому з’єднанні: чи спрацьовує тайм-аут і чи показується зрозуміле повідомлення. Після перевірки його повертають у No throttling."
    en: "A switch in the DevTools Network panel that deliberately slows the page’s network down (slow profiles such as 3G) or turns it off entirely (Offline). It is how you check what a page does on a bad connection: whether the timeout fires and a clear message appears. Afterwards it is switched back to No throttling."
  see: [network-error]
- id: untrusted-input
  term: untrusted input
  name: { uk: "недовірене введення", en: "untrusted input" }
  definition:
    uk: "Будь-які дані, яких не писав сам код сторінки: поле форми, адреса сторінки (`location.search`), уміст `localStorage`, JSON із сервера чи файла. Перевірка форми запису (`validate*`) не робить такий текст безпечним для показу — безпеку забезпечує місце показу: `textContent` чи `setAttribute`, а не `innerHTML`."
    en: "Any data the page’s code did not write itself: a form field, the page address (`location.search`), the contents of `localStorage`, JSON from a server or a file. A check of a record’s shape (`validate*`) does not make such text safe to display — safety comes from the place of display: `textContent` or `setAttribute`, not `innerHTML`."
  see: [trust-boundary, output-context, unsafe-sink]
- id: trust-boundary
  term: trust boundary
  name: { uk: "межа довіри", en: "trust boundary" }
  definition:
    uk: "Місце, де дані переходять від джерела, яке код не контролює (людина, адреса, сховище, мережа), до коду. На межі дані перевіряють за формою (`validateTask`), а далі пам’ятають, що текст і після перевірки лишається чужим, — і показують його лише безпечними способами."
    en: "The place where data passes from a source the code does not control (a person, the address, storage, the network) into the code. At the boundary data is checked for its shape (`validateTask`), and from then on the code remembers that the text is still foreign after the check — and shows it only in safe ways."
  see: [untrusted-input]
- id: output-context
  term: output context
  name: { uk: "контекст виводу", en: "output context" }
  definition:
    uk: "Роль, яку значення відіграє там, де його показують: текст елемента, значення атрибута, адреса (`href`, `src`) чи HTML-розмітка. Кожен контекст має свій безпечний API: `textContent` — для тексту, `setAttribute` — для атрибута, перевірка схеми через `URL` — для адреси; у HTML недовірений текст не потрапляє."
    en: "The role a value plays where it is shown: an element’s text, an attribute value, an address (`href`, `src`) or HTML markup. Each context has its own safe API: `textContent` for text, `setAttribute` for an attribute, a scheme check with `URL` for an address; untrusted text does not go into HTML."
  see: [untrusted-input, unsafe-sink]
- id: xss
  term: XSS
  name: { uk: "XSS (cross-site scripting)", en: "XSS (cross-site scripting)" }
  aliases: [cross-site scripting]
  definition:
    uk: "Атака, за якої недовірений текст потрапляє в небезпечне місце сторінки (`innerHTML`, `insertAdjacentHTML`, адреса `javascript:`…) і браузер виконує його як код цієї сторінки — з її правами: читати `localStorage`, змінювати сторінку, надсилати запити від імені людини. Захист — безпечні sinks (`textContent`, `setAttribute`, перевірка схеми адреси), а Content-Security-Policy — другий рівень."
    en: "An attack in which untrusted text reaches an unsafe place in a page (`innerHTML`, `insertAdjacentHTML`, a `javascript:` address…) and the browser runs it as that page’s code — with its rights: reading `localStorage`, changing the page, sending requests on the person’s behalf. The defence is safe sinks (`textContent`, `setAttribute`, checking an address’s scheme), with a Content-Security-Policy as the second layer."
  see: [stored-xss, reflected-xss, safe-sink, unsafe-sink, content-security-policy]
- id: stored-xss
  term: stored XSS
  name: { uk: "stored XSS (збережений)", en: "stored XSS" }
  definition:
    uk: "XSS, за якого шкідливий текст спершу зберігається — у базі, файлі фікстур, `localStorage` — і спрацьовує в кожного, чия сторінка показує цей запис через небезпечний sink. Саме тому «дані мого ж застосунку» теж недовірені."
    en: "XSS in which the harmful text is first saved — in a database, a fixture file, `localStorage` — and fires for everyone whose page shows that record through an unsafe sink. That is why “my own app’s data” is untrusted too."
  see: [xss, reflected-xss]
- id: reflected-xss
  term: reflected XSS
  name: { uk: "reflected XSS (відбитий)", en: "reflected XSS" }
  definition:
    uk: "XSS, за якого шкідливий текст приходить в адресі (`?q=…`) і сторінка одразу «відбиває» його назад — наприклад, у рядку «Результати для …» через `innerHTML`. Нападникові досить переконати людину відкрити підготовлене посилання."
    en: "XSS in which the harmful text arrives in the address (`?q=…`) and the page “reflects” it straight back — for example in a “Results for …” line through `innerHTML`. The attacker only has to talk a person into opening a prepared link."
  see: [xss, stored-xss]
- id: safe-sink
  term: safe sink
  name: { uk: "безпечний sink", en: "safe sink" }
  definition:
    uk: "Місце в коді, яке кладе значення в сторінку, нічого не розбираючи як HTML чи код: `textContent`, `createTextNode`, `setAttribute` для звичайних атрибутів, властивості на кшталт `input.value`. Для адрес (`href`, `src`) безпечним його робить лише перевірка схеми — `http:` чи `https:`."
    en: "A place in code that puts a value into the page without parsing anything as HTML or code: `textContent`, `createTextNode`, `setAttribute` for ordinary attributes, properties such as `input.value`. For addresses (`href`, `src`) only a scheme check — `http:` or `https:` — makes it safe."
  see: [unsafe-sink, xss]
- id: content-security-policy
  term: Content-Security-Policy
  name: { uk: "Content-Security-Policy (CSP)", en: "Content-Security-Policy (CSP)" }
  aliases: [CSP]
  definition:
    uk: "Заголовок відповіді або тег `<meta http-equiv>`, яким сторінка обмежує, звідки браузер може брати скрипти та інші ресурси. Наприклад, `script-src 'self'` забороняє вбудовані скрипти й атрибути-обробники на кшталт `onerror`, тож XSS-розмітка не виконається. Це другий рівень захисту: він не замінює безпечних sinks."
    en: "A response header or `<meta http-equiv>` tag with which a page limits where the browser may take scripts and other resources from. For example, `script-src 'self'` forbids inline scripts and handler attributes such as `onerror`, so XSS markup does not run. It is a second layer of defence: it does not replace safe sinks."
  example:
    code: "Content-Security-Policy: script-src 'self'"
  see: [xss, safe-sink]
- id: client-side-secret
  term: client-side secret
  name: { uk: "секрет у клієнтському коді", en: "client-side secret" }
  definition:
    uk: "Ключ, токен чи пароль, який читає код, що виконується в браузері. Такий «секрет» потрапляє в bundle й доступний кожному відвідувачу: мініфікація, обфускація чи вимкнені source maps його не ховають. Справжній секрет живе на сервері, у змінних середовища серверного процесу, а сторінка звертається до цього сервера."
    en: "A key, token or password read by code that runs in the browser. Such a “secret” ends up in the bundle and is available to every visitor: minification, obfuscation or turned-off source maps do not hide it. A real secret lives on a server, in the environment variables of the server process, and the page talks to that server."
  see: [bundle, environment-variable]
- id: data-minimization
  term: data minimization
  name: { uk: "мінімізація даних", en: "data minimization" }
  definition:
    uk: "Правило: збирати й зберігати лише ті дані, без яких функція справді не працює, і лише стільки часу, скільки вони потрібні. Чого немає, того не вкрадуть через XSS і не побачить наступна людина за цим комп’ютером."
    en: "The rule of collecting and keeping only the data a feature really cannot work without, and only for as long as it is needed. What is not there cannot be stolen through XSS or seen by the next person at this computer."
  see: [personal-data]
- id: personal-data
  term: personal data
  name: { uk: "персональні дані", en: "personal data" }
  definition:
    uk: "Будь-які відомості, за якими можна впізнати конкретну людину: ім’я, email, телефон, адреса, місцезнаходження, а також здоров’я чи фінанси. Їх не збирають без потреби, не тримають у клієнтському сховищі довше, ніж треба, і дають людині спосіб їх стерти."
    en: "Any information by which a particular person can be identified: a name, an email, a phone number, an address, a location, and also health or finances. It is not collected without a need, not kept in client storage longer than necessary, and the person is given a way to delete it."
  see: [data-minimization]
