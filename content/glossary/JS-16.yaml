# Terms introduced in JS-16 (URLs and encoding, HTTP in depth, origins and cookies, CORS, network failures, safe output, XSS, client-side secrets and privacy).
- id: query-string
  term: query string
  name: { uk: "рядок запиту (query string)", en: "query string" }
  aliases: [query, search params]
  definition:
    uk: "Частина адреси після `?` і до `#`: пари `назва=значення`, розділені `&`, наприклад `?category=books&sort=price`. Сервер отримує її разом зі шляхом. У JavaScript її читають і збирають через `url.searchParams` або `URLSearchParams`, які самі кодують і розкодовують значення."
    en: "The part of an address after `?` and before `#`: `name=value` pairs separated by `&`, for example `?category=books&sort=price`. The server receives it together with the path. In JavaScript it is read and built with `url.searchParams` or `URLSearchParams`, which encode and decode the values themselves."
  example:
    code: "const url = new URL(\"http://127.0.0.1:4300/tasks?day=2026-03-02\");\nurl.searchParams.get(\"day\"); // \"2026-03-02\""
  see: [percent-encoding, url-fragment]
- id: percent-encoding
  term: percent-encoding
  name: { uk: "percent-encoding (відсоткове кодування)", en: "percent-encoding" }
  aliases: [URL encoding]
  definition:
    uk: "Спосіб записати в адресі будь-який текст: кожен байт, що має в адресі особливе значення або не є простим латинським символом, пишуть як `%` і два шістнадцяткові знаки. `&` стає `%26`, пробіл — `%20` (у рядку запиту ще й `+`), кириличне «Д» — двома байтами `%D0%94`. Кодують кожне значення окремо, а не всю адресу."
    en: "A way to write any text in an address: every byte that has a special meaning in an address or is not a plain Latin character is written as `%` followed by two hexadecimal digits. `&` becomes `%26`, a space `%20` (or `+` in a query string), the Cyrillic “Д” the two bytes `%D0%94`. Each value is encoded on its own, not the whole address."
  example:
    code: "encodeURIComponent(\"a&b c\"); // \"a%26b%20c\""
  see: [query-string]
- id: url-fragment
  term: URL fragment
  name: { uk: "фрагмент адреси", en: "URL fragment" }
  aliases: [hash, fragment identifier]
  definition:
    uk: "Частина адреси після `#`, наприклад `#w-02`. Браузер не надсилає її на сервер: вона потрібна лише сторінці — щоб прокрутити до елемента чи запам’ятати стан. У JavaScript її видно як `url.hash` або `location.hash`."
    en: "The part of an address after `#`, for example `#w-02`. The browser does not send it to the server: only the page needs it — to scroll to an element or remember some state. In JavaScript it shows up as `url.hash` or `location.hash`."
  see: [query-string]
