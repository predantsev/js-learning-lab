# Terms introduced in NO-07. One file per unit keeps parallel authoring conflict-free.
- id: allowlist-validation
  term: allowlist validation
  name: { uk: "перевірка за списком дозволеного (allowlist)", en: "allowlist validation" }
  aliases: ["allowlist", "allow-list", "denylist", "список дозволеного"]
  definition:
    uk: "Перевірка, яка приймає лише значення з наперед відомого списку (статус `open` або `done`) чи точного шаблону (лише цифри) і відхиляє все інше. Протилежний підхід — denylist, список заборонених значень, — пропускає все, про що автор не подумав: `__proto__`, `1e3`, закодовану скісну риску."
    en: "A check that accepts only values from a list known in advance (the status `open` or `done`) or an exact pattern (digits only) and rejects everything else. The opposite approach — a denylist, a list of forbidden values — lets through everything its author did not think of: `__proto__`, `1e3`, an encoded slash."
  see: [edge-validation, untrusted-input, path-traversal]
- id: headers-timeout
  term: headers timeout
  name: { uk: "таймаут заголовків (headersTimeout)", en: "headers timeout (headersTimeout)" }
  aliases: ["headersTimeout", "requestTimeout"]
  definition:
    uk: "Час, за який клієнт має надіслати всі заголовки запиту; у `node:http` це параметр `headersTimeout` сервера (у Node.js 22 типово 60 000 мс). Його сусід `requestTimeout` обмежує весь запит разом із тілом. Хто не встиг, отримує від самого Node.js `408 Request Timeout`, а з’єднання закривається — ще до виклику обробника маршруту."
    en: "The time within which a client must send all the request headers; in `node:http` it is the server's `headersTimeout` option (60,000 ms by default in Node.js 22). Its neighbour `requestTimeout` limits the whole request, body included. A client that does not make it gets `408 Request Timeout` from Node.js itself, and the connection closes — before the route handler is ever called."
  see: [slow-client-attack, body-size-limit]
- id: slow-client-attack
  term: slow client attack
  name: { uk: "атака повільного клієнта", en: "slow client attack" }
  aliases: ["Slowloris", "slow client", "повільний клієнт"]
  definition:
    uk: "Спосіб вивести сервер із ладу, надсилаючи запити не великі, а **повільні**: заголовки чи тіло по байту, щоб кожен сокет лишався зайнятим якомога довше. Відома її форма — Slowloris. Захищають таймаути заголовків і всього запиту на рівні сервера, бо обробник маршруту до таких запитів навіть не доходить."
    en: "A way to take a server down by sending requests that are not large but **slow**: headers or a body byte by byte, so that every socket stays busy as long as possible. A well-known form of it is Slowloris. Server-level headers and request timeouts protect from it, because the route handler never even sees such requests."
  see: [headers-timeout]
- id: safe-error-response
  term: safe error response
  name: { uk: "безпечна відповідь про помилку", en: "safe error response" }
  aliases: ["toPublicError", "safe error", "безпечна помилка"]
  definition:
    uk: "Відповідь про збій, побудована лише з полів, які сервер сам вибрав (`code`, `messageKey`, `details`, `requestId`), без `error.message`, стека, шляхів до файлів чи повідомлень парсера: їх писали для розробника, і вони можуть видати будову сервера чи шматок секрету. Повна помилка лишається в журналі сервера під тим самим `requestId`."
    en: "An answer about a failure built only from fields the server chose itself (`code`, `messageKey`, `details`, `requestId`), without `error.message`, the stack, file paths or parser messages: those were written for a developer and can give away how the server is built or a piece of a secret. The full error stays in the server's log under the same `requestId`."
  see: [api-error-code, secret-redaction]
- id: secret-redaction
  term: secret redaction
  name: { uk: "приховування секретів (redaction)", en: "secret redaction" }
  aliases: ["redaction", "redact", "[REDACTED]"]
  definition:
    uk: "Заміна значень секретних полів (`token`, `password`, `authorization`) на позначку на кшталт `\"[REDACTED]\"` у копії даних, перш ніж їх записати в журнал чи віддати назовні. Працює на будь-якій глибині й у будь-якому регістрі назв, обходить і причини помилок (`cause`). Секрет усередині вільного тексту (повідомлення парсера) за назвою ключа не знайти, тому такі тексти в журнал не пишуть."
    en: "Replacing the values of secret fields (`token`, `password`, `authorization`) with a marker such as `\"[REDACTED]\"` in a copy of the data before writing it to a log or sending it out. It works at any depth and in any letter case of the names, and walks into error causes (`cause`) too. A secret inside free text (a parser message) cannot be found by key name, so such texts are not written to the log."
  see: [safe-error-response]
- id: supply-chain-risk
  term: supply-chain risk
  name: { uk: "ризик ланцюга постачання", en: "supply-chain risk" }
  aliases: ["supply chain", "ланцюг постачання"]
  definition:
    uk: "Ризик, що прийшов не з твого коду, а із чужого, від якого він залежить: npm-пакетів, їхніх залежностей, інструментів збирання. Пакет виконується з правами твого користувача, тож шкідлива версія, підроблена назва чи покинута залежність стають твоєю проблемою. Захищають менша кількість залежностей, lockfile з `npm ci` і перевірка пакета до встановлення."
    en: "A risk that comes not from your own code but from someone else's code it depends on: npm packages, their dependencies, build tools. A package runs with your user's rights, so a malicious version, a fake name or an abandoned dependency becomes your problem. Fewer dependencies, a lockfile with `npm ci` and checking a package before installing it protect from it."
  see: [typosquatting, install-script, lockfile]
- id: typosquatting
  term: typosquatting
  name: { uk: "typosquatting (підробка назви)", en: "typosquatting" }
  aliases: ["typo-squatting"]
  definition:
    uk: "Публікація пакета з назвою, майже такою самою, як у популярного (`expresss`, `lodahs`), у розрахунку на одруківку. npm встановлює рівно ту назву, яку отримав, тож одна зайва літера приносить чужий код. Захист — копіювати назву зі сторінки пакета й перевіряти автора."
    en: "Publishing a package under a name almost the same as a popular one (`expresss`, `lodahs`), counting on a typo. npm installs exactly the name it was given, so one extra letter brings in foreign code. The protection is to copy the name from the package's page and check the author."
  see: [supply-chain-risk]
- id: install-script
  term: install script
  name: { uk: "скрипт встановлення", en: "install script" }
  aliases: ["postinstall", "preinstall", "--ignore-scripts"]
  definition:
    uk: "Команда з `scripts` пакета (`preinstall`, `install`, `postinstall`), яку npm виконує під час `npm install` — ще до того, як твій код імпортує цей пакет. Законно ними збирають нативні модулі, а шкідливі пакети через них крадуть файли й токени. `npm install --ignore-scripts` їх не виконує."
    en: "A command from a package's `scripts` (`preinstall`, `install`, `postinstall`) that npm runs during `npm install` — before your code ever imports that package. Legitimately they build native modules; malicious packages use them to steal files and tokens. `npm install --ignore-scripts` does not run them."
  see: [supply-chain-risk]
- id: reverse-proxy
  term: reverse proxy
  name: { uk: "зворотний проксі (reverse proxy)", en: "reverse proxy" }
  aliases: ["proxy", "проксі"]
  definition:
    uk: "Окрема програма перед сервером застосунку, що приймає з’єднання клієнтів і передає запити далі. Зазвичай вона завершує TLS, роздає статичні файли, обмежує розмір і частоту запитів, а сам застосунок слухає лише loopback. Сервер за нею бачить у `request.socket.remoteAddress` адресу проксі, а адресу клієнта — лише в заголовку на кшталт `X-Forwarded-For`."
    en: "A separate program in front of the application server that accepts the clients' connections and passes the requests on. It usually terminates TLS, serves static files and limits request size and rate, while the application itself listens on loopback only. A server behind it sees the proxy's address in `request.socket.remoteAddress`, and the client's address only in a header such as `X-Forwarded-For`."
  see: [tls-termination, trusted-proxy]
- id: tls-termination
  term: TLS termination
  name: { uk: "завершення TLS", en: "TLS termination" }
  aliases: ["TLS offloading", "TLS-термінація"]
  definition:
    uk: "Місце, де зашифроване з’єднання HTTPS розшифровується: там лежать сертифікат і ключ. Часто це зворотний проксі, а далі запит іде до застосунку звичайним HTTP всередині того самого комп’ютера чи закритої мережі. Від місця завершення TLS залежить, кому можна вірити: заголовки, дописані після нього, писав проксі, а ті, що прийшли ззовні, — клієнт."
    en: "The place where an encrypted HTTPS connection is decrypted: the certificate and the key live there. Often it is a reverse proxy, and from it the request goes to the application in plain HTTP inside the same computer or a closed network. Where TLS terminates decides whom to believe: headers appended after it were written by the proxy, while those that came from outside were written by the client."
  see: [reverse-proxy]
- id: trusted-proxy
  term: trusted proxy
  name: { uk: "довірений проксі", en: "trusted proxy" }
  aliases: ["X-Forwarded-For", "trust proxy"]
  definition:
    uk: "Проксі зі списку, якому сервер дозволяє повідомляти адресу клієнта через `X-Forwarded-For`. Заголовок читається лише тоді, коли саме з’єднання (`request.socket.remoteAddress`) прийшло від такого проксі, і лише з правого краю: ліві записи міг написати сам клієнт. Без цього правила будь-хто обходить ліміти за адресою, вписавши в заголовок чужу."
    en: "A proxy from a list that the server allows to report the client's address through `X-Forwarded-For`. The header is read only when the connection itself (`request.socket.remoteAddress`) came from such a proxy, and only from the right end: the left entries may have been written by the client itself. Without this rule anyone dodges address-based limits by writing someone else's address in the header."
  see: [reverse-proxy, tls-termination]
- id: ephemeral-port
  term: ephemeral port
  name: { uk: "ефемерний порт (порт 0)", en: "ephemeral port (port 0)" }
  aliases: ["port 0", "listen(0)", "порт 0"]
  definition:
    uk: "Вільний порт, який операційна система вибирає сама, коли сервер просить порт `0`: `server.listen(0, '127.0.0.1')`. Справжній номер повертає `server.address().port`. У тестах це дає кожному серверу свій порт без конфліктів між тестами чи з уже запущеним сервером розробки."
    en: "A free port the operating system picks itself when a server asks for port `0`: `server.listen(0, '127.0.0.1')`. `server.address().port` returns the real number. In tests it gives every server its own port with no clashes between tests or with a development server that is already running."
- id: structured-log
  term: structured log
  name: { uk: "структурований журнал", en: "structured log" }
  aliases: ["structured logging", "JSON log", "JSON-журнал"]
  definition:
    uk: "Журнал, у якому кожен рядок — об’єкт зі сталими полями (зазвичай JSON): `time`, `level`, `requestId`, `route`, `status`, `durationMs`. Такі рядки програма може фільтрувати й рахувати, а не лише людина читати. У них немає тіл, заголовків і секретів — лише те, що допомагає знайти й зрозуміти збій."
    en: "A log in which every line is an object with fixed fields (usually JSON): `time`, `level`, `requestId`, `route`, `status`, `durationMs`. A program can filter and count such lines rather than a person only reading them. They hold no bodies, headers or secrets — only what helps find and understand a failure."
  see: [request-id, secret-redaction]
- id: request-id
  term: request id
  name: { uk: "ідентифікатор запиту (request id)", en: "request id" }
  aliases: ["requestId", "X-Request-Id", "correlation id"]
  definition:
    uk: "Унікальний ідентифікатор одного запиту, що з’являється на межі сервера, стоїть у кожному рядку журналу цього запиту й повертається клієнтові в заголовку `X-Request-Id` (і в тілі помилки). За ним серед перемішаних рядків багатьох запитів знаходять саме потрібні. Вхідний `X-Request-Id` беруть лише правильної форми, інакше створюють свій через `crypto.randomUUID()`."
    en: "A unique identifier of one request that appears at the server's edge, sits in every log line of that request and goes back to the client in the `X-Request-Id` header (and in an error body). With it you find exactly the right lines among the mixed lines of many requests. An incoming `X-Request-Id` is taken only when it has the right shape; otherwise the server creates its own with `crypto.randomUUID()`."
  see: [structured-log]
