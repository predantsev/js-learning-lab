# Terms introduced in NO-07. One file per unit keeps parallel authoring conflict-free.
- id: allowlist-validation
  term: allowlist validation
  name: { uk: "перевірка за списком дозволеного (allowlist)", en: "allowlist validation" }
  aliases: ["allowlist", "allow-list", "denylist", "список дозволеного"]
  definition:
    uk: "Перевірка, яка приймає лише значення з наперед відомого списку (статус `open` або `done`) чи точного шаблону (лише цифри) і відхиляє все інше. Протилежний підхід — denylist, список заборонених значень, — пропускає все, про що автор не подумав: `__proto__`, `1e3`, закодовану скісну риску."
    en: "A check that accepts only values from a list known in advance (the status `open` or `done`) or an exact pattern (digits only) and rejects everything else. The opposite approach — a denylist, a list of forbidden values — lets through everything its author did not think of: `__proto__`, `1e3`, an encoded slash."
  see: [edge-validation, untrusted-input, path-traversal]
- id: headers-timeout
  term: headers timeout
  name: { uk: "таймаут заголовків (headersTimeout)", en: "headers timeout (headersTimeout)" }
  aliases: ["headersTimeout", "requestTimeout"]
  definition:
    uk: "Час, за який клієнт має надіслати всі заголовки запиту; у `node:http` це параметр `headersTimeout` сервера (у Node.js 22 типово 60 000 мс). Його сусід `requestTimeout` обмежує весь запит разом із тілом. Хто не встиг, отримує від самого Node.js `408 Request Timeout`, а з’єднання закривається — ще до виклику обробника маршруту."
    en: "The time within which a client must send all the request headers; in `node:http` it is the server's `headersTimeout` option (60,000 ms by default in Node.js 22). Its neighbour `requestTimeout` limits the whole request, body included. A client that does not make it gets `408 Request Timeout` from Node.js itself, and the connection closes — before the route handler is ever called."
  see: [slow-client-attack, body-size-limit]
- id: slow-client-attack
  term: slow client attack
  name: { uk: "атака повільного клієнта", en: "slow client attack" }
  aliases: ["Slowloris", "slow client", "повільний клієнт"]
  definition:
    uk: "Спосіб вивести сервер із ладу, надсилаючи запити не великі, а **повільні**: заголовки чи тіло по байту, щоб кожен сокет лишався зайнятим якомога довше. Відома її форма — Slowloris. Захищають таймаути заголовків і всього запиту на рівні сервера, бо обробник маршруту до таких запитів навіть не доходить."
    en: "A way to take a server down by sending requests that are not large but **slow**: headers or a body byte by byte, so that every socket stays busy as long as possible. A well-known form of it is Slowloris. Server-level headers and request timeouts protect from it, because the route handler never even sees such requests."
  see: [headers-timeout]
