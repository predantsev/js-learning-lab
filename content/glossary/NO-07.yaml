# Terms introduced in NO-07. One file per unit keeps parallel authoring conflict-free.
- id: allowlist-validation
  term: allowlist validation
  name: { uk: "перевірка за списком дозволеного (allowlist)", en: "allowlist validation" }
  aliases: ["allowlist", "allow-list", "denylist", "список дозволеного"]
  definition:
    uk: "Перевірка, яка приймає лише значення з наперед відомого списку (поля сортування `name`, `price`, `category`) або точного шаблону (лише цифри) і відхиляє все інше. Протилежний підхід — denylist, список заборонених значень, — пропускає все, про що автор не подумав: `__proto__`, `1e3`, закодовану скісну риску."
    en: "A check that accepts only values from a list known in advance (the sort fields `name`, `price`, `category`) or an exact pattern (digits only) and rejects everything else. The opposite approach — a denylist, a list of forbidden values — lets through everything its author did not think of: `__proto__`, `1e3`, an encoded slash."
  see: [edge-validation, untrusted-input, path-traversal]
