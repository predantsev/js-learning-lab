# Terms introduced in JS-10. One file per unit keeps parallel authoring conflict-free.
- id: project-export
  term: project export
  name: { uk: "експорт проєкту", en: "project export" }
  aliases: ["export"]
  definition:
    uk: "Копія проєкту з платформи у звичайній теці на твоєму комп’ютері: усі поточні файли (разом із ще не збереженими змінами), README з командами, `package.json`, маленький сервер `serve.mjs`, маніфест із контрольними сумами та копія сховища проєкту з окремою сторінкою відновлення. Після експорту головною стає локальна тека: платформа її не бачить і нічого в ній не змінює."
    en: "A copy of the project from the platform in an ordinary folder on your computer: every current file (including changes not saved yet), a README with commands, `package.json`, a small `serve.mjs` server, a manifest with checksums and a copy of the project storage with a separate restore page. After the export the local folder is the main version: the platform does not see it and changes nothing in it."
  see: [export-manifest, checksum]
- id: export-manifest
  term: export manifest
  name: { uk: "маніфест експорту", en: "export manifest" }
  aliases: ["jsll-manifest.json", "manifest"]
  definition:
    uk: "Файл `jsll-manifest.json` в експорті: який проєкт і якою мовою експортовано, коли, яка версія вмісту курсу, а для кожного файла — шлях, розмір у байтах і контрольна сума SHA-256. За ним видно, чи файл досі такий, яким вийшов із платформи."
    en: "The `jsll-manifest.json` file of an export: which project was exported, in which language, when, with which course content version, and for every file its path, size in bytes and SHA-256 checksum. It shows whether a file is still exactly as it left the platform."
  example:
    code: "{ \"path\": \"app.js\", \"bytes\": 141, \"sha256\": \"8ff8c501dcf6…\" }"
    lang: json
  see: [project-export, checksum]
- id: checksum
  term: checksum
  name: { uk: "контрольна сума", en: "checksum" }
  aliases: ["hash", "SHA-256"]
  definition:
    uk: "Короткий «відбиток» вмісту файла, обчислений за фіксованим правилом (наприклад, SHA-256 дає 64 шістнадцяткові символи). Той самий вміст завжди дає ту саму суму, а зміна хоч одного байта — зовсім іншу. Тому сума показує, *чи* файл змінився, але не *що* саме в ньому змінилося."
    en: "A short “fingerprint” of a file’s content, computed by a fixed rule (SHA-256, for example, gives 64 hexadecimal characters). The same content always gives the same sum, and a change of even one byte gives a completely different one. So a checksum shows *whether* a file changed, not *what* changed in it."
  example:
    code: "await crypto.subtle.digest(\"SHA-256\", new TextEncoder().encode(\"hello\"));\n// 2cf24dba5fb0a30e… (always the same for \"hello\")"
  see: [export-manifest]
- id: integrated-terminal
  term: integrated terminal
  name: { uk: "вбудований термінал", en: "integrated terminal" }
  aliases: ["VS Code terminal"]
  definition:
    uk: "Термінал усередині VS Code (меню Terminal → New Terminal). Він відкривається в теці, яку відкрито у VS Code, тож команди на кшталт `npm start` одразу діють у корені проєкту. Це той самий термінал, що й окремий, лише поруч із редактором."
    en: "A terminal inside VS Code (the Terminal → New Terminal menu). It opens in the folder that is open in VS Code, so commands such as `npm start` act at the project root straight away. It is the same terminal as a separate one, just next to the editor."
  see: [project-export]
