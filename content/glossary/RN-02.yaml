# Terms introduced in RN-02.
- id: view-component
  term: View
  name: { uk: "View", en: "View" }
  aliases: ["<View>", "нативний контейнер", "native container"]
  definition:
    uk: "Базовий контейнер React Native для верстки, відповідник `<div>`. Він тримає інші компоненти, має стиль (Flexbox, відступи, рамки), але текст прямо в ньому стояти не може — лише всередині `Text`. Документація React Native зіставляє його з `ViewGroup` на Android і `UIView` на iOS."
    en: "React Native's basic layout container, the counterpart of `<div>`. It holds other components and has a style (Flexbox, spacing, borders), but text cannot sit in it directly — only inside `Text`. The React Native documentation maps it to `ViewGroup` on Android and `UIView` on iOS."
  see: [text-component]
- id: text-component
  term: Text
  name: { uk: "Text", en: "Text" }
  aliases: ["<Text>", "Text strings must be rendered within a <Text> component"]
  definition:
    uk: "Єдиний компонент React Native, що показує текст. Рядок поза `Text` на телефоні дає помилку *Text strings must be rendered within a &lt;Text&gt; component*. Стилі тексту (колір, розмір шрифту) успадковуються лише від батьківського `Text`, а не від `View`."
    en: "The only React Native component that shows text. A string outside `Text` gives the error *Text strings must be rendered within a &lt;Text&gt; component* on a phone. Text styles (color, font size) are inherited only from a parent `Text`, not from a `View`."
  see: [view-component]
- id: image-source
  term: Image source
  name: { uk: "source у Image", en: "Image source" }
  aliases: ["source", "Image", "<Image>", "require image"]
  definition:
    uk: "Звідки `Image` бере картинку: об’єкт `{ uri: 'https://…' }` для мережі або `require('./icon.png')` для файла з пакета застосунку. Картинка з пакета отримує розмір автоматично; мережевій картинці `width` і `height` задають у стилі, інакше її розмір 0."
    en: "Where an `Image` gets its picture: an object `{ uri: 'https://…' }` for the network, or `require('./icon.png')` for a file bundled with the app. A bundled picture is sized automatically; a network picture gets `width` and `height` in its style, otherwise its size is 0."
- id: native-text-input
  term: TextInput
  name: { uk: "TextInput", en: "TextInput" }
  aliases: ["<TextInput>", "onChangeText", "текстове поле", "text field"]
  definition:
    uk: "Поле введення React Native, відповідник `<input>`. Керованим його роблять дві пропси: `value` зі стану й `onChangeText`, яку React Native викликає з новим текстом після кожної зміни (аргумент — уже рядок, а не подія)."
    en: "React Native's input field, the counterpart of `<input>`. Two props make it controlled: `value` from state and `onChangeText`, which React Native calls with the new text after every change (the argument is already a string, not an event)."
  see: [view-component]
- id: density-independent-pixel
  term: density-independent pixel
  name: { uk: "незалежна від щільності одиниця", en: "density-independent pixel" }
  aliases: ["dp", "dip", "point", "pt", "layout size", "одиниця верстки"]
  definition:
    uk: "Одиниця, в якій React Native рахує всі розміри верстки: `width: 48` — це 48 таких одиниць (dp на Android, points на iOS), а не 48 фізичних пікселів. На скільки пікселів вона множиться, вирішує pixel ratio екрана, тож елемент має однаковий фізичний розмір на різних телефонах."
    en: "The unit in which React Native counts every layout size: `width: 48` is 48 such units (dp on Android, points on iOS), not 48 physical pixels. How many pixels it becomes depends on the screen's pixel ratio, so an element has the same physical size on different phones."
  see: [pixel-ratio]
- id: pixel-ratio
  term: pixel ratio
  name: { uk: "pixel ratio", en: "pixel ratio" }
  aliases: ["PixelRatio", "PixelRatio.get()", "device pixel ratio", "щільність екрана", "screen density"]
  definition:
    uk: "Скільки фізичних пікселів припадає на одну незалежну від щільності одиницю на цьому екрані. `PixelRatio.get()` повертає, наприклад, 2 на iPhone 11 і 3 на iPhone 11 Pro; `PixelRatio.getPixelSizeForLayoutSize(48)` перетворює одиниці на пікселі."
    en: "How many physical pixels one density-independent unit covers on this screen. `PixelRatio.get()` returns, for example, 2 on an iPhone 11 and 3 on an iPhone 11 Pro; `PixelRatio.getPixelSizeForLayoutSize(48)` converts units into pixels."
  see: [density-independent-pixel]
- id: font-scale
  term: font scale
  name: { uk: "масштаб шрифту", en: "font scale" }
  aliases: ["fontScale", "PixelRatio.getFontScale()", "allowFontScaling", "maxFontSizeMultiplier", "системний розмір тексту", "text size"]
  definition:
    uk: "Множник розміру тексту, який людина задає в налаштуваннях телефона (розмір шрифту на Android, Text Size чи Larger Text на iOS). `Text` застосовує його сам (`allowFontScaling` за замовчуванням `true`), тож верстка має давати тексту рости: без фіксованих висот рядків і полів."
    en: "The text-size multiplier a person sets in the phone's settings (Font size on Android, Text Size or Larger Text on iOS). `Text` applies it by itself (`allowFontScaling` is `true` by default), so a layout must let text grow: no fixed heights on rows and fields."
