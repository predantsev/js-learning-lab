# Terms introduced in RN-02.
- id: view-component
  term: View
  name: { uk: "View", en: "View" }
  aliases: ["<View>", "нативний контейнер", "native container"]
  definition:
    uk: "Базовий контейнер React Native для верстки, відповідник `<div>`. Він тримає інші компоненти, має стиль (Flexbox, відступи, рамки), але текст прямо в ньому стояти не може — лише всередині `Text`. Документація React Native зіставляє його з `ViewGroup` на Android і `UIView` на iOS."
    en: "React Native's basic layout container, the counterpart of `<div>`. It holds other components and has a style (Flexbox, spacing, borders), but text cannot sit in it directly — only inside `Text`. The React Native documentation maps it to `ViewGroup` on Android and `UIView` on iOS."
  see: [text-component, native-view]
- id: text-component
  term: Text
  name: { uk: "Text", en: "Text" }
  aliases: ["<Text>", "Text strings must be rendered within a <Text> component"]
  definition:
    uk: "Єдиний компонент React Native, що показує текст. Рядок поза `Text` на телефоні дає помилку *Text strings must be rendered within a &lt;Text&gt; component*. Стилі тексту (колір, розмір шрифту) успадковуються лише від батьківського `Text`, а не від `View`."
    en: "The only React Native component that shows text. A string outside `Text` gives the error *Text strings must be rendered within a &lt;Text&gt; component* on a phone. Text styles (color, font size) are inherited only from a parent `Text`, not from a `View`."
  see: [view-component]
- id: image-source
  term: Image source
  name: { uk: "source у Image", en: "Image source" }
  aliases: ["source", "Image", "<Image>", "require image"]
  definition:
    uk: "Звідки `Image` бере картинку: об’єкт `{ uri: 'https://…' }` для мережі або `require('./icon.png')` для файла з пакета застосунку. Картинка з пакета отримує розмір автоматично; мережевій картинці `width` і `height` задають у стилі, інакше її розмір 0."
    en: "Where an `Image` gets its picture: an object `{ uri: 'https://…' }` for the network, or `require('./icon.png')` for a file bundled with the app. A bundled picture is sized automatically; a network picture gets `width` and `height` in its style, otherwise its size is 0."
- id: native-text-input
  term: TextInput
  name: { uk: "TextInput", en: "TextInput" }
  aliases: ["<TextInput>", "onChangeText", "текстове поле", "text field"]
  definition:
    uk: "Поле введення React Native, відповідник `<input>`. Керованим його роблять дві пропси: `value` зі стану й `onChangeText`, яку React Native викликає з новим текстом після кожної зміни (аргумент — уже рядок, а не подія)."
    en: "React Native's input field, the counterpart of `<input>`. Two props make it controlled: `value` from state and `onChangeText`, which React Native calls with the new text after every change (the argument is already a string, not an event)."
  see: [view-component]
- id: density-independent-pixel
  term: density-independent pixel
  name: { uk: "незалежна від щільності одиниця", en: "density-independent pixel" }
  aliases: ["dp", "dip", "point", "pt", "layout size", "одиниця верстки"]
  definition:
    uk: "Одиниця, в якій React Native рахує всі розміри верстки: `width: 48` — це 48 таких одиниць (dp на Android, points на iOS), а не 48 фізичних пікселів. На скільки пікселів вона множиться, вирішує pixel ratio екрана, тож елемент має однаковий фізичний розмір на різних телефонах."
    en: "The unit in which React Native counts every layout size: `width: 48` is 48 such units (dp on Android, points on iOS), not 48 physical pixels. How many pixels it becomes depends on the screen's pixel ratio, so an element has the same physical size on different phones."
  see: [pixel-ratio]
- id: pixel-ratio
  term: pixel ratio
  name: { uk: "pixel ratio", en: "pixel ratio" }
  aliases: ["PixelRatio", "PixelRatio.get()", "device pixel ratio", "щільність екрана", "screen density"]
  definition:
    uk: "Скільки фізичних пікселів припадає на одну незалежну від щільності одиницю на цьому екрані. `PixelRatio.get()` повертає, наприклад, 2 на iPhone 11 і 3 на iPhone 11 Pro; `PixelRatio.getPixelSizeForLayoutSize(48)` перетворює одиниці на пікселі."
    en: "How many physical pixels one density-independent unit covers on this screen. `PixelRatio.get()` returns, for example, 2 on an iPhone 11 and 3 on an iPhone 11 Pro; `PixelRatio.getPixelSizeForLayoutSize(48)` converts units into pixels."
  see: [density-independent-pixel]
- id: font-scale
  term: font scale
  name: { uk: "масштаб шрифту", en: "font scale" }
  aliases: ["fontScale", "PixelRatio.getFontScale()", "allowFontScaling", "maxFontSizeMultiplier", "системний розмір тексту", "text size"]
  definition:
    uk: "Множник розміру тексту, який людина задає в налаштуваннях телефона (розмір шрифту на Android, Text Size чи Larger Text на iOS). `Text` застосовує його сам (`allowFontScaling` за замовчуванням `true`), тож верстка має давати тексту рости: без фіксованих висот рядків і полів."
    en: "The text-size multiplier a person sets in the phone's settings (Font size on Android, Text Size or Larger Text on iOS). `Text` applies it by itself (`allowFontScaling` is `true` by default), so a layout must let text grow: no fixed heights on rows and fields."
- id: safe-area
  term: safe area
  name: { uk: "безпечна зона", en: "safe area" }
  aliases: ["safe zone", "SafeAreaView", "SafeAreaProvider", "react-native-safe-area-context"]
  definition:
    uk: "Частина екрана, яку не закривають рядок стану, виріз екрана, заокруглені кути й індикатор «додому». Текст і елементи керування мають бути в ній, а фони можуть заходити за її межі. У проєкті Expo її межі дає бібліотека `react-native-safe-area-context`."
    en: "The part of the screen not covered by the status bar, the display cutout, rounded corners or the home indicator. Text and controls must be inside it, while backgrounds may extend beyond it. In an Expo project the library `react-native-safe-area-context` gives its edges."
  see: [safe-area-insets, display-cutout]
- id: safe-area-insets
  term: safe-area insets
  name: { uk: "відступи безпечної зони", en: "safe-area insets" }
  aliases: ["insets", "useSafeAreaInsets", "useSafeAreaInsets()", "відступи"]
  definition:
    uk: "Чотири числа `{ top, right, bottom, left }` в одиницях верстки: скільки займають апаратні частини з кожного боку екрана. Залежать від моделі телефона й орієнтації. Хук `useSafeAreaInsets()` з `react-native-safe-area-context` повертає їх для поточного екрана; їх додають до внутрішніх відступів тих частин, вміст яких інакше опинився б під апаратними частинами."
    en: "Four numbers `{ top, right, bottom, left }` in layout units: how much the hardware takes on each side of the screen. They depend on the phone model and the orientation. The `useSafeAreaInsets()` hook from `react-native-safe-area-context` returns them for the current screen; they are added to the padding of the parts whose content would otherwise end up under the hardware."
  see: [safe-area]
- id: display-cutout
  term: display cutout
  name: { uk: "виріз екрана", en: "display cutout" }
  aliases: ["notch", "чубчик", "виріз під камеру", "Dynamic Island", "camera cutout"]
  definition:
    uk: "Ділянка екрана, де стоїть камера чи датчики й нічого не показується: «чубчик» або отвір угорі вертикально, а після повороту — збоку. Вона входить у відступи безпечної зони тієї сторони, де опинилася."
    en: "The part of the screen where the camera or sensors sit and nothing is shown: a notch or a hole at the top in portrait, and on a side after rotation. It is part of the safe-area inset of whichever side it ends up on."
  see: [safe-area-insets]
- id: touch-target
  term: touch target
  name: { uk: "зона дотику", en: "touch target" }
  aliases: ["tap target", "hit area", "область натискання", "мінімальна зона дотику"]
  definition:
    uk: "Область, яка реагує на дотик пальця, — не обов’язково рівна видимій іконці. Платформи радять мінімум 44 × 44 points (Apple Human Interface Guidelines) і 48 × 48 dp (Material Design для Android). Маленьку іконку роблять досяжною через padding у `Pressable` або через `hitSlop`."
    en: "The area that responds to a finger's touch — not necessarily equal to the visible icon. The platforms recommend at least 44 × 44 points (Apple Human Interface Guidelines) and 48 × 48 dp (Material Design for Android). A small icon is made reachable with padding on the `Pressable` or with `hitSlop`."
  see: [hit-slop]
- id: hit-slop
  term: hitSlop
  name: { uk: "hitSlop", en: "hitSlop" }
  aliases: ["hit slop", "HitRect"]
  definition:
    uk: "Пропс `Pressable`: невидима смуга довкола елемента, у якій дотик теж зараховується як натискання (`hitSlop={12}` або `{ top, right, bottom, left }`). Верстку не змінює. Не виходить за межі батьківського `View`, а сусід з вищим `zIndex` перехоплює дотик."
    en: "A `Pressable` prop: an invisible band around the element in which a touch still counts as a press (`hitSlop={12}` or `{ top, right, bottom, left }`). It does not change the layout. It never extends past the parent `View`, and a sibling with a higher `zIndex` takes the touch."
  see: [touch-target]
- id: soft-keyboard
  term: soft keyboard
  name: { uk: "екранна клавіатура", en: "soft keyboard" }
  aliases: ["on-screen keyboard", "virtual keyboard", "Keyboard", "віртуальна клавіатура"]
  definition:
    uk: "Клавіатура, яку система малює на екрані, коли поле отримує фокус. Вона закриває нижню частину екрана — часто майже половину, — а її висота й поведінка залежать від платформи, моделі й мови введення."
    en: "The keyboard the system draws on screen when a field gets focus. It covers the bottom of the screen — often almost half of it — and its height and behavior depend on the platform, the model and the input language."
  see: [keyboard-avoidance]
- id: keyboard-avoidance
  term: keyboard avoidance
  name: { uk: "уникання клавіатури", en: "keyboard avoidance" }
  aliases: ["KeyboardAvoidingView", "avoid keyboard", "keyboard-aware"]
  definition:
    uk: "Верстка, що не дає екранній клавіатурі закрити поле у фокусі чи кнопку відправлення. У React Native це `KeyboardAvoidingView` (змінює висоту, положення або нижній відступ на висоту клавіатури, залежно від `behavior`) разом зі `ScrollView`, у якому решту форми можна докрутити."
    en: "Layout that keeps the soft keyboard from covering the focused field or the submit button. In React Native it is `KeyboardAvoidingView` (it changes its height, position or bottom padding by the keyboard's height, depending on `behavior`) together with a `ScrollView` in which the rest of the form can be scrolled into view."
  see: [soft-keyboard]
- id: accessibility-label
  term: accessibilityLabel
  name: { uk: "мітка доступності", en: "accessibility label" }
  aliases: ["accessibilityLabel", "aria-label", "accessibility label"]
  definition:
    uk: "Пропс React Native з текстом, який скрінрідер читає замість вмісту елемента: «Видалити бажання» замість «✕», назва поля для `TextInput`. Аналог `aria-label`; React Native приймає й сам `aria-label`. Видимий `Text` поруч поле не називає — мітку задають на самому полі."
    en: "A React Native prop with the text a screen reader reads instead of the element's content: “Delete wish” instead of “✕”, a field's name for a `TextInput`. The counterpart of `aria-label`; React Native also accepts `aria-label` itself. A visible `Text` next to a field does not name it — the label is set on the field itself."
  see: [accessibility-role, accessible-name]
- id: accessibility-role
  term: accessibilityRole
  name: { uk: "роль доступності", en: "accessibility role" }
  aliases: ["accessibilityRole", "role"]
  definition:
    uk: "Пропс React Native, що каже технологіям доступності, що це за елемент: `\"button\"`, `\"header\"`, `\"image\"`, `\"link\"` тощо. Скрінрідер оголошує роль разом з назвою («Видалити бажання, кнопка»). Новіший пропс `role` має вищий пріоритет."
    en: "A React Native prop that tells assistive technology what kind of element this is: `\"button\"`, `\"header\"`, `\"image\"`, `\"link\"` and so on. A screen reader announces the role together with the name (“Delete wish, button”). The newer `role` prop takes precedence."
  see: [accessibility-label]
- id: voiceover
  term: VoiceOver
  name: { uk: "VoiceOver", en: "VoiceOver" }
  aliases: ["Voice Over"]
  definition:
    uk: "Вбудований скрінрідер iOS (і macOS). Вмикається в Параметрах → Доступність → VoiceOver; дотик читає елемент під пальцем, гортання вправо чи вліво переходить до наступного чи попереднього, подвійний дотик натискає."
    en: "The built-in screen reader of iOS (and macOS). It is turned on in Settings → Accessibility → VoiceOver; a touch reads the element under the finger, a swipe right or left moves to the next or previous one, a double tap activates."
  see: [talkback, screen-reader]
- id: talkback
  term: TalkBack
  name: { uk: "TalkBack", en: "TalkBack" }
  aliases: ["Talk Back", "Android screen reader"]
  definition:
    uk: "Скрінрідер Android. Вмикається в налаштуваннях доступності (назва розділу залежить від виробника); як і VoiceOver, читає елемент під пальцем, переходить між елементами гортанням і натискає подвійним дотиком."
    en: "The Android screen reader. It is turned on in the accessibility settings (the section name depends on the manufacturer); like VoiceOver it reads the element under the finger, moves between elements with swipes and activates with a double tap."
  see: [voiceover, screen-reader]
- id: platform-select
  term: Platform.select
  name: { uk: "Platform.select", en: "Platform.select" }
  aliases: ["Platform", "Platform.OS", "Platform.select()"]
  definition:
    uk: "Функція React Native, що вибирає значення з об’єкта за поточною платформою: на iOS чи Android — ключ `ios` чи `android`, якщо його немає — `native`, далі `default`. `Platform.OS` дорівнює `'ios'` чи `'android'` (у вебі — `'web'`). Ним розгалужують лише справжню відмінність, а спільне лишають спільним."
    en: "A React Native function that picks a value from an object by the current platform: on iOS or Android the `ios` or `android` key, if missing then `native`, then `default`. `Platform.OS` equals `'ios'` or `'android'` (on the web, `'web'`). It is used to branch only a genuine difference, keeping what is shared shared."
  see: [platform-specific-file]
- id: platform-specific-file
  term: platform-specific file
  name: { uk: "файл для платформи", en: "platform-specific file" }
  aliases: [".ios.tsx", ".android.tsx", ".ios.js", ".android.js", ".native.js", "platform extension"]
  definition:
    uk: "Варіант модуля для однієї платформи з суфіксом у назві: `Card.ios.tsx` і `Card.android.tsx`. Імпортують без суфікса (`import Card from './Card'`), і бандлер React Native бере файл тієї платформи, для якої збирає застосунок. Обидва файли мають однакове API. Підходить, коли компонент на платформах побудований по-різному, а не відрізняється одним стилем."
    en: "A variant of a module for one platform, with a suffix in its name: `Card.ios.tsx` and `Card.android.tsx`. You import without the suffix (`import Card from './Card'`), and React Native's bundler takes the file of the platform it is building for. Both files have the same API. It fits when a component is built differently per platform, not when it differs by one style."
  see: [platform-select]
