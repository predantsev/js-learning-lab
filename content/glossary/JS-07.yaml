# Terms introduced in JS-07. One file per unit keeps parallel authoring conflict-free.
- id: stack-trace
  term: stack trace
  name: { uk: "stack trace", en: "stack trace" }
  definition:
    uk: "Текст, що описує стек викликів у певну мить. Перший рядок — тип і пояснення помилки, далі кадри: від функції, де помилку кинуто, до коду файла, з якого все почалося. Кожен кадр — назва функції, файл, номер рядка коду й номер символу в ньому."
    en: "Text that describes the call stack at one moment. The first line is the error’s type and explanation, then come the frames: from the function where the error was thrown down to the file’s own code where it all started. Each frame is a function name, a file, a line number and a column number."
  example:
    code: "TypeError: Cannot read properties of undefined (reading 'length')\n    at lastDone (main.js:7:35)\n    at formatHabit (main.js:15:31)\n    at render (main.js:22:24)\n    at main.js:38:1"
    lang: text
  see: [call-stack, error-object]
- id: error-object
  term: Error object
  name: { uk: "об’єкт помилки", en: "error object" }
  aliases: ["Error", "new Error"]
  definition:
    uk: "Об’єкт, що описує помилку: `name` — її тип (`TypeError`, `RangeError`…), `message` — пояснення, `stack` — stack trace тієї миті, коли об’єкт створено. JavaScript створює його сам, коли дію виконати неможливо; у коді його створює `new Error(\"пояснення\")`."
    en: "An object that describes an error: `name` is its type (`TypeError`, `RangeError`…), `message` is the explanation, `stack` is the stack trace of the moment the object was created. JavaScript creates one by itself when an action is impossible; in code, `new Error(\"explanation\")` creates one."
  example:
    code: "const problem = new Error(\"price is missing\");\nproblem.name;    // \"Error\"\nproblem.message; // \"price is missing\""
  see: [stack-trace, uncaught-exception]
- id: uncaught-exception
  term: uncaught exception
  name: { uk: "необроблена помилка", en: "uncaught exception" }
  aliases: ["uncaught error", "unhandled error"]
  definition:
    uk: "Помилка, яку не обробив жоден код. Вона зупиняє функцію, де виникла, усі функції, що на неї чекали в стеку викликів, і решту поточного запуску скрипту. Сторінка при цьому працює далі: обробники подій, зареєстровані до помилки, спрацьовують і потім."
    en: "An error that no code handled. It stops the function where it happened, every function waiting for it on the call stack, and the rest of the current run of the script. The page keeps working: event listeners registered before the error still run afterwards."
  see: [error-object, call-stack]
- id: throw-statement
  term: throw statement
  name: { uk: "інструкція throw", en: "throw statement" }
  aliases: ["throw"]
  definition:
    uk: "`throw значення` зупиняє функцію там, де стоїть, і передає значення вгору стеком викликів — до коду, що обробляє помилки, а якщо такого немає, це необроблена помилка. Кинути можна будь-що, але варто кидати лише об’єкти помилок: у тексту чи числа немає ні типу, ні stack trace."
    en: "`throw value` stops the function right where it stands and passes the value up the call stack — to code that handles errors, and if there is none, it becomes an uncaught exception. Anything can be thrown, but only error objects should be: text or a number has neither a type nor a stack trace."
  example:
    code: "if (amountMinor <= 0) {\n  throw new RangeError(\"amountMinor must be above 0, got \" + amountMinor);\n}"
  see: [error-object, uncaught-exception]
- id: type-error
  term: TypeError
  name: { uk: "TypeError", en: "TypeError" }
  definition:
    uk: "Тип помилки для значення не того типу: прочитати властивість у `undefined` чи `null`, викликати те, що не є функцією, отримати текст `\"80\"` там, де потрібне число."
    en: "The error type for a value of the wrong type: reading a property of `undefined` or `null`, calling something that is not a function, getting the text `\"80\"` where a number is needed."
  example:
    code: "throw new TypeError(\"title must be text, got \" + typeof title);"
  see: [range-error, error-object]
- id: range-error
  term: RangeError
  name: { uk: "RangeError", en: "RangeError" }
  definition:
    uk: "Тип помилки для значення правильного типу, але поза дозволеними межами: від’ємна ціна, кількість, більша за дозволену. JavaScript сам кидає її, наприклад, коли переповнюється стек викликів."
    en: "The error type for a value of the right type but outside the allowed range: a negative price, a count above the limit. JavaScript throws it by itself, for example, when the call stack overflows."
  example:
    code: "throw new RangeError(\"priority must be low, normal or high, got \" + priority);"
  see: [type-error, stack-overflow]
- id: error-cause
  term: error cause
  name: { uk: "причина помилки (cause)", en: "error cause" }
  aliases: ["cause"]
  definition:
    uk: "Властивість `cause` об’єкта помилки: що саме спричинило проблему. Її задають другим аргументом: `new Error(\"повідомлення\", { cause: подробиці })`. Причиною може бути інша помилка або об’єкт із подробицями; `message` каже, що не вдалося, а `cause` — чому."
    en: "The `cause` property of an error object: what exactly led to the problem. It is set with the second argument: `new Error(\"message\", { cause: details })`. The cause can be another error or an object with details; `message` says what failed, and `cause` says why."
  example:
    code: "const error = new Error(\"task cannot be saved\", { cause: { title: \"required\" } });\nerror.cause; // { title: \"required\" }"
  see: [error-object, throw-statement]
- id: try-catch
  term: try...catch
  name: { uk: "try/catch", en: "try/catch" }
  aliases: ["try", "catch"]
  definition:
    uk: "Конструкція `try { … } catch (error) { … }`. Якщо код у `try` — чи будь-яка функція, яку він викликав, — кидає помилку, виконання переходить у `catch`, а `error` отримує кинуте значення. Перехоплюються лише помилки, кинуті, поки блок `try` виконується."
    en: "The construction `try { … } catch (error) { … }`. If the code in `try` — or any function it called — throws, execution jumps to `catch`, and `error` receives the thrown value. Only errors thrown while the `try` block runs are caught."
  example:
    code: "try {\n  addHabit(habit);\n} catch (error) {\n  console.log(\"not added: \" + error.message);\n}"
  see: [error-propagation, finally-block, rethrow]
- id: finally-block
  term: finally
  name: { uk: "блок finally", en: "finally block" }
  aliases: ["finally"]
  definition:
    uk: "Блок після `try` (і `catch`), що виконується завжди: коли `try` завершився без помилок, коли помилку перехоплено, коли вона йде далі і навіть після `return`. Місце для прибирання: сховати індикатор, знову ввімкнути кнопку."
    en: "A block after `try` (and `catch`) that always runs: when `try` finished without errors, when the error was caught, when it goes further, and even after `return`. The place for cleanup: hiding an indicator, enabling a button again."
  example:
    code: "try {\n  exportReport(expenses);\n} finally {\n  spinner.hidden = true;\n}"
  see: [try-catch]
- id: error-propagation
  term: error propagation
  name: { uk: "поширення помилки", en: "error propagation" }
  definition:
    uk: "Рух кинутої помилки стеком викликів угору: кожна функція, що чекала на відповідь, зупиняється, а рядки коду між місцем помилки й найближчим `catch` пропускаються. Якщо `catch` немає ніде, це необроблена помилка."
    en: "The way a thrown error travels up the call stack: every function waiting for an answer stops, and the lines of code between the error and the nearest `catch` are skipped. If there is no `catch` anywhere, it is an uncaught exception."
  see: [try-catch, call-stack, uncaught-exception]
- id: rethrow
  term: rethrow
  name: { uk: "кинути далі (rethrow)", en: "rethrow" }
  definition:
    uk: "`throw` усередині `catch`: функція перехопила помилку, але обробити її не може, тож передає далі — ту саму (`throw error`) або нову з оригіналом у `cause`. Так `catch` обробляє лише те, що розуміє, а решта не зникає."
    en: "A `throw` inside `catch`: the function caught an error but cannot handle it, so it passes it on — the same one (`throw error`) or a new one with the original in `cause`. That way `catch` handles only what it understands, and the rest does not vanish."
  example:
    code: "try {\n  renderAll(records);\n} catch (error) {\n  console.log(\"render failed: \" + error.message);\n  throw error; // not handled here: pass it on\n}"
  see: [try-catch, error-cause]
- id: json
  term: JSON
  name: { uk: "JSON", en: "JSON" }
  aliases: ["JavaScript Object Notation"]
  definition:
    uk: "Текстовий формат для даних (JavaScript Object Notation). Схожий на запис об’єкта в JavaScript, але суворіший: ключі й тексти — лише в подвійних лапках, значення — лише тексти, числа, `true`/`false`, `null`, масиви й об’єкти. Немає `undefined`, функцій, `NaN`, дат, коментарів і зайвих ком."
    en: "A text format for data (JavaScript Object Notation). It looks like an object written in JavaScript but is stricter: keys and texts only in double quotes, and values can only be texts, numbers, `true`/`false`, `null`, arrays and objects. There is no `undefined`, no functions, no `NaN`, no dates, no comments and no trailing commas."
  example:
    code: "{\"id\":\"t-01\",\"title\":\"Water the plants\",\"dueDate\":\"2026-03-02\",\"done\":false}"
  see: [serialization, deserialization]
- id: serialization
  term: serialization
  name: { uk: "серіалізація", en: "serialization" }
  definition:
    uk: "Перетворення значення на текст, який можна зберегти чи передати: `JSON.stringify(value)`. Що формат JSON записати не вміє, у тексті змінюється або губиться, тож розібране назад значення може відрізнятися від початкового."
    en: "Turning a value into text that can be saved or sent: `JSON.stringify(value)`. Whatever the JSON format cannot write is changed or lost in the text, so the value parsed back may differ from the original."
  example:
    code: "JSON.stringify({ id: \"t-01\", done: false });\n// '{\"id\":\"t-01\",\"done\":false}'"
  see: [json, deserialization]
- id: deserialization
  term: deserialization
  name: { uk: "десеріалізація", en: "deserialization" }
  definition:
    uk: "Зворотне перетворення: із тексту створюється нове значення, `JSON.parse(text)`. Результат — нові об’єкти, а для зіпсованого тексту `JSON.parse` кидає `SyntaxError`."
    en: "The reverse: a new value is created from text, `JSON.parse(text)`. The result is new objects, and for damaged text `JSON.parse` throws a `SyntaxError`."
  example:
    code: "JSON.parse('{\"done\":false}'); // { done: false }\nJSON.parse('{\"done\":'); // SyntaxError"
  see: [json, serialization]
- id: cyclic-reference
  term: cyclic reference
  name: { uk: "циклічне посилання", en: "cyclic reference" }
  aliases: ["circular reference"]
  definition:
    uk: "Об’єкт, який через свої властивості посилається сам на себе — напряму (`task.self = task`) чи через інші об’єкти. `JSON.stringify` такого не запише: текст вийшов би нескінченним, тож кидає `TypeError: Converting circular structure to JSON`."
    en: "An object that refers to itself through its properties — directly (`task.self = task`) or through other objects. `JSON.stringify` cannot write it: the text would be endless, so it throws `TypeError: Converting circular structure to JSON`."
  see: [serialization]
- id: persistence
  term: persistence
  name: { uk: "збереження даних (persistence)", en: "persistence" }
  definition:
    uk: "Здатність даних пережити кінець запуску програми: закриту вкладку, оновлену сторінку, перезапуск. Змінні цього не вміють; у браузері для цього є, наприклад, `localStorage`, що тримає текст під ключами для адреси сторінки."
    en: "The ability of data to outlive the end of a program’s run: a closed tab, a reloaded page, a restart. Variables cannot do that; in the browser there is, for example, `localStorage`, which keeps text under keys for the page’s address."
  see: [storage-key, schema-version]
- id: storage-key
  term: storage key
  name: { uk: "ключ сховища", en: "storage key" }
  definition:
    uk: "Назва, під якою значення лежить у сховищі, наприклад `jsll.habits.v1`. Добрий ключ містить назву застосунку й версію, щоб не перетнутися з іншими даними й відрізнити старий формат від нового."
    en: "The name a value is stored under, for example `jsll.habits.v1`. A good key holds the app’s name and a version, so it does not collide with other data and tells an old format from a new one."
  example:
    code: "localStorage.getItem(\"jsll.habits.v1\"); // the saved text, or null"
  see: [persistence, schema-version]
- id: schema-version
  term: schema version
  name: { uk: "версія схеми", en: "schema version" }
  definition:
    uk: "Число в самих збережених даних, що каже, якої вони форми: `{ schemaVersion: 1, records: [...] }`. Під час завантаження застосунок порівнює його з очікуваним і не довіряє даним іншої версії сліпо."
    en: "A number inside the saved data itself that says what shape it has: `{ schemaVersion: 1, records: [...] }`. On load the app compares it with the expected one and does not blindly trust data of another version."
  see: [storage-key, persistence]
- id: es-module
  term: ES module
  name: { uk: "ES-модуль", en: "ES module" }
  aliases: ["module", "ESM"]
  definition:
    uk: "Файл JavaScript із власною областю видимості: його назви не видно іншим файлам, доки він їх не експортує (`export`), а ті не імпортують (`import`). Модуль виконується один раз за завантаження сторінки, хоч скільки файлів його імпортує. Сторінка підключає головний модуль через `<script type=\"module\">`."
    en: "A JavaScript file with its own scope: its names are not visible to other files until it exports them (`export`) and those files import them (`import`). A module runs once per page load, however many files import it. A page loads its main module with `<script type=\"module\">`."
  see: [named-export, module-specifier, module-graph]
- id: named-export
  term: named export
  name: { uk: "іменований експорт", en: "named export" }
  definition:
    uk: "Експорт за назвою: `export` перед функцією, `const` чи `let`. Імпортують його у фігурних дужках за тією самою назвою. У модуля може бути скільки завгодно іменованих експортів."
    en: "An export by name: `export` in front of a function, a `const` or a `let`. It is imported in curly braces under the same name. A module can have as many named exports as it needs."
  example:
    code: "// domain/habits.js\nexport function countActive(habits) { /* … */ }\n\n// ui/summary.js\nimport { countActive } from \"../domain/habits.js\";"
  see: [es-module, default-export]
- id: default-export
  term: default export
  name: { uk: "default-експорт", en: "default export" }
  definition:
    uk: "Один головний експорт модуля: `export default …`. Його імпортують без фігурних дужок і під будь-якою назвою, тож у різних файлах та сама річ може називатися по-різному. Курс віддає перевагу іменованим експортам, а default-експорти вчить читати."
    en: "A module’s single main export: `export default …`. It is imported without curly braces and under any name, so the same thing can be called differently in different files. The course prefers named exports and teaches you to read default ones."
  example:
    code: "export default function buildReport(expenses) { /* … */ }\nimport buildReport from \"./report.js\";"
  see: [named-export, es-module]
- id: module-specifier
  term: module specifier
  name: { uk: "специфікатор модуля", en: "module specifier" }
  definition:
    uk: "Текст у лапках після `from` (чи в `import()`), що каже, звідки брати модуль. У браузері відносний шлях починається з `./` чи `../` — від файла, де написано імпорт, — і закінчується розширенням, наприклад `\"../domain/habits.js\"`. Текст без `./` чи `../` браузер вважає назвою пакета."
    en: "The text in quotes after `from` (or in `import()`) that says where to take a module from. In the browser a relative path starts with `./` or `../` — counted from the file where the import is written — and ends with the extension, for example `\"../domain/habits.js\"`. Text without `./` or `../` is treated by the browser as a package name."
  see: [es-module, module-resolution]
- id: module-graph
  term: module graph
  name: { uk: "граф модулів", en: "module graph" }
  definition:
    uk: "Схема модулів застосунку: вузли — файли, стрілки — імпорти. Браузер обходить її від головного модуля вглиб і виконує кожен модуль один раз, щойно готові всі його залежності: ті, кого імпортують, — раніше за тих, хто імпортує."
    en: "The map of an app’s modules: the nodes are files, the arrows are imports. The browser walks it from the main module deeper and runs every module once, as soon as all its dependencies are ready: imported modules before the modules that import them."
  see: [es-module, circular-dependency]
- id: live-binding
  term: live binding
  name: { uk: "жива прив’язка", en: "live binding" }
  definition:
    uk: "Імпортована назва в ES-модулі: не копія значення, а «віконце» на змінну в модулі, що її експортує. Коли той модуль присвоює змінній нове значення, усі імпортери бачать нове. Присвоїти імпортованій назві може лише модуль-власник; для імпортера це `TypeError`."
    en: "An imported name in an ES module: not a copy of the value but a “window” onto the variable in the exporting module. When that module assigns a new value to the variable, all importers see the new value. Only the owning module can assign to it; for an importer it is a `TypeError`."
  example:
    code: "// session.js\nexport let visits = 0;\nexport function addVisit() { visits = visits + 1; }\n\n// main.js\nimport { visits, addVisit } from \"./session.js\";\naddVisit();\nvisits; // 1"
  see: [es-module, binding]
- id: dynamic-import
  term: dynamic import
  name: { uk: "динамічний import()", en: "dynamic import()" }
  aliases: ["import()"]
  definition:
    uk: "Вираз `import(\"./шлях.js\")`, що завантажує модуль у мить, коли виконується, а не на старті. Він одразу повертає promise; модуль приходить пізніше — у функцію, передану в `.then`, а невдале завантаження обробляє `.catch`. Наступний рядок коду виконується ще до того, як модуль прийде."
    en: "The expression `import(\"./path.js\")`, which loads a module at the moment it runs instead of at the start. It immediately returns a promise; the module arrives later — in the function passed to `.then`, and `.catch` handles a failed load. The next line of code runs before the module arrives."
  see: [es-module, module-graph]
- id: commonjs
  term: CommonJS
  name: { uk: "CommonJS", en: "CommonJS" }
  aliases: ["require", "module.exports", "CJS"]
  definition:
    uk: "Старша система модулів Node.js: `require(\"./file.js\")` повертає об’єкт експортів іншого файла, а `module.exports = …` задає, що файл експортує. `require` — звичайний виклик функції, що виконується, коли до нього дійде черга, і не дає живих прив’язок. У браузері `require` і `module` не існують."
    en: "The older module system of Node.js: `require(\"./file.js\")` returns another file’s exports object, and `module.exports = …` sets what a file exports. `require` is an ordinary function call that runs when its turn comes and gives no live bindings. In the browser `require` and `module` do not exist."
  example:
    code: "const { formatMoney } = require(\"./money.js\");\nmodule.exports = { formatMoney };"
  see: [es-module, named-export]
- id: module-resolution
  term: module resolution
  name: { uk: "резолюція модулів", en: "module resolution" }
  definition:
    uk: "Пошук файла за специфікатором модуля. У браузері шлях із `./` чи `../` рахується від файла, де написано імпорт, і має містити розширення; текст без них вважається назвою пакета. Якщо хоч один файл чи імпортована назва не знайшлися, не виконується жоден модуль графа."
    en: "Finding the file for a module specifier. In the browser a path with `./` or `../` is counted from the file where the import is written and must include the extension; text without them is treated as a package name. If even one file or imported name is not found, no module of the graph runs."
  see: [module-specifier, module-graph]
- id: circular-dependency
  term: circular dependency
  name: { uk: "циклічна залежність", en: "circular dependency" }
  aliases: ["circular import"]
  definition:
    uk: "Модулі, що імпортують одне одного — напряму чи через інші. Браузер таке дозволяє, але один із них виконується першим, поки інший ще не завершився: якщо перший на верхньому рівні читає `const` другого, отримає `ReferenceError` (TDZ). Спільне значення краще винести в третій модуль."
    en: "Modules that import each other — directly or through others. The browser allows it, but one of them runs first while the other has not finished: if the first reads a `const` of the second at its top level, it gets a `ReferenceError` (TDZ). A shared value is better moved into a third module."
  see: [module-graph, temporal-dead-zone]
- id: swallowed-error
  term: swallowed error
  name: { uk: "проковтнута помилка", en: "swallowed error" }
  definition:
    uk: "Помилка, яку `catch` перехопив і нікуди не передав — порожній блок чи лише `console.log`. Програма працює далі з неправильним результатом, і ніхто не знає чому. Так само помилку «ковтає» `return` у `finally`. Обробляй лише те, що розумієш, а решту кидай далі — краще з контекстом і `cause`."
    en: "An error that a `catch` caught and passed nowhere — an empty block or just a `console.log`. The program goes on with a wrong result, and nobody knows why. A `return` in `finally` “swallows” an error the same way. Handle only what you understand, and throw the rest further — preferably with context and `cause`."
  see: [try-catch, rethrow, error-cause]
