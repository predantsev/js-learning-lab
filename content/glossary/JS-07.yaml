# Terms introduced in JS-07. One file per unit keeps parallel authoring conflict-free.
- id: stack-trace
  term: stack trace
  name: { uk: "stack trace", en: "stack trace" }
  definition:
    uk: "Текст, що описує стек викликів у певну мить. Перший рядок — тип і пояснення помилки, далі кадри: від функції, де помилку кинуто, до коду файла, з якого все почалося. Кожен кадр — назва функції, файл, номер рядка коду й номер символу в ньому."
    en: "Text that describes the call stack at one moment. The first line is the error’s type and explanation, then come the frames: from the function where the error was thrown down to the file’s own code where it all started. Each frame is a function name, a file, a line number and a column number."
  example:
    code: "TypeError: Cannot read properties of undefined (reading 'length')\n    at lastDone (main.js:7:35)\n    at formatHabit (main.js:15:31)\n    at render (main.js:22:24)\n    at main.js:38:1"
    lang: text
  see: [call-stack, error-object]
- id: error-object
  term: Error object
  name: { uk: "об’єкт помилки", en: "error object" }
  aliases: ["Error", "new Error"]
  definition:
    uk: "Об’єкт, що описує помилку: `name` — її тип (`TypeError`, `RangeError`…), `message` — пояснення, `stack` — stack trace тієї миті, коли об’єкт створено. JavaScript створює його сам, коли дію виконати неможливо; у коді його створює `new Error(\"пояснення\")`."
    en: "An object that describes an error: `name` is its type (`TypeError`, `RangeError`…), `message` is the explanation, `stack` is the stack trace of the moment the object was created. JavaScript creates one by itself when an action is impossible; in code, `new Error(\"explanation\")` creates one."
  example:
    code: "const problem = new Error(\"price is missing\");\nproblem.name;    // \"Error\"\nproblem.message; // \"price is missing\""
  see: [stack-trace, uncaught-exception]
- id: uncaught-exception
  term: uncaught exception
  name: { uk: "необроблена помилка", en: "uncaught exception" }
  aliases: ["uncaught error", "unhandled error"]
  definition:
    uk: "Помилка, яку не обробив жоден код. Вона зупиняє функцію, де виникла, усі функції, що на неї чекали в стеку викликів, і решту поточного запуску скрипту. Сторінка при цьому працює далі: обробники подій, зареєстровані до помилки, спрацьовують і потім."
    en: "An error that no code handled. It stops the function where it happened, every function waiting for it on the call stack, and the rest of the current run of the script. The page keeps working: event listeners registered before the error still run afterwards."
  see: [error-object, call-stack]
- id: throw-statement
  term: throw statement
  name: { uk: "інструкція throw", en: "throw statement" }
  aliases: ["throw"]
  definition:
    uk: "`throw значення` зупиняє функцію там, де стоїть, і передає значення вгору стеком викликів — до коду, що обробляє помилки, а якщо такого немає, це необроблена помилка. Кинути можна будь-що, але варто кидати лише об’єкти помилок: у тексту чи числа немає ні типу, ні stack trace."
    en: "`throw value` stops the function right where it stands and passes the value up the call stack — to code that handles errors, and if there is none, it becomes an uncaught exception. Anything can be thrown, but only error objects should be: text or a number has neither a type nor a stack trace."
  example:
    code: "if (price < 0) {\n  throw new RangeError(\"price must be at least 0, got \" + price);\n}"
  see: [error-object, uncaught-exception]
- id: type-error
  term: TypeError
  name: { uk: "TypeError", en: "TypeError" }
  definition:
    uk: "Тип помилки для значення не того типу: прочитати властивість у `undefined` чи `null`, викликати те, що не є функцією, отримати текст `\"80\"` там, де потрібне число."
    en: "The error type for a value of the wrong type: reading a property of `undefined` or `null`, calling something that is not a function, getting the text `\"80\"` where a number is needed."
  example:
    code: "throw new TypeError(\"price must be a number, got \" + value);"
  see: [range-error, error-object]
- id: range-error
  term: RangeError
  name: { uk: "RangeError", en: "RangeError" }
  definition:
    uk: "Тип помилки для значення правильного типу, але поза дозволеними межами: від’ємна ціна, кількість, більша за дозволену. JavaScript сам кидає її, наприклад, коли переповнюється стек викликів."
    en: "The error type for a value of the right type but outside the allowed range: a negative price, a count above the limit. JavaScript throws it by itself, for example, when the call stack overflows."
  example:
    code: "throw new RangeError(\"price must be at least 0, got \" + price);"
  see: [type-error, stack-overflow]
- id: error-cause
  term: error cause
  name: { uk: "причина помилки (cause)", en: "error cause" }
  aliases: ["cause"]
  definition:
    uk: "Властивість `cause` об’єкта помилки: що саме спричинило проблему. Її задають другим аргументом: `new Error(\"повідомлення\", { cause: подробиці })`. Причиною може бути інша помилка або об’єкт із подробицями; `message` каже, що не вдалося, а `cause` — чому."
    en: "The `cause` property of an error object: what exactly led to the problem. It is set with the second argument: `new Error(\"message\", { cause: details })`. The cause can be another error or an object with details; `message` says what failed, and `cause` says why."
  example:
    code: "const error = new Error(\"task cannot be saved\", { cause: { title: \"required\" } });\nerror.cause; // { title: \"required\" }"
  see: [error-object, throw-statement]
