# Terms introduced in JS-07. One file per unit keeps parallel authoring conflict-free.
- id: stack-trace
  term: stack trace
  name: { uk: "stack trace", en: "stack trace" }
  definition:
    uk: "Текст, що описує стек викликів у певну мить. Перший рядок — тип і пояснення помилки, далі кадри: від функції, де помилку кинуто, до коду файла, з якого все почалося. Кожен кадр — назва функції, файл, номер рядка коду й номер символу в ньому."
    en: "Text that describes the call stack at one moment. The first line is the error’s type and explanation, then come the frames: from the function where the error was thrown down to the file’s own code where it all started. Each frame is a function name, a file, a line number and a column number."
  example:
    code: "TypeError: Cannot read properties of undefined (reading 'length')\n    at lastDone (main.js:7:35)\n    at formatHabit (main.js:15:31)\n    at render (main.js:22:24)\n    at main.js:38:1"
    lang: text
  see: [call-stack, error-object]
- id: error-object
  term: Error object
  name: { uk: "об’єкт помилки", en: "error object" }
  aliases: ["Error", "new Error"]
  definition:
    uk: "Об’єкт, що описує помилку: `name` — її тип (`TypeError`, `RangeError`…), `message` — пояснення, `stack` — stack trace тієї миті, коли об’єкт створено. JavaScript створює його сам, коли дію виконати неможливо; у коді його створює `new Error(\"пояснення\")`."
    en: "An object that describes an error: `name` is its type (`TypeError`, `RangeError`…), `message` is the explanation, `stack` is the stack trace of the moment the object was created. JavaScript creates one by itself when an action is impossible; in code, `new Error(\"explanation\")` creates one."
  example:
    code: "const problem = new Error(\"price is missing\");\nproblem.name;    // \"Error\"\nproblem.message; // \"price is missing\""
  see: [stack-trace, uncaught-exception]
- id: uncaught-exception
  term: uncaught exception
  name: { uk: "необроблена помилка", en: "uncaught exception" }
  aliases: ["uncaught error", "unhandled error"]
  definition:
    uk: "Помилка, яку не обробив жоден код. Вона зупиняє функцію, де виникла, усі функції, що на неї чекали в стеку викликів, і решту поточного запуску скрипту. Сторінка при цьому працює далі: обробники подій, зареєстровані до помилки, спрацьовують і потім."
    en: "An error that no code handled. It stops the function where it happened, every function waiting for it on the call stack, and the rest of the current run of the script. The page keeps working: event listeners registered before the error still run afterwards."
  see: [error-object, call-stack]
- id: throw-statement
  term: throw statement
  name: { uk: "інструкція throw", en: "throw statement" }
  aliases: ["throw"]
  definition:
    uk: "`throw значення` зупиняє функцію там, де стоїть, і передає значення вгору стеком викликів — до коду, що обробляє помилки, а якщо такого немає, це необроблена помилка. Кинути можна будь-що, але варто кидати лише об’єкти помилок: у тексту чи числа немає ні типу, ні stack trace."
    en: "`throw value` stops the function right where it stands and passes the value up the call stack — to code that handles errors, and if there is none, it becomes an uncaught exception. Anything can be thrown, but only error objects should be: text or a number has neither a type nor a stack trace."
  example:
    code: "if (price < 0) {\n  throw new RangeError(\"price must be at least 0, got \" + price);\n}"
  see: [error-object, uncaught-exception]
- id: type-error
  term: TypeError
  name: { uk: "TypeError", en: "TypeError" }
  definition:
    uk: "Тип помилки для значення не того типу: прочитати властивість у `undefined` чи `null`, викликати те, що не є функцією, отримати текст `\"80\"` там, де потрібне число."
    en: "The error type for a value of the wrong type: reading a property of `undefined` or `null`, calling something that is not a function, getting the text `\"80\"` where a number is needed."
  example:
    code: "throw new TypeError(\"price must be a number, got \" + value);"
  see: [range-error, error-object]
- id: range-error
  term: RangeError
  name: { uk: "RangeError", en: "RangeError" }
  definition:
    uk: "Тип помилки для значення правильного типу, але поза дозволеними межами: від’ємна ціна, кількість, більша за дозволену. JavaScript сам кидає її, наприклад, коли переповнюється стек викликів."
    en: "The error type for a value of the right type but outside the allowed range: a negative price, a count above the limit. JavaScript throws it by itself, for example, when the call stack overflows."
  example:
    code: "throw new RangeError(\"price must be at least 0, got \" + price);"
  see: [type-error, stack-overflow]
- id: error-cause
  term: error cause
  name: { uk: "причина помилки (cause)", en: "error cause" }
  aliases: ["cause"]
  definition:
    uk: "Властивість `cause` об’єкта помилки: що саме спричинило проблему. Її задають другим аргументом: `new Error(\"повідомлення\", { cause: подробиці })`. Причиною може бути інша помилка або об’єкт із подробицями; `message` каже, що не вдалося, а `cause` — чому."
    en: "The `cause` property of an error object: what exactly led to the problem. It is set with the second argument: `new Error(\"message\", { cause: details })`. The cause can be another error or an object with details; `message` says what failed, and `cause` says why."
  example:
    code: "const error = new Error(\"task cannot be saved\", { cause: { title: \"required\" } });\nerror.cause; // { title: \"required\" }"
  see: [error-object, throw-statement]
- id: try-catch
  term: try...catch
  name: { uk: "try/catch", en: "try/catch" }
  aliases: ["try", "catch"]
  definition:
    uk: "Конструкція `try { … } catch (error) { … }`. Якщо код у `try` — чи будь-яка функція, яку він викликав, — кидає помилку, виконання переходить у `catch`, а `error` отримує кинуте значення. Перехоплюються лише помилки, кинуті, поки блок `try` виконується: обробник події, що спрацює пізніше, вже поза ним."
    en: "The construction `try { … } catch (error) { … }`. If the code in `try` — or any function it called — throws, execution jumps to `catch`, and `error` receives the thrown value. Only errors thrown while the `try` block runs are caught: an event listener that runs later is already outside it."
  example:
    code: "try {\n  saveTask(task);\n} catch (error) {\n  console.log(\"not saved: \" + error.message);\n}"
  see: [error-propagation, finally-block, rethrow]
- id: finally-block
  term: finally
  name: { uk: "блок finally", en: "finally block" }
  aliases: ["finally"]
  definition:
    uk: "Блок після `try` (і `catch`), що виконується завжди: коли `try` завершився без помилок, коли помилку перехоплено, коли вона йде далі і навіть після `return`. Місце для прибирання: сховати індикатор, знову ввімкнути кнопку. `return` у `finally` писати не можна — він замінить і результат, і помилку."
    en: "A block after `try` (and `catch`) that always runs: when `try` finished without errors, when the error was caught, when it goes further, and even after `return`. The place for cleanup: hiding an indicator, enabling a button again. Never write `return` in `finally` — it replaces both the result and the error."
  example:
    code: "try {\n  store(task);\n} finally {\n  state.saving = false;\n}"
  see: [try-catch]
- id: error-propagation
  term: error propagation
  name: { uk: "поширення помилки", en: "error propagation" }
  definition:
    uk: "Рух кинутої помилки стеком викликів угору: кожна функція, що чекала на відповідь, зупиняється, а рядки коду між місцем помилки й найближчим `catch` пропускаються. Якщо `catch` немає ніде, це необроблена помилка."
    en: "The way a thrown error travels up the call stack: every function waiting for an answer stops, and the lines of code between the error and the nearest `catch` are skipped. If there is no `catch` anywhere, it is an uncaught exception."
  see: [try-catch, call-stack, uncaught-exception]
- id: rethrow
  term: rethrow
  name: { uk: "кинути далі (rethrow)", en: "rethrow" }
  definition:
    uk: "`throw` усередині `catch`: функція перехопила помилку, але обробити її не може, тож передає далі — ту саму (`throw error`) або нову з оригіналом у `cause`. Так `catch` обробляє лише те, що розуміє, а решта не зникає."
    en: "A `throw` inside `catch`: the function caught an error but cannot handle it, so it passes it on — the same one (`throw error`) or a new one with the original in `cause`. That way `catch` handles only what it understands, and the rest does not vanish."
  example:
    code: "catch (error) {\n  if (error instanceof RangeError) {\n    return false;\n  }\n  throw error;\n}"
  see: [try-catch, error-cause]
- id: json
  term: JSON
  name: { uk: "JSON", en: "JSON" }
  aliases: ["JavaScript Object Notation"]
  definition:
    uk: "Текстовий формат для даних (JavaScript Object Notation). Схожий на запис об’єкта в JavaScript, але суворіший: ключі й тексти — лише в подвійних лапках, значення — лише тексти, числа, `true`/`false`, `null`, масиви й об’єкти. Немає `undefined`, функцій, `NaN`, дат, коментарів і зайвих ком."
    en: "A text format for data (JavaScript Object Notation). It looks like an object written in JavaScript but is stricter: keys and texts only in double quotes, and values can only be texts, numbers, `true`/`false`, `null`, arrays and objects. There is no `undefined`, no functions, no `NaN`, no dates, no comments and no trailing commas."
  example:
    code: "{\"id\":\"t-01\",\"title\":\"Water the plants\",\"dueDate\":\"2026-03-02\",\"done\":false}"
  see: [serialization, deserialization]
- id: serialization
  term: serialization
  name: { uk: "серіалізація", en: "serialization" }
  definition:
    uk: "Перетворення значення на текст, який можна зберегти чи передати: `JSON.stringify(value)`. Що JSON записати не вміє, губиться або змінюється: поля з `undefined` і функції пропадають, `NaN` стає `null`, дата — текстом."
    en: "Turning a value into text that can be saved or sent: `JSON.stringify(value)`. Whatever JSON cannot write is lost or changed: fields holding `undefined` and functions disappear, `NaN` becomes `null`, a date becomes text."
  example:
    code: "JSON.stringify({ id: \"e-07\", note: undefined, amountMinor: NaN });\n// '{\"id\":\"e-07\",\"amountMinor\":null}'"
  see: [json, deserialization]
- id: deserialization
  term: deserialization
  name: { uk: "десеріалізація", en: "deserialization" }
  definition:
    uk: "Зворотне перетворення: із тексту створюється нове значення, `JSON.parse(text)`. Для зіпсованого тексту кидає `SyntaxError`, а дата, записана текстом, так і лишається текстом."
    en: "The reverse: a new value is created from text, `JSON.parse(text)`. For damaged text it throws a `SyntaxError`, and a date written as text stays text."
  example:
    code: "JSON.parse('{\"done\":false}'); // { done: false }\nJSON.parse('{\"done\":'); // SyntaxError"
  see: [json, serialization]
- id: cyclic-reference
  term: cyclic reference
  name: { uk: "циклічне посилання", en: "cyclic reference" }
  aliases: ["circular reference"]
  definition:
    uk: "Об’єкт, який через свої властивості посилається сам на себе — напряму (`task.self = task`) чи через інші об’єкти. `JSON.stringify` такого не запише: текст вийшов би нескінченним, тож кидає `TypeError: Converting circular structure to JSON`."
    en: "An object that refers to itself through its properties — directly (`task.self = task`) or through other objects. `JSON.stringify` cannot write it: the text would be endless, so it throws `TypeError: Converting circular structure to JSON`."
  see: [serialization]
- id: persistence
  term: persistence
  name: { uk: "збереження даних (persistence)", en: "persistence" }
  definition:
    uk: "Здатність даних пережити кінець запуску програми: закриту вкладку, оновлену сторінку, перезапуск. Змінні цього не вміють; у браузері для цього є, наприклад, `localStorage`, що тримає текст під ключами для адреси сторінки."
    en: "The ability of data to outlive the end of a program’s run: a closed tab, a reloaded page, a restart. Variables cannot do that; in the browser there is, for example, `localStorage`, which keeps text under keys for the page’s address."
  see: [storage-key, schema-version]
- id: storage-key
  term: storage key
  name: { uk: "ключ сховища", en: "storage key" }
  definition:
    uk: "Назва, під якою значення лежить у сховищі, наприклад `jsll.habits.v1`. Добрий ключ містить назву застосунку й версію, щоб не перетнутися з іншими даними й відрізнити старий формат від нового."
    en: "The name a value is stored under, for example `jsll.habits.v1`. A good key holds the app’s name and a version, so it does not collide with other data and tells an old format from a new one."
  example:
    code: "localStorage.getItem(\"jsll.habits.v1\"); // the saved text, or null"
  see: [persistence, schema-version]
- id: schema-version
  term: schema version
  name: { uk: "версія схеми", en: "schema version" }
  definition:
    uk: "Число в самих збережених даних, що каже, якої вони форми: `{ schemaVersion: 1, records: [...] }`. Під час завантаження застосунок порівнює його з очікуваним і не довіряє даним іншої версії сліпо."
    en: "A number inside the saved data itself that says what shape it has: `{ schemaVersion: 1, records: [...] }`. On load the app compares it with the expected one and does not blindly trust data of another version."
  see: [storage-key, persistence]
