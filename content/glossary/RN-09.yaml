# Terms introduced in RN-09.
- id: secure-storage
  term: secure storage
  name: { uk: "захищене сховище", en: "secure storage" }
  aliases: ["expo-secure-store", "SecureStore", "secure store", "SecretStore"]
  definition:
    uk: "Сховище платформи для маленьких значень, що дають доступ (токени, паролі): на iOS — Keychain, на Android — значення, зашифровані ключем з Android Keystore. Значення лежить зашифрованим, і система віддає його лише застосунку, який його записав. Воно захищає дані **в спокої**: прочитаний рядок — звичайна копія в пам’яті, і журнал чи адресу запиту, куди його передали, сховище вже не захищає. Великі записи й звичайні дані (налаштування, списки) сюди не кладуть."
    en: "The platform's store for small values that grant access (tokens, passwords): the Keychain on iOS, values encrypted with an Android Keystore key on Android. The value lies encrypted, and the system hands it only to the app that wrote it. It protects data **at rest**: a string that was read is an ordinary copy in memory, and the store no longer protects a log or a request address it was passed to. Large entries and ordinary data (settings, lists) do not go here."
  example:
    code: "await SecureStore.setItemAsync('session.token', token);"
  see: [keychain, android-keystore, secret]
- id: keychain
  term: Keychain
  name: { uk: "Keychain (iOS)", en: "Keychain (iOS)" }
  aliases: ["iOS Keychain", "Keychain Services"]
  definition:
    uk: "Захищене сховище iOS для паролів, токенів і ключів. Записи зашифровані, і кожен застосунок бачить лише свої. За документацією Expo, записи `expo-secure-store` на iOS можуть пережити видалення застосунку, якщо його встановлять знову з тим самим bundle ID."
    en: "The iOS secure store for passwords, tokens and keys. Entries are encrypted, and each app sees only its own. According to the Expo documentation, `expo-secure-store` entries on iOS may survive uninstalling the app if it is installed again with the same bundle ID."
  see: [secure-storage, android-keystore]
- id: android-keystore
  term: Android Keystore
  name: { uk: "Android Keystore", en: "Android Keystore" }
  aliases: ["Keystore", "keystore"]
  definition:
    uk: "Система Android, що тримає криптографічні ключі так, щоб застосунок міг ними шифрувати, але не міг їх вийняти. `expo-secure-store` на Android зберігає значення зашифрованими таким ключем; після видалення застосунку вони не зберігаються."
    en: "The Android system that holds cryptographic keys so that an app can encrypt with them but cannot extract them. On Android `expo-secure-store` keeps values encrypted with such a key; they are not kept after the app is uninstalled."
  see: [secure-storage, keychain]
- id: embedded-secret
  term: embedded secret
  name: { uk: "вшитий секрет", en: "embedded secret" }
  aliases: ["hard-coded key", "вшитий ключ", "ключ у пакеті"]
  definition:
    uk: "Ключ чи секрет, що потрапив у пакет застосунку (`.apk`, `.ipa`): у JavaScript-bundle, в `Info.plist`, у константу з Gradle, у змінну `EXPO_PUBLIC_`. Пакет є в кожного, хто встановив застосунок, і його можна розпакувати, тож такий секрет — публічний: компіляція, мініфікація чи копіювання в захищене сховище під час запуску цього не змінюють. Справжній секрет живе лише на сервері."
    en: "A key or secret that ended up inside the app package (`.apk`, `.ipa`): in the JavaScript bundle, in `Info.plist`, in a Gradle constant, in an `EXPO_PUBLIC_` variable. Everyone who installed the app has the package and can unpack it, so such a secret is public: compilation, minification or copying it into secure storage at launch change nothing. A real secret lives only on a server."
  see: [client-side-secret, public-client, secure-storage]
- id: public-client
  term: public client
  name: { uk: "публічний клієнт", en: "public client" }
  aliases: ["clientId", "client id"]
  definition:
    uk: "Термін OAuth для застосунку, який не може зберегти секрет, бо його код є в кожного користувача: нативний застосунок чи вебсторінка. Він називає себе лише публічним ідентифікатором (`clientId`), доводить, що вхід почав саме він, через PKCE, а доступ отримує як короткоживучий токен окремої людини."
    en: "The OAuth term for an app that cannot keep a secret because every user has its code: a native app or a web page. It names itself only with a public identifier (`clientId`), proves that it started the sign-in itself through PKCE, and gets access as a short-lived token of one person."
  see: [embedded-secret]
