# Terms introduced in RN-09.
- id: secure-storage
  term: secure storage
  name: { uk: "захищене сховище", en: "secure storage" }
  aliases: ["expo-secure-store", "SecureStore", "secure store", "SecretStore"]
  definition:
    uk: "Сховище платформи для маленьких значень, що дають доступ (токени, паролі): на iOS — Keychain, на Android — значення, зашифровані ключем з Android Keystore. Значення лежить зашифрованим, і система віддає його лише застосунку, який його записав. Воно захищає дані **у стані спокою**: прочитаний рядок — звичайна копія в пам’яті, і журнал чи адресу запиту, куди його передали, сховище вже не захищає. Великі записи й звичайні дані (налаштування, списки) сюди не кладуть."
    en: "The platform's store for small values that grant access (tokens, passwords): the Keychain on iOS, values encrypted with an Android Keystore key on Android. The value lies encrypted, and the system hands it only to the app that wrote it. It protects data **at rest**: a string that was read is an ordinary copy in memory, and the store no longer protects a log or a request address it was passed to. Large entries and ordinary data (settings, lists) do not go here."
  example:
    code: "await SecureStore.setItemAsync('session.token', token);"
  see: [keychain, android-keystore, secret]
- id: keychain
  term: Keychain
  name: { uk: "Keychain (iOS)", en: "Keychain (iOS)" }
  aliases: ["iOS Keychain", "Keychain Services"]
  definition:
    uk: "Захищене сховище iOS для паролів, токенів і ключів. Записи зашифровані, і кожен застосунок бачить лише свої. За документацією Expo, записи `expo-secure-store` на iOS можуть пережити видалення застосунку, якщо його встановлять знову з тим самим bundle ID."
    en: "The iOS secure store for passwords, tokens and keys. Entries are encrypted, and each app sees only its own. According to the Expo documentation, `expo-secure-store` entries on iOS may survive uninstalling the app if it is installed again with the same bundle ID."
  see: [secure-storage, android-keystore]
- id: android-keystore
  term: Android Keystore
  name: { uk: "Android Keystore", en: "Android Keystore" }
  aliases: ["Keystore", "keystore"]
  definition:
    uk: "Система Android, що тримає криптографічні ключі так, щоб застосунок міг ними шифрувати, але не міг їх вийняти. `expo-secure-store` на Android зберігає значення зашифрованими таким ключем; після видалення застосунку вони не зберігаються."
    en: "The Android system that holds cryptographic keys so that an app can encrypt with them but cannot extract them. On Android `expo-secure-store` keeps values encrypted with such a key; they are not kept after the app is uninstalled."
  see: [secure-storage, keychain]
- id: embedded-secret
  term: embedded secret
  name: { uk: "вшитий секрет", en: "embedded secret" }
  aliases: ["hard-coded key", "вшитий ключ", "ключ у пакеті"]
  definition:
    uk: "Ключ чи секрет, що потрапив у пакет застосунку (`.apk`, `.ipa`): у JavaScript-bundle, в `Info.plist`, у константу з Gradle, у змінну `EXPO_PUBLIC_`. Пакет є в кожного, хто встановив застосунок, і його можна розпакувати, тож такий секрет — публічний: компіляція, мініфікація чи копіювання в захищене сховище під час запуску цього не змінюють. Справжній секрет живе лише на сервері."
    en: "A key or secret that ended up inside the app package (`.apk`, `.ipa`): in the JavaScript bundle, in `Info.plist`, in a Gradle constant, in an `EXPO_PUBLIC_` variable. Everyone who installed the app has the package and can unpack it, so such a secret is public: compilation, minification or copying it into secure storage at launch change nothing. A real secret lives only on a server."
  see: [client-side-secret, public-client, secure-storage]
- id: public-client
  term: public client
  name: { uk: "публічний клієнт", en: "public client" }
  aliases: ["clientId", "client id"]
  definition:
    uk: "Термін OAuth для застосунку, який не може зберегти секрет, бо його код є в кожного користувача: нативний застосунок чи вебсторінка. Він називає себе лише публічним ідентифікатором (`clientId`), доводить, що вхід почав саме він, через PKCE, а доступ отримує як короткоживучий токен окремої людини."
    en: "The OAuth term for an app that cannot keep a secret because every user has its code: a native app or a web page. It names itself only with a public identifier (`clientId`), proves that it started the sign-in itself through PKCE, and gets access as a short-lived token of one person."
  see: [embedded-secret]
- id: data-flow-diagram
  term: data-flow diagram
  name: { uk: "схема потоку даних", en: "data-flow diagram" }
  aliases: ["data flow", "потік даних", "DFD"]
  definition:
    uk: "Схема, що для кожного поля показує, звідки воно взялося (ввела людина, додала камера, видав сервер), де лежить кожна його копія (пам’ять, сховище, журнал, тіло запиту, сервер), куди її надсилають і скільки тримають. Вона робить видимими копії, яких ніхто не задумував, — як координати з EXIF фото в налагоджувальному журналі."
    en: "A diagram that shows for every field where it came from (typed by the person, added by the camera, issued by a server), where each copy of it lies (memory, storage, a log, a request body, a server), where it is sent and how long it is kept. It makes visible the copies nobody intended — like the coordinates from a photo's EXIF in a debug log."
  see: [data-minimization, data-retention]
- id: data-retention
  term: data retention
  name: { uk: "термін зберігання даних", en: "data retention" }
  aliases: ["retention period", "retention", "термін зберігання"]
  definition:
    uk: "Скільки часу зберігають певне поле чи запис і що стається потім: «поки людина не видалить витрату», «до вивантаження, потім стерти», «30 днів». Поле без мети й терміну не збирають; поле з терміном видаляють, коли термін минув, — в усіх копіях."
    en: "How long a field or record is kept and what happens afterwards: “until the person deletes the expense”, “until uploaded, then erased”, “30 days”. A field with no purpose and period is not collected; a field with a period is deleted when it ends — in every copy."
  see: [data-flow-diagram, data-minimization]
- id: pkce
  term: PKCE
  name: { uk: "PKCE (Proof Key for Code Exchange)", en: "PKCE (Proof Key for Code Exchange)" }
  aliases: ["code_verifier", "code_challenge", "S256"]
  definition:
    uk: "Доповнення до входу OAuth для публічних клієнтів. Застосунок створює випадковий `code_verifier`, надсилає серверу лише його хеш SHA-256 (`code_challenge`), а обмінюючи одноразовий код на токен, додає сам `code_verifier`. Сервер перевіряє, що хеш збігається. Тому застосунок, який перехопив посилання з кодом, обміняти його не може: verifier є лише в того, хто почав вхід."
    en: "An addition to the OAuth sign-in for public clients. The app creates a random `code_verifier`, sends the server only its SHA-256 hash (the `code_challenge`), and adds the `code_verifier` itself when exchanging the one-time code for a token. The server checks that the hash matches. So an app that intercepted the link with the code cannot redeem it: only whoever started the sign-in has the verifier."
  example:
    code: "code_challenge = BASE64URL(SHA256(code_verifier))"
  see: [public-client, auth-redirect]
- id: auth-redirect
  term: auth redirect
  name: { uk: "адреса повернення (redirect URI)", en: "auth redirect (redirect URI)" }
  aliases: ["redirect URI", "redirect_uri", "callback URL", "адреса перенаправлення"]
  definition:
    uk: "Адреса, на яку сервер входу перенаправляє браузер після входу, додаючи одноразовий код: для нативного застосунку — власна схема (`jsll-lab://auth`) чи перевірене посилання застосунку. Це межа, через яку посилання ззовні заходить у застосунок, тому код у ній захищають PKCE, а сам застосунок приймає лише очікувану адресу."
    en: "The address to which the sign-in server redirects the browser after sign-in, adding a one-time code: for a native app, a custom scheme (`jsll-lab://auth`) or a verified app link. It is the boundary through which a link from outside enters the app, which is why the code in it is protected by PKCE and the app accepts only the expected address."
  see: [pkce, verified-app-link]
- id: verified-app-link
  term: verified app link
  name: { uk: "перевірене посилання застосунку", en: "verified app link" }
  aliases: ["App Links", "Android App Links", "Universal Links", "iOS Universal Links", "assetlinks.json", "apple-app-site-association"]
  definition:
    uk: "Посилання `https://…`, яке система відкриває у твоєму застосунку лише тоді, коли сайт підтвердив зв’язок файлом на своєму домені: `/.well-known/assetlinks.json` для Android App Links, `apple-app-site-association` для iOS Universal Links. На відміну від власної схеми, його не може «зайняти» інший застосунок. Але скласти таке посилання може будь-хто, тож параметри однаково перевіряють."
    en: "An `https://…` link that the system opens in your app only when the website confirmed the connection with a file on its domain: `/.well-known/assetlinks.json` for Android App Links, `apple-app-site-association` for iOS Universal Links. Unlike a custom scheme, another app cannot “claim” it. But anyone can still compose such a link, so its parameters are validated all the same."
  see: [auth-redirect]
- id: permission-revocation
  term: permission revocation
  name: { uk: "відкликання дозволу", en: "permission revocation" }
  aliases: ["revoked permission", "revoke", "відкликаний дозвіл"]
  definition:
    uk: "Людина забирає раніше наданий дозвіл у системних налаштуваннях, поки застосунок у фоні чи закритий. За документацією Android, після цього процес застосунку завершується. Застосунок помічає відкликання, лише коли знову читає стан у ОС — під час запуску, повернення на передній план чи перед дією; збережене `granted: true` про нього не дізнається."
    en: "The person takes a previously granted permission away in the system settings while the app is in the background or closed. According to the Android documentation, the app's process is then terminated. The app notices the revoke only when it reads the state from the OS again — at launch, on return to the foreground or before an action; a saved `granted: true` never learns about it."
  see: [blocked-permission]
- id: blocked-permission
  term: blocked permission
  name: { uk: "заблокований дозвіл", en: "blocked permission" }
  aliases: ["permanently denied", "canAskAgain: false", "never ask again", "назавжди відхилений дозвіл"]
  definition:
    uk: "Дозвіл, про який система вже не покаже діалогу: в Expo — `status: 'denied'` з `canAskAgain: false`. На Android 11+ так стається після другої відмови, на iOS — після першої. Повторний запит одразу повертає відмову, тож застосунок пояснює ситуацію й пропонує відкрити налаштування (`Linking.openSettings()`) або обхідний шлях."
    en: "A permission for which the system will no longer show a dialog: in Expo, `status: 'denied'` with `canAskAgain: false`. On Android 11+ it happens after the second denial, on iOS after the first. A repeated request returns the denial at once, so the app explains the situation and offers to open Settings (`Linking.openSettings()`) or a workaround."
  see: [permission-revocation]
