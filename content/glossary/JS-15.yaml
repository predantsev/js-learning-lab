# Terms introduced in JS-15 (terminal, packages, tooling and Git). One file per unit keeps parallel authoring conflict-free.
- id: terminal
  term: terminal
  name: { uk: "термінал", en: "terminal" }
  aliases: [command line, console window]
  definition:
    uk: "Вікно, у якому ти керуєш комп’ютером текстом: пишеш команду, натискаєш Enter і читаєш відповідь. На macOS це застосунок Terminal, на Windows — PowerShell або Windows Terminal, на Linux — застосунок терміналу твого дистрибутива. Сам термінал лише показує текст; команди виконує shell усередині нього."
    en: "A window where you control the computer with text: you type a command, press Enter and read the answer. On macOS it is the Terminal app, on Windows PowerShell or Windows Terminal, on Linux your distribution’s terminal app. The terminal only shows text; a shell inside it runs the commands."
  example:
    code: "pwd\n/Users/you"
    lang: text
  see: [shell, working-directory]
- id: shell
  term: shell
  name: { uk: "shell (оболонка)", en: "shell" }
  aliases: [zsh, bash, PowerShell]
  definition:
    uk: "Програма, що читає рядок, який ти набрав у терміналі, розбирає його на команду й аргументи та запускає цю команду. На macOS типово працює zsh, на Linux часто bash, на Windows — PowerShell. Більшість простих команд (`cd`, `ls`, `mkdir`) однакові всюди, але деякі пишуться по-різному."
    en: "The program that reads the line you typed in the terminal, splits it into a command and its arguments and starts that command. macOS uses zsh by default, Linux often bash, Windows PowerShell. Most simple commands (`cd`, `ls`, `mkdir`) are the same everywhere, but some are written differently."
  see: [terminal]
- id: working-directory
  term: working directory
  name: { uk: "робоча тека (working directory)", en: "working directory" }
  aliases: [current directory, cwd, pwd]
  definition:
    uk: "Тека, у якій зараз «стоїть» shell. Кожен відносний шлях у команді рахується від неї, тому одна й та сама команда в різних теках діє на різні файли. Показує її `pwd`, змінює `cd`."
    en: "The folder the shell is currently “standing in”. Every relative path in a command is counted from it, so the same command acts on different files in different folders. `pwd` shows it, `cd` changes it."
  example:
    code: "cd js-course\npwd\n/Users/you/js-course"
    lang: text
  see: [relative-path, absolute-path]
- id: absolute-path
  term: absolute path
  name: { uk: "абсолютний шлях", en: "absolute path" }
  definition:
    uk: "Шлях від самого кореня файлової системи: на macOS і Linux він починається зі скісної риски `/`, на Windows — з літери диска (`C:\\`). Він веде до того самого файла, хоч би де ти зараз був. `~` — скорочення для твоєї домашньої теки, тож `~/js-course` теж не залежить від робочої теки."
    en: "A path from the very root of the file system: on macOS and Linux it starts with a slash `/`, on Windows with a drive letter (`C:\\`). It leads to the same file wherever you are. `~` is short for your home folder, so `~/js-course` does not depend on the working directory either."
  example:
    code: "/Users/you/js-course/scratch/notes.txt\nC:\\Users\\you\\js-course\\scratch\\notes.txt"
    lang: text
  see: [relative-path]
- id: relative-path
  term: relative path
  name: { uk: "відносний шлях", en: "relative path" }
  definition:
    uk: "Шлях, що рахується від робочої теки: `notes.txt` — файл тут, `old/a.txt` — у теці `old` тут, `./` — ця сама тека, `../` — тека вище. Той самий відносний шлях з іншої теки веде до іншого файла."
    en: "A path counted from the working directory: `notes.txt` is a file here, `old/a.txt` is inside the folder `old` here, `./` is this same folder, `../` is the folder above. The same relative path used from another folder leads to another file."
  example:
    code: "cd /Users/you/js-course/scratch\ncat ../README.md   # reads /Users/you/js-course/README.md"
    lang: text
  see: [absolute-path, working-directory]
- id: destructive-command
  term: destructive command
  name: { uk: "руйнівна команда", en: "destructive command" }
  definition:
    uk: "Команда, що видаляє або перезаписує дані так, що «Скасувати» немає: `rm` (файли не йдуть у кошик), `>` у файл, що вже існує, `mv` на назву наявного файла. Перед такою командою перевіряють, у якій ти теці, на що саме вона подіє і чи можна це повернути."
    en: "A command that deletes or overwrites data with no “undo”: `rm` (files do not go to the trash), `>` into a file that already exists, `mv` onto the name of an existing file. Before such a command you check which folder you are in, what exactly it will act on and whether you can get it back."
  see: [working-directory]
- id: secret
  term: secret
  name: { uk: "секрет (secret)", en: "secret" }
  aliases: [credential, API key, token, password]
  definition:
    uk: "Значення, яке дає доступ: пароль, токен, ключ API. Хто його побачив — той може ним скористатися. Секрети не друкують у терміналі, коли тебе можуть бачити, не вставляють у чати й не додають у файли, які комусь передаються. Якщо секрет усе ж потрапив назовні, його не «ховають», а замінюють на новий."
    en: "A value that grants access: a password, a token, an API key. Whoever has seen it can use it. Secrets are not printed in a terminal while someone may see it, not pasted into chats and not added to files that are shared. If a secret does leak, it is not “hidden” afterwards but replaced with a new one."
  see: [environment-variable]
- id: node-runtime
  term: Node.js
  name: { uk: "Node.js", en: "Node.js" }
  aliases: [node, runtime]
  definition:
    uk: "Програма, що виконує JavaScript поза браузером: у терміналі, на сервері. Мова та сама, але середовище інше — немає `document` і сторінки, зате є доступ до файлів, мережі й процесів. Команда `node file.mjs` запускає файл; `node --version` показує встановлену версію."
    en: "A program that runs JavaScript outside the browser: in a terminal, on a server. The language is the same but the environment differs — there is no `document` and no page, but there is access to files, the network and processes. `node file.mjs` runs a file; `node --version` shows the installed version."
  example:
    code: "node --version\nv22.13.0"
    lang: text
  see: [package-json]
- id: package-json
  term: package.json
  name: { uk: "package.json", en: "package.json" }
  aliases: [package manifest, manifest]
  definition:
    uk: "Файл-опис проєкту JavaScript у форматі JSON: назва, версія, scripts (короткі назви для команд) і списки залежностей з діапазонами версій. Інструменти — npm, редактор, збирачі — читають його, щоб знати, як із проєктом працювати."
    en: "The JSON file that describes a JavaScript project: its name, version, scripts (short names for commands) and lists of dependencies with version ranges. Tools — npm, the editor, bundlers — read it to know how to work with the project."
  example:
    code: "{\n  \"name\": \"money-lab\",\n  \"scripts\": { \"start\": \"node summarize.mjs\" },\n  \"devDependencies\": { \"semver\": \"^7.8.5\" }\n}"
    lang: json
  see: [npm-script, dependency]
- id: npm-script
  term: npm script
  name: { uk: "npm script", en: "npm script" }
  aliases: [package script, scripts]
  definition:
    uk: "Запис у полі `scripts` файла `package.json`: коротка назва → команда для shell. `npm run <назва>` виконує цю команду в теці проєкту; для `start` і `test` є скорочення `npm start` і `npm test`. Це не окремий файл, а лише рядок із командою."
    en: "An entry in the `scripts` field of `package.json`: a short name → a shell command. `npm run <name>` runs that command in the project folder; `start` and `test` have the shortcuts `npm start` and `npm test`. It is not a separate file, only a line with a command."
  example:
    code: "\"scripts\": { \"lint\": \"eslint .\" }\n\nnpm run lint"
    lang: text
  see: [package-json]
- id: package-manager
  term: package manager
  name: { uk: "менеджер пакетів (package manager)", en: "package manager" }
  aliases: [npm]
  definition:
    uk: "Програма, що завантажує чужий код (пакети) з реєстру, кладе його в `node_modules`, записує, що саме встановлено, і вміє відтворити те саме на іншому комп’ютері. Для Node.js це npm; він встановлюється разом із Node.js. Встановлення може запускати код пакетів, тому ставлять лише те, чому довіряють."
    en: "A program that downloads other people’s code (packages) from a registry, puts it into `node_modules`, records what exactly was installed and can reproduce the same on another computer. For Node.js it is npm, installed together with Node.js. Installing can run package code, so you install only what you trust."
  see: [dependency, lockfile]
- id: dependency
  term: dependency
  name: { uk: "залежність (dependency)", en: "dependency" }
  aliases: [devDependency, transitive dependency]
  definition:
    uk: "Пакет, без якого проєкт не працює або не збирається. `dependencies` потрібні програмі під час роботи, `devDependencies` — лише розробникам (тести, lint, збирання). У залежностей бувають власні залежності — транзитивні; ти їх не вписував, але вони теж опиняються в `node_modules`."
    en: "A package the project cannot run or build without. `dependencies` are needed by the program while it runs, `devDependencies` only by developers (tests, lint, builds). Dependencies have dependencies of their own — transitive ones; you never listed them, but they end up in `node_modules` too."
  see: [package-json, lockfile]
- id: lockfile
  term: lockfile
  name: { uk: "lockfile", en: "lockfile" }
  aliases: [package-lock.json]
  definition:
    uk: "Файл `package-lock.json`, у якому npm записує **точну** версію кожного встановленого пакета, звідки його взято і контрольну суму вмісту — разом із транзитивними залежностями. `npm ci` встановлює рівно те, що в ньому записано, тож у всіх виходить однаковий `node_modules`. Lockfile комітять разом із `package.json`."
    en: "The file `package-lock.json` where npm records the **exact** version of every installed package, where it came from and a checksum of its contents — transitive dependencies included. `npm ci` installs exactly what it lists, so everyone gets the same `node_modules`. The lockfile is committed together with `package.json`."
  see: [semver, dependency]
- id: semver
  term: semver
  name: { uk: "semver (семантичне версіонування)", en: "semver (semantic versioning)" }
  aliases: [semantic versioning, version range, caret range, tilde range]
  definition:
    uk: "Домовленість, що версія має вигляд MAJOR.MINOR.PATCH: PATCH — виправлення, MINOR — нові можливості без поломок, MAJOR — зміни, що можуть зламати твій код. Діапазон у `package.json` каже, які версії згодяться: `^1.4.2` — від 1.4.2 до будь-якої 1.x, `~1.4.2` — лише 1.4.x від 1.4.2, `1.4.2` — тільки вона. Для версій `0.x` знак `^` суворіший: `^0.4.2` дозволяє лише 0.4.x."
    en: "The convention that a version looks like MAJOR.MINOR.PATCH: PATCH is a fix, MINOR adds features without breaking anything, MAJOR may break your code. A range in `package.json` says which versions are acceptable: `^1.4.2` — from 1.4.2 up to any 1.x, `~1.4.2` — only 1.4.x from 1.4.2, `1.4.2` — that one only. For `0.x` versions `^` is stricter: `^0.4.2` allows only 0.4.x."
  example:
    code: "npx semver --range \"~1.4.2\" 1.4.1 1.4.9 1.5.0\n1.4.9"
    lang: text
  see: [lockfile]
- id: security-advisory
  term: security advisory
  name: { uk: "повідомлення про вразливість (security advisory)", en: "security advisory" }
  aliases: [npm audit, vulnerability]
  definition:
    uk: "Опублікований опис вразливості в певних версіях пакета: який пакет, які версії, наскільки серйозно і з якої версії виправлено. `npm audit` порівнює твій lockfile з базою таких повідомлень. Його висновок читають і зважують, а не виконують наосліп: виправлення може змінити MAJOR-версію і зламати проєкт."
    en: "A published description of a vulnerability in certain versions of a package: which package, which versions, how severe and from which version it is fixed. `npm audit` compares your lockfile with a database of such advisories. Its report is read and weighed, not applied blindly: a fix can change a MAJOR version and break the project."
  see: [lockfile, semver]
- id: linter
  term: linter
  name: { uk: "linter", en: "linter" }
  aliases: [ESLint, lint]
  definition:
    uk: "Інструмент, що читає код, не запускаючи його, і шукає місця, де найімовірніше ховається помилка: невикористану змінну, затінену назву, порівняння, яке завжди хибне. Кожна знахідка має назву правила, рядок і стовпчик. Для JavaScript найпоширеніший linter — ESLint."
    en: "A tool that reads code without running it and looks for places where a bug most likely hides: an unused variable, a shadowed name, a comparison that is always false. Every finding has a rule name, a line and a column. The most common JavaScript linter is ESLint."
  example:
    code: "4:9  error  'currency' is assigned a value but never used  no-unused-vars"
    lang: text
  see: [lint-rule, formatter]
- id: formatter
  term: formatter
  name: { uk: "formatter", en: "formatter" }
  aliases: [Prettier]
  definition:
    uk: "Інструмент, що переписує код в одному стилі: відступи, пробіли, лапки, перенесення рядків коду. Він не змінює, що код робить, і тому не знаходить помилок. Команда налаштовує його один раз — і більше не сперечається про стиль. Поширений formatter — Prettier."
    en: "A tool that rewrites code in one style: indentation, spaces, quotes, line breaks. It does not change what the code does, and so it finds no bugs. A team configures it once and stops arguing about style. A common formatter is Prettier."
  see: [linter]
- id: lint-rule
  term: lint rule
  name: { uk: "правило lint (lint rule)", en: "lint rule" }
  definition:
    uk: "Одна перевірка linter-а з власною назвою (`no-unused-vars`, `no-shadow`). Правила вмикають у конфігураційному файлі й задають рівень: `error`, `warn` або `off`. Назва правила в повідомленні — ключ до його документації."
    en: "One check of a linter, with its own name (`no-unused-vars`, `no-shadow`). Rules are turned on in a config file with a level: `error`, `warn` or `off`. The rule name in a message is the key to its documentation."
  example:
    code: "rules: { \"no-shadow\": \"error\" }"
  see: [linter, config-file]
- id: build-step
  term: build step
  name: { uk: "збирання (build step)", en: "build step" }
  aliases: [build]
  definition:
    uk: "Команда, що перетворює вихідні файли проєкту на ті, що віддають браузеру: збирає модулі в один файл, стискає його, підставляє значення конфігурації. Результат лягає в окрему теку (часто `dist/`); його не редагують руками й не комітять — його щоразу збирають знову."
    en: "A command that turns the project’s source files into the files a browser receives: it joins modules into one file, minifies it and fills in configuration values. The result goes to a separate folder (often `dist/`); nobody edits it by hand or commits it — it is rebuilt each time."
  see: [bundle, source-map]
- id: bundle
  term: bundle
  name: { uk: "bundle", en: "bundle" }
  aliases: [bundler, esbuild]
  definition:
    uk: "Один файл, у який збирач (bundler, наприклад esbuild) склав модуль-вхід і все, що той імпортує. Браузер завантажує один файл замість багатьох. Стиснутий bundle людині майже не прочитати — для цього є source map."
    en: "One file into which a bundler (for example esbuild) has put the entry module and everything it imports. The browser loads one file instead of many. A minified bundle is nearly unreadable for a person — that is what a source map is for."
  see: [build-step, source-map]
- id: environment-variable
  term: environment variable
  name: { uk: "змінна середовища (environment variable)", en: "environment variable" }
  aliases: [env, env var, process.env, .env]
  definition:
    uk: "Пара назва=значення, яку програма отримує від shell, що її запустив, а не з коду. У Node.js її читають через `process.env.NAME`. Так одна й та сама програма працює з різними налаштуваннями на різних комп’ютерах. Значення часто тримають у файлі `.env`, який не комітять."
    en: "A name=value pair a program receives from the shell that started it rather than from its code. In Node.js you read it with `process.env.NAME`. This way one program runs with different settings on different computers. Values are often kept in a `.env` file that is not committed."
  example:
    code: "// .env (not committed)\nAPP_TITLE=Family budget\n\n// build.mjs\nconst title = process.env.APP_TITLE ?? \"Money lab\";"
  see: [config-file, secret]
- id: config-file
  term: config file
  name: { uk: "конфігураційний файл", en: "config file" }
  aliases: [configuration]
  definition:
    uk: "Файл, у якому записано, як інструмент має працювати в цьому проєкті: які правила lint увімкнути, які теки пропустити, що збирати. Його комітять, щоб уся команда працювала однаково. Секретів у ньому немає — вони йдуть у змінні середовища."
    en: "A file that records how a tool should work in this project: which lint rules are on, which folders to skip, what to build. It is committed so the whole team works the same way. It holds no secrets — those go into environment variables."
  example:
    code: "// eslint.config.mjs\nexport default [{ ignores: [\"dist/\"] }];"
  see: [lint-rule, environment-variable]
- id: source-map
  term: source map
  name: { uk: "source map", en: "source map" }
  definition:
    uk: "Файл `.map`, що для кожного місця в зібраному bundle каже, з якого файла, рядка коду й стовпчика вихідного коду воно взялося. DevTools читають його й показують твої справжні модулі — у них можна ставити breakpoints, хоча браузер виконує стиснутий bundle."
    en: "A `.map` file that tells, for every place in the built bundle, which source file, line and column it came from. DevTools read it and show your real modules — you can set breakpoints in them even though the browser runs the minified bundle."
  example:
    code: "//# sourceMappingURL=app.js.map"
  see: [bundle, build-step]
- id: git-repository
  term: Git repository
  name: { uk: "репозиторій Git", en: "Git repository" }
  aliases: [repo, repository, .git]
  definition:
    uk: "Тека проєкту, в якій Git веде історію: прихована підтека `.git` зберігає всі commits, гілки й налаштування. `git init` створює її. Якщо видалити `.git`, файли залишаться, а історія зникне."
    en: "A project folder in which Git keeps history: the hidden subfolder `.git` stores every commit, branch and setting. `git init` creates it. Delete `.git` and the files stay, but the history is gone."
  see: [git-commit, working-tree]
- id: working-tree
  term: working tree
  name: { uk: "робоче дерево (working tree)", en: "working tree" }
  aliases: [working copy]
  definition:
    uk: "Файли, які ти бачиш і редагуєш у теці репозиторію. Git порівнює їх з останнім commit: що змінено — `modified`, що Git ще не відстежує — `untracked`. Зміни в робочому дереві ще ніде не збережені в історії."
    en: "The files you see and edit in the repository folder. Git compares them with the last commit: what was changed is `modified`, what Git does not track yet is `untracked`. Changes in the working tree are not saved in the history anywhere yet."
  see: [staging-area, git-commit]
- id: staging-area
  term: staging area
  name: { uk: "індекс (staging area)", en: "staging area" }
  aliases: [index, stage, git add]
  definition:
    uk: "Проміжне місце між робочим деревом та історією: список змін, які увійдуть у наступний commit. `git add файл` кладе туди поточний вміст файла, `git diff --staged` показує, що там лежить, `git restore --staged файл` виймає назад."
    en: "The place between the working tree and the history: the list of changes the next commit will contain. `git add file` puts the file’s current contents there, `git diff --staged` shows what is there, `git restore --staged file` takes it back out."
  see: [working-tree, git-commit, diff]
- id: git-commit
  term: commit
  name: { uk: "commit", en: "commit" }
  definition:
    uk: "Збережений знімок проєкту в історії Git: вміст файлів, автор, час, повідомлення й посилання на попередній commit (батька). Його id обчислено з усього цього, тому змінений commit — це вже інший commit з іншим id. Добре повідомлення пояснює, **навіщо** зроблено зміну."
    en: "A saved snapshot of the project in Git’s history: the file contents, the author, the time, a message and a link to the previous commit (its parent). Its id is computed from all of that, so a changed commit is a different commit with a different id. A good message explains **why** the change was made."
  example:
    code: "git commit -m \"Explain how to run the tests\"\n[main eab0f9f] Explain how to run the tests"
    lang: text
  see: [staging-area, git-branch]
- id: diff
  term: diff
  name: { uk: "diff", en: "diff" }
  definition:
    uk: "Опис різниці між двома версіями тексту по рядках коду: рядки з `-` прибрано, з `+` додано, решта — контекст. `git diff` показує зміни робочого дерева, яких ще немає в індексі; `git diff --staged` — те, що вже в індексі."
    en: "A line-by-line description of the difference between two versions of a text: lines with `-` were removed, lines with `+` added, the rest is context. `git diff` shows working-tree changes that are not in the staging area yet; `git diff --staged` shows what is already staged."
  example:
    code: "-  return `${habit.name} (${habit.frequency})`;\n+  return `${habit.name} · ${habit.frequency}`;"
    lang: diff
  see: [staging-area]
- id: git-branch
  term: branch
  name: { uk: "гілка (branch)", en: "branch" }
  definition:
    uk: "Назва, що вказує на один commit. Новий commit на гілці посуває цю назву вперед, на себе. Гілки дешеві: це не копія файлів, а лише вказівник, тому для кожної окремої задачі заводять свою гілку."
    en: "A name that points at one commit. A new commit on the branch moves that name forward onto itself. Branches are cheap: not a copy of the files, only a pointer, so every separate task gets a branch of its own."
  example:
    code: "git switch -c feature/paused-mark"
    lang: text
  see: [head, git-commit]
- id: head
  term: HEAD
  name: { uk: "HEAD", en: "HEAD" }
  definition:
    uk: "Позначка «ти тут»: зазвичай вказує на гілку, на якій ти зараз працюєш, а через неї — на її останній commit. Новий commit стає дитиною того commit, на який вказує HEAD. `git switch` переставляє HEAD на іншу гілку й змінює файли робочого дерева."
    en: "The “you are here” marker: it usually points at the branch you are working on and, through it, at that branch’s latest commit. A new commit becomes a child of the commit HEAD points at. `git switch` moves HEAD to another branch and changes the working-tree files."
  see: [git-branch]
- id: commit-history
  term: commit history
  name: { uk: "історія commits", en: "commit history" }
  aliases: [git log, history]
  definition:
    uk: "Ланцюжок commits, де кожен посилається на батька. Гілка «містить» commit, якщо до нього можна дійти від її commit назад по батьках. `git log --oneline --graph --all` малює цю історію в терміналі."
    en: "The chain of commits in which each one links to its parent. A branch “contains” a commit if you can reach it from the branch’s commit by walking back through parents. `git log --oneline --graph --all` draws this history in the terminal."
  see: [git-commit, git-branch]
- id: fast-forward
  term: fast-forward
  name: { uk: "fast-forward", en: "fast-forward" }
  definition:
    uk: "Злиття без нового commit: якщо гілка, яку вливають, просто продовжує поточну, Git лише пересуває назву поточної гілки вперед. Можливе лише тоді, коли поточна гілка не має власних нових commits."
    en: "A merge with no new commit: if the branch being merged simply continues the current one, Git only moves the current branch’s name forward. It is possible only when the current branch has no new commits of its own."
  see: [merge-commit, rebase]
- id: merge-commit
  term: merge commit
  name: { uk: "merge commit", en: "merge commit" }
  aliases: [git merge, merge]
  definition:
    uk: "Commit із двома батьками, який створює `git merge`, коли гілки розійшлися. Він поєднує зміни обох гілок, а самі їхні commits залишаються незмінними — з тими самими id."
    en: "A commit with two parents that `git merge` creates when branches have diverged. It combines the changes of both branches, while their own commits stay unchanged — with the same ids."
  see: [fast-forward, rebase]
- id: rebase
  term: rebase
  name: { uk: "rebase", en: "rebase" }
  definition:
    uk: "Перенесення commits гілки на нову основу: Git по черзі повторює кожну зміну поверх іншого commit і створює **нові** commits з новими id, бо змінився батько. Старі commits зникають з гілки. Тому rebase роблять лише з власними commits, яких ще ніхто не отримав."
    en: "Moving a branch’s commits onto a new base: Git replays each change in turn on top of another commit and creates **new** commits with new ids, because their parent changed. The old commits disappear from the branch. That is why you rebase only your own commits that nobody else has yet."
  see: [merge-commit, fast-forward]
- id: merge-conflict
  term: merge conflict
  name: { uk: "конфлікт злиття (merge conflict)", en: "merge conflict" }
  aliases: [conflict]
  definition:
    uk: "Зупинка злиття, коли обидві гілки змінили той самий фрагмент файла і Git не може вирішити, яка зміна правильна. Git позначає місце маркерами й чекає: ти пишеш правильний результат, перевіряєш його тестами, `git add` і `git commit`."
    en: "A pause in a merge when both branches changed the same part of a file and Git cannot decide which change is right. Git marks the place with markers and waits: you write the correct result, check it with tests, then `git add` and `git commit`."
  see: [conflict-markers, merge-commit]
- id: conflict-markers
  term: conflict markers
  name: { uk: "маркери конфлікту", en: "conflict markers" }
  definition:
    uk: "Рядки, якими Git розмічає конфлікт у файлі: від `<<<<<<<` до `=======` — версія поточної гілки (HEAD), від `=======` до `>>>>>>>` — версія гілки, яку вливають. Після розв’язання жодного маркера у файлі не лишається."
    en: "The lines Git uses to mark a conflict in a file: from `<<<<<<<` to `=======` is the current branch’s version (HEAD), from `=======` to `>>>>>>>` the version of the branch being merged. After resolving, no marker is left in the file."
  example:
    code: "<<<<<<< HEAD\n  return a;\n=======\n  return b;\n>>>>>>> feature/x"
    lang: text
  see: [merge-conflict]
- id: git-restore
  term: git restore
  name: { uk: "git restore", en: "git restore" }
  definition:
    uk: "Команда, що повертає файл робочого дерева до стану з індексу чи останнього commit (`git restore файл`) або виймає файл з індексу, не чіпаючи твоїх правок (`git restore --staged файл`). Перша форма стирає незбережені правки файла назавжди."
    en: "A command that returns a working-tree file to its state in the staging area or the last commit (`git restore file`), or takes a file out of the staging area without touching your edits (`git restore --staged file`). The first form erases the file’s unsaved edits for good."
  see: [working-tree, staging-area]
- id: git-revert
  term: git revert
  name: { uk: "git revert", en: "git revert" }
  definition:
    uk: "Скасування commit **новим** commit, що робить протилежну зміну. Історія не переписується, тож це безпечно і для commits, які вже отримали інші люди."
    en: "Undoing a commit with a **new** commit that makes the opposite change. History is not rewritten, so it is safe even for commits other people already have."
  example:
    code: "git revert --no-edit HEAD\n[main cec82e6] Revert \"Simplify the label\""
    lang: text
  see: [git-commit, reflog]
- id: reflog
  term: reflog
  name: { uk: "reflog", en: "reflog" }
  definition:
    uk: "Локальний журнал Git: куди вказував HEAD після кожного commit, switch, merge, rebase чи reset. Через нього знаходять commit, який «зник» з гілки, і повертають його новою гілкою. Незакомічені правки в reflog не потрапляють — їх він не врятує."
    en: "Git’s local journal of where HEAD pointed after every commit, switch, merge, rebase or reset. You use it to find a commit that “disappeared” from a branch and bring it back with a new branch. Uncommitted edits never get into the reflog — it cannot save them."
  example:
    code: "git reflog -3\ncec82e6 HEAD@{0}: reset: moving to HEAD~1\nd79d229 HEAD@{1}: commit: Explain weekly habits"
    lang: text
  see: [git-revert, head]
- id: remote-repository
  term: remote repository
  name: { uk: "віддалений репозиторій (remote)", en: "remote repository" }
  aliases: [remote, origin, bare repository]
  definition:
    uk: "Інша копія репозиторію, з якою твоя обмінюється commits; зазвичай її називають `origin`. Вона може бути на сервері (GitHub, GitLab) або просто в іншій теці на твоєму диску. Твої commits потрапляють туди лише після `git push`."
    en: "Another copy of the repository that yours exchanges commits with; it is usually called `origin`. It can be on a server (GitHub, GitLab) or simply in another folder on your disk. Your commits get there only after `git push`."
  see: [git-push, git-fetch]
- id: git-push
  term: git push
  name: { uk: "git push", en: "git push" }
  definition:
    uk: "Надсилання commits твоєї гілки у віддалений репозиторій і пересування там тієї самої гілки. До push твої commits існують лише у твоєму репозиторії."
    en: "Sending your branch’s commits to the remote repository and moving the same branch there. Until you push, your commits exist only in your repository."
  see: [remote-repository, git-fetch]
- id: git-fetch
  term: git fetch
  name: { uk: "git fetch", en: "git fetch" }
  definition:
    uk: "Завантаження нових commits з віддаленого репозиторію в гілки на кшталт `origin/main`. Твоя гілка й файли не змінюються; щоб узяти зміни до себе, їх потім зливають (`git merge origin/main`)."
    en: "Downloading new commits from the remote repository into branches such as `origin/main`. Your own branch and files do not change; to take the changes in, you merge them afterwards (`git merge origin/main`)."
  see: [remote-repository, git-push]
- id: pull-request
  term: pull request
  name: { uk: "pull request (PR)", en: "pull request (PR)" }
  aliases: [PR, merge request]
  definition:
    uk: "Запит на сервісі на кшталт GitHub: «влий мою гілку в main». Він показує diff, опис, результати тестів і місце для коментарів до рядків коду. Гілку вливають після review, коли рецензент схвалив зміни."
    en: "A request on a service such as GitHub: “merge my branch into main”. It shows the diff, a description, test results and a place for comments on lines of code. The branch is merged after review, once a reviewer has approved the change."
  see: [code-review, git-push]
- id: code-review
  term: code review
  name: { uk: "code review", en: "code review" }
  aliases: [review, approve, request changes]
  definition:
    uk: "Читання чужої зміни перед злиттям, щоб упіймати помилки й перевірити, що зміна робить те, що обіцяє. Корисний коментар називає дефект і вхід, на якому він видно, ставить питання про намір і пояснює рішення: approve (схвалити) чи request changes (попросити змін)."
    en: "Reading someone’s change before it is merged, to catch defects and check that it does what it promises. A useful comment names a defect and the input that shows it, asks about intent and explains the decision: approve or request changes."
  see: [pull-request, diff]
