# Terms introduced in RN-06.
- id: bundled-fixture
  term: bundled fixture
  name: { uk: "вбудована фікстура", en: "bundled fixture" }
  aliases: ["bundled fixtures", "вбудовані фікстури", "fixture data"]
  definition:
    uk: "Синтетичні записи, що постачаються всередині застосунку (у його пакеті) і читаються без мережі. Вони дають екранові дані одразу й ніколи не падають, тому годяться для першого запуску й для офлайну, але станів мережі — завантаження, помилок, тайм-аутів — самі не показують."
    en: "Synthetic records shipped inside the app (in its bundle) and read without a network. They give a screen data at once and never fail, so they suit a first run and offline use, but on their own they show no network states — loading, errors, timeouts."
  see: [test-fixture, mock-service]
- id: mock-service
  term: mock service
  name: { uk: "mock-сервіс", en: "mock service" }
  aliases: ["mock server", "мок-сервіс", "mock-service.mjs"]
  definition:
    uk: "Маленький HTTP-сервер з навмисно простим і незмінним контрактом, що віддає синтетичні дані й на замовлення відтворює збої (затримку, статус 503, мовчання). Він перевіряє клієнтську сторону — запит, адресу, розбір, стани, — але не замінює справжній бекенд з його адресою, HTTPS, входом і даними."
    en: "A small HTTP server with a deliberately simple, fixed contract that serves synthetic data and reproduces failures on request (a delay, status 503, silence). It checks the client side — the request, the address, the parsing, the states — but does not stand in for a real backend with its address, HTTPS, sign-in and data."
  see: [bundled-fixture]
- id: emulator-host-alias
  term: emulator host alias (10.0.2.2)
  name: { uk: "адреса комп’ютера з емулятора (10.0.2.2)", en: "emulator host alias (10.0.2.2)" }
  aliases: ["10.0.2.2", "host loopback alias"]
  definition:
    uk: "Особлива адреса в емуляторі Android, що веде на loopback комп’ютера, на якому емулятор працює. `localhost` в емуляторі — сам емулятор, тож сервіс на комп’ютері (`127.0.0.1:7310`) з емулятора видно як `10.0.2.2:7310`. На фізичному телефоні цієї адреси немає."
    en: "A special address in the Android emulator that leads to the loopback of the computer the emulator runs on. `localhost` in the emulator is the emulator itself, so a service on the computer (`127.0.0.1:7310`) is seen from the emulator as `10.0.2.2:7310`. A physical phone has no such address."
  see: [port-reverse, lan-address]
- id: port-reverse
  term: port reverse (adb reverse)
  name: { uk: "перенаправлення порту (adb reverse)", en: "port reverse (adb reverse)" }
  aliases: ["adb reverse", "reverse port forwarding"]
  definition:
    uk: "Команда `adb reverse tcp:7310 tcp:7310` змушує з’єднання з портом 7310 на Android-пристрої йти на порт 7310 комп’ютера через USB-підключення adb. Після неї `localhost:7310` на телефоні веде до сервісу на комп’ютері, і сервісу не треба відкриватися в мережу. Діє, доки пристрій під’єднаний."
    en: "The command `adb reverse tcp:7310 tcp:7310` makes connections to port 7310 on an Android device go to the computer's port 7310 over the adb USB connection. After it, `localhost:7310` on the phone leads to the service on the computer, and the service need not open up to the network. It lasts while the device stays connected."
  see: [emulator-host-alias]
- id: exponential-backoff
  term: exponential backoff
  name: { uk: "експоненційна пауза (exponential backoff)", en: "exponential backoff" }
  aliases: ["backoff", "пауза між спробами"]
  definition:
    uk: "Пауза перед повтором, що щоразу множиться — найчастіше подвоюється: 300 мс, 600 мс, 1200 мс. Разом з обмеженою кількістю спроб вона дає серверу, якому зараз погано, перепочити, замість лавини однакових запитів від усіх клієнтів одразу."
    en: "A pause before a retry that is multiplied each time — most often doubled: 300 ms, 600 ms, 1200 ms. Together with a bounded number of attempts it gives a struggling server room to recover instead of an avalanche of identical requests from every client at once."
  see: [bounded-retry]
- id: network-reachability
  term: network reachability
  name: { uk: "досяжність мережі", en: "network reachability" }
  aliases: ["isConnected", "isInternetReachable", "connectivity check", "перевірка зв’язку"]
  definition:
    uk: "Те, що операційна система знає про мережу пристрою: чи є з’єднання і чи, на її думку, доступний інтернет (наприклад, `isConnected` та `isInternetReachable` у `expo-network`). Це підказка, а не гарантія: «онлайн» не означає, що досяжний саме твій сервер, тому помилку запиту обробляють завжди."
    en: "What the operating system knows about the device's network: whether there is a connection and whether, in its view, the internet is reachable (for example, `isConnected` and `isInternetReachable` in `expo-network`). It is a hint, not a guarantee: “online” does not mean your server in particular is reachable, so a request's error is always handled."
  see: [mock-service]
- id: cleartext-traffic
  term: cleartext traffic
  name: { uk: "простий HTTP (cleartext traffic)", en: "cleartext traffic" }
  aliases: ["cleartext", "plain HTTP", "usesCleartextTraffic", "незашифрований трафік"]
  definition:
    uk: "Мережевий трафік без шифрування, тобто `http://` замість `https://`: усе, що йде мережею, можна прочитати й змінити дорогою. Android з версії 9 блокує його за замовчуванням, iOS обмежує через App Transport Security; виняток для локального хоста розробки роблять лише в debug-збірці."
    en: "Network traffic without encryption, that is `http://` instead of `https://`: everything on the wire can be read and changed on the way. Android blocks it by default since version 9, iOS restricts it through App Transport Security; an exception for the local development host is made only in a debug build."
  see: [network-security-config, app-transport-security]
- id: app-transport-security
  term: App Transport Security (ATS)
  name: { uk: "App Transport Security (ATS)", en: "App Transport Security (ATS)" }
  aliases: ["ATS", "NSAppTransportSecurity", "NSAllowsArbitraryLoads", "NSAllowsLocalNetworking"]
  definition:
    uk: "Політика iOS, що вимагає від застосунку HTTPS для звичайних доменних імен. Налаштовується ключем `NSAppTransportSecurity` в `Info.plist`: `NSAllowsArbitraryLoads` вимикає вимогу повністю (так не роблять), `NSAllowsLocalNetworking` дозволяє простий HTTP лише до локальних імен на кшталт `localhost` і `*.local`. Налаштування однакові для debug і release."
    en: "The iOS policy that requires an app to use HTTPS for ordinary domain names. It is configured with the `NSAppTransportSecurity` key in `Info.plist`: `NSAllowsArbitraryLoads` turns the requirement off completely (not done), `NSAllowsLocalNetworking` allows plain HTTP only to local names such as `localhost` and `*.local`. The settings are the same for debug and release."
  see: [cleartext-traffic]
- id: network-security-config
  term: network security configuration (Android)
  name: { uk: "мережева конфігурація безпеки (Android)", en: "network security configuration (Android)" }
  aliases: ["network_security_config.xml", "networkSecurityConfig", "cleartextTrafficPermitted", "domain-config"]
  definition:
    uk: "XML-файл застосунку Android (`res/xml/network_security_config.xml`, на який посилається маніфест), що задає мережеві правила: де дозволено простий HTTP (`cleartextTrafficPermitted`) і яким сертифікатам довіряти. Через `domain-config` виняток можна обмежити названими хостами, наприклад лише `10.0.2.2`, а поклавши файл у debug-частину проєкту — лише debug-збіркою."
    en: "An Android app's XML file (`res/xml/network_security_config.xml`, referenced from the manifest) that sets network rules: where plain HTTP is allowed (`cleartextTrafficPermitted`) and which certificates to trust. With `domain-config` an exception can be limited to named hosts, for example only `10.0.2.2`, and by placing the file in the project's debug part, to the debug build only."
  see: [cleartext-traffic]
- id: runtime-permission
  term: runtime permission
  name: { uk: "дозвіл під час роботи (runtime permission)", en: "runtime permission" }
  aliases: ["permission", "дозвіл", "requestPermission", "canAskAgain", "Linking.openSettings"]
  definition:
    uk: "Доступ до захищеної можливості (камера, геолокація, сповіщення), який користувач дає чи не дає в системному діалозі під час роботи застосунку і може відкликати в налаштуваннях будь-коли. Після остаточної відмови система діалогу більше не показує (`canAskAgain: false` у відповідях Expo) — лишаються лише налаштування."
    en: "Access to a protected capability (camera, location, notifications) that the user grants or refuses in a system dialog while the app runs, and can revoke in the settings at any time. After a final refusal the system no longer shows the dialog (`canAskAgain: false` in Expo's answers) — only the settings remain."
  see: [permission-rationale, capability-check]
- id: capability-check
  term: capability check
  name: { uk: "перевірка можливості", en: "capability check" }
  aliases: ["feature detection", "Platform.Version", "перевірка підтримки"]
  definition:
    uk: "Перевірка, чи є на пристрої й у цій версії системи те, що потрібно функції (камера, датчик, API певної версії ОС), до того як її пропонувати чи просити дозвіл. Якщо можливості немає, функцію ховають або пояснюють, а не показують кнопку, що не спрацює."
    en: "A check whether the device and this system version have what a feature needs (a camera, a sensor, an API of a given OS version) before the feature is offered or a permission is requested. If the capability is missing, the feature is hidden or explained rather than shown as a button that will not work."
  see: [runtime-permission]
- id: permission-rationale
  term: permission rationale
  name: { uk: "пояснення до дозволу", en: "permission rationale" }
  aliases: ["rationale", "shouldShowRequestPermissionRationale"]
  definition:
    uk: "Коротке пояснення в інтерфейсі застосунку, навіщо потрібен дозвіл, показане в момент використання функції — перед системним діалогом або після першої відмови. Людина, яка розуміє, навіщо камера, рідше відмовляє назавжди."
    en: "A short explanation in the app's own interface of why a permission is needed, shown at the moment the feature is used — before the system dialog or after a first refusal. A person who understands what the camera is for refuses permanently less often."
  see: [runtime-permission]
- id: lan-address
  term: LAN address
  name: { uk: "LAN-адреса", en: "LAN address" }
  aliases: ["local network address", "192.168.x.x", "адреса в локальній мережі"]
  definition:
    uk: "Адреса комп’ютера в локальній мережі (часто `192.168.…` чи `10.…`), за якою його бачать інші пристрої тієї самої Wi-Fi-мережі. Сервіс, що слухає лише loopback (`127.0.0.1`), за нею недоступний: його треба свідомо запустити на всіх інтерфейсах (`0.0.0.0`) — і тоді його бачать усі в мережі."
    en: "The computer's address in the local network (often `192.168.…` or `10.…`), by which other devices on the same Wi-Fi network see it. A service that listens only on loopback (`127.0.0.1`) is unreachable there: it must be deliberately started on all interfaces (`0.0.0.0`) — and then everyone on the network sees it."
  see: [emulator-host-alias]
