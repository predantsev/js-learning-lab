# Terms introduced in RN-06.
- id: bundled-fixture
  term: bundled fixture
  name: { uk: "вбудована фікстура", en: "bundled fixture" }
  aliases: ["bundled fixtures", "вбудовані фікстури", "fixture data"]
  definition:
    uk: "Синтетичні записи, що постачаються всередині застосунку (у його пакеті) і читаються без мережі. Вони дають екранові дані одразу й ніколи не падають, тому годяться для першого запуску й для офлайну, але станів мережі — завантаження, помилок, тайм-аутів — самі не показують."
    en: "Synthetic records shipped inside the app (in its bundle) and read without a network. They give a screen data at once and never fail, so they suit a first run and offline use, but on their own they show no network states — loading, errors, timeouts."
  see: [test-fixture, mock-service]
- id: mock-service
  term: mock service
  name: { uk: "mock-сервіс", en: "mock service" }
  aliases: ["mock server", "мок-сервіс", "mock-service.mjs"]
  definition:
    uk: "Маленький HTTP-сервер з навмисно простим і незмінним контрактом, що віддає синтетичні дані й на замовлення відтворює збої (затримку, статус 503, мовчання). Він перевіряє клієнтську сторону — запит, адресу, розбір, стани, — але не замінює справжній бекенд з його адресою, HTTPS, входом і даними."
    en: "A small HTTP server with a deliberately simple, fixed contract that serves synthetic data and reproduces failures on request (a delay, status 503, silence). It checks the client side — the request, the address, the parsing, the states — but does not stand in for a real backend with its address, HTTPS, sign-in and data."
  see: [bundled-fixture]
