# Terms introduced in RN-06.
- id: bundled-fixture
  term: bundled fixture
  name: { uk: "вбудована фікстура", en: "bundled fixture" }
  aliases: ["bundled fixtures", "вбудовані фікстури", "fixture data"]
  definition:
    uk: "Синтетичні записи, що постачаються всередині застосунку (у його пакеті) і читаються без мережі. Вони дають екранові дані одразу й ніколи не падають, тому годяться для першого запуску й для офлайну, але станів мережі — завантаження, помилок, тайм-аутів — самі не показують."
    en: "Synthetic records shipped inside the app (in its bundle) and read without a network. They give a screen data at once and never fail, so they suit a first run and offline use, but on their own they show no network states — loading, errors, timeouts."
  see: [test-fixture, mock-service]
- id: mock-service
  term: mock service
  name: { uk: "mock-сервіс", en: "mock service" }
  aliases: ["mock server", "мок-сервіс", "mock-service.mjs"]
  definition:
    uk: "Маленький HTTP-сервер з навмисно простим і незмінним контрактом, що віддає синтетичні дані й на замовлення відтворює збої (затримку, статус 503, мовчання). Він перевіряє клієнтську сторону — запит, адресу, розбір, стани, — але не замінює справжній бекенд з його адресою, HTTPS, входом і даними."
    en: "A small HTTP server with a deliberately simple, fixed contract that serves synthetic data and reproduces failures on request (a delay, status 503, silence). It checks the client side — the request, the address, the parsing, the states — but does not stand in for a real backend with its address, HTTPS, sign-in and data."
  see: [bundled-fixture]
- id: emulator-host-alias
  term: emulator host alias (10.0.2.2)
  name: { uk: "адреса комп’ютера з емулятора (10.0.2.2)", en: "emulator host alias (10.0.2.2)" }
  aliases: ["10.0.2.2", "host loopback alias"]
  definition:
    uk: "Особлива адреса в емуляторі Android, що веде на loopback комп’ютера, на якому емулятор працює. `localhost` в емуляторі — сам емулятор, тож сервіс на комп’ютері (`127.0.0.1:7310`) з емулятора видно як `10.0.2.2:7310`. На фізичному телефоні цієї адреси немає."
    en: "A special address in the Android emulator that leads to the loopback of the computer the emulator runs on. `localhost` in the emulator is the emulator itself, so a service on the computer (`127.0.0.1:7310`) is seen from the emulator as `10.0.2.2:7310`. A physical phone has no such address."
  see: [port-reverse, lan-address]
- id: port-reverse
  term: port reverse (adb reverse)
  name: { uk: "перенаправлення порту (adb reverse)", en: "port reverse (adb reverse)" }
  aliases: ["adb reverse", "reverse port forwarding"]
  definition:
    uk: "Команда `adb reverse tcp:7310 tcp:7310` змушує з’єднання з портом 7310 на Android-пристрої йти на порт 7310 комп’ютера через USB-підключення adb. Після неї `localhost:7310` на телефоні веде до сервісу на комп’ютері, і сервісу не треба відкриватися в мережу. Діє, доки пристрій під’єднаний."
    en: "The command `adb reverse tcp:7310 tcp:7310` makes connections to port 7310 on an Android device go to the computer's port 7310 over the adb USB connection. After it, `localhost:7310` on the phone leads to the service on the computer, and the service need not open up to the network. It lasts while the device stays connected."
  see: [emulator-host-alias]
- id: exponential-backoff
  term: exponential backoff
  name: { uk: "експоненційна пауза (exponential backoff)", en: "exponential backoff" }
  aliases: ["backoff", "пауза між спробами"]
  definition:
    uk: "Пауза перед повтором, що щоразу множиться — найчастіше подвоюється: 300 мс, 600 мс, 1200 мс. Разом з обмеженою кількістю спроб вона дає серверу, якому зараз погано, перепочити, замість лавини однакових запитів від усіх клієнтів одразу."
    en: "A pause before a retry that is multiplied each time — most often doubled: 300 ms, 600 ms, 1200 ms. Together with a bounded number of attempts it gives a struggling server room to recover instead of an avalanche of identical requests from every client at once."
  see: [bounded-retry]
- id: network-reachability
  term: network reachability
  name: { uk: "досяжність мережі", en: "network reachability" }
  aliases: ["isConnected", "isInternetReachable", "connectivity check", "перевірка зв’язку"]
  definition:
    uk: "Те, що операційна система знає про мережу пристрою: чи є з’єднання і чи, на її думку, доступний інтернет (наприклад, `isConnected` та `isInternetReachable` у `expo-network`). Це підказка, а не гарантія: «онлайн» не означає, що досяжний саме твій сервер, тому помилку запиту обробляють завжди."
    en: "What the operating system knows about the device's network: whether there is a connection and whether, in its view, the internet is reachable (for example, `isConnected` and `isInternetReachable` in `expo-network`). It is a hint, not a guarantee: “online” does not mean your server in particular is reachable, so a request's error is always handled."
  see: [mock-service]
- id: lan-address
  term: LAN address
  name: { uk: "LAN-адреса", en: "LAN address" }
  aliases: ["local network address", "192.168.x.x", "адреса в локальній мережі"]
  definition:
    uk: "Адреса комп’ютера в локальній мережі (часто `192.168.…` чи `10.…`), за якою його бачать інші пристрої тієї самої Wi-Fi-мережі. Сервіс, що слухає лише loopback (`127.0.0.1`), за нею недоступний: його треба свідомо запустити на всіх інтерфейсах (`0.0.0.0`) — і тоді його бачать усі в мережі."
    en: "The computer's address in the local network (often `192.168.…` or `10.…`), by which other devices on the same Wi-Fi network see it. A service that listens only on loopback (`127.0.0.1`) is unreachable there: it must be deliberately started on all interfaces (`0.0.0.0`) — and then everyone on the network sees it."
  see: [emulator-host-alias]
