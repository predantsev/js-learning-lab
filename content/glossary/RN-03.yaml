# Terms introduced in RN-03.
- id: platform-adapter
  term: platform adapter
  name: { uk: "платформний адаптер", en: "platform adapter" }
  aliases: ["адаптер платформи", "web adapter", "native adapter", "вебадаптер", "нативний адаптер"]
  definition:
    uk: "Реалізація контракту адаптера для однієї платформи: вебсховище над `localStorage`, нативне — над модулем «ключ — значення», форматування через `Intl`, годинник зі справжньою датою. Домен і hooks отримують адаптер параметром і викликають лише методи контракту, тож ту саму функцію можна запустити у вебі, на телефоні й у тесті з подвійником у пам’яті."
    en: "An implementation of an adapter contract for one platform: web storage over `localStorage`, native storage over a key-value module, formatting through `Intl`, a clock with the real date. The domain and the hooks receive the adapter as a parameter and call only the contract's methods, so the same function runs on the web, on a phone and in a test with an in-memory double."
  see: [adapter-contract, adapter, composition]
- id: adapter-contract
  term: adapter contract
  name: { uk: "контракт адаптера", en: "adapter contract" }
  aliases: ["StorageAdapter", "FormatAdapter", "ClockAdapter", "інтерфейс адаптера"]
  definition:
    uk: "Маленький інтерфейс (у TypeScript — `interface`), що описує, які методи має адаптер, що вони приймають і повертають, а також правила поведінки, яких не видно з типів: `getItem` незаписаного ключа дає `null`, дата — у форматі `YYYY-MM-DD`. Кожна реалізація мусить виконувати контракт, і одні й ті самі контрактні тести перевіряють їх усі."
    en: "A small interface (in TypeScript, an `interface`) that says which methods an adapter has, what they take and return, plus the behavior rules the types cannot show: `getItem` of a key that was never set gives `null`, a date is `YYYY-MM-DD`. Every implementation must honor the contract, and the same contract tests check all of them."
  example:
    code: |
      interface ClockAdapter {
        today(): string; // 'YYYY-MM-DD'
      }
  see: [platform-adapter, test-double]
- id: keyboard-type
  term: keyboardType
  name: { uk: "тип клавіатури (keyboardType)", en: "keyboard type (keyboardType)" }
  aliases: ["keyboardType", "inputMode", "decimal-pad", "number-pad", "email-address"]
  definition:
    uk: "Проп `TextInput`, що обирає, яку екранну клавіатуру показати: `default`, `number-pad`, `decimal-pad`, `numeric`, `email-address`, `phone-pad`, `url`. Він лише змінює вигляд клавіатури й нічого не перевіряє: текст однаково приходить рядком, і його треба розібрати та валідувати. Проп `inputMode` працює як HTML-атрибут `inputmode` і має перевагу над `keyboardType`."
    en: "A `TextInput` prop that chooses which on-screen keyboard to show: `default`, `number-pad`, `decimal-pad`, `numeric`, `email-address`, `phone-pad`, `url`. It only changes how the keyboard looks and validates nothing: the text still arrives as a string that must be parsed and validated. The `inputMode` prop works like the HTML `inputmode` attribute and takes precedence over `keyboardType`."
  see: [return-key-type, keyboard-dismiss]
- id: return-key-type
  term: returnKeyType
  name: { uk: "клавіша повернення (returnKeyType)", en: "return key type (returnKeyType)" }
  aliases: ["returnKeyType", "onSubmitEditing", "submitBehavior", "Enter key", "клавіша Enter"]
  definition:
    uk: "Проп `TextInput`, що задає підпис клавіші повернення на екранній клавіатурі (`next`, `done`, `go`, `search`, `send`). Сам він нічого не робить: дію при натисканні задає `onSubmitEditing` — наприклад, перевести фокус на наступне поле через його ref. Чи закриється при цьому клавіатура, вирішує `submitBehavior`."
    en: "A `TextInput` prop that sets the label of the return key on the on-screen keyboard (`next`, `done`, `go`, `search`, `send`). By itself it does nothing: the action on press is set by `onSubmitEditing` — for example, moving focus to the next field through its ref. Whether the keyboard closes on that is decided by `submitBehavior`."
  see: [keyboard-type, keyboard-dismiss]
- id: keyboard-dismiss
  term: Keyboard.dismiss
  name: { uk: "закриття клавіатури", en: "keyboard dismissal" }
  aliases: ["Keyboard.dismiss()", "keyboardShouldPersistTaps", "keyboardDismissMode", "сховати клавіатуру"]
  definition:
    uk: "Прибирання екранної клавіатури: `Keyboard.dismiss()` закриває її й знімає фокус із поля. Зазвичай її закривають після збереження й при дотику поза полем. `ScrollView` має для цього два пропси: `keyboardShouldPersistTaps` (чи доходить дотик до кнопки, поки клавіатура відкрита; `\"handled\"` — так) і `keyboardDismissMode` (`\"on-drag\"` закриває клавіатуру, коли користувач починає гортати)."
    en: "Removing the on-screen keyboard: `Keyboard.dismiss()` closes it and takes focus off the field. It is usually closed after a save and on a tap outside the field. `ScrollView` has two props for this: `keyboardShouldPersistTaps` (whether a tap reaches a button while the keyboard is open; `\"handled\"` — yes) and `keyboardDismissMode` (`\"on-drag\"` closes the keyboard when the user starts to scroll)."
  see: [keyboard-type, return-key-type]
- id: flatlist
  term: FlatList
  name: { uk: "FlatList", en: "FlatList" }
  aliases: ["VirtualizedList", "віртуалізований список", "virtualized list", "renderItem"]
  definition:
    uk: "Компонент React Native для довгих списків. Отримує масив `data`, функцію `renderItem` і `keyExtractor` і тримає змонтованими лише рядки у вікні рендеру навколо видимої частини; решту замінює порожнім місцем потрібної висоти. Спершу монтує `initialNumToRender` рядків (типово 10), далі вікно — до `windowSize` (типово 21) висот екрана. Внутрішній стан рядка губиться, коли рядок виходить із вікна, тож чернетки й позначки тримай у стані над списком."
    en: "A React Native component for long lists. It takes a `data` array, a `renderItem` function and a `keyExtractor`, and keeps mounted only the rows in a render window around the visible part, replacing the rest with empty space of the right height. It first mounts `initialNumToRender` rows (10 by default), then a window of up to `windowSize` (21 by default) screen heights. A row's internal state is lost when the row leaves the window, so keep drafts and marks in state above the list."
  see: [key-extractor, list-windowing]
- id: key-extractor
  term: keyExtractor
  name: { uk: "keyExtractor", en: "keyExtractor" }
  aliases: ["keyExtractor", "ключ рядка", "row key"]
  definition:
    uk: "Функція `(item, index) => string`, яку `FlatList` викликає для кожного рядка, щоб отримати його ключ React. Якщо її не передати, список бере `item.key`, потім `item.id`, а тоді — індекс. Ключ із `id` запису прив’язує стан рядка до запису; ключ-індекс прив’язує його до позиції, і після вставки чи видалення стан «переїжджає» до іншого запису."
    en: "A function `(item, index) => string` that `FlatList` calls for every row to get its React key. If you do not pass one, the list takes `item.key`, then `item.id`, then the index. A key from the record's `id` ties the row's state to the record; an index key ties it to the position, and after an insert or a delete the state “moves” to another record."
  see: [flatlist]
- id: pressable
  term: Pressable
  name: { uk: "Pressable", en: "Pressable" }
  aliases: ["onPress", "onPressIn", "onPressOut", "hitSlop", "android_ripple"]
  definition:
    uk: "Компонент React Native для всього, що натискають. Події йдуть у порядку `onPressIn` → `onPressOut` → `onPress` (або `onLongPress`, якщо тримати понад 500 мс). Проп `style` може бути функцією `({ pressed }) => …`, щоб показати натиснутий стан; `hitSlop` розширює зону дотику за межі видимого елемента, але не за межі батьківського view. Ролі кнопки сам не має — її задає `accessibilityRole` чи `role`."
    en: "The React Native component for anything that is pressed. Events go in the order `onPressIn` → `onPressOut` → `onPress` (or `onLongPress` when held for over 500 ms). The `style` prop can be a function `({ pressed }) => …` to show the pressed state; `hitSlop` extends the touch area beyond the visible element, but not beyond the parent view. It has no button role by itself — `accessibilityRole` or `role` sets it."
  see: [js-thread, ui-thread]
- id: js-thread
  term: JS thread
  name: { uk: "потік JS", en: "JS thread" }
  aliases: ["JavaScript thread", "потік JavaScript"]
  definition:
    uk: "Потік застосунку React Native, у якому виконується весь твій JavaScript: обробники подій, рендер React, логіка, запити. Він один, тож довга синхронна робота в будь-якому обробнику затримує все інше на JS: реакцію інших кнопок, натиснутий стиль, що залежить від стану, наступні рендери. Нативна прокрутка й малювання йдуть в іншому потоці й тим часом працюють далі."
    en: "The React Native app thread where all of your JavaScript runs: event handlers, React rendering, logic, requests. There is one, so long synchronous work in any handler delays everything else on JS: other buttons' reactions, a pressed style that depends on state, the next renders. Native scrolling and drawing run on another thread and keep working meanwhile."
  see: [ui-thread, event-loop]
- id: ui-thread
  term: UI thread
  name: { uk: "потік UI", en: "UI thread" }
  aliases: ["main thread", "головний потік", "native UI thread"]
  definition:
    uk: "Головний потік нативного застосунку: він малює view, прокручує `ScrollView` і `FlatList`, виконує нативні анімації й отримує сирі дотики. Він не чекає на JavaScript, тож список гортається, навіть коли потік JS зайнятий; а от реакція на дотик, яку задає твій код, чекає, доки JS звільниться. У браузері твій JavaScript і більша частина роботи сторінки ділять один головний потік."
    en: "The native app's main thread: it draws the views, scrolls `ScrollView` and `FlatList`, runs native animations and receives the raw touches. It does not wait for JavaScript, so a list keeps scrolling even while the JS thread is busy; but a touch reaction defined by your code waits until JS is free. In a browser your JavaScript and most of the page's work share one main thread."
  see: [js-thread]
