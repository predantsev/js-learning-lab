# Terms introduced in RN-07.
- id: native-log
  term: native log (device log)
  name: { uk: "native-журнал (журнал пристрою)", en: "native log (device log)" }
  aliases: ["device log", "журнал пристрою", "system log"]
  definition:
    uk: "Журнал операційної системи телефона чи емулятора: туди пишуть native-код застосунку, бібліотеки й сама система. Падіння native-коду, примусове завершення процесу й системні відмови видно саме тут, навіть коли консоль JavaScript мовчить. На Android його читають через Logcat, на iOS — у консолі Xcode або в програмі Console на Mac."
    en: "The log of the phone's or emulator's operating system: the app's native code, its libraries and the system itself write there. A native crash, a killed process and system refusals show up here even when the JavaScript console is silent. On Android it is read through Logcat, on iOS in the Xcode console or the Console app on a Mac."
  see: [logcat, build-log]
- id: build-log
  term: build log
  name: { uk: "журнал збирання", en: "build log" }
  aliases: ["Gradle log", "Xcode build log", "журнал Gradle"]
  definition:
    uk: "Вивід інструмента, що збирає native-застосунок: Gradle для Android, Xcode для iOS. Він довгий, а збій зазвичай описано двічі: спершу конкретною помилкою з файлом чи налаштуванням, а наприкінці — загальним «збирання не вдалося». Причину шукають у **першому** повідомленні про помилку, а не в останньому червоному рядку."
    en: "The output of the tool that builds a native app: Gradle for Android, Xcode for iOS. It is long, and a failure is usually described twice: first as a specific error naming a file or a setting, and at the end as a general “the build failed”. The cause is found in the **first** error message, not in the last red line."
  see: [native-log]
- id: logcat
  term: Logcat
  name: { uk: "Logcat", en: "Logcat" }
  aliases: ["adb logcat", "logcat"]
  definition:
    uk: "Журнал пристрою Android. Його показує вікно Logcat в Android Studio або команда `adb logcat` у терміналі; кожен рядок має рівень (`E` — помилка, `W` — попередження), тег і текст. Падіння Java/Kotlin-коду записується рядками `FATAL EXCEPTION` від тегу `AndroidRuntime`."
    en: "The device log of Android. The Logcat window in Android Studio or the command `adb logcat` in a terminal shows it; every line has a level (`E` for error, `W` for warning), a tag and text. A crash of Java/Kotlin code is written as `FATAL EXCEPTION` lines from the `AndroidRuntime` tag."
  see: [native-log]
- id: type-level-test
  term: type-level test
  name: { uk: "тест на рівні типів", en: "type-level test" }
  aliases: ["type test", "@ts-expect-error test"]
  definition:
    uk: "Перевірка, яку робить компілятор TypeScript, а не запуск: файл з `// @ts-expect-error` над рядком, що **має** бути помилкою типу. Якщо `tsc --noEmit` помилки там не знаходить, він сам повідомляє `Unused '@ts-expect-error' directive`. Такий тест доводить, що типи відкидають погані значення в коді, але нічого не каже про дані, які прийдуть під час виконання (збережений JSON, відповідь сервера)."
    en: "A check done by the TypeScript compiler rather than by running: a file with `// @ts-expect-error` above a line that **must** be a type error. If `tsc --noEmit` finds no error there, it reports `Unused '@ts-expect-error' directive` itself. Such a test proves the types reject bad values in code, but says nothing about data arriving at run time (stored JSON, a server response)."
  see: [runtime-validation, tsc]
- id: native-component-test
  term: native component test
  name: { uk: "компонентний тест native-екрана", en: "native component test" }
  aliases: ["component test", "компонентний тест", "React Native Testing Library test"]
  definition:
    uk: "Тест, що показує React Native-компонент у Node.js (Jest з React Native Testing Library), знаходить елементи за роллю, доступною назвою чи текстом, діє як користувач і перевіряє видиме. Він працює на комп’ютері з деревом host-компонентів (`View`, `Text`) і **не** запускає native-код iOS чи Android: native-рендеринг, жести й поведінку системи він не доводить."
    en: "A test that renders a React Native component in Node.js (Jest with React Native Testing Library), finds elements by role, accessible label or text, acts like a user and checks what is visible. It runs on the computer with a tree of host components (`View`, `Text`) and does **not** run the iOS or Android native code: it proves neither native rendering, gestures nor system behavior."
  see: [user-action-test, device-check]
- id: mock-gap
  term: mock gap
  name: { uk: "прогалина mock", en: "mock gap" }
  aliases: ["mock-only gap", "прогалина моку"]
  definition:
    uk: "Твердження про поведінку застосунку, яке тест із підробленим native-модулем не може довести, бо підробка поводиться так, як її написали, а не так, як справжній модуль на пристрої: чи значення лишиться після перезапуску, що станеться, коли телефон заблоковано, як відповість система. Кожну таку прогалину записують як перевірку на пристрої."
    en: "A claim about the app's behavior that a test with a faked native module cannot prove, because the fake behaves as it was written, not as the real module on a device does: whether a value survives a restart, what happens while the phone is locked, how the system answers. Each such gap is written down as a device check."
  see: [device-check, mock]
- id: device-check
  term: device check
  name: { uk: "перевірка на пристрої", en: "device check" }
  aliases: ["target check", "перевірка на цілі"]
  definition:
    uk: "Перевірка, яку виконують на заявленій цілі (емуляторі, симуляторі чи телефоні), а не в Jest: вона називає дію, ціль і очікуване спостереження («закрити застосунок, відкрити знову — справа досі виконана») і закінчується записаним результатом. Якщо цілі немає, перевірку записують як не виконану, а не викидають з плану."
    en: "A check performed on the declared target (an emulator, a simulator or a phone) rather than in Jest: it names an action, the target and the expected observation (“close the app, open it again — the task is still done”) and ends with a recorded result. Without a target the check is recorded as not performed, not dropped from the plan."
  see: [mock-gap, declared-target]
- id: native-crash
  term: native crash
  name: { uk: "native-падіння", en: "native crash" }
  aliases: ["native exception", "падіння native-коду"]
  definition:
    uk: "Завершення процесу застосунку через необроблену помилку в native-коді (Java/Kotlin на Android, Swift/Objective-C на iOS). У release-збірці застосунок зникає з екрана без червоного екрана React Native (debug-збірка може показати виняток native-модуля, щойно викликаного з JavaScript, на червоному екрані), консоль JavaScript може нічого не показати, а причина лишається в журналі пристрою та у звіті про падіння."
    en: "The app's process ending because of an unhandled error in native code (Java/Kotlin on Android, Swift/Objective-C on iOS). In a release build the app vanishes from the screen without React Native’s red screen (a debug build may show an exception of a native module JavaScript has just called on the red screen), the JavaScript console may show nothing, and the cause stays in the device log and in the crash report."
  see: [crash-report, native-log]
- id: symbolication
  term: symbolication
  name: { uk: "символізація", en: "symbolication" }
  aliases: ["symbolicate", "символізувати"]
  definition:
    uk: "Перетворення адрес і позицій у зібраному коді (рядок 1, стовпчик 184533 мініфікованого bundle; адреса в native-бінарнику) назад у назви функцій, файли й рядки джерельного коду. Для JavaScript це робить source map, для native-коду — файли символів (dSYM на iOS, mapping-файл на Android). Карта має бути саме від тієї збірки, з якої прийшов стек."
    en: "Turning addresses and positions in built code (line 1, column 184533 of a minified bundle; an address in a native binary) back into function names, files and source lines. For JavaScript a source map does it, for native code symbol files do (a dSYM on iOS, a mapping file on Android). The map must come from exactly the build the stack came from."
  see: [source-map, crash-report]
- id: crash-report
  term: crash report
  name: { uk: "звіт про падіння", en: "crash report" }
  aliases: ["crash log", "звіт про збій"]
  definition:
    uk: "Запис, який система чи інструмент звітів робить, коли застосунок падає: тип помилки, повідомлення, стек викликів на момент падіння, версія застосунку й пристрою. З нього відтворюють кроки, що ведуть до падіння, і знаходять перший кадр стека з власного коду."
    en: "The record a system or a reporting tool makes when an app crashes: the error type, the message, the call stack at the moment of the crash, the app and device versions. From it you reproduce the steps that lead to the crash and find the first stack frame from your own code."
  see: [symbolication, native-crash, stack-trace]
- id: platform-coverage-matrix
  term: platform coverage matrix
  name: { uk: "матриця покриття платформ", en: "platform coverage matrix" }
  aliases: ["coverage matrix", "матриця покриття"]
  definition:
    uk: "Таблиця, де рядки — функції застосунку, а стовпчики — середовища перевірки: заявлена ціль, інша платформа, Jest на комп’ютері. У кожній клітинці — перевірено, наданий доказ або не виконано (із записом про пропуск). Вона показує, що зелені тести в Jest не заповнюють жодного стовпчика пристрою."
    en: "A table whose rows are the app's features and whose columns are the places it is checked: the declared target, the other platform, Jest on the computer. Each cell says verified, supplied evidence or not performed (with a skip record). It shows that green tests in Jest fill no device column."
  see: [device-check, end-to-end-test]
