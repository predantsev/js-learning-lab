# Terms introduced in RE-05. One file per unit keeps parallel authoring conflict-free.
- id: route
  term: route
  name: { uk: "маршрут", en: "route" }
  definition:
    uk: "Пара «шлях в URL → екран»: коли поточна адреса підходить до шляху маршруту, застосунок показує його екран. Список маршрутів — таблиця маршрутів; її перебирають згори вниз, і перший збіг вирішує, що показати."
    en: "A pair “URL path → screen”: when the current address fits a route's path, the app shows that route's screen. A list of routes is a route table; it is checked from top to bottom, and the first match decides what is shown."
  see: [client-side-routing]
  example:
    lang: jsx
    code: "const routes = [\n  { path: \"/habits\", element: <HabitList /> },\n  { path: \"*\", element: <Missing /> },\n];"
- id: client-side-routing
  term: client-side routing
  name: { uk: "маршрутизація на боці клієнта", en: "client-side routing" }
  definition:
    uk: "Перехід між екранами без завантаження нової сторінки: обробник кліку по посиланню скасовує завантаження, код сам показує інший екран і додає запис в історію вкладки. Стан застосунку переживає перехід."
    en: "Moving between screens without loading a new page: the link's click handler cancels the load, the code shows another screen itself and adds an entry to the tab's history. The app's state survives the transition."
  aliases: ["client-side navigation", "клієнтська маршрутизація"]
  see: [route, history-entry]
- id: history-entry
  term: history entry
  name: { uk: "запис історії", en: "history entry" }
  definition:
    uk: "Одна адреса в стосі історії вкладки. `push` додає запис після поточного (і відрізає записи попереду), `replace` переписує поточний, а «Назад» і «Вперед» лише пересувають позначку поточного запису."
    en: "One address in a tab's history stack. `push` adds an entry after the current one (and cuts off the entries ahead), `replace` rewrites the current one, and Back and Forward only move the current-entry mark."
  see: [client-side-routing]
- id: route-param
  term: route parameter
  name: { uk: "параметр маршруту", en: "route parameter" }
  definition:
    uk: "Сегмент шляху маршруту з двокрапкою, як `:id` у `/tasks/:id`. Він підходить до будь-якого одного сегмента адреси, а екран читає декодований текст цього сегмента через `useParams()`. Це лише текст: запис за ним ще треба знайти й обробити випадок, коли його немає."
    en: "A segment of a route's path with a colon, like `:id` in `/tasks/:id`. It fits any single segment of the address, and the screen reads that segment's decoded text with `useParams()`. It is only text: the record still has to be looked up, and the case where it does not exist handled."
  aliases: ["route param", "URL parameter"]
  see: [route]
- id: nested-route
  term: nested route
  name: { uk: "вкладений маршрут", en: "nested route" }
  definition:
    uk: "Маршрут, оголошений у `children` іншого маршруту. Його шлях дописується до шляху батька, а екран з’являється в `<Outlet />` батьківського макета. Поки батьківський збіг не змінюється, макет лишається змонтованим зі своїм станом."
    en: "A route declared in another route's `children`. Its path is appended to the parent's path, and its screen appears in the parent layout's `<Outlet />`. As long as the parent match does not change, the layout stays mounted with its state."
  see: [route, route-param]
  example:
    lang: jsx
    code: "{ path: \"/habits\", element: <HabitsLayout />, children: [\n  { path: \"\", element: <PickHabit /> },\n  { path: \":id\", element: <HabitDetail /> },\n] }"
- id: uncontrolled-input
  term: uncontrolled input
  name: { uk: "некероване поле", en: "uncontrolled input" }
  definition:
    uk: "Поле форми, чиє значення тримає сам DOM, а не стан React. React задає лише початкове значення через `defaultValue` (чи `defaultChecked`), а код читає остаточне під час надсилання — наприклад, через `FormData`. Зміна `defaultValue` у вже змонтованого поля нічого не змінює; новий початок дає лише нове поле, наприклад з іншим `key`."
    en: "A form field whose value is held by the DOM itself, not by React state. React only sets the starting value through `defaultValue` (or `defaultChecked`), and the code reads the final one on submit — for example with `FormData`. Changing `defaultValue` on a field that is already mounted changes nothing; only a new field, for example with another `key`, starts over."
  see: [controlled-input]
  example:
    lang: jsx
    code: "<form onSubmit={(event) => {\n  event.preventDefault();\n  console.log(new FormData(event.currentTarget).get(\"label\"));\n}}>\n  <input name=\"label\" defaultValue={expense.label} />\n</form>"
- id: field-error
  term: field error
  name: { uk: "помилка поля", en: "field error" }
  definition:
    uk: "Повідомлення про те, що не так зі значенням одного поля, показане поруч із ним. Щоб його почули, поле отримує `aria-invalid=\"true\"` і `aria-describedby` з `id` елемента повідомлення: тоді програма екранного читання скаже стан і текст помилки, щойно поле отримає фокус."
    en: "A message about what is wrong with one field's value, shown next to it. To be heard, the field gets `aria-invalid=\"true\"` and an `aria-describedby` with the message element's `id`: then a screen reader says the state and the error text as soon as the field gets focus."
  see: [inline-validation, error-summary]
- id: error-summary
  term: error summary
  name: { uk: "зведення помилок", en: "error summary" }
  definition:
    uk: "Блок угорі форми, що з’являється після невдалого надсилання: заголовок і посилання на кожне недійсне поле. Фокус переходить на нього (`tabIndex={-1}` і `focus()` після commit), тож людина одразу чує, що форму не збережено, і може перейти до потрібного поля."
    en: "A block at the top of a form that appears after a failed submit: a heading and a link to every invalid field. Focus moves to it (`tabIndex={-1}` and `focus()` after the commit), so the person hears at once that the form was not saved and can jump to the right field."
  see: [field-error]
- id: route-focus
  term: route focus
  name: { uk: "фокус маршруту", en: "route focus" }
  definition:
    uk: "Те, що застосунок робить після кожного переходу на боці клієнта замість браузера: оновлює `document.title` і переводить фокус на заголовок нового екрана (`tabIndex={-1}`, `focus()` після commit). Без цього програма екранного читання не дізнається про перехід, а фокус може впасти на `body`."
    en: "What the app does after every client-side transition in place of the browser: it updates `document.title` and moves focus to the new screen's heading (`tabIndex={-1}`, `focus()` after the commit). Without it a screen reader never learns about the transition, and focus may fall to `body`."
  see: [client-side-routing, focus-management]
- id: unsaved-changes-guard
  term: unsaved changes guard
  name: { uk: "охорона незбережених змін", en: "unsaved changes guard" }
  definition:
    uk: "Захист чернетки від випадкового виходу: поки чернетка відрізняється від збереженого запису, переходи всередині застосунку чекають підтвердження, а слухач `beforeunload` просить браузер попередити перед перезавантаженням чи закриттям вкладки. Без змін охорона мовчить."
    en: "Protection of a draft from leaving by accident: while the draft differs from the saved record, transitions inside the app wait for a confirmation, and a `beforeunload` listener asks the browser to warn before a reload or tab close. With no edits the guard stays silent."
  aliases: ["unsaved changes warning", "dirty-form guard"]
  see: [route-focus]
- id: screen-status
  term: screen status
  name: { uk: "стан екрана", en: "screen status" }
  definition:
    uk: "Одне значення, що описує, у якій ситуації зараз екран з даними: завантаження, порожньо, помилка чи готово. Його тип — розмічене об’єднання, тож неможливі суперечливі комбінації на зразок «помилка разом зі старим списком», а кожен стан має власні слова й наступну дію."
    en: "One value that says which situation a data screen is in right now: loading, empty, error or ready. Its type is a discriminated union, so contradictory combinations such as “an error together with an old list” are impossible, and each status has its own words and next action."
  see: [discriminated-union, loading-state, live-region]
  example:
    lang: ts
    code: "type HabitsStatus =\n  | { kind: \"loading\" }\n  | { kind: \"empty\" }\n  | { kind: \"error\" }\n  | { kind: \"ready\"; habits: Habit[] };"
- id: error-boundary
  term: error boundary
  name: { uk: "error boundary", en: "error boundary" }
  definition:
    uk: "Компонент-клас зі статичним методом `getDerivedStateFromError`, який перехоплює помилки, кинуті під час рендеру й в ефектах його дочірніх компонентів, і показує замість них запасний інтерфейс. Помилок в обробниках подій, таймерах, колбеках промісів і у власному рендері він не бачить — там потрібні `try`/`catch` і стан помилки."
    en: "A class component with a static `getDerivedStateFromError` method that catches errors thrown during render and in effects of its child components and shows a fallback in their place. It does not see errors in event handlers, timers, promise callbacks or its own render — those need `try`/`catch` and error state."
  aliases: ["межа помилок", "error boundaries"]
  see: [fallback-ui]
- id: fallback-ui
  term: fallback UI
  name: { uk: "запасний інтерфейс", en: "fallback UI" }
  definition:
    uk: "Те, що error boundary показує замість дітей, які не змогли відрендеритися: коротке пояснення (часто з `role=\"alert\"`) і дія відновлення, наприклад «Спробувати ще раз», що очищає помилку в стані boundary."
    en: "What an error boundary shows instead of children that failed to render: a short explanation (often with `role=\"alert\"`) and a recovery action, for example “Try again”, which clears the error in the boundary's state."
  aliases: ["fallback"]
  see: [error-boundary]
