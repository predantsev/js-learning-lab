# Terms introduced in RE-05. One file per unit keeps parallel authoring conflict-free.
- id: route
  term: route
  name: { uk: "маршрут", en: "route" }
  definition:
    uk: "Пара «шлях в URL → екран»: коли поточна адреса підходить до шляху маршруту, застосунок показує його екран. Список маршрутів — таблиця маршрутів; її перебирають згори вниз, і перший збіг вирішує, що показати."
    en: "A pair “URL path → screen”: when the current address fits a route's path, the app shows that route's screen. A list of routes is a route table; it is checked from top to bottom, and the first match decides what is shown."
  see: [client-side-routing]
  example:
    lang: jsx
    code: "const routes = [\n  { path: \"/habits\", element: <HabitList /> },\n  { path: \"*\", element: <Missing /> },\n];"
- id: client-side-routing
  term: client-side routing
  name: { uk: "маршрутизація на боці клієнта", en: "client-side routing" }
  definition:
    uk: "Перехід між екранами без завантаження нової сторінки: обробник кліку по посиланню скасовує завантаження, код сам показує інший екран і додає запис в історію вкладки. Стан застосунку переживає перехід."
    en: "Moving between screens without loading a new page: the link's click handler cancels the load, the code shows another screen itself and adds an entry to the tab's history. The app's state survives the transition."
  aliases: ["client-side navigation", "клієнтська маршрутизація"]
  see: [route, history-entry]
- id: history-entry
  term: history entry
  name: { uk: "запис історії", en: "history entry" }
  definition:
    uk: "Одна адреса в стосі історії вкладки. `push` додає запис після поточного (і відрізає записи попереду), `replace` переписує поточний, а «Назад» і «Вперед» лише пересувають позначку поточного запису."
    en: "One address in a tab's history stack. `push` adds an entry after the current one (and cuts off the entries ahead), `replace` rewrites the current one, and Back and Forward only move the current-entry mark."
  see: [client-side-routing]
- id: route-param
  term: route parameter
  name: { uk: "параметр маршруту", en: "route parameter" }
  definition:
    uk: "Сегмент шляху маршруту з двокрапкою, як `:id` у `/tasks/:id`. Він підходить до будь-якого одного сегмента адреси, а екран читає декодований текст цього сегмента через `useParams()`. Це лише текст: запис за ним ще треба знайти й обробити випадок, коли його немає."
    en: "A segment of a route's path with a colon, like `:id` in `/tasks/:id`. It fits any single segment of the address, and the screen reads that segment's decoded text with `useParams()`. It is only text: the record still has to be looked up, and the case where it does not exist handled."
  aliases: ["route param", "URL parameter"]
  see: [route]
- id: nested-route
  term: nested route
  name: { uk: "вкладений маршрут", en: "nested route" }
  definition:
    uk: "Маршрут, оголошений у `children` іншого маршруту. Його шлях дописується до шляху батька, а екран з’являється в `<Outlet />` батьківського макета. Поки батьківський збіг не змінюється, макет лишається змонтованим зі своїм станом."
    en: "A route declared in another route's `children`. Its path is appended to the parent's path, and its screen appears in the parent layout's `<Outlet />`. As long as the parent match does not change, the layout stays mounted with its state."
  see: [route, route-param]
  example:
    lang: jsx
    code: "{ path: \"/habits\", element: <HabitsLayout />, children: [\n  { path: \"\", element: <PickHabit /> },\n  { path: \":id\", element: <HabitDetail /> },\n] }"
- id: uncontrolled-input
  term: uncontrolled input
  name: { uk: "некероване поле", en: "uncontrolled input" }
  definition:
    uk: "Поле форми, чиє значення тримає сам DOM, а не стан React. React задає лише початкове значення через `defaultValue` (чи `defaultChecked`), а код читає остаточне під час надсилання — наприклад, через `FormData`. Зміна `defaultValue` у вже змонтованого поля нічого не змінює; новий початок дає лише нове поле, наприклад з іншим `key`."
    en: "A form field whose value is held by the DOM itself, not by React state. React only sets the starting value through `defaultValue` (or `defaultChecked`), and the code reads the final one on submit — for example with `FormData`. Changing `defaultValue` on a field that is already mounted changes nothing; only a new field, for example with another `key`, starts over."
  see: [controlled-input]
  example:
    lang: jsx
    code: "<form onSubmit={(event) => {\n  event.preventDefault();\n  console.log(new FormData(event.currentTarget).get(\"label\"));\n}}>\n  <input name=\"label\" defaultValue={expense.label} />\n</form>"
