# Terms introduced in RE-05. One file per unit keeps parallel authoring conflict-free.
- id: route
  term: route
  name: { uk: "маршрут", en: "route" }
  definition:
    uk: "Пара «шлях в URL → екран»: коли поточна адреса підходить до шляху маршруту, застосунок показує його екран. Список маршрутів — таблиця маршрутів; її перебирають згори вниз, і перший збіг вирішує, що показати."
    en: "A pair “URL path → screen”: when the current address fits a route's path, the app shows that route's screen. A list of routes is a route table; it is checked from top to bottom, and the first match decides what is shown."
  see: [client-side-routing]
  example:
    lang: jsx
    code: "const routes = [\n  { path: \"/habits\", element: <HabitList /> },\n  { path: \"*\", element: <Missing /> },\n];"
- id: client-side-routing
  term: client-side routing
  name: { uk: "маршрутизація на боці клієнта", en: "client-side routing" }
  definition:
    uk: "Перехід між екранами без завантаження нової сторінки: обробник кліку по посиланню скасовує завантаження, код сам показує інший екран і додає запис в історію вкладки. Стан застосунку переживає перехід."
    en: "Moving between screens without loading a new page: the link's click handler cancels the load, the code shows another screen itself and adds an entry to the tab's history. The app's state survives the transition."
  aliases: ["client-side navigation", "клієнтська маршрутизація"]
  see: [route, history-entry]
- id: history-entry
  term: history entry
  name: { uk: "запис історії", en: "history entry" }
  definition:
    uk: "Одна адреса в стосі історії вкладки. `push` додає запис після поточного (і відрізає записи попереду), `replace` переписує поточний, а «Назад» і «Вперед» лише пересувають позначку поточного запису."
    en: "One address in a tab's history stack. `push` adds an entry after the current one (and cuts off the entries ahead), `replace` rewrites the current one, and Back and Forward only move the current-entry mark."
  see: [client-side-routing]
