# Terms introduced in JS-17. One file per unit keeps parallel authoring conflict-free.
- id: lifo-stack
  term: stack (LIFO)
  name: { uk: "стек (LIFO)", en: "stack (LIFO)" }
  aliases: [stack, LIFO, last in first out]
  definition:
    uk: "Структура, з якої першим виходить елемент, доданий останнім (last in, first out). У JavaScript це масив, у який додають `push` і з якого забирають `pop` — обидва з кінця. Так працюють «скасувати» й обхід дерева вглиб."
    en: "A structure from which the item added last leaves first (last in, first out). In JavaScript it is an array you add to with `push` and take from with `pop` — both at the end. “Undo” and a depth-first tree walk work this way."
  see: [fifo-queue, depth-first-traversal, call-stack]
  example:
    code: "const plates = [\"red\", \"blue\"];\nplates.push(\"green\");\nplates.pop(); // \"green\" — the last one in"
- id: fifo-queue
  term: queue (FIFO)
  name: { uk: "черга (FIFO)", en: "queue (FIFO)" }
  aliases: [queue, FIFO, first in first out]
  definition:
    uk: "Структура, з якої першим виходить елемент, доданий першим (first in, first out). У JavaScript найпростіше — масив із `push` у кінець і `shift` з початку. `shift` зсуває решту масиву, тож для дуже довгих черг краще тримати індекс голови — скільки це коштує, варто виміряти."
    en: "A structure from which the item added first leaves first (first in, first out). In JavaScript the simplest one is an array with `push` at the end and `shift` from the start. `shift` moves the rest of the array, so for very long queues a head index is better — how much that matters is worth measuring."
  see: [lifo-stack, breadth-first-traversal]
  example:
    code: "const line = [\"Ann\", \"Bo\"];\nline.push(\"Cy\");\nline.shift(); // \"Ann\" — the first one in"
- id: depth-first-traversal
  term: depth-first traversal
  name: { uk: "обхід углиб", en: "depth-first traversal" }
  aliases: [depth-first, DFS]
  definition:
    uk: "Обхід дерева, який проходить одну гілку до самого кінця, перш ніж перейти до сусідньої. Його дає стек — явний або стек викликів рекурсії."
    en: "A tree walk that follows one branch to its very end before moving to the next one. A stack gives it — an explicit one or the call stack of a recursion."
  see: [breadth-first-traversal, lifo-stack, recursion]
- id: breadth-first-traversal
  term: breadth-first traversal
  name: { uk: "обхід ушир", en: "breadth-first traversal" }
  aliases: [breadth-first, BFS, level order]
  definition:
    uk: "Обхід дерева рівнями: спершу всі вузли, найближчі до кореня, потім наступний рівень. Його дає черга: діти стають у кінець і чекають, доки вийдуть усі вузли попереднього рівня."
    en: "A tree walk level by level: all nodes nearest to the root first, then the next level. A queue gives it: children join the end and wait until every node of the previous level has left."
  see: [depth-first-traversal, fifo-queue]
- id: big-o
  term: Big-O notation
  name: { uk: "запис Big-O", en: "Big-O notation" }
  aliases: [Big-O, O-notation, asymptotic complexity]
  definition:
    uk: "Короткий запис того, як росте кількість кроків (або додаткової пам’яті), коли росте розмір даних `n`: O(1) — не залежить від `n`, O(n) — росте разом із `n`, O(n²) — у квадраті. Сталі множники й дрібні доданки відкидають, тож Big-O описує ріст, а не мілісекунди."
    en: "A short way to write how the number of steps (or of extra memory) grows when the data size `n` grows: O(1) — independent of `n`, O(n) — grows with `n`, O(n²) — with its square. Constant factors and small terms are dropped, so Big-O describes growth, not milliseconds."
  see: [time-complexity, space-complexity, micro-benchmark]
- id: micro-benchmark
  term: micro-benchmark
  name: { uk: "мікробенчмарк", en: "micro-benchmark" }
  aliases: [benchmark]
  definition:
    uk: "Вимірювання часу одного невеликого шматка коду. Чесний мікробенчмарк міряє кілька розмірів даних, повторює кожен замір і бере медіану, а розмір даних записує поруч із результатом — бо крок таймера, розігрів рушія й інша робота машини змінюють окремий замір."
    en: "A timing of one small piece of code. An honest micro-benchmark measures several data sizes, repeats every measurement and takes the median, and records the data size next to the result — because the timer’s step, the engine’s warm-up and other work on the machine change a single measurement."
  see: [big-o]
- id: depth-limit
  term: depth limit
  name: { uk: "межа глибини", en: "depth limit" }
  aliases: [maxDepth, maximum depth]
  definition:
    uk: "Найбільша кількість рівнів, яку обхід вкладених даних готовий пройти. Коли рівень більший за межу, код кидає зрозумілу помилку з назвою вузла замість того, щоб чекати переповнення стеку викликів."
    en: "The largest number of levels a walk over nested data is willing to go through. When the level is greater than the limit, the code throws a clear error naming the node instead of waiting for the call stack to overflow."
  see: [cycle-detection, stack-overflow]
- id: cycle-detection
  term: cycle detection
  name: { uk: "виявлення циклу", en: "cycle detection" }
  definition:
    uk: "Перевірка, чи обхід не прийшов удруге до вузла, де вже був. Зазвичай `id` відвіданих вузлів тримають у `Set`: якщо `id` вже там, дані посилаються самі на себе, і обхід зупиняється з помилкою замість ходити по колу."
    en: "A check that a walk has not come back to a node it already visited. Usually the `id`s of visited nodes are kept in a `Set`: if an `id` is already there, the data points back to itself, and the walk stops with an error instead of going round in circles."
  see: [depth-limit, set-collection]
- id: explicit-stack
  term: explicit stack
  name: { uk: "явний стек", en: "explicit stack" }
  definition:
    uk: "Масив, у якому обхід сам тримає вузли, що чекають, замість рекурсивних викликів. Стек викликів лишається пласким, тож глибина обмежена лише пам’яттю, але від циклів у даних явний стек не захищає."
    en: "An array in which a walk keeps the waiting nodes itself instead of making recursive calls. The call stack stays flat, so depth is limited only by memory, but an explicit stack gives no protection against cycles in the data."
  see: [lifo-stack, depth-first-traversal, call-stack]
- id: binary-search
  term: binary search
  name: { uk: "двійковий пошук", en: "binary search" }
  aliases: [bisection, halving search]
  definition:
    uk: "Пошук у відсортованому масиві, який щоразу дивиться на середній елемент і відкидає половину, де шуканого бути не може. Для `n` елементів вистачає близько log₂ n порівнянь — 17 для 100 000. Працює лише тоді, коли масив відсортовано за ключем пошуку."
    en: "A search in a sorted array that looks at the middle item every time and throws away the half where the target cannot be. For `n` items about log₂ n comparisons are enough — 17 for 100,000. It works only when the array is sorted by the search key."
  see: [precondition, linear-search]
- id: precondition
  term: precondition
  name: { uk: "передумова", en: "precondition" }
  definition:
    uk: "Те, що має бути правдою до виклику функції, щоб її результат був правильним: «масив відсортовано за датою», «`id` унікальні». Функція може її перевіряти або лише описувати в документації — тоді відповідальність на тому, хто викликає."
    en: "What must be true before a function is called for its result to be right: “the array is sorted by date”, “the `id`s are unique”. The function may check it or only state it in its documentation — then the caller is responsible."
  see: [binary-search, postcondition]
- id: invariant
  term: invariant
  name: { uk: "інваріант", en: "invariant" }
  definition:
    uk: "Правило про дані, яке мусить бути правдивим після кожної операції: «дати відсортовані й без повторів», «`id` унікальні», «загальна сума дорівнює сумі частин». Його записують кодом — функцією, яка кидає помилку, коли правило порушено, — і викликають у тестах після кожного кроку."
    en: "A rule about data that must be true after every operation: “the dates are sorted and without repeats”, “the `id`s are unique”, “the overall total equals the sum of its parts”. It is written as code — a function that throws an error when the rule is broken — and called in tests after every step."
  see: [postcondition, precondition, assertion]
- id: postcondition
  term: postcondition
  name: { uk: "постумова", en: "postcondition" }
  definition:
    uk: "Те, що обіцяє функція, коли повертає результат: «після `addCompletion` дата є в списку», «у результаті рівно стільки записів, скільки на вході». На відміну від інваріанта, стосується однієї функції, а не всього стану."
    en: "What a function promises when it returns: “after `addCompletion` the date is in the list”, “the result has exactly as many records as the input”. Unlike an invariant, it is about one function, not the whole state."
  see: [invariant, precondition]
- id: performance-profile
  term: performance profile
  name: { uk: "профіль продуктивності", en: "performance profile" }
  aliases: [profile, CPU profile, performance recording]
  definition:
    uk: "Запис того, що робив браузер протягом кількох секунд: які завдання виконував головний потік, які функції JavaScript працювали й скільки часу, коли рахувалися стилі й розкладка. Записують на панелі Performance у DevTools і читають через flame chart і таблицю Bottom-up."
    en: "A recording of what the browser did over a few seconds: which tasks the main thread ran, which JavaScript functions worked and for how long, when styles and layout were computed. Recorded in the DevTools Performance panel and read through the flame chart and the Bottom-up table."
  see: [long-task, flame-chart, browser-devtools]
- id: long-task
  term: long task
  name: { uk: "довге завдання", en: "long task" }
  definition:
    uk: "Завдання головного потоку, що триває понад 50 мс. Поки воно виконується, сторінка не реагує на кліки й клавіші. На панелі Performance таке завдання позначено червоним кутом."
    en: "A main-thread task that lasts more than 50 ms. While it runs, the page does not react to clicks and keys. In the Performance panel such a task is marked with a red corner."
  see: [performance-profile, event-loop]
- id: flame-chart
  term: flame chart
  name: { uk: "flame chart", en: "flame chart" }
  definition:
    uk: "Діаграма профілю, де по горизонталі — час, а під кожною функцією — смужки функцій, які вона викликала. Широка смужка — довга робота; щоб знайти, хто витрачає час сам, а не через інших, дивляться Self time у таблиці Bottom-up."
    en: "A profile chart with time along the horizontal axis and, under every function, the bars of the functions it called. A wide bar is long work; to find who spends the time itself rather than through others, look at Self time in the Bottom-up table."
  see: [performance-profile, call-stack]
- id: bottleneck
  term: bottleneck
  name: { uk: "вузьке місце", en: "bottleneck" }
  aliases: [hot spot]
  definition:
    uk: "Частина роботи, яка забирає більшість часу: одна функція, один цикл, один запит. Прискорення будь-чого іншого майже нічого не дає, тож спершу вузьке місце знаходять профілем, а потім змінюють лише його."
    en: "The part of the work that takes most of the time: one function, one loop, one request. Speeding up anything else gives almost nothing, so first the bottleneck is found with a profile, and then only it is changed."
  see: [performance-profile, performance-baseline]
- id: performance-baseline
  term: performance baseline
  name: { uk: "точка відліку (baseline)", en: "performance baseline" }
  aliases: [baseline]
  definition:
    uk: "Виміряний час до будь-яких змін: медіана кількох запусків разом із розміром даних і тим, що саме міряли. Без неї неможливо сказати, чи зміна щось покращила."
    en: "The measured time before any change: the median of several runs together with the data size and what exactly was measured. Without it there is no way to tell whether a change improved anything."
  see: [bottleneck, micro-benchmark]
