# Terms introduced in RE-10. One file per unit keeps parallel authoring conflict-free.
- id: lazy-component
  term: lazy component
  name: { uk: "lazy-компонент", en: "lazy component" }
  definition:
    uk: "Компонент, створений через `lazy(() => import(\"./File\"))`. Його код завантажується лише тоді, коли React уперше його рендерить; поки модуль у дорозі, рендер призупиняється, і найближча межа `Suspense` показує запасний вміст. Модуль, що прийшов, lazy-компонент пам’ятає, тому оголошують його один раз — на верхньому рівні модуля."
    en: "A component created with `lazy(() => import(\"./File\"))`. Its code is loaded only when React first renders it; while the module is on its way, the render suspends and the nearest `Suspense` boundary shows its fallback. A lazy component remembers the module that arrived, so it is declared once — at the top level of a module."
  aliases: ["lazy", "React.lazy", "ліниве завантаження"]
  see: [dynamic-import, suspense-boundary]
  example:
    lang: jsx
    code: "const HelpPage = lazy(() => import(\"./HelpPage\"));"
- id: suspense-boundary
  term: Suspense boundary
  name: { uk: "межа Suspense", en: "Suspense boundary" }
  definition:
    uk: "Компонент `<Suspense fallback={…}>`, що обгортає частину дерева. Коли щось усередині призупиняє рендер (lazy-код, джерело даних із підтримкою Suspense, `use()` із промісом), на місці всієї межі показується її запасний вміст, а все поза межею лишається на екрані. Діє найближча межа вище деревом."
    en: "The component `<Suspense fallback={…}>`, which wraps a part of the tree. When something inside suspends the render (lazy code, a Suspense-enabled data source, `use()` with a promise), the place of the whole boundary shows its fallback, and everything outside the boundary stays on the screen. The nearest boundary up the tree is the one that acts."
  aliases: ["Suspense", "межа призупинення"]
  see: [suspense-fallback, lazy-component]
- id: suspense-fallback
  term: Suspense fallback
  name: { uk: "запасний вміст Suspense", en: "Suspense fallback" }
  definition:
    uk: "Те, що межа `Suspense` показує з пропа `fallback`, поки вміст усередині призупинений, — зазвичай коротке повідомлення з `role=\"status\"` чи скелет розмітки. Уже показаний вміст React не видаляє, а ховає стилем `display: none` і показує знову, коли все готове."
    en: "What a `Suspense` boundary shows from its `fallback` prop while the content inside is suspended — usually a short message with `role=\"status\"` or a skeleton of the layout. Content that was already shown is not removed: React hides it with the style `display: none` and shows it again when everything is ready."
  see: [suspense-boundary, fallback-ui]
- id: urgent-update
  term: urgent update
  name: { uk: "термінове оновлення", en: "urgent update" }
  definition:
    uk: "Оновлення стану, результат якого людина чекає побачити одразу: літера в полі, натиснута кнопка, відкритий пункт меню. Звичайний виклик сетера в обробнику — термінове оновлення: React рендерить його без перерв і до кінця."
    en: "A state update whose result a person expects to see at once: a letter in a field, a pressed button, an opened menu item. A plain setter call in a handler is an urgent update: React renders it without interruptions, to the end."
  see: [non-urgent-update, use-transition]
- id: non-urgent-update
  term: non-urgent update
  name: { uk: "нетермінове оновлення", en: "non-urgent update" }
  definition:
    uk: "Оновлення стану, яке може з’явитися трохи пізніше, — наприклад, важкий відфільтрований список чи вміст нової вкладки. Його позначають через `startTransition`: React рендерить його без поспіху, перериває, коли надходить термінове оновлення, і тим часом лишає на екрані старий результат."
    en: "A state update that may appear a little later — for example, a heavy filtered list or the content of a new tab. It is marked with `startTransition`: React renders it without hurry, interrupts it when an urgent update arrives, and keeps the old result on the screen meanwhile."
  aliases: ["transition", "transition update", "перехід"]
  see: [urgent-update, use-transition]
- id: use-transition
  term: useTransition
  name: { uk: "useTransition", en: "useTransition" }
  definition:
    uk: "Хук React (з версії 18), що повертає `[isPending, startTransition]`. Оновлення стану всередині `startTransition(() => …)` стають нетерміновими; `isPending` дорівнює `true`, доки їхній рендер не дійшов до commit. Рендер від цього не швидшає й не відкладається — його лише можна перервати."
    en: "A React hook (since version 18) that returns `[isPending, startTransition]`. State updates inside `startTransition(() => …)` become non-urgent; `isPending` is `true` until their render has reached its commit. The render does not get faster or delayed — it can merely be interrupted."
  aliases: ["startTransition", "isPending"]
  see: [non-urgent-update, urgent-update]
  example:
    lang: jsx
    code: "const [isPending, startTransition] = useTransition();\nstartTransition(() => setTab(\"history\"));"
- id: concurrent-rendering
  term: concurrent rendering
  name: { uk: "конкурентний рендеринг", en: "concurrent rendering" }
  definition:
    uk: "Спосіб, яким React (з версії 18) рендерить нетермінові оновлення: шматочками по кілька мілісекунд в одному головному потоці, між якими браузер обробляє події. Такий рендер React може призупинити, кинути й почати наново; на екран через commit потрапляє лише завершений рендер. Паралельних потоків тут немає."
    en: "The way React (since version 18) renders non-urgent updates: in pieces of a few milliseconds on the single main thread, with the browser handling events between them. React may pause such a render, drop it and start over; only a finished render reaches the screen through a commit. There are no parallel threads involved."
  aliases: ["concurrent React", "конкурентний React"]
  see: [interruptible-render, non-urgent-update]
- id: interruptible-render
  term: interruptible render
  name: { uk: "перериваний рендер", en: "interruptible render" }
  definition:
    uk: "Рендер, який React може не доводити до кінця: якщо надійшло термінове оновлення, недороблений рендер кидають і пізніше починають наново. Тіло компонента в кинутому рендері вже виконалося, тож будь-який побічний ефект у ньому теж стався — тому рендер мусить бути чистим."
    en: "A render that React may leave unfinished: if an urgent update arrives, the half-made render is dropped and later started over. The component body in a dropped render has already run, so any side effect in it has happened too — which is why render must be pure."
  aliases: ["abandoned render", "кинутий рендер"]
  see: [concurrent-rendering, render-purity]
- id: form-action
  term: form action
  name: { uk: "form action", en: "form action" }
  definition:
    uk: "Функція, передана формі як `<form action={fn}>` (React 19.0.0 і новіші). React сам перехоплює надсилання, викликає функцію з `FormData` у transition і після завершення скидає неконтрольовані поля форми до `defaultValue`. Окремий `onSubmit` із `preventDefault()` тоді не потрібен."
    en: "A function passed to a form as `<form action={fn}>` (React 19.0.0 and newer). React intercepts the submission itself, calls the function with `FormData` inside a transition and, when it has finished, resets the form's uncontrolled fields to their `defaultValue`. A separate `onSubmit` with `preventDefault()` is then not needed."
  aliases: ["action", "форма з action"]
  see: [use-action-state, use-optimistic]
- id: use-action-state
  term: useActionState
  name: { uk: "useActionState", en: "useActionState" }
  definition:
    uk: "Хук React 19 `useActionState(action, initialState)` повертає `[state, formAction, isPending]`. `formAction` передають формі; коли вона надсилається, React викликає `action(previousState, formData)`, і те, що функція повертає (наприклад, текст помилки або `null`), стає новим `state`. `isPending` дорівнює `true`, поки action працює."
    en: "The React 19 hook `useActionState(action, initialState)` returns `[state, formAction, isPending]`. `formAction` is passed to a form; when it is submitted, React calls `action(previousState, formData)`, and whatever the function returns (for example an error text or `null`) becomes the new `state`. `isPending` is `true` while the action runs."
  see: [form-action, use-optimistic]
- id: use-optimistic
  term: useOptimistic
  name: { uk: "useOptimistic", en: "useOptimistic" }
  definition:
    uk: "Хук React 19 `useOptimistic(value)` повертає значення для показу й функцію, що тимчасово підміняє його, поки працює action чи transition. Коли вони закінчилися, React знову показує справжнє `value` — тож після відмови сервера показ повертається сам. Повідомити людину про відмову цей хук не вміє."
    en: "The React 19 hook `useOptimistic(value)` returns a value to show and a function that temporarily replaces it while an action or a transition runs. When they have finished, React shows the real `value` again — so after a server refusal the display goes back by itself. This hook cannot tell the person about the refusal."
  see: [use-action-state, form-action, optimistic-rollback]
- id: version-label
  term: version label
  name: { uk: "позначка версії", en: "version label" }
  definition:
    uk: "Запис біля коду чи в нотатках, з якої версії бібліотеки працює використаний API — наприклад, «`useOptimistic`: React 19.0.0+». Позначку звіряють зі встановленою версією (`npm ls react`, `import { version } from \"react\"`), а не з діапазоном у `package.json`."
    en: "A note next to the code or in the notes saying from which library version the API in use works — for example “`useOptimistic`: React 19.0.0+”. The label is checked against the installed version (`npm ls react`, `import { version } from \"react\"`), not against the range in `package.json`."
  see: [semver]
- id: react-compiler
  term: React Compiler
  name: { uk: "React Compiler", en: "React Compiler" }
  definition:
    uk: "Плагін для збирання проєкту (`babel-plugin-react-compiler`, стабільний з версії 1.0.0, жовтень 2025), що автоматично додає компонентам кеш — те, що вручну робили `memo`, `useMemo` і `useCallback`. Він припускає, що код дотримується правил React; компонент, де порушення помітне, лишає неоптимізованим, а деяких порушень не помічає зовсім."
    en: "A project build plugin (`babel-plugin-react-compiler`, stable since version 1.0.0, October 2025) that automatically adds a cache to components — what `memo`, `useMemo` and `useCallback` did by hand. It assumes the code follows the rules of React; a component with a visible violation is left unoptimized, and some violations it does not notice at all."
  aliases: ["компілятор React", "babel-plugin-react-compiler"]
  see: [render-purity]
- id: legacy-api
  term: legacy API
  name: { uk: "застарілий API", en: "legacy API" }
  definition:
    uk: "API, який трапляється в старшому коді, але має сучасну заміну. Частина таких API досі працює (класові компоненти, `forwardRef`), частину прибрано (`ReactDOM.render` у React 19), а частина ламається мовчки (`defaultProps` у функціональних компонентах React 19 просто ігнорується)."
    en: "An API found in older code that has a modern replacement. Some such APIs still work (class components, `forwardRef`), some have been removed (`ReactDOM.render` in React 19), and some break silently (`defaultProps` on function components is simply ignored in React 19)."
  see: [class-component, version-label]
- id: class-component
  term: class component
  name: { uk: "класовий компонент", en: "class component" }
  definition:
    uk: "Компонент, оголошений як клас, що розширює `Component` з React: стан у полі `state`, оновлення через `this.setState`, побічні ефекти в методах життєвого циклу (`componentDidMount`, `componentWillUnmount`). У React 19 досі працює; новий код пишуть функціями з хуками, а error boundary поки можна зробити лише класом."
    en: "A component declared as a class extending React's `Component`: state in the `state` field, updates through `this.setState`, side effects in lifecycle methods (`componentDidMount`, `componentWillUnmount`). It still works in React 19; new code is written as functions with hooks, while an error boundary can still only be a class."
  aliases: ["class components", "компонент-клас"]
  see: [legacy-api, error-boundary]
