# Terms introduced in RE-10. One file per unit keeps parallel authoring conflict-free.
- id: lazy-component
  term: lazy component
  name: { uk: "lazy-компонент", en: "lazy component" }
  definition:
    uk: "Компонент, створений через `lazy(() => import(\"./File\"))`. Його код завантажується лише тоді, коли React уперше його рендерить; поки модуль у дорозі, рендер призупиняється, і найближча межа `Suspense` показує запасний вміст. Модуль, що прийшов, lazy-компонент пам’ятає, тому оголошують його один раз — на верхньому рівні модуля."
    en: "A component created with `lazy(() => import(\"./File\"))`. Its code is loaded only when React first renders it; while the module is on its way, the render suspends and the nearest `Suspense` boundary shows its fallback. A lazy component remembers the module that arrived, so it is declared once — at the top level of a module."
  aliases: ["lazy", "React.lazy", "ліниве завантаження"]
  see: [dynamic-import, suspense-boundary]
  example:
    lang: jsx
    code: "const HelpPage = lazy(() => import(\"./HelpPage\"));"
- id: suspense-boundary
  term: Suspense boundary
  name: { uk: "межа Suspense", en: "Suspense boundary" }
  definition:
    uk: "Компонент `<Suspense fallback={…}>`, що обгортає частину дерева. Коли щось усередині призупиняє рендер (lazy-код, джерело даних із підтримкою Suspense, `use()` із промісом), на місці всієї межі показується її запасний вміст, а все поза межею лишається на екрані. Діє найближча межа вище деревом."
    en: "The component `<Suspense fallback={…}>`, which wraps a part of the tree. When something inside suspends the render (lazy code, a Suspense-enabled data source, `use()` with a promise), the place of the whole boundary shows its fallback, and everything outside the boundary stays on the screen. The nearest boundary up the tree is the one that acts."
  aliases: ["Suspense", "межа призупинення"]
  see: [suspense-fallback, lazy-component]
- id: suspense-fallback
  term: Suspense fallback
  name: { uk: "запасний вміст Suspense", en: "Suspense fallback" }
  definition:
    uk: "Те, що межа `Suspense` показує з пропа `fallback`, поки вміст усередині призупинений, — зазвичай коротке повідомлення з `role=\"status\"` чи скелет розмітки. Уже показаний вміст React не видаляє, а ховає стилем `display: none` і показує знову, коли все готове."
    en: "What a `Suspense` boundary shows from its `fallback` prop while the content inside is suspended — usually a short message with `role=\"status\"` or a skeleton of the layout. Content that was already shown is not removed: React hides it with the style `display: none` and shows it again when everything is ready."
  see: [suspense-boundary, fallback-ui]
- id: urgent-update
  term: urgent update
  name: { uk: "термінове оновлення", en: "urgent update" }
  definition:
    uk: "Оновлення стану, результат якого людина чекає побачити одразу: літера в полі, натиснута кнопка, відкритий пункт меню. Звичайний виклик сетера в обробнику — термінове оновлення: React рендерить його без перерв і до кінця."
    en: "A state update whose result a person expects to see at once: a letter in a field, a pressed button, an opened menu item. A plain setter call in a handler is an urgent update: React renders it without interruptions, to the end."
  see: [non-urgent-update, use-transition]
- id: non-urgent-update
  term: non-urgent update
  name: { uk: "нетермінове оновлення", en: "non-urgent update" }
  definition:
    uk: "Оновлення стану, яке може з’явитися трохи пізніше, — наприклад, важкий відфільтрований список чи вміст нової вкладки. Його позначають через `startTransition`: React рендерить його без поспіху, перериває, коли надходить термінове оновлення, і тим часом лишає на екрані старий результат."
    en: "A state update that may appear a little later — for example, a heavy filtered list or the content of a new tab. It is marked with `startTransition`: React renders it without hurry, interrupts it when an urgent update arrives, and keeps the old result on the screen meanwhile."
  aliases: ["transition", "transition update", "перехід"]
  see: [urgent-update, use-transition]
- id: use-transition
  term: useTransition
  name: { uk: "useTransition", en: "useTransition" }
  definition:
    uk: "Хук React (з версії 18), що повертає `[isPending, startTransition]`. Оновлення стану всередині `startTransition(() => …)` стають нетерміновими; `isPending` дорівнює `true`, доки їхній рендер не дійшов до commit. Рендер від цього не швидшає й не відкладається — його лише можна перервати."
    en: "A React hook (since version 18) that returns `[isPending, startTransition]`. State updates inside `startTransition(() => …)` become non-urgent; `isPending` is `true` until their render has reached its commit. The render does not get faster or delayed — it can merely be interrupted."
  aliases: ["startTransition", "isPending"]
  see: [non-urgent-update, urgent-update]
  example:
    lang: jsx
    code: "const [isPending, startTransition] = useTransition();\nstartTransition(() => setTab(\"history\"));"
