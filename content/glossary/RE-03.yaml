# Terms introduced in RE-03.
- id: react-hook
  term: hook
  name: { uk: "хук", en: "hook" }
  aliases: ["React hook", "хук React", "hooks", "хуки"]
  definition:
    uk: "Функція React, назва якої починається з `use` (`useState`, `useEffect`). Хук дає компоненту те, що живе між рендерами: стан, ефект. React зберігає дані хуків у комірках компонента й роздає їх за порядком викликів, тому хуки викликають лише на верхньому рівні компонента."
    en: "A React function whose name starts with `use` (`useState`, `useEffect`). A hook gives a component something that lives between renders: state, an effect. React keeps hook data in the component's slots and hands them out by call order, so hooks are called only at the top level of a component."
  see: [rules-of-hooks]
- id: rules-of-hooks
  term: rules of hooks
  name: { uk: "правила хуків", en: "rules of hooks" }
  definition:
    uk: "Два правила: викликати хуки лише на верхньому рівні компонента (не в умові, циклі, вкладеній функції й не після раннього `return`) і лише з функцій-компонентів або власних хуків. Тоді на кожному рендері виклики йдуть тим самим порядком і кожен отримує свою комірку. Лінтер `eslint-plugin-react-hooks` позначає порушення як помилку."
    en: "Two rules: call hooks only at the top level of a component (not in a condition, a loop, a nested function or after an early `return`) and only from function components or custom hooks. Then the calls come in the same order on every render and each gets its own slot. The `eslint-plugin-react-hooks` linter reports violations as errors."
  see: [react-hook]
- id: use-effect
  term: useEffect
  name: { uk: "useEffect", en: "useEffect" }
  aliases: ["effect", "ефект", "React effect"]
  definition:
    uk: "Хук, який приймає функцію-ефект і викликає її **після commit**, коли екран уже показує рендер. Ефект синхронізує зовнішню систему (заголовок документа, `localStorage`, таймер, підписку) з даними свого рендеру. Без другого аргументу запускається після кожного commit; другий аргумент — масив залежностей."
    en: "A hook that takes an effect function and calls it **after the commit**, when the screen already shows the render. An effect synchronizes an external system (the document title, `localStorage`, a timer, a subscription) with the data of its render. Without a second argument it runs after every commit; the second argument is the dependency array."
  see: [external-system, react-hook]
  example:
    code: "useEffect(() => {\n  document.title = `Wishes: ${wishes.length}`;\n});"
- id: external-system
  term: external system
  name: { uk: "зовнішня система", en: "external system" }
  definition:
    uk: "Усе, що існує поза деревом компонентів React і чого React сам не оновлює: `document.title`, `localStorage`, таймери, listeners на `window`, мережеві запити, сторонні віджети. Щоб воно відповідало поточному рендеру, його синхронізують в ефекті."
    en: "Anything that exists outside React's component tree and that React does not update by itself: `document.title`, `localStorage`, timers, listeners on `window`, network requests, third-party widgets. To keep it matching the current render, you synchronize it in an effect."
  see: [use-effect]
- id: dependency-array
  term: dependency array
  name: { uk: "масив залежностей", en: "dependency array" }
  aliases: ["deps", "dependencies", "залежності ефекту"]
  definition:
    uk: "Другий аргумент `useEffect`: список реактивних значень (props, стан і обчислене з них), які читає ефект. React запускає ефект після першого commit і знову лише тоді, коли хоч одне з них змінилося (порівняння як `Object.is`). Без масиву ефект запускається після кожного commit; `[]` — лише після першого."
    en: "The second argument of `useEffect`: the list of reactive values (props, state and what is computed from them) that the effect reads. React runs the effect after the first commit and again only when at least one of them changed (compared as `Object.is`). Without the array the effect runs after every commit; `[]` means only after the first."
  see: [use-effect, effect-cleanup]
- id: effect-cleanup
  term: effect cleanup
  name: { uk: "cleanup ефекту", en: "effect cleanup" }
  aliases: ["cleanup", "cleanup function", "функція прибирання"]
  definition:
    uk: "Функція, яку повертає ефект. Вона скасовує те, що зробив setup: відписується, зупиняє таймер, знімає listener, перериває запит. React викликає її перед кожним повторним запуском ефекту (зі значеннями попереднього рендеру) і під час демонтування компонента."
    en: "The function an effect returns. It undoes what the setup did: unsubscribes, stops a timer, removes a listener, aborts a request. React calls it before every re-run of the effect (with the previous render's values) and when the component unmounts."
  see: [use-effect, dependency-array, teardown]
- id: react-mount
  term: mount
  name: { uk: "монтування", en: "mount" }
  aliases: ["unmount", "mounting", "unmounting", "демонтування", "змонтувати", "демонтувати"]
  definition:
    uk: "Момент, коли React уперше показує компонент на сторінці: створює його комірки стану, робить commit і після нього запускає ефекти. Протилежне — **демонтування** (unmount): компонент зникає зі сторінки (його прибрали з JSX або на тому місці тепер інший компонент), його стан пропадає, а React викликає cleanup кожного його ефекту."
    en: "The moment React first shows a component on the page: it creates the component's state slots, commits, and after that runs its effects. The opposite is **unmount**: the component leaves the page (it was removed from the JSX, or a different component now sits in that position), its state is lost, and React calls the cleanup of each of its effects."
  see: [effect-cleanup, use-effect]
- id: effect-event
  term: Effect Event
  name: { uk: "Effect Event", en: "Effect Event" }
  aliases: ["useEffectEvent", "подія ефекту"]
  definition:
    uk: "Функція, створена хуком `useEffectEvent`. Вона щоразу бачить значення **останнього** рендеру, але не реактивна: її не кладуть у масив залежностей, і її зміна не перезапускає ефект. Викликають її лише з ефектів (або з іншого Effect Event), не під час рендеру й не з обробників подій."
    en: "A function created by the `useEffectEvent` hook. It always sees the values of the **latest** render but is not reactive: it is not put into the dependency array, and its change does not re-run the effect. It is called only from effects (or another Effect Event), not during render and not from event handlers."
  see: [use-effect, dependency-array, stale-closure]
  example:
    code: "const onVisit = useEffectEvent(() => {\n  logVisit(page, cartCount);\n});\nuseEffect(() => {\n  onVisit();\n}, [page]);"
- id: exhaustive-deps
  term: exhaustive-deps
  name: { uk: "exhaustive-deps", en: "exhaustive-deps" }
  aliases: ["react-hooks/exhaustive-deps", "missing dependency"]
  definition:
    uk: "Правило лінтера `eslint-plugin-react-hooks`, яке порівнює масив залежностей з тим, що ефект справді читає, і попереджає про пропущені (`React Hook useEffect has a missing dependency: …`). Попередження означає застаріле замикання, що чекає свого часу; виправляють залежність або код ефекту, а не глушать правило."
    en: "A rule of the `eslint-plugin-react-hooks` linter that compares the dependency array with what the effect really reads and warns about missing ones (`React Hook useEffect has a missing dependency: …`). The warning means a stale closure waiting for its moment; you fix the dependency or the effect's code instead of silencing the rule."
  see: [dependency-array, stale-closure]
- id: react-strict-mode
  term: StrictMode
  name: { uk: "StrictMode", en: "StrictMode" }
  aliases: ["Strict Mode", "React Strict Mode", "<StrictMode>"]
  definition:
    uk: "Компонент React, який нічого не малює, а під час розробки перевіряє своїх нащадків: викликає функції компонентів (а також оновлювачі й функції, які обчислюють початкове значення `useState`) двічі й під час монтування запускає кожен ефект як setup → cleanup → setup. У production-збірці цих перевірок немає. Не плутай із суворим режимом JavaScript (`\"use strict\"`)."
    en: "A React component that draws nothing and, during development, checks its descendants: it calls component functions (and updaters and the functions that compute a `useState` initial value) twice and on mount runs every effect as setup → cleanup → setup. A production build has none of these checks. Not to be confused with JavaScript's strict mode (`\"use strict\"`)."
  see: [development-recheck, effect-cleanup, strict-mode]
- id: development-recheck
  term: development recheck
  name: { uk: "перевірка під час розробки", en: "development recheck" }
  aliases: ["double render", "double invocation", "подвійний запуск"]
  definition:
    uk: "Додатковий виклик, який StrictMode робить лише під час розробки: повторний рендер і повторний цикл setup → cleanup → setup ефекту під час монтування. Він не створює помилок, а показує їх: нечистий рендер або ефект, чий cleanup не скасовує setup, дає видимий дубль чи витік. Виправляють ефект, а не прибирають перевірку."
    en: "An extra call that StrictMode makes in development only: a repeated render and a repeated setup → cleanup → setup cycle of an effect on mount. It does not create bugs, it reveals them: an impure render or an effect whose cleanup does not undo its setup produces a visible duplicate or leak. You fix the effect instead of removing the check."
  see: [react-strict-mode, effect-cleanup]
- id: effect-chain
  term: effect chain
  name: { uk: "ланцюжок ефектів", en: "effect chain" }
  aliases: ["chain of effects", "ланцюг ефектів"]
  definition:
    uk: "Ефект, який ставить стан лише для того, щоб на нього відреагував інший ефект або щоб скинути прапорець, поставлений обробником. Кожна ланка — зайвий рендер, а причину й наслідок рознесено по різних місцях. Зазвичай усе це робить обробник події або обчислення під час рендеру."
    en: "An effect that sets state only so that another effect can react to it, or to reset a flag set by a handler. Every link is an extra render, and cause and consequence end up in different places. Usually an event handler or a calculation during render does all of it."
  see: [use-effect, external-system]
- id: lazy-initializer
  term: lazy initializer
  name: { uk: "лінивий ініціалізатор", en: "lazy initializer" }
  aliases: ["ледачий ініціалізатор", "initializer function", "lazy initial state"]
  definition:
    uk: "Функція, яку передають у `useState` замість самого початкового значення: `useState(() => readStored())` або `useState(readStored)`. React викликає її лише на першому рендері й бере результат як початковий стан. StrictMode під час розробки викликає її двічі, тож вона має бути чистою. `useState(readStored())` із дужками викликав би `readStored` на кожному рендері."
    en: "A function passed to `useState` instead of the initial value itself: `useState(() => readStored())` or `useState(readStored)`. React calls it only on the first render and uses the result as the initial state. StrictMode calls it twice during development, so it must be pure. `useState(readStored())` with parentheses would call `readStored` on every render."
  see: [use-state, react-strict-mode]
