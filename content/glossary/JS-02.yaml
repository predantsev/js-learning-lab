# Terms introduced in JS-02. One file per unit keeps parallel authoring conflict-free.

# js-02-01-const-let
- id: binding
  term: binding
  name: { uk: "прив’язка", en: "binding" }
  definition:
    uk: "Зв’язок між назвою і значенням: після `const price = 80` назва `price` вказує на `80`. Програмісти зазвичай називають прив’язку «змінною» — навіть коли її оголошено через `const`."
    en: "The link between a name and a value: after `const price = 80` the name `price` points at `80`. In conversation programmers often say “variable” — even about a `const`."
  aliases: ["variable", "змінна"]
  see: [const, let]
  example:
    code: "const price = 80;   // the name price points at 80"
- id: const
  term: const
  name: { uk: "const", en: "const" }
  definition:
    uk: "Оголошення змінної, яку не можна перепризначити: спроба дати їй нове значення зупиняє програму з `TypeError`. Значення треба дати одразу. Поля запису, на який вказує `const`, змінювати можна."
    en: "A declaration of a name that cannot be reassigned: giving it a new value stops the program with a `TypeError`. It needs its value straight away. The fields of a record a `const` points at can still change."
  see: [let, binding]
  example:
    code: "const wish = { price: 80 };\nwish.price = 70;   // allowed: the record changes\nwish = {};         // TypeError: Assignment to constant variable."
- id: let
  term: let
  name: { uk: "let", en: "let" }
  definition:
    uk: "Оголошення змінної, яку згодом можна спрямувати на інше значення. Змінна з `let` існує лише всередині блоку `{ }`, де її оголошено, а оголошена поза всіма блоками — в усьому файлі."
    en: "A declaration of a name that can later be pointed at another value. A `let` name exists only inside the `{ }` block where it is declared; declared outside every block, it exists in the whole file."
  see: [const, reassignment, block-scope]
  example:
    code: "let count = 1;\ncount = count + 1;   // 2"
- id: reassignment
  term: reassignment
  name: { uk: "повторне присвоєння", en: "reassignment" }
  definition:
    uk: "Інструкція `назва = нове значення` без `let` чи `const`: уже наявна змінна починає вказувати на інше значення. Дозволене для `let` і `var`, заборонене для `const`. Скорочення: `+=`, `-=` і `++`."
    en: "A line `name = new value` without `let` or `const`: an existing name starts pointing at another value. Allowed for `let` and `var`, forbidden for `const`. Shorthands: `+=`, `-=` and `++`."
  see: [let, const]
  example:
    code: "let price = 45;\nprice = 40;   // reassignment\nprice -= 5;   // the same as price = price - 5"
- id: record
  term: record
  name: { uk: "запис", en: "record" }
  definition:
    uk: "Кілька значень, кожне зі своєю назвою, — полів, — зібраних у фігурних дужках: `{ name: \"Лампа\", price: 45 }`. Поле читають і змінюють через крапку: `wish.price`. У JavaScript записи — це об’єкти; докладно про них — у розділі JS-04."
    en: "Several named values — fields — collected in curly braces: `{ name: \"Lamp\", price: 45 }`. A field is read and changed with a dot: `wish.price`. In JavaScript, records are objects; JS-04 covers them in depth."
  example:
    code: "const wish = { name: \"Lamp\", price: 45 };\nconsole.log(wish.price);   // 45"

# js-02-02-equality-coercion
- id: strict-equality
  term: strict equality (===)
  name: { uk: "строга рівність", en: "strict equality" }
  definition:
    uk: "Порівняння `===` (і протилежне `!==`): `true` лише тоді, коли значення мають однаковий тип і однакове значення. Нічого не перетворює, тому його пишуть за замовчуванням."
    en: "The comparison `===` (and its opposite `!==`): `true` only when the values have the same type and the same value. It converts nothing, so it is the default choice."
  see: [loose-equality]
  example:
    code: "5 === 5     // true\n5 === \"5\"   // false: a number and a string"
- id: loose-equality
  term: loose equality (==)
  name: { uk: "нестрога рівність", en: "loose equality" }
  definition:
    uk: "Порівняння `==` (і `!=`): якщо типи різні, спершу перетворює значення до одного типу, а потім порівнює. Через це `0 == \"\"` — `true`. У професійному коді лишають один випадок: `x == null`, що означає «`null` або `undefined`»."
    en: "The comparison `==` (and `!=`): when the types differ, it first converts the values to one type and then compares. That is why `0 == \"\"` is `true`. Professional code keeps one case: `x == null`, meaning “`null` or `undefined`”."
  see: [strict-equality, coercion]
  example:
    code: "0 == \"\"            // true\nnull == undefined  // true\nnull == 0          // false"
- id: coercion
  term: type coercion
  name: { uk: "приведення типів", en: "type coercion" }
  definition:
    uk: "Автоматичне перетворення значення з одного типу на інший, яке JavaScript робить сам: `\"1\" + 2` дає `\"12\"`, а `\"5\" == 5` — `true`. Корисне рідко, а сюрпризів дає багато."
    en: "An automatic conversion of a value from one type to another that JavaScript makes on its own: `\"1\" + 2` gives `\"12\"`, and `\"5\" == 5` is `true`. Rarely useful, often surprising."
  aliases: ["coercion", "неявне перетворення"]
  see: [loose-equality]

# js-02-03-truthiness-logic-ternary
- id: truthy
  term: truthy
  name: { uk: "truthy-значення", en: "truthy" }
  definition:
    uk: "Значення, яке в умові поводиться як `true`. Truthy — усе, що не falsy: будь-яке ненульове число, будь-який непорожній рядок (навіть `\"0\"` і `\"false\"`), будь-який запис."
    en: "A value that behaves like `true` in a condition. Truthy is everything that is not falsy: any non-zero number, any non-empty string (even `\"0\"` and `\"false\"`), any record."
  see: [falsy]
  example:
    code: "Boolean(\"0\")   // true\nBoolean(42)    // true"
- id: falsy
  term: falsy
  name: { uk: "falsy-значення", en: "falsy" }
  definition:
    uk: "Значення, яке в умові поводиться як `false`. Їх небагато: `false`, `0`, `-0`, `0n`, `\"\"`, `null`, `undefined` і `NaN`."
    en: "A value that behaves like `false` in a condition. There are only a few: `false`, `0`, `-0`, `0n`, `\"\"`, `null`, `undefined` and `NaN`."
  see: [truthy, nullish]
  example:
    code: "Boolean(0)    // false\nBoolean(\"\")   // false"
- id: short-circuit
  term: short-circuit evaluation
  name: { uk: "коротке замикання", en: "short-circuit evaluation" }
  definition:
    uk: "`&&`, `||` і `??` не обчислюють правий операнд, якщо відповідь уже відома з лівого. Результатом стає один з операндів, а не обов’язково `true` чи `false`."
    en: "`&&`, `||` and `??` do not evaluate the right operand when the left one already decides the answer. The result is one of the operands, not necessarily `true` or `false`."
  aliases: ["short-circuit"]
  example:
    code: "0 || \"x\"     // \"x\"\n\"a\" && 0     // 0\n45 || later  // 45; later is never evaluated"
- id: ternary
  term: ternary operator (? :)
  name: { uk: "тернарний оператор", en: "ternary operator" }
  definition:
    uk: "Вираз `умова ? a : b`: якщо умова truthy, результат — `a`, інакше — `b`. Оскільки це вираз, його можна присвоїти чи вивести."
    en: "The expression `condition ? a : b`: if the condition is truthy, the result is `a`; otherwise it is `b`. Being an expression, it can be assigned or printed."
  aliases: ["ternary", "conditional operator"]
  example:
    code: "const status = habit.active ? \"active\" : \"paused\";"

# js-02-04-nullish-optional-chaining
- id: nullish
  term: nullish
  name: { uk: "nullish-значення", en: "nullish" }
  definition:
    uk: "Спільна назва для `null` і `undefined` — двох значень, що означають «нічого немає». Оператор `??` реагує лише на них, на відміну від `||`, який реагує на будь-яке falsy-значення."
    en: "The common name for `null` and `undefined` — the two values that mean “nothing is there”. The `??` operator reacts only to them, unlike `||`, which reacts to any falsy value."
  see: [default-value, optional-chaining, falsy]
  example:
    code: "0 ?? \"no price\"      // 0\nnull ?? \"no price\"   // \"no price\""
- id: optional-chaining
  term: optional chaining (?.)
  name: { uk: "optional chaining", en: "optional chaining" }
  definition:
    uk: "Читання через `?.`: якщо значення ліворуч — `null` або `undefined`, читання зупиняється й дає `undefined` замість `TypeError`."
    en: "Reading with `?.`: if the value on the left is `null` or `undefined`, the read stops and gives `undefined` instead of a `TypeError`."
  aliases: ["?."]
  see: [nullish]
  example:
    code: "const tickets = { category: null };\ntickets.category?.length         // undefined\ntickets.category?.length ?? 0    // 0"
- id: default-value
  term: default value
  name: { uk: "значення за замовчуванням", en: "default value" }
  definition:
    uk: "Запасне значення, яке підставляють, коли справжнього немає. Для «відсутнього» значення пиши `x ?? запасне`; `x || запасне` замінить ще й `0`, `\"\"` та `false`."
    en: "A fallback used when the real value is missing. For a “missing” value write `x ?? fallback`; `x || fallback` also replaces `0`, `\"\"` and `false`."
  see: [nullish]
  example:
    code: "const label = wish.price ?? \"no price\";"

# js-02-05-if-else-switch
- id: branch
  term: branch
  name: { uk: "гілка", en: "branch" }
  definition:
    uk: "Частина програми, яка виконується лише за певної умови: тіло `if`, `else if`, `else` чи одного `case` у `switch`. З ланцюжка `if/else` виконується щонайбільше одна гілка, а якщо в кінці є `else` — рівно одна."
    en: "A part of a program that runs only under a certain condition: the body of an `if`, `else if`, `else` or of one `case` in a `switch`. At most one branch of an `if/else` chain runs — exactly one when it ends with an `else`."
  see: [if-else, switch]
- id: if-else
  term: if / else
  name: { uk: "if / else", en: "if / else" }
  definition:
    uk: "Розгалуження за умовою. JavaScript перевіряє умови згори донизу й виконує першу гілку, умова якої truthy; `else` спрацьовує, коли жодна не підійшла."
    en: "Branching on a condition. JavaScript checks the conditions top to bottom and runs the first branch whose condition is truthy; `else` runs when none matched."
  see: [branch, switch]
  example:
    code: "if (price === null) {\n  console.log(\"No price yet\");\n} else if (price === 0) {\n  console.log(\"Free\");\n} else {\n  console.log(price);\n}"
- id: switch
  term: switch
  name: { uk: "switch", en: "switch" }
  definition:
    uk: "Вибір за значенням: `switch (x)` порівнює `x` з кожним `case` через `===` і починає виконання з першого збігу. `break` виходить зі `switch`, `default` спрацьовує, коли жоден `case` не підійшов."
    en: "Choosing by value: `switch (x)` compares `x` with each `case` using `===` and starts running at the first match. `break` leaves the `switch`; `default` runs when no `case` matched."
  see: [fallthrough, if-else]
  example:
    code: "switch (priority) {\n  case \"high\":\n    console.log(\"Urgent\");\n    break;\n  default:\n    console.log(\"Regular\");\n}"
- id: fallthrough
  term: fallthrough
  name: { uk: "fallthrough («провалювання»)", en: "fallthrough" }
  definition:
    uk: "Поведінка `switch` без `break`: після тіла знайденого `case` виконання продовжується в наступному `case`, уже без перевірки його значення. Буває помилкою, а буває навмисним прийомом — кілька `case` поспіль ділять одну гілку."
    en: "What a `switch` does without `break`: after the body of the matched `case`, execution continues into the next `case` without checking its value. Sometimes a bug, sometimes on purpose — several `case` lines in a row share one branch."
  see: [switch]
  example:
    code: "switch (category) {\n  case \"food\":\n  case \"home\":   // food falls through to here\n    console.log(\"Everyday\");\n    break;\n}"

# js-02-06-counting-loops
- id: counting-loop
  term: counting for loop
  name: { uk: "лічильний цикл for", en: "counting for loop" }
  definition:
    uk: "Цикл `for (початок; умова; крок) { тіло }`: початок виконується один раз, умова — перед кожним проходом, крок — після кожного. Зручний, коли наперед відомо, як змінюється лічильник."
    en: "The loop `for (start; condition; step) { body }`: the start runs once, the condition before every pass, the step after every pass. Handy when you know in advance how the counter changes."
  aliases: ["for loop", "цикл for"]
  see: [loop-condition, iteration-table]
  example:
    code: "for (let day = 1; day <= 3; day++) {\n  console.log(day);   // 1, 2, 3\n}"
- id: loop-condition
  term: loop condition
  name: { uk: "умова циклу", en: "loop condition" }
  definition:
    uk: "Вираз, який цикл перевіряє перед кожним проходом (у `do…while` — після). Поки він truthy, тіло виконується знову; щойно стає falsy, цикл завершується. Якщо тіло ніколи не робить умову хибною, цикл не зупиниться."
    en: "The expression a loop checks before every pass (after it, in `do…while`). While it is truthy, the body runs again; once it becomes falsy, the loop ends. If the body never makes the condition false, the loop never stops."
  see: [counting-loop]
  example:
    code: "let n = 8;\nwhile (n >= 1) {   // checked before every pass\n  n = n / 2;\n}"
- id: iteration-table
  term: iteration table
  name: { uk: "таблиця ітерацій", en: "iteration table" }
  definition:
    uk: "Таблиця, у якій кожен рядок — одна перевірка умови циклу: значення змінних, результат умови й що зробило тіло. Допомагає передбачити, скільки разів виконається цикл, і знайти помилку на межі."
    en: "A table in which every row is one check of a loop condition: the values of the variables, the result of the condition and what the body did. It helps predict how many times a loop runs and find a boundary mistake."
  see: [counting-loop, loop-condition]

# js-02-07-var-hoisting-tdz
- id: var
  term: var
  name: { uk: "var", en: "var" }
  definition:
    uk: "Застарілий спосіб оголосити змінну. Не помічає блоків — змінну видно в усьому файлі або в усій функції — і до свого рядка мовчки дає `undefined`. У новому коді замість нього пишуть `const` і `let`."
    en: "The legacy way to declare a name. It ignores blocks — the name is visible in the whole file or the whole function — and silently gives `undefined` before its own line. New code uses `const` and `let` instead."
  see: [hoisting, function-scope, let]
  example:
    code: "if (true) {\n  var size = \"large\";\n}\nconsole.log(size);   // large: var leaks out of the block"
- id: hoisting
  term: hoisting
  name: { uk: "підняття (hoisting)", en: "hoisting" }
  definition:
    uk: "Перш ніж виконувати код, JavaScript заздалегідь створює всі оголошені в ньому змінні. Змінна `var` одразу отримує `undefined`; `let` і `const` до свого рядка лишаються в TDZ. Значення не «піднімаються» — вони з’являються там, де їх написано."
    en: "Before running code, JavaScript creates every name declared in it in advance. A `var` name gets `undefined` straight away; `let` and `const` stay in the TDZ until their line. Values are not “hoisted” — they appear where they are written."
  see: [var, temporal-dead-zone]
  example:
    code: "console.log(label);   // undefined\nvar label = \"Lamp\";"
- id: temporal-dead-zone
  term: temporal dead zone (TDZ)
  name: { uk: "тимчасова мертва зона (TDZ)", en: "temporal dead zone (TDZ)" }
  definition:
    uk: "Проміжок від початку блоку до рядка, де оголошено `let` чи `const`. Змінна вже існує, але звертатися до неї не можна — ні читати, ні присвоювати: спроба зупиняє програму з `ReferenceError: Cannot access '…' before initialization`."
    en: "The stretch from the start of a block to the line that declares a `let` or `const`. The name already exists but cannot be used — neither read nor assigned: trying stops the program with `ReferenceError: Cannot access '…' before initialization`."
  aliases: ["TDZ"]
  see: [hoisting, let]
  example:
    code: "console.log(price);   // ReferenceError: Cannot access 'price' before initialization\nlet price = 45;"
- id: block-scope
  term: block scope
  name: { uk: "блочна область видимості", en: "block scope" }
  definition:
    uk: "Змінні, оголошені через `let` чи `const` усередині фігурних дужок — тіла `if`, `else`, циклу, — існують лише в цьому блоці й зникають після закривної дужки."
    en: "Names declared with `let` or `const` inside curly braces — the body of an `if`, an `else` or a loop — exist only in that block and disappear after the closing brace."
  see: [function-scope, let]
  example:
    code: "if (price > 40) {\n  const note = \"pricey\";\n}\nconsole.log(note);   // ReferenceError: note is not defined"
- id: function-scope
  term: function scope
  name: { uk: "область видимості функції", en: "function scope" }
  definition:
    uk: "Область видимості `var`: змінну видно в усій функції, де її оголошено, а поза функціями — в усьому файлі. Блоки `if` і циклів для `var` не межа. Функції — тема розділу JS-03."
    en: "The scope of `var`: the name is visible in the whole function where it is declared, and outside any function in the whole file. `if` and loop blocks are no boundary for `var`. Functions are the topic of JS-03."
  see: [var, block-scope]

# js-02-08-shadowing-strict-mode
- id: shadowing
  term: shadowing
  name: { uk: "затінення", en: "shadowing" }
  definition:
    uk: "Ситуація, коли у вкладеному блоці оголошено змінну з назвою, яка вже є зовні. Усередині блоку діє внутрішня змінна, а зовнішня схована й не змінюється. Дозволене, але часто стає тихою помилкою."
    en: "A nested block declares a name that already exists outside. Inside the block the inner name is in effect, while the outer one is hidden and stays unchanged. Allowed, but often a silent bug."
  see: [block-scope]
  example:
    code: "let total = 0;\nif (amount > 0) {\n  let total = amount;   // a new total that shadows the outer one\n}\nconsole.log(total);     // 0"
- id: strict-mode
  term: strict mode
  name: { uk: "строгий режим", en: "strict mode" }
  definition:
    uk: "Режим, у якому JavaScript не пробачає небезпечних дрібниць: наприклад, присвоєння неоголошеній назві зупиняє програму з `ReferenceError` замість того, щоб мовчки створити нову змінну. Модулі завжди працюють у строгому режимі; старі скрипти вмикають його рядком коду `\"use strict\";`."
    en: "A mode in which JavaScript does not forgive risky details: for example, assigning to an undeclared name stops the program with a `ReferenceError` instead of silently creating a new name. Modules always run in strict mode; old scripts switch it on with the line `\"use strict\";`."
  example:
    code: "let total = 0;\ntotl = 5;   // ReferenceError: totl is not defined"

# js-02-09-rare-operators-special-values
- id: unary-operator
  term: unary operator
  name: { uk: "унарний оператор", en: "unary operator" }
  definition:
    uk: "Оператор з одним операндом: `!x`, `-x`, `+x`, `typeof x`, `delete r.f`. Унарний `+` перетворює значення на число: `+\"3\"` дає `3`; у власному коді зрозуміліше писати `Number(\"3\")`."
    en: "An operator with a single operand: `!x`, `-x`, `+x`, `typeof x`, `delete r.f`. Unary `+` converts a value to a number: `+\"3\"` gives `3`; in your own code `Number(\"3\")` is clearer."
  example:
    code: "+\"3\" + 1     // 4\n!!\"\"         // false\ntypeof 10n   // \"bigint\""
- id: in-operator
  term: in operator
  name: { uk: "оператор in", en: "in operator" }
  definition:
    uk: "`\"назва\" in запис` відповідає, чи є в записі поле (властивість) із такою назвою — навіть якщо його значення `null` чи `undefined`. Враховує й успадковані властивості: `\"toString\" in {}` — `true`."
    en: "`\"name\" in record` answers whether the record has a field (property) with that name — even when its value is `null` or `undefined`. Inherited properties count too: `\"toString\" in {}` is `true`."
  aliases: ["in"]
  example:
    code: "const wish = { price: null };\n\"price\" in wish   // true: the field exists\n\"note\" in wish    // false"
- id: instanceof
  term: instanceof
  name: { uk: "instanceof", en: "instanceof" }
  definition:
    uk: "`x instanceof Вид` питає, чи належить значення до певного виду об’єктів, наприклад `Date` чи `Object`. Для чисел, рядків, `null` та інших простих значень відповідь — `false`."
    en: "`x instanceof Kind` asks whether a value belongs to a certain kind of object, for example `Date` or `Object`. For numbers, strings, `null` and other simple values the answer is `false`."
  example:
    code: "({}) instanceof Object        // true\nnull instanceof Object        // false\nnew Date() instanceof Date    // true"
- id: bitwise
  term: bitwise operators
  name: { uk: "побітові оператори", en: "bitwise operators" }
  definition:
    uk: "Оператори `&`, `|`, `^`, `~`, `<<`, `>>`, `>>>`, що працюють із двійковими розрядами цілих чисел. У прикладному коді рідкісні; не плутай `&` з `&&` і `|` з `||`."
    en: "The operators `&`, `|`, `^`, `~`, `<<`, `>>`, `>>>`, which work on the binary digits of whole numbers. Rare in application code; do not confuse `&` with `&&` or `|` with `||`."
  aliases: ["bitwise"]
  example:
    code: "5 & 3    // 1\n5 | 3    // 7\n1 << 3   // 8"
- id: symbol
  term: Symbol
  name: { uk: "Symbol", en: "Symbol" }
  definition:
    uk: "Простий тип для унікальних значень: кожен `Symbol(\"id\")` відрізняється від будь-якого іншого, навіть з тим самим описом. Бібліотеки позначають ними «приховані» ключі. `typeof` дає `\"symbol\"`."
    en: "A primitive type for unique values: every `Symbol(\"id\")` differs from any other, even one with the same description. Libraries use symbols to mark “hidden” keys. `typeof` gives `\"symbol\"`."
  example:
    code: "Symbol(\"id\") === Symbol(\"id\")   // false"
- id: bigint
  term: BigInt
  name: { uk: "BigInt", en: "BigInt" }
  definition:
    uk: "Простий тип для цілих чисел будь-якої довжини, пишеться з `n` у кінці: `10n`. Зі звичайними числами в арифметиці не змішується: `10n + 1` — `TypeError`; спершу перетвори одне з них."
    en: "A primitive type for whole numbers of any length, written with an `n` at the end: `10n`. It does not mix with ordinary numbers in arithmetic: `10n + 1` is a `TypeError`; convert one of them first."
  example:
    code: "10n + 1n         // 11n\n10n + 1          // TypeError\nNumber(10n) + 1  // 11"

# js-02-11-independent-validation
- id: validation
  term: validation
  name: { uk: "валідація", en: "validation" }
  definition:
    uk: "Перевірка даних перед використанням: чи є всі потрібні поля, чи мають вони правильний тип і допустимі значення. Результат валідації в цьому курсі — `{ ok: true, value }` або `{ ok: false, errors }`, де `errors` описує проблему кожного поля."
    en: "Checking data before using it: are all required fields present, do they have the right type and allowed values. In this course a validation result is `{ ok: true, value }` or `{ ok: false, errors }`, where `errors` describes each field’s problem."
  example:
    code: "validate({ label: \"\", amountMinor: 0, category: \"food\" })\n// { ok: false, errors: { label: \"required\", amountMinor: \"not-positive\" } }"
