# Terms introduced in RE-09.
- id: generic-component
  term: generic component
  name: { uk: "узагальнений компонент", en: "generic component" }
  aliases: ["generic React component", "узагальнений React-компонент"]
  definition:
    uk: "Компонент із параметром типу, як `function List<T>(props: ListProps<T>)`. Тип елементів визначає виклик: `tsc` виводить `T` з переданих props і перевіряє кожен виклик окремо. Сам компонент про елементи нічого не знає й працює з ними лише через функції, отримані в props."
    en: "A component with a type parameter, like `function List<T>(props: ListProps<T>)`. The call decides the item type: `tsc` infers `T` from the props passed and checks every call separately. The component itself knows nothing about the items and works with them only through functions it gets in props."
  see: [generic-function, type-parameter, props]
- id: impossible-state
  term: impossible state
  name: { uk: "неможливий стан", en: "impossible state" }
  aliases: ["impossible states", "неможливі стани"]
  definition:
    uk: "Поєднання значень стану, якого не буває в справжній ситуації: завантаження, помилка й список одночасно. Незалежні прапорці на кшталт `isLoading`, `error` і `data` такі поєднання дозволяють; discriminated union за полем `status` — ні, бо кожен варіант несе лише свої поля."
    en: "A combination of state values that never happens in a real situation: loading, an error and a list at once. Independent flags such as `isLoading`, `error` and `data` allow such combinations; a discriminated union on a `status` field does not, because each member carries only its own fields."
  see: [discriminated-union, use-reducer]
- id: api-model
  term: API model
  name: { uk: "API-модель", en: "API model" }
  aliases: ["API models", "API-моделі", "transport model"]
  definition:
    uk: "Тип, що описує дані рівно так, як їх надсилає сервер: його назви полів і формати (`amount_minor`, `is_done`). Його тримають окремо від доменної моделі застосунку й перетворюють на неї в одному місці — там, де відповідь входить у застосунок."
    en: "A type that describes data exactly as the server sends it: its field names and formats (`amount_minor`, `is_done`). It is kept apart from the app's domain model and converted into it in one place — where the response enters the app."
  see: [runtime-schema, json]
- id: runtime-schema
  term: runtime schema
  name: { uk: "runtime-схема", en: "runtime schema" }
  aliases: ["schema", "схема", "parse function", "схема перевірки"]
  definition:
    uk: "Опис очікуваної форми даних, який перевіряють під час виконання: функція `parse(input: unknown)`, що повертає `{ ok: true, value }` з типізованим значенням або `{ ok: false, errors }`. Її пишуть самі або задають бібліотекою на кшталт Zod. На відміну від `as`, вона справді дивиться на кожне поле."
    en: "A description of the expected data shape that is checked at runtime: a function `parse(input: unknown)` that returns `{ ok: true, value }` with a typed value or `{ ok: false, errors }`. It is written by hand or declared with a library such as Zod. Unlike `as`, it really looks at every field."
  see: [runtime-validation, unknown-type, type-assertion]
- id: reuse-boundary
  term: reuse boundary
  name: { uk: "межа повторного використання", en: "reuse boundary" }
  aliases: ["domain boundary", "межа домену"]
  definition:
    uk: "Лінія між доменним кодом, який можна взяти на будь-яку платформу (типи, валідатори, чисті перетворення), і платформним кодом (компоненти, сховище, маршрути). Платформний код імпортує домен, а домен не імпортує нічого платформного; імпорт лише типу межу не порушує."
    en: "The line between domain code that can be taken to any platform (types, validators, pure transforms) and platform code (components, storage, routes). Platform code imports the domain, and the domain imports nothing platform-specific; importing only a type does not break the boundary."
  see: [platform-view, pure-function, type-only-import]
- id: platform-view
  term: platform view
  name: { uk: "платформний view", en: "platform view" }
  aliases: ["platform views", "платформні views", "platform adapter"]
  definition:
    uk: "Код, що існує лише на одній платформі: компонент React DOM з `<li>` і `<button>`, модуль, що пише в `localStorage`, маршрути з адресою браузера. У React Native чи на сервері його замінюють власним, а доменні типи й функції під ним лишаються ті самі."
    en: "Code that exists on one platform only: a React DOM component with `<li>` and `<button>`, a module that writes to `localStorage`, routes with a browser address. In React Native or on a server it is replaced by their own, while the domain types and functions under it stay the same."
  see: [reuse-boundary, component]
