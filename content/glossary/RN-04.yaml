# Terms introduced in RN-04.
- id: navigation-stack
  term: navigation stack
  name: { uk: "стек навігації", en: "navigation stack" }
  aliases: ["native stack", "stack navigator", "нативний стек", "push", "pop"]
  definition:
    uk: "Спосіб, яким нативний застосунок тримає свої екрани: як стос карток. `push` кладе новий екран згори, `goBack`/`pop` знімає верхній (він демонтується), `replace` знімає верхній і кладе інший. Екрани під верхнім лишаються змонтованими зі своїм станом — на відміну від вебмаршруту, де перехід демонтує попередній екран."
    en: "The way a native app holds its screens: like a pile of cards. `push` puts a new screen on top, `goBack`/`pop` takes the top one off (it unmounts), `replace` takes the top one off and puts another in its place. The screens under the top one stay mounted with their state — unlike a web route, where a transition unmounts the previous screen."
  see: [screen-params, history-entry]
  example:
    lang: jsx
    code: "navigation.push('Detail', { id: 'w-01' });\nnavigation.goBack();"
- id: screen-params
  term: screen params
  name: { uk: "параметри екрана", en: "screen params" }
  aliases: ["route.params", "navigation params", "параметри навігації"]
  definition:
    uk: "Обʼєкт, який екран отримує, коли його кладуть на стек навігації (другий аргумент `push`), і читає як `route.params`. Екран отримує їх один раз (змінює їх лише явний виклик `navigation.setParams`), і вони не стежать за змінами даних, тому в параметри кладуть лише id, а запис шукають у спільному стані. Відповідник [[route-param|параметра маршруту]] у вебі, але без адреси."
    en: "The object a screen receives when it is put on the navigation stack (the second argument of `push`) and reads as `route.params`. The screen receives them once (only an explicit `navigation.setParams` call changes them) and they do not follow changes to the data, so params hold only an id and the record is looked up in shared state. The counterpart of a web [[route-param]], but without an address."
  see: [navigation-stack, route-param]
- id: hardware-back-button
  term: Android back button
  name: { uk: "кнопка «Назад» Android", en: "Android back button" }
  aliases: ["hardware back button", "system back", "back gesture", "апаратна кнопка «Назад»", "BackHandler"]
  definition:
    uk: "Системна кнопка (або жест від краю екрана) «Назад» на Android. Вона не належить жодному екрану застосунку: натискання йде до навігації, яка знімає верхній екран зі стеку. Тому охорону незбережених змін ставлять на рівні стеку (`usePreventRemove`), а не на власну кнопку екрана."
    en: "Android's system Back button (or the Back gesture from the screen edge). It belongs to no screen of the app: the press goes to navigation, which takes the top screen off the stack. That is why an unsaved-edits guard sits at the stack level (`usePreventRemove`), not on a screen's own button."
  see: [swipe-back-gesture, navigation-stack]
- id: swipe-back-gesture
  term: swipe-back gesture
  name: { uk: "свайп назад", en: "swipe-back gesture" }
  aliases: ["edge swipe", "interactive pop gesture", "gestureEnabled", "жест «назад» iOS"]
  definition:
    uk: "Жест на iOS: провести пальцем від лівого краю екрана вправо, щоб повернутися на попередній екран стеку. Він працює, навіть коли кнопку «‹» у заголовку сховано. У нативному стеку React Navigation його вмикає опція `gestureEnabled` (на iOS за замовчуванням увімкнена)."
    en: "An iOS gesture: drag a finger from the left edge of the screen to the right to return to the previous screen of the stack. It works even when the “‹” header button is hidden. In React Navigation's native stack the option `gestureEnabled` turns it on (on iOS it is on by default)."
  see: [hardware-back-button, navigation-stack]
- id: screen-focus
  term: screen focus
  name: { uk: "фокус екрана", en: "screen focus" }
  aliases: ["focus event", "useFocusEffect", "useIsFocused", "фокус"]
  definition:
    uk: "Стан екрана в стеку навігації: екран у фокусі, коли він видимий угорі стеку. Подія `focus` приходить при першому показі й щоразу, коли екран знову стає верхнім. Це не фокус клавіатури на елементі: екран може бути змонтованим довго, а фокус отримувати багато разів. `useFocusEffect` запускає ефект саме при фокусі."
    en: "The state of a screen on a navigation stack: a screen is focused when it is visible on top of the stack. The `focus` event arrives on the first display and every time the screen becomes the top one again. This is not keyboard focus on an element: a screen can stay mounted for a long time and gain focus many times. `useFocusEffect` runs an effect exactly on focus."
  see: [screen-blur, navigation-stack, route-focus]
- id: screen-blur
  term: screen blur
  name: { uk: "втрата фокуса екраном (blur)", en: "screen blur" }
  aliases: ["blur event", "blur"]
  definition:
    uk: "Подія `blur`: екран перестав бути верхнім у стеку, бо його накрив інший екран. Екран при цьому лишається змонтованим, тож його таймери й підписки працюють далі, якщо їх не зупинити. Cleanup `useFocusEffect` виконується саме тут. Екран, який знімають з нативного стеку, може демонтуватися й без `blur` — cleanup `useFocusEffect` тоді виконується при демонтуванні."
    en: "The `blur` event: a screen stopped being the top one on the stack because another screen covered it. The screen stays mounted, so its timers and subscriptions keep running unless they are stopped. The cleanup of `useFocusEffect` runs exactly here. A screen taken off a native stack may unmount without a `blur` — the cleanup of `useFocusEffect` then runs on unmount."
  see: [screen-focus]
- id: native-app-state
  term: AppState
  name: { uk: "AppState (стан застосунку)", en: "AppState" }
  aliases: ["app state", "AppState.addEventListener", "стан застосунку"]
  definition:
    uk: "Модуль React Native, що повідомляє, чи застосунок на передньому плані: `active`, `background` або (лише на iOS) `inactive`. `AppState.addEventListener('change', (next) => …)` викликає функцію при кожній зміні й повертає підписку з `remove()`. За кодом React Native 0.86 при виході iOS надсилає `inactive`, потім `background`, Android — одразу `background`; повернення — `active`."
    en: "A React Native module that reports whether the app is in the foreground: `active`, `background` or (iOS only) `inactive`. `AppState.addEventListener('change', (next) => …)` calls a function on every change and returns a subscription with `remove()`. According to the React Native 0.86 code, on leaving iOS sends `inactive`, then `background`, Android sends `background` straight away; coming back is `active`."
  see: [app-foreground, app-background]
- id: app-foreground
  term: foreground
  name: { uk: "передній план", en: "foreground" }
  aliases: ["active", "foreground app"]
  definition:
    uk: "Застосунок на передньому плані — той, з яким людина зараз працює; його стан у `AppState` — `active`. Повернення на передній план — момент оновити те, що могло застаріти, наприклад значення «на сьогодні»."
    en: "An app in the foreground is the one the person is using right now; its `AppState` state is `active`. Coming back to the foreground is the moment to refresh what may have gone stale, such as the “today” values."
  see: [native-app-state, app-background]
- id: app-background
  term: background
  name: { uk: "фон (застосунок у фоні)", en: "background" }
  aliases: ["backgrounded app", "suspended app", "застосунок у фоні"]
  definition:
    uk: "Застосунок у фоні — людина в іншому застосунку чи на головному екрані; стан `background`. Таймери JavaScript у ньому зупиняються (на Android їх ставить на паузу React Native, iOS невдовзі призупиняє весь застосунок), а щоб звільнити памʼять, система може закрити його без попередження. Тому чернетку зберігають саме при переході в `background`."
    en: "An app in the background — the person is in another app or on the home screen; the state is `background`. Its JavaScript timers stop (on Android React Native pauses them, iOS soon suspends the whole app), and to free memory the system may close it without warning. That is why the draft is saved exactly on the change to `background`."
  see: [native-app-state, app-foreground]
- id: event-subscription
  term: event subscription
  name: { uk: "підписка на подію", en: "event subscription" }
  aliases: ["subscription", "subscription.remove()", "EmitterSubscription", "підписка"]
  definition:
    uk: "Обʼєкт, який повертає `addEventListener` нативного модуля (`AppState`, `Linking`, `BackHandler`, а в `Keyboard` — `addListener`). Поки підписка жива, функція викликається при кожній події; зняти її можна лише `subscription.remove()`. Перехід на інший екран чи втрата фокуса її не знімають — це робить cleanup ефекту, у якому підписались."
    en: "The object a native module's `addEventListener` returns (`AppState`, `Linking`, `BackHandler`; for `Keyboard` it is `addListener`). While the subscription is alive, the function is called on every event; only `subscription.remove()` removes it. Moving to another screen or losing focus does not remove it — the cleanup of the effect that subscribed does."
  see: [native-app-state, effect-cleanup]
- id: deep-link
  term: deep link
  name: { uk: "deep link (посилання всередину застосунку)", en: "deep link" }
  aliases: ["deeplink", "app link", "Linking", "getInitialURL"]
  definition:
    uk: "Адреса, що відкриває конкретний екран застосунку, наприклад `courselab://task/t-02`. Вона приходить ззовні, тож її розбирають і перевіряють як неперевірені вхідні дані. У React Native посилання читають двома шляхами: `Linking.getInitialURL()` — якщо воно запустило застосунок, і подія `url` через `Linking.addEventListener` — якщо застосунок уже працював."
    en: "An address that opens a specific screen of an app, for example `courselab://task/t-02`. It comes from outside, so it is parsed and checked as untrusted input. In React Native a link is read in two ways: `Linking.getInitialURL()` — if it started the app, and the `url` event through `Linking.addEventListener` — if the app was already running."
  see: [custom-url-scheme, cold-start]
- id: custom-url-scheme
  term: custom URL scheme
  name: { uk: "власна схема адрес", en: "custom URL scheme" }
  aliases: ["URL scheme", "scheme", "app scheme", "схема"]
  definition:
    uk: "Початок адреси до `:`, який система закріплює за застосунком: `courselab:` замість `https:`. У проєкті Expo її задають полем `scheme` в `app.json`; щоб система про неї дізналась, потрібна нова збірка застосунку. Expo Go власних схем не реєструє — у ньому посилання мають вигляд `exp://…/--/шлях`."
    en: "The beginning of an address before `:` that the system assigns to an app: `courselab:` instead of `https:`. In an Expo project it is set with the `scheme` field in `app.json`; for the system to learn about it, a new build of the app is needed. Expo Go does not register custom schemes — in it links look like `exp://…/--/path`."
  see: [deep-link]
- id: cold-start
  term: cold start
  name: { uk: "холодний старт", en: "cold start" }
  aliases: ["cold launch", "запуск з нуля"]
  definition:
    uk: "Запуск застосунку, якого не було в памʼяті: усе починається з нуля — стек, стан, підписки. Посилання, що спричинило холодний старт, не приходить подією (її ще ніхто не слухає) — його читають з `Linking.getInitialURL()`."
    en: "Starting an app that was not in memory: everything begins from scratch — the stack, the state, the subscriptions. A link that caused a cold start does not arrive as an event (nobody is listening yet) — it is read with `Linking.getInitialURL()`."
  see: [deep-link]
