# Terms introduced in RN-04.
- id: navigation-stack
  term: navigation stack
  name: { uk: "стек навігації", en: "navigation stack" }
  aliases: ["native stack", "stack navigator", "нативний стек", "push", "pop"]
  definition:
    uk: "Спосіб, яким нативний застосунок тримає свої екрани: як стос карток. `push` кладе новий екран згори, `goBack`/`pop` знімає верхній (він демонтується), `replace` знімає верхній і кладе інший. Екрани під верхнім лишаються змонтованими зі своїм станом — на відміну від вебмаршруту, де перехід демонтує попередній екран."
    en: "The way a native app holds its screens: like a pile of cards. `push` puts a new screen on top, `goBack`/`pop` takes the top one off (it unmounts), `replace` takes the top one off and puts another in its place. The screens under the top one stay mounted with their state — unlike a web route, where a transition unmounts the previous screen."
  see: [screen-params, history-entry]
  example:
    lang: jsx
    code: "navigation.push('Detail', { id: 'w-01' });\nnavigation.goBack();"
- id: screen-params
  term: screen params
  name: { uk: "параметри екрана", en: "screen params" }
  aliases: ["route.params", "navigation params", "параметри навігації"]
  definition:
    uk: "Обʼєкт, який екран отримує, коли його кладуть на стек навігації (другий аргумент `push`), і читає як `route.params`. Екран отримує їх один раз, і вони не стежать за змінами даних, тому в параметри кладуть лише id, а запис шукають у спільному стані. Відповідник [[route-param|параметра маршруту]] у вебі, але без адреси."
    en: "The object a screen receives when it is put on the navigation stack (the second argument of `push`) and reads as `route.params`. The screen receives them once and they do not follow changes to the data, so params hold only an id and the record is looked up in shared state. The counterpart of a web [[route-param]], but without an address."
  see: [navigation-stack, route-param]
- id: hardware-back-button
  term: Android back button
  name: { uk: "кнопка «Назад» Android", en: "Android back button" }
  aliases: ["hardware back button", "system back", "back gesture", "апаратна кнопка «Назад»", "BackHandler"]
  definition:
    uk: "Системна кнопка (або жест від краю екрана) «Назад» на Android. Вона не належить жодному екрану застосунку: натискання йде до навігації, яка знімає верхній екран зі стеку. Тому охорону незбережених змін ставлять на рівні стеку (`usePreventRemove`), а не на власну кнопку екрана."
    en: "Android's system Back button (or the Back gesture from the screen edge). It belongs to no screen of the app: the press goes to navigation, which takes the top screen off the stack. That is why an unsaved-edits guard sits at the stack level (`usePreventRemove`), not on a screen's own button."
  see: [swipe-back-gesture, navigation-stack]
- id: swipe-back-gesture
  term: swipe-back gesture
  name: { uk: "свайп назад", en: "swipe-back gesture" }
  aliases: ["edge swipe", "interactive pop gesture", "gestureEnabled", "жест «назад» iOS"]
  definition:
    uk: "Жест на iOS: провести пальцем від лівого краю екрана вправо, щоб повернутися на попередній екран стеку. Він працює, навіть коли кнопку «‹» у заголовку сховано. У нативному стеку React Navigation його вмикає опція `gestureEnabled` (на iOS за замовчуванням увімкнена)."
    en: "An iOS gesture: drag a finger from the left edge of the screen to the right to return to the previous screen of the stack. It works even when the “‹” header button is hidden. In React Navigation's native stack the option `gestureEnabled` turns it on (on iOS it is on by default)."
  see: [hardware-back-button, navigation-stack]
- id: screen-focus
  term: screen focus
  name: { uk: "фокус екрана", en: "screen focus" }
  aliases: ["focus event", "useFocusEffect", "useIsFocused", "фокус"]
  definition:
    uk: "Стан екрана в стеку навігації: екран у фокусі, коли він видимий угорі стеку. Подія `focus` приходить при першому показі й щоразу, коли екран знову стає верхнім. Це не фокус клавіатури на елементі: екран може бути змонтованим довго, а фокус отримувати багато разів. `useFocusEffect` запускає ефект саме при фокусі."
    en: "The state of a screen on a navigation stack: a screen is focused when it is visible on top of the stack. The `focus` event arrives on the first display and every time the screen becomes the top one again. This is not keyboard focus on an element: a screen can stay mounted for a long time and gain focus many times. `useFocusEffect` runs an effect exactly on focus."
  see: [screen-blur, navigation-stack, route-focus]
- id: screen-blur
  term: screen blur
  name: { uk: "втрата фокуса екраном (blur)", en: "screen blur" }
  aliases: ["blur event", "blur"]
  definition:
    uk: "Подія `blur`: екран перестав бути верхнім у стеку — його накрив інший екран чи він ось-ось зникне. Екран при цьому лишається змонтованим, тож його таймери й підписки працюють далі, якщо їх не зупинити. Cleanup `useFocusEffect` виконується саме тут."
    en: "The `blur` event: a screen stopped being the top one on the stack — another screen covered it, or it is about to go. The screen stays mounted, so its timers and subscriptions keep running unless they are stopped. The cleanup of `useFocusEffect` runs exactly here."
  see: [screen-focus]
- id: native-app-state
  term: AppState
  name: { uk: "AppState (стан застосунку)", en: "AppState" }
  aliases: ["app state", "AppState.addEventListener", "стан застосунку"]
  definition:
    uk: "Модуль React Native, що повідомляє, чи застосунок на передньому плані: `active`, `background` або (лише на iOS) `inactive`. `AppState.addEventListener('change', (next) => …)` викликає функцію при кожній зміні й повертає підписку з `remove()`. За кодом React Native 0.86 при виході iOS надсилає `inactive`, потім `background`, Android — одразу `background`; повернення — `active`."
    en: "A React Native module that reports whether the app is in the foreground: `active`, `background` or (iOS only) `inactive`. `AppState.addEventListener('change', (next) => …)` calls a function on every change and returns a subscription with `remove()`. According to the React Native 0.86 code, on leaving iOS sends `inactive`, then `background`, Android sends `background` straight away; coming back is `active`."
  see: [app-foreground, app-background]
- id: app-foreground
  term: foreground
  name: { uk: "передній план", en: "foreground" }
  aliases: ["active", "foreground app"]
  definition:
    uk: "Застосунок на передньому плані — той, з яким людина зараз працює; його стан у `AppState` — `active`. Повернення на передній план — момент оновити те, що могло застаріти, наприклад значення «на сьогодні»."
    en: "An app in the foreground is the one the person is using right now; its `AppState` state is `active`. Coming back to the foreground is the moment to refresh what may have gone stale, such as the “today” values."
  see: [native-app-state, app-background]
- id: app-background
  term: background
  name: { uk: "фон (застосунок у фоні)", en: "background" }
  aliases: ["backgrounded app", "suspended app", "застосунок у фоні"]
  definition:
    uk: "Застосунок у фоні — людина в іншому застосунку чи на головному екрані; стан `background`. Невдовзі система призупиняє такий застосунок (таймери стоять), а коли бракує памʼяті, закриває його без попередження. Тому чернетку зберігають саме при переході в `background`."
    en: "An app in the background — the person is in another app or on the home screen; the state is `background`. Soon the system suspends such an app (timers stop), and when memory runs short it closes it without warning. That is why the draft is saved exactly on the change to `background`."
  see: [native-app-state, app-foreground]
