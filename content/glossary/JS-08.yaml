# Terms introduced in JS-08 (the event loop, promises, async/await, fetch, failures, cancellation, races).
- id: event-loop
  term: event loop
  name: { uk: "event loop (цикл подій)", en: "event loop" }
  definition:
    uk: "Механізм, що вирішує, який код JavaScript виконати наступним. Він чекає, доки стек викликів спорожніє, бере наступну задачу з черги, виконує її до кінця — і так знову й знову. Тому callback таймера чи обробник кліку ніколи не перериває код, що вже виконується."
    en: "The mechanism that decides which JavaScript code runs next. It waits until the call stack is empty, takes the next task from the queue, runs it to the end — and repeats this forever. That is why a timer callback or a click handler never interrupts code that is already running."
  example:
    code: "setTimeout(() => console.log(\"later\"), 0);\nconsole.log(\"now\");\n// now\n// later"
  see: [task-queue, call-stack, timer]
- id: task-queue
  term: task queue
  name: { uk: "черга задач (task queue)", en: "task queue" }
  aliases: [macrotask queue, macrotask]
  definition:
    uk: "Черга, у якій чекають задачі: callbacks таймерів, чий час минув, обробники кліків та інших подій. Event loop бере з неї по одній задачі — і лише тоді, коли стек викликів порожній. Сам скрипт сторінки — теж задача."
    en: "The queue where tasks wait: callbacks of timers whose time is up, handlers of clicks and other events. The event loop takes one task at a time from it — and only when the call stack is empty. The page’s script itself is a task too."
  see: [event-loop]
- id: timer
  term: timer
  name: { uk: "таймер", en: "timer" }
  definition:
    uk: "Прохання до браузера викликати функцію не раніше ніж через указаний час: `setTimeout(callback, ms)`. Час відлічує браузер, поза JavaScript; коли він минув, callback стає в чергу задач і виконується, щойно звільниться стек викликів. Тому затримка — це мінімальне очікування, а не точний момент."
    en: "A request to the browser to call a function no sooner than after the given time: `setTimeout(callback, ms)`. The browser counts the time, outside JavaScript; when it is up, the callback joins the task queue and runs as soon as the call stack is free. So the delay is a minimum wait, not an exact moment."
  example:
    code: "setTimeout(() => {\n  console.log(\"one second later (or a bit more)\");\n}, 1000);"
  see: [task-queue, callback]
- id: single-threaded
  term: single-threaded
  name: { uk: "однопотоковий", en: "single-threaded" }
  definition:
    uk: "Код JavaScript на сторінці виконується в одному потоці: є один стек викликів, і в кожен момент працює лише одна функція. Поки вона не закінчилася, жоден інший твій код — ні таймер, ні обробник кліку — не почнеться. Браузер навколо (таймери, мережа) працює окремо й лише ставить готові callbacks у чергу."
    en: "JavaScript code on a page runs in one thread: there is one call stack, and only one function runs at any moment. Until it has finished, no other code of yours — no timer, no click handler — can start. The browser around it (timers, the network) works separately and only puts finished callbacks into a queue."
  see: [event-loop, call-stack]
- id: promise
  term: promise
  name: { uk: "promise (обіцянка)", en: "promise" }
  definition:
    uk: "Об’єкт, що представляє результат, якого ще немає. Функція може повернути promise одразу, а значення з’явиться в ньому пізніше. Callback, зареєстрований через `.then`, отримає це значення, коли promise виконається, — і ніколи не раніше, ніж закінчиться поточний синхронний код."
    en: "An object that stands for a result that does not exist yet. A function can return a promise right away, and the value appears in it later. A callback registered with `.then` receives that value once the promise is fulfilled — and never before the current synchronous code has finished."
  example:
    code: "const ready = new Promise((resolve) => {\n  setTimeout(() => resolve(\"t-01\"), 500);\n});\nready.then((id) => console.log(id)); // t-01, half a second later"
  see: [promise-state, fulfilled, rejected, callback]
- id: promise-state
  term: promise state
  name: { uk: "стан promise", en: "promise state" }
  aliases: [pending, settled]
  definition:
    uk: "Promise завжди в одному з трьох станів: `pending` (значення ще немає), `fulfilled` (виконано, є значення) або `rejected` (відхилено, є причина помилки). Виконаний чи відхилений promise називають settled — завершеним. Завершується він лише раз, і після цього його стан і значення не змінюються."
    en: "A promise is always in one of three states: `pending` (no value yet), `fulfilled` (it has a value) or `rejected` (it has an error reason). A fulfilled or rejected promise is called settled. It settles only once, and after that its state and value never change."
  see: [promise, fulfilled, rejected]
- id: fulfilled
  term: fulfilled
  name: { uk: "fulfilled (виконаний)", en: "fulfilled" }
  aliases: [resolved]
  definition:
    uk: "Стан promise, який отримав значення: виконавець викликав `resolve(value)`. Усі callbacks із `.then` — і ті, що зареєстровані пізніше, — отримають саме це значення."
    en: "The state of a promise that has received its value: the executor called `resolve(value)`. Every `.then` callback — including ones registered later — receives exactly that value."
  see: [promise-state, rejected]
- id: rejected
  term: rejected
  name: { uk: "rejected (відхилений)", en: "rejected" }
  definition:
    uk: "Стан promise, що завершився помилкою: виконавець викликав `reject(error)` або кинув помилку. Callbacks із `.then` для такого promise пропускаються, а причину помилки отримує обробник `.catch`."
    en: "The state of a promise that ended with an error: the executor called `reject(error)` or threw an error. `.then` callbacks are skipped for such a promise, and the error reason goes to a `.catch` handler."
  see: [promise-state, fulfilled]
