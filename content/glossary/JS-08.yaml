# Terms introduced in JS-08 (the event loop, promises, async/await, fetch, failures, cancellation, races).
- id: event-loop
  term: event loop
  name: { uk: "event loop (цикл подій)", en: "event loop" }
  definition:
    uk: "Механізм, що вирішує, який код JavaScript виконати наступним. Він чекає, доки стек викликів спорожніє, бере наступну задачу з черги, виконує її до кінця — і так знову й знову. Тому callback таймера чи обробник кліку ніколи не перериває код, що вже виконується."
    en: "The mechanism that decides which JavaScript code runs next. It waits until the call stack is empty, takes the next task from the queue, runs it to the end — and repeats this forever. That is why a timer callback or a click handler never interrupts code that is already running."
  example:
    code: "setTimeout(() => console.log(\"later\"), 0);\nconsole.log(\"now\");\n// now\n// later"
  see: [task-queue, call-stack, timer]
- id: task-queue
  term: task queue
  name: { uk: "черга задач (task queue)", en: "task queue" }
  aliases: [macrotask queue, macrotask]
  definition:
    uk: "Черга, у якій чекають задачі: callbacks таймерів, чий час минув, обробники кліків та інших подій. Event loop бере з неї по одній задачі — і лише тоді, коли стек викликів порожній. Виконання коду файла — теж задача."
    en: "The queue where tasks wait: callbacks of timers whose time is up, handlers of clicks and other events. The event loop takes one task at a time from it — and only when the call stack is empty. Running the file’s code is a task too."
  see: [event-loop]
- id: timer
  term: timer
  name: { uk: "таймер", en: "timer" }
  definition:
    uk: "Прохання до браузера викликати функцію не раніше ніж через указаний час: `setTimeout(callback, ms)`. Час відлічує браузер, поза JavaScript; коли він минув, callback стає в чергу задач і виконується, щойно звільниться стек викликів. Тому затримка — це мінімальне очікування, а не точний момент."
    en: "A request to the browser to call a function no sooner than after the given time: `setTimeout(callback, ms)`. The browser counts the time, outside JavaScript; when it is up, the callback joins the task queue and runs as soon as the call stack is free. So the delay is a minimum wait, not an exact moment."
  example:
    code: "setTimeout(() => {\n  console.log(\"one second later (or a bit more)\");\n}, 1000);"
  see: [task-queue, callback]
- id: single-threaded
  term: single-threaded
  name: { uk: "однопотоковий", en: "single-threaded" }
  definition:
    uk: "Код JavaScript на сторінці виконується в одному потоці: є один стек викликів, і в кожен момент працює лише одна функція. Поки вона не закінчилася, жоден інший твій код — ні таймер, ні обробник кліку — не почнеться. Браузер навколо (таймери, мережа) працює окремо й лише ставить готові callbacks у чергу."
    en: "JavaScript code on a page runs in one thread: there is one call stack, and only one function runs at any moment. Until it has finished, no other code of yours — no timer, no click handler — can start. The browser around it (timers, the network) works separately and only puts finished callbacks into a queue."
  see: [event-loop, call-stack]
- id: promise
  term: promise
  name: { uk: "promise (обіцянка)", en: "promise" }
  definition:
    uk: "Об’єкт, що представляє результат, якого ще немає. Функція може повернути promise одразу, а значення з’явиться в ньому пізніше. Callback, зареєстрований через `.then`, отримає це значення, коли promise виконається, — і ніколи не раніше, ніж закінчиться поточний синхронний код."
    en: "An object that stands for a result that does not exist yet. A function can return a promise right away, and the value appears in it later. A callback registered with `.then` receives that value once the promise is fulfilled — and never before the current synchronous code has finished."
  example:
    code: "const ready = new Promise((resolve) => {\n  setTimeout(() => resolve(\"t-01\"), 500);\n});\nready.then((id) => console.log(id)); // t-01, half a second later"
  see: [promise-state, fulfilled, rejected, callback]
- id: promise-state
  term: promise state
  name: { uk: "стан promise", en: "promise state" }
  aliases: [pending, settled]
  definition:
    uk: "Promise завжди в одному з трьох станів: `pending` (значення ще немає), `fulfilled` (виконано, є значення) або `rejected` (відхилено, є причина помилки). Виконаний чи відхилений promise називають settled — завершеним. Завершується він лише раз, і після цього його стан і значення не змінюються."
    en: "A promise is always in one of three states: `pending` (no value yet), `fulfilled` (it has a value) or `rejected` (it has an error reason). A fulfilled or rejected promise is called settled. It settles only once, and after that its state and value never change."
  see: [promise, fulfilled, rejected]
- id: fulfilled
  term: fulfilled
  name: { uk: "fulfilled (виконаний)", en: "fulfilled" }
  aliases: [resolved]
  definition:
    uk: "Стан promise, який отримав значення: виконавець викликав `resolve(value)`. Усі callbacks із `.then` — і ті, що зареєстровані пізніше, — отримають саме це значення."
    en: "The state of a promise that has received its value: the executor called `resolve(value)`. Every `.then` callback — including ones registered later — receives exactly that value."
  see: [promise-state, rejected]
- id: rejected
  term: rejected
  name: { uk: "rejected (відхилений)", en: "rejected" }
  definition:
    uk: "Стан promise, що завершився помилкою: виконавець викликав `reject(error)` або кинув помилку. Callbacks із `.then` для такого promise пропускаються, а причину помилки отримує обробник `.catch`."
    en: "The state of a promise that ended with an error: the executor called `reject(error)` or threw an error. `.then` callbacks are skipped for such a promise, and the error reason goes to a `.catch` handler."
  see: [promise-state, fulfilled]
# Introduced in js-08-04-microtasks-vs-tasks; defined here early because js-08-01 and js-08-02 already link it.
- id: microtask
  term: microtask
  name: { uk: "microtask (мікрозадача)", en: "microtask" }
  definition:
    uk: "Коротка робота, яку треба виконати одразу після поточного коду, ще до наступної задачі: callback із `.then` чи `.catch`, продовження функції після `await`, функція, передана в `queueMicrotask`."
    en: "A short piece of work that must run right after the current code, before the next task: a `.then` or `.catch` callback, the rest of a function after `await`, a function passed to `queueMicrotask`."
  see: [microtask-queue, task-queue]
- id: microtask-queue
  term: microtask queue
  name: { uk: "черга microtasks", en: "microtask queue" }
  definition:
    uk: "Окрема черга для microtasks. Щойно стек викликів спорожніє, event loop виконує **усі** microtasks із цієї черги — і ті, що додалися під час виконання, — і лише потім бере наступну задачу з черги задач. Тому callback із `.then` завжди випереджає `setTimeout(…, 0)`."
    en: "A separate queue for microtasks. As soon as the call stack is empty, the event loop runs **all** microtasks in this queue — including ones added while it runs them — and only then takes the next task from the task queue. That is why a `.then` callback always runs before `setTimeout(…, 0)`."
  example:
    code: "setTimeout(() => console.log(\"task\"), 0);\nPromise.resolve().then(() => console.log(\"microtask\"));\n// microtask\n// task"
  see: [microtask, task-queue, event-loop]
- id: promise-chain
  term: promise chain
  name: { uk: "ланцюжок promises", en: "promise chain" }
  definition:
    uk: "Послідовність викликів `.then`, `.catch` і `.finally`, де кожен виклик повертає новий promise. Наступний крок отримує те, що повернув попередній; якщо попередній повернув promise, ланцюжок чекає на нього. Помилка в будь-якому кроці пропускає всі `.then` аж до найближчого `.catch`."
    en: "A sequence of `.then`, `.catch` and `.finally` calls in which every call returns a new promise. The next step receives what the previous one returned; when the previous step returned a promise, the chain waits for it. An error in any step skips every `.then` up to the nearest `.catch`."
  example:
    code: "Promise.resolve(3)\n  .then((n) => n * 2)\n  .then((n) => console.log(n)); // 6"
  see: [promise, unhandled-rejection]
- id: unhandled-rejection
  term: unhandled rejection
  name: { uk: "необроблене відхилення", en: "unhandled rejection" }
  definition:
    uk: "Відхилений promise, помилку якого не обробив жоден `.catch` (чи `try/catch` навколо `await`). Браузер повідомляє про нього в консолі, але користувач нічого не бачить, а частина роботи мовчки не виконалася. Кожен ланцюжок має закінчуватися обробкою помилки."
    en: "A rejected promise whose error no `.catch` (or `try/catch` around `await`) handled. The browser reports it in the console, but the user sees nothing, and part of the work silently did not happen. Every chain should end with error handling."
  see: [rejected, promise-chain]
- id: async-function
  term: async function
  name: { uk: "async-функція", en: "async function" }
  definition:
    uk: "Функція, оголошена зі словом `async`. Усередині неї можна писати `await`. Вона завжди повертає promise: те, що вона повертає через `return`, стає значенням цього promise, а кинута помилка — причиною відхилення. До першого `await` її тіло виконується синхронно, як у звичайної функції."
    en: "A function declared with the word `async`. Inside it you can write `await`. It always returns a promise: what it returns with `return` becomes that promise’s value, and a thrown error becomes the rejection reason. Up to the first `await` its body runs synchronously, like an ordinary function."
  example:
    code: "async function count() {\n  return 3;\n}\ncount().then((n) => console.log(n)); // 3"
  see: [await, promise]
- id: await
  term: await
  name: { uk: "await", en: "await" }
  definition:
    uk: "Оператор перед promise у async-функції (або на найвищому рівні модуля). Він призупиняє лише цю функцію, доки promise не завершиться, і дає його значення; якщо promise відхилено, `await` кидає причину як помилку, яку можна перехопити `try/catch`. Решта програми тим часом працює."
    en: "An operator in front of a promise inside an async function (or at the top level of a module). It pauses only that function until the promise settles and gives its value; if the promise is rejected, `await` throws the reason as an error that `try/catch` can catch. The rest of the program keeps running meanwhile."
  see: [async-function, promise]
- id: fetch
  term: fetch
  name: { uk: "fetch", en: "fetch" }
  definition:
    uk: "Вбудована функція браузера для HTTP-запитів: `fetch(url, options)`. Вона одразу повертає promise, який виконується об’єктом Response, щойно надійшли статус і заголовки, — за **будь-якого** статусу, зокрема 404 і 500. Відхиляється він лише тоді, коли відповіді немає взагалі (немає мережі, запит скасовано). Тіло читають окремо: `await response.json()` або `await response.text()`."
    en: "The browser’s built-in function for HTTP requests: `fetch(url, options)`. It returns a promise at once, fulfilled with a Response object as soon as the status and headers have arrived — with **any** status, 404 and 500 included. It is rejected only when there is no answer at all (no network, the request was cancelled). The body is read separately: `await response.json()` or `await response.text()`."
  example:
    code: "const response = await fetch(\"./data/habits.json\");\nconsole.log(response.status, response.ok); // 200 true"
  see: [http-method, status-code, content-type, promise]
- id: http-method
  term: HTTP method
  name: { uk: "метод HTTP", en: "HTTP method" }
  aliases: [GET, POST, PUT, PATCH, DELETE]
  definition:
    uk: "Слово на початку HTTP-запиту, що каже, чого хоче клієнт: `GET` — отримати дані, `POST` — створити, `PUT` чи `PATCH` — змінити, `DELETE` — видалити. `fetch` без параметрів надсилає `GET`; інший метод задають так: `fetch(url, { method: \"POST\" })`."
    en: "The word at the start of an HTTP request that says what the client wants: `GET` — get data, `POST` — create, `PUT` or `PATCH` — change, `DELETE` — remove. `fetch` without options sends `GET`; another method is set like this: `fetch(url, { method: \"POST\" })`."
  see: [fetch, http-header]
- id: http-header
  term: HTTP header
  name: { uk: "заголовок HTTP", en: "HTTP header" }
  definition:
    uk: "Пара «назва: значення» в запиті чи відповіді з додатковими відомостями: у якому форматі тіло (Content-Type), який формат клієнт хоче отримати (Accept) тощо. Заголовки відповіді читають через `response.headers.get(\"назва\")`; назви не залежать від великих і малих літер."
    en: "A “name: value” pair in a request or a response carrying extra information: the body’s format (Content-Type), the format the client wants (Accept) and so on. Response headers are read with `response.headers.get(\"name\")`; header names ignore upper and lower case."
  see: [content-type, http-method]
- id: status-code
  term: status code
  name: { uk: "код статусу", en: "status code" }
  aliases: [HTTP status]
  definition:
    uk: "Тризначне число на початку HTTP-відповіді: 2xx — успіх (`200` гаразд, `201` створено), 4xx — помилка в запиті (`400` неправильний запит, `404` не знайдено), 5xx — помилка сервера (`500`, `503` тимчасово недоступний). `response.ok` дорівнює `true` для 200–299."
    en: "A three-digit number at the start of an HTTP response: 2xx — success (`200` fine, `201` created), 4xx — a problem with the request (`400` bad request, `404` not found), 5xx — a server error (`500`, `503` temporarily unavailable). `response.ok` is `true` for 200–299."
  see: [fetch]
- id: content-type
  term: Content-Type
  name: { uk: "Content-Type", en: "Content-Type" }
  aliases: [MIME type, media type]
  definition:
    uk: "Заголовок, що каже, у якому форматі тіло запиту чи відповіді: `application/json` для JSON, `text/plain` для простого тексту, `text/html` для сторінки. Після крапки з комою може йти кодування: `application/json; charset=utf-8`. Перш ніж розбирати тіло як JSON, перевір, що сервер справді надіслав JSON."
    en: "The header that says what format a request’s or a response’s body is in: `application/json` for JSON, `text/plain` for plain text, `text/html` for a page. An encoding may follow after a semicolon: `application/json; charset=utf-8`. Before parsing a body as JSON, check that the server really sent JSON."
  see: [http-header, json]
- id: network-error
  term: network error
  name: { uk: "збій мережі", en: "network error" }
  aliases: [offline]
  definition:
    uk: "Запит, на який не прийшло жодної відповіді: немає інтернету, сервер недосяжний, з’єднання обірвалося або браузер заблокував запит. Тоді promise `fetch` відхиляється з `TypeError` (у Chrome — `Failed to fetch`). Це інша ситуація, ніж помилка HTTP на кшталт `500`: там сервер відповів, і `fetch` виконується з `ok: false`."
    en: "A request that got no answer at all: no internet, an unreachable server, a dropped connection or a request the browser blocked. Then the `fetch` promise rejects with a `TypeError` (in Chrome, `Failed to fetch`). It is a different situation from an HTTP error such as `500`: there the server answered, and `fetch` fulfills with `ok: false`."
  see: [fetch, status-code, request-timeout]
- id: loading-state
  term: loading state
  name: { uk: "стан завантаження", en: "loading state" }
  aliases: [request state]
  definition:
    uk: "Значення, що описує, де зараз запит: очікування (ще не почався), завантаження, успіх із даними чи помилка з її видом. Інтерфейс малюють за цим станом, а код запиту лише змінює його — тож людина завжди бачить, що відбувається, і ніколи не залишається з вічним «Завантаження…»."
    en: "A value that describes where a request is right now: idle (not started), loading, success with the data, or error with its kind. The interface is drawn from this state, and the request code only changes it — so the person always sees what is happening and is never left with an endless “Loading…”."
  example:
    code: "render({ status: \"loading\" });\n// later:\nrender({ status: \"error\", kind: \"network\" });"
  see: [request-timeout, network-error]
- id: request-timeout
  term: request timeout
  name: { uk: "тайм-аут запиту", en: "request timeout" }
  aliases: [timeout]
  definition:
    uk: "Межа очікування відповіді: якщо її немає за вказаний час, запит вважають невдалим і показують повідомлення. Без тайм-ауту запит, що завис, тримає сторінку в стані «Завантаження…» безкінечно. Тайм-аут, який лише перестає чекати, сам запит не зупиняє; щоб справді його скасувати, потрібен `AbortController`."
    en: "A limit on waiting for an answer: if none comes within the given time, the request counts as failed and a message is shown. Without a timeout a hung request keeps the page in “Loading…” forever. A timeout that only stops waiting does not stop the request itself; to really cancel it you need an `AbortController`."
  see: [loading-state, network-error]
- id: promise-combinator
  term: promise combinator
  name: { uk: "комбінатор promises", en: "promise combinator" }
  aliases: [Promise.all, Promise.allSettled, Promise.race, Promise.any]
  definition:
    uk: "Функція, що отримує масив promises і повертає один новий: `Promise.all` (усі виконані — або перша помилка), `Promise.allSettled` (опис кожного результату, ніколи не відхиляється), `Promise.race` (перший завершений, хоч яким) і `Promise.any` (перший успішний; відхиляється, лише коли не вдалися всі)."
    en: "A function that takes an array of promises and returns one new promise: `Promise.all` (all fulfilled — or the first error), `Promise.allSettled` (a description of every result, never rejects), `Promise.race` (the first to settle, either way) and `Promise.any` (the first success; rejects only when all fail)."
  see: [promise, partial-failure, concurrent-requests]
- id: concurrent-requests
  term: concurrent requests
  name: { uk: "паралельні запити", en: "concurrent requests" }
  definition:
    uk: "Запити, запущені разом, ще до того, як надійшла відповідь на будь-який із них. Загальне очікування — як у найповільнішого, а не сума всіх. JavaScript при цьому лишається однопотоковим: чекає браузер, а код лише запускає запити й потім обробляє відповіді по одній. Запити роблять по черзі лише тоді, коли наступному потрібен результат попереднього."
    en: "Requests started together, before any of them has answered. The total wait is that of the slowest one, not the sum of all. JavaScript stays single-threaded meanwhile: the browser does the waiting, and the code only starts the requests and then handles the answers one at a time. Requests go one after another only when the next one needs the previous one’s result."
  example:
    code: "const lists = await Promise.all(urls.map((url) => getItems(url)));"
  see: [promise-combinator]
- id: partial-failure
  term: partial failure
  name: { uk: "часткова невдача", en: "partial failure" }
  definition:
    uk: "Ситуація, коли з кількох запитів частина вдалася, а частина ні. Добрий інтерфейс показує те, що прийшло, і окремо позначає невдалі частини з можливістю повтору, а не втрачає все через одну помилку. Для цього зручний `Promise.allSettled`."
    en: "A situation in which some of several requests succeed and some fail. A good interface shows what arrived and marks the failed parts separately with a way to retry, instead of losing everything because of one error. `Promise.allSettled` is handy for that."
  see: [promise-combinator]
- id: abort-controller
  term: AbortController
  name: { uk: "AbortController", en: "AbortController" }
  definition:
    uk: "Вбудований об’єкт для скасування: `new AbortController()` дає контролер, його `signal` передають у `fetch`, а `controller.abort()` зупиняє запит — і promise відхиляється помилкою `AbortError`. Скасований контролер лишається скасованим, тож для кожного нового запиту створюють новий."
    en: "A built-in object for cancellation: `new AbortController()` gives a controller, its `signal` is passed to `fetch`, and `controller.abort()` stops the request — the promise then rejects with an `AbortError`. An aborted controller stays aborted, so every new request gets a new one."
  example:
    code: "const controller = new AbortController();\nfetch(\"/lab/delay/2000\", { signal: controller.signal })\n  .catch((error) => console.log(error.name)); // AbortError\ncontroller.abort();"
  see: [abort-signal, cancellation]
- id: abort-signal
  term: AbortSignal
  name: { uk: "сигнал скасування (AbortSignal)", en: "AbortSignal" }
  definition:
    uk: "Об’єкт, що повідомляє про скасування: `controller.signal`. Його отримує `fetch` (чи інший код, що вміє скасовуватися); `signal.aborted` каже, чи скасування вже сталося. `AbortSignal.timeout(ms)` дає сигнал, що скасовує сам через `ms` мілісекунд, — тоді помилка має назву `TimeoutError`."
    en: "An object that announces cancellation: `controller.signal`. `fetch` (or other code that can be cancelled) receives it; `signal.aborted` tells whether the cancellation has happened. `AbortSignal.timeout(ms)` gives a signal that cancels by itself after `ms` milliseconds — the error is then named `TimeoutError`."
  see: [abort-controller]
- id: cancellation
  term: cancellation
  name: { uk: "скасування", en: "cancellation" }
  definition:
    uk: "Зупинка роботи, результат якої вже не потрібен: запиту для старого тексту пошуку, завантаження для закритої частини сторінки. Скасування — нормальна подія, а не збій: про нього не показують повідомлення про помилку, а разом із запитом прибирають і його таймери та обробники. Воно не повертає назад того, що сервер уже зробив."
    en: "Stopping work whose result is no longer needed: a request for an old search text, a load for a part of the page that was closed. Cancellation is a normal event, not a failure: no error message is shown for it, and the request’s timers and listeners are removed together with it. It does not undo what the server has already done."
  see: [abort-controller, request-timeout]
- id: stale-response
  term: stale response
  name: { uk: "застаріла відповідь", en: "stale response" }
  definition:
    uk: "Відповідь, що прийшла на запит, який уже не актуальний: людина встигла змінити пошук, фільтр чи сторінку. Якщо показати її, вона перекриє новіші дані. Застарілу відповідь скасовують або ігнорують за правилом «перемагає найновіший»."
    en: "An answer that arrived for a request that no longer matters: the person has already changed the search, the filter or the page. Shown on screen, it overwrites newer data. A stale response is aborted or ignored by the latest-wins rule."
  see: [race-condition, latest-wins]
- id: race-condition
  term: race condition
  name: { uk: "перегони (race condition)", en: "race condition" }
  definition:
    uk: "Помилка, за якої результат залежить від того, яка з одночасних дій завершиться першою, хоча порядок ніхто не гарантує. Типовий приклад — два запити пошуку: повільніша давня відповідь приходить останньою й перекриває новішу. Такі помилки підступні: на швидкій мережі їх може й не бути видно."
    en: "A bug in which the result depends on which of several simultaneous actions finishes first, although nobody guarantees the order. The typical example is two search requests: the slower old answer arrives last and overwrites the newer one. Such bugs are sneaky: on a fast network they may not show at all."
  see: [stale-response, latest-wins]
- id: latest-wins
  term: latest wins
  name: { uk: "«перемагає найновіший»", en: "latest wins" }
  definition:
    uk: "Правило проти перегонів: показувати лише відповідь на найновіший запит. Його втілюють скасуванням попереднього запиту (`AbortController`) або номером запиту: кожен запит запам’ятовує свій номер, і відповідь ігнорується, якщо її номер уже не найновіший."
    en: "A rule against races: show only the answer to the latest request. It is implemented by aborting the previous request (`AbortController`) or with a request number: every request remembers its number, and an answer is ignored when its number is no longer the latest."
  see: [stale-response, race-condition, abort-controller]
- id: bounded-retry
  term: bounded retry
  name: { uk: "обмежений повтор", en: "bounded retry" }
  aliases: [retry, backoff]
  definition:
    uk: "Повторна спроба невдалого запиту з чіткими межами: повторюють лише збої, що можуть минути (немає мережі, 5xx), роблять обмежену кількість спроб із дедалі довшими паузами між ними й здаються зрозумілою помилкою. Відповіді 4xx не повторюють, а запити, що змінюють дані, повторюють обережно — щоб не створити запис двічі."
    en: "Trying a failed request again within clear limits: only failures that may pass are retried (no network, 5xx), a limited number of attempts is made with growing pauses between them, and the code gives up with a clear error. 4xx answers are not retried, and requests that change data are retried with care — so as not to create a record twice."
  see: [network-error, status-code]
- id: floating-promise
  term: floating promise
  name: { uk: "«загублений» promise", en: "floating promise" }
  definition:
    uk: "Promise, на який ніхто не чекає (`await`, `.then`) і чиїх помилок ніхто не обробляє — найчастіше через виклик async-функції без `await`. Код після такого виклику йде далі, ніби робота вже зроблена, а помилка стане необробленим відхиленням. Якщо результат справді не потрібен, promise відпускають свідомо — але з `.catch`."
    en: "A promise that nobody waits for (`await`, `.then`) and whose errors nobody handles — most often because an async function was called without `await`. The code after such a call moves on as if the work were done, and an error becomes an unhandled rejection. When the result really is not needed, the promise is let go on purpose — but with a `.catch`."
  see: [unhandled-rejection, await]
