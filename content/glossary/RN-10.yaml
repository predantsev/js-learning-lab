# Terms introduced in RN-10.
- id: pan-gesture
  term: pan gesture
  name: { uk: "pan-жест", en: "pan gesture" }
  aliases: ["Gesture.Pan", "pan", "свайп", "swipe", "перетягування"]
  definition:
    uk: "Жест, у якому палець торкається елемента й тягне його: свайп рядка, перетягування картки. Він повідомляє, наскільки й куди посунувся палець (`translationX`, `translationY`) і з якою швидкістю (`velocityX`, `velocityY`). На відміну від натискання, pan починається лише після руху за поріг активації, тож може поступитися дотиком іншому жесту, наприклад прокрутці списку."
    en: "A gesture in which a finger touches an element and drags it: a row swipe, dragging a card. It reports how far and where the finger moved (`translationX`, `translationY`) and how fast (`velocityX`, `velocityY`). Unlike a press, a pan starts only after a move beyond its activation threshold, so it can give the touch up to another gesture, such as list scrolling."
  see: [gesture-arbitration, activation-threshold, pressable]
- id: gesture-arbitration
  term: gesture arbitration
  name: { uk: "узгодження жестів", en: "gesture arbitration" }
  aliases: ["арбітраж жестів", "touch ownership", "власник дотику"]
  definition:
    uk: "Рішення, який із кількох жестів, що претендують на один дотик, стає його власником. Поки палець не вийшов за жодну межу, усі кандидати чекають; той, чиї умови виконалися першими, активується, а решта провалюються або скасовуються. Так горизонтальний свайп рядка й вертикальна прокрутка списку ділять той самий дотик."
    en: "Deciding which of several gestures that claim one touch becomes its owner. While the finger has not left any range, all candidates wait; the one whose conditions are met first activates, and the others fail or are canceled. This is how a row's horizontal swipe and a list's vertical scrolling share the same touch."
  see: [pan-gesture, activation-threshold]
- id: activation-threshold
  term: activation threshold
  name: { uk: "поріг активації", en: "activation threshold" }
  aliases: ["activeOffsetX", "activeOffsetY", "failOffsetY", "failOffsetX", "minDistance"]
  definition:
    uk: "Відстань, яку палець має пройти, перш ніж жест почнеться. У react-native-gesture-handler `activeOffsetX([-12, 12])` означає «почати, коли палець вийде за 12 точок управо чи вліво», а `failOffsetY([-8, 8])` — «відмовитися, якщо до активації палець піде вгору чи вниз більш ніж на 8 точок». Разом вони задають напрямок жесту й не дають йому забрати чужий рух."
    en: "The distance a finger must travel before a gesture starts. In react-native-gesture-handler `activeOffsetX([-12, 12])` means “start when the finger leaves 12 points to the right or left”, and `failOffsetY([-8, 8])` means “give up if, before activation, the finger goes more than 8 points up or down”. Together they set the gesture's direction and keep it from taking someone else's movement."
  see: [pan-gesture, gesture-arbitration]
- id: animated-value
  term: Animated.Value
  name: { uk: "анімоване значення (Animated.Value)", en: "animated value (Animated.Value)" }
  aliases: ["Animated.Value", "Animated", "Animated.timing", "Animated.View"]
  definition:
    uk: "Число з API `Animated` React Native, що змінюється з часом поза станом React. Анімація (`Animated.timing`, `Animated.spring`) веде його до `toValue`, а `Animated.View` бере його просто зі стилю й оновлює view на кожному кадрі без нового рендеру твого компонента. Колбек `start(({ finished }) => …)` викликається один раз, коли анімація закінчилася або її зупинили."
    en: "A number from React Native's `Animated` API that changes over time outside React state. An animation (`Animated.timing`, `Animated.spring`) drives it towards `toValue`, and an `Animated.View` takes it straight from its style and updates the view on every frame without a new render of your component. The `start(({ finished }) => …)` callback is called once, when the animation has ended or was stopped."
  see: [spring-animation, animated-interpolation]
- id: spring-animation
  term: spring animation
  name: { uk: "пружинна анімація (spring)", en: "spring animation" }
  aliases: ["Animated.spring", "spring", "пружина", "damping", "stiffness"]
  definition:
    uk: "Анімація, що веде значення до цілі як пружина: без фіксованої тривалості, з можливим проскакуванням і коливаннями. `stiffness` задає жорсткість пружини, `damping` — гасіння (більше — менше коливань), `mass` — масу. Вона зупиняється сама, коли і швидкість, і відстань до `toValue` стають майже нулем."
    en: "An animation that drives a value to its target like a spring: with no fixed duration, possibly overshooting and oscillating. `stiffness` sets how stiff the spring is, `damping` how strongly it is damped (more means less oscillation), `mass` its mass. It stops by itself when both the speed and the distance to `toValue` become almost zero."
  see: [animated-value]
- id: animated-interpolation
  term: interpolation
  name: { uk: "інтерполяція (interpolate)", en: "interpolation (interpolate)" }
  aliases: ["interpolate", "inputRange", "outputRange", "extrapolate"]
  definition:
    uk: "Перетворення одного анімованого значення на інше за таблицею діапазонів: `value.interpolate({ inputRange: [0, 1], outputRange: [1, 0.8] })`. `inputRange` має зростати. Нове значення рухається разом з початковим, тож одна анімація керує кількома властивостями. `extrapolate: 'clamp'` не дає виходу за межі `outputRange`."
    en: "Turning one animated value into another through a table of ranges: `value.interpolate({ inputRange: [0, 1], outputRange: [1, 0.8] })`. `inputRange` must increase. The new value moves together with the original, so one animation drives several properties. `extrapolate: 'clamp'` keeps the result within `outputRange`."
  see: [animated-value]
