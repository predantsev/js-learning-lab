# Terms introduced in RN-10.
- id: pan-gesture
  term: pan gesture
  name: { uk: "pan-жест", en: "pan gesture" }
  aliases: ["Gesture.Pan", "pan", "свайп", "swipe", "перетягування"]
  definition:
    uk: "Жест, у якому палець торкається елемента й тягне його: свайп рядка, перетягування картки. Він повідомляє, наскільки й куди посунувся палець (`translationX`, `translationY`) і з якою швидкістю (`velocityX`, `velocityY`). На відміну від натискання, pan починається лише після руху за поріг активації, тож може поступитися дотиком іншому жесту, наприклад прокрутці списку."
    en: "A gesture in which a finger touches an element and drags it: a row swipe, dragging a card. It reports how far and where the finger moved (`translationX`, `translationY`) and how fast (`velocityX`, `velocityY`). Unlike a press, a pan starts only after a move beyond its activation threshold, so it can give the touch up to another gesture, such as list scrolling."
  see: [gesture-arbitration, activation-threshold, pressable]
- id: gesture-arbitration
  term: gesture arbitration
  name: { uk: "узгодження жестів", en: "gesture arbitration" }
  aliases: ["арбітраж жестів", "touch ownership", "власник дотику"]
  definition:
    uk: "Рішення, який із кількох жестів, що претендують на один дотик, стає його власником. Поки палець не вийшов за жодну межу, усі кандидати чекають; той, чиї умови виконалися першими, активується, а решта провалюються або скасовуються. Так горизонтальний свайп рядка й вертикальна прокрутка списку ділять той самий дотик."
    en: "Deciding which of several gestures that claim one touch becomes its owner. While the finger has not left any range, all candidates wait; the one whose conditions are met first activates, and the others fail or are canceled. This is how a row's horizontal swipe and a list's vertical scrolling share the same touch."
  see: [pan-gesture, activation-threshold]
- id: activation-threshold
  term: activation threshold
  name: { uk: "поріг активації", en: "activation threshold" }
  aliases: ["activeOffsetX", "activeOffsetY", "failOffsetY", "failOffsetX", "minDistance"]
  definition:
    uk: "Відстань, яку палець має пройти, перш ніж жест почнеться. У react-native-gesture-handler `activeOffsetX([-12, 12])` означає «почати, коли палець вийде за 12 точок управо чи вліво», а `failOffsetY([-8, 8])` — «відмовитися, якщо до активації палець піде вгору чи вниз більш ніж на 8 точок». Разом вони задають напрямок жесту й не дають йому забрати чужий рух."
    en: "The distance a finger must travel before a gesture starts. In react-native-gesture-handler `activeOffsetX([-12, 12])` means “start when the finger leaves 12 points to the right or left”, and `failOffsetY([-8, 8])` means “give up if, before activation, the finger goes more than 8 points up or down”. Together they set the gesture's direction and keep it from taking someone else's movement."
  see: [pan-gesture, gesture-arbitration]
- id: animated-value
  term: Animated.Value
  name: { uk: "анімоване значення (Animated.Value)", en: "animated value (Animated.Value)" }
  aliases: ["Animated.Value", "Animated", "Animated.timing", "Animated.View"]
  definition:
    uk: "Число з API `Animated` React Native, що змінюється з часом поза станом React. Анімація (`Animated.timing`, `Animated.spring`) веде його до `toValue`, а `Animated.View` бере його просто зі стилю й оновлює view на кожному кадрі без нового рендеру твого компонента. Колбек `start(({ finished }) => …)` викликається один раз, коли анімація закінчилася або її зупинили."
    en: "A number from React Native's `Animated` API that changes over time outside React state. An animation (`Animated.timing`, `Animated.spring`) drives it towards `toValue`, and an `Animated.View` takes it straight from its style and updates the view on every frame without a new render of your component. The `start(({ finished }) => …)` callback is called once, when the animation has ended or was stopped."
  see: [spring-animation, animated-interpolation]
- id: spring-animation
  term: spring animation
  name: { uk: "пружинна анімація (spring)", en: "spring animation" }
  aliases: ["Animated.spring", "spring", "пружина", "damping", "stiffness"]
  definition:
    uk: "Анімація, що веде значення до цілі як пружина: без фіксованої тривалості, з можливим проскакуванням і коливаннями. `stiffness` задає жорсткість пружини, `damping` — гасіння (більше — менше коливань), `mass` — масу. Вона зупиняється сама, коли і швидкість, і відстань до `toValue` стають майже нулем."
    en: "An animation that drives a value to its target like a spring: with no fixed duration, possibly overshooting and oscillating. `stiffness` sets how stiff the spring is, `damping` how strongly it is damped (more means less oscillation), `mass` its mass. It stops by itself when both the speed and the distance to `toValue` become almost zero."
  see: [animated-value]
- id: animated-interpolation
  term: interpolation
  name: { uk: "інтерполяція (interpolate)", en: "interpolation (interpolate)" }
  aliases: ["interpolate", "inputRange", "outputRange", "extrapolate"]
  definition:
    uk: "Перетворення одного анімованого значення на інше за таблицею діапазонів: `value.interpolate({ inputRange: [0, 1], outputRange: [1, 0.8] })`. `inputRange` має зростати. Нове значення рухається разом з початковим, тож одна анімація керує кількома властивостями. `extrapolate: 'clamp'` не дає виходу за межі `outputRange`."
    en: "Turning one animated value into another through a table of ranges: `value.interpolate({ inputRange: [0, 1], outputRange: [1, 0.8] })`. `inputRange` must increase. The new value moves together with the original, so one animation drives several properties. `extrapolate: 'clamp'` keeps the result within `outputRange`."
  see: [animated-value]
- id: frame-budget
  term: frame budget
  name: { uk: "бюджет кадру", en: "frame budget" }
  aliases: ["16.67 ms", "16,67 мс", "60 fps", "120 Hz", "кадр"]
  definition:
    uk: "Час, за який застосунок має підготувати один кадр: 1000 / частота екрана. На 60 Гц це ≈ 16,67 мс, на 120 Гц — ≈ 8,33 мс. Робота, що не вміщається в бюджет, дає пропущені кадри; тому важить, чи вміщається вона на цільовому пристрої, а не на ноутбуці."
    en: "The time an app has to prepare one frame: 1000 / the screen's refresh rate. At 60 Hz that is ≈ 16.67 ms, at 120 Hz ≈ 8.33 ms. Work that does not fit into the budget produces dropped frames; so what matters is whether it fits on the target device, not on a laptop."
  see: [dropped-frame, js-thread, ui-thread]
- id: dropped-frame
  term: dropped frame
  name: { uk: "пропущений кадр", en: "dropped frame" }
  aliases: ["jank", "ривок", "janky frame", "frame drop"]
  definition:
    uk: "Кадр, для якого застосунок не встиг підготувати нове зображення, тож екран повторив старе. Кілька пропущених кадрів поспіль користувач бачить як ривок чи «зависання» анімації. Їх рахують інструментами профілювання на пристрої, у release-збірці."
    en: "A frame for which the app did not prepare a new image in time, so the screen repeated the old one. Several dropped frames in a row are seen by the user as a jerk or a “stuck” animation. They are counted with profiling tools on a device, in a release build."
  see: [frame-budget]
- id: native-driver
  term: native driver
  name: { uk: "native driver", en: "native driver" }
  aliases: ["useNativeDriver", "useNativeDriver: true"]
  definition:
    uk: "Режим `Animated` (`useNativeDriver: true`), у якому опис анімації передається в нативний код до старту, а кадри рахує потік UI. Тоді зайнятий потік JS не пропускає кадрів цієї анімації. Працює лише для властивостей, що не змінюють розкладку (як-от `transform`, `opacity`); `Animated.event` з ним підтримує `onScroll`, але не `PanResponder`."
    en: "An `Animated` mode (`useNativeDriver: true`) in which the animation's description is handed to native code before it starts, and the UI thread computes the frames. A busy JS thread then drops no frames of this animation. It works only for properties that do not change layout (such as `transform`, `opacity`); `Animated.event` with it supports `onScroll`, but not `PanResponder`."
  see: [animated-value, ui-thread, frame-budget]
- id: interruptible-animation
  term: interruptible animation
  name: { uk: "переривна анімація", en: "interruptible animation" }
  aliases: ["stop()", "finished: false", "скасування анімації", "animation cancellation"]
  definition:
    uk: "Анімація, яку можна зупинити в будь-який момент — коли компонент демонтується, екран втрачає фокус чи застосунок іде у фон, — не лишивши стан напівзміненим. Її зупиняють `stop()` у cleanup ефекту; колбек `start` після цього приходить з `finished: false`, тож код, що змінює стан, перевіряє `finished`."
    en: "An animation that can be stopped at any moment — when the component unmounts, the screen loses focus or the app goes to the background — without leaving state half-changed. It is stopped with `stop()` in an effect cleanup; the `start` callback then comes with `finished: false`, so code that changes state checks `finished`."
  see: [animated-value]
- id: reduce-motion-setting
  term: reduce motion setting
  name: { uk: "налаштування «зменшити рух»", en: "reduce motion setting" }
  aliases: ["Reduce Motion", "isReduceMotionEnabled", "reduceMotionChanged", "AccessibilityInfo", "Remove animations"]
  definition:
    uk: "Налаштування доступності iOS і Android, яким людина просить менше руху на екрані. У React Native його читають через `AccessibilityInfo.isReduceMotionEnabled()` і стежать за ним через подію `reduceMotionChanged` (підписку прибирають `remove()`). Коли воно ввімкнене, рух замінюють згасанням чи миттєвою зміною з тим самим кінцевим станом; зворотний зв’язок лишається."
    en: "An iOS and Android accessibility setting with which a person asks for less motion on screen. In React Native it is read with `AccessibilityInfo.isReduceMotionEnabled()` and followed through the `reduceMotionChanged` event (the subscription is removed with `remove()`). When it is on, motion is replaced by a fade or an instant change with the same end state; feedback stays."
  see: [reduced-motion, interruptible-animation]
- id: density-variant
  term: density variant
  name: { uk: "варіант щільності (@2x/@3x)", en: "density variant (@2x/@3x)" }
  aliases: ["@2x", "@3x", "image variant", "варіант зображення"]
  definition:
    uk: "Та сама картинка в кількох розмірах для екранів різної щільності: `check.png`, `check@2x.png`, `check@3x.png`. Для картинок у бандлі `require('./check.png')` сам обирає варіант під щільність пристрою; для картинок із сервера розмір просять самі: точки × `PixelRatio`."
    en: "The same picture in several sizes for screens of different density: `check.png`, `check@2x.png`, `check@3x.png`. For bundled pictures `require('./check.png')` picks the variant for the device's density by itself; for pictures from a server you ask for the size yourself: points × `PixelRatio`."
  see: [pixel-ratio, decoded-image-size]
- id: decoded-image-size
  term: decoded image size
  name: { uk: "розкодований розмір зображення", en: "decoded image size" }
  aliases: ["bitmap memory", "пам’ять зображення", "width × height × 4"]
  definition:
    uk: "Скільки пам’яті займає картинка, розпакована для малювання: типово ширина × висота в пікселях × 4 байти. Фото 4000 × 3000 — це 48 000 000 байтів, хай який маленький файл JPEG і хай яке маленьке місце на екрані."
    en: "How much memory a picture takes once unpacked for drawing: typically width × height in pixels × 4 bytes. A 4000 × 3000 photo is 48,000,000 bytes, however small the JPEG file and however small its place on screen."
  see: [density-variant]
- id: bundled-font
  term: custom font loading
  name: { uk: "власний шрифт і його завантаження", en: "custom font loading" }
  aliases: ["useFonts", "expo-font", "fontFamily", "SplashScreen.preventAutoHideAsync", "вбудований шрифт", "bundled font"]
  definition:
    uk: "Шрифт, якого немає в системі, треба або вбудувати в збірку (плагін `expo-font`, готовий на старті), або завантажити під час роботи (`useFonts` повертає `[loaded, error]`). Доки він не готовий, платформа малює текст системним шрифтом, тож текст із власним шрифтом показують після завантаження, тримаючи заставку чи заглушку."
    en: "A font the system does not have must either be embedded in the build (the `expo-font` plugin, ready at launch) or loaded at runtime (`useFonts` returns `[loaded, error]`). Until it is ready, the platform draws text with the system font, so text in a custom font is shown after loading, keeping a splash screen or a placeholder meanwhile."
  see: [density-variant]
- id: release-profiling
  term: release profiling
  name: { uk: "профілювання release-збірки", en: "release profiling" }
  aliases: ["profiling release vs debug", "базова лінія", "baseline", "dumpsys gfxinfo", "Instruments"]
  definition:
    uk: "Вимірювання продуктивності в release-збірці на заявленій цілі, з тим самим набором даних і сценарієм для кожного запуску. Debug додає dev-сервер, перевірки розробника й неоптимізований JavaScript, тож його числа не описують те, що бачить користувач. Кожне число записують з умовами: ціль, режим збірки, розмір даних, сценарій, і що не виміряно."
    en: "Measuring performance in a release build on the declared target, with the same dataset and script on every run. Debug adds a dev server, developer checks and unoptimized JavaScript, so its numbers do not describe what the user sees. Every number is recorded with its conditions: the target, the build mode, the dataset size, the script, and what was not measured."
  see: [performance-baseline, release-build, perf-monitor]
- id: perf-monitor
  term: Perf Monitor
  name: { uk: "Perf Monitor", en: "Perf Monitor" }
  aliases: ["Show Perf Monitor", "Performance Monitor", "монітор продуктивності"]
  definition:
    uk: "Накладка React Native з Dev Menu, що показує частоту кадрів потоків JS і UI. Документація називає її орієнтиром і радить для точних вимірювань нативні інструменти Android Studio й Xcode. Dev Menu є лише в debug-збірці, тож для release-чисел Perf Monitor не годиться."
    en: "A React Native overlay from the Dev Menu that shows the frame rates of the JS and UI threads. The docs call it a guide and recommend the native tooling of Android Studio and Xcode for accurate measurements. The Dev Menu exists only in a debug build, so the Perf Monitor does not work for release numbers."
  see: [release-profiling, debug-build]
