# Terms introduced by the capstone-step lessons, which the compiler writes from
# content/capstones/steps/<UNIT>/step.yaml (see content/capstones/README.md). A separate file keeps
# them apart from the unit authors' glossary files.
- id: capstone
  term: capstone
  name: { uk: "наскрізний проєкт", en: "capstone project" }
  definition:
    uk: "Твій власний застосунок, який ти будуєш упродовж усього курсу: спершу на JavaScript, потім на React, React Native і Node.js. Кожен розділ додає до нього один крок, а файли й дані залишаються тими самими."
    en: "Your own app that you build through the whole course: first in JavaScript, then in React, React Native and Node.js. Every unit adds one step to it, and the files and data stay the same project."
  aliases: ["capstone project", "проєкт курсу"]
  see: [starter]
- id: starter
  term: starter
  name: { uk: "стартовий стан", en: "starter" }
  definition:
    uk: "Готовий набір файлів, з якого починається крок проєкту. Якщо попередні кроки пропущено, платформа може запропонувати їхній еталонний стан замість твоїх файлів — після перегляду змін і створення знімка. Такий крок позначається як «застосовано еталон», а не як виконаний."
    en: "A ready set of files a project step starts from. If earlier steps were skipped, the platform can offer their reference state instead of your files — after a preview and a snapshot. Such a step is marked “reference applied”, not done."
  aliases: ["starter code", "стартовий код"]
  see: [capstone]
- id: extract-function
  term: extract function
  name: { uk: "винесення у функцію", en: "extract function" }
  definition:
    uk: "Зміна коду, яка не змінює його поведінки: шматок коду, що повторюється або робить окрему справу, переносять у функцію з назвою, а на його місці залишають виклик. Те, що код брав іззовні, стає параметрами, а його результат — значенням, яке функція повертає. Програма працює так само, але правило записане один раз, і його можна перевірити окремо."
    en: "A change to the code that keeps its behavior: a piece of code that repeats or does a separate job moves into a named function, and a call stays in its place. What the code took from outside becomes parameters, and its result becomes the return value. The program works the same, but the rule is written once and can be checked on its own."
  aliases: ["extract method", "винести у функцію"]
  example:
    code: "// before: the same formula twice\n// const mondayF = mondayC * 9 / 5 + 32;\n// const tuesdayF = tuesdayC * 9 / 5 + 32;\n\n// after: the formula is written once and called twice\nfunction toFahrenheit(celsius) {\n  return celsius * 9 / 5 + 32;\n}\nconst mondayF = toFahrenheit(mondayC);\nconst tuesdayF = toFahrenheit(tuesdayC);"
  see: [function, pure-function]
- id: derived-value
  term: derived value
  name: { uk: "похідне значення", en: "derived value" }
  definition:
    uk: "Значення, яке не зберігають окремо, а щоразу обчислюють з інших даних: кількість записів, суму, частку виконаних. Його рахує чиста функція зі списку, тож воно завжди відповідає поточним даним і не може застаріти, як окремо збережена копія."
    en: "A value that is not stored separately but computed from other data every time: a record count, a total, a completion rate. A pure function computes it from the list, so it always matches the current data and cannot go stale the way a separately stored copy can."
  aliases: ["computed value", "обчислене значення"]
  example:
    code: "// stored: must be updated by hand after every change, or it goes stale\n// let totalMinutes = 80;\n\n// derived: computed from the data whenever it is needed\nconst sessions = [25, 40, 15];\nconst totalMinutes = sessions.reduce((sum, minutes) => sum + minutes, 0);"
  see: [pure-function, array-reduce]
- id: readme
  term: README
  name: { uk: "README", en: "README" }
  definition:
    uk: "Файл `README.md` у корені проєкту: короткий опис для людини, яка відкриває теку вперше, — що це за проєкт, з яких даних він складається і як його запустити. Його пишуть у Markdown: рядок, що починається з `#`, — заголовок. VS Code і сайти з репозиторіями показують README першим."
    en: "The file `README.md` at the root of a project: a short description for a person who opens the folder for the first time — what the project is, what data it is made of and how to run it. It is written in Markdown: a line that starts with `#` is a heading. VS Code and repository sites show the README first."
  aliases: ["README.md", "readme file"]
  see: [git-repository, git-commit]
- id: checkpoint
  term: checkpoint
  name: { uk: "контрольна точка", en: "checkpoint" }
  definition:
    uk: "Перевірений стан проєкту в кінці етапу курсу (CP-JS після JavaScript): ти за списком перевіряєш, що застосунок працює, тести проходять, а дані зберігаються, і фіксуєш цей стан у commit, повідомлення якого каже, що перевірено. До контрольної точки завжди можна повернутися, а наступний етап починається з неї."
    en: "A verified state of the project at the end of a course stage (CP-JS after JavaScript): you check against a list that the app works, the tests pass and the data is kept, and record that state in a commit whose message says what was verified. You can always return to a checkpoint, and the next stage starts from it."
  aliases: ["CP-JS", "контрольна точка проєкту"]
  see: [git-commit]
