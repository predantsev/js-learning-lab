# Terms introduced in NO-10. One file per unit keeps parallel authoring conflict-free.
- id: authentication
  term: authentication
  name: { uk: "автентифікація", en: "authentication" }
  aliases: ["authn", "authenticate", "автентифікувати"]
  definition:
    uk: "Перевірка, **хто** надсилає запит: сервер перетворює облікові дані (cookie сесії, токен) на конкретного користувача. Немає облікових даних, вони зламані чи невідомі — запит не автентифіковано, і HTTP-відповідь має статус 401 Unauthorized (попри назву, він означає саме «не знаю, хто ти»)."
    en: "Checking **who** sends a request: the server turns a credential (a session cookie, a token) into a particular user. No credential, a broken or an unknown one — the request is not authenticated, and the HTTP answer is 401 Unauthorized (despite its name, it means exactly “I do not know who you are”)."
  example:
    code: "GET /notes/n-1            → 401 (no credential)\nAuthorization: Bearer ??? → 401 (unknown credential)"
  see: [authorization]
- id: authorization
  term: authorization
  name: { uk: "авторизація", en: "authorization" }
  aliases: ["authz", "access control", "контроль доступу", "permission check", "перевірка дозволу"]
  definition:
    uk: "Перевірка, чи **може** вже відомий користувач зробити цю дію з цим ресурсом: прочитати чужу нотатку, видалити запис, змінити налаштування. Відмова — статус 403 Forbidden: сервер знає, хто ти, але не дозволяє. Авторизація завжди йде після автентифікації й перевіряється на сервері для кожного запиту, а не лише в інтерфейсі."
    en: "Checking whether an already known user **may** do this action to this resource: read someone else's note, delete a record, change a setting. A refusal is status 403 Forbidden: the server knows who you are but does not allow it. Authorization always comes after authentication and is checked on the server for every request, not only in the interface."
  example:
    code: "Authorization: Bearer <u-02>  GET /notes/n-1 (owner u-01) → 403"
  see: [authentication]
- id: password-hash
  term: password hash
  name: { uk: "хеш пароля", en: "password hash" }
  aliases: ["hashed password", "захешований пароль", "hash a password", "хешування паролів"]
  definition:
    uk: "Те, що сервер зберігає замість пароля: результат навмисно повільної функції виведення ключа (scrypt, Argon2id, bcrypt) від пароля з випадковою сіллю, разом із сіллю й параметрами. Під час входу хеш обчислюють заново й порівнюють. Пароль із хешу назад не обчислити — його можна лише підбирати, і повільна функція робить кожну спробу дорогою."
    en: "What a server stores instead of a password: the output of a deliberately slow key derivation function (scrypt, Argon2id, bcrypt) over the password with a random salt, together with the salt and the parameters. At login the hash is computed again and compared. The password cannot be computed back from the hash — it can only be guessed, and a slow function makes every guess expensive."
  see: [salt, key-derivation-function, timing-safe-comparison]
- id: salt
  term: salt
  name: { uk: "сіль", en: "salt" }
  aliases: ["password salt", "сіль пароля"]
  definition:
    uk: "Випадкові байти (щонайменше 16), які створюють окремо для кожного пароля й зберігають поруч із його хешем. Через сіль однакові паролі дають різні хеші, а заздалегідь обчислена таблиця «пароль → хеш» не працює. Сіль не секрет — секретність їй і не потрібна."
    en: "Random bytes (at least 16) created separately for every password and stored next to its hash. Because of the salt, equal passwords give different hashes, and a precomputed “password → hash” table does not work. A salt is not a secret — it does not need to be one."
  example:
    code: "const salt = crypto.randomBytes(16);"
  see: [password-hash]
- id: key-derivation-function
  term: key derivation function
  name: { uk: "функція виведення ключа (KDF)", en: "key derivation function (KDF)" }
  aliases: ["KDF", "scrypt", "Argon2id", "bcrypt", "PBKDF2"]
  definition:
    uk: "Функція, що з пароля й солі виводить ключ або хеш, навмисно витрачаючи час і (у scrypt та Argon2id) пам’ять. Параметр вартості задає, наскільки дорогою буде кожна спроба. Для паролів беруть лише перевірені KDF з відомими параметрами; у `node:crypto` Node.js 22 є `scrypt` і `pbkdf2`."
    en: "A function that derives a key or a hash from a password and a salt, deliberately spending time and (in scrypt and Argon2id) memory. A cost parameter sets how expensive every attempt is. For passwords only vetted KDFs with known parameters are used; `node:crypto` in Node.js 22 has `scrypt` and `pbkdf2`."
  see: [password-hash, salt]
- id: timing-safe-comparison
  term: timing-safe comparison
  name: { uk: "порівняння за сталий час", en: "timing-safe comparison" }
  aliases: ["constant-time comparison", "timingSafeEqual", "crypto.timingSafeEqual"]
  definition:
    uk: "Порівняння двох секретних значень (хешів, токенів, підписів), що триває однаково, хоч би де вони відрізнялися. Звичайне `===` чи `Buffer.equals` зупиняється на першому різному байті, і час відповіді може підказати зловмисникові, скільки байтів він уже вгадав. У Node.js — `crypto.timingSafeEqual(a, b)`; вона кидає `RangeError`, коли довжини різні, тож довжини перевіряють заздалегідь."
    en: "A comparison of two secret values (hashes, tokens, signatures) that takes the same time wherever they differ. A plain `===` or `Buffer.equals` stops at the first differing byte, and the response time can hint to an attacker how many bytes they already guessed. In Node.js it is `crypto.timingSafeEqual(a, b)`; it throws a `RangeError` when the lengths differ, so the lengths are checked beforehand."
  see: [password-hash]
