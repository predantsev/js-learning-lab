# Terms introduced in RE-02. One file per unit keeps parallel authoring conflict-free.
- id: state-variable
  term: state variable
  name: { uk: "змінна стану", en: "state variable" }
  definition:
    uk: "Значення, яке React зберігає для компонента між рендерами. Компонент читає його на кожен рендер, а змінює лише через сетер — і тоді React рендерить компонент знову. Звичайна змінна всередині функції компонента створюється наново під час кожного рендеру й нічого не пам’ятає."
    en: "A value React keeps for a component between renders. The component reads it on every render and changes it only through the setter — and then React renders the component again. A plain variable inside the component function is created anew on every render and remembers nothing."
  aliases: ["state", "стан"]
  see: [use-state, state-setter]
- id: use-state
  term: useState
  name: { uk: "useState", en: "useState" }
  definition:
    uk: "Хук React, що додає компоненту змінну стану. `useState(initial)` повертає пару `[value, setValue]`: поточне значення й сетер. Початкове значення використовується лише на першому рендері. Хуки викликають на верхньому рівні компонента, не в умовах і не в циклах."
    en: "The React hook that adds a state variable to a component. `useState(initial)` returns the pair `[value, setValue]`: the current value and the setter. The initial value is used only on the first render. Hooks are called at the top level of a component, not inside conditions or loops."
  aliases: ["хук useState"]
  see: [state-variable, state-setter]
  example:
    lang: jsx
    code: "const [category, setCategory] = useState(\"home\");"
- id: state-setter
  term: state setter
  name: { uk: "сетер стану", en: "state setter" }
  definition:
    uk: "Функція з пари `useState`, що змінює змінну стану. Вона не змінює змінну на місці: ставить оновлення в чергу й просить React про новий рендер, у якому `useState` поверне нове значення."
    en: "The function from the `useState` pair that changes a state variable. It does not change the variable in place: it queues the update and asks React for a new render, in which `useState` returns the new value."
  aliases: ["setter", "сетер", "set function"]
  see: [use-state, state-snapshot]
- id: event-handler-prop
  term: event handler prop
  name: { uk: "обробник події (prop)", en: "event handler prop" }
  definition:
    uk: "Prop на кшталт `onClick`, `onChange` чи `onSubmit`, якому передають функцію. React викликає її, коли подія стається, і передає об’єкт події. Передають саму функцію (`onClick={save}`), а не результат її виклику (`onClick={save()}`)."
    en: "A prop such as `onClick`, `onChange` or `onSubmit` that takes a function. React calls it when the event happens and passes the event object. You pass the function itself (`onClick={save}`), not the result of calling it (`onClick={save()}`)."
  aliases: ["event handler", "обробник події", "onClick"]
  see: [event-listener, callback]
- id: state-snapshot
  term: state snapshot
  name: { uk: "знімок стану", en: "state snapshot" }
  definition:
    uk: "Значення стану, які бачить один рендер. Кожен виклик компонента отримує свої `const` зі `useState`, і все, створене під час цього виклику, — JSX, обробники, таймери — читає саме їх. Сетер не змінює знімок: новий знімок з’являється лише в наступному рендері."
    en: "The state values one render sees. Every call of a component gets its own `const` values from `useState`, and everything created during that call — the JSX, the handlers, timers — reads exactly those. A setter does not change the snapshot: a new snapshot appears only in the next render."
  aliases: ["snapshot", "знімок"]
  see: [state-variable, closure]
- id: updater-function
  term: updater function
  name: { uk: "функція-оновлювач", en: "updater function" }
  definition:
    uk: "Функція, яку передають сетеру замість значення: вона отримує попереднє значення стану й повертає наступне. React викликає її сам, під час наступного рендеру, з результатом попередніх оновлень у черзі — а не зі знімка рендеру."
    en: "A function passed to a setter instead of a value: it receives the previous state value and returns the next one. React calls it by itself during the next render, with the result of the earlier updates in the queue — not with the render's snapshot."
  aliases: ["updater", "оновлювач"]
  see: [state-update-queue, state-setter]
  example:
    lang: jsx
    code: "setStreak((previous) => previous + 1);"
- id: state-update-queue
  term: state update queue
  name: { uk: "черга оновлень стану", en: "state update queue" }
  definition:
    uk: "Список оновлень, які сетери однієї змінної стану зібрали до наступного рендеру. React проходить його по порядку від значення зі знімка: значення замінює попередній результат, функція-оновлювач отримує його й повертає новий."
    en: "The list of updates that the setters of one state variable collected before the next render. React walks it in order from the snapshot value: a value replaces the previous result, an updater function receives it and returns a new one."
  aliases: ["update queue", "черга оновлень"]
  see: [updater-function, batching]
- id: batching
  term: batching
  name: { uk: "батчинг", en: "batching" }
  definition:
    uk: "Об’єднання всіх оновлень стану, зроблених під час однієї події, в один повторний рендер. Поки обробник працює, React лише збирає оновлення, а рендерить один раз — після нього."
    en: "Combining all state updates made during one event into a single re-render. While the handler runs, React only collects the updates, and it renders once — afterwards."
  aliases: ["batched updates", "пакетне оновлення"]
  see: [state-update-queue]
- id: state-mutation
  term: state mutation
  name: { uk: "мутація стану", en: "state mutation" }
  definition:
    uk: "Зміна масиву чи об’єкта, який уже лежить у стані, на місці: `push`, `splice`, присвоєння полю. React порівнює старе й нове значення через `Object.is`, тож сетер із тим самим посиланням рендеру не дає. А навіть із новим масивом змінений спільний запис псує й попередній стан. Стан замінюють новими масивами й об’єктами."
    en: "Changing an array or object that is already in state in place: `push`, `splice`, assigning to a field. React compares the old and the new value with `Object.is`, so a setter given the same reference causes no render. And even with a new array, a changed shared record spoils the previous state too. State is replaced with new arrays and objects."
  aliases: ["mutating state", "мутація"]
  see: [mutation, immutable-update, shallow-copy]
- id: redundant-state
  term: redundant state
  name: { uk: "зайвий стан", en: "redundant state" }
  definition:
    uk: "Змінна стану, значення якої можна обчислити з іншого стану чи props: кількість, сума, відфільтрований список. Кожен обробник мусить оновлювати її разом із джерелом, і варто одному забути — копія розходиться з даними. Замість неї значення обчислюють під час рендеру."
    en: "A state variable whose value can be computed from other state or props: a count, a sum, a filtered list. Every handler has to update it together with its source, and once one forgets, the copy drifts from the data. Instead, such a value is computed during render."
  aliases: ["duplicated state", "дубльований стан"]
  see: [derived-value, single-source-of-truth]
- id: single-source-of-truth
  term: single source of truth
  name: { uk: "одне джерело правди", en: "single source of truth" }
  definition:
    uk: "Принцип: кожен факт зберігається в одному місці, а все, що з нього випливає, обчислюється. У React це мінімальний стан, з якого під час рендеру виходять усі показані значення."
    en: "The principle that every fact is stored in one place, and everything that follows from it is computed. In React this is the minimal state from which every shown value is computed during render."
  aliases: ["source of truth", "джерело правди"]
  see: [redundant-state, derived-value]
- id: controlled-input
  term: controlled input
  name: { uk: "кероване поле", en: "controlled input" }
  definition:
    uk: "Поле форми, значення якого задає React зі стану (`value={…}`), а змінює лише обробник `onChange` через сетер. Тоді в стані завжди те, що на екрані. Поле з `value`, але без `onChange` стає лише для читання: React повертає в нього значення зі стану."
    en: "A form field whose value React sets from state (`value={…}`) and that only an `onChange` handler changes through the setter. Then state always holds what is on the screen. A field with `value` but no `onChange` becomes read-only: React puts the state value back into it."
  aliases: ["controlled component", "керований компонент"]
  see: [state-variable, event-handler-prop]
- id: synthetic-event
  term: synthetic event
  name: { uk: "синтетична подія", en: "synthetic event" }
  definition:
    uk: "Об’єкт, який React передає обробнику замість події браузера: обгортка з тими самими `type`, `target`, `currentTarget`, `preventDefault()` і `stopPropagation()`, однакова в усіх браузерах. Справжня подія браузера лежить у `event.nativeEvent`."
    en: "The object React passes to a handler instead of the browser event: a wrapper with the same `type`, `target`, `currentTarget`, `preventDefault()` and `stopPropagation()`, the same in every browser. The real browser event is in `event.nativeEvent`."
  aliases: ["SyntheticEvent", "React event"]
  see: [event, event-handler-prop]
