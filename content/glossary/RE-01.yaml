# Terms introduced in RE-01.
- id: component
  term: component
  name: { uk: "компонент", en: "component" }
  aliases: ["function component", "функціональний компонент", "React component"]
  definition:
    uk: "Функція з назвою з великої літери, що повертає опис шматка інтерфейсу в JSX. Її не викликають самі, а використовують як тег (`<Header />`); викликає її React — для кожного використання окремо — і за описом створює та оновлює вузли DOM."
    en: "A function whose name starts with a capital letter and that returns a description of a piece of UI in JSX. You do not call it yourself but use it as a tag (`<Header />`); React calls it — separately for every use — and creates and updates DOM nodes from the description."
  see: [component-tree, render-function]
  example:
    code: "function Header() {\n  return <h1>Habits</h1>;\n}"
    lang: jsx
- id: component-tree
  term: component tree
  name: { uk: "дерево компонентів", en: "component tree" }
  definition:
    uk: "Хто кого використовує: угорі кореневий компонент (часто `App`), під ним — компоненти з його опису, під ними — компоненти з їхніх описів. Кожне використання — окрема гілка, навіть якщо функція та сама."
    en: "Who uses whom: the root component (often `App`) at the top, under it the components from its description, under those the components from theirs. Every use is a separate branch, even when the function is the same."
  see: [component]
