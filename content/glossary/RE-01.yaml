# Terms introduced in RE-01.
- id: component
  term: component
  name: { uk: "компонент", en: "component" }
  aliases: ["function component", "функціональний компонент", "React component"]
  definition:
    uk: "Функція з назвою з великої літери, що повертає опис шматка інтерфейсу в JSX. Її не викликають самі, а використовують як тег (`<Header />`); викликає її React — для кожного використання окремо — і за описом створює та оновлює вузли DOM."
    en: "A function whose name starts with a capital letter and that returns a description of a piece of UI in JSX. You do not call it yourself but use it as a tag (`<Header />`); React calls it — separately for every use — and creates and updates DOM nodes from the description."
  see: [component-tree, render-function]
  example:
    code: "function Header() {\n  return <h1>Habits</h1>;\n}"
    lang: jsx
- id: component-tree
  term: component tree
  name: { uk: "дерево компонентів", en: "component tree" }
  definition:
    uk: "Хто кого використовує: угорі кореневий компонент (часто `App`), під ним — компоненти з його опису, під ними — компоненти з їхніх описів. Кожне використання — окрема гілка, навіть якщо функція та сама."
    en: "Who uses whom: the root component (often `App`) at the top, under it the components from its description, under those the components from theirs. Every use is a separate branch, even when the function is the same."
  see: [component]
- id: jsx
  term: JSX
  name: { uk: "JSX", en: "JSX" }
  definition:
    uk: "Запис, схожий на HTML, усередині JavaScript-файлів `.jsx` і `.tsx`. Перед запуском компілятор перетворює кожен тег на виклик функції, що створює опис елемента для React. Тому JSX підкоряється правилам JavaScript: один корінь, закриті теги, `className` замість `class`, у `{}` — лише вирази."
    en: "An HTML-like notation inside JavaScript files `.jsx` and `.tsx`. Before running, a compiler turns every tag into a function call that creates an element description for React. That is why JSX follows the rules of JavaScript: one root, closed tags, `className` instead of `class`, only expressions inside `{}`."
  see: [component, jsx-fragment]
- id: jsx-fragment
  term: fragment
  name: { uk: "фрагмент", en: "fragment" }
  aliases: ["React fragment", "<>…</>"]
  definition:
    uk: "Порожні теги `<>` і `</>`, що групують кілька елементів JSX в одне значення, не додаючи в DOM жодного вузла. Потрібен, коли компонент має повернути кілька елементів поруч."
    en: "The empty tags `<>` and `</>` that group several JSX elements into one value without adding any node to the DOM. Needed when a component has to return several elements side by side."
  see: [jsx]
- id: props
  term: props
  name: { uk: "props", en: "props" }
  aliases: ["properties", "prop"]
  definition:
    uk: "Об’єкт з усіма атрибутами, написаними в тегу компонента: `<RecordCard name=\"Лампа\" price={45} />` викликає `RecordCard({ name: \"Лампа\", price: 45 })`. Props вирішує той, хто пише тег; компонент їх лише читає — під час розробки React заморожує цей об’єкт."
    en: "The object with all the attributes written in a component’s tag: `<RecordCard name=\"Lamp\" price={45} />` calls `RecordCard({ name: \"Lamp\", price: 45 })`. Whoever writes the tag decides the props; the component only reads them — during development React freezes this object."
  see: [component, children-prop]
- id: children-prop
  term: children
  name: { uk: "children (вкладений вміст)", en: "children" }
  aliases: ["props.children"]
  definition:
    uk: "Поле props, у яке потрапляє все, що стоїть між тегами компонента. Обгортка ставить його у свій JSX як `{children}` і не мусить знати, що там. У TypeScript його тип — `ReactNode`."
    en: "The props field that receives everything standing between a component’s tags. A wrapper puts it into its JSX as `{children}` and does not need to know what it is. In TypeScript its type is `ReactNode`."
  see: [props]
- id: tsx
  term: .tsx
  name: { uk: "файл .tsx", en: ".tsx file" }
  aliases: ["TSX"]
  definition:
    uk: "Файл TypeScript, у якому можна писати JSX. Для `tsc` у `tsconfig.json` потрібне налаштування `jsx` (наприклад, `\"react-jsx\"`); пісочниця платформи типи з `.tsx` лише прибирає й нічого не перевіряє."
    en: "A TypeScript file in which you can write JSX. For `tsc`, `tsconfig.json` needs the `jsx` setting (for example `\"react-jsx\"`); the platform’s sandbox only removes the types from `.tsx` and checks nothing."
  see: [jsx, tsc]
- id: conditional-rendering
  term: conditional rendering
  name: { uk: "умовний рендеринг", en: "conditional rendering" }
  definition:
    uk: "Показ різного JSX залежно від даних: ранній `return` до головного JSX, тернарний оператор `умова ? a : b` або `умова && a`. Ліворуч від `&&` має стояти булеве значення: число `0` React покаже на сторінці."
    en: "Showing different JSX depending on the data: an early `return` before the main JSX, a ternary `condition ? a : b` or `condition && a`. The left side of `&&` must be a boolean: React shows the number `0` on the page."
  see: [jsx, list-rendering]
- id: list-rendering
  term: list rendering
  name: { uk: "рендеринг списку", en: "list rendering" }
  definition:
    uk: "Перетворення масиву записів на масив елементів JSX через `map` і показ цього масиву в `{}`. Вузли DOM для кожного елемента створює React; кожному елементу дають `key`."
    en: "Turning an array of records into an array of JSX elements with `map` and showing that array in `{}`. React creates the DOM nodes for every element; each element gets a `key`."
  see: [conditional-rendering, list-key]
- id: list-key
  term: key
  name: { uk: "ключ (key)", en: "key" }
  aliases: ["list key", "React key"]
  definition:
    uk: "Атрибут `key` на елементі з `map`, за яким React упізнає рядок між рендерами: той самий ключ — той самий рядок із тими самими вузлами DOM і їхнім станом. Ключ має бути стабільним і унікальним серед сусідів — найкраще `id` запису, а не індекс, назва чи випадкове число. У props компонента він не потрапляє."
    en: "The `key` attribute on an element from `map` by which React recognizes a row between renders: the same key means the same row with the same DOM nodes and their state. A key must be stable and unique among siblings — best the record’s `id`, not the index, the name or a random number. It does not reach the component’s props."
  see: [reconciliation, list-rendering]
- id: reconciliation
  term: reconciliation
  name: { uk: "узгодження (reconciliation)", en: "reconciliation" }
  definition:
    uk: "Як React оновлює сторінку: порівнює новий опис із попереднім і змінює в DOM лише те, що відрізняється. Елементи списку він зіставляє за `key`, інші — за типом і місцем у дереві."
    en: "How React updates the page: it compares the new description with the previous one and changes only what differs in the DOM. It matches list items by `key`, other elements by type and place in the tree."
  see: [list-key]
- id: render-phase
  term: render
  name: { uk: "render (рендер)", en: "render" }
  aliases: ["render phase"]
  definition:
    uk: "Крок, на якому React викликає функції компонентів, отримує новий опис інтерфейсу й порівнює його з попереднім, щоб з’ясувати, що змінити. Сам по собі DOM не змінює: це лише обчислення. Під час повторного рендеру React за замовчуванням викликає компонент і всіх його нащадків."
    en: "The step in which React calls the component functions, gets a new description of the UI and compares it with the previous one to work out what to change. By itself it does not change the DOM: it is only a computation. On a re-render React by default calls the component and all its descendants."
  see: [commit-phase, re-render]
- id: commit-phase
  term: commit phase
  name: { uk: "commit у React", en: "commit (React)" }
  aliases: ["React commit"]
  definition:
    uk: "Крок після render, на якому React вносить у DOM лише різницю між новим описом і попереднім (її знайшов render). Якщо опис не змінився, commit нічого в DOM не змінює. (Не плутати з commit у Git.)"
    en: "The step after render in which React puts into the DOM only the difference between the new description and the previous one (render found it). If the description did not change, the commit changes nothing in the DOM. (Not to be confused with a Git commit.)"
  see: [render-phase, reconciliation]
- id: re-render
  term: re-render
  name: { uk: "повторний рендер", en: "re-render" }
  definition:
    uk: "Кожен рендер після першого. Його запускає тригер — новий виклик `root.render`, а згодом зміна стану. Повторний рендер не означає змін на екрані: їх визначає commit."
    en: "Every render after the first. A trigger starts it — a new `root.render` call, and later a state change. A re-render does not mean the screen changes: the commit decides that."
  see: [render-phase, commit-phase]
- id: render-purity
  term: pure render
  name: { uk: "чистий рендер", en: "pure render" }
  aliases: ["render purity", "чистота рендеру"]
  definition:
    uk: "Правило для компонентів: з тих самих props — той самий JSX, і під час рендеру нічого не змінюється поза компонентом (props, змінні модуля, сховище, DOM). Тоді не важить, скільки разів React викликає компонент."
    en: "The rule for components: the same props give the same JSX, and nothing outside the component changes during render (props, module variables, storage, the DOM). Then it does not matter how many times React calls the component."
  see: [pure-function, side-effect, render-phase]
