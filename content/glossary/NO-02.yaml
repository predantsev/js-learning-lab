# Terms introduced in NO-02 (files, paths and bytes). One file per unit keeps parallel authoring conflict-free.
- id: path-traversal
  term: path traversal
  name: { uk: "path traversal (вихід за межі теки)", en: "path traversal" }
  aliases: [directory traversal, "../ attack"]
  definition:
    uk: "Дефект, коли програма будує шлях до файла із чужого тексту (назви із запиту, з форми, з файла) і через `..` або абсолютний шлях дає прочитати чи перезаписати файл поза дозволеною текою — наприклад, налаштування із секретами."
    en: "A defect where a program builds a file path from outside text (a name from a request, a form or a file) and, through `..` or an absolute path, lets someone read or overwrite a file outside the allowed folder — for example, settings with secrets."
  example:
    code: "path.join('data', '../config/.env')   // 'config/.env' — outside data/"
  see: [containment-check, untrusted-input]
- id: containment-check
  term: containment check
  name: { uk: "перевірка вкладеності (containment check)", en: "containment check" }
  definition:
    uk: "Перевірка, що шлях після повного розв’язання (`path.resolve`) усе ще лежить усередині дозволеної теки. Перевіряють результат, а не вхідну назву: саме результат вирішує, який файл буде відкрито."
    en: "A check that a path, once fully resolved (`path.resolve`), still lies inside the allowed folder. It checks the result, not the incoming name: the result is what decides which file gets opened."
  example:
    code: "path.relative('/srv/app/data', '/srv/app/config/.env')   // '../config/.env' — climbs out"
  see: [path-traversal]
- id: non-blocking-io
  term: non-blocking I/O
  name: { uk: "неблокувальний ввід-вивід (non-blocking I/O)", en: "non-blocking I/O" }
  aliases: [asynchronous I/O, fs/promises]
  definition:
    uk: "Ввід-вивід (файли, мережа), під час якого головний потік JavaScript не стоїть і не чекає: операцію передано далі, а код продовжує обробляти таймери, запити й інші callbacks. Результат приходить пізніше — як виконаний promise чи виклик callback. Протилежність — синхронні функції на кшталт `readFileSync`, які тримають потік, доки диск не відповість."
    en: "Input and output (files, network) during which the main JavaScript thread does not stand and wait: the operation is handed on, and the code keeps handling timers, requests and other callbacks. The result arrives later — as a fulfilled promise or a callback call. The opposite is synchronous functions such as `readFileSync`, which hold the thread until the disk answers."
  example:
    code: "const text = await readFile('log.txt', 'utf8'); // the thread is free while the disk works"
  see: [thread-pool, event-loop]
- id: thread-pool
  term: thread pool
  name: { uk: "пул потоків (thread pool)", en: "thread pool" }
  aliases: [libuv thread pool, UV_THREADPOOL_SIZE]
  definition:
    uk: "Кілька додаткових потоків усередині процесу Node (типово 4; їхню кількість задає змінна середовища `UV_THREADPOOL_SIZE`), що виконують повільну роботу — зокрема операції з файлами `fs` — поза головним потоком. Твій JavaScript у них не виконується: вони лише повертають результат, а обробляє його event loop."
    en: "A few extra threads inside the Node process (4 by default; the environment variable `UV_THREADPOOL_SIZE` sets how many) that do slow work — file operations of `fs` among it — off the main thread. Your JavaScript does not run in them: they only hand back the result, and the event loop handles it."
  see: [non-blocking-io, single-threaded]
- id: node-buffer
  term: Buffer
  name: { uk: "Buffer", en: "Buffer" }
  aliases: [Node.js Buffer]
  definition:
    uk: "Клас Node для послідовності байтів — різновид `Uint8Array` з додатковими методами (`toString(кодування)`, `Buffer.from(текст)`, `Buffer.byteLength(текст)`). `fs` без указаного кодування повертає саме Buffer, а не текст. `subarray` дає вікно на ті самі байти, а не копію."
    en: "Node’s class for a sequence of bytes — a kind of `Uint8Array` with extra methods (`toString(encoding)`, `Buffer.from(text)`, `Buffer.byteLength(text)`). Without an encoding, `fs` returns a Buffer, not text. `subarray` gives a window onto the same bytes, not a copy."
  example:
    code: "Buffer.from('кіт')          // <Buffer d0 ba d1 96 d1 82>\nBuffer.byteLength('кіт')    // 6, while 'кіт'.length is 3"
  see: [typed-array, character-encoding]
- id: string-decoder
  term: StringDecoder
  name: { uk: "StringDecoder", en: "StringDecoder" }
  aliases: [node:string_decoder]
  definition:
    uk: "Декодер із `node:string_decoder`, що перетворює байти на текст шматок за шматком: якщо шматок закінчується посеред багатобайтного символу, декодер притримує його початок до наступного шматка, тож символ не ламається. `end()` віддає те, що лишилося. У браузері те саме робить `TextDecoder` з `{ stream: true }`."
    en: "A decoder from `node:string_decoder` that turns bytes into text chunk by chunk: if a chunk ends in the middle of a multi-byte character, the decoder keeps its start until the next chunk, so the character does not break. `end()` returns what is left. In the browser, `TextDecoder` with `{ stream: true }` does the same."
  see: [node-buffer, text-encoder, mojibake]
- id: file-handle
  term: FileHandle
  name: { uk: "FileHandle (відкритий файл)", en: "FileHandle" }
  aliases: [fs.promises.open, file handle]
  definition:
    uk: "Об’єкт, який повертає `open(path)` з `node:fs/promises`: відкритий файл, з яким можна працювати частинами — `read` читає кілька байтів у твій Buffer, `write` дописує, `stat` дає розмір, `sync` скидає записане на диск. Відкритий файл займає ресурс операційної системи, тож кожен FileHandle треба закрити через `close()` — найкраще у `finally`."
    en: "The object that `open(path)` from `node:fs/promises` returns: an open file you can work with piece by piece — `read` reads some bytes into your Buffer, `write` writes, `stat` gives the size, `sync` flushes what was written to the disk. An open file holds an operating-system resource, so every FileHandle must be closed with `close()` — best in `finally`."
  example:
    code: "const handle = await open('habits.txt');\ntry {\n  const { size } = await handle.stat();\n} finally {\n  await handle.close();\n}"
  see: [bounded-read, node-buffer]
- id: bounded-read
  term: bounded read
  name: { uk: "обмежене читання (bounded read)", en: "bounded read" }
  aliases: [size limit, bounded write]
  definition:
    uk: "Читання з наперед заданою межею: спершу дізнайся розмір (`stat`) і відмов, якщо він більший за ліміт, а великий дозволений файл читай шматками фіксованого розміру, щоб пам’ять не росла разом із файлом. Те саме для запису: перевір розмір даних перед записом."
    en: "Reading with a limit set in advance: first learn the size (`stat`) and refuse when it exceeds the limit, and read a large allowed file in fixed-size chunks so that memory does not grow with the file. The same goes for writing: check the size of the data before writing it."
  see: [file-handle]
- id: atomic-write
  term: atomic write
  name: { uk: "атомарний запис (atomic write)", en: "atomic write" }
  aliases: [write-temp-then-rename, safe save]
  definition:
    uk: "Заміна файла, після якої читач бачить або повністю старий, або повністю новий вміст — ніколи не половину. Робиться так: записати новий вміст у тимчасовий файл у тій самій теці, скинути його на диск (`sync`) і одним `rename` поставити на місце старого."
    en: "Replacing a file so that a reader sees either the complete old content or the complete new one — never half. It is done like this: write the new content into a temp file in the same folder, flush it to the disk (`sync`) and put it in place of the old one with a single `rename`."
  see: [atomic-rename, fsync]
- id: atomic-rename
  term: atomic rename
  name: { uk: "атомарне перейменування (atomic rename)", en: "atomic rename" }
  aliases: [rename(2), fs.rename]
  definition:
    uk: "На macOS і Linux перейменування файла поверх наявного (`rename(2)`) у межах однієї файлової системи — одна неподільна дія: хто відкриває файл за цією назвою, отримує або старий файл, або новий. Між різними файловими системами `rename` не працює зовсім — відхиляється з кодом `EXDEV`; а на Windows гарантії інші."
    en: "On macOS and Linux, renaming a file over an existing one (`rename(2)`) within one file system is a single indivisible step: whoever opens the file by that name gets either the old file or the new one. Across file systems `rename` does not work at all — it fails with the code `EXDEV`; and on Windows the guarantees differ."
  see: [atomic-write]
- id: fsync
  term: fsync
  name: { uk: "fsync (скидання на диск)", en: "fsync" }
  aliases: [FileHandle.sync, datasync, flush]
  definition:
    uk: "Прохання до операційної системи записати на пристрій дані, які вона поки тримає в пам’яті. Без нього «запис завершився» означає лише «дані передано системі»: після збою живлення вони ще можуть зникнути. У Node — `handle.sync()` або `handle.datasync()`."
    en: "A request to the operating system to write to the device the data it is still holding in memory. Without it, “the write finished” only means “the data was handed to the system”: after a power cut it can still be lost. In Node — `handle.sync()` or `handle.datasync()`."
  see: [atomic-write, file-handle]
- id: error-code
  term: error code
  name: { uk: "код помилки (error.code)", en: "error code" }
  aliases: [ENOENT, EACCES, EISDIR, EEXIST, error.code]
  definition:
    uk: "Короткий незмінний рядок у властивості `code` помилки Node, що каже, *що саме* сталося: `ENOENT` — немає такого файла, `EACCES` — немає дозволу, `EISDIR` — це тека, а не файл, `EEXIST` — файл уже існує. На код можна спиратися в `if`; текст `message` призначений для людей, часто містить шлях і може змінитися."
    en: "A short, stable string in the `code` property of a Node error that says *what exactly* happened: `ENOENT` — no such file, `EACCES` — no permission, `EISDIR` — a folder, not a file, `EEXIST` — the file already exists. You can rely on the code in an `if`; the `message` text is meant for people, often contains the path and may change."
  example:
    code: "try {\n  await mkdir('reports');\n} catch (error) {\n  if (error.code !== 'EEXIST') throw error; // the folder is already there — that is fine\n}"
  see: [error-object, error-cause]
- id: file-descriptor
  term: file descriptor
  name: { uk: "файловий дескриптор (file descriptor)", en: "file descriptor" }
  aliases: [fd, handle.fd]
  definition:
    uk: "Невелике число, яке операційна система видає процесу на кожен відкритий файл (`handle.fd`). Їхня кількість на процес обмежена: якщо файли не закривати, нові числа ростуть, доки система не відмовить з `EMFILE` (забагато відкритих файлів). Після `close()` у FileHandle `fd` стає `-1`."
    en: "A small number the operating system gives a process for every open file (`handle.fd`). Their number per process is limited: if files are never closed, new numbers keep growing until the system refuses with `EMFILE` (too many open files). After `close()` a FileHandle’s `fd` becomes `-1`."
  see: [file-handle]
