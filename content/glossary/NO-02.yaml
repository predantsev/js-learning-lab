# Terms introduced in NO-02 (files, paths and bytes). One file per unit keeps parallel authoring conflict-free.
- id: path-traversal
  term: path traversal
  name: { uk: "path traversal (вихід за межі теки)", en: "path traversal" }
  aliases: [directory traversal, "../ attack"]
  definition:
    uk: "Дефект, коли програма будує шлях до файла з чужого тексту (назви з запиту, з форми, з файла) і через `..` або абсолютний шлях дає прочитати чи перезаписати файл поза дозволеною текою — наприклад, налаштування із секретами."
    en: "A defect where a program builds a file path from outside text (a name from a request, a form or a file) and, through `..` or an absolute path, lets someone read or overwrite a file outside the allowed folder — for example, settings with secrets."
  example:
    code: "path.join('data', '../config/.env')   // 'config/.env' — outside data/"
  see: [containment-check, untrusted-input]
- id: containment-check
  term: containment check
  name: { uk: "перевірка вкладеності (containment check)", en: "containment check" }
  definition:
    uk: "Перевірка, що шлях після повного розв’язання (`path.resolve`) усе ще лежить усередині дозволеної теки. Перевіряють результат, а не вхідну назву: саме результат вирішує, який файл буде відкрито."
    en: "A check that a path, once fully resolved (`path.resolve`), still lies inside the allowed folder. It checks the result, not the incoming name: the result is what decides which file gets opened."
  example:
    code: "path.relative('/srv/app/data', '/srv/app/config/.env')   // '../config/.env' — climbs out"
  see: [path-traversal]
- id: non-blocking-io
  term: non-blocking I/O
  name: { uk: "неблокувальний ввід-вивід (non-blocking I/O)", en: "non-blocking I/O" }
  aliases: [asynchronous I/O, fs/promises]
  definition:
    uk: "Ввід-вивід (файли, мережа), під час якого головний потік JavaScript не стоїть і не чекає: операцію передано далі, а код продовжує обробляти таймери, запити й інші callbacks. Результат приходить пізніше — як виконаний promise чи виклик callback. Протилежність — синхронні функції на кшталт `readFileSync`, які тримають потік, доки диск не відповість."
    en: "Input and output (files, network) during which the main JavaScript thread does not stand and wait: the operation is handed on, and the code keeps handling timers, requests and other callbacks. The result arrives later — as a fulfilled promise or a callback call. The opposite is synchronous functions such as `readFileSync`, which hold the thread until the disk answers."
  example:
    code: "const text = await readFile('log.txt', 'utf8'); // the thread is free while the disk works"
  see: [thread-pool, event-loop]
- id: thread-pool
  term: thread pool
  name: { uk: "пул потоків (thread pool)", en: "thread pool" }
  aliases: [libuv thread pool, UV_THREADPOOL_SIZE]
  definition:
    uk: "Кілька додаткових потоків усередині процесу Node (типово 4; їхню кількість задає змінна середовища `UV_THREADPOOL_SIZE`), що виконують повільну роботу — зокрема операції з файлами `fs` — поза головним потоком. Твій JavaScript у них не виконується: вони лише повертають результат, а обробляє його event loop."
    en: "A few extra threads inside the Node process (4 by default; the environment variable `UV_THREADPOOL_SIZE` sets how many) that do slow work — file operations of `fs` among it — off the main thread. Your JavaScript does not run in them: they only hand back the result, and the event loop handles it."
  see: [non-blocking-io, single-threaded]
