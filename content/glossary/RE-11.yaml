# Terms introduced in RE-11. One file per unit keeps parallel authoring conflict-free.
- id: client-side-rendering
  term: client-side rendering
  name: { uk: "рендеринг на клієнті (CSR)", en: "client-side rendering (CSR)" }
  definition:
    uk: "Спосіб показати сторінку, за якого сервер віддає майже порожній HTML (лише `<div id=\"root\">` і посилання на JavaScript), а весь вміст будує React у браузері: спершу завантажується бандл, потім він запитує дані й рендерить. До кінця завантаження JavaScript людина не бачить нічого корисного; щойно вміст з’явився, він уже інтерактивний."
    en: "A way of showing a page in which the server sends almost empty HTML (only `<div id=\"root\">` and a link to the JavaScript), and React builds all the content in the browser: the bundle is downloaded first, then it requests the data and renders. Until the JavaScript has loaded the person sees nothing useful; once the content appears, it is already interactive."
  aliases: [CSR, client rendering, SPA, рендеринг у браузері]
  see: [server-side-rendering, static-generation]
- id: server-side-rendering
  term: server-side rendering
  name: { uk: "рендеринг на сервері (SSR)", en: "server-side rendering (SSR)" }
  definition:
    uk: "Спосіб показати сторінку, за якого сервер на кожен запит запускає React, рендерить дерево в HTML з уже підставленими даними й надсилає його. Браузер одразу показує вміст, але кнопки оживають лише після того, як завантажиться JavaScript і відбудеться гідратація."
    en: "A way of showing a page in which, for every request, the server runs React, renders the tree to HTML with the data already filled in and sends it. The browser shows the content at once, but the buttons come alive only after the JavaScript has loaded and hydration has happened."
  aliases: [SSR, server rendering]
  see: [hydration, client-side-rendering, static-generation]
- id: static-generation
  term: static generation
  name: { uk: "статична генерація", en: "static generation" }
  definition:
    uk: "Рендеринг сторінок у HTML один раз — під час збірки, а не на кожен запит. Готові файли лежать на сервері чи CDN і однакові для всіх відвідувачів, доки сайт не зберуть знову. Дані, що змінюються, статична сторінка може дочитати вже в браузері, після завантаження."
    en: "Rendering pages to HTML once — during the build rather than on every request. The finished files sit on a server or a CDN and are the same for every visitor until the site is built again. Data that changes can still be fetched by a static page in the browser, after it has loaded."
  aliases: [SSG, static rendering, prerendering, static export, статичний рендеринг]
  see: [server-side-rendering, client-side-rendering]
- id: hydration
  term: hydration
  name: { uk: "гідратація", en: "hydration" }
  definition:
    uk: "Крок, на якому React у браузері рендерить те саме дерево, що й сервер, але не створює DOM заново: він проходить уже наявні вузли серверного HTML, зіставляє їх зі своїм рендером і чіпляє до них обробники подій і стан. Запускається через `hydrateRoot(container, <App />)` замість `createRoot`. Ефекти виконуються вже після гідратації."
    en: "The step in which React in the browser renders the same tree as the server did but does not create the DOM again: it walks the nodes already present in the server HTML, matches them with its own render and attaches event handlers and state to them. It is started with `hydrateRoot(container, <App />)` instead of `createRoot`. Effects run after hydration."
  aliases: [hydrate, hydrateRoot, гідрація]
  see: [hydration-mismatch, server-side-rendering]
  example:
    lang: jsx
    code: "hydrateRoot(document.getElementById(\"root\"), <App />);"
- id: hydration-mismatch
  term: hydration mismatch
  name: { uk: "розбіжність гідратації", en: "hydration mismatch" }
  definition:
    uk: "Ситуація, коли перший рендер у браузері дає не ту розмітку, що прийшла із сервера: інший текст, атрибут або вкладеність. Через різний текст React 19 відкидає серверний HTML найближчої межі й будує його заново на клієнті (у development-збірці — з помилкою й позначками `+` клієнт / `-` сервер); через різні атрибути лише пише в консоль і **не виправляє** їх. Типові причини: час чи випадкові числа в рендері, форматування за локаллю, читання `window` або `localStorage` під час рендеру, неправильна вкладеність тегів."
    en: "A situation in which the browser's first render produces different markup from what came from the server: different text, an attribute or nesting. For different text React 19 throws away the server HTML of the nearest boundary and builds it again on the client (in the development build with an error and `+` client / `-` server marks); for different attributes it only writes to the console and does **not** fix them. Typical causes: the time or random numbers in render, locale formatting, reading `window` or `localStorage` during render, invalid tag nesting."
  aliases: [hydration error, mismatch, помилка гідратації]
  see: [hydration]
- id: server-component
  term: Server Component
  name: { uk: "серверний компонент", en: "Server Component" }
  definition:
    uk: "Компонент React, який рендериться лише на сервері (або під час збірки) й ніколи не потрапляє в браузерний бандл. Може бути `async` і читати дані напряму, але не має стану, ефектів чи обробників подій. Клієнтським компонентам він передає лише серіалізовні пропси. Потребує фреймворку чи бандлера з підтримкою React Server Components."
    en: "A React component that renders only on the server (or during the build) and never gets into the browser bundle. It may be `async` and read data directly, but it has no state, effects or event handlers. To client components it passes only serializable props. It needs a framework or bundler with React Server Components support."
  aliases: [RSC component, server components]
  see: [client-component, serialization-boundary, react-server-components]
- id: client-component
  term: Client Component
  name: { uk: "клієнтський компонент", en: "Client Component" }
  definition:
    uk: "У застосунку з серверними компонентами — компонент із модуля, позначеного рядком `\"use client\"` на початку файлу (або імпортований таким модулем). Його код потрапляє в бандл браузера, тож він може мати стан, ефекти, обробники й браузерні API. На першому завантаженні фреймворк зазвичай теж рендерить його в HTML на сервері, а в браузері гідратує."
    en: "In an app with server components, a component from a module marked with the line `\"use client\"` at the top of the file (or imported by such a module). Its code goes into the browser bundle, so it may have state, effects, handlers and browser APIs. On the first load a framework usually also renders it to HTML on the server, and hydrates it in the browser."
  aliases: [use client, "\"use client\"", client components]
  see: [server-component, serialization-boundary]
- id: serialization-boundary
  term: serialization boundary
  name: { uk: "межа серіалізації", en: "serialization boundary" }
  definition:
    uk: "Місце, де серверний компонент передає пропси клієнтському. Через неї проходить лише те, що React уміє серіалізувати: примітиви, звичайні об’єкти й масиви з такими значеннями, `Date`, `Map`, `Set`, проміси, JSX і Server Functions. Звичайні функції, класи та екземпляри класів її не перетинають."
    en: "The place where a server component passes props to a client component. Only what React can serialize crosses it: primitives, plain objects and arrays of such values, `Date`, `Map`, `Set`, promises, JSX and Server Functions. Ordinary functions, classes and class instances do not cross it."
  aliases: [server/client boundary, межа клієнт/сервер, serializable props]
  see: [serialization, server-component, client-component]
- id: server-only-code
  term: server-only code
  name: { uk: "код лише для сервера", en: "server-only code" }
  definition:
    uk: "Модулі, що мають права, яких не можна давати браузеру: секретні ключі, доступ до бази даних, привілейовані перевірки. Бандлер кладе в браузер усе, що досяжне імпортами з клієнтського коду, тому такі модулі явно позначають: пакет `server-only` у Next.js з App Router, назва `*.server.ts` у React Router 7 у режимі фреймворку (правила фреймворків, не React, і залежать від їхньої версії). Тоді імпорт із клієнтського коду зупиняє збірку з помилкою."
    en: "Modules with powers that must not be given to the browser: secret keys, database access, privileged checks. A bundler puts into the browser everything reachable by imports from client code, so such modules are marked explicitly: the `server-only` package in Next.js with the App Router, a `*.server.ts` name in React Router 7 framework mode (framework rules, not React’s, and they depend on the framework version). Then an import from client code stops the build with an error."
  aliases: [server-only, .server.ts, server only]
  see: [secret, bundle]
- id: react-server-components
  term: React Server Components
  name: { uk: "React Server Components (RSC)", en: "React Server Components (RSC)" }
  definition:
    uk: "Модель React, у якій частина компонентів рендериться на сервері чи під час збірки, а браузер отримує їхній результат і код лише клієнтських компонентів. Самі серверні компоненти стабільні з React 19, але API для бандлерів і фреймворків, що їх реалізують, не дотримуються semver. Тому RSC працюють лише через фреймворк чи бандлер, що їх підтримує, — у звичайному Vite-SPA їх не «вмикають»."
    en: "A React model in which some components render on the server or during the build, and the browser receives their result plus the code of the client components only. Server components themselves are stable since React 19, but the APIs bundlers and frameworks use to implement them do not follow semver. So RSC work only through a framework or bundler that supports them — they are not “switched on” in a plain Vite SPA."
  aliases: [RSC, server components]
  see: [server-component, meta-framework]
- id: meta-framework
  term: meta-framework
  name: { uk: "мета-фреймворк", en: "meta-framework" }
  definition:
    uk: "Фреймворк поверх React, який додає те, чого сам React не має: маршрутизацію за файлами, сервер, SSR чи статичну генерацію, а іноді й React Server Components. Приклади — Next.js, React Router 7 у режимі фреймворку; що саме кожен уміє, залежить від його версії. Курс не вимагає жодного з них: принципи межі клієнт/сервер однакові, різняться назви API."
    en: "A framework on top of React that adds what React itself does not have: file-based routing, a server, SSR or static generation, and sometimes React Server Components. Examples are Next.js and React Router 7 in framework mode; what each one can do depends on its version. The course does not require any of them: the principles of the client/server boundary are the same, the API names differ."
  aliases: [framework, Next.js, React Router framework mode, фреймворк]
  see: [react-server-components]
