# Terms introduced in NO-06. One file per unit keeps parallel authoring conflict-free.
- id: server-source-of-truth
  term: server source of truth
  name: { uk: "сервер як джерело істини", en: "server as the source of truth" }
  aliases: ["source of truth", "джерело істини"]
  definition:
    uk: "Правило, за яким справжнім вважається лише те, що зберіг сервер. Клієнт тримає копію (кеш), яку можна швидко показати, але після зміни на сервері вона застаріває; клієнт оновлює її новим запитом і ніколи не вважає свою зміну збереженою, доки сервер її не прийняв."
    en: "The rule that only what the server stored counts as real. The client keeps a copy (a cache) that is quick to show but goes stale after a change on the server; the client refreshes it with a new request and never treats its own change as saved until the server accepted it."
  see: [data-ownership, server-state, cache-invalidation]
- id: data-ownership
  term: data ownership
  name: { uk: "власність даних", en: "data ownership" }
  aliases: ["owner of data", "власник даних"]
  definition:
    uk: "Рішення для кожного поля, хто ним володіє. Записи належать серверу, клієнт має лише їхню копію; стан інтерфейсу (обраний фільтр, текст у ще не збереженій формі) належить клієнту; похідні значення (суми, лічильники) ніхто не зберігає — їх рахують із даних власника."
    en: "The decision, for every field, of who owns it. Records belong to the server, and the client has only a copy of them; interface state (the chosen filter, text in a form not saved yet) belongs to the client; derived values (totals, counts) are stored by nobody — they are computed from the owner's data."
  see: [server-source-of-truth]
- id: api-base-url
  term: API base URL
  name: { uk: "базова адреса API", en: "API base URL" }
  aliases: ["base URL", "API_BASE_URL", "базова адреса"]
  definition:
    uk: "Початок адреси, до якого клієнт додає шляхи запитів: `http://127.0.0.1:7330` + `/v1/records`. Її беруть із конфігурації (змінної середовища, файлу налаштувань), а не пишуть у коді джерела даних: на твоєму комп’ютері, у тестах і на телефоні вона різна."
    en: "The start of an address to which the client appends request paths: `http://127.0.0.1:7330` + `/v1/records`. It comes from configuration (an environment variable, a settings file), not from the data source's code: it differs on your computer, in tests and on a phone."
  see: [data-source-interface]
- id: data-source-interface
  term: data source interface
  name: { uk: "інтерфейс джерела даних", en: "data source interface" }
  aliases: ["data source", "джерело даних", "listRecords"]
  definition:
    uk: "Кілька методів, через які решта клієнта отримує й змінює записи (`listRecords`, `createRecord`, `updateRecord`), не знаючи, звідки вони. Його можуть виконувати фікстури в пам’яті або HTTP-запити до API; компоненти й доменні функції при заміні джерела не змінюються."
    en: "A few methods through which the rest of the client gets and changes records (`listRecords`, `createRecord`, `updateRecord`) without knowing where they come from. Fixtures in memory or HTTP requests to an API can carry it out; components and domain functions do not change when the source is replaced."
  see: [api-base-url]
- id: credentials-mode
  term: credentials mode
  name: { uk: "режим credentials", en: "credentials mode" }
  aliases: ["credentials", "credentials: include"]
  definition:
    uk: "Параметр `credentials` у `fetch`: чи йдуть із запитом cookies та інші облікові дані браузера. Типове `\"same-origin\"` надсилає їх лише на свій origin; `\"include\"` — і на інший, але тоді сервер мусить відповісти точним origin (не `*`) і `Access-Control-Allow-Credentials: true`, інакше браузер не віддасть відповідь сторінці."
    en: "The `credentials` option of `fetch`: whether cookies and other browser credentials go with the request. The default `\"same-origin\"` sends them only to the page's own origin; `\"include\"` sends them to another one too, but then the server must answer with the exact origin (not `*`) and `Access-Control-Allow-Credentials: true`, or the browser does not hand the answer to the page."
  see: [cors, credentialed-request, origin-allowlist]
- id: origin-allowlist
  term: origin allowlist
  name: { uk: "список дозволених origin", en: "origin allowlist" }
  aliases: ["allowed origins", "allowedOrigins", "дозволені origin"]
  definition:
    uk: "Перелік origin, яким сервер дозволяє в CORS читати свої відповіді. Сервер порівнює заголовок `Origin` запиту зі списком і, якщо він там є, повторює саме його в `Access-Control-Allow-Origin` разом із `Vary: Origin`; інший origin не отримує дозволу. Це правило для браузерів, а не захист: програми поза браузером його не перевіряють."
    en: "The list of origins a server allows, through CORS, to read its answers. The server compares the request's `Origin` header with the list and, if it is there, repeats exactly it in `Access-Control-Allow-Origin` together with `Vary: Origin`; another origin gets no permission. It is a rule for browsers, not protection: programs outside a browser do not check it."
  see: [cors, credentials-mode]
