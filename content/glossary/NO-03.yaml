# Terms introduced in NO-03.
- id: http-server
  term: HTTP server
  name: { uk: "HTTP-сервер", en: "HTTP server" }
  aliases: ["server", "сервер", "http.createServer", "node:http server"]
  definition:
    uk: "Програма, що слухає порт, приймає HTTP-запити й на кожен надсилає відповідь: рядок статусу, заголовки й тіло. У Node.js його створює `http.createServer(обробник)`, а `server.listen(порт, адреса)` відкриває порт. Доки сервер слухає, процес не завершується; `server.close()` перестає приймати нові з’єднання."
    en: "A program that listens on a port, accepts HTTP requests and sends an answer to each: a status line, headers and a body. In Node.js `http.createServer(handler)` creates one and `server.listen(port, address)` opens the port. While the server listens the process does not exit; `server.close()` stops accepting new connections."
  see: [request-handler, bind-address]
  example:
    code: |
      const server = http.createServer((req, res) => res.end("ok"));
      server.listen(4321, "127.0.0.1");
- id: request-handler
  term: request handler
  name: { uk: "обробник запиту", en: "request handler" }
  aliases: ["handler", "обробник", "(req, res) =>"]
  definition:
    uk: "Функція `(req, res) => { … }`, яку сервер викликає для кожного запиту. `req` описує, що прийшло (метод, адресу, заголовки, тіло потоком), а через `res` обробник будує відповідь. Значення, яке обробник повертає, ігнорується: відповідь закінчує лише `res.end()`, і без нього клієнт чекає."
    en: "The function `(req, res) => { … }` a server calls for every request. `req` describes what arrived (method, URL, headers, the body as a stream), and the handler builds the answer through `res`. Whatever the handler returns is ignored: only `res.end()` finishes the answer, and without it the client waits."
  see: [http-server]
- id: bind-address
  term: bind address
  name: { uk: "адреса прив’язки", en: "bind address" }
  aliases: ["listen address", "loopback", "127.0.0.1", "0.0.0.0"]
  definition:
    uk: "Мережева адреса, на якій сервер приймає з’єднання, — другий аргумент `listen`. `127.0.0.1` (loopback) означає «лише цей комп’ютер»; `0.0.0.0` чи порожня адреса — «усі мережеві інтерфейси», тобто й інші машини в мережі. Сервери для навчання й розробки прив’язують до loopback."
    en: "The network address a server accepts connections on — the second argument of `listen`. `127.0.0.1` (loopback) means “this computer only”; `0.0.0.0` or no address means “every network interface”, other machines on the network included. Servers for learning and development bind to loopback."
  see: [http-server, lan-address]
- id: method-not-allowed
  term: 405 Method Not Allowed
  name: { uk: "405 Method Not Allowed", en: "405 Method Not Allowed" }
  aliases: ["405", "Allow header", "заголовок Allow"]
  definition:
    uk: "Статус для запиту на відому адресу з методом, якого ця адреса не приймає (наприклад, `DELETE /records`, коли там є лише `GET`). Відповідь 405 має містити заголовок `Allow` зі списком дозволених методів. Відрізняй від 404: адреса існує, не підходить лише метод."
    en: "The status for a request to a known address with a method that address does not accept (for example `DELETE /records` when only `GET` exists there). A 405 answer must carry an `Allow` header listing the allowed methods. Tell it from 404: the address exists, only the method does not fit."
  see: [http-method, status-code]
- id: headers-sent-error
  term: ERR_HTTP_HEADERS_SENT
  name: { uk: "ERR_HTTP_HEADERS_SENT", en: "ERR_HTTP_HEADERS_SENT" }
  aliases: ["Cannot set headers after they are sent to the client", "headers already sent"]
  definition:
    uk: "Помилка Node.js, коли код змінює статус чи заголовки після того, як їх уже надіслано, — тобто після першого `res.write`, `res.end` чи `res.writeHead`. Рядок статусу й заголовки йдуть клієнтові перед тілом, тож змінити їх згодом неможливо. Найчастіша причина — дві гілки, що обидві відповідають (бракує `return`)."
    en: "The Node.js error raised when code changes the status or headers after they were already sent — that is, after the first `res.write`, `res.end` or `res.writeHead`. The status line and headers travel to the client before the body, so they cannot be changed later. The most common cause is two branches that both answer (a missing `return`)."
  see: [http-header]
- id: route-table
  term: route table
  name: { uk: "таблиця маршрутів", en: "route table" }
  aliases: ["router", "маршрутизатор", "routing table"]
  definition:
    uk: "Список рядків «метод + шаблон шляху → обробник», за яким сервер обирає, хто відповідатиме на запит. Шлях порівнюють без query (`url.pathname`), а якщо шлях знайдено, але метод ні, відповідають 405 замість 404."
    en: "A list of “method + path pattern → handler” rows that a server uses to choose who answers a request. The path is compared without the query (`url.pathname`), and when the path matches but the method does not, the answer is 405 rather than 404."
  see: [path-parameter, method-not-allowed]
- id: path-parameter
  term: path parameter
  name: { uk: "параметр шляху", en: "path parameter" }
  aliases: [":id", "path param"]
  definition:
    uk: "Змінна частина шляху, яку сервер витягає з адреси: у `/records/r-02` за шаблоном `/records/:id` це `id = \"r-02\"`. Сервер отримує її як текст, тож перевіряє формат і, якщо треба, декодує `decodeURIComponent`. Те саме поняття на боці клієнтського роутера — параметр маршруту."
    en: "A variable part of the path that the server extracts from the address: in `/records/r-02` with the pattern `/records/:id` it is `id = \"r-02\"`. The server receives it as text, so it checks the format and decodes it with `decodeURIComponent` when needed. The same idea on the client router side is a route parameter."
  see: [route-table, route-param]
- id: body-size-limit
  term: body size limit
  name: { uk: "обмеження розміру тіла", en: "body size limit" }
  aliases: ["413", "Payload Too Large", "Content Too Large", "maxBytes"]
  definition:
    uk: "Найбільша кількість байтів тіла запиту, яку сервер погоджується прочитати. Сервер рахує байти шматків, поки вони надходять, і, перевищивши межу, перестає читати й відповідає 413 — ще до `JSON.parse`. Без межі один великий запит може забрати всю пам’ять процесу."
    en: "The largest number of request-body bytes a server agrees to read. The server counts the bytes of the chunks as they arrive and, once over the limit, stops reading and answers 413 — before `JSON.parse` ever runs. Without a limit one large request can take all of the process’s memory."
  see: [route-table]
- id: client-abort
  term: client abort
  name: { uk: "скасування клієнтом", en: "client abort" }
  aliases: ["aborted request", "client disconnected", "res close before finish"]
  definition:
    uk: "Клієнт розірвав з’єднання раніше, ніж відповідь закінчилася (скасований `fetch`, закрита вкладка, тайм-аут клієнта). Сервер дізнається про це з події `'close'` об’єкта `res`, що настала без `'finish'` (`res.writableFinished` — `false`). Робота обробника сама не зупиняється: її треба скасувати, наприклад через `AbortController`."
    en: "The client closed the connection before the answer was finished (a cancelled `fetch`, a closed tab, a client timeout). The server learns about it from the `'close'` event of `res` arriving without `'finish'` (`res.writableFinished` is `false`). The handler’s work does not stop by itself: it has to be cancelled, for example through an `AbortController`."
  see: [abort-controller, handler-deadline]
- id: handler-deadline
  term: handler deadline
  name: { uk: "дедлайн обробника", en: "handler deadline" }
  aliases: ["per-request deadline", "503 on timeout"]
  definition:
    uk: "Межа часу, яку обробник сам ставить своїй роботі: якщо результат не готовий за N мс, обробник скасовує роботу й відповідає 503. `server.requestTimeout` цього не робить — він обмежує лише отримання запиту від клієнта, а не час, який обробник думає над відповіддю."
    en: "A time limit a handler sets on its own work: if the result is not ready within N ms, the handler cancels the work and answers 503. `server.requestTimeout` does not do this — it only limits receiving the request from the client, not the time the handler spends on the answer."
  see: [client-abort, request-timeout]
- id: sigint
  term: SIGINT
  name: { uk: "SIGINT", en: "SIGINT" }
  aliases: ["Ctrl+C", "interrupt signal", "process.on('SIGINT')"]
  definition:
    uk: "Сигнал, який термінал надсилає процесу на Ctrl+C. Без обробника Node завершується одразу. З `process.on(\"SIGINT\", …)` процес може спершу прибрати за собою — наприклад, викликати `server.close()` — і завершитися сам, коли відкритих ресурсів не лишиться."
    en: "The signal a terminal sends a process on Ctrl+C. Without a handler Node exits at once. With `process.on(\"SIGINT\", …)` the process can clean up first — for example, call `server.close()` — and exit by itself once no open resources are left."
  see: [http-server]
- id: address-in-use
  term: EADDRINUSE
  name: { uk: "EADDRINUSE (адреса вже зайнята)", en: "EADDRINUSE (address already in use)" }
  aliases: ["address already in use", "port in use", "порт зайнятий"]
  definition:
    uk: "Код помилки `listen`, коли цей порт на цій адресі вже слухає інший процес (часто — твій власний сервер, запущений раніше в іншому терміналі). Розв’язок — зупинити той процес або запустити сервер на іншому порту; повторний запуск на тому самому зайнятому порту не допоможе."
    en: "The `listen` error code when another process already listens on that port at that address (often your own server, started earlier in another terminal). The fix is to stop that process or start the server on another port; starting again on the same busy port does not help."
  see: [bind-address]
