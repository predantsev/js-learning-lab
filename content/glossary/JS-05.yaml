# Terms introduced in JS-05. One file per unit keeps parallel authoring conflict-free.
- id: array-map
  term: Array.prototype.map
  name: { uk: "метод map", en: "map method" }
  aliases: ["map", ".map()"]
  definition:
    uk: "Метод масиву, який викликає передану функцію для кожного елемента й повертає **новий** масив тієї самої довжини з її результатами. Початковий масив не змінюється."
    en: "An array method that calls the given function for every element and returns a **new** array of the same length holding its results. The original array is not changed."
  example:
    code: "[80, 45, 240].map((price) => price * 2); // [160, 90, 480]"
  see: [transformation, array-filter]
- id: transformation
  term: transformation
  name: { uk: "перетворення", en: "transformation" }
  definition:
    uk: "Обчислення, яке з одних даних робить нові й не змінює початкових: наприклад, з масиву записів — масив підписів для сторінки."
    en: "A computation that makes new data from existing data without changing the original: for example, an array of labels for a page from an array of records."
  see: [array-map]
- id: array-filter
  term: Array.prototype.filter
  name: { uk: "метод filter", en: "filter method" }
  aliases: ["filter", ".filter()"]
  definition:
    uk: "Метод масиву, який повертає новий масив лише з тими елементами, для яких передана функція повернула `true`. Самі елементи не копіюються: у новому масиві ті самі об’єкти. Якщо не підійшов жоден — порожній масив `[]`."
    en: "An array method that returns a new array with only the elements for which the given function returned `true`. The elements are not copied: the new array holds the same objects. If none matches, the result is an empty array `[]`."
  example:
    code: "[80, 45, 240].filter((price) => price <= 100); // [80, 45]"
  see: [predicate, array-find]
- id: array-find
  term: Array.prototype.find
  name: { uk: "метод find", en: "find method" }
  aliases: ["find", ".find()"]
  definition:
    uk: "Метод масиву, який повертає **перший** елемент, для якого функція повернула `true`, і далі не шукає. Якщо такого немає — `undefined` (а не `null`)."
    en: "An array method that returns the **first** element for which the function returned `true` and stops looking. If there is none, the result is `undefined` (not `null`)."
  example:
    code: "[80, 45, 240].find((price) => price < 50); // 45"
  see: [predicate, array-filter, linear-search]
- id: predicate
  term: predicate
  name: { uk: "предикат", en: "predicate" }
  definition:
    uk: "Функція, яка відповідає «так» або «ні» про один елемент: повертає `true` чи `false`. Її передають у `filter`, `find`, `some` і `every`."
    en: "A function that answers yes or no about one element: it returns `true` or `false`. It is what you pass to `filter`, `find`, `some` and `every`."
  example:
    code: "const isCheap = (price) => price < 50; // isCheap(45) → true"
  see: [array-filter, array-find]
- id: array-some
  term: Array.prototype.some
  name: { uk: "метод some", en: "some method" }
  aliases: ["some", ".some()"]
  definition:
    uk: "Метод масиву, що відповідає, чи є **хоча б один** елемент, для якого функція повертає `true`. Зупиняється на першому такому елементі. Для порожнього масиву — `false`."
    en: "An array method that answers whether **at least one** element makes the function return `true`. It stops at the first such element. For an empty array the answer is `false`."
  example:
    code: "[80, 45, 240].some((price) => price > 200); // true"
  see: [array-every, predicate]
- id: array-every
  term: Array.prototype.every
  name: { uk: "метод every", en: "every method" }
  aliases: ["every", ".every()"]
  definition:
    uk: "Метод масиву, що відповідає, чи **всі** елементи задовольняють умову. Зупиняється на першому елементі, для якого функція повернула `false`. Для порожнього масиву — `true`."
    en: "An array method that answers whether **all** elements satisfy the condition. It stops at the first element for which the function returns `false`. For an empty array the answer is `true`."
  example:
    code: "[80, 45, 240].every((price) => price > 0); // true"
  see: [array-some, vacuous-truth]
- id: vacuous-truth
  term: vacuous truth
  name: { uk: "істинність «за відсутністю»", en: "vacuous truth" }
  definition:
    uk: "Твердження «усі елементи задовольняють умову» істинне для порожнього списку, бо в ньому немає жодного елемента, який би його спростував. Тому `[].every(...)` повертає `true`."
    en: "The statement “every element satisfies the condition” is true for an empty list, because there is no element that could break it. That is why `[].every(...)` returns `true`."
  example:
    code: "[].every((task) => task.done); // true"
  see: [array-every]
- id: array-reduce
  term: Array.prototype.reduce
  name: { uk: "метод reduce", en: "reduce method" }
  aliases: ["reduce", ".reduce()"]
  definition:
    uk: "Метод масиву, який згортає масив в одне значення: викликає функцію для кожного елемента, передаючи їй поточний накопичувач, і повертає те, що вийшло після останнього елемента."
    en: "An array method that folds an array into one value: it calls a function for every element, passing it the current accumulator, and returns what is left after the last element."
  example:
    code: "[80, 45, 240].reduce((sum, price) => sum + price, 0); // 365"
  see: [accumulator, initial-value]
- id: accumulator
  term: accumulator
  name: { uk: "накопичувач", en: "accumulator" }
  definition:
    uk: "Значення, яке `reduce` передає з кроку в крок як перший параметр функції. Те, що функція повертає, стає накопичувачем для наступного елемента. Це може бути число, рядок, масив чи об’єкт."
    en: "The value `reduce` carries from step to step as the function’s first parameter. Whatever the function returns becomes the accumulator for the next element. It can be a number, a string, an array or an object."
  see: [array-reduce, initial-value]
- id: initial-value
  term: initial value
  name: { uk: "початкове значення", en: "initial value" }
  definition:
    uk: "Другий аргумент `reduce`: з нього починається накопичувач. Без нього `reduce` бере за початок перший елемент масиву, а на порожньому масиві кидає `TypeError`."
    en: "The second argument of `reduce`: the accumulator starts from it. Without it, `reduce` starts from the first element of the array and throws a `TypeError` on an empty array."
  example:
    code: "[].reduce((sum, price) => sum + price, 0); // 0"
  see: [array-reduce, accumulator]
- id: comparator
  term: comparator
  name: { uk: "компаратор", en: "comparator" }
  definition:
    uk: "Функція `(a, b)` для сортування. Від’ємне число означає «`a` раніше за `b`», додатне — «`b` раніше за `a`», `0` — «для порядку ці двоє рівні»."
    en: "A function `(a, b)` used for sorting. A negative number means “`a` before `b`”, a positive one means “`b` before `a`”, and `0` means “these two are equal for the order”."
  example:
    code: "const descending = (a, b) => b - a;\n[45, 240, 18].toSorted(descending); // [240, 45, 18]"
  see: [stable-sort, in-place-sort]
- id: stable-sort
  term: stable sort
  name: { uk: "стабільне сортування", en: "stable sort" }
  definition:
    uk: "Сортування, яке залишає елементи з однаковим ключем у тому порядку, в якому вони були до сортування. `sort` і `toSorted` у JavaScript стабільні."
    en: "A sort that keeps elements with equal keys in the order they had before sorting. `sort` and `toSorted` in JavaScript are stable."
  see: [comparator]
- id: in-place-sort
  term: in-place sort
  name: { uk: "сортування на місці", en: "in-place sort" }
  definition:
    uk: "Сортування, яке переставляє елементи в тому самому масиві, а не створює новий. `sort` сортує на місці й повертає той самий масив; `toSorted` повертає відсортовану копію."
    en: "A sort that rearranges the elements inside the same array instead of creating a new one. `sort` works in place and returns the same array; `toSorted` returns a sorted copy."
  example:
    code: "const sorted = prices.toSorted((a, b) => a - b); // prices stays as it was"
  see: [comparator]
- id: linear-search
  term: linear search
  name: { uk: "лінійний пошук", en: "linear search" }
  definition:
    uk: "Пошук, що перевіряє елементи по одному від початку списку. У найкращому разі — одна перевірка, у найгіршому (шуканий елемент останній або його немає) — стільки перевірок, скільки елементів."
    en: "A search that checks elements one by one from the start of the list. In the best case it takes one check; in the worst case (the element is last or missing) it takes as many checks as there are elements."
  see: [time-complexity, lookup-table]
- id: time-complexity
  term: time complexity
  name: { uk: "часова складність", en: "time complexity" }
  aliases: ["Big O", "O(n)"]
  definition:
    uk: "Те, як кількість кроків роботи зростає разом із кількістю даних `n`: не залежить від `n` — O(1), зростає пропорційно — O(n), як `n × n` — O(n²). Описує зростання, а не секунди."
    en: "How the number of steps grows with the amount of data `n`: independent of `n` is O(1), proportional is O(n), like `n × n` is O(n²). It describes growth, not seconds."
  see: [space-complexity, linear-search]
- id: space-complexity
  term: space complexity
  name: { uk: "просторова складність", en: "space complexity" }
  definition:
    uk: "Те, скільки додаткової пам’яті потребує робота залежно від кількості даних: наприклад, новий масив чи об’єкт-довідник на `n` елементів."
    en: "How much extra memory the work needs depending on the amount of data: for example, a new array or a lookup object with `n` entries."
  see: [time-complexity, lookup-table]
- id: lookup-table
  term: lookup table
  name: { uk: "об’єкт-довідник", en: "lookup table" }
  aliases: ["lookup object", "index"]
  definition:
    uk: "Об’єкт, у якому значення знаходять за ключем одним кроком, наприклад запис за його `id`. Його будують один раз: це коштує один прохід списком і пам’ять на кожен ключ."
    en: "An object in which a value is found by its key in one step, for example a record by its `id`. It is built once: that costs one pass over the list and memory for every key."
  example:
    code: "const byId = {};\nfor (const record of records) {\n  byId[record.id] = record;\n}"
  see: [linear-search, space-complexity]
- id: method-chain
  term: method chain
  name: { uk: "ланцюжок методів", en: "method chain" }
  definition:
    uk: "Кілька викликів методів поспіль, де кожен наступний викликається на результаті попереднього: `list.filter(...).map(...)`."
    en: "Several method calls in a row where each one is called on the result of the previous one: `list.filter(...).map(...)`."
  see: [intermediate-array]
- id: intermediate-array
  term: intermediate array
  name: { uk: "проміжний масив", en: "intermediate array" }
  definition:
    uk: "Масив, який повертає один крок ланцюжка методів і який одразу отримує наступний крок. Він не має власного імені, але існує в пам’яті, поки ланцюжок працює."
    en: "An array that one step of a method chain returns and the next step receives right away. It has no name of its own, but it exists in memory while the chain runs."
  see: [method-chain]
