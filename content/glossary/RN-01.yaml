# Terms introduced in RN-01. One file per unit keeps parallel authoring conflict-free.
- id: native-renderer
  term: native renderer
  name: { uk: "native-рендерер", en: "native renderer" }
  aliases: ["React Native renderer", "рендерер React Native"]
  definition:
    uk: "Частина React Native, яка під час commit перетворює дерево компонентів (`View`, `Text`, `Pressable`) на native view операційної системи. Це той самий крок, що й у `react-dom`, лише ціль інша: не DOM браузера, а елементи інтерфейсу Android чи iOS."
    en: "The part of React Native that, during commit, turns the component tree (`View`, `Text`, `Pressable`) into the operating system's native views. It is the same step as in `react-dom`, only the target differs: not the browser's DOM but Android or iOS interface elements."
  see: [commit-phase, native-view]
- id: native-view
  term: native view
  name: { uk: "native view", en: "native view" }
  aliases: ["native views", "platform native view", "нативний view"]
  definition:
    uk: "Справжній елемент інтерфейсу операційної системи, який створює React Native: `android.view.View` на Android, `UIView` на iOS. Його малює й обробляє сама платформа, тому шрифти, дотики й доступність на пристрої належать їй, а не браузеру."
    en: "A real interface element of the operating system that React Native creates: `android.view.View` on Android, `UIView` on iOS. The platform itself draws and handles it, so fonts, touches and accessibility on a device belong to the platform, not to a browser."
  see: [native-renderer, platform-view]
- id: react-native-web
  term: react-native-web
  name: { uk: "react-native-web", en: "react-native-web" }
  definition:
    uk: "Бібліотека, що виконує компоненти React Native у браузері: `View` стає `div`, `Text` — текстовим елементом, стилі — CSS-класами. Курс використовує її для концептуального перегляду. Вона показує логіку компонентів, але не native view, жести чи вигляд платформи — і приймає вебові речі (`div`, `onClick`), яких телефон не прийме."
    en: "A library that runs React Native components in a browser: `View` becomes a `div`, `Text` a text element, styles CSS classes. The course uses it for the concept preview. It shows component logic but not native views, gestures or the platform's look — and it accepts web things (`div`, `onClick`) a phone would not."
  see: [native-view]
- id: emulator
  term: emulator
  name: { uk: "емулятор", en: "emulator" }
  aliases: ["Android Emulator", "Android-емулятор"]
  definition:
    uk: "Програма на комп’ютері, що відтворює цілий Android-пристрій разом із його операційною системою. Його створюють в Android Studio (Device Manager). Застосунок на емуляторі — справжній native-застосунок, але камера, датчики й швидкодія тут лише наближені до телефона."
    en: "A program on the computer that reproduces a whole Android device together with its operating system. You create one in Android Studio (Device Manager). An app on an emulator is a real native app, but the camera, sensors and speed only approximate a phone."
  see: [simulator, physical-device]
- id: simulator
  term: simulator
  name: { uk: "симулятор", en: "simulator" }
  aliases: ["iOS Simulator", "iOS-симулятор"]
  definition:
    uk: "iOS Simulator — частина Xcode, що запускає iOS-застосунки на Mac. Він працює лише в macOS. Застосунок у ньому справжній native, але виконується на процесорі Mac, тож частина апаратних можливостей і швидкодія відрізняються від iPhone."
    en: "iOS Simulator is the part of Xcode that runs iOS apps on a Mac. It works only on macOS. The app in it is truly native, but it runs on the Mac's processor, so some hardware features and the speed differ from an iPhone."
  see: [emulator, physical-device]
- id: physical-device
  term: physical device
  name: { uk: "фізичний пристрій", en: "physical device" }
  aliases: ["real device", "справжній пристрій", "телефон"]
  definition:
    uk: "Справжній телефон чи планшет, на якому запускають застосунок під час розробки. Лише він показує реальні дотики, датчики, швидкодію й поведінку системи; найчастіше його під’єднують через ту саму Wi‑Fi-мережу або кабель."
    en: "A real phone or tablet on which the app runs during development. Only it shows real touches, sensors, speed and system behaviour; it is usually connected over the same Wi‑Fi network or a cable."
  see: [emulator, simulator]
- id: declared-target
  term: declared target
  name: { uk: "заявлена ціль", en: "declared target" }
  aliases: ["target device", "цільовий пристрій"]
  definition:
    uk: "Одна конкретна ціль, яку ти обрав і записав для native-завдань курсу: тип (Android-емулятор, iOS-симулятор чи фізичний пристрій), назва й версія ОС. Кожне native-підтвердження стосується саме її; цілі, які твій комп’ютер не підтримує, записують як непідтримувані."
    en: "The one specific target you chose and wrote down for the course's native tasks: its kind (Android emulator, iOS simulator or physical device), its name and its OS version. Every native confirmation is about that target; targets your computer cannot support are recorded as unsupported."
  see: [emulator, simulator, physical-device]
- id: debug-build
  term: debug build
  name: { uk: "debug-збірка", en: "debug build" }
  aliases: ["development build mode", "development mode", "режим розробки"]
  definition:
    uk: "Режим, у якому застосунок під час розробки бере JavaScript із dev-сервера Metro на твоєму комп’ютері: `__DEV__` дорівнює `true`, є попередження, меню розробника й швидке оновлення після збереження файлу. Повільніший і не той, що отримають користувачі."
    en: "The mode in which an app under development takes its JavaScript from the Metro dev server on your computer: `__DEV__` is `true`, and there are warnings, a developer menu and fast updates after you save a file. Slower, and not what users get."
  see: [release-build, bundle]
- id: release-build
  term: release build
  name: { uk: "release-збірка", en: "release build" }
  aliases: ["production build", "production mode", "production-збірка"]
  definition:
    uk: "Збірка для користувачів: увесь JavaScript заздалегідь зібрано в bundle усередині застосунку (у Expo — ще й скомпільовано в байт-код Hermes), dev-сервер не потрібен, `__DEV__` дорівнює `false`, тож код під `if (__DEV__)` прибрано, а попереджень розробника немає."
    en: "The build for users: all JavaScript is bundled in advance inside the app (in Expo, also compiled to Hermes bytecode), no dev server is needed, `__DEV__` is `false`, so code under `if (__DEV__)` is removed, and there are no developer warnings."
  see: [debug-build, bundle]
- id: version-support-matrix
  term: version support matrix
  name: { uk: "таблиця підтримки версій", en: "version support matrix" }
  aliases: ["support table", "SDK support table", "таблиця сумісності"]
  definition:
    uk: "Таблиця з документації інструмента, де для кожної його версії вказано сумісні версії інших частин: для Expo SDK — версію React Native і React, мінімальний Node.js, мінімальні iOS та Android, потрібний Xcode. За нею вирішують, чи підтримано твою ціль."
    en: "A table in a tool's documentation that lists, for each of its versions, the compatible versions of the other parts: for an Expo SDK, the React Native and React versions, the minimum Node.js, the minimum iOS and Android, the required Xcode. You use it to decide whether your target is supported."
  see: [semver, version-label]
- id: shared-domain-package
  term: shared domain package
  name: { uk: "спільний доменний пакет", en: "shared domain package" }
  aliases: ["shared domain", "domain package", "спільний домен"]
  definition:
    uk: "Тека `domain/` проєкту з типами, валідаторами й чистими перетвореннями, яку і веб-клієнт, і native-застосунок використовують без жодної зміни, а не переписують. Вона спільна саме тому, що не імпортує нічого платформного: ні React, ні DOM, ні сховища браузера. У проєкті курсу native-застосунок отримує її як незмінну копію (Metro збирає лише файли всередині теки свого проєкту), а `diff` доводить, що копія не розійшлася з оригіналом."
    en: "The project's `domain/` folder with types, validators and pure transforms that both the web client and the native app use without a single change instead of rewriting it. It is shared precisely because it imports nothing platform-specific: no React, no DOM, no browser storage. In the course project the native app gets it as an unchanged copy (Metro bundles only the files inside its own project folder), and `diff` proves that the copy has not drifted from the original."
  see: [reuse-boundary, platform-neutral-module, native-subproject]
- id: platform-neutral-module
  term: platform-neutral module
  name: { uk: "платформно-нейтральний модуль", en: "platform-neutral module" }
  aliases: ["platform-agnostic module", "незалежний від платформи модуль"]
  definition:
    uk: "Модуль, що працює однаково в браузері, у React Native і в Node.js, бо не звертається до глобальних об’єктів жодної платформи (`document`, `window`, `localStorage`, `__DEV__`). Усе платформне він отримує через параметри."
    en: "A module that works the same in a browser, in React Native and in Node.js, because it touches no platform's globals (`document`, `window`, `localStorage`, `__DEV__`). Everything platform-specific it receives through parameters."
  see: [shared-domain-package, pure-function]
- id: native-rebuild
  term: native rebuild
  name: { uk: "native-перезбирання", en: "native rebuild" }
  aliases: ["rebuild the native app", "перезібрати native-застосунок"]
  definition:
    uk: "Нове складання native-частини застосунку інструментами платформи (Gradle для Android, Xcode для iOS). Потрібне, коли змінилося те, що живе поза JavaScript: native-модулі, дозволи, іконка, назва чи інша native-конфігурація. Зміни JavaScript-коду приходять без нього, через dev-сервер."
    en: "Building the native part of the app again with the platform's tools (Gradle for Android, Xcode for iOS). It is needed when something outside JavaScript changed: native modules, permissions, the icon, the name or other native configuration. JavaScript changes arrive without it, through the dev server."
  see: [debug-build]
