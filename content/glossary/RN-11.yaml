# Terms introduced in RN-11.
- id: application-id
  term: applicationId
  name: { uk: "applicationId (ідентифікатор Android-застосунку)", en: "applicationId (Android application id)" }
  aliases: ["application id", "package name", "android.package", "назва пакета"]
  definition:
    uk: "Рядок у формі перевернутого домену (`com.example.jsll.wishlist`), за яким Android і Google Play розпізнають застосунок. У проєкті Expo його задає `android.package` в `app.json`, а `npx expo prebuild` записує в `applicationId` файлу `android/app/build.gradle`. Збірка з іншим рядком — інший застосунок: вона стане поруч зі старою, а не замість неї."
    en: "A reversed-domain string (`com.example.jsll.wishlist`) by which Android and Google Play recognise an app. In an Expo project `android.package` in `app.json` sets it, and `npx expo prebuild` writes it into `applicationId` in `android/app/build.gradle`. A build with a different string is a different app: it installs next to the old one, not instead of it."
  see: [bundle-identifier, version-code]
- id: bundle-identifier
  term: bundle identifier
  name: { uk: "bundle identifier", en: "bundle identifier" }
  aliases: ["bundle ID", "CFBundleIdentifier", "ios.bundleIdentifier"]
  definition:
    uk: "Ідентифікатор iOS-застосунку у формі перевернутого домену (`com.example.jsll.wishlist`). У проєкті Expo його задає `ios.bundleIdentifier` в `app.json`; у зібраному застосунку це `CFBundleIdentifier` в `Info.plist`. Після першого release не змінюється: інший рядок — інший застосунок для iOS і App Store."
    en: "The id of an iOS app in reversed-domain form (`com.example.jsll.wishlist`). In an Expo project `ios.bundleIdentifier` in `app.json` sets it; in the built app it is `CFBundleIdentifier` in `Info.plist`. It does not change after the first release: a different string is a different app for iOS and the App Store."
  see: [application-id, build-number]
- id: version-code
  term: versionCode
  name: { uk: "versionCode", en: "versionCode" }
  aliases: ["version code", "android.versionCode"]
  definition:
    uk: "Ціле число, за яким Android вирішує, яка збірка новіша. Користувач його не бачить (він бачить `versionName`). Кожен release отримує більше число; збірку з меншим, ніж уже встановлена, Android не ставить, а збірку з уже використаним Google Play не приймає. У проєкті Expo — `android.versionCode` в `app.json`."
    en: "A whole number by which Android decides which build is newer. The user never sees it (they see `versionName`). Every release gets a higher number; Android will not install a build with a lower one than the installed build, and Google Play does not accept one already used. In an Expo project: `android.versionCode` in `app.json`."
  see: [build-number, version-downgrade]
- id: build-number
  term: build number
  name: { uk: "номер збірки (iOS)", en: "build number (iOS)" }
  aliases: ["CFBundleVersion", "ios.buildNumber", "номер збірки"]
  definition:
    uk: "Номер конкретної збірки iOS-застосунку — `CFBundleVersion` в `Info.plist`, у проєкті Expo — `ios.buildNumber` в `app.json` (текст із цифр, `\"2\"`). Користувач бачить іншу версію, `CFBundleShortVersionString` (`1.1.0`). App Store Connect не приймає збірку з номером, який уже був."
    en: "The number of a particular build of an iOS app — `CFBundleVersion` in `Info.plist`, in an Expo project `ios.buildNumber` in `app.json` (text made of digits, `\"2\"`). The user sees a different version, `CFBundleShortVersionString` (`1.1.0`). App Store Connect does not accept a build whose number was already used."
  see: [version-code, bundle-identifier]
- id: build-variant
  term: build variant
  name: { uk: "варіант збірки", en: "build variant" }
  aliases: ["build type", "build configuration", "debug variant", "release variant", "--variant release", "--configuration Release"]
  definition:
    uk: "Те, як збирають той самий проєкт: на Android — `debug` чи `release` (`npx expo run:android --variant release`), на iOS — конфігурація `Debug` чи `Release` (`npx expo run:ios --configuration Release`). Варіанти мають різні налаштування: на Android debug дозволяє незашифрований HTTP, і debug чекає dev-сервер, release вбудовує JavaScript, оптимізує й підписується release-конфігурацією підпису (у свіжому шаблоні Expo це ще `debug.keystore`)."
    en: "How the same project is built: on Android `debug` or `release` (`npx expo run:android --variant release`), on iOS the `Debug` or `Release` configuration (`npx expo run:ios --configuration Release`). The variants have different settings: on Android debug allows unencrypted HTTP, and debug expects a dev server, release embeds the JavaScript, optimises and is signed with the release signing config (in a fresh Expo template that is still `debug.keystore`)."
  see: [debug-build, release-build, embedded-bundle]
- id: embedded-bundle
  term: embedded bundle
  name: { uk: "вбудований bundle", en: "embedded bundle" }
  aliases: ["embedded JS bundle", "bundled JavaScript", "index.android.bundle"]
  definition:
    uk: "Зібраний JavaScript застосунку, покладений всередину release-збірки. Застосунок читає його з власного пакета, а не з dev-сервера Metro, тож працює без твого комп’ютера. Змінити його можна лише новою збіркою — або over-the-air оновленням, якщо застосунок його підтримує."
    en: "The app's bundled JavaScript placed inside a release build. The app reads it from its own package, not from the Metro dev server, so it works without your computer. It changes only with a new build — or with an over-the-air update, if the app supports one."
  see: [bundle, release-build, ota-update]
- id: code-signing
  term: code signing
  name: { uk: "підпис коду", en: "code signing" }
  aliases: ["app signing", "підпис застосунку", "signature"]
  definition:
    uk: "Криптографічний підпис збірки закритим ключем. Пристрій перевіряє його під час встановлення: оновлення приймається, лише якщо підписане тим самим ключем, що й встановлений застосунок. Підпис доводить, хто зібрав пакет і що його не змінили, але не те, що код у ньому безпечний чи правильний."
    en: "A cryptographic signature of a build made with a private key. The device checks it on installation: an update is accepted only if it is signed with the same key as the installed app. The signature proves who built the package and that it was not changed, but not that the code in it is safe or correct."
  see: [signing-key, upload-key, provisioning-profile]
- id: signing-key
  term: signing key
  name: { uk: "ключ підпису", en: "signing key" }
  aliases: ["keystore", "release key", "app signing key", "сховище ключів"]
  definition:
    uk: "Закритий ключ, яким підписують release. На Android він лежить у файлі-сховищі (keystore, `.jks` чи `.keystore`) під паролями. Це секрет: його не комітять, не друкують у журналах і зберігають резервну копію, бо без нього прямо встановлений застосунок уже не оновити."
    en: "The private key a release is signed with. On Android it lives in a store file (a keystore, `.jks` or `.keystore`) behind passwords. It is a secret: it is not committed, not printed in logs, and it is backed up, because without it an app installed directly can no longer be updated."
  see: [code-signing, upload-key]
- id: upload-key
  term: upload key
  name: { uk: "ключ завантаження (upload key)", en: "upload key" }
  aliases: ["upload keystore", "my-upload-key.keystore"]
  definition:
    uk: "Ключ, яким розробник підписує збірку перед завантаженням у Google Play, коли ввімкнено Play App Signing. Застосунок для людей Google переписує своїм ключем підпису застосунку. Загублений ключ завантаження можна скинути через Play Console — на відміну від ключа, яким підписано вже встановлений напряму застосунок."
    en: "The key a developer signs a build with before uploading it to Google Play when Play App Signing is on. Google re-signs the app for people with its app signing key. A lost upload key can be reset through Play Console — unlike the key an app installed directly was signed with."
  see: [signing-key, code-signing]
- id: provisioning-profile
  term: provisioning profile
  name: { uk: "профіль забезпечення (provisioning profile)", en: "provisioning profile" }
  aliases: ["mobileprovision", "профіль розробника"]
  definition:
    uk: "Файл Apple, що пов’язує сертифікат розробника, bundle identifier і дозволені пристрої чи спосіб розповсюдження. Без нього iOS не встановить збірку на справжній iPhone. Його видає обліковий запис Apple Developer; для iOS-симулятора він не потрібен."
    en: "An Apple file that ties together a developer certificate, a bundle identifier and the allowed devices or distribution method. Without it iOS will not install a build on a real iPhone. An Apple Developer account issues it; the iOS simulator does not need one."
  see: [code-signing, bundle-identifier]
- id: apk
  term: APK
  name: { uk: "APK", en: "APK" }
  aliases: ["Android package", "app-release.apk", ".apk"]
  definition:
    uk: "Файл пакета Android-застосунку, який можна встановити прямо на емулятор чи пристрій (`adb install`). Усередині — скомпільований код, ресурси, вбудований JavaScript, `AndroidManifest.xml` і підпис. Release-APK з `npx expo run:android --variant release` зазвичай лежить у `android/app/build/outputs/apk/release/`."
    en: "The package file of an Android app that can be installed directly on an emulator or a device (`adb install`). Inside: compiled code, resources, the embedded JavaScript, `AndroidManifest.xml` and the signature. A release APK from `npx expo run:android --variant release` usually lands in `android/app/build/outputs/apk/release/`."
  see: [android-app-bundle, ipa]
- id: android-app-bundle
  term: Android App Bundle (AAB)
  name: { uk: "Android App Bundle (AAB)", en: "Android App Bundle (AAB)" }
  aliases: ["AAB", ".aab", "app-release.aab"]
  definition:
    uk: "Формат, у якому застосунок завантажують у Google Play (`./gradlew app:bundleRelease` → `app-release.aab`). Сам на телефон він не встановлюється: Google Play збирає з нього APK під кожен пристрій і підписує їх ключем підпису застосунку."
    en: "The format an app is uploaded to Google Play in (`./gradlew app:bundleRelease` → `app-release.aab`). It does not install on a phone by itself: Google Play builds APKs for each device from it and signs them with the app signing key."
  see: [apk, upload-key]
- id: ipa
  term: IPA
  name: { uk: "IPA", en: "IPA" }
  aliases: [".ipa", "iOS app archive"]
  definition:
    uk: "Архів iOS-застосунку для встановлення на справжні пристрої чи завантаження в App Store Connect. Його створюють з archive у Xcode з сертифікатом і профілем забезпечення, тож потрібен обліковий запис Apple Developer. Для симулятора збирають теку `.app` без такого підпису."
    en: "An archive of an iOS app for installing on real devices or uploading to App Store Connect. It is made from an archive in Xcode with a certificate and a provisioning profile, so an Apple Developer account is needed. For the simulator a `.app` folder is built without such a signature."
  see: [apk, provisioning-profile]
- id: staged-rollout
  term: staged rollout
  name: { uk: "поступовий випуск (staged rollout)", en: "staged rollout" }
  aliases: ["phased release", "поетапний випуск"]
  definition:
    uk: "Release, який магазин спочатку дає лише частині людей (наприклад, 5 %), а частку збільшують, якщо не видно збоїв. Він обмежує шкоду від поганої збірки, але не скасовує її: ті, хто вже оновився, лишаються на ній, доки не вийде виправлення."
    en: "A release the store first gives only to a share of people (for example 5 %), with the share raised if no failures show up. It limits the harm of a bad build but does not undo it: those who already updated stay on it until a fix ships."
  see: [forward-fix, ota-update]
- id: ota-update
  term: over-the-air update
  name: { uk: "over-the-air оновлення", en: "over-the-air update" }
  aliases: ["OTA update", "OTA", "EAS Update", "expo-updates"]
  definition:
    uk: "Оновлення, що замінює JavaScript і ресурси вже встановленого застосунку без нової збірки й без магазину (у Expo — бібліотека `expo-updates`). Native-код, дозволи й інші налаштування, вшиті в пакет, воно змінити не може: для них потрібна нова збірка. Оновлення має збігатися з native-частиною збірки (`runtimeVersion`)."
    en: "An update that replaces the JavaScript and assets of an installed app without a new build and without the store (in Expo, the `expo-updates` library). It cannot change native code, permissions or other settings built into the package: those need a new build. An update has to match the build's native part (`runtimeVersion`)."
  see: [embedded-bundle, staged-rollout]
- id: privacy-label
  term: privacy label
  name: { uk: "декларація приватності", en: "privacy label" }
  aliases: ["App Privacy details", "Data safety section", "privacy declaration", "privacy nutrition label"]
  definition:
    uk: "Відповіді розробника в магазині про те, які дані застосунок збирає, навіщо й з ким ділиться: App Privacy в App Store Connect і розділ Data safety в Play Console. «Збирати» обидва магазини визначають як передавати дані за межі пристрою; те, що обробляється лише на пристрої, не декларують. Відповіді мають збігатися з тим, що робить код, разом зі сторонніми бібліотеками."
    en: "The developer's answers in the store about what data the app collects, why, and with whom it is shared: App Privacy in App Store Connect and the Data safety section in Play Console. Both stores define “collect” as sending data off the device; what is processed only on the device is not declared. The answers must match what the code does, third-party libraries included."
  see: [ota-update]
- id: sideloading
  term: sideloading
  name: { uk: "встановлення в обхід магазину (sideloading)", en: "sideloading" }
  aliases: ["sideload", "direct install", "adb install"]
  definition:
    uk: "Встановлення застосунку не з магазину, а прямо з файлу: `adb install` на Android, `xcrun simctl install` на симулятор iOS. Так перевіряють власні збірки. Магазин тоді не перевіряє збірку й не доставляє оновлень — наступну збірку теж треба поставити самому, з тим самим підписом."
    en: "Installing an app not from a store but directly from a file: `adb install` on Android, `xcrun simctl install` on the iOS simulator. This is how you test your own builds. The store then neither reviews the build nor delivers updates — the next build also has to be installed by you, with the same signature."
  see: [apk, code-signing]
- id: minimum-os-version
  term: minimum OS version
  name: { uk: "мінімальна версія ОС", en: "minimum OS version" }
  aliases: ["minSdkVersion", "minSdk", "deployment target", "IPHONEOS_DEPLOYMENT_TARGET"]
  definition:
    uk: "Найстаріша версія операційної системи, на яку ставиться збірка: `minSdkVersion` на Android, deployment target на iOS. У проєкті Expo SDK 57 це API 24 (Android 7) і iOS 16.4. Підняти її в новому release означає, що люди на старших телефонах лишаються на попередній збірці назавжди."
    en: "The oldest operating system version a build installs on: `minSdkVersion` on Android, the deployment target on iOS. In an Expo SDK 57 project it is API 24 (Android 7) and iOS 16.4. Raising it in a new release means people on older phones stay on the previous build for good."
  see: [forward-fix]
- id: forward-fix
  term: forward fix
  name: { uk: "виправлення наперед (forward fix)", en: "forward fix" }
  aliases: ["roll forward", "fix forward"]
  definition:
    uk: "Відповідь на поганий release новою збіркою з виправленням і вищим номером збірки — замість повернення до старої. Для мобільних застосунків це звичайний шлях: старі збірки лишаються на телефонах, номер збірки не можна зменшити, а дані, вже перенесені в нову схему, стара збірка може не прочитати."
    en: "Answering a bad release with a new build that carries the fix and a higher build number — instead of going back to the old one. For mobile apps this is the usual path: old builds stay on phones, the build number cannot go down, and data already migrated to a new schema may be unreadable for the old build."
  see: [version-downgrade, release-rollback]
- id: version-downgrade
  term: version downgrade
  name: { uk: "повернення до старішої збірки (downgrade)", en: "version downgrade" }
  aliases: ["downgrade", "даунгрейд"]
  definition:
    uk: "Спроба поставити збірку зі старішим номером поверх новішої. Android її відхиляє (менший `versionCode`), магазини не приймають номерів, нижчих за вже випущені. Тому «старий код» повертають як нову збірку з вищим номером — і тоді він мусить уміти читати дані, які записала новіша."
    en: "An attempt to install a build with an older number over a newer one. Android refuses it (a lower `versionCode`), and the stores do not accept numbers below those already released. So “old code” is brought back as a new build with a higher number — and then it must be able to read data the newer one wrote."
  see: [version-code, forward-fix]
