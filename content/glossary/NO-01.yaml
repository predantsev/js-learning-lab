# Terms introduced in NO-01.
- id: host-api
  term: host API
  name: { uk: "host API (API середовища)", en: "host API" }
  aliases: ["host APIs", "API середовища", "host environment"]
  definition:
    uk: "Можливості, які дає не сама мова JavaScript, а середовище, що її виконує. Браузер дає `document`, `window`, `localStorage`; Node.js — `process`, `node:fs`, `node:http`; обидва — `setTimeout`, `fetch`, `URL`. Мова (`Promise`, `JSON`, масиви) однакова скрізь, а host API різні, тому код, що звертається до `document`, у Node кидає `ReferenceError`."
    en: "Capabilities that come not from the JavaScript language itself but from the environment that runs it. The browser gives `document`, `window`, `localStorage`; Node.js gives `process`, `node:fs`, `node:http`; both give `setTimeout`, `fetch`, `URL`. The language (`Promise`, `JSON`, arrays) is the same everywhere while host APIs differ, so code that reads `document` throws a `ReferenceError` in Node."
  see: [node-runtime]
