# Terms introduced in NO-01.
- id: host-api
  term: host API
  name: { uk: "host API (API середовища)", en: "host API" }
  aliases: ["host APIs", "API середовища", "host environment"]
  definition:
    uk: "Можливості, які дає не сама мова JavaScript, а середовище, що її виконує. Браузер дає `document`, `window`, `localStorage`; Node.js — `process`, `node:fs`, `node:http`; обидва — `setTimeout`, `fetch`, `URL`. Мова (`Promise`, `JSON`, масиви) однакова скрізь, а host API різні, тому код, що звертається до `document`, у Node кидає `ReferenceError`."
    en: "Capabilities that come not from the JavaScript language itself but from the environment that runs it. The browser gives `document`, `window`, `localStorage`; Node.js gives `process`, `node:fs`, `node:http`; both give `setTimeout`, `fetch`, `URL`. The language (`Promise`, `JSON`, arrays) is the same everywhere while host APIs differ, so code that reads `document` throws a `ReferenceError` in Node."
  see: [node-runtime]
- id: process-argv
  term: process.argv
  name: { uk: "process.argv", en: "process.argv" }
  aliases: ["argv", "command-line arguments", "аргументи командного рядка"]
  definition:
    uk: "Масив слів командного рядка, з яким запустили Node-процес: `[шлях до node, шлях до файлу, …твої аргументи]`. Свої аргументи беруть як `process.argv.slice(2)`. Кожен елемент — текст: `--limit 3` дає `['--limit', '3']`, а не число 3."
    en: "The array of command-line words a Node process was started with: `[path to node, path to the file, …your arguments]`. Your own arguments are `process.argv.slice(2)`. Every element is text: `--limit 3` gives `['--limit', '3']`, not the number 3."
  example:
    code: "// node summary.mjs --limit 3\nprocess.argv.slice(2); // ['--limit', '3']"
  see: [process-env]
- id: process-env
  term: process.env
  name: { uk: "process.env", en: "process.env" }
  aliases: ["env"]
  definition:
    uk: "Об’єкт зі змінними оточення Node-процесу. Кожне значення — текст (навіть `PORT=3000` дає `\"3000\"`), а незадана змінна — `undefined`. Тому конфігурацію з `process.env` перетворюють на потрібні типи й перевіряють на старті програми."
    en: "The object holding a Node process’s environment variables. Every value is text (even `PORT=3000` gives `\"3000\"`), and an unset variable is `undefined`. That is why a config read from `process.env` is converted to the right types and checked at the start of the program."
  see: [environment-variable, fail-fast]
- id: process-exit-code
  term: exit code
  name: { uk: "код завершення", en: "exit code" }
  aliases: ["exit status", "process.exitCode", "код виходу"]
  definition:
    uk: "Число, яке процес повертає операційній системі, коли завершується: `0` — успіх, будь-яке інше — збій. Його читають термінал (`echo $?` у macOS і Linux), `npm` і CI. У Node `process.exitCode = 1` записує код і дає програмі завершитися самій, а `process.exit(1)` обриває її негайно."
    en: "The number a process returns to the operating system when it ends: `0` means success, anything else means failure. The terminal (`echo $?` on macOS and Linux), `npm` and CI read it. In Node `process.exitCode = 1` records the code and lets the program end on its own, while `process.exit(1)` cuts it off at once."
  see: [process-argv]
- id: fail-fast
  term: fail fast
  name: { uk: "fail fast (зупинитися одразу)", en: "fail fast" }
  aliases: ["fail-fast"]
  definition:
    uk: "Правило: перевіряти вхідні дані й конфігурацію на самому початку і, якщо щось хибне, одразу зупинитися зрозумілим повідомленням — замість того, щоб працювати далі й зламатися пізніше в незрозумілому місці. Для скрипта це повідомлення в stderr і ненульовий код завершення."
    en: "The rule of checking input and configuration at the very start and, if something is invalid, stopping at once with a readable message — instead of carrying on and breaking later somewhere confusing. For a script that means a message on stderr and a non-zero exit code."
  see: [process-env, process-exit-code]
- id: package-type-field
  term: package.json type field
  name: { uk: "поле type у package.json", en: "package.json type field" }
  aliases: ["\"type\": \"module\"", "type field", "поле type"]
  definition:
    uk: "Поле `package.json`, що каже Node, як завантажувати файли `.js` у цій теці та в теках нижче: `\"module\"` — як ES-модулі, `\"commonjs\"` — як CommonJS. Файли `.mjs` завжди ES-модулі, а `.cjs` — завжди CommonJS, незалежно від нього. Діє найближчий `package.json` над файлом."
    en: "A `package.json` field that tells Node how to load `.js` files in this folder and the folders below: `\"module\"` as ES modules, `\"commonjs\"` as CommonJS. `.mjs` files are always ES modules and `.cjs` always CommonJS, whatever it says. The nearest `package.json` above the file applies."
  example:
    code: "{ \"name\": \"habit-kit\", \"type\": \"module\" }"
  see: [commonjs, es-module]
- id: bare-specifier
  term: bare specifier
  name: { uk: "голий specifier", en: "bare specifier" }
  aliases: ["bare import", "package specifier"]
  definition:
    uk: "Specifier, що не починається з `./`, `../`, `/` чи `node:` — назва пакета й, можливо, шлях у ньому (`habit-kit/streak`). Node шукає для нього теку `node_modules/<назва>`, піднімаючись від теки модуля до кореня диска, а далі слухає поле `exports` пакета. Браузер без карти імпортів такий specifier не розуміє."
    en: "A specifier that does not start with `./`, `../`, `/` or `node:` — a package name and maybe a path inside it (`habit-kit/streak`). For it Node looks for a `node_modules/<name>` folder, climbing from the module’s folder to the root of the disk, then follows the package’s `exports` field. A browser without an import map does not understand such a specifier."
  see: [module-specifier, exports-map]
- id: exports-map
  term: exports map
  name: { uk: "карта exports", en: "exports map" }
  aliases: ["exports field", "package exports", "поле exports"]
  definition:
    uk: "Поле `exports` у `package.json` пакета: перелік шляхів, які можна імпортувати ззовні, і файлів, до яких вони ведуть (`\"./streak\": \"./src/streak.js\"`). Шлях, якого в переліку немає, Node не відкриє навіть тоді, коли файл існує: імпорт падає з `ERR_PACKAGE_PATH_NOT_EXPORTED`."
    en: "The `exports` field in a package’s `package.json`: the list of paths that may be imported from outside and the files they lead to (`\"./streak\": \"./src/streak.js\"`). Node does not open a path that is not on the list even when the file exists: the import fails with `ERR_PACKAGE_PATH_NOT_EXPORTED`."
  see: [bare-specifier]
- id: event-loop-phase
  term: event loop phase
  name: { uk: "фаза event loop", en: "event loop phase" }
  aliases: ["phases", "timers phase", "poll phase", "check phase", "close phase", "фази"]
  definition:
    uk: "Одна зупинка циклу подій Node. Цикл ходить по колу: timers (колбеки `setTimeout`/`setInterval`), poll (колбеки вводу-виводу), check (колбеки `setImmediate`), close (колбеки закриття). Між будь-якими двома колбеками Node спорожнює чергу `nextTick`, а потім мікрозадачі промісів."
    en: "One stop of Node’s event loop. The loop goes round: timers (`setTimeout`/`setInterval` callbacks), poll (I/O callbacks), check (`setImmediate` callbacks), close (close callbacks). Between any two callbacks Node empties the `nextTick` queue and then the promise microtasks."
  see: [event-loop, set-immediate, next-tick-queue]
- id: set-immediate
  term: setImmediate
  name: { uk: "setImmediate", en: "setImmediate" }
  definition:
    uk: "Функція Node, що планує колбек у фазі check — одразу після поточної фази poll. Попри назву, вона не «негайна»: `nextTick` і проміси виконуються раніше. Усередині колбека вводу-виводу `setImmediate` завжди випереджає `setTimeout(…, 0)`, а на верхньому рівні модуля їхній порядок не гарантований."
    en: "A Node function that schedules a callback in the check phase — right after the current poll phase. Despite the name it is not “immediate”: `nextTick` and promises run earlier. Inside an I/O callback `setImmediate` always comes before `setTimeout(…, 0)`; at the top level of a module their order is not guaranteed."
  see: [event-loop-phase]
- id: next-tick-queue
  term: process.nextTick queue
  name: { uk: "черга process.nextTick", en: "process.nextTick queue" }
  aliases: ["nextTick", "process.nextTick"]
  definition:
    uk: "Черга колбеків `process.nextTick`, яку Node спорожнює після кожного колбека — ще до мікрозадач промісів і до будь-якої фази циклу. Виняток: на верхньому рівні ES-модуля проміси виконуються раніше, бо сам цей код уже виконується як мікрозадача. Документація Node.js 22 позначає `process.nextTick` як Legacy і радить у новому коді `queueMicrotask`."
    en: "The queue of `process.nextTick` callbacks, which Node empties after every callback — even before the promise microtasks and before any loop phase. The exception: at the top level of an ES module promises run first, because that code itself already runs as a microtask. The Node.js 22 documentation marks `process.nextTick` as Legacy and recommends `queueMicrotask` for new code."
  see: [microtask-queue, event-loop-phase]
- id: event-emitter
  term: EventEmitter
  name: { uk: "EventEmitter", en: "EventEmitter" }
  aliases: ["emitter", "емітер", "node:events"]
  definition:
    uk: "Клас із `node:events`, на якому в Node побудовані потоки, сервери й сокети. `on(name, fn)` додає слухача, `once` — одноразового, `off` прибирає саме цю функцію, `listenerCount` рахує. `emit(name, …args)` викликає слухачів синхронно, у порядку додавання, і повертає `true`, якщо вони були."
    en: "The class from `node:events` that streams, servers and sockets in Node are built on. `on(name, fn)` adds a listener, `once` a one-time one, `off` removes exactly that function, `listenerCount` counts them. `emit(name, …args)` calls the listeners synchronously, in the order they were added, and returns `true` if there were any."
  see: [error-event, event-listener]
- id: error-event
  term: "'error' event"
  name: { uk: "подія 'error'", en: "'error' event" }
  aliases: ["error event", "unhandled 'error' event", "ERR_UNHANDLED_ERROR"]
  definition:
    uk: "Особлива подія `EventEmitter`: якщо слухача `'error'` немає, `emit('error', err)` кидає `err` тому, хто випустив подію, а неспіймана — завершує процес. Тому до кожного емітера, з яким працює код, додають слухача `'error'`."
    en: "A special `EventEmitter` event: if there is no `'error'` listener, `emit('error', err)` throws `err` at whoever emitted it, and uncaught it ends the process. That is why code adds an `'error'` listener to every emitter it works with."
  see: [event-emitter]
- id: max-listeners-warning
  term: MaxListenersExceededWarning
  name: { uk: "MaxListenersExceededWarning", en: "MaxListenersExceededWarning" }
  aliases: ["max listeners", "Possible EventEmitter memory leak detected", "setMaxListeners"]
  definition:
    uk: "Попередження Node, коли на одну подію одного емітера додано більше слухачів, ніж дозволяє ліміт (10 за замовчуванням). Найчастіше означає витік: код додає слухача знову й знову й не прибирає. Збільшення ліміту через `setMaxListeners` ховає сигнал, а не виправляє причину."
    en: "A Node warning printed when more listeners are added to one event of one emitter than the limit allows (10 by default). Most often it means a leak: code adds a listener again and again without removing it. Raising the limit with `setMaxListeners` hides the signal, it does not fix the cause."
  see: [event-emitter, listener-cleanup]
- id: type-stripping
  term: type stripping
  name: { uk: "type stripping (вирізання типів)", en: "type stripping" }
  aliases: ["strip types", "--experimental-strip-types", "вирізання типів"]
  definition:
    uk: "Спосіб, яким Node запускає файли `.ts`: вирізає анотації типів і виконує JavaScript, що лишився, **без** перевірки типів. Потребує `import type` для типів, розширення `.ts` в імпортах і лише синтаксису, який можна просто вирізати (без `enum`). За документацією Node.js 22 увімкнено за замовчуванням від 22.18; перевіряє типи окремий крок — `tsc --noEmit`."
    en: "The way Node runs `.ts` files: it cuts out the type annotations and runs the JavaScript left, **without** checking types. It needs `import type` for types, the `.ts` extension in imports and only syntax that can simply be cut out (no `enum`). Per the Node.js 22 documentation it is on by default from 22.18; a separate step — `tsc --noEmit` — checks the types."
  see: [type-erasure, tsc]
