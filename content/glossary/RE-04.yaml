# Terms introduced in RE-04.
- id: lifting-state
  term: lifting state up
  name: { uk: "підняття стану", en: "lifting state up" }
  aliases: ["lifting state", "lift state", "підняти стан"]
  definition:
    uk: "Перенесення стану, потрібного кільком компонентам, у їхнього найближчого спільного батька. Батько передає дітям значення як props і callback, через який діти просять його змінити. Так замість кількох копій, що розходяться, лишається одна правда."
    en: "Moving state that several components need into their closest common parent. The parent passes the children the value as props and a callback through which the children ask it to change. Instead of several copies that drift apart, there is one truth."
  see: [state-ownership, props]
- id: state-ownership
  term: state owner
  name: { uk: "власник стану", en: "state owner" }
  aliases: ["state ownership", "owner", "власник"]
  definition:
    uk: "Компонент, у якому викликано `useState` (чи `useReducer`) для певних даних. Лише він може їх змінити; решта отримує значення як props і просить змін через callback. У кожного шматка даних має бути один власник."
    en: "The component in which `useState` (or `useReducer`) is called for a piece of data. Only it can change that data; the others get the value as props and ask for changes through a callback. Every piece of data should have one owner."
  see: [lifting-state, single-source-of-truth]
- id: state-colocation
  term: state colocation
  name: { uk: "колокація стану", en: "state colocation" }
  aliases: ["colocation", "colocate state", "колокація"]
  definition:
    uk: "Звичка тримати стан у найнижчому компоненті, якому він потрібен: стан одного компонента — у ньому, спільний — у найближчому спільному батькові. Тоді зміна стану рендерить менше компонентів, а залежності між ними видно з props."
    en: "The habit of keeping state in the lowest component that needs it: one component's state lives in it, shared state in the closest common parent. Then a state change renders fewer components, and the dependencies between them are visible in the props."
  see: [state-ownership, lifting-state]
- id: global-state
  term: global state
  name: { uk: "глобальний стан", en: "global state" }
  aliases: ["app-wide state", "глобальне сховище"]
  definition:
    uk: "Стан, доступний усьому застосунку: у кореневому компоненті, у змінній модуля чи в окремому сховищі. Потрібен для справді спільних даних (мова інтерфейсу, поточний користувач). Без потреби він ширить перемальовування, ховає, хто від чого залежить, і ускладнює тести."
    en: "State available to the whole app: in the root component, in a module variable or in a separate store. It is needed for truly shared data (the interface language, the current user). Without need it widens re-renders, hides who depends on what and makes tests harder."
  see: [state-colocation]
