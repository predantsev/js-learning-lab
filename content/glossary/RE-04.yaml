# Terms introduced in RE-04.
- id: lifting-state
  term: lifting state up
  name: { uk: "підняття стану", en: "lifting state up" }
  aliases: ["lifting state", "lift state", "підняти стан"]
  definition:
    uk: "Перенесення стану, потрібного кільком компонентам, у їхнього найближчого спільного батька. Батько передає дітям значення як props і callback, через який діти просять його змінити. Так замість кількох копій, що розходяться, лишається одна правда."
    en: "Moving state that several components need into their closest common parent. The parent passes the children the value as props and a callback through which the children ask it to change. Instead of several copies that drift apart, there is one truth."
  see: [state-ownership, props]
- id: state-ownership
  term: state owner
  name: { uk: "власник стану", en: "state owner" }
  aliases: ["state ownership", "owner", "власник"]
  definition:
    uk: "Компонент, у якому викликано `useState` (чи `useReducer`) для певних даних. Лише він може їх змінити; решта отримує значення як props і просить змін через callback. У кожного шматка даних має бути один власник."
    en: "The component in which `useState` (or `useReducer`) is called for a piece of data. Only it can change that data; the others get the value as props and ask for changes through a callback. Every piece of data should have one owner."
  see: [lifting-state, single-source-of-truth]
- id: state-colocation
  term: state colocation
  name: { uk: "колокація стану", en: "state colocation" }
  aliases: ["colocation", "colocate state", "колокація"]
  definition:
    uk: "Звичка тримати стан у найнижчому компоненті, якому він потрібен: стан одного компонента — у ньому, спільний — у найближчому спільному батькові. Тоді зміна стану рендерить менше компонентів, а залежності між ними видно з props."
    en: "The habit of keeping state in the lowest component that needs it: one component's state lives in it, shared state in the closest common parent. Then a state change renders fewer components, and the dependencies between them are visible in the props."
  see: [state-ownership, lifting-state]
- id: global-state
  term: global state
  name: { uk: "глобальний стан", en: "global state" }
  aliases: ["app-wide state", "глобальне сховище"]
  definition:
    uk: "Стан, доступний усьому застосунку: у кореневому компоненті, у змінній модуля чи в окремому сховищі. Потрібен для справді спільних даних (мова інтерфейсу, поточний користувач). Без потреби він ширить перемальовування, ховає, хто від чого залежить, і ускладнює тести."
    en: "State available to the whole app: in the root component, in a module variable or in a separate store. It is needed for truly shared data (the interface language, the current user). Without need it widens re-renders, hides who depends on what and makes tests harder."
  see: [state-colocation]
- id: use-reducer
  term: useReducer
  name: { uk: "useReducer", en: "useReducer" }
  aliases: ["reducer", "редюсер"]
  definition:
    uk: "Хук, що зберігає стан, як `useState`, але всі зміни описує одна чиста функція-reducer `(state, action) => nextState`. `useReducer(reducer, initialState)` повертає `[state, dispatch]`. Повернутий reducer **той самий** стан React вважає «без змін» і рендер пропускає."
    en: "A hook that keeps state like `useState`, but all changes are described by one pure reducer function `(state, action) => nextState`. `useReducer(reducer, initialState)` returns `[state, dispatch]`. When the reducer returns **the same** state, React treats it as “no change” and skips the render."
  see: [dispatch, reducer-action, use-state]
  example:
    code: "function counterReducer(count, action) {\n  return action.type === \"reset\" ? 0 : count + 1;\n}\nconst [count, dispatch] = useReducer(counterReducer, 0);"
- id: dispatch
  term: dispatch
  name: { uk: "dispatch", en: "dispatch" }
  aliases: ["dispatch an action", "надіслати action"]
  definition:
    uk: "Функція, яку повертає `useReducer`. `dispatch(action)` передає action React; React викликає reducer із поточним станом і цим action, а результат стає новим станом. Обробник через `dispatch` лише повідомляє, що сталося, а не обчислює новий стан."
    en: "The function returned by `useReducer`. `dispatch(action)` hands an action to React; React calls the reducer with the current state and that action, and the result becomes the new state. Through `dispatch` a handler only reports what happened instead of computing the new state."
  see: [use-reducer, reducer-action]
- id: reducer-action
  term: action
  name: { uk: "action (дія)", en: "action" }
  aliases: ["reducer action", "дія"]
  definition:
    uk: "Звичайний об’єкт, що описує подію для reducer: поле `type` каже, що сталося (`\"removed\"`), інші поля несуть потрібні дані (`id`). У TypeScript actions описують як discriminated union за полем `type`, тож одруківку чи неправильні поля відхиляє `tsc`."
    en: "A plain object that describes an event for a reducer: the `type` field says what happened (`\"removed\"`), the other fields carry the data it needs (`id`). In TypeScript actions are described as a discriminated union on the `type` field, so `tsc` rejects a typo or wrong fields."
  see: [dispatch, discriminated-union]
- id: prop-drilling
  term: prop drilling
  name: { uk: "prop drilling", en: "prop drilling" }
  aliases: ["drilling", "просвердлювання props"]
  definition:
    uk: "Передавання prop крізь кілька проміжних компонентів, які самі його не використовують, лише щоб він дістався до глибшого компонента. На один-два рівні це нормально; довгий ланцюжок лікують композицією (`children`) або context."
    en: "Passing a prop through several components in between that do not use it themselves, only so that it reaches a deeper component. One or two levels are normal; a long chain is cured with composition (`children`) or a context."
  see: [children-prop, react-context]
- id: react-context
  term: context
  name: { uk: "context", en: "context" }
  aliases: ["React context", "createContext", "useContext", "контекст"]
  definition:
    uk: "Спосіб передати значення всім компонентам піддерева без props. `createContext(default)` створює context, provider задає значення, `useContext(Context)` читає його в будь-якому компоненті всередині provider; поза provider — значення за замовчуванням. Коли значення provider змінюється, перемальовуються всі його споживачі."
    en: "A way to pass a value to every component of a subtree without props. `createContext(default)` creates a context, a provider sets the value, and `useContext(Context)` reads it in any component inside the provider; outside it, the default value. When the provider value changes, all its consumers re-render."
  see: [context-provider, prop-drilling]
- id: context-provider
  term: context provider
  name: { uk: "provider (context)", en: "context provider" }
  aliases: ["provider", "Context.Provider"]
  definition:
    uk: "Тег, що задає значення context для свого піддерева: `<SomeContext value={…}>…</SomeContext>` (у старішому коді `<SomeContext.Provider value={…}>`). Його межа — це всі компоненти всередині: лише вони бачать `value`."
    en: "The tag that sets a context's value for its subtree: `<SomeContext value={…}>…</SomeContext>` (in older code `<SomeContext.Provider value={…}>`). Its boundary is every component inside it: only they see `value`."
  see: [react-context]
- id: use-ref
  term: useRef
  name: { uk: "useRef", en: "useRef" }
  aliases: ["ref", "реф"]
  definition:
    uk: "Хук, що повертає той самий об’єкт `{ current: … }` на кожному рендері. Зміна `current` не перемальовує компонент, тому ref тримає те, що рендеру не потрібне: DOM-вузол, номер таймера, позначку «що було минулого разу». Дані, які видно на екрані, живуть у стані, а не в ref."
    en: "A hook that returns the same `{ current: … }` object on every render. Changing `current` does not re-render the component, so a ref holds what rendering does not need: a DOM node, a timer id, a “what it was last time” flag. Data shown on the screen lives in state, not in a ref."
  see: [dom-ref, use-state]
- id: dom-ref
  term: DOM ref
  name: { uk: "DOM ref", en: "DOM ref" }
  aliases: ["ref attribute", "атрибут ref"]
  definition:
    uk: "Ref, переданий в атрибут `ref` елемента JSX (`<input ref={inputRef} />`). Після commit React кладе в `inputRef.current` справжній DOM-вузол, а коли елемент зникає — `null`. На першому рендері там ще `null`, тому вузол використовують в обробниках і ефектах, а не під час рендеру."
    en: "A ref passed to the `ref` attribute of a JSX element (`<input ref={inputRef} />`). After the commit React puts the real DOM node into `inputRef.current`, and `null` when the element goes away. On the first render it is still `null`, so the node is used in handlers and effects, not during render."
  see: [use-ref, commit-phase]
- id: custom-hook
  term: custom hook
  name: { uk: "власний хук", en: "custom hook" }
  aliases: ["custom hooks", "власні хуки", "кастомний хук"]
  definition:
    uk: "Функція, назва якої починається з `use` і яка викликає інші хуки (`useState`, `useEffect`, `useContext`…). Вона ділиться **логікою**, а не станом: кожен виклик отримує власні комірки в компоненті, що його викликав. Для неї діють правила хуків."
    en: "A function whose name starts with `use` and which calls other hooks (`useState`, `useEffect`, `useContext`…). It shares **logic**, not state: every call gets its own slots in the component that called it. The rules of hooks apply to it."
  see: [react-hook, rules-of-hooks, hook-contract]
  example:
    code: "function useOnline(): boolean {\n  const [online, setOnline] = useState(navigator.onLine);\n  useEffect(() => {\n    const update = () => setOnline(navigator.onLine);\n    window.addEventListener(\"online\", update);\n    window.addEventListener(\"offline\", update);\n    return () => {\n      window.removeEventListener(\"online\", update);\n      window.removeEventListener(\"offline\", update);\n    };\n  }, []);\n  return online;\n}"
- id: hook-contract
  term: hook contract
  name: { uk: "контракт хука", en: "hook contract" }
  aliases: ["contract", "контракт"]
  definition:
    uk: "Короткий опис власного хука для тих, хто його викликає: що означають аргументи і що буде, якщо вони зміняться; що хук повертає; що синхронізують його ефекти й від чого залежать; що прибирає cleanup; і що кожен виклик має власний стан. Типи покривають частину контракту для `tsc`, решту перевіряють тести."
    en: "A short description of a custom hook for those who call it: what the arguments mean and what happens if they change; what the hook returns; what its effects synchronize and what they depend on; what the cleanup removes; and that every call has its own state. Types cover part of the contract for `tsc`, tests check the rest."
  see: [custom-hook]
