# Terms introduced in JS-13.
- id: iterable-protocol
  term: iterable protocol
  name: { uk: "протокол ітерації", en: "iterable protocol" }
  aliases: ["iterable", "iterator", "ітератор", "iterator protocol"]
  definition:
    uk: "Домовленість, якою користуються `for...of`, spread `[...x]`, деструктуризація масиву й `Array.from`. Значення **iterable**, якщо має метод `[Symbol.iterator]()`; цей метод повертає **ітератор** — об’єкт із методом `next()`, що щоразу дає наступний результат `{ value, done }`. Ітератор одноразовий: дійшовши до `done: true`, він на початок не повертається."
    en: "The agreement used by `for...of`, the spread `[...x]`, array destructuring and `Array.from`. A value is **iterable** if it has a `[Symbol.iterator]()` method; that method returns an **iterator** — an object with a `next()` method that gives the next result `{ value, done }` each time. An iterator is single-use: once it reaches `done: true`, it does not go back to the start."
  see: [symbol-iterator, iterator-result, for-of]
  example:
    code: "const iterator = [\"a\", \"b\"][Symbol.iterator]();\niterator.next(); // { value: \"a\", done: false }\niterator.next(); // { value: \"b\", done: false }\niterator.next(); // { value: undefined, done: true }"
- id: iterator-result
  term: iterator result
  name: { uk: "результат ітератора", en: "iterator result" }
  definition:
    uk: "Об’єкт `{ value, done }`, який повертає кожен виклик `next()` ітератора. `done: false` — у `value` лежить наступне значення; `done: true` — значень більше немає, і `for...of` закінчується, не кладучи `value` у змінну циклу."
    en: "The object `{ value, done }` that every call of an iterator's `next()` returns. `done: false` means `value` holds the next value; `done: true` means there are no more values, and `for...of` ends without putting `value` into the loop variable."
  see: [iterable-protocol]
- id: symbol-iterator
  term: Symbol.iterator
  name: { uk: "Symbol.iterator", en: "Symbol.iterator" }
  definition:
    uk: "Вбудований symbol, під яким об’єкт тримає метод, що створює ітератор. Його записують у квадратних дужках: `[Symbol.iterator]() { … }` у класі чи літералі об’єкта, `value[Symbol.iterator]()` під час виклику. У масивів, тексту, `Map` і `Set` такий метод уже є, у звичайних об’єктів — ні."
    en: "A built-in symbol under which an object keeps the method that creates an iterator. It is written in square brackets: `[Symbol.iterator]() { … }` in a class or object literal, `value[Symbol.iterator]()` when calling it. Arrays, text, `Map` and `Set` already have such a method; plain objects do not."
  see: [iterable-protocol, symbol]
- id: generator
  term: generator
  name: { uk: "генератор", en: "generator" }
  aliases: ["function*", "generator function", "функція-генератор"]
  definition:
    uk: "Функція, оголошена як `function*`. Її виклик не виконує тіла, а повертає об’єкт-генератор — ітератор. Кожен `next()` виконує тіло до наступного `yield` і ставить його на паузу, зберігаючи змінні. Якщо цикл виходить достроково (`break`), він викликає в генератора `return()`, і блоки `finally` всередині виконуються."
    en: "A function declared as `function*`. Calling it does not run the body; it returns a generator object — an iterator. Each `next()` runs the body up to the next `yield` and pauses there, keeping the variables. If a loop leaves early (`break`), it calls the generator's `return()`, and the `finally` blocks inside run."
  see: [yield, iterable-protocol, lazy-evaluation]
  example:
    code: "function* ids() {\n  yield \"t-01\";\n  yield \"t-02\";\n}\nconst gen = ids();      // the body has not run yet\ngen.next().value;       // \"t-01\""
- id: yield
  term: yield
  name: { uk: "yield", en: "yield" }
  definition:
    uk: "Службове слово всередині генератора: віддає значення тому, хто викликав `next()`, і ставить генератор на паузу до наступного `next()`."
    en: "A keyword inside a generator: it hands a value to whoever called `next()` and pauses the generator until the next `next()`."
  see: [generator]
- id: lazy-evaluation
  term: lazy evaluation
  name: { uk: "ліниве обчислення", en: "lazy evaluation" }
  aliases: ["lazy", "лінивий"]
  definition:
    uk: "Підхід, за якого значення обчислюють лише тоді, коли їх просять, а не всі наперед. Генератор лінивий: наступну сторінку він будує тільки на наступний `next()`, тож якщо споживач зупинився раніше, решту не буде створено взагалі."
    en: "An approach where values are computed only when they are asked for, not all in advance. A generator is lazy: it builds the next page only on the next `next()`, so if the consumer stops early, the rest is never created at all."
  see: [generator]
- id: async-iterator
  term: async iterator
  name: { uk: "асинхронний ітератор", en: "async iterator" }
  aliases: ["for await", "for await...of", "async generator", "асинхронний генератор"]
  definition:
    uk: "Ітератор, чий `next()` повертає проміс результату `{ value, done }`. Його перебирає `for await...of`: на кожному кроці цикл чекає, доки проміс виконається, і лише тоді просить наступне значення — кроки йдуть по черзі, а не одночасно. Найпростіше створити його асинхронним генератором `async function*`."
    en: "An iterator whose `next()` returns a promise of the result `{ value, done }`. It is walked by `for await...of`: on every step the loop waits until the promise settles and only then asks for the next value — the steps go one after another, not at the same time. The simplest way to create one is an async generator `async function*`."
  see: [generator, await, iterable-protocol]
