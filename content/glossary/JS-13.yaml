# Terms introduced in JS-13.
- id: iterable-protocol
  term: iterable protocol
  name: { uk: "протокол ітерації", en: "iterable protocol" }
  aliases: ["iterable", "iterator", "ітератор", "iterator protocol"]
  definition:
    uk: "Домовленість, якою користуються `for...of`, spread `[...x]`, деструктуризація масиву й `Array.from`. Значення **iterable**, якщо має метод `[Symbol.iterator]()`; цей метод повертає **ітератор** — об’єкт із методом `next()`, що щоразу дає наступний результат `{ value, done }`. Ітератор одноразовий: дійшовши до `done: true`, він на початок не повертається."
    en: "The agreement used by `for...of`, the spread `[...x]`, array destructuring and `Array.from`. A value is **iterable** if it has a `[Symbol.iterator]()` method; that method returns an **iterator** — an object with a `next()` method that gives the next result `{ value, done }` each time. An iterator is single-use: once it reaches `done: true`, it does not go back to the start."
  see: [symbol-iterator, iterator-result, for-of]
  example:
    code: "const iterator = [\"a\", \"b\"][Symbol.iterator]();\niterator.next(); // { value: \"a\", done: false }\niterator.next(); // { value: \"b\", done: false }\niterator.next(); // { value: undefined, done: true }"
- id: iterator-result
  term: iterator result
  name: { uk: "результат ітератора", en: "iterator result" }
  definition:
    uk: "Об’єкт `{ value, done }`, який повертає кожен виклик `next()` ітератора. `done: false` — у `value` лежить наступне значення; `done: true` — значень більше немає, і `for...of` закінчується, не кладучи `value` у змінну циклу."
    en: "The object `{ value, done }` that every call of an iterator's `next()` returns. `done: false` means `value` holds the next value; `done: true` means there are no more values, and `for...of` ends without putting `value` into the loop variable."
  see: [iterable-protocol]
- id: symbol-iterator
  term: Symbol.iterator
  name: { uk: "Symbol.iterator", en: "Symbol.iterator" }
  definition:
    uk: "Вбудований symbol, під яким об’єкт тримає метод, що створює ітератор. Його записують у квадратних дужках: `[Symbol.iterator]() { … }` у класі чи літералі об’єкта, `value[Symbol.iterator]()` під час виклику. У масивів, тексту, `Map` і `Set` такий метод уже є, у звичайних об’єктів — ні."
    en: "A built-in symbol under which an object keeps the method that creates an iterator. It is written in square brackets: `[Symbol.iterator]() { … }` in a class or object literal, `value[Symbol.iterator]()` when calling it. Arrays, text, `Map` and `Set` already have such a method; plain objects do not."
  see: [iterable-protocol, symbol]
- id: generator
  term: generator
  name: { uk: "генератор", en: "generator" }
  aliases: ["function*", "generator function", "функція-генератор"]
  definition:
    uk: "Функція, оголошена як `function*`. Її виклик не виконує тіла, а повертає об’єкт-генератор — ітератор. Кожен `next()` виконує тіло до наступного `yield` і ставить його на паузу, зберігаючи змінні. Якщо цикл виходить достроково (`break`), він викликає в генератора `return()`, і блоки `finally` всередині виконуються."
    en: "A function declared as `function*`. Calling it does not run the body; it returns a generator object — an iterator. Each `next()` runs the body up to the next `yield` and pauses there, keeping the variables. If a loop leaves early (`break`), it calls the generator's `return()`, and the `finally` blocks inside run."
  see: [yield, iterable-protocol, lazy-evaluation]
  example:
    code: "function* ids() {\n  yield \"t-01\";\n  yield \"t-02\";\n}\nconst gen = ids();      // the body has not run yet\ngen.next().value;       // \"t-01\""
- id: yield
  term: yield
  name: { uk: "yield", en: "yield" }
  definition:
    uk: "Службове слово всередині генератора: віддає значення тому, хто викликав `next()`, і ставить генератор на паузу до наступного `next()`."
    en: "A keyword inside a generator: it hands a value to whoever called `next()` and pauses the generator until the next `next()`."
  see: [generator]
- id: lazy-evaluation
  term: lazy evaluation
  name: { uk: "ліниве обчислення", en: "lazy evaluation" }
  aliases: ["lazy", "лінивий"]
  definition:
    uk: "Підхід, за якого значення обчислюють лише тоді, коли їх просять, а не всі наперед. Генератор лінивий: наступну сторінку він будує тільки на наступний `next()`, тож якщо споживач зупинився раніше, решту не буде створено взагалі."
    en: "An approach where values are computed only when they are asked for, not all in advance. A generator is lazy: it builds the next page only on the next `next()`, so if the consumer stops early, the rest is never created at all."
  see: [generator]
- id: async-iterator
  term: async iterator
  name: { uk: "асинхронний ітератор", en: "async iterator" }
  aliases: ["for await", "for await...of", "async generator", "асинхронний генератор"]
  definition:
    uk: "Ітератор, чий `next()` повертає проміс результату `{ value, done }`. Його перебирає `for await...of`: на кожному кроці цикл чекає, доки проміс виконається, і лише тоді просить наступне значення — кроки йдуть по черзі, а не одночасно. Найпростіше створити його асинхронним генератором `async function*`."
    en: "An iterator whose `next()` returns a promise of the result `{ value, done }`. It is walked by `for await...of`: on every step the loop waits until the promise settles and only then asks for the next value — the steps go one after another, not at the same time. The simplest way to create one is an async generator `async function*`."
  see: [generator, await, iterable-protocol]
- id: byte
  term: byte
  name: { uk: "байт", en: "byte" }
  definition:
    uk: "Найменша порція даних, з якою працюють файли, мережа й пам’ять: 8 бітів, тобто ціле число від 0 до 255. Текст, зображення й відповідь сервера зрештою передаються як послідовність байтів."
    en: "The smallest portion of data that files, the network and memory work with: 8 bits, a whole number from 0 to 255. Text, images and a server's answer are in the end transferred as a sequence of bytes."
  see: [array-buffer, typed-array]
- id: array-buffer
  term: ArrayBuffer
  name: { uk: "ArrayBuffer", en: "ArrayBuffer" }
  definition:
    uk: "Шматок пам’яті фіксованого розміру в байтах: `new ArrayBuffer(8)` — 8 нульових байтів. Читати й писати його можна лише через «вікно» — typed array або `DataView`; кілька вікон на один буфер бачать ті самі байти."
    en: "A piece of memory of a fixed size in bytes: `new ArrayBuffer(8)` is 8 zero bytes. It can be read and written only through a “window” — a typed array or a `DataView`; several windows onto one buffer see the same bytes."
  see: [typed-array, data-view, byte]
- id: typed-array
  term: typed array
  name: { uk: "typed array (типізований масив)", en: "typed array" }
  aliases: ["Uint8Array", "Uint16Array", "Uint8ClampedArray"]
  definition:
    uk: "Вікно на `ArrayBuffer`, що читає байти як числа одного типу: `Uint8Array` — кожен байт як 0–255, `Uint16Array` — кожні два байти як 0–65535. На відміну від масиву, має фіксовану довжину (немає `push`), перетворює записані числа на свій тип (у `Uint8Array` 300 стає 44) і може ділити буфер з іншими вікнами. `slice()` дає копію на новому буфері, `subarray()` — ще одне вікно на той самий."
    en: "A window onto an `ArrayBuffer` that reads the bytes as numbers of one type: `Uint8Array` sees each byte as 0–255, `Uint16Array` every two bytes as 0–65535. Unlike an array it has a fixed length (no `push`), converts written numbers to its type (in a `Uint8Array` 300 becomes 44) and may share its buffer with other windows. `slice()` gives a copy on a new buffer, `subarray()` one more window onto the same one."
  see: [array-buffer, data-view, byte]
- id: data-view
  term: DataView
  name: { uk: "DataView", en: "DataView" }
  definition:
    uk: "Вікно на `ArrayBuffer`, яке читає й пише числа різного розміру з будь-якого місця буфера і дає вибрати порядок байтів: `view.setUint16(0, 258)` ставить старший байт першим, а `view.setUint16(0, 258, true)` — молодший. Потрібне для форматів файлів і протоколів, де порядок байтів задано."
    en: "A window onto an `ArrayBuffer` that reads and writes numbers of different sizes at any position of the buffer and lets you choose the byte order: `view.setUint16(0, 258)` puts the higher byte first, `view.setUint16(0, 258, true)` the lower one. Needed for file formats and protocols where the byte order is fixed."
  see: [array-buffer, typed-array]
- id: character-encoding
  term: character encoding
  name: { uk: "кодування символів", en: "character encoding" }
  aliases: ["encoding", "кодування"]
  definition:
    uk: "Правило, за яким символи тексту перетворюються на байти й назад. Те саме слово в різних кодуваннях — різні байти, тож читати байти треба тим кодуванням, яким їх записали. У вебі й JSON це майже завжди UTF-8."
    en: "The rule by which the characters of a text become bytes and back. The same word in different encodings is different bytes, so bytes must be read with the encoding they were written with. On the web and in JSON that is almost always UTF-8."
  see: [utf-8, mojibake, text-encoder]
- id: utf-8
  term: UTF-8
  name: { uk: "UTF-8", en: "UTF-8" }
  definition:
    uk: "Найпоширеніше кодування Unicode: латиниця й цифри займають 1 байт, кирилиця — 2, більшість емодзі — 4. Тому розмір тексту в байтах відрізняється від `length`: `\"Київ\"` має `length` 4, але 8 байтів."
    en: "The most common Unicode encoding: Latin letters and digits take 1 byte, Cyrillic 2, most emoji 4. So the size of a text in bytes differs from `length`: `\"Київ\"` has a `length` of 4 but 8 bytes."
  see: [character-encoding, text-encoder, byte]
- id: text-encoder
  term: TextEncoder / TextDecoder
  name: { uk: "TextEncoder і TextDecoder", en: "TextEncoder and TextDecoder" }
  aliases: ["TextEncoder", "TextDecoder"]
  definition:
    uk: "Вбудовані перетворювачі між текстом і байтами. `new TextEncoder().encode(text)` дає `Uint8Array` з байтами UTF-8; `new TextDecoder().decode(bytes)` — текст назад (можна вказати інше кодування, наприклад `\"windows-1251\"`). Незакінчену послідовність байтів декодер замінює на `�` (U+FFFD); щоб шматки, розрізані посеред символу, склеїлися правильно, один декодер отримує їх по черзі з `{ stream: true }`."
    en: "Built-in converters between text and bytes. `new TextEncoder().encode(text)` gives a `Uint8Array` of UTF-8 bytes; `new TextDecoder().decode(bytes)` gives the text back (another encoding can be named, for example `\"windows-1251\"`). The decoder replaces an unfinished byte sequence with `�` (U+FFFD); so that chunks cut in the middle of a character join correctly, one decoder receives them in turn with `{ stream: true }`."
  see: [utf-8, character-encoding, typed-array]
- id: mojibake
  term: mojibake
  name: { uk: "mojibake (кракозябри)", en: "mojibake" }
  definition:
    uk: "Нечитабельний текст, що виходить, коли правильні байти прочитано не тим кодуванням: «Київ» у UTF-8, прочитаний як `windows-1251`, стає `РљРёС—РІ`. На відміну від `�`, байти тут цілі — помилка в кодуванні, яким їх читають."
    en: "Unreadable text that appears when correct bytes are read with the wrong encoding: “Київ” in UTF-8 read as `windows-1251` becomes `РљРёС—РІ`. Unlike `�`, the bytes are intact here — the mistake is in the encoding used to read them."
  see: [character-encoding, utf-8]
- id: allocation
  term: allocation
  name: { uk: "виділення пам’яті", en: "allocation" }
  aliases: ["memory allocation", "алокація"]
  definition:
    uk: "Місце в пам’яті, яке програма займає щоразу, коли створює об’єкт, масив, текст чи функцію (зокрема замикання). Звільняє його збирач сміття — лише тоді, коли об’єкт став недосяжним."
    en: "The space in memory a program takes every time it creates an object, array, text or function (including a closure). The garbage collector frees it — only once the object has become unreachable."
  see: [garbage-collection, retained-reference]
- id: retained-reference
  term: retained reference
  name: { uk: "утримуване посилання", en: "retained reference" }
  aliases: ["retained", "утримуваний"]
  definition:
    uk: "Посилання, що тримає об’єкт досяжним, хоча програмі він уже не потрібен: забутий listener чи таймер, що замикає великий масив; кеш, який лише росте; змінна модуля, що досі вказує на прибраний зі сторінки елемент. Поки таке посилання є, збирач сміття об’єкт не звільнить."
    en: "A reference that keeps an object reachable although the program no longer needs it: a forgotten listener or timer closing over a large array; a cache that only grows; a module variable still pointing at an element removed from the page. While such a reference exists, the garbage collector will not free the object."
  see: [gc-root, reachability, memory-leak]
- id: gc-root
  term: GC root
  name: { uk: "корінь (для збирача сміття)", en: "GC root" }
  aliases: ["root", "roots", "корені"]
  definition:
    uk: "Місце, від якого збирач сміття починає шукати досяжні об’єкти: глобальний об’єкт `window`, змінні модулів, змінні функцій, що зараз виконуються, а також функції, які тримає браузер, — зареєстровані listeners і таймери, що ще чекають. Усе, до чого від кореня веде ланцюжок посилань, живе."
    en: "A place from which the garbage collector starts looking for reachable objects: the global object `window`, module variables, the variables of functions running right now, and the functions the browser holds — registered listeners and timers still waiting. Everything a chain of references leads to from a root stays alive."
  see: [garbage-collection, reachability, retained-reference]
- id: teardown
  term: teardown
  name: { uk: "teardown (функція прибирання)", en: "teardown" }
  aliases: ["teardown()", "прибирання"]
  definition:
    uk: "Функція, яку повертає код, що щось «увімкнув» (`mount`), і яка все це вимикає: знімає listeners, зупиняє таймери, скасовує запити, прибирає елементи. Кожне «увімкнув» у `mount` має пару в `teardown`, бо `element.remove()` не зупиняє того, що тримає браузер."
    en: "A function returned by code that “switched something on” (`mount`), which switches all of it off: removes listeners, stops timers, aborts requests, removes elements. Every “switch on” in `mount` has a partner in `teardown`, because `element.remove()` does not stop what the browser holds."
  see: [listener-cleanup, idempotent-cleanup, resource-handle]
  example:
    code: "function mount(root) {\n  const controller = new AbortController();\n  window.addEventListener(\"resize\", update, { signal: controller.signal });\n  const id = setInterval(refresh, 1000);\n  return function teardown() {\n    controller.abort();\n    clearInterval(id);\n  };\n}"
- id: idempotent-cleanup
  term: idempotent cleanup
  name: { uk: "ідемпотентне прибирання", en: "idempotent cleanup" }
  aliases: ["idempotent", "ідемпотентний"]
  definition:
    uk: "Прибирання, яке можна викликати скільки завгодно разів із тим самим результатом, що й один раз. Зазвичай його роблять прапорцем у замиканні: перший виклик ставить прапорець і прибирає, наступні одразу виходять — і не зачіпають того, що з’явилося пізніше."
    en: "Cleanup that can be called any number of times with the same result as once. It is usually made with a flag in the closure: the first call sets the flag and cleans up, later calls leave at once — and do not touch what appeared later."
  see: [teardown]
- id: resource-handle
  term: resource handle
  name: { uk: "дескриптор ресурсу", en: "resource handle" }
  aliases: ["handle", "дескриптор"]
  definition:
    uk: "Значення, за яким потім вимикають запущене: номер від `setTimeout`/`setInterval` для `clearTimeout`/`clearInterval`, `AbortController` для `abort()`, функція-listener для `removeEventListener`. Хто не зберіг дескриптор, той уже не вимкне ресурс."
    en: "The value used later to switch off what was started: the id from `setTimeout`/`setInterval` for `clearTimeout`/`clearInterval`, an `AbortController` for `abort()`, the listener function for `removeEventListener`. Whoever did not keep the handle can no longer switch the resource off."
  see: [teardown, abort-controller]
- id: memory-leak
  term: memory leak
  name: { uk: "витік пам’яті", en: "memory leak" }
  aliases: ["leak", "витік"]
  definition:
    uk: "Пам’ять, яка росте з кожним повтором дії, що мала б повністю прибирати за собою: відкрив і закрив діалог 20 разів — і 20 закритих діалогів досі утримано. Один стрибок пам’яті — ще не витік; доказ — ріст, пропорційний кількості повторів. Витік рідко валить сторінку одразу: вона повільно гальмує."
    en: "Memory that grows with every repetition of an action that should clean up after itself completely: you opened and closed a dialog 20 times — and 20 closed dialogs are still retained. One jump in memory is not yet a leak; the proof is growth proportional to the number of repetitions. A leak rarely crashes a page at once: it slowly gets slower."
  see: [retained-reference, heap-snapshot, retainer-path]
- id: heap-snapshot
  term: heap snapshot
  name: { uk: "heap snapshot (знімок пам’яті)", en: "heap snapshot" }
  definition:
    uk: "Знімок усіх досяжних об’єктів у пам’яті сторінки, який робить панель Memory у DevTools (перед знімком вона запускає збирач сміття). Порівнюючи знімок до й після серії повторів, бачать, яких об’єктів побільшало."
    en: "A picture of all reachable objects in a page's memory, taken by the Memory panel of DevTools (it runs the garbage collector before taking it). Comparing a snapshot before and after a series of repetitions shows which objects increased."
  see: [memory-leak, retainer-path, detached-dom-node]
- id: retainer-path
  term: retainer path
  name: { uk: "шлях утримання", en: "retainer path" }
  aliases: ["retainers", "Retainers"]
  definition:
    uk: "Ланцюжок посилань від об’єкта назад до кореня, через який об’єкт лишається досяжним. У DevTools його показує панель Retainers для вибраного об’єкта; першою знайомою назвою в ньому зазвичай є змінна чи масив, яким бракує прибирання."
    en: "The chain of references from an object back to a root through which the object stays reachable. In DevTools the Retainers pane shows it for the selected object; the first familiar name in it is usually the variable or array that lacks cleanup."
  see: [gc-root, heap-snapshot]
- id: detached-dom-node
  term: detached DOM node
  name: { uk: "від’єднаний елемент DOM", en: "detached DOM node" }
  aliases: ["detached element", "Detached"]
  definition:
    uk: "Елемент, якого вже немає на сторінці (його прибрали з дерева DOM), але на який досі вказує змінна, масив чи замикання. Тому збирач сміття не може його звільнити. У знімку пам’яті Chrome такі елементи шукають за словом `Detached`."
    en: "An element that is no longer on the page (it was removed from the DOM tree) but that a variable, an array or a closure still points to. So the garbage collector cannot free it. In a Chrome heap snapshot such elements are found by the word `Detached`."
  see: [memory-leak, retained-reference]
- id: module-evaluation-order
  term: module evaluation order
  name: { uk: "порядок виконання модулів", en: "module evaluation order" }
  definition:
    uk: "Порядок, у якому браузер виконує ES-модулі після завантаження всього графа: спершу все, що модуль імпортує (глибина першою), потім сам модуль. Якщо імпорт веде до модуля, який уже в роботі (цикл), браузер не повертається до нього — і модуль із циклу може виконатися раніше за той, чиє значення читає: читання `export const` на верхньому рівні тоді кидає `ReferenceError`."
    en: "The order in which the browser runs ES modules after loading the whole graph: first everything a module imports (depth first), then the module itself. If an import leads to a module already in progress (a cycle), the browser does not go back to it — so a module in the cycle may run before the one whose value it reads: reading an `export const` at the top level then throws a `ReferenceError`."
  see: [circular-dependency, module-graph, temporal-dead-zone]
