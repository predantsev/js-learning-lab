# Terms introduced in JS-06. One file per unit keeps parallel authoring conflict-free.
- id: form
  term: form
  name: { uk: "форма", en: "form" }
  definition:
    uk: "Елемент `<form>` із полями, через які людина вводить дані, і кнопкою, що їх надсилає. Значення кожного поля йде з формою під ключем з його атрибута `name`."
    en: "A `<form>` element with fields through which a person enters data, and a button that submits it. Each field’s value travels with the form under the key from its `name` attribute."
  see: [label, constraint-validation]
  example:
    lang: html
    code: "<form>\n  <label for=\"title\">Task title</label>\n  <input id=\"title\" name=\"title\">\n  <button>Save</button>\n</form>"
- id: label
  term: label
  name: { uk: "підпис поля", en: "label" }
  definition:
    uk: "Елемент `<label>` — видимий текст, що називає поле. Його зв’язують із полем через однакові `for` і `id` або обгортанням. Клік по зв’язаному підпису ставить курсор у поле, а програма екранного читання оголошує його текст як ім’я поля."
    en: "The `<label>` element — visible text that names a field. It is connected to the field through matching `for` and `id` values or by wrapping. Clicking a connected label puts the cursor into the field, and a screen reader announces its text as the field’s name."
  see: [accessible-name]
  example:
    lang: html
    code: "<label for=\"price\">Price, UAH</label>\n<input id=\"price\" type=\"number\">\n\n<label><input type=\"checkbox\"> Already acquired</label>"
- id: accessible-name
  term: accessible name
  name: { uk: "доступне ім’я", en: "accessible name" }
  definition:
    uk: "Ім’я елемента, яке браузер передає програмам екранного читання та іншим допоміжним технологіям. У поля воно береться з підпису, у кнопки й посилання — з їхнього тексту, у зображення — з `alt`."
    en: "The name of an element that the browser passes to screen readers and other assistive technologies. A field takes it from its label, a button or link from its text, an image from its `alt`."
  aliases: ["доступна назва"]
  see: [label, accessibility-tree]
- id: constraint-validation
  term: constraint validation
  name: { uk: "вбудована валідація", en: "built-in validation" }
  definition:
    uk: "Перевірки, які браузер виконує сам перед надсиланням форми за атрибутами полів: `required`, `type`, `min`, `max`, `maxlength`. Порушене правило зупиняє надсилання й показує повідомлення біля поля. Перевірки в коді вона не замінює."
    en: "Checks the browser runs by itself before a form is submitted, based on field attributes: `required`, `type`, `min`, `max`, `maxlength`. A broken rule stops the submission and shows a message next to the field. It does not replace checks in code."
  aliases: ["built-in validation", "HTML validation"]
  example:
    lang: html
    code: "<input name=\"name\" required maxlength=\"80\">\n<input name=\"price\" type=\"number\" min=\"0\">"
- id: inline-validation
  term: inline validation
  name: { uk: "валідація біля поля", en: "inline validation" }
  definition:
    uk: "Спосіб показувати помилку чи підказку просто біля поля, якого вона стосується, і зв’язувати її з полем через `aria-describedby`, щоб програма екранного читання прочитала її разом з іменем поля."
    en: "Showing an error or hint right next to the field it concerns and connecting it to the field with `aria-describedby`, so that a screen reader reads it together with the field’s name."
  example:
    lang: html
    code: "<input id=\"name\" aria-describedby=\"name-error\">\n<p id=\"name-error\">Enter a name.</p>"
- id: keyboard-focus
  term: focus
  name: { uk: "фокус клавіатури", en: "keyboard focus" }
  definition:
    uk: "Позначка того, який елемент зараз отримує натискання клавіш. Tab переносить фокус на наступний фокусований елемент, Shift+Tab — на попередній; Enter і Пробіл діють на елемент у фокусі."
    en: "The marker of which element currently receives key presses. Tab moves the focus to the next focusable element, Shift+Tab to the previous one; Enter and Space act on the focused element."
  aliases: ["focus", "фокус"]
  see: [tab-order, focus-indicator]
- id: tab-order
  term: tab order
  name: { uk: "порядок Tab", en: "tab order" }
  definition:
    uk: "Послідовність, у якій Tab обходить фокусовані елементи: посилання з `href`, кнопки, поля форми. Вона збігається з порядком елементів у HTML; CSS, що переставляє їх на екрані, її не змінює, а додатний `tabindex` ламає."
    en: "The sequence in which Tab visits focusable elements: links with `href`, buttons, form fields. It follows the order of the elements in the HTML; CSS that moves them on screen does not change it, and a positive `tabindex` breaks it."
  see: [keyboard-focus]
- id: focus-indicator
  term: focus indicator
  name: { uk: "індикатор фокусу", en: "focus indicator" }
  definition:
    uk: "Видима позначка елемента у фокусі — зазвичай рамка `outline`. Без неї людина з клавіатурою не бачить, де вона. Змінювати її можна (через `:focus-visible`), вимикати — ні."
    en: "The visible mark on the focused element — usually an `outline` frame. Without it a keyboard user cannot see where they are. You may restyle it (through `:focus-visible`), but never remove it."
  example:
    lang: css
    code: "button:focus-visible {\n  outline: 3px solid #d9480f;\n  outline-offset: 2px;\n}"
- id: accessibility-tree
  term: accessibility tree
  name: { uk: "дерево доступності", en: "accessibility tree" }
  definition:
    uk: "Дерево, яке браузер будує з HTML для допоміжних технологій: для кожного важливого елемента — роль (кнопка, посилання, заголовок, орієнтир), ім’я та стан. Його можна подивитися в інструментах розробника на вкладці Accessibility."
    en: "The tree the browser builds from the HTML for assistive technologies: a role (button, link, heading, landmark), a name and a state for every important element. You can see it in the developer tools on the Accessibility tab."
  see: [accessible-name, landmark]
- id: cascade
  term: cascade
  name: { uk: "каскад", en: "cascade" }
  definition:
    uk: "Спосіб, яким браузер обирає одне значення, коли кілька правил задають елементові ту саму властивість. Для правил одного файлу стилів спершу порівнюється специфічність селекторів, а за рівної специфічності перемагає правило, записане нижче. Оголошення з `!important` стоїть над усіма звичайними."
    en: "The way the browser picks one value when several rules give an element the same property. For the rules of one stylesheet, the specificity of the selectors is compared first, and with equal specificity the rule written lower wins. A declaration with `!important` stands above all normal ones."
  see: [specificity, css-inheritance]
- id: specificity
  term: specificity
  name: { uk: "специфічність", en: "specificity" }
  definition:
    uk: "Міра того, наскільки точно селектор вказує на елемент. Рахується трьома числами — id · класи · теги — і порівнюється зліва направо: один id переважає будь-яку кількість класів, один клас — будь-яку кількість тегів."
    en: "A measure of how precisely a selector points at an element. It is counted as three numbers — ids · classes · tags — and compared from left to right: one id beats any number of classes, one class beats any number of tags."
  see: [cascade]
  example:
    lang: css
    code: "button { }        /* 0,0,1 */\n.btn-primary { }  /* 0,1,0 */\nmain .btn { }     /* 0,1,1 */\n#save { }         /* 1,0,0 */"
- id: css-inheritance
  term: inheritance
  name: { uk: "успадкування (CSS)", en: "inheritance (CSS)" }
  definition:
    uk: "Передавання значення властивості від батьківського елемента дочірньому, якщо жодне правило не задає дочірньому цієї властивості. Успадковуються властивості тексту (`color`, `font-family`, `font-size`, `line-height`, `text-align`), а рамки, відступи й тло — ні."
    en: "Passing a property’s value from a parent element to a child when no rule gives the child that property. Text properties are inherited (`color`, `font-family`, `font-size`, `line-height`, `text-align`); borders, spacing and backgrounds are not."
  aliases: ["CSS inheritance", "успадкування"]
  see: [cascade]
- id: computed-style
  term: computed style
  name: { uk: "обчислений стиль", en: "computed style" }
  definition:
    uk: "Остаточні значення всіх властивостей елемента після каскаду й успадкування. Його показує вкладка Computed в інструментах розробника, а в коді — `getComputedStyle(element)`."
    en: "The final values of all of an element’s properties after the cascade and inheritance. The Computed tab of the developer tools shows it, and code reads it with `getComputedStyle(element)`."
  example:
    code: "getComputedStyle(document.querySelector(\"h1\")).color; // \"rgb(0, 128, 128)\""
