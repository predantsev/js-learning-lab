# Terms introduced in JS-06. One file per unit keeps parallel authoring conflict-free.
- id: form
  term: form
  name: { uk: "форма", en: "form" }
  definition:
    uk: "Елемент `<form>` із полями, через які людина вводить дані, і кнопкою, що їх надсилає. Значення кожного поля йде з формою під ключем з його атрибута `name`."
    en: "A `<form>` element with fields through which a person enters data, and a button that submits it. Each field’s value travels with the form under the key from its `name` attribute."
  see: [label, constraint-validation]
  example:
    lang: html
    code: "<form>\n  <label for=\"title\">Task title</label>\n  <input id=\"title\" name=\"title\">\n  <button>Save</button>\n</form>"
- id: label
  term: label
  name: { uk: "підпис поля", en: "label" }
  definition:
    uk: "Елемент `<label>` — видимий текст, що називає поле. Його зв’язують із полем через однакові `for` і `id` або обгортанням. Клік по зв’язаному підпису ставить курсор у поле, а програма екранного читання оголошує його текст як ім’я поля."
    en: "The `<label>` element — visible text that names a field. It is connected to the field through matching `for` and `id` values or by wrapping. Clicking a connected label puts the cursor into the field, and a screen reader announces its text as the field’s name."
  see: [accessible-name]
  example:
    lang: html
    code: "<label for=\"due\">Due date</label>\n<input id=\"due\" type=\"date\">\n\n<label><input type=\"checkbox\" name=\"daily\"> Every day</label>"
- id: accessible-name
  term: accessible name
  name: { uk: "доступне ім’я", en: "accessible name" }
  definition:
    uk: "Ім’я елемента, яке браузер передає програмам екранного читання та іншим допоміжним технологіям. У поля воно береться з підпису, у кнопки й посилання — з їхнього тексту, у зображення — з `alt`."
    en: "The name of an element that the browser passes to screen readers and other assistive technologies. A field takes it from its label, a button or link from its text, an image from its `alt`."
  aliases: ["доступна назва"]
  see: [label, accessibility-tree]
- id: constraint-validation
  term: constraint validation
  name: { uk: "вбудована валідація", en: "built-in validation" }
  definition:
    uk: "Перевірки, які браузер виконує сам перед надсиланням форми за атрибутами полів: `required`, `type`, `min`, `max`, `maxlength`. Порушене правило зупиняє надсилання й показує повідомлення біля поля. Перевірки в коді вона не замінює."
    en: "Checks the browser runs by itself before a form is submitted, based on field attributes: `required`, `type`, `min`, `max`, `maxlength`. A broken rule stops the submission and shows a message next to the field. It does not replace checks in code."
  aliases: ["built-in validation", "HTML validation"]
  example:
    lang: html
    code: "<input name=\"title\" required maxlength=\"60\">\n<input name=\"minutes\" type=\"number\" min=\"1\" max=\"240\">"
- id: inline-validation
  term: inline validation
  name: { uk: "валідація біля поля", en: "inline validation" }
  definition:
    uk: "Спосіб показувати помилку чи підказку просто біля поля, якого вона стосується, і зв’язувати її з полем через `aria-describedby`, щоб програма екранного читання прочитала її разом з іменем поля."
    en: "Showing an error or hint right next to the field it concerns and connecting it to the field with `aria-describedby`, so that a screen reader reads it together with the field’s name."
  example:
    lang: html
    code: "<input id=\"name\" aria-describedby=\"name-error\">\n<p id=\"name-error\">Enter a name.</p>"
- id: keyboard-focus
  term: focus
  name: { uk: "фокус клавіатури", en: "keyboard focus" }
  definition:
    uk: "Позначка того, який елемент зараз отримує натискання клавіш. Tab переносить фокус на наступний фокусований елемент, Shift+Tab — на попередній; Enter і Пробіл діють на елемент у фокусі."
    en: "The marker of which element currently receives key presses. Tab moves the focus to the next focusable element, Shift+Tab to the previous one; Enter and Space act on the focused element."
  aliases: ["focus", "фокус"]
  see: [tab-order, focus-indicator]
- id: tab-order
  term: tab order
  name: { uk: "порядок Tab", en: "tab order" }
  definition:
    uk: "Послідовність, у якій Tab обходить фокусовані елементи: посилання з `href`, кнопки, поля форми. Вона збігається з порядком елементів у HTML; CSS, що переставляє їх на екрані, її не змінює, а додатний `tabindex` ламає."
    en: "The sequence in which Tab visits focusable elements: links with `href`, buttons, form fields. It follows the order of the elements in the HTML; CSS that moves them on screen does not change it, and a positive `tabindex` breaks it."
  see: [keyboard-focus]
- id: focus-indicator
  term: focus indicator
  name: { uk: "індикатор фокусу", en: "focus indicator" }
  definition:
    uk: "Видима позначка елемента у фокусі — зазвичай рамка `outline`. Без неї людина з клавіатурою не бачить, де вона. Змінювати її можна (через `:focus-visible`), вимикати — ні."
    en: "The visible mark on the focused element — usually an `outline` frame. Without it a keyboard user cannot see where they are. You may restyle it (through `:focus-visible`), but never remove it."
  example:
    lang: css
    code: "input:focus-visible {\n  outline: 2px dashed navy;\n}"
- id: accessibility-tree
  term: accessibility tree
  name: { uk: "дерево доступності", en: "accessibility tree" }
  definition:
    uk: "Дерево, яке браузер будує з HTML для допоміжних технологій: для кожного важливого елемента — роль (кнопка, посилання, заголовок, орієнтир), ім’я та стан. Його можна подивитися в інструментах розробника на вкладці Accessibility."
    en: "The tree the browser builds from the HTML for assistive technologies: a role (button, link, heading, landmark), a name and a state for every important element. You can see it in the developer tools on the Accessibility tab."
  see: [accessible-name, landmark]
- id: cascade
  term: cascade
  name: { uk: "каскад", en: "cascade" }
  definition:
    uk: "Спосіб, яким браузер обирає одне значення, коли кілька правил задають елементові ту саму властивість. Для правил одного файлу стилів спершу порівнюється специфічність селекторів, а за рівної специфічності перемагає правило, записане нижче. Оголошення з `!important` стоїть над усіма звичайними."
    en: "The way the browser picks one value when several rules give an element the same property. For the rules of one stylesheet, the specificity of the selectors is compared first, and with equal specificity the rule written lower wins. A declaration with `!important` stands above all normal ones."
  see: [specificity, css-inheritance]
- id: specificity
  term: specificity
  name: { uk: "специфічність", en: "specificity" }
  definition:
    uk: "Міра того, наскільки точно селектор вказує на елемент. Рахується трьома числами — id · класи · теги — і порівнюється зліва направо: один id переважає будь-яку кількість класів, один клас — будь-яку кількість тегів."
    en: "A measure of how precisely a selector points at an element. It is counted as three numbers — ids · classes · tags — and compared from left to right: one id beats any number of classes, one class beats any number of tags."
  see: [cascade]
  example:
    lang: css
    code: "button { }        /* 0,0,1 */\n.btn-primary { }  /* 0,1,0 */\nmain .btn { }     /* 0,1,1 */\n#save { }         /* 1,0,0 */"
- id: css-inheritance
  term: inheritance
  name: { uk: "успадкування (CSS)", en: "inheritance (CSS)" }
  definition:
    uk: "Передавання значення властивості від батьківського елемента дочірньому, якщо жодне правило не задає дочірньому цієї властивості. Успадковуються властивості тексту (`color`, `font-family`, `font-size`, `line-height`, `text-align`), а рамки, відступи й тло — ні."
    en: "Passing a property’s value from a parent element to a child when no rule gives the child that property. Text properties are inherited (`color`, `font-family`, `font-size`, `line-height`, `text-align`); borders, spacing and backgrounds are not."
  aliases: ["CSS inheritance", "успадкування"]
  see: [cascade]
- id: computed-style
  term: computed style
  name: { uk: "обчислений стиль", en: "computed style" }
  definition:
    uk: "Остаточні значення всіх властивостей елемента після каскаду й успадкування. Його показує вкладка Computed в інструментах розробника, а в коді — `getComputedStyle(element)`."
    en: "The final values of all of an element’s properties after the cascade and inheritance. The Computed tab of the developer tools shows it, and code reads it with `getComputedStyle(element)`."
  example:
    code: "getComputedStyle(document.querySelector(\"h1\")).color; // \"rgb(0, 128, 128)\""
- id: box-model
  term: box model
  name: { uk: "блокова модель", en: "box model" }
  definition:
    uk: "Те, як браузер бачить кожен елемент: прямокутник із чотирьох шарів — вміст, внутрішній відступ (`padding`), рамка (`border`) і зовнішній відступ (`margin`)."
    en: "How the browser sees every element: a rectangle of four layers — the content, the inner spacing (`padding`), the frame (`border`) and the outer spacing (`margin`)."
  see: [padding, margin, box-sizing]
- id: padding
  term: padding
  name: { uk: "внутрішній відступ (padding)", en: "padding" }
  definition:
    uk: "Простір між вмістом елемента і його рамкою. Він має тло самого елемента. Задається властивістю `padding` — одним значенням для всіх боків або окремо для кожного."
    en: "The space between an element’s content and its border. It shows the element’s own background. It is set with the `padding` property — one value for all sides or one per side."
  example:
    lang: css
    code: ".note {\n  padding: 6px 10px; /* top and bottom 6px, left and right 10px */\n}"
- id: margin
  term: margin
  name: { uk: "зовнішній відступ (margin)", en: "margin" }
  definition:
    uk: "Прозорий простір довкола рамки елемента, який відсуває сусідні елементи. До ширини елемента не входить. Вертикальні margin сусідніх блоків можуть зливатися."
    en: "The transparent space around an element’s border that pushes neighboring elements away. It is not part of the element’s width. Vertical margins of neighboring blocks can collapse."
  see: [margin-collapse]
- id: box-sizing
  term: box-sizing
  name: { uk: "box-sizing", en: "box-sizing" }
  definition:
    uk: "Властивість, яка вирішує, що означає `width`. За `content-box` (типове значення) — лише ширину вмісту, а `padding` і `border` додаються зверху. За `border-box` — ширину до рамки включно, тож елемент займає рівно `width`."
    en: "The property that decides what `width` means. Under `content-box` (the default) it is only the width of the content, and `padding` and `border` are added on top. Under `border-box` it is the width up to and including the border, so the element takes exactly `width`."
  example:
    lang: css
    code: ".note {\n  box-sizing: border-box;\n  width: 200px;\n  padding: 10px;\n} /* 200px on screen, 180px of content */"
- id: margin-collapse
  term: margin collapse
  name: { uk: "злиття відступів", en: "margin collapse" }
  definition:
    uk: "Правило, за яким вертикальні `margin` двох блоків, що стоять один під одним, зливаються в один — більший із двох, а не додаються. Горизонтальних margin, padding і рамок це не стосується, як і елементів усередині flex- чи grid-контейнера."
    en: "The rule by which the vertical `margin`s of two blocks stacked on top of each other merge into one — the larger of the two — instead of adding up. It does not apply to horizontal margins, padding or borders, nor to items inside a flex or grid container."
- id: flexbox
  term: Flexbox
  name: { uk: "Flexbox", en: "Flexbox" }
  definition:
    uk: "Спосіб розкладки, що вмикається через `display: flex`: прямі дочірні елементи контейнера шикуються в один ряд або стовпчик уздовж головної осі. Підходить для одного напрямку: ряд кнопок, рядок форми, шапка."
    en: "A layout method switched on with `display: flex`: the container’s direct children line up in one row or column along the main axis. It suits one direction: a row of buttons, a form row, a header."
  aliases: ["flex layout", "flex"]
  see: [main-axis, cross-axis, css-grid]
  example:
    lang: css
    code: ".toolbar {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n}"
- id: css-grid
  term: Grid
  name: { uk: "Grid (сітка)", en: "CSS Grid" }
  definition:
    uk: "Спосіб розкладки, що вмикається через `display: grid`: елементи займають клітинки сітки з рядків і стовпців одночасно. Підходить для двох напрямків: сітка карток, ділянки сторінки."
    en: "A layout method switched on with `display: grid`: items take the cells of a grid of rows and columns at the same time. It suits two directions: a grid of cards, regions of a page."
  aliases: ["CSS Grid", "сітка"]
  see: [grid-track, flexbox]
  example:
    lang: css
    code: ".gallery {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 4px;\n}"
- id: main-axis
  term: main axis
  name: { uk: "головна вісь", en: "main axis" }
  definition:
    uk: "Напрямок, у якому flex-контейнер шикує свої елементи: зліва направо для `flex-direction: row`, згори донизу для `column`. `justify-content` розподіляє елементи саме вздовж неї."
    en: "The direction in which a flex container lines up its items: left to right for `flex-direction: row`, top to bottom for `column`. `justify-content` distributes the items along it."
  see: [cross-axis, flexbox]
- id: cross-axis
  term: cross axis
  name: { uk: "поперечна вісь", en: "cross axis" }
  definition:
    uk: "Напрямок, що перетинає головну вісь flex-контейнера: вертикальний для ряду, горизонтальний для стовпчика. `align-items` вирівнює елементи вздовж неї."
    en: "The direction that crosses a flex container’s main axis: vertical for a row, horizontal for a column. `align-items` aligns the items along it."
  see: [main-axis]
- id: grid-track
  term: grid track
  name: { uk: "доріжка сітки", en: "grid track" }
  definition:
    uk: "Один стовпець або один рядок сітки Grid. Стовпці описує `grid-template-columns`: наприклад, `repeat(auto-fill, minmax(120px, 1fr))` створює стільки доріжок щонайменше по 120px, скільки вміщається."
    en: "One column or one row of a grid. `grid-template-columns` describes the columns: for example, `repeat(auto-fill, minmax(120px, 1fr))` creates as many tracks of at least 120px as fit."
  aliases: ["track"]
  see: [css-grid]
- id: custom-property
  term: custom property
  name: { uk: "користувацька властивість", en: "custom property" }
  definition:
    uk: "Іменоване значення в CSS: назва з двома дефісами на початку, наприклад `--gap-m: 1rem;`, а використання — через `var(--gap-m)`. Успадковується, як `color`: значення діє на елемент, де його задано, і на всіх його нащадків."
    en: "A named value in CSS: a name starting with two hyphens, such as `--gap-m: 1rem;`, used through `var(--gap-m)`. It is inherited like `color`: the value applies to the element where it is set and to all its descendants."
  aliases: ["CSS variable", "CSS-змінна"]
  see: [design-token]
  example:
    lang: css
    code: ":root {\n  --gap-m: 1rem;\n}\n.panel {\n  padding: var(--gap-m);\n}"
- id: design-token
  term: design token
  name: { uk: "дизайн-токен", en: "design token" }
  definition:
    uk: "Іменоване рішення дизайну — відступ, розмір шрифту, колір, заокруглення, — записане один раз і використане скрізь. У CSS токени зазвичай живуть як користувацькі властивості в `:root`."
    en: "A named design decision — a spacing, a font size, a color, a corner radius — written once and used everywhere. In CSS, tokens usually live as custom properties in `:root`."
  aliases: ["token", "токен"]
  see: [custom-property, type-scale]
- id: rem-unit
  term: rem
  name: { uk: "rem", en: "rem" }
  definition:
    uk: "Одиниця розміру, що дорівнює розміру шрифту кореня сторінки (`<html>`), типово 16px. Усе, що задано в `rem`, росте, коли людина збільшує базовий шрифт у браузері."
    en: "A unit of size equal to the font size of the page root (`<html>`), 16px by default. Everything set in `rem` grows when a person raises the base font size in the browser."
  example:
    lang: css
    code: ".lead {\n  font-size: 1.25rem; /* 20px while the root font size is 16px */\n}"
- id: type-scale
  term: type scale
  name: { uk: "шкала шрифтів", en: "type scale" }
  definition:
    uk: "Невеликий набір розмірів шрифту, з якого беруть усі розміри на сторінці, наприклад `0.875rem`, `1rem`, `1.5rem`, `2rem`. Шкала робить заголовки й текст узгодженими й спрощує зміни."
    en: "A small set of font sizes that every size on the page is taken from, for example `0.875rem`, `1rem`, `1.5rem`, `2rem`. A scale keeps headings and text consistent and makes changes simple."
  see: [design-token, rem-unit]
- id: media-query
  term: media query
  name: { uk: "медіазапит", en: "media query" }
  definition:
    uk: "Блок `@media (умова) { … }` у CSS: правила всередині діють лише тоді, коли умова справджується, — наприклад, коли вікно має щонайменше 40rem завширшки або коли людина попросила зменшити рух."
    en: "An `@media (condition) { … }` block in CSS: the rules inside apply only while the condition holds — for example, while the window is at least 40rem wide or while the person asked to reduce motion."
  see: [responsive-breakpoint, viewport]
  example:
    lang: css
    code: "@media (min-width: 48rem) {\n  .menu {\n    display: flex;\n  }\n}"
- id: viewport
  term: viewport
  name: { uk: "вікно перегляду", en: "viewport" }
  definition:
    uk: "Видима частина сторінки у вікні браузера чи на екрані телефона. Її ширину в CSS-пікселях бачать медіазапити; масштаб 200% удвічі зменшує цю ширину."
    en: "The visible part of the page in a browser window or on a phone screen. Media queries see its width in CSS pixels; 200% zoom halves that width."
  see: [media-query]
- id: overflow
  term: overflow
  name: { uk: "переповнення", en: "overflow" }
  definition:
    uk: "Ситуація, коли вміст не вміщається у свій блок і вилазить за нього: довге слово без пробілів, фіксована ширина чи висота. Горизонтальне переповнення сторінки дає небажану прокрутку вбік."
    en: "A situation where content does not fit into its box and sticks out of it: a long word without spaces, a fixed width or height. Horizontal overflow of a page causes unwanted sideways scrolling."
  example:
    lang: css
    code: ".url {\n  overflow-wrap: anywhere; /* a long word may break */\n}\n.table-wrap {\n  overflow-x: auto; /* a wide table scrolls inside its box */\n}"
- id: responsive-breakpoint
  term: breakpoint
  name: { uk: "точка перелому", en: "breakpoint" }
  definition:
    uk: "Ширина вікна, на якій медіазапит змінює розкладку сторінки, наприклад 40rem. Її обирають там, де вмістові стає тісно, а не під конкретний пристрій."
    en: "The window width at which a media query changes the page layout, for example 40rem. It is chosen where the content starts to feel cramped, not for a particular device."
  aliases: ["breakpoint", "брейкпойнт"]
  see: [media-query]
- id: reduced-motion
  term: prefers-reduced-motion
  name: { uk: "зменшений рух", en: "reduced motion" }
  definition:
    uk: "Налаштування системи для людей, яким рух на екрані шкодить (запаморочення, нудота). CSS бачить його через `@media (prefers-reduced-motion: reduce)`, і всередині цього медіазапиту анімації вимикають."
    en: "A system setting for people whom on-screen motion harms (dizziness, nausea). CSS sees it through `@media (prefers-reduced-motion: reduce)`, and animations are switched off inside that media query."
  example:
    lang: css
    code: "@media (prefers-reduced-motion: reduce) {\n  .banner {\n    animation: none;\n  }\n}"
- id: dom
  term: DOM
  name: { uk: "DOM", en: "DOM" }
  definition:
    uk: "Document Object Model — дерево об’єктів, яке браузер будує з HTML-сторінки. Екран показує саме DOM; JavaScript змінює його через об’єкт `document`, а файл HTML при цьому не змінюється."
    en: "Document Object Model — the tree of objects the browser builds from an HTML page. The screen shows the DOM; JavaScript changes it through the `document` object, and the HTML file does not change."
  see: [dom-tree, dom-node, query-selector]
- id: dom-tree
  term: DOM tree
  name: { uk: "дерево DOM", en: "DOM tree" }
  definition:
    uk: "Будова DOM: кожен вузол лежить усередині свого батька, як елементи в HTML. Корінь — `document`, далі `<html>`, `<body>` і все, що в них вкладено."
    en: "The structure of the DOM: every node lies inside its parent, like the elements in HTML. The root is `document`, then `<html>`, `<body>` and everything nested in them."
  see: [dom]
- id: dom-node
  term: node
  name: { uk: "вузол DOM", en: "DOM node" }
  definition:
    uk: "Один об’єкт у дереві DOM — найчастіше елемент, як `<li>` чи `<p>`. У вузла є властивості (`textContent`, `className`) і методи (`append`, `remove`)."
    en: "One object in the DOM tree — most often an element such as `<li>` or `<p>`. A node has properties (`textContent`, `className`) and methods (`append`, `remove`)."
  aliases: ["node", "вузол"]
  example:
    code: "const item = document.createElement(\"li\");\nitem.textContent = \"Water the plants\";\nlist.append(item);"
- id: query-selector
  term: querySelector
  name: { uk: "querySelector", en: "querySelector" }
  definition:
    uk: "Метод, що знаходить у DOM перший вузол за CSS-селектором або повертає `null`, якщо такого немає. `querySelectorAll` повертає знімок усіх знайдених вузлів: пізніші зміни сторінки його не оновлюють."
    en: "A method that finds the first DOM node matching a CSS selector, or returns `null` if there is none. `querySelectorAll` returns a snapshot of all the nodes found: later changes to the page do not update it."
  example:
    code: "const list = document.querySelector(\"#habits\");\nconst items = list.querySelectorAll(\"li\");\nconsole.log(items.length);"
- id: text-content
  term: textContent
  name: { uk: "textContent", en: "textContent" }
  definition:
    uk: "Властивість вузла DOM з усім його текстом. Читання дає текст без розмітки; присвоєння замінює весь вміст вузла символами рядка як є — теги в рядку лишаються звичайними знаками. Безпечний спосіб показати дані."
    en: "The property of a DOM node holding all of its text. Reading it gives the text without markup; assigning to it replaces the node’s whole content with the string’s characters as they are — tags in the string stay ordinary signs. The safe way to show data."
  see: [inner-html]
  example:
    code: "console.log(document.querySelector(\"h1\").textContent); // \"Habit tracker\""
- id: inner-html
  term: innerHTML
  name: { uk: "innerHTML", en: "innerHTML" }
  definition:
    uk: "Властивість вузла DOM із його вмістом у вигляді HTML. Присвоєння віддає рядок розбирачеві HTML: теги стають елементами, атрибути — атрибутами. З даними, які могла ввести людина, — небезпечне місце."
    en: "The property of a DOM node holding its content as HTML. Assigning to it hands the string to the HTML parser: tags become elements, attributes become attributes. With data a person could have typed, it is an unsafe sink."
  see: [text-content, unsafe-sink]
  example:
    code: "note.innerHTML = \"<i>approximate</i>\"; // a real <i> element appears inside note"
- id: unsafe-sink
  term: unsafe sink
  name: { uk: "небезпечне місце", en: "unsafe sink" }
  definition:
    uk: "Місце в коді, де рядок перетворюється на розмітку чи код, наприклад присвоєння `innerHTML`. Якщо туди потрапляють дані, які міг увести будь-хто, у сторінці може виконатися чужий код. Повна картина таких атак — у JS-16."
    en: "A place in code where a string turns into markup or code, such as assigning to `innerHTML`. If data that anyone could have typed gets there, someone else’s code can run in the page. The full picture of such attacks comes in JS-16."
  aliases: ["sink"]
  see: [inner-html]
