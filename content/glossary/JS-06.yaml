# Terms introduced in JS-06. One file per unit keeps parallel authoring conflict-free.
- id: form
  term: form
  name: { uk: "форма", en: "form" }
  definition:
    uk: "Елемент `<form>` із полями, через які людина вводить дані, і кнопкою, що їх надсилає. Значення кожного поля йде з формою під ключем з його атрибута `name`."
    en: "A `<form>` element with fields through which a person enters data, and a button that submits it. Each field’s value travels with the form under the key from its `name` attribute."
  see: [label, constraint-validation]
  example:
    lang: html
    code: "<form>\n  <label for=\"title\">Task title</label>\n  <input id=\"title\" name=\"title\">\n  <button>Save</button>\n</form>"
- id: label
  term: label
  name: { uk: "підпис поля", en: "label" }
  definition:
    uk: "Елемент `<label>` — видимий текст, що називає поле. Його зв’язують із полем через однакові `for` і `id` або обгортанням. Клік по зв’язаному підпису ставить курсор у поле, а програма екранного читання оголошує його текст як ім’я поля."
    en: "The `<label>` element — visible text that names a field. It is connected to the field through matching `for` and `id` values or by wrapping. Clicking a connected label puts the cursor into the field, and a screen reader announces its text as the field’s name."
  see: [accessible-name]
  example:
    lang: html
    code: "<label for=\"price\">Price, UAH</label>\n<input id=\"price\" type=\"number\">\n\n<label><input type=\"checkbox\"> Already acquired</label>"
- id: accessible-name
  term: accessible name
  name: { uk: "доступне ім’я", en: "accessible name" }
  definition:
    uk: "Ім’я елемента, яке браузер передає програмам екранного читання та іншим допоміжним технологіям. У поля воно береться з підпису, у кнопки й посилання — з їхнього тексту, у зображення — з `alt`."
    en: "The name of an element that the browser passes to screen readers and other assistive technologies. A field takes it from its label, a button or link from its text, an image from its `alt`."
  aliases: ["доступна назва"]
  see: [label]
- id: constraint-validation
  term: constraint validation
  name: { uk: "вбудована валідація", en: "built-in validation" }
  definition:
    uk: "Перевірки, які браузер виконує сам перед надсиланням форми за атрибутами полів: `required`, `type`, `min`, `max`, `maxlength`. Порушене правило зупиняє надсилання й показує повідомлення біля поля. Перевірки в коді вона не замінює."
    en: "Checks the browser runs by itself before a form is submitted, based on field attributes: `required`, `type`, `min`, `max`, `maxlength`. A broken rule stops the submission and shows a message next to the field. It does not replace checks in code."
  aliases: ["built-in validation", "HTML validation"]
  example:
    lang: html
    code: "<input name=\"name\" required maxlength=\"80\">\n<input name=\"price\" type=\"number\" min=\"0\">"
- id: inline-validation
  term: inline validation
  name: { uk: "валідація біля поля", en: "inline validation" }
  definition:
    uk: "Спосіб показувати помилку чи підказку просто біля поля, якого вона стосується, і зв’язувати її з полем через `aria-describedby`, щоб програма екранного читання прочитала її разом з іменем поля."
    en: "Showing an error or hint right next to the field it concerns and connecting it to the field with `aria-describedby`, so that a screen reader reads it together with the field’s name."
  example:
    lang: html
    code: "<input id=\"name\" aria-describedby=\"name-error\">\n<p id=\"name-error\">Enter a name.</p>"
