# Terms introduced in RN-05. One file per unit keeps parallel authoring conflict-free.
- id: async-key-value-store
  term: async key-value store
  name: { uk: "асинхронне сховище «ключ — значення»", en: "async key-value store" }
  aliases: ["AsyncStorage", "native key-value store", "нативне сховище"]
  definition:
    uk: "Нативне сховище застосунку, яке тримає текст під ключами, як `localStorage`, але відповідає через `Promise`: виклик іде з JavaScript у нативний код і назад. У React Native це, наприклад, пакет `@react-native-async-storage/async-storage`. Він приймає лише текст і не шифрує дані."
    en: "A native app store that keeps text under keys, like `localStorage`, but answers through a `Promise`: the call goes from JavaScript into native code and back. In React Native it is, for example, the `@react-native-async-storage/async-storage` package. It accepts only text and does not encrypt the data."
  example:
    code: "const text = await storage.getItem(\"jsll.wishlist.v1\"); // text, or null"
  see: [persistence, storage-key, app-sandbox]
- id: app-sandbox
  term: app sandbox
  name: { uk: "пісочниця застосунку", en: "app sandbox" }
  aliases: ["application sandbox", "app container"]
  definition:
    uk: "Окрема ділянка пам’яті пристрою, яку операційна система виділяє одному встановленому застосунку. Інші застосунки її не читають, а після видалення застосунку вона зникає разом з усіма його файлами й сховищем. Це не шифрування: дані всередині лежать як є."
    en: "A separate area of device storage that the operating system gives one installed app. Other apps cannot read it, and when the app is uninstalled it disappears with all the app's files and store. It is not encryption: the data inside lies as it is."
  see: [async-key-value-store]
- id: schema-migration
  term: schema migration
  name: { uk: "міграція схеми", en: "schema migration" }
  aliases: ["migration", "data migration", "міграція"]
  definition:
    uk: "Перетворення збережених даних старої форми на поточну, коли нова версія застосунку змінила схему. Збережений текст сам не змінюється разом із кодом, тож під час завантаження чиста функція `migrate` крок за кроком доводить старий знімок до поточної `schemaVersion`."
    en: "Turning stored data of an old shape into the current one after a new app version changed the schema. Stored text does not change together with the code, so on load a pure `migrate` function brings the old snapshot step by step up to the current `schemaVersion`."
  see: [schema-version, migration-chain]
- id: migration-chain
  term: migration chain
  name: { uk: "ланцюжок міграцій", en: "migration chain" }
  definition:
    uk: "Набір маленьких кроків, кожен з яких піднімає знімок рівно на одну версію: v0 → v1, v1 → v2. Знімок проходить усі кроки від своєї версії до поточної по черзі, тож для нової зміни схеми додають один крок, а не переписують старі."
    en: "A set of small steps, each of which lifts a snapshot by exactly one version: v0 → v1, v1 → v2. A snapshot passes every step from its own version to the current one in order, so a new schema change adds one step instead of rewriting the old ones."
  see: [schema-migration]
- id: offline-first
  term: offline-first
  name: { uk: "offline-first", en: "offline-first" }
  definition:
    uk: "Підхід, за яким застосунок повністю працює без мережі: читає й змінює дані на пристрої, а мережу вважає додатком. Він не означає, що застосунок удає, ніби мережа є: стан збереження показують чесно — «збережено на цьому пристрої», доки дані нікуди не надіслано."
    en: "An approach in which the app works fully without a network: it reads and changes data on the device and treats the network as an extra. It does not mean pretending the network is there: the save state is shown honestly — “saved on this device” while the data has been sent nowhere."
  see: [data-authority]
- id: data-authority
  term: data authority
  name: { uk: "джерело істини", en: "data authority" }
  aliases: ["source of truth", "authority"]
  definition:
    uk: "Місце, де живе правильна версія даних: коли копії розходяться, перемагає воно. Поки сервера немає, джерело істини для записів — сховище на пристрої. Коли з’явиться сервер, ним стане сервер, а копія на пристрої перетвориться на кеш."
    en: "The place where the correct version of the data lives: when copies disagree, it wins. While there is no server, the authority for records is the store on the device. Once a server appears, the server becomes the authority and the copy on the device turns into a cache."
  see: [offline-first]
- id: process-death
  term: process death
  name: { uk: "завершення процесу", en: "process death" }
  aliases: ["process kill", "app killed in background"]
  definition:
    uk: "Ситуація, коли операційна система зупиняє процес застосунку, наприклад щоб звільнити пам’ять, поки він у фоні. Разом із процесом зникає вся пам’ять JavaScript: стан React, відкритий екран, недописаний текст. Лишається тільки те, що встигли зберегти у сховище."
    en: "The operating system stops the app's process, for example to free memory while it is in the background. All JavaScript memory goes with the process: React state, the open screen, half-typed text. Only what was saved to the store remains."
  see: [restore-on-launch]
- id: restore-on-launch
  term: restore on launch
  name: { uk: "відновлення під час запуску", en: "restore on launch" }
  definition:
    uk: "Крок запуску, на якому застосунок читає збережений знімок, розбирає його, мігрує й перевіряє валідатором спільної моделі, а лише тоді кладе записи в стан. Невдалий результат не обнуляє сховище: пошкоджені дані відкладають під резервний ключ і показують повідомлення."
    en: "The launch step in which the app reads the saved snapshot, parses it, migrates it and checks it with the shared model's validator, and only then puts the records into state. A failed result does not wipe the store: the damaged data is set aside under a backup key and a notice is shown."
  see: [process-death, schema-migration]
