# Terms introduced in NO-09 (SQL lab: related tables). One file per unit keeps parallel authoring conflict-free.
- id: primary-key
  term: primary key
  name: { uk: "первинний ключ (primary key)", en: "primary key" }
  aliases: [PRIMARY KEY, PK]
  definition:
    uk: "Стовпець (або кілька стовпців разом), значення якого унікальне для кожного рядка таблиці й не змінюється. За ним рядок знаходять і на нього посилаються інші таблиці."
    en: "A column (or several columns together) whose value is unique to each row of a table and does not change. Rows are found by it, and other tables point at it."
  example:
    code: "CREATE TABLE members (id INTEGER PRIMARY KEY, name TEXT NOT NULL);"
  see: [foreign-key, relational-schema]
- id: foreign-key
  term: foreign key
  name: { uk: "зовнішній ключ (foreign key)", en: "foreign key" }
  aliases: [REFERENCES, FK]
  definition:
    uk: "Стовпець, значення якого має збігатися з первинним ключем рядка іншої таблиці, і база це перевіряє: рядок, що посилається на неіснуючий запис, буде відхилено. У самій SQLite перевірку треба вмикати для кожного з’єднання (`PRAGMA foreign_keys = ON`); `node:sqlite` вмикає її сам."
    en: "A column whose value must match the primary key of a row in another table, and the database checks it: a row that points at a missing record is refused. SQLite itself needs the check switched on per connection (`PRAGMA foreign_keys = ON`); `node:sqlite` switches it on by default."
  example:
    code: "memberId INTEGER NOT NULL REFERENCES members(id)"
  see: [primary-key]
- id: junction-table
  term: junction table
  name: { uk: "таблиця зв’язку (junction table)", en: "junction table" }
  aliases: [join table, association table, many-to-many]
  definition:
    uk: "Таблиця, кожен рядок якої з’єднує пару записів двох інших таблиць через два зовнішні ключі. Так зберігають зв’язок «багато до багатьох»: учасник бере багато книжок, книжку беруть багато учасників."
    en: "A table each row of which connects a pair of records from two other tables through two foreign keys. That is how a many-to-many relationship is stored: a member borrows many books, and a book is borrowed by many members."
  see: [foreign-key]
- id: relational-schema
  term: relational schema
  name: { uk: "реляційна схема", en: "relational schema" }
  aliases: [database schema, schema]
  definition:
    uk: "Опис бази даних: які є таблиці, які в них стовпці й типи, які ключі та обмеження. Схему пишуть інструкціями `CREATE TABLE`; дані в таблицях — окремо від неї."
    en: "The description of a database: which tables exist, their columns and types, their keys and constraints. A schema is written with `CREATE TABLE` statements; the data in the tables is separate from it."
  see: [primary-key, foreign-key]
