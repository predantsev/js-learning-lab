# Terms introduced in NO-09 (SQL lab: related tables). One file per unit keeps parallel authoring conflict-free.
- id: primary-key
  term: primary key
  name: { uk: "первинний ключ (primary key)", en: "primary key" }
  aliases: [PRIMARY KEY, PK]
  definition:
    uk: "Стовпець (або кілька стовпців разом), значення якого унікальне для кожного рядка таблиці й не змінюється. За ним рядок знаходять і на нього посилаються інші таблиці."
    en: "A column (or several columns together) whose value is unique to each row of a table and does not change. Rows are found by it, and other tables point at it."
  example:
    code: "CREATE TABLE members (id INTEGER PRIMARY KEY, name TEXT NOT NULL);"
  see: [foreign-key, relational-schema]
- id: foreign-key
  term: foreign key
  name: { uk: "зовнішній ключ (foreign key)", en: "foreign key" }
  aliases: [REFERENCES, FK]
  definition:
    uk: "Стовпець, значення якого має збігатися з первинним ключем рядка іншої таблиці, і база це перевіряє: рядок, що посилається на неіснуючий запис, буде відхилено. У самій SQLite перевірку треба вмикати для кожного з’єднання (`PRAGMA foreign_keys = ON`); `node:sqlite` вмикає її сам."
    en: "A column whose value must match the primary key of a row in another table, and the database checks it: a row that points at a missing record is refused. SQLite itself needs the check switched on per connection (`PRAGMA foreign_keys = ON`); `node:sqlite` switches it on by default."
  example:
    code: "memberId INTEGER NOT NULL REFERENCES members(id)"
  see: [primary-key]
- id: junction-table
  term: junction table
  name: { uk: "таблиця зв’язку (junction table)", en: "junction table" }
  aliases: [join table, association table, many-to-many]
  definition:
    uk: "Таблиця, кожен рядок якої з’єднує пару записів двох інших таблиць через два зовнішні ключі. Так зберігають зв’язок «багато до багатьох»: учасник бере багато книжок, книжку беруть багато учасників."
    en: "A table each row of which connects a pair of records from two other tables through two foreign keys. That is how a many-to-many relationship is stored: a member borrows many books, and a book is borrowed by many members."
  see: [foreign-key]
- id: relational-schema
  term: relational schema
  name: { uk: "реляційна схема", en: "relational schema" }
  aliases: [database schema, schema]
  definition:
    uk: "Опис бази даних: які є таблиці, які в них стовпці й типи, які ключі та обмеження. Схему пишуть інструкціями `CREATE TABLE`; дані в таблицях — окремо від неї."
    en: "The description of a database: which tables exist, their columns and types, their keys and constraints. A schema is written with `CREATE TABLE` statements; the data in the tables is separate from it."
  see: [primary-key, foreign-key]
- id: inner-join
  term: inner join
  name: { uk: "внутрішнє з’єднання (inner join)", en: "inner join" }
  aliases: [JOIN, INNER JOIN]
  definition:
    uk: "З’єднання двох таблиць, що дає по рядку на кожну пару рядків, для якої виконується умова `ON`. Рядок без пари в іншій таблиці в результат не потрапляє."
    en: "A join of two tables that gives one row per pair of rows for which the `ON` condition holds. A row with no pair in the other table is left out of the result."
  example:
    code: "SELECT members.name, loans.id FROM members JOIN loans ON loans.memberId = members.id;"
  see: [left-join, foreign-key]
- id: left-join
  term: left join
  name: { uk: "ліве з’єднання (left join)", en: "left join" }
  aliases: [LEFT JOIN, LEFT OUTER JOIN, outer join]
  definition:
    uk: "З’єднання, що лишає кожен рядок лівої таблиці: якщо пари немає, стовпці правої таблиці в цьому рядку дорівнюють `NULL`. Умова в `ON` вирішує, що вважати парою; умова у `WHERE` відсіює рядки вже після з’єднання."
    en: "A join that keeps every row of the left table: when there is no pair, the right table’s columns in that row are `NULL`. A condition in `ON` decides what counts as a pair; a condition in `WHERE` filters rows after the join."
  see: [inner-join, sql-null]
- id: group-by
  term: GROUP BY
  name: { uk: "GROUP BY (групування)", en: "GROUP BY" }
  aliases: [grouping, HAVING]
  definition:
    uk: "Частина запиту, що складає рядки з однаковим значенням у групи й дає по одному рядку на групу. `WHERE` відсіює рядки до групування, `HAVING` — групи після нього."
    en: "The part of a query that puts rows with the same value into groups and gives one row per group. `WHERE` filters rows before grouping, `HAVING` filters groups after it."
  example:
    code: "SELECT memberId, COUNT(*) FROM loans GROUP BY memberId HAVING COUNT(*) >= 2;"
  see: [aggregate-function]
- id: aggregate-function
  term: aggregate function
  name: { uk: "агрегатна функція", en: "aggregate function" }
  aliases: [COUNT, SUM, MIN, MAX, AVG, aggregate]
  definition:
    uk: "Функція, що згортає багато рядків в одне значення: `COUNT`, `SUM`, `MIN`, `MAX`, `AVG`. З `GROUP BY` вона працює для кожної групи окремо. `COUNT(*)` рахує рядки, `COUNT(стовпець)` — лише рядки, де стовпець не `NULL`."
    en: "A function that folds many rows into one value: `COUNT`, `SUM`, `MIN`, `MAX`, `AVG`. With `GROUP BY` it works for each group separately. `COUNT(*)` counts rows, `COUNT(column)` only rows where the column is not `NULL`."
  see: [group-by]
- id: sql-null
  term: NULL (SQL)
  name: { uk: "NULL у SQL", en: "NULL (SQL)" }
  aliases: [NULL, IS NULL, IS NOT NULL]
  definition:
    uk: "Позначка «значення немає або воно невідоме» у стовпці. Будь-яке порівняння з `NULL` через `=`, `<>`, `<` дає unknown, тож шукають його лише через `IS NULL` та `IS NOT NULL`. У `node:sqlite` `NULL` приходить у JavaScript як `null`."
    en: "A marker for “no value, or the value is unknown” in a column. Any comparison with `NULL` through `=`, `<>`, `<` gives unknown, so it is found only with `IS NULL` and `IS NOT NULL`. In `node:sqlite` a `NULL` arrives in JavaScript as `null`."
  example:
    code: "SELECT COUNT(*) FROM loans WHERE returnedOn IS NULL;"
  see: [three-valued-logic]
- id: three-valued-logic
  term: three-valued logic
  name: { uk: "тризначна логіка", en: "three-valued logic" }
  aliases: [unknown, true/false/unknown]
  definition:
    uk: "Логіка SQL з трьома відповідями умови: true, false і unknown (коли в порівнянні бере участь `NULL`). `WHERE` лишає лише рядки з true, а `CHECK` відхиляє лише рядки з false — тож unknown `WHERE` відкидає, а `CHECK` пропускає."
    en: "SQL’s logic with three answers to a condition: true, false and unknown (when `NULL` takes part in a comparison). `WHERE` keeps only rows with true, while a `CHECK` refuses only rows with false — so `WHERE` drops unknown and a `CHECK` lets it through."
  see: [sql-null, check-constraint]
- id: check-constraint
  term: CHECK constraint
  name: { uk: "обмеження CHECK", en: "CHECK constraint" }
  aliases: [CHECK]
  definition:
    uk: "Умова в описі таблиці, яку база перевіряє для кожного вставленого чи зміненого рядка й відхиляє рядок, коли умова false. Може порівнювати кілька стовпців одного рядка."
    en: "A condition in a table definition that the database tests for every inserted or changed row, refusing the row when the condition is false. It may compare several columns of one row."
  example:
    code: "copies INTEGER NOT NULL CHECK (copies >= 0)"
  see: [unique-constraint, three-valued-logic]
- id: unique-constraint
  term: UNIQUE constraint
  name: { uk: "обмеження UNIQUE", en: "UNIQUE constraint" }
  aliases: [UNIQUE]
  definition:
    uk: "Обмеження, за яким жодні два рядки таблиці не мають однакового значення в стовпці (чи однакової комбінації в кількох стовпцях). Повтор відхиляється з помилкою `UNIQUE constraint failed`."
    en: "A constraint under which no two rows of a table have the same value in a column (or the same combination across several columns). A repeat is refused with the error `UNIQUE constraint failed`."
  example:
    code: "isbn TEXT NOT NULL UNIQUE"
  see: [check-constraint, primary-key]
- id: sql-injection
  term: SQL injection
  name: { uk: "SQL-ін’єкція (SQL injection)", en: "SQL injection" }
  aliases: [injection, SQLi]
  definition:
    uk: "Вада, коли недовірений текст вклеюють у текст SQL-запиту, і база розбирає його як частину коду: лапка закриває рядок, а далі йдуть нові умови чи інструкції. Захист — параметризовані запити для значень і список дозволених варіантів для назв стовпців і напрямку сортування."
    en: "A defect where untrusted text is glued into the text of an SQL query and the database parses it as part of the code: a quote closes the string, and new conditions or statements follow. The defence is parameterized queries for values and an allowlist for column names and sort directions."
  see: [parameterized-query, untrusted-input]
- id: parameterized-query
  term: parameterized query
  name: { uk: "параметризований запит", en: "parameterized query" }
  aliases: [bound parameter, placeholder, "?"]
  definition:
    uk: "Запит, у якому на місці значень стоять плейсхолдери (`?`, `:name`), а самі значення передають окремо. База ніколи не розбирає їх як SQL, тому лапки чи `--` у них — звичайні символи. Назви таблиць і стовпців параметрами бути не можуть."
    en: "A query in which placeholders (`?`, `:name`) stand where values go, and the values themselves are passed separately. The database never parses them as SQL, so quotes or `--` inside them are ordinary characters. Table and column names cannot be parameters."
  example:
    code: "db.prepare('SELECT * FROM books WHERE title LIKE ?').all(`%${term}%`);"
  see: [prepared-statement, sql-injection]
- id: prepared-statement
  term: prepared statement
  name: { uk: "підготована інструкція (prepared statement)", en: "prepared statement" }
  aliases: [StatementSync, prepare]
  definition:
    uk: "SQL, який база вже розібрала й склала план виконання, але ще не виконала. У `node:sqlite` її повертає `db.prepare(sql)`; потім `all`, `get` чи `run` виконують її з конкретними значеннями параметрів — одну інструкцію можна виконати багато разів."
    en: "SQL that the database has already parsed and planned but not yet run. In `node:sqlite` it is returned by `db.prepare(sql)`; then `all`, `get` or `run` execute it with concrete parameter values — one statement can be run many times."
  see: [parameterized-query]
- id: database-transaction
  term: transaction (database)
  name: { uk: "транзакція (бази даних)", en: "transaction (database)" }
  aliases: [transaction, BEGIN, COMMIT, ACID]
  definition:
    uk: "Група інструкцій, яку база виконує як одне ціле: між `BEGIN` і `COMMIT` зміни або зберігаються всі разом, або, після `ROLLBACK`, жодна. Інші з’єднання не бачать незбережених змін транзакції."
    en: "A group of statements the database carries out as one unit: between `BEGIN` and `COMMIT` the changes are either all saved together or, after `ROLLBACK`, none of them. Other connections do not see a transaction’s unsaved changes."
  example:
    code: "db.exec('BEGIN'); try { /* steps */ db.exec('COMMIT'); } catch (error) { db.exec('ROLLBACK'); throw error; }"
  see: [transaction-rollback, isolation-level, atomic-write]
- id: transaction-rollback
  term: rollback
  name: { uk: "відкат (rollback)", en: "rollback" }
  aliases: [ROLLBACK]
  definition:
    uk: "Скасування всіх змін транзакції від `BEGIN`: база повертається до стану, ніби транзакції не було. Пишуть на шляху помилки, а саму помилку потім передають далі."
    en: "Undoing every change of a transaction since `BEGIN`: the database returns to the state as if the transaction never happened. It is written on the error path, and the error itself is then passed on."
  see: [database-transaction]
- id: isolation-level
  term: isolation level
  name: { uk: "рівень ізоляції", en: "isolation level" }
  aliases: [serializable, read committed, dirty read, phantom read]
  definition:
    uk: "Налаштування, що визначає, які зміни інших одночасних транзакцій бачить транзакція. Слабші рівні допускають аномалії (dirty read, non-repeatable read, phantom read), найсильніший — serializable — дає результат, ніби транзакції йшли по черзі. SQLite працює як serializable; PostgreSQL за замовчуванням — read committed."
    en: "A setting that decides which changes of other concurrent transactions a transaction sees. Weaker levels allow anomalies (dirty read, non-repeatable read, phantom read); the strongest, serializable, gives a result as if the transactions ran one after another. SQLite behaves as serializable; PostgreSQL defaults to read committed."
  see: [database-transaction]
