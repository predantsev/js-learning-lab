# Terms introduced in NO-04. One file per unit keeps parallel authoring conflict-free.
- id: rest-resource
  term: REST resource
  name: { uk: "ресурс (REST)", en: "REST resource" }
  aliases: ["REST", "resource", "ресурс"]
  definition:
    uk: "Те, що API називає адресою: колекція (`/records`) або один її елемент (`/records/w-02`). У стилі REST адреса — це іменник, а дію задає HTTP-метод: `GET` читає, `POST` створює в колекції, `PUT` замінює, `PATCH` змінює частину, `DELETE` видаляє."
    en: "What an API names with an address: a collection (`/records`) or one of its items (`/records/w-02`). In the REST style the address is a noun, and the HTTP method sets the action: `GET` reads, `POST` creates in a collection, `PUT` replaces, `PATCH` changes a part, `DELETE` deletes."
  see: [http-method, partial-update]
- id: partial-update
  term: partial update
  name: { uk: "часткова зміна (PATCH)", en: "partial update (PATCH)" }
  aliases: ["PATCH"]
  definition:
    uk: "Запит `PATCH`, що змінює лише надіслані поля ресурсу й лишає решту як була. На відміну від нього, `PUT` надсилає весь новий стан ресурсу й замінює ним старий: поле, якого немає в тілі `PUT`, зникає (або сервер відхиляє неповне тіло)."
    en: "A `PATCH` request that changes only the fields sent and leaves the rest of the resource as it was. Unlike it, `PUT` sends the whole new state of the resource and replaces the old one with it: a field missing from a `PUT` body disappears (or the server refuses the incomplete body)."
  see: [rest-resource]
- id: edge-validation
  term: edge validation
  name: { uk: "валідація на межі", en: "edge validation" }
  aliases: ["validation at the edge", "валідація на вході"]
  definition:
    uk: "Перевірка вхідних даних там, де вони потрапляють у програму, — на сервері одразу після розбору тіла запиту й до репозиторію. Сервер перевіряє сам, навіть якщо клієнт уже перевірив форму: запит може прийти звідки завгодно. Неправильний ввід отримує відповідь 400 з усіма помилками й нічого не змінює."
    en: "Checking input where it enters the program — on a server right after parsing the request body and before the repository. The server checks for itself even when the client has already checked the form: a request can come from anywhere. Invalid input gets a 400 answer with every error and changes nothing."
  see: [untrusted-input, trust-boundary, parse-dont-validate]
- id: parse-dont-validate
  term: parse, don't validate
  name: { uk: "розбирай, а не лише перевіряй", en: "parse, don't validate" }
  aliases: ["parse, don’t validate", "parsed value", "розібране значення"]
  definition:
    uk: "Принцип: перевірка на межі не просто відповідає «так/ні», а повертає нове значення відомої форми — лише поля схеми, обрізаний текст, типові значення. Код після межі працює з цим значенням, а не з сирим вводом, і більше не мусить у ньому сумніватися."
    en: "A principle: a check at the edge does not just answer yes or no, it returns a new value of a known shape — only the schema's fields, trimmed text, defaults filled in. The code past the edge works with that value, not with the raw input, and no longer has to doubt it."
  see: [edge-validation, runtime-schema]
