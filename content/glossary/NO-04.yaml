# Terms introduced in NO-04. One file per unit keeps parallel authoring conflict-free.
- id: rest-resource
  term: REST resource
  name: { uk: "ресурс (REST)", en: "REST resource" }
  aliases: ["REST", "resource", "ресурс"]
  definition:
    uk: "Те, що API називає адресою: колекція (`/records`) або один її елемент (`/records/w-02`). У стилі REST адреса — це іменник, а дію задає HTTP-метод: `GET` читає, `POST` створює в колекції, `PUT` замінює, `PATCH` змінює частину, `DELETE` видаляє."
    en: "What an API names with an address: a collection (`/records`) or one of its items (`/records/w-02`). In the REST style the address is a noun, and the HTTP method sets the action: `GET` reads, `POST` creates in a collection, `PUT` replaces, `PATCH` changes a part, `DELETE` deletes."
  see: [http-method, partial-update]
- id: partial-update
  term: partial update
  name: { uk: "часткова зміна (PATCH)", en: "partial update (PATCH)" }
  aliases: ["PATCH"]
  definition:
    uk: "Запит `PATCH`, що змінює лише надіслані поля ресурсу й лишає решту як була. На відміну від нього, `PUT` надсилає весь новий стан ресурсу й замінює ним старий: поле, якого немає в тілі `PUT`, зникає (або сервер відхиляє неповне тіло)."
    en: "A `PATCH` request that changes only the fields sent and leaves the rest of the resource as it was. Unlike it, `PUT` sends the whole new state of the resource and replaces the old one with it: a field missing from a `PUT` body disappears (or the server refuses the incomplete body)."
  see: [rest-resource]
- id: edge-validation
  term: edge validation
  name: { uk: "валідація на межі", en: "edge validation" }
  aliases: ["validation at the edge", "валідація на вході"]
  definition:
    uk: "Перевірка вхідних даних там, де вони потрапляють у програму, — на сервері одразу після розбору тіла запиту й до репозиторію. Сервер перевіряє сам, навіть якщо клієнт уже перевірив форму: запит може прийти звідки завгодно. Неправильний ввід отримує відповідь 400 із усіма помилками й нічого не змінює."
    en: "Checking input where it enters the program — on a server right after parsing the request body and before the repository. The server checks for itself even when the client has already checked the form: a request can come from anywhere. Invalid input gets a 400 answer with every error and changes nothing."
  see: [untrusted-input, trust-boundary, parse-dont-validate]
- id: parse-dont-validate
  term: parse, don't validate
  name: { uk: "розбирай, а не лише перевіряй", en: "parse, don't validate" }
  aliases: ["parse, don’t validate", "parsed value", "розібране значення"]
  definition:
    uk: "Принцип: перевірка на межі не просто відповідає «так/ні», а повертає нове значення відомої форми — лише поля схеми, обрізаний текст, типові значення. Код після межі працює із цим значенням, а не із сирим вводом, і більше не мусить у ньому сумніватися."
    en: "A principle: a check at the edge does not just answer yes or no, it returns a new value of a known shape — only the schema's fields, trimmed text, defaults filled in. The code past the edge works with that value, not with the raw input, and no longer has to doubt it."
  see: [edge-validation, runtime-schema]
- id: problem-details
  term: Problem Details
  name: { uk: "Problem Details (RFC 9457)", en: "Problem Details (RFC 9457)" }
  aliases: ["RFC 9457", "application/problem+json", "error shape", "форма помилки"]
  definition:
    uk: "Стандарт IETF (RFC 9457, 2023 рік, замінив RFC 7807) спільної форми помилок для HTTP API: тип вмісту `application/problem+json` і поля `type`, `title`, `status`, `detail`, `instance` плюс власні поля API. Головна ідея — усі збої API в одній передбачуваній формі, яку клієнт читає в одному місці."
    en: "An IETF standard (RFC 9457, 2023, replacing RFC 7807) for a common error shape of HTTP APIs: the content type `application/problem+json` and the fields `type`, `title`, `status`, `detail`, `instance`, plus the API's own fields. The main idea: every failure of an API in one predictable shape that the client reads in one place."
  see: [api-error-code, status-code]
- id: api-error-code
  term: API error code
  name: { uk: "код помилки API", en: "API error code" }
  aliases: ["error code", "code", "messageKey", "код помилки"]
  definition:
    uk: "Стабільний машинний рядок у тілі помилки (`NOT_FOUND`, `VALIDATION_FAILED`), за яким розгалужується код клієнта. На відміну від тексту повідомлення, який можна виправити чи перекласти, код — частина контракту API: його не змінюють без нової версії. Текст для людини клієнт бере за окремим ключем повідомлення."
    en: "A stable machine string in an error body (`NOT_FOUND`, `VALIDATION_FAILED`) that client code branches on. Unlike a message text, which may be corrected or translated, the code is part of the API contract: it does not change without a new version. The client takes the text for people by a separate message key."
  see: [problem-details]
- id: pagination
  term: pagination
  name: { uk: "пагінація", en: "pagination" }
  aliases: ["paging", "page", "limit", "сторінки"]
  definition:
    uk: "Видача колекції частинами: клієнт просить `limit` записів, а сервер повертає одну сторінку й спосіб попросити наступну. Сервер спершу фільтрує, потім сортує із однозначним порядком (з tie-breaker), і лише тоді вирізає сторінку; `limit` перевіряє на максимум."
    en: "Serving a collection in parts: the client asks for `limit` records, and the server returns one page and a way to ask for the next. The server filters first, then sorts in an unambiguous order (with a tie-breaker), and only then cuts the page; it checks `limit` against a maximum."
  see: [offset-pagination, cursor-pagination, comparator]
- id: offset-pagination
  term: offset pagination
  name: { uk: "пагінація за зсувом (offset)", en: "offset pagination" }
  aliases: ["offset"]
  definition:
    uk: "Сторінки за номером позиції: `?offset=20&limit=10` — пропусти 20 записів, дай 10. Дозволяє стрибнути на будь-яку сторінку, але якщо між запитами додали чи видалили запис раніше за поточну позицію, наступна сторінка повторить або пропустить записи."
    en: "Pages by position number: `?offset=20&limit=10` — skip 20 records, give 10. It allows jumping to any page, but if a record before the current position is added or removed between requests, the next page repeats or skips records."
  see: [pagination, cursor-pagination]
- id: cursor-pagination
  term: cursor pagination
  name: { uk: "пагінація за курсором", en: "cursor pagination" }
  aliases: ["cursor", "nextCursor", "курсор", "keyset pagination"]
  definition:
    uk: "Сторінки від конкретного запису: сервер повертає разом зі сторінкою `nextCursor` (наприклад, `id` останнього запису), а наступна сторінка — це записи, що в порядку сортування йдуть після нього. Вставки раніше за курсор нічого не зсувають. Потрібен однозначний порядок, тобто tie-breaker; стрибнути одразу на десяту сторінку не можна."
    en: "Pages from a specific record: with each page the server returns a `nextCursor` (for example the `id` of the last record), and the next page is the records that sort after it. Inserts before the cursor shift nothing. It needs an unambiguous order, that is a tie-breaker; you cannot jump straight to page ten."
  see: [pagination, offset-pagination]
- id: idempotency-key
  term: Idempotency-Key
  name: { uk: "Idempotency-Key (ключ ідемпотентності)", en: "Idempotency-Key" }
  aliases: ["idempotency key", "ключ ідемпотентності"]
  definition:
    uk: "Заголовок запиту із унікальним рядком, який клієнт створює один раз для дії й надсилає із кожною спробою. Сервер запам’ятовує для ключа відбиток тіла й відповідь: повтор із тим самим тілом отримує збережену відповідь без повторної роботи, а той самий ключ із іншим тілом — відмову 422. Так неідемпотентний `POST` можна безпечно повторити після помилки мережі."
    en: "A request header with a unique string that the client creates once per action and sends with every attempt. For the key the server remembers the body fingerprint and the answer: a retry with the same body gets the saved answer without the work being done again, and the same key with a different body gets a 422 refusal. That makes a non-idempotent `POST` safe to retry after a network error."
  see: [idempotency, bounded-retry]
- id: api-versioning
  term: API versioning
  name: { uk: "версіонування API", en: "API versioning" }
  aliases: ["/v1", "/v2", "API version", "версія API"]
  definition:
    uk: "Спосіб робити ламкі зміни контракту, не ламаючи наявних клієнтів: нова версія живе за новою адресою (`/v2/notes`), а стара (`/v1/notes`) і далі віддає ту саму форму, доки нею користуються. Новий номер потрібен лише для ламкої зміни, а не для кожного релізу."
    en: "A way to make breaking contract changes without breaking existing clients: the new version lives at a new address (`/v2/notes`), and the old one (`/v1/notes`) keeps serving the same shape while it is in use. A new number is needed only for a breaking change, not for every release."
  see: [compatible-change, semver]
- id: compatible-change
  term: compatible change
  name: { uk: "сумісна зміна (контракту)", en: "compatible change" }
  aliases: ["backward-compatible change", "breaking change", "ламка зміна", "зворотно сумісна зміна"]
  definition:
    uk: "Зміна API, після якої старі клієнти працюють без змін: нове необов’язкове поле у відповіді, новий маршрут. Ламка зміна — навпаки: перейменоване чи прибране поле, суворіша валідація, нове обов’язкове поле у вводі, інший статус. Ламкі зміни йдуть лише в нову версію API."
    en: "An API change after which old clients keep working unchanged: a new optional response field, a new route. A breaking change is the opposite: a renamed or removed field, stricter validation, a new required input field, a different status. Breaking changes go only into a new API version."
  see: [api-versioning]
