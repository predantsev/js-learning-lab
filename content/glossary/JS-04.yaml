# Terms introduced in JS-04. One file per unit keeps parallel authoring conflict-free.
- id: array
  term: array
  name: { uk: "масив", en: "array" }
  definition:
    uk: "Впорядкований список значень. Кожне значення лежить у пронумерованій комірці: нумерація починається з 0, а `length` показує кількість комірок."
    en: "An ordered list of values. Each value sits in a numbered slot: numbering starts at 0, and `length` tells how many slots there are."
  see: [array-index, array-method]
  example:
    code: "const prices = [80, 45, 240]; // prices[0] is 80, prices.length is 3"
- id: array-index
  term: index
  name: { uk: "індекс", en: "index" }
  definition:
    uk: "Номер комірки масиву. Перша комірка має індекс 0, остання — `length - 1`. Читання за індексом, якого немає, дає `undefined`, а не помилку."
    en: "The number of an array slot. The first slot has index 0, the last one `length - 1`. Reading an index that does not exist gives `undefined`, not an error."
  aliases: ["індекс масиву", "array index"]
  see: [array]
  example:
    code: "prices[prices.length - 1] // the last element"
- id: sparse-array
  term: sparse array
  name: { uk: "розріджений масив", en: "sparse array" }
  definition:
    uk: "Масив із дірками — комірками, у які ніхто нічого не записав. З’являється, коли записують далеко за кінцем: `length` стає «останній індекс + 1», а дірки читаються як `undefined`."
    en: "An array with holes — slots that nobody wrote into. It appears when you write far past the end: `length` becomes “the last index + 1”, and the holes read as `undefined`."
  aliases: ["масив із дірками", "holes"]
  see: [array]
  example:
    code: "const list = [1]; list[3] = 4; // [1, <empty>, <empty>, 4], length 4"
- id: array-method
  term: array method
  name: { uk: "метод масиву", en: "array method" }
  definition:
    uk: "Функція, яка належить масиву й викликається через крапку: `prices.push(18)`, `prices.pop()`. Деякі методи змінюють сам масив: `push` додає значення в кінець, `pop` забирає останнє й повертає його."
    en: "A function that belongs to an array and is called with a dot: `prices.push(18)`, `prices.pop()`. Some methods change the array itself: `push` adds a value at the end, `pop` removes the last one and returns it."
  aliases: ["метод", "method"]
  see: [array]
  example:
    code: "const prices = [80, 45];\nprices.push(240); // [80, 45, 240]\nprices.pop();     // returns 240, prices is [80, 45] again"
- id: loop
  term: loop
  name: { uk: "цикл", en: "loop" }
  definition:
    uk: "Конструкція, що повторює той самий блок коду: доки правдива умова (`for`, `while`, `do-while`) або по разу для кожного елемента чи ключа (`for…of`, `for…in`)."
    en: "A construct that repeats the same block of code: while a condition is true (`for`, `while`, `do-while`) or once for every element or key (`for…of`, `for…in`)."
  see: [iteration, for-loop, while-loop, do-while]
- id: iteration
  term: iteration
  name: { uk: "ітерація", en: "iteration" }
  definition:
    uk: "Один прохід тіла циклу. Перед кожною ітерацією `for` і `while` перевіряють умову, тож коли цикл зупиняє сама умова, перевірок на одну більше, ніж ітерацій."
    en: "One pass through a loop body. `for` and `while` check the condition before every iteration, so when the condition is what stops the loop, there is one more check than iterations."
  aliases: ["прохід циклу"]
  see: [loop]
- id: for-loop
  term: for loop
  name: { uk: "цикл for", en: "for loop" }
  definition:
    uk: "Цикл із трьома частинами в заголовку: початок (один раз), перевірка (перед кожною ітерацією) і крок (після кожної). Зручний для проходу масиву за індексами."
    en: "A loop with three parts in its header: the start (once), the check (before every iteration) and the update (after each one). Handy for walking an array by index."
  see: [loop, iteration]
  example:
    code: "for (let i = 0; i < prices.length; i++) {\n  console.log(prices[i]);\n}"
- id: while-loop
  term: while loop
  name: { uk: "цикл while", en: "while loop" }
  definition:
    uk: "Цикл, що повторює тіло, доки умова правдива, і перевіряє її **перед** кожною ітерацією. Початок і крок пишуть окремо, тож він зручний, коли зупинка залежить від умови, а не від лічильника."
    en: "A loop that repeats its body while the condition is true and checks it **before** every iteration. The start and the step are written separately, so it suits cases where stopping depends on a condition rather than a counter."
  see: [loop, do-while]
  example:
    code: "let budget = 100;\nwhile (budget >= 45) {\n  budget = budget - 45;\n}"
- id: do-while
  term: do-while loop
  name: { uk: "цикл do-while", en: "do-while loop" }
  definition:
    uk: "Цикл, що перевіряє умову **після** тіла, тож тіло виконується щонайменше раз — навіть для порожнього масиву. Тому масиви обходять `for` або `while`."
    en: "A loop that checks its condition **after** the body, so the body runs at least once — even for an empty array. That is why arrays are walked with `for` or `while`."
  see: [while-loop, loop]
  example:
    code: "let i = 0;\ndo {\n  i++;\n} while (i < 0); // the body ran once anyway: i is 1"
- id: termination
  term: termination
  name: { uk: "завершення циклу", en: "termination" }
  definition:
    uk: "Властивість циклу рано чи пізно зупинитися. Цикл завершується, лише коли його умова стає `false`, тож щось у тілі чи кроці мусить рухати значення до виходу."
    en: "A loop's property of stopping sooner or later. A loop ends only when its condition becomes `false`, so something in the body or the update must move the values towards the exit."
  see: [infinite-loop, loop]
- id: infinite-loop
  term: infinite loop
  name: { uk: "нескінченний цикл", en: "infinite loop" }
  definition:
    uk: "Цикл, умова якого ніколи не стає `false` — наприклад, бо ніщо не змінює лічильник. Помилки сам по собі не дає: сторінка просто «замерзає». У пісочниці курсу такий цикл зупиняє кнопка **Зупинити** або сама платформа через 2 секунди (`LoopBudgetError`)."
    en: "A loop whose condition never becomes `false` — for example because nothing changes the counter. It gives no error on its own: the page simply “freezes”. In the course sandbox such a loop is stopped by the **Stop** button or by the platform itself after 2 seconds (`LoopBudgetError`)."
  aliases: ["endless loop", "безкінечний цикл"]
  see: [termination]
  example:
    code: "let i = 0;\nwhile (i < 3) {\n  // i++ is missing: i stays 0 forever\n}"
- id: off-by-one
  term: off-by-one error
  name: { uk: "помилка «на одиницю»", en: "off-by-one error" }
  definition:
    uk: "Цикл робить на одну ітерацію більше чи менше, ніж треба: наприклад, `i <= list.length` читає зайву комірку `list[list.length]` (`undefined`), а старт з `i = 1` пропускає перший елемент. Ловиться перевіркою першої й останньої ітерації та порожнього списку."
    en: "A loop makes one iteration more or fewer than it should: for example, `i <= list.length` reads the extra slot `list[list.length]` (`undefined`), and starting at `i = 1` skips the first element. You catch it by checking the first and the last iteration and the empty list."
  aliases: ["off-by-one"]
  see: [iteration, array-index]
- id: break
  term: break
  name: { uk: "break", en: "break" }
  definition:
    uk: "Інструкція, що одразу зупиняє найближчий цикл (або `switch`), у якому стоїть; виконання йде далі з рядка коду після нього. У вкладених циклах звичайний `break` виходить лише з внутрішнього."
    en: "A statement that immediately stops the nearest loop (or `switch`) it stands in; execution continues from the line after it. In nested loops a plain `break` leaves only the inner loop."
  see: [continue, labeled-statement, nested-loop]
  example:
    code: "for (let i = 0; i < prices.length; i++) {\n  if (prices[i] > 100) {\n    break; // stop at the first match\n  }\n}"
- id: continue
  term: continue
  name: { uk: "continue", en: "continue" }
  definition:
    uk: "Інструкція, що пропускає решту поточної ітерації найближчого циклу й переходить до наступної (у `for` — через крок). Сам цикл не зупиняється."
    en: "A statement that skips the rest of the current iteration of the nearest loop and moves on to the next one (in a `for` loop, through the update). The loop itself does not stop."
  see: [break, iteration]
  example:
    code: "for (let i = 0; i < prices.length; i++) {\n  if (prices[i] === null) {\n    continue; // skip wishes without a price\n  }\n  console.log(prices[i]);\n}"
- id: nested-loop
  term: nested loop
  name: { uk: "вкладений цикл", en: "nested loop" }
  definition:
    uk: "Цикл усередині іншого циклу: на кожну ітерацію зовнішнього внутрішній проходить свій список від початку. Якщо внутрішній список порожній, внутрішній цикл робить нуль ітерацій."
    en: "A loop inside another loop: for every iteration of the outer loop, the inner loop walks its list from the start. If the inner list is empty, the inner loop makes zero iterations."
  aliases: ["вкладені цикли", "nested loops"]
  see: [break, labeled-statement]
- id: labeled-statement
  term: labeled statement
  name: { uk: "позначена інструкція", en: "labeled statement" }
  definition:
    uk: "Інструкція з міткою перед нею: `search: for (…)`. Завдяки мітці `break search` чи `continue search` діють на позначений цикл — наприклад, виходять з обох вкладених циклів одразу. Усередині функції замість мітки часто простіше написати `return`."
    en: "A statement with a label in front of it: `search: for (…)`. Thanks to the label, `break search` or `continue search` act on the labeled loop — for example, leaving both nested loops at once. Inside a function, `return` is often simpler than a label."
  aliases: ["label", "мітка"]
  see: [break, nested-loop]
  example:
    code: "search: for (let g = 0; g < groups.length; g++) {\n  for (let p = 0; p < groups[g].prices.length; p++) {\n    if (groups[g].prices[p] > 200) {\n      break search; // leaves both loops\n    }\n  }\n}"
- id: object
  term: object
  name: { uk: "об’єкт", en: "object" }
  definition:
    uk: "Значення, що групує властивості з назвами: `{ id: \"w-02\", price: 45 }`. Запис проєкту — бажання, справа, звичка чи витрата — це об’єкт. Змінна з об’єктом зберігає посилання на нього, а не копію."
    en: "A value that groups named properties: `{ id: \"w-02\", price: 45 }`. A project record — a wish, a task, a habit or an expense — is an object. A variable holding an object stores a reference to it, not a copy."
  see: [property, own-property, reference]
  example:
    code: "const wish = { id: \"w-02\", price: 45 };\nwish.price; // 45"
- id: property
  term: property
  name: { uk: "властивість", en: "property" }
  definition:
    uk: "Пара «назва: значення» всередині об’єкта. Властивість можна прочитати (`wish.price`), змінити чи додати присвоєнням (`wish.price = 50`) і видалити (`delete wish.price`). Читання відсутньої властивості дає `undefined`."
    en: "A “name: value” pair inside an object. A property can be read (`wish.price`), changed or added by assignment (`wish.price = 50`) and removed (`delete wish.price`). Reading a missing property gives `undefined`."
  aliases: ["поле", "field", "key"]
  see: [object, dot-notation, bracket-notation]
- id: dot-notation
  term: dot notation
  name: { uk: "точкова нотація", en: "dot notation" }
  definition:
    uk: "Доступ до властивості через крапку: `wish.price`. Назва береться буквально, як написано в коді, тож `wish.field` шукає властивість із назвою `field`, а не зі значення змінної `field`."
    en: "Property access with a dot: `wish.price`. The name is taken literally, as written in the code, so `wish.field` looks for a property called `field`, not for the value of a variable `field`."
  see: [bracket-notation, property]
- id: bracket-notation
  term: bracket notation
  name: { uk: "дужкова нотація", en: "bracket notation" }
  definition:
    uk: "Доступ до властивості через квадратні дужки: `wish[\"price\"]` або `wish[field]`. Вираз у дужках спершу обчислюється, тож назву можна взяти зі змінної чи параметра."
    en: "Property access with square brackets: `wish[\"price\"]` or `wish[field]`. The expression inside is evaluated first, so the name can come from a variable or a parameter."
  see: [dot-notation, property]
  example:
    code: "const field = \"price\";\nwish[field]; // same as wish.price"
- id: own-property
  term: own property
  name: { uk: "власна властивість", en: "own property" }
  definition:
    uk: "Властивість, записана в самому об’єкті, а не успадкована. `Object.hasOwn(obj, name)` перевіряє лише власні властивості, а оператор `in` — ще й успадковані (наприклад, `toString`)."
    en: "A property stored on the object itself rather than inherited. `Object.hasOwn(obj, name)` checks only own properties, while the `in` operator also sees inherited ones (such as `toString`)."
  see: [property, inherited-property]
  example:
    code: "const wish = { price: 45 };\nObject.hasOwn(wish, \"price\");    // true\nObject.hasOwn(wish, \"toString\"); // false\n\"toString\" in wish;              // true"
- id: for-of
  term: for…of loop
  name: { uk: "цикл for…of", en: "for…of loop" }
  definition:
    uk: "Цикл, що по черзі дає **значення** масиву (чи іншої перелічуваної колекції) без лічильника й меж, тож помилок «на одиницю» в ньому немає. Для звичайного об’єкта кидає `TypeError: … is not iterable` — для полів запису обходь `Object.entries(record)`."
    en: "A loop that gives the **values** of an array (or another iterable collection) one by one, without a counter or bounds, so it has no off-by-one errors. For an ordinary object it throws `TypeError: … is not iterable` — to walk a record's fields, loop over `Object.entries(record)`."
  aliases: ["for-of", "for of"]
  see: [for-in, loop]
  example:
    code: "for (const price of [80, 45, 240]) {\n  console.log(price);\n}"
- id: for-in
  term: for…in loop
  name: { uk: "цикл for…in", en: "for…in loop" }
  definition:
    uk: "Цикл, що дає **назви** перелічуваних властивостей об’єкта — завжди у вигляді тексту, і разом з успадкованими. На масиві дає індекси `\"0\"`, `\"1\"`, а не елементи. Для власних полів запису надійніше `Object.keys` чи `Object.entries` з `for…of`."
    en: "A loop that gives the **names** of an object's enumerable properties — always as strings, and inherited ones included. On an array it gives the indexes `\"0\"`, `\"1\"`, not the elements. For a record's own fields, `Object.keys` or `Object.entries` with `for…of` is safer."
  aliases: ["for-in", "for in"]
  see: [for-of, inherited-property, enumerable-property]
- id: enumerable-property
  term: enumerable property
  name: { uk: "перелічувана властивість", en: "enumerable property" }
  definition:
    uk: "Властивість, яку показують `for…in`, `Object.keys` і `Object.entries`. Усі поля, які ти записуєш у звичайний об’єкт, перелічувані; вбудовані речі на кшталт `toString` — ні, тому цикли їх не показують."
    en: "A property that `for…in`, `Object.keys` and `Object.entries` show. All fields you write into an ordinary object are enumerable; built-ins such as `toString` are not, so loops do not show them."
  see: [for-in, own-property]
- id: inherited-property
  term: inherited property
  name: { uk: "успадкована властивість", en: "inherited property" }
  definition:
    uk: "Властивість, якої немає в самому об’єкті, але яку він отримує через приховане посилання на інший об’єкт (наприклад, створений через `Object.create(defaults)` чи вбудований `Object.prototype`). Читання й `in` її бачать, `Object.hasOwn` і `Object.keys` — ні."
    en: "A property the object itself does not have but receives through a hidden link to another object (for example one made with `Object.create(defaults)`, or the built-in `Object.prototype`). Reading it and `in` see it; `Object.hasOwn` and `Object.keys` do not."
  see: [own-property, for-in]
  example:
    code: "const defaults = { done: false };\nconst task = Object.create(defaults);\ntask.done;                   // false — inherited\nObject.hasOwn(task, \"done\"); // false"
- id: primitive
  term: primitive
  name: { uk: "примітив", en: "primitive" }
  definition:
    uk: "Просте значення — число, текст у лапках, булеве значення, `null`, `undefined` (а також `bigint` і `symbol`). Примітив зберігається просто в змінній і копіюється цілком: `let copy = price` дає `copy` власне значення, тож зміна `copy` не зачіпає `price`."
    en: "A simple value — a number, a string, a boolean, `null`, `undefined` (also `bigint` and `symbol`). A primitive is stored right in the variable and copied whole: `let copy = price` gives `copy` its own value, so changing `copy` does not touch `price`."
  see: [reference]
- id: reference
  term: reference
  name: { uk: "посилання", en: "reference" }
  definition:
    uk: "Те, що зберігає змінна з об’єктом чи масивом: не сам об’єкт, а «адресу», за якою його знайти. `const b = a` копіює посилання, тож обидві змінні ведуть до одного об’єкта."
    en: "What a variable holding an object or an array stores: not the object itself but an “address” to find it by. `const b = a` copies the reference, so both names lead to one object."
  see: [aliasing, reference-identity, primitive]
  example:
    code: "const wish = { price: 80 };\nconst alias = wish;   // the same object, a second name\nalias.price = 0;\nwish.price;           // 0"
- id: reference-identity
  term: reference identity
  name: { uk: "тотожність посилань", en: "reference identity" }
  definition:
    uk: "Порівняння об’єктів за тим, чи це той самий об’єкт, а не за вмістом. Саме так працює `===` для об’єктів: `{ id: \"w-01\" } === { id: \"w-01\" }` дає `false`, бо це два різні об’єкти; щоб порівняти вміст, порівнюй поля."
    en: "Comparing objects by whether they are the same object, not by their contents. This is how `===` works for objects: `{ id: \"w-01\" } === { id: \"w-01\" }` gives `false` because these are two different objects; to compare contents, compare fields."
  aliases: ["object identity", "тотожність"]
  see: [reference]
- id: mutation
  term: mutation
  name: { uk: "мутація", en: "mutation" }
  definition:
    uk: "Зміна вмісту наявного об’єкта чи масиву: `wish.price = 0`, `list.push(x)`, `delete wish.price`. Мутацію видно через кожну змінну, що веде до цього об’єкта, — зокрема через параметри функцій і інші списки."
    en: "Changing the contents of an existing object or array: `wish.price = 0`, `list.push(x)`, `delete wish.price`. A mutation is visible through every name that leads to that object — including function parameters and other lists."
  aliases: ["мутувати", "mutate"]
  see: [aliasing, immutable-update]
- id: aliasing
  term: aliasing
  name: { uk: "аліасинг", en: "aliasing" }
  definition:
    uk: "Ситуація, коли до одного об’єкта ведуть кілька посилань: дві змінні, змінна й параметр функції, два списки з тим самим записом. Через аліасинг мутація в одному місці несподівано «з’являється» в іншому."
    en: "A situation where several names lead to one object: two variables, a variable and a function parameter, two lists holding the same record. Because of aliasing, a mutation in one place unexpectedly “shows up” in another."
  aliases: ["alias", "псевдонім"]
  see: [reference, mutation]
- id: shallow-copy
  term: shallow copy
  name: { uk: "поверхнева копія", en: "shallow copy" }
  definition:
    uk: "Копія, у якій новий лише зовнішній об’єкт чи масив, а вкладені масиви й об’єкти — спільні з оригіналом, бо скопійовано посилання на них. Так копіює spread: `{ ...task }`, `[...list]`."
    en: "A copy in which only the outer object or array is new, while nested arrays and objects are shared with the original, because their references were copied. That is how spread copies: `{ ...task }`, `[...list]`."
  see: [deep-copy, spread-syntax]
  example:
    code: "const copy = { ...task };\ncopy.tags === task.tags; // true — the tags array is shared"
- id: deep-copy
  term: deep copy
  name: { uk: "глибока копія", en: "deep copy" }
  definition:
    uk: "Копія, у якій нові всі рівні: і зовнішній об’єкт, і вкладені масиви та об’єкти. Робиться через `structuredClone`; старіший спосіб — перетворення через JSON — губить функції й `undefined`. Глибока копія не є «безпечним вибором за замовчуванням»: копіюй рівно те, що змінюєш."
    en: "A copy in which every level is new: the outer object and the nested arrays and objects. It is made with `structuredClone`; the older JSON round-trip drops functions and `undefined`. A deep copy is not a “safe default”: copy exactly what you change."
  see: [shallow-copy, structured-clone]
- id: spread-syntax
  term: spread syntax
  name: { uk: "spread-синтаксис", en: "spread syntax" }
  definition:
    uk: "Запис `...`, що розкладає елементи масиву чи власні поля об’єкта в новий масив чи літерал: `[...list, item]`, `{ ...record, price: 50 }`. Копіює лише перший рівень, а поля, записані пізніше, перекривають раніші."
    en: "The `...` notation that spreads an array's elements or an object's own fields into a new array or literal: `[...list, item]`, `{ ...record, price: 50 }`. It copies only the first level, and fields written later override earlier ones."
  aliases: ["spread", "оператор розширення"]
  see: [shallow-copy, rest-pattern]
  example:
    code: "const updated = { ...wish, price: 50 }; // a new object, wish is unchanged"
- id: structured-clone
  term: structuredClone
  name: { uk: "structuredClone", en: "structuredClone" }
  definition:
    uk: "Вбудована функція, що робить глибоку копію значення: нові й зовнішній об’єкт, і всі вкладені масиви та об’єкти. Функцій скопіювати не може — кидає `DataCloneError`."
    en: "A built-in function that makes a deep copy of a value: the outer object and all nested arrays and objects are new. It cannot copy functions — it throws a `DataCloneError`."
  see: [deep-copy]
  example:
    code: "const clone = structuredClone(habit);\nclone.completions === habit.completions; // false"
- id: destructuring
  term: destructuring
  name: { uk: "деструктуризація", en: "destructuring" }
  definition:
    uk: "Короткий запис, що дістає кілька полів об’єкта (`const { name, price } = wish;`) чи елементів масиву (`const [first, second] = list;`) у змінні. Лише читає: оригінал не змінюється. Підтримує перейменування (`{ name: title }`) і значення за замовчуванням, які спрацьовують тільки для `undefined`."
    en: "A short notation that takes several fields of an object (`const { name, price } = wish;`) or elements of an array (`const [first, second] = list;`) into variables. It only reads: the original is not changed. It supports renaming (`{ name: title }`) and defaults that apply only to `undefined`."
  see: [rest-pattern, property-shorthand]
  example:
    code: "const { name, price = 0 } = wish; // price stays null if wish.price is null"
- id: rest-pattern
  term: rest pattern
  name: { uk: "rest-шаблон", en: "rest pattern" }
  definition:
    uk: "Частина деструктуризації `...назва`, що збирає «все інше» в новий об’єкт чи масив: `const { id, ...rest } = record;` дає копію без `id`, а оригінал лишається цілим."
    en: "The `...name` part of destructuring that collects “everything else” into a new object or array: `const { id, ...rest } = record;` gives a copy without `id`, and the original stays intact."
  aliases: ["rest", "rest element"]
  see: [destructuring, spread-syntax]
- id: property-shorthand
  term: property shorthand
  name: { uk: "скорочений запис властивості", en: "property shorthand" }
  definition:
    uk: "Скорочення в об’єктному літералі: якщо змінна зветься так само, як поле, пиши лише її назву — `{ title, priority }` означає `{ title: title, priority: priority }`."
    en: "A shortcut in an object literal: when a variable has the same name as the field, write just the name — `{ title, priority }` means `{ title: title, priority: priority }`."
  aliases: ["shorthand property"]
  see: [destructuring]
- id: immutable-update
  term: immutable update
  name: { uk: "оновлення без мутацій", en: "immutable update" }
  definition:
    uk: "Зміна даних через нові версії замість змін на місці: функція повертає новий масив, новий об’єкт для зміненого запису й ті самі об’єкти для незмінених. Вхідний список і його записи лишаються недоторканими."
    en: "Changing data by making new versions instead of changing it in place: a function returns a new array, a new object for the changed record and the same objects for the untouched ones. The input list and its records stay intact."
  aliases: ["незмінне оновлення"]
  see: [immutability, mutation, crud]
  example:
    code: "function updateRecord(list, id, changes) {\n  const result = [];\n  for (const record of list) {\n    result.push(record.id === id ? { ...record, ...changes } : record);\n  }\n  return result;\n}"
- id: immutability
  term: immutability
  name: { uk: "незмінність", en: "immutability" }
  definition:
    uk: "Підхід, у якому дані не змінюють на місці, а замінюють новими версіями. Тоді `===` чесно показує, що змінилося: той самий об’єкт — отже, не змінювався."
    en: "An approach in which data is not changed in place but replaced with new versions. Then `===` honestly shows what changed: the same object means it did not change."
  see: [immutable-update, reference-identity]
- id: crud
  term: CRUD
  name: { uk: "CRUD", en: "CRUD" }
  definition:
    uk: "Чотири базові операції з даними: create (створити), read (прочитати), update (змінити), delete (видалити). У проєкті курсу це додавання, показ, зміна й видалення записів."
    en: "The four basic data operations: create, read, update and delete. In the course project they are adding, showing, changing and removing records."
  see: [immutable-update]
