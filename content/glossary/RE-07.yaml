# Terms introduced in RE-07.
- id: keyboard-operable
  term: keyboard-operable
  name: { uk: "керований з клавіатури", en: "keyboard-operable" }
  aliases: ["keyboard operable", "keyboard accessible", "доступний з клавіатури"]
  definition:
    uk: "Інтерфейс, у якому кожну дію можна виконати без миші: Tab і Shift+Tab переводять фокус, Enter і Space натискають кнопки, Escape закриває відкрите, а після кожної дії фокус стоїть там, де користувач продовжить. Найпростіший шлях — справжні `<button>`, `<a href>` і поля форм замість `div` з `onClick`."
    en: "An interface in which every action can be done without a mouse: Tab and Shift+Tab move focus, Enter and Space press buttons, Escape closes what is open, and after every action focus stands where the user will continue. The simplest way there is real `<button>`, `<a href>` and form fields instead of a `div` with `onClick`."
  see: [keyboard-focus, tab-order, focus-management]
- id: react-profiler
  term: React Profiler
  name: { uk: "профілювальник React", en: "React profiler" }
  aliases: ["Profiler", "<Profiler>", "профайлер", "React performance tracks", "Components ⚛", "Scheduler ⚛"]
  definition:
    uk: "Інструменти, що міряють роботу React. Компонент `<Profiler id onRender>` після кожного commit повідомляє, скільки мілісекунд рендерилася його частина дерева. Розробницька збірка React 19.2+ додає до запису панелі Performance у Chrome доріжки Scheduler ⚛ (рендер, commit, ефекти кожного оновлення) і Components ⚛ (кожен компонент і його час). Розширення React Developer Tools має ще й вкладку Profiler."
    en: "The tools that measure React's work. The `<Profiler id onRender>` component reports after every commit how many milliseconds its part of the tree spent rendering. The development build of React 19.2+ adds the Scheduler ⚛ track (render, commit and effects of every update) and the Components ⚛ track (every component and its time) to a Chrome Performance recording. The React Developer Tools extension also has a Profiler tab."
  see: [performance-profile, render-cause, re-render]
- id: render-cause
  term: render cause
  name: { uk: "причина рендеру", en: "render cause" }
  aliases: ["why did this render", "чому рендериться", "render reason"]
  definition:
    uk: "Те, через що React знову викликає компонент. Їх три: змінився власний стан компонента, рендерився його батько (тоді рендеряться всі діти, навіть із тими самими props) або змінилося значення context, який він читає. Зміна props — не окрема причина: нові props з’являються лише з рендером батька."
    en: "What makes React call a component again. There are three: the component's own state changed, its parent rendered (then all children render, even with the same props), or the value of a context it reads changed. A props change is not a separate cause: new props appear only with a parent render."
  see: [re-render, react-profiler]
- id: commit-duration
  term: commit duration
  name: { uk: "тривалість commit", en: "commit duration" }
  aliases: ["commit time", "час commit"]
  definition:
    uk: "Час, за який React застосовує до DOM зміни, знайдені під час рендеру. На доріжці Scheduler ⚛ це смужка `Commit`, окремо від `Render` і `Remaining Effects`. Довгий commit означає, що одне оновлення вставляє, змінює чи прибирає забагато вузлів; `actualDuration` компонента `<Profiler>` його не враховує."
    en: "The time React spends applying the changes found during render to the DOM. On the Scheduler ⚛ track it is the `Commit` bar, separate from `Render` and `Remaining Effects`. A long commit means one update inserts, changes or removes too many nodes; the `actualDuration` of `<Profiler>` does not include it."
  see: [commit-phase, react-profiler]
