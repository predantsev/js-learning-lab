# Terms introduced in RE-07.
- id: keyboard-operable
  term: keyboard-operable
  name: { uk: "керований з клавіатури", en: "keyboard-operable" }
  aliases: ["keyboard operable", "keyboard accessible", "доступний з клавіатури"]
  definition:
    uk: "Інтерфейс, у якому кожну дію можна виконати без миші: Tab і Shift+Tab переводять фокус, Enter і Space натискають кнопки, Escape закриває відкрите, а після кожної дії фокус стоїть там, де користувач продовжить. Найпростіший шлях — справжні `<button>`, `<a href>` і поля форм замість `div` з `onClick`."
    en: "An interface in which every action can be done without a mouse: Tab and Shift+Tab move focus, Enter and Space press buttons, Escape closes what is open, and after every action focus stands where the user will continue. The simplest way there is real `<button>`, `<a href>` and form fields instead of a `div` with `onClick`."
  see: [keyboard-focus, tab-order, focus-management]
- id: react-profiler
  term: React Profiler
  name: { uk: "профілювальник React", en: "React profiler" }
  aliases: ["Profiler", "<Profiler>", "профайлер", "React performance tracks", "Components ⚛", "Scheduler ⚛"]
  definition:
    uk: "Інструменти, що міряють роботу React. Компонент `<Profiler id onRender>` після кожного commit повідомляє, скільки мілісекунд рендерилася його частина дерева. Розробницька збірка React 19.2+ додає до запису панелі Performance у Chrome доріжки Scheduler ⚛ (рендер, commit, ефекти кожного оновлення) і Components ⚛ (кожен компонент і його час). Розширення React Developer Tools має ще й вкладку Profiler."
    en: "The tools that measure React's work. The `<Profiler id onRender>` component reports after every commit how many milliseconds its part of the tree spent rendering. The development build of React 19.2+ adds the Scheduler ⚛ track (render, commit and effects of every update) and the Components ⚛ track (every component and its time) to a Chrome Performance recording. The React Developer Tools extension also has a Profiler tab."
  see: [performance-profile, render-cause, re-render]
- id: render-cause
  term: render cause
  name: { uk: "причина рендеру", en: "render cause" }
  aliases: ["why did this render", "чому рендериться", "render reason"]
  definition:
    uk: "Те, через що React знову викликає компонент. Їх три: змінився власний стан компонента, рендерився його батько (тоді рендеряться всі діти, навіть із тими самими props) або змінилося значення context, який він читає. Зміна props — не окрема причина: нові props з’являються лише з рендером батька."
    en: "What makes React call a component again. There are three: the component's own state changed, its parent rendered (then all children render, even with the same props), or the value of a context it reads changed. A props change is not a separate cause: new props appear only with a parent render."
  see: [re-render, react-profiler]
- id: commit-duration
  term: commit duration
  name: { uk: "тривалість commit", en: "commit duration" }
  aliases: ["commit time", "час commit"]
  definition:
    uk: "Час, за який React застосовує до DOM зміни, знайдені під час рендеру. На доріжці Scheduler ⚛ це смужка `Commit`, окремо від `Render` і `Remaining Effects`. Довгий commit означає, що одне оновлення вставляє, змінює чи прибирає забагато вузлів; `actualDuration` компонента `<Profiler>` його не враховує."
    en: "The time React spends applying the changes found during render to the DOM. On the Scheduler ⚛ track it is the `Commit` bar, separate from `Render` and `Remaining Effects`. A long commit means one update inserts, changes or removes too many nodes; the `actualDuration` of `<Profiler>` does not include it."
  see: [commit-phase, react-profiler]
- id: referential-stability
  term: referential stability
  name: { uk: "стабільна ідентичність", en: "stable identity" }
  aliases: ["referential stability", "stable identity", "stable reference", "стабільне посилання"]
  definition:
    uk: "Властивість значення лишатися тим самим об’єктом між рендерами, доки його зміст справді не змінився. React порівнює залежності ефектів, значення context і props через `Object.is`, тож об’єкт, масив чи функція, створені в тілі компонента, для нього нові на кожному рендері. Стабільність дають сталі на рівні модуля, стан, сеттери `useState` і похідні значення, обчислені один раз у власника."
    en: "The property of a value to stay the same object between renders until its contents really change. React compares effect dependencies, context values and props with `Object.is`, so an object, array or function created in a component's body is new to it on every render. Stability comes from module-level constants, state, `useState` setters and derived values computed once in the owner."
  see: [reference-identity, dependency-array, re-render]
- id: react-memo
  term: memo
  name: { uk: "memo", en: "memo" }
  aliases: ["React.memo", "memo()", "memoized component", "мемоізований компонент"]
  definition:
    uk: "Функція React, що обгортає компонент: коли батько рендериться, React порівнює кожен prop із попереднім через `Object.is` і, якщо всі ті самі, пропускає рендер цього компонента. Допомагає лише тоді, коли props справді стабільні — нова вбудована функція чи об’єкт у props робить її марною. Застосовують після вимірювання, а не до всіх компонентів."
    en: "A React function that wraps a component: when the parent renders, React compares every prop with the previous one through `Object.is` and, if all are the same, skips rendering this component. It helps only when the props really are stable — a new inline function or object in the props makes it useless. Apply it after a measurement, not to every component."
  see: [referential-stability, use-callback, re-render]
- id: use-memo
  term: useMemo
  name: { uk: "useMemo", en: "useMemo" }
  aliases: ["useMemo()", "memoized value"]
  definition:
    uk: "Хук `useMemo(calculate, deps)`: повертає збережений результат `calculate`, поки жодна залежність не змінилася за `Object.is`, і обчислює знову, коли змінилася. Це кеш, а не гарантія: React може викинути збережене значення, а залежність, створену на кожному рендері, кеш не втримає. Виправданий для обчислення, яке запис показав дорогим."
    en: "The hook `useMemo(calculate, deps)`: returns the kept result of `calculate` while no dependency changed by `Object.is`, and calculates again when one did. It is a cache, not a guarantee: React may throw the kept value away, and a dependency created on every render keeps nothing cached. Justified for a calculation a recording showed to be expensive."
  see: [react-memo, dependency-array, derived-value]
- id: use-callback
  term: useCallback
  name: { uk: "useCallback", en: "useCallback" }
  aliases: ["useCallback()", "memoized callback", "стабільна функція"]
  definition:
    uk: "Хук `useCallback(fn, deps)`: повертає ту саму функцію між рендерами, поки не змінилися залежності. Сам нічого не прискорює — корисний, коли функцію отримує компонент у `memo` або вона стоїть у залежностях ефекту. Функція-оновлювач `setX((current) => …)` дозволяє обійтися без залежностей і не читати застарілий стан."
    en: "The hook `useCallback(fn, deps)`: returns the same function between renders until the dependencies change. It speeds up nothing by itself — it is useful when a component in `memo` receives the function or when it is in an effect's dependencies. An updater function `setX((current) => …)` lets it do without dependencies and avoid reading stale state."
  see: [react-memo, referential-stability, updater-function]
