# Terms introduced in RE-07.
- id: keyboard-operable
  term: keyboard-operable
  name: { uk: "керований з клавіатури", en: "keyboard-operable" }
  aliases: ["keyboard operable", "keyboard accessible", "доступний з клавіатури"]
  definition:
    uk: "Інтерфейс, у якому кожну дію можна виконати без миші: Tab і Shift+Tab переводять фокус, Enter і Space натискають кнопки, Escape закриває відкрите, а після кожної дії фокус стоїть там, де користувач продовжить. Найпростіший шлях — справжні `<button>`, `<a href>` і поля форм замість `div` з `onClick`."
    en: "An interface in which every action can be done without a mouse: Tab and Shift+Tab move focus, Enter and Space press buttons, Escape closes what is open, and after every action focus stands where the user will continue. The simplest way there is real `<button>`, `<a href>` and form fields instead of a `div` with `onClick`."
  see: [keyboard-focus, tab-order, focus-management]
