# Terms introduced in RE-06.
- id: server-state
  term: server state
  name: { uk: "серверний стан", en: "server state" }
  aliases: ["server data", "серверні дані"]
  definition:
    uk: "Дані, власник яких — сервер, а не компонент: список бажань у базі, справи іншого користувача. Компонент має лише копію, отриману запитом; щоб її отримати, треба чекати, а поки ти дивишся на копію, оригінал на сервері може змінитися."
    en: "Data owned by a server, not by the component: a wish list in a database, another user's tasks. The component only has a copy obtained by a request; getting it means waiting, and while you look at the copy the original on the server may change."
  see: [request-lifecycle]
- id: request-lifecycle
  term: request lifecycle
  name: { uk: "життєвий цикл запиту", en: "request lifecycle" }
  definition:
    uk: "Шлях одного запиту в компоненті React: рендер зі статусом `loading` → commit → ефект запускає запит → приходить відповідь або помилка → setter стану → новий рендер зі статусом `success` або `error`. Перший рендер завжди відбувається до відповіді."
    en: "The path of one request in a React component: a render with status `loading` → commit → the effect starts the request → an answer or an error arrives → a state setter → a new render with status `success` or `error`. The first render always happens before the answer."
  see: [server-state, use-effect]
- id: ignore-flag
  term: ignore flag
  name: { uk: "прапорець ігнорування", en: "ignore flag" }
  aliases: ["ignore", "let ignore"]
  definition:
    uk: "Локальна змінна ефекту (`let ignore = false`), яку cleanup ставить у `true`. Відповідь запиту оновлює стан, лише поки прапорець `false`, тож результат старого запуску ефекту викидається. Сам запит при цьому доходить до кінця — на відміну від скасування через `AbortController`."
    en: "A local variable of an effect (`let ignore = false`) that the cleanup sets to `true`. The request's answer updates state only while the flag is `false`, so the result of an old effect run is thrown away. The request itself still runs to the end — unlike cancellation with an `AbortController`."
  see: [stale-response, abort-controller, effect-cleanup]
  example:
    code: "useEffect(() => {\n  let ignore = false;\n  loadNotes(day).then((notes) => {\n    if (!ignore) setNotes(notes);\n  });\n  return () => {\n    ignore = true;\n  };\n}, [day]);"
- id: refetch
  term: refetch
  name: { uk: "повторний запит", en: "refetch" }
  aliases: ["re-fetch", "refetching", "перезапит"]
  definition:
    uk: "Новий запит тих самих даних, які вже колись завантажили: після натискання «Оновити», повернення на екран, зміни на сервері. Дані з попередньої відповіді при цьому зазвичай лишаються на екрані, доки не прийде нова."
    en: "A new request for the same data that was already loaded once: after pressing “Refresh”, coming back to a screen, a change on the server. The data of the earlier answer usually stays on the screen until the new one arrives."
  see: [background-refresh, server-state]
- id: background-refresh
  term: background refresh
  name: { uk: "фонове оновлення", en: "background refresh" }
  definition:
    uk: "Повторний запит, поки на екрані вже є дані з попередньої відповіді. Інтерфейс лишає ці дані видимими й лише тихо позначає оновлення («Оновлюю…»); якщо оновлення провалиться, старі дані теж лишаються, а повідомлення каже, що вони можуть бути не найсвіжішими."
    en: "A refetch while the screen already shows data from an earlier answer. The interface keeps that data visible and only quietly marks the refresh (“Refreshing…”); if the refresh fails, the old data stays too, and a message says it may not be the latest."
  see: [refetch, live-region]
- id: data-query
  term: query
  name: { uk: "query (читання даних)", en: "query (data read)" }
  aliases: ["data query", "queries", "запит на читання"]
  definition:
    uk: "Операція, що лише читає дані з сервера (`GET`): список, один запис, результати пошуку. Її можна безпечно повторювати й кешувати; запускає її екран, якому потрібні дані, — ефект або шар даних, коли змінюються параметри."
    en: "An operation that only reads data from the server (`GET`): a list, one record, search results. It can be repeated and cached safely; the screen that needs the data starts it — an effect or a data layer, when the parameters change."
  see: [data-mutation, safe-method]
- id: data-mutation
  term: mutation
  name: { uk: "mutation (зміна даних)", en: "mutation (data change)" }
  aliases: ["mutations", "data mutation", "мутація"]
  definition:
    uk: "Операція, що змінює дані на сервері (`POST`, `PUT`, `PATCH`, `DELETE`): створити, змінити, видалити. Має побічний ефект, тому запускається один раз на одну дію людини — з обробника події, — не кешується й не повторюється мовчки після збою. Після успіху позначає застарілими queries, яких стосується зміна."
    en: "An operation that changes data on the server (`POST`, `PUT`, `PATCH`, `DELETE`): create, change, remove. It has a side effect, so it runs once per action of the person — from an event handler — is not cached and is not repeated silently after a failure. After success it marks the queries the change affects as stale."
  see: [data-query, idempotency]
