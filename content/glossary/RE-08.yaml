# Terms introduced in RE-08.
- id: checkpoint-rubric
  term: checkpoint rubric
  name: { uk: "рубрика контрольної точки", en: "checkpoint rubric" }
  aliases: ["rubric", "рубрика", "CP-RE rubric", "рубрика CP-RE"]
  definition:
    uk: "Список рядків, за якими оцінюють контрольну точку, і для кожного — доказ, що його закриває. У CP-RE це поведінка (тести дій користувача), типи (`tsc` у строгому режимі), cleanup ефектів (тест у StrictMode, що падає без cleanup), доступні маршрути (прохід клавіатурою) і збережені дані CP-JS (ті самі записи на адресі React-версії). Один доказ не закриває чужого рядка."
    en: "The list of rows by which a checkpoint is assessed, each with the evidence that closes it. In CP-RE they are behavior (user-action tests), types (`tsc` in strict mode), effect cleanup (a StrictMode test that fails without the cleanup), accessible routes (a keyboard walk-through) and retained CP-JS data (the same records at the React version's address). One piece of evidence does not close another row."
  see: [checkpoint, user-action-test, end-to-end-test]
