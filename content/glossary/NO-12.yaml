# Terms introduced in NO-12 (operating the server). One file per unit keeps parallel authoring conflict-free.
- id: metric
  term: metric
  name: { uk: "метрика (metric)", en: "metric" }
  definition:
    uk: "Число, яке сервер сам підсумовує, поки працює, і віддає, наприклад, на `GET /metrics`: скільки було запитів, скільки з них закінчилися помилкою, як довго вони тривали. Рядок логу розповідає про один запит, метрика — про всі запити разом, тож за нею видно, чи сервер зараз повільний або часто помиляється."
    en: "A number the server totals by itself while it runs and serves, for example, at `GET /metrics`: how many requests there were, how many ended with an error, how long they took. A log line tells about one request, a metric about all requests together, so it shows whether the server is slow or failing often right now."
  example:
    code: "http_requests_total{route=\"/expenses\",status=\"200\"} 100"
  see: [latency-histogram, latency-percentile]
- id: latency-histogram
  term: latency histogram
  name: { uk: "гістограма затримки (latency histogram)", en: "latency histogram" }
  definition:
    uk: "Метрика, що запам’ятовує тривалості запитів одного маршруту — усі значення або кількості в «кошиках» (до 25 мс, до 100 мс…), — щоб потім назвати їхні перцентилі. На відміну від середнього, з неї видно повільний хвіст."
    en: "A metric that remembers the durations of a route’s requests — every value, or counts in “buckets” (up to 25 ms, up to 100 ms…) — so that it can name their percentiles later. Unlike an average, it shows the slow tail."
  see: [latency-percentile, metric]
- id: latency-percentile
  term: latency percentile
  name: { uk: "перцентиль затримки (latency percentile)", en: "latency percentile" }
  aliases: [p50, p95, p99]
  definition:
    uk: "Тривалість, якої не перевищує заданий відсоток запитів: p95 = 20 мс означає, що 95 % запитів тривали не довше 20 мс. Методом найближчого рангу p-й перцентиль — це значення на місці ⌈p / 100 × n⌉ серед n відсортованих тривалостей. p50 описує звичайний запит, p95 і p99 — повільний хвіст, який ховає середнє."
    en: "The duration that a given percentage of requests does not exceed: p95 = 20 ms means 95 % of requests took 20 ms or less. By the nearest-rank method the p-th percentile is the value at place ⌈p / 100 × n⌉ among n sorted durations. p50 describes a typical request, p95 and p99 the slow tail that an average hides."
  see: [latency-histogram]
- id: trace-span
  term: span
  name: { uk: "span (крок трасування)", en: "span" }
  aliases: [trace span]
  definition:
    uk: "Один виміряний крок усередині запиту — розбір адреси, читання з репозиторію, серіалізація — з назвою, тривалістю та request id запиту. Набір span одного запиту — його трасування (trace): за ним видно, який крок забрав час."
    en: "One timed step inside a request — reading the address, reading from the repository, serializing — with a name, a duration and the request’s id. The set of spans of one request is its trace: it shows which step took the time."
  example:
    code: "{\"requestId\":\"r-0040\",\"span\":\"repository\",\"ms\":7.8}"
  see: [metric]
- id: node-inspector
  term: Node.js inspector
  name: { uk: "інспектор Node.js (inspector)", en: "Node.js inspector" }
  aliases: [--inspect]
  definition:
    uk: "Порт налагодження, який відкриває `node --inspect` (типово `127.0.0.1:9229`). До нього під’єднуються Chrome DevTools (`chrome://inspect`) або VS Code: ставлять точки зупинки, розглядають змінні й стек викликів, записують профілі. Пауза зупиняє весь процес, тож і всі інші запити сервера. Хто дістався до порту, може виконати будь-який код, тому інспектор ніколи не відкривають на публічній адресі."
    en: "The debugging port that `node --inspect` opens (by default `127.0.0.1:9229`). Chrome DevTools (`chrome://inspect`) or VS Code attach to it: they set breakpoints, look at variables and the call stack, record profiles. A pause stops the whole process, so every other request of the server too. Whoever reaches the port can run any code, so the inspector is never opened on a public address."
  example:
    code: "node --inspect server.mjs   # Debugger listening on ws://127.0.0.1:9229/…"
  see: [breakpoint, self-time]
- id: self-time
  term: self time
  name: { uk: "власний час (self time)", en: "self time" }
  definition:
    uk: "Час, коли функція сама була на вершині стеку викликів, — без функцій, які вона викликала (їх разом із нею враховує total time). У CPU-профілі це сума інтервалів вибірки, у яких на вершині був її вузол. Велика робота ховається там, де великий self time."
    en: "The time a function itself was on top of the call stack — without the functions it called (total time counts those together with it). In a CPU profile it is the sum of the sampling intervals in which its node was on top. Big work hides where self time is large."
  see: [performance-profile, node-inspector]
- id: schema-assertion
  term: schema assertion
  name: { uk: "твердження про схему (schema assertion)", en: "schema assertion" }
  definition:
    uk: "Перевірка в тесті, що проводить тіло відповіді через схему контракту, яка існує під час виконання, і падає з повідомленням, де видно шлях і значення: `[1].completionCount: expected number, got \"3\"`. На відміну від типу TypeScript, вона перевіряє справжні дані, а на відміну від перевірки статусу — їхню форму."
    en: "A check in a test that puts a response body through a contract schema that exists at run time and fails with a message showing the path and the value: `[1].completionCount: expected number, got \"3\"`. Unlike a TypeScript type, it checks real data, and unlike a status check, their shape."
  see: [schema-contract, api-versioning]
- id: node-env
  term: NODE_ENV
  name: { uk: "NODE_ENV", en: "NODE_ENV" }
  definition:
    uk: "Змінна середовища, яку сам Node.js не читає: це домовленість для бібліотек і npm (Express за `production` кешує шаблони, `npm install` за `production` типово не ставить devDependencies). Документація Node.js радить запускати сервер із `NODE_ENV=production` і не робити так, щоб власний код поводився інакше залежно від неї. Сама вона сервер production-готовим не робить."
    en: "An environment variable Node.js itself does not read: a convention for libraries and npm (Express caches templates under `production`, `npm install` skips devDependencies under `production` by default). The Node.js documentation advises running a server with `NODE_ENV=production` and not making your own code behave differently depending on it. By itself it does not make a server production-ready."
  example:
    code: "NODE_ENV=production PORT=7330 DATA_DIR=/srv/planner/data node release/server.js"
  see: [environment-variable, production-build]
- id: release-record
  term: release record
  name: { uk: "запис релізу (release record)", en: "release record" }
  aliases: [artifact checksum]
  definition:
    uk: "Невеликий файл поруч з артефактом збірки: назва, версія, коміт, версія Node, розмір і sha256 саме цих байтів, а також команди, якими будь-хто перевірить свій файл (`shasum -a 256 …`). Повторна збірка того самого коміту може дати інші байти, тож запускають, перевіряють і відкочуються до артефакту за його контрольною сумою, а не перезбирають."
    en: "A small file next to a build artifact: the name, version, commit, Node version, size and sha256 of exactly these bytes, plus the commands anyone can use to check their file (`shasum -a 256 …`). Rebuilding the same commit can give other bytes, so you start, verify and roll back to an artifact by its checksum instead of rebuilding it."
  example:
    code: "{ \"version\": \"1.3.0\", \"commit\": \"13f841e\", \"sha256\": \"0065…82ba\" }"
  see: [build-artifact, checksum, ci-pipeline]
- id: liveness-check
  term: liveness check
  name: { uk: "перевірка liveness (liveness check)", en: "liveness check" }
  aliases: [/livez]
  definition:
    uk: "Маршрут на кшталт `GET /livez`, що відповідає `200`, поки процес живий і обробляє запити. Якщо він не відповідає, процес перезапускають. Від сховища чи інших сервісів він не залежить: інакше збій диска перезапускав би здоровий процес по колу."
    en: "A route such as `GET /livez` that answers `200` while the process is alive and handling requests. If it does not answer, the process is restarted. It does not depend on the storage or other services: otherwise a disk failure would restart a healthy process in a loop."
  see: [readiness-check]
- id: readiness-check
  term: readiness check
  name: { uk: "перевірка readiness (readiness check)", en: "readiness check" }
  aliases: [/readyz]
  definition:
    uk: "Маршрут на кшталт `GET /readyz`, що відповідає `200`, лише коли сервіс справді може обслуговувати запити: сховище відкрите, сервер не завершує роботу. Інакше — `503`, і запити на цей процес не надсилають, але й не перезапускають його."
    en: "A route such as `GET /readyz` that answers `200` only when the service can really serve requests: the storage is open and the server is not shutting down. Otherwise `503`, and requests are not sent to this process, but it is not restarted either."
  see: [liveness-check, graceful-shutdown]
- id: graceful-shutdown
  term: graceful shutdown
  name: { uk: "коректне завершення (graceful shutdown)", en: "graceful shutdown" }
  definition:
    uk: "Зупинка сервера за сигналом (`SIGTERM`, `SIGINT`) без втрат: readiness стає `503`, `server.close()` перестає приймати нові з’єднання, запити в роботі завершуються до крайнього строку, сховище записується на диск, і процес виходить із кодом `0`. Якщо строк минув, з’єднання обривають і виходять із ненульовим кодом, щоб це було видно."
    en: "Stopping a server on a signal (`SIGTERM`, `SIGINT`) without losses: readiness turns `503`, `server.close()` stops accepting new connections, the requests in flight finish within a deadline, the storage is written to disk, and the process exits with code `0`. If the deadline passes, the connections are cut and the process exits with a non-zero code so that it is visible."
  example:
    code: "process.on('SIGTERM', shutdown); // close → drain → flush → exit(0)"
  see: [readiness-check, process-exit-code]
