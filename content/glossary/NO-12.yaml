# Terms introduced in NO-12 (operating the server). One file per unit keeps parallel authoring conflict-free.
- id: metric
  term: metric
  name: { uk: "метрика (metric)", en: "metric" }
  definition:
    uk: "Число, яке сервер сам підсумовує, поки працює, і віддає, наприклад, на `GET /metrics`: скільки було запитів, скільки з них закінчилися помилкою, як довго вони тривали. Рядок логу розповідає про один запит, метрика — про всі запити разом, тож за нею видно, чи сервер зараз повільний або часто помиляється."
    en: "A number the server totals by itself while it runs and serves, for example, at `GET /metrics`: how many requests there were, how many ended with an error, how long they took. A log line tells about one request, a metric about all requests together, so it shows whether the server is slow or failing often right now."
  example:
    code: "http_requests_total{route=\"/expenses\",status=\"200\"} 100"
  see: [latency-histogram, latency-percentile]
- id: latency-histogram
  term: latency histogram
  name: { uk: "гістограма затримки (latency histogram)", en: "latency histogram" }
  definition:
    uk: "Метрика, що запам’ятовує тривалості запитів одного маршруту — усі значення або кількості в «кошиках» (до 25 мс, до 100 мс…), — щоб потім назвати їхні перцентилі. На відміну від середнього, з неї видно повільний хвіст."
    en: "A metric that remembers the durations of a route’s requests — every value, or counts in “buckets” (up to 25 ms, up to 100 ms…) — so that it can name their percentiles later. Unlike an average, it shows the slow tail."
  see: [latency-percentile, metric]
- id: latency-percentile
  term: latency percentile
  name: { uk: "перцентиль затримки (latency percentile)", en: "latency percentile" }
  aliases: [p50, p95, p99]
  definition:
    uk: "Тривалість, якої не перевищує заданий відсоток запитів: p95 = 20 мс означає, що 95 % запитів тривали не довше 20 мс. Методом найближчого рангу p-й перцентиль — це значення на місці ⌈p / 100 × n⌉ серед n відсортованих тривалостей. p50 описує звичайний запит, p95 і p99 — повільний хвіст, який ховає середнє."
    en: "The duration that a given percentage of requests does not exceed: p95 = 20 ms means 95 % of requests took 20 ms or less. By the nearest-rank method the p-th percentile is the value at place ⌈p / 100 × n⌉ among n sorted durations. p50 describes a typical request, p95 and p99 the slow tail that an average hides."
  see: [latency-histogram]
- id: trace-span
  term: span
  name: { uk: "span (крок трасування)", en: "span" }
  aliases: [trace span]
  definition:
    uk: "Один виміряний крок усередині запиту — розбір адреси, читання з репозиторію, серіалізація — з назвою, тривалістю та request id запиту. Набір span одного запиту — його трасування (trace): за ним видно, який крок забрав час."
    en: "One timed step inside a request — reading the address, reading from the repository, serializing — with a name, a duration and the request’s id. The set of spans of one request is its trace: it shows which step took the time."
  example:
    code: "{\"requestId\":\"r-0040\",\"span\":\"repository\",\"ms\":7.8}"
  see: [metric]
- id: node-inspector
  term: Node.js inspector
  name: { uk: "інспектор Node.js (inspector)", en: "Node.js inspector" }
  aliases: [--inspect]
  definition:
    uk: "Порт налагодження, який відкриває `node --inspect` (типово `127.0.0.1:9229`). До нього під’єднуються Chrome DevTools (`chrome://inspect`) або VS Code: ставлять точки зупинки, розглядають змінні й стек викликів, записують профілі. Пауза зупиняє весь процес, тож і всі інші запити сервера. Хто дістався до порту, може виконати будь-який код, тому інспектор ніколи не відкривають на публічній адресі."
    en: "The debugging port that `node --inspect` opens (by default `127.0.0.1:9229`). Chrome DevTools (`chrome://inspect`) or VS Code attach to it: they set breakpoints, look at variables and the call stack, record profiles. A pause stops the whole process, so every other request of the server too. Whoever reaches the port can run any code, so the inspector is never opened on a public address."
  example:
    code: "node --inspect server.mjs   # Debugger listening on ws://127.0.0.1:9229/…"
  see: [breakpoint, self-time]
- id: self-time
  term: self time
  name: { uk: "власний час (self time)", en: "self time" }
  definition:
    uk: "Час, коли функція сама була на вершині стеку викликів, — без функцій, які вона викликала (їх разом із нею враховує total time). У CPU-профілі це сума інтервалів вибірки, у яких на вершині був її вузол. Велика робота ховається там, де великий self time."
    en: "The time a function itself was on top of the call stack — without the functions it called (total time counts those together with it). In a CPU profile it is the sum of the sampling intervals in which its node was on top. Big work hides where self time is large."
  see: [performance-profile, node-inspector]
