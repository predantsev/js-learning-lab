# Terms introduced in RN-08. One file per unit keeps parallel authoring conflict-free.
- id: build-provenance
  term: build provenance
  name: { uk: "походження збірки й доказу", en: "build provenance" }
  aliases: ["evidence provenance", "provenance", "походження доказу"]
  definition:
    uk: "Відомості, за якими інша людина може повторити перевірку й переконатися, що доказ стосується саме цієї збірки: id збірки (commit, з якого її зібрано), версія, відбиток сертифіката підпису (SHA-256), ціль, що зроблено, що побачено, і чия це робота — зроблено самостійно, з допомогою, надано іншими чи пропущено. Доказ без походження — лише враження."
    en: "The details with which another person can repeat a check and confirm that the evidence is about exactly this build: the build id (the commit it was built from), the version, the signing certificate fingerprint (SHA-256), the target, what was done, what was observed, and whose work it is — learner-authored, assisted, supplied or skipped. Evidence without provenance is only an impression."
  see: [declared-target, release-build, skip-record]
- id: skip-record
  term: skip record
  name: { uk: "запис пропуску", en: "skip record" }
  aliases: ["skipped evidence", "unperformed check", "пропущена перевірка"]
  definition:
    uk: "Явний запис про перевірку, яку **не виконано**: яка перевірка, на якій цілі, чому (ціль не підтримується, бракує інструментів чи часу) і що потрібно, щоб повернутися. У нього немає результату, і він ніколи не зараховується як пройдена перевірка — навіть коли код спільний для обох платформ. Він лишається видимим, щоб до нього можна було повернутися."
    en: "An explicit record of a check that was **not performed**: which check, on which target, why (the target is unsupported, tools or time are missing) and what it takes to come back. It has no outcome, and it never counts as a passed check — not even when the code is shared by both platforms. It stays visible so that you can come back to it."
  example:
    code: "{ check: \"performance\", target: androidDevice, provenance: \"skipped\", reason: \"no physical device yet\", revisit: \"measure on a phone\" }"
  see: [build-provenance, declared-target]
