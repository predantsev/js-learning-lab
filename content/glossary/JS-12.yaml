# Terms introduced in JS-12. One file per unit keeps parallel authoring conflict-free.
- id: code-unit
  term: code unit
  name: { uk: "code unit", en: "code unit" }
  definition:
    uk: "Найменший шматочок, з яких JavaScript складає текст (16 біт, кодування UTF-16). `length` рахує саме code units, а `text[i]` читає один code unit. Кирилична чи латинська літера — один code unit, емодзі — два."
    en: "The smallest piece JavaScript builds text from (16 bits, UTF-16 encoding). `length` counts code units, and `text[i]` reads one code unit. A Cyrillic or Latin letter is one code unit, an emoji is two."
  see: [code-point, surrogate-pair]
  example:
    code: "\"Київ\".length; // 4\n\"🐈\".length;   // 2"
- id: code-point
  term: code point
  name: { uk: "code point", en: "code point" }
  definition:
    uk: "Номер символу в Unicode. Один code point займає один або два code units. `for…of` і spread `[...text]` перебирають текст саме по code points, тому не розрізають емодзі."
    en: "The number of a character in Unicode. One code point takes one or two code units. `for…of` and spread `[...text]` walk text by code points, so they never cut an emoji apart."
  see: [code-unit, grapheme-cluster]
  example:
    code: "[...\"🐈🐕\"].length; // 2 (while \"🐈🐕\".length is 4)"
- id: surrogate-pair
  term: surrogate pair
  name: { uk: "сурогатна пара", en: "surrogate pair" }
  definition:
    uk: "Два code units, які разом записують один code point поза першими 65 536 номерами Unicode — наприклад, емодзі. Окрема половина пари — зламаний символ, тому текст не можна різати між ними."
    en: "Two code units that together encode one code point beyond the first 65,536 Unicode numbers — an emoji, for example. One half of a pair alone is a broken character, so text must not be cut between them."
  see: [code-unit, code-point]
  example:
    code: "\"🐈\".slice(0, 1); // half of the pair: a broken character"
- id: grapheme-cluster
  term: grapheme cluster
  name: { uk: "grapheme cluster", en: "grapheme cluster" }
  aliases: ["видимий символ", "visible character"]
  definition:
    uk: "Те, що людина бачить як один символ. Він може складатися з кількох code points: літера й комбінований знак наголосу, емодзі з модифікатором кольору шкіри. Ні `length`, ні `[...text]` їх не рахують; для цього є `Intl.Segmenter`."
    en: "What a person sees as one character. It can consist of several code points: a letter with a combining accent, an emoji with a skin-tone modifier. Neither `length` nor `[...text]` counts these; `Intl.Segmenter` does."
  see: [code-point]
  example:
    code: "[...\"e\\u0301\"].length; // 2 code points, shown as one é"
- id: unicode-normalization
  term: Unicode normalization
  name: { uk: "нормалізація Unicode", en: "Unicode normalization" }
  aliases: ["normalize", "NFC"]
  definition:
    uk: "Зведення тексту до однієї з канонічних форм, щоб однаково видимі літери мали однаковий запис. `text.normalize(\"NFC\")` повертає новий текст, де пари «літера + знак» замінено готовими літерами; `\"NFD\"` — навпаки, розкладає їх."
    en: "Bringing text to one of its canonical forms so that letters that look the same are also stored the same. `text.normalize(\"NFC\")` returns new text in which “letter + mark” pairs are replaced by ready-made letters; `\"NFD\"` does the opposite and splits them."
  see: [code-point, search-key]
  example:
    code: "\"e\\u0301\" === \"\\u00e9\";                  // false\n\"e\\u0301\".normalize(\"NFC\") === \"\\u00e9\"; // true"
- id: search-key
  term: search key
  name: { uk: "ключ для пошуку", en: "search key" }
  definition:
    uk: "Окрема форма тексту, яку використовують лише для порівняння: нормалізована, без пробілів на краях, у нижньому регістрі. Її однаково роблять і з запиту, і з поля запису, а сам запис не змінюють."
    en: "A separate form of text used only for comparing: normalized, without spaces at the edges, in lower case. It is made the same way from the query and from the record’s field, and the record itself is not changed."
  see: [unicode-normalization]
- id: floating-point
  term: floating-point number
  name: { uk: "число з рухомою комою", en: "floating-point number" }
  aliases: ["floating point", "IEEE 754", "double"]
  definition:
    uk: "Спосіб зберігати дробові числа у двійковому вигляді у 64 бітах (стандарт IEEE 754). Більшість десяткових дробів, як-от `0.1`, зберігаються як найближче можливе число, тож результати дій можуть мати крихітну похибку."
    en: "A way of storing fractional numbers in binary in 64 bits (the IEEE 754 standard). Most decimal fractions, such as `0.1`, are stored as the nearest possible number, so results of calculations can carry a tiny error."
  see: [safe-integer]
  example:
    code: "0.1 + 0.2; // 0.30000000000000004"
- id: nan
  term: NaN
  name: { uk: "NaN", en: "NaN" }
  aliases: ["not a number"]
  definition:
    uk: "Особливе числове значення «не число»: результат дії без сенсу (`0 / 0`, `Number(\"abc\")`). Має тип `\"number\"`, поширюється на все, що з ним рахують, і не дорівнює нічому, навіть собі. Розпізнається через `Number.isNaN`."
    en: "A special numeric value meaning “not a number”: the result of a meaningless operation (`0 / 0`, `Number(\"abc\")`). It is of type `\"number\"`, spreads into everything calculated with it and is equal to nothing, not even itself. It is recognized with `Number.isNaN`."
  see: [infinity]
  example:
    code: "NaN === NaN;         // false\nNumber.isNaN(0 / 0); // true"
- id: infinity
  term: Infinity
  name: { uk: "Infinity", en: "Infinity" }
  definition:
    uk: "Числові значення `Infinity` і `-Infinity`, більші (менші) за будь-яке число. Їх дає, наприклад, ділення ненульового числа на нуль — помилки при цьому не виникає."
    en: "The numeric values `Infinity` and `-Infinity`, larger (smaller) than any number. Dividing a non-zero number by zero gives one of them, for example — no error is raised."
  see: [nan]
  example:
    code: "1 / 0;  // Infinity\n-1 / 0; // -Infinity"
- id: safe-integer
  term: safe integer
  name: { uk: "безпечне ціле число", en: "safe integer" }
  aliases: ["MAX_SAFE_INTEGER"]
  definition:
    uk: "Ціле число, яке JavaScript зберігає точно й відрізняє від сусідніх: від `-(2^53 - 1)` до `Number.MAX_SAFE_INTEGER` (9 007 199 254 740 991). За цією межею сусідні цілі зливаються; для більших цілих є BigInt."
    en: "A whole number that JavaScript stores exactly and can tell apart from its neighbours: from `-(2^53 - 1)` to `Number.MAX_SAFE_INTEGER` (9,007,199,254,740,991). Past that limit neighbouring integers merge; larger integers need BigInt."
  see: [floating-point, bigint]
  example:
    code: "Number.MAX_SAFE_INTEGER + 2; // 9007199254740992 (one less than expected)"
- id: number-parsing
  term: number parsing
  name: { uk: "розбір числа", en: "number parsing" }
  aliases: ["parseInt", "parseFloat", "Number()"]
  definition:
    uk: "Перетворення тексту (наприклад, із поля форми) на число. `Number(text)` вимагає, щоб увесь текст був числом, а порожній текст дає `0`; `parseInt` і `parseFloat` читають цифри з початку й мовчки відкидають решту. Суворий розбір спершу перевіряє, що текст має очікуваний вигляд."
    en: "Turning text (for example, from a form field) into a number. `Number(text)` requires the whole text to be a number, and empty text gives `0`; `parseInt` and `parseFloat` read digits from the start and silently drop the rest. A strict parser first checks that the text has the expected shape."
  see: [nan, radix]
  example:
    code: "Number(\"12px\");       // NaN\nparseInt(\"12px\", 10); // 12"
- id: radix
  term: radix
  name: { uk: "основа системи числення", en: "radix" }
  definition:
    uk: "Скільки різних цифр має система числення: 10 для звичайних чисел, 16 для шістнадцяткових. Другий аргумент `parseInt(text, radix)`; щоб текст завжди читався як десяткове число, передавай `10`."
    en: "How many different digits a number system has: 10 for ordinary numbers, 16 for hexadecimal. It is the second argument of `parseInt(text, radix)`; pass `10` so that text is always read as a decimal number."
  see: [number-parsing]
  example:
    code: "parseInt(\"ff\", 16); // 255\nparseInt(\"ff\", 10); // NaN"
- id: rounding-mode
  term: rounding mode
  name: { uk: "спосіб заокруглення", en: "rounding mode" }
  definition:
    uk: "Правило, за яким число без дробової частини обирають: униз (`Math.floor`), угору (`Math.ceil`), до нуля (`Math.trunc`) чи до найближчого (`Math.round`, де рівно половинка йде до більшого числа). Для грошей і звітів правило заокруглення обирають свідомо й записують."
    en: "The rule that picks a number without a fractional part: down (`Math.floor`), up (`Math.ceil`), towards zero (`Math.trunc`) or to the nearest (`Math.round`, where an exact half goes to the larger number). For money and reports the rounding rule is chosen on purpose and written down."
  example:
    code: "Math.round(2.5);  // 3\nMath.round(-2.5); // -2"
- id: minor-unit
  term: minor unit
  name: { uk: "мінорна одиниця", en: "minor unit" }
  aliases: ["копійки", "cents", "amountMinor"]
  definition:
    uk: "Найменша частка валюти — копійка, цент. Суми зберігають цілими числами мінорних одиниць (`1250` замість `12.5` гривні), бо цілі додаються точно, а дробові числа накопичують похибку. На гривні з копійками суму перетворюють лише для показу."
    en: "The smallest part of a currency — a kopiyka, a cent. Amounts are stored as whole numbers of minor units (`1250` instead of `12.5` hryvnias), because whole numbers add exactly while fractional numbers pile up errors. An amount is turned into hryvnias and kopiykas only for display."
  see: [floating-point, remainder-allocation]
  example:
    code: "const amountMinor = 84550; // 845.50 UAH"
- id: remainder-allocation
  term: remainder allocation
  name: { uk: "розподіл залишку", en: "remainder allocation" }
  definition:
    uk: "Правило поділу цілої суми на частини без втрат: кожна частина отримує `Math.floor(total / n)`, а залишок `total % n` роздають по одній мінорній одиниці першим частинам. Сума частин завжди дорівнює цілому."
    en: "A rule for splitting a whole amount into parts without loss: each part gets `Math.floor(total / n)`, and the remainder `total % n` is handed out one minor unit at a time to the first parts. The parts always add up to the whole."
  see: [minor-unit]
  example:
    code: "// 100 kopiykas for 3 people → [34, 33, 33]"
- id: regular-expression
  term: regular expression
  name: { uk: "регулярний вираз", en: "regular expression" }
  aliases: ["regex", "RegExp", "шаблон"]
  definition:
    uk: "Шаблон для тексту, записаний між двома скісними рисками: `/^\\d+$/`. `pattern.test(text)` відповідає, чи є в тексті збіг. Без якорів `^` і `$` збіг шукається будь-де в тексті."
    en: "A pattern for text written between two slashes: `/^\\d+$/`. `pattern.test(text)` answers whether the text contains a match. Without the anchors `^` and `$` the match is looked for anywhere in the text."
  see: [character-class, anchor, quantifier]
  example:
    code: "/^\\d+$/.test(\"2026\"); // true\n/^\\d+$/.test(\"20x6\"); // false"
- id: character-class
  term: character class
  name: { uk: "клас символів", en: "character class" }
  definition:
    uk: "Частина шаблону, що означає один символ із переліку: `[a-z]`, `[0-9]`, `\\d` (цифра), `\\w` (лише латинська літера, цифра чи `_`). Для літер будь-якої мови — `\\p{L}` з прапорцем `u`."
    en: "A part of a pattern that means one character from a list: `[a-z]`, `[0-9]`, `\\d` (a digit), `\\w` (only a Latin letter, a digit or `_`). For letters of any language — `\\p{L}` with the `u` flag."
  see: [regular-expression]
  example:
    code: "/^[\\p{L}]+$/u.test(\"Київ\"); // true\n/^\\w+$/.test(\"Київ\");      // false"
- id: anchor
  term: anchor
  name: { uk: "якір", en: "anchor" }
  definition:
    uk: "Частина шаблону, що позначає не символ, а місце: `^` — початок тексту, `$` — кінець. Шаблон із обома якорями мусить збігтися з усім текстом, а не з його шматком."
    en: "A part of a pattern that marks a place rather than a character: `^` is the start of the text, `$` is the end. A pattern with both anchors has to match the whole text, not a piece of it."
  see: [regular-expression]
  example:
    code: "/\\d{2}/.test(\"a12b\");   // true\n/^\\d{2}$/.test(\"a12b\"); // false"
- id: quantifier
  term: quantifier
  name: { uk: "квантифікатор", en: "quantifier" }
  definition:
    uk: "Частина шаблону, що каже, скільки разів може повторитися попередній елемент: `{2}` — рівно двічі, `{1,3}` — від одного до трьох, `+` — один і більше, `*` — нуль і більше, `?` — нуль або один."
    en: "A part of a pattern that says how many times the element before it may repeat: `{2}` — exactly twice, `{1,3}` — one to three times, `+` — one or more, `*` — zero or more, `?` — zero or one."
  see: [regular-expression, catastrophic-backtracking]
  example:
    code: "/^\\d{4}$/.test(\"2026\"); // true"
- id: capture-group
  term: capture group
  name: { uk: "група захоплення", en: "capture group" }
  aliases: ["named group", "іменована група"]
  definition:
    uk: "Частина шаблону в дужках, яка запам’ятовує свій шматок збігу. `exec` повертає їх як `[1]`, `[2]`…; групу з назвою `(?<name>…)` читають як `match.groups.name`."
    en: "A part of a pattern in parentheses that remembers its piece of the match. `exec` returns them as `[1]`, `[2]`…; a named group `(?<name>…)` is read as `match.groups.name`."
  see: [regular-expression]
  example:
    code: "/(?<hours>\\d{2}):(?<minutes>\\d{2})/.exec(\"07:30\").groups.minutes; // \"30\""
- id: regex-flag
  term: regex flag
  name: { uk: "прапорець регулярного виразу", en: "regex flag" }
  aliases: ["flag", "прапорець"]
  definition:
    uk: "Літера після шаблону, що змінює правила пошуку: `i` — без огляду на регістр, `g` — усі збіги (шаблон пам’ятає `lastIndex`), `u` — робота з code points і `\\p{…}`."
    en: "A letter after a pattern that changes how it searches: `i` — ignore case, `g` — every match (the pattern remembers `lastIndex`), `u` — work with code points and `\\p{…}`."
  see: [regular-expression]
  example:
    code: "/кіт/i.test(\"КІТ\"); // true"
- id: regex-escaping
  term: regex escaping
  name: { uk: "екранування в шаблоні", en: "regex escaping" }
  definition:
    uk: "Додавання `\\` перед символами з особливим значенням (`. * + ? ^ $ { } ( ) | [ ] \\`), щоб шаблон шукав їх буквально. Текст користувача екранують завжди, перш ніж будувати з нього `new RegExp`."
    en: "Putting `\\` before characters with a special meaning (`. * + ? ^ $ { } ( ) | [ ] \\`) so that a pattern searches for them literally. User text is always escaped before a `new RegExp` is built from it."
  see: [regular-expression]
  example:
    code: "/a\\.b/.test(\"axb\"); // false — the escaped dot means only a dot"
- id: catastrophic-backtracking
  term: catastrophic backtracking
  name: { uk: "некерований перебір", en: "catastrophic backtracking" }
  aliases: ["backtracking", "ReDoS"]
  definition:
    uk: "Ситуація, коли шаблон на майже відповідному тексті перебирає величезну кількість способів поділити його між частинами — зазвичай через квантифікатор у групі з квантифікатором, як-от `(a+)+`. Кожен зайвий символ приблизно подвоює роботу, а сторінка тим часом не відповідає."
    en: "A situation in which a pattern, on almost-matching text, tries a huge number of ways to share it between its parts — usually because of a quantifier inside a group with a quantifier, such as `(a+)+`. Every extra character roughly doubles the work, and meanwhile the page does not respond."
  see: [quantifier, regular-expression]
- id: timestamp
  term: timestamp
  name: { uk: "timestamp", en: "timestamp" }
  aliases: ["мітка часу", "момент часу", "instant"]
  definition:
    uk: "Момент часу, записаний одним числом — мілісекундами від початку епохи Unix. Однаковий для всієї планети; день і година з’являються лише тоді, коли його показують для певного часового поясу. Саме таке число зберігає об’єкт `Date`."
    en: "An instant written as one number — milliseconds since the Unix epoch. It is the same for the whole planet; a day and an hour appear only when it is shown for a particular time zone. A `Date` object stores exactly such a number."
  see: [unix-epoch, calendar-date]
  example:
    code: "new Date(\"2026-03-01\").getTime(); // 1772323200000"
- id: calendar-date
  term: calendar date
  name: { uk: "календарна дата", en: "calendar date" }
  aliases: ["plain date", "YYYY-MM-DD"]
  definition:
    uk: "Назва дня без години й часового поясу — «1 березня 2026». Її зберігають текстом `\"YYYY-MM-DD\"`: такий текст з нулями порівнюється й сортується так само, як дні в календарі."
    en: "The name of a day without an hour or a time zone — “1 March 2026”. It is stored as text `\"YYYY-MM-DD\"`: such text with zeros compares and sorts exactly like days on the calendar."
  see: [timestamp, iso-8601]
  example:
    code: "\"2026-02-28\" < \"2026-03-01\"; // true"
- id: iso-8601
  term: ISO 8601
  name: { uk: "ISO 8601", en: "ISO 8601" }
  definition:
    uk: "Міжнародний стандарт запису дат і часу: `2026-03-01` для дня, `2026-03-01T00:00:00.000Z` для моменту в UTC (`Z` означає UTC). Від більшого до меншого, з нулями — тому такий текст легко порівнювати."
    en: "The international standard for writing dates and times: `2026-03-01` for a day, `2026-03-01T00:00:00.000Z` for an instant in UTC (`Z` means UTC). From larger to smaller, with zeros — that is why such text is easy to compare."
  see: [calendar-date, timestamp]
  example:
    code: "new Date(0).toISOString(); // \"1970-01-01T00:00:00.000Z\""
- id: unix-epoch
  term: Unix epoch
  name: { uk: "епоха Unix", en: "Unix epoch" }
  definition:
    uk: "Точка відліку часу в JavaScript та багатьох інших системах: 1 січня 1970 року, 00:00:00 за UTC. Timestamp — кількість мілісекунд від неї (до неї — від’ємне число)."
    en: "The starting point of time in JavaScript and many other systems: 1 January 1970, 00:00:00 UTC. A timestamp is the number of milliseconds since it (negative before it)."
  see: [timestamp]
  example:
    code: "new Date(0).getTime(); // 0"
- id: utc
  term: UTC
  name: { uk: "UTC", en: "UTC" }
  aliases: ["всесвітній координований час", "Coordinated Universal Time"]
  definition:
    uk: "Всесвітній координований час — шкала, від якої відраховують усі часові пояси. В UTC немає переходу на літній час, тож кожна доба в ньому триває рівно 24 години. Літера `Z` у тексті ISO означає UTC."
    en: "Coordinated Universal Time — the scale all time zones are counted from. UTC has no daylight saving time, so every day in it lasts exactly 24 hours. The letter `Z` in ISO text means UTC."
  see: [timezone, utc-offset]
  example:
    code: "new Date(\"2026-03-01\").toISOString(); // \"2026-03-01T00:00:00.000Z\""
- id: timezone
  term: time zone
  name: { uk: "часовий пояс", en: "time zone" }
  aliases: ["timeZone", "пояс"]
  definition:
    uk: "Правило, яке для кожного моменту каже, на скільки місцевий час відрізняється від UTC, — разом з датами переходу на літній час. Позначається назвою з бази часових поясів: `Europe/Kyiv`, `America/New_York`."
    en: "A rule that says for every instant how far local time differs from UTC — together with the dates of daylight saving changes. It is named from the time zone database: `Europe/Kyiv`, `America/New_York`."
  see: [utc, utc-offset, daylight-saving-time]
  example:
    code: "new Intl.DateTimeFormat(\"en-US\", { timeZone: \"Asia/Tokyo\", timeStyle: \"short\" })"
- id: utc-offset
  term: UTC offset
  name: { uk: "зсув від UTC", en: "UTC offset" }
  aliases: ["offset", "зсув"]
  definition:
    uk: "На скільки годин (і хвилин) місцевий годинник відрізняється від UTC у певний момент: Київ узимку — UTC+2, улітку — UTC+3. Для одного поясу зсув змінюється протягом року, тому пояс — це правило, а не число."
    en: "How many hours (and minutes) the local clock differs from UTC at a given instant: Kyiv is UTC+2 in winter and UTC+3 in summer. For one zone the offset changes during the year, so a zone is a rule, not a number."
  see: [timezone, utc]
- id: daylight-saving-time
  term: daylight saving time
  name: { uk: "літній час", en: "daylight saving time" }
  aliases: ["DST", "перехід на літній час"]
  definition:
    uk: "Перехід годинника на годину вперед навесні й назад восени. Тоді доба триває 23 або 25 годин, а деяких годин місцевого часу не існує або вони повторюються. Тому «+24 години» — не завжди «завтра о тій самій порі»."
    en: "Moving the clock one hour forward in spring and back in autumn. Then a day lasts 23 or 25 hours, and some local hours do not exist or happen twice. That is why “+24 hours” is not always “the same time tomorrow”."
  see: [timezone, utc-offset]
