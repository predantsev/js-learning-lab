# Terms introduced in JS-12. One file per unit keeps parallel authoring conflict-free.
- id: code-unit
  term: code unit
  name: { uk: "code unit", en: "code unit" }
  definition:
    uk: "Найменший шматочок, з яких JavaScript складає текст (16 біт, кодування UTF-16). `length` рахує саме code units, а `text[i]` читає один code unit. Кирилична чи латинська літера — один code unit, емодзі — два."
    en: "The smallest piece JavaScript builds text from (16 bits, UTF-16 encoding). `length` counts code units, and `text[i]` reads one code unit. A Cyrillic or Latin letter is one code unit, an emoji is two."
  see: [code-point, surrogate-pair]
  example:
    code: "\"Київ\".length; // 4\n\"🐈\".length;   // 2"
- id: code-point
  term: code point
  name: { uk: "code point", en: "code point" }
  definition:
    uk: "Номер символу в Unicode. Один code point займає один або два code units. `for…of` і spread `[...text]` перебирають текст саме по code points, тому не розрізають емодзі."
    en: "The number of a character in Unicode. One code point takes one or two code units. `for…of` and spread `[...text]` walk text by code points, so they never cut an emoji apart."
  see: [code-unit, grapheme-cluster]
  example:
    code: "[...\"🐈🐕\"].length; // 2 (while \"🐈🐕\".length is 4)"
- id: surrogate-pair
  term: surrogate pair
  name: { uk: "сурогатна пара", en: "surrogate pair" }
  definition:
    uk: "Два code units, які разом записують один code point поза першими 65 536 номерами Unicode — наприклад, емодзі. Окрема половина пари — зламаний символ, тому текст не можна різати між ними."
    en: "Two code units that together encode one code point beyond the first 65,536 Unicode numbers — an emoji, for example. One half of a pair alone is a broken character, so text must not be cut between them."
  see: [code-unit, code-point]
  example:
    code: "\"🐈\".slice(0, 1); // half of the pair: a broken character"
- id: grapheme-cluster
  term: grapheme cluster
  name: { uk: "grapheme cluster", en: "grapheme cluster" }
  aliases: ["видимий символ", "visible character"]
  definition:
    uk: "Те, що людина бачить як один символ. Він може складатися з кількох code points: літера й комбінований знак наголосу, емодзі з модифікатором кольору шкіри. Ні `length`, ні `[...text]` їх не рахують; для цього є `Intl.Segmenter`."
    en: "What a person sees as one character. It can consist of several code points: a letter with a combining accent, an emoji with a skin-tone modifier. Neither `length` nor `[...text]` counts these; `Intl.Segmenter` does."
  see: [code-point]
  example:
    code: "[...\"e\\u0301\"].length; // 2 code points, shown as one é"
- id: unicode-normalization
  term: Unicode normalization
  name: { uk: "нормалізація Unicode", en: "Unicode normalization" }
  aliases: ["normalize", "NFC"]
  definition:
    uk: "Зведення тексту до однієї з канонічних форм, щоб однаково видимі літери мали однаковий запис. `text.normalize(\"NFC\")` повертає новий текст, де пари «літера + знак» замінено готовими літерами; `\"NFD\"` — навпаки, розкладає їх."
    en: "Bringing text to one of its canonical forms so that letters that look the same are also stored the same. `text.normalize(\"NFC\")` returns new text in which “letter + mark” pairs are replaced by ready-made letters; `\"NFD\"` does the opposite and splits them."
  see: [code-point, search-key]
  example:
    code: "\"e\\u0301\" === \"\\u00e9\";                  // false\n\"e\\u0301\".normalize(\"NFC\") === \"\\u00e9\"; // true"
- id: search-key
  term: search key
  name: { uk: "ключ для пошуку", en: "search key" }
  definition:
    uk: "Окрема форма тексту, яку використовують лише для порівняння: нормалізована, без пробілів на краях, у нижньому регістрі. Її однаково роблять і з запиту, і з поля запису, а сам запис не змінюють."
    en: "A separate form of text used only for comparing: normalized, without spaces at the edges, in lower case. It is made the same way from the query and from the record’s field, and the record itself is not changed."
  see: [unicode-normalization]
- id: floating-point
  term: floating-point number
  name: { uk: "число з рухомою комою", en: "floating-point number" }
  aliases: ["floating point", "IEEE 754", "double"]
  definition:
    uk: "Спосіб зберігати дробові числа у двійковому вигляді у 64 бітах (стандарт IEEE 754). Більшість десяткових дробів, як-от `0.1`, зберігаються як найближче можливе число, тож результати дій можуть мати крихітну похибку."
    en: "A way of storing fractional numbers in binary in 64 bits (the IEEE 754 standard). Most decimal fractions, such as `0.1`, are stored as the nearest possible number, so results of calculations can carry a tiny error."
  see: [safe-integer]
  example:
    code: "0.1 + 0.2; // 0.30000000000000004"
- id: nan
  term: NaN
  name: { uk: "NaN", en: "NaN" }
  aliases: ["not a number"]
  definition:
    uk: "Особливе числове значення «не число»: результат дії без сенсу (`0 / 0`, `Number(\"abc\")`). Має тип `\"number\"`, поширюється на все, що з ним рахують, і не дорівнює нічому, навіть собі. Розпізнається через `Number.isNaN`."
    en: "A special numeric value meaning “not a number”: the result of a meaningless operation (`0 / 0`, `Number(\"abc\")`). It is of type `\"number\"`, spreads into everything calculated with it and is equal to nothing, not even itself. It is recognized with `Number.isNaN`."
  see: [infinity]
  example:
    code: "NaN === NaN;         // false\nNumber.isNaN(0 / 0); // true"
- id: infinity
  term: Infinity
  name: { uk: "Infinity", en: "Infinity" }
  definition:
    uk: "Числові значення `Infinity` і `-Infinity`, більші (менші) за будь-яке число. Їх дає, наприклад, ділення ненульового числа на нуль — помилки при цьому не виникає."
    en: "The numeric values `Infinity` and `-Infinity`, larger (smaller) than any number. Dividing a non-zero number by zero gives one of them, for example — no error is raised."
  see: [nan]
  example:
    code: "1 / 0;  // Infinity\n-1 / 0; // -Infinity"
- id: safe-integer
  term: safe integer
  name: { uk: "безпечне ціле число", en: "safe integer" }
  aliases: ["MAX_SAFE_INTEGER"]
  definition:
    uk: "Ціле число, яке JavaScript зберігає точно й відрізняє від сусідніх: від `-(2^53 - 1)` до `Number.MAX_SAFE_INTEGER` (9 007 199 254 740 991). За цією межею сусідні цілі зливаються; для більших цілих є BigInt."
    en: "A whole number that JavaScript stores exactly and can tell apart from its neighbours: from `-(2^53 - 1)` to `Number.MAX_SAFE_INTEGER` (9,007,199,254,740,991). Past that limit neighbouring integers merge; larger integers need BigInt."
  see: [floating-point, bigint]
  example:
    code: "Number.MAX_SAFE_INTEGER + 2; // 9007199254740992 (one less than expected)"
