# Terms introduced in NO-05 (durable server storage). One file per unit keeps parallel authoring conflict-free.
- id: schema-contract
  term: schema contract
  name: { uk: "контракт схеми (schema contract)", en: "schema contract" }
  definition:
    uk: "Модуль, що існує під час виконання й описує збережені дані: версію схеми, тип, обмеження та значення за замовчуванням кожного поля. Його імпортують усі, хто читає чи пише дані, — репозиторій, валідатор API, тести, — тож правило змінюється в одному місці. На відміну від типу TypeScript, контракт перевіряє справжні значення, зокрема те, що вже лежить на диску."
    en: "A module that exists at run time and describes stored data: the schema version and the type, constraints and default of every field. Everyone who reads or writes the data imports it — the repository, the API validator, the tests — so a rule changes in one place. Unlike a TypeScript type, a contract checks real values, including what already lies on the disk."
  example:
    code: "export const contract = { version: 1, fields: { done: { type: 'boolean', default: false } } };"
  see: [schema-version, invariant]
- id: startup-initialization
  term: startup initialization
  name: { uk: "ініціалізація під час запуску (startup initialization)", en: "startup initialization" }
  aliases: [init on start]
  definition:
    uk: "Кроки, які сервер виконує до `listen()`: створити відсутнє сховище, перевірити (або перенести) його версію схеми й додати фікстури лише в порожнє сховище. Правильна ініціалізація ідемпотентна: другий запуск поспіль нічого не змінює, а видалений людиною запис не повертається."
    en: "The steps a server takes before `listen()`: create missing storage, check (or migrate) its schema version and add fixtures only to an empty store. Correct initialization is idempotent: a second run in a row changes nothing, and a record a person deleted does not come back."
  example:
    code: "await initStore(file, fixtures); // only then:\nserver.listen(port, '127.0.0.1');"
  see: [schema-contract]
- id: migration-dry-run
  term: migration dry run
  name: { uk: "пробний запуск міграції (migration dry run)", en: "migration dry run" }
  aliases: [dry run]
  definition:
    uk: "Запуск міграції на копії сховища, а не на живих даних, із перевірками: стільки ж записів, ті самі інваріанти, а повторний запуск нічого не змінює. Лише коли всі перевірки пройдено, результат одним атомарним кроком замінює живе сховище; інакше копію викидають, і живе сховище лишається на старій версії."
    en: "Running a migration on a copy of the store instead of the live data, with checks: the same number of records, the same invariants, and a rerun that changes nothing. Only when every check passes does the result replace the live store in one atomic step; otherwise the copy is thrown away, and the live store stays on the old version."
  example:
    code: "const after = migrate(structuredClone(store));\nif (after.records.length !== store.records.length) refuse();"
  see: [schema-migration, invariant]
- id: backup-verification
  term: backup verification
  name: { uk: "перевірка backup (backup verification)", en: "backup verification" }
  aliases: [restore drill, restore test]
  definition:
    uk: "Доказ, що backup справді відновлюється: копію відновлюють у тимчасове місце (ніколи поверх живого сховища) і порівнюють із тим, що вона мала зберегти, — кількість записів, контрольну суму, інваріанти домену, а для SQLite ще й `PRAGMA integrity_check`. Backup без такої перевірки — лише файл, про який нічого не відомо."
    en: "Proof that a backup really restores: the copy is restored into a scratch location (never over the live store) and compared with what it was meant to keep — the record count, a checksum, the domain’s invariants, and for SQLite also `PRAGMA integrity_check`. A backup without such a check is just a file nothing is known about."
  example:
    code: "const report = await verifyBackup('backups/notes.1.json', 'scratch');\n// { ok: false, problems: ['sha256: …'] }"
  see: [consistent-snapshot, invariant]
- id: consistent-snapshot
  term: consistent snapshot
  name: { uk: "узгоджений знімок (consistent snapshot)", en: "consistent snapshot" }
  definition:
    uk: "Копія сховища в одну мить: усі закомічені зміни до неї — і жодної зміни, що ще триває. Для JSON-файла, який завжди замінюють атомарним `rename`, це просто повне читання файла. Для SQLite — backup API (`sqlite.backup()` у Node від 22.16) або `VACUUM INTO`; звичайна копія файла бази посеред транзакції може містити суміш старих і нових сторінок."
    en: "A copy of a store at one moment: every committed change before it — and no change that is still in progress. For a JSON file always replaced by an atomic `rename`, that is simply a full read of the file. For SQLite it is the backup API (`sqlite.backup()` in Node from 22.16) or `VACUUM INTO`; a plain copy of the database file in the middle of a transaction can hold a mix of old and new pages."
  example:
    code: "await sqlite.backup(connection, 'backups/expenses.db'); // Node 22.16+"
  see: [backup-verification, atomic-rename]
