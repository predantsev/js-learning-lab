# Terms introduced in JS-03 (functions, scope, closures, callbacks, purity, recursion).
- id: function
  term: function
  name: { uk: "функція", en: "function" }
  definition:
    uk: "Шматок коду з власною назвою, який можна запускати знову й знову з різними вхідними даними. Оголошення функції лише запам’ятовує код під цією назвою; виконується він тоді, коли функцію **викликають**: `double(4)`."
    en: "A named piece of code you can run again and again with different inputs. Defining a function only stores the code under a name; it runs when the function is **called**: `double(4)`."
  example:
    code: "function double(n) {\n  return n * 2;\n}\n\nconsole.log(double(4)); // 8"
  see: [parameter, argument, return-value]
- id: parameter
  term: parameter
  name: { uk: "параметр", en: "parameter" }
  definition:
    uk: "Назва в дужках оголошення функції. Під час виклику вона отримує переданий аргумент і всередині функції поводиться як локальна змінна."
    en: "A name in the brackets of a function definition. When the function is called it receives the passed argument and works like a local variable inside the function."
  example:
    code: "function double(n) { // n is the parameter\n  return n * 2;\n}"
  see: [argument]
- id: argument
  term: argument
  name: { uk: "аргумент", en: "argument" }
  definition:
    uk: "Значення, яке передають функції під час виклику. У виклику `double(4)` аргумент — `4`; він потрапляє в параметр `n`."
    en: "The value passed to a function when it is called. In the call `double(4)` the argument is `4`; it lands in the parameter `n`."
  see: [parameter]
- id: return-value
  term: return value
  name: { uk: "значення, яке повертає функція", en: "return value" }
  definition:
    uk: "Значення, яке функція через `return` віддає в місце виклику. Виклик — це вираз, і його значення — саме це. Якщо функція не виконала `return`, виклик дає `undefined`. `return` нічого не друкує."
    en: "The value a function hands back to the place of the call with `return`. A call is an expression, and this is its value. If the function did not run a `return`, the call gives `undefined`. `return` prints nothing."
  example:
    code: "const label = formatPrice(80); // the returned text is stored in label"
- id: call-frame
  term: call frame
  name: { uk: "кадр виклику", en: "call frame" }
  definition:
    uk: "Робочий простір одного виклику функції: у ньому живуть параметри й локальні змінні саме цього виклику. Кадр з’являється, коли виклик починається, і зникає, коли функція повертає значення. Два виклики — два окремі кадри. Змінні виклику зазвичай зникають разом із кадром, але можуть пережити його, якщо їх запам’ятала інша функція (closure)."
    en: "The workspace of one function call: it holds the parameters and local variables of that particular call. A frame appears when the call starts and disappears when the function returns. Two calls — two separate frames. The call’s variables usually disappear together with the frame, but they can outlive it when another function remembers them (a closure)."
  see: [call-stack]
- id: default-parameter
  term: default parameter
  name: { uk: "параметр за замовчуванням", en: "default parameter" }
  definition:
    uk: "Параметр із запасним значенням: `function categoryLabel(category = \"без категорії\")`. Запасне значення спрацьовує лише тоді, коли аргумент дорівнює `undefined` — його не передали або передали `undefined`. `null` і `\"\"` — справжні значення, їх воно не замінює."
    en: "A parameter with a fallback value: `function categoryLabel(category = \"no category\")`. The fallback is used only when the argument is `undefined` — not passed, or passed as `undefined`. `null` and `\"\"` are real values; it does not replace them."
- id: rest-parameter
  term: rest parameter
  name: { uk: "rest-параметр", en: "rest parameter" }
  definition:
    uk: "Останній параметр із трьома крапками, `...rest`. Він збирає решту аргументів в один список (масив). Якщо зайвих аргументів немає, список порожній і `rest.length` дорівнює `0`."
    en: "The last parameter, written with three dots: `...rest`. It collects all remaining arguments into one list (an array). With no extra arguments the list is empty and `rest.length` is `0`."
  example:
    code: "function listGuests(host, ...guests) {\n  return host + \" + \" + guests.length;\n}\nlistGuests(\"Olia\", \"Petro\", \"Ira\"); // \"Olia + 2\""
  see: [arguments-object]
- id: arguments-object
  term: arguments object
  name: { uk: "об’єкт arguments", en: "arguments object" }
  definition:
    uk: "Застарілий спосіб дістатися до всіх аргументів: усередині звичайної (не стрілкової) функції назва `arguments` містить усі передані значення, а `arguments.length` — їх кількість. Його можна зустріти в старому коді; у новому пишуть rest-параметр."
    en: "The legacy way to reach all arguments: inside a regular (non-arrow) function the name `arguments` holds every passed value and `arguments.length` their count. You will meet it in old code; new code uses a rest parameter."
  see: [rest-parameter]
- id: arrow-function
  term: arrow function
  name: { uk: "стрілкова функція", en: "arrow function" }
  definition:
    uk: "Короткий запис функції-значення: `(n) => n * 2`. Без фігурних дужок тіло — один вираз, і його значення повертається саме; з дужками тіло — блок, і потрібен `return`. Якщо стрілкову функцію зберегли в `const`, викликати її можна лише після цього рядка."
    en: "A short way to write a function value: `(n) => n * 2`. Without curly braces the body is one expression whose value is returned; with braces the body is a block and needs `return`. When an arrow function is stored in a `const`, it can be called only after that line."
  example:
    code: "const double = (n) => n * 2;\nconst addFee = (price) => {\n  return price + 10;\n};"
  see: [implicit-return, function-expression]
- id: implicit-return
  term: implicit return
  name: { uk: "неявне повернення", en: "implicit return" }
  definition:
    uk: "Коли тіло стрілкової функції — один вираз без фігурних дужок, функція повертає його значення без слова `return`. Щоб так повернути об’єкт, його беруть у круглі дужки: `() => ({ price: 1 })`, бо `{` одразу після `=>` означає початок блоку."
    en: "When the body of an arrow function is a single expression without curly braces, the function returns its value without the word `return`. To return an object this way, wrap it in parentheses: `() => ({ price: 1 })`, because `{` right after `=>` starts a block."
- id: function-expression
  term: function expression
  name: { uk: "функціональний вираз", en: "function expression" }
  definition:
    uk: "Функція, створена як значення всередині виразу, наприклад `const double = function (n) { return n * 2; };`. На відміну від оголошення `function double(n) { … }`, вона існує лише після того, як виконався її рядок."
    en: "A function created as a value inside an expression, for example `const double = function (n) { return n * 2; };`. Unlike the declaration `function double(n) { … }`, it exists only after its line has run."
- id: scope
  term: scope
  name: { uk: "область видимості", en: "scope" }
  definition:
    uk: "Ділянка коду, у якій видно певні назви. Свою область видимості має файл, кожен виклик функції і кожен блок `{ … }`. Області вкладені одна в одну так, як написано код."
    en: "The part of the code where certain names are visible. The file, every function call and every block `{ … }` have their own scope. Scopes are nested exactly as the code is written."
  see: [scope-chain, lexical-scope, global-scope]
- id: lexical-scope
  term: lexical scope
  name: { uk: "лексична область видимості", en: "lexical scope" }
  definition:
    uk: "Правило JavaScript: функція бачить змінні того місця, де її **написано**, а не того, звідки її **викликали**. Тому, лише читаючи код, можна сказати, яку змінну знайде кожна назва."
    en: "The JavaScript rule that a function sees the variables of the place where it is **written**, not of the place it is **called** from. That is why you can tell which variable every name finds just by reading the code."
- id: scope-chain
  term: scope chain
  name: { uk: "ланцюжок областей видимості", en: "scope chain" }
  definition:
    uk: "Шлях, яким JavaScript шукає назву: спершу в поточній області видимості, потім в області, що її оточує, і так далі назовні. Перша знайдена назва перемагає; якщо назви немає ніде — `ReferenceError`."
    en: "The path JavaScript follows to find a name: first the current scope, then the scope around it, and so on outward. The first match wins; if the name is nowhere, it is a `ReferenceError`."
- id: global-scope
  term: global scope
  name: { uk: "глобальна область видимості", en: "global scope" }
  definition:
    uk: "Найзовнішня область видимості, спільна для всієї сторінки; тут живуть вбудовані назви, як-от `console`. Змінні верхнього рівня файла-модуля (у цьому курсі кожен файл — модуль) лежать в області самого файла, яка вкладена в глобальну."
    en: "The outermost scope, shared by the whole page; built-in names such as `console` live here. Top-level variables of a module file (every file in this course is a module) live in the file’s own scope, which sits inside the global one."
- id: closure
  term: closure
  name: { uk: "замикання", en: "closure" }
  definition:
    uk: "Функція разом із живим зв’язком зі змінними місця, де її створено. Вона читає **поточні** значення цих змінних і може їх змінювати навіть тоді, коли зовнішня функція вже завершилася."
    en: "A function together with a live link to the variables of the place where it was created. It reads their **current** values and can change them even after the outer function has finished."
  example:
    code: "function makeCounter() {\n  let count = 0;\n  return () => {\n    count = count + 1;\n    return count;\n  };\n}"
  see: [lexical-environment, function-factory]
- id: lexical-environment
  term: lexical environment
  name: { uk: "лексичне оточення", en: "lexical environment" }
  definition:
    uk: "Набір змінних однієї області видимості — наприклад, параметри й локальні змінні одного виклику — разом із посиланням на зовнішнє оточення. Оточення живе, доки виконується його виклик, а після того — доки на нього посилається хоча б одна функція, яку ще можна викликати."
    en: "The set of variables of one scope — for example, the parameters and local variables of one call — plus a link to the outer environment. An environment lives while its call is running, and after that as long as at least one function that can still be called refers to it."
- id: function-factory
  term: function factory
  name: { uk: "фабрика функцій", en: "function factory" }
  definition:
    uk: "Функція, яка створює й повертає іншу функцію, налаштовану своїми аргументами. Кожен виклик фабрики створює нове оточення, тож зроблені нею функції не ділять змінних між собою."
    en: "A function that creates and returns another function configured by its arguments. Every call of the factory creates a new environment, so the functions it makes do not share variables."
  example:
    code: "const makeGreeter = (greeting) => (name) => greeting + \", \" + name;\nconst greet = makeGreeter(\"Hello\");\ngreet(\"Olia\"); // \"Hello, Olia\""
- id: first-class-function
  term: first-class function
  name: { uk: "функції першого класу", en: "first-class functions" }
  definition:
    uk: "Властивість мови: функція — таке саме значення, як число чи текст. Її можна зберегти в змінній, передати аргументом в іншу функцію і повернути з функції."
    en: "A property of the language: a function is a value just like a number or a string. You can store it in a variable, pass it as an argument to another function and return it from a function."
- id: higher-order-function
  term: higher-order function
  name: { uk: "функція вищого порядку", en: "higher-order function" }
  definition:
    uk: "Функція, яка приймає іншу функцію як аргумент або повертає функцію. Наприклад, `applyTwice(fn, value)` сама вирішує, коли й скільки разів викликати передану `fn`."
    en: "A function that takes another function as an argument or returns a function. For example, `applyTwice(fn, value)` decides itself when and how many times to call the `fn` it received."
  see: [callback]
- id: callback
  term: callback
  name: { uk: "функція зворотного виклику", en: "callback" }
  definition:
    uk: "Функція, яку передають іншій функції, щоб та викликала її сама — тоді, коли треба, і стільки разів, скільки треба. Передають саму функцію (`format`), а не результат її виклику (`format()`)."
    en: "A function passed to another function so that the receiver calls it itself — when it needs to and as many times as it needs to. You pass the function itself (`format`), not the result of calling it (`format()`)."
- id: pure-function
  term: pure function
  name: { uk: "чиста функція", en: "pure function" }
  definition:
    uk: "Функція, результат якої залежить лише від аргументів (ті самі аргументи — той самий результат) і яка нічого не змінює поза собою: не друкує, не пише на сторінку, не змінює зовнішніх змінних і переданих даних."
    en: "A function whose result depends only on its arguments (same arguments — same result) and which changes nothing outside itself: it does not print, write to the page, or change outer variables or the data it received."
  see: [side-effect, deterministic]
- id: side-effect
  term: side effect
  name: { uk: "побічний ефект", en: "side effect" }
  definition:
    uk: "Будь-яка зміна, яку функція робить поза собою: вивід у консоль, запис на сторінку, зміна зовнішньої змінної чи переданого об’єкта, збереження даних. Без побічних ефектів програма нічого не покаже; їх збирають у кількох відомих місцях."
    en: "Any change a function makes outside itself: printing to the console, writing to the page, changing an outer variable or a passed object, saving data. Without side effects a program shows nothing; they are kept in a few known places."
- id: deterministic
  term: deterministic
  name: { uk: "детермінована", en: "deterministic" }
  definition:
    uk: "Про функцію: з тими самими вхідними даними завжди дає той самий результат. Функція, яка читає поточний час, випадкове число чи зовнішню змінну, що змінюється, — не детермінована."
    en: "Of a function: always gives the same result for the same inputs. A function that reads the current time, a random number or an outer variable that changes is not deterministic."
- id: recursion
  term: recursion
  name: { uk: "рекурсія", en: "recursion" }
  definition:
    uk: "Прийом, коли функція викликає саму себе для меншої частини задачі. Кожен виклик має власний кадр зі своїми параметрами; ланцюжок викликів зупиняє базовий випадок."
    en: "A technique where a function calls itself for a smaller part of the problem. Every call has its own frame with its own parameters; the chain of calls is stopped by the base case."
  example:
    code: "function sumTo(n) {\n  if (n === 1) {\n    return 1;            // base case\n  }\n  return n + sumTo(n - 1); // recursive case\n}"
  see: [base-case, recursive-case, call-stack]
- id: base-case
  term: base case
  name: { uk: "базовий випадок", en: "base case" }
  definition:
    uk: "Гілка рекурсивної функції, яка дає відповідь одразу, без нового виклику самої себе. Якщо його немає або до нього неможливо дійти, виклики не зупиняються, і стек викликів переповнюється."
    en: "The branch of a recursive function that answers right away, without calling itself again. If it is missing or can never be reached, the calls never stop and the call stack overflows."
- id: recursive-case
  term: recursive case
  name: { uk: "рекурсивний випадок", en: "recursive case" }
  definition:
    uk: "Гілка рекурсивної функції, яка робить один крок і викликає саму себе для меншої задачі — такої, що наближає до базового випадку."
    en: "The branch of a recursive function that does one step and calls itself for a smaller problem — one that gets closer to the base case."
- id: call-stack
  term: call stack
  name: { uk: "стек викликів", en: "call stack" }
  definition:
    uk: "Стопка кадрів викликів, які ще не завершилися. Новий виклик кладе свій кадр нагору; коли функція повертає значення, її кадр знімається, і продовжує роботу виклик, що лежить під ним."
    en: "The pile of call frames that have not finished yet. A new call puts its frame on top; when a function returns, its frame is removed and the call underneath continues."
  see: [call-frame, stack-overflow]
- id: stack-overflow
  term: stack overflow
  name: { uk: "переповнення стеку", en: "stack overflow" }
  definition:
    uk: "Ситуація, коли незавершених викликів більше, ніж уміщує стек викликів. У браузері це `RangeError: Maximum call stack size exceeded`. Найчастіша причина — рекурсія без досяжного базового випадку."
    en: "When there are more unfinished calls than the call stack can hold. In the browser it is `RangeError: Maximum call stack size exceeded`. The usual cause is recursion without a reachable base case."
- id: per-iteration-binding
  term: per-iteration binding
  name: { uk: "окрема змінна на кожну ітерацію", en: "per-iteration binding" }
  definition:
    uk: "Коли змінну циклу `for` оголошено через `let`, кожна ітерація отримує власну змінну з поточним значенням, і callback, створений у цій ітерації, пов’язаний саме з нею. Змінна `var` — одна на весь цикл."
    en: "When the variable of a `for` loop is declared with `let`, every iteration gets its own variable holding the current value, and a callback created in that iteration is linked to that one. A `var` is one variable for the whole loop."
- id: stale-closure
  term: stale closure
  name: { uk: "застаріле замикання", en: "stale closure" }
  definition:
    uk: "Closure, який читає змінну зі старим значенням — найчастіше копію, зроблену тоді, коли функцію створювали, — хоча потрібні актуальні дані. Виправлення: читати актуальне джерело в момент виклику."
    en: "A closure that reads a variable holding an old value — most often a copy taken when the function was created — while current data is needed. The fix: read the current source at the moment of the call."
