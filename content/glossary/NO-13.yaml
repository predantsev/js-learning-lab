# Terms introduced in NO-13 (server-rendered React lab). One file per unit keeps parallel authoring conflict-free.
- id: render-to-string
  term: renderToString
  name: { uk: "renderToString", en: "renderToString" }
  definition:
    uk: "Функція з `react-dom/server`, яка один раз викликає компоненти дерева й повертає їхню розмітку як звичайний рядок HTML. Ефекти при цьому не виконуються, а обробники подій у HTML не потрапляють. Вона не передає HTML частинами (для цього в React є потокові API), тож відповідь можна надіслати лише тоді, коли весь рядок готовий."
    en: "A function from `react-dom/server` that calls the components of a tree once and returns their markup as an ordinary HTML string. Effects do not run, and event handlers do not get into the HTML. It does not send HTML in parts (React has streaming APIs for that), so the answer can go out only when the whole string is ready."
  aliases: [react-dom/server, renderToStaticMarkup]
  see: [server-side-rendering, server-entry]
  example:
    code: "const html = renderToString(createElement(TaskList, { tasks }));"
- id: server-entry
  term: server entry
  name: { uk: "серверна точка входу (server entry)", en: "server entry" }
  definition:
    uk: "Серверний код, який на запит сторінки бере дані, рендерить кореневий компонент у HTML і загортає розмітку в повний документ: `<!doctype html>`, `<meta charset>`, елемент-контейнер (`#root`) лише з розміткою React і тег `<script type=\"module\">` клієнтської точки входу."
    en: "The server code that, on a page request, takes the data, renders the root component to HTML and wraps the markup in a complete document: `<!doctype html>`, `<meta charset>`, a container element (`#root`) holding only React’s markup, and the `<script type=\"module\">` tag of the client entry."
  aliases: [entry-server, SSR entry]
  see: [render-to-string, server-side-rendering]
