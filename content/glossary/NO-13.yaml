# Terms introduced in NO-13 (server-rendered React lab). One file per unit keeps parallel authoring conflict-free.
- id: render-to-string
  term: renderToString
  name: { uk: "renderToString", en: "renderToString" }
  definition:
    uk: "Функція з `react-dom/server`, яка один раз викликає компоненти дерева й повертає їхню розмітку як звичайний рядок HTML. Ефекти при цьому не виконуються, а обробники подій у HTML не потрапляють. Вона не передає HTML частинами (для цього в React є потокові API), тож відповідь можна надіслати лише тоді, коли весь рядок готовий."
    en: "A function from `react-dom/server` that calls the components of a tree once and returns their markup as an ordinary HTML string. Effects do not run, and event handlers do not get into the HTML. It does not send HTML in parts (React has streaming APIs for that), so the answer can go out only when the whole string is ready."
  aliases: [react-dom/server, renderToStaticMarkup]
  see: [server-side-rendering, server-entry]
  example:
    code: "const html = renderToString(createElement(TaskList, { tasks }));"
- id: server-entry
  term: server entry
  name: { uk: "серверна точка входу (server entry)", en: "server entry" }
  definition:
    uk: "Серверний код, який на запит сторінки бере дані, рендерить кореневий компонент у HTML і загортає розмітку в повний документ: `<!doctype html>`, `<meta charset>`, елемент-контейнер (`#root`) лише з розміткою React і тег `<script type=\"module\">` клієнтської точки входу."
    en: "The server code that, on a page request, takes the data, renders the root component to HTML and wraps the markup in a complete document: `<!doctype html>`, `<meta charset>`, a container element (`#root`) holding only React’s markup, and the `<script type=\"module\">` tag of the client entry."
  aliases: [entry-server, SSR entry]
  see: [render-to-string, server-side-rendering]
- id: hydrate-root
  term: hydrateRoot
  name: { uk: "hydrateRoot", en: "hydrateRoot" }
  definition:
    uk: "Функція з `react-dom/client`, яка запускає React над HTML, що вже прийшов із сервера: `hydrateRoot(контейнер, елемент, параметри?)`. Вона рендерить дерево в браузері, проходить наявні вузли контейнера й, коли розмітка збігається, чіпляє до них обробники та стан, не створюючи нових вузлів. Тому елемент має бути тим самим компонентом із тими самими пропсами, що й на сервері."
    en: "A function from `react-dom/client` that starts React over HTML that has already arrived from the server: `hydrateRoot(container, element, options?)`. It renders the tree in the browser, walks the container’s existing nodes and, when the markup matches, attaches handlers and state to them without creating new nodes. So the element must be the same component with the same props as on the server."
  aliases: [hydrate, react-dom/client]
  see: [hydration, client-entry, render-to-string]
  example:
    code: "hydrateRoot(document.getElementById('root'), createElement(TaskList, data));"
- id: client-entry
  term: client entry
  name: { uk: "клієнтська точка входу (client entry)", en: "client entry" }
  definition:
    uk: "Модуль, який сторінка завантажує через `<script type=\"module\">` і з якого починається React у браузері. На сторінці з рендерингом на сервері він читає початкові дані, які поклав сервер, і викликає `hydrateRoot` з тим самим кореневим компонентом і тими самими пропсами. Збирач (наприклад, esbuild) пакує його разом з усім, що він імпортує, у клієнтський бандл."
    en: "The module a page loads with `<script type=\"module\">` and where React starts in the browser. On a server-rendered page it reads the initial data the server put there and calls `hydrateRoot` with the same root component and the same props. A bundler (for example esbuild) packs it, together with everything it imports, into the client bundle."
  aliases: [entry-client, client.js]
  see: [hydrate-root, server-entry, bundle]
- id: initial-data-payload
  term: initial data payload
  name: { uk: "початкові дані сторінки (initial data payload)", en: "initial data payload" }
  definition:
    uk: "Дані, з якими сервер відрендерив сторінку, вкладені в неї текстом — зазвичай у `<script type=\"application/json\">`, — щоб клієнтська точка входу гідратувала з тими самими пропсами без нового запиту. Усе, що в них потрапило, бачить кожен, хто відкриє код сторінки, навіть якщо компонент цього не показує, тож туди йдуть лише публічні поля зі списку дозволених."
    en: "The data a server rendered a page with, embedded in that page as text — usually in `<script type=\"application/json\">` — so that the client entry hydrates with the same props without a new request. Everything in it is visible to anyone who opens the page source, even what the component never shows, so only public fields from an allowlist go there."
  aliases: [initial data, bootstrap data, dehydrated state, "#initial-data"]
  see: [html-safe-json, client-entry, data-minimization]
- id: html-safe-json
  term: HTML-safe JSON
  name: { uk: "JSON, безпечний для HTML (HTML-safe JSON)", en: "HTML-safe JSON" }
  definition:
    uk: "Текст JSON, у якому символи `<`, `>`, `&`, U+2028 і U+2029 записано екрануваннями `\\u003c`, `\\u003e`, `\\u0026`, `\\u2028`, `\\u2029`. `JSON.parse` дає з нього те саме значення, але HTML-парсер не знаходить у ньому `</script>` чи `<!--`, тож дані користувача не можуть закрити елемент `<script>` і вставити власний код. Звичайний `JSON.stringify` цих символів не екранує, а HTML-сутності (`&lt;`) тут не годяться: усередині `<script>` браузер їх не розшифровує."
    en: "JSON text in which the characters `<`, `>`, `&`, U+2028 and U+2029 are written as the escapes `\\u003c`, `\\u003e`, `\\u0026`, `\\u2028`, `\\u2029`. `JSON.parse` gives the same value from it, but the HTML parser finds no `</script>` or `<!--` in it, so user data cannot close a `<script>` element and inject code of its own. A plain `JSON.stringify` does not escape these characters, and HTML entities (`&lt;`) do not work here: inside `<script>` the browser does not decode them."
  aliases: [serializeForHtml, safe JSON in script, script-safe JSON]
  see: [initial-data-payload, xss, json]
- id: recoverable-error
  term: recoverable error
  name: { uk: "відновлювана помилка (recoverable error)", en: "recoverable error" }
  definition:
    uk: "Помилка, після якої React 19 працює далі сам, — найчастіше розбіжність гідратації в тексті: React викидає серверний HTML найближчої межі `Suspense` (або всього кореня) й рендерить це піддерево на клієнті. Межа помилок її не бачить; про неї повідомляє лише обробник `onRecoverableError(error, errorInfo)` у параметрах `hydrateRoot`, де `errorInfo.componentStack` показує, у якому компоненті сталася розбіжність."
    en: "An error after which React 19 carries on by itself — most often a hydration mismatch in text: React throws away the server HTML of the nearest `Suspense` boundary (or of the whole root) and renders that subtree on the client. An error boundary does not see it; only the `onRecoverableError(error, errorInfo)` handler in the options of `hydrateRoot` reports it, where `errorInfo.componentStack` shows in which component the mismatch happened."
  aliases: [onRecoverableError, hydration error report]
  see: [hydration-mismatch, hydrate-root, error-boundary]
  example:
    code: "hydrateRoot(root, element, { onRecoverableError: (error, info) => report(error.message, info.componentStack) });"
- id: rsc-payload
  term: RSC payload
  name: { uk: "результат серверних компонентів (RSC payload)", en: "RSC payload" }
  definition:
    uk: "Серіалізований результат рендерингу серверних компонентів, який фреймворк із підтримкою React Server Components надсилає в браузер разом із посиланнями на код клієнтських компонентів і їхніми пропсами. На відміну від HTML, React читає його й будує з нього дерево; на відміну від початкових даних твого SSR, він містить уже відрендерений результат, а не лише записи. Назва «RSC payload» — термін фреймворків (наприклад, Next.js), формат залежить від їхньої реалізації."
    en: "The serialized result of rendering server components that a framework with React Server Components support sends to the browser, together with references to the code of client components and their props. Unlike HTML, React reads it and builds a tree from it; unlike your SSR’s initial data, it holds the rendered result, not just the records. The name “RSC payload” is a framework term (for example Next.js), and the format depends on their implementation."
  aliases: [Flight payload, server component payload]
  see: [react-server-components, serialization-boundary, bundler-integration]
- id: bundler-integration
  term: RSC bundler integration
  name: { uk: "інтеграція бандлера з RSC", en: "RSC bundler integration" }
  definition:
    uk: "Підтримка React Server Components у бандлері чи фреймворку: він ділить граф модулів на межі `\"use client\"`, збирає окремі серверний і клієнтський бандли й з’єднує їх із протоколом, що переносить результат серверних компонентів у браузер. За документацією React (сторінка «Server Components» на react.dev), API для цієї інтеграції не дотримуються semver і можуть змінюватися між мінорними версіями React 19.x, тож такі інструменти фіксують версію React або беруть Canary."
    en: "Support for React Server Components in a bundler or framework: it splits the module graph at the `\"use client\"` boundary, builds separate server and client bundles and connects them to the protocol that carries the server components’ result to the browser. According to the React documentation (the “Server Components” page on react.dev), the APIs for this integration do not follow semver and may change between React 19.x minor versions, so such tools pin the React version or use Canary."
  aliases: [RSC bundler, react-server-dom]
  see: [react-server-components, meta-framework, bundle]
