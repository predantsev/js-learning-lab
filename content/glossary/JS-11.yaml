# Terms introduced in JS-11.
- id: this-binding
  term: this
  name: { uk: "this (прив’язка this)", en: "this (this-binding)" }
  aliases: ["this", "this binding"]
  definition:
    uk: "Службове слово, що всередині звичайної функції означає «об’єкт, з яким цю функцію викликали». Значення визначається під час виклику: у `wish.label()` це `wish`, а в `detached()` без об’єкта перед крапкою — `undefined` (у модулях і взагалі в строгому режимі). Стрілкові функції власного `this` не мають."
    en: "A keyword that inside a regular function means “the object this function was called on”. The value is decided at call time: in `wish.label()` it is `wish`, and in `detached()` with no object before the dot it is `undefined` (in modules and in strict mode generally). Arrow functions have no `this` of their own."
  see: [lexical-this, detached-method, strict-mode]
  example:
    code: "const wish = {\n  name: \"Desk lamp\",\n  label() {\n    return \"Wish: \" + this.name; // this is whatever stands before the dot\n  },\n};\nwish.label(); // \"Wish: Desk lamp\""
- id: lexical-this
  term: lexical this
  name: { uk: "лексичний this", en: "lexical this" }
  definition:
    uk: "`this`, який стрілкова функція бере з коду навколо себе — з місця, де її записано, — а не з виклику. Тому стрілка всередині методу бачить той самий `this`, що й метод."
    en: "The `this` an arrow function takes from the code around it — from where it is written — rather than from the call. So an arrow inside a method sees the same `this` as the method."
  see: [this-binding, arrow-function, closure]
  example:
    code: "const tally = {\n  count: 0,\n  addAll(ids) {\n    ids.forEach((id) => {\n      this.count += 1; // the arrow uses addAll's this\n    });\n  },\n};"
- id: detached-method
  term: detached method
  name: { uk: "відокремлений метод", en: "detached method" }
  definition:
    uk: "Метод, який взяли з об’єкта й викликають без нього: `const f = obj.method; f()`, або передали як callback (`setTimeout(obj.method)`, `addEventListener(\"click\", obj.method)`). Виклик не називає об’єкта, тож `this` у методі втрачає потрібне значення."
    en: "A method taken off its object and called without it: `const f = obj.method; f()`, or passed as a callback (`setTimeout(obj.method)`, `addEventListener(\"click\", obj.method)`). The call names no object, so `this` inside the method loses its intended value."
  see: [this-binding, callback]
  example:
    code: "const detached = wish.label;\ndetached(); // TypeError: this is undefined"
- id: bound-function
  term: bound function
  name: { uk: "прив’язана функція", en: "bound function" }
  aliases: ["bind"]
  definition:
    uk: "Нова функція, яку повертає `fn.bind(об’єкт)`: її `this` назавжди закріплено за цим об’єктом. Оригінальна `fn` не змінюється, а повторний `bind` чи `call` прив’язаний `this` уже не міняє."
    en: "The new function returned by `fn.bind(object)`: its `this` is fixed to that object for good. The original `fn` does not change, and a second `bind` or `call` no longer changes the bound `this`."
  see: [this-binding, partial-application]
  example:
    code: "const addAll = tally.addAll.bind(tally);\naddAll([\"a\"]); // this is tally, wherever it is called from"
- id: partial-application
  term: partial application
  name: { uk: "часткове застосування", en: "partial application" }
  definition:
    uk: "Створення нової функції з готовою частиною аргументів: `add.bind(null, 10)` дає функцію, яка вже має перший аргумент `10` і чекає решту."
    en: "Making a new function with part of the arguments already supplied: `add.bind(null, 10)` gives a function that already has the first argument `10` and waits for the rest."
  see: [bound-function]
  example:
    code: "function add(a, b) { return a + b; }\nconst addTen = add.bind(null, 10);\naddTen(5); // 15"
- id: prototype
  term: prototype
  name: { uk: "прототип", en: "prototype" }
  aliases: ["[[Prototype]]"]
  definition:
    uk: "Об’єкт, на який веде приховане посилання `[[Prototype]]` іншого об’єкта. Коли властивості немає в самому об’єкті, JavaScript шукає її в прототипі. Прототип можна задати через `Object.create(proto)`, прочитати — через `Object.getPrototypeOf(obj)`."
    en: "The object that another object’s hidden `[[Prototype]]` link leads to. When a property is not in the object itself, JavaScript looks for it in the prototype. You can set a prototype with `Object.create(proto)` and read it with `Object.getPrototypeOf(obj)`."
  see: [prototype-chain, inherited-property]
  example:
    code: "const proto = { kind: \"base\" };\nconst item = Object.create(proto);\nObject.getPrototypeOf(item) === proto; // true\nitem.kind; // \"base\", found in the prototype"
- id: prototype-chain
  term: prototype chain
  name: { uk: "ланцюжок прототипів", en: "prototype chain" }
  definition:
    uk: "Послідовність об’єктів, у якій JavaScript шукає властивість: сам об’єкт, його прототип, прототип прототипа й так до `Object.prototype`, за яким стоїть `null`. Пошук зупиняється на першому знайденому збігові; якщо дійшов до `null`, результат — `undefined`."
    en: "The sequence of objects JavaScript searches for a property: the object itself, its prototype, the prototype of the prototype, and so on up to `Object.prototype`, followed by `null`. The search stops at the first match; if it reaches `null`, the result is `undefined`."
  see: [prototype, property-shadowing]
  example:
    code: "const proto = { kind: \"base\" };\nconst item = Object.create(proto);\nitem.kind;     // found in proto\nitem.toString; // found in Object.prototype\nitem.color;    // undefined: the chain ended at null"
- id: property-shadowing
  term: property shadowing
  name: { uk: "затінення властивості", en: "property shadowing" }
  definition:
    uk: "Ситуація, коли власна властивість об’єкта має ту саму назву, що й успадкована, і затуляє її під час читання. Присвоєння завжди створює власну властивість, а `delete` її прибирає — і успадкована знову видна."
    en: "A situation where an object’s own property has the same name as an inherited one and hides it when read. An assignment always creates an own property, and `delete` removes it — so the inherited one shows again."
  see: [prototype-chain, own-property, inherited-property]
  example:
    code: "const proto = { kind: \"base\" };\nconst item = Object.create(proto);\nitem.kind = \"custom\"; // shadows proto.kind\ndelete item.kind;\nitem.kind;             // \"base\" again"
- id: constructor-function
  term: constructor function
  name: { uk: "функція-конструктор", en: "constructor function" }
  aliases: ["constructor"]
  definition:
    uk: "Звичайна функція, яку за традицією називають з великої літери й викликають з `new`: вона наповнює щойно створений об’єкт власними полями через `this`. Спільні методи кладуть на її `prototype`."
    en: "An ordinary function that by tradition is named with a capital letter and called with `new`: it fills the freshly created object with own fields through `this`. Shared methods are put on its `prototype`."
  see: [new-operator, instance, prototype]
  example:
    code: "function Task(title) {\n  this.title = title;\n  this.done = false;\n}\nTask.prototype.finish = function () {\n  this.done = true;\n};"
- id: new-operator
  term: new operator
  name: { uk: "оператор new", en: "new operator" }
  aliases: ["new"]
  definition:
    uk: "`new Конструктор(…)` створює порожній об’єкт, зв’язує його прототип з `Конструктор.prototype`, запускає конструктор із `this` на цьому об’єкті й повертає його. Без `new` конструктор — звичайний виклик, у якому `this` не вказує на новий об’єкт."
    en: "`new Constructor(…)` creates an empty object, links its prototype to `Constructor.prototype`, runs the constructor with `this` set to that object and returns it. Without `new` the constructor is an ordinary call in which `this` does not point at a new object."
  see: [constructor-function, instance]
  example:
    code: "const task = new Task(\"Water the plants\");\ntask instanceof Task; // true"
- id: instance
  term: instance
  name: { uk: "екземпляр", en: "instance" }
  definition:
    uk: "Об’єкт, створений через `new` певного конструктора чи класу. Усі екземпляри мають власні поля, а методи беруть зі спільного прототипа; `x instanceof Конструктор` перевіряє походження."
    en: "An object created with `new` from a particular constructor or class. Every instance has its own fields and takes methods from the shared prototype; `x instanceof Constructor` checks the origin."
  see: [constructor-function, new-operator, instanceof]
  example:
    code: "const first = new Task(\"Water the plants\");\nconst second = new Task(\"Write to grandma\");\nfirst === second;               // false: two instances\nObject.hasOwn(first, \"finish\"); // false: the method is shared"
- id: class-syntax
  term: class
  name: { uk: "клас", en: "class" }
  aliases: ["class"]
  definition:
    uk: "Запис `class Назва { … }`, що збирає конструктор, поля й методи в один блок. Під капотом це та сама функція-конструктор: методи лежать на прототипі, екземпляри створює `new`, а без `new` клас викликати не можна."
    en: "The notation `class Name { … }` that gathers the constructor, fields and methods in one block. Under the hood it is the same constructor function: methods lie on the prototype, `new` creates instances, and a class cannot be called without `new`."
  see: [constructor-function, class-field, private-field, static-member]
  example:
    code: "class Task {\n  constructor(title) {\n    this.title = title;\n  }\n  describe() {\n    return \"Task: \" + this.title;\n  }\n}"
- id: class-field
  term: class field
  name: { uk: "поле класу", en: "class field" }
  definition:
    uk: "Рядок `назва = значення;` у тілі класу: кожен екземпляр отримує власну властивість із цим початковим значенням ще до запуску конструктора."
    en: "A line `name = value;` in the body of a class: every instance gets an own property with that initial value before the constructor runs."
  see: [class-syntax, private-field]
  example:
    code: "class Task {\n  done = false; // an own property of every Task\n}"
- id: private-field
  term: private field
  name: { uk: "приватне поле", en: "private field" }
  aliases: ["#field", "private"]
  definition:
    uk: "Поле класу, назва якого починається з `#`: його можна читати й змінювати лише всередині тіла цього класу. Звернення ззовні — помилка ще до запуску програми. Не плутай із підкресленням `_name`: воно лише домовленість, а властивість лишається публічною."
    en: "A class field whose name starts with `#`: it can be read and changed only inside the body of that class. Access from outside is an error before the program starts. Do not confuse it with an underscore `_name`: that is only an agreement, and the property stays public."
  see: [class-field, static-member]
  example:
    code: "class PiggyBank {\n  #savedMinor = 0;\n  total() {\n    return this.#savedMinor;\n  }\n}"
- id: static-member
  term: static member
  name: { uk: "статичний член", en: "static member" }
  aliases: ["static"]
  definition:
    uk: "Метод чи поле класу зі словом `static`: належить самому класові, а не його екземплярам. Викликається як `Клас.метод()`, а на екземплярі не існує. Типове застосування — статична фабрика, яка створює екземпляр із перевірених даних."
    en: "A method or field of a class marked `static`: it belongs to the class itself, not to its instances. It is called as `Class.method()` and does not exist on an instance. A typical use is a static factory that creates an instance from checked data."
  see: [class-syntax, private-field]
  example:
    code: "class Task {\n  static fromTitle(title) {\n    return new Task(title.trim());\n  }\n}\nTask.fromTitle(\"  Water  \");"
