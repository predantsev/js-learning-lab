# Terms introduced in JS-01. One file per unit keeps parallel authoring conflict-free.
- id: program
  term: program
  name: { uk: "програма", en: "program" }
  definition:
    uk: "Текст з інструкціями, які комп’ютер виконує по черзі, згори донизу, рівно так, як їх написано."
    en: "Text with instructions that the computer carries out one after another, top to bottom, exactly as written."
- id: console
  term: console
  name: { uk: "консоль", en: "console" }
  definition:
    uk: "Панель, куди програма виводить текст через `console.log(...)`. Програмісти дивляться в консоль, щоб побачити, що насправді робить код."
    en: "The panel where a program prints text with `console.log(...)`. Programmers look at the console to see what the code really does."
  example:
    code: "console.log(2 + 3); // prints 5"
- id: run
  term: run
  name: { uk: "запустити", en: "run" }
  definition:
    uk: "Запустити програму — означає дати комп’ютеру виконати її інструкції. Поки програму не запущено, це просто текст."
    en: "To run a program is to let the computer carry out its instructions. Until it runs, a program is just text."
  aliases: ["execute", "виконати"]
- id: error-message
  term: error message
  name: { uk: "повідомлення про помилку", en: "error message" }
  definition:
    uk: "Текст, який JavaScript показує, коли не може виконати інструкцію. У ньому є назва помилки, пояснення і місце: файл та номер рядка."
    en: "The text JavaScript shows when it cannot carry out an instruction. It contains the error name, an explanation and the place: the file and the line number."
  see: [syntax-error, reference-error]
- id: syntax-error
  term: SyntaxError
  name: { uk: "синтаксична помилка", en: "syntax error" }
  definition:
    uk: "Помилка, через яку JavaScript не може прочитати код: бракує лапок, дужки чи коми. Програма з такою помилкою не починає виконуватися."
    en: "An error that stops JavaScript from reading the code: a quote, bracket or comma is missing. A program with such an error does not start running."
  example:
    code: "console.log(\"Hello);   // the closing quote is missing"
- id: reference-error
  term: ReferenceError
  name: { uk: "помилка звернення до невідомої назви", en: "reference error" }
  definition:
    uk: "Помилка під час виконання: код звертається до назви, якої JavaScript не знає. Найчастіше це одруківка або текст без лапок."
    en: "An error while running: the code uses a name JavaScript does not know. Most often it is a typo or text without quotes."
  example:
    code: "consol.log(\"Hello\");   // ReferenceError: consol is not defined"
