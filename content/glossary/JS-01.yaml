# Terms introduced in JS-01. One file per unit keeps parallel authoring conflict-free.
- id: program
  term: program
  name: { uk: "програма", en: "program" }
  definition:
    uk: "Текст з інструкціями, які комп’ютер виконує по черзі, згори донизу, рівно так, як їх написано."
    en: "Text with instructions that the computer carries out one after another, top to bottom, exactly as written."
- id: console
  term: console
  name: { uk: "консоль", en: "console" }
  definition:
    uk: "Панель, куди програма виводить текст через `console.log(...)`. Програмісти дивляться в консоль, щоб побачити, що насправді робить код."
    en: "The panel where a program prints text with `console.log(...)`. Programmers look at the console to see what the code really does."
  example:
    code: "console.log(2 + 3); // prints 5"
- id: run
  term: run
  name: { uk: "запустити", en: "run" }
  definition:
    uk: "Запустити програму — означає дати комп’ютеру виконати її інструкції. Поки програму не запущено, це просто текст."
    en: "To run a program is to let the computer carry out its instructions. Until it runs, a program is just text."
  aliases: ["execute", "виконати"]
- id: error-message
  term: error message
  name: { uk: "повідомлення про помилку", en: "error message" }
  definition:
    uk: "Текст, який JavaScript показує, коли не може виконати інструкцію. У ньому є назва помилки, пояснення і місце: файл та номер рядка."
    en: "The text JavaScript shows when it cannot carry out an instruction. It contains the error name, an explanation and the place: the file and the line number."
  see: [syntax-error, reference-error]
- id: syntax-error
  term: SyntaxError
  name: { uk: "синтаксична помилка", en: "syntax error" }
  definition:
    uk: "Помилка, через яку JavaScript не може прочитати код: бракує лапок, дужки чи коми. Програма з такою помилкою не починає виконуватися."
    en: "An error that stops JavaScript from reading the code: a quote, bracket or comma is missing. A program with such an error does not start running."
  example:
    code: "console.log(\"Hello);   // the closing quote is missing"
- id: reference-error
  term: ReferenceError
  name: { uk: "помилка звернення до невідомої назви", en: "reference error" }
  definition:
    uk: "Помилка під час виконання: код звертається до назви, якої JavaScript не знає. Найчастіше це одруківка або текст без лапок."
    en: "An error while running: the code uses a name JavaScript does not know. Most often it is a typo or text without quotes."
  example:
    code: "consol.log(\"Hello\");   // ReferenceError: consol is not defined"
- id: value
  term: value
  name: { uk: "значення", en: "value" }
  definition:
    uk: "Одиниця даних, з якою працює програма: число `80`, текст `\"Навушники\"`, `true` чи `null`. Кожне значення має тип."
    en: "A piece of data a program works with: the number `80`, the text `\"Headphones\"`, `true` or `null`. Every value has a type."
  see: [number, string, boolean]
  example:
    code: "console.log(80, \"Headphones\", true); // 80 Headphones true"
- id: number
  term: number
  name: { uk: "число", en: "number" }
  definition:
    uk: "Тип значень для кількостей, цін і сум. Числа пишуть цифрами без лапок, а дробову частину відокремлюють крапкою: `99.9`. Між двома числами `+` додає."
    en: "The type for amounts, prices and quantities. Numbers are written in digits without quotes, and the fractional part is separated by a dot: `99.9`. Between two numbers, `+` adds."
  example:
    code: "console.log(80 + 45.5); // 125.5"
- id: string
  term: string
  name: { uk: "рядок", en: "string" }
  definition:
    uk: "Тип значень для тексту. Рядок пишуть у подвійних `\"…\"` або одинарних `'…'` лапках. Цифри в лапках — теж текст, а `+` між рядками склеює їх: `\"5\" + \"5\"` дає `\"55\"`."
    en: "The type for text. A string is written in double `\"…\"` or single `'…'` quotes. Digits in quotes are text too, and `+` between strings joins them: `\"5\" + \"5\"` gives `\"55\"`."
  aliases: ["text", "текст"]
  example:
    code: "console.log(\"5\" + \"5\"); // 55"
- id: literal
  term: literal
  name: { uk: "літерал", en: "literal" }
  definition:
    uk: "Значення, записане в коді безпосередньо, як є: `80`, `\"Навушники\"`, `true`, `null`."
    en: "A value written directly in the code, as it is: `80`, `\"Headphones\"`, `true`, `null`."
  see: [value]
- id: expression
  term: expression
  name: { uk: "вираз", en: "expression" }
  definition:
    uk: "Шматок коду, який JavaScript обчислює до одного значення: `80 + 45` дає `125`, `3 > 2` дає `true`. Навіть окремий літерал `80` — це вираз."
    en: "A piece of code that JavaScript evaluates to one value: `80 + 45` gives `125`, `3 > 2` gives `true`. Even a single literal like `80` is an expression."
  see: [operator, precedence]
- id: operator
  term: operator
  name: { uk: "оператор", en: "operator" }
  definition:
    uk: "Знак, що виконує дію над значеннями: `+`, `-`, `*`, `/`, `%` в арифметиці; `>`, `===` у порівняннях; `typeof` для типу."
    en: "A symbol that performs an action on values: `+`, `-`, `*`, `/`, `%` in arithmetic; `>`, `===` in comparisons; `typeof` for the type."
  see: [expression, precedence]
- id: precedence
  term: operator precedence
  name: { uk: "пріоритет операторів", en: "operator precedence" }
  definition:
    uk: "Правило, яке визначає, що JavaScript обчислює першим: `*`, `/` і `%` раніше за `+` і `-`; оператори одного рівня — зліва направо; вираз у дужках — найперше."
    en: "The rule that decides what JavaScript computes first: `*`, `/` and `%` before `+` and `-`; operators of the same level from left to right; an expression in parentheses before everything else."
  aliases: ["order of operations", "порядок дій"]
  example:
    code: "console.log(2 + 3 * 4);   // 14\nconsole.log((2 + 3) * 4); // 20"
- id: boolean
  term: boolean
  name: { uk: "булеве значення", en: "boolean" }
  definition:
    uk: "Тип значень «так чи ні»: лише `true` або `false`, без лапок. Його дають порівняння: `80 > 50` — це `true`."
    en: "The yes-or-no type: only `true` or `false`, without quotes. Comparisons produce it: `80 > 50` is `true`."
  see: [comparison]
  example:
    code: "console.log(80 > 50); // true"
- id: "null"
  term: "null"
  name: { uk: "null", en: "null" }
  definition:
    uk: "Особливе значення «порожньо навмисно»: програміст пише `null`, коли значення свідомо немає — наприклад, у бажання ще немає ціни. `typeof null` дає `\"object\"`, але це стара помилка мови: `null` не є об’єктом. Перевіряють його прямим порівнянням `=== null`."
    en: "A special value meaning “empty on purpose”: the programmer writes `null` when there deliberately is no value — for example, a wish has no price yet. `typeof null` gives `\"object\"`, but that is an old mistake in the language: `null` is not an object. Check for it with a direct comparison, `=== null`."
  see: ["undefined"]
- id: "undefined"
  term: "undefined"
  name: { uk: "undefined", en: "undefined" }
  definition:
    uk: "Особливе значення «ще не задано»: його дає сам JavaScript, коли чомусь ще не надали значення. Навмисну порожнечу позначають `null`, а не `undefined`; `null === undefined` дає `false`."
    en: "A special value meaning “not set yet”: JavaScript itself produces it when something has not been given a value. Deliberate emptiness is marked with `null`, not `undefined`; `null === undefined` is `false`."
  see: ["null"]
- id: typeof
  term: typeof
  name: { uk: "typeof", en: "typeof" }
  definition:
    uk: "Оператор, що повертає назву типу значення як рядок: `typeof 80` дає `\"number\"`, `typeof \"80\"` — `\"string\"`, `typeof true` — `\"boolean\"`, `typeof undefined` — `\"undefined\"`. Виняток: `typeof null` дає `\"object\"`."
    en: "An operator that returns the name of a value's type as a string: `typeof 80` gives `\"number\"`, `typeof \"80\"` gives `\"string\"`, `typeof true` gives `\"boolean\"`, `typeof undefined` gives `\"undefined\"`. The exception: `typeof null` gives `\"object\"`."
  example:
    code: "console.log(typeof \"80\"); // string"
- id: comparison
  term: comparison
  name: { uk: "порівняння", en: "comparison" }
  definition:
    uk: "Вираз-питання, що дає `true` або `false`: `>` більше, `<` менше, `>=` не менше, `<=` не більше, `===` дорівнює, `!==` не дорівнює. `===` порівнює і значення, і тип: `5 === \"5\"` дає `false`."
    en: "A question-like expression that gives `true` or `false`: `>` greater, `<` less, `>=` at least, `<=` at most, `===` equal, `!==` not equal. `===` compares both the value and the type: `5 === \"5\"` is `false`."
  see: [boolean]
- id: element
  term: element
  name: { uk: "елемент", en: "element" }
  definition:
    uk: "Будівельний блок HTML-сторінки: відкривальний тег, вміст і закривальний тег, як-от `<h1>Трекер звичок</h1>`. Елементи вкладаються один в одного."
    en: "A building block of an HTML page: an opening tag, content and a closing tag, such as `<h1>Habit tracker</h1>`. Elements nest inside each other."
  see: [tag, attribute]
- id: tag
  term: tag
  name: { uk: "тег", en: "tag" }
  definition:
    uk: "Назва елемента в кутових дужках. `<p>` відкриває абзац, `</p>` — з косою рискою — закриває його. Деякі елементи, як `<img>`, мають лише відкривальний тег."
    en: "An element's name in angle brackets. `<p>` opens a paragraph, `</p>` — with a slash — closes it. Some elements, such as `<img>`, have only an opening tag."
  see: [element]
- id: attribute
  term: attribute
  name: { uk: "атрибут", en: "attribute" }
  definition:
    uk: "Додаткове налаштування елемента у відкривальному тегу, у формі `назва=\"значення\"`: `<html lang=\"uk\">`, `<img alt=\"Чашка кави\">`."
    en: "An extra setting of an element inside its opening tag, written as `name=\"value\"`: `<html lang=\"en\">`, `<img alt=\"A cup of coffee\">`."
  see: [element]
- id: heading
  term: heading
  name: { uk: "заголовок", en: "heading" }
  definition:
    uk: "Елементи `<h1>`–`<h6>`, що будують зміст сторінки: `<h1>` — назва всієї сторінки, `<h2>` — розділи, `<h3>` — підрозділи. Рівень обирають за роллю в структурі, а не за розміром тексту."
    en: "The elements `<h1>`–`<h6>`, which build the page's outline: `<h1>` is the title of the whole page, `<h2>` marks sections, `<h3>` subsections. The level is chosen by its role in the structure, not by text size."
- id: landmark
  term: landmark
  name: { uk: "орієнтир", en: "landmark" }
  definition:
    uk: "Елемент, що позначає велику ділянку сторінки, до якої можна перейти одразу. `<main>` — головний вміст: програми екранного читання дають змогу перестрибнути до нього, минаючи решту."
    en: "An element that marks a major region of the page people can jump to directly. `<main>` is the main content: screen readers let users skip straight to it."
- id: link
  term: link
  name: { uk: "посилання", en: "link" }
  definition:
    uk: "Елемент `<a href=\"…\">`, що веде кудись: на іншу сторінку або в інше місце цієї. Без атрибута `href` елемент `<a>` — уже не посилання."
    en: "The element `<a href=\"…\">`, which takes you somewhere: to another page or to another place on this one. Without the `href` attribute, `<a>` is no longer a link."
  see: [button]
- id: button
  term: button
  name: { uk: "кнопка", en: "button" }
  definition:
    uk: "Елемент `<button>`, що виконує дію на цій сторінці: додати, видалити, надіслати. З клавіатури кнопку натискають клавішею Enter або пробілом."
    en: "The element `<button>`, which performs an action on this page: add, delete, send. From the keyboard, a button is pressed with Enter or Space."
  see: [link]
- id: alt-text
  term: alt text
  name: { uk: "альтернативний текст", en: "alt text" }
  definition:
    uk: "Значення атрибута `alt` у `<img>`: опис того, що видно на зображенні, для тих, хто його не бачить. Його зачитує програма екранного читання і показує браузер, коли картинка не завантажилась. Суто декоративне зображення отримує порожній `alt=\"\"`."
    en: "The value of the `alt` attribute of `<img>`: a description of what the image shows, for people who cannot see it. Screen readers read it, and the browser shows it when the picture fails to load. A purely decorative image gets an empty `alt=\"\"`."
  aliases: ["alt"]
- id: table
  term: table
  name: { uk: "таблиця", en: "table" }
  definition:
    uk: "Елемент `<table>` для даних у рядках і стовпцях: `<tr>` — рядок, `<th>` — клітинка заголовка, `<td>` — клітинка з даними. Завдяки `<th>` програма екранного читання знає, до якого стовпця належить кожна клітинка."
    en: "The element `<table>` for data in rows and columns: `<tr>` is a row, `<th>` a header cell, `<td>` a data cell. Thanks to `<th>`, a screen reader knows which column each cell belongs to."
- id: selector
  term: selector
  name: { uk: "селектор", en: "selector" }
  definition:
    uk: "Частина CSS-правила, що вибирає елементи: `p` — усі абзаци, `.done` — усі елементи з класом `done`, `#title` — елемент з `id=\"title\"`."
    en: "The part of a CSS rule that selects elements: `p` selects all paragraphs, `.done` all elements with the class `done`, `#title` the element with `id=\"title\"`."
  see: [css-rule, css-class]
- id: css-rule
  term: CSS rule
  name: { uk: "CSS-правило", en: "CSS rule" }
  definition:
    uk: "Селектор і оголошення у фігурних дужках, як-от `h1 { color: teal; }`. Правило застосовується до кожного елемента, який вибирає селектор, — скільки б їх не було."
    en: "A selector plus declarations in curly braces, such as `h1 { color: teal; }`. The rule applies to every element the selector matches, however many there are."
  see: [selector, declaration]
  example:
    code: "h1 {\n  color: teal;\n  text-align: center;\n}"
    lang: css
- id: css-class
  term: class (CSS)
  name: { uk: "клас", en: "class" }
  definition:
    uk: "Назва, яку дають елементам атрибутом `class`, як-от `<p class=\"done\">`. Один клас можуть мати багато елементів, і селектор `.done` вибирає їх усі."
    en: "A name given to elements with the `class` attribute, such as `<p class=\"done\">`. Many elements can share a class, and the selector `.done` selects them all."
  see: [selector]
- id: declaration
  term: CSS declaration
  name: { uk: "оголошення", en: "declaration" }
  definition:
    uk: "Пара «властивість: значення;» усередині CSS-правила, як-от `color: teal;`. Оголошення відокремлюють крапкою з комою: якщо її забути, браузер відкине і це оголошення, і наступне."
    en: "A “property: value;” pair inside a CSS rule, such as `color: teal;`. Declarations are separated by semicolons: forget one, and the browser drops both that declaration and the next."
  see: [css-rule]
