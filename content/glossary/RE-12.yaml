# Terms introduced in RE-12. One file per unit keeps parallel authoring conflict-free.
- id: production-build
  term: production build
  name: { uk: "production-збірка", en: "production build" }
  definition:
    uk: "Те, що команда збирання (у проєкті Vite — `npm run build`) пише в теку `dist`: `index.html` і стиснуті файли в `dist/assets`, готові до того, щоб їх віддавав будь-який статичний сервер. На відміну від dev-сервера, тут немає перетворення «на льоту» й автооновлення: файли вже готові, і людина отримує саме їх."
    en: "What the build command (in a Vite project, `npm run build`) writes into the `dist` folder: `index.html` and minified files in `dist/assets`, ready to be served by any static server. Unlike the dev server there is no on-the-fly transformation and no live reload: the files are finished, and a person receives exactly them."
  aliases: ["prod build", "продакшн-збірка", "dist"]
  see: [build-step, content-hash, build-time-variable]
- id: content-hash
  term: content hash
  name: { uk: "хеш вмісту", en: "content hash" }
  definition:
    uk: "Короткий код у назві зібраного файла, обчислений з його вмісту: `index-BIrlHGyo.js`. Той самий вміст дає ту саму назву, змінений — нову. Тому файл із такою назвою ніколи не змінюється, і браузер може зберігати його в кеші як завгодно довго."
    en: "A short code in the name of a built file, computed from its contents: `index-BIrlHGyo.js`. The same contents give the same name, changed contents a new one. So a file with such a name never changes, and the browser may keep it in its cache for as long as it likes."
  aliases: ["hash in the file name", "хеш у назві файла"]
  see: [production-build]
- id: build-time-variable
  term: build-time variable
  name: { uk: "змінна часу збирання", en: "build-time variable" }
  definition:
    uk: "Значення, яке збирач вписує в код під час збирання. У Vite це `import.meta.env.VITE_…`: на місці виразу в bundle стоїть сам текст із `.env`. Усе, що потрапило в bundle, може прочитати кожен, хто відкрив сайт, тому так передають лише публічні налаштування. Значення без префікса `VITE_` у клієнтський код не потрапляють: такий вираз дає `undefined`."
    en: "A value the bundler writes into the code during the build. In Vite it is `import.meta.env.VITE_…`: in the bundle the expression is replaced by the text itself from `.env`. Anything that reaches the bundle can be read by everyone who opens the site, so only public settings travel this way. Values without the `VITE_` prefix do not reach client code: such an expression gives `undefined`."
  aliases: ["import.meta.env", "VITE_", "env variable in the bundle"]
  see: [environment-variable, production-build]
- id: ci-pipeline
  term: CI pipeline
  name: { uk: "CI-конвеєр", en: "CI pipeline" }
  definition:
    uk: "Перевірки, які сервер безперервної інтеграції (continuous integration) запускає на свіжій копії репозиторію після кожного push чи pull request: встановити залежності з lockfile, lint, перевірка типів, тести, збирання. Кроки йдуть по черзі, і перший невдалий зупиняє решту. Кожен крок — звичайна команда, тож її можна відтворити локально."
    en: "The checks a continuous integration server runs on a fresh copy of the repository after every push or pull request: install the dependencies from the lockfile, lint, typecheck, tests, build. The steps run in turn, and the first failing one stops the rest. Every step is an ordinary command, so it can be reproduced locally."
  aliases: ["CI", "continuous integration", "GitHub Actions workflow", "конвеєр перевірок"]
  see: [quality-gate, lockfile]
- id: quality-gate
  term: quality gate
  name: { uk: "ворота якості", en: "quality gate" }
  definition:
    uk: "Перевірка, яку треба пройти, щоб робота йшла далі: lint, перевірка типів, тести. Ворота тримаються на коді виходу команди: `0` пропускає, будь-яке інше число зупиняє. Що саме зупиняє запуск, вирішують налаштування інструмента: попередження лінтера, наприклад, коду виходу не змінює."
    en: "A check that has to pass for the work to go on: lint, typecheck, tests. A gate rests on the command's exit code: `0` lets the work through, any other number stops it. What exactly stops a run is decided by the tool's settings: a linter warning, for example, does not change the exit code."
  aliases: ["gate", "ворота"]
  see: [ci-pipeline]
- id: build-artifact
  term: build artifact
  name: { uk: "артефакт збирання", en: "build artifact" }
  definition:
    uk: "Готовий результат збирання з певного commit-а — для вебзастосунку це тека `dist`. Саме артефакт віддають людям, і він не змінюється, хоч би що відбувалося в репозиторії далі. Щоб знати, з якого коду він зібраний, у нього вписують версію випуску й id commit-а."
    en: "The finished result of a build from a particular commit — for a web app, the `dist` folder. The artifact is what people are given, and it does not change whatever happens in the repository afterwards. To know which code it was built from, the release version and the commit id are written into it."
  aliases: ["artifact", "артефакт", "dist"]
  see: [production-build, release-version]
- id: release-version
  term: release version
  name: { uk: "версія випуску", en: "release version" }
  definition:
    uk: "Номер версії за semver (`0.1.0`, `1.0.0`), який ставлять свідомо в момент випуску — командою `npm version`, що змінює `package.json`, робить commit і ставить тег `v0.1.0`. Вписана в артефакт під час збирання, вона показує людині й тобі, який саме випуск відкрито."
    en: "A semver version number (`0.1.0`, `1.0.0`) set on purpose at the moment of release — with the `npm version` command, which changes `package.json`, makes a commit and puts the tag `v0.1.0`. Written into the artifact during the build, it shows the person and you which release exactly is open."
  aliases: ["version", "версія", "npm version", "tag"]
  see: [build-artifact, semver]
- id: dependency-update
  term: dependency update
  name: { uk: "оновлення залежності", en: "dependency update" }
  definition:
    uk: "Перехід на нову версію пакета, який змінює `package.json` і `package-lock.json`. Роблять його як маленький випуск: прочитати нотатки випуску, окрема гілка, одна залежність, усі перевірки, порівняння lockfile і результату збирання — і злиття або відкат."
    en: "Moving to a new version of a package, which changes `package.json` and `package-lock.json`. It is done as a small release: read the release notes, a separate branch, one dependency, all the checks, a comparison of the lockfile and the build result — and then a merge or a revert."
  aliases: ["update", "оновлення", "npm outdated", "upgrade"]
  see: [lockfile, semver]
- id: static-hosting
  term: static hosting
  name: { uk: "статичний хостинг", en: "static hosting" }
  definition:
    uk: "Сервер, що лише віддає готові файли — `index.html`, JS, CSS, зображення — без жодного коду, який виконувався б на сервері для кожного запиту. Для production-збірки React-застосунку цього досить: усе, що робить застосунок, відбувається в браузері."
    en: "A server that only sends finished files — `index.html`, JS, CSS, images — with no code running on the server for each request. For a production build of a React app this is enough: everything the app does happens in the browser."
  aliases: ["static server", "статичний сервер"]
  see: [production-build, cache-busting]
- id: cache-busting
  term: cache busting
  name: { uk: "скидання кешу через назву", en: "cache busting" }
  definition:
    uk: "Спосіб примусити браузер узяти новий файл, не чекаючи, поки старий застаріє в кеші: новий вміст отримує нову назву (хеш вмісту), а некешований `index.html` посилається вже на неї. Старий файл лишається в кеші, але його ніхто не просить."
    en: "A way to make the browser take a new file without waiting for the old one to expire in the cache: new contents get a new name (the content hash), and the uncached `index.html` refers to that new name. The old file stays in the cache, but nobody asks for it."
  aliases: ["cache-busting", "скидання кешу"]
  see: [content-hash, cache-control]
- id: release-rollback
  term: rollback
  name: { uk: "відкат випуску", en: "rollback" }
  definition:
    uk: "Повернення людям попереднього випуску, коли новий зламав щось важливе. Готують його заздалегідь: кожен артефакт лежить у своїй теці, а відкат — це перемкнути сервер на попередню теку, а не перезбирати старий код. Відкриті вкладки нового випуску можуть після відкату не знайти своїх lazy-модулів, тож застосунок має вміти запропонувати оновити сторінку."
    en: "Giving people the previous release back when the new one broke something important. It is prepared in advance: every artifact lives in its own folder, and a rollback means switching the server to the previous folder, not rebuilding old code. Open tabs of the new release may fail to find their lazy modules after a rollback, so the app should be able to offer a page reload."
  aliases: ["roll back", "відкат", "відкотити"]
  see: [build-artifact, static-hosting]
- id: release-notes
  term: release notes
  name: { uk: "нотатки випуску", en: "release notes" }
  definition:
    uk: "Короткий опис того, що в новій версії помітить людина, яка користується застосунком: нове, виправлене, змінене. Пишуть словами людини, без назв із коду, — «сповіщення більше не дублюються», а не «додано cleanup». Нотатки випуску пакетів, які ти оновлюєш, читають так само уважно: там описано зміни, що можуть зламати твій код."
    en: "A short description of what a person who uses the app will notice in the new version: what is new, fixed or changed. It is written in the person's words, without names from the code — “alerts no longer appear twice”, not “added a cleanup”. The release notes of packages you update are read just as carefully: they describe the changes that may break your code."
  aliases: ["changelog", "release note", "журнал змін"]
  see: [release-version, code-review]
- id: preview-server
  term: preview server
  name: { uk: "preview-сервер", en: "preview server" }
  definition:
    uk: "Локальний сервер, що віддає вже зібрану теку `dist` так, як її віддаватиме статичний хостинг, — у Vite це `npm run preview` на `http://localhost:4173/`. На ньому перевіряють сам артефакт, а не вихідні модулі. Його порт відрізняється від dev-сервера, тож це інше джерело (origin) з окремим `localStorage`."
    en: "A local server that serves the already built `dist` folder the way static hosting will — in Vite, `npm run preview` at `http://localhost:4173/`. It is used to check the artifact itself, not the source modules. Its port differs from the dev server's, so it is a different origin with its own `localStorage`."
  aliases: ["vite preview", "npm run preview"]
  see: [production-build, origin]
  example:
    lang: tsx
    code: "<h1>{import.meta.env.VITE_APP_TITLE}</h1>"
