# Terms introduced in RE-12. One file per unit keeps parallel authoring conflict-free.
- id: production-build
  term: production build
  name: { uk: "production-збірка", en: "production build" }
  definition:
    uk: "Те, що команда збирання (у проєкті Vite — `npm run build`) пише в теку `dist`: `index.html` і стиснуті файли в `dist/assets`, готові до того, щоб їх віддавав будь-який статичний сервер. На відміну від dev-сервера, тут немає перетворення «на льоту» й автооновлення: файли вже готові, і людина отримує саме їх."
    en: "What the build command (in a Vite project, `npm run build`) writes into the `dist` folder: `index.html` and minified files in `dist/assets`, ready to be served by any static server. Unlike the dev server there is no on-the-fly transformation and no live reload: the files are finished, and a person receives exactly them."
  aliases: ["prod build", "продакшн-збірка", "dist"]
  see: [build-step, content-hash, build-time-variable]
- id: content-hash
  term: content hash
  name: { uk: "хеш вмісту", en: "content hash" }
  definition:
    uk: "Короткий код у назві зібраного файла, обчислений з його вмісту: `index-BIrlHGyo.js`. Той самий вміст дає ту саму назву, змінений — нову. Тому файл із такою назвою ніколи не змінюється, і браузер може зберігати його в кеші як завгодно довго."
    en: "A short code in the name of a built file, computed from its contents: `index-BIrlHGyo.js`. The same contents give the same name, changed contents a new one. So a file with such a name never changes, and the browser may keep it in its cache for as long as it likes."
  aliases: ["hash in the file name", "хеш у назві файла"]
  see: [production-build]
- id: build-time-variable
  term: build-time variable
  name: { uk: "змінна часу збирання", en: "build-time variable" }
  definition:
    uk: "Значення, яке збирач вписує в код під час збирання. У Vite це `import.meta.env.VITE_…`: на місці виразу в bundle стоїть сам текст із `.env`. Усе, що потрапило в bundle, може прочитати кожен, хто відкрив сайт, тому так передають лише публічні налаштування. Значення без префікса `VITE_` у клієнтський код не потрапляють: такий вираз дає `undefined`."
    en: "A value the bundler writes into the code during the build. In Vite it is `import.meta.env.VITE_…`: in the bundle the expression is replaced by the text itself from `.env`. Anything that reaches the bundle can be read by everyone who opens the site, so only public settings travel this way. Values without the `VITE_` prefix do not reach client code: such an expression gives `undefined`."
  aliases: ["import.meta.env", "VITE_", "env variable in the bundle"]
  see: [environment-variable, production-build]
  example:
    lang: tsx
    code: "<h1>{import.meta.env.VITE_APP_TITLE}</h1>"
