# Terms introduced in RN-12. One file per unit keeps parallel authoring conflict-free.
- id: new-architecture
  term: New Architecture
  name: { uk: "нова архітектура React Native", en: "New Architecture (React Native)" }
  aliases: ["New Architecture", "нова архітектура"]
  definition:
    uk: "Спосіб, яким React Native з’єднує JavaScript із native-кодом: JSI замість мосту, рендерер Fabric і TurboModules. Увімкнена за замовчуванням з React Native 0.76; з 0.82 — єдина: прапорці, що вимикали її, ігноруються."
    en: "The way React Native connects JavaScript to native code: JSI instead of the bridge, the Fabric renderer and TurboModules. On by default since React Native 0.76; since 0.82 it is the only one: the flags that turned it off are ignored."
  see: [jsi, fabric, turbomodule, legacy-bridge]
- id: legacy-bridge
  term: legacy bridge
  name: { uk: "міст (стара архітектура)", en: "legacy bridge" }
  aliases: ["bridge", "міст", "асинхронний міст"]
  definition:
    uk: "Канал старої архітектури React Native (до 0.82 її ще можна було ввімкнути): JavaScript і native-код обмінювалися повідомленнями, перетвореними на текст JSON, через асинхронну чергу. Кожне повідомлення серіалізується й чекає своєї черги, тож ні виклик, ні відповідь не приходять одразу."
    en: "The channel of React Native's old architecture (it could still be turned on before 0.82): JavaScript and native code exchanged messages turned into JSON text through an asynchronous queue. Every message is serialized and waits its turn, so neither a call nor its answer arrives at once."
  see: [new-architecture, jsi]
- id: jsi
  term: JSI
  name: { uk: "JSI (JavaScript Interface)", en: "JSI (JavaScript Interface)" }
  aliases: ["JavaScript Interface"]
  definition:
    uk: "Інтерфейс на C++, через який JavaScript тримає посилання на об’єкти C++ і навпаки й викликає їхні методи напряму — без серіалізації в JSON і без черги, за потреби синхронно. На ньому стоять Fabric і TurboModules."
    en: "A C++ interface through which JavaScript holds references to C++ objects and vice versa and calls their methods directly — without serializing to JSON and without a queue, synchronously when needed. Fabric and TurboModules are built on it."
  see: [new-architecture, turbomodule, fabric]
- id: fabric
  term: Fabric
  name: { uk: "Fabric (рендерер)", en: "Fabric (renderer)" }
  aliases: ["Fabric renderer", "рендерер Fabric"]
  definition:
    uk: "Рендерер нової архітектури React Native. Його ядро написане на C++ і спільне для Android та iOS; він отримує від React нове дерево через JSI й перетворює його на native view, а розміри може виміряти синхронно."
    en: "The renderer of React Native's New Architecture. Its core is written in C++ and shared between Android and iOS; it receives React's new tree through JSI and turns it into native views, and it can measure sizes synchronously."
  see: [native-renderer, jsi]
- id: turbomodule
  term: TurboModule
  name: { uk: "TurboModule", en: "TurboModule" }
  aliases: ["Turbo Native Module", "TurboModules"]
  definition:
    uk: "Native-модуль нової архітектури: JavaScript викликає його методи через JSI за типізованою специфікацією. Модуль створюється ліниво — під час першого звернення, а не під час запуску застосунку."
    en: "A native module of the New Architecture: JavaScript calls its methods through JSI according to a typed specification. The module is created lazily — on first access, not at app start."
  see: [jsi, new-architecture]
- id: native-module
  term: native module
  name: { uk: "native-модуль", en: "native module" }
  aliases: ["native modules", "native-модулі", "нативний модуль"]
  definition:
    uk: "Код на Kotlin/Java (Android) чи Objective-C/Swift (iOS), методи якого JavaScript викликає через React Native: сховище, датчик, будь-яка можливість платформи. У React Native 0.86 це TurboModule з типізованою специфікацією."
    en: "Code in Kotlin/Java (Android) or Objective-C/Swift (iOS) whose methods JavaScript calls through React Native: storage, a sensor, any platform capability. In React Native 0.86 it is a TurboModule with a typed spec."
  see: [turbomodule, module-spec]
- id: module-spec
  term: module spec
  name: { uk: "специфікація модуля", en: "module spec" }
  aliases: ["TurboModule spec", "специфікація"]
  definition:
    uk: "Файл TypeScript чи Flow з назвою, що починається з `Native`: `interface Spec extends TurboModule` з типами методів і виклик `TurboModuleRegistry.getEnforcing<Spec>(…)` з назвою модуля. Це контракт між JavaScript і native-кодом, з якого codegen генерує native-інтерфейси."
    en: "A TypeScript or Flow file whose name starts with `Native`: an `interface Spec extends TurboModule` with the method types and a call of `TurboModuleRegistry.getEnforcing<Spec>(…)` with the module's name. It is the contract between JavaScript and native code from which codegen generates the native interfaces."
  see: [codegen, native-module]
- id: codegen
  term: codegen
  name: { uk: "codegen", en: "codegen" }
  aliases: ["React Native codegen"]
  definition:
    uk: "Інструмент React Native, що під час збирання читає специфікації модулів і компонентів і генерує native-інтерфейси (абстрактний клас Java, протокол Objective-C) та код C++ для JSI. Реалізацію методів він не пише: її пише розробник під згенерований інтерфейс."
    en: "React Native’s tool that, during the build, reads module and component specs and generates the native interfaces (a Java abstract class, an Objective-C protocol) and the C++ code for JSI. It does not write the method implementations: a developer writes them against the generated interface."
  see: [module-spec, jsi]
- id: autolinking
  term: autolinking
  name: { uk: "autolinking", en: "autolinking" }
  aliases: ["автоматичне підключення"]
  definition:
    uk: "Крок native-збирання, на якому React Native (і Expo) самі знаходять native-код встановлених бібліотек у `node_modules` і додають його до проєктів Android та iOS. Він спрацьовує лише під час наступної native-збірки: `npm install` сам нічого не підключає й не перевіряє."
    en: "A step of the native build in which React Native (and Expo) find the native code of installed libraries in `node_modules` by themselves and add it to the Android and iOS projects. It runs only during the next native build: `npm install` itself links and checks nothing."
  see: [native-module, native-rebuild]
- id: compatibility-spike
  term: compatibility spike
  name: { uk: "перевірка сумісності (spike)", en: "compatibility spike" }
  aliases: ["spike", "spike сумісності"]
  definition:
    uk: "Коротка окрема спроба на гілці, що відповідає на одне питання: чи працює ця native-бібліотека в цьому проєкті на заявленій цілі. Має наперед записані версії, один мінімальний тестовий екран, шлях відкату (видалити гілку) і результати, що відкидають бібліотеку."
    en: "A short separate attempt on a branch that answers one question: does this native library work in this project on the declared target. It has versions written down in advance, one minimal test screen, a rollback path (delete the branch) and the results that reject the library."
  see: [autolinking, git-branch]
- id: interop-layer
  term: interop layer
  name: { uk: "шар сумісності (interop layer)", en: "interop layer" }
  aliases: ["interoperability layer", "interop"]
  definition:
    uk: "Код нової архітектури, що дає native-модулям і view старої архітектури працювати без переписування. Він не дає того, що з’являється лише після міграції: синхронних викликів, перевірки типів codegen, спільного C++; не підтримує власних shadow node й конкурентних можливостей React. За дописом про 0.82, його залишать «на осяжне майбутнє»."
    en: "New Architecture code that lets native modules and views of the old architecture run without a rewrite. It does not give what comes only after a migration: synchronous calls, codegen type checking, shared C++; it does not support custom shadow nodes or React's concurrent features. According to the 0.82 release post, it stays “for the foreseeable future”."
  see: [new-architecture, legacy-bridge]
