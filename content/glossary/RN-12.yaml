# Terms introduced in RN-12. One file per unit keeps parallel authoring conflict-free.
- id: new-architecture
  term: New Architecture
  name: { uk: "нова архітектура React Native", en: "New Architecture (React Native)" }
  aliases: ["New Architecture", "нова архітектура"]
  definition:
    uk: "Спосіб, яким React Native з’єднує JavaScript із native-кодом: JSI замість мосту, рендерер Fabric і TurboModules. Увімкнена за замовчуванням з React Native 0.76; з 0.82 — єдина: прапорці, що вимикали її, ігноруються."
    en: "The way React Native connects JavaScript to native code: JSI instead of the bridge, the Fabric renderer and TurboModules. On by default since React Native 0.76; since 0.82 it is the only one: the flags that turned it off are ignored."
  see: [jsi, fabric, turbomodule, legacy-bridge]
- id: legacy-bridge
  term: legacy bridge
  name: { uk: "міст (стара архітектура)", en: "legacy bridge" }
  aliases: ["bridge", "міст", "асинхронний міст"]
  definition:
    uk: "Канал старої архітектури React Native (до 0.82 її ще можна було ввімкнути): JavaScript і native-код обмінювалися повідомленнями, перетвореними на текст JSON, через асинхронну чергу. Кожне повідомлення серіалізується й чекає своєї черги, тож ні виклик, ні відповідь не приходять одразу."
    en: "The channel of React Native's old architecture (it could still be turned on before 0.82): JavaScript and native code exchanged messages turned into JSON text through an asynchronous queue. Every message is serialized and waits its turn, so neither a call nor its answer arrives at once."
  see: [new-architecture, jsi]
- id: jsi
  term: JSI
  name: { uk: "JSI (JavaScript Interface)", en: "JSI (JavaScript Interface)" }
  aliases: ["JavaScript Interface"]
  definition:
    uk: "Інтерфейс на C++, через який JavaScript тримає посилання на об’єкти C++ і навпаки й викликає їхні методи напряму — без серіалізації в JSON і без черги, за потреби синхронно. На ньому стоять Fabric і TurboModules."
    en: "A C++ interface through which JavaScript holds references to C++ objects and vice versa and calls their methods directly — without serializing to JSON and without a queue, synchronously when needed. Fabric and TurboModules are built on it."
  see: [new-architecture, turbomodule, fabric]
- id: fabric
  term: Fabric
  name: { uk: "Fabric (рендерер)", en: "Fabric (renderer)" }
  aliases: ["Fabric renderer", "рендерер Fabric"]
  definition:
    uk: "Рендерер нової архітектури React Native. Його ядро написане на C++ і спільне для Android та iOS; він отримує від React нове дерево через JSI й перетворює його на native view, а розміри може виміряти синхронно."
    en: "The renderer of React Native's New Architecture. Its core is written in C++ and shared between Android and iOS; it receives React's new tree through JSI and turns it into native views, and it can measure sizes synchronously."
  see: [native-renderer, jsi]
- id: turbomodule
  term: TurboModule
  name: { uk: "TurboModule", en: "TurboModule" }
  aliases: ["Turbo Native Module", "TurboModules"]
  definition:
    uk: "Native-модуль нової архітектури: JavaScript викликає його методи через JSI за типізованою специфікацією. Модуль створюється ліниво — під час першого звернення, а не під час запуску застосунку."
    en: "A native module of the New Architecture: JavaScript calls its methods through JSI according to a typed specification. The module is created lazily — on first access, not at app start."
  see: [jsi, new-architecture]
