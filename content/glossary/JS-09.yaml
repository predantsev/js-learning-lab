# Terms introduced in JS-09 (tests, assertions, boundary cases, fixtures, test doubles, debugging).
- id: automated-test
  term: automated test
  name: { uk: "автоматичний тест", en: "automated test" }
  aliases: [test]
  definition:
    uk: "Код, який викликає твій код із підготовленими даними й порівнює результат з очікуваним. Якщо результат інший, тест падає й показує, що очікувалося і що отримано. Його можна запускати після кожної зміни — щоразу однаково й за секунди."
    en: "Code that calls your code with prepared data and compares the result with what is expected. If the result differs, the test fails and shows what was expected and what it got. It can run after every change — the same way every time, in seconds."
  example:
    code: "test(\"counts only pending tasks\", () => {\n  expect(countPending(tasks)).toBe(2);\n});"
  see: [test-suite, unit-test]
- id: test-suite
  term: test suite
  name: { uk: "набір тестів (test suite)", en: "test suite" }
  definition:
    uk: "Усі тести проєкту чи модуля, які запускаються разом. Набір повідомляє, які тести пройшли, а які впали, і для кожного, що впав, — що очікувалося і що отримано."
    en: "All the tests of a project or module that run together. The suite reports which tests passed and which failed, and for each failed one what was expected and what came out."
  see: [automated-test]
- id: unit-test
  term: unit test
  name: { uk: "unit-тест", en: "unit test" }
  definition:
    uk: "Тест однієї функції чи модуля окремо від сторінки, сховища й мережі. Виконується за мілісекунди, і коли падає, одразу показує, у якій функції шукати дефект."
    en: "A test of one function or module on its own, without the page, storage or the network. It runs in milliseconds, and when it fails it shows right away which function to look in."
  see: [integration-test, end-to-end-test]
- id: integration-test
  term: integration test
  name: { uk: "інтеграційний тест", en: "integration test" }
  definition:
    uk: "Тест, що перевіряє кілька модулів разом: наприклад, що справи, завантажені зі сховища, правильно показуються списком. Ловить помилки в тому, як частини з’єднано між собою, яких не бачать unit-тести окремих функцій."
    en: "A test that checks several modules together: for example, that tasks loaded from storage are shown correctly as a list. It catches mistakes in how the parts are wired together, which unit tests of single functions cannot see."
  see: [unit-test, end-to-end-test]
- id: end-to-end-test
  term: end-to-end test
  name: { uk: "end-to-end тест", en: "end-to-end test" }
  aliases: [E2E test, e2e]
  definition:
    uk: "Тест усього застосунку так, як ним користується людина: окремий інструмент (наприклад, Playwright) відкриває справжній браузер, натискає, вводить текст, перезавантажує сторінку й перевіряє, що видно. Охоплює все разом, але працює повільно й, коли падає, не каже, у якій частині дефект."
    en: "A test of the whole app the way a person uses it: a separate tool (for example, Playwright) opens a real browser, clicks, types, reloads the page and checks what is visible. It covers everything together, but it is slow, and when it fails it does not say which part holds the defect."
  see: [unit-test, integration-test]
- id: assertion
  term: assertion
  name: { uk: "assertion (перевірка в тесті)", en: "assertion" }
  definition:
    uk: "Твердження в тесті, яке мусить бути правдою: «фактичне значення дорівнює очікуваному», «цей виклик кидає помилку». Якщо воно хибне, assertion кидає помилку, і тест падає з повідомленням, що очікувалося і що отримано."
    en: "A statement in a test that must be true: “the actual value equals the expected one”, “this call throws”. If it is false, the assertion throws an error and the test fails with a message saying what was expected and what came out."
  example:
    code: "expect(total, \"wanted total\").toBe(125);\nexpect(loaded).toEqual(saved);\nexpect(() => assertValidPrice(-1)).toThrow(RangeError);"
  see: [expected-value, actual-value, test-case]
- id: test-case
  term: test case
  name: { uk: "тестовий випадок", en: "test case" }
  definition:
    uk: "Одна ситуація, яку перевіряє тест: назва, підготовлені вхідні дані й assertions про результат. Хороший тестовий випадок перевіряє одну річ, тож коли він падає, з назви видно, що саме зламалося."
    en: "One situation a test checks: a name, prepared input data and assertions about the result. A good test case checks one thing, so when it fails its name tells you what broke."
  see: [assertion, automated-test]
- id: expected-value
  term: expected value
  name: { uk: "очікуване значення", en: "expected value" }
  definition:
    uk: "Значення, яке код мусить повернути за умовою задачі. Його пишуть у тесті наперед і самостійно — не копіюють з того, що код повертає зараз, бо тоді тест погодиться і з дефектом."
    en: "The value the code must return according to the requirements. It is written into the test in advance and independently — not copied from what the code returns right now, because then the test agrees with the defect too."
  see: [actual-value, assertion]
- id: actual-value
  term: actual value
  name: { uk: "фактичне значення", en: "actual value" }
  definition:
    uk: "Значення, яке код справді повернув у тесті. Assertion порівнює його з очікуваним; коли вони різні, тест падає й показує обидва."
    en: "The value the code really returned in the test. An assertion compares it with the expected value; when they differ, the test fails and shows both."
  see: [expected-value, assertion]
- id: boundary-case
  term: boundary case
  name: { uk: "граничний випадок", en: "boundary case" }
  aliases: [edge case]
  definition:
    uk: "Вхідні дані на краю того, що функція має приймати: порожній список, один запис, `null` чи поле, якого немає, текст із самих пробілів, значення рівно на межі (80 символів) і одразу за нею (81). Саме там найчастіше ховаються дефекти, тому на кожну межу пишуть окремий тест."
    en: "Input at the edge of what a function must accept: an empty list, one record, `null` or a missing field, text of spaces only, a value exactly at a limit (80 characters) and just past it (81). That is where defects hide most often, so every boundary gets its own test."
  example:
    code: "expect(validateName(\"a\".repeat(80)).ok).toBe(true);\nexpect(validateName(\"a\".repeat(81)).ok).toBe(false);"
  see: [test-case, off-by-one]
