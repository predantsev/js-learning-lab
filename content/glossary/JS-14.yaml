# Terms introduced in JS-14.
- id: typescript
  term: TypeScript
  name: { uk: "TypeScript", en: "TypeScript" }
  aliases: ["TS"]
  definition:
    uk: "JavaScript із типами: до коду можна дописати, яке значення має бути в змінній, параметрі чи полі. Окрема програма, компілятор `tsc`, перевіряє ці типи до запуску, а тоді прибирає їх, і виконується звичайний JavaScript. Файли мають розширення `.ts`."
    en: "JavaScript with types: you can write down which value a variable, parameter or field should hold. A separate program, the compiler `tsc`, checks those types before running and then removes them, and plain JavaScript runs. Files end in `.ts`."
  see: [tsc, type-annotation, type-inference]
- id: type-annotation
  term: type annotation
  name: { uk: "анотація типу", en: "type annotation" }
  definition:
    uk: "Запис типу після двокрапки: `count: number` у параметрі, `): string` після дужок функції. Анотація лише описує намір для `tsc`; під час виконання її немає, і вона нічого не перетворює."
    en: "A type written after a colon: `count: number` on a parameter, `): string` after a function’s parentheses. An annotation only describes the intent for `tsc`; it does not exist at runtime and converts nothing."
  see: [typescript, type-inference]
  example:
    code: "function nightsLeft(nights: number): string {\n  return `${nights} nights`;\n}"
- id: type-inference
  term: type inference
  name: { uk: "виведення типів", en: "type inference" }
  definition:
    uk: "Коли `tsc` сам визначає тип зі значення чи виразу: `let total = 0` дає `number`, функція з `return a > b` повертає `boolean`. Тому змінні з одразу присвоєним значенням зазвичай не анотують, а параметри — анотують."
    en: "When `tsc` works out a type by itself from a value or an expression: `let total = 0` gives `number`, a function with `return a > b` returns `boolean`. That is why variables that get a value right away are usually not annotated, while parameters are."
  see: [type-annotation]
- id: tsc
  term: tsc
  name: { uk: "tsc (компілятор TypeScript)", en: "tsc (the TypeScript compiler)" }
  aliases: ["TypeScript compiler"]
  definition:
    uk: "Програма з пакета `typescript`. `npx tsc --noEmit` лише перевіряє типи й друкує діагностики (`error TS2345: …` з файлом, рядком і стовпчиком); `npx tsc` ще й записує JavaScript без типів у теку з `outDir`. Налаштування бере з `tsconfig.json`."
    en: "The program from the `typescript` package. `npx tsc --noEmit` only checks types and prints diagnostics (`error TS2345: …` with the file, line and column); `npx tsc` also writes JavaScript without types into the `outDir` folder. It reads its settings from `tsconfig.json`."
  see: [typescript]
- id: interface-declaration
  term: interface
  name: { uk: "interface (інтерфейс)", en: "interface" }
  aliases: ["interface declaration"]
  definition:
    uk: "Оголошення TypeScript, що описує форму об’єкта: які поля й методи він має і якого вони типу. Існує лише для `tsc`: після компіляції від нього нічого не лишається, тож `instanceof` з інтерфейсом неможливий."
    en: "A TypeScript declaration that describes the shape of an object: which fields and methods it has and of which type. It exists only for `tsc`: nothing of it is left after compiling, so `instanceof` with an interface is impossible."
  see: [type-alias, structural-typing]
  example:
    code: "interface Habit {\n  readonly id: string;\n  name: string;\n  active: boolean;\n}"
- id: type-alias
  term: type alias
  name: { uk: "type alias (псевдонім типу)", en: "type alias" }
  definition:
    uk: "Назва для будь-якого типу, оголошена через `type`: `type Habit = { … }`, `type DateText = string`. Для форми об’єкта рівноцінна `interface`; як і він, зникає після компіляції."
    en: "A name for any type, declared with `type`: `type Habit = { … }`, `type DateText = string`. For an object shape it is equivalent to an `interface`; like it, it disappears after compiling."
  see: [interface-declaration]
- id: structural-typing
  term: structural typing
  name: { uk: "структурна типізація", en: "structural typing" }
  definition:
    uk: "Правило TypeScript: значення підходить до типу, якщо має потрібну форму — усі обов’язкові поля потрібних типів, — незалежно від того, як називався тип, з яким його створили. Виняток: в об’єкті-літералі, записаному прямо в місці з типом, `tsc` ще й шукає зайві поля."
    en: "TypeScript’s rule: a value fits a type if it has the required shape — all required fields of the right types — no matter which named type it was created with. The exception: in an object literal written right where the type is expected, `tsc` also looks for extra fields."
  see: [interface-declaration, type-alias]
- id: optional-property
  term: optional property
  name: { uk: "необов’язкове поле", en: "optional property" }
  definition:
    uk: "Поле, позначене `?` (`note?: string`): об’єкт може його зовсім не мати, і тоді читання дає `undefined`. Це не те саме, що `note: string | null`: таке поле обов’язкове, лише значення може бути `null`."
    en: "A field marked with `?` (`note?: string`): the object may not have it at all, and reading it then gives `undefined`. It is not the same as `note: string | null`: that field is required, only its value may be `null`."
  see: [interface-declaration]
- id: readonly-property
  term: readonly property
  name: { uk: "поле readonly", en: "readonly property" }
  definition:
    uk: "Поле, позначене `readonly`: `tsc` не дозволяє присвоїти йому нове значення (`TS2540`). Це перевірка лише під час компіляції: під час виконання об’єкт лишається звичайним і не заморожується."
    en: "A field marked `readonly`: `tsc` does not allow assigning a new value to it (`TS2540`). It is a compile-time check only: at runtime the object stays ordinary and is not frozen."
  see: [interface-declaration]
- id: union-type
  term: union type
  name: { uk: "union-тип (об’єднання типів)", en: "union type" }
  aliases: ["union"]
  definition:
    uk: "Тип `A | B`: значення — або `A`, або `B`, і заздалегідь невідомо, яке саме. Доки варіант не з’ясовано перевіркою, `tsc` дозволяє лише те, що є в усіх варіантах."
    en: "The type `A | B`: the value is either `A` or `B`, and you do not know in advance which. Until a check settles the member, `tsc` allows only what exists in every member."
  see: [type-narrowing, literal-type, discriminated-union]
  example:
    code: "let dueDate: string | null = null;\ndueDate = \"2026-03-10\"; // both are allowed"
- id: literal-type
  term: literal type
  name: { uk: "літеральний тип", en: "literal type" }
  definition:
    uk: "Тип, що дозволяє рівно одне значення: `\"daily\"`, `true`, `0`. У union-типі такі варіанти перелічують дозволені значення поля: `\"daily\" | \"weekly\"`."
    en: "A type that allows exactly one value: `\"daily\"`, `true`, `0`. In a union such members list a field’s allowed values: `\"daily\" | \"weekly\"`."
  see: [union-type]
- id: type-narrowing
  term: narrowing
  name: { uk: "звуження типу", en: "type narrowing" }
  aliases: ["narrowing"]
  definition:
    uk: "Коли `tsc` після перевірки (`typeof`, `in`, `===`, `if (x)`, перевірки дискримінанта) знає точніший тип усередині гілки. Звуження спирається на справжню перевірку під час виконання, тож і `tsc`, і програма мають рацію."
    en: "When, after a check (`typeof`, `in`, `===`, `if (x)`, a discriminant check), `tsc` knows a more precise type inside the branch. Narrowing rests on a real runtime check, so both `tsc` and the program are right."
  see: [union-type, discriminated-union]
- id: discriminated-union
  term: discriminated union
  name: { uk: "дискримінований union", en: "discriminated union" }
  aliases: ["discriminant", "tagged union"]
  definition:
    uk: "Union-тип з об’єктів, у кожному з яких є спільне поле з літеральним значенням — дискримінант (`ok: true` / `ok: false`, `kind: \"daily\"`). Перевірка цього поля звужує тип до одного варіанта."
    en: "A union of objects that each have a shared field with a literal value — the discriminant (`ok: true` / `ok: false`, `kind: \"daily\"`). Checking that field narrows the type to one member."
  see: [union-type, type-narrowing, literal-type]
- id: exhaustiveness-check
  term: exhaustiveness check
  name: { uk: "перевірка повноти (never)", en: "exhaustiveness check (never)" }
  definition:
    uk: "Присвоєння `const unhandled: never = value;` у гілці, куди після всіх випадків не має потрапити жоден варіант. Якщо випадок пропущено, `tsc` повідомляє, що варіант не можна присвоїти `never`. Тип `never` означає «значення, якого не може бути»."
    en: "The assignment `const unhandled: never = value;` in the branch no member should reach once all cases are handled. If a case is missing, `tsc` reports that the member cannot be assigned to `never`. The type `never` means “a value that cannot exist”."
  see: [discriminated-union, type-narrowing]
- id: strict-null-checks
  term: strictNullChecks
  name: { uk: "strictNullChecks (строгі перевірки null)", en: "strictNullChecks" }
  definition:
    uk: "Налаштування `tsc` (входить у `\"strict\": true`): `null` і `undefined` не належать до інших типів, тож поле, яке може бути порожнім, має тип `… | null` або `?`, а читати з нього можна лише після перевірки (`TS18047: … is possibly 'null'`)."
    en: "A `tsc` setting (part of `\"strict\": true`): `null` and `undefined` do not belong to other types, so a field that may be empty has the type `… | null` or `?`, and it can be read only after a check (`TS18047: … is possibly 'null'`)."
  see: [union-type, type-narrowing, non-null-assertion]
- id: non-null-assertion
  term: non-null assertion
  name: { uk: "non-null assertion (оператор !)", en: "non-null assertion (the ! operator)" }
  definition:
    uk: "Запис `value!`: твердження для `tsc`, що значення не `null` і не `undefined`. Прибирає діагностику, але нічого не перевіряє — після компіляції `!` зникає, і з `null` код падає під час виконання."
    en: "The form `value!`: a claim to `tsc` that the value is neither `null` nor `undefined`. It removes the diagnostic but checks nothing — after compiling the `!` is gone, and with `null` the code crashes at runtime."
  see: [strict-null-checks]
- id: generic-function
  term: generic function
  name: { uk: "generic-функція", en: "generic function" }
  aliases: ["generics", "generic"]
  definition:
    uk: "Функція з параметром типу (`function last<T>(items: readonly T[]): T | undefined`). Вона працює з будь-яким типом і при цьому пам’ятає, який саме прийшов: для масиву справ результат — справа, а не `any`."
    en: "A function with a type parameter (`function last<T>(items: readonly T[]): T | undefined`). It works with any type and still remembers which one came in: for an array of tasks the result is a task, not `any`."
  see: [type-parameter, generic-constraint]
- id: type-parameter
  term: type parameter
  name: { uk: "параметр типу", en: "type parameter" }
  definition:
    uk: "Місце для типу в кутових дужках (`<T>`), яке `tsc` у кожному виклику заповнює сам, виводячи тип з аргументів. Явно (`last<Habit>(…)`) його вказують лише тоді, коли виведення не вистачає. Після компіляції зникає."
    en: "A slot for a type in angle brackets (`<T>`) that `tsc` fills at each call by itself, inferring the type from the arguments. You give it explicitly (`last<Habit>(…)`) only when inference is not enough. It disappears after compiling."
  see: [generic-function, type-inference]
- id: generic-constraint
  term: generic constraint
  name: { uk: "обмеження generic (extends)", en: "generic constraint (extends)" }
  definition:
    uk: "Умова для параметра типу: `<T extends { id: string }>` — «будь-який тип, у якого є текстове `id`». Усередині функції можна користуватися `id`, а виклик з невідповідним типом `tsc` відхиляє."
    en: "A condition on a type parameter: `<T extends { id: string }>` means “any type that has a text `id`”. Inside the function you may use `id`, and `tsc` rejects a call with a type that does not fit."
  see: [generic-function, type-parameter]
