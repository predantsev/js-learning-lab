# Terms introduced in JS-14.
- id: typescript
  term: TypeScript
  name: { uk: "TypeScript", en: "TypeScript" }
  aliases: ["TS"]
  definition:
    uk: "JavaScript із типами: до коду можна дописати, яке значення має бути в змінній, параметрі чи полі. Окрема програма, компілятор `tsc`, перевіряє ці типи до запуску, а тоді прибирає їх, і виконується звичайний JavaScript. Файли мають розширення `.ts`."
    en: "JavaScript with types: you can write down which value a variable, parameter or field should hold. A separate program, the compiler `tsc`, checks those types before running and then removes them, and plain JavaScript runs. Files end in `.ts`."
  see: [tsc, type-annotation, type-inference]
- id: type-annotation
  term: type annotation
  name: { uk: "анотація типу", en: "type annotation" }
  definition:
    uk: "Запис типу після двокрапки: `count: number` у параметрі, `): string` після дужок функції. Анотація лише описує намір для `tsc`; під час виконання її немає, і вона нічого не перетворює."
    en: "A type written after a colon: `count: number` on a parameter, `): string` after a function’s parentheses. An annotation only describes the intent for `tsc`; it does not exist at runtime and converts nothing."
  see: [typescript, type-inference]
  example:
    code: "function nightsLeft(nights: number): string {\n  return `${nights} nights`;\n}"
- id: type-inference
  term: type inference
  name: { uk: "виведення типів", en: "type inference" }
  definition:
    uk: "Коли `tsc` сам визначає тип зі значення чи виразу: `let total = 0` дає `number`, функція з `return a > b` повертає `boolean`. Тому змінні з одразу присвоєним значенням зазвичай не анотують, а параметри — анотують."
    en: "When `tsc` works out a type by itself from a value or an expression: `let total = 0` gives `number`, a function with `return a > b` returns `boolean`. That is why variables that get a value right away are usually not annotated, while parameters are."
  see: [type-annotation]
- id: tsc
  term: tsc
  name: { uk: "tsc (компілятор TypeScript)", en: "tsc (the TypeScript compiler)" }
  aliases: ["TypeScript compiler"]
  definition:
    uk: "Програма з пакета `typescript`. `npx tsc --noEmit` лише перевіряє типи й друкує діагностики (`error TS2345: …` з файлом, рядком і стовпчиком); `npx tsc` ще й записує JavaScript без типів у теку з `outDir`. Налаштування бере з `tsconfig.json`."
    en: "The program from the `typescript` package. `npx tsc --noEmit` only checks types and prints diagnostics (`error TS2345: …` with the file, line and column); `npx tsc` also writes JavaScript without types into the `outDir` folder. It reads its settings from `tsconfig.json`."
  see: [typescript]
- id: interface-declaration
  term: interface
  name: { uk: "interface (інтерфейс)", en: "interface" }
  aliases: ["interface declaration"]
  definition:
    uk: "Оголошення TypeScript, що описує форму об’єкта: які поля й методи він має і якого вони типу. Існує лише для `tsc`: після компіляції від нього нічого не лишається, тож `instanceof` з інтерфейсом неможливий."
    en: "A TypeScript declaration that describes the shape of an object: which fields and methods it has and of which type. It exists only for `tsc`: nothing of it is left after compiling, so `instanceof` with an interface is impossible."
  see: [type-alias, structural-typing]
  example:
    code: "interface Habit {\n  readonly id: string;\n  name: string;\n  active: boolean;\n}"
- id: type-alias
  term: type alias
  name: { uk: "type alias (псевдонім типу)", en: "type alias" }
  definition:
    uk: "Назва для будь-якого типу, оголошена через `type`: `type Habit = { … }`, `type DateText = string`. Для форми об’єкта рівноцінна `interface`; як і він, зникає після компіляції."
    en: "A name for any type, declared with `type`: `type Habit = { … }`, `type DateText = string`. For an object shape it is equivalent to an `interface`; like it, it disappears after compiling."
  see: [interface-declaration]
- id: structural-typing
  term: structural typing
  name: { uk: "структурна типізація", en: "structural typing" }
  definition:
    uk: "Правило TypeScript: значення підходить до типу, якщо має потрібну форму — усі обов’язкові поля потрібних типів, — незалежно від того, як називався тип, з яким його створили. Виняток: в об’єкті-літералі, записаному прямо в місці з типом, `tsc` ще й шукає зайві поля."
    en: "TypeScript’s rule: a value fits a type if it has the required shape — all required fields of the right types — no matter which named type it was created with. The exception: in an object literal written right where the type is expected, `tsc` also looks for extra fields."
  see: [interface-declaration, type-alias]
- id: optional-property
  term: optional property
  name: { uk: "необов’язкове поле", en: "optional property" }
  definition:
    uk: "Поле, позначене `?` (`note?: string`): об’єкт може його зовсім не мати, і тоді читання дає `undefined`. Це не те саме, що `note: string | null`: таке поле обов’язкове, лише значення може бути `null`."
    en: "A field marked with `?` (`note?: string`): the object may not have it at all, and reading it then gives `undefined`. It is not the same as `note: string | null`: that field is required, only its value may be `null`."
  see: [interface-declaration]
- id: readonly-property
  term: readonly property
  name: { uk: "поле readonly", en: "readonly property" }
  definition:
    uk: "Поле, позначене `readonly`: `tsc` не дозволяє присвоїти йому нове значення (`TS2540`). Це перевірка лише під час компіляції: під час виконання об’єкт лишається звичайним і не заморожується."
    en: "A field marked `readonly`: `tsc` does not allow assigning a new value to it (`TS2540`). It is a compile-time check only: at runtime the object stays ordinary and is not frozen."
  see: [interface-declaration]
