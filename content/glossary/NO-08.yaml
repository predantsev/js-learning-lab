# Terms introduced in NO-08 (Checkpoint CP-NO: end-to-end integration). One file per unit keeps parallel authoring conflict-free.
- id: failure-mode
  term: failure mode
  name: { uk: "режим відмови (failure mode)", en: "failure mode" }
  aliases: [failure modes]
  definition:
    uk: "Конкретний спосіб, у який рішення ламається, і що саме при цьому втрачає користувач: «процес убили між двома скиданнями кешу — зникають усі зміни, на які сервер уже відповів успіхом». Два варіанти порівнюють за їхніми режимами відмови, а не лише за швидкістю чи зручністю."
    en: "A specific way a design breaks and what exactly the user loses when it does: “the process is killed between two cache flushes — every change the server already answered with success is gone”. Two options are compared by their failure modes, not only by speed or convenience."
  see: [decision-record, lost-update]
