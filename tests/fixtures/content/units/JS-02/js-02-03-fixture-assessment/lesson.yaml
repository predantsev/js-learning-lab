# Fixture assessment lesson for the end-to-end suite (synthetic): no "I know this", and the
# solution of its assessment exercise opens only after the exercise passed.
id: js-02-03-fixture-assessment
unit: JS-02
title:
  uk: "Фікстура: перевірка вмінь"
  en: "Fixture: skills check"
kind: assessment
minutes: 10
contentVersion: 1
objectives:
  - uk: "Написати функцію без підказок."
    en: "Write a function without hints."
purpose:
  uk: "Перевірка, що зараховується лише через завдання."
  en: "A check that counts only through its task."
prerequisites: [js-02-01-fixture-pages]
subskills: []

blocks:
  - id: sum-check
    kind: exercise
    mode: independent
    assessment: true
    runtime: browser-js
    dir: sum-check
    entry: index.js
    title:
      uk: "Сума двох чисел"
      en: "The sum of two numbers"
    instructions:
      uk: "Допиши `sum(a, b)`, щоб вона повертала суму."
      en: "Finish `sum(a, b)` so that it returns the sum."
    testTitles:
      "adds two numbers":
        uk: "`sum(2, 3)` повертає 5"
        en: "`sum(2, 3)` returns 5"
    solutionNote:
      uk: "ФІКСТУРА-ОЦІНКА: `+` додає числа."
      en: "FIXTURE-ASSESSMENT: `+` adds numbers."
