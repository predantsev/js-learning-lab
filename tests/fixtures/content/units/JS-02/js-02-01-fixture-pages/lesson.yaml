# Fixture lesson for the end-to-end suite (synthetic). Pages: [intro, trace-none, trace-vars, site] ·
# [predict, fix] · [transfer]. Block ids are referenced by tests/e2e/*.test.mjs.
id: js-02-01-fixture-pages
unit: JS-02
title:
  uk: "Фікстура: сторінки й помилки"
  en: "Fixture: pages and errors"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Перейти між сторінками проєкту й виправити синтаксичну помилку."
    en: "Move between project pages and fix a syntax error."
prerequisites: [js-01-02-fixture-practice]
subskills: []
glossary: []
selfCheck: [pages-predict]

blocks:
  - id: pages-intro
    kind: explanation
    title: { uk: "Сторінки та зображення", en: "Pages and images" }
    body:
      uk: "Проєкт може мати кілька HTML-сторінок і власні SVG-зображення."
      en: "A project can have several HTML pages and its own SVG images."

  - id: pages-trace-none
    kind: visual
    visual: code-trace
    title: { uk: "Лише вивід", en: "Output only" }
    textEquivalent:
      uk: "Програма двічі викликає console.log: спершу виводить 3, потім done. Змінних, викликів функцій і об’єктів немає."
      en: "The program calls console.log twice: first it prints 3, then done. There are no variables, function calls or objects."
    spec:
      code: |
        console.log(1 + 2);
        console.log("done");
      captions:
        - at: { line: 1 }
          text: { uk: "ФІКСТУРА-КРОК-1: перший виклик.", en: "FIXTURE-STEP-1: the first call." }
        - at: { line: 2 }
          text: { uk: "ФІКСТУРА-КРОК-2: другий виклик.", en: "FIXTURE-STEP-2: the second call." }

  - id: pages-trace-vars
    kind: visual
    visual: code-trace
    title: { uk: "Одна змінна", en: "One variable" }
    textEquivalent:
      uk: "Змінна total отримує значення 3, і програма виводить його. Функцій і об’єктів немає."
      en: "The variable total gets the value 3 and the program prints it. There are no functions or objects."
    spec:
      code: |
        let total = 1 + 2;
        console.log(total);
      captions:
        - at: { line: 1 }
          text: { uk: "ФІКСТУРА-ЗМІННА-1: total ще не має значення.", en: "FIXTURE-VAR-1: total has no value yet." }
        - at: { line: 2 }
          text: { uk: "ФІКСТУРА-ЗМІННА-2: total дорівнює 3.", en: "FIXTURE-VAR-2: total is 3." }

  - id: pages-site
    kind: example
    runtime: browser-js
    dir: pages-site
    entry: index.html
    title: { uk: "Сайт із двох сторінок", en: "A two-page site" }
    body:
      uk: "Натисни **Запустити**, потім посилання на сторінці."
      en: "Press **Run**, then the link on the page."

  - id: pages-predict
    kind: prediction
    prompt:
      uk: "Що виведе цей код?"
      en: "What does this code print?"
    code: |
      console.log("start";
    verify:
      logs: []
      error: SyntaxError
    answer:
      type: choice
      options:
        - id: nothing
          text: { uk: "Нічого: код навіть не запуститься", en: "Nothing: the code does not even start" }
        - id: start
          text: { uk: "`start`", en: "`start`" }
          why:
            uk: "Без закривальної дужки JavaScript не може прочитати рядок."
            en: "Without the closing bracket JavaScript cannot read the line."
      correct: [nothing]
    explanation:
      uk: "Синтаксична помилка зупиняє програму ще до запуску."
      en: "A syntax error stops the program before it runs."

  - id: pages-fix
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: pages-fix
    entry: index.js
    strings:
      greeting: { uk: "Привіт", en: "Hello" }
    title: { uk: "Виправ синтаксичну помилку", en: "Fix the syntax error" }
    instructions:
      uk: "Програма не запускається. Виправ рядок, щоб вона вивела привітання."
      en: "The program does not start. Fix the line so that it prints the greeting."
    testTitles:
      "prints the greeting":
        uk: "Виводить привітання через `console.log`"
        en: "Prints the greeting with `console.log`"
    hints:
      nudge: { uk: "Порахуй дужки.", en: "Count the brackets." }
      explanation: { uk: "Кожна `(` потребує `)`.", en: "Every `(` needs a `)`." }
    solutionNote:
      uk: "Закривальна дужка завершує виклик."
      en: "The closing bracket ends the call."
    feedback:
      - when: { error: SyntaxError }
        message:
          uk: "ФІКСТУРА-СИНТАКСИС: JavaScript не зміг прочитати рядок — перевір дужки й лапки."
          en: "FIXTURE-SYNTAX: JavaScript could not read the line — check the brackets and quotes."

  - id: pages-transfer
    kind: transfer
    capstoneStep: JS-01
    body:
      uk: "Додай другу сторінку у свій проєкт."
      en: "Add a second page to your project."
