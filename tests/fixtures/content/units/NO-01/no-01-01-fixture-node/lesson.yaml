# Fixture lesson for the end-to-end suite (synthetic): the isolated-node runtime. Pages:
# [intro, prediction, example] · [exercise] · [transfer]. Block ids are referenced by
# tests/e2e/app-node-runtime.test.mjs. The example reads and writes a file in the exercise folder;
# the exercise is an HTTP server on loopback checked by real requests from the Node harness.
id: no-01-01-fixture-node
unit: NO-01
title:
  uk: "Фікстура: справжній Node.js"
  en: "Fixture: real Node.js"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Запустити програму в справжньому Node.js і прочитати її вивід."
    en: "Run a program in real Node.js and read its output."
  - uk: "Перевірити HTTP-сервер справжніми запитами."
    en: "Check an HTTP server with real requests."
prerequisites: []
subskills: []
selfCheck: [node-where-file, node-items-server]

blocks:
  - id: node-intro
    kind: explanation
    title:
      uk: "Код виконує справжній Node.js"
      en: "Real Node.js runs the code"
    body:
      uk: |
        Тут твій код виконує справжній **Node.js** — та сама програма, яку ти запускаєш у терміналі командою `node index.js`. Платформа запускає її окремим процесом на твоєму комп’ютері, у тимчасовій теці з файлами вправи.

        Програма може користуватися вбудованими модулями (`node:fs`, `node:http`…), але читати й записувати файли може лише в цій теці, не має npm-пакетів і працює не довше кількох секунд.
      en: |
        Here your code runs in real **Node.js** — the same program you start in a terminal with `node index.js`. The platform starts it as a separate process on your computer, in a temporary folder with the exercise files.

        The program can use the built-in modules (`node:fs`, `node:http`…), but it can read and write files only inside that folder, has no npm packages and runs for a few seconds at most.

  - id: node-where-file
    kind: prediction
    prompt:
      uk: "Програма записує файл `notes.txt` без повного шляху. Де він з’явиться?"
      en: "The program writes `notes.txt` without a full path. Where does the file appear?"
    answer:
      type: choice
      options:
        - id: exercise-folder
          text:
            uk: "У тимчасовій теці вправи — робочій теці процесу"
            en: "In the exercise's temporary folder — the process's working directory"
        - id: home
          text:
            uk: "У твоїй домашній теці"
            en: "In your home folder"
          why:
            uk: "Відносний шлях починається з робочої теки процесу, а не з домашньої. До того ж програма тут не може записувати поза текою вправи."
            en: "A relative path starts from the process's working directory, not from your home folder. Besides, the program cannot write outside the exercise folder here."
        - id: platform
          text:
            uk: "У теці самої платформи"
            en: "In the platform's own folder"
          why:
            uk: "Кожен запуск отримує окрему тимчасову теку з копією файлів вправи; до файлів платформи програма доступу не має."
            en: "Every run gets its own temporary folder with a copy of the exercise files; the program has no access to the platform's files."
      correct: [exercise-folder]
    explanation:
      uk: "Відносний шлях Node.js рахує від робочої теки (`process.cwd()`). Платформа запускає кожну програму в новій тимчасовій теці з твоїми файлами, дозволяє читати й записувати лише там і видаляє теку після запуску."
      en: "Node.js resolves a relative path from the working directory (`process.cwd()`). The platform starts every program in a fresh temporary folder with your files, allows reading and writing only there, and deletes the folder after the run."

  - id: node-order
    kind: prediction
    runtime: isolated-node
    prompt:
      uk: "У якому порядку Node.js виведе ці рядки?"
      en: "In which order does Node.js print these lines?"
    code: |
      setTimeout(() => console.log('timeout'), 0);
      Promise.resolve().then(() => console.log('promise'));
      process.nextTick(() => console.log('nextTick'));
      console.log('sync');
    verify: { logs: ["sync", "promise", "nextTick", "timeout"] }
    answer:
      type: order
      items:
        - { id: sync, code: "sync" }
        - { id: promise, code: "promise" }
        - { id: tick, code: "nextTick" }
        - { id: timeout, code: "timeout" }
    explanation:
      uk: "Спершу синхронний код. ES-модуль виконується всередині мікрозадачі, тому проміс іде раніше за `process.nextTick`; таймер — у наступній фазі циклу подій."
      en: "Synchronous code first. An ES module runs inside a microtask, so the promise comes before `process.nextTick`; the timer runs in a later phase of the event loop."
  - id: node-notes
    kind: example
    runtime: isolated-node
    dir: node-notes
    entry: index.js
    capabilities: { timeoutMs: 5000 }
    strings:
      firstNote: { uk: "Купити лампу", en: "Buy a lamp" }
      secondNote: { uk: "Полити квіти", en: "Water the plants" }
      savedLabel: { uk: "Збережено у файлі", en: "Saved in the file" }
    title:
      uk: "Файл у теці вправи"
      en: "A file in the exercise folder"
    body:
      uk: "Натисни **Запустити**: програма запише два рядки у файл `notes.txt`, прочитає їх і покаже версію Node.js, на якій виконується."
      en: "Press **Run**: the program writes two lines to `notes.txt`, reads them back and shows the Node.js version it runs on."
    tryIt:
      uk: "Зміни текст другої нотатки й запусти ще раз. Потім спробуй прочитати файл поза текою вправи, наприклад `/etc/hosts`."
      en: "Change the text of the second note and run again. Then try to read a file outside the exercise folder, for example `/etc/hosts`."

  - id: node-items-server
    kind: exercise
    mode: guided
    runtime: isolated-node
    dir: node-items-server
    entry: index.js
    editable: [app.js]
    capabilities: { network: loopback }
    strings:
      lamp: { uk: "Настільна лампа", en: "Desk lamp" }
      plant: { uk: "Кімнатна рослина", en: "House plant" }
    title:
      uk: "Сервер зі списком речей"
      en: "A server with a list of items"
    instructions:
      uk: |
        Допиши `createApp` у `app.js`:

        - `GET /items` відповідає статусом 200 і списком із `items.js` у форматі JSON, із заголовком `content-type: application/json`;
        - будь-яка інша адреса відповідає статусом 404.

        **Запустити** стартує сервер на вільному порту 127.0.0.1 і надсилає йому два запити. **Перевірити** надсилає твоєму серверу справжні HTTP-запити.
      en: |
        Finish `createApp` in `app.js`:

        - `GET /items` answers status 200 with the list from `items.js` as JSON, with the header `content-type: application/json`;
        - any other address answers status 404.

        **Run** starts the server on a free 127.0.0.1 port and sends it two requests. **Check** sends real HTTP requests to your server.
    limits:
      uk: "Сервер слухає лише адресу 127.0.0.1 на твоєму комп’ютері: інші комп’ютери в мережі до нього не дістануться."
      en: "The server listens only on 127.0.0.1 on your computer: other computers on the network cannot reach it."
    testTitles:
      "GET /items answers 200 with the items as JSON":
        uk: "`GET /items` відповідає 200 і списком у JSON"
        en: "`GET /items` answers 200 with the list as JSON"
      "the answer says it is JSON":
        uk: "Відповідь позначена як JSON (`content-type`)"
        en: "The answer is labeled as JSON (`content-type`)"
      "an unknown address answers 404":
        uk: "Невідома адреса відповідає 404"
        en: "An unknown address answers 404"
    hints:
      nudge:
        uk: "Подивись на `request.url`: він каже, яку адресу запитали."
        en: "Look at `request.url`: it tells which address was asked for."
      explanation:
        uk: "Обробник запиту може обрати відповідь за `request.method` і `request.url`. Статус і заголовки задає `response.writeHead(статус, заголовки)`, а текст відповіді — `response.end(текст)`. Текст JSON дає `JSON.stringify(значення)`."
        en: "A request handler can choose the answer by `request.method` and `request.url`. `response.writeHead(status, headers)` sets the status and headers, and `response.end(text)` sends the text. `JSON.stringify(value)` gives JSON text."
    solutionNote:
      uk: "Обробник перевіряє метод і адресу; для `/items` надсилає 200, заголовок JSON і `JSON.stringify(items)`, а для решти — 404."
      en: "The handler checks the method and the address; for `/items` it sends 200, the JSON header and `JSON.stringify(items)`, and 404 for everything else."
    feedback:
      - when: { test: "GET /items answers 200 with the items as JSON" }
        message:
          uk: "`GET /items` має відповісти статусом 200 і текстом JSON зі списком з `items.js` (`JSON.stringify`)."
          en: "`GET /items` must answer status 200 with JSON text of the list from `items.js` (`JSON.stringify`)."
      - when: { test: "the answer says it is JSON" }
        message:
          uk: "Відповідь не каже, що вона в JSON. Додай заголовок `content-type: application/json` разом зі статусом."
          en: "The answer does not say it is JSON. Add the header `content-type: application/json` together with the status."
      - when: { test: "an unknown address answers 404" }
        message:
          uk: "Адреса, відмінна від `/items`, має отримати статус 404. Перевір `request.url` і обирай статус для кожної адреси."
          en: "An address other than `/items` must get status 404. Check `request.url` and choose the status for each address."
      - when: { error: ReferenceError }
        message:
          uk: "Програма звертається до назви, якої немає. Перевір, чи кожна назва в `app.js` оголошена або імпортована."
          en: "The program uses a name that does not exist. Check that every name in `app.js` is declared or imported."

  - id: node-transfer
    kind: transfer
    capstoneStep: NO-01
    body:
      uk: "Застосуй це у своєму проєкті (фікстура)."
      en: "Apply this in your project (fixture)."
