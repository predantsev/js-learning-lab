# Fixture lesson for the end-to-end suite (synthetic). Pages: [intro, predict, review, debug] ·
# [independent] · [local task, transfer]. Block ids are referenced by tests/e2e/*.test.mjs.
id: js-01-02-fixture-practice
unit: JS-01
title:
  uk: "Фікстура: практика й повторення"
  en: "Fixture: practice and review"
kind: instructional
minutes: 10
contentVersion: 1
objectives:
  - uk: "Виправити помилку в циклі й написати власну функцію."
    en: "Fix a bug in a loop and write a function of your own."
prerequisites: [js-01-01-fixture-basics]
subskills: []
glossary: [loop]
selfCheck: [practice-predict]

blocks:
  - id: practice-intro
    kind: explanation
    title:
      uk: "Практика"
      en: "Practice"
    body:
      uk: "[[loop|Цикл]] повторює інструкції. Тут — практика й повторення."
      en: "A [[loop]] repeats statements. Here you practise and review."

  - id: practice-predict
    kind: prediction
    prompt:
      uk: "Скільки рядків виведе цей код?"
      en: "How many lines does this code print?"
    code: |
      for (let i = 0; i < 3; i++) console.log(i);
    verify:
      logs: ["0", "1", "2"]
    answer:
      type: text
      accept: ["3", "три", "three"]
      placeholder: { uk: "Число", en: "A number" }
    explanation:
      uk: "Цикл виконується для 0, 1 і 2 — три рядки."
      en: "The loop runs for 0, 1 and 2 — three lines."

  - id: practice-review
    kind: review
    title:
      uk: "Згадай попередній урок"
      en: "Recall the previous lesson"
    items:
      - id: recall-sum
        from: js-01-01-fixture-basics
        prompt:
          uk: "Що виведе `console.log(2 + 3)`?"
          en: "What does `console.log(2 + 3)` print?"
        answer:
          type: text
          accept: ["5"]
        explanation:
          uk: "Без лапок це обчислення: 5."
          en: "Without quotes it is a calculation: 5."
      - id: recall-quotes
        from: js-01-01-fixture-basics
        prompt:
          uk: "Який рядок виводить текст «так»?"
          en: "Which line prints the text “yes”?"
        answer:
          type: choice
          options:
            - { id: quoted, code: 'console.log("yes");' }
            - id: bare
              code: 'console.log(yes);'
              why:
                uk: "Слово без лапок — це назва, а не текст."
                en: "A word without quotes is a name, not text."
            - id: two-lines
              code: |
                const yes = 1;
                console.log(yes);
              why:
                uk: "Тут виводиться значення змінної: 1."
                en: "This prints the value of the variable: 1."
          correct: [quoted]
        explanation:
          uk: "Текст пишуть у лапках."
          en: "Text is written in quotes."

  - id: practice-debug
    kind: exercise
    mode: debug
    runtime: browser-js
    dir: practice-debug
    entry: index.js
    title:
      uk: "Знайди помилку в сумі"
      en: "Find the bug in the sum"
    instructions:
      uk: "Сума цін має дорівнювати 365, але програма виводить `NaN`. Виправ цикл."
      en: "The sum of the prices should be 365, but the program prints `NaN`. Fix the loop."
    testTitles:
      "total is 365":
        uk: "Сума дорівнює 365"
        en: "The total is 365"
    hints:
      nudge:
        uk: "Скільки разів виконується цикл?"
        en: "How many times does the loop run?"
      explanation:
        uk: "Останній індекс масиву — `length - 1`."
        en: "The last index of an array is `length - 1`."
    solutionNote:
      uk: "Умова `i < prices.length` не виходить за межі масиву."
      en: "The condition `i < prices.length` stays inside the array."

  - id: practice-independent
    kind: exercise
    mode: independent
    runtime: browser-js
    dir: practice-independent
    entry: index.js
    title:
      uk: "Напиши функцію double"
      en: "Write the function double"
    instructions:
      uk: "Напиши функцію `double(n)`, яка повертає `n * 2`."
      en: "Write a function `double(n)` that returns `n * 2`."
    testTitles:
      "double doubles":
        uk: "double(4) повертає 8"
        en: "double(4) returns 8"
    solutionNote:
      uk: "Функція повертає число, помножене на 2."
      en: "The function returns the number multiplied by 2."
    feedback:
      - when: { error: TypeError }
        message:
          uk: "ФІКСТУРА-ТИП: функції `double` ще немає — оголоси її."
          en: "FIXTURE-TYPE: there is no function `double` yet — declare it."

  - id: practice-local
    kind: local-task
    runtime: local-web
    title:
      uk: "Перевір версію Node.js"
      en: "Check your Node.js version"
    intro:
      uk: "Відкрий термінал на своєму комп’ютері."
      en: "Open a terminal on your computer."
    tools:
      - { name: "Node.js", version: "22.13", note: { uk: "потрібен для локальних завдань", en: "needed for local tasks" } }
      - { name: "VS Code", version: { uk: "будь-яка свіжа версія", en: "any recent version" } }
    steps:
      - text: { uk: "Виконай команду:", en: "Run the command:" }
        command: "node --version"
        expect: { uk: "Рядок на кшталт `v22.13.0`.", en: "A line such as `v22.13.0`." }
    verify:
      - id: saw-version
        text: { uk: "Я побачив номер версії", en: "I saw a version number" }
    troubleshooting:
      - problem: { uk: "Команду не знайдено", en: "Command not found" }
        fix: { uk: "Встанови Node.js і відкрий новий термінал.", en: "Install Node.js and open a new terminal." }
    recovery:
      uk: "Нічого не змінюється у твоїх файлах — просто спробуй ще раз."
      en: "Nothing changes in your files — just try again."

  - id: practice-transfer
    kind: transfer
    capstoneStep: JS-01
    body:
      uk: "Застосуй цикл у своєму проєкті."
      en: "Use a loop in your project."
