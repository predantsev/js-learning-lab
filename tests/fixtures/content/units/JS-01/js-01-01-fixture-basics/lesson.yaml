# Fixture lesson for the end-to-end suite (synthetic). Pages: [intro, analogy, visual, example] ·
# [predict, exercise] · [transfer]. Block ids are referenced by tests/e2e/*.test.mjs.
id: js-01-01-fixture-basics
unit: JS-01
title:
  uk: "Фікстура: інструкції та вивід"
  en: "Fixture: statements and output"
kind: instructional
minutes: 8
contentVersion: 1
objectives:
  - uk: "Запустити програму й знайти її вивід у консолі."
    en: "Run a program and find its output in the console."
prerequisites: []
subskills: []
glossary: [statement, output]
selfCheck: [basics-predict, basics-exercise]

blocks:
  - id: basics-intro
    kind: explanation
    title:
      uk: "Інструкції виконуються по черзі"
      en: "Statements run in order"
    body:
      uk: |
        Кожна [[statement|інструкція]] виконується по черзі, згори донизу. Те, що програма показує, називають [[output|виводом]].

        Перший абзац фікстурного пояснення українською.
      en: |
        Every [[statement]] runs in order, from top to bottom. What a program shows is called its [[output]].

        The first paragraph of the fixture explanation in English.

  - id: basics-analogy
    kind: analogy
    body:
      uk: "Програма схожа на рецепт: кроки виконуються згори донизу."
      en: "A program is like a recipe: the steps run from top to bottom."
    limits:
      uk: "На відміну від кухаря, комп’ютер не пропускає кроків і не здогадується."
      en: "Unlike a cook, the computer never skips a step and never guesses."

  - id: basics-visual
    kind: visual
    visual: diagram
    title:
      uk: "Від коду до консолі"
      en: "From code to the console"
    textEquivalent:
      uk: "Код передається рушію JavaScript, рушій виконує інструкції по черзі, а console.log показує результат у консолі."
      en: "The code goes to the JavaScript engine, the engine runs the statements in order, and console.log shows the result in the console."
    spec:
      layout: lr
      nodes:
        - { id: code, label: { uk: "Код", en: "Code" } }
        - { id: engine, label: { uk: "Рушій JavaScript", en: "JavaScript engine" } }
        - { id: console, label: { uk: "Консоль", en: "Console" }, shape: round }
      edges:
        - { id: run, from: code, to: engine, label: { uk: "запуск", en: "run" } }
        - { id: print, from: engine, to: console, label: "console.log" }
      steps:
        - caption:
            uk: "Поки код не запущено, це просто текст."
            en: "Until the code runs, it is just text."
        - highlight: [code, run, engine]
          caption:
            uk: "Рушій читає інструкції по черзі."
            en: "The engine reads the statements in order."
        - highlight: [print, console]
          caption:
            uk: "console.log показує значення в консолі."
            en: "console.log shows the value in the console."

  - id: basics-example
    kind: example
    runtime: browser-js
    dir: basics-example
    entry: index.js
    strings:
      greeting: { uk: "Привіт із фікстури", en: "Hello from the fixture" }
    title:
      uk: "Запусти приклад"
      en: "Run the example"
    body:
      uk: "Натисни **Запустити** й подивись на вкладку **Консоль**."
      en: "Press **Run** and look at the **Console** tab."
    tryIt:
      uk: "Зміни число й запусти ще раз."
      en: "Change the number and run again."

  - id: basics-predict
    kind: prediction
    prompt:
      uk: "Що з’явиться в консолі?"
      en: "What appears in the console?"
    code: |
      console.log(2 + 2);
      console.log("2 + 2");
    verify:
      logs: ["4", "2 + 2"]
    answer:
      type: choice
      options:
        - id: number-then-text
          text: { uk: "Спершу `4`, потім `2 + 2`", en: "First `4`, then `2 + 2`" }
        - id: text-twice
          text: { uk: "Двічі `2 + 2`", en: "`2 + 2` twice" }
          why:
            uk: "Без лапок `2 + 2` — це обчислення."
            en: "Without quotes `2 + 2` is a calculation."
        - id: number-twice
          text: { uk: "Двічі `4`", en: "`4` twice" }
          why:
            uk: "У лапках — текст, який показується як є."
            en: "Inside quotes is text, shown as it is."
      correct: [number-then-text]
    explanation:
      uk: "Перша інструкція обчислює `2 + 2`, друга показує текст у лапках."
      en: "The first statement computes `2 + 2`, the second shows the quoted text."

  - id: basics-exercise
    kind: exercise
    mode: guided
    runtime: browser-js
    dir: basics-exercise
    entry: index.js
    editable: [index.js]
    strings:
      item: { uk: "Настільна лампа", en: "Desk lamp" }
    title:
      uk: "Виведи назву й число"
      en: "Print the label and a number"
    instructions:
      uk: "Допиши в `index.js` один рядок, що виводить `label` і число `3` в одному `console.log`."
      en: "Add one line to `index.js` that prints `label` and the number `3` in one `console.log`."
    testTitles:
      "prints the label":
        uk: "Перший рядок містить назву"
        en: "The first line contains the label"
      "prints the number 3":
        uk: "Друге значення — число 3"
        en: "The second value is the number 3"
    hints:
      nudge:
        uk: "ФІКСТУРА-НАТЯК-1: подивись на коментар у файлі."
        en: "FIXTURE-HINT-1: look at the comment in the file."
      explanation:
        uk: "ФІКСТУРА-НАТЯК-2: напиши `console.log(label, 3);`."
        en: "FIXTURE-HINT-2: write `console.log(label, 3);`."
    solutionNote:
      uk: "ФІКСТУРА-РОЗВ’ЯЗАННЯ: `console.log` приймає кілька значень через кому."
      en: "FIXTURE-SOLUTION: `console.log` accepts several values separated by commas."
    feedback:
      - when: { test: "prints the label" }
        message:
          uk: "Консоль не показала назву. Передай `label` у `console.log`."
          en: "The console did not show the label. Pass `label` to `console.log`."
      - when: { test: "prints the number 3" }
        message:
          uk: "Друге значення має бути числом `3`, без лапок."
          en: "The second value must be the number `3`, without quotes."

  - id: basics-transfer
    kind: transfer
    capstoneStep: JS-01
    body:
      uk: "Застосуй це у своєму проєкті."
      en: "Apply this in your project."
