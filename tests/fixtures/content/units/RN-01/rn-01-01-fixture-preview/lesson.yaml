# Fixture lesson for the end-to-end suite (synthetic): React Native components in the labeled
# browser preview (concept-preview, react-native-web). Pages: [intro, prediction, example] ·
# [exercise] · [transfer]. Both workspace blocks carry `limits` (no native verification).
id: rn-01-01-fixture-preview
unit: RN-01
title:
  uk: "Фікстура: перегляд React Native"
  en: "Fixture: React Native preview"
kind: instructional
minutes: 8
contentVersion: 1
objectives:
  - uk: "Змінити компонент React Native і побачити результат у перегляді в браузері."
    en: "Change a React Native component and see the result in the browser preview."
prerequisites: []
subskills: []
selfCheck: [rn-what-preview-proves, rn-habit-row]

blocks:
  - id: rn-intro
    kind: explanation
    title:
      uk: "Компоненти React Native у браузері"
      en: "React Native components in the browser"
    body:
      uk: "React Native описує інтерфейс компонентами `View`, `Text` і `Pressable`. У курсі перегляд у браузері (react-native-web) показує, як такий компонент реагує на дії. Справжній native-результат видно лише на емуляторі чи телефоні."
      en: "React Native describes the interface with components such as `View`, `Text` and `Pressable`. In the course a browser preview (react-native-web) shows how such a component reacts to actions. The real native result is visible only on an emulator or a phone."

  - id: rn-what-preview-proves
    kind: prediction
    prompt:
      uk: "Що може підтвердити перегляд у браузері?"
      en: "What can the browser preview confirm?"
    answer:
      type: choice
      options:
        - id: logic
          text:
            uk: "Що логіка компонента реагує на натискання"
            en: "That the component's logic reacts to a press"
        - id: looks
          text:
            uk: "Що на телефоні застосунок виглядає й працює так само швидко"
            en: "That the app looks and performs the same on a phone"
          why:
            uk: "Перегляд малює компоненти засобами браузера: native-рендеринг і продуктивність телефона він не показує."
            en: "The preview draws the components with the browser: it shows neither native rendering nor phone performance."
        - id: camera
          text:
            uk: "Що працює дозвіл на камеру"
            en: "That the camera permission works"
          why:
            uk: "API пристрою в перегляді немає: їх перевіряють на емуляторі чи телефоні."
            en: "The preview has no device APIs: they are checked on an emulator or a phone."
      correct: [logic]
    explanation:
      uk: "Перегляд виконує справжній код компонента, тож логіку стану видно. Native-рендеринг, API пристрою й продуктивність перевіряють локально."
      en: "The preview runs the component's real code, so state logic is visible. Native rendering, device APIs and performance are checked locally."

  - id: rn-card
    kind: example
    runtime: concept-preview
    dir: rn-card
    entry: main.jsx
    strings:
      title: { uk: "Ранкова пробіжка", en: "Morning run" }
      like: { uk: "Подобається", en: "Likes" }
    title:
      uk: "Картка з кнопкою"
      en: "A card with a button"
    body:
      uk: "Натисни **Запустити** й натискай кнопку в перегляді."
      en: "Press **Run** and press the button in the preview."
    tryIt:
      uk: "Зміни колір кнопки в `styles` і запусти знову."
      en: "Change the button colour in `styles` and run again."
    limits:
      uk: "Це перегляд у браузері через react-native-web, а не native-застосунок: немає native-рендерингу, API пристрою (камера, сповіщення, сховище), жестів і продуктивності телефона. Результат тут не є перевіркою на пристрої — її роблять локально на емуляторі чи телефоні."
      en: "This is a browser preview through react-native-web, not a native app: no native rendering, no device APIs (camera, notifications, storage), and no phone gestures or performance. A result here is not a device check — that is done locally on an emulator or a phone."

  - id: rn-habit-row
    kind: exercise
    mode: guided
    runtime: concept-preview
    dir: rn-habit-row
    entry: main.jsx
    editable: [HabitRow.jsx]
    strings:
      habit: { uk: "Пити воду", en: "Drink water" }
      done: { uk: "Виконано", en: "Done" }
    title:
      uk: "Лічильник звички"
      en: "A habit counter"
    instructions:
      uk: "У `HabitRow.jsx` зроби так, щоб кожне натискання кнопки додавало 1 до `count`."
      en: "In `HabitRow.jsx` make every press of the button add 1 to `count`."
    limits:
      uk: "Перевірки натискають кнопку в перегляді react-native-web. Вони не доводять, що рядок так само працює на телефоні."
      en: "The checks press the button in the react-native-web preview. They do not prove that the row works the same on a phone."
    testTitles:
      "each press adds one":
        uk: "Кожне натискання додає 1"
        en: "Each press adds one"
      "the habit name is a heading":
        uk: "Назва звички — заголовок"
        en: "The habit name is a heading"
    hints:
      nudge:
        uk: "Що зараз робить `onPress`?"
        en: "What does `onPress` do now?"
      explanation:
        uk: "Новий стан задає функція `setCount`. Щоб збільшити значення, передай їй число, на одиницю більше за поточне."
        en: "The function `setCount` sets the new state. To increase the value, pass it a number one bigger than the current one."
    solutionNote:
      uk: "`onPress` викликає `setCount(count + 1)`, і React Native-компонент малюється знову з новим числом."
      en: "`onPress` calls `setCount(count + 1)`, and the React Native component renders again with the new number."
    feedback:
      - when: { test: "each press adds one" }
        message:
          uk: "Після двох натискань кнопка має показувати 2. Перевір, що `onPress` щоразу збільшує `count`."
          en: "After two presses the button must show 2. Check that `onPress` increases `count` every time."

  - id: rn-transfer
    kind: transfer
    capstoneStep: RN-01
    body:
      uk: "Застосуй це у своєму проєкті (фікстура)."
      en: "Apply this in your project (fixture)."
