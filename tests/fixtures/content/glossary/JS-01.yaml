# Fixture glossary terms (synthetic definitions for the end-to-end suite).
- id: statement
  term: statement
  name: { uk: "інструкція", en: "statement" }
  definition:
    uk: "Один крок програми. Інструкції виконуються по черзі, згори донизу."
    en: "One step of a program. Statements run one after another, top to bottom."
  see: [output]
- id: output
  term: output
  name: { uk: "вивід", en: "output" }
  definition:
    uk: "Те, що програма показує, наприклад рядки в консолі."
    en: "What a program shows, for example lines in the console."
  example:
    code: "console.log(1 + 1); // output: 2"
  aliases: ["print", "виведення"]
- id: loop
  term: loop
  name: { uk: "цикл", en: "loop" }
  definition:
    uk: "Інструкція, що повторює тіло, доки умова істинна."
    en: "A statement that repeats its body while a condition is true."
