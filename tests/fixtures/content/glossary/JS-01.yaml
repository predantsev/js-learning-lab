# Fixture glossary terms (synthetic definitions for the end-to-end suite).
- id: statement
  term: statement
  name: { uk: "інструкція", en: "statement" }
  definition:
    uk: "Один крок програми. Інструкції виконуються по черзі, згори донизу."
    en: "One step of a program. Statements run one after another, top to bottom."
  see: [output]
- id: output
  term: output
  name: { uk: "вивід", en: "output" }
  definition:
    uk: "Те, що програма показує, наприклад рядки в консолі."
    en: "What a program shows, for example lines in the console."
  example:
    code: "console.log(1 + 1); // output: 2"
  aliases: ["print", "виведення"]
- id: loop
  term: loop
  name: { uk: "цикл", en: "loop" }
  definition:
    uk: "Інструкція, що повторює тіло, доки умова істинна."
    en: "A statement that repeats its body while a condition is true."
# Filler terms so the glossary page is longer than one screen (deep-link scrolling is tested).
- id: array
  term: array
  name: { uk: "масив", en: "array" }
  definition: { uk: "Упорядкований список значень.", en: "An ordered list of values." }
- id: boolean
  term: boolean
  name: { uk: "логічне значення", en: "boolean" }
  definition: { uk: "Значення true або false.", en: "The value true or false." }
- id: function
  term: function
  name: { uk: "функція", en: "function" }
  definition: { uk: "Іменований блок коду, який можна викликати.", en: "A named block of code that can be called." }
- id: number
  term: number
  name: { uk: "число", en: "number" }
  definition: { uk: "Значення для обчислень, наприклад 3 або 2.5.", en: "A value for calculations, such as 3 or 2.5." }
- id: object
  term: object
  name: { uk: "об’єкт", en: "object" }
  definition: { uk: "Набір пар «ключ — значення».", en: "A collection of key–value pairs." }
- id: string
  term: string
  name: { uk: "рядок", en: "string" }
  definition: { uk: "Текст у лапках.", en: "Text in quotes." }
- id: variable
  term: variable
  name: { uk: "змінна", en: "variable" }
  definition: { uk: "Ім’я, під яким програма зберігає значення.", en: "A name under which a program keeps a value." }
- id: zebra-term
  term: zebra term
  name: { uk: "останній термін", en: "last term" }
  definition: { uk: "ФІКСТУРА: останній термін у списку.", en: "FIXTURE: the last term in the list." }
